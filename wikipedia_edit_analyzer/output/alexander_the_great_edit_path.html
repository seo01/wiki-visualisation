ero\u003eT:mA-a\u003c\u002fhiero\u003e}} |nebty={{ubl|{{transliteration|egy|m\ua723j wr-p\u1e25ty j\u1e6f \u1e0fww t\ua723w \u1e2b\ua723swt}}|{{transliteration|egy|Mai werpehty itj dju tau khasut}}|The lion, great of might, who takes possession of mountains, lands, and deserts}} |nebty_hiero=\u003chiero\u003eE23-wr:r-F9:F9-V15-N25:N25:N33-N17:N17:N33-N25:N25:N33\u003c\u002fhiero\u003e |golden={{ubl|{{transliteration|egy|k\ua723 (n\u1e2bt) \u1e2bwj b\ua723\u1e33(t) \u1e25\u1e33\ua723 w\ua723\u1e0f(-wr) \u0161nw n jtn}}|{{transliteration|egy|Ka (nakht) khui baq(et) heqa wadj(wer) shenu en Aten}}|The (strong) bull who protects Egypt, the ruler of the sea and of what the sun encircles}} |golden_hiero=\u003chiero\u003eE1:n-i-w*x-D40-q:t-b-\u003c\u002fhiero\u003e{{pb}}\u003chiero\u003eD10-HqA-M14-N35A-V9:Z1-i-t:n:HASH\u003c\u002fhiero\u003e |prenomen={{ubl|{{transliteration|egy|stp.n-r\ua725 mrj-jmn}}|{{transliteration|egy|Setepenre meryamun}}|Chosen by Ra, beloved by Amun{{pb}}{{Infobox pharaoh\u002fPrenomen |Prenomen=\u003chiero\u003eC2\\-C12-stp:n:N36\u003c\u002fhiero\u003e}}{{pb}}{{Infobox pharaoh\u002fPrenomen |Prenomen=\u003chiero\u003emr\\-C12\\-C2-stp:n\u003c\u002fhiero\u003e}}}}}}\u003cbr\u003e | succession4  = [[King of Persia]]\u003cbr\u003e | reign4       = 330\u2013323 BC\u003cbr\u003e | predecessor4 = Darius III","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -813,7 +813,13 @@\u003cbr\u003e According to [[Josephus]], Alexander was shown the [[Book of Daniel]] when he entered Jerusalem, which described a mighty Greek king who would conquer the Persian Empire. This is cited as a reason for sparing Jerusalem.\u003cref\u003eJosephus, [[Jewish Antiquities]], XI, 337 [http:\u002f\u002flexundria.com\u002fj_aj\u002f11.304-12.0\u002fwst viii, 5]\u003c\u002fref\u003e\u003cbr\u003e [[File:Alexander the Great conquering the air.jpg|thumb|left|Alexander conquering the air. [[Jean Wauquelin]], ''Les faits et conqu\u00eates d'Alexandre le Grand'', 1448\u20131449]]\u003cbr\u003e \u003cbr\u003e-In [[Hindi]] and [[Urdu]], the name \"[[Iskandar (name)|Sikandar]]\", derived from the Persian name for Alexander, denotes a rising young talent, and the [[Delhi Sultanate]] ruler [[Alauddin Khalji]] stylized himself as \"Sikandar-i-Sani\" (the Second Alexander the Great).\u003cref\u003e{{harvnb|Connerney|2009|p=68}}\u003c\u002fref\u003e In [[medieval India]], Turkic and Afghan sovereigns from the Iranian-cultured region of Central Asia brought positive cultural connotations of Alexander to the Indian subcontinent, resulting in the efflorescence of ''Sikandernameh'' ([[Alexander Romances]]) written by Indo-Persian poets such as [[Amir Khusrau]] and the prominence of Alexander the Great as a popular subject in Mughal-era Persian miniatures.\u003cref\u003e{{Cite journal |last=Donde |first=Dipanwita |date=2014 |title=The Mughal Sikander: Influence of the Romance of Alexander on Mughal Manuscript Painting |url=https:\u002f\u002fwww.academia.edu\u002f6097802 |journal=International Conference of Greek Studies: An Asian Perspective |via=Academia |access-date=19 April 2019 |archive-date=12 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210812151906\u002fhttps:\u002f\u002fwww.academia.edu\u002f6097802 |url-status=live }}\u003c\u002fref\u003e In [[medieval Europe]], Alexander the Great was revered as a member of the [[Nine Worthies]]; a group of heroes whose lives were believed to encapsulate all the ideal qualities of [[chivalry]].\u003cref\u003e{{cite book |last1=Noll |first1=Thomas |article=The Visual Image of Alexander the Great |title=Alexander the Great in the Middle Ages: Transcultural Perspectives |editor-last=Stock |editor-first=Markus |translator-last=Boettcher |translator-first=Susan |date=2016 |publisher=University of Toronto Press |location=Toronto |isbn=978-1-4426-4466-3 |page=258 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2nqMCwAAQBAJ&pg=PA258 |access-date=21 November 2017}}\u003c\u002fref\u003e During the first [[Italian campaigns of the French Revolutionary Wars|Italian campaign of the French Revolutionary Wars]], in a question from [[Bourrienne]], asking whether he gave his preference to Alexander or Caesar, [[Napoleon]] said that he places Alexander The Great in the first rank, the main reason being his campaign on Asia.\u003cref\u003eLouis Antoine Fauvelet de Bourrienne, Memoirs of Napoleon Bonaparte, pp 158\u003c\u002fref\u003e\u003cbr\u003e+In [[Hindi]] and [[Urdu]], the name \"[[Iskandar (name)|Sikandar]]\", derived from the Persian name for Alexander, denotes a rising young talent, and the [[Delhi Sultanate]] ruler [[Alauddin Khalji]] stylized himself as \"Sikandar-i-Sani\" (the Second Alexander the Great).\u003cref\u003e{{harvnb|Connerney|2009|p=68}}\u003c\u002fref\u003e In [[medieval India]], Turkic and Afghan sovereigns from the Iranian-cultured region of Central Asia brought positive cultural connotations of Alexander to the Indian subcontinent, resulting in the efflorescence of ''Sikandernameh'' ([[Alexander Romances]]) written by Indo-Persian poets such as [[Amir Khusrau]] and the prominence of Alexander the Great as a popular subject in Mughal-era Persian miniatures.\u003cref\u003e{{Cite journal |last=Donde |first=Dipanwita |date=2014 |title=The Mughal Sikander: Influence of the Romance of Alexander on Mughal Manuscript Painting |url=https:\u002f\u002fwww.academia.edu\u002f6097802 |journal=International Conference of Greek Studies: An Asian Perspective |via=Academia |access-date=19 April 2019 |archive-date=12 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210812151906\u002fhttps:\u002f\u002fwww.academia.edu\u002f6097802 |url-status=live }}\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+In ancient China, Alexander the Great morphed into the legendary ruler \u865e\u821c(modern pronunciation: Yu-shun). This name shares the same etymological origin as Alexander\u2019s alternative names in Central and Western Asia, such as: Eskandar, Eskinder, Iskandar and Iskander.\u003cbr\u003e+\u003cbr\u003e+Alexander\u2019s Greek name \u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2 was also transliterated into Chinese. However it was misinterpreted as \u865e\u821c(m.p.: Yu-shun)\u2019s career path. One of them was: farming in Li mountain, making pottery by the river; in Chinese \u8015\u5386\u5c71\u9676\u6cb3\u6ee8(m.p.: geng-li-shan-tao-he-bin). The other one was: fishing in Lei swamp , making tools; in Chinese \u6e14\u96f7\u6cfd\u4f5c\u4ec0\u5668(m.p.: yu-lei-ze-zuo-shi-qi) . They both originated from the Chinese transliterations of Alexander\u2019s Greek name \u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2.\u003cbr\u003e+\u003cbr\u003e+In [[medieval Europe]], Alexander the Great was revered as a member of the [[Nine Worthies]]; a group of heroes whose lives were believed to encapsulate all the ideal qualities of [[chivalry]].\u003cref\u003e{{cite book |last1=Noll |first1=Thomas |article=The Visual Image of Alexander the Great |title=Alexander the Great in the Middle Ages: Transcultural Perspectives |editor-last=Stock |editor-first=Markus |translator-last=Boettcher |translator-first=Susan |date=2016 |publisher=University of Toronto Press |location=Toronto |isbn=978-1-4426-4466-3 |page=258 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2nqMCwAAQBAJ&pg=PA258 |access-date=21 November 2017}}\u003c\u002fref\u003e During the first [[Italian campaigns of the French Revolutionary Wars|Italian campaign of the French Revolutionary Wars]], in a question from [[Bourrienne]], asking whether he gave his preference to Alexander or Caesar, [[Napoleon]] said that he places Alexander The Great in the first rank, the main reason being his campaign on Asia.\u003cref\u003eLouis Antoine Fauvelet de Bourrienne, Memoirs of Napoleon Bonaparte, pp 158\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the ''[[Greek Anthology]]'', there are poems referring to Alexander.\ st1=Noll |first1=Thomas |article=The Visual Image of Alexander the Great |title=Alexander the Great in the Middle Ages: Transcultural Perspectives |editor-last=Stock |editor-first=Markus |translator-last=Boettcher |translator-first=Susan |date=2016 |publisher=University of Toronto Press |location=Toronto |isbn=978-1-4426-4466-3 |page=258 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2nqMCwAAQBAJ&pg=PA258 |access-date=21 November 2017}}\u003c\u002fref\u003e During the first [[Italian campaigns of the French Revolutionary Wars|Italian campaign of the French Revolutionary Wars]], in a question from [[Bourrienne]], asking whether he gave his preference to Alexander or Caesar, [[Napoleon]] said that he places Alexander The Great in the first rank, the main reason being his campaign on Asia.\u003cref\u003eLouis Antoine Fauvelet de Bourrienne, Memoirs of Napoleon Bonaparte, pp 158\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the ''[[Greek Anthology]]'', there are poems referring to Alexander.\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022239\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f748#122|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022206\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f748#122|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 64\u003cbr\u003e+++ Revision 65\u003cbr\u003e@@ -53,7 +53,7 @@\u003cbr\u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e+'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Until the age of 16, Alexander was tutored by [[Aristotle]]. In 335 BC, shortly after his assumption of kingship over Macedon, he [[Alexander's Balkan campaign|campaigned in the Balkans]] and reasserted control over [[Thrace]] and parts of [[Illyria]] before marching on the city of [[Thebes, Greece|Thebes]], which was [[Battle of Thebes|subsequently destroyed in battle]]. Alexander then led the [[League of Corinth]], and used his authority to launch the [[Greek nationalism#History|pan-Hellenic project]] envisaged by his father, assuming leadership over all [[Greeks]] in their conquest of [[Greater Iran|Persia]].{{sfn|Heckel|Tritle|2009|p=99}}\u003cref\u003e{{cite book |last1=Burger |first1=Michael |title=The Shaping of Western Civilization: From Antiquity to the Enlightenment |date=2008 |publisher=University of Toronto Press |isbn=978-1-55111-432-3 |page=76}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 65\u003cbr\u003e+++ Revision 66\u003cbr\u003e@@ -447,6 +447,10 @@\u003cbr\u003e At Issus in 333 BC, his first confrontation with Darius, he used the same deployment, and again the central phalanx pushed through.{{sfn|Morkot|1996|p=122}} Alexander personally led the charge in the center, routing the opposing army.{{sfn|Roisman|Worthington|2010|p=193}} At the decisive encounter with Darius at Gaugamela, Darius equipped his chariots with scythes on the wheels to break up the phalanx and equipped his cavalry with pikes. Alexander arranged a double phalanx, with the center advancing at an angle, parting when the chariots bore down and then reforming. The advance was successful and broke Darius's center, causing the latter to flee once again.{{sfn|Morkot|1996|p=122}}\u003cbr\u003e \u003cbr\u003e When faced with opponents who used unfamiliar fighting techniques, such as in Central Asia and India, Alexander adapted his forces to his opponents' style. Thus, in [[Bactria]] and [[Sogdiana]], Alexander successfully used his javelin throwers and archers to prevent outflanking movements, while massing his cavalry at the center.{{sfn|Roisman|Worthington|2010|p=193}} In India, confronted by Porus's elephant corps, the Macedonians opened their ranks to envelop the elephants and used their sarissas to strike upwards and dislodge the elephants' handlers.\u003cref name = \"Roisman 2010 194\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==Strategy==\u003cbr\u003e+{{Main|Military tactics of Alexander the Great#Grand strategy}}\u003cbr\u003e+Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his seminal book ''Strategy'', [[Soviet Union|Soviet]] military officer and theorist [[Alexander Svechin]] delineates the Macedonian's strategic steps. After securing his Greek base by subjugating all remaining Greek states, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, then and only then, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander] |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Physical appearance===\u003cbr\u003e ","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -143,6 +143,9 @@\u003cbr\u003e ==Conquest of the Achaemenid Persian Empire==\u003cbr\u003e {{Main|Wars of Alexander the Great|Chronology of the expedition of Alexander the Great into Asia}}\u003cbr\u003e \u003cbr\u003e+===Strategy===\u003cbr\u003e+{{Main|Military tactics of Alexander the Great#Grand strategy}}\u003cbr\u003e+Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his seminal book ''Strategy'', [[Soviet Union|Soviet]] military officer and theorist [[Alexander Svechin]] delineates the Macedonian's strategic steps. After securing his Greek base by subjugating all remaining Greek states, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, then and only then, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander] |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e ===Asia Minor===\u003cbr\u003e {{Further|Battle of the Granicus|Siege of Halicarnassus|Siege of Miletus}}\u003cbr\u003e \u003cbr\u003e@@ -447,11 +450,6 @@\u003cbr\u003e At Issus in 333 BC, his first confrontation with Darius, he used the same deployment, and again the central phalanx pushed through.{{sfn|Morkot|1996|p=122}} Alexander personally led the charge in the center, routing the opposing army.{{sfn|Roisman|Worthington|2010|p=193}} At the decisive encounter with Darius at Gaugamela, Darius equipped his chariots with scythes on the wheels to break up the phalanx and equipped his cavalry with pikes. Alexander arranged a double phalanx, with the center advancing at an angle, parting when the chariots bore down and then reforming. The advance was successful and broke Darius's center, causing the latter to flee once again.{{sfn|Morkot|1996|p=122}}\u003cbr\u003e \u003cbr\u003e When faced with opponents who used unfamiliar fighting techniques, such as in Central Asia and India, Alexander adapted his forces to his opponents' style. Thus, in [[Bactria]] and [[Sogdiana]], Alexander successfully used his javelin throwers and archers to prevent outflanking movements, while massing his cavalry at the center.{{sfn|Roisman|Worthington|2010|p=193}} In India, confronted by Porus's elephant corps, the Macedonians opened their ranks to envelop the elephants and used their sarissas to strike upwards and dislodge the elephants' handlers.\u003cref name = \"Roisman 2010 194\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-==Strategy==\u003cbr\u003e-{{Main|Military tactics of Alexander the Great#Grand strategy}}\u003cbr\u003e-Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his seminal book ''Strategy'', [[Soviet Union|Soviet]] military officer and theorist [[Alexander Svechin]] delineates the Macedonian's strategic steps. After securing his Greek base by subjugating all remaining Greek states, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, then and only then, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander] |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e ===Physical appearance===\u003cbr\u003e \u003cbr\u003e [[File:AlexanderCameo.JPG|thumb|left|Alexander [[Cameo_(carving)|cameo]] by [[Pyrgoteles]]|upright=.9]]","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -8,7 +8,7 @@\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e-| image        = File:Alexander the Great cropped.png\u003cbr\u003e+| image        = File:Alexander and Bucephalus - Battle of Issus mosaic - Museo Archeologico Nazionale - Naples BW.jpg\u003cbr\u003e | caption      = Alexander in the ''[[Alexander Mosaic]]''\u003cbr\u003e | succession   = [[King of Macedon]]\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -8,7 +8,7 @@\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e-| image        = File:Alexander and Bucephalus - Battle of Issus mosaic - Museo Archeologico Nazionale - Naples BW.jpg\u003cbr\u003e+| image        = Alexander the Great mosaic (cropped).jpg\u003cbr\u003e | caption      = Alexander in the ''[[Alexander Mosaic]]''\u003cbr\u003e | succession   = [[King of Macedon]]\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC\u003cbr\u003e@@ -145,7 +145,8 @@\u003cbr\u003e \u003cbr\u003e ===Strategy===\u003cbr\u003e {{Main|Military tactics of Alexander the Great#Grand strategy}}\u003cbr\u003e-Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his seminal book ''Strategy'', [[Soviet Union|Soviet]] military officer and theorist [[Alexander Svechin]] delineates the Macedonian's strategic steps. After securing his Greek base by subjugating all remaining Greek states, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, then and only then, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander] |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his book ''Strategy'', Soviet military officer and theorist [[Alexander Svechin]] delineates Alexander's strategic steps. After securing his Greek base and the Balkans by subjugating his political opponents, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e ===Asia Minor===\u003cbr\u003e {{Further|Battle of the Granicus|Siege of Halicarnassus|Siege of Miletus}}\u003cbr\u003e ","--- Revision 69\u003cbr\u003e+++ Revision 70\u003cbr\u003e@@ -53,7 +53,7 @@\u003cbr\u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e+'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Al\u00e9xandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Until the age of 16, Alexander was tutored by [[Aristotle]]. In 335 BC, shortly after his assumption of kingship over Macedon, he [[Alexander's Balkan campaign|campaigned in the Balkans]] and reasserted control over [[Thrace]] and parts of [[Illyria]] before marching on the city of [[Thebes, Greece|Thebes]], which was [[Battle of Thebes|subsequently destroyed in battle]]. Alexander then led the [[League of Corinth]], and used his authority to launch the [[Greek nationalism#History|pan-Hellenic project]] envisaged by his father, assuming leadership over all [[Greeks]] in their conquest of [[Greater Iran|Persia]].{{sfn|Heckel|Tritle|2009|p=99}}\u003cref\u003e{{cite book |last1=Burger |first1=Michael |title=The Shaping of Western Civilization: From Antiquity to the Enlightenment |date=2008 |publisher=University of Toronto Press |isbn=978-1-55111-432-3 |page=76}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 70\u003cbr\u003e+++ Revision 71\u003cbr\u003e@@ -395,7 +395,7 @@\u003cbr\u003e On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=Nov 5, 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e Given the propensity of the Macedonian aristocracy to assassination,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e-The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 BBC documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e\u003cbr\u003e+The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 [[BBC]] documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Several [[natural causes]] (diseases) have been suggested, including [[malaria]] and [[typhoid fever]]. A 1998 article in the ''[[New England Journal of Medicine]]'' attributed his death to typhoid fever complicated by [[bowel perforation]] and ascending [[paralysis]].\u003cref name=\"AMD\" \u002f\u003e A 2004 analysis suggested pyogenic (infectious) [[spondylitis]] or [[meningitis]].\u003cref name=\"ashrafian\" \u002f\u003e Other illnesses fit the symptoms, including [[acute pancreatitis]], [[West Nile virus]],\u003cref name=\"ref1\" \u002f\u003e\u003cref\u003e{{cite journal |last=Sbarounis |first=CN |title=Did Alexander the Great die of acute pancreatitis? |journal=J Clin Gastroenterol |volume=24 |pages=294\u201396 |year=2007 |doi=10.1097\u002f00004836-199706000-00031 |pmid=9252868 |issue=4}}\u003c\u002fref\u003e and [[Guillain-Barr\u00e9 syndrome]].\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|title=Why Alexander the Great May Have Been Declared Dead Prematurely (It's Pretty Gruesome)|author=Owen Jarus|website=[[Live Science]]|date=4 February 2019|access-date=3 November 2021|archive-date=27 July 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210727002144\u002fhttps:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|url-status=live}}\u003c\u002fref\u003e Natural-cause theories also tend to emphasize that Alexander's health may have been in general decline after years of heavy drinking and severe wounds. The anguish that Alexander felt after Hephaestion's death may also have contributed to his declining health.\u003cref name=\"AMD\" \u002f\u003e\u003cbr\u003e ","--- Revision 71\u003cbr\u003e+++ Revision 72\u003cbr\u003e@@ -910,8 +910,8 @@\u003cbr\u003e \u003cref name=\"PA45\"\u003e{{harvnb|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0243%3Achapter%3D45 LXV, 1]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cref name=\"Plutarch, Caesar, 11\"\u003e{{harvnb|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0244:chapter=11&highlight=alexander XI, 2]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cref name=\"ref1\"\u003e{{cite journal |last1=Marr |first1=John S|author2-link=Charles Calisher |last2=Calisher |first2=Charles H |year=2003 |title=Alexander the Great and West Nile Virus Encephalitis |journal=Emerging Infectious Diseases |volume=9 |issue=12 |pages=1599\u20131603 |doi=10.3201\u002feid0912.030288 |pmc=3034319 |pmid=14725285}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref name=\"sarco1\"\u003e{{cite web |last=Kosmetatou |first=Elizabeth |title=The Location of the Tomb: Facts and Speculation |year=1998 |publisher=Greece.org |url=http:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002flocation.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20040531025749\u002fhttp:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002flocation.html |archive-date=31 May 2004 |access-date=16 December 2011}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref name=\"sarco2\"\u003e{{cite web |last=Kosmetatou |first=Elizabeth |title=The Aftermath: The Burial of Alexander the Great |year=1998 |publisher=Greece.org |url=http:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002faftermath.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20040827134332\u002fhttp:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002faftermath.html |archive-date=27 August 2004 |access-date=16 December 2011}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=\"sarco1\"\u003e{{cite web |last=Kosmetatou |first=Elizabeth |title=The Location of the Tomb: Facts and Speculation |work=Hellenic Electronic Center |year=1998 |publisher=Greece.org |url=http:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002flocation.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20040531025749\u002fhttp:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002flocation.html |archive-date=31 May 2004 |access-date=16 December 2011}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=\"sarco2\"\u003e{{cite web |last=Kosmetatou |first=Elizabeth |title=The Aftermath: The Burial of Alexander the Great |work=Hellenic Electronic Center |year=1998 |publisher=Greece.org |url=http:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002faftermath.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20040827134332\u002fhttp:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002faftermath.html |archive-date=27 August 2004 |access-date=16 December 2011}}\u003c\u002fref\u003e\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e ===Sources===","--- Revision 72\u003cbr\u003e+++ Revision 73\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{pp-move}}\u003cbr\u003e {{Good article}}\u003cbr\u003e {{Use Oxford spelling|date=September 2020}}\u003cbr\u003e-{{Use dmy dates|date=May 2024}}\u003cbr\u003e+{{Use dmy dates|date=January 2025}}\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e@@ -118,7 +118,7 @@\u003cbr\u003e {{Further|Government of Macedonia (ancient kingdom)}}\u003cbr\u003e [[File:Pausanius assassinates Philip during the procession into the theatre by Andre Castaigne (1898-1899).jpg|thumb|upright=1|Pausanias assassinates Philip II, Alexander's father, during his procession into the theatre]]\u003cbr\u003e \u003cbr\u003e-In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=1992-12-21 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started in 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]].{{Cref2|h}} As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e+In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=21 December 1992 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started in 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]].{{Cref2|h}} As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Consolidation of power===\u003cbr\u003e Alexander began his reign by eliminating potential rivals to the throne. He had his cousin, the former [[Amyntas IV]], executed.{{sfn|Roisman|Worthington|2010|p=190}} He also had two Macedonian princes from the region of [[Lyncestis]] killed for having been involved in his father's assassination, but spared a third, [[Alexander Lyncestes]]. Olympias had Cleopatra Eurydice, and Europa, her daughter by Philip, burned alive. When Alexander learned about this, he was furious. Alexander also ordered the murder of Attalus,{{sfn|Roisman|Worthington|2010|p=190}} who was in command of the advance guard of the army in Asia Minor and Cleopatra's uncle.\u003cref name=\"Green 2007 5\u20136\"\u003e{{harvnb|Green|2007|pp=5\u20136}}\u003c\u002fref\u003e\u003cbr\u003e@@ -392,7 +392,7 @@\u003cbr\u003e {{Main|Death of Alexander the Great}}\u003cbr\u003e [[File:Babylonian astronomical diary recording the death of Alexander the Great (British Museum).jpg|thumb|A [[Babylonian astronomical diary]] (c.&nbsp;323\u2013322&nbsp;BC) recording the death of Alexander ([[British Museum]], London)]]\u003cbr\u003e \u003cbr\u003e-On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=Nov 5, 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e+On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=5 November 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e Given the propensity of the Macedonian aristocracy to assassination,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 [[BBC]] documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e","--- Revision 73\u003cbr\u003e+++ Revision 74\u003cbr\u003e@@ -8,8 +8,8 @@\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e-| image        = Alexander the Great mosaic (cropped).jpg\u003cbr\u003e-| caption      = Alexander in the ''[[Alexander Mosaic]]''\u003cbr\u003e+| image        = Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg\u003cbr\u003e+| caption      = A Roman copy of an original 3rd century BC Greek bust depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen\u003cbr\u003e | succession   = [[King of Macedon]]\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC\u003cbr\u003e | predecessor  = [[Philip II of Macedon|Philip II]]\u003cbr\u003e@@ -476,12 +476,11 @@\u003cbr\u003e \u003cbr\u003e ===Personality===\u003cbr\u003e [[File:Lion hunt mosaic from Pella.jpg|thumb|Alexander (left), wearing a ''[[kausia]]'' and fighting an [[Asiatic lion]] with his friend [[Craterus]] (detail); late 4th century BC [[mosaic]],\u003cref\u003e[[Olga Palagia]] (2000). \"Hephaestion's Pyre and the Royal Hunt of Alexander\", in A.B. Bosworth and E.J. Baynham (eds), ''Alexander the Great in Fact and Fiction''. Oxford & New York: Oxford University Press. {{ISBN|978-0-19-815287-3}}, p. 185.\u003c\u002fref\u003e [[Pella]] Museum]]\u003cbr\u003e-\u003cbr\u003e+[[File:Alexander the Great mosaic (cropped).jpg|thumb|Alexander in the ''[[Alexander Mosaic]]'']]\u003cbr\u003e Both of Alexander's parents encouraged his ambitions. His father Philip was probably Alexander's most immediate and influential role model, as the young Alexander watched him campaign practically every year, winning victory after victory while ignoring severe wounds.{{sfn|Roisman|Worthington|2010|p=190}} Alexander's relationship with his father \"forged\" the competitive side of his personality; he had a need to outdo his father, illustrated by his reckless behavior in battle.{{sfn|Green|2007|pp=15\u201316}} While Alexander worried that his father would leave him \"no great or brilliant achievement to be displayed to the world\",\u003cref name=\"PA5\"\u002f\u003e he also downplayed his father's achievements to his companions.{{sfn|Green|2007|pp=15\u201316}} Alexander's mother Olympia similarly had huge ambitions, and encouraged her son to believe it was his destiny to conquer the Persian Empire.{{sfn|Green|2007|pp=15\u201316}} She instilled a sense of destiny in him,{{sfn|Green|2007|p=4}} and Plutarch tells how his ambition \"kept his spirit serious and lofty in advance of his years\".\u003cref name=\"PA4\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e According to Plutarch, Alexander also had a violent temper and rash, impulsive nature,\u003cref name=\"AVII29\"\u002f\u003e which could influence his decision making.{{sfn|Green|2007|pp=15\u201316}} Although Alexander was stubborn and did not respond well to orders from his father, he was open to reasoned debate.\u003cref name=\"PA7\"\u002f\u003e He had a calmer side\u2014perceptive, logical, and calculating. He had a great desire for knowledge, a love for philosophy, and was an avid reader.\u003cref name=\"PA8\"\u002f\u003e This was no doubt in part due to Aristotle's tutelage; Alexander was intelligent and quick to learn.{{sfn|Green|2007|pp=15\u201316}} His intelligent and rational side was amply demonstrated by his ability and success as a general.\u003cref name=\"AVII29\"\u002f\u003e He had great self-restraint in \"pleasures of the body\", in contrast with his lack of [[self-control]] with alcohol.\u003cref name=\"AVII28\"\u003e{{harvnb | Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire after his death\u2014only Alexander had the ability to do so.{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. c.f. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e","--- Revision 74\u003cbr\u003e+++ Revision 75\u003cbr\u003e@@ -8,8 +8,8 @@\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e-| image        = Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg\u003cbr\u003e-| caption      = A Roman copy of an original 3rd century BC Greek bust depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen\u003cbr\u003e+| image        = Alexander the Great mosaic (cropped).jpg\u003cbr\u003e+| caption      = Alexander in the ''[[Alexander Mosaic]]''\u003cbr\u003e | succession   = [[King of Macedon]]\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC\u003cbr\u003e | predecessor  = [[Philip II of Macedon|Philip II]]\u003cbr\u003e@@ -476,11 +476,12 @@\u003cbr\u003e \u003cbr\u003e ===Personality===\u003cbr\u003e [[File:Lion hunt mosaic from Pella.jpg|thumb|Alexander (left), wearing a ''[[kausia]]'' and fighting an [[Asiatic lion]] with his friend [[Craterus]] (detail); late 4th century BC [[mosaic]],\u003cref\u003e[[Olga Palagia]] (2000). \"Hephaestion's Pyre and the Royal Hunt of Alexander\", in A.B. Bosworth and E.J. Baynham (eds), ''Alexander the Great in Fact and Fiction''. Oxford & New York: Oxford University Press. {{ISBN|978-0-19-815287-3}}, p. 185.\u003c\u002fref\u003e [[Pella]] Museum]]\u003cbr\u003e-[[File:Alexander the Great mosaic (cropped).jpg|thumb|Alexander in the ''[[Alexander Mosaic]]'']]\u003cbr\u003e+\u003cbr\u003e Both of Alexander's parents encouraged his ambitions. His father Philip was probably Alexander's most immediate and influential role model, as the young Alexander watched him campaign practically every year, winning victory after victory while ignoring severe wounds.{{sfn|Roisman|Worthington|2010|p=190}} Alexander's relationship with his father \"forged\" the competitive side of his personality; he had a need to outdo his father, illustrated by his reckless behavior in battle.{{sfn|Green|2007|pp=15\u201316}} While Alexander worried that his father would leave him \"no great or brilliant achievement to be displayed to the world\",\u003cref name=\"PA5\"\u002f\u003e he also downplayed his father's achievements to his companions.{{sfn|Green|2007|pp=15\u201316}} Alexander's mother Olympia similarly had huge ambitions, and encouraged her son to believe it was his destiny to conquer the Persian Empire.{{sfn|Green|2007|pp=15\u201316}} She instilled a sense of destiny in him,{{sfn|Green|2007|p=4}} and Plutarch tells how his ambition \"kept his spirit serious and lofty in advance of his years\".\u003cref name=\"PA4\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e According to Plutarch, Alexander also had a violent temper and rash, impulsive nature,\u003cref name=\"AVII29\"\u002f\u003e which could influence his decision making.{{sfn|Green|2007|pp=15\u201316}} Although Alexander was stubborn and did not respond well to orders from his father, he was open to reasoned debate.\u003cref name=\"PA7\"\u002f\u003e He had a calmer side\u2014perceptive, logical, and calculating. He had a great desire for knowledge, a love for philosophy, and was an avid reader.\u003cref name=\"PA8\"\u002f\u003e This was no doubt in part due to Aristotle's tutelage; Alexander was intelligent and quick to learn.{{sfn|Green|2007|pp=15\u201316}} His intelligent and rational side was amply demonstrated by his ability and success as a general.\u003cref name=\"AVII29\"\u002f\u003e He had great self-restraint in \"pleasures of the body\", in contrast with his lack of [[self-control]] with alcohol.\u003cref name=\"AVII28\"\u003e{{harvnb | Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+[[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire {Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -769,7 +769,7 @@\u003cbr\u003e [[File:Roman - Medallion with Alexander the Great - Walters 591 - Obverse.jpg|thumb|This medallion was produced in [[Imperial Rome]], demonstrating the influence of Alexander's memory. [[Walters Art Museum]], [[Baltimore]].]]\u003cbr\u003e Alexander and his exploits were admired by many Romans, especially generals, who wanted to associate themselves with his achievements.\u003cref name=\"Asirvatham\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 114}}\u003c\u002fref\u003e [[Polybius]] began his ''[[Histories (Polybius)|Histories]]'' by reminding Romans of Alexander's achievements, and thereafter Roman leaders saw him as a role model. [[Pompey the Great]] adopted the epithet \"Magnus\" and even Alexander's anastole-type haircut, and searched the conquered lands of the east for Alexander's 260-year-old cloak, which he then wore as a sign of greatness.\u003cref name=\"Asirvatham\" \u002f\u003e [[Julius Caesar]] dedicated a [[Lysippus|Lysippean]] [[equestrian statue|equestrian]] [[bronze]] statue, but replaced Alexander's head with his own, while [[Octavian]] visited Alexander's tomb in Alexandria and temporarily changed his seal from a [[sphinx]] to Alexander's profile.\u003cref name=\"Asirvatham\" \u002f\u003e The emperor [[Trajan]] also admired Alexander, as did [[Nero]] and [[Caracalla]].\u003cref name=\"Asirvatham\" \u002f\u003e
