95912\u002fhttp:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Alexander the Great\"\u002f\u003e Andrew Stewart highlights the fact that artistic portraits, not least because of who they are commissioned by, are always partisan, and that artistic portrayals of Alexander \"seek to legitimize him (or, by extension, his Successors), to interpret him to their audiences, to answer their critiques, and to persuade them of his greatness\", and thus should be considered within a framework of \"praise and blame\", in the same way sources such as praise poetry are.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=69}}\u003c\u002fref\u003e Nevertheless, though idealised, Lysippos's sculpture was thought to be the most faithful [[Plastic arts|plastic]] representation.{{Sfn |Bosworth|1988|pp = 19\u201320}}\u003cbr\u003e+Historical sources frequently give conflicting accounts of Alexander's appearance, and the earliest sources are the most scant in their detail.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=72}}\u003c\u002fref\u003e During his lifetime, Alexander carefully curated his image by commissioning works from famous and great artists of the time. This included commissioning sculptures by [[Lysippos]], paintings by [[Apelles]] and gem engravings by [[Pyrgoteles]].\u003cref name=\"Alexander the Great\"\u003e{{cite book |last1=Nawotka |first1=Krzysztof |title=Alexander the Great |date=2010 |publisher=Cambridge Scholars Publishing |page=43}}\u003c\u002fref\u003e Ancient authors recorded that Alexander was so pleased with portraits of himself created by Lysippos that he forbade other sculptors from crafting his image; scholars today, however, find the claim dubious.\u003cref\u003e{{cite web |title=Images of Authority II: The Greek Example |year=2005 |publisher=SUNY Oneonta |url=http:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |access-date=16 December 2011 |archive-date=4 October 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20181004195912\u002fhttp:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Alexander the Great\"\u002f\u003e Nevertheless, Andrew Stewart highlights the fact that artistic portraits, not least because of who they are commissioned by, are always partisan, and that artistic portrayals of Alexander \"seek to legitimize him (or, by extension, his Successors), to interpret him to their audiences, to answer their critiques, and to persuade them of his greatness\", and thus should be considered within a framework of \"praise and blame\", in the same way sources such as praise poetry are.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=69}}\u003c\u002fref\u003e Despite those caveats, Lysippos's sculpture, famous for its naturalism, as opposed to a stiffer, more static pose, is thought to be the most faithful depiction.{{Sfn |Bosworth|1988|pp = 19\u201320}}\u003cbr\u003e \u003cbr\u003e [[Quintus Curtius Rufus|Curtius Rufus]], a Roman historian from the first century AD, who wrote the ''[[Histories of Alexander the Great]]'', gives this account of Alexander sitting on the throne of [[Darius III]]:\u003cbr\u003e \u003cbr\u003e {{blockquote|Then Alexander seating himself on the royal throne, which was far too high for his bodily stature. Therefore, since his feet did not reach its lowest step, one of the royal pages placed a table under his feet.{{sfn |Rolfe |1946 |loc = 5.2.13}}}}\u003cbr\u003e \u003cbr\u003e-Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003e{{cite book |last1=Skelton |first1=Debra |last2=Dell |first2=Pamela |title=Empire of Alexander the Great |date=2009 |publisher=Infobase Publishing |isbn=978-1-60413-162-8 |page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=QcJuRH89a8UC&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83 |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more handsome of the two.\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander-lysippus1-1.jpg|thumb|Roman copy of the Alexander portrait by [[Lysippos]]|left|upright]]\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:\u003cbr\u003e {{blockquote|The outward appearance of Alexander is best represented by the statues of him which Lysippus made, and it was by this artist alone that Alexander himself thought it fit that he should be modelled. For those peculiarities which many of his successors and friends afterwards tried to imitate, namely, the poise of the neck, which was bent slightly to the left, and the melting glance of his eyes, this artist has accurately observed. Apelles, however, in painting him as wielder of the thunder-bolt, did not reproduce his complexion, but made it too dark and swarthy. Whereas he was of a fair colour, as they say, and his fairness passed into ruddiness on his breast particularly, and in his face. Moreover, that a very pleasant odour exhaled from his skin and that there was a fragrance about his mouth and all his flesh, so that his garments were filled with it, this we have read in the ''Memoirs of Aristoxenus''.{{Sfn |Plutarch|1919|loc = [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0243:chapter=4&highlight=lysippus IV, 1]}}}}\u003cbr\u003e \u003cbr\u003e-[[File:ACMA 1331 Alexander 2.JPG|thumb|right|alt=A bust of Alexander the Great by Leochares|Head of Alexander the Great, by Leochares, ca. 330 BC]]\u003cbr\u003e-\u003cbr\u003e Historians have understood the detail of the pleasant fragrance attributed to Alexander as stemming from a belief in ancient Greece that pleasant scents are characteristic of gods and heroes.\u003cref name=\"Alexander the Great\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e [[File:Detail of fresco depicting Alexander the Great.jpg|thumb|right|A fresco depicting a hunt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e@@ -480,14 +479,14 @@\u003cbr\u003e [[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire after his death\u2014only Alexander had the ability to do so.{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e-During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. cf. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-He appears to have believed himself a deity, or at least sought to deify himself.{{sfn|Green|2007|pp=23\u201324}} Olympias always insisted to him that he was the son of Zeus,\u003cref name=\"PA3\" \u002f\u003e an idea apparently confirmed to him by the oracle of Amun at [[Siwa Oasis|Siwa]].\u003cref name=\"P27\"\u002f\u003e He began to identify himself as the son of Zeus-Ammon.\u003cref name=\"P27\"\u002f\u003e Alexander adopted elements of Persian dress and customs at court, notably ''[[proskynesis]]'', which was one aspect of Alexander's broad strategy aimed at securing the aid and support of the Iranian upper classes;{{sfn|Briant|1985|pages=827\u2013830}} however the practise of ''proskynesis'' was disapproved by the Macedonians, and they were unwilling to perform it.\u003cref name=\"AVII11\"\u002f\u003e This behaviour cost him the sympathies of many of his countrymen.\u003cref name=\"PA45\"\u002f\u003e Alexander also was a pragmatic ruler who understood the difficulties of ruling culturally disparate peoples, many of whom lived in societies where the king was treated as divine.\u003cref\u003e{{harvnb|Morkot|1996|p=111}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e Thus, rather than megalomania, his behaviour may have been a practical attempt at strengthening his rule and keeping his empire together.\u003cref\u003e{{harvnb|Morkot|1996|p=121}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e\u003cbr\u003e+During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. c.f. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+He appears to have believed himself a deity, or at least sought to deify himself.{{sfn|Green|2007|pp=23\u201324}} Olympias always insisted to him that he was the son of Zeus,\u003cref name=\"PA3\" \u002f\u003e a theory apparently confirmed to him by the oracle of Amun at [[Siwa Oasis|Siwa]].\u003cref name=\"P27\"\u002f\u003e He began to identify himself as the son of Zeus-Ammon.\u003cref name=\"P27\"\u002f\u003e Alexander adopted elements of Persian dress and customs at court, notably ''[[proskynesis]]'', which was one aspect of Alexander's broad strategy aimed at securing the aid and support of the Iranian upper classes;{{sfn|Briant|1985|pages=827\u2013830}} however the practise of ''proskynesis'' was disapproved by the Macedonians, and they were unwilling to perform it.\u003cref name=\"AVII11\"\u002f\u003e This behaviour cost him the sympathies of many of his countrymen.\u003cref name=\"PA45\"\u002f\u003e Alexander also was a pragmatic ruler who understood the difficulties of ruling culturally disparate peoples, many of whom lived in societies where the king was treated as divine.\u003cref\u003e{{harvnb|Morkot|1996|p=111}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e Thus, rather than megalomania, his behaviour may have been a practical attempt at strengthening his rule and keeping his empire together.\u003cref\u003e{{harvnb|Morkot|1996|p=121}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Personal relationships===\u003cbr\u003e {{Main |Personal relationships of Alexander the Great}}\u003cbr\u003e [[File:Marriage of Alexander and Statira as Ares and Aphrodite, fresco, ca. 69 d. C., copy after Aetion. Antiquarim, Pompeii.jpg|thumb|A mural in [[Pompeii]], depicting the marriage of Alexander to [[Stateira (wife of Alexander the Great)|Stateira]] in 324 BC; the couple is apparently dressed as [[Ares]] and [[Aphrodite]].]]\u003cbr\u003e-Alexander married three times: [[Roxana]], daughter of the [[Sogdia]]n nobleman [[Oxyartes]] of [[Bactria]],\u003cref\u003eAhmed, S. Z. (2004), ''Chaghatai: the Fabulous Cities and People of the Silk Road'', West Conshokoken: Infinity Publishing, p. 61.\u003c\u002fref\u003e\u003cref\u003eStrachan, Edward and Roy Bolton (2008), ''Russia and Europe in the Nineteenth Century'', London: Sphinx Fine Art, p. 87, {{ISBN|978-1-907200-02-1}}.\u003c\u002fref\u003e\u003cref\u003eLivius.org. \"[https:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f Roxane] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414100829\u002fhttps:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f |date=14 April 2021}}.\" ''Articles on Ancient History''. Retrieved on 30 August 2016.\u003c\u002fref\u003e out of love;{{Sfn|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0243%3Achapter%3D47 LXVII, 1]}} and the Persian princesses [[Stateira (wife of Alexander the Great)|Stateira]] and [[Parysatis II|Parysatis]], the former a daughter of [[Darius III]] and the latter a daughter of [[Artaxerxes III]], for political reasons.\u003cref name=\"Carney\"\u003e{{cite book |last=Carney |first=Elizabeth Donnelly |title=Women and Monarchy in Macedonia |date=2000 |publisher=University of Oklahoma Press |location=Norman |isbn=978-0-8061-3212-9}}\u003c\u002fref\u003e{{Sfn |Plutarch|1936|loc= [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fPlutarch\u002fMoralia\u002fFortuna_Alexandri*\u002f2.html II, 6]}} Alexander apparently had two children by Roxana: an unnamed first child, who was born in India and died in infancy in November 326 BC,\u003cref\u003eMetz Epitome 70\u003cbr\u003e+Alexander married three times: [[Roxana]], daughter of the [[Sogdia]]n nobleman [[Oxyartes]] of [[Bactria]],\u003cref\u003eAhmed, S. Z. (2004), ''Chaghatai: the Fabulous Cities and People of the Silk Road'', West Conshokoken: Infinity Publishing, p. 61.\u003c\u002fref\u003e\u003cref\u003eStrachan, Edward and Roy Bolton (2008), ''Russia and Europe in the Nineteenth Century'', London: Sphinx Fine Art, p. 87, {{ISBN|978-1-907200-02-1}}.\u003c\u002fref\u003e\u003cref\u003eLivius.org. \"[https:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f Roxane] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414100829\u002fhttps:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f |date=14 April 2021}}.\" ''Articles on Ancient History''. Retrieved on 30 August 2016.\u003c\u002fref\u003e out of love;{{Sfn|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0243%3Achapter%3D47 LXVII, 1]}} and the Persian princesses [[Stateira (wife of Alexander the Great)|Stateira]] and [[Parysatis II|Parysatis]], the former a daughter of [[Darius III]] and the latter a daughter of [[Artaxerxes III]], for political reasons.\u003cref name=\"Carney\"\u003e{{cite book |last=Carney |first=Elizabeth Donnelly |title=Women and Monarchy in Macedonia |date=2000 |publisher=University of Oklahoma Press |location=Norman |isbn=978-0-8061-3212-9}}\u003c\u002fref\u003e{{Sfn |Plutarch|1936|loc= [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fPlutarch\u002fMoralia\u002fFortuna_Alexandri*\u002f2.html II, 6]}} Alexander apparently had two children by Roxana: unnamed first child, who was born in India and died in infancy in November 326 BC,\u003cref\u003eMetz Epitome 70\u003cbr\u003e \u003cbr\u003e \u003c\u002fref\u003e and [[Alexander IV of Macedon]], born after his father's death. Additionally [[Heracles of Macedon]] was claimed to be his illegitimate son born of mistress, [[Barsine]]. \u003cbr\u003e \u003cbr\u003e@@ -495,11 +494,11 @@\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn's arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e At the same time, ancient writers did not conclusively identify them as lovers.\u003cref\u003e{{Citation |last=Palagia |first=Olga |title=Hephaestion's Pyre and the Royal Hunt of Alexander |date=2000-09-07 |work=Alexander the Great in Fact and Fiction |pages=167\u2013206 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002facprof:oso\u002f9780198152873.003.0006 |access-date=2025-03-06 |publisher=Oxford University Press |doi=10.1093\u002facprof:oso\u002f9780198152873.003.0006 |isbn=978-0-19-815287-3}}\u003c\u002fref\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander and Hephaestion.jpg|thumb|Alexander and his general [[Hephaestion]], at the [[Getty Villa]]|left]]\u003cbr\u003e \u003cbr\u003e-[[Peter Green (historian)|Peter Green]] argues that there is little evidence in ancient sources that Alexander had much sexual interest in women; he did not produce an heir until the very end of his life.{{sfn|Green|2007|pp=15\u201316}} However, Ogden calculates that Alexander, who impregnated his partners three times in eight years, had fathered more children than his father at the same age.{{sfn|Ogden|2009|p=208|ps=...&nbsp;three attested pregnancies in eight years produces an attested impregnation rate of one every 2.7&nbsp;years, which is actually superior to that of his father.}} Two of these pregnancies\u2014Stateira's and Barsine's\u2014are of dubious legitimacy.\u003cref\u003e{{cite book |title=[[The Nature of Alexander]] |author=[[Mary Renault]] |quote=No record at all exists of such a woman [ie, Barsine] accompanying his march; nor of any claim by her, or her powerful kin, that she had borne him offspring. Yet twelve years after his death a boy was produced, seventeen years old, born therefore five years after Damascus, her alleged son \"brought up in Pergamon\"; a claimant and shortlived pawn in the succession wars, chosen probably for a physical resemblance to Alexander. That he actually did marry another Barsine must have helped both to launch and preserve the story; but no source reports any notice whatever taken by him of a child who, Roxane's being posthumous, would have been during his lifetime his only son, by a near-royal mother. In a man who named cities after his horse and dog, this strains credulity. |page=110 |year=1979 |publisher=Pantheon |isbn=978-0-394-73825-3}}\u003c\u002fref\u003e\u003cbr\u003e+[[Peter Green (historian)|Peter Green]] argues that there is little evidence in ancient sources that Alexander had much sexual interest in women; he did not produce an heir until the very end of his life.{{sfn|Green|2007|pp=15\u201316}} However, Ogden calculates that Alexander, who impregnated his partners thrice in eight years, had a higher matrimonial record than his father at the same age.{{sfn|Ogden|2009|p=208|ps=...&nbsp;three attested pregnancies in eight years produces an attested impregnation rate of one every 2.7&nbsp;years, which is actually superior to that of his father.}} Two of these pregnancies\u2014Stateira's and Barsine's\u2014are of dubious legitimacy.\u003cref\u003e{{cite book |title=[[The Nature of Alexander]] |author=[[Mary Renault]] |quote=No record at all exists of such a woman [ie, Barsine] accompanying his march; nor of any claim by her, or her powerful kin, that she had borne him offspring. Yet twelve years after his death a boy was produced, seventeen years old, born therefore five years after Damascus, her alleged son \"brought up in Pergamon\"; a claimant and shortlived pawn in the succession wars, chosen probably for a physical resemblance to Alexander. That he actually did marry another Barsine must have helped both to launch and preserve the story; but no source reports any notice whatever taken by him of a child who, Roxane's being posthumous, would have been during his lifetime his only son, by a near-royal mother. In a man who named cities after his horse and dog, this strains credulity. |page=110 |year=1979 |publisher=Pantheon |isbn=978-0-394-73825-3}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e According to Diodorus Siculus, Alexander accumulated a harem in the style of Persian kings, but he used it rather sparingly, \"not wishing to offend the Macedonians\",\u003cref name=\"DSXVII77\" \u002f\u003e showing great self-control in \"pleasures of the body\".\u003cref name=\"AVII28\" \u002f\u003e Nevertheless, Plutarch described how Alexander was infatuated by Roxana while complimenting him on not forcing himself on her.\u003cref\u003e{{cite web |year=1936 |url=https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fPlutarch\u002fMoralia\u002fFortuna_Alexandri*\u002f2.html |author=Plutarch |title=Moralia |id=I, 11 |publisher=University of Chicago |ref=none |access-date=19 February 2021}}\u003c\u002fref\u003e Green suggested that, in the context of the period, Alexander formed quite strong friendships with women, including [[Ada of Caria]], who adopted him, and even Darius's mother [[Sisygambis]], who supposedly died from grief upon hearing of Alexander's death.{{sfn|Green|2007|pp=15\u201316}}\u003cbr\u003e \u003cbr\u003e@@ -757,7 +756,7 @@\u003cbr\u003e [[File:Gandhara Buddha (tnm).jpeg|thumb|upright|[[The Buddha]], in [[Greco-Buddhist art|Greco-Buddhist style]], 1st to 2nd century AD, [[Gandhara]], northern Pakistan. [[Tokyo National Museum]].]]\u003cbr\u003e Some of the most pronounced effects of Hellenization can be seen in Afghanistan and India, in the region of the relatively late-rising [[Greco-Bactrian Kingdom]] (250\u2013125 BC) (in modern [[Afghanistan]], [[Pakistan]], and [[Tajikistan]]) and the [[Indo-Greek Kingdom]] (180 BC \u2013 10 AD) in modern Afghanistan and India.{{sfn|Keay|2001|pp=101\u2013109}} On the [[Silk Road]] trade routes, Hellenistic culture hybridized with Iranian and [[Buddhist]] cultures. The cosmopolitan art and mythology of [[Gandhara]] (a region spanning the upper confluence of the Indus, Swat and Kabul rivers in modern Pakistan) of the ~3rd century BC to the ~5th century AD are most evident of the direct contact between Hellenistic civilization and South Asia, as are the [[Edicts of Ashoka]], which directly mention the Greeks within Ashoka's dominion as converting to Buddhism and the reception of Buddhist emissaries by Ashoka's contemporaries in the Hellenistic world.\u003cref\u003e{{Cite book |title=The Buddhist Heritage of Pakistan: Art of Gandhara |last=Proser |first=Adriana |publisher=Asia Society |year=2011 |isbn=978-0-87848-112-5 }}\u003c\u002fref\u003e The resulting [[syncretism]] known as [[Greco-Buddhism]] influenced the development of Buddhism\u003cref\u003e{{cite web |url=https:\u002f\u002fneosalexandria.org\u002fsyncretism\u002fgreco-buddhism-a-brief-history\u002f |title=Greco-Buddhism: A Brief History |website=Neosalexandria |date=11 November 2010 |access-date=19 March 2021 |archive-date=26 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210226133605\u002fhttps:\u002f\u002fneosalexandria.org\u002fsyncretism\u002fgreco-buddhism-a-brief-history\u002f |url-status=live }}\u003c\u002fref\u003e and created a culture of [[Greco-Buddhist art]]. These Greco-Buddhist kingdoms sent some of the first Buddhist missionaries to [[China]], [[Sri Lanka]] and Hellenistic Asia and Europe ([[Greco-Buddhist monasticism]]).\u003cbr\u003e \u003cbr\u003e-Some of the first and most influential figurative portrayals of [[The Buddha]] appeared at this time, perhaps modelled on Greek statues of [[Apollo]] in the Greco-Buddhist style.{{sfn|Keay|2001|pp=101\u201309}} Several Buddhist traditions may have been influenced by the [[ancient Greek religion]]: the concept of [[Boddhisatvas]] is reminiscent of Greek divine heroes,\u003cref\u003e{{harvnb|Luniya|1978|p=312}}\u003c\u002fref\u003e and some [[Mahayana]] [[Offering (Buddhism)|ceremonial practices]] (burning [[incense]], gifts of flowers, and food placed on altars) are similar to those practised by the ancient Greeks; however, similar practices were also observed amongst the native Indic culture. One Greek king, [[Menander I]], probably became Buddhist, and was immortalized in [[Buddhist literature]] as 'Milinda'.{{sfn|Keay|2001|pp=101\u201309}} The process of Hellenization also spurred trade between the east and west.\u003cref name=\"Pingree (1978), 533, 554f.\"\u003e{{harvnb|Pingree|1978|pp=533, 554ff}}\u003c\u002fref\u003e For example, Greek astronomical instruments dating to the 3rd century BC were found in the [[Greco-Bactrian]] city of [[Ai Khanoum]] in modern-day [[Afghanistan]],\u003cref\u003e{{cite book |first1=Pierre |last1=Cambon |first2=Jean-Fran\u00e7ois |last2=Jarrige |year=2006 |language=fr |title=Afghanistan, les tr\u00e9sors retrouv\u00e9s: Collections du Mus\u00e9e national de Kaboul |trans-title=Afghanistan, the treasures found: collections of the Kabul national museum |publisher=R\u00e9union des mus\u00e9es nationaux |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xJFtQgAACAAJ |page=269 |isbn=978-2-7118-5218-5 |access-date=5 September 2020}}\u003c\u002fref\u003e while the Greek concept of a [[spherical Earth]] surrounded by the spheres of planets eventually supplanted the long-standing Indian cosmological belief of a disc consisting of four continents grouped around a central mountain (Mount Meru) like the petals of a flower.\u003cref name=\"Pingree (1978), 533, 554f.\" \u002f\u003e\u003cref\u003e{{harvnb|Glick|Livesey|Wallis|2005|p=463}}\u003c\u002fref\u003e\u003cref name=\"Hayashi08Aryabhata\"\u003eHayashi (2008), ''Aryabhata I''\u003c\u002fref\u003e The [[Yavanajataka]] ({{Lit|Greek astronomical treatise}}) and [[Paulisa Siddhanta]] texts depict the influence of Greek astronomical ideas on Indian astronomy.\u003cbr\u003e+Some of the first and most influential figurative portrayals of [[The Buddha]] appeared at this time, perhaps modelled on Greek statues of [[Apollo]] in the Greco-Buddhist style.{{sfn|Keay|2001|pp=101\u201309}} Several Buddhist traditions may have been influenced by the [[ancient Greek religion]]: the concept of [[Boddhisatvas]] is reminiscent of Greek divine heroes,\u003cref\u003e{{harvnb|Luniya|1978|p=312}}\u003c\u002fref\u003e and some [[Mahayana]] [[Offering (Buddhism)|ceremonial practices]] (burning [[incense]], gifts of flowers, and food placed on altars) are similar to those practised by the ancient Greeks; however, similar practices were also observed amongst the native Indic culture. One Greek king, [[Menander I]], probably became Buddhist, and was immortalized in [[Buddhist literature]] as 'Milinda'.{{sfn|Keay|2001|pp=101\u201309}} The process of Hellenization also spurred trade between the east and west.\u003cref name=\"Pingree (1978), 533, 554f.\"\u003e{{harvnb|Pingree|1978|pp=533, 554ff}}\u003c\u002fref\u003e For example, Greek astronomical instruments dating to the 3rd century BC were found in the [[Greco-Bactrian]] city of [[Ai Khanoum]] in modern-day [[Afghanistan]],\u003cref\u003e{{cite book |first1=Pierre |last1=Cambon |first2=Jean-Fran\u00e7ois |last2=Jarrige |year=2006 |language=fr |title=Afghanistan, les tr\u00e9sors retrouv\u00e9s: Collections du Mus\u00e9e national de Kaboul |trans-title=Afghanistan, the treasures found: collections of the Kabul national museum |publisher=R\u00e9union des mus\u00e9es nationaux |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xJFtQgAACAAJ |page=269 |isbn=978-2-7118-5218-5 |access-date=5 September 2020}}\u003c\u002fref\u003e while the Greek concept of a [[spherical Earth]] surrounded by the spheres of planets eventually supplanted the long-standing Indian cosmological belief of a disc consisting of four continents grouped around a central mountain (Mount Meru) like the petals of a flower.\u003cref name=\"Pingree (1978), 533, 554f.\" \u002f\u003e\u003cref\u003e{{harvnb|Glick|Livesey|Wallis|2005|p=463}}\u003c\u002fref\u003e\u003cref name=\"Hayashi08Aryabhata\"\u003eHayashi (2008), ''Aryabhata I''\u003c\u002fref\u003e The [[Yavanajataka]] (lit. Greek astronomical treatise) and [[Paulisa Siddhanta]] texts depict the influence of Greek astronomical ideas on Indian astronomy.\u003cbr\u003e \u003cbr\u003e Following the conquests of Alexander the Great in the east, [[Hellenistic influence on Indian art]] was far-reaching. In [[architecture]], a few examples of the [[Ionic order]] can be found as far as [[Pakistan]] with the [[Jandial temple]] near [[Taxila]]. Several examples of [[capital (architecture)|capitals]] displaying Ionic influences can be seen as far as [[Patna]], especially with the [[Pataliputra capital]], dated to the 3rd century BC.\u003cref\u003e{{cite book |page=438 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=7DX-CAAAQBAJ&pg=PA438 |title=A Companion to Asian Art and Architecture |isbn=978-1-119-01953-4 |last1=Brown |first1=Rebecca M. |last2=Hutton |first2=Deborah S. |year=2015 | publisher=John Wiley & Sons |access-date=3 February 2017}}\u003c\u002fref\u003e The [[Corinthian order]] is also heavily represented in the [[art of Gandhara]], especially through [[Indo-Corinthian capital]]s.\u003cbr\u003e \u003cbr\u003e@@ -765,13 +764,11 @@\u003cbr\u003e [[File:Roman - Medallion with Alexander the Great - Walters 591 - Obverse.jpg|thumb|This medallion was produced in [[Imperial Rome]], demonstrating the influence of Alexander's memory. [[Walters Art Museum]], [[Baltimore]].]]\u003cbr\u003e Alexander and his exploits were admired by many Romans, especially generals, who wanted to associate themselves with his achievements.\u003cref name=\"Asirvatham\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 114}}\u003c\u002fref\u003e [[Polybius]] began his ''[[Histories (Polybius)|Histories]]'' by reminding Romans of Alexander's achievements, and thereafter Roman leaders saw him as a role model. [[Pompey the Great]] adopted the epithet \"Magnus\" and even Alexander's anastole-type haircut, and searched the conquered lands of the east for Alexander's 260-year-old cloak, which he then wore as a sign of greatness.\u003cref name=\"Asirvatham\" \u002f\u003e [[Julius Caesar]] dedicated a [[Lysippus|Lysippean]] [[equestrian statue|equestrian]] [[bronze]] statue, but replaced Alexander's head with his own, while [[Octavian]] visited Alexander's tomb in Alexandria and temporarily changed his seal from a [[sphinx]] to Alexander's profile.\u003cref name=\"Asirvatham\" \u002f\u003e The emperor [[Trajan]] also admired Alexander, as did [[Nero]] and [[Caracalla]].\u003cref name=\"Asirvatham\" \u002f\u003e The Macriani, a Roman family that in the person of [[Macrinus]] briefly ascended to the imperial throne, kept images of Alexander on their persons, either on jewellery or embroidered into their clothes.{{sfn|Holt|2003|p=3}}\u003cbr\u003e \u003cbr\u003e-On the other hand, some Roman writers, particularly Republican figures, used Alexander as a cautionary tale of how [[autocratic]] tendencies can be kept in check by the values of the [[Roman Republic]].\u003cref name=\"Asirvatham2\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 115}}\u003c\u002fref\u003e Alexander was used by these writers as an example of ruler values such as {{lang|la|amicitia}} (friendship) and {{lang|la|clementia}} (clemency), but also {{lang|la|iracundia}} (anger) and {{lang|la|cupiditas gloriae}} (over-desire for glory).\u003cref name=\"Asirvatham2\" \u002f\u003e\u003cbr\u003e+On the other hand, some Roman writers, particularly Republican figures, used Alexander as a cautionary tale of how [[autocratic]] tendencies can be kept in check by [[Roman republic|republican]] values.\u003cref name=\"Asirvatham2\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 115}}\u003c\u002fref\u003e Alexander was used by these writers as an example of ruler values such as {{lang|la|amicitia}} (friendship) and {{lang|la|clementia}} (clemency), but also {{lang|la|iracundia}} (anger) and {{lang|la|cupiditas gloriae}} (over-desire for glory).\u003cref name=\"Asirvatham2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e [[Emperor Julian]] in his satire called \"The Caesars\", describes a contest between the previous Roman emperors, with Alexander the Great called in as an extra contestant, in the presence of the assembled gods.\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|title=Julian: Caesars \u2013 translation|website=attalus.org|access-date=29 March 2020|archive-date=26 February 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200226035227\u002fhttp:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The [[Itinerarium Alexandri]] is a 4th-century Latin description of Alexander the Great's campaigns.\u003cbr\u003e-\u003cbr\u003e-[[Julius Caesar]] went to serve his quaestorship in Hispania after his wife's funeral, in the spring or early summer of 69 BC. While there, he encountered a statue of Alexander the Great, and realised with dissatisfaction that he was now at an age when Alexander had the world at his feet, while he had achieved comparatively little.\u003cref\u003eGoldsworthy, 100\u003c\u002fref\u003e\u003cref\u003ePlutarch 1919, XI, 2\u003c\u002fref\u003e\u003cbr\u003e+The [[Itinerarium Alexandri]] is a 4th-century Latin description of Alexander the Great's campaigns. [[Julius Caesar]] went to serve his quaestorship in Hispania after his wife's funeral, in the spring or early summer of 69 BC. While there, he encountered a statue of Alexander the Great, and realised with dissatisfaction that he was now at an age when Alexander had the world at his feet, while he had achieved comparatively little.\u003cref\u003eGoldsworthy, 100\u003c\u002fref\u003e\u003cref\u003ePlutarch 1919, XI, 2\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Pompey]] posed as the \"new Alexander\" since he was his boyhood hero.\u003cref\u003eLeach, John. Pompey the Great. p. 29.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -779,7 +776,7 @@\u003cbr\u003e \u003cbr\u003e Caracalla's mania for Alexander went so far that Caracalla visited Alexandria while preparing for his Persian invasion and persecuted philosophers of the [[Aristotelianism|Aristotelian]] school based on a legend that [[Aristotle]] had poisoned Alexander. This was a sign of Caracalla's increasingly erratic behaviour. But this mania for Alexander, strange as it was, was overshadowed by subsequent events in Alexandria.\u003cref name=\":92\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-In AD 39, [[Caligula]] performed a spectacular stunt by ordering a temporary [[Pontoon bridge|floating bridge]] to be built using ships as [[Pontoon (boat)|pontoons]], stretching for over two miles from the resort of [[Baiae]] to the neighbouring port of [[Puteoli]].\u003cref\u003e{{cite journal |last1=Wardle |first1=David |title=Caligula's Bridge of Boats \u2013 AD 39 or 40? |journal=Historia |date=2007 |volume=56 |issue=1 |pages=118\u2013120 |doi=10.25162\u002fhistoria-2007-0009 |jstor=25598379 |s2cid=164017284 }}\u003c\u002fref\u003e\u003cref name=\"seutonius-calig-19\"\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#19 19].\u003c\u002fref\u003e It was said that the bridge was to rival the Persian king [[Xerxes' pontoon bridge]] crossing of the Hellespont.\u003cref name=\"seutonius-calig-19\" \u002f\u003e Caligula, who could not swim,\u003cref\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#54 54].\u003c\u002fref\u003e then proceeded to ride his favourite horse [[Incitatus]] across, wearing the breastplate of [[#Post-death events|Alexander the Great]].\u003cref name=\"seutonius-calig-19\" \u002f\u003e This act was in defiance of a prediction by Tiberius's soothsayer [[Thrasyllus of Mendes]] that Caligula had \"no more chance of becoming emperor than of riding a horse across the Bay of Baiae\".\u003cref name=\"seutonius-calig-19\" \u002f\u003e\u003cbr\u003e+In 39, Caligula performed a spectacular stunt by ordering a temporary [[Pontoon bridge|floating bridge]] to be built using ships as [[Pontoon (boat)|pontoons]], stretching for over two miles from the resort of [[Baiae]] to the neighbouring port of [[Puteoli]].\u003cref\u003e{{cite journal |last1=Wardle |first1=David |title=Caligula's Bridge of Boats \u2013 AD 39 or 40? |journal=Historia |date=2007 |volume=56 |issue=1 |pages=118\u2013120 |doi=10.25162\u002fhistoria-2007-0009 |jstor=25598379 |s2cid=164017284 }}\u003c\u002fref\u003e\u003cref name=\"seutonius-calig-19\"\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#19 19].\u003c\u002fref\u003e It was said that the bridge was to rival the Persian king [[Xerxes' pontoon bridge]] crossing of the Hellespont.\u003cref name=\"seutonius-calig-19\" \u002f\u003e Caligula, who could not swim,\u003cref\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#54 54].\u003c\u002fref\u003e then proceeded to ride his favourite horse [[Incitatus]] across, wearing the breastplate of [[#After death|Alexander the Great]].\u003cref name=\"seutonius-calig-19\" \u002f\u003e This act was in defiance of a prediction by Tiberius's soothsayer [[Thrasyllus of Mendes]] that Caligula had \"no more chance of becoming emperor than of riding a horse across the Bay of Baiae\".\u003cref name=\"seutonius-calig-19\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The diffusion of Greek culture and language cemented by Alexander's conquests in West Asia and North Africa served as a \"precondition\" for the [[Mithridatic Wars|later Roman expansion]] into these territories and [[Byzantine Greeks|entire basis]] for the [[Byzantine Empire]], according to [[Robert Malcolm Errington|Errington]].\u003cref\u003e{{harvnb|Errington|1990|p=249}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -807,7 +804,7 @@\u003cbr\u003e In pre-Islamic [[Middle Persian]] ([[Zoroastrian]]) literature, Alexander is referred to by the epithet ''gujastak'', meaning \"accursed\", and is accused of destroying temples and burning the sacred texts of Zoroastrianism.\u003cref\u003e{{harvnb|Curtis|Tallis|Andre-Salvini|2005|p=154}}\u003c\u002fref\u003e In [[Islam]]ic Persia, under the influence of the ''[[Alexander Romance]]'' (in {{langx|fa|\u0627\u0633\u06a9\u0646\u062f\u0631\u0646\u0627\u0645\u0647}} ''[[Iskandarnameh]]''), a more positive portrayal of Alexander emerges.{{sfn|Roisman|Worthington|2010|p=120}} [[Firdausi]]'s ''[[Shahnameh]]'' (\"The Book of Kings\") [[Alexander the Great in the Shahnameh|includes Alexander]] in a line of legitimate Persian [[shah]]s, a mythical figure who explored the far reaches of the world in search of the [[Fountain of Youth]].\u003cref\u003e{{harvnb|Fischer|2004|p=66}}\u003c\u002fref\u003e In the ''Shahnameh'', Alexander's first journey is to [[Mecca]] to pray at the [[Kaaba]].\u003cref\u003e{{Cite book|last=Kennedy|first=Hugh|title=Hajj : journey to the heart of Islam|publisher=The British Museum|year=2012|isbn=978-0-674-06218-4|editor-last=Porter|editor-first=Venetia|location=Cambridge, Mass.|pages=131|chapter=Journey to Mecca: A History|oclc=709670348}}\u003c\u002fref\u003e Alexander was depicted as performing a [[Hajj]] (pilgrimage to Mecca) many times in subsequent Islamic art and literature.\u003cref\u003e{{Cite book|last=Webb|first=Peter|title=The Hajj : collected essays|publisher=The British Museum|year=2013|isbn=978-0-86159-193-0|editor-last=Porter|editor-first=Venetia|location=London|pages=14 footnote 72|chapter=The Hajj before Muhammad: Journeys to Mecca in Muslim Narratives of Pre-Islamic History|oclc=857109543|editor2-last=Saif|editor2-first=Liana}}\u003c\u002fref\u003e Later Persian writers associate him with philosophy, portraying him at a symposium with figures such as [[Socrates]], [[Plato]] and Aristotle, in search of immortality.{{sfn|Roisman|Worthington|2010|p=120}}\u003cbr\u003e \u003cbr\u003e [[File:Submerge2.JPG|thumb|right|Detail of a 16th-century [[Islamic art|Islamic painting]] depicting Alexander being lowered in a glass [[submersible]]]]\u003cbr\u003e-The figure of [[Dhu al-Qarnayn]] ([[Arabic]]: \u0630\u0648 \u0627\u0644\u0642\u0631\u0646\u064a\u0646; {{Lit|The Two-Horned One}}) is believed by the majority of modern researchers of the [[Qur'an]] as well as Islamic commentators to be a reference to Alexander.\u003cref name=\":1\"\u003e{{cite journal |last1=Griffith |first1=Sidney |title=Narratives of 'the Companions of the Cave,' Moses and His Servant, and Dh\u016b 'l-Qarnayn in S\u016brat al-Kahf: Late Antique Lore within the Purview of the Qur\u02be\u0101n |journal=Journal of the International Qur'anic Studies Association |date=15 March 2022 |volume=6 |issue=1 |doi=10.5913\u002fjiqsa.6.2021.a005 |s2cid=251486595 }}\u003c\u002fref\u003e The figure is also believed by scholars to be based on later legends of Alexander.{{sfn|Roisman|Worthington|2010|p=120}} In this tradition, he was a heroic figure who [[Gates of Alexander|built a wall]] to defend against the nations of [[Gog and Magog]].{{sfn|Roisman|Worthington|2010|p=122}} He also travelled the known world in search of the Water of Life and Immortality, eventually becoming a prophet.{{sfn|Roisman|Worthington|2010|p=122}}\u003cbr\u003e+The figure of [[Dhu al-Qarnayn]] ([[Arabic]]: \u0630\u0648 \u0627\u0644\u0642\u0631\u0646\u064a\u0646; lit. \"The Two-Horned One\") is believed by the majority of modern researchers of the [[Qur'an]] as well as Islamic commentators to be a reference to Alexander.\u003cref name=\":1\"\u003e{{cite journal |last1=Griffith |first1=Sidney |title=Narratives of 'the Companions of the Cave,' Moses and His Servant, and Dh\u016b 'l-Qarnayn in S\u016brat al-Kahf: Late Antique Lore within the Purview of the Qur\u02be\u0101n |journal=Journal of the International Qur'anic Studies Association |date=15 March 2022 |volume=6 |issue=1 |doi=10.5913\u002fjiqsa.6.2021.a005 |s2cid=251486595 }}\u003c\u002fref\u003e The figure is also believed by scholars to be based on later legends of Alexander.{{sfn|Roisman|Worthington|2010|p=120}} In this tradition, he was a heroic figure who [[Gates of Alexander|built a wall]] to defend against the nations of [[Gog and Magog]].{{sfn|Roisman|Worthington|2010|p=122}} He also travelled the known world in search of the Water of Life and Immortality, eventually becoming a prophet.{{sfn|Roisman|Worthington|2010|p=122}}\u003cbr\u003e \u003cbr\u003e The [[Syriac language|Syriac]] version of the ''Alexander Romance'' portrays him as an ideal Christian world conqueror who prayed to \"the one true God\".{{sfn|Roisman|Worthington|2010|p=120}} In Egypt, Alexander was portrayed as the son of [[Nectanebo II]], the last [[pharaoh]] before the Persian conquest.{{sfn|Roisman|Worthington|2010|p=122}} His defeat of Darius was depicted as Egypt's salvation, \"proving\" Egypt was still ruled by an Egyptian.{{sfn|Roisman|Worthington|2010|p=120}}\u003cbr\u003e \u003cbr\u003e@@ -817,6 +814,21 @@\u003cbr\u003e In [[Hindi]] and [[Urdu]], the name \"[[Iskandar (name)|Sikandar]]\", derived from the Persian name for Alexander, denotes a rising young talent, and the [[Delhi Sultanate]] ruler [[Alauddin Khalji]] stylized himself as \"Sikandar-i-Sani\" (the Second Alexander the Great).\u003cref\u003e{{harvnb|Connerney|2009|p=68}}\u003c\u002fref\u003e In [[medieval India]], Turkic and Afghan sovereigns from the Iranian-cultured region of Central Asia brought positive cultural connotations of Alexander to the Indian subcontinent, resulting in the efflorescence of ''Sikandernameh'' ([[Alexander Romances]]) written by Indo-Persian poets such as [[Amir Khusrau]] and the prominence of Alexander the Great as a popular subject in Mughal-era Persian miniatures.\u003cref\u003e{{Cite journal |last=Donde |first=Dipanwita |date=2014 |title=The Mughal Sikander: Influence of the Romance of Alexander on Mughal Manuscript Painting |url=https:\u002f\u002fwww.academia.edu\u002f6097802 |journal=International Conference of Greek Studies: An Asian Perspective |via=Academia |access-date=19 April 2019 |archive-date=12 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210812151906\u002fhttps:\u002f\u002fwww.academia.edu\u002f6097802 |url-status=live }}\u003c\u002fref\u003e In [[medieval Europe]], Alexander the Great was revered as a member of the [[Nine Worthies]]; a group of heroes whose lives were believed to encapsulate all the ideal qualities of [[chivalry]].\u003cref\u003e{{cite book |last1=Noll |first1=Thomas |article=The Visual Image of Alexander the Great |title=Alexander the Great in the Middle Ages: Transcultural Perspectives |editor-last=Stock |editor-first=Markus |translator-last=Boettcher |translator-first=Susan |date=2016 |publisher=University of Toronto Press |location=Toronto |isbn=978-1-4426-4466-3 |page=258 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2nqMCwAAQBAJ&pg=PA258 |access-date=21 November 2017}}\u003c\u002fref\u003e During the first [[Italian campaigns of the French Revolutionary Wars|Italian campaign of the French Revolutionary Wars]], in a question from [[Bourrienne]], asking whether he gave his preference to Alexander or Caesar, [[Napoleon]] said that he places Alexander The Great in the first rank, the main reason being his campaign on Asia.\u003cref\u003eLouis Antoine Fauvelet de Bourrienne, Memoirs of Napoleon Bonaparte, pp 158\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the ''[[Greek Anthology]]'', there are poems referring to Alexander.\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022239\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f748#122|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022206\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f748#122|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Throughout time, art objects related to Alexander were being created. In addition to speech works, sculptures and paintings, in modern times Alexander is still the subject of musical and cinematic works. The song 'Alexander the Great' by the British heavy metal band [[Iron Maiden]] is indicative. Some films that have been shot with the theme of Alexander are:\u003cbr\u003e+* ''[[Sikandar (1941 film)|Sikandar]]'' (1941), an Indian production directed by [[Sohrab Modi]] about the conquest of India by Alexander\u003cref\u003e{{cite book|title=100 Bollywood Films|isbn=978-81-7436-990-1|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=tk5gBAAAQBAJ&q=Sikandar+1941+Prithviraj+Kapoor&pg=PT165|last1=Dwyer|first1=Rachel|date=December 2005|publisher=Roli Books |access-date=6 April 2021}}\u003c\u002fref\u003e\u003cbr\u003e+* ''[[Alexander the Great (1956 film)|Alexander the Great]]'' (1956), produced by MGM and starring [[Richard Burton]]\u003cbr\u003e+* ''Sikandar-e-Azam'' (1965), an Indian production directed by Kedar Kapoor\u003cbr\u003e+* ''[[Alexander (2004 film)|Alexander]]'' (2004), directed by [[Oliver Stone]], starring [[Colin Farrell]]\u003cbr\u003e+\u003cbr\u003e+There are also many references to other movies and TV series.\u003cbr\u003e+\u003cbr\u003e+Newer novels about Alexander are:\u003cbr\u003e+The trilogy \"Alexander the Great\" by [[Valerio Massimo Manfredi]] consisting of \"The son of the dream\", \"The sand of Amon\", and \"The ends of the world\".\u003cbr\u003e+The trilogy of [[Mary Renault]] consisting of \"[[Fire from Heaven]]\", \"[[The Persian Boy]]\" and \"[[Funeral Games (novel)|Funeral Games]]\".\u003cbr\u003e+* ''[[The Virtues of War]]'', about Alexander the Great (2004), {{ISBN|978-0-385-50099-9}} and \"* ''[[The Afghan Campaign]]'', about Alexander the Great's conquests in Afghanistan (2006), {{ISBN|978-0-385-51641-9}}\" by [[Steven Pressfield]].\u003cbr\u003e+\u003cbr\u003e+Irish playwright [[Aubrey Thomas de Vere]] wrote ''[[Alexander the Great, a Dramatic Poem]]''.\u003cbr\u003e \u003cbr\u003e ==Historiography==\u003cbr\u003e {{Main|Historiography of Alexander the Great}}\u003cbr\u003e@@ -844,7 +856,7 @@\u003cbr\u003e {{Cnote2|c|The first known person to call Alexander \"the Great\" was a Roman playwright named [[Plautus]] (254\u2013184 BC) in his play ''[[Mostellaria]]''.\u003cref\u003e{{Cite book|author=Diana Spencer|title=Oxford Research Encyclopedia of Classics|year= 2019|chapter=Alexander the Great, reception of|chapter-url=https:\u002f\u002foxfordre.com\u002fclassics\u002fview\u002f10.1093\u002facrefore\u002f9780199381135.001.0001\u002facrefore-9780199381135-e-8048|series=Oxford Research Encyclopedias|doi=10.1093\u002facrefore\u002f9780199381135.013.8048|isbn=978-0-19-938113-5|access-date=9 November 2021|quote=Alexander enjoys the epithet ''the Great'' for the first time in Plautus's Roman comedy ''Mostellaria'' (775\u2013777).|archive-date=10 November 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211110030827\u002fhttps:\u002f\u002foxfordre.com\u002fclassics\u002fview\u002f10.1093\u002facrefore\u002f9780199381135.001.0001\u002facrefore-9780199381135-e-8048|url-status=live}}\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|d|Macedon was an Ancient Greek polity; the Macedonians were a Greek tribe.\u003cref name=\"Macedonians\"\u003e{{harvnb|Hornblower|2008|pp=55\u201358}}; {{harvnb|Joint Association of Classical Teachers|1984|pp=50\u201351}}; {{harvnb|Errington|1990|pp=3\u20134}}; {{harvnb|Fine|1983|pp=607\u201308}}; {{harvnb|Hammond|Walbank|2001|p=11}}; {{harvnb|Jones|2001|p=21}}; {{harvnb|Osborne|2004|p=127}}; {{harvnb|Hammond|1989|pp=12\u201313}}; {{harvnb|Hammond|1993|p=97}}; {{harvnb|Starr|1991|pp=260, 367}}; {{harvnb|Toynbee|1981|p=67}}; {{harvnb|Worthington|2008|pp=8, 219}}; {{harvnb|Cawkwell|1978|p=22}}; {{harvnb|Perlman|1973|p=78}}; {{harvnb|Hamilton|1974|p=23}}; {{harvnb|Bryant|1996|p=306}}; {{harvnb|O'Brien|1994|p=25}}.\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|e| By the time of his death, he had conquered the entire [[Achaemenid Persian Empire]], adding it to Macedon's European territories; according to some modern writers, this was most of the world then known to the ancient Greeks (the '[[Ecumene#Ancient world|Ecumene]]').{{sfn|Danforth|1997|pp=38, 49, 167}}{{sfn|Stoneman|2004|p=2}} An approximate view of the world known to Alexander can be seen in [[Hecataeus of Miletus]]'s map; see [[:File:Hecataeus world map-en.svg|Hecataeus world map]]. }}\u003cbr\u003e-{{Cnote2|f| For instance, [[Hannibal]] supposedly ranked Alexander as the greatest general;{{Sfn | Goldsworthy |2003|pp=327\u201328}} [[Julius Caesar]] wept on seeing a statue of Alexander, since he had achieved so little by the same age;\u003cref name=\"Plutarch, Caesar, 11\" \u002f\u003e [[Pompey]] and [[Alauddin Khalji]] consciously posed as the 'new Alexander';{{sfn|Holland|2003|pp=176\u201383}} the young [[Napoleon]] Bonaparte also encouraged comparisons with Alexander. Napoleon also placed Alexander in the first rank.{{sfn|Barnett|1997|p=45}} [[Caracalla]] believed himself to be the actual reincarnation of Alexander.\u003cref\u003eRonald H. Fritze, Egyptomania: A History of Fascination, Obsession and Fantasy, p. 103.\u003c\u002fref\u003e\u003cref\u003eGoldsworthy, Adrian (2009). How Rome Fell: death of a superpower. New Haven: Yale University Press. pp. 74. {{ISBN|978-0-300-16426-8}}.\u003c\u002fref\u003e\u003cref\u003eBrauer, G. (1967). The Decadent Emperors: Power and Depravity in Third-Century Rome. p. 75.\u003c\u002fref\u003e [[Caligula]] wore the breastplate of Alexander in order to show his power.\u003cref\u003eSuetonius, The Lives of Twelve Caesars, Life of Caligula 19.\u003c\u002fref\u003e\u003cref\u003eGeoff W. Adams, The Roman Emperor Gaius \"Caligula\" and His Hellenistic Aspirations, pp 46\u003c\u002fref\u003e [[Fidel Castro]]'s hero was Alexander the Great, whose Spanish equivalent ''Alejandro'' he adopted as his ''nom de guerre''.\u003cref\u003eLeycester Coltman, The Real Fidel Castro, p 220.\u003c\u002fref\u003e Among [[Ottoman sultans]], [[Mehmed II]]'s heroes were Alexander and [[Achilles]].\u003cref\u003eNicolle, David (2000). Constantinople 1453: The End of Byzantium. Osprey Publishing. {{ISBN|978-1-84176-091-9}}.\u003c\u002fref\u003e In a letter to his rival, [[Selim I]], while equating himself with Alexander, compares [[Ismail I]] as \"Darius of our days\".\u003cref\u003e{{cite book|title=Imperial Citizen: Marriage and Citizenship in the Ottoman Frontier Provinces of Iraq|page=39|year=2011|author=Karen M. Kern}}\u003c\u002fref\u003e In his poetry, however, Shah Ismail identified himself with Alexander. [[Paolo Giovio]], in a work written for [[Charles V, Holy Roman Emperor|Charles V]], says that Selim holds Alexander the Great and Julius Caesar in the highest esteem above all the generals of old.\u003cref\u003e{{cite book|author=Donald Presgrave Little|year=1976|page=227|title=Essays on Islamic civilization presented to Niyazi Berkes}}\u003c\u002fref\u003e}}\u003cbr\u003e+{{Cnote2|f| For instance, [[Hannibal]] supposedly ranked Alexander as the greatest general;{{Sfn | Goldsworthy |2003|pp=327\u201328}} [[Julius Caesar]] wept on seeing a statue of Alexander, since he had achieved so little by the same age;\u003cref name=\"Plutarch, Caesar, 11\" \u002f\u003e [[Pompey]] and [[Alauddin Khalji]] consciously posed as the 'new Alexander';{{sfn|Holland|2003|pp=176\u201383}} the young [[Napoleon]] Bonaparte also encouraged comparisons with Alexander. Napoleon also placed Alexander in the first rank.{{sfn|Barnett|1997|p=45}} [[Caracalla]] believed himself to be the actual reincarnation of Alexander.\u003cref\u003eRonald H. Fritze, Egyptomania: A History of Fascination, Obsession and Fantasy, p. 103.\u003c\u002fref\u003e\u003cref\u003eGoldsworthy, Adrian (2009). How Rome Fell: death of a superpower. New Haven: Yale University Press. pp. 74. {{ISBN|978-0-300-16426-8}}.\u003c\u002fref\u003e\u003cref\u003eBrauer, G. (1967). The Decadent Emperors: Power and Depravity in Third-Century Rome. p. 75.\u003c\u002fref\u003e [[Caligula]] wore the breastplate of Alexander in order to show his power.\u003cref\u003eSuetonius, The Lives of Twelve Caesars, Life of Caligula 19.\u003c\u002fref\u003e\u003cref\u003eGeoff W. Adams, The Roman Emperor Gaius \"Caligula\" and His Hellenistic Aspirations, pp 46\u003c\u002fref\u003e [[Fidel Castro]]'s hero was Alexander the Great, whose Spanish equivalent ''Alejandro'' he adopted as his ''nom de guerre''.\u003cref\u003eLeycester Coltman, The Real Fidel Castro, p 220.\u003c\u002fref\u003e Among [[Ottoman sultans]], [[Mehmed II]]'s heroes were Alexander and [[Achilles]].\u003cref\u003eNicolle, David (2000). Constantinople 1453: The End of Byzantium. Osprey Publishing. {{ISBN|978-1-84176-091-9}}.\u003c\u002fref\u003e In a letter to his rival, [[Selim I]], while equating himself with Alexander, compares [[Ismail I]] as \"Darius of our days\".\u003cref\u003e{{cite book|title=Imperial Citizen: Marriage and Citizenship in the Ottoman Frontier Provinces of Iraq|page=39|year=2011|author=Karen M. Kern}}\u003c\u002fref\u003e [[Paolo Giovio]], in a work written for [[Charles V, Holy Roman Emperor|Charles V]], says that Selim holds Alexander the Great and Julius Caesar in the highest esteem above all the generals of old.\u003cref\u003e{{cite book|author=Donald Presgrave Little|year=1976|page=227|title=Essays on Islamic civilization presented to Niyazi Berkes}}\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|g|In ancient historiography, the [[Argead dynasty]] was traditionally regarded as having originated from [[Argos, Peloponnese|Argos]]. The Argeads themselves claimed Argive Greek descent from the hero [[Temenus]]. Through his parents' genealogy, ancient authors traced Alexander's descent back to heroes and other legendary figures from [[Greek mythology]], such as [[Heracles]] and [[Achilles]].\u003cref\u003eDiodorus, ''[[Bibliotheca Historica]]'' [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Diod.+17+1.5&fromdoc=Perseus%3Atext%3A1999.01.0084 17.1.5], [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Diod.+17.4&fromdoc=Perseus%3Atext%3A1999.01.0084 17.4]; Plutarch, ''[[Plutarch#Life of Alexander|Life of Alexander]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Plut.+Alex.+2.1&fromdoc=Perseus%3Atext%3A1999.01.0243 2.1]; Pausanias, ''[[Description of Greece]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Paus.+1.9.8&fromdoc=Perseus%3Atext%3A1999.01.0160 1.9.8], [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0160%3Abook%3D1%3Achapter%3D11%3Asection%3D1 1.11.1], [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Paus.+7.8.9&fromdoc=Perseus%3Atext%3A1999.01.0160 7.8.9]; Arrian, ''[[Anabasis of Alexander]]'' [https:\u002f\u002farchive.org\u002fdetails\u002fL236ArrianIAnabasisOfAlexander14\u002fpage\u002f148\u002fmode\u002f2up?view=theater 2.7.4]; Herodotus, ''[[Histories (Herodotus)|Histories]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Hdt.+5.22.1&fromdoc=Perseus%3Atext%3A1999.01.0126 5.22.1], [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D5%3Achapter%3D22%3Asection%3D2 5.22.2]; Isocrates, ''To Philip'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:abo:tlg,0010,020:32 32]; Thucydides, [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0200%3Abook%3D2%3Achapter%3D99%3Asection%3D3 2.99,3]\u003c\u002fref\u003e\u003cref\u003e{{harvnb|Errington|1990|p=3}}; {{harvnb|Hornblower|2008|pp=55\u201358}}\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|h| There have been, since the time, many suspicions that Pausanias was actually hired to murder Philip. Suspicion has fallen upon Alexander, Olympias and even the newly crowned Persian Emperor, Darius III. All three of these people had motive to have Philip murdered.{{sfn|Lane Fox|1980|pp=72\u201373}} }}\u003cbr\u003e {{Cnote2|i| However, [[Arrian]], who used [[Ptolemy I Soter|Ptolemy]] as a source, said that Alexander crossed with more than 5,000 horse and 30,000 foot; [[Diodorus]] quoted the same totals, but listed 5,100 horse and 32,000 foot. Diodorus also referred to an advance force already present in Asia, which [[Polyaenus]], in his Stratagems of War (5.44.4), said numbered 10,000 men.}}\u003cbr\u003e@@ -893,8 +905,8 @@\u003cbr\u003e \u003cref name=\"PA45\"\u003e{{harvnb|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0243%3Achapter%3D45 LXV, 1]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cref name=\"Plutarch, Caesar, 11\"\u003e{{harvnb|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0244:chapter=11&highlight=alexander XI, 2]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cref name=\"ref1\"\u003e{{cite journal |last1=Marr |first1=John S|author2-link=Charles Calisher |last2=Calisher |first2=Charles H |year=2003 |title=Alexander the Great and West Nile Virus Encephalitis |journal=Emerging Infectious Diseases |volume=9 |issue=12 |pages=1599\u20131603 |doi=10.3201\u002feid0912.030288 |pmc=3034319 |pmid=14725285}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref name=\"sarco1\"\u003e{{cite web |last=Kosmetatou |first=Elizabeth |title=The Location of the Tomb: Facts and Speculation |work=Hellenic Electronic Center |year=1998 |publisher=Greece.org |url=http:\u002f\u002fwww.greece.org\u002falexandria\u002falexander\u002fpages\u002flocation.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20040531025749\u002fhttp:\u002 essed as [[Ares]] and [[Aphrodite]].]]\u003cbr\u003e-Alexander married three times: [[Roxana]], daughter of the [[Sogdia]]n nobleman [[Oxyartes]] of [[Bactria]],\u003cref\u003eAhmed, S. Z. (2004), ''Chaghatai: the Fabulous Cities and People of the Silk Road'', West Conshokoken: Infinity Publishing, p. 61.\u003c\u002fref\u003e\u003cref\u003eStrachan, Edward and Roy Bolton (2008), ''Russia and Europe in the Nineteenth Century'', London: Sphinx Fine Art, p. 87, {{ISBN|978-1-907200-02-1}}.\u003c\u002fref\u003e\u003cref\u003eLivius.org. \"[https:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f Roxane] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414100829\u002fhttps:\u002f\u002fwww.livius.org\u002farticles\u002fperson\u002froxane\u002f |date=14 April 2021}}.\" ''Articles on Ancient History''. Retrieved on 30 August 2016.\u003c\u002fref\u003e out of love;{{Sfn|Plutarch|1919|loc= [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0243%3Achapter%3D47 LXVII, 1]}} and the Persian princesses [[Stateira (wife of Alexander the Great)|Stateira]] and [[Parysatis II|Parysatis]], the former a daughter of [[Darius III]] and the latter a daughter of [[Artaxerxes III]], for political reasons.\u003cref name=\"Carney\"\u003e{{cite book |last=Carney |first=Elizabeth Donnelly |title=Women and Monarchy in Macedonia |date=2000 |publisher=University of Oklahoma Press |location=Norman |isbn=978-0-8061-3212-9}}\u003c\u002fref\u003e{{Sfn |Plutarch|1936|loc= [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fPlutarch\u002fMoralia\u002fFortuna_Alexandri*\u002f2.html II, 6]}} Alexander apparently had two children by Roxana: unnamed first child, who was born in India and died in infancy in November 326 BC,\u003cref\u003eMetz Epitome 70\u003cbr\u003e+Alexander married three times: [[Roxana]], daughter of the [[Sogdia]]n nobleman [[Oxyartes]] of [[Bactria]],\u003cref\u003eAhmed, u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e+'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002f18 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Until the age of 16, Alexander was tutored by [[Aristotle]]. In 335 BC, shortly after his assumption of kingship over Macedon, he [[Alexander's Balkan campaign|campaigned in the Balkans]] and reasserted control over [[Thrace]] and parts of [[Illyria]] before marching on the city of [[Thebes, Greece|Thebes]], which was [[Battle of Thebes|subsequently destroyed in battle]]. Alexander then led the [[League of Corinth]], and used his authority to launch the [[Greek nationalism#History|pan-Hellenic project]] envisaged by his father, assuming leadership over all [[Greeks]] in their conquest of [[Greater Iran|Persia]].{{sfn|Heckel|Tritle|2009|p=99}}\u003cref\u003e{{cite book |last1=Burger |first1=Michael |title=The Shaping of Western Civilization: From Antiquity to the Enlightenment |date=2008 |publisher=University of Toronto Press |isbn=978-1-55111-432-3 |page=76}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -51,7 +51,7 @@\u003cbr\u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander II
