ite web |title=Images of Authority II: The Greek Example |year=2005 |publisher=SUNY Oneonta |url=http:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |access-date=16 December 2011 |archive-date=4 October 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20181004195912\u002fhttp:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Alexander the Great\"\u002f\u003e Andrew Stewart highlights the fact that artistic portraits, not least because of who they are commissioned by, are always partisan, and that artistic portrayals of Alexander \"seek to legitimize him (or, by extension, his Successors), to interpret him to their audiences, to answer their critiques, and to persuade them of his greatness\", and thus should be considered within a framework of \"praise and blame\", in the same way sources such as praise poetry are.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=69}}\u003c\u002fref\u003e Nevertheless, though idealised, Lysippos's sculpture was thought to be the most faithful [[Plastic arts|plastic]] representation.{{Sfn |Bosworth|1988|pp = 19\u201320}}\u003cbr\u003e \u003cbr\u003e [[Quintus Curtius Rufus|Curtius Rufus]], a Roman historian from the first century AD, who wrote the ''[[Histories of Alexander the Great]]'', gives this account of Alexander sitting on the throne of [[Darius III]]:\u003cbr\u003e ","--- Revision 42\u003cbr\u003e+++ Revision 43\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC\u003cbr\u003e | predecessor  = [[Philip II of Macedon|Philip II]]\u003cbr\u003e | successor    = [[Philip III of Macedon|Philip III]]\u003cbr\u003e-| succession2  = [[Hegemony#8th\u20131st centuries BC|Hegemon]] of the [[League of Corinth|Hellenic League]], [[Strategos]]  [[Autokrator]] of [[Hellenistic Greece|Greece]]\u003cref\u003e{{Sfn|Cawkwell|1978|page=170}}\u003c\u002fref\u003e\u003cbr\u003e+| succession2  = [[Hegemony#8th\u20131st centuries BC|Hegemon]] of the [[League of Corinth|Hellenic League]], [[Strategos]]  [[Autokrator]] of [[Hellenistic Greece|Greece]]{{Sfn|Cawkwell|1978|page=170}}\u003cbr\u003e | reign2       = 336\u2013323 BC\u003cbr\u003e | predecessor2 = Philip II\u003cbr\u003e | successor2   = [[Demetrius I of Macedon|Demetrius I]]","--- Revision 43\u003cbr\u003e+++ Revision 44\u003cbr\u003e@@ -757,7 +757,7 @@\u003cbr\u003e [[File:Gandhara Buddha (tnm).jpeg|thumb|upright|[[The Buddha]], in [[Greco-Buddhist art|Greco-Buddhist style]], 1st to 2nd century AD, [[Gandhara]], northern Pakistan. [[Tokyo National Museum]].]]\u003cbr\u003e Some of the most pronounced effects of Hellenization can be seen in Afghanistan and India, in the region of the relatively late-rising [[Greco-Bactrian Kingdom]] (250\u2013125 BC) (in modern [[Afghanistan]], [[Pakistan]], and [[Tajikistan]]) and the [[Indo-Greek Kingdom]] (180 BC \u2013 10 AD) in modern Afghanistan and India.{{sfn|Keay|2001|pp=101\u2013109}} On the [[Silk Road]] trade routes, Hellenistic culture hybridized with Iranian and [[Buddhist]] cultures. The cosmopolitan art and mythology of [[Gandhara]] (a region spanning the upper confluence of the Indus, Swat and Kabul rivers in modern Pakistan) of the ~3rd century BC to the ~5th century AD are most evident of the direct contact between Hellenistic civilization and South Asia, as are the [[Edicts of Ashoka]], which directly mention the Greeks within Ashoka's dominion as converting to Buddhism and the reception of Buddhist emissaries by Ashoka's contemporaries in the Hellenistic world.\u003cref\u003e{{Cite book |title=The Buddhist Heritage of Pakistan: Art of Gandhara |last=Proser |first=Adriana |publisher=Asia Society |year=2011 |isbn=978-0-87848-112-5 }}\u003c\u002fref\u003e The resulting [[syncretism]] known as [[Greco-Buddhism]] influenced the development of Buddhism\u003cref\u003e{{cite web |url=https:\u002f\u002fneosalexandria.org\u002fsyncretism\u002fgreco-buddhism-a-brief-history\u002f |title=Greco-Buddhism: A Brief History |website=Neosalexandria |date=11 November 2010 |access-date=19 March 2021 |archive-date=26 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210226133605\u002fhttps:\u002f\u002fneosalexandria.org\u002fsyncretism\u002fgreco-buddhism-a-brief-history\u002f |url-status=live }}\u003c\u002fref\u003e and created a culture of [[Greco-Buddhist art]]. These Greco-Buddhist kingdoms sent some of the first Buddhist missionaries to [[China]], [[Sri Lanka]] and Hellenistic Asia and Europe ([[Greco-Buddhist monasticism]]).\u003cbr\u003e \u003cbr\u003e-Some of the first and most influential figurative portrayals of [[The Buddha]] appeared at this time, perhaps modelled on Greek statues of [[Apollo]] in the Greco-Buddhist style.{{sfn|Keay|2001|pp=101\u201309}} Several Buddhist traditions may have been influenced by the [[ancient Greek religion]]: the concept of [[Boddhisatvas]] is reminiscent of Greek divine heroes,\u003cref\u003e{{harvnb|Luniya|1978|p=312}}\u003c\u002fref\u003e and some [[Mahayana]] [[Offering (Buddhism)|ceremonial practices]] (burning [[incense]], gifts of flowers, and food placed on altars) are similar to those practised by the ancient Greeks; however, similar practices were also observed amongst the native Indic culture. One Greek king, [[Menander I]], probably became Buddhist, and was immortalized in [[Buddhist literature]] as 'Milinda'.{{sfn|Keay|2001|pp=101\u201309}} The process of Hellenization also spurred trade between the east and west.\u003cref name=\"Pingree (1978), 533, 554f.\"\u003e{{harvnb|Pingree|1978|pp=533, 554ff}}\u003c\u002fref\u003e For example, Greek astronomical instruments dating to the 3rd century BC were found in the [[Greco-Bactrian]] city of [[Ai Khanoum]] in modern-day [[Afghanistan]],\u003cref\u003e{{cite book |first1=Pierre |last1=Cambon |first2=Jean-Fran\u00e7ois |last2=Jarrige |year=2006 |language=fr |title=Afghanistan, les tr\u00e9sors retrouv\u00e9s: Collections du Mus\u00e9e national de Kaboul |trans-title=Afghanistan, the treasures found: collections of the Kabul national museum |publisher=R\u00e9union des mus\u00e9es nationaux |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xJFtQgAACAAJ |page=269 |isbn=978-2-7118-5218-5 |access-date=5 September 2020}}\u003c\u002fref\u003e while the Greek concept of a [[spherical Earth]] surrounded by the spheres of planets eventually supplanted the long-standing Indian cosmological belief of a disc consisting of four continents grouped around a central mountain (Mount Meru) like the petals of a flower.\u003cref name=\"Pingree (1978), 533, 554f.\" \u002f\u003e\u003cref\u003e{{harvnb|Glick|Livesey|Wallis|2005|p=463}}\u003c\u002fref\u003e\u003cref name=\"Hayashi08Aryabhata\"\u003eHayashi (2008), ''Aryabhata I''\u003c\u002fref\u003e The [[Yavanajataka]] (lit. Greek astronomical treatise) and [[Paulisa Siddhanta]] texts depict the influence of Greek astronomical ideas on Indian astronomy.\u003cbr\u003e+Some of the first and most influential figurative portrayals of [[The Buddha]] appeared at this time, perhaps modelled on Greek statues of [[Apollo]] in the Greco-Buddhist style.{{sfn|Keay|2001|pp=101\u201309}} Several Buddhist traditions may have been influenced by the [[ancient Greek religion]]: the concept of [[Boddhisatvas]] is reminiscent of Greek divine heroes,\u003cref\u003e{{harvnb|Luniya|1978|p=312}}\u003c\u002fref\u003e and some [[Mahayana]] [[Offering (Buddhism)|ceremonial practices]] (burning [[incense]], gifts of flowers, and food placed on altars) are similar to those practised by the ancient Greeks; however, similar practices were also observed amongst the native Indic culture. One Greek king, [[Menander I]], probably became Buddhist, and was immortalized in [[Buddhist literature]] as 'Milinda'.{{sfn|Keay|2001|pp=101\u201309}} The process of Hellenization also spurred trade between the east and west.\u003cref name=\"Pingree (1978), 533, 554f.\"\u003e{{harvnb|Pingree|1978|pp=533, 554ff}}\u003c\u002fref\u003e For example, Greek astronomical instruments dating to the 3rd century BC were found in the [[Greco-Bactrian]] city of [[Ai Khanoum]] in modern-day [[Afghanistan]],\u003cref\u003e{{cite book |first1=Pierre |last1=Cambon |first2=Jean-Fran\u00e7ois |last2=Jarrige |year=2006 |language=fr |title=Afghanistan, les tr\u00e9sors retrouv\u00e9s: Collections du Mus\u00e9e national de Kaboul |trans-title=Afghanistan, the treasures found: collections of the Kabul national museum |publisher=R\u00e9union des mus\u00e9es nationaux |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xJFtQgAACAAJ |page=269 |isbn=978-2-7118-5218-5 |access-date=5 September 2020}}\u003c\u002fref\u003e while the Greek concept of a [[spherical Earth]] surrounded by the spheres of planets eventually supplanted the long-standing Indian cosmological belief of a disc consisting of four continents grouped around a central mountain (Mount Meru) like the petals of a flower.\u003cref name=\"Pingree (1978), 533, 554f.\" \u002f\u003e\u003cref\u003e{{harvnb|Glick|Livesey|Wallis|2005|p=463}}\u003c\u002fref\u003e\u003cref name=\"Hayashi08Aryabhata\"\u003eHayashi (2008), ''Aryabhata I''\u003c\u002fref\u003e The [[Yavanajataka]] ({{Lit|Greek astronomical treatise}}) and [[Paulisa Siddhanta]] texts depict the influence of Greek astronomical ideas on Indian astronomy.\u003cbr\u003e \u003cbr\u003e Following the conquests of Alexander the Great in the east, [[Hellenistic influence on Indian art]] was far-reaching. In [[architecture]], a few examples of the [[Ionic order]] can be found as far as [[Pakistan]] with the [[Jandial temple]] near [[Taxila]]. Several examples of [[capital (architecture)|capitals]] displaying Ionic influences can be seen as far as [[Patna]], especially with the [[Pataliputra capital]], dated to the 3rd century BC.\u003cref\u003e{{cite book |page=438 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=7DX-CAAAQBAJ&pg=PA438 |title=A Companion to Asian Art and Architecture |isbn=978-1-119-01953-4 |last1=Brown |first1=Rebecca M. |last2=Hutton |first2=Deborah S. |year=2015 | publisher=John Wiley & Sons |access-date=3 February 2017}}\u003c\u002fref\u003e The [[Corinthian order]] is also heavily represented in the [[art of Gandhara]], especially through [[Indo-Corinthian capital]]s.\u003cbr\u003e \u003cbr\u003e@@ -807,7 +807,7 @@\u003cbr\u003e In pre-Islamic [[Middle Persian]] ([[Zoroastrian]]) literature, Alexander is referred to by the epithet ''gujastak'', meaning \"accursed\", and is accused of destroying temples and burning the sacred texts of Zoroastrianism.\u003cref\u003e{{harvnb|Curtis|Tallis|Andre-Salvini|2005|p=154}}\u003c\u002fref\u003e In [[Islam]]ic Persia, under the influence of the ''[[Alexander Romance]]'' (in {{langx|fa|\u0627\u0633\u06a9\u0646\u062f\u0631\u0646\u0627\u0645\u0647}} ''[[Iskandarnameh]]''), a more positive portrayal of Alexander emerges.{{sfn|Roisman|Worthington|2010|p=120}} [[Firdausi]]'s ''[[Shahnameh]]'' (\"The Book of Kings\") [[Alexander the Great in the Shahnameh|includes Alexander]] in a line of legitimate Persian [[shah]]s, a mythical figure who explored the far reaches of the world in search of the [[Fountain of Youth]].\u003cref\u003e{{harvnb|Fischer|2004|p=66}}\u003c\u002fref\u003e In the ''Shahnameh'', Alexander's first journey is to [[Mecca]] to pray at the [[Kaaba]].\u003cref\u003e{{Cite book|last=Kennedy|first=Hugh|title=Hajj : journey to the heart of Islam|publisher=The British Museum|year=2012|isbn=978-0-674-06218-4|editor-last=Porter|editor-first=Venetia|location=Cambridge, Mass.|pages=131|chapter=Journey to Mecca: A History|oclc=709670348}}\u003c\u002fref\u003e Alexander was depicted as performing a [[Hajj]] (pilgrimage to Mecca) many times in subsequent Islamic art and literature.\u003cref\u003e{{Cite book|last=Webb|first=Peter|title=The Hajj : collected essays|publisher=The British Museum|year=2013|isbn=978-0-86159-193-0|editor-last=Porter|editor-first=Venetia|location=London|pages=14 footnote 72|chapter=The Hajj before Muhammad: Journeys to Mecca in Muslim Narratives of Pre-Islamic History|oclc=857109543|editor2-last=Saif|editor2-first=Liana}}\u003c\u002fref\u003e Later Persian writers associate him with philosophy, portraying him at a symposium with figures such as [[Socrates]], [[Plato]] and Aristotle, in search of immortality.{{sfn|Roisman|Worthington|2010|p=120}}\u003cbr\u003e \u003cbr\u003e [[File:Submerge2.JPG|thumb|right|Detail of a 16th-century [[Islamic art|Islamic painting]] depicting Alexander being lowered in a glass [[submersible]]]]\u003cbr\u003e-The figure of [[Dhu al-Qarnayn]] ([[Arabic]]: \u0630\u0648 \u0627\u0644\u0642\u0631\u0646\u064a\u0646; lit. \"The Two-Horned One\") is believed by the majority of modern researchers of the [[Qur'an]] as well as Islamic commentators to be a reference to Alexander.\u003cref name=\":1\"\u003e{{cite journal |last1=Griffith |first1=Sidney |title=Narratives of 'the Companions of the Cave,' Moses and His Servant, and Dh\u016b 'l-Qarnayn in S\u016brat al-Kahf: Late Antique Lore within the Purview of the Qur\u02be\u0101n |journal=Journal of the International Qur'anic Studies Association |date=15 March 2022 |volume=6 |issue=1 |doi=10.5913\u002fjiqsa.6.2021.a005 |s2cid=251486595 }}\u003c\u002fref\u003e The figure is also believed by scholars to be based on later legends of Alexander.{{sfn|Roisman|Worthington|2010|p=120}} In this tradition, he was a heroic figure who [[Gates of Alexander|built a wall]] to defend against the nations of [[Gog and Magog]].{{sfn|Roisman|Worthington|2010|p=122}} He also travelled the known world in search of the Water of Life and Immortality, eventually becoming a prophet.{{sfn|Roisman|Worthington|2010|p=122}}\u003cbr\u003e+The figure of [[Dhu al-Qarnayn]] ([[Arabic]]: \u0630\u0648 \u0627\u0644\u0642\u0631\u0646\u064a\u0646; {{Lit|The Two-Horned One}}) is believed by the majority of modern researchers of the [[Qur'an]] as well as Islamic commentators to be a reference to Alexander.\u003cref name=\":1\"\u003e{{cite journal |last1=Griffith |first1=Sidney |title=Narratives of 'the Companions of the Cave,' Moses and His Servant, and Dh\u016b 'l-Qarnayn in S\u016brat al-Kahf: Late Antique Lore within the Purview of the Qur\u02be\u0101n |journal=Journal of the International Qur'anic Studies Association |date=15 March 2022 |volume=6 |issue=1 |doi=10.5913\u002fjiqsa.6.2021.a005 |s2cid=251486595 }}\u003c\u002fref\u003e The figure is also believed by scholars to be based on later legends of Alexander.{{sfn|Roisman|Worthington|2010|p=120}} In this tradition, he was a heroic figure who [[Gates of Alexander|built a wall]] to defend against the nations of [[Gog and Magog]].{{sfn|Roisman|Worthington|2010|p=122}} He also travelled the known world in search of the Water of Life and Immortality, eventually becoming a prophet.{{sfn|Roisman|Worthington|2010|p=122}}\u003cbr\u003e \u003cbr\u003e The [[Syriac language|Syriac]] version of the ''Alexander Romance'' portrays him as an ideal Christian world conqueror who prayed to \"the one true God\".{{sfn|Roisman|Worthington|2010|p=120}} In Egypt, Alexander was portrayed as the son of [[Nectanebo II]], the last [[pharaoh]] before the Persian conquest.{{sfn|Roisman|Worthington|2010|p=122}} His defeat of Darius was depicted as Egypt's salvation, \"proving\" Egypt was still ruled by an Egyptian.{{sfn|Roisman|Worthington|2010|p=120}}\u003cbr\u003e ","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -403,7 +403,7 @@\u003cbr\u003e [[File:Alexander Sarcophagus Battle of Issus.jpg|thumb|Detail of Alexander on the [[Alexander Sarcophagus]]]]\u003cbr\u003e [[Pompey]], [[Julius Caesar]] and [[Augustus]] all visited the tomb in Alexandria where Augustus, allegedly, accidentally knocked the nose of Alexander's mummified body off. [[Caligula]] was said to have taken Alexander's breastplate from the tomb for his own use. Around AD 200, Emperor [[Septimius Severus]] closed Alexander's tomb to the public. His son and successor, [[Caracalla]], a great admirer, visited the tomb during his own reign. After this, details on the fate of the tomb are hazy.\u003cref name=\"sarco2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-The so-called \"[[Alexander Sarcophagus]]\", discovered near [[Sidon]] and now in the [[Istanbul Archaeology Museum]], is so named not because it was thought to have contained Alexander's remains, but because its [[bas-relief]]s depict Alexander and his companions fighting the Persians and hunting. It was originally thought to have been the sarcophagus of [[Abdalonymus]] (died 311 BC), the king of Sidon appointed by Alexander immediately following the [[battle of Issus]] in 331.\u003cref\u003e{{harvnb|Studniczka|1894|pp=226ff}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last=Bieber |first=M |title=The Portraits of Alexander |journal=Greece & Rome |series=Second Series |year=1965 |pages=183\u201388 |volume=12 |issue=2 |doi=10.1017\u002fs0017383500015345|s2cid=163858858 }}\u003c\u002fref\u003e However, in 1969, it was suggested by [[Karl Schefold]] that it may date from earlier than Abdalonymus's death.\u003cref\u003e{{cite journal |last=Sismondo Ridgway |first=Brunilde |year=1969 |title=Review: Der Alexander-Sarkophag by Karl Schefold |journal=[[American Journal of Archaeology]] |volume=73 |page=482 |doi=10.2307\u002f504019 | url=https:\u002f\u002frepository.brynmawr.edu\u002fcgi\u002fviewcontent.cgi?article=1006&context=arch_pubs| jstor=504019}}\u003c\u002fref\u003e\u003cbr\u003e+The so-called \"[[Alexander Sarcophagus]]\", discovered near [[Sidon]] and now in the [[Istanbul Archaeology Museum]], is so named not because it was thought to have contained Alexander's remains, but because its [[bas-relief]]s depict Alexander and his companions fighting the Persians and hunting. It was originally thought to have been the sarcophagus of [[Abdalonymus]] (died 311 BC), the king of Sidon appointed by Alexander immediately following the [[Battle of Issus]] in 332.\u003cref\u003e{{harvnb|Studniczka|1894|pp=226ff}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last=Bieber |first=M |title=The Portraits of Alexander |journal=Greece & Rome |series=Second Series |year=1965 |pages=183\u201388 |volume=12 |issue=2 |doi=10.1017\u002fs0017383500015345|s2cid=163858858 }}\u003c\u002fref\u003e However, in 1969, it was suggested by [[Karl Schefold]] that it may date from earlier than Abdalonymus's death.\u003cref\u003e{{cite journal |last=Sismondo Ridgway |first=Brunilde |year=1969 |title=Review: Der Alexander-Sarkophag by Karl Schefold |journal=[[American Journal of Archaeology]] |volume=73 |page=482 |doi=10.2307\u002f504019 | url=https:\u002f\u002frepository.brynmawr.edu\u002fcgi\u002fviewcontent.cgi?article=1006&context=arch_pubs| jstor=504019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Demades]] likened the Macedonian army, after the death of Alexander, to the blinded [[Cyclops]] due to the many random and disorderly movements that it made.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:2008.01.0045:chapter=1:section=4|title=Plutarch, Galba, chapter 1, section 4|website=perseus.tufts.edu|access-date=20 February 2021|archive-date=27 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210227032246\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A2008.01.0045%3Achapter%3D1%3Asection%3D4|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:2008.01.0116:chapter=1:section=4|title=Plutarch, Galba, c  * {{cite book |last=Starr |first=Chester G. |year=1991 |title=A History of the Ancient World |publisher=Oxford University Press |location=New York |isbn=978-0-19-506628-9 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=bA3kgtZU1iMC |access-date=3 October 2020}}\u003cbr\u003e * {{cite book |last=Stoneman |first=Richard |title=Alexander the Great |url=https:\u002f\u002farchive.org\u002fdetails\u002falexandergreat0000ston |url-access=registration |publisher=Routledge |isbn=978-0-415-31932-4 |year=2004}}\u003cbr\u003e * {{cite book |last=Stoneman |first=Richard |title=The Novel in the Ancient World |url=https:\u002f\u002farchive.org\u002fdetails\u002fnovelancientworl00schm |url-access=limited |editor-last=Schmeling |editor-first=Gareth L |chapter=The Metamorphoses of Alexander Romance |pages=[https:\u002f\u002farchive.org\u002fdetails\u002fnovelancientworl00schm\u002fpage\u002fn602 601]\u201312 |publisher=Brill |year=1996 |isbn=978-90-04-09630-1}}\u003cbr\u003e-* {{cite journal |last=Studniczka |first=Franz |title=[unknown] |journal={{ill|Jahrbuch des Deutschen Arch\u00e4ologischen Instituts|de}} |volume=9 |year=1894}}\u003cbr\u003e+* {{cite journal |last=Studniczka |first=Franz |title=\u003cbr\u003e+\u00dcber die Grundlagen der geschichtlichen Erkl\u00e4rung der Sidonischen Sarkophage |journal={{ill|Jahrbuch des Deutschen Arch\u00e4ologischen Instituts|de}} |pages=204\u2013244 |volume=9 |year=1894}}\u003cbr\u003e * {{cite book |last=Tripathi |first=Rama Shankar |title=History of Ancient India |year=1999 |publisher=Motilal Banarsidass Publ. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=WbrcVcT-GbUC |isbn=978-81-208-0018-2 |access-date=5 September 2020}}\u003cbr\u003e * {{cite book |last=Toynbee |first=Arnold Joseph |year=1981 |title=The Greeks and Their Heritages |publisher=Oxford University Press |location=Oxford |isbn=978-0-19-215256-5 |url=https:\u002f\u002farchive.org\u002fdetails\u002fgreekstheirheri00toyn |url-access=registration}}\u003cbr\u003e * {{cite book |last=Wood |first=Michael |year=2001 |title=In the Footsteps of Alexander the Great: A Journey from Greece to Asia |publisher=University of California Press |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=5wDWn1dL6HMC |isbn=978-0-520-23192-4 |access-date=5 September 2020}}","--- Revision 47\u003cbr\u003e+++ Revision 48\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Al\u00e9xandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e+'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Al\u00e9xandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting [[Wars of Alexander the Great|a lengthy military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Until the age of 16, Alexander was tutored by [[Aristotle]]. In 335 BC, shortly after his assumption of kingship over Macedon, he [[Alexander's Balkan campaign|campaigned in the Balkans]] and reasserted control over [[Thrace]] and parts of [[Illyria]] before marching on the city of [[Thebes, Greece|Thebes]], which was [[Battle of Thebes|subsequently destroyed in battle]]. Alexander then led the [[League of Corinth]], and used his authority to launch the [[Greek nationalism#History|pan-Hellenic project]] envisaged by his father, assuming leadership over all [[Greeks]] in their conquest of [[Greater Iran|Persia]].{{sfn|Heckel|Tritle|2009|p=99}}\u003cref\u003e{{cite book |l iteration|egy|\u1e6fm\ua723-\ua725}}|{{transliteration|egy|Tjema'a}}|The sturdy-armed one}} {{Infobox pharaoh\u002fSerekh |Horus=\u003chiero\u003eT:mA-a\u003c\u002fhiero\u003e}} |nebty={{ubl|{{transliteration|egy|m\ua723j wr-p\u1e25ty j\u1e6f \u1e0fww t\ua723w \u1e2b\ua723swt}}|{{transliteration|egy|Mai werpehty itj dju tau khasut}}|The lion, great of might, who takes possession of mountains, lands, and deserts}} |nebty_hiero=\u003chiero\u003eE23-wr:r-F9:F9-V15-N25:N25:N33-N17:N17:N33-N25:N25:N33\u003c\u002fhiero\u003e |golden={{ubl|{{transliteration|egy|k\ua723 (n\u1e2bt) \u1e2bwj b\ua723\u1e33(t) \u1e25\u1e33\ua723 w\ua723\u1e0f(-wr) \u0161nw n jtn}}|{{transliteration|egy|Ka (nakht) khui baq(et) heqa wadj(wer) shenu en Aten}}|The (strong) bull who protects Egypt, the ruler of the sea and of what the sun encircles}} |golden_hiero=\u003chiero\u003eE1:n-i-w*x-D40-q:t-b-\u003c\u002fhiero\u003e{{pb}}\u003chiero\u003eD10-HqA-M14-N35A-V9:Z1-i-t:n:HASH\u003c\u002fhiero\u003e |prenomen={{ubl|{{transliteration|egy|stp.n-r\ua725 mrj-jmn}}|{{transliteration|egy|Setepenre meryamun}}|Chosen by Ra, beloved by Amun{{pb}}{{Infobox pharaoh\u002fPrenomen |Prenomen=\u003chiero\u003eC2\\-C12-stp:n:N36\u003c\u002fhiero\u003e}}{{pb}}{{Infobox pharaoh\u002fPrenomen |Prenomen=\u003chiero\u003emr\\-C12\\-C2-stp:n\u003c\u002fhiero\u003e}}}}}}\u003cbr\u003e+| successor3   = {{plainlist|\u003cbr\u003e+* Alexander IV\u003cbr\u003e+* Philip III}}\u003cbr\u003e | succession4  = [[King of Persia]]\u003cbr\u003e | reign4       = 330\u2013323 BC\u003cbr\u003e | predecessor4 = Darius III\u003cbr\u003e-| successor4   = Philip III\u003cbr\u003e+| successor4   = {{plainlist|\u003cbr\u003e+* Alexander IV\u003cbr\u003e+* Philip III}}\u003cbr\u003e | full name    = \u003cbr\u003e | spouse       = {{hlist|[[Roxana]]|[[Stateira (wife of Alexander the Great)|Stateira]]|[[Parysatis II|Parysatis]]\u003cbr\u003e }}\u003cbr\u003e@@ -47,7 +51,7 @@\u003cbr\u003e | death_place  = [[Babylon]], Macedon\u003cbr\u003e | religion     = [[Ancient Greek religion]]\u003cbr\u003e }}\u003cbr\u003e-'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2#Ancient Greek|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Al\u00e9xandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting [[Wars of Alexander the Great|a lengthy military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk\u002fpage\u002fn19 |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e+'''Alexander III of Macedon''' ({{langx|grc|[[wikt:\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2|\u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2]]|Alexandros}}; 20\u002f21 July 356 BC \u2013 10\u002f11 June 323 BC), most commonly known as '''Alexander the Great''',{{Cref2|c}} was a king of the [[Ancient Greece|ancient Greek]] kingdom of [[Macedonia (ancient kingdom)|Macedon]].{{Cref2|d}} He succeeded his father [[Philip II of Macedon|Philip II]] to the throne in 336 BC at the age of 20 and spent most of his ruling years conducting a lengthy [[military campaign]] throughout [[West Asia|Western Asia]], [[Central Asia]], parts of [[South Asia]], and [[ancient Egypt|Egypt]]. By the age of 30, he had created one of the [[List of largest empires|largest empires]] in history, stretching from [[History of Greece|Greece]] to northwestern [[India (Herodotus)|India]].\u003cref\u003eBloom, Jonathan M.; Blair, Sheila S. (2009), ''The Grove Encyclopedia of Islamic Art and Architecture: Mosul to Zirid, Volume 3''. (Oxford University Press Incorporated, 2009), 385; \"[Khojand, Tajikistan]; As the easternmost outpost of the empire of Alexander the Great, the city was renamed Alexandria Eschate (\"furthest Alexandria\") in 329 BCE.\"{{pb}}Golden, Peter B. ''Central Asia in World History'' (Oxford University Press, 2011), 25;\"[...] his campaigns in Central Asia brought Khwarazm, Sogdia, and Bactria under Graeco-Macedonian rule. As elsewhere, Alexander founded or renamed a number of cities, such as Alexandria Eschate (\"Outernmost Alexandria,\" near modern Khojent in Tajikistan).\"\u003c\u002fref\u003e He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.{{Sfn |Yenne|2010 | page = 159}}\u003cref name=\":8\"\u003e{{Cite book |last=Grant |first=R.G. |url=https:\u002f\u002farchive.org\u002fdetails\u002fepdf.pub_commanders-rg-grant-dk |title=Commanders: History's Greatest Military Leaders |publisher=DK Publishing |year=2011 |isbn=978-1-4053-3696-3 |pages=18}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Beaton |first=Roderick |author-link=Roderick Beaton |title=The Greeks: A Global History |publisher=Basic Books |year=2021 |isbn=9781541618299 |edition=1st |location=New York |pages=163}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Until the age of 16, Alexander was tutored by [[Aristotle]]. In 335 BC, shortly after his assumption of kingship over Macedon, he [[Alexander's Balkan campaign|campaigned in the Balkans]] and reasserted control over [[Thrace]] and parts of [[Illyria]] before marching on the city of [[Thebes, Greece|Thebes]], which was [[Battle of Thebes|subsequently destroyed in battle]]. Alexander then led the [[League of Corinth]], and used his authority to launch the [[Greek nationalism#History|pan-Hellenic project]] envisaged by his father, assuming leadership over all [[Greeks]] in their conquest of [[Greater Iran|Persia]].{{sfn|Heckel|Tritle|2009|p=99}}\u003cref\u003e{{cite book |last1=Burger |first1=Michael |title=The Shaping of Western Civilization: From Antiquity to the Enlightenment |date=2008 |publisher=University of Toronto Press |isbn=978-1-55111-432-3 |page=76}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -64,7 +68,7 @@\u003cbr\u003e ===Lineage and childhood===\u003cbr\u003e \u003cbr\u003e [[File:Archaeological Site of Pella by Joy of Museums.jpg|thumb|upright=1.2|Archaeological site of [[Pella]], Greece, Alexander's birthplace]]\u003cbr\u003e-Alexander III was born in [[Pella]], the capital of the [[Kingdom of Macedon]],\u003cref\u003e{{cite book |last=Green |first=Peter |title=Alexander of Macedon, 356\u2013323 B.C.: a historical biography |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=g6Wl4AKGQkIC&pg=PA559 |page=xxxiii |year=1970 |series=Hellenistic culture and society |edition=illustrated, revised reprint |publisher=University of California Press |isbn=978-0-520-07165-0 |quote=356 \u2013 Alexander born in Pella. The exact date is not known, but probably either 20 or 26 July. |access-date=20 June 2015}}\u003c\u002fref\u003e on the sixth day of the [[Ancient Greek calendars|ancient Greek month]] of [[Hekatombaion]], which probably corresponds to 20 July 356 BC (although the exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biography |url=https:\u002f\u002farchive.org\u002fdetails\u002fcu31924028251217\u002fpage\u002fn321\u002fmode\u002f2up?view=theater |location=New York |publisher=Charles Scribner's Sons |pages=286\u2013287 |access-date=9 November 2021}}\u003c\u002fref\u003e He was the son of the king of Macedon, [[Philip II of Macedon|Philip II]], and his fourth wife, [[Olympias]] (daughter of [[Neoptolemus I of Epirus|Neoptolemus I]], king of [[Epirus (ancient state)|Epirus]]).\u003cref\u003e{{harvnb|McCarty|2004|p=10}}, {{harvnb|Renault|2001|p=28}}, {{harvnb|Durant|1966|p=538}}\u003c\u002fref\u003e{{Cref2|g}} Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.{{sfn|Roisman|Worthington|2010|p=171}}[[File:Coin olympias mus theski.JPG|left|thumb|155px|Roman medallion depicting [[Olympias]], Alexander's mother]]Several legends surround Alexander's birth and childhood.{{sfn|Roisman|Worthington|2010|p=188}} According to the [[Ancient Greeks|ancient Greek]] biographer [[Plutarch]], on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a [[Seal (emblem)|seal]] engraved with a lion's image.\u003cref name=\"PA2\" \u002f\u003e Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was [[Zeus]]. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious.\u003cref name=\"PA2\" \u002f\u003e\u003cbr\u003e+Alexander III was born in [[Pella]], the capital of the [[Kingdom of Macedon]],\u003cref\u003e{{cite book |last=Green |first=Peter |title=Alexander of Macedon, 356\u2013323 B.C.: a historical biography |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=g6Wl4AKGQkIC&pg=PA559 |page=xxxiii |year=1970 |series=Hellenistic culture and society |edition=illustrated, revised reprint |publisher=University of California Press |isbn=978-0-520-07165-0 |quote=356 \u2013 Alexander born in Pella. The exact date is not known, but probably either 20 or 26 July. |access-date=20 June 2015}}\u003c\u002fref\u003e on the sixth day of the [[Ancient Greek calendars|ancient Greek month]] of [[Hekatombaion]], which probably corresponds to 20 July 356 BC (although the exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biography |url=https:\u002f\u002farchive.org\u002fdetails\u002fcu31924028251217\u002fpage\u002fn321\u002fmode\u002f2up?view=theater |location=New York |publisher=Charles Scribner's Sons |pages=286\u2013287 |access-date=9 November 2021}}\u003c\u002fref\u003e He was the son of the erstwhile king of Macedon, [[Philip II of Macedon|Philip II]], and his fourth wife, [[Olympias]] (daughter of [[Neoptolemus I of Epirus|Neoptolemus I]], king of [[Epirus (ancient state)|Epirus]]).\u003cref\u003e{{harvnb|McCarty|2004|p=10}}, {{harvnb|Renault|2001|p=28}}, {{harvnb|Durant|1966|p=538}}\u003c\u002fref\u003e{{Cref2|g}} Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.{{sfn|Roisman|Worthington|2010|p=171}}[[File:Coin olympias mus theski.JPG|left|thumb|155px|Roman medallion depicting [[Olympias]], Alexander's mother]]Several legends surround Alexander's birth and childhood.{{sfn|Roisman|Worthington|2010|p=188}} According to the [[Ancient Greeks|ancient Greek]] biographer [[Plutarch]], on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a [[Seal (emblem)|seal]] engraved with a lion's image.\u003cref name=\"PA2\" \u002f\u003e Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was [[Zeus]]. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious.\u003cref name=\"PA2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e On the day Alexander was born, Philip was preparing a [[siege]] on the city of [[Potidea]] on the peninsula of [[Chalcidice]]. That same day, Philip received news that his general [[Parmenion]] had defeated the combined [[Illyria]]n and [[Paeonian]] armies and that his horses had won at the [[Ancient Olympic Games|Olympic Games]]. It was also said that on this day, the [[Temple of Artemis]] in [[Ephesus]], one of the [[Seven Wonders of the Ancient World|Seven Wonders of the World]], burnt down. This led [[Hegesias of Magnesia]] to say that it had burnt down because [[Artemis]] was away, attending the birth of Alexander.\u003cref\u003e{{harvnb|Renault|2001|p=28}}, {{harvnb|Bose|2003|p=21}}\u003c\u002fref\u003e Such legends may have emerged when Alexander was king, and possibly at his instigation, to show that he was superhuman and destined for greatness from conception.{{sfn|Roisman|Worthington|2010|p=188}}\u003cbr\u003e \u003cbr\u003e@@ -112,7 +116,7 @@\u003cbr\u003e {{Further|Government of Macedonia (ancient kingdom)}}\u003cbr\u003e [[File:Pausanius assassinates Philip during the procession into the theatre by Andre Castaigne (1898-1899).jpg|thumb|upright=1|Pausanias assassinates Philip II, Alexander's father, during his procession into the theatre]]\u003cbr\u003e \u003cbr\u003e-In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=21 December 1992 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started on 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]],{{Cref2|h}} who, according to [[Diodorus]], was also his lover.\u003cref\u003ePhilip and Pausanias: a deadly love in Macedonian Politics, ''The Classical Quarterly'', 62.1 pp423-439 (2012); [https:\u002f\u002fwww.cambridge.org\u002fcore\u002fjournals\u002fclassical-quarterly\u002farticle\u002fabs\u002fphilip-and-pausanias-a-deadly-love-in-macedonian-politics\u002fE15C00FFA970BF2D30DA39EE1D919FDF]\u003c\u002fref\u003e As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e+In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=1992-12-21 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started in 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]].{{Cref2|h}} As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Consolidation of power===\u003cbr\u003e Alexander began his reign by eliminating potential rivals to the throne. He had his cousin, the former [[Amyntas IV]], executed.{{sfn|Roisman|Worthington|2010|p=190}} He also had two Macedonian princes from the region of [[Lyncestis]] killed for having been involved in his father's assassination, but spared a third, [[Alexander Lyncestes]]. Olympias had Cleopatra Eurydice, and Europa, her daughter by Philip, burned alive. When Alexander learned about this, he was furious. Alexander also ordered the murder of Attalus,{{sfn|Roisman|Worthington|2010|p=190}} who was in command of the advance guard of the army in Asia Minor and Cleopatra's uncle.\u003cref name=\"Green 2007 5\u20136\"\u003e{{harvnb|Green|2007|pp=5\u20136}}\u003c\u002fref\u003e\u003cbr\u003e@@ -136,10 +140,6 @@\u003cbr\u003e \u003cbr\u003e ==Conquest of the Achaemenid Persian Empire==\u003cbr\u003e {{Main|Wars of Alexander the Great|Chronology of the expedition of Alexander the Great into Asia}}\u003cbr\u003e-\u003cbr\u003e-===Strategy===\u003cbr\u003e-{{Main|Military tactics of Alexander the Great#Grand strategy}}\u003cbr\u003e-Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed  by \"the chain of logic that connects operations into a single whole.\" In his book ''Strategy'', Soviet military officer and theorist [[Alexander Svechin]] delineates Alexander's strategic steps. After securing his Greek base and the Balkans by subjugating his political opponents, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander, moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"\u003cref name=svechin\u003e{{cite book |last= Svechin|first=Alexander |author-link=Alexander Svechin|date=1991|orig-date=1927|editor-last=Lee|editor-first=Kent D.|title=Strategy|publisher=East View Information Services|page=263 |chapter=Combining Operations for Achieving the ultimate Goal of the War|isbn=1-879944-33-2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Asia Minor===\u003cbr\u003e {{Further|Battle of the Granicus|Siege of Halicarnassus|Siege of Miletus}}\u003cbr\u003e@@ -386,10 +386,10 @@\u003cbr\u003e {{Main|Death of Alexander the Great}}\u003cbr\u003e [[File:Babylonian astronomical diary recording the death of Alexander the Great (British Museum).jpg|thumb|A [[Babylonian astronomical diary]] (c.&nbsp;323\u2013322&nbsp;BC) recording the death of Alexander ([[British Museum]], London)]]\u003cbr\u003e \u003cbr\u003e-On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=5 November 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-Given the propensity of the Macedonian aristocracy to assassination and Alexander's relatively young age,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e-The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 [[BBC]] documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e\u003cbr\u003e+On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=Nov 5, 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Given the propensity of the Macedonian aristocracy to assassination,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e+The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 BBC documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Several [[natural causes]] (diseases) have been suggested, including [[malaria]] and [[typhoid fever]]. A 1998 article in the ''[[New England Journal of Medicine]]'' attributed his death to typhoid fever complicated by [[bowel perforation]] and ascending [[paralysis]].\u003cref name=\"AMD\" \u002f\u003e A 2004 analysis suggested pyogenic (infectious) [[spondylitis]] or [[meningitis]].\u003cref name=\"ashrafian\" \u002f\u003e Other illnesses fit the symptoms, including [[acute pancreatitis]], [[West Nile virus]],\u003cref name=\"ref1\" \u002f\u003e\u003cref\u003e{{cite journal |last=Sbarounis |first=CN |title=Did Alexander the Great die of acute pancreatitis? |journal=J Clin Gastroenterol |volume=24 |pages=294\u201396 |year=2007 |doi=10.1097\u002f00004836-199706000-00031 |pmid=9252868 |issue=4}}\u003c\u002fref\u003e and [[Guillain-Barr\u00e9 syndrome]].\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|title=Why Alexander the Great May Have Been Declared Dead Prematurely (It's Pretty Gruesome)|author=Owen Jarus|website=[[Live Science]]|date=4 February 2019|access-date=3 November 2021|archive-date=27 July 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210727002144\u002fhttps:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|url-status=live}}\u003c\u002fref\u003e Natural-cause theories also tend to emphasize that Alexander's health may have been in general decline after years of heavy drinking and severe wounds. The anguish that Alexander felt after Hephaestion's death may also have contributed to his declining health.\u003cref name=\"AMD\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -403,7 +403,7 @@\u003cbr\u003e [[File:Alexander Sarcophagus Battle of Issus.jpg|thumb|Detail of Alexander on the [[Alexander Sarcophagus]]]]\u003cbr\u003e [[Pompey]], [[Julius Caesar]] and [[Augustus]] all visited the tomb in Alexandria where Augustus, allegedly, accidentally knocked the nose of Alexander's mummified body off. [[Caligula]] was said to have taken Alexander's breastplate from the tomb for his own use. Around AD 200, Emperor [[Septimius Severus]] closed Alexander's tomb to the public. His son and successor, [[Caracalla]], a great admirer, visited the tomb during his own reign. After this, details on the fate of the tomb are hazy.\u003cref name=\"sarco2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-The so-called \"[[Alexander Sarcophagus]]\", discovered near [[Sidon]] and now in the [[Istanbul Archaeology Museum]], is so named not because it was thought to have contained Alexander's remains, but because its [[bas-relief]]s depict Alexander and his companions fighting the Persians and hunting. It was originally thought to have been the sarcophagus of [[Abdalonymus]] (died 311 BC), the king of Sidon appointed by Alexander immediately following the [[Battle of Issus]] in 332.\u003cref\u003e{{harvnb|Studniczka|1894|pp=226ff}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last=Bieber |first=M |title=The Portraits of Alexander |journal=Greece & Rome |series=Second Series |year=1965 |pages=183\u201388 |volume=12 |issue=2 |doi=10.1017\u002fs0017383500015345|s2cid=163858858 }}\u003c\u002fref\u003e However, in 1969, it was suggested by [[Karl Schefold]] that it may date from earlier than Abdalonymus's death.\u003cref\u003e{{cite journal |last=Sismondo Ridgway |first=Brunilde |year=1969 |title=Review: Der Alexander-Sarkophag by Karl Schefold |journal=[[American Journal of Archaeology]] |volume=73 |page=482 |doi=10.2307\u002f504019 | url=https:\u002f\u002frepository.brynmawr.edu\u002fcgi\u002fviewcontent.cgi?article=1006&context=arch_pubs| jstor=504019}}\u003c\u002fref\u003e\u003cbr\u003e+The so-called \"[[Alexander Sarcophagus]]\", discovered near [[Sidon]] and now in the [[Istanbul Archaeology Museum]], is so named not because it was thought to have contained Alexander's remains, but because its [[bas-relief]]s depict Alexander and his companions fighting the Persians and hunting. It was originally thought to have been the sarcophagus of [[Abdalonymus]] (died 311 BC), the king of Sidon appointed by Alexander immediately following the [[battle of Issus]] in 331.\u003cref\u003e{{harvnb|Studniczka|1894|pp=226ff}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last=Bieber |first=M |title=The Portraits of Alexander |journal=Greece & Rome |series=Second Series |year=1965 |pages=183\u201388 |volume=12 |issue=2 |doi=10.1017\u002fs0017383500015345|s2cid=163858858 }}\u003c\u002fref\u003e However, in 1969, it was suggested by [[Karl Schefold]] that it may date from earlier than Abdalonymus's death.\u003cref\u003e{{cite journal |last=Sismondo Ridgway |first=Brunilde |year=1969 |title=Review: Der Alexander-Sarkophag by Karl Schefold |journal=[[American Journal of Archaeology]] |volume=73 |page=482 |doi=10.2307\u002f504019 | url=https:\u002f\u002frepository.brynmawr.edu\u002fcgi\u002fviewcontent.cgi?article=1006&context=arch_pubs| jstor=504019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Demades]] likened the Macedonian army, after the death of Alexander, to the blinded [[Cyclops]] due to the many random and disorderly movements that it made.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:2008.01.0045:chapter=1:section=4|title=Plutarch, Galba, chapter 1, section 4|website=perseus.tufts.edu|access-date=20 February 2021|archive-date=27 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210227032246\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A2008.01.0045%3Achapter%3D1%3Asection%3D4|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:2008.01.0116:chapter=1:section=4|title=Plutarch, Galba, chapter 1, section 4|website=perseus.tufts.edu|access-date=20 February 2021|archive-date=24 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210224185759\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A2008.01.0116%3Achapter%3D1%3Asection%3D4|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:2008.01.0191:chapter=27|title=Plutarch, Regum et imperatorum apophthegmata, \u1f08\u03bb\u03ad\u03be\u03b1\u03bd\u03b4\u03c1\u03bf\u03c2|website=perseus.tufts.edu|access-date=20 February 2021|archive-date=24 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210224161752\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A2008.01.0191%3Achapter%3D27|url-status=live}}\u003c\u002fref\u003e In addition, Leosthenes also likened the anarchy between the generals, after Alexander's death, to the blinded Cyclops \"who after he had lost his eye went feeling and groping about with his hands before him, not knowing where to lay them\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=urn:cts:greekLit:tlg0007.tlg087.perseus-grc1:2.4|title=Plutarch, De Alexandri magni fortuna aut virtute, chapter 2, section 4|website=perseus.tufts.edu|access-date=20 February 2021|archive-date=24 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210224150622\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=urn:cts:greekLit:tlg0007.tlg087.perseus-grc1:2.4|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -411,7 +411,7 @@\u003cbr\u003e {{Main|Partition of Babylon|Diadochi}}\u003cbr\u003e [[File:Diadochi EN.png|thumb|upright=1.25|Kingdoms of the [[Diadochi]] in 301&nbsp;BC: the [[Ptolemaic Kingdom]] (dark blue), the [[Seleucid Empire]] (yellow), [[Lysimachus|Kingdom of Lysimachus]] (orange), and [[Kingdom of Macedon]] (green). Also shown are the [[Roman Republic]] (light blue), the [[Carthaginian Republic]] (purple), and the [[Kingdom of Epirus]] (red).]]\u003cbr\u003e \u003cbr\u003e-Alexander's death was so sudden that when reports of his death reached Greece, they were not immediately believed.\u003cref name=\"Roisman 2010 199\" \u002f\u003e Alexander had no obvious or legitimate heir, his son Alexander IV by Roxane being born after Alexander's death.{{sfn|Green|2007|pp=24\u201326}} According to Diodorus, Alexander's companions asked him on his deathbed to whom he bequeathed his kingdom; his laconic reply was \"t\u00f4i kratist\u00f4i\"\u2014\"to the strongest\".\u003cref name=\"DSXVII117\" \u002f\u003e Another theory is that his successors wilfully or erroneously misheard \"t\u00f4i Krater\u00f4i\"\u2014\"to Craterus\", the general leading his Macedonian troops home and newly entrusted with the regency of Macedonia.\u003cref name=Shipley\u003e{{cite book |title=The Greek World After Alexander 323\u201330 BC |author=Graham Shipley |page=40 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=sAoiAwAAQBAJ&pg=PA40 |isbn=978-1-134-06531-8 |date=2014 |publisher=Routledge |access-date=9 November 2017}}\u003c\u002fref\u003e Arrian and Plutarch claimed that Alexander was speechless by this time, implying that this was an apocryphal story.\u003cref\u003e{{harvnb|Green|2007|p=20}}\u003c\u002fref\u003e Diodorus, Curtius and Justin offered the more plausible story that Alexander passed his [[Seal (emblem)|signet ring]] to [[Perdiccas]], a bodyguard and leader of the companion cavalry, in front of witnesses, thereby nominating him.\u003cref name=\"DSXVII117\" \u002f\u003e{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e+Alexander's death was so sudden that when reports of his death reached Greece, they were not immediately believed.\u003cref name=\"Roisman 2010 199\" \u002f\u003e Alexander had no obvious or legitimate heir, his son Alexander IV by Roxane being born after Alexander's death.{{sfn|Green|2007|pp=24\u201326}} According to Diodorus, Alexander's companions asked him on his deathbed to whom he bequeathed his kingdom; his laconic reply was \"t\u00f4i kratist\u00f4i\"\u2014\"to the strongest\".\u003cref name=\"DSXVII117\" \u002f\u003e Another theory is that his successors wilfully or erroneously misheard \"t\u00f4i Krater\u00f4i\"\u2014\"to Craterus\", the general leading his Macedonian troops home and newly entrusted with the regency of Macedonia.\u003cref name=Shipley\u003e{{cite book |title=The Greek World After Alexander 323\u201330 BC |author=Graham Shipley |page=40 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=sAoiAwAAQBAJ&pg=PA40 |isbn=978-1-134-06531-8 |date=2014 |publisher=Routledge |access-date=9 November 2017}}\u003c\u002fref\u003e Arrian and Plutarch claimed that Alexander was speechless by this time, implying that this was an apocryphal story.\u003cref\u003e{{harvnb|Green|2007|p=20}}\u003c\u002fref\u003e Diodorus, Curtius and Justin offered the more plausible story that Alexander passed his [[Seal (device)|signet ring]] to [[Perdiccas]], a bodyguard and leader of the companion cavalry, in front of witnesses, thereby nominating him.\u003cref name=\"DSXVII117\" \u002f\u003e{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e Perdiccas initially did not claim power, instead suggesting that Roxane's baby would be king, if male, with himself, [[Craterus]], Leonnatus, and Antipater as guardians. However, the infantry, under the command of [[Meleager (general)|Meleager]], rejected this arrangement since they had been excluded from the discussion. Instead, they supported Alexander's half-brother Philip Arrhidaeus. Eventually, the two sides reconciled, and after the birth of Alexander IV, he and Philip III were appointed joint kings, albeit in name only.{{sfn|Green|2007|pp=26\u201329}} Dissension and rivalry soon affected the Macedonians. The satrapies handed out by Perdiccas at the [[Partition of Babylon]] became power bases each general used to bid for power. After the assassination of Perdiccas in 321&nbsp;BC, Macedonian unity collapsed, and 40&nbsp;years of war between \"The Successors\" (''[[Diadochi]]'') ensued before the Hellenistic world settled into three stable power blocs: [[Ptolemaic Egypt]], [[Seleucid Empire|Seleucid Syria and East]], and [[Antigonid dynasty|Antigonid Macedonia]]. In the process, both Alexander IV and Philip III were murdered.{{sfn|Green|2007|pp=29\u201334}}\u003cbr\u003e \u003cbr\u003e@@ -445,23 +445,22 @@\u003cbr\u003e At Issus in 333 BC, his first confrontation with Darius, he used the same deployment, and again the central phalanx pushed through.{{sfn|Morkot|1996|p=122}} Alexander personally led the charge in the center, routing the opposing army.{{sfn|Roisman|Worthington|2010|p=193}} At the decisive encounter with Darius at Gaugamela, Darius equipped his chariots with scythes on the wheels to break up the phalanx and equipped his cavalry with pikes. Alexander arranged a double phalanx, with the center advancing at an angle, parting when the chariots bore down and then reforming. The advance was successful and broke Darius's center, causing the latter to flee once again.{{sfn|Morkot|1996|p=122}}\u003cbr\u003e \u003cbr\u003e When faced with opponents who used unfamiliar fighting techniques, such as in Central Asia and India, Alexander adapted his forces to his opponents' style. Thus, in [[Bactria]] and [[Sogdiana]], Alexander successfully used his javelin throwers and archers to prevent outflanking movements, while massing his cavalry at the center.{{sfn|Roisman|Worthington|2010|p=193}} In India, confronted by Porus's elephant corps, the Macedonians opened their ranks to envelop the elephants and used their sarissas to strike upwards and dislodge the elephants' handlers.\u003cref name = \"Roisman 2010 194\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e ===Physical appearance===\u003cbr\u003e \u003cbr\u003e [[File:AlexanderCameo.JPG|thumb|left|Alexander [[Cameo_(carving)|cameo]] by [[Pyrgoteles]]|upright=.9]]\u003cbr\u003e-Historical sources frequently give conflicting accounts of Alexander's appearance, and the earliest sources are the most scant in their detail;\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=72}}\u003c\u002fref\u003e for example, Arrian describes him simply as \"very handsome\".\u003cref\u003e{{harvnb|Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e During his lifetime, Alexander carefully curated his image by commissioning works from famous and great artists of the time. This included commissioning sculptures by [[Lysippos]], paintings by [[Apelles]] and gem engravings by [[Pyrgoteles]].\u003cref name=\"Alexander the Great\"\u003e{{cite book |last1=Nawotka |first1=Krzysztof |title=Alexander the Great |date=2010 |publisher=Cambridge Scholars Publishing |page=43}}\u003c\u002fref\u003e Ancient authors recorded that Alexander was so pleased with portraits of himself created by Lysippos that he forbade other sculptors from crafting his image; scholars today, however, find the claim dubious.\u003cref\u003e{{cite web |title=Images of Authority II: The Greek Example |year=2005 |publisher=SUNY Oneonta |url=http:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |access-date=16 December 2011 |archive-date=4 October 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f201810041
