27\u002fhttp:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 76\u003cbr\u003e+++ Revision 77\u003cbr\u003e@@ -8,8 +8,8 @@\u003cbr\u003e {{Infobox royalty\u003cbr\u003e | name         = Alexander the Great\u003cbr\u003e | title        = [[Basileus]]\u003cbr\u003e-| image        = Alexander the Great mosaic (cropped).jpg\u003cbr\u003e-| caption      = Alexander in the ''[[Alexander Mosaic]]''\u003cbr\u003e+| image        = Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg\u003cbr\u003e+| caption      = A Roman copy of an original 3rd century BC Greek bust depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen\u003cbr\u003e | succession   = [[King of Macedon]]\u003cbr\u003e | reign        = October 336 \u2013 June 323 BC\u003cbr\u003e | predecessor  = [[Philip II of Macedon|Philip II]]\u003cbr\u003e@@ -476,12 +476,11 @@\u003cbr\u003e \u003cbr\u003e ===Personality===\u003cbr\u003e [[File:Lion hunt mosaic from Pella.jpg|thumb|Alexander (left), wearing a ''[[kausia]]'' and fighting an [[Asiatic lion]] with his friend [[Craterus]] (detail); late 4th century BC [[mosaic]],\u003cref\u003e[[Olga Palagia]] (2000). \"Hephaestion's Pyre and the Royal Hunt of Alexander\", in A.B. Bosworth and E.J. Baynham (eds), ''Alexander the Great in Fact and Fiction''. Oxford & New York: Oxford University Press. {{ISBN|978-0-19-815287-3}}, p. 185.\u003c\u002fref\u003e [[Pella]] Museum]]\u003cbr\u003e-\u003cbr\u003e+[[File:Alexander the Great mosaic (cropped).jpg|thumb|Alexander in the ''[[Alexander Mosaic]]'']]\u003cbr\u003e Both of Alexander's parents encouraged his ambitions. His father Philip was probably Alexander's most immediate and influential role model, as the young Alexander watched him campaign practically every year, winning victory after victory while ignoring severe wounds.{{sfn|Roisman|Worthington|2010|p=190}} Alexander's relationship with his father \"forged\" the competitive side of his personality; he had a need to outdo his father, illustrated by his reckless behavior in battle.{{sfn|Green|2007|pp=15\u201316}} While Alexander worried that his father would leave him \"no great or brilliant achievement to be displayed to the world\",\u003cref name=\"PA5\"\u002f\u003e he also downplayed his father's achievements to his companions.{{sfn|Green|2007|pp=15\u201316}} Alexander's mother Olympia similarly had huge ambitions, and encouraged her son to believe it was his destiny to conquer the Persian Empire.{{sfn|Green|2007|pp=15\u201316}} She instilled a sense of destiny in him,{{sfn|Green|2007|p=4}} and Plutarch tells how his ambition \"kept his spirit serious and lofty in advance of his years\".\u003cref name=\"PA4\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e According to Plutarch, Alexander also had a violent temper and rash, impulsive nature,\u003cref name=\"AVII29\"\u002f\u003e which could influence his decision making.{{sfn|Green|2007|pp=15\u201316}} Although Alexander was stubborn and did not respond well to orders from his father, he was open to reasoned debate.\u003cref name=\"PA7\"\u002f\u003e He had a calmer side\u2014perceptive, logical, and calculating. He had a great desire for knowledge, a love for philosophy, and was an avid reader.\u003cref name=\"PA8\"\u002f\u003e This was no doubt in part due to Aristotle's tutelage; Alexander was intelligent and quick to learn.{{sfn|Green|2007|pp=15\u201316}} His intelligent and rational side was amply demonstrated by his ability and success as a general.\u003cref name=\"AVII29\"\u002f\u003e He had great self-restraint in \"pleasures of the body\", in contrast with his lack of [[self-control]] with alcohol.\u003cref name=\"AVII28\"\u003e{{harvnb | Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire after his death\u2014only Alexander had the ability to do so.{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |firs  for knowledge, a love for philosophy, and was an avid reader.\u003cref name=\"PA8\"\u002f\u003e This was no doubt in part due to Aristotle's tutelage; Alexander was intelligent and quick to learn.{{sfn|Green|2007|pp=15\u201316}} His intelligent and rational side was amply demonstrated by his ability and success as a general.\u003cref name=\"AVII29\"\u002f\u003e He had great self-restraint in \"pleasures of the body\", in contrast with his lack of [[self-control]] with alcohol.\u003cref name=\"AVII28\"\u003e{{harvnb | Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+[[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire after his death\u2014only Alexander had the ability to do so.{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. c.f. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cbr\u003e@@ -768,7 +769,7 @@\u003cbr\u003e [[File:Roman - Medallion with Alexander the Great - Walters 591 - Obverse.jpg|thumb|This medallion was produced in [[Imperial Rome]], demonstrating the influence of Alexander's memory. [[Walters Art Museum]], [[Baltimore]].]]\u003cbr\u003e Alexander and his exploits were admired by many Romans, especially generals, who wanted to associate themselves with his achievements.\u003cref name=\"Asirvatham\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 114}}\u003c\u002fref\u003e [[Polybius]] began his ''[[Histories (Polybius)|Histories]]'' by reminding Romans of Alexander's achievements, and thereafter Roman leaders saw him as a role model. [[Pompey the Great]] adopted the epithet \"Magnus\" and even Alexander's anastole-type haircut, and searched the conquered lands of the east for Alexander's 260-year-old cloak, which he then wore as a sign of greatness.\u003cref name=\"Asirvatham\" \u002f\u003e [[Julius Caesar]] dedicated a [[Lysippus|Lysippean]] [[equestrian statue|equestrian]] [[bronze]] statue, but replaced Alexander's head with his own, while [[Octavian]] visited Alexander's tomb in Alexandria and temporarily changed his seal from a [[sphinx]] to Alexander's profile.\u003cref name=\"Asirvatham\" \u002f\u003e The emperor [[Trajan]] also admired Alexander, as did [[Nero]] and [[Caracalla]].\u003cref name=\"Asirvatham\" \u002f\u003e The Macriani, a Roman family that in the person of [[Macrinus]] briefly ascended to the imperial throne, kept images of Alexander on their persons, either on jewellery or embroidered into their clothes.{{sfn|Holt|2003|p=3}}\u003cbr\u003e \u003cbr\u003e-On the other hand, some Roman writers, particularly Republican figures, used Alexander as a cautionary tale of how [[autocratic]] tendencies can be kept in check by [[Roman republic|republican]] values.\u003cref name=\"Asirvatham2\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 115}}\u003c\u002fref\u003e Alexander was used by these writers as an example of ruler values such as {{lang|la|amicitia}} (friendship) and {{lang|la|clementia}} (clemency), but also {{lang|la|iracundia}} (anger) and {{lang|la|cupiditas gloriae}} (over-desire for glory).\u003cref name=\"Asirvatham2\" \u002f\u003e\u003cbr\u003e+On the other hand, some Roman writers, particularly Republican figures, used Alexander as a cautionary tale of how [[autocratic]] tendencies can be kept in check by the values of the [[Roman Republic]].\u003cref name=\"Asirvatham2\"\u003e{{harvnb|Roisman|Worthington|2010|loc=Chapter 6, p. 115}}\u003c\u002fref\u003e Alexander was used by these writers as an example of ruler values such as {{lang|la|amicitia}} (friendship) and {{lang|la|clementia}} (clemency), but also {{lang|la|iracundia}} (anger) and {{lang|la|cupiditas gloriae}} (over-desire for glory).\u003cref name=\"Asirvatham2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e [[Emperor Julian]] in his satire called \"The Caesars\", describes a contest between the previous Roman emperors, with Alexander the Great called in as an extra contestant, in the presence of the assembled gods.\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|title=Julian: Caesars \u2013 translation|website=attalus.org|access-date=29 March 2020|archive-date=26 February 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200226035227\u002fhttp:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -819,21 +819,6 @@\u003cbr\u003e In [[Hindi]] and [[Urdu]], the name \"[[Iskandar (name)|Sikandar]]\", derived from the Persian name for Alexander, denotes a rising young talent, and the [[Delhi Sultanate]] ruler [[Alauddin Khalji]] stylized himself as \"Sikandar-i-Sani\" (the Second Alexander the Great).\u003cref\u003e{{harvnb|Connerney|2009|p=68}}\u003c\u002fref\u003e In [[medieval India]], Turkic and Afghan sovereigns from the Iranian-cultured region of Central Asia brought positive cultural connotations of Alexander to the Indian subcontinent, resulting in the efflorescence of ''Sikandernameh'' ([[Alexander Romances]]) written by Indo-Persian poets such as [[Amir Khusrau]] and the prominence of Alexander the Great as a popular subject in Mughal-era Persian miniatures.\u003cref\u003e{{Cite journal |last=Donde |first=Dipanwita |date=2014 |title=The Mughal Sikander: Influence of the Romance of Alexander on Mughal Manuscript Painting |url=https:\u002f\u002fwww.academia.edu\u002f6097802 |journal=International Conference of Greek Studies: An Asian Perspective |via=Academia |access-date=19 April 2019 |archive-date=12 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210812151906\u002fhttps:\u002f\u002fwww.academia.edu\u002f6097802 |url-status=live }}\u003c\u002fref\u003e In [[medieval Europe]], Alexander the Great was revered as a member of the [[Nine Worthies]]; a group of heroes whose lives were believed to encapsulate all the ideal qualities of [[chivalry]].\u003cref\u003e{{cite book |last1=Noll |first1=Thomas |article=The Visual Image of Alexander the Great |title=Alexander the Great in the Middle Ages: Transcultural Perspectives |editor-last=Stock |editor-first=Markus |translator-last=Boettcher |translator-first=Susan |date=2016 |publisher=University of Toronto Press |location=Toronto |isbn=978-1-4426-4466-3 |page=258 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2nqMCwAAQBAJ&pg=PA258 |access-date=21 November 2017}}\u003c\u002fref\u003e During the first [[Italian campaigns of the French Revolutionary Wars|Italian campaign of the French Revolutionary Wars]], in a question from [[Bourrienne]], asking whether he gave his preference to Alexander or Caesar, [[Napoleon]] said that he places Alexander The Great in the first rank, the main reason being his campaign on Asia.\u003cref\u003eLouis Antoine Fauvelet de Bourrienne, Memoirs of Napoleon Bonaparte, pp 158\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the ''[[Greek Anthology]]'', there are poems referring to Alexander.\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022239\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f534#9.699|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002ftopostext.org\u002fwork\u002f748#122|title=ToposText|website=topostext.org|access-date=18 August 2019|archive-date=1 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210201022206\u002fhttps:\u002f\u002ftopostext.org\u002fwork\u002f748#122|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Throughout time, art objects related to Alexander were being created. In addition to speech works, sculptures and paintings, in modern times Alexander is still the subject of musical and cinematic works. The song 'Alexander the Great' by the British heavy metal band [[Iron Maiden]] is indicative. Some films that have been shot with the theme of Alexander are:\u003cbr\u003e-* ''[[Sikandar (1941 film)|Sikandar]]'' (1941), an Indian production directed by [[Sohrab Modi]] about the conquest of India by Alexander\u003cref\u003e{{cite book|title=100 Bollywood Films|isbn=978-81-7436-990-1|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=tk5gBAAAQBAJ&q=Sikandar+1941+Prithviraj+Kapoor&pg=PT165|last1=Dwyer|first1=Rachel|date=December 2005|publisher=Roli Books |access-date=6 April 2021}}\u003c\u002fref\u003e\u003cbr\u003e-* ''[[Alexander the Great (1956 film)|Alexander the Great]]'' (1956), produced by MGM and starring [[Richard Burton]]\u003cbr\u003e-* ''Sikandar-e-Azam'' (1965), an Indian production directed by Kedar Kapoor\u003cbr\u003e-* ''[[Alexander (2004 film)|Alexander]]'' (2004), directed by [[Oliver Stone]], starring [[Colin Farrell]]\u003cbr\u003e-\u003cbr\u003e-There are also many references to other movies and TV series.\u003cbr\u003e-\u003cbr\u003e-Newer novels about Alexander are:\u003cbr\u003e-The trilogy \"Alexander the Great\" by [[Valerio Massimo Manfredi]] consisting of \"The son of the dream\", \"The sand of Amon\", and \"The ends of the world\".\u003cbr\u003e-The trilogy of [[Mary Renault]] consisting of \"[[Fire from Heaven]]\", \"[[The Persian Boy]]\" and \"[[Funeral Games (novel)|Funeral Games]]\".\u003cbr\u003e-* ''[[The Virtues of War]]'', about Alexander the Great (2004), {{ISBN|978-0-385-50099-9}} and \"* ''[[The Afghan Campaign]]'', about Alexander the Great's conquests in Afghanistan (2006), {{ISBN|978-0-385-51641-9}}\" by [[Steven Pressfield]].\u003cbr\u003e-\u003cbr\u003e-Irish playwright [[Aubrey Thomas de Vere]] wrote ''[[Alexander the Great, a Dramatic Poem]]''.\u003cbr\u003e \u003cbr\u003e ==Historiography==\u003cbr\u003e {{Main|Historiography of Alexander the Great}}","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -1071,6 +1071,7 @@\u003cbr\u003e [[Category:Ancient Pellaeans]]\u003cbr\u003e [[Category:Argead kings of Macedonia]]\u003cbr\u003e [[Category:City founders]]\u003cbr\u003e+[[Category:Characters in the Divine Comedy]]\u003cbr\u003e [[Category:Deified Greek people]]\u003cbr\u003e [[Category:Deified male monarchs]]\u003cbr\u003e [[Category:Hellenistic-era people]]","--- Revision 80\u003cbr\u003e+++ Revision 81\u003cbr\u003e@@ -394,7 +394,7 @@\u003cbr\u003e \u003cbr\u003e On either 10 or 11 June 323&nbsp;BC, Alexander died in the palace of [[Nebuchadnezzar II]], in Babylon, at age 32.\u003cref\u003e{{cite web |title=A contemporary account of the death of Alexander |url=https:\u002f\u002fwww.livius.org\u002fsources\u002fcontent\u002foriental-varia\u002fa-contemporary-account-of-the-death-of-alexander\u002f |access-date=5 November 2019 |publisher=[[Livius.org]]}}\u003c\u002fref\u003e\u003cref name=\"Depuydt\" \u002f\u003e There are two different versions of Alexander's death, differing slightly in details. Plutarch's account is that roughly 14 days before his death, Alexander entertained admiral [[Nearchus]] and spent the night and next day drinking with [[Medius of Larissa]].\u003cref name=\"P75\" \u002f\u003e Alexander developed a fever, which worsened until he was unable to speak. The common soldiers, anxious about his health, were granted the right to file past him as he silently waved at them.{{Sfn |Wood|2001|pp= 2267\u201370}} In the second account, Diodorus recounts that Alexander was struck with pain after downing a large bowl of unmixed wine in honour of Heracles followed by 11 days of weakness; he did not develop a fever, instead dying after some agony.\u003cref name=\"DSXVII117\" \u002f\u003e Arrian also mentioned this as an alternative, but Plutarch specifically denied this claim.\u003cref name=\"P75\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-Given the propensity of the Macedonian aristocracy to assassination,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e+Given the propensity of the Macedonian aristocracy to assassination and Alexander's relatively young age,{{sfn|Green|2007|pp= 1\u20132}} foul play featured in multiple accounts of his death. Diodorus, Plutarch, Arrian and [[Justin (historian)|Justin]] all mentioned the theory that Alexander was poisoned. Justin stated that Alexander was the victim of a poisoning conspiracy, Plutarch dismissed it as a fabrication,\u003cref name=\"PA77\" \u002f\u003e while both Diodorus and Arrian noted that they mentioned it only for the sake of completeness.\u003cref name=\"DSXVII117\" \u002f\u003e\u003cref name=\"AVII27\" \u002f\u003e The accounts were nevertheless fairly consistent in designating [[Antipater]], recently removed as Macedonian viceroy, replaced by Craterus, as the head of the alleged plot.\u003cref\u003e{{Cite journal |last1=Pitt |first1=E. M. |last2=Richardson |first2=W. P. |date=May 2017 |title=Hostile inaction? Antipater, Craterus and the Macedonian regency |journal=[[The Classical Quarterly]] |volume=67 |issue=1 |pages=77\u201378 |doi=10.1017\u002fS0009838817000301 |s2cid=157417151 }}\u003c\u002fref\u003e Perhaps taking his summons to Babylon as a death sentence{{sfn|Green|2007|pp=23\u201324}} and having seen the fate of Parmenion and Philotas,\u003cref name=\"DSXVII118\" \u002f\u003e Antipater purportedly arranged for Alexander to be poisoned by his son Iollas, who was Alexander's wine-pourer.\u003cref name=\"AVII27\" \u002f\u003e\u003cref name=\"DSXVII118\" \u002f\u003e There was even a suggestion that Aristotle may have participated.\u003cref name=\"AVII27\" \u002f\u003e \u003cbr\u003e The strongest argument against the poison theory is the fact that twelve days passed between the start of his illness and his death; such long-acting poisons were probably not available.{{Sfn |Lane Fox|2006|loc= chapter 32}} However, in a 2003 [[BBC]] documentary investigating the death of Alexander, Leo Schep from the New Zealand National Poisons Centre proposed that the plant white hellebore (''[[Veratrum album]]''), which was known in antiquity, may have been used to poison Alexander.\u003cref\u003e{{cite news |date=16 October 2003 |url=http:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |title=NZ scientist's detective work may reveal how Alexander died |access-date=15 January 2014 |location=Dunedin |work=The Royal Society of New Zealand |url-status = dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140116141707\u002fhttp:\u002f\u002fwww.royalsociety.org.nz\u002f2003\u002f10\u002f16\u002falexander\u002f |archive-date=16 January 2014}}\u003c\u002fref\u003e{{Sfn |Cawthorne|2004|p= 138}}\u003cref\u003e{{cite journal |last=Bursztajn |first=Harold J |title=Dead Men Talking |journal=Harvard Medical Alumni Bulletin |year=2005 |issue=Spring |url=http:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |access-date=16 December 2011 |archive-date=29 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190329124207\u002fhttp:\u002f\u002fwww.forensic-psych.com\u002farticles\u002fartDeadMenTalking.php |url-status=live }}\u003c\u002fref\u003e In a 2014 manuscript in the journal ''[[Clinical Toxicology]]'', Schep suggested Alexander's wine was spiked with ''Veratrum album'', and that this would produce poisoning symptoms that match the course of events described in the ''[[Alexander Romance]]''.\u003cref name=\"schep\"\u003e{{cite journal |vauthors=Schep LJ, Slaughter RJ, Vale JA, Wheatley P |title=Was the death of Alexander the Great due to poisoning? Was it Veratrum album? |journal=[[Clinical Toxicology]] |volume=52 |issue=1 |pages=72\u201377 |date=January 2014 |pmid=24369045 |doi=10.3109\u002f15563650.2013.870341|doi-access=free}}\u003c\u002fref\u003e ''Veratrum album'' poisoning can have a prolonged course and it was suggested that if Alexander was poisoned, ''Veratrum album'' offers the most plausible cause.\u003cref name=\"schep\" \u002f\u003e\u003cref\u003e{{cite news |last=Bennett-Smith |first=Meredith |date=14 January 2014 |url=http:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |title=Was Alexander The Great Poisoned By Toxic Wine? |access-date=15 January 2014 |work=The Huffington Post |archive-date=17 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170617050647\u002fhttp:\u002f\u002fwww.huffingtonpost.com\u002f2014\u002f01\u002f13\u002falexander-the-great-poisoned-toxic-wine_n_4591553.html |url-status=live }}\u003c\u002fref\u003e Another poisoning explanation put forward in 2010 proposed that the circumstances of his death were compatible with poisoning by water of the river Styx (modern-day [[Mavroneri]] in Arcadia, Greece) that contained [[calicheamicin]], a dangerous compound produced by bacteria.\u003cref\u003e{{cite news |last=Squires |first=Nick |date=4 August 2010 |url=https:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-url=https:\u002f\u002fghostarchive.org\u002farchive\u002f20220110\u002fhttps:\u002f\u002fwww.telegraph.co.uk\u002fnews\u002fworldnews\u002feurope\u002fgreece\u002f7924855\u002fAlexander-the-Great-poisoned-by-the-River-Styx.html |archive-date=10 January 2022 |url-access=subscription |url-status=live |title=Alexander the Great poisoned by the River Styx |access-date=12 December 2011 |location=London |work=The Daily Telegraph}}{{cbignore}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Several [[natural causes]] (diseases) have been suggested, including [[malaria]] and [[typhoid fever]]. A 1998 article in the ''[[New England Journal of Medicine]]'' attributed his death to typhoid fever complicated by [[bowel perforation]] and ascending [[paralysis]].\u003cref name=\"AMD\" \u002f\u003e A 2004 analysis suggested pyogenic (infectious) [[spondylitis]] or [[meningitis]].\u003cref name=\"ashrafian\" \u002f\u003e Other illnesses fit the symptoms, including [[acute pancreatitis]], [[West Nile virus]],\u003cref name=\"ref1\" \u002f\u003e\u003cref\u003e{{cite journal |last=Sbarounis |first=CN |title=Did Alexander the Great die of acute pancreatitis? |journal=J Clin Gastroenterol |volume=24 |pages=294\u201396 |year=2007 |doi=10.1097\u002f00004836-199706000-00031 |pmid=9252868 |issue=4}}\u003c\u002fref\u003e and [[Guillain-Barr\u00e9 syndrome]].\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|title=Why Alexander the Great May Have Been Declared Dead Prematurely (It's Pretty Gruesome)|author=Owen Jarus|website=[[Live Science]]|date=4 February 2019|access-date=3 November 2021|archive-date=27 July 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210727002144\u002fhttps:\u002f\u002fwww.livescience.com\u002f64676-alexander-the-great-declared-dead-prematurely.html|url-status=live}}\u003c\u002fref\u003e Natural-cause theories also tend to emphasize that Alexander's health may have been in general decline after years of heavy drinking and severe wounds. The anguish that Alexander felt after Hephaestion's death may also have contributed to his declining health.\u003cref name=\"AMD\" \u002f\u003e","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -482,7 +482,7 @@\u003cbr\u003e According to Plutarch, Alexander also had a violent temper and rash, impulsive nature,\u003cref name=\"AVII29\"\u002f\u003e which could influence his decision making.{{sfn|Green|2007|pp=15\u201316}} Although Alexander was stubborn and did not respond well to orders from his father, he was open to reasoned debate.\u003cref name=\"PA7\"\u002f\u003e He had a calmer side\u2014perceptive, logical, and calculating. He had a great desire for knowledge, a love for philosophy, and was an avid reader.\u003cref name=\"PA8\"\u002f\u003e This was no doubt in part due to Aristotle's tutelage; Alexander was intelligent and quick to learn.{{sfn|Green|2007|pp=15\u201316}} His intelligent and rational side was amply demonstrated by his ability and success as a general.\u003cref name=\"AVII29\"\u002f\u003e He had great self-restraint in \"pleasures of the body\", in contrast with his lack of [[self-control]] with alcohol.\u003cref name=\"AVII28\"\u003e{{harvnb | Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e-Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\ lture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are o f [[Stageira]], which Philip had razed, and to repopulate it by buying and freeing the ex-citizens who were slaves, or pardoning those who were in exile.\u003cref\u003e{{harvnb|Lane Fox|1980|pp=65\u201366}}, {{harvnb|Renault|2001|p=44}}, {{harvnb|McCarty|2004|p=15}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Mieza was like a boarding school for Alexander and the children of Macedonian nobles, such as [[Ptolemy I Soter|Ptolemy]], [[Hephaistion]], and [[Cassander]]. Many of these students would become his friends and future generals, and are often known as the \"Companions\". Aristotle taught Alexander and his companions about medicine, philosophy, morals, religion, logic, and art. Under Aristotle's tutelage, Alexander developed a passion for the works of [[Homer]], and in particular the ''[[Iliad]]''; Aristotle gave him an annotated copy, which Alexander later carried on his campaigns.\u003cref\u003e{{harvnb|Lane Fox|1980|pp=65\u201366}}, {{harvnb|Renault|2001|pp=45\u201347}}, {{harvnb|McCarty|2004|p=16}}\u003c\u002fref\u003e Alexander was able to quote [[Euripides]] from memory.\u003cref name=\"RLF\"\u003e{{cite book |last1=Lane Fox |first1=Robin |title=Alexander the Great | date=1986 |publisher=Penguin Group |isbn=978-0-14-008878-6 |page=48}}\u003c\u002fref\u003e\u003cbr\u003e+Mieza was like a boarding school for Alexander and the children of Macedonian nobles, such as [[Ptolemy I Soter|Ptolemy]], [[Hephaistion]], and [[Cassander]]. Many of these students would become his friends and future generals, and were later part of an elite cavallry formation known as the \"Companions\". Aristotle taught Alexander and his companions about medicine, philosophy, morals, religion, logic, and art. Under Aristotle's tutelage, Alexander developed a passion for the works of [[Homer]], and in particular the ''[[Iliad]]''; Aristotle gave him an annotated copy, which Alexander later carried on his campaigns.\u003cref\u003e{{harvnb|Lane Fox|1980|pp=65\u201366}}, {{harvnb|Renault|2001|pp=45\u201347}}, {{harvnb|McCarty|2004|p=16}}\u003c\u002fref\u003e Alexander was able to quote [[Euripides]] from memory.\u003cref name=\"RLF\"\u003e{{cite book |last1=Lane Fox |first1=Robin |title=Alexander the Great | date=1986 |publisher=Penguin Group |isbn=978-0-14-008878-6 |page=48}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In his youth, Alexander was also acquainted with Persian exiles at the Macedonian court, who received the protection of Philip II for several years as they opposed [[Artaxerxes III]].{{sfn|Cawthorne|2004|pp=[https:\u002f\u002fbooks.google.com\u002fbooks?id=oxyz0v9T74sC&pg=PA42 42\u201343]}}\u003cref\u003e{{cite book |last1=Howe |first1=Timothy |last2=Brice |first2=Lee L. |title=Brill's Companion to Insurgency and Terrorism in the Ancient Mediterranean |date=2015 |publisher=Brill |isbn=978-90-04-28473-9 |page=170 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=248DCwAAQBAJ&pg=PA170|access-date=23 February 2019}}\u003c\u002fref\u003e\u003cref name=\"EDC\"\u003e{{cite book |last1=Carney |first1=Elizabeth Donnelly |title=Women and Monarchy in Macedonia |date=2000 |publisher=University of Oklahoma Press |isbn=978-0-8061-3212-9 |page=101 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=ZbI2hZBy_EkC&pg=PA101|access-date=23 February 2019}}\u003c\u002fref\u003e Among them were [[Artabazos II]] and his daughter [[Barsine]], possible future mistress of Alexander, who resided at the Macedonian court from 352 to 342 BC, as well as [[Amminapes]], future [[satrap]] of Alexander, and a Persian nobleman named [[Sisines]].{{sfn|Cawthorne|2004|pp=[https:\u002f\u002fbooks.google.com\u002fbooks?id=oxyz0v9T74sC&pg=PA42 42\u201343]}}\u003cref name=\"JM\"\u003e{{cite book |last1=Morgan |first1=Janett |title=Greek Perspectives on the Achaemenid Empire: Persia Through the Looking Glass |date=2016 |publisher=Edinburgh University Press |isbn=978-0-7486-4724-8 |pages=271\u2013272 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=49JVDwAAQB b|Hammond|1993|p=97}}; {{harvnb|Starr|1991|pp=260, 367}}; {{harvnb|Toynbee|1981|p=67}}; {{harvnb|Worthington|2008|pp=8, 219}}; {{harvnb|Cawkwell|1978|p=22}}; {{harvnb|Perlman|1973|p=78}}; {{harvnb|Hamilton|1974|p=23}}; {{harvnb|Bryant|1996|p=306}}; {{harvnb|O'Brien|1994|p=25}}.\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|e| By the time of his death, he had conquered the entire [[Achaemenid Persian Empire]], adding it to Macedon's European territories; according to some modern writers, this was most of the world then known to the ancient Greeks (the '[[Ecumene#Ancient world|Ecumene]]').{{sfn|Danforth|1997|pp=38, 49, 167}}{{sfn|Stoneman|2004|p=2}} An approximate view of the world known to Alexander can be seen in [[Hecataeus of Miletus]]'s map; see [[:File:Hecataeus world map-en.svg|Hecataeus world map]]. }}\u003cbr\u003e-{{Cnote2|f| For instance, [[Hannibal]] supposedly ranked Alexander as the greatest general;{{Sfn | Goldsworthy |2003|pp=327\u201328}} [[Julius Caesar]] wept on seeing a statue of Alexander, since he had achieved so little by the same age;\u003cref name=\"Plutarch, Caesar, 11\" \u002f\u003e [[Pompey]] and [[Alauddin Khalji]] consciously posed as the 'new Alexander';{{sfn|Holland|2003|pp=176\u201383}} the young [[Napoleon]] Bonaparte also encouraged comparisons with Alexander. Napoleon also placed Alexander in the first rank.{{sfn|Barnett|1997|p=45}} [[Caracalla]] believed himself to be the actual reincarnation of Alexander.\u003cref\u003eRonald H. Fritze, Egyptomania: A History of Fascination, Obsession and Fantasy, p. 103.\u003c\u002fref\u003e\u003cref\u003eGoldsworthy, Adrian (2009). How Rome Fell: death of a superpower. New Haven: Yale University Press. pp. 74. {{ISBN|978-0-300-16426-8}}.\u003c\u002fref\u003e\u003cref\u003eBrauer, G. (1967). The Decadent Emperors: Power and Depravity in Third-Century Rome. p. 75.\u003c\u002fref\u003e [[Caligula]] wore the breastplate of Alexander in order to show his power.\u003cref\u003eSuetonius, The Lives of Twelve Caesars, Life of Caligula 19.\u003c\u002fref\u003e\u003cref\u003eGeoff W. Adams, The Roman Emperor Gaius \"Caligula\" and His Hellenistic Aspirations, pp 46\u003c\u002fref\u003e [[Fidel Castro]]'s hero was Alexander the Great, whose Spanish equivalent ''Alejandro'' he adopted as his ''nom de guerre''.\u003cref\u003eLeycester Coltman, The Real Fidel Castro, p 220.\u003c\u002fref\u003e Among [[Ottoman sultans]], [[Mehmed II]]'s heroes were Alexander and [[Achilles]].\u003cref\u003eNicolle, David (2000). Constantinople 1453: The End of Byzantium. Osprey Publishing. {{ISBN|978-1-84176-091-9}}.\u003c\u002fref\u003e In a letter to his rival, [[Selim I]], while equating himself with Alexander, compares [[Ismail I]] as \"Darius of our days\".\u003cref\u003e{{cite book|title=Imperial Citizen: Marriage and Citizenship in the Ottoman Frontier Provinces of Iraq|page=39|year=2011|author=Karen M. Kern}}\u003c\u002fref\u003e [[Paolo Giovio]], in a work written for [[Charles V, Holy Roman Emperor|Charles V]], says that Selim holds Alexander the Great and Julius Caesar in the highest esteem above all the generals of old.\u003cref\u003e{{cite book|author=Donald Presgrave Little|year=1976|page=227|title=Essays on Islamic civilization presented to Niyazi Berkes}}\u003c\u002fref\u003e}}\u003cbr\u003e+{{Cnote2|f| For instance, [[Hannibal]] supposedly ranked Alexander as the greatest general;{{Sfn | Goldsworthy |2003|pp=327\u201328}} [[Julius Caesar]] wept on seeing a statue of Alexander, since he had achieved so little by the same age;\u003cref name=\"Plutarch, Caesar, 11\" \u002f\u003e [[Pompey]] and [[Alauddin Khalji]] consciously posed as the 'new Alexander';{{sfn|Holland|2003|pp=176\u201383}} the young [[Napoleon]] Bonaparte also encouraged comparisons with Alexander. Napoleon also placed Alexander in the first rank.{{sfn|Barnett|1997|p=45}} [[Caracalla]] believed himself to be the actual reincarnation of Alexander.\u003cref\u003eRonald H. Fritze, Egyptomania: A History of Fascination, Obsession and Fantasy, p. 103.\u003c\u002fref\u003e\u003cref\u003eGoldsworthy, Adrian (2009). How Rome Fell: death of a superpower. New Haven: Yale University Press. pp. 74. {{ISBN|978-0-300-16426-8}}.\u003c\u002fref\u003e\u003cref\u003eBrauer, G. (1967). The Decadent Emperors: Power and Depravity in Third-Century Rome. p. 75.\u003c\u002fref\u003e [[Caligula]] wore the breastplate of Alexander in order to show his power.\u003cref\u003eSuetonius, The Lives of Twelve Caesars, Life of Caligula 19.\u003c\u002fref\u003e\u003cref\u003eGeoff W. Adams, The Roman Emperor Gaius \"Caligula\" and His Hellenistic Aspirations, pp 46\u003c\u002fref\u003e [[Fidel Castro]]'s hero was Alexander the Great, whose Spanish equivalent ''Alejandro'' he adopted as his ''nom de guerre''.\u003cref\u003eLeycester Coltman, The Real Fidel Castro, p 220.\u003c\u002fref\u003e Among [[Ottoman sultans]], [[Mehmed II]]'s heroes were Alexander and [[Achilles]].\u003cref\u003eNicolle, David (2000). Constantinople 1453: The End of Byzantium. Osprey Publishing. {{ISBN|978-1-84176-091-9}}.\u003c\u002fref\u003e In a letter to his rival, [[Selim I]], while equating himself with Alexander, compares [[Ismail I]] as \"Darius of our days\".\u003cref\u003e{{cite book|title=Imperial Citizen: Marriage and Citizenship in the Ottoman Frontier Provinces of Iraq|page=39|year=2011|author=Karen M. Kern}}\u003c\u002fref\u003e In his poetry, however, Shah Ismail identified himself with Alexander. [[Paolo Giovio]], in a work written for [[Charles V, Holy Roman Emperor|Charles V]], says that Selim holds Alexander the Great and Julius Caesar in the highest esteem above all the generals of old.\u003cref\u003e{{cite book|author=Donald Presgrave Little|year=1976|page=227|title=Essays on Islamic civilization presented to Niyazi Berkes}}\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|g|In ancient historiography, the [[Argead dynasty]] was traditionally regarded as having originated from [[Argos, Peloponnese|Argos]]. The Argeads themselves claimed Argive Greek descent from the hero [[Temenus]]. Through his parents' genealogy, ancient authors traced Alexander's descent back to heroes and other legendary figures from [[Greek mythology]], such as [[Heracles]] and [[Achilles]].\u003cref\u003eDiodorus, ''[[Bibliotheca Historica]]'' [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Diod.+17+1.5&fromdoc=Perseus%3Atext%3A1999.01.0084 17.1.5], [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Diod.+17.4&fromdoc=Perseus%3Atext%3A1999.01.0084 17.4]; Plutarch, ''[[Plutarch#Life of Alexander|Life of Alexander]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Plut.+Alex.+2.1&fromdoc=Perseus%3Atext%3A1999.01.0243 2.1]; Pausanias, ''[[Description of Greece]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Paus.+1.9.8&fromdoc=Perseus%3Atext%3A1999.01.0160 1.9.8], [http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0160%3Abook%3D1%3Achapter%3D11%3Asection%3D1 1.11.1], [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Paus.+7.8.9&fromdoc=Perseus%3Atext%3A1999.01.0160 7.8.9]; Arrian, ''[[Anabasis of Alexander]]'' [https:\u002f\u002farchive.org\u002fdetails\u002fL236ArrianIAnabasisOfAlexander14\u002fpage\u002f148\u002fmode\u002f2up?view=theater 2.7.4]; Herodotus, ''[[Histories (Herodotus)|Histories]]'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Hdt.+5.22.1&fromdoc=Perseus%3Atext%3A1999.01.0126 5.22.1], [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D5%3Achapter%3D22%3Asection%3D2 5.22.2]; Isocrates, ''To Philip'' [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:abo:tlg,0010,020:32 32]; Thucydides, [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0200%3Abook%3D2%3Achapter%3D99%3Asection%3D3 2.99,3]\u003c\u002fref\u003e\u003cref\u003e{{harvnb|Errington|1990|p=3}}; {{harvnb|Hornblower|2008|pp=55\u201358}}\u003c\u002fref\u003e}}\u003cbr\u003e {{Cnote2|h| There have been, since the time, many suspicions that Pausanias was actually hired to murder Philip. Suspicion has fallen upon Alexander, Olympias and even the newly crowned Persian Emperor, Darius III. All three of these people had motive to have Philip murdered.{{sfn|Lane Fox|1980|pp=72\u201373}} }}\u003cbr\u003e {{Cnote2|i| However, [[Arrian]], who used [[Ptolemy I Soter|Ptolemy]] as a source, said that Alexander crossed with more than 5,000 horse and 30,000 foot; [[Diodorus]] quoted the same totals, but listed 5,100 horse and 32,000 foot. Diodorus also referred to an advance force already present in Asia, which [[Polyaenus]], in his Stratagems of War (5.44.4), said numbered 10,000 men.}}","--- Revision 97\u003cbr\u003e+++ Revision 98\u003cbr\u003e@@ -417,7 +417,7 @@\u003cbr\u003e {{Main|Partition of Babylon|Diadochi}}\u003cbr\u003e [[File:Diadochi EN.png|thumb|upright=1.25|Kingdoms of the [[Diadochi]] in 301&nbsp;BC: the [[Ptolemaic Kingdom]] (dark blue), the [[Seleucid Empire]] (yellow), [[Lysimachus|Kingdom of Lysimachus]] (orange), and [[Kingdom of Macedon]] (green). Also shown are the [[Roman Republic]] (light blue), the [[Carthaginian Republic]] (purple), and the [[Kingdom of Epirus]] (red).]]\u003cbr\u003e \u003cbr\u003e-Alexander's death was so sudden that when reports of his death reached Greece, they were not immediately believed.\u003cref name=\"Roisman 2010 199\" \u002f\u003e Alexander had no obvious or legitimate heir, his son Alexander IV by Roxane being born after Alexander's death.{{sfn|Green|2007|pp=24\u201326}} According to Diodorus, Alexander's companions asked him on his deathbed to whom he bequeathed his kingdom; his laconic reply was \"t\u00f4i kratist\u00f4i\"\u2014\"to the strongest\".\u003cref name=\"DSXVII117\" \u002f\u003e Another theory is that his successors wilfully or erroneously misheard \"t\u00f4i Krater\u00f4i\"\u2014\"to Craterus\", the general leading his Macedonian troops home and newly entrusted with the regency of Macedonia.\u003cref name=Shipley\u003e{{cite book |title=The Greek World After Alexander 323\u201330 BC |author=Graham Shipley |page=40 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=sAoiAwAAQBAJ&pg=PA40 |isbn=978-1-134-06531-8 |date=2014 |publisher=Routledge |access-date=9 November 2017}}\u003c\u002fref\u003e Arrian and Plutarch claimed that Alexander was speechless by this time, implying that this was an apocryphal story.\u003cref\u003e{{harvnb|Green|2007|p=20}}\u003c\u002fref\u003e Diodorus, Curtius and Justin offered the more plausible story that Alexander passed his [[Seal (device)|signet ring]] to [[Perdiccas]], a bodyguard and leader of the companion cavalry, in front of witnesses, thereby nominating him.\u003cref name=\"DSXVII117\" \u002f\u003e{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e+Alexander's death was so sudden that when reports of his death reached Greece, they were not immediately believed.\u003cref name=\"Roisman 2010 199\" \u002f\u003e Alexander had no obvious or legitimate heir, his son Alexander IV by Roxane being born after Alexander's death.{{sfn|Green|2007|pp=24\u201326}} According to Diodorus, Alexander's companions asked him on his deathbed to whom he bequeathed his kingdom; his laconic reply was \"t\u00f4i kratist\u00f4i\"\u2014\"to the strongest\".\u003cref name=\"DSXVII117\" \u002f\u003e Another theory is that his successors wilfully or erroneously misheard \"t\u00f4i Krater\u00f4i\"\u2014\"to Craterus\", the general leading his Macedonian troops home and newly entrusted with the regency of Macedonia.\u003cref name=Shipley\u003e{{cite book |title=The Greek World After Alexander 323\u201330 BC |author=Graham Shipley |page=40 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=sAoiAwAAQBAJ&pg=PA40 |isbn=978-1-134-06531-8 |date=2014 |publisher=Routledge |access-date=9 November 2017}}\u003c\u002fref\u003e Arrian and Plutarch claimed that Alexander was speechless by this time, implying that this was an apocryphal story.\u003cref\u003e{{harvnb|Green|2007|p=20}}\u003c\u002fref\u003e Diodorus, Curtius and Justin offered the more plausible story that Alexander passed his [[Seal (emblem)|signet ring]] to [[Perdiccas]], a bodyguard and leader of the companion cavalry, in front of witnesses, thereby nominating him.\u003cref name=\"DSXVII117\" \u002f\u003e{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e Perdiccas initially did not claim power, instead suggesting that Roxane's baby would be king, if male, with himself, [[Craterus]], Leonnatus, and Antipater as guardians. However, the infantry, under the command of [[Meleager (general)|Meleager]], rejected this arrangement since they had been excluded from the discussion. Instead, they supported Alexander's half-brother Philip Arrhidaeus. Eventually, the two sides reconciled, and after the birth of Alexander IV, he and Philip III were appointed joint kings, albeit in name only.{{sfn|Green|2007|pp=26\u201329}} Dissension and rivalry soon affected the Macedonians. The satrapies handed out by Perdiccas at the [[Partition of Babylon]] became power bases each general used to bid for power. After the assassination of Perdiccas in 321&nbsp;BC, Macedonian unity collapsed, and 40&nbsp;years of war between \"The Successors\" (''[[Diadochi]]'') ensued before the Hellenistic world settled into three stable power blocs: [[Ptolemaic Egypt]], [[Seleucid Empire|Seleucid Syria and East]], and [[Antigonid dynasty|Antigonid Macedonia]]. In the process, both Alexander IV and Philip III were murdered.{{sfn|Green|2007|pp=29\u201334}}\u003cbr\u003e ","--- Revision 98\u003cbr\u003e+++ Revision 99\u003cbr\u003e@@ -118,7 +118,7 @@\u003cbr\u003e {{Further|Government of Macedonia (ancient kingdom)}}\u003cbr\u003e [[File:Pausanius assassinates Philip during the procession into the theatre by Andre Castaigne (1898-1899).jpg|thumb|upright=1|Pausanias assassinates Philip II, Alexander's father, during his procession into the theatre]]\u003cbr\u003e \u003cbr\u003e-In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=21 December 1992 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started in 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]].{{Cref2|h}} As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e+In the 24th day of the [[Ancient Macedonian calendar|Macedonian month]] Dios, which probably corresponds to 25 October 336 BC,\u003cref\u003e{{Cite journal |last=Hammond |first=N. G. L. |date=21 December 1992 |title=The Regnal Years of Philip and Alexander |url=https:\u002f\u002fgrbs.library.duke.edu\u002findex.php\u002fgrbs\u002farticle\u002fview\u002f3531 |journal=Greek, Roman, and Byzantine Studies |language=en |volume=33 |issue=4 |pages=355\u2013373 |issn=2159-3159}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Parise |first=Frank |url=https:\u002f\u002farchive.org\u002fdetails\u002fbookofcalendars0000unse_y2i4\u002fpage\u002f10\u002fmode\u002f2up |title=The book of calendars |date=2002 |publisher=Gorgias Press |isbn=978-1-931956-76-5 |location=Piscataway, NJ |pages=10 |orig-date=1983}} The month of Dios started on 2 October that year.\u003c\u002fref\u003e while at [[Vergina|Aegae]] attending the wedding of his daughter [[Cleopatra of Macedon|Cleopatra]] to Olympias's brother, [[Alexander I of Epirus]], Philip was assassinated by the captain of his [[Somatophylax|bodyguards]], [[Pausanias of Orestis|Pausanias]].{{Cref2|h}} As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, [[Perdiccas]] and [[Leonnatus]]. Alexander was proclaimed king on the spot by the nobles and [[Ancient Macedonian army|army]] at the age of 20.{{sfn|McCarty|2004|pp=30\u201331}}\u003cref\u003e{{harvnb|Renault|2001|pp=61\u201362}}\u003c\u002fref\u003e\u003cref name=\"Fox 1980 72\"\u003e{{harvnb|Lane Fox|1980|p=72}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Consolidation of power===\u003cbr\u003e Alexander began his reign by eliminating potential rivals to the throne. He had his cousin, the former [[Amyntas IV]], executed.{{sfn|Roisman|Worthington|2010|p=190}} He also had two Macedonian princes from the region of [[Lyncestis]] killed for having been involved in his father's assassination, but spared a third, [[Alexander Lyncestes]]. Olympias had Cleopatra Eurydice, and Europa, her daughter by Philip, burned alive. When Alexander learned about this, he was furious. Alexander also ordered the murder of Attalus,{{sfn|Roisman|Worthington|2010|p=190}} who was in command of the advance guard of the army in Asia Minor and Cleopatra's uncle.\u003cref name=\"Green 2007 5\u20136\"\u003e{{harvnb|Green|2007|pp=5\u20136}}\u003c\u002fref\u003e\u003cbr\u003e@@ -484,7 +484,7 @@\u003cbr\u003e [[File:Alexander the Great Ny Carlsberg Glyptotek IN574 n1.jpg|thumb|left|upright|A [[Roman sculpture|Roman copy]] of an original 3rd century BC [[Ancient Greek sculpture|Greek bust]] depicting Alexander the Great, [[Ny Carlsberg Glyptotek]], Copenhagen]]\u003cbr\u003e Alexander was erudite and patronized both arts and sciences.\u003cref name=\"PA4\"\u002f\u003e\u003cref name=\"PA8\"\u002f\u003e However, he had little interest in sports or the [[Ancient Olympic Games|Olympic Games]] (unlike his father), seeking only the [[Homeric]] ideals of honour (''tim\u00ea'') and glory (''kudos'').\u003cref\u003e{{harvnb|Roisman|Worthington|2010|p=190}}, {{harvnb|Green|2007|p=4}}\u003c\u002fref\u003e He had great [[charisma]] and force of personality, characteristics which made him a great leader.{{sfn|Green|2007|pp=24\u201326}}\u003cref name=\"AVII29\"\u002f\u003e His unique abilities were further demonstrated by the inability of any of his generals to unite Macedonia and retain the Empire after his death\u2014only Alexander had the ability to do so.{{sfn|Green|2007|pp=24\u201326}}\u003cbr\u003e \u003cbr\u003e-During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. c.f. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cbr\u003e+During his final years, and especially after the death of Hephaestion, Alexander began to exhibit signs of [[wikt:megalomania|megalomania]] and [[paranoia]].{{sfn|Green|2007|pp=23\u201324}} His extraordinary achievements, coupled with his own ineffable sense of destiny and the flattery of his companions, may have combined to produce this effect.{{sfn|Green|2007|pp=20\u201321}} His [[delusions of grandeur]] are readily visible in his [[#Will|will]] and in his desire to conquer the world,{{sfn|Green|2007|pp=23\u201324}} in as much as he is by various sources described as having ''boundless ambition'',\u003cref\u003eM Wood (edited by T Gergel) \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=5kxoAAAAMAAJ Alexander: Selected Texts from Arrian, Curtius and Plutarch] Penguin, 2004 {{ISBN|978-0-14-101312-1}} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=TUqQbemlo80C&pg=PA7 |page=7 |title=Medieval French Alexander, the |isbn=978-0-7914-8832-4 |last1=Maddox |first1=Donald |last2=Sturm-Maddox |first2=Sara |date=February 2012 |publisher=State University of New York Press |access-date=17 October 2016}}\u003c\u002fref\u003e an epithet, the meaning of which has descended into a historical clich\u00e9.\u003cref\u003eG Highet\u003c!-- taught classics at Oxford University until 1938; in 1950 he was appointed Anthon Professor of the Latin Language and Literature at Columbia University --\u003e \u2013 [https:\u002f\u002fbooks.google.com\u002fbooks?id=KRbBTeM9M2oC&pg=PA68 The Classical Tradition: Greek and Roman Influences on Western Literature: Greek and Roman Influences on Western Literature], Oxford University Press, 31 December 1949 p. 68 [Retrieved 2015-04-08] (ed. cf. \u2013 [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 Merriam-webster.com] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150626135648\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fclich%C3%A9 |date=26 June 2015 }})\u003c\u002fref\u003e\u003cref\u003eMerriam-Webster [http:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet \u2013 epithet] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150326115024\u002fhttp:\u002f\u002fwww.merriam-webster.com\u002fdictionary\u002fepithet |date=26 March 2015 }} [Retrieved 8 April 2015]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e He appears to have believed himself a deity, or at least sought to deify himself.{{sfn|Green|2007|pp=23\u201324}} Olympias always insisted to him that he was the son of Zeus,\u003cref name=\"PA3\" \u002f\u003e an idea apparently confirmed to him by the oracle of Amun at [[Siwa Oasis|Siwa]].\u003cref name=\"P27\"\u002f\u003e He began to identify himself as the son of Zeus-Ammon.\u003cref name=\"P27\"\u002f\u003e Alexander adopted elements of Persian dress and customs at court, notably ''[[proskynesis]]'', which was one aspect of Alexander's broad strategy aimed at securing the aid and support of the Iranian upper classes;{{sfn|Briant|1985|pages=827\u2013830}} however the practise of ''proskynesis'' was disapproved by the Macedonians, and they were unwilling to perform it.\u003cref name=\"AVII11\"\u002f\u003e This behaviour cost him the sympathies of many of his countrymen.\u003cref name=\"PA45\"\u002f\u003e Alexander also was a pragmatic ruler who understood the difficulties of ruling culturally disparate peoples, many of whom lived in societies where the king was treated as divine.\u003cref\u003e{{harvnb|Morkot|1996|p=111}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e Thus, rather than megalomania, his behaviour may have been a practical attempt at strengthening his rule and keeping his empire together.\u003cref\u003e{{harvnb|Morkot|1996|p=121}}, {{harvnb|Roisman|Worthington|2010|p=195}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -499,7 +499,7 @@\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn\u2019s arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Ta
