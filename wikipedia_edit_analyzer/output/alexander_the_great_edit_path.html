        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="6f630998-da10-4dbf-a65b-ceb57029e395" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("6f630998-da10-4dbf-a65b-ceb57029e395")) {                    Plotly.newPlot(                        "6f630998-da10-4dbf-a65b-ceb57029e395",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -499,7 +499,7 @@\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn's arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e At the same time, ancient writers did not conclusively identify them as lovers.\u003cref\u003e{{Citation |last=Palagia |first=Olga |title=Hephaestion\u2019s Pyre and the Royal Hunt of Alexander |date=2000-09-07 |work=Alexander the Great in Fact and Fiction |pages=167\u2013206 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002facprof:oso\u002f9780198152873.003.0006 |access-date=2025-03-06 |publisher=Oxford University Press |isbn=978-0-19-815287-3}}\u003c\u002fref\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref name=Sourcebook\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn's arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e At the same time, ancient writers did not conclusively identify them as lovers.\u003cref\u003e{{Citation |last=Palagia |first=Olga |title=Hephaestion\u2019s Pyre and the Royal Hunt of Alexander |date=2000-09-07 |work=Alexander the Great in Fact and Fiction |pages=167\u2013206 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002facprof:oso\u002f9780198152873.003.0006 |access-date=2025-03-06 |publisher=Oxford University Press |isbn=978-0-19-815287-3}}\u003c\u002fref\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood.{{refn|name=Homosexual}} This went against the social norms of at least some Greek cities, such as Athens.{{refn|name=Homosexual|\u003cref name=Sourcebook\u002f\u003e{{rp|p=79}}\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell | thood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander and Hephaestion.jpg|thumb|Alexander and his general [[Hephaestion]], at the [[Getty Villa]]|left]]\u003cbr\u003e \u003cbr\u003e@@ -1081,4 +1081,3 @@\u003cbr\u003e [[Category:Pharaohs of the Argead dynasty]]\u003cbr\u003e [[Category:Shahnameh characters]]\u003cbr\u003e [[Category:Temple of Artemis]]\u003cbr\u003e-[[Category:LGBTQ heads of state]]","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -70,7 +70,7 @@\u003cbr\u003e ===Lineage and childhood===\u003cbr\u003e \u003cbr\u003e [[File:Archaeological Site of Pella by Joy of Museums.jpg|thumb|upright=1.2|Archaeological site of [[Pella]], Greece, Alexander's birthplace]]\u003cbr\u003e-Alexander III was born in [[Pella]], the capital of the [[Kingdom of Macedon]],\u003cref\u003e{{cite book |last=Green |first=Peter |title=Alexander of Macedon, 356\u2013323 B.C.: a historical biography |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=g6Wl4AKGQkIC&pg=PA559 |page=xxxiii |year=1970 |series=Hellenistic culture and society |edition=illustrated, revised reprint |publisher=University of California Press |isbn=978-0-520-07165-0 |quote=356 \u2013 Alexander born in Pella. The exact date is not known, but probably either 20 or 26 July. |access-date=20 June 2015}}\u003c\u002fref\u003e on the sixth day of the [[Ancient Greek calendars|ancient Greek month]] of [[Hekatombaion]], which probably corresponds to 20 July 356 BC (although the exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biography |url=https:\u002f\u002farchive.org\u002fdetails\u002fcu31924028251217\u002fpage\u002fn321\u002fmode\u002f2up?view=theater |location=New York |publisher=Charles Scribner's Sons |pages=286\u2013287 |access-date=9 November 2021}}\u003c\u002fref\u003e He was the son of the erstwhile king of Macedon, [[Philip II of Macedon|Philip II]], and his fourth wife, [[Olympias]] (daughter of [[Neoptolemus I of Epirus|Neoptolemus I]], king of [[Epirus (ancient state)|Epirus]]).\u003cref\u003e{{harvnb|McCarty|2004|p=10}}, {{harvnb|Renault|2001|p=28}}, {{harvnb|Durant|1966|p=538}}\u003c\u002fref\u003e{{Cref2|g}} Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.{{sfn|Roisman|Worthington|2010|p=171}}[[File:Coin olympias mus theski.JPG|left|thumb|155px|Roman medallion depicting [[Olympias]], Alexander's mother]]Several legends surround Alexander's birth and childhood.{{sfn|Roisman|Worthington|2010|p=188}} According to the [[Ancient Greeks|ancient Greek]] biographer [[Plutarch]], on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a [[Seal (emblem)|seal]] engraved with a lion's image.\u003cref name=\"PA2\" \u002f\u003e Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was [[Zeus]]. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious.\u003cref name=\"PA2\" \u002f\u003e\u003cbr\u003e+Alexander III was born in [[Pella]], the capital of the [[Kingdom of Macedon]],\u003cref\u003e{{cite book |last=Green |first=Peter |title=Alexander of Macedon, 356\u2013323 B.C.: a historical biography |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=g6Wl4AKGQkIC&pg=PA559 |page=xxxiii |year=1970 |series=Hellenistic culture and society |edition=illustrated, revised reprint |publisher=University of California Press |isbn=978-0-520-07165-0 |quote=356 \u2013 Alexander born in Pella. The exact date is not known, but probably either 20 or 26 July. |access-date=20 June 2015}}\u003c\u002fref\u003e on the sixth day of the [[Ancient Greek calendars|ancient Greek month]] of [[Hekatombaion]], which probably corresponds to 20 July 356 BC (although the exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biography |url=https:\u002f\u002farchive.org\u002fdetails\u002fcu31924028251217\u002fpage\u002fn321\u002fmode\u002f2up?view=theater |location=New York |publisher=Charles Scribner's Sons |pages=286\u2013287 |access-date=9 November 2021}}\u003c\u002fref\u003e He was the son of the king of Macedon, [[Philip II of Macedon|Philip II]], and his fourth wife, [[Olympias]] (daughter of [[Neoptolemus I of Epirus|Neoptolemus I]], king of [[Epirus (ancient state)|Epirus]]).\u003cref\u003e{{harvnb|McCarty|2004|p=10}}, {{harvnb|Renault|2001|p=28}}, {{harvnb|Durant|1966|p=538}}\u003c\u002fref\u003e{{Cref2|g}} Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.{{sfn|Roisman|Worthington|2010|p=171}}[[File:Coin olympias mus theski.JPG|left|thumb|155px|Roman medallion depicting [[Olympias]], Alexander's mother]]Several legends surround Alexander's birth and childhood.{{sfn|Roisman|Worthington|2010|p=188}} According to the [[Ancient Greeks|ancient Greek]] biographer [[Plutarch]], on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a [[Seal (emblem)|seal]] engraved with a lion's image.\u003cref name=\"PA2\" \u002f\u003e Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was [[Zeus]]. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious.\u003cref name=\"PA2\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e On the day Alexander was born, Philip was preparing a [[siege]] on the city of [[Potidea]] on the peninsula of [[Chalcidice]]. That same day, Philip received news that his general [[Parmenion]] had defeated the combined [[Illyria]]n and [[Paeonian]] armies and that his horses had won at the [[Ancient Olympic Games|Olympic Games]]. It was also said that on this day, the [[Temple of Artemis]] in [[Ephesus]], one of the [[Seven Wonders of the Ancient World|Seven Wonders of the World]], burnt down. This led [[Hegesias of Magnesia]] to say that it had burnt down because [[Artemis]] was away, attending the birth of Alexander.\u003cref\u003e{{harvnb|Renault|2001|p=28}}, {{harvnb|Bose|2003|p=21}}\u003c\u002fref\u003e Such legends may have emerged when Alexander was king, and possibly at his instigation, to show that he was superhuman and destined for greatness from conception.{{sfn|Roisman|Worthington|2010|p=188}}\u003cbr\u003e ","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -1081,3 +1081,4 @@\u003cbr\u003e [[Category:Pharaohs of the Argead dynasty]]\u003cbr\u003e [[Category:Shahnameh characters]]\u003cbr\u003e [[Category:Temple of Artemis]]\u003cbr\u003e+[[Category:Historical figures with ambiguous or disputed sexuality]]","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -1081,4 +1081,3 @@\u003cbr\u003e [[Category:Pharaohs of the Argead dynasty]]\u003cbr\u003e [[Category:Shahnameh characters]]\u003cbr\u003e [[Category:Temple of Artemis]]\u003cbr\u003e-[[Category:Historical figures with ambiguous or disputed sexuality]]","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -1081,3 +1081,4 @@\u003cbr\u003e [[Category:Pharaohs of the Argead dynasty]]\u003cbr\u003e [[Category:Shahnameh characters]]\u003cbr\u003e [[Category:Temple of Artemis]]\u003cbr\u003e+[[Category:Historical figures with ambiguous or disputed sexuality]]","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -1081,4 +1081,3 @@\u003cbr\u003e [[Category:Pharaohs of the Argead dynasty]]\u003cbr\u003e [[Category:Shahnameh characters]]\u003cbr\u003e [[Category:Temple of Artemis]]\u003cbr\u003e-[[Category:Historical figures with ambiguous or disputed sexuality]]","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -773,7 +773,9 @@\u003cbr\u003e \u003cbr\u003e [[Emperor Julian]] in his satire called \"The Caesars\", describes a contest between the previous Roman emperors, with Alexander the Great called in as an extra contestant, in the presence of the assembled gods.\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|title=Julian: Caesars \u2013 translation|website=attalus.org|access-date=29 March 2020|archive-date=26 February 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200226035227\u002fhttp:\u002f\u002fwww.attalus.org\u002ftranslate\u002fcaesars.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The [[Itinerarium Alexandri]] is a 4th-century Latin description of Alexander the Great's campaigns. [[Julius Caesar]] went to serve his quaestorship in Hispania after his wife's funeral, in the spring or early summer of 69 BC. While there, he encountered a statue of Alexander the Great, and realised with dissatisfaction that he was now at an age when Alexander had the world at his feet, while he had achieved comparatively little.\u003cref\u003eGoldsworthy, 100\u003c\u002fref\u003e\u003cref\u003ePlutarch 1919, XI, 2\u003c\u002fref\u003e\u003cbr\u003e+The [[Itinerarium Alexandri]] is a 4th-century Latin description of Alexander the Great's campaigns.\u003cbr\u003e+\u003cbr\u003e+[[Julius Caesar]] went to serve his quaestorship in Hispania after his wife's funeral, in the spring or early summer of 69 BC. While there, he encountered a statue of Alexander the Great, and realised with dissatisfaction that he was now at an age when Alexander had the world at his feet, while he had achieved comparatively little.\u003cref\u003eGoldsworthy, 100\u003c\u002fref\u003e\u003cref\u003ePlutarch 1919, XI, 2\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Pompey]] posed as the \"new Alexander\" since he was his boyhood hero.\u003cref\u003eLeach, John. Pompey the Great. p. 29.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 8\u003cbr\u003e+++ Revision 9\u003cbr\u003e@@ -783,7 +783,7 @@\u003cbr\u003e \u003cbr\u003e Caracalla's mania for Alexander went so far that Caracalla visited Alexandria while preparing for his Persian invasion and persecuted philosophers of the [[Aristotelianism|Aristotelian]] school based on a legend that [[Aristotle]] had poisoned Alexander. This was a sign of Caracalla's increasingly erratic behaviour. But this mania for Alexander, strange as it was, was overshadowed by subsequent events in Alexandria.\u003cref name=\":92\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-In 39, Caligula performed a spectacular stunt by ordering a temporary [[Pontoon bridge|floating bridge]] to be built using ships as [[Pontoon (boat)|pontoons]], stretching for over two miles from the resort of [[Baiae]] to the neighbouring port of [[Puteoli]].\u003cref\u003e{{cite journal |last1=Wardle |first1=David |title=Caligula's Bridge of Boats \u2013 AD 39 or 40? |journal=Historia |date=2007 |volume=56 |issue=1 |pages=118\u2013120 |doi=10.25162\u002fhistoria-2007-0009 |jstor=25598379 |s2cid=164017284 }}\u003c\u002fref\u003e\u003cref name=\"seutonius-calig-19\"\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#19 19].\u003c\u002fref\u003e It was said that the bridge was to rival the Persian king [[Xerxes' pontoon bridge]] crossing of the Hellespont.\u003cref name=\"seutonius-calig-19\" \u002f\u003e Caligula, who could not swim,\u003cref\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#54 54].\u003c\u002fref\u003e then proceeded to ride his favourite horse [[Incitatus]] across, wearing the breastplate of [[#After death|Alexander the Great]].\u003cref name=\"seutonius-calig-19\" \u002f\u003e This act was in defiance of a prediction by Tiberius's soothsayer [[Thrasyllus of Mendes]] that Caligula had \"no more chance of becoming emperor than of riding a horse across the Bay of Baiae\".\u003cref name=\"seutonius-calig-19\" \u002f\u003e\u003cbr\u003e+In AD 39, Caligula performed a spectacular stunt by ordering a temporary [[Pontoon bridge|floating bridge]] to be built using ships as [[Pontoon (boat)|pontoons]], stretching for over two miles from the resort of [[Baiae]] to the neighbouring port of [[Puteoli]].\u003cref\u003e{{cite journal |last1=Wardle |first1=David |title=Caligula's Bridge of Boats \u2013 AD 39 or 40? |journal=Historia |date=2007 |volume=56 |issue=1 |pages=118\u2013120 |doi=10.25162\u002fhistoria-2007-0009 |jstor=25598379 |s2cid=164017284 }}\u003c\u002fref\u003e\u003cref name=\"seutonius-calig-19\"\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#19 19].\u003c\u002fref\u003e It was said that the bridge was to rival the Persian king [[Xerxes' pontoon bridge]] crossing of the Hellespont.\u003cref name=\"seutonius-calig-19\" \u002f\u003e Caligula, who could not swim,\u003cref\u003eSuetonius, ''The Lives of Twelve Caesars'', Life of Caligula [https:\u002f\u002fpenelope.uchicago.edu\u002fThayer\u002fE\u002fRoman\u002fTexts\u002fSuetonius\u002f12Caesars\u002fCaligula*.html#54 54].\u003c\u002fref\u003e then proceeded to ride his favourite horse [[Incitatus]] across, wearing the breastplate of [[#After 5\u201316}} However, Ogden calculates that Alexander, who impregnated his partners thrice in eight years, had a higher matrimonial record than his father at the same age.{{sfn|Ogden|2009|p=208|ps=...&nbsp;three attested pregnancies in eight years produces an attested impregnation rate of one every 2.7&nbsp;years, which is actually superior to that of his father.}} Two of these pregnancies\u2014Stateira's and Barsine's\u2014are of dubious legitimacy.\u003cref\u003e{{cite book |title=[[The Nature of Alexander]] |author=[[Mary Renault]] |quote=No record at all exists of such a woman [ie, Barsine] accompanying his march; nor of any claim by her, or her powerful kin, that she had borne him offspring. Yet twelve years after his death a boy was produced, seventeen years old, born therefore five years after Damascus, her alleged son \"brought up in Pergamon\"; a claimant and shortlived pawn in the succession wars, chosen probably for a physical resemblance to Alexander. That he actually did marry another Barsine must have helped both to launch and preserve the story; but no source reports any notice whatever taken by him of a child who, Roxane's being posthumous, would have been during his lifetime his only son, by a near-royal mother. In a man who named cities after his horse and dog, this strains credulity. |page=110 |year=1979 |publisher=Pantheon |isbn=978-0-394-73825-3}}\u003c\u002fref\u003e\u003cbr\u003e+[[Peter Green (historian)|Peter Green]] argues that there is little evidence in ancient sources that Alexander had much sexual interest in women; he did not produce an heir until the very end of his life.{{sfn|Green|2007|pp=15\u201316}} However, Ogden calculates that Alexander, who impregnated his partners three times in eight years, had a higher matrimonial record than his father at the same age.{{sfn|Ogden|2009|p=208|ps=...&nbsp;three attested pregnancies in eight years produces an attested impregnation rate of one every 2.7&nbsp;years, which is actually superior to e exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biography |url=https:\u002f\u002farchive.org\u002fdetails\u002fcu31924028251217\u002fpage\u002fn321\u002fmode\u002f2up?view=theater |location=New York |publisher=Charles Scribner's Sons |pages=286\u2013287 |access-date=9 November 2021}}\u003c\u002fref\u003e He was the son of the king of Macedon, [[Philip II of Macedon|Philip II]], and his fourth wife, [[Olympias]] (daughter of [[Neoptolemus I of Epirus|Neoptolemus I]], king of [[Epirus (ancient state)|Epirus]]).\u003cref\u003e{{harvnb|McCarty|2004|p=10}}, {{harvnb|Renault|2001|p=28}}, {{harvnb|Durant|1966|p=538}}\u003c\u002fref\u003e{{Cref2|g}} Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.{{sfn|Roisman|Worthington|2010|p=171}}[[File:Coin olympias mus theski.JPG|left|thumb|155px|Roman medallion depicting [[Olympias]], Alexander's mother]]Several legends surround Alexander's birth and childhood.{{sfn|Roisman|Worthington|2010|p=188}} According to the [[Ancient Greeks|ancient Greek]] biographer [[Plutarch]], on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a [[Seal (emblem)|seal]] engraved with a lion's image.\u003cref name=\"PA2\" \u002f\u003e Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was [[Zeus]]. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious.\u003cref name=\"PA2\" \u002f\u003e\u003cbr\u003e+Alexander III was born in [[Pella]], the capital of the [[Kingdom of Macedon]],\u003cref\u003e{{cite book |last=Green |first=Peter |title=Alexander of Macedon, 356\u2013323 B.C.: a historical biography |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=g6Wl4AKGQkIC&pg=PA559 |page=xxxiii |year=1970 |series=Hellenistic culture and society |edition=illustrated, revised reprint |publisher=University of California Press |isbn=978-0-520-07165-0 |quote=356 \u2013 Alexander born in Pella. The exact date is not known, but probably either 20 or 26 July. |access-date=20 June 2015}}\u003c\u002fref\u003e on the sixth day of the [[Ancient Greek calendars|ancient Greek month]] of [[Hekatombaion]], which probably corresponds to 20 July 356 BC (although the exact date is uncertain).\u003cref\u003ePlutarch, ''Life of Alexander'' 3.5: {{cite web |url=https:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html#7 |title=The birth of Alexander the Great |work=Livius|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150320180439\u002fhttps:\u002f\u002fwww.livius.org\u002faj-al\u002falexander\u002falexander_t32.html|archive-date=20 March 2015|url-status = dead |access-date=16 December 2011 |quote=Alexander was born the sixth of [[Hekatombaion]].}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |author=David George Hogarth |date=1897 |title=Philip and Alexander of Macedon : two essays in biogr 2fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003ehttps:\u002f\u002fwww.google.com\u002fbooks\u002fedition\u002fEmpire_of_Alexander_the_Great\u002fQcJuRH89a8UC?hl=en&gbpv=1&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83&printsec=frontcover\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e+\u003cbr\u003e+\"He was very handsome in person, and much devoted to exertion, very active in mind, very heroic in courage, very tenacious of honour, exceedingly fond of incurring danger, and strictly observant of his duty to the gods.\"\u003cref\u003ehttps:\u002f\u002ftopostext.org\u002fwork\u002f205\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander-lysippus1-1.jpg|thumb|Roman copy of the Alexander portrait by [[Lysippos]]|left|upright]]\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -454,7 +454,7 @@\u003cbr\u003e \u003cbr\u003e {{blockquote|Then Alexander seating himself on the royal throne, which was far too high for his bodily stature. Therefore, since his feet did not reach its lowest step, one of the royal pages placed a table under his feet.{{sfn |Rolfe |1946 |loc = 5.2.13}}}}\u003cbr\u003e \u003cbr\u003e-Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003ehttps:\u002f\u002fwww.google.com\u002fbooks\u002fedition\u002fEmpire_of_Alexander_the_Great\u002fQcJuRH89a8UC?hl=en&gbpv=1&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83&printsec=frontcover\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003e{{cite book |last1=Skelton |first1=Debra |last2=Dell |first2=Pamela |title=Empire of Alexander the Great |date=2009 |publisher=Infobase Publishing |isbn=978-1-60413-162-8 |page=83 |url=https:\u002f\u002fwww.google.com\u002fbooks\u002fedition\u002fEmpire_of_Alexander_the_Great\u002fQcJuRH89a8UC?hl=en&gbpv=1&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83&printsec=frontcover |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e ","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -458,7 +458,7 @@\u003cbr\u003e \u003cbr\u003e In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e \u003cbr\u003e-\"He was very handsome in person, and much devoted to exertion, very active in mind, very heroic in courage, very tenacious of honour, exceedingly fond of incurring danger, and strictly observant of his duty to the gods.\"\u003cref\u003ehttps:\u002f\u002ftopostext.org\u002fwork\u002f205\u003c\u002fref\u003e\u003cbr\u003e+\"He was very handsome in person, and much devoted to exertion, very active in mind, very heroic in courage, very tenacious of honour, exceedingly fond of incurring danger, and strictly observant of his duty to the gods.\"\u003cref\u003ehttps:\u002f\u002ftopostext.org\u002fwork\u002f205 7.28\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander-lysippus1-1.jpg|thumb|Roman copy of the Alexander portrait by [[Lysippos]]|left|upright]]\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -1075,6 +1075,7 @@\u003cbr\u003e [[Category:Deified Greek people]]\u003cbr\u003e [[Category:Deified male monarchs]]\u003cbr\u003e [[Category:Hellenistic-era people]]\u003cbr\u003e+[[Category:Historical figures with ambiguous or disputed sexuality]]\u003cbr\u003e [[Category:Kayanians]]\u003cbr\u003e [[Category:Monarchs of Persia]]\u003cbr\u003e [[Category:People in the deuterocanonical books]]","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -456,10 +456,6 @@\u003cbr\u003e \u003cbr\u003e Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003e{{cite book |last1=Skelton |first1=Debra |last2=Dell |first2=Pamela |title=Empire of Alexander the Great |date=2009 |publisher=Infobase Publishing |isbn=978-1-60413-162-8 |page=83 |url=https:\u002f\u002fwww.google.com\u002fbooks\u002fedition\u002fEmpire_of_Alexander_the_Great\u002fQcJuRH89a8UC?hl=en&gbpv=1&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83&printsec=frontcover |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e-\u003cbr\u003e-\"He was very handsome in person, and much devoted to exertion, very active in mind, very heroic in courage, very tenacious of honour, exceedingly fond of incurring danger, and strictly observant of his duty to the gods.\"\u003cref\u003ehttps:\u002f\u002ftopostext.org\u002fwork\u002f205 7.28\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e [[File:Alexander-lysippus1-1.jpg|thumb|Roman copy of the Alexander portrait by [[Lysippos]]|left|upright]]\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:\u003cbr\u003e {{blockquote|The outward appearance of Alexander is best represented by the statues of him which Lysippus made, and it was by this artist alone that Alexander himself thought it fit that he should be modelled. For those peculiarities which many of his successors and friends afterwards tried to imitate, namely, the poise of the neck, which was bent slightly to the left, and the melting glance of his eyes, this artist has accurately observed. Apelles, however, in painting him as wielder of the thunder-bolt, did not reproduce his complexion, but made it too dark and swarthy. Whereas he was of a fair colour, as they say, and his fairness passed into ruddiness on his breast particularly, and in his face. Moreover, that a very pleasant odour exhaled from his skin and that there was a fragrance about his mouth and all his flesh, so that his garments were filled with it, this we have read in the ''Memoirs of Aristoxenus''.{{Sfn |Plutarch|1919|loc = [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0243:chapter=4&highlight=lysippus IV, 1]}}}}\u003cbr\u003e@@ -469,6 +465,10 @@\u003cbr\u003e [[File:Detail of fresco depicting Alexander the Great.jpg|thumb|right|A fresco depicting a hunt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e \u003cbr\u003e The [[Alexander Mosaic]] and contemporary coins portray Alexander with \"a straight nose, a slightly protruding jaw, full lips and eyes deep set beneath a strongly pronounced forehead\".\u003cref name=\"Alexander the Great\"\u002f\u003e He is also described as having a slight upward tilt of his head to the left.{{sfn|Renault|2013|p=1}}\u003cbr\u003e+\u003cbr\u003e+In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e+\u003cbr\u003e+\"He was very handsome in person, and much devoted to exertion, very active in mind, very heroic in courage, very tenacious of honour, exceedingly fond of incurring danger, and strictly observant of his duty to the gods.\"\u003cref\u003ehttps:\u002f\u002ftopostext.org\u002fwork\u002f205 7.28\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The ancient historian [[Claudius Aelianus|Aelian]] ({{circa|175}} \u2013 {{circa|235 AD}}), in his ''Varia Historia'' (12.14), describes Alexander's hair color as \"''\u03be\u03b1\u03bd\u03b8\u1f74\u03bd''\" (''xanth\u00edn''), which at the  time, could mean blond, brown, tawny (light brown) or auburn.{{sfn|Liddell|Scott|1940|loc=[https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0057:entry=canqo\u002fs \u03be\u03b1\u03bd\u03b8\u03cc\u03c2]}}\u003cref\u003e{{Cite book |last=Woodhouse |first=Sidney Chawner |title=English\u2013Greek Dictionary: A Vocabulary of the Attic Language |publisher=Routledge & Kegan Paul Limited |year=1910 |location=London |pages=52,84,101}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last1=Beekes |first1=Robert Stephen Paul |title=Etymological Dictionary of Greek |last2=Beek |first2=Lucien van |publisher=Brill |year=2010 |location=Leiden; Boston |pages=1033}}\u003c\u002fref\u003e It is sometimes claimed that Alexander had [[heterochromia|one blue and one brown eye]],\u003cref\u003e{{cite book |first=Peter |last=Green |author-link=Peter Green (historian) |title=Alexander the Great and the Hellenistic Age |publisher=Orion Publishing Co |year=2008 |pages=15\u201316 |isbn=978-0-7538-2413-9}}\u003c\u002fref\u003e referring to the ''[[Alexander Romance]]'', which is however a fictional account that also claims Alexander \"had sharp teeth like fangs\" and \"did not look like Philip or Olympias\". Reconstruction, based on remaining traces of paint of the original [[polychromy]] on his [[Alexander Sarcophagus|sarcophagus]], indicates that he was depicted with brown eyes and chestnut brown hair.\u003cref\u003e{{Cite book |last1=Brinkmann |first1=Vinzenz |url=https:\u002f\u002fpictures.abebooks.com\u002finventory\u002f31048007537_3.jpg |title=Gods in Color: Painted Sculpture of Classical Antiquity |last2=Wunsche |first2=Raimund |publisher=Arthur M. Sackler \u002f Harvard University Art Museum |year=2007 |pages=159 |access-date=12 April 2022 |archive-date=31 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220731043302\u002fhttps:\u002f\u002fpictures.abebooks.com\u002finventory\u002f31048007537_3.jpg |url-status=live }}\u003c\u002fref\u003e While the acropolis museum suggests that trace amounts of red paint on a head statue of Alexander were most likely a base coat for golden hues to be painted over for his hair.\u003cref\u003e{{cite web |title=Head of a statue of Alexander the Great {{!}} Acropolis Museum {{!}} Official website |url=https:\u002f\u002fwww.theacropolismuseum.gr\u002fen\u002fhead-statue-alexander-great |website=www.theacropolismuseum.gr |access-date=1 October 2024}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -1075,7 +1075,6 @@\u003cbr\u003e [[Category:Deified Greek people]]\u003cbr\u003e [[Category:Deified male monarchs]]\u003cbr\u003e [[Category:Hellenistic-era people]]\u003cbr\u003e-[[Category:Historical figures with ambiguous or disputed sexuality]]\u003cbr\u003e [[Category:Kayanians]]\u003cbr\u003e [[Category:Monarchs of Persia]]\u003cbr\u003e [[Category:People in the deuterocanonical books]]","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -465,6 +465,8 @@\u003cbr\u003e [[File:Detail of fresco depicting Alexander the Great.jpg|thumb|right|A fresco depicting a hunt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e \u003cbr\u003e The [[Alexander Mosaic]] and contemporary coins portray Alexander with \"a straight nose, a slightly protruding jaw, full lips and eyes deep set beneath a strongly pronounced forehead\".\u003cref name=\"Alexander the Great\"\u002f\u003e He is also described as having a slight upward tilt of his head to the left.{{sfn|Renault|2013|p=1}}\u003cbr\u003e+\u003cbr\u003e+[[File:ACMA 1331 Alexander 2.JPG|thumb|right|alt=A bust of Alexander the Great by Leochares|Head of Alexander the Great, by Leochares, ca. 330 BC]]\u003cbr\u003e \u003cbr\u003e In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e ","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -1077,6 +1077,7 @@\u003cbr\u003e [[Category:Deified Greek people]]\u003cbr\u003e [[Category:Deified male monarchs]]\u003cbr\u003e [[Category:Hellenistic-era people]]\u003cbr\u003e+[[Category:Historical figures with ambiguous or disputed sexuality]]\u003cbr\u003e [[Category:Kayanians]]\u003cbr\u003e [[Category:Monarchs of Persia]]\u003cbr\u003e [[Category:People in the deuterocanonical books]]","--- Revision 29\u003cbr\u003e+++ Revision 30\u003cbr\u003e@@ -460,13 +460,13 @@\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:\u003cbr\u003e {{blockquote|The outward appearance of Alexander is best represented by the statues of him which Lysippus made, and it was by this artist alone that Alexander himself thought it fit that he should be modelled. For those peculiarities which many of his successors and friends afterwards tried to imitate, namely, the poise of the neck, which was bent slightly to the left, and the melting glance of his eyes, this artist has accurately observed. Apelles, however, in painting him as wielder of the thunder-bolt, did not reproduce his complexion, but made it too dark and swarthy. Whereas he was of a fair colour, as they say, and his fairness passed into ruddiness on his breast particularly, and in his face. Moreover, that a very pleasant odour exhaled from his skin and that there was a fragrance about his mouth and all his flesh, so that his garments were filled with it, this we have read in the ''Memoirs of Aristoxenus''.{{Sfn |Plutarch|1919|loc = [https:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0243:chapter=4&highlight=lysippus IV, 1]}}}}\u003cbr\u003e \u003cbr\u003e+[[File:ACMA 1331 Alexander 2.JPG|thumb|right|alt=A bust of Alexander the Great by Leochares|Head of Alexander the Great, by Leochares, ca. 330 BC]]\u003cbr\u003e+\u003cbr\u003e Historians have understood the detail of the pleasant fragrance attributed to Alexander as stemming from a belief in ancient Greece that pleasant scents are characteristic of gods and heroes.\u003cref name=\"Alexander the Great\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e [[File:Detail of fresco depicting Alexander the Great.jpg|thumb|right|A fresco depicting a hunt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e \u003cbr\u003e The [[Alexander Mosaic]] and contemporary coins portray Alexander with \"a straight nose, a slightly protruding jaw, full lips and eyes deep set beneath a strongly pronounced forehead\".\u003cref name=\"Alexander the Great\"\u002f\u003e He is also described as having a slight upward tilt of his head to the left.{{sfn|Renault|2013|p=1}}\u003cbr\u003e-\u003cbr\u003e-[[File:ACMA 1331 Alexander 2.JPG|thumb|right|alt=A bust of Alexander the Great by Leochares|Head of Alexander the Great, by Leochares, ca. 330 BC]]\u003cbr\u003e \u003cbr\u003e In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e ","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -448,7 +448,7 @@\u003cbr\u003e ===Physical appearance===\u003cbr\u003e \u003cbr\u003e [[File:AlexanderCameo.JPG|thumb|left|Alexander [[Cameo_(carving)|cameo]] by [[Pyrgoteles]]|upright=.9]]\u003cbr\u003e-Historical sources frequently give conflicting accounts of Alexander's appearance, and the earliest sources are the most scant in their detail.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=72}}\u003c\u002fref\u003e During his lifetime, Alexander carefully curated his image by commissioning works from famous and great artists of the time. This included commissioning sculptures by [[Lysippos]], paintings by [[Apelles]] and gem engravings by [[Pyrgoteles]].\u003cref name=\"Alexander the Great\"\u003e{{cite book |last1=Nawotka |first1=Krzysztof |title=Alexander the Great |date=2010 |publisher=Cambridge Scholars Publishing |page=43}}\u003c\u002fref\u003e Ancient authors recorded that Alexander was so pleased with portraits of himself created by Lysippos that he forbade other sculptors from crafting his image; scholars today, however, find the claim dubious.\u003cref\u003e{{cite web |title=Images of Authority II: The Greek Example |year=2005 |publisher=SUNY Oneonta |url=http:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |access-date=16 December 2011 |archive-date=4 October 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20181004195912\u002fhttp:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Alexander the Great\"\u002f\u003e Nevertheless, Andrew Stewart highlights the fact that artistic portraits, not least because of who they are commissioned by, are always partisan, and that artistic portrayals of Alexander \"seek to legitimize him (or, by extension, his Successors), to interpret him to their audiences, to answer their critiques, and to persuade them of his greatness\", and thus should be considered within a framework of \"praise and blame\", in the same way sources such as praise poetry are.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=69}}\u003c\u002fref\u003e Despite those caveats, Lysippos's sculpture, famous for its naturalism, as opposed to a stiffer, more static pose, is thought to be the most faithful depiction.{{Sfn |Bosworth|1988|pp = 19\u201320}}\u003cbr\u003e+Historical sources frequently give conflicting accounts of Alexander's appearance, and the earliest sources are the most scant in their detail.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=72}}\u003c\u002fref\u003e During his lifetime, Alexander carefully curated his image by commissioning works from famous and great artists of the time. This included commissioning sculptures by [[Lysippos]], paintings by [[Apelles]] and gem engravings by [[Pyrgoteles]].\u003cref name=\"Alexander the Great\"\u003e{{cite book |last1=Nawotka |first1=Krzysztof |title=Alexander the Great |date=2010 |publisher=Cambridge Scholars Publishing |page=43}}\u003c\u002fref\u fore, since his feet did not reach its lowest step, one of the royal pages placed a table under his feet.{{sfn |Rolfe |1946 |loc = 5.2.13}}}}\u003cbr\u003e \u003cbr\u003e-Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003e{{cite book |last1=Skelton |first1=Debra |last2=Dell |first2=Pamela |title=Empire of Alexander the Great |date=2009 |publisher=Infobase Publishing |isbn=978-1-60413-162-8 |page=83 |url=https:\u002f\u002fwww.google.com\u002fbooks\u002fedition\u002fEmpire_of_Alexander_the_Great\u002fQcJuRH89a8UC?hl=en&gbpv=1&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83&printsec=frontcover |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Both Curtius and [[Diodorus]] report a story that when [[Darius III]]'s mother, [[Sisygambis]], first met Alexander and [[Hephaestion]], she assumed that the latter was Alexander because he was the taller and more physically impressive of the two.\u003cref\u003e{{cite book |last1=Skelton |first1=Debra |last2=Dell |first2=Pamela |title=Empire of Alexander the Great |date=2009 |publisher=Infobase Publishing |isbn=978-1-60413-162-8 |page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=QcJuRH89a8UC&dq=Robin+Lane+Fox+Hephaestion+Sisygambis&pg=PA83 |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Siculus |first1=Diodorus |title=Diodorus of Sicily in Twelve Volumes with an English Translation by C. H. Oldfather. Vol. 4\u20138. |date=1989 |publisher=Harvard University Press |url=http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.01.0084%3Abook%3D17%3Achapter%3D37 |access-date=7 July 2021 |archive-date=9 July 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210709192544\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.01.0084:book%3D17:chapter%3D37 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander-lysippus1-1.jpg|thumb|Roman copy of the Alexander portrait by [[Lysippos]]|left|upright]]\u003cbr\u003e The Greek biographer [[Plutarch]] ({{circa| 45|120&nbsp;AD}}) discusses the accuracy of his depictions:\u003cbr\u003e@@ -499,7 +499,7 @@\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn's arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e At the same time, ancient writers did not conclusively identify them as lovers.\u003cref\u003e{{Citation |last=Palagia |first=Olga |title=Hephaestion\u2019s Pyre and the Royal Hunt of Alexander |date=2000-09-07 |work=Alexander the Great in Fact and Fiction |pages=167\u2013206 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002facprof:oso\u002f9780198152873.003.0006 |access-date=2025-03-06 |publisher=Oxford University Press |isbn=978-0-19-815287-3}}\u003c\u002fref\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e+Alexander's sexuality has been the subject of speculation and controversy in modern times.{{sfn|Ogden|2009|p=204}} The Roman era writer [[Athenaeus]] says, based on the scholar [[Dicaearchus]], who was Alexander's contemporary, that the king \"was quite excessively keen on boys\", and that Alexander kissed the [[eunuch]] [[Bagoas (courtier)|Bagoas]] in public.\u003cref\u003e{{cite book |title=Homosexuality in Greece and Rome: A Sourcebook of Basic Documents |url=https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb|url-access=limited |editor=Thomas K. Hubbard |year=2003 |isbn=978-0-520-23430-7 |publisher=University of California Press |page=[https:\u002f\u002farchive.org\u002fdetails\u002fhomosexualitygre00hubb\u002fpage\u002fn97 79]}}\u003c\u002fref\u003e This episode is also told by Plutarch, probably based on the same source. Historian [[William Woodthorpe Tarn]] rejected the stories of Bagoas as fabricated in ancient times to defame Alexander, mainly referring to the [[Quintus Curtius Rufus|Rufus]]'s fairly fictionalized biography of Alexander that criticized the Macedonian's \"degeneration\" in embracing foreign Persian customs\u003cref\u003e{{Cite journal |last=Tougher |first=Sean |date=2008 |title=The Renault Bagoas: The Treatemnet of Alexander the Great's Eunuch in Mary Renault's ''The Persian Boy'' |url=https:\u002f\u002ffass.open.ac.uk\u002fsites\u002ffass.open.ac.uk\u002ffiles\u002ffiles\u002fnew-voices-journal\u002fissue3\u002fTougher.pdf |journal=New Voices in Classical Reception Studies |issue=3 |pages=77\u201389}}\u003c\u002fref\u003e However, in 1958 Badian countered Tarn's arguments, though his concern was the issue of the reliability of sources for Alexander rather than the figure of the eunuch himself.{{sfn|Tougher|2008}} None of Alexander's contemporaries, however, are known to have explicitly described Alexander's relationship with Hephaestion as sexual, though the pair was often compared to [[Achilles and Patroclus]], who are often interpreted as a couple. Aelian writes of Alexander's visit to [[Troy]] where \"Alexander garlanded the tomb of Achilles, and Hephaestion that of [[Patroclus]], the latter hinting that he was a beloved of Alexander, in just the same way as Patroclus was of Achilles.\"\u003cref name=\"AelXII7\" \u002f\u003e At the same time, ancient writers did not conclusively identify them as lovers.\u003cref\u003e{{Citation |last=Palagia |first=Olga |title=Hephaestion's Pyre and the Royal Hunt of Alexander |date=2000-09-07 |work=Alexander the Great in Fact and Fiction |pages=167\u2013206 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002facprof:oso\u002f9780198152873.003.0006 |access-date=2025-03-06 |publisher=Oxford University Press |doi=10.1093\u002facprof:oso\u002f9780198152873.003.0006 |isbn=978-0-19-815287-3}}\u003c\u002fref\u003e Some modern historians (e.g., [[Robin Lane Fox]]) believe not only that Alexander's youthful relationship with Hephaestion was sexual, but also that their sexual contacts may have continued into adulthood, which went against the social norms of at least some Greek cities, such as Athens,\u003cref\u003e{{cite book |author=Marilyn Skinner |title=Sexuality in Greek and Roman Culture (Ancient Cultures) |edition=2nd |publisher=Wiley-Blackwell |isbn=978-1-4443-4986-3 |page=190 |year=2013}}\u003c\u002fref\u003e{{sfn|Sacks|1995|p=16}} though some modern researchers have tentatively proposed that Macedonia (or at least the Macedonian court) may have been more tolerant of homosexuality between adults.\u003cref\u003e{{cite book|editor-last=Hubbard|editor-first=Thomas |title=A Companion to Greek and Roman Sexualities |date=2014 |publisher=Blackwell Publishing Ltd |isbn=978-1-4051-9572-0 |page=143 |chapter=Chapter 8: Peer Homosexuality |author=Thomas Hubbard}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alexander and Hephaestion.jpg|thumb|Alexander and his general [[Hephaestion]], at the [[Getty Villa]]|left]]\u003cbr\u003e \u003cbr\u003e@@ -1015,7 +1015,7 @@\u003cbr\u003e * {{cite book |last=Hammond |first=NGL |year=1997 |title=The Genius of Alexander the Great |url=https:\u002f\u002farchive.org\u002fdetails\u002fgeniusofalexande00nglh |url-access=registration |location=Chapel Hill |publisher=University of North Carolina Press}}\u003cbr\u003e * {{cite book |last=Lane Fox |first=Robin |author-link=Robin Lane Fox |year=1973 |title=Alexander the Great |location=London |publisher=Allen Lane |isbn=978-0-14-008878-6}}, also (1974) New York: E. P. Dutton and (1986) London: [[Penguin Books]].\u003cbr\u003e * {{cite book |last=Mercer |first=Charles |year=1962 |title=The Way of Alexander the Great |location=Boston |publisher=American Heritage Inc.}}\u003cbr\u003e-* {{cite book |last=McCrindle |first=J. W. |year=1893 |title=The Invasion of India by Alexander the Great as Described by Arrian, Q Curtius, Diodorus, Plutarch, and Justin |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=A9YNAAAAIAAJ |location=Westminster |publisher=Archibald Constable & Co |access-date=20 June 2015}}\u003cbr\u003e+* {{cite book |last=McCrindle |first=J. W. |year=1893 |title=The Invasion of India by Al nt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e \u003cbr\u003e The [[Alexander Mosaic]] and contemporary coins portray Alexander with \"a straight nose, a slightly protruding jaw, full lips and eyes deep set beneath a strongly pronounced forehead\".\u003cref name=\"Alexander the Great\"\u002f\u003e He is also described as having a slight upward tilt of his head to the left.{{sfn|Renault|2013|p=1}}\u003cbr\u003e+\u003cbr\u003e+It has also been argued by modern academics that the head made of Alexander by [[Leochares]] may also be a faithful depition of Alexander.\u003cref\u003e{{cite web |last1=Alterman |first1=Lori |title=Alexander III and the Men Who Made Him Great |url=https:\u002f\u002ftheses.gla.ac.uk\u002f76180\u002f |publisher=ProQuest Dissertations & Theses, |language=en |date=2000}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In his the Anabasis, Arrian describes Alexander's physical appearance and character as: \u003cbr\u003e ","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -467,8 +467,6 @@\u003cbr\u003e [[File:Detail of fresco depicting Alexander the Great.jpg|thumb|right|A fresco depicting a hunt scene at the tomb of [[Philip II of Macedon|Philip II]] at [[Aegae (Macedonia)|Aigai]], the only known painting of Alexander made during his lifetime, 330s BC]]\u003cbr\u003e \u003cbr\u003e The [[Alexander Mosaic]] and contemporary coins portray Alexander with \"a straight nose, a slightly protruding jaw, full lips and eyes deep set beneath a strongly pronounced forehead\".\u003cref name=\"Alexander the Great\"\u002f\u003e He is also described as having a slight upward tilt of his head to the left.{{sfn|Renault|2013|p=1}}\u003cbr\u003e-\u003cbr\u003e-It has also been argued by modern academics that the head made of Alexander by [[Leochares]] may also be a faithful depition of Alexander.\u003cref\u003e{{cite web |la :\u002f\u002fweb.archive.org\u002fweb\u002f20181004195912\u002fhttp:\u002f\u002femployees.oneonta.edu\u002ffarberas\u002farth\u002farth200\u002fpolitics\u002fimages_authority_2_greek.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Alexander the Great\"\u002f\u003e Nevertheless, Andrew Stewart highlights the fact that artistic portraits, not least because of who they are commissioned by, are always partisan, and that artistic portrayals of Alexander \"seek to legitimize him (or, by extension, his Successors), to interpret him to their audiences, to answer their critiques, and to persuade them of his greatness\", and thus should be considered within a framework of \"praise and blame\", in the same way sources such as praise poetry are.\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=69}}\u003c\u002fref\u003e Despite those caveats, Lysippos's sculpture, famous for its naturalism, as opposed to a stiffer, more static pose, is thought to be by some the most faithful depiction.{{Sfn |Bosworth|1988|pp = 19\u201320}}\u003cbr\u003e+Historical sources frequently give conflicting accounts of Alexander's appearance, and the earliest sources are the most scant in their detail;\u003cref\u003e{{cite book |last1=Stewart |first1=Andrew |title=Faces of Power : Alexander's Image and Hellenistic Politics Hellenistic Culture and Society |date=1993 |publisher=University of California Press |isbn=978-0-520-06851-3 |page=72}}\u003c\u002fref\u003e for example, Arrian describes him simply as \"very handsome\".\u003cref\u003e{{harvnb|Arrian|1976|loc=VII, 28}}\u003c\u002fref\u003e During his lifetime, Alexander carefully curated his image by commissioning works from famous and great artists of the time. This included commissioning sculptures by [[Lysippos]], paintings by [[Apelles]] and gem en
