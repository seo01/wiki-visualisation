rogress in artificial intelligence|progress]] in what has become known as the [[AI boom]]. The emergence of advanced generative AI in the midst of the AI boom and its ability to create and modify content exposed several unintended consequences and harms in the present and raised concerns about the [[AI risk|risks of AI]] and [[AI aftermath scenarios|its long-term effects]] in the future, prompting discussions about [[Regulation of artificial intelligence|regulatory policies]] to ensure the [[AI safety|safety and benefits of the technology]].","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Artificial intelligence}}\u003c!-- portal --\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- DEFINITIONS --\u003e\u003cbr\u003e-'''Artificial intelligence''' ('''AI''') refers to the capability of [[computer|computational systems]] to perform tasks typically associated with [[human intelligence]], such as learning, reasoning, problem-solving, perception, and decision-making. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e+'''Artificial intelligence''' ('''AI''') refers to the capability of [[computer|computational systems]] to perform tasks typically associated with [[human intelligence]], such as learning, reasoning, problem-solving, perception, and decision-making. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[machine perception|perceive their environment]] and use [[machine learning|learning]] and [[intelligence]] to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]],  success was based on both hardware improvements ([[Moore's law|faster computers]],\u003cref\u003e[[Moore's Law]] and AI: {{Harvtxt|Russell|Norvig|2021|pp=14, 27}}\u003c\u002fref\u003e [[graphics processing unit]]s, [[cloud computing]]{{Sfnp|Clark|2015b}}) and access to [[big data|large amounts of data]]\u003cref\u003e[[Big data]]: {{Harvtxt|Russell|Norvig|2021|p=26}}\u003c\u002fref\u003e (including curated datasets,{{Sfnp|Clark|2015b}} such as [[ImageNet]]). Deep learning's success led to an enormous increase in interest and funding in AI.{{Efn|Jack Clark wrote in [[Bloomberg News|Bloomberg]]: \"After a half-decade of quiet breakthroughs in artificial intelligence, 2015 has been a landmark year. Computers are smarter and learning faster than ever\", and noted that the number of software projects that use machine learning at [[Google]] increased from a \"sporadic usage\" in 2012 to more than 2,700 projects in 2015.{{Sfnp|Clark|2015b}}}} The amount of machine learning research (measured by total publications) increased by 50% in the years 2015\u20132019.{{Sfnp|UNESCO|2021}}\u003cbr\u003e \u003cbr\u003e \u003c!-- ALIGNMENT PROBLEM --\u003e\u003cbr\u003e-[[File:20250202 \"AI\" (search term) on Google Trends.svg|thumb|The number of Google searches for the term \"AI\" began to increase in about 2022.]]\u003cbr\u003e+[[File:20250202 \"AI\" (search term) on Google Trends.svg|thumb|The number of Google searches for the term \"AI\" accelerated in 2022.]]\u003cbr\u003e In 2016, issues of [[algorithmic fairness|fairness]] and the misuse of technology were catapulted into center stage at machine learning conferences, publications vastly increased, funding became available, and many researchers re-focussed their careers on these issues. The [[AI alignment|alignment problem]] became a serious field of academic study.{{Sfnp|Christian|2020|pp=67, 73}}\u003cbr\u003e \u003cbr\u003e \u003c!-- AI Boom 2020-present --\u003e","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -187,7 +187,7 @@\u003cbr\u003e ===GPT===\u003cbr\u003e [[Generative pre-trained transformer]]s (GPT) are [[large language model]]s (LLMs) that generate text based on the semantic relationships between words in sentences. Text-based GPT models are pretrained on a large [[corpus of text]] that can be from the Internet. The pretraining consists of predicting the next [[Lexical analysis|token]] (a token being usually a word, subword, or punctuation). Throughout this pretraining, GPT models accumulate knowledge about the world and can then generate human-like text by repeatedly predicting the next token. Typically, a subsequent training phase makes the model more truthful, useful, and harmless, usually with a technique called [[reinforcement learning from human feedback]] (RLHF). Current GPT models are prone to generating falsehoods called \"[[Hallucination (artificial intelligence)|hallucinations]]\", although this can be reduced with RLHF and quality data. They are used in [[chatbot]]s, which allow people to ask a question or request a task in simple text.{{Sfnp|Smith|2023}}\u003cref\u003e{{Cite web |date=9 November 2023 |title=Explained: Generative AI |url=https:\u002f\u002fnews.mit.edu\u002f2023\u002fexplained-generative-ai-1109}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Current models and services include [[Gemini (chatbot)|Gemini]] (formerly Bard), [[ChatGPT]], [[Grok (chatbot)|Grok]], [[Anthropic#Claude|Claude]], [[Microsoft Copilot|Copilot]], and [[LLaMA]].\u003cref\u003e{{Cite web |title=AI Writing and Content Creation Tools |url=https:\u002f\u002fmitsloanedtech.mit.edu\u002fai\u002ftools\u002fwriting |access-date=25 December 2023 |publisher=MIT Sloan Teaching & Learning Technologies |archive-date=25 December 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231225232503\u002fhttps:\u002f\u002fmitsloanedtech.mit.edu\u002fai\u002ftools\u002fwriting\u002f |url-status=live }}\u003c\u002fref\u003e [[Multimodal learning|Multimodal]] GPT mod anguage-model-aims-for-open-source-supremacy |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Edwards |first=Benj |date=2024-02-22 |title=Stability announces Stable Diffusion 3, a next-gen AI image generator |url=https:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator |access-date=2024-04-14 |website=Ars Technica |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170201\u002fhttps:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator\u002f |url-status=live }}\u003c\u002fref\u003e meaning that their architecture and trained parameters (the \"weights\") are publicly available. Open-weight models can be freely [[Fine-tuning (deep learning)|fine-tuned]], which allows companies to specialize them with their own data and for their own use-case.\u003cref\u003e{{Cite news |last=Marshall |first=Matt |date=January 29, 2024 |title=How enterprises are using open source LLMs: 16 examples |url=https:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples |work=VentureBeat |access-date=5 October 2024 |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926171131\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples\u002f |url-status=live }}\u003c\u002fref\u003e Open-weight models are useful for research and innovation but can also be misused. Since they can be fine-tuned, any built-in security measure, such as objecting to harmful requests, can be trained away until it becomes ineffective. A study in 2025 analyzed activity from Hugging Face and concluded that   Open-weight models are significantly improved in terms size and benchmark score highlighting the importance open-source community has on model improvements \u003cref\u003e{{Cite journal |last=Vake |first=Domen |last2=\u0160inik |first2=Bogdan |last3=Vi\u010di\u010d |first3=Jernej |last4=To\u0161i\u0107 |first4=Aleksandar |date=2025-01 |title=Is Open Source the Future of AI? A Data-Driven Approach |url=https:\u002f\u002fwww.mdpi.com\u002f2076-3417\u002f15\u002f5\u002f2790 |journal=Applied Sciences |language=en |volume=15 |issue=5 |pages=2790 |doi=10.3390\u002fapp15052790 |issn=2076-3417}}\u003c\u002fref\u003e. Some researchers warn that future AI models may develop dangerous capabilities (such as the potential to drastically facilitate [[bioterrorism]]) and that once released on the Internet, they cannot be deleted everywhere if needed. They recommend pre-release audits and cost-benefit analyses.\u003cref\u003e{{Cite web |last=Piper |first=Kelsey |date=2024-02-02 |title=Should we make our most powerful AI models open source to all? |url=https:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |access-date=2024-04-14 |website=Vox |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170204\u002fhttps:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Active organizations in the AI open-source community include [[Hugging Face]],\u003cref\u003e{{Cite web |last1=Stewart |first1=Ashley |last2=Melton |first2=Monica |title=Hugging Face CEO says he's focused on building a 'sustainable model' for the $4.5 billion open-source-AI startup |url=https:\u002f\u002fwww.businessinsider.com\u002fhugging-face-open-source-ai-approach-2023-12 |access-date=2024-04-14 |website=Business Insider |archive-date=25 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f2024 erator |url=https:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator |access-date=2024-04-14 |website=Ars Technica |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170201\u002fhttps:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator\u002f |url-status=live }}\u003c\u002fref\u003e meaning that their architecture and trained parameters (the \"weights\") are publicly available. Open-weight models can be freely [[Fine-tuning (deep learning)|fine-tuned]], which allows companies to specialize them with their own data and for their own use-case.\u003cref\u003e{{Cite news |last=Marshall |first=Matt |date=January 29, 2024 |title=How enterprises are using open source LLMs: 16 examples |url=https:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples |work=VentureBeat |access-date=5 October 2024 |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926171131\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples\u002f |url-status=live }}\u003c\u002fref\u003e Open-weight models are useful for research and innovation but can also be misused. Since they can be fine-tuned, any built-in security measure, such as objecting to harmful requests, can be trained away until it becomes ineffective. Some researchers warn that future AI models may develop dangerous capabilities (such as the potential to drastically facilitate [[bioterrorism]]) and that once released on the Internet, they cannot be deleted everywhere if needed. They recommend pre-release audits and cost-benefit analyses.\u003cref\u003e{{Cite web |last=Piper |first=Kelsey |date=2024-02-02 |title=Should we make our most powerful AI models open source to all? |url=https:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |access-date=2024-04-14 |website=Vox |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170204\u002fhttps:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Frameworks ===\u003cbr\u003e Artificial Intelligence projects can have their ethical permissibility tested while designing, developing, and implementing an AI system. An AI framework such as the Care and Act Framework containing the SUM values\u2014developed by the [[Alan Turing Institute]] tests projects in four main areas:\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2019 |title=Understanding artificial intelligence ethics and safety |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911131935\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2023 |title=AI Ethics and Governance in Practice |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125504\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |url-status=live }}\u003c\u002fref\u003e","--- Revision 33\u003cbr\u003e+++ Revision 34\u003cbr\u003e@@ -203,7 +203,7 @@\u003cbr\u003e {{Main|Artificial intelligence in healthcare}}\u003cbr\u003e The application of AI in [[medicine]] and [[medical research]] has the potential to increase patient care and quality of life.\u003cref\u003e{{Cite journal |last1=Davenport |first1=T |last2=Kalakota |first2=R |date=June 2019 |title=The potential for artificial intelligence in healthcare |journal=Future Healthc J. |volume=6 |issue=2 |pages=94\u201398 |doi=10.7861\u002ffuturehosp.6-2-94 |pmc=6616181 |pmid=31363513}}\u003c\u002fref\u003e Through the lens of the [[Hippocratic Oath]], medical professionals are ethically compelled to use AI, if applications can more accurately diagnose and treat patients.\u003cref\u003e{{Cite journal |last1=Lyakhova |first1=U.A. |last2=Lyakhov |first2=P.A. |date=2024 |title=Systematic review of approaches to detection and classification of skin cancer using artificial intelligence: Development and prospects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |journal=Computers in Biology and Medicine |language=en |volume=178 |pages=108742 |doi=10.1016\u002fj.compbiomed.2024.108742 |pmid=38875908 |archive-date=3 December 2024 |access-date=10 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241203172502\u002fhttps:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Alqudaihi |first1=Kawther S. |last2=Aslam |first2=Nida |last3=Khan |first3=Irfan Ullah |last4=Almuhaideb |first4=Abdullah M. |last5=Alsunaidi |first5=Shikah J. |last6=Ibrahim |first6=Nehad M. Abdel Rahman |last7=Alhaidari |first7=Fahd A. |last8=Shaikh |first8=Fatema S. |last9=Alsenbel |first9=Yasmine M. |last10=Alalharith |first10=Dima M. |last11=Alharthi |first11=Hajar M. |last12=Alghamdi |first12=Wejdan M. |last13=Alshahrani |first13=Mohammed S. |date=2021 |title=Cough Sound Detection and Diagnosis Using Artificial Intelligence Techniques: Challenges and Opportunities |journal=IEEE Access |volume=9 |pages=102327\u2013102344 |doi=10.1109\u002fACCESS.2021.3097559 |issn=2169-3536 |pmc=8545201 |pmid=34786317|bibcode=2021IEEEA...9j2327A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-For medical research, AI is an important tool for processing and integrating [[big data]]. This is particularly important for [[organoid]] and [[tissue engineering]] development which use [[microscopy]] imaging as a key technique in fabrication.\u003cref name=\"Bax-2023\"\u003e{{Cite journal |last1=Bax |first1=Monique |last2=Thorpe |first2=Jordan |last3=Romanov |first3=Valentin |date=December 2023 |title=The future of personalized cardiovascular medicine demands 3D and 4D printing, stem cells, and artificial intelligence |journal=Frontiers in Sensors |volume=4 |doi=10.3389\u002ffsens.2023.1294721 |issn=2673-5067 |doi-access=free}}\u003c\u002fref\u003e It has been suggested that AI can overcome discrepancies in funding allocated to different fields of research.\u003cref name=\"Bax-2023\"\u002f\u003e\u003cref\u003e{{Cite journal |last=Dankwa-Mullan |first=Irene |date=2024 |title=Health Equity and Ethical Considerations in Using Artificial Intelligence in Public Health and Medicine |url=https:\u002f\u002fwww.cdc.gov\u002fpcd\u002fissues\u002f2024\u002f24_0245.htm |journal=Preventing Chronic Disease |language=en-us |volume=21 |doi=10.5888\u002fpcd21.240245 |issn=1545-1151}}\u003c\u002fref\u003e New AI tools can deepen the understanding of biomedically relevant pathways. For example, [[AlphaFold 2]] (2021) demonstrated the ability to approximate, in hours rather than months, the 3D [[Protein structure|structure of a protein]].\u003cref\u003e{{Cite journal |last1=Jumper |first1=J |last2=Evans |first2=R |last3=Pritzel |first3=A |date=2021 |title=Highly accurate protein structure prediction with AlphaFold |journal=Nature |volume=596 |issue=7873 |pages=583\u2013589 |bibcode=2021Natur.596..583J |doi=10.1038\u002fs41586-021-03819-2 |pmc=8371605 |pmid=34265844}}\u003c\u002fref\u003e In 2023, it was reported that AI-guided drug discovery helped find a class of antibiotics capable of killing two different types of drug-resistant bacteria.\u003cref\u003e{{Cite web |date=2023-12-20 |title=AI discovers new class of antibiotics to kill drug-resistant bacteria |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |access-date=5 October 2024 |archive-date=16 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240916014421\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |url-status=live }}\u003c\u002fref\u003e In 2024, researchers used machine learning to accelerate the search for [[Parkinson's disease]] drug treatments. Their aim was to identify compounds that block the clumping, or aggregation, of [[alpha-synuclein]] (the protein that characterises Parkinson's disease). They were able to speed up the initial screening process ten-fold and reduce the cost by a thousand-fold.\u003cref\u003e{{Cite web |date=2024-04-17 |title=AI speeds up drug design for Parkinson's ten-fold |url=https:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |publisher=Cambridge University |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165755\u002fhttps:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Horne |first1=Robert I. |last2=Andrzejewska |first2=Ewa A. |last3=Alam |first3=Parvez |last4=Brotzakis |first4=Z. policies and laws for promoting and regulating AI; it is therefore related to the broader regulation of algorithms.\u003cref\u003eRegulation of AI to mitigate risks: {{Harvtxt|Berryhill|Heang|Clogher|McBride|2019}}, {{Harvtxt|Barfield|Pagallo|2018}}, {{Harvtxt|Iphofen|Kritikos|2019}}, {{Harvtxt|Wirtz|Weyerer|Geyer|2018}}, {{Harvtxt|Buiten|2019}}\u003c\u002fref\u003e The regulatory and policy landscape for AI is an emerging issue in jurisdictions globally.{{Sfnp|Law Library of Congress (U.S.). Global Legal Research Directorate|2019}} According to AI Index at [[Stanford]], the annual number of AI-related laws passed in the 127 survey countries jumped from one passed in 2016 to 37 passed in 2022 alone.{{Sfnp|Vincent|2023}}{{Sfnp|Stanford University|2023}} Between 2016 and 2020, more than 30 countries adopted dedicated strategies for AI.{{Sfnp|UNESCO|2021}} Most EU member states had released national AI strategies, as had Canada, China, India, Japan, Mauritius, the Russian Federation, Saudi Arabia, United Arab Emirates, U.S., and Vietnam. Others were in the process of elaborating their own AI strategy, including Bangladesh, Malaysia and Tunisia.{{Sfnp|UNESCO|2021}} The [[Global Partnership on Artificial Intelligence]] was launched in June 2020, stating a need for AI to be developed in accordance with human rights and democratic values, to ensure public confidence and trust in the technology.{{Sfnp|UNESCO|2021}} [[Henry Kissinger]], [[Eric Schmidt]], and [[Daniel Huttenlocher]] published a joint statement in November 2021 calling for a government commission to regulate AI.{{Sfnp|Kissinger|2021}} In 2023, OpenAI leaders published recommendations for the governance of superintelligence, which they believe may happen in less than 10 years.{{Sfnp|Altman|Brockman|Sutskever |2023}} In 2023, the United Nations also launched an advisory body to provide recommendations on AI governance; the body comprises technology company executives, governments officials and academics.\u003cref\u003e{{Cite web |last=VOA News |date=October 25, 2023 |title=UN Announces Advisory Body on Artificial Intelligence |url=https:\u002f\u002fwww.voanews.com\u002fa\u002fun-announces-advisory-body-on-artificial-intelligence-\u002f7328732.html |access-date=5 October 2024 |archive-date=18 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240918071530\u002fhttps:\u002f\u002fwww.voanews.com\u002fa\u002fun-announces-advisory-body-on-artificial-intelligence-\u002f7328732.html |url-status=live }}\u003c\u002fref\u003e In 2024, the [[Council of Europe]] created the first international legally binding treaty on AI, called the \"[[Framework Convention on Artificial Intelligence and Human Rights, Democracy and the Rule of Law]]\". It was adopted by the European Union, the United States, the United Kingdom, and other signatories.\u003cref\u003e{{Cite web |date=5 September 2024 |title=Council of Europe opens first ever global treaty on AI for signature |url=https:\u002f\u002fwww.coe.int\u002fen\u002fweb\u002fportal\u002f-\u002fcouncil-of-europe-opens-first-ever-global-treaty-on-ai-for-signature |access-date=2024-09-17 |website=Council of Europe |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917001330\u002fhttps:\u002f\u002fwww.coe.int\u002fen\u002fweb\u002fportal\u002f-\u002fcouncil-of-europe-opens-first-ever-global-treaty-on-ai-for-signature |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -420,6 +420,7 @@\u003cbr\u003e == History ==\u003cbr\u003e {{Main|History of artificial intelligence}}\u003cbr\u003e {{For timeline}}\u003cbr\u003e+[[File:2024 AI patents by country - artificial intelligence.svg |thumb |In 2024, AI patents in China and the US numbered more than three-fourths of AI patents worldwide.\u003cref name=RandDworld_20241103\u002f\u003e Though China had more AI patents, the US had 35% more patents per AI patent-applicant company than China.\u003cref name=RandDworld_20241103\u003e{{cite web |last1=Buntz |first1=Brian |title=Quality vs. quantity: US and China chart different paths in global AI patent race in 2024 \u002f Geographical breakdown of AI patents in 2024 |url=https:\u002f\u002fwww.rdworldonline.com\u002fquality-vs-quantity-us-and-china-chart-different-paths-in-global-ai-patent-race-in-2024\u002f |publisher=R&D World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241209072113\u002fhttps:\u002f\u002fwww.rdworldonline.com\u002fquality-vs-quantity-us-and-china-chart-different-paths-in-global-ai-patent-race-in-2024\u002f |archive-date=9 December 2024 |date=3 November 2024 |url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003c!-- DON'T INCLUDE HISTORICAL PRECURSORS (THEY BELONG TO THE SEPARATE 'HISTORY OF AI' ARTICLE) --\u003e\u003cbr\u003e \u003c!-- MAJOR INTELLECTUAL PRECURSORS: LOGIC, THEORY OF COMPUTATION, CYBERNETICS, INFORMATION THEORY, NEUROBIOLOGY, SPECULATION: Antiquity - 1955 --\u003e\u003cbr\u003e The study of mechanical or \"formal\" reasoning began with philosophers and mathematicians in antiquity. The study of logic led directly to [[Alan Turing]]'s [[theory of computation]], which suggested that a machine, by shuffling symbols as simple as \"0\" and \"1\", could simulate any conceivable form of mathematical reasoning.{{Sfn|Russell|Norvig|2021|p=9}}\u003cref name=\"Clarendon Press-2004\"\u002f\u003e This, along with concurrent discoveries in [[cybernetics]], [[information theory]] and [[neurobiology]], led researchers to consider the possibility of building an \"electronic brain\".{{Efn|\"Electronic brain\" was the term used by the press around this time.{{Sfn|Russell|Norvig|2021|p=9}}\u003cref\u003e{{Cite web |title=Google books ngram |url=https:\u002f\u002fbooks.google.com\u002fngrams\u002fgraph?content=electronic+brain&year_start=1930&year_end=2019&corpus=en-2019&smoothing=3 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170209\u002fhttps:\u002f\u002fbooks.google.com\u002fngrams\u002fgraph?content=electronic+brain&year_start=1930&year_end=2019&corpus=en-2019&smoothing=3 |url-status=live }}\u003c\u002fref\u003e}} They developed several areas of research that would become part of AI,\u003cref\u003eAI's immediate precursors: {{Harvtxt|McCorduck|2004|pp=51\u2013107}}, {{Harvtxt|Crevier|1993|pp=27\u201332}}, {{Harvtxt|Russell|Norvig|2021|pp=8\u201317}}, {{Harvtxt|Moravec|1988|p=3}}\u003c\u002fref\u003e such as [[Warren McCullouch|McCullouch]] and [[Walter Pitts|Pitts]] design for \"artificial neurons\" in 1943,{{Sfnp|Russell|Norvig|2021|p=17}} and Turing's influential 1950 paper '[[Computing Machinery and Intelligence]]', which introduced the [[Turing test]] and showed that \"machine intelligence\" was plausible.\u003cref name=\"Turing\"\u002f\u003e\u003cref name=\"Clarendon Press-2004\"\u003e{{Cite book |title=The Essential Turing: the ideas that gave birth to the computer age |date=2004 |publisher=Clarendon Press |isbn=0-1982-5079-7 |editor-last=Copeland |editor-first=J. |location=Oxford, England}}\u003c\u002fref\u003e","--- Revision 36\u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -224,7 +224,7 @@\u003cbr\u003e === Finance ===\u003cbr\u003e Finance is one of the fastest growing sectors where applied AI tools are being deployed: from retail online banking to investment advice and insurance, where automated \"robot advisers\" have been in use for some years.\u003cref\u003eMatthew Finio & Amanda Downie: IBM Think 2024 Primer, \"What is Artificial Intelligence (AI) in Finance?\" 8 Dec. 2023\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[World Pensions & Investments Forum|World Pensions]] experts like Nicolas Firzli insist it may be too early to see the emergence of highly innovative AI-informed financial products and services: \"the deployment of AI tools will simply further automatise things: destroying tens of thousands of jobs in banking, financial planning, and pension advice in the process, but I'm not sure it will unleash a new wave of [e.g., sophisticated] pension innovation.\"\u003cref\u003eM. Nicolas, J. Firzli: Pensions Age\u002fEuropean Pensions magazine, \"Artificial Intelligence: Ask the Industry\" May June 2024 https:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125502\u002fhttps:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f |date=11 September 2024 }}.\u003c\u002fref\u003e\u003cbr\u003e+According to Nicolas Firzli, director of the [[World Pensions & Investments Forum]], it may be too early to see the emergence of highly innovative AI-informed financial products and services. He argues that \"the deployment of AI tools will simply further automatise things: destroying tens of thousands of jobs in banking, financial planning, and pension advice in the process, but I'm not sure it will unleash a new wave of [e.g., sophisticated] pension innovation.\"\u003cref\u003eM. Nicolas, J. Firzli: Pensions Age \u002f European Pensions magazine, \"Artificial Intelligence: Ask the Industry\", May\u2013June 2024. https:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125502\u002fhttps:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f |date=11 September 2024}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Military ===\u003cbr\u003e {{main|Military applications of artificial intelligence}}","--  and innovation but can also be misused. Since they can be fine-tuned, any built-in security measure, such as objecting to harmful requests, can be trained away until it becomes ineffective. Some researchers warn that future AI models may develop dangerous capabilities (such as the potential to drastically facilitate [[bioterrorism]]) and that once released on the Internet, they cannot be deleted everywhere if needed. They recommend pre-release audits and cost-benefit analyses.\u003cref\u003e{{Cite web |last=Piper |first=Kelsey |date=2024-02-02 |title=Should we make our most powerful AI models open source to all? |url=https:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |access-date=2024-04-14 |website=Vox |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170204\u002fhttps:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Frameworks ===\u003cbr\u003e-Artificial Intelligence projects can have their ethical permissibility tested while designing, developing, and implementing an AI system. An AI framework such as the Care and Act Framework containing the SUM values\u2014developed by the [[Alan Turing Institute]] tests projects in four main areas:\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2019 |title=Understanding artificial intelligence ethics and safety |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911131935\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2023 |title=AI Ethics and Governance in Practice |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125504\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Artificial Intelligence projects can be guided by ethical considerations during the design, development, and implementation of an AI system. An AI framework such as the Care and Act Framework, developed by the [[Alan Turing Institute]] and based on the SUM values, outlines four main ethical dimensions, defined as follows:\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2019 |title=Understanding artificial intelligence ethics and safety |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911131935\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2023 |title=AI Ethics and Governance in Practice |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125504\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e * '''Respect''' the dignity of individual people\u003cbr\u003e * '''Connect''' with other people sincerely, openly, and inclusively\u003cbr\u003e * '''Care''' for the wellbeing of everyone","--- Revision 38\u003cbr\u003e+++ Revision 39\u003cbr\u003e@@ -555,7 +555,7 @@\u003cbr\u003e [[Edward Fredkin]] argues that \"artificial intelligence is the next step in evolution\", an idea first proposed by [[Samuel Butler (novelist)|Samuel Butler]]'s \"[[Darwin among the Machines]]\" as far back as 1863, and expanded upon by [[George Dyson (science historian)|George Dyson]] in his 1998 book ''[[Darwin Among the Machines#Evolution of Global Intelligence|Darwin Among the Machines: The Evolution of Global Intelligence]]''.\u003cref\u003eAI as evolution: [[Edward Fredkin]] is quoted in {{Harvtxt|McCorduck|2004|p=401}}, {{Harvtxt|Butler|1863}}, {{Harvtxt|Dyson|1998}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Decomputing===\u003cbr\u003e-Arguments for ''decomputing'' have been raised by [[Dan McQuillan]] (''Resisting AI: An Anti-fascist Approach to Artificial Intelligence'', 2022), meaning an opposition to the sweeping application and expansion of artificial intelligence. Similar to [[degrowth]] the approach criticizes AI as an outgrowth of the systemic issues and capitalist world we live in. Arguing that a different future is possible, in which distance between people is reduced and not increased to AI intermediaries.\u003cref name=\"v935\"\u003e{{cite web | last=McQuillan | first=Dan | title=a gift to the far right | website=ComputerWeekly.com | date=2025-01-14 | url=https:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e+Arguments for ''decomputing'' have been raised by [[Dan McQuillan]] (''Resisting AI: An Anti-fascist Approach to Artificial Intelligence'', 2022), meaning an opposition to the sweeping application and expansion of artificial intelligence. Similar to [[degrowth]], the approach criticizes AI as an outgrowth of the systemic issues and capitalist world we live in. It argues that a different future is possible, in which distance between people is reduced rather than increased through AI intermediaries.\u003cref name=\"v935\"\u003e{{cite web | last=McQuillan | first=Dan | title=a gift to the far right | website=ComputerWeekly.com | date=2025-01-14 | url=https:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == In fiction ==\u003cbr\u003e {{Main|Artificial intelligence in fiction}}","--- Revision 39\u003cbr\u003e+++ Revision 40\u003cbr\u003e@@ -814,6 +814,7 @@\u003cbr\u003e * {{Cite journal |last1=Schulz |first1=Hannes |last2=Behnke |first2=Sven |date=1 November 2012 |title=Deep Learning |url=https:\u002f\u002fwww.researchgate.net\u002fpublication\u002f230690795 |journal=KI \u2013 K\u00fcnstliche Intelligenz |volume=26 |issue=4 |pages=357\u2013363 |doi=10.1007\u002fs13218-012-0198-z |issn=1610-1987 |s2cid=220523562 }}\u003cbr\u003e * {{Cite journal |last1=Serenko |first1=Alexander |last2=Michael Dohan |date=2011 |title=Comparing the expert survey and citation impact journal ranking methods: Example from the field of Artificial Intelligence |url=http:\u002f\u002fwww.aserenko.com\u002fpapers\u002fJOI_AI_Journal_Ranking_Serenko.pdf |url-status=live |journal=Journal of Informetrics |volume=5 |issue=4 |pages=629\u2013649 |doi=10.1016\u002fj.joi.2011.06.002 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131004212839\u002fhttp:\u002f\u002fwww.aserenko.com\u002fpapers\u002fJOI_AI_Journal_Ranking_Serenko.pdf |archive-date=4 October 2013 |access-date=12 September 2013 }}\u003cbr\u003e * {{Cite journal s methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e-High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e\u003cbr\u003e+High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[Virtual assistant|virtual assistants]] (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- GOALS AND TOOLS: SCOPE OF AI --\u003e\u003cbr\u003e-Various subfields of AI research are centered around particular goals and the use of particular tools. The traditional goals of AI research include learning, [[automated reasoning|reasoning]], [[knowledge representation]], [[Automated planning and scheduling|planning]], [[natural language processing]], [[Machine perception|perception]], and support for [[robotics]].{{Efn|name=\"Problems of AI\"}} [[Artificial general intelligence|General intelligence]]\u2014the ability to complete any task performed by a human on an at least equal level\u2014is among the field's long-term goals.\u003cref name=\"Artificial general intelligence\" \u002f\u003e To reach these goals, AI researchers have adapted and integrated a wide range of techniques, including [[state space search|search]] and [[mathematical optimization]], [[formal logic]], [[artificial neural network]]s, and methods based on [[statistics]], [[operations research]], and [[economics]].{{Efn|name=\"Tools of AI\"}} AI also draws upon [[psychology]], [[linguistics]], [[Philosophy of artificial intelligence|philosophy]], [[neuroscience]], and other fields.\u003cref\u003e{{Harvtxt|Russell|Norvig|2021|loc=\u00a71.2}}.\u003c\u002fref\u003e\u003cbr\u003e+Various subfields of AI research are centered around particular goals and the use of particular tools. The traditional goals of AI research include [[automated reasoning|reasoning]], [[knowledge representation]], [[Automated planning and scheduling|planning]], [[machine learning|learning]], [[natural language processing]], perception, and support for [[robotics]].{{Efn|name=\"Problems of AI\"}} [[Artificial general intelligence|General intelligence]]\u2014the ability to complete any task performed by a human on an at least equal level\u2014is among the field's long-term goals.\u003cref name=\"Artificial general intelligence\"\u002f\u003e To reach these goals, AI researchers have adapted and integrated a wide range of techniques, including [[state space search|search]] and [[mathematical optimization]], [[formal logic]], [[artificial neural network]]s, and methods based on [[statistics]], [[operations research]], and [[economics]].{{Efn|name=\"Tools of AI\"}} AI also draws upon [[psychology]], [[linguistics]], [[Philosophy of artificial intelligence|philosophy]], [[neuroscience]], and other fields.\u003cref\u003e{{Harvtxt|Russell|Norvig|2021|loc=\u00a71.2}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- HISTORY AND ETHICS --\u003e\u003cbr\u003e-Artificial intelligence was founded as an academic discipline in 1956,\u003cref name=\"Dartmouth workshop\"\u002f\u003e and the field went through multiple cycles of optimism throughout [[History of artificial intelligence|its history]],\u003cref name=\"Succ1\"\u002f\u003e\u003cref name=\"Fund01\"\u002f\u003e followed by periods of disappointment and loss of funding, known as [[AI winter]]s.\u003cref name=\"First AI Winter\"\u002f\u003e\u003cref name=\"Second AI Winter\"\u002f\u003e Funding and interest vastly increased after 2012 when [[deep learning]] outperformed previous AI techniques.\u003cref name=\"Deep learning revolution\"\u002f\u003e This growth accelerated further after 2017 with the [[transformer architecture]],{{Sfnp|Toews|2023}} and by the early 2020s many billions of dollars were being invested in AI and the field experienced rapid ongoing [[Progress in artificial intelligence|progress]] in what has become known as the [[AI boom]]. The emergence of advanced generative AI in the midst of the AI boom and its ability to create and modify content exposed several unintended consequences and harms in the present and raised concerns about the [[AI risk|risks of AI]] and [[AI aftermath scenarios|its long-term effects]] in the future, prompting discussions about [[Regulation of artificial intelligence|regulatory policies]] to ensure the [[AI safety|safety and benefits of the technology]].\u003cbr\u003e+Artificial intelligence was founded as an academic discipline in 1956,\u003cref name=\"Dartmouth workshop\"\u002f\u003e and the field went through multiple cycles of optimism,\u003cref name=\"Succ1\"\u002f\u003e\u003cref name=\"Fund01\"\u002f\u003e followed by periods of disappointment and loss of funding, known as [[AI winter]]s.\u003cref name=\"First AI Winter\"\u002f\u003e\u003cref name=\"Second AI Winter\"\u002f\u003e Funding and interest vastly increased after 2012 when [[deep learning]] outperformed previous AI techniques.\u003cref name=\"Deep learning revolution\"\u002f\u003e This growth accelerated further after 2017 with the [[transformer architecture]],{{Sfnp|Toews|2023}} and by the early 2020s many billions of dollars were being invested in AI (known as the \"[[AI boom]]\"). The widespread use of AI in the 21st century exposed several unintended consequences and harms in the present and raised concerns about [[AI risk|its risks]] and [[AI aftermath scenarios|long-term effects]] in the future, prompting discussions about [[Regulation of artificial intelligence|regulatory policies]] to ensure the [[AI safety|safety and benefits of the technology]].\u003cbr\u003e \u003cbr\u003e == Goals ==\u003cbr\u003e The general problem of simulating (or creating) intelligence has been broken into subproblems. These consist of particular traits or capabilities that researchers expect an intelligent system to display. The traits described below have received the most attention and cover the scope of AI research.{{Efn|name=\"Problems of AI\"|This list of intelligent traits is based on the topics covered by the major AI textbooks, including: {{Harvtxt|Russell|Norvig|2021}}, {{Harvtxt|Luger|Stubblefield|2004}}, {{Harvtxt|Poole|Mackworth|Goebel|1998}} and {{Harvtxt|Nilsson|1998}}}}\u003cbr\u003e@@ -78,7 +78,7 @@\u003cbr\u003e === Social intelligence ===\u003cbr\u003e [[File:Kismet-IMG 6007-gradient.jpg|thumb|[[Kismet (robot)|Kismet]], a robot head which was made in the 1990s; it is a machine that can recognize and simulate emotions.{{Sfnp|MIT AIL|2014}}]]\u003cbr\u003e \u003cbr\u003e-[[Affective computing]] is a field that comprises systems that recognize, interpret, process, or simulate human [[Affect (psychology)|feeling, emotion, and mood]].\u003cref\u003e[[Affective computing]]: {{Harvtxt|Thro|1993}}, {{Harvtxt|Edelson|1991}}, {{Harvtxt|Tao|Tan|2005}}, {{Harvtxt|Scassellati|2002}}\u003c\u002fref\u003e For example, some [[virtual assistant]]s are programmed to speak conversationally or even to banter humorously; it makes them appear more sensitive to the emotional dynamics of human interaction, or to otherwise facilitate [[human\u2013computer interaction]].\u003cbr\u003e+[[Affective computing]] is an interdisciplinary umbrella that comprises systems that recognize, interpret, process, or simulate human [[Affect (psychology)|feeling, emotion, and mood]].\u003cref\u003e[[Affective computing]]: {{Harvtxt|Thro|1993}}, {{Harvtxt|Edelson|1991}}, {{Harvtxt|Tao|Tan|2005}}, {{Harvtxt|Scassellati|2002}}\u003c\u002fref\u003e For example, some [[virtual assistant]]s are programmed to speak conversationally or even to banter humorously; it makes them appear more sensitive to the emotional dynamics of human interaction, or to otherwise facilitate [[human\u2013computer interaction]].\u003cbr\u003e \u003cbr\u003e However, this tends to give na\u00efve users an unrealistic conception of the intelligence of existing computer agents.{{Sfnp|Waddell|2018}} Moderate successes related to affective computing include textual [[sentiment analysis]] and, more recently, [[multimodal sentiment analysis]], wherein AI classifies the effects displayed by a videotaped subject.{{Sfnp|Poria|Cambria|Bajpai |Hussain|2017}}\u003cbr\u003e \u003cbr\u003e@@ -101,9 +101,9 @@\u003cbr\u003e [[Adversarial search]] is used for [[game AI|game-playing]] programs, such as chess or Go. It searches through a [[Game tree|tree]] of possible moves and countermoves, looking for a winning position.\u003cref\u003e[[Adversarial search]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 5}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Local search ====\u003cbr\u003e-[[File:Gradient descent.gif|class=skin-invert-image|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begins with some form of guess and refines it incrementally.\u003cref\u003e[[Local search (optimization)|Local]] or \"[[optimization]]\" search: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 4}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[Gradient descent]] is a type of local search that optimizes a set of numerical parameters by incrementally adjusting them to minimize a [[loss function]]. Variants of gradient descent are commonly used to train [[Artificial neural network|neural networks]],\u003cref\u003e{{Cite web |last=Singh Chauhan |first=Nagesh |date=December 18, 2020 |title=Optimization Algorithms in Neural Networks |url=https:\u002f\u002fwww.kdnuggets.com\u002foptimization-algorithms-in-neural-networks |access-date=2024-01-13 |website=KDnuggets}}\u003c\u002fref\u003e through the [[backpropagation]] algorithm.\u003cbr\u003e+[[File:Gradient descent.gif|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begins with some form of guess and refines it incrementally.\u003cref\u003e[[Local search (optimization)|Local]] or \"[[optimization]]\" search: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 4}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[Gradient descent]] is a type of local search that optimizes a set of numerical parameters by incrementally adjusting them to minimize a [[loss function]]. Variants of [[gradient descent]] are commonly used to train neural networks.\u003cref\u003e{{Cite web |last=Singh Chauhan |first=Nagesh |date=December 18, 2020 |title=Optimization Algorithms in Neural Networks |url=https:\u002f\u002fwww.kdnuggets.com\u002foptimization-algorithms-in-neural-networks |access-date=2024-01-13 |website=KDnuggets}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Another type of local search is [[evolutionary computation]], which aims to iteratively improve a set of candidate solutions by \"mutating\" and \"recombining\" them, [[Artificial selection|selecting]] only the fittest to survive each generation.\u003cref\u003e[[Evolutionary computation]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 4.1.2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -124,14 +124,14 @@\u003cbr\u003e [[Non-monotonic logic]]s, including logic programming with [[negation as failure]], are designed to handle [[default reasoning]].\u003cref name=\"Default reasoning\"\u002f\u003e Other specialized versions of logic have been developed to describe many complex domains.\u003cbr\u003e \u003cbr\u003e === Probabilistic methods for uncertain reasoning ===\u003cbr\u003e-[[File:SimpleBayesNet.svg|class=skin-invert-image|thumb|upright=1.7|A simple [[Bayesian network]], with the associated [[conditional probability table]]s]]\u003cbr\u003e+[[File:SimpleBayesNet.svg|thumb|upright=1.7|A simple [[Bayesian network]], with the associated [[conditional probability table]]s]]\u003cbr\u003e Many problems in AI (including in reasoning, planning, learning, perception, and robotics) require the agent to operate with incomplete or uncertain information. AI researchers have devised a number of tools to solve these problems using methods from [[probability]] theory and economics.\u003cref name=\"Stoch\"\u003eStochastic methods for uncertain reasoning: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 12\u201318, 20}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=345\u2013395}}, {{Harvtxt|Luger|Stubblefield|2004|pp=165\u2013191, 333\u2013381}}, {{Harvtxt|Nilsson|1998|loc=chpt. 19}}\u003c\u002fref\u003e Precise mathematical tools have been developed that analyze how an agent can make choices and plan, using [[decision theory]], [[decision analysis]],\u003cref\u003e[[decision theory]] and [[decision analysis]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 16\u201318}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=381\u2013394}}\u003c\u002fref\u003e and [[information value theory]].\u003cref\u003e[[Information value theory]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 16.6}}\u003c\u002fref\u003e These tools include models such as [[Markov decision process]]es,\u003cref\u003e[[Markov decision process]]es and dynamic [[decision network]]s: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 17}}\u003c\u002fref\u003e dynamic [[decision network]]s,\u003cref name=\"Stochastic temporal models\"\u002f\u003e [[game theory]] and [[mechanism design]].\u003cref\u003e[[Game theory]] and [[mechanism design]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 18}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Bayesian network]]s\u003cref\u003e[[Bayesian network]]s: {{Harvtxt|Russell|Norvig|2021|loc=sects. 12.5\u201312.6, 13.4\u201313.5, 14.3\u201314.5, 16.5, 20.2\u201320.3}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=361\u2013381}}, {{Harvtxt|Luger|Stubblefield|2004|pp=~182\u2013190, \u2248363\u2013379}}, {{Harvtxt|Nilsson|1998|loc=chpt. 19.3\u201319.4}}\u003c\u002fref\u003e are a tool that can be used for [[automated reasoning|reasoning]] (using the [[Bayesian inference]] algorithm),{{Efn|\u003cbr\u003e Compared with symbolic logic, formal Bayesian inference is computationally expensive. For inference to be tractable, most observations must be [[conditionally independent]] of one another. [[AdSense]] uses a Bayesian network with over 300&nbsp;million edges to learn which ads to serve.{{Sfnp|Domingos|2015|loc=chpt. 6}}\u003cbr\u003e }}\u003cref\u003e[[Bayesian inference]] algorithm: {{Harvtxt|Russell|Norvig|2021|loc=sect. 13.3\u201313.5}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=361\u2013381}}, {{Harvtxt|Luger|Stubblefield|2004|pp=~363\u2013379}}, {{Harvtxt|Nilsson|1998|loc=chpt. 19.4 & 7}}\u003c\u002fref\u003e [[Machine learning|learning]] (using the [[expectation\u2013maximization algorithm]]),{{Efn|Expectation\u2013maximization, one of the most popular algorithms in machine learning, allows clustering in the presence of unknown [[latent variables]].{{Sfnp|Domingos|2015|p=210}}}}\u003cref\u003e[[Bayesian learning]] and the [[expectation\u2013maximization algorithm]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 20}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=424\u2013433}}, {{Harvtxt|Nilsson|1998|loc=chpt. 20}}, {{Harvtxt|Domingos|2015|p=210}}\u003c\u002fref\u003e [[Automated planning and scheduling|planning]] (using [[decision network]]s)\u003cref\u003e[[Bayesian decision theory]] and Bayesian [[decision network]]s: {{Harvtxt|Russell|Norvig|2021|loc=sect. 16.5}}\u003c\u002fref\u003e and [[Machine perception|perception]] (using [[dynamic Bayesian network]]s).\u003cref name=\"Stochastic temporal models\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Probabilistic algorithms can also be used for filtering, prediction, smoothing, and finding explanations for streams of data, thus helping perception systems analyze processes that occur over time (e.g., [[hidden Markov model]]s or [[Kalman filter]]s).\u003cref name=\"Stochastic temporal models\"\u003eStochastic temporal models: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 14}}\u003cbr\u003e+Probabilistic algorithms can also be used for filtering, prediction, smoothing, and finding explanations for streams of data, thus helping [[Machine perception|perception]] systems analyze processes that occur over time (e.g., [[hidden Markov model]]s or [[Kalman filter]]s).\u003cref name=\"Stochastic temporal models\"\u003eStochastic temporal models: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 14}}\u003cbr\u003e [[Hidden Markov model]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 14.3}}\u003cbr\u003e [[Kalman filter]]s: {{Harvtxt|Russell|Norvig|2021|loc=sect. 14.4}}\u003cbr\u003e [[Dynamic Bayesian network]]s: {{Harvtxt|Russell|Norvig|2021|loc=sect. 14.5}}\u003c\u002fref\u003e\u003cbr\u003e@@ -162,7 +162,7 @@\u003cbr\u003e [[File:AI hierarchy.svg|thumb|upright]]\u003cbr\u003e [[Deep learning]]\u003cref name=\"Deep learning\"\u003e[[Deep learning]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 21}}, {{Harvtxt|Goodfellow|Bengio|Courville|2016}}, {{Harvtxt|Hinton ''et al.''|2016}}, {{Harvtxt|Schmidhuber|2015}}\u003c\u002fref\u003e uses several layers of neurons between the network's inputs and outputs. The multiple layers can progressively extract higher-level features from the raw input. For example, in [[image processing]], lower layers may identify edges, while higher layers may identify the concepts relevant to a human such as digits, letters, or faces.{{Sfnp|Deng|Yu|2014|pp=199\u2013200}}\u003cbr\u003e \u003cbr\u003e-Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2021.{{Sfnp|Russell|Norvig|2021|p=750}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and backpropagation had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e+Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and [[backpropagation]] had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e Some form of deep neural networks (without a specific learning algorithm) were described by:\u003cbr\u003e [[Warren S. McCulloch]] and [[Walter Pitts]] (1943){{Sfnp|Russell|Norvig|2021|p=17}}\u003cbr\u003e [[Alan Turing]] (1948);{{Sfnp|Russell|Norvig|2021|p=785}}\u003cbr\u003e@@ -194,16 +194,22 @@\u003cbr\u003e \u003cbr\u003e In the late 2010s, [[graphics processing unit]]s (GPUs) that were increasingly designed with AI-specific enhancements and used with specialized [[TensorFlow]] software had replaced previously used [[central processing unit]] (CPUs) as the dominant means for large-scale (commercial and academic) [[machine learning]] models' training.{{Sfnp|Kobielus|2019}} Specialized [[programming language]]s such as [[Prolog]] were used in early AI research,\u003cref\u003e{{Cite web |last=Thomason |first=James |date=2024-05-21 |title=Mojo Rising: The resurgence of AI-first programming languages |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages |access-date=2024-05-26 |website=VentureBeat |archive-date=27 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240627143853\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages\u002f |url-status=live }}\u003c\u002fref\u003e but [[general-purpose programming language]]s like [[Python (programming language)|Python]] have become predominant.\u003cref\u003e{{Cite news |last=Wodecki |first=Ben |date=May 5, 2023 |title=7 AI Programming Languages You Need to Know |url=https:\u002f\u002faibusiness.com\u002fverticals\u002f7-ai-programming-languages-you-need-to-know |work=AI Business |access-date=5 October 2024 |archive-date=25 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240725164443\u002fhttps:\u002f\u002faibusiness.com\u002fverticals\u002f7-ai-programming-languages-you-need-to-know |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The transistor density in [[integrated circuit]]s has been observed to roughly double every 18 months\u2014a trend known as [[Moore's law]], named after the [[Intel]] co-founder [[Gordon Moore]], who first identified it. Improvements in [[GPUs]] have been even faster,\u003cref\u003e{{Cite web |last=Plumb |first=Taryn |date=2024-09-18 |title=Why Jensen Huang and Marc Benioff see 'gigantic' opportunity for agentic AI |url=https:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |access-date=2024-10-04 |website=VentureBeat |language=en-US |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |url-status=live }}\u003c\u002fref\u003e a trend sometimes called [[Huang's law]],\u003cref\u003e{{Cite news |last=Mims |first=Christopher |date=2020-09-19 |title=Huang's Law Is the New Moore's Law, and Explains Why Nvidia Wants Arm |url=https:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |access-date=2025-01-19 |work=Wall Street Journal |language=en-US |issn=0099-9660 |archive-date=2 October 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231002080608\u002fhttps:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |url-status=live }}\u003c\u002fref\u003e named after [[Nvidia]] co-founder and CEO [[Jensen Huang]].\u003cbr\u003e+The transistor density in [[integrated circuit]]s has been observed to roughly double every 18 months\u2014a trend known as [[Moore's law]], named after the [[Intel]] co-founder [[Gordon Moore]], who first identified it. Improvements in [[GPUs]] have been even faster.\u003cref\u003e{{Cite web |last=Plumb |first=Taryn |date=2024-09-18 |title=Why Jensen Huang and Marc Benioff see 'gigantic' opportunity for agentic AI |url=https:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |access-date=2024-10-04 |website=VentureBeat |language=en-US |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Applications ==\u003cbr\u003e {{Main|Applications of artificial intelligence}}AI and machine learning technology is used in most of the essential applications of the 2020s, including: [[search engines]] (such as [[Google Search]]), [[Targeted advertising|targeting online advertisements]], [[recommendation systems]] (offered by [[Netflix]], [[YouTube]] or [[Amazon (company)|Amazon]]), driving [[internet traffic]], [[Marketing and artificial intelligence|targeted advertising]] ([[AdSense]], [[Facebook]]), [[virtual assistant]]s (such as [[Siri]] or [[Amazon Alexa|Alexa]]), [[autonomous vehicles]] (including [[Unmanned aerial vehicle|drones]], [[Advanced driver-assistance system|ADAS]] and [[self-driving cars]]), [[automatic language translation]] ([[Microsoft Translator]], [[Google Translate]]), [[Facial recognition system|facial recognition]] ([[Apple Computer|Apple]]'s [[Face ID]] or [[Microsoft]]'s [[DeepFace]] and [[Google]]'s [[FaceNet]]) and [[image labeling]] (used by [[Facebook]], Apple's [[iPhoto]] and [[TikTok]]). The deployment of AI may be overseen by a [[Chief automation officer]] (CAO).\u003cbr\u003e \u003cbr\u003e ===Health and medicine===\u003cbr\u003e {{Main|Artificial intelligence in healthcare}}\u003cbr\u003e-The application of AI in [[medicine]] an
