u2013198. [[George Dyson (science historian)|George Dyson]], historian of computing, writes (in what might be called \"Dyson's Law\") that \"Any system simple enough to be understandable will not be complicated enough to behave intelligently, while any system complicated enough to behave intelligently will be too complicated to understand.\" (p.&nbsp;197.) Computer scientist [[Alex Pentland]] writes: \"Current [[machine learning|AI machine-learning]] [[algorithm]]s are, at their core, dead simple stupid. They work, but they work by brute force.\" (p.&nbsp;198.)\u003cbr\u003e * {{Cite journal |last=Evans |first=Woody |author-link=Woody Evans |date=2015 |title=Posthuman Rights: Dimensions of Transhuman Worlds |journal=Teknokultura |volume=12 |issue=2 |doi=10.5209\u002frev_TK.2015.v12.n2.49072 |doi-access=free|s2cid=147612763 }}\u003cbr\u003e * {{Cite web |last=Frank |first=Michael |date=September 22, 2023 |title=US Leadership in Artificial Intelligence Can Shape the 21st Century Global Order |url=https:\u002f\u002fthediplomat.com\u002f2023\u002f09\u002fus-leadership-in-artificial-intelligence-can-shape-the-21st-century-global-order |access-date=2023-12-08 |website=[[The Diplomat (magazine)|The Diplomat]] |quote=Instead, the United States has developed a new area of dominance that the rest of the world views with a mixture of awe, envy, and resentment: artificial intelligence... From AI models and research to cloud computing and venture capital, U.S. companies, universities, and research labs \u2013 and their affiliates in allied countries \u2013 appear to have an enormous lead in both developing cutting-edge AI and commercializing it. The value of U.S. venture capital investments in AI start-ups exceeds that of the rest of the world combined. |archive-date=16 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240916014433\u002fhttps:\u002f\u002fthediplomat.com\u002f2023\u002f09\u002fus-leadership-in-artificial-intelligence-can-shape-the-21st-century-global-order\u002f |url-status=live }}\u003cbr\u003e * Gertner, Jon. (2023) \"Wikipedia's Moment of Truth: Can the online encyclopedia help teach A.I. chatbots to get their facts right \u2014 without destroying itself in the process?\" ''New York Times Magazine'' (July 18, 2023) [https:\u002f\u002fwww.nytimes.com\u002f2023\u002f07\u002f18\u002fmagazine\u002fwikipedia-ai-chatgpt.html online] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230720125400\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f07\u002f18\u002fmagazine\u002fwikipedia-ai-chatgpt.html |date=20 July 2023 }}\u003cbr\u003e-* [[Gleick, James]], \"The Fate of Free Will\" (review of Kevin J. Mitchell, ''Free Agents: How Evolution Gave Us Free Will'', Princeton University Press, 2023, 333 pp.), ''[[The New York Review of Books]]'', vol. LXXI, no. 1 (18 January 2024), pp.&nbsp;27\u201328, 30. \"[[Agency (philosophy)|Agency]] is what distinguishes us from machines. For biological creatures, [[reason]] and [[motivation|purpose]] come from acting in the world and experiencing the consequences. Artificial intelligences \u2013 disembodied, strangers to blood, sweat, and tears \u2013 have no occasion for that.\" (p.&nbsp;30.)\u003cbr\u003e-* Halpern, Sue, \"The Coming Tech Autocracy\" (review of [[Verity Harding]], ''AI Needs You: How We Can Change AI's Future and Save Our Own'', Princeton University Press, 274 pp.; [[Gary Marcus]], ''Taming Silicon Valley: How We Can Ensure That AI Works for Us'', MIT Press, 235 pp.; [[Daniela Rus]] and [[Gregory Mone]], ''The Mind's Mirror: Risk and Reward in the Age of AI'', Norton, 280 pp.; [[Madhumita Murgia]], ''Code Dependent: Living in the Shadow of AI'', Henry Holt, 311 pp.), ''[[The New York Review of Books]]'', vol. LXXI, no. 17 (7 November 2024), pp.&nbsp;44\u201346. \"'We can't realistically expect that those who hope to get rich from AI are going to have the interests of the rest of us close at heart,' ... writes [Gary Marcus]. 'We can't count on [[government]]s driven by [[campaign finance]] contributions [from tech companies] to push back.'... Marcus details the demands that citizens should make of their governments and the [[tech company|tech companies]]. They include [[Transparency (behavior)|transparency]] on how AI systems work; compensation for individuals if their data [are] used to train LLMs ([[large language model]])s and the right to consent to this use; and the ability to hold tech companies liable for the harms they cause by eliminating [[Section 230]], imposing cash penalties, and passing stricter [[product liability]] laws... Marcus also suggests... that a new, AI-specific federal agency, akin to the [[FDA]], the [[FCC]], or the [[Federal Trade Commission|FTC]], might provide the most robust oversight.... [T]he [[Fordham University|Fordham]] law professor [[Chinmayi Sharma]]... suggests... establish[ing] a professional licensing regime for engineers that would function in a similar way to [[medical license]]s, [[malpractice]] suits, and the [[Hippocratic oath]] in medicine. 'What if, like doctors,' she asks..., 'AI engineers also vowed to [[Primum non nocere|do no harm]]?'\" (p.&nbsp;46.) \u003cbr\u003e+* [[Gleick, James]], \"The Fate of Free Will\" (review of Kevin J. Mitchell, ''Free Agents: How Evolution Gave Us Free Will'', Princeton University Press, 2023, 333 pp.), ''[[The New York Review of Books]]'', vol. LXXI, no. 1 (18 January 2024), pp. 27\u201328, 30. \"[[Agency (philosophy)|Agency]] is what distinguishes us from machines. For biological creatures, [[reason]] and [[motivation|purpose]] come from acting in the world and experiencing the consequences. Artificial intelligences \u2013 disembodied, strangers to blood, sweat, and tears \u2013 have no occasion for that.\" (p. 30.)\u003cbr\u003e+* Halpern, Sue, \"The Coming Tech Autocracy\" (review of [[Verity Harding]], ''AI Needs You: How We Can Change AI's Future and Save Our Own'', Princeton University Press, 274 pp.; k Review of Books]]'', vol. LXXII, no. 5 (27 March 2025), pp. 30\u201332. The reviewer, Ben Tarnoff, writes: \"The strangeness at the heart of the [[generative AI]] boom is that nobody really knows how the technology works. We know how the [[large language model]]s within [[ChatGPT]] and its counterparts are trained, even if we don't always know which [[data]] they're being trained on: they are asked to predict the next string of characters in a sequence. But exactly how they arrive at any given [[prediction]] is a mystery. The [[computation]]s that occur inside the model are simply too intricate for any human to comprehend.\" (p. 32.)\u003cbr\u003e * [[Ashish Vaswani|Vaswani, Ashish]], Noam Shazeer, Niki Parmar et al. \"[[Attention is all you need]].\" Advances in neural information processing systems 30 (2017). Seminal paper on [[transformer (machine learning model)|transformer]]s.\u003cbr\u003e-* Vincent, James, \"Horny Robot Baby Voice: James Vincent on AI chatbots\", ''[[London Review of Books]]'', vol. 46, no. 19 (10 October 2024), pp.&nbsp;29\u201332. \"[AI chatbot] programs are made possible by new technologies but rely on the timelelss human tendency to [[anthropomorphise]].\" (p.&nbsp;29.)\u003cbr\u003e+* Vincent, James, \"Horny Robot Baby Voice: James Vincent on AI chatbots\", ''[[London Review of Books]]'', vol. 46, no. 19 (10 October 2024), pp. 29\u201332. \"[AI chatbot] programs are made possible by new technologies but rely on the timelelss human tendency to [[anthropomorphise]].\" (p. 29.)\u003cbr\u003e * {{Cite book |url=https:\u002f\u002fec.europa.eu\u002finfo\u002fsites\u002finfo\u002ffiles\u002fcommission-white-paper-artificial-intelligence-feb2020_en.pdf |title=White Paper: On Artificial Intelligence \u2013 A European approach to excellence and trust |publisher=European Commission |date=2020 |location=Brussels |ref={{Harvid|European Commission|2020}} |access-date=20 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200220173419\u002fhttps:\u002f\u002fec.europa.eu\u002finfo\u002fsites\u002finfo\u002ffiles\u002fcommission-white-paper-artificial-intelligence-feb2020_en.pdf |archive-date=20 February 2020 |url-status=live }}\u003cbr\u003e {{Refend}}\u003cbr\u003e \u003cbr\u003e@@ -853,7 +848,7 @@\u003cbr\u003e \u003cbr\u003e \u003c!--Please leave the empty space as standard.--\u003e\u003cbr\u003e \u003cbr\u003e-[[Category:Artificial intelligence|*]]\u003cbr\u003e+[[Category:Artificial intelligence|Artificial intelligence]]\u003cbr\u003e [[Category:Computational fields of study]]\u003cbr\u003e [[Category:Computational neuroscience]]\u003cbr\u003e [[Category:Cybernetics]]","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -78,7 +78,7 @@\u003cbr\u003e === Social intelligence ===\u003cbr\u003e [[File:Kismet-IMG 6007-gradient.jpg|thumb|[[Kismet (robot)|Kismet]], a robot head which was made in the 1990s; it is a machine that can recognize and simulate emotions.{{Sfnp|MIT AIL|2014}}]]\u003cbr\u003e \u003cbr\u003e-[[Affective computing]] is an interdisciplinary umbrella that comprises systems that recognize, interpret, process, or simulate human [[Affect (psychology)|feeling, emotion, and mood]].\u003cref\u003e[[Affective computing]]: {{Harvtxt|Thro|1993}}, {{Harvtxt|Edelson|1991}}, {{Harvtxt|Tao|Tan|2005}}, {{Harvtxt|Scassellati|2002}}\u003c\u002fref\u003e For example, some [[virtual assistant]]s are programmed to speak conversationally or even to banter humorously; it makes them appear more sensitive to the emotional dynamics of human interaction, or to otherwise facilitate [[human\u2013computer interaction]].\u003cbr\u003e+[[Affective computing]] is a field that comprises systems that recognize, interpret, process, or simulate human [[Affect (psychology)|feeling, emotion, and mood]].\u003cref\u003e[[Affective computing]]: {{Harvtxt|Thro|1993}}, {{Harvtxt|Edelson|1991}}, {{Harvtxt|Tao|Tan|2005}}, {{Harvtxt|Scassellati|2002}}\u003c\u002fref\u003e For example, some [[virtual assistant]]s are programmed to speak conversationally or even to banter humorously; it makes them appear more sensitive to the emotional dynamics of human interaction, or to otherwise facilitate [[human\u2013computer interaction]].\u003cbr\u003e \u003cbr\u003e However, this tends to give na\u00efve users an unrealistic conception of the intelligence of existing computer agents.{{Sfnp|Waddell|2018}} Moderate successes related to affective computing include textual [[sentiment analysis]] and, more recently, [[multimodal sentiment analysis]], wherein AI classifies the effects displayed by a videotaped subject.{{Sfnp|Poria|Cambria|Bajpai |Hussain|2017}}\u003cbr\u003e ","--- Revision 45\u003cbr\u003e+++ Revision 46\u003cbr\u003e@@ -431,7 +431,7 @@\u003cbr\u003e Daniel Crevier wrote, \"the conference is generally recognized as the official birthdate of the new science.\"{{Sfnp|Crevier|1993|pp=47\u201349}} [[Stuart J. Russell|Russell]] and [[Norvig]] called the conference \"the inception of artificial intelligence.\"{{Sfnp|Russell|Norvig|2021|p=17}}}}\u003cref name=\"Dartmouth workshop\"\u003e[[Dartmouth workshop]]: {{Harvtxt|Russell|Norvig|2021|p=18}}, {{Harvtxt|McCorduck|2004|pp=111\u2013136}}, {{Harvtxt|NRC|1999|pp=200\u2013201}}\u003cbr \u002f\u003eThe proposal: {{Harvtxt|McCarthy|Minsky|Rochester|Shannon|1955}}\u003c\u002fref\u003e The attendees became the leaders of AI research in the 1960s.{{Efn|\u003cbr\u003e [[Stuart J. Russell|Russell]] and [[Norvig]] wrote \"for the next 20 years the field would be dominated by these people and their students.\"{{Sfnp|Russell|Norvig|2003|p=17}}\u003cbr\u003e }} They and their students produced programs that the press described as \"astonishing\":{{Efn|\u003cbr\u003e-[[Stuart J. Russell|Russell]] and [[Norvig]] wrote \"it was astonishing whenever a computer did anything kind of smartish\".{{Sfnp|Russell|Norvig|2003|p=18}}\u003cbr\u003e+[[Stuart J. Russell|Russell]] and [[Norvig]] wrote, \"it was astonishing whenever a computer did anything kind of smartish\".{{Sfnp|Russell|Norvig|2003|p=18}}\u003cbr\u003e }} computers were learning [[checkers]] strategies, solving word problems in algebra, proving [[Theorem|logical theorems]] and speaking English.{{Efn|\u003cbr\u003e The programs described are [[Arthur Samuel (computer scientist)|Arthur Samuel]]'s checkers program for the [[IBM 701]], [[Daniel Bobrow]]'s [[STUDENT]], [[Allen Newell|Newell]] and [[Herbert A. Simon|Simon]]'s [[Logic Theorist]] and [[Terry Winograd]]'s [[SHRDLU]].\u003cbr\u003e }}\u003cref name=\"Succ1\"\u003eSuccessful programs of the 1960s: {{Harvtxt|McCorduck|2004|pp=243\u2013252}}, {{Harvtxt|Crevier|1993|pp=52\u2013107}}, {{Harvtxt|Moravec|1988|p=9}}, {{Harvtxt|Russell|Norvig|2021|pp=19\u201321}}\u003c\u002fref\u003e Artificial intelligence laboratories were set up at a number of British and U.S. universities in the latter 1950s and early 1960s.\u003cref name=\"Clarendon Press-2004\"\u002f\u003e\u003cbr\u003e@@ -442,10 +442,10 @@\u003cbr\u003e \u003c!-- 1980s and second AI winter --\u003e\u003cbr\u003e In the early 1980s, AI research was revived by the commercial success of [[expert system]]s,\u003cref\u003e[[Expert systems]]: {{Harvtxt|Russell|Norvig|2021|pp=23, 292}}, {{Harvtxt|Luger|Stubblefield|2004|pp=227\u2013331}}, {{Harvtxt|Nilsson|1998|loc=chpt. 17.4}}, {{Harvtxt|McCorduck|2004|pp=327\u2013335, 434\u2013435}}, {{Harvtxt|Crevier|1993|pp=145\u2013162, 197\u2013203}}, {{Harvtxt|Newquist|1994|pp=155\u2013183}}\u003c\u002fref\u003e a form of AI program that simulated the knowledge and analytical skills of human experts. By 1985, the market for AI had reached over a billion dollars. At the same time, Japan's [[fifth generation computer]] project inspired the U.S. and British governments to restore funding for [[academic research]].\u003cref name=\"Fund01\"\u003eFunding initiatives in the early 1980s: [[Fifth Generation Project]] (Japan), [[Alvey]] (UK), [[Microelectronics and Computer Technology Corporation]] (US), [[Strategic Computing Initiative]] (US): {{Harvtxt|McCorduck|2004|pp=426\u2013441}}, {{Harvtxt|Crevier|1993|pp=161\u2013162, 197\u2013203, 211, 240}}, {{Harvtxt|Russell|Norvig|2021|p=23}}, {{Harvtxt|NRC|1999|pp=210\u2013211}}, {{Harvtxt|Newquist|1994|pp=235\u2013248}}\u003c\u002fref\u003e However, beginning with the collapse of the [[Lisp Machine]] market in 1987, AI once again fell into disrepute, and a second, longer-lasting winter began.\u003cref name=\"Second AI Winter\"\u003eSecond [[AI Winter]]: {{Harvtxt|Russell|Norvig|2021|p=24}}, {{Harvtxt|McCorduck|2004|pp=430\u2013435}}, {{Harvtxt|Crevier|1993|pp=209\u2013210}}, {{Harvtxt|NRC|1999|pp=214\u2013216}}, {{Harvtxt|Newquist|1994|pp=301\u2013318}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003c!-- Embodied robotics, uncertain reasoning and connectionism in the 1980s --\u003e\u003cbr\u003e+\u003c!-- Embodied robotics, uncertain reasoning, and connectionism in the 1980s --\u003e\u003cbr\u003e Up to this point, most of AI's funding had gone to projects that used high-level [[symbolic AI|symbols]] to represent [[mental objects]] like plans, goals, beliefs, and known facts. In the 1980s, some researchers began to doubt that this approach would be able to imitate all the processes of human cognition, especially [[machine perception|perception]], [[robotics]], [[machine learning|learning]] and [[pattern recognition]],{{Sfnp|Russell|Norvig|2021|p=24}} and began to look into \"sub-symbolic\" approaches.{{Sfnp|Nilsson|1998|p=7}} [[Rodney Brooks]] rejected \"representation\" in general and focussed directly on engineering machines that move and survive.{{Efn|\u003cbr\u003e [[embodied mind|Embodied]] approaches to AI{{Sfnp|McCorduck|2004|pp=454\u2013462}} were championed by [[Hans Moravec]]{{Sfnp|Moravec|1988}} and [[Rodney Brooks]]{{Sfnp|Brooks|1990}} and went by many names: [[Nouvelle AI]].{{Sfnp|Brooks|1990}} [[Developmental robotics]].\u003cref\u003e[[Developmental robotics]]: {{Harvtxt|Weng|McClelland|Pentland|Sporns|2001}}, {{Harvtxt|Lungarella|Metta|Pfeifer|Sandini|2003}}, {{Harvtxt|Asada|Hosoda|Kuniyoshi|Ishiguro|2009}}, {{Harvtxt|Oudeyer|2010}}\u003c\u002fref\u003e\u003cbr\u003e-}} [[Judea Pearl]], [[Lofti Zadeh]] and others developed methods that handled incomplete and uncertain information by making reasonable guesses rather than precise logic.\u003cref name=\"Stoch\"\u002f\u003e{{Sfnp|Russell|Norvig|2021|p=25}} But the most important development was the revival of \"[[connectionism]]\", including neural network research, by [[Geoffrey Hinton]] and others.\u003cref\u003e{{Harvtxt|Crevier|1993|pp=214\u2013215}}, {{Harvtxt|Russell|Norvig|2021|pp=24, 26}}\u003c\u002fref\u003e In 1990, [[Yann LeCun]] successfully showed that [[convolutional neural networks]] can recognize handwritten digits, the first of many successful applications of neural networks.{{Sfnp|Russell|Norvig|2021|p=26}}\u003cbr\u003e+}} [[Judea Pearl]], [[Lofti Zadeh]], and others developed methods that handled incomplete and uncertain information by making reasonable guesses rather than precise logic.\u003cref name=\"Stoch\"\u002f\u003e{{Sfnp|Russell|Norvig|2021|p=25}} But the most important development was the revival of \"[[connectionism]]\", including neural network research, by [[Geoffrey Hinton]] and others.\u003cref\u003e{{Harvtxt|Crevier|1993|pp=214\u2013215}}, {{Harvtxt|Russell|Norvig|2021|pp=24, 26}}\u003c\u002fref\u003e In 1990, [[Yann LeCun]] successfully showed that [[convolutional neural networks]] can recognize handwritten digits, the first of many successful applications of neural networks.{{Sfnp|Russell|Norvig|2021|p=26}}\u003cbr\u003e \u003cbr\u003e \u003c!-- 1990s: narrow, formal AI and its detractors --\u003e\u003cbr\u003e AI gradually restored its reputation in the late 1990s and early 21st century by exploiting formal mathematical methods and by finding specific solutions to specific problems. This \"[[narrow AI|narrow]]\" and \"formal\" focus allowed researchers to produce verifiable results and collaborate with other fields (such as [[statistics]], [[economics]] and [[mathematical optimization|mathematics]]).\u003cref name=\"Formal and narrow methods adopted in the 1990s\"\u003e[[#Neat vs. scruffy|Formal]] and [[#Narrow vs. general AI|narrow]] methods adopted in the 1990s: {{Harvtxt |Russell|Norvig|2021|pp=24\u201326}}, {{Harvtxt|McCorduck|2004|pp=486\u2013487}}\u003c\u002fref\u003e By 2000, solutions developed by AI researchers were being widely used, although in the 1990s they were rarely described as \"artificial intelligence\" (a tendency known as the [[AI effect]]).\u003cref\u003eAI widely used in the late 1990s: {{Harvtxt|Kurzweil|2005|p=265}}, {{Harvtxt|NRC|1999|pp=216\u2013222}}, {{Harvtxt|Newquist|1994|pp=189\u2013201}}\u003c\u002fref\u003e\u003cbr\u003e@@ -460,7 +460,7 @@\u003cbr\u003e In 2016, issues of [[algorithmic fairness|fairness]] and the misuse of technology were catapulted into center stage at machine learning conferences, publications vastly increased, funding became available, and many researchers re-focussed their careers on these issues. The [[AI alignment|alignment problem]] became a serious field of academic study.{{Sfnp|Christian|2020|pp=67, 73}}\u003cbr\u003e \u003cbr\u003e \u003c!-- AI Boom 2020-present --\u003e\u003cbr\u003e-In the late teens and early 2020s, [[artificial general intelligence|AGI]] companies began to deliver programs that created enormous interest. In 2015, [[AlphaGo]], developed by [[DeepMind]], beat the world champion [[Go player]]. The program was taught only the rules of the game and developed strategy by itself. [[GPT-3]] is a [[large language model]] that was released in 2020 by [[OpenAI]] and is capable of generating high-quality human-like text.\u003cref\u003e{{Cite web |last=Sagar |first=Ram |date=2020-06-03 |title=OpenAI Releases GPT-3, The Largest Model So Far |url=https:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |url-status=live |archive-url=https:\u002f\u002fweb.archi icial intelligence|philosophy]], [[neuroscience]], and other fields.\u003cref\u003e{{Harvtxt|Russell|Norvig|2021|loc=\u00a71.2}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- HISTORY AND ETHICS --\u003e\u003cbr\u003e-Artificial intelligence was founded as an academic discipline in 1956,\u003cref name=\"Dartmouth workshop\"\u002f\u003e and the field went through multiple cycles of optimism,\u003cref name=\"Succ1\"\u002f\u003e\u003cref name=\"Fund01\"\u002f\u003e followed by periods of disappointment and loss of funding, known as [[AI winter]]s.\u003cref name=\"First AI Winter\"\u002f\u003e\u003cref name=\"Second AI Winter\"\u002f\u003e Funding and interest vastly increased after 2012 when [[deep learning]] outperformed previous AI techniques.\u003cref name=\"Deep learning revolution\"\u002f\u003e This growth accelerated further after 2017 with the [[transformer architecture]],{{Sfnp|Toews|2023}} and by the early 2020s many billions of dollars were being invested in AI (known as the \"[[AI boom]]\"). The widespread use of AI in the 21st century exposed several unintended consequences and harms in the present and raised concerns about [[AI risk|its risks]] and [[AI aftermath scenarios|long-term effects]] in the future, prompting discussions about [[Regulation of artificial intelligence|regulatory policies]] to ensure the [[AI safety|safety and benefits of the technology]].\u003cbr\u003e+Artificial intelligence was founded as an academic discipline in 1956,\u003cref name=\"Dartmouth workshop\"\u002f\u003e and the field went through multiple cycles of optimism,\u003cref name=\"Succ1\"\u002f\u003e\u003cref name=\"Fund01\"\u002f\u003e followed by periods of disappointment and loss of funding, known as [[AI winter]]s.\u003cref name=\"First AI Winter\"\u002f\u003e\u003cref name=\"Second AI Winter\"\u002f\u003e Funding and interest vastly increased after 2012 when [[deep learning]] outperformed previous AI techniques.\u003cref name=\"Deep learning revolution\"\  They work, but they work by brute force.\" (p.&nbsp;198.)\u003cbr\u003e * {{Cite journal |last=Evans |first=Woody |author-link=Woody Evans |date=2015 |title=Posthuman Rights: Dimensions of Transhuman Worlds |journal=Teknokultura |volume=12 |issue=2 |doi=10.5209\u002frev_TK.2015.v12.n2.49072 |doi-access=free|s2cid=147612763 }}\u003cbr\u003e * {{Cite web |last=Frank |first=Michael |date=September 22, 2023 |title=US Leadership in Artificial Intelligence Can Shape the 21st Century Global Order |url=https:\u002f\u002fthediplomat.com\u002f2023\u002f09\u002fus-leadership-in-artificial-intelligence-can-shape-the-21st-century-global-order |access-date=2023-12-08 |website=[[The Diplomat (magazine)|The Diplomat]] |quote=Instead, the United States has developed a new area of dominance that the rest of the world views with a mixture of awe, envy, and resentment: artificial intelligence... From AI models and research to cloud computing and venture capital, U.S. companies, universities, and research labs \u2013 and their affiliates in allied countries \u2013 appear to have an enormous lead in both developing cutting-edge AI and commercializing it. The value of U.S. venture capital investments in AI start-ups exceeds that of the rest of the world combined. |archive-date=16 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240916014433\u002fhttps:\u002f\u002fthediplomat.com\u002f2023\u002f09\u002fus-leadership-in-artificial-intelligence-can-shape-the-21st-century-global-order\u002f |url-status=live }}","--- Revision 62\u003cbr\u003e+++ Revision 63\u003cbr\u003e@@ -7,7 +7,7 @@\u003cbr\u003e '''Artificial intelligence''' ('''AI'''), in its broadest sense, is [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e-High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[Virtual assistant|virtual assistants]] (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e\u003cbr\u003e+High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- GOALS AND TOOLS: SCOPE OF AI --\u003e\u003cbr\u003e Various subfields of AI research are centered around particular goals and the use of particular tools. The traditional goals of AI research include [[automated reasoning|reasoning]], [[knowledge representation]], [[Automated planning and scheduling|planning]], [[machine learning|learning]], [[natural language processing]], perception, and support for [[robotics]].{{Efn|name=\"Problems of AI\"}} [[Artificial general intelligence|General intelligence]]\u2014the ability to complete any task performed by a human on an at least equal level\u2014is among the field's long-term goals.\u003cref name=\"Artificial general intelligence\"\u002f\u003e To reach these goals, AI researchers have adapted and integrated a wide range of techniques, including [[state space search|search]] and [[mathematical optimization]], [[formal logic]], [[artificial neural network]]s, and methods based on [[statistics]], [[operations research]], and [[economics]].{{Efn|name=\"Tools of AI\"}} AI also draws upon [[psychology]], [[linguistics]], [[Philosophy of artificial intelligence|philosophy]], [[neuroscience]], and other fields.\u003cref\u003e{{Harvtxt|Russell|Norvig|2021|loc=\u00a71.2}}.\u003c\u002fref\u003e\u003cbr\u003e@@ -256,7 +256,7 @@\u003cbr\u003e \u003cbr\u003e Artificial intelligence is used in astronomy to analyze increasing amounts of available data and applications, mainly for \"classification, regression, clustering, forecasting, generation, discovery, and the development of new scientific insights.\" For example, it is used for discovering exoplanets, forecasting solar activity, and distinguishing between signals and instrumental effects in gravitational wave astronomy. Additionally, it could be used for activities in space, such as space exploration, including the analysis of data from space missions, real-time science decisions of spacecraft, space debris avoidance, and more autonomous operation.\u003cbr\u003e \u003cbr\u003e-During the [[2024 Indian general election|2024 Indian elections]], US$50 millions was spent on authorized AI-generated content, notably by creating [[Deepfake|deepfakes]] of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us}}\u003c\u002fref\u003e\u003cbr\u003e+During the [[2024 Indian general election|2024 Indian elections]], US$50 millions was spent on authorized AI-generated content, notably by creating [[deepfake]]s of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Ethics==\u003cbr\u003e {{Main|Ethics of artificial intelligence}}\u003cbr\u003e@@ -453,7 +453,7 @@\u003cbr\u003e \u003cbr\u003e \u003c!--DEEP LEARNING BOOM 2012\u2013present--\u003e\u003cbr\u003e [[Deep learning]] began to dominate industry benchmarks in 2012 and was adopted throughout the field.\u003cref name=\"Deep learning revolution\"\u003e[[Deep learning]] revolution, [[AlexNet]]: {{Harvtxt|Goldman|2022}}, {{Harvtxt|Russell|Norvig|2021|p=26}}, {{Harvtxt|McKinsey|2018}}\u003c\u002fref\u003e\u003cbr\u003e-For many specific tasks, other methods were abandoned.{{Efn|Matteo Wong wrote in [[The Atlantic]]: \"Whereas for decades, computer-science fields such as natural-language processing, computer vision, and robotics used extremely different methods, now they all use a programming method called \"deep learning.\" As a result, their code and approaches have become more similar, and their models are easier to integrate into one another.\"{{Sfnp|Wong|2023}}}}\u003cbr\u003e+For many specific tasks, other methods were abandoned.{{Efn|Matteo Wong wrote in [[The Atlantic]]: \"Whereas for decades, computer-science fields such as natural-language processing, computer vision, and robotics used extremely different methods, now they all use a programming method called \"deep learning\". As a result, their code and approaches have become more similar, and their models are easier to integrate into one another.\"{{Sfnp|Wong|2023}}}}\u003cbr\u003e Deep learning's success was based on both hardware improvements ([[Moore's law|faster computers]],\u003cref\u003e[[Moore's Law]] and AI: {{Harvtxt|Russell|Norvig|2021|pp=14, 27}}\u003c\u002fref\u003e [[graphics processing unit]]s, [[cloud computing]]{{Sfnp|Clark|2015b}}) and access to [[big data|large amounts of data]]\u003cref\u003e[[Big data]]: {{Harvtxt|Russell|Norvig|2021|p=26}}\u003c\u002fref\u003e (including curated datasets,{{Sfnp|Clark|2015b}} such as [[ImageNet]]). Deep learning's success led to an enormous increase in interest and funding in AI.{{Efn|Jack Clark wrote in [[Bloomberg News|Bloomberg]]: \"After a half-decade of quiet breakthroughs in artificial intelligence, 2015 has been a landmark year. Computers are smarter and learning faster than ever\", and noted that the number of software projects that use machine learning at [[Google]] increased from a \"sporadic usage\" in 2012 to more than 2,700 projects in 2015.{{Sfnp|Clark|2015b}}}} The amount of machine learning research (measured by total publications) increased by 50% in the years 2015\u20132019.{{Sfnp|UNESCO|2021}}\u003cbr\u003e \u003cbr\u003e \u003c!-- ALIGNMENT PROBLEM --\u003e\u003cbr\u003e@@ -472,7 +472,7 @@\u003cbr\u003e [[Alan Turing]] wrote in 1950 \"I propose to consider the question 'can machines think'?\"{{Sfnp|Turing|1950|p=1}} He advised changing the question from whether a machine \"thinks\", to \"whether or not it is possible for machinery to show intelligent behaviour\".{{Sfnp|Turing|1950|p=1}} He devised the Turing test, which measures the ability of a machine to simulate human conversation.\u003cref name=\"Turing\"\u003eTuring's original publication of the [[Turing test]] in \"[[Computing machinery and intelligence]]\": {{Harvtxt|Turing|1950}}\u003cbr\u003e Historical influence and philosophical implications: {{Harvtxt|Haugeland|1985|pp=6\u20139}}, {{Harvtxt|Crevier|1993|p=24}}, {{Harvtxt|McCorduck|2004|pp=70\u201371}}, {{Harvtxt|Russell|Norvig|2021|pp=2, 984}}\u003c\u002fref\u003e Since we can only observe the behavior of the machine, it does not matter if it is \"actually\" thinking or literally has a \"mind\". Turing notes that [[Problem of other minds|we can not determine these things about other people]] but \"it is usual to have a polite convention that everyone thinks.\"{{Sfnp|Turing|1950|loc=Under \"The Argument from Consciousness\"}}\u003cbr\u003e [[File:Weakness of Turing test 1.svg|thumb|The Turing test can provide some evidence of intelligence, but it penalizes non-human intelligent behavior.\u003cref\u003e{{Cite web |last1=Kirk-Giannini |first1=Cameron Domenico |last2=Goldstein |first2=Simon |date=2023-10-16 |title=AI is closer than ever to passing the Turing test for 'intelligence'. What happens when it does? |url=https:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |access-date=2024-08-17 |website=The Conversation |archive-date=25 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240925040612\u002fhttps:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |url-status=live }}\u003c\u002fref\u003e]]\u003cbr\u003e-[[Stuart J. Russell|Russell]] and [[Norvig]] agree with Turing that intelligence must be defined in terms of external behavior, not internal structure.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} However, they are critical that the test requires the machine to imitate humans. \"[[Aeronautics|Aeronautical engineering]] texts,\" they wrote, \"do not define the goal of their field as making 'machines that fly so exactly like [[pigeon]]s that they can fool other pigeons.{{' \"}}{{Sfnp|Russell|Norvig|2021|p=3}} AI founder [[John McCarthy (computer scientist)|John McCarthy]] agreed, writing that \"Artificial intelligence is not, by definition, simulation of human intelligence\".{{Sfnp|Maker|2006}}\u003cbr\u003e+[[Stuart J. Russell|Russell]] and [[Norvig]] agree with Turing that intelligence must be defined in terms of external behavior, not internal structure.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} However, they are critical that the test requires the machine to imitate humans. \"[[Aeronautics|Aeronautical engineering]] texts\", they wrote, \"do not define the goal of their field as making 'machines that fly so exactly like [[pigeon]]s that they can fool other pigeons.{{' \"}}{{Sfnp|Russell|Norvig|2021|p=3}} AI founder [[John McCarthy (computer scientist)|John McCarthy]] agreed, writing that \"Artificial intelligence is not, by definition, simulation of human intelligence\".{{Sfnp|Maker|2006}}\u003cbr\u003e \u003cbr\u003e McCarthy defines intelligence as \"the computational part of the ability to achieve goals in the world\".{{Sfnp|McCarthy|1999}} Another AI founder, [[Marvin Minsky]] similarly describes it as \"the ability to solve hard problems\".{{Sfnp|Minsky|1986}} The leading AI textbook defines it as the study of agents that perceive their environment and take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} These definitions view intelligence in terms of well-defined problems with well-defined solutions, where both the difficulty of the problem and the performance of the program are direct measures of the \"intelligence\" of the machine\u2014and no other philosophical discussion is required, or may not even be possible.\u003cbr\u003e ","--- Revision 63\u003cbr\u003e+++ Revision 64\u003cbr\u003e@@ -848,7 +848,7 @@\u003cbr\u003e \u003cbr\u003e \u003c!--Please leave the empty space as standard.--\u003e\u003cbr\u003e \u003cbr\u003e-[[Category:Artificial intelligence|Artificial intelligence]]\u003cbr\u003e+[[Category:Artificial intelligence| ]]\u003cbr\u003e [[Category:Computational fields of study]]\u003cbr\u003e [[Category:Computational neuroscience]]\u003cbr\u003e [[Category:Cybernetics]]","--- Revision 64\u003cbr\u003e+++ Revision 65\u003cbr\u003e@@ -848,7 +848,7 @@\u003cbr\u003e \u003cbr\u003e \u003c!--Please leave the empty space as standard.--\u003e\u003cbr\u003e \u003cbr\u003e-[[Category:Artificial intelligence| ]]\u003cbr\u003e+[[Category:Artificial intelligence|*]]\u003cbr\u003e [[Category:Computational fields of study]]\u003cbr\u003e [[Category:Computational neuroscience]]\u003cbr\u003e [[Category:Cybernetics]]","--- Revision 65\u003cbr\u003e+++ Revision 66\u003cbr\u003e@@ -108,6 +108,8 @@\u003cbr\u003e Another type of local search is [[evolutionary computation]], which aims to iteratively improve a set of candidate solutions by \"mutating\" and \"recombining\" them, [[Artificial selection|selecting]] only the fittest to survive each generation.\u003cref\u003e[[Evolutionary computation]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 4.1.2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Distributed search processes can coordinate via [[swarm intelligence]] algorithms. Two popular swarm algorithms used in search are [[particle swarm optimization]] (inspired by bird [[flocking]]) and [[ant colony optimization]] (inspired by [[ant trail]]s).{{Sfnp|Merkle|Middendorf|2013}}\u003cbr\u003e+\u003cbr\u003e+[[Artificial neural network|Neural network]]s learn by using a form of gradient descent called \"[[backpropagation]]\".\u003cbr\u003e \u003cbr\u003e === Logic ===\u003cbr\u003e Formal [[logic]] is used for [[automatic reasoning|reasoning]] and [[knowledge representation]].\u003cref\u003e[[Logic]]: {{Harvtxt|Russell|Norvig|2021|loc=chpts. 6\u20139}}, {{Harvtxt|Luger|Stubblefield|2004|pp=35\u201377}}, {{Harvtxt|Nilsson|1998|loc=chpt. 13\u201316}}\u003c\u002fref\u003e","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -103,13 +103,11 @@\u003cbr\u003e ==== Local search ====\u003cbr\u003e [[File:Gradient descent.gif|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begins with some form of guess and refines it incrementally.\u003cref\u003e[[Local search (optimization)|Local]] or \"[[optimization]]\" search: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 4}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Gradient descent]] is a type of local search that optimizes a set of numerical parameters by incrementally adjusting them to minimize a [[loss function]]. Variants of [[gradient descent]] are commonly used to train neural networks.\u003cref\u003e{{Cite web |last=Singh Chauhan |first=Nagesh |date=December 18, 2020 |title=Optimization Algorithms in Neural Networks |url=https:\u002f\u002fwww.kdnuggets.com\u002foptimization-algorithms-in-neural-networks |access-date=2024-01-13 |website=KDnuggets}}\u003c\u002fref\u003e\u003cbr\u003e+[[Gradient descent]] is a type of local search that optimizes a set of numerical parameters by incrementally adjusting them to minimize a [[loss function]]. Variants of gradient descent are commonly used to train [[Neural network|neural networks]],\u003cref\u003e{{Cite web |last=Singh Chauhan |first=Nagesh |date=December 18, 2020 |title=Optimization Algorithms in Neural Networks |url=https:\u002f\u002fwww.kdnuggets.com\u002foptimization-algorithms-in-neural-networks |access-date=2024-01-13 |website=KDnuggets}}\u003c\u002fref\u003e through the [[backpropagation]] algorithm.\u003cbr\u003e \u003cbr\u003e Another type of local search is [[evolutionary computation]], which aims to iteratively improve a set of candidate solutions by \"mutating\" and \"recombining\" them, [[Artificial selection|selecting]] only the fittest to survive each generation.\u003cref\u003e[[Evolutionary computation]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 4.1.2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Distributed search processes can coordinate via [[swarm intelligence]] algorithms. Two popular swarm algorithms used in search are [[particle swarm optimization]] (inspired by bird [[flocking]]) and [[ant colony optimization]] (inspired by [[ant trail]]s).{{Sfnp|Merkle|Middendorf|2013}}\u003cbr\u003e-\u003cbr\u003e-[[Artificial neural network|Neural network]]s learn by using a form of gradient descent called \"[[backpropagation]]\".\u003cbr\u003e \u003cbr\u003e === Logic ===\u003cbr\u003e Formal [[logic]] is used for [[automatic reasoning|reasoning]] and [[knowledge representation]].\u003cref\u003e[[Logic]]: {{Harvtxt|Russell|Norvig|2021|loc=chpts. 6\u20139}}, {{Harvtxt|Luger|Stubblefield|2004|pp=35\u201377}}, {{Harvtxt|Nilsson|1998|loc=chpt. 13\u201316}}\u003c\u002fref\u003e\u003cbr\u003e@@ -164,7 +162,7 @@\u003cbr\u003e [[File:AI hierarchy.svg|thumb|upright]]\u003cbr\u003e [[Deep learning]]\u003cref name=\"Deep learning\"\u003e[[Deep learning]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 21}}, {{Harvtxt|Goodfellow|Bengio|Courville|2016}}, {{Harvtxt|Hinton ''et al.''|2016}}, {{Harvtxt|Schmidhuber|2015}}\u003c\u002fref\u003e uses several layers of neurons between the network's inputs and outputs. The multiple layers can progressively extract higher-level features from the raw input. For example, in [[image processing]], lower layers may identify edges, while higher layers may identify the concepts relevant to a human such as digits, letters, or faces.{{Sfnp|Deng|Yu|2014|pp=199\u2013200}}\u003cbr\u003e \u003cbr\u003e-Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and [[backpropagation]] had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e+Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and backpropagation had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e Some form of deep neural networks (without a specific learning algorithm) were described by:\u003cbr\u003e [[Warren S. McCulloch]] and [[Walter Pitts]] (1943){{Sfnp|Russell|Norvig|2021|p=17}}\u003cbr\u003e [[Alan Turing]] (1948);{{Sfnp|Russell|Norvig|2021|p=785}}","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -103,7 +103,7 @@\u003cbr\u003e ==== Local search ====\u003cbr\u003e [[File:Gradient descent.gif|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begin o [[bad actor]]s, such as [[authoritarian|authoritarian governments]], [[terrorist]]s, [[criminals]] or [[rogue states]].\u003cbr\u003e \u003cbr\u003e-A lethal autonomous weapon is a machine that locates, selects and engages human targets without human supervision.{{Efn|This is the [[United Nations]]' definition, and includes things like [[land mines]] as well.{{Sfnp|Russell|Norvig|2021|p=989}}}} Widely available AI tools can be used by bad actors to develop inexpensive autonomous weapons and, if produced at scale, they are potentially [[weapons of mass destruction]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} Even when used in conventional warfare, it is unlikely that they will be unable to reliably choose targets and could potentially [[murder|kill an innocent person]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} In 2014, 30 nations (including China) supported a ban on autonomous weapons under the [[United Nations]]' [[Convention on Certain Conventional Weapons]], however the [[United States]] and others disagreed.{{Sfnp|Russell|Norvig|2021|p=988}} By 2015, over fifty countries were reported to be researching battlefield robots.\u003cref\u003e{{Harvtxt|Robitzski|2018}}; {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e\u003cbr\u003e+A lethal autonomous weapon is a machine that locates, selects and engages human targets without human supervision.{{Efn|This is the [[United Nations]]' definition, and includes things like [[land mines]] as well.{{Sfnp|Russell|Norvig|2021|p=989}}}} Widely available AI tools can be used by bad actors to develop inexpensive autonomous weapons and, if produced at scale, they are potentially [[weapons of mass destruction]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} Even when used in conventional warfare, they currently cannot reliably choose targets and could potentially [[murder|kill an innocent person]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} In 2014, 30 nations (including China) supported a ban on autonomous weapons under the [[United Nations]]' [[Convention on Certain Conventional Weapons]], however the [[United States]] and others disagreed.{{Sfnp|Russell|Norvig|2021|p=988}} By 2015, over fifty countries were reported to be researching battlefield robots.\u003cref\u003e{{Harvtxt|Robitzski|2018}}; {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e AI tools make it easier for [[Authoritarian|authoritarian governments]] to efficiently control their citizens in several ways. [[Facial recognition system|Face]] and [[Speaker recognition|voice recognition]] allow widespread [[surveillance]]. [[Machine learning]], operating this data, can [[classifier (machine learning)|classify]] potential enemies of the state and prevent them from hiding. [[Recommendation systems]] can precisely target [[propaganda]] and [[misinformation]] for maximum effect. [[Deepfakes]] and [[generative AI]] aid in producing misinformation. Advanced AI can make authoritarian [[technocracy|centralized decision making]] more competitive than liberal and decentralized systems such as [[market (economics)|market]]s. It lowers the cost and difficulty of [[digital warfare]] and [[spyware|advanced spyware]].{{Sfnp|Harari|2018}} All these technologies have been available since 2020 or earlier\u2014AI [[facial recognition system]]s are already being used for [[mass surveillance]] in China.\u003cref\u003e{{Cite news |last1=Buckley |first1=Chris |last2=Mozur |first2=Paul |date=22 May 2019 |title=How China Uses High-Tech Surveillance to Subdue Minorities |url=https:\u002f\u002fwww.nytimes.com\u002f2019\u002f05\u002f22\u002fworld\u002fasia\u002fchina-surveillance-xinjiang.html |work=The New York Times |access-date=2 July 2019 |archive-date=25 November 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191125180459\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2019\u002f05\u002f22\u002fworld\u002fasia\u002fchina-surveillance-xinjiang.html |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web , [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and backpropagation had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e+Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and backpropagation had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e Some form of deep neural networks (without a specific learning algorithm) were described by:\u003cbr\u003e [[Warren S. McCulloch]] and [[Walter Pitts]] (1943){{Sfnp|Russell|Norvig|2021|p=17}}\u003cbr\u003e [[Alan Turing]] (1948);{{Sfnp|Russell|Norvig|2021|p=785}}","--- Revision 71\u003cbr\u003e+++ Revision 72\u003cbr\u003e@@ -267,6 +267,11 @@\u003cbr\u003e {{Further|Information privacy|Artificial intelligence and copyright}}\u003cbr\u003e \u003cbr\u003e Machine learning algorithms require large amounts of data. The techniques used to acquire this data have raised concerns about [[privacy]], [[surveillance]] and [[copyright]].\u003cbr\u003e+\u003cbr\u003e+In a 2025 study, based on an analysis of over 1.7 trillion monthly data events across 134 prominent U.S. websites, data privacy software company Ketch exposes a startling trend\u003cref\u003e{{cite web|last1=Anderson|first1=Max|title=Dirty Data, Broken AI - The hidden threat derailing your competitive edge|url=https:\u002f\u002fwww.ketch.com\u002fblog\u002fposts\u002fdirty-data-broken-ai-study|publisher=Ketch|access-date= 16 January 2025}}\u003c\u002fref\u003e:\u003cbr\u003e+* '''88% of companies fail to respect user opt-out preferences''', with nearly 40% of privacy-dependent trackers remaining active despite opt-out signals.\u003cbr\u003e+* '''215 billion unpermissioned \u201cdirty data\u201d events are generated every month''', with over 55% of collected data fueling marketing and personalization efforts.\u003cbr\u003e+* '''Dirty data infiltrates AI systems''', compromising their integrity and increasing the risk of costly retraining.\u003cbr\u003e \u003cbr\u003e \u003c!-- PRIVACY PROBLEM --\u003e\u003cbr\u003e AI-powered devices and services, such as virtual assistants and IoT products, continuously collect personal information, raising concerns about intrusive data gathering and unauthorized access by third parties. The loss of privacy is further exacerbated by AI's ability to process and combine vast amounts of data, potentially leading to a surveillance society where individual activities are constantly monitored and analyzed without adequate safeguards or transparency.","--- Revision 72\u003cbr\u003e+++ Revision 73\u003cbr\u003e@@ -279,7 +279,7 @@\u003cbr\u003e Sensitive user data collected may include online activity records, geolocation data, video or audio.{{Sfnp|GAO|2022}} For example, in order to build [[speech recognition]] algorithms, [[Amazon (company)|Amazon]] has recorded millions of private conversations and allowed [[temporary worker]]s to listen to and transcribe some of them.{{Sfnp|Valinsky|2019}} Opinions about this widespread surveillance range from those who see it as a [[necessary evil]] to those for whom it is clearly [[unethical]] and a violation of the [[right to privacy]].{{Sfnp|Russell|Norvig|2021|p=991}}\u003cbr\u003e \u003cbr\u003e \u003c!-- PRIVACY SOLUTIONS --\u003e\u003cbr\u003e-AI developers argue that this is the only way to deliver valuable applications. and have developed several techniques that attempt to preserve privacy while still obtaining the data, such as [[data aggregation]], [[de-identification]] and [[differential privacy]].{{Sfnp|Russell|Norvig|2021|pp=991\u2013992}} Since 2016, some privacy experts, such as [[Cynthia Dwork]], have begun to view privacy in terms of [[fairness (machine learning)|fairness]]. [[Brian Christian]] wrote that experts have pivoted \"from the question of 'what they know' to the question of 'what they're doing with it'.\"{{Sfnp|Christian|2020|p=63}}\u003cbr\u003e+AI developers argue that this is the only way to deliver valuable applications and have developed several techniques that attempt to preserve privacy while still obtaining the data, such as [[data aggregation]], [[de-identification]] and [[differential privacy]].{{Sfnp|Russell|Norvig|2021|pp=991\u2013992}} Since 2016, some privacy experts, such as [[Cynthia Dwork]], have begun to view privacy in terms of [[fairness (machine learning)|fairness]]. [[Brian Christian]] wrote that experts have pivoted \"from the question of 'what they know' to the question of 'what they're doing with it'.\"{{Sfnp|Christian|2020|p=63}}\u003cbr\u003e \u003cbr\u003e \u003c!-- COPYRIGHT AND GENERATIVE AI --\u003e\u003cbr\u003e Generative AI is often trained on unlicensed copyrighted works, including in domains such as images or computer code; the output is then used under the rationale of \"[[fair use]]\". Experts disagree about how well and under what circumstances this rationale will hold up in courts of law; relevant factors may include \"the purpose and character of the use of the copyrighted work\" and \"the effect upon the potential market for the copyrighted work\".{{Sfnp|Vincent|2022}}\u003cref\u003e{{Cite web |last=Kopel |first=Matthew |title=Copyright Services: Fair Use |url=https:\u002f\u002fguides.library.cornell.edu\u002fcopyright\u002ffair-use |access-date=2024-04-26 |website=Cornell University Library |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926194057\u002fhttps:\u002f\u002fguides.library.cornell.edu\u002fcopyright\u002ffair-use |url-status=live }}\u003c\u002fref\u003e Website owners who do not wish to have their content scraped can indicate it in a \"[[robots.txt]]\" file.\u003cref\u003e{{Cite magazine |last=Burgess |first=Matt |title=How to Stop Your Data From Being Used to Train AI |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fhow-to-stop-your-data-from-being-used-to-train-ai |access-date=2024-04-26 |magazine=Wired |issn=1059-1028 |archive-date=3 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241003180100\u002fhttps:\u002f\u002fwww.wired.com\u002fstory\u002fhow-to-stop-your-data-from-being-used-to-train-ai\u002f |url-status=live }}\u003c\u002fref\u003e In 2023, leading authors (including [[John Grisham]] and [[Jonathan Franzen]]) sued AI companies for using their work to train generative AI.{{Sfnp|Reisner|2023}}{{Sfnp|Alter|Harris|2023}} Another discussed approach is to envision a separate ''[[sui generis]]'' system of protection for creations generated by AI to ensure fair attribution and compensation for human authors.\u003cref\u003e{{Cite web |title=Getting the Innovation Ecosystem Ready for AI. An IP policy toolkit |url=https:\u002f\u002fwww.wipo.int\u002fedocs\u002fpubdocs\u002fen\u002fwipo-pub-2003-en-getting-the-innovation-ecosystem-ready-for-ai.pdf |website=[[WIPO]]}}\u003c\u002fref\u003e","--- Revision 73\u003cbr\u003e+++ Revision 74\u003cbr\u003e@@ -276,7 +276,7 @@\u003cbr\u003e \u003c!-- PRIVACY PROBLEM --\u003e\u003cbr\u003e AI-powered devices and services, such as virtual assistants and IoT products, continuously collect personal information, raising concerns about intrusive data gathering and unauthorized access by third parties. The loss of privacy is further exacerbated by AI's ability to process and combine vast amounts of data, potentially leading to a surveillance society where individual activities are constantly monitored and analyzed without adequate safeguards or transparency.\u003cbr\u003e \u003cbr\u003e-Sensitive user data collected may include online activity records, geolocation data, video or audio.{{Sfnp|GAO|2022}} For example, in order to build [[speech recognition]] algorithms, [[Amazon (company)|Amazon]] has recorded millions of private conversations and allowed [[temporary worker]]s to listen to and transcribe some of them.{{Sfnp|Valinsky|2019}} Opinions about this widespread surveillance range from those who see it as a [[necessary evil]] to those for whom it is clearly [[unethical]] and a violation of the [[right to privacy]].{{Sfnp|Russell|Norvig|2021|p=991}}\u003cbr\u003e+Sensitive user data collected may include online activity records, geolocation data, video, or audio.{{Sfnp|GAO|2022}} For example, in order to build [[speech recognition]] algorithms, [[Amazon (company)|Amazon]] has recorded millions of private conversations and allowed [[temporary worker]]s to listen to and transcribe some of them.{{Sfnp|Valinsky|2019}} Opinions about this widespread surveillance range from those who see it as a [[necessary evil]] to those for whom it is clearly [[unethical]] and a violation of the [[right to privacy]].{{Sfnp|Russell|Norvig|2021|p=991}}\u003cbr\u003e \u003cbr\u003e \u003c!-- PRIVACY SOLUTIONS --\u003e\u003cbr\u003e AI developers argue that this is the only way to deliver valuable applications and have developed several techniques that attempt to preserve privacy while still obtaining the data, such as [[data aggregation]], [[de-identification]] and [[differential privacy]].{{Sfnp|Russell|Norvig|2021|pp=991\u2013992}} Since 2016, some privacy experts, such as [[Cynthia Dwork]], have begun to view privacy in terms of [[fairness (machine learning)|fairness]]. [[Brian Christian]] wrote that experts have pivoted \"from the question of 'what they know' to the question of 'what they're doing with it'.\"{{Sfnp|Christian|2020|p=63}}","--- Revision 74\u003cbr\u003e+++ Revision 75\u003cbr\u003e@@ -267,11 +267,6 @@\u003cbr\u003e {{Further|Information privacy|Artificial intelligence and copyright}}\u003cbr\u003e \u003cbr\u003e Machine learning algorithms require large amounts of data. The techniques used to acquire this data have raised concerns about [[privacy]], [[surveillance]] and [[copyright]].\u003cbr\u003e-\u003cbr\u003e-In a 2025 study, based on an analysis of over 1.7 trillion monthly data events across 134 prominent U.S. websites, data privacy software company Ketch exposes a startling trend\u003cref\u003e{{cite web|last1=Anderson|first1=Max|title=Dirty Data, Broken AI - The hidden threat derailing your competitive edge|url=https:\u002f\u002fwww.ketch.com\u002fblog\u002fposts\u002fdirty-data-broken-ai-study|publisher=Ketch|access-date= 16 January 2025}}\u003c\u002fref\u003e:\u003cbr\u003e-* '''88% of companies fail to respect user opt-out preferences''', with nearly 40% of privacy-dependent trackers remaining active despite opt-out signals.\u003cbr\u003e-* '''215 billion unpermissioned \u201cdirty data\u201d events are generated every month''', with over 55% of collected data fueling marketing and personalization efforts.\u003cbr\u003e-* '''Dirty data infiltrates AI systems''', compromising their integrity and increasing the risk of costly retraining.\u003cbr\u003e \u003cbr\u003e \u003c!-- PRIVACY PROBLEM --\u003e\u003cbr\u003e AI-powered devices and services, such as virtual assistants and IoT products, continuously collect personal information, raising concerns about intrusive data gathering and unauthorized access by third parties. The loss of privacy is further exacerbated by AI's ability to process and combine vast amounts of data, potentially leading to a surveillance society where individual activities are constantly monitored and analyzed without adequate safeguards or transparency.","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -549,7 +549,7 @@\u003cbr\u003e === Transhumanism ===\u003cbr\u003e {{Main|Transhumanism}}\u003cbr\u003e \u003c!-- TRANSHUMANISM --\u003e\u003cbr\u003e-Robot designer [[Hans Moravec]], cyberneticist [[Kevin Warwick]] and inventor [[Ray Kurzweil]] have predicted that humans and machines may merge in the future into [[cyborg]]s that are more capable and powerful than either. This idea, called [[transhumanism]], has roots in the writings of [[Aldous Huxley]] and [[Robert Ettinger]].\u003cref\u003e[[Transhumanism]]: {{Harvtxt|Moravec|1988}}, {{Harvtxt|Kurzweil|2005}}, {{Harvtxt|Russell|Norvig|2021|p=1005}}\u003c\u002fref\u003e\u003cbr\u003e+Robot designer [[Hans Moravec]], cyberneticist [[Kevin Warwick]] and inventor [[Ray Kurzweil]] have predicted that humans and machines may merge in the future into [[cyborg]]s that are more capable and powerful than either. This idea, called transhumanism, has roots in the writings of [[Aldous Huxley]] and [[Robert Ettinger]].\u003cref\u003e[[Transhumanism]]: {{Harvtxt|Moravec|1988}}, {{Harvtxt|Kurzweil|2005}}, {{Harvtxt|Russell|Norvig|2021|p=1005}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- EVOLUTION \u002f HUMAN REPLACEMENT --\u003e\u003cbr\u003e [[Edward Fredkin]] argues that \"artificial intelligence is the next step in evolution\", an idea first proposed by [[Samuel Butler (novelist)|Samuel Butler]]'s \"[[Darwin among the Machines]]\" as far back as 1863, and expanded upon by [[George Dyson (science historian)|George Dyson]] in his 1998 book ''[[Darwin Among the Machines#Evolution of Global Intelligence|Darwin Among the Machines: The Evolution of Global Intelligence]]''.\u003cref\u003eAI as evolution: [[Edward Fredkin]] is quoted in {{Harvtxt|McCorduck|2004|p=401}}, {{Harvtxt|Butler|1863}}, {{Harvtxt|Dyson|1998}}\u003c\u002fref\u003e","--- Revision 76\u003cbr\u003e+++  [[free will]].\u003cref\u003e{{Cite web |last=McCarthy |first=John |title=The Philosophy of AI and the AI of Philosophy |url=http:\u002f\u002fjmc.stanford.edu\u002farticles\u002faiphil2.html |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20181023181725\u002fhttp:\u002f\u002fjmc.stanford.edu\u002farticles\u002faiphil2.html |archive-date=2018-10-23 |access-date=2024-10-03 |website=jmc.stanford.edu}}\u003c\u002fref\u003e Rapid advancements have intensified public discussions on the philosophy and [[ethics of AI]].\u003cref name=\"Jarow-2024\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e === Defining artificial intelligence ===\u003cbr\u003e {{See also|Turing test|Intelligent agent|Dartmouth workshop|Synthetic intelligence}}","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -474,7 +474,7 @@\u003cbr\u003e [[File:Weakness of Turing test 1.svg|thumb|The Turing test can provide some evidence of intelligence, but it penalizes non-human intelligent behavior.\u003cref\u003e{{Cite web |last1=Kirk-Giannini |first1=Cameron Domenico |last2=Goldstein |first2=Simon |date=2023-10-16 |title=AI is closer than ever to passing the Turing test for 'intelligence'. What happens when it does? |url=https:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |access-date=2024-08-17 |website=The Conversation |archive-date=25 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240925040612\u002fhttps:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |url-status=live }}\u003c\u002fref\u003e]]\u003cbr\u003e [[Stuart J. Russell|Russell]] and [[Norvig]] agree with Turing that intelligence must be defined in terms of external behavior, not internal structure.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} However, they are critical that the test requires the machine to imitate humans. \"[[Aeronautics|Aeronautical engineering]] texts\", they wrote, \"do not define the goal of their field as making 'machines that fly so exactly like [[pigeon]]s that they can fool other pigeons.{{' \"}}{{Sfnp|Russell|Norvig|2021|p=3}} AI founder [[John McCarthy (computer scientist)|John McCarthy]] agreed, writing that \"Artificial intelligence is not, by definition, simulation of human intelligence\".{{Sfnp|Maker|2006}}\u003cbr\u003e \u003cbr\u003e-McCarthy defines intelligence as \"the computational part of the ability to achieve goals in the world\".{{Sfnp|McCarthy|1999}} Another AI founder, [[Marvin Minsky]] similarly describes it as \"the ability to solve hard problems\".{{Sfnp|Minsky|1986}} The leading AI textbook defines it as the study of agents that perceive their environment and take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} These definitions view intelligence in terms of well-defined problems with well-defined solutions, where both the difficulty of the problem and the performance of the program are direct measures of the \"intelligence\" of the machine\u2014and no other philosophical discussion is required, or may not even be possible.\u003cbr\u003e+McCarthy defines intelligence as \"the computational part of the ability to achieve goals in the world\".{{Sfnp|McCarthy|1999}} Another AI founder, [[Marvin Minsky]], similarly describes it as \"the ability to solve hard problems\".{{Sfnp|Minsky|1986}} The leading AI textbook defines it as the study of agents that perceive their environment and take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} These definitions view intelligence in terms of well-defined problems with well-defined solutions, where both the difficulty of the problem and the performance of the program are direct measures of the \"intelligence\" of the machine\u2014and no other philosophical discussion is required, or may not even be possible.\u003cbr\u003e \u003cbr\u003e Another definition has been adopted by Google,\u003cref\u003e{{Cite web |title=What Is Artificial Intelligence (AI)? |url=https:\u002f\u002fcloud.google.com\u002flearn\u002fwhat-is-artificial-intelligence |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230731114802\u002fhttps:\u002f\u002fcloud.google.com\u002flearn\u002fwhat-is-artificial-intelligence |archive-date=31 July 2023 |access-date=16 October 2023 |website=[[Google Cloud Platform]]}}\u003c\u002fref\u003e a major practitioner in the field of AI. This definition stipulates the ability of systems to synthesize information as the manifestation of intelligence, similar to the way it is defined in biological intelligence.\u003cbr\u003e ","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -194,7 +194,7 @@\u003cbr\u003e \u003cbr\u003e In the late 2010s, [[graphics processing unit]]s (GPUs) that were increasingly designed with AI-specific enhancements and used with specialized [[TensorFlow]] software had replaced previously used [[central processing unit]] (CPUs) as the dominant means for large-scale (commercial and academic) [[machine learning]] models' training.{{Sfnp|Kobielus|2019}} Specialized [[programming language]]s such as [[Prolog]] were used in early AI research,\u003cref\u003e{{Cite web |last=Thomason |first=James |date=2024-05-21 |title=Mojo Rising: The resurgence of AI-first programming languages |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages |access-date=2024-05-26 |website=VentureBeat |archive-date=27 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240627143853\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages\u002f |url-status=live }}\u003c\u002fref\u003e but [[general-purpose programming language]]s like [[Python (programming language)|Python]] have become predominan  |first3=Jackie |date=March 10, 2023 |title=A Cheat Sheet to AI Buzzwords and Their Meanings |url=https:\u002f\u002fnews.bloomberglaw.com\u002ftech-and-telecom-law\u002fa-cheat-sheet-to-ai-buzzwords-and-their-meanings-quicktake |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231117140835\u002fhttps:\u002f\u002fnews.bloomberglaw.com\u002ftech-and-telecom-law\u002fa-cheat-sheet-to-ai-buzzwords-and-their-meanings-quicktake |archive-date=November 17, 2023 |access-date=March 14, 2023 |work=Bloomberg News}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In March 2023, 58% of U.S. adults had heard about [[ChatGPT]] and 14% had tried it.\u003cref\u003e{{Cite web |last=Marcelline |first=Marco |date=May 27, 2023 |title=ChatGPT: Most Americans Know About It, But Few Actually Use the AI Chatbot |url=https:\u002f\u002fwww.pcmag.com\u002fnews\u002ffew-americans-have-actually-tried-chatgpt-despite-most-knowing-about-it |access-date=2024-01-28 |website=PCMag |archive-date=21 May 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240521070709\u002fhttps:\u002f\u002fwww.pcmag.com\u002fnews\u002ffew-americans-have-actually-tried-chatgpt-despite-most-knowing-about-it |url-status=live }}\u003c\u002fref\u003e The increasing realism and ease-of-use of AI-based [[text-to-image]] generators such as [[Midjourney]], [[DALL-E]], and [[Stable Diffusion]] sparked a trend of [[Viral phenomenon|viral]] AI-generated photos. Widespread attention was gained by a fake photo of [[Pope Francis]] wearing a white puffer coat, the fictional arrest of [[Donald Trump]], and a hoax of an attack on the [[The Pentagon|Pentagon]], as well as the usage in professional creative arts.\u003cref\u003e{{Cite news |last=Lu |first=Donna |date=2023-03-31 |title=Misinformation, mistakes and the Pope in a puffer: what rapidly evolving AI can \u2013 and can't \u2013 do |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002fapr\u002f01\u002fmisinformation-mistakes-and-the-pope-in-a-puffer-what-rapidly-evolving-ai-can-and-cant-do |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=10 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240610171215\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002fapr\u002f01\u002fmisinformation-mistakes-and-the-pope-in-a-puffer-what-rapidly-evolving-ai-can-and-cant-do |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Hurst |first=Luke |date=2023-05-23 |title=How a fake image of a Pentagon explosion shared on Twitter caused a real dip on Wall Street |url=https:\u002f\u002fwww.euronews.com\u002fnext\u002f2023\u002f05\u002f23\u002ffake-news-about-an-explosion-at-the-pentagon-spreads-on-verified-accounts-on-twitter |access-date=2024-01-28 |website=euronews}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Vincent van Gogh in watercolour.png|thumb|[[Vincent van Gogh]] in watercolour created by generative AI software]]{{Excerpt|Generative artificial intelligence|only=paragraphs|paragraphs=1-3}}\u003cbr\u003e \u003cbr\u003e ===Agents===\u003cbr\u003e Artificial intelligent (AI) agents are software entities designed to perceive their environment, make decisions, and take actions autonomously to achieve specific goals. These agents can interact with users, their environment, or other agents. AI agents are used in various applications, including [[virtual assistant]]s, [[chatbots]], [[autonomous vehicles]], [[Video game console|game-playing systems]], and [[industrial robotics]]. AI agents operate within the constraints of their programming, available computational resources, and hardware limitations. This means they are restricted to performing tasks within their defined scope and have finite memory and processing capabilities. In real-world applications, AI agents often face time constraints for decision-making and action execution. Many AI agents incorporate learning algorithms, enabling them to improve their e-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |access-date=2025-01-19 |work=Wall Street Journal |language=en-US |issn=0099-9660 |archive-date=2 October 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231002080608\u002fhttps:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |url-status=live }}\u003c\u002fref\u003e named after [[Nvidia]] co-founder and CEO [[Jensen Huang]].\u003cbr\u003e \u003cbr\u003e == Applications ==\u003cbr\u003e {{Main|Applications of artificial intelligence}}AI and machine learning technology is used in most of the essential applications of the 2020s, including: [[search engines]] (such as [[Google Search]]), [[Targeted advertising|targeting online advertisements]], [[recommendation systems]] (offered by [[Netflix]], [[YouTube]] or [[Amazon (company)|Amazon]]), driving [[internet traffic]], [[Marketing and artificial intelligence|targeted advertising]] ([[AdSense]], [[Facebook]]), [[virtual assistant]]s (such as [[Siri]] or [[Amazon Alexa|Alexa]]), [[autonomous vehicles]] (including [[Unmanned aerial vehicle|drones]], [[Advanced driver-assistance system|ADAS]] and [[self-driving cars]]), [[automatic language translation]] ([[Microsoft Translator]], [[Google Translate]]), [[Facial recognition system|facial recognition]] ([[Apple Computer|Apple]]'s [[Face ID]] or [[Microsoft]]'s [[DeepFace]] and [[Google]]'s [[FaceNet]]) and [[image labeling]] (used by [[Facebook]], Apple's [[iPhoto]] and [[TikTok]]). The deployment of AI may be overseen by a [[Chief automation officer]] (CAO).\u003cbr\u003e \u003cbr\u003e ===Health and medicine===\u003cbr\u003e {{Main|Artificial intelligence in healthcare}}\u003cbr\u003e-The application of AI in [[medicine]] and [[medical research]] has the potential to increase patient care and quality of life.\u003cref\u003e{{Cite journal |last1=Davenport |first1=T |last2=Kalakota |first2=R |date=June 2019 |title=The po
