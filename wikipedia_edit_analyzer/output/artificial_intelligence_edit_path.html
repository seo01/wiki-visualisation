        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="a1dba5e6-ee6b-4819-a965-8bac8f3a0a78" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("a1dba5e6-ee6b-4819-a965-8bac8f3a0a78")) {                    Plotly.newPlot(                        "a1dba5e6-ee6b-4819-a965-8bac8f3a0a78",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -211,13 +211,13 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques.\u003cref\u003e{{Cite magazine |last1=Grant |first1=Eugene F. |last2=Lardner |first2=Rex |date=1952-07-25 |title=The Talk of the Town \u2013 It |url=https:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |access-date=2024-01-28 |magazine=The New Yorker |issn=0028-792X |archive-date=16 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200216034025\u002fhttps:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |url-status=live }}\u003c\u002fref\u003e [[IBM Deep Blue|Deep Blue]] became the first computer chess-playing system to beat a reigning world chess champion, [[Garry Kasparov]], on 11 May 1997.\u003cref\u003e{{Cite web |last=Anderson |first=Mark Robert |date=2017-05-11 |title=Twenty years on from Deep Blue vs Kasparov: how a chess match started the big data revolution |url=http:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |access-date=2024-01-28 |website=The Conversation |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917000827\u002fhttps:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |url-status=live }}\u003c\u002fref\u003e In 2011, in a ''[[Jeopardy!]]'' [[quiz show]] exhibition match, [[IBM]]'s [[question answering system]], [[Watson (artificial intelligence software)|Watson]], defeated the two greatest ''Jeopardy!'' champions, [[Brad Rutter]] and [[Ken Jennings]], by a significant margin.\u003cref\u003e{{Cite news |last=Markoff |first=John |date=2011-02-16 |title=Computer Wins on 'Jeopardy!': Trivial, It's Not |url=https:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-access=subscription |access-date=2024-01-28 |work=The New York Times |issn=0362-4331 |archive-date=22 October 2014 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003eUesato, J. et al.: [https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f ''Improving mathematical reasoning with process supervision.''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240915161758\u002fhttps:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |date=15 September 2024 }} openai.com, May 31, 2023. Retrieved 2024-08-07.\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct output.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling relatively a small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft\u2019s new rStar-Math technique upgrades small models to outperform OpenAI\u2019s o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''Alpha Tensor'', ''Alpha Geometry'' and ''Alpha Proof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e[https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f ''LLEMMA''.] eleuther.ai. Retrieved 2024-08-07.\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e[https:\u002f\u002fjulius.ai\u002fhome\u002fai-math AI Math.] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fjulius.ai\u002fhome\u002fai-math |date=5 October 2024 }} Caesars Labs, 2024. Retrieved 2024-08-07.\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling relatively a small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft\u2019s new rStar-Math technique upgrades small models to outperform OpenAI\u2019s o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last=Azerbayev |first=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e When natural language is used to describe mathematical problems, converters can transform such prompts into a formal language such as [[Lean (proof assistant)|Lean]] to define mathematical tasks.\u003cbr\u003e \u003cbr\u003e-Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003eAlex McFarland: [https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f ''7 Best AI for Math Tools.''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125615\u002fhttps:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |date=11 September 2024 }} unite.ai. Retrieved 2024-08-07\u003c\u002fref\u003e\u003cbr\u003e+Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003e{{Cite web |last=McFarland |first=Alex |date=2024-07-12 |title=8 Best AI for Math Tools (January 2025) |url=https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |access-date=2025-01-26 |website=Unite.AI |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Topological deep learning]] integrates various [[topology|topological]] approaches, such as [[algebraic topology|algebraic]], [[differential topology|differential]], and [[geometric topology]], with deep neural networks to address highly intricate and high-order data.\u003cref\u003e{{Cite journal |last=Cang |first=Zixuan |last2=Wei |first2=Guo-Wei |date=2017-07-27 |title=TopologyNet: Topology based deep convolutional and multi-task neural networks for biomolecular property predictions |url=https:\u002f\u002fjournals.plos.org\u002fploscompbiol\u002farticle?id=10.1371\u002fjournal.pcbi.1005690 |journal=PLOS Computational Biology |language=en |volume=13 |issue=7 |pages=e1005690 |doi=10.1371\u002fjournal.pcbi.1005690 |issn=1553-7358 |pmc=5549771 |pmid=28749969}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -194,7 +194,7 @@\u003cbr\u003e \u003cbr\u003e In the late 2010s, [[graphics processing unit]]s (GPUs) that were increasingly designed with AI-specific enhancements and used with specialized [[TensorFlow]] software had replaced previously used [[central processing unit]] (CPUs) as the dominant means for large-scale (commercial and academic) [[machine learning]] models' training.{{Sfnp|Kobielus|2019}} Specialized [[programming language]]s such as [[Prolog]] were used in early AI research,\u003cref\u003e{{Cite web |last=Thomason |first=James |date=2024-05-21 |title=Mojo Rising: The resurgence of AI-first programming languages |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages |access-date=2024-05-26 |website=VentureBeat |archive-date=27 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240627143853\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fmojo-rising-the-resurgence-of-ai-first-programming-languages\u002f |url-status=live }}\u003c\u002fref\u003e but [[general-purpose programming language]]s like [[Python (programming language)|Python]] have become predominant.\u003cref\u003e{{Cite news |last=Wodecki |first=Ben |date=May 5, 2023 |title=7 AI Programming Languages You Need to Know |url=https:\u002f\u002faibusiness.com\u002fverticals\u002f7-ai-programming-languages-you-need-to-know |work=AI Business |access-date=5 October 2024 |archive-date=25 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240725164443\u002fhttps:\u002f\u002faibusiness.com\u002fverticals\u002f7-ai-programming-languages-you-need-to-know |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The transistor density in [[integrated circuit]]s has been observed to roughly double every 18 months\u2014a trend known as [[Moore's law]], named after the [[Intel]] co-founder [[Gordon Moore]], who first identified it. Improvements in [[GPUs]] have been even faster,\u003cref\u003e{{Cite web |last=Plumb |first=Taryn |date=2024-09-18 |title=Why Jensen Huang and Marc Benioff see 'gigantic' opportunity for agentic AI |url=https:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |access-date=2024-10-04 |website=VentureBeat |language=en-US |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |url-status=live }}\u003c\u002fref\u003e a trend sometimes called [[Huang's law]],\u003cref\u003e{{Cite news |last=Mims |first=Christopher |date=2020-09-19 |title=Huang\u2019s Law Is the New Moore\u2019s Law, and Explains Why Nvidia Wants Arm |url=https:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |access-date=2025-01-19 |work=Wall Street Journal |language=en-US |issn=0099-9660 |archive-date=2 October 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231002080608\u002fhttps:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |url-status=live }}\u003c\u002fref\u003e named after [[Nvidia]] co-founder and CEO [[Jensen Huang]].\u003cbr\u003e+The transistor density in [[integrated circuit]]s has been observed to roughly double every 18 months\u2014a trend known as [[Moore's law]], named after the [[Intel]] co-founder [[Gordon Moore]], who first identified it. Improvements in [[GPUs]] have been even faster,\u003cref\u003e{{Cite web |last=Plumb |first=Taryn |date=2024-09-18 |title=Why Jensen Huang and Marc Benioff see 'gigantic' opportunity for agentic AI |url=https:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |access-date=2024-10-04 |website=VentureBeat |language=en-US |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fwhy-jensen-huang-and-marc-benioff-see-gigantic-opportunity-for-agentic-ai\u002f |url-status=live }}\u003c\u002fref\u003e a trend sometimes called [[Huang's law]],\u003cref\u003e{{Cite news |last=Mims |first=Christopher |date=2020-09-19 |title=Huang's Law Is the New Moore's Law, and Explains Why Nvidia Wants Arm |url=https:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |access-date=2025-01-19 |work=Wall Street Journal |language=en-US |issn=0099-9660 |archive-date=2 October 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231002080608\u002fhttps:\u002f\u002fwww.wsj.com\u002farticles\u002fhuangs-law-is-the-new-moores-law-and-explains-why-nvidia-wants-arm-11600488001 |url-status=live }}\u003c\u002fref\u003e named after [[Nvidia]] co-founder and CEO [[Jensen Huang]].\u003cbr\u003e \u003cbr\u003e == Applications ==\u003cbr\u003e {{Main|Applications of artificial intelligence}}AI and machine learning technology is used in most of the essential applications of the 2020s, including: [[search engines]] (such as [[Google Search]]), [[Targeted advertising|targeting online advertisements]], [[recommendation systems]] (offered by [[Netflix]], [[YouTube]] or [[Amazon (company)|Amazon]]), driving [[internet traffic]], [[Marketing and artificial intelligence|targeted advertising]] ([[AdSense]], [[Facebook]]), [[virtual assistant]]s (such as [[Siri]] or [[Amazon Alexa|Alexa]]), [[autonomous vehicles]] (including [[Unmanned aerial vehicle|drones]], [[Advanced driver-assistance system|ADAS]] and [[self-driving cars]]), [[automatic language translation]] ([[Microsoft Translator]], [[Google Translate]]), [[Facial recognition system|facial recognition]] ([[Apple Computer|Apple]]'s [[Face ID]] or [[Microsoft]]'s [[DeepFace]] and [[Google]]'s [[FaceNet]]) and [[image labeling]] (used by [[Facebook]], Apple's [[iPhoto]] and [[TikTok]]). The deployment of AI may be overseen by a [[Chief automation officer]] (CAO).\u003cbr\u003e@@ -211,15 +211,15 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques.\u003cref\u003e{{Cite magazine |last1=Grant |first1=Eugene F. |last2=Lardner |first2=Rex |date=1952-07-25 |title=The Talk of the Town \u2013 It |url=https:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |access-date=2024-01-28 |magazine=The New Yorker |issn=0028-792X |archive-date=16 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200216034025\u002fhttps:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |url-status=live }}\u003c\u002fref\u003e [[IBM Deep Blue|Deep Blue]] became the first computer chess-playing system to beat a reigning world chess champion, [[Garry Kasparov]], on 11 May 1997.\u003cref\u003e{{Cite web |last=Anderson |first=Mark Robert |date=2017-05-11 |title=Twenty years on from Deep Blue vs Kasparov: how a chess match started the big data revolution |url=http:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |access-date=2024-01-28 |website=The Conversation |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917000827\u002fhttps:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |url-status=live }}\u003c\u002fref\u003e In 2011, in a ''[[Jeopardy!]]'' [[quiz show]] exhibition match, [[IBM]]'s [[question answering system]], [[Watson (artificial intelligence software)|Watson]], defeated the two greatest ''Jeopardy!'' champions, [[Brad Rutter]] and [[Ken Jennings]], by a significant margin.\u003cref\u003e{{Cite news |last=Markoff |first=John |date=2011-02-16 |title=Computer Wins on 'Jeopardy!': Trivial, It's Not |url=https:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-access=subscription |access-date=2024-01-28 |work=The New York Times |issn=0362-4331 |archive-date=22 October 2014 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling relatively a small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft\u2019s new rStar-Math technique upgrades small models to outperform OpenAI\u2019s o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last=Azerbayev |first=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling relatively a small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e When natural language is used to describe mathematical problems, converters can transform such prompts into a formal language such as [[Lean (proof assistant)|Lean]] to define mathematical tasks.\u003cbr\u003e \u003cbr\u003e Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003e{{Cite web |last=McFarland |first=Alex |date=2024-07-12 |title=8 Best AI for Math Tools (January 2025) |url=https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |access-date=2025-01-26 |website=Unite.AI |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Topological deep learning]] integrates various [[topology|topological]] approaches, such as [[algebraic topology|algebraic]], [[differential topology|differential]], and [[geometric topology]], with deep neural networks to address highly intricate and high-order data.\u003cref\u003e{{Cite journal |last=Cang |first=Zixuan |last2=Wei |first2=Guo-Wei |date=2017-07-27 |title=TopologyNet: Topology based deep convolutional and multi-task neural networks for biomolecular property predictions |url=https:\u002f\u002fjournals.plos.org\u002fploscompbiol\u002farticle?id=10.1371\u002fjournal.pcbi.1005690 |journal=PLOS Computational Biology |language=en |volume=13 |issue=7 |pages=e1005690 |doi=10.1371\u002fjournal.pcbi.1005690 |issn=1553-7358 |pmc=5549771 |pmid=28749969}}\u003c\u002fref\u003e\u003cbr\u003e+[[Topological deep learning]] integrates various [[topology|topological]] approaches, such as [[algebraic topology|algebraic]], [[differential topology|differential]], and [[geometric topology]], with deep neural networks to address highly intricate and high-order data.\u003cref\u003e{{Cite journal |last1=Cang |first1=Zixuan |last2=Wei |first2=Guo-Wei |date=2017-07-27 |title=TopologyNet: Topology based deep convolutional and multi-task neur urns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |url-status=live }}\u003c\u002fref\u003e These programs, and others, inspired an aggressive [[AI boom]], where large companies began investing billions of dollars in AI research. According to AI Impacts, about $50 billion annually was invested in \"AI\" around 2022 in the U.S. alone and about 20% of the new U.S. Computer Science PhD graduates have specialized in \"AI\".{{Sfnp|DiFeliciantonio|2023}} About 800,000 \"AI\"-related U.S. job openings existed in 2022.{{Sfnp|Goswami|2023}} According to PitchBook research, 22% of newly funded [[Startup company|startups]] in 2024 claimed to be AI companies.\u003cref\u003e{{cite web | title=Nearly 1 in 4 new startups is an AI company | website=PitchBook | date=2024-12-24 | url=https:\u002f\u002fpitchbook.com\u002fnews\u002farticles\u002fnearly-1-in-4-new-startups-is-an-ai-company | access-date=2025-01-03}}\u003c\u002fref\u003e\u003cbr\u003e+In the late teens and early 2020s, [[artificial general intelligence|AGI]] companies began to deliver programs that created enormous interest. In 2015, [[AlphaGo]], developed by [[DeepMind]], beat the world champion [[Go player]]. The program taught only the game's rules and developed a strategy by itself. [[GPT-3]] is a [[large language model]] that was released in 2020 by [[OpenAI]] and is capable of generating high-quality human-like text.\u003cref\u003e{{Cite web |last=Sagar |first=Ram |date=2020-06-03 |title=OpenAI Releases GPT-3, The Largest Model So Far |url=https:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200804173452\u002fhttps:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |archive-date=2020-08-04 |access-date=2023-03-15 |website=Analytics India Magazine}}\u003c\u002fref\u003e [[ChatGPT]], launched on November 30, 2022, became the fastest-growing consumer software application in history, gaining over 100 million users in two months.\u003cref\u003e{{Cite news |last=Milmo |first=Dan |date=2023-02-02 |title=ChatGPT reaches 100 million users two months after launch |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |access-date=2024-12-31 |work=The Guardian |language=en-GB |issn=0261-3077 |archive-date=3 February 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230203051356\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |url-status=live }}\u003c\u002fref\u003e It marked what is widely regarded as AI's breakout year, bringing it into the public consciousness.\u003cref\u003e{{Cite web |last=Gorichanaz |first=Tim |date=2023-11-29 |title=ChatGPT turns 1: AI chatbot's success says as much about humans as technology |url=https:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |access-date=2024-12-31 |website=The Conversation |language=en-US |archive-date=31 December 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241231073513\u002fhttps:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |url-status=live }}\u003c\u002fref\u003e These programs, and others, inspired an aggressive [[AI boom]], where large companies began investing billions of dollars in AI research. According to AI Impacts, about $50 billion annually was invested in \"AI\" around 2022 in the U.S. alone and about 20% of the new U.S. Computer Science PhD graduates have specialized in \"AI\".{{Sfnp|DiFeliciantonio|2023}} About 800,000 \"AI\"-related U.S. job openings existed in 2022.{{Sfnp|Goswami|2023}} According to PitchBook research, 22% of newly funded [[Startup company|startups]] in 2024 claimed to be AI companies.\u003cref\u003e{{cite web | title=Nearly 1 in 4 new startups is an AI company | website=PitchBook | date=2024-12-24 | url=https:\u002f\u002fpitchbook.com\u002fnews\u002farticles\u002fnearly-1-in-4-new-startups-is-an-ai-company | access-date=2025-01-03}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Philosophy ==\u003cbr\u003e {{Main|Philosophy of artificial intelligence}}","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -219,7 +219,7 @@\u003cbr\u003e \u003cbr\u003e Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003e{{Cite web |last=McFarland |first=Alex |date=2024-07-12 |title=8 Best AI for Math Tools (January 2025) |url=https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |access-date=2025-01-26 |website=Unite.AI |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Topological deep learning]] integrates various [[topology|topological]] approaches, such as [[algebraic topology|algebraic]], [[differential topology|differential]], and [[geometric topology]], with deep neural networks to address highly intricate and high-order data.\u003cref\u003e{{Cite journal |last1=Cang |first1=Zixuan |last2=Wei |first2=Guo-Wei |date=2017-07-27 |title=TopologyNet: Topology based deep convolutional and multi-task neural networks for biomolecular property predictions |journal=PLOS Computational Biology |language=en |volume=13 |issue=7 |pages=e1005690 |doi=10.1371\u002fjournal.pcbi.1005690 |doi-access=free |issn=1553-7358 |pmc=5549771 |pmid=28749969|arxiv=1704.00063 |bibcode=2017PLSCB..13E5690C }}\u003c\u002fref\u003e\u003cbr\u003e+[[Topological deep learning]] integrates various [[topology|topological]] approaches.\u003cbr\u003e \u003cbr\u003e === Finance ===\u003cbr\u003e Finance is one of the fastest growing sectors where applied AI tools are being deployed: from retail online banking to investment advice and insurance, where automated \"robot advisers\" have been in use for some years.\u003cref\u003eMatthew Finio & Amanda Downie: IBM Think 2024 Primer, \"What is Artificial Intelligence (AI) in Finance?\" 8 Dec. 2023\u003c\u002fref\u003e","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -211,7 +211,7 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques.\u003cref\u003e{{Cite magazine |last1=Grant |first1=Eugene F. |last2=Lardner |first2=Rex |date=1952-07-25 |title=The Talk of the Town \u2013 It |url=https:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |access-date=2024-01-28 |magazine=The New Yorker |issn=0028-792X |archive-date=16 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200216034025\u002fhttps:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |url-status=live }}\u003c\u002fref\u003e [[IBM Deep Blue|Deep Blue]] became the first computer chess-playing system to beat a reigning world chess champion, [[Garry Kasparov]], on 11 May 1997.\u003cref\u003e{{Cite web |last=Anderson |first=Mark Robert |date=2017-05-11 |title=Twenty years on from Deep Blue vs Kasparov: how a chess match started the big data revolution |url=http:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |access-date=2024-01-28 |website=The Conversation |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917000827\u002fhttps:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |url-status=live }}\u003c\u002fref\u003e In 2011, in a ''[[Jeopardy!]]'' [[quiz show]] exhibition match, [[IBM]]'s [[question answering system]], [[Watson (artificial intelligence software)|Watson]], defeated the two greatest ''Jeopardy!'' champions, [[Brad Rutter]] and [[Ken Jennings]], by a significant margin.\u003cref\u003e{{Cite news |last=Markoff |first=John |date=2011-02-16 |title=Computer Wins on 'Jeopardy!': Trivial, It's Not |url=https:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-access=subscription |access-date=2024-01-28 |work=The New York Times |issn=0362-4331 |archive-date=22 October 2014 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling relatively a small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -101,7 +101,7 @@\u003cbr\u003e [[Adversarial search]] is used for [[game AI|game-playing]] programs, such as chess or Go. It searches through a [[Game tree|tree]] of possible moves and countermoves, looking for a winning position.\u003cref\u003e[[Adversarial search]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 5}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Local search ====\u003cbr\u003e-[[File:Gradient descent.gif|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begins with some form of guess and refines it incrementally.\u003cref\u003e[[Local search (optimization)|Local]] or \"[[optimization]]\" search: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 4}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Gradient descent.gif|class=skin-invert-image|thumb|Illustration of [[gradient descent]] for 3 different starting points; two parameters (represented by the plan coordinates) are adjusted in order to minimize the [[loss function]] (the height)]] [[Local search (optimization)|Local search]] uses [[mathematical optimization]] to find a solution to a problem. It begins with some form of guess and refines it incrementally.\u003cref\u003e[[Local search (optimization)|Local]] or \"[[optimization]]\" search: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 4}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Gradient descent]] is a type of local search that optimizes a set of numerical parameters by incrementally adjusting them to minimize a [[loss function]]. Variants of gradient descent are commonly used to train [[Artificial neural network|neural networks]],\u003cref\u003e{{Cite web |last=Singh Chauhan |first=Nagesh |date=December 18, 2020 |title=Optimization Algorithms in Neural Networks |url=https:\u002f\u002fwww.kdnuggets.com\u002foptimization-algorithms-in-neural-networks |access-date=2024-01-13 |website=KDnuggets}}\u003c\u002fref\u003e through the [[backpropagation]] algorithm.\u003cbr\u003e \u003cbr\u003e@@ -124,7 +124,7 @@\u003cbr\u003e [[Non-monotonic logic]]s, including logic programming with [[negation as failure]], are designed to handle [[default reasoning]].\u003cref name=\"Default reasoning\"\u002f\u003e Other specialized versions of logic have been developed to describe many complex domains.\u003cbr\u003e \u003cbr\u003e === Probabilistic methods for uncertain reasoning ===\u003cbr\u003e-[[File:SimpleBayesNet.svg|thumb|upright=1.7|A simple [[Bayesian network]], with the associated [[conditional probability table]]s]]\u003cbr\u003e+[[File:SimpleBayesNet.svg|class=skin-invert-image|thumb|upright=1.7|A simple [[Bayesian network]], with the associated [[conditional probability table]]s]]\u003cbr\u003e Many problems in AI (including in reasoning, planning, learning, perception, and robotics) require the agent to operate with incomplete or uncertain information. AI researchers have devised a number of tools to solve these problems using methods from [[probability]] theory and economics.\u003cref name=\"Stoch\"\u003eStochastic methods for uncertain reasoning: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 12\u201318, 20}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=345\u2013395}}, {{Harvtxt|Luger|Stubblefield|2004|pp=165\u2013191, 333\u2013381}}, {{Harvtxt|Nilsson|1998|loc=chpt. 19}}\u003c\u002fref\u003e Precise mathematical tools have been developed that analyze how an agent can make choices and plan, using [[decision theory]], [[decision analysis]],\u003cref\u003e[[decision theory]] and [[decision analysis]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 16\u201318}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=381\u2013394}}\u003c\u002fref\u003e and [[information value theory]].\u003cref\u003e[[Information value theory]]: {{Harvtxt|Russell|Norvig|2021|loc=sect. 16.6}}\u003c\u002fref\u003e These tools include models such as [[Markov decision process]]es,\u003cref\u003e[[Markov decision process]]es and dynamic [[decision network]]s: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 17}}\u003c\u002fref\u003e dynamic [[decision network]]s,\u003cref name=\"Stochastic temporal models\"\u002f\u003e [[game theory]] and [[mechanism design]].\u003cref\u003e[[Game theory]] and [[mechanism design]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 18}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Bayesian network]]s\u003cref\u003e[[Bayesian network]]s: {{Harvtxt|Russell|Norvig|2021|loc=sects. 12.5\u201312.6, 13.4\u201313.5, 14.3\u201314.5, 16.5, 20.2\u201320.3}}, {{Harvtxt|Poole|Mackworth|Goebel|1998|pp=361\u2013381}}, {{Harvtxt|Luger|Stubblefield|2004|pp=~182\u2013190, \u2248363\u2013379}}, {{Harvtxt|Nilsson|1998|loc=chpt. 19.3\u201319.4}}\u003c\u002fref\u003e are a tool that can be used for [[automated reasoning|reasoning]] (using the [[Bayesian inference]] algorithm),{{Efn|","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -241,7 +241,7 @@\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Applications of AI in this domain include AI-enabled menstruation and fertility trackers that analyze user data to offer prediction,\u003cref\u003e{{Cite journal |last1=Figueiredo |first1=Mayara Costa |last2=Ankrah |first2=Elizabeth |last3=Powell |first3=Jacquelyn E. |last4=Epstein |first4=Daniel A. |last5=Chen |first5=Yunan |date=2024-01-12 |title=Powered by AI: Examining How AI Descriptions Influence Perceptions of Fertility Tracking Applications |url=https:\u002f\u002fdl.acm.org\u002fdoi\u002f10.1145\u002f3631414 |journal=Proc. ACM Interact. Mob. Wearable Ubiquitous Technol. |volume=7 |issue=4 |pages=154:1\u2013 elligent AI.{{Sfnp|M\u00fcller|Bostrom|2014}} Personalities such as [[Stephen Hawking]], [[Bill Gates]], and [[Elon Musk]],\u003cref\u003eLeaders' concerns about the existential risks of AI around 2015: {{Harvtxt|Rawlinson|2015}}, {{Harvtxt|Holley|2015}}, {{Harvtxt|Gibbs|2014}}, {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e as well as AI pioneers such as [[Yoshua Bengio]], [[Stuart J. Russell|Stuart Russell]], [[Demis Hassabis]], and [[Sam Altman]], have expressed concerns about existential risk from AI.\u003cbr\u003e \u003cbr\u003e-In May 2023, [[Geoffrey Hinton]] announced his resignation from Google in order to be able to \"freely speak out about the risks of AI\" without \"considering how this impacts Google.\"\u003cref\u003e{{Cite news |date=25 March 2023 |title=\"Godfather of artificial intelligence\" talks impact and potential of new AI |url=https:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230328225221\u002fhttps:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |archive-date=28 March 2023 |access-date=2023-03-28 |work=CBS News}}\u003c\u002fref\u003e He notably mentioned risks of an [[AI takeover]],\u003cref\u003e{{Cite news |last=Pittis |first=Don |date=May 4, 2023 |title=Canadian artificial intelligence leader Geoffrey Hinton piles on fears of computer takeover |url=https:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |work=CBC |access-date=5 October 2024 |archive-date=7 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240707032135\u002fhttps:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |url-status=live }}\u003c\u002fref\u003e and stressed that in order to avoid the worst outcomes, establishing safety guidelines will require coopera t outcomes, establishing safety guidelines will require cooperation among those competing in use of AI.\u003cref\u003e{{Cite web |date=2024-06-14 |title='50\u201350 chance' that AI outsmarts humanity, Geoffrey Hinton says |url=https:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |access-date=2024-07-06 |website=Bloomberg BNN |archive-date=14 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240614144506\u002fhttps:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2023, many leading AI experts endorsed [[Statement on AI risk of extinction|the joint statement]] that \"Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war\".{{Sfnp|Valance|2023}}\u003cbr\u003e ","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -455,10 +455,11 @@\u003cbr\u003e Deep learning's success was based on both hardware improvements ([[Moore's law|faster computers]],\u003cref\u003e[[Moore's Law]] and AI: {{Harvtxt|Russell|Norvig|2021|pp=14, 27}}\u003c\u002fref\u003e [[graphics processing unit]]s, [[cloud computing]]{{Sfnp|Clark|2015b}}) and access to [[big data|large amounts of data]]\u003cref\u003e[[Big data]]: {{Harvtxt|Russell|Norvig|2021|p=26}}\u003c\u002fref\u003e (including curated datasets,{{Sfnp|Clark|2015b}} such as [[ImageNet]]). Deep learning's success led to an enormous increase in interest and funding in AI.{{Efn|Jack Clark wrote in [[Bloomberg News|Bloomberg]]: \"After a half-decade of quiet breakthroughs in artificial intelligence, 2015 has been a landmark year. Computers are smarter and learning faster than ever\", and noted that the number of software projects that use machine learning at [[Google]] increased from a \"sporadic usage\" in 2012 to more than 2,700 projects in 2015.{{Sfnp|Clark|2015b}}}} The amount of machine learning research (measured by total publications) increased by 50% in the years 2015\u20132019.{{Sfnp|UNESCO|2021}}\u003cbr\u003e \u003cbr\u003e \u003c!-- ALIGNMENT PROBLEM --\u003e\u003cbr\u003e+[[File:20250202 \"AI\" (search term) on Google Trends.svg|thumb|The number of the public's Google searches for the term \"AI\" began to accelerate in 2022.]]\u003cbr\u003e In 2016, issues of [[algorithmic fairness|fairness]] and the misuse of technology were catapulted into center stage at machine learning conferences, publications vastly increased, funding became available, and many researchers re-focussed their careers on these issues. The [[AI alignment|alignment problem]] became a serious field of academic study.{{Sfnp|Christian|2020|pp=67, 73}}\u003cbr\u003e \u003cbr\u003e \u003c!-- AI Boom 2020-present --\u003e\u003cbr\u003e-In the late teens and early 2020s, [[artificial general intelligence|AGI]] companies began to deliver programs that created enormous interest. In 2015, [[AlphaGo]], developed by [[DeepMind]], beat the world champion [[Go player]]. The program taught only the game's rules and developed a strategy by itself. [[GPT-3]] is a [[large language model]] that was released in 2020 by [[OpenAI]] and is capable of generating high-quality human-like text.\u003cref\u003e{{Cite web |last=Sagar |first=Ram |date=2020-06-03 |title=OpenAI Releases GPT-3, The Largest Model So Far |url=https:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200804173452\u002fhttps:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |archive-date=2020-08-04 |access-date=2023-03-15 |website=Analytics India Magazine}}\u003c\u002fref\u003e [[ChatGPT]], launched on November 30, 2022, became the fastest-growing consumer software application in history, gaining over 100 million users in two months.\u003cref\u003e{{Cite news |last
