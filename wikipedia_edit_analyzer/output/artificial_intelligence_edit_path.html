oi=10.1080\u002f19361610.2024.2331885 |issn=1936-1610}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Razi |first1=Afsaneh |last2=Kim |first2=Seunghyun |last3=Alsoubai |first3=Ashwaq |last4=Stringhini |first4=Gianluca |last5=Solorio |first5=Thamar |last6=De Choudhury |first6=Munmun |last7=Wisniewski |first7=Pamela J. |date=2021-10-13 |title=A Human-Centered Systematic Literature Review of the Computational Approaches for Online Sexual Risk Detection |url=https:\u002f\u002fdl.acm.org\u002fdoi\u002f10.1145\u002f3479609 |journal=Proceedings of the ACM on Human-Computer Interaction |language=en |volume=5 |issue=CSCW2 |pages=1\u201338 |doi=10.1145\u002f3479609 |issn=2573-0142}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Games ===\u003cbr\u003e {{Main|Game artificial intelligence}}\u003cbr\u003e@@ -211,40 +217,36 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques.\u003cref\u003e{{Cite magazine |last1=Grant |first1=Eugene F. |last2=Lardner |first2=Rex |date=1952-07-25 |title=The Talk of the Town \u2013 It |url=https:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |access-date=2024-01-28 |magazine=The New Yorker |issn=0028-792X |archive-date=16 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200216034025\u002fhttps:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |url-status=live }}\u003c\u002fref\u003e [[IBM Deep Blue|Deep Blue]] became the first computer chess-playing system to beat a reigning world chess champion, [[Garry Kasparov]], on 11 May 1997.\u003cref\u003e{{Cite web |last=Anderson |first=Mark Robert |date=2017-05-11 |title=Twenty years on from Deep Blue vs Kasparov: how a chess match started the big data revolution |url=http:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |access-date=2024-01-28 |website=The Conversation |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917000827\u002fhttps:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |url-status=live }}\u003c\u002fref\u003e In 2011, in a ''[[Jeopardy!]]'' [[quiz show]] exhibition match, [[IBM]]'s [[question answering system]], [[Watson (artificial intelligence software)|Watson]], defeated the two greatest ''Jeopardy!'' champions, [[Brad Rutter]] and [[Ken Jennings]], by a significant margin.\u003cref\u003e{{Cite news |last=Markoff |first=John |date=2011-02-16 |title=Computer Wins on 'Jeopardy!': Trivial, It's Not |url=https:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-access=subscription |access-date=2024-01-28 |work=The New York Times |issn=0362-4331 |archive-date=22 October 2014 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592 |last1=Wu |first1=Zhengxuan |last2=Arora |first2=Aryaman |last3=Wang |first3=Zheng |last4=Geiger |first4=Atticus |last5=Jurafsky |first5=Dan |last6=Manning |first6=Christopher D. |last7=Potts |first7=Christopher }}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e The [[Alibaba Group]] developed a version of its ''[[Qwen]]'' models called ''Qwen2-Math'', that achieved state-of-the-art performance on several mathematical benchmarks, including 84% accuracy on the MATH dataset of competition mathematics problems.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-When natural language is used to describe mathematical problems, converters can transform such prompts into a formal language such as [[Lean (proof assistant)|Lean]] to define mathematical tasks.\u003cbr\u003e-\u003cbr\u003e-Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003e{{Cite web |last=McFarland |first=Alex |date=2024-07-12 |title=8 Best AI for Math Tools (January 2025) |url=https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |access-date=2025-01-26 |website=Unite.AI |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[Topological deep learning]] integrates various [[topology|topological]] approaches.\u003cbr\u003e+In mathematics, special forms of formal step-by-step [[Automatic reasoning|reasoning]] are used.\u003cref\u003e{{cite arXiv | eprint=2305.20050v1 | last1=Lightman | first1=Hunter | last2=Kosaraju | first2=Vineet | last3=Burda | first3=Yura | last4=Edwards | first4=Harri | last5=Baker | first5=Bowen | last6=Lee | first6=Teddy | last7=Leike | first7=Jan | last8=Schulman | first8=John | last9=Sutskever | first9=Ilya | last10=Cobbe | first10=Karl | title=Let's Verify Step by Step | date=2023 | class=cs.LG }}\u003c\u002fref\u003e In contrast, LLMs such as ''[[GPT-4]] Turbo'', ''[[Gemini (chatbot)|Gemini Ultra]]'', ''[[Claude (language model)|Claude Opus]]'', ''[[Llama (language model)|LLaMa-2]]'' or ''[[Mistral AI|Mistral Large]]'' are working with probabilistic models, which can produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. Therefore, they need not only a large database of mathematical problems to learn from but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003eUesato, J. et al.: [https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f ''Improving mathematical reasoning with process supervision.''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240915161758\u002fhttps:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |date=15 September 2024 }} openai.com, May 31, 2023. Retrieved 2024-08-07.\u003c\u002fref\u003e A 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''Alpha Tensor'', ''Alpha Geometry'' and ''Alpha Proof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from eleuther\u003cref\u003e[https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f ''LLEMMA''.] eleuther.ai. Retrieved 2024-08-07.\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e[https:\u002f\u002fjulius.ai\u002fhome\u002fai-math AI Math.] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165649\u002fhttps:\u002f\u002fjulius.ai\u002fhome\u002fai-math |date=5 October 2024 }} Caesars Labs, 2024. Retrieved 2024-08-07.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+When natural language is used to describe mathematical problems, converters transform such prompts into a formal language such as [[Lean (proof assistant)|Lean]] to define mathematical tasks.\u003cbr\u003e+\u003cbr\u003e+Some models have been developed to solve challenging problems and reach good results in benchmark tests, others to serve as educational tools in mathematics.\u003cref\u003eAlex McFarland: [https:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f ''7 Best AI for Math Tools.''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125615\u002fhttps:\u002f\u002fwww.unite.ai\u002fbest-ai-for-math-tools\u002f |date=11 September 2024 }} unite.ai. Retrieved 2024-08-07\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Finance ===\u003cbr\u003e Finance is one of the fastest growing sectors where applied AI tools are being deployed: from retail online banking to investment advice and insurance, where automated \"robot advisers\" have been in use for some years.\u003cref\u003eMatthew Finio & Amanda Downie: IBM Think 2024 Primer, \"What is Artificial Intelligence (AI) in Finance?\" 8 Dec. 2023\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-According to Nicolas Firzli, director of the [[World Pensions & Investments Forum]], it may be too early to see the emergence of highly innovative AI-informed financial products and services. He argues that \"the deployment of AI tools will simply further automatise things: destroying tens of thousands of jobs in banking, financial planning, and pension advice in the process, but I'm not sure it will unleash a new wave of [e.g., sophisticated] pension innovation.\"\u003cref\u003eM. Nicolas, J. Firzli: Pensions Age \u002f European Pensions magazine, \"Artificial Intelligence: Ask the Industry\", May\u2013June 2024. https:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125502\u002fhttps:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f |date=11 September 2024}}.\u003c\u002fref\u003e\u003cbr\u003e+[[World Pensions & Investments Forum|World Pensions]] experts like Nicolas Firzli insist it may be too early to see the emergence of highly innovative AI-informed financial products and services: \"the deployment of AI tools will simply further automatise things: destroying tens of thousands of jobs in banking, financial planning, and pension advice in the process, but I'm not sure it will unleash a new wave of [e.g., sophisticated] pension innovation.\"\u003cref\u003eM. Nicolas, J. Firzli: Pensions Age\u002fEuropean Pensions magazine, \"Artificial Intelligence: Ask the Industry\" May June 2024 https:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125502\u002fhttps:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f |date=11 September 2024 }}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Military ===\u003cbr\u003e {{main|Military applications of artificial intelligence}}\u003cbr\u003e \u003cbr\u003e-Various countries are deploying AI military applications.\u003cref name=\"CRS-2019\"\u003e{{Cite book|last=Congressional Research Service|url=https:\u002f\u002ffas.org\u002fsgp\u002fcrs\u002fnatsec\u002fR45178.pdf|title=Artificial Intelligence and National Security|publisher=Congressional Research Service|year=2019|location=Washington, DC|archive-date=8 May 2020|access-date=25 February 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508062631\u002fhttps:\u002f\u002ffas.org\u002fsgp\u002fcrs\u002fnatsec\u002fR45178.pdf|url-status=live}}[[Template:PD-notice|PD-notice]]\u003c\u002fref\u003e The main applications enhance [[command and control]], communications, sensors, integration and interoperability.\u003cref name=\"Slyusar-2019\"\u003e{{cite report |type=Preprint |last1=Slyusar |first1=Vadym |title=Artificial intelligence as the basis of future control networks |date=2019 |doi=10.13140\u002fRG.2.2.30247.50087 }}\u003c\u002fref\u003e Research is targeting intelligence collection and analysis, logistics, cyber operations, information operations, and semiautonomous and [[Vehicular automation|autonomous vehicles]].\u003cref name=\"CRS-2019\" \u002f\u003e AI technologies enable coordination of sensors and effectors, threat detection and identification, marking of enemy positions, [[target acquisition]], coordination and deconfliction of distributed [[Forward observers in the U.S. military|Joint Fires]] between networked combat vehicles, both human operated and [[Vehicular automation|autonomous]].\u003cref name=\"Slyusar-2019\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-AI has been used in military operations in Iraq, Syria, Israel and Ukraine.\u003cref name=\"CRS-2019\" \u002f\u003e\u003cref\u003e{{Cite web |last=Iraqi |first=Amjad |date=2024-04-03 |title='Lavender': The AI machine directing Israel's bombing spree in Gaza |url=https:\u002f\u002fwww.972mag.com\u002flavender-ai-israeli-army-gaza\u002f |access-date=2024-04-06 |website=+972 Magazine |language=en-US |archive-date=10 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241010022042\u002fhttps:\u002f\u002fwww.972mag.com\u002flavender-ai-israeli-army-gaza\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Davies-2023\"\u003e{{Cite news |last1=Davies |first1=Harry |last2=McKernan |first2=Bethan |last3=Sabbagh |first3=Dan |date=2023-12-01 |title='The Gospel': how Israel uses AI to select bombing targets in Gaza |language=en-GB |work=The Guardian |url=https:\u002f\u002fwww.theguardian.com\u002fworld\u002f2023\u002fdec\u002f01\u002fthe-gospel-how-israel-uses-ai-to-select-bombing-targets |access-date=2023-12-04 |archive-date=6 December 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231206213901\u002fhttps:\u002f\u002fwww.theguardian.com\u002fworld\u002f2023\u002fdec\u002f01\u002fthe-gospel-how-israel-uses-ai-to-select-bombing-targets |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite news|last=Marti|first=J Werner|title=Drohnen haben den Krieg in der Ukraine revolutioniert, doch sie sind empfindlich auf St\u00f6rsender \u2013 deshalb sollen sie jetzt autonom operieren|url=https:\u002f\u002fwww.nzz.ch\u002finternational\u002fdie-ukraine-setzt-auf-drohnen-die-autonom-navigieren-und-toeten-koennen-ld.1838731|date=10 August 2024|access-date=10 August 2024|newspaper=Neue Z\u00fcrcher Zeitung|language=German|archive-date=10 August 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240810054043\u002fhttps:\u002f\u002fwww.nzz.ch\u002finternational\u002fdie-ukraine-setzt-auf-drohnen-die-autonom-navigieren-und-toeten-koennen-ld.1838731|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+Various countries are deploying AI military applications.\u003cref name=\"CRS-2019\"\u003e{{Cite book|last=Congressional Research Service|url=https:\u002f\u002ffas.org\u002fsgp\u002fcrs\u002fnatsec\u002fR45178.pdf|title=Artificial Intelligence and National Security|publisher=Congressional Research Service|year=2019|location=Washington, DC}}[[Template:PD-notice|PD-notice]]\u003c\u002fref\u003e The main applications enhance [[command and control]], communications, sensors, integration and interoperability.\u003cref name=\"Slyusar-2019\"\u003e{{cite report |type=Preprint |last1=Slyusar |first1=Vadym |title=Artificial intelligence as the basis of future control networks |date=2019 |doi=10.13140\u002fRG.2.2.30247.50087 }}\u003c\u002fref\u003e Research is targeting intelligence collection and analysis, logistics, cyber operations, information operations, and semiautonomous and [[Vehicular automation|autonomous vehicles]].\u003cref name=\"CRS-2019\" \u002f\u003e AI technologies enable coordination of sensors and effectors, threat detection and identification, marking of enemy positions, [[target acquisition]], coordination and deconfliction of distributed [[Forward observers in the U.S. military|Joint Fires]] between networked combat vehicles involving manned and unmanned teams.\u003cref name=\"Slyusar-2019\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+AI has been used in military operations in Iraq, Syria, Israel and Ukraine.\u003cref name=\"CRS-2019\" \u002f\u003e\u003cref\u003e{{Cite web |last=Iraqi |first=Amjad |date=2024-04-03 |title='Lavender': The AI machine directing Israel's bombing spree in Gaza |url=https:\u002f\u002fwww.972mag.com\u002flavender-ai-israeli-army-gaza\u002f |access-date=2024-04-06 |website=+972 Magazine |language=en-US}}\u003c\u002fref\u003e\u003cref name=\"Davies-2023\"\u003e{{Cite news |last1=Davies |first1=Harry |last2=McKernan |first2=Bethan |last3=Sabbagh |first3=Dan |date=2023-12-01 |title='The Gospel': how Israel uses AI to select bombing targets in Gaza |language=en-GB |work=The Guardian |url=https:\u002f\u002fwww.theguardian.com\u002fworld\u002f2023\u002fdec\u002f01\u002fthe-gospel-how-israel-uses-ai-to-select-bombing-targets |access-date=2023-12-04 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite news|last=Marti|first=J Werner|title=Drohnen haben den Krieg in der Ukraine revolutioniert, doch sie sind empfindlich auf St\u00f6rsender \u2013 deshalb sollen sie jetzt autonom operieren|url=https:\u002f\u002fwww.nzz.ch\u002finternational\u002fdie-ukraine-setzt-auf-drohnen-die-autonom-navigieren-und-toeten-koennen-ld.1838731|date=10 August 2024|access-date=10 August 2024|newspaper=Neue Z\u00fcrcher Zeitung|lang=German}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Generative AI ===\u003cbr\u003e-[[File:Vincent van Gogh in watercolour.png|thumb|[[Vincent van Gogh]] in watercolour created by generative AI software]]{{Excerpt|Generative artificial intelligence|only=paragraphs|paragraphs=1-3}}\u003cbr\u003e+{{Main|Generative artificial intelligence}}\u003cbr\u003e+[[File:Vincent van Gogh in watercolour.png|thumb|[[Vincent van Gogh]] in watercolour created by generative AI software]]\u003cbr\u003e+In the early 2020s, [[generative AI]] gained widespread prominence. GenAI is AI capable of generating text, images, videos, or other data using [[generative model]]s,\u003cref\u003e{{Cite web |last1=Newsom, Gavin |last2=Weber, Shirley N. |date=September 6, 2023 |title=Executive Order N-12-23 |url=https:\u002f\u002fwww.gov.ca.gov\u002fwp-content\u002fuploads\u002f2023\u002f09\u002fAI-EO-No.12-_-GGN-Signed.pdf |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240221222035\u002fhttps:\u002f\u002fwww.gov.ca.gov\u002fwp-content\u002fuploads\u002f2023\u002f09\u002fAI-EO-No.12-_-GGN-Signed.pdf |archive-date=February 21, 2024 |access-date=September 7, 2023 |publisher=Executive Department, State of California}}\u003c\u002fref\u003e\u003cref\u003e{{Cite arXiv |eprint=2307.15208 |class=eess.IV |first1=Walter H. L. |last1=Pinaya |first2=Mark S. |last2=Graham |title=Generative AI for Medical Imaging: extending the MONAI Framework |date=2023 |last3=Kerfoot |first3=Eric |last4=Tudosiu |first4=Petru-Daniel |last5=Dafflon |first5=Jessica |last6=Fernandez |first6=Virginia |last7=Sanchez |first7=Pedro |last8=Wolleb |first8=Julia |last9=da Costa |first9=Pedro F. |last10=Patel |first10=Ashay}}\u003c\u002fref\u003e often in response to [[Prompt (natural language)|prompts]].\u003cref\u003e{{Cite web |last1=Griffith |first1=Erin |last2=Metz |first2=Cade |date=2023-01-27 |title=Anthropic Said to Be Closing In on $300 Million in New A.I. Funding |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f01\u002f27\u002ftechnology\u002fanthropic-ai-funding.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231209074235\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f01\u002f27\u002ftechnology\u002fanthropic-ai-funding.html |archive-date=December 9, 2023 |access-date=2023-03-14 |website=[[The New York Times]]}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |last1=Lanxon |first1=Nate |last2=Bass |first2=Dina |last3=Davalos |first3=Jackie |date=March 10, 2023 |title=A Cheat Sheet to AI Buzzwords and Their Meanings |url=https:\u002f\u002fnews.bloomberglaw.com\u002ftech-and-telecom-law\u002fa-cheat-sheet-to-ai-buzzwords-and-their-meanings-quicktake |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231117140835\u002fhttps:\u002f\u002fnews.bloomberglaw.com\u002ftech-and-telecom-law\u002fa-cheat-sheet-to-ai-buzzwords-and-their-meanings-quicktake |archive-date=November 17, 2023 |access-date=March 14, 2023 |work=Bloomberg News}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In March 2023, 58% of U.S. adults had heard about [[ChatGPT]] and 14% had tried it.\u003cref\u003e{{Cite web |last=Marcelline |first=Marco |date=May 27, 2023 |title=ChatGPT: Most Americans Know About It, But Few Actually Use the AI Chatbot |url=https:\u002f\u002fwww.pcmag.com\u002fnews\u002ffew-americans-have-actually-tried-chatgpt-despite-most-knowing-about-it |access-date=2024-01-28 |website=PCMag |archive-date=21 May 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240521070709\u002fhttps:\u002f\u002fwww.pcmag.com\u002fnews\u002ffew-americans-have-actually-tried-chatgpt-despite-most-knowing-about-it |url-status=live }}\u003c\u002fref\u003e The increasing realism and ease-of-use of AI-based [[text-to-image]] generators such as [[Midjourney]], [[DALL-E]], and [[Stable Diffusion]] sparked a trend of [[Viral phenomenon|viral]] AI-generated photos. Widespread attention was gained by a fake photo of [[Pope Francis]] wearing a white puffer coat, the fictional arrest of [[Donald Trump]], and a hoax of an attack on the [[The Pentagon|Pentagon]], as well as the usage in professional creative arts.\u003cref\u003e{{Cite news |last=Lu |first=Donna |date=2023-03-31 |title=Misinformation, mistakes and the Pope in a puffer: what rapidly evolving AI can \u2013 and can't \u2013 do |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002fapr\u002f01\u002fmisinformation-mistakes-and-the-pope-in-a-puffer-what-rapidly-evolving-ai-can-and-cant-do |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=10 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240610171215\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002fapr\u002f01\u002fmisinformation-mistakes-and-the-pope-in-a-puffer-what-rapidly-evolving-ai-can-and-cant-do |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Hurst |first=Luke |date=2023-05-23 |title=How a fake image of a Pentagon explosion shared on Twitter caused a real dip on Wall Street |url=https:\u002f\u002fwww.euronews.com\u002fnext\u002f2023\u002f05\u002f23\u002ffake-news-about-an-explosion-at-the-pentagon-spreads-on-verified-accounts-on-twitter |access-date=2024-01-28 |website=euronews}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Agents===\u003cbr\u003e Artificial intelligent (AI) agents are software entities designed to perceive their environment, make decisions, and take actions autonomously to achieve specific goals. These agents can interact with users, their environment, or other agents. AI agents are used in various applications, including [[virtual assistant]]s, [[chatbots]], [[autonomous vehicles]], [[Video game console|game-playing systems]], and [[industrial robotics]]. AI agents operate within the constraints of their programming, available computational resources, and hardware limitations. This means they are restricted to performing tasks within their defined scope and have finite memory and processing capabilities. In real-world applications, AI agents often face time constraints for decision-making and action execution. Many AI agents incorporate learning algorithms, enabling them to improve their performance over time through experience or training. Using machine learning, AI agents can adapt to new situations and optimise their behaviour for their designated tasks.\u003cref\u003e{{Cite book |last1=Poole |first1=David |url=https:\u002f\u002fdoi.org\u002f10.1017\u002f9781009258227 |title=Artificial Intelligence, Foundations of Computational Agents |last2=Mackworth |first2=Alan |date=2023 |publisher=Cambridge University Press |isbn=978-1-0092-5819-7 |edition=3rd |doi=10.1017\u002f9781009258227 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165650\u002fhttps:\u002f\u002fwww.cambridge.org\u002fhighereducation\u002fbooks\u002fartificial-intelligence\u002fC113F6CE284AB00F5489EBA5A59B93B7#overview |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last1=Russell |first1=Stuart |title=[[Artificial Intelligence: A Modern Approach]] |last2=Norvig |first2=Peter |publisher=Pearson |date=2020 |isbn=978-0-1346-1099-3 |edition=4th}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |date=2024-07-24 |title=Why agents are the next frontier of generative AI |url=https:\u002f\u002fwww.mckinsey.com\u002fcapabilities\u002fmckinsey-digital\u002four-insights\u002fwhy-agents-are-the-next-frontier-of-generative-ai |access-date=2024-08-10 |website=McKinsey Digital |archive-date=3 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241003212335\u002fhttps:\u002f\u002fwww.mckinsey.com\u002fcapabilities\u002fmckinsey-digital\u002four-insights\u002fwhy-agents-are-the-next-frontier-of-generative-ai |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Sexuality ===\u003cbr\u003e-\u003cbr\u003e-Applications of AI in this domain include AI-enabled menstruation and fertility trackers that analyze user data to offer prediction,\u003cref\u003e{{Cite journal |last1=Figueiredo |first1=Mayara Costa |last2=Ankrah |first2=Elizabeth |last3=Powell |first3=Jacquelyn E. |last4=Epstein |first4=Daniel A. |last5=Chen |first5=Yunan |date=2024-01-12 |title=Powered by AI: Examining How AI Descriptions Influence Perceptions of Fertility Tracking Applications |url=https:\u002f\u002fdl.acm.org\u002fdoi\u002f10.1145\u002f3631414 |journal=Proc. ACM Interact. Mob. Wearable Ubiquitous Technol. |volume=7 |issue=4 |pages=154:1\u2013154:24 |doi=10.1145\u002f3631414}}\u003c\u002fref\u003e AI-integrated sex toys (e.g., [[teledildonics]]),\u003cref\u003e{{Cite journal |last1=Power |first1=Jennifer |last2=Pym |first2=Tinonee |last3=James
