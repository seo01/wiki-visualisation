ly on the timelelss human tendency to [[anthropomorphise]].\" (p. 29.)\u003cbr\u003e+* Vincent, James, \"Horny Robot Baby Voice: James Vincent on AI chatbots\", ''[[London Review of Books]]'', vol. 46, no. 19 (10 October 2024), pp.&nbsp;29\u201332. \"[AI chatbot] programs are made possible by new technologies but rely on the timelelss human tendency to [[anthropomorphise]].\" (p.&nbsp;29.)\u003cbr\u003e * {{Cite book |url=https:\u002f\u002fec.europa.eu\u002finfo\u002fsites\u002finfo\u002ffiles\u002fcommission-white-paper-artificial-intelligence-feb2020_en.pdf |title=White Paper: On Artificial Intelligence \u2013 A European approach to excellence and trust |publisher=European Commission |date=2020 |location=Brussels |ref={{Harvid|European Commission|2020}} |access-date=20 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200220173419\u002fhttps:\u002f\u002fec.europa.eu\u002finfo\u002fsites\u002finfo\u002ffiles\u002fcommission-white-paper-artificial-intelligence-feb2020_en.pdf |archive-date=20 February 2020 |url-status=live }}\u003cbr\u003e {{Refend}}\u003cbr\u003e ","--- Revision 13\u003cbr\u003e+++ Revision 14\u003cbr\u003e@@ -211,7 +211,7 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques.\u003cref\u003e{{Cite magazine |last1=Grant |first1=Eugene F. |last2=Lardner |first2=Rex |date=1952-07-25 |title=The Talk of the Town \u2013 It |url=https:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |access-date=2024-01-28 |magazine=The New Yorker |issn=0028-792X |archive-date=16 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200216034025\u002fhttps:\u002f\u002fwww.newyorker.com\u002fmagazine\u002f1952\u002f08\u002f02\u002fit |url-status=live }}\u003c\u002fref\u003e [[IBM Deep Blue|Deep Blue]] became the first computer chess-playing system to beat a reigning world chess champion, [[Garry Kasparov]], on 11 May 1997.\u003cref\u003e{{Cite web |last=Anderson |first=Mark Robert |date=2017-05-11 |title=Twenty years on from Deep Blue vs Kasparov: how a chess match started the big data revolution |url=http:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |access-date=2024-01-28 |website=The Conversation |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917000827\u002fhttps:\u002f\u002ftheconversation.com\u002ftwenty-years-on-from-deep-blue-vs-kasparov-how-a-chess-match-started-the-big-data-revolution-76882 |url-status=live }}\u003c\u002fref\u003e In 2011, in a ''[[Jeopardy!]]'' [[quiz show]] exhibition match, [[IBM]]'s [[question answering system]], [[Watson (artificial intelligence software)|Watson]], defeated the two greatest ''Jeopardy!'' champions, [[Brad Rutter]] and [[Ken Jennings]], by a significant margin.\u003cref\u003e{{Cite news |last=Markoff |first=John |date=2011-02-16 |title=Computer Wins on 'Jeopardy!': Trivial, It's Not |url=https:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-access=subscription |access-date=2024-01-28 |work=The New York Times |issn=0362-4331 |archive-date=22 October 2014 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]] or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique rStar-Math that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like [[Qwen|Qwen-7B]] to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003eZhengxuan Wu et al.: [https:\u002f\u002farxiv.org\u002fabs\u002f2404.03592 ''ReFT: Representation Finetuning for Language Models''.] arXiv:2404.03592. Retrieved 2025-02-16\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e [[Alibaba]] developed a version of its Qwen-models called ''Qwen2-Math'' that represented progress in solving mathematics problems in 2024.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''[[Qwen|Qwen-7B]]'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 14\u003cbr\u003e+++ Revision 15\u003cbr\u003e@@ -211,7 +211,7 @@\u003cbr\u003e [[Game AI|Game playing]] programs have been used since the 1950s to demonstrate and test AI's most advanced techniques. 002f\u002fweb.archive.org\u002fweb\u002f20141022023202\u002fhttp:\u002f\u002fwww.nytimes.com\u002f2011\u002f02\u002f17\u002fscience\u002f17jeopardy-watson.html |url-status=live }}\u003c\u002fref\u003e In March 2016, [[AlphaGo]] won 4 out of 5 games of [[Go (game)|Go]] in a match with Go champion [[Lee Sedol]], becoming the first [[computer Go]]-playing system to beat a professional Go player without [[Go handicaps|handicaps]]. Then, in 2017, it [[AlphaGo versus Ke Jie|defeated Ke Jie]], who was the best Go player in the world.\u003cref\u003e{{Cite web |last=Byford |first=Sam |date=2017-05-27 |title=AlphaGo retires from competitive Go after defeating world number one 3\u20130 |url=https:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |access-date=2024-01-28 |website=The Verge |archive-date=7 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170607184301\u002fhttps:\u002f\u002fwww.theverge.com\u002f2017\u002f5\u002f27\u002f15704088\u002falphago-ke-jie-game-3-result-retires-future |url-status=live }}\u003c\u002fref\u003e Other programs handle [[Imperfect information|imperfect-information]] games, such as the [[poker]]-playing program [[Pluribus (poker bot)|Pluribus]].\u003cref\u003e{{Cite journal |last1=Brown |first1=Noam |last2=Sandholm |first2=Tuomas |date=2019-08-30 |title=Superhuman AI for multiplayer poker |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay2400 |journal=Science |volume=365 |issue=6456 |pages=885\u2013890 |bibcode=2019Sci...365..885B |doi=10.1126\u002fscience.aay2400 |issn=0036-8075 |pmid=31296650}}\u003c\u002fref\u003e [[DeepMind]] developed increasingly generalistic [[reinforcement learning]] models, such as with [[MuZero]], which could be trained to play chess, Go, or [[Atari]] games.\u003cref\u003e{{Cite web |date=2020-12-23 |title=MuZero: Mastering Go, chess, shogi and Atari without rules |url=https:\u002f\u002fdeepmind.google\u002fdiscover\u002fblog\u002fmuzero-mastering-go-chess-shogi-and-atari-without-rules |access-date=2024-01-28 |website=Google DeepMind}}\u003c\u002fref\u003e In 2019, DeepMind's AlphaStar achieved grandmaster level in [[StarCraft II]], a particularly challenging real-time strategy game that involves incomplete knowledge of what happens on the map.\u003cref\u003e{{Cite news |last=Sample |first=Ian |date=2019-10-30 |title=AI becomes grandmaster in 'fiendishly complex' StarCraft II |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003eZhengxuan Wu et al.: [https:\u002f\u002farxiv.org\u002fabs\u002f2404.03592 ''ReFT: Representation Finetuning for Language Models''.] arXiv:2404.03592. Retrieved 2025-02-16\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e [[Alibaba]] developed a version of its Qwen-models called ''Qwen2-Math'' that represented progress in solving mathematics problems in 2024.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''[[Qwen|Qwen-7B]]'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003eZhengxuan Wu et al.: [https:\u002f\u002farxiv.org\u002fabs\u002f2404.03592 ''ReFT: Representation Finetuning for Language Models''.] arXiv:2404.03592. Retrieved 2025-02-16\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |l fiendishly-complex-starcraft-ii |access-date=2024-01-28 |work=The Guardian |issn=0261-3077 |archive-date=29 December 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201229185547\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2019\u002foct\u002f30\u002fai-becomes-grandmaster-in-fiendishly-complex-starcraft-ii |url-status=live }}\u003c\u002fref\u003e In 2021, an AI agent competed in a PlayStation [[Gran Turismo (series)|Gran Turismo]] competition, winning against four of the world's best Gran Turismo drivers using deep reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003eZhengxuan Wu et al.: [https:\u002f\u002farxiv.org\u002fabs\u002f2404.03592 ''ReFT: Representation Finetuning for Language Models''.] arXiv:2404.03592. Retrieved 2025-02-16\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e The [[Alibaba Group]] developed a version of its Qwen-models called ''Qwen2-Math'' that represented progress in solving mathematics problems in 2024.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''[[Qwen|Qwen-7B]]'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592}}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e [[Alibaba]] developed a version of its ''[[Qwen]]'' models called ''Qwen2-Math'', that achieved state-of-the-art performance on several mathematical benchmarks, including 84% accuracy on the MATH dataset of competition mathematics problems.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |fir p reinforcement learning.\u003cref\u003e{{Cite journal |last1=Wurman |first1=P. R. |last2=Barrett |first2=S. |last3=Kawamoto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592}}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e [[Alibaba]] developed a version of its ''[[Qwen]]'' models called ''Qwen2-Math'', that achieved state-of-the-art performance on several mathematical benchmarks, including 84% accuracy on the MATH dataset of competition mathematics problems.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592}}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e The [[Alibaba Group]] developed a version of its ''[[Qwen]]'' models called ''Qwen2-Math'', that achieved state-of-the-art performance on several mathematical benchmarks, including 84% accuracy on the MATH dataset of competition mathematics problems.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 17\u003cbr\u003e+++ Revision 18\u003cbr\u003e@@ -162,7 +162,7 @@\u003cbr\u003e [[File:AI hierarchy.svg|thumb|upright]]\u003cbr\u003e [[Deep learning]]\u003cref name=\"Deep learning\"\u003e[[Deep learning]]: {{Harvtxt|Russell|Norvig|2021|loc=chpt. 21}}, {{Harvtxt|Goodfellow|Bengio|Courville|2016}}, {{Harvtxt|Hinton ''et al.''|2016}}, {{Harvtxt|Schmidhuber|2015}}\u003c\u002fref\u003e uses several layers of neurons between the network's inputs and outputs. The multiple layers can progressively extract higher-level features from the raw input. For example, in [[image processing]], lower layers may identify edges, while higher layers may identify the concepts relevant to a human such as digits, letters, or faces.{{Sfnp|Deng|Yu|2014|pp=199\u2013200}}\u003cbr\u003e \u003cbr\u003e-Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2023.{{Sfnp|Russell|Norvig|2021|p=751}} The sudden success of deep learning in 2012\u20132015 did not occur because of some new discovery or theoretical breakthrough (deep neural networks and backpropagation had been described by many people, as far back as the 1950s){{Efn|\u003cbr\u003e+Deep learning has profoundly improved the performance of programs in many important subfields of artificial intelligence, including [[computer vision]], [[speech recognition]], [[natural language processing]], [[image classification]],{{Sfnp|Ciresan|Meier|Schmidhuber|2012}} and others. The reason that deep learning performs so well in so many applications is not known as of 2021.{{Sfnp|Russell|Norvig|2021|p=750}} The s oto |first3=K. |date=2022 |title=Outracing champion Gran Turismo drivers with deep reinforcement learning |journal=Nature |volume=602 |issue=7896 |pages=223\u2013228 |bibcode=2022Natur.602..223W |doi=10.1038\u002fs41586-021-04357-7 |pmid=35140384|url=https:\u002f\u002fwww.researchsquare.com\u002farticle\u002frs-795954\u002flatest.pdf }}\u003c\u002fref\u003e In 2024, Google DeepMind introduced SIMA, a type of AI capable of autonomously playing nine previously unseen [[open-world]] video games by observing screen output, as well as executing short, specific tasks in response to natural language instructions.\u003cref\u003e{{Cite web |last=Wilkins |first=Alex |date=13 March 2024 |title=Google AI learns to play open-world video games by watching them |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them |access-date=2024-07-21 |website=New Scientist |archive-date=26 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240726182946\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2422101-google-ai-learns-to-play-open-world-video-games-by-watching-them\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592}}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision |url=https:\u002f\u002fopenai.com\u002findex\u002fimproving-mathematical-reasoning-with-process-supervision\u002f |access-date=2025-01-26 |website=OpenAI |language=en-US}}\u003c\u002fref\u003e A February 2024 study showed that the performance of some language models for reasoning capabilities in solving math problems not included in their training data was low, even for problems with only minor deviations from trained data.\u003cref\u003e{{Cite arXiv |eprint=2402.19450 |class=cs.AI |first=Saurabh |last=Srivastava |title=Functional Benchmarks for Robust Evaluation of Reasoning Performance, and the Reasoning Gap |date=2024-02-29}}\u003c\u002fref\u003e One technique to improve their performance involves training the models to produce correct [[Automated reasoning|reasoning]] steps, rather than just the correct result.\u003cref\u003e{{cite arXiv |eprint=2305.20050v1 |class=cs.LG |first1=Hunter |last1=Lightman |first2=Vineet |last2=Kosaraju |title=Let's Verify Step by Step |date=2023 |last3=Burda |first3=Yura |last4=Edwards |first4=Harri |last5=Baker |first5=Bowen |last6=Lee |first6=Teddy |last7=Leike |first7=Jan |last8=Schulman |first8=John |last9=Sutskever |first9=Ilya |last10=Cobbe |first10=Karl}}\u003c\u002fref\u003e The [[Alibaba Group]] developed a version of its ''[[Qwen]]'' models called ''Qwen2-Math'', that achieved state-of-the-art performance on several mathematical benchmarks, including 84% accuracy on the MATH dataset of competition mathematics problems.\u003cref name=\"VentureBeat 8 August 2024\"\u003e{{cite web |last1=Franzen |first1=Carl |title=Alibaba claims no. 1 spot in AI math models with Qwen2-Math |url=https:\u002f\u002fventurebeat.com\u002fai\u002falibaba-claims-no-1-spot-in-ai-math-models-with-qwen2-math\u002f |website=VentureBeat |date=2024-08-08|access-date=2025-02-16}}\u003c\u002fref\u003e In January 2025, Microsoft proposed the technique ''rStar-Math'' that leverages [[Monte Carlo tree search]] and step-by-step reasoning, enabling a relatively small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+Large language models, such as [[GPT-4]], [[Gemini (chatbot)|Gemini]], [[Claude (language model)|Claude]], [[Llama (language model)|LLaMa]] or [[Mistral AI|Mistral]], are increasingly used in mathematics. These probabilistic models are versatile, but can also produce wrong answers in the form of [[Hallucination (artificial intelligence)|hallucinations]]. They sometimes need a large database of mathematical problems to learn from, but also methods such as [[Supervised learning|supervised]] [[Fine-tuning (deep learning)|fine-tuning]]\u003cref\u003e{{Cite journal |date=2024 |title=ReFT: Representation Finetuning for Language Models |journal=NeurIPS |arxiv=2404.03592 |last1=Wu |first1=Zhengxuan |last2=Arora |first2=Aryaman |last3=Wang |first3=Zheng |last4=Geiger |first4=Atticus |last5=Jurafsky |first5=Dan |last6=Manning |first6=Christopher D. |last7=Potts |first7=Christopher }}\u003c\u002fref\u003e or trained [[Statistical classification|classifiers]] with human-annotated data to improve answers for new problems and learn from corrections.\u003cref\u003e{{Cite web |date=2023-05-31 |title=Improving mathematical reasoning with process supervision  small language model like ''Qwen-7B'' to solve 53% of the [[American Invitational Mathematics Examination|AIME]] 2024 and 90% of the MATH benchmark problems.\u003cref\u003e{{Cite web |last=Franzen |first=Carl |date=2025-01-09 |title=Microsoft's new rStar-Math technique upgrades small models to outperform OpenAI's o1-preview at math problems |url=https:\u002f\u002fventurebeat.com\u002fai\u002fmicrosofts-new-rstar-math-technique-upgrades-small-models-to-outperform-openais-o1-preview-at-math-problems\u002f |access-date=2025-01-26 |website=VentureBeat |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Alternatively, dedicated models for mathematical problem solving with higher precision for the outcome including proof of theorems have been developed such as ''AlphaTensor'', ''[[AlphaGeometry]]'' and ''AlphaProof'' all from [[Google DeepMind]],\u003cref\u003e{{Cite web |last=Roberts |first=Siobhan |date=July 25, 2024 |title=AI achieves silver-medal standard solving International Mathematical Olympiad problems |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |access-date=2024-08-07 |website=[[The New York Times]] |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926131402\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f07\u002f25\u002fscience\u002fai-math-alphaproof-deepmind.html |url-status=live }}\u003c\u002fref\u003e ''Llemma'' from [[EleutherAI]]\u003cref\u003e{{Cite web |last1=Azerbayev |first1=Zhangir |last2=Schoelkopf |first2=Hailey |last3=Paster |first3=Keiran |last4=Santos |first4=Marco Dos |last5=McAleer' |first5=Stephen |last6=Jiang |first6=Albert Q. |last7=Deng |first7=Jia |last8=Biderman |first8=Stella |last9=Welleck |first9=Sean |date=2023-10-16 |title=Llemma: An Open Language Model For Mathematics |url=https:\u002f\u002fblog.eleuther.ai\u002fllemma\u002f |access-date=2025-01-26 |website=EleutherAI Blog |language=en}}\u003c\u002fref\u003e or ''Julius''.\u003cref\u003e{{Cite web |title=Julius AI |url=https:\u002f\u002fjulius.ai\u002fhome\u002fai-math |access-date= |website=julius.ai |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -403,7 +403,7 @@\u003cbr\u003e \u003cbr\u003e Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal |last1=Floridi |first1=Luciano |last2=Cowls |first2=Josh |date=2019-06-23 |title=A Unified Framework of Five Principles for AI in Society |url=https:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |journal=Harvard Data Science Review |volume=1 |issue=1 |doi=10.1162\u002f99608f92.8cd550d1 |s2cid=198775713 |doi-access=free |archive-date=7 August 2019 |access-date=5 December 2023 |archive-url=https:\u002f\u002farchive.today\u002f20190807202909\u002fhttps:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |url-status=live }}\u003c\u002fref\u003e however, these principles do not go without their criticisms, especially regards to the people chosen contributes to these frameworks.\u003cref\u003e{{Cite journal |last1=Buruk |first1=Banu |last2=Ekmekci |first2=Perihan Elif |last3=Arda |first3=Berna |date=2020-09-01 |title=A critical perspective on guidelines for responsible and trustworthy artificial intelligence |url=https:\u002f\u002fdoi.org\u002f10.1007\u002fs11019-020-09948-1 |journal=Medicine, Health Care and Philosophy |volume=23 |issue=3 |pages=387\u2013399 |doi=10.1007\u002fs11019-020-09948-1 |issn=1572-8633 |pmid=32236794 |s2cid=214766800 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170206\u002fhttps:\u002f\u002flink.springer.com\u002farticle\u002f10.1007\u002fs11019-020-09948-1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Promotion of the wellbeing of the people and communities that these technologies affect requires consideration of the social and ethical implications at all stages of AI system design, development and implementation, and collaboration between job roles such as data scientists, product managers, data engineers, domain experts, and delivery managers.\u003cref\u003e{{Cite journal |last1=Kamila |first1=Manoj Kumar |last2=Jasrotia |first2=Sahil Singh |date=2023-01-01 |title=Ethical issues in the development of artificial intelligence: recognizing the risks |url=https:\u002f\u002fdoi.org\u002f10.1108\u002fIJOES-05-2023-0107 |journal=International Journal of Ethics and Systems |volume=ahead-of-print |issue=ahead-of-print |doi=10.1108\u002fIJOES-05-2023-0107 |issn=2514-9369 |s2cid=259614124 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.emerald.com\u002finsight\u002fcontent\u002fdoi\u002f10.1108\u002fIJOES-05-2023-0107\u002ffull\u002fhtml |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Promotion of the wellbeing of the people and communities that these technologies affect requires consideration of the social and ethical implications at all stages of AI system design, development and implementation, and collaboration between job roles such as data scientists, product managers, data engineers, domain experts, and delivery managers.\u003cref\u003e{{Cite journal |last1=Kamila |first1=Manoj Kumar |last2=Jasrotia |first2=Sahil Singh |date=2023-01-01 |title=Ethical issues in the development of artificial intelligence: recognizing the risks |url=https:\u002f\u002fdoi.org\u002f10.1108\u002fIJOES-05-2023-0107 |journal=International Journal of Ethics and Systems |pages=45\u201363 |volume=41 |issue=ahead-of-print |doi=10.1108\u002fIJOES-05-2023-0107 |issn=2514-9369 |s2cid=259614124 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.emerald.com\u002finsight\u002fcontent\u002fdoi\u002f10.1108\u002fIJOES-05-2023-0107\u002ffull\u002fhtml |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[AI Safety Institute (United Kingdom)|UK AI Safety Institute]] released in 2024 a testing toolset called 'Inspect' for AI safety evaluations available under a MIT open-source licence which is freely available on GitHub and can be improved with third-party packages. It can be used to evaluate AI models in a range of areas including core knowledge, ability to reason, and autonomous capabilities.\u003cref\u003e{{Cite web |date=10 May 2024 |title=AI Safety Institute releases new AI safety evaluations platform |url=https:\u002f\u002fwww.gov.uk\u002fgovernment\u002fnews\u002fai-safety-institute-releases-new-ai-safety-evaluations-platform |access-date=14 May 2024 |publisher=UK Government |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.gov.uk\u002fgovernment\u002fnews\u002fai-safety-institute-releases-new-ai-safety-evaluations-platform |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 19\u003cbr\u003e+++ Revision 20\u003cbr\u003e@@ -584,6 +584,7 @@\u003cbr\u003e * {{Annotated link|Mind uploading}}\u003cbr\u003e * [[Organoid intelligence]] \u2013 Use of brain cells and brain organoids for intelligent computing\u003cbr\u003e * {{Annotated link |Robotic process automation}}\u003cbr\u003e+* {{Annotated link |The Last Day}} - Welsh science novel by [[Owain Owain]]\u003cbr\u003e * {{Annotated link|Wetware computer}}\u003cbr\u003e \u003cbr\u003e == Explanatory notes ==","--- Revision 20\u003cbr\u003e+++ Revision 21\u003cbr\u003e@@ -584,7 +584,7 @@\u003cbr\u003e * {{Annotated link|Mind uploading}}\u003cbr\u003e * [[Organoid intelligence]] \u2013 Use of brain cells and brain organoids for intelligent computing\u003cbr\u003e * {{Annotated link |Robotic process automation}}\u003cbr\u003e-* {{Annotated link |The Last Day}} - Welsh science novel by [[Owain Owain]]\u003cbr\u003e+* {{Annotated link |The Last Day (novel)}} - Welsh science novel by [[Owain Owain]]\u003cbr\u003e * {{Annotated link|Wetware computer}}\u003cbr\u003e \u003cbr\u003e == Explanatory notes ==","--- Revision 21\u003cbr\u003e+++ Revision 22\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Artificial intelligence}}\u003c!-- portal --\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- DEFINITIONS --\u003e\u003cbr\u003e-'''Artificial intelligence''' ('''AI'''), in its broadest sense, is [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e+'''Artificial intelligence''' ('''AI''') refers to the capability of [[computer|computational systems]] to perform tasks typically associated with [[human intelligence]], such as learning, reasoning, problem-solving, perception, and decision-making. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -401,7 +401,7 @@\u003cbr\u003e * '''Care''' for the wellbeing of everyone\u003cbr\u003e * '''Protect''' social values, justice, and the public interest\u003cbr\u003e \u003cbr\u003e-Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal es involving manned and unmanned teams.\u003cref name=\"Slyusar-2019\" \u002f\u003e\u003cbr\u003e+Various countries are deploying AI military applications.\u003cref name=\"CRS-2019\"\u003e{{Cite book|last=Congressional Research Service|url=https:\u002f\u002ffas.org\u002fsgp\u002fcrs\u002fnatsec\u002fR45178.pdf|title=Artificial Intelligence and National Security|publisher=Congressional Research Service|year=2019|location=Washington, DC|archive-date=8 May 2020|access-date=25 February 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508062631\u002fhttps:\u002f\u002ffas.org\u002fsgp\u002fcrs\u002fnatsec\u002fR45178.pdf|url-status=live}}[[Template:PD-notice|PD-notice]]\u003c\u002fref\u003e The main applications enhance [[command and control]], communications, sensors, integration and interoperability.\u003cref name=\"Slyusar-2019\"\u003e{{cite report |type=Preprint |last1=Slyusar |first1=Vadym |title=Artificial intelligence as the basis of future control networks |date=2019 |doi=10.13140\u002fRG.2.2.30247.50087 }}\u003c\u002fref\u003e Research is targeting intelligence collection and analysis, logistics, cyber operations, information operations, and semiautonomous and [[Vehicular automation|autonomous vehicles]].\u003cref name=\"CRS-2019\" \u002f\u003e AI technologies enable coordination of sensors and effectors, threat detection and identification, marking of enemy positions, [[target acquisition]], coordination and deconfliction of distributed [[Forward observers in the U.S. military|Joint Fires]] between networked combat vehicles, both human operated and [[Vehicular automation|autonomous]].\u003cref name=\"Slyusar-2019\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e AI has been used in military operations in Iraq, Syria, Israel and Ukraine.\u003cref name=\"CRS-2019\" \u002f\u003e\u003cref\u003e{{Cite web |last=Iraqi |first=Amjad |date=2024-04-03 |title='Lavender': The AI machine directing Israel's bombing spree in Gaza |url=https:\u002f\u002fwww.972ma al research]] has the potential to increase patient care and quality of life.\u003cref\u003e{{Cite journal |last1=Davenport |first1=T |last2=Kalakota |first2=R |date=June 2019 |title=The potential for artificial intelligence in healthcare |journal=Future Healthc J. |volume=6 |issue=2 |pages=94\u201398 |doi=10.7861\u002ffuturehosp.6-2-94 |pmc=6616181 |pmid=31363513}}\u003c\u002fref\u003e Through the lens of the [[Hippocratic Oath]], medical professionals are ethically compelled to use AI, if applications can more accurately diagnose and treat patients.\u003cref\u003e{{Cite journal |last1=Lyakhova |first1=U.A. |last2=Lyakhov |first2=P.A. |date=2024 |title=Systematic review of approaches to detection and classification of skin cancer using artificial intelligence: Development and prospects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |journal=Computers in Biology and Medicine |language=en |volume=178 |pages=108742 |doi=10.1016\u002fj.compbiomed.2024.108742 |pmid=38875908 |archive-date=3 December 2024 |access-date=10 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241203172502\u002fhttps:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Alqudaihi |first1=Kawther S. |last2=Aslam |first2=Nida |last3=Khan |first3=Irfan Ullah |last4=Almuhaideb |first4=Abdullah M. |last5=Alsunaidi |first5=Shikah J. |last6=Ibrahim |first6=Nehad M. Abdel Rahman |last7=Alhaidari |first7=Fahd A. |last8=Shaikh |first8=Fatema S. |last9=Alsenbel |first9=Yasmine M. |last10=Alalharith |first10=Dima M. |last11=Alharthi |first11=Hajar M. |last12=Alghamdi |first12=Wejdan M. |last13=Alshahrani |first13=Mohammed S. |date=2021 |title=Cough Sound Detection and Diagnosis Using Artificial Intelligence Techniques: Challenges and Opportunities |journal=IEEE Access |volume=9 |pages=102327\u2013102344 |doi=10.1109\u002fACCESS.2021.3097559 |issn=2169-3536 |pmc=8545201 |pmid=34786317|bibcode=2021IEEEA...9j2327A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-For medical research, AI is an important tool for processing and integrating [[big data]]. This is particularly important for [[organoid]] and [[tissue engineering]] development which use [[microscopy]] imaging as a key technique in fabrication.\u003cref name=\"Bax-2023\"\u003e{{Cite journal |last1=Bax |first1=Monique |last2=Thorpe |first2=Jordan |last3=Romanov |first3=Valentin |date=December 2023 |title=The future of personalized cardiovascular medicine demands 3D and 4D printing, stem cells, and artificial intelligence |journal=Frontiers in Sensors |volume=4 |doi=10.3389\u002ffsens.2023.1294721 |issn=2673-5067 |doi-access=free}}\u003c\u002fref\u003e It has been suggested that AI can overcome discrepancies in funding allocated to different fields of research.\u003cref name=\"Bax-2023\"\u002f\u003e New AI tools can deepen the understanding of biomedically relevant pathways. For example, [[AlphaFold 2]] (2021) demonstrated the ability to approximate, in hours rather than months, the 3D [[Protein structure|structure of a protein]].\u003cref\u003e{{Cite journal |last1=Jumper |first1=J |last2=Evans |first2=R |last3=Pritzel |first3=A |date=2021 |title=Highly accurate protein structure prediction with AlphaFold |journal=Nature |volume=596 |issue=7873 |pages=583\u2013589 |bibcode=2021Natur.596..583J |doi=10.1038\u002fs41586-021-03819-2 |pmc=8371605 |pmid=34265844}}\u003c\u002fref\u003e In 2023, it was reported that AI-guided drug discovery helped find a class of antibiotics capable of killing two different types of drug-resistant bacteria.\u003cref\u003e{{Cite web |date=2023-12-20 |title=AI discovers new class of antibiotics to kill drug-resistant bacteria |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |access-date=5 October 2024 |archive-date=16 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240916014421\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |url-status=live }}\u003c\u002fref\u003e In 2024, researchers used machine learning to accelerate the search for [[Parkinson's disease]] drug treatments. Their aim was to identify compounds that block the clumping, or aggregation, of [[alpha-synuclein]] (the protein that characterises Parkinson's disease). They were able to speed up the initial screening process ten-fold and reduce the cost by a thousand-fold.\u003cref\u003e{{Cite web |date=2024-04-17 |title=AI speeds up drug design for Parkinson's ten-fold |url=https:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |publisher=Cambridge University |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165755\u002fhttps:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Horne |first1=Robert I. |last2=Andrzejewska |first2=Ewa A. |last3=Alam |first3=Parvez |last4=Brotzakis |first4=Z. Faidon |last5=Srivastava |first5=Ankit |last6=Aubert |first6=Alice |last7=Nowinska |first7=Magdalena |last8=Gregory |first8=Rebecca C. |last9=Staats |first9=Roxine |last10=Possenti |first10=Andrea |last11=Chia |first11=Sean |last12=Sormanni |first12=Pietro |last13=Ghetti |first13=Bernardino |last14=Caughey |first14=Byron |last15=Knowles |first15=Tuomas P. J. |last16=Vendruscolo |first16=Michele |date=2024-04-17 |title=Discovery of potent inhibitors of \u03b1-synuclein aggregation using structure-based iterative learning |journal=Nature Chemical Biology |publisher=Nature |volume=20 |issue=5 |pages=634\u2013645 |doi=10.1038\u002fs41589-024-01580-x |pmc=11062903 |pmid=38632492}}\u003c\u002fref\u003e\u003cbr\u003e+For medical research, AI is an important tool for processing and integrating [[big data]]. This is particularly important for [[organoid]] and [[tissue engineering]] development which use [[microscopy]] imaging as a key technique in fabrication.\u003cref name=\"Bax-2023\"\u003e{{Cite journal |last1=Bax |first1=Monique |last2=Thorpe |first2=Jordan |last3=Romanov |first3=Valentin |date=December 2023 |title=The future of personalized cardiovascular medicine demands 3D and 4D printing, stem cells, and artificial intelligence |journal=Frontiers in Sensors |volume=4 |doi=10.3389\u002ffsens.2023.1294721 |issn=2673-5067 |doi-access=free}}\u003c\u002fref\u003e It has been suggested that AI can overcome discrepancies in funding allocated to different fields of research.\u003cref name=\"Bax-2023\"\u002f\u003e\u003cref\u003e{{Cite journal |last=Dankwa-Mullan |first=Irene |date=2024 |title=Health Equity and Ethical Considerations in Using Artificial Intelligence in Public Health and Medicine |url=https:\u002f\u002fwww.cdc.gov\u002fpcd\u002fissues\u002f2024\u002f24_0245.htm |journal=Preventing Chronic Disease |language=en-us |volume=21 |doi=10.5888\u002fpcd21.240245 |issn=1545-1151}}\u003c\u002fref\u003e New AI tools can deepen the understanding of biomedically relevant pathways. For example, [[AlphaFold 2]] (2021) demonstrated the ability to approximate, in hours rather than months, the 3D [[Protein structure|structure of a protein]].\u003cref\u003e{{Cite journal |last1=Jumper |first1=J |last2=Evans |first2=R |last3=Pritzel |first3=A |date=2021 |title=Highly accurate protein structure prediction with AlphaFold |journal=Nature |volume=596 |issue=7873 |pages=583\u2013589 |bibcode=2021Natur.596..583J |doi=10.1038\u002fs41586-021-03819-2 |pmc=8371605 |pmid=34265844}}\u003c\u002fref\u003e In 2023, it was reported that AI-guided drug discovery helped find a class of antibiotics capable of killing two different types of drug-res atise things: destroying tens of thousands of jobs in banking, financial planning, and pension advice in the process, but I'm not sure it will unleash a new wave of [e.g., sophisticated] pension innovation.\"\u003cref\u003eM. Nicolas, J. Firzli: Pensions Age\u002fEuropean Pensions magazine, \"Artificial Intelligence: Ask the Industry\" May June 2024 https:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125502\u002fhttps:\u002f\u002fvideovoice.org\u002fai-in-finance-innovation-entrepreneurship-vs-over-regulation-with-the-eus-artificial-intelligence-act-wont-work-as-intended\u002f |date=11 September 2024 }}.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- GOALS AND TOOLS: SCOPE OF AI --\u003e\u003cbr\u003e-Various subfields of AI research are centered around particular goals and the use of particular tools. The traditional goals of AI research include [[automated reasoning|reasoning]], [[knowledge representation]], [[Automated planning and scheduling|planning]], [[machine learning|learning]], [[natural language processing]], perception, and support for [[robotics]].{{Efn|name=\"Problems of AI\"}} [[Artificial general intelligence|General intelligence]]\u2014the ability to complete any task performed by a human on an at least equal level\u2014is among the field's long-term goals.\u003cref name=\"Artificial general intelligence\"\u002f\u003e To reach these goals, AI researchers have adapted and integrated a wide range of techniques, including [[state space search|search]] and [[mathematical optimization]], [[formal logic]], [[artificial neural network]]s, and methods based on [[statistics]], [[operations research]], and [[economics]].{{Efn|name=\"Tools of AI\"}} AI also draws upon [[psychology]], [[linguistics]], [[Philosophy of artificial intelligence|philosophy]], [[neuroscience]], and other fields.\u003cref\u003e{{Harvtxt|Russell|Norvig|2021|loc=\u00a71.2}}.\u003c\u002fref\u003e\u003cbr\u003e+Various subfields of AI research are centered around particular goals and the use of particular tools. The traditional goals of
