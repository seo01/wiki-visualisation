 spacecraft, space debris avoidance, and more autonomous operation.\u003cbr\u003e \u003cbr\u003e-During the [[2024 Indian general election|2024 Indian elections]], US$50 million was spent on authorized AI-generated content, notably by creating [[deepfake]]s of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917194950\u002fhttps:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+During the [[2024 Indian general election|2024 Indian elections]], US$50 millions was spent on authorized AI-generated content, notably by creating [[Deepfake|deepfakes]] of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Ethics==\u003cbr\u003e {{Main|Ethics of artificial intelligence}}\u003cbr\u003e@@ -269,10 +271,10 @@\u003cbr\u003e \u003c!-- PRIVACY PROBLEM --\u003e\u003cbr\u003e AI-powered devices and services, such as virtual assistants and IoT products, continuously collect personal information, raising concerns about intrusive data gathering and unauthorized access by third parties. The loss of privacy is further exacerbated by AI's ability to process and combine vast amounts of data, potentially leading to a surveillance society where individual activities are constantly monitored and analyzed without adequate safeguards or transparency.\u003cbr\u003e \u003cbr\u003e-Sensitive user data collected may include online activity records, geolocation data, video, or audio.{{Sfnp|GAO|2022}} For example, in order to build [[speech recognition]] algorithms, [[Amazon (company)|Amazon]] has recorded millions of private conversations and allowed [[temporary worker]]s to listen to and transcribe some of them.{{Sfnp|Valinsky|2019}} Opinions about this widespread surveillance range from those who see it as a [[necessary evil]] to those for whom it is clearly [[unethical]] and a violation of the [[right to privacy]].{{Sfnp|Russell|Norvig|2021|p=991}}\u003cbr\u003e+Sensitive user data collected may include online activity records, geolocation data, video or audio.{{Sfnp|GAO|2022}} For example, in order to build [[speech recognition]] algorithms, [[Amazon (company)|Amazon]] has recorded millions of private conversations and allowed [[temporary worker]]s to listen to and transcribe some of them.{{Sfnp|Valinsky|2019}} Opinions about this widespread surveillance range from those who see it as a [[necessary evil]] to those for whom it is clearly [[unethical]] and a violation of the [[right to privacy]].{{Sfnp|Russell|Norvig|2021|p=991}}\u003cbr\u003e \u003cbr\u003e \u003c!-- PRIVACY SOLUTIONS --\u003e\u003cbr\u003e-AI developers argue that this is the only way to deliver valuable applications and have developed several techniques that attempt to preserve privacy while still obtaining the data, such as [[data aggregation]], [[de-identification]] and [[differential privacy]].{{Sfnp|Russell|Norvig|2021|pp=991\u2013992}} Since 2016, some privacy experts, such as [[Cynthia Dwork]], have begun to view privacy in terms of [[fairness (machine learning)|fairness]]. [[Brian Christian]] wrote that experts have pivoted \"from the question of 'what they know' to the question of 'what they're doing with it'.\"{{Sfnp|Christian|2020|p=63}}\u003cbr\u003e+AI developers argue that this is the only way to deliver valuable applications. and have developed several techniques that attempt to preserve privacy while still obtaining the data, such as [[data aggregation]], [[de-identification]] and [[differential privacy]].{{Sfnp|Russell|Norvig|2021|pp=991\u2013992}} Since 2016, some privacy experts, such as [[Cynthia Dwork]], have begun to view privacy in terms of [[fairness (machine learning)|fairness]]. [[Brian Christian]] wrote that experts have pivoted \"from the question of 'what they know' to the question of 'what they're doing with it'.\"{{Sfnp|Christian|2020|p=63}}\u003cbr\u003e \u003cbr\u003e \u003c!-- COPYRIGHT AND GENERATIVE AI --\u003e\u003cbr\u003e Generative AI is often trained on unlicensed copyrighted works, including in domains such as images or computer code; the output is then used under the rationale of \"[[fair use]]\". Experts disagree about how well and under what circumstances this rationale will hold up in courts of law; relevant factors may include \"the purpose and character of the use of the copyrighted work\" and \"the effect upon the potential market for the copyrighted work\".{{Sfnp|Vincent|2022}}\u003cref\u003e{{Cite web |last=Kopel |first=Matthew |title=Copyright Services: Fair Use |url=https:\u002f\u002fguides.library.cornell.edu\u002fcopyright\u002ffair-use |access-date=2024-04-26 |website=Cornell University Library |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926194057\u002fhttps:\u002f\u002fguides.library.cornell.edu\u002fcopyright\u002ffair-use |url-status=live }}\u003c\u002fref\u003e Website owners who do not wish to have their content scraped can indicate it in a \"[[robots.txt]]\" file.\u003cref\u003e{{Cite magazine |last=Burgess |first=Matt |title=How to Stop Your Data From Being Used to Train AI |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fhow-to-stop-your-data-from-being-used-to-train-ai |access-date=2024-04-26 |magazine=Wired |issn=1059-1028 |archive-date=3 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241003180100\u002fhttps:\u002f\u002fwww.wired.com\u002fstory\u002fhow-to-stop-your-data-from-being-used-to-train-ai\u002f |url-status=live }}\u003c\u002fref\u003e In 2023, leading authors (including [[John Grisham]] and [[Jonathan Franzen]]) sued AI companies for using their work to train generative AI.{{Sfnp|Reisner|2023}}{{Sfnp|Alter|Harris|2023}} Another discussed approach is to envision a separate ''[[sui generis]]'' system of protection for creations generated by AI to ensure fair attribution and compensation for human authors.\u003cref\u003e{{Cite web |title=Getting the Innovation Ecosystem Ready for AI. An IP policy toolkit |url=https:\u002f\u002fwww.wipo.int\u002fedocs\u002fpubdocs\u002fen\u002fwipo-pub-2003-en-getting-the-innovation-ecosystem-ready-for-ai.pdf |website=[[WIPO]]}}\u003c\u002fref\u003e\u003cbr\u003e@@ -292,9 +294,9 @@\u003cbr\u003e \u003cbr\u003e In September 2024, [[Microsoft]] announced an agreement with [[Constellation Energy]] to re-open the [[Three Mile Island]] nuclear power plant to provide Microsoft with 100% of all electric power produced by the plant for 20 years. Reopening the plant, which suffered a partial nuclear meltdown of its Unit 2 reactor in 1979, will require Constellation to get through strict regulatory processes which will include extensive safety scrutiny from the US [[Nuclear Regulatory Commission]]. If approved (this will be the first ever US re-commissioning of a nuclear plant), over 835 megawatts of power \u2013 enough for 800,000 homes \u2013 of energy will be produced. The cost for re-opening and upgrading is estimated at $1.6 billion (US) and is dependent on tax breaks for nuclear power contained in the 2022 US [[Inflation Reduction Act]].\u003cref\u003e{{Cite news |last=Halper |first=Evan |date=20 September 2024 |title=Microsoft deal would reopen Three Mile Island nuclear plant to power AI |url=https:\u002f\u002fwww.washingtonpost.com\u002fbusiness\u002f2024\u002f09\u002f20\u002fmicrosoft-three-mile-island-nuclear-constellation |newspaper=Washington Post}}\u003c\u002fref\u003e The US government and the state of Michigan are investing almost $2 billion (US) to reopen the [[Palisades Nuclear Generating Station|Palisades Nuclear]] reactor on Lake Michigan. Closed since 2022, the plant is planned to be reopened in October 2025. The Three Mile Island facility will be renamed the Crane Clean Energy Center after Chris Crane, a nuclear proponent and former CEO of [[Exelon]] who was responsible for Exelon spinoff of Constellation.\u003cref\u003e{{Cite news |last=Hiller |first=Jennifer |date=20 September 2024 |title=Three Mile Island's Nuclear Plant to Reopen, Help Power Microsoft's AI Centers |url=https:\u002f\u002fwww.wsj.com\u002fbusiness\u002fenergy-oil\u002fthree-mile-islands-nuclear-plant-to-reopen-help-power-microsofts-ai-centers-aebfb3c8?mod=Searchresults_pos1&page=1 |work=Wall Street Journal |publisher=Dow Jones |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170152\u002fhttps:\u002f\u002fwww.wsj.com\u002fbusiness\u002fenergy-oil\u002fthree-mile-islands-nuclear-plant-to-reopen-help-power-microsofts-ai-centers-aebfb3c8?mod=Searchresults_pos1&page=1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-After the last approval in September 2023, [[Taiwan]] suspended the approval of data centers north of [[Taoyuan, Taiwan|Taoyuan]] with a capacity of more than 5 MW in 2024, due to power supply shortages.\u003cref name=\"DatacenterDynamics\"\u003e{{Cite news |author=Niva Yadav |date=19 August 2024 |title=Taiwan to stop large data centers in the North, cites insufficient power |url=https:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |publisher=DatacenterDynamics |archive-date=8 November 2024 |access-date=7 November 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241108213650\u002fhttps:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |url-status=live }}\u003c\u002fref\u003e Taiwan aims to [[Nuclear power phase-out|phase out nuclear power]] by 2025.\u003cref name=\"DatacenterDynamics\" \u002f\u003e On the other hand, [[Singapore]] imposed a ban on the opening of data centers in 2019 due to electric power, but in 2022, lifted this ban.\u003cref name=\"DatacenterDynamics\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-Although most nuclear plants in Japan have been shut down after the 2011 [[Fukushima nuclear accident]], according to an October 2024 ''Bloomberg'' article in Japanese, cloud gaming services company Ubitus, in which Nvidia has a stake, is looking for land in Japan near nuclear power plant for a new data center for generative AI.\u003cref name=bloombergjp\u003e{{Cite news |last1=Mochizuki |first1=Takashi |last2=Oda |first2=Shoko |date=18 October 2024 |title=\u30a8\u30cc\u30d3\u30c7\u30a3\u30a2\u51fa\u8cc7\u306e\u65e5\u672c\u4f01\u696d\u3001\u539f\u767a\u8fd1\u304f\u3067\uff21\uff29\u30c7\u30fc\u30bf\u30bb\u30f3\u30bf\u30fc\u65b0\u8a2d\u691c\u8a0e |url=https:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |newspaper=Bloomberg |language=Japanese |archive-date=8 November 2024 |access-date=7 November 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241108213843\u002fhttps:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |url-status=live }}\u003c\u002fref\u003e Ubitus CEO Wesley Kuo said nuclear power plants are the most efficient, cheap and stable power for AI.\u003cref name=bloombergjp \u002f\u003e\u003cbr\u003e+After the last approval in September 2023, [[Taiwan]] suspended the approval of data centers north of [[Taoyuan, Taiwan|Taoyuan]] with a capacity of more than 5 MW in 2024, due to power supply shortages.\u003cref name=\"DatacenterDynamics\"\u003e{{Cite news |author=Niva Yadav |date=19 August 2024 |title=Taiwan to stop large data centers in the North, cites insufficient power |url=https:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |publisher=DatacenterDynamics}}\u003c\u002fref\u003e Taiwan aims to [[Nuclear power phase-out|phase out nuclear power]] by 2025.\u003cref name=\"DatacenterDynamics\" \u002f\u003e On the other hand, [[Singapore]] imposed a ban on the opening of data centers in 2019 due to electric power, but in 2022, lifted this ban.\u003cref name=\"DatacenterDynamics\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Although most nuclear plants in Japan have been shut down after the 2011 [[Fukushima nuclear accident]], according to an October 2024 ''Bloomberg'' article in Japanese, cloud gaming services company Ubitus, in which Nvidia has a stake, is looking for land in Japan near nuclear power plant for a new data center for generative AI.\u003cref name=bloombergjp\u003e{{Cite news |last1=Mochizuki  |first1=Takashi |last2=Oda |first2=Shoko |date=18 October 2024 |title=\u30a8\u30cc\u30d3\u30c7\u30a3\u30a2\u51fa\u8cc7\u306e\u65e5\u672c\u4f01\u696d\u3001\u539f\u767a\u8fd1\u304f\u3067\uff21\uff29\u30c7\u30fc\u30bf\u30bb\u30f3\u30bf\u30fc\u65b0\u8a2d\u691c\u8a0e|url=https:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |newspaper=Bloomberg |language=Japanese}}\u003c\u002fref\u003e Ubitus CEO Wesley Kuo said nuclear power plants are the most efficient, cheap and stable power for AI.\u003cref name=bloombergjp \u002f\u003e\u003cbr\u003e \u003cbr\u003e On 1 November 2024, the [[Federal Energy Regulatory Commission]] (FERC) rejected an application submitted by [[Talen Energy]] for approval to supply some electricity from the nuclear power station [[Susquehanna Steam Electric Station|Susquehanna]] to Amazon's data center.\u003cref name=\"Bloomberg20241104\"\u003e{{Cite news |author=Naureen S Malik and Will Wade |date=5 November 2024 |title=Nuclear-Hungry AI Campuses Need New Plan to Find Power Fast |url=https:\u002f\u002fwww.bloomberg.com\u002fnews\u002farticles\u002f2024-11-04\u002fnuclear-hungry-ai-campuses-need-new-strategy-to-find-power-fast |publisher=Bloomberg}}\u003c\u002fref\u003e \u003cbr\u003e According to the Commission Chairman [[Willie L. Phillips]], it is a burden on the electricity grid as well as a significant cost shifting concern to households and other business sectors.\u003cref name=\"Bloomberg20241104\" \u002f\u003e\u003cbr\u003e@@ -342,7 +344,7 @@\u003cbr\u003e \u003cbr\u003e Artificial intelligence provides a number of tools that are useful to [[bad actor]]s, such as [[authoritarian|authoritarian governments]], [[terrorist]]s, [[criminals]] or [[rogue states]].\u003cbr\u003e \u003cbr\u003e-A lethal autonomous weapon is a machine that locates, selects and engages human targets without human supervision.{{Efn|This is the [[United Nations]]' definition, and includes things like [[land mines]] as well.{{Sfnp|Russell|Norvig|2021|p=989}}}} Widely available AI tools can be used by bad actors to develop inexpensive autonomous weapons and, if produced at scale, they are potentially [[weapons of mass destruction]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} Even when used in conventional warfare, they currently cannot reliably choose targets and could potentially [[murder|kill an innocent person]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} In 2014, 30 nations (including China) supported a ban on autonomous weapons under the [[United Nations]]' [[Convention on Certain Conventional Weapons]], however the [[United States]] and others disagreed.{{Sfnp|Russell|Norvig|2021|p=988}} By 2015, over fifty countries were reported to be researching battlefield robots.\u003cref\u003e{{Harvtxt|Robitzski|2018}}; {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e\u003cbr\u003e+A lethal autonomous weapon is a machine that locates, selects and engages human targets without human supervision.{{Efn|This is the [[United Nations]]' definition, and includes things like [[land mines]] as well.{{Sfnp|Russell|Norvig|2021|p=989}}}} Widely available AI tools can be used by bad actors to develop inexpensive autonomous weapons and, if produced at scale, they are potentially [[weapons of mass destruction]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} Even when used in conventional warfare, it is unlikely that they will be unable to reliably choose targets and could potentially [[murder|kill an innocent person]].{{Sfnp|Russell|Norvig|2021|pp=987\u2013990}} In 2014, 30 nations (including China) supported a ban on autonomous weapons under the [[United Nations]]' [[Convention on Certain Conventional Weapons]], however the [[United States]] and others disagreed.{{Sfnp|Russell|Norvig|2021|p=988}} By 2015, over fifty countries were reported to be researching battlefield robots.\u003cref\u003e{{Harvtxt|Robitzski|2018}}; {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e AI tools make it easier for [[Authoritarian|authoritarian governments]] to efficiently control their citizens in several ways. [[Facial recognition system|Face]] and [[Speaker recognition|voice recognition]] allow widespread [[surveillance]]. [[Machine learning]], operating this data, can [[classifier (machine learning)|classify]] potential enemies of the state and prevent them from hiding. [[Recommendation systems]] can precisely target [[propaganda]] and [[misinformation]] for maximum effect. [[Deepfakes]] and [[generative AI]] aid in producing misinformation. Advanced AI can make authoritarian [[technocracy|centralized decision making]] more competitive than liberal and decentralized systems such as [[market (economics)|market]]s. It lowers the cost and difficulty of [[digital warfare]] and [[spyware|advanced spyware]].{{Sfnp|Harari|2018}} All these technologies have been available since 2020 or earlier\u2014AI [[facial recognition system]]s are already being used for [[mass surveillance]] in China.\u003cref\u003e{{Cite news |last1=Buckley |first1=Chris |last2=Mozur |first2=Paul |date=22 May 2019 |title=How China Uses High-Tech Surveillance to Subdue Minorities |url=https:\u002f\u002fwww.nytimes.com\u002f2019\u002f05\u002f22\u002fworld\u002fasia\u002fchina-surveillance-xinjiang.html |work=The New York Times |access-date=2 July 2019 |archive-date=25 November 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191125180459\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2019\u002f05\u002f22\u002fworld\u002fasia\u002fchina-surveillance-xinjiang.html |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |date=3 May 2019 |title=Security lapse exposed a Chinese smart city surveillance system |url=https:\u002f\u002ftechcrunch.com\u002f2019\u002f05\u002f03\u002fchina-smart-city-exposed |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210307203740\u002fhttps:\u002f\u002fconsent.yahoo.com\u002fv2\u002fcollectConsent?sessionId=3_cc-session_c8562b93-9863-4915-8523-6c7b930a3efc |archive-date=7 March 2021 |access-date=14 September 2020}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -373,7 +375,7 @@\u003cbr\u003e \u003c!-- Warnings of existential risk --\u003e\u003cbr\u003e The opinions amongst experts and industry insiders are mixed, with sizable fractions both concerned and unconcerned by risk from eventual superintelligent AI.{{Sfnp|M\u00fcller|Bostrom|2014}} Personalities such as [[Stephen Hawking]], [[Bill Gates]], and [[Elon Musk]],\u003cref\u003eLeaders' concerns about the existential risks of AI around 2015: {{Harvtxt|Rawlinson|2015}}, {{Harvtxt|Holley|2015}}, {{Harvtxt|Gibbs|2014}}, {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e as well as AI pioneers such as [[Yoshua Bengio]], [[Stuart J. Russell|Stuart Russell]], [[Demis Hassabis]], and [[Sam Altman]], have expressed concerns about existential risk from AI.\u003cbr\u003e \u003cbr\u003e-In May 2023, [[Geoffrey Hinton]] announced his resignation from Google in order to be able to \"freely speak out about the risks of AI\" without \"considering how this impacts Google\".\u003cref\u003e{{Cite news |date=25 March 2023 |title=\"Godfather of artificial intelligence\" talks impact and potential of new AI |url=https:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230328225221\u002fhttps:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |archive-date=28 March 2023 |access-date=2023-03-28 |work=CBS News}}\u003c\u002fref\u003e He notably mentioned risks of an [[AI takeover]],\u003cref\u003e{{Cite news |last=Pittis |first=Don |date=May 4, 2023 |title=Canadian artificial intelligence leader Geoffrey Hinton piles on fears of computer takeover |url=https:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |work=CBC |access-date=5 October 2024 |archive-date=7 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240707032135\u002fhttps:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |url-status=live }}\u003c\u002fref\u003e and stressed that in order to avoid the worst outcomes, establishing safety guidelines will require cooperation among those competing in use of AI.\u003cref\u003e{{Cite web |date=2024-06-14 |title='50\u201350 chance' that AI outsmarts humanity, Geoffrey Hinton says |url=https:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |access-date=2024-07-06 |website=Bloomberg BNN |archive-date=14 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240614144506\u002fhttps:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+In May 2023, [[Geoffrey Hinton]] announced his resignation from Google in order to be able to \"freely speak out about the risks of AI\" without \"considering how this impacts Google.\"\u003cref\u003e{{Cite news |date=25 March 2023 |title=\"Godfather of artificial intelligence\" talks impact and potential of new AI |url=https:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230328225221\u002fhttps:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |archive-date=28 March 2023 |access-date=2023-03-28 |work=CBS News}}\u003c\u002fref\u003e He notably mentioned risks of an [[AI takeover]],\u003cref\u003e{{Cite news |last=Pittis |first=Don |date=May 4, 2023 |title=Canadian artificial intelligence leader Geoffrey Hinton piles on fears of computer takeover |url=https:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |work=CBC |access-date=5 October 2024 |archive-date=7 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240707032135\u002fhttps:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |url-status=live }}\u003c\u002fref\u003e and stressed that in order to avoid the worst outcomes, establishing safety guidelines will require cooperation among those competing in use of AI.\u003cref\u003e{{Cite web |date=2024-06-14 |title='50\u201350 chance' that AI outsmarts humanity, Geoffrey Hinton says |url=https:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |access-date=2024-07-06 |website=Bloomberg BNN}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2023, many leading AI experts endorsed [[Statement on AI risk of extinction|the joint statement]] that \"Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war\".{{Sfnp|Valance|2023}}\u003cbr\u003e \u003cbr\u003e@@ -395,21 +397,21 @@\u003cbr\u003e Active organizations in the AI open-source community include [[Hugging Face]],\u003cref\u003e{{Cite web |last1=Stewart |first1=Ashley |last2=Melton |first2=Monica |title=Hugging Face CEO says he's focused on building a 'sustainable model' for the $4.5 billion open-source-AI startup |url=https:\u002f\u002fwww.businessinsider.com\u002fhugging-face-open-source-ai-approach-2023-12 |access-date=2024-04-14 |website=Business Insider |archive-date=25 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240925013220\u002fhttps:\u002f\u002fwww.businessinsider.com\u002fhugging-face-open-source-ai-approach-2023-12 |url-status=live }}\u003c\u002fref\u003e [[Google]],\u003cref\u003e{{Cite web |last=Wiggers |first=Kyle |date=2024-04-09 |title=Google open sources tools to support AI model development |url=https:\u002f\u002ftechcrunch.com\u002f2024\u002f04\u002f09\u002fgoogle-open-sources-tools-to-support-ai-model-development |access-date=2024-04-14 |website=TechCrunch |archive-date=10 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240910112401\u002fhttps:\u002f\u002ftechcrunch.com\u002f2024\u002f04\u002f09\u002fgoogle-open-sources-tools-to-support-ai-model-development\u002f |url-status=live }}\u003c\u002fref\u003e [[EleutherAI]] and [[Meta Platforms|Meta]].\u003cref\u003e{{Cite web |last=Heaven |first=Will Douglas |date=May 12, 2023 |title=The open-source AI boom is built on Big Tech's handouts. How long will it last? |url=https:\u002f\u002fwww.technologyreview.com\u002f2023\u002f05\u002f12\u002f1072950\u002fopen-source-ai-google-openai-eleuther-meta |access-date=2024-04-14 |website=MIT Technology Review}}\u003c\u002fref\u003e Various AI models, such as [[LLaMA|Llama 2]], [[Mistral AI|Mistral]] or [[Stable Diffusion]], have been made open-weight,\u003cref\u003e{{Cite news |last=Brodsky |first=Sascha |date=December 19, 2023 |title=Mistral AI's New Language Model Aims for Open Source Supremacy |url=https:\u002f\u002faibusiness.com\u002fnlp\u002fmistral-ai-s-new-language-model-aims-for-open-source-supremacy |work=AI Business |access-date=5 October 2024 |archive-date=5 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240905212607\u002fhttps:\u002f\u002faibusiness.com\u002fnlp\u002fmistral-ai-s-new-language-model-aims-for-open-source-supremacy |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Edwards |first=Benj |date=2024-02-22 |title=Stability announces Stable Diffusion 3, a next-gen AI image generator |url=https:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator |access-date=2024-04-14 |website=Ars Technica |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170201\u002fhttps:\u002f\u002farstechnica.com\u002finformation-technology\u002f2024\u002f02\u002fstability-announces-stable-diffusion-3-a-next-gen-ai-image-generator\u002f |url-status=live }}\u003c\u002fref\u003e meaning that their architecture and trained parameters (the \"weights\") are publicly available. Open-weight models can be freely [[Fine-tuning (deep learning)|fine-tuned]], which allows companies to specialize them with their own data and for their own use-case.\u003cref\u003e{{Cite news |last=Marshall |first=Matt |date=January 29, 2024 |title=How enterprises are using open source LLMs: 16 examples |url=https:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples |work=VentureBeat |access-date=5 October 2024 |archive-date=26 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240926171131\u002fhttps:\u002f\u002fventurebeat.com\u002fai\u002fhow-enterprises-are-using-open-source-llms-16-examples\u002f |url-status=live }}\u003c\u002fref\u003e Open-weight models are useful for research and innovation but can also be misused. Since they can be fine-tuned, any built-in security measure, such as objecting to harmful requests, can be trained away until it becomes ineffective. Some researchers warn that future AI models may develop dangerous capabilities (such as the potential to drastically facilitate [[bioterrorism]]) and that once released on the Internet, they cannot be deleted everywhere if needed. They recommend pre-release audits and cost-benefit analyses.\u003cref\u003e{{Cite web |last=Piper |first=Kelsey |date=2024-02-02 |title=Should we make our most powerful AI models open source to all? |url=https:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |access-date=2024-04-14 |website=Vox |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170204\u002fhttps:\u002f\u002fwww.vox.com\u002ffuture-perfect\u002f2024\u002f2\u002f2\u002f24058484\u002fopen-source-artificial-intelligence-ai-risk-meta-llama-2-chatgpt-openai-deepfake |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Frameworks ===\u003cbr\u003e-Artificial Intelligence projects can be guided by ethical considerations during the design, development, and implementation of an AI system. An AI framework such as the Care and Act Framework, developed by the [[Alan Turing Institute]] and based on the SUM values, outlines four main ethical dimensions, defined as follows:\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2019 |title=Understanding artificial intelligence ethics and safety |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911131935\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2023 |title=AI Ethics and Governance in Practice |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125504\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Artificial Intelligence projects can have their ethical permissibility tested while designing, developing, and implementing an AI system. An AI framework such as the Care and Act Framework containing the SUM values\u2014developed by the [[Alan Turing Institute]] tests projects in four main areas:\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2019 |title=Understanding artificial intelligence ethics and safety |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911131935\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2019-06\u002funderstanding_artificial_intelligence_ethics_and_safety.pdf |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author=Alan Turing Institute |date=2023 |title=AI Ethics and Governance in Practice |url=https:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |access-date=5 October 2024 |archive-date=11 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240911125504\u002fhttps:\u002f\u002fwww.turing.ac.uk\u002fsites\u002fdefault\u002ffiles\u002f2023-12\u002faieg-ati-ai-ethics-an-intro_1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e * '''Respect''' the dignity of individual people\u003cbr\u003e * '''Connect''' with other people sincerely, openly, and inclusively\u003cbr\u003e * '''Care''' for the wellbeing of everyone\u003cbr\u003e * '''Protect''' social values, justice, and the public interest\u003cbr\u003e \u003cbr\u003e-Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal |last1=Floridi |first1=Luciano |last2=Cowls |first2=Josh |date=2019-06-23 |title=A Unified Framework of Five Principles for AI in Society |url=https:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |journal=Harvard Data Science Review |volume=1 |issue=1 |doi=10.1162\u002f99608f92.8cd550d1 |s2cid=198775713 |doi-access=free |archive-date=7 August 2019 |access-date=5 December 2023 |archive-url=https:\u002f\u002farchive.today\u002f20190807202909\u002fhttps:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |url-status=live }}\u003c\u002fref\u003e however, these principles are not without criticism, especially regards to the people chosen to contribute to these frameworks.\u003cref\u003e{{Cite journal |last1=Buruk |first1=Banu |last2=Ekmekci |first2=Perihan Elif |last3=Arda |first3=Berna |date=2020-09-01 |title=A critical perspective on guidelines for responsible and trustworthy artificial intelligence |url=https:\u002f\u002fdoi.org\u002f10.1007\u002fs11019-020-09948-1 |journal=Medicine, Health Care and Philosophy |volume=23 |issue=3 |pages=387\u2013399 |doi=10.1007\u002fs11019-020-09948-1 |issn=1572-8633 |pmid=32236794 |s2cid=214766800 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170206\u002fhttps:\u002f\u002flink.springer.com\u002farticle\u002f10.1007\u002fs11019-020-09948-1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Promotion of the wellbeing of the people and communities that these technologies affect requires consideration of the social and ethical implications at all stages of AI system design, development and implementation, and collaboration between job roles such as data scientists, product managers, data engineers, domain experts, and delivery managers.\u003cref\u003e{{Cite journal |last1=Kamila |first1=Manoj Kumar |last2=Jasrotia |first2=Sahil Singh |date=2023-01-01 |title=Ethical issues in the development of artificial intelligence: recognizing the risks |url=https:\u002f\u002fdoi.org\u002f10.1108\u002fIJOES-05-2023-0107 |journal=International Journal of Ethics and Systems |pages=45\u201363 |volume=41 |issue=ahead-of-print |doi=10.1108\u002fIJOES-05-2023-0107 |issn=2514-9369 |s2cid=259614124 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.emerald.com\u002finsight\u002fcontent\u002fdoi\u002f10.1108\u002fIJOES-05-2023-0107\u002ffull\u002fhtml |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal |last1=Floridi |first1=Luciano |last2=Cowls |first2=Josh |date=2019-06-23 |title=A Unified Framework of Five Principles for AI in Society |url=https:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |journal=Harvard Data Science Review |volume=1 |issue=1 |doi=10.1162\u002f99608f92.8cd550d1 |s2cid=198775713 |doi-access=free}}\u003c\u002fref\u003e however, these principles do not go without their criticisms, especially regards to the people chosen contributes to these frameworks.\u003cref\u003e{{Cite journal |last1=Buruk |first1=Banu |last2=Ekmekci |first2=Perihan Elif |last3=Arda |first3=Berna |date=2020-09-01 |title=A critical perspective on guidelines for responsible and trustworthy artificial intelligence |url=https:\u002f\u002fdoi.org\u002f10.1007\u002fs11019-020-09948-1 |journal=Medicine, Health Care and Philosophy |volume=23 |issue=3 |pages=387\u2013399 |doi=10.1007\u002fs11019-020-09948-1 |issn=1572-8633 |pmid=32236794 |s2cid=214766800 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170206\u002fhttps:\u002f\u002flink.springer.com\u002farticle\u002f10.1007\u002fs11019-020-09948-1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Promotion of the wellbeing of the people and communities that these technologies affect requires consideration of the social and ethical implications at all stages of AI system design, development and implementation, and collaboration between job roles such as data scientists, product managers, data engineers, domain experts, and delivery managers.\u003cref\u003e{{Cite journal |last1=Kamila |first1=Manoj Kumar |last2=Jasrotia |first2=Sahil Singh |date=2023-01-01 |title=Ethical issues in the development of artificial intelligence: recognizing the risks |url=https:\u002f\u002fdoi.org\u002f10.1108\u002fIJOES-05-2023-0107 |journal=International Journal of Ethics and Systems |volume=ahead-of-print |issue=ahead-of-print |doi=10.1108\u002fIJOES-05-2023-0107 |issn=2514-9369 |s2cid=259614124 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.emerald.com\u002finsight\u002fcontent\u002fdoi\u002f10.1108\u002fIJOES-05-2023-0107\u002ffull\u002fhtml |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[AI Safety Institute (United Kingdom)|UK AI Safety Institute]] released in 2024 a testing toolset called 'Inspect' for AI safety evaluations available under a MIT open-source licence which is freely available on GitHub and can be improved with third-party packages. It can be used to evaluate AI models in a range of areas including core knowledge, ability to reason, and autonomous capabilities.\u003cref\u003e{{Cite web |date=10 May 2024 |title=AI Safety Institute releases new AI safety evaluations platform |url=https:\u002f\u002fwww.gov.uk\u002fgovernment\u002fnews\u002fai-safety-institute-releases-new-ai-safety-evaluations-platform |access-date=14 May 2024 |publisher=UK Government |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.gov.uk\u002fgovernment\u002fnews\u002fai-safety-institute-releases-new-ai-safety-evaluations-platform |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Regulation ===\u003cbr\u003e {{Main|Regulation of artificial intelligence|Regulation of algorithms|AI safety}}\u003cbr\u003e-[[File:Vice President Harris at the group photo of the 2023 AI Safety Summit.jpg|upright=1.2|thumb|alt=AI Safety Summit|The first global [[AI Safety Summit]] was held in the United Kingdom in November 2023 with a declaration calling for international cooperation.]]\u003cbr\u003e+[[File:Vice President Harris at the group photo of the 2023 AI Safety Summit.jpg|upright=1.2|thumb|alt=AI Safety Summit|The first global [[AI Safety Summit]] was held in 2023 with a declaration calling for international cooperation.]]\u003cbr\u003e \u003cbr\u003e The regulation of artificial intelligence is the development of public sector policies and laws for promoting and regulating AI; it is therefore related to the broader regulation of algorithms.\u003cref\u003eRegulation of AI to mitigate risks: {{Harvtxt|Berryhill|Heang|Clogher|McBride|2019}}, {{Harvtxt|Barfield|Pagallo|2018}}, {{Harvtxt|Iphofen|Kritikos|2019}}, {{Harvtxt|Wirtz|Weyerer|Geyer|2018}}, {{Harvtxt|Buiten|2019}}\u003c\u002fref\u003e The regulatory and policy landscape for AI is an emerging issue in jurisdictions globally.{{Sfnp|Law Library of Congress (U.S.). Global Legal Research Directorate|2019}} According to AI Index at [[Stanford]], the annual number of AI-related laws passed in the 127 survey countries jumped from one passed in 2016 to 37 passed in 2022 alone.{{Sfnp|Vincent|2023}}{{Sfnp|Stanford University|2023}} Between 2016 and 2020, more than 30 countries adopted dedicated strategies for AI.{{Sfnp|UNESCO|2021}} Most EU member states had released national AI strategies, as had Canada, China, India, Japan, Mauritius, the Russian Federation, Saudi Arabia, United Arab Emirates, U.S., and Vietnam. Others were in the process of elaborating their own AI strategy, including Bangladesh, Malaysia and Tunisia.{{Sfnp|UNESCO|2021}} The [[Global Partnership on Artificial Intelligence]] was launched in June 2020, stating a need for AI to be developed in accordance with human rights and democratic values, to ensure public confidence and trust in the technology.{{Sfnp|UNESCO|2021}} [[Henry Kissinger]], [[Eric Schmidt]], and [[Daniel Huttenlocher]] published a joint statement in November 2021 calling for a government commission to regulate AI.{{Sfnp|Kissinger|2021}} In 2023, OpenAI leaders published recommendations for the governance of superintelligence, which they believe may happen in less than 10 years.{{Sfnp|Altman|Brockman|Sutskever |2023}} In 2023, the United Nations also launched an advisory body to provide recommendations on AI governance; the body comprises technology company executives, governments officials and academics.\u003cref\u003e{{Cite web |last=VOA News |date=October 25, 2023 |title=UN Announces Advisory Body on Artificial Intelligence |url=https:\u002f\u002fwww.voanews.com\u002fa\u002fun-announces-advisory-body-on-artificial-intelligence-\u002f7328732.html |access-date=5 October 2024 |archive-date=18 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240918071530\u002fhttps:\u002f\u002fwww.voanews.com\u002fa\u002fun-announces-advisory-body-on-artificial-intelligence-\u002f7328732.html |url-status=live }}\u003c\u002fref\u003e In 2024, the [[Council of Europe]] created the first international legally binding treaty on AI, called the \"[[Framework Convention on Artificial Intelligence and Human Rights, Democracy and the Rule of Law]]\". It was adopted by the European Union, the United States, the United Kingdom, and other signatories.\u003cref\u003e{{Cite web |date=5 September 2024 |title=Council of Europe opens first ever global treaty on AI for signature |url=https:\u002f\u002fwww.coe.int\u002fen\u002fweb\u002fportal\u002f-\u002fcouncil-of-europe-opens-first-ever-global-treaty-on-ai-for-signature |access-date=2024-09-17 |website=Council of Europe |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917001330\u002fhttps:\u002f\u002fwww.coe.int\u002fen\u002fweb\u002fportal\u002f-\u002fcouncil-of-europe-opens-first-ever-global-treaty-on-ai-for-signature |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -420,7 +422,6 @@\u003cbr\u003e == History ==\u003cbr\u003e {{Main|History of artificial intelligence}}\u003cbr\u003e {{For timeline}}\u003cbr\u003e-[[File:2024 AI patents by country - artificial intelligence.svg |thumb |In 2024, AI patents in China and the US numbered more than three-fourths of AI patents worldwide.\u003cref name=RandDworld_20241103\u002f\u003e Though China had more AI patents, the US had 35% more patents per AI patent-applicant company than China.\u003cref name=RandDworld_20241103\u003e{{cite web |last1=Buntz |first1=Brian |title=Quality vs. quantity: US and China chart different paths in global AI patent race in 2024 \u002f Geographical breakdown of AI patents in 2024 |url=https:\u002f\u002fwww.rdworldonline.com\u002fquality-vs-quantity-us-and-china-chart-different-paths-in-global-ai-patent-race-in-2024\u002f |publisher=R&D World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241209072113\u002fhttps:\u002f\u002fwww.rdworldonline.com\u002fquality-vs-quantity-us-and-china-chart-different-paths-in-global-ai-patent-race-in-2024\u002f |archive-date=9 December 2024 |date=3 November 2024 |url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003c!-- DON'T INCLUDE HISTORICAL PRECURSORS (THEY BELONG TO THE SEPARATE 'HISTORY OF AI' ARTICLE) --\u003e\u003cbr\u003e \u003c!-- MAJOR INTELLECTUAL PRECURSORS: LOGIC, THEORY OF COMPUTATION, CYBERNETICS, INFORMATION THEORY, NEUROBIOLOGY, SPECULATION: Antiquity - 1955 --\u003e\u003cbr\u003e The study of mechanical or \"formal\" reasoning began with philosophers and mathematicians in antiquity. The study of logic led directly to [[Alan Turing]]'s [[theory of computation]], which suggested that a machine, by shuffling symbols as simple as \"0\" and \"1\", could simulate any conceivable form of mathematical reasoning.{{Sfn|Russell|Norvig|2021|p=9}}\u003cref name=\"Clarendon Press-2004\"\u002f\u003e This, along with concurrent discoveries in [[cybernetics]], [[information theory]] and [[neurobiology]], led researchers to consider the possibility of building an \"electronic brain\".{{Efn|\"Electronic brain\" was the term used by the press around this time.{{Sfn|Russell|Norvig|2021|p=9}}\u003cref\u003e{{Cite web |title=Google books ngram |url=https:\u002f\u002fbooks.google.com\u002fngrams\u002fgraph?content=electronic+brain&year_start=1930&year_end=2019&corpus=en-2019&smoothing=3 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170209\u002fhttps:\u002f\u002fbooks.google.com\u002fngrams\u002fgraph?content=electronic+brain&year_start=1930&year_end=2019&corpus=en-2019&smoothing=3 |url-status=live }}\u003c\u002fref\u003e}} They developed several areas of research that would become part of AI,\u003cref\u003eAI's immediate precursors: {{Harvtxt|McCorduck|2004|pp=51\u2013107}}, {{Harvtxt|Crevier|1993|pp=27\u201332}}, {{Harvtxt|Russell|Norvig|2021|pp=8\u201317}}, {{Harvtxt|Moravec|1988|p=3}}\u003c\u002fref\u003e such as [[Warren McCullouch|McCullouch]] and [[Walter Pitts|Pitts]] design for \"artificial neurons\" in 1943,{{Sfnp|Russell|Norvig|2021|p=17}} and Turing's influential 1950 paper '[[Computing Machinery and Intelligence]]', which introduced the [[Turing test]] and showed that \"machine intelligence\" was plausible.\u003cref name=\"Turing\"\u002f\u003e\u003cref name=\"Clarendon Press-2004\"\u003e{{Cite book |title=The Essential Turing: the ideas that gave birth to the computer age |date=2004 |publisher=Clarendon Press |isbn=0-1982-5079-7 |editor-last=Copeland |editor-first=J. |location=Oxford, England}}\u003c\u002fref\u003e\u003cbr\u003e@@ -430,7 +431,7 @@\u003cbr\u003e Daniel Crevier wrote, \"the conference is generally recognized as the official birthdate of the new science.\"{{Sfnp|Crevier|1993|pp=47\u201349}} [[Stuart J. Russell|Russell]] and [[Norvig]] called the conference \"the inception of artificial intelligence.\"{{Sfnp|Russell|Norvig|2021|p=17}}}}\u003cref name=\"Dartmouth workshop\"\u003e[[Dartmouth workshop]]: {{Harvtxt|Russell|Norvig|2021|p=18}}, {{Harvtxt|McCorduck|2004|pp=111\u2013136}}, {{Harvtxt|NRC|1999|pp=200\u2013201}}\u003cbr \u002f\u003eThe proposal: {{Harvtxt|McCarthy|Minsky|Rochester|Shannon|1955}}\u003c\u002fref\u003e The attendees became the leaders of AI research in the 1960s.{{Efn|\u003cbr\u003e [[Stuart J. Russell|Russell]] and [[Norvig]] wrote \"for the next 20 years the field would be dominated by these people and their students.\"{{Sfnp|Russell|Norvig|2003|p=17}}\u003cbr\u003e }} They and their students produced programs that the press described as \"astonishing\":{{Efn|\u003cbr\u003e-[[Stuart J. Russell|Russell]] and [[Norvig]] wrote, \"it was astonishing whenever a computer did anything kind of smartish\".{{Sfnp|Russell|Norvig|2003|p=18}}\u003cbr\u003e+[[Stuart J. Russell|Russell]] and [[Norvig]] wrote \"it was astonishing whenever a computer did anything kind of smartish\".{{Sfnp|Russell|Norvig|2003|p=18}}\u003cbr\u003e }} computers were learning [[checkers]] strategies, solving word problems in algebra, proving [[Theorem|logical theorems]] and speaking English.{{Efn|\u003cbr\u003e The programs described are [[Arthur Samuel (computer scientist)|Arthur Samuel]]'s checkers program for the [[IBM 701]], [[Daniel Bobrow]]'s [[STUDENT]], [[Allen Newell|Newell]] and [[Herbert A. Simon|Simon]]'s [[Logic Theorist]] and [[Terry Winograd]]'s [[SHRDLU]].\u003cbr\u003e }}\u003cref name=\"Succ1\"\u003eSuccessful programs of the 1960s: {{Harvtxt|McCorduck|2004|pp=243\u2013252}}, {{Harvtxt|Crevier|1993|pp=52\u2013107}}, {{Harvtxt|Moravec|1988|p=9}}, {{Harvtxt|Russell|Norvig|2021|pp=19\u201321}}\u003c\u002fref\u003e Artificial intelligence laboratories were set up at a number of British and U.S. universities in the latter 1950s and early 1960s.\u003cref name=\"Clarendon Press-2004\"\u002f\u003e\u003cbr\u003e@@ -441,10 +442,10 @@\u003cbr\u003e \u003c!-- 1980s and second AI winter --\u003e\u003cbr\u003e In the early 1980s, AI research was revived by the commercial success of [[expert system]]s,\u003cref\u003e[[Expert systems]]: {{Harvtxt|Russell|Norvig|2021|pp=23, 292}}, {{Harvtxt|Luger|Stubblefield|2004|pp=227\u2013331}}, {{Harvtxt|Nilsson|1998|loc=chpt. 17.4}}, {{Harvtxt|McCorduck|2004|pp=327\u2013335, 434\u2013435}}, {{Harvtxt|Crevier|1993|pp=145\u2013162, 197\u2013203}}, {{Harvtxt|Newquist|1994|pp=155\u2013183}}\u003c\u002fref\u003e a form of AI program that simulated the knowledge and analytical skills of human experts. By 1985, the market for AI had reached over a billion dollars. At the same time, Japan's [[fifth generation computer]] project inspired the U.S. and British governments to restore funding for [[academic research]].\u003cref name=\"Fund01\"\u003eFunding initiatives in the early 1980s: [[Fifth Generation Project]] (Japan), [[Alvey]] (UK), [[Microelectronics and Computer Technology Corporation]] (US), [[Strategic Computing Initiative]] (US): {{Harvtxt|McCorduck|2004|pp=426\u2013441}}, {{Harvtxt|Crevier|1993|pp=161\u2013162, 197\u2013203, 211, 240}}, {{Harvtxt|Russell|Norvig|2021|p=23}}, {{Harvtxt|NRC|1999|pp=210\u2013211}}, {{Harvtxt|Newquist|1994|pp=235\u2013248}}\u003c\u002fref\u003e However, beginning with the collapse of the [[Lisp Machine]] market in 1987, AI once again fell into disrepute, and a second, longer-lasting winter began.\u003cref name=\"Second AI Winter\"\u003eSecond [[AI Winter]]: {{Harvtxt|Russell|Norvig|2021|p=24}}, {{Harvtxt|McCorduck|2004|pp=430\u2013435}}, {{Harvtxt|Crevier|1993|pp=209\u2013210}}, {{Harvtxt|NRC|1999|pp=214\u2013216}}, {{Harvtxt|Newquist|1994|pp=301\u2013318}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003c!-- Embodied robotics, uncertain reasoning, and connectionism in the 1980s --\u003e\u003cbr\u003e+\u003c!-- Embodied robotics, uncertain reasoning and connectionism in the 1980s --\u003e\u003cbr\u003e Up to this point, most of AI's funding had gone to projects that used high-level [[symbolic AI|symbols]] to represent [[mental objects]] like plans, goals, beliefs, and known facts. In the 1980s, some researchers began to doubt that this approach would be able to imitate all the processes of human cognition, especially [[machine perception|perception]], [[robotics]], [[machine learning|learning]] and [[pattern recognition]],{{Sfnp|Russell|Norvig|2021|p=24}} and began to look into \"sub-symbolic\" approaches.{{Sfnp|Nilsson|1998|p=7}} [[Rodney Brooks]] rejected \"representation\" in general and focussed directly on engineering machines that move and survive.{{Efn|\u003cbr\u003e [[embodied mind|Embodied]] approaches to AI{{Sfnp|McCorduck|2004|pp=454\u2013462}} were championed by [[Hans Moravec]]{{Sfnp|Moravec|1988}} and [[Rodney Brooks]]{{Sfnp|Brooks|1990}} and went by many names: [[Nouvelle AI]].{{Sfnp|Brooks|1990}} [[Developmental robotics]].\u003cref\u003e[[Developmental robotics]]: {{Harvtxt|Weng|McClelland|Pentland|Sporns|2001}}, {{Harvtxt|Lungarella|Metta|Pfeifer|Sandini|2003}}, {{Harvtxt|Asada|Hosoda|Kuniyoshi|Ishiguro|2009}}, {{Harvtxt|Oudeyer|2010}}\u003c\u002fref\u003e\u003cbr\u003e-}} [[Judea Pearl]], [[Lofti Zadeh]], and others developed methods that handled incomplete and uncertain information by making reasonable guesses rather than precise logic.\u003cref name=\"Stoch\"\u002f\u003e{{Sfnp|Russell|Norvig|2021|p=25}} But the most important development was the revival of \"[[connectionism]]\", including neural network research, by [[Geoffrey Hinton]] and others.\u003cref\u003e{{Harvtxt|Crevier|1993|pp=214\u2013215}}, {{Harvtxt|Russell|Norvig|2021|pp=24, 26}}\u003c\u002fref\u003e In 1990, [[Yann LeCun]] successfully showed that [[convolutional neural networks]] can recognize handwritten digits, the first of many successful applications of neural networks.{{Sfnp|Russell|Norvig|2021|p=26}}\u003cbr\u003e+}} [[Judea Pearl]], [[Lofti Zadeh]] and others developed methods that handled incomplete and uncertain information by making reasonable guesses rather than precise logic.\u003cref name=\"Stoch\"\u002f\u003e{{Sfnp|Russell|Norvig|2021|p=25}} But the most important development was the revival of \"[[connectionism]]\", including neural network research, by [[Geoffrey Hinton]] and others.\u003cref\u003e{{Harvtxt|Crevier|1993|pp=214\u2013215}}, {{Harvtxt|Russell|Norvig|2021|pp=24, 26}}\u003c\u002fref\u003e In 1990, [[Yann LeCun]] successfully showed that [[convolutional neural networks]] can recognize handwritten digits, the first of many successful applications of neural networks.{{Sfnp|Russell|Norvig|2021|p=26}}\u003cbr\u003e \u003cbr\u003e \u003c!-- 1990s: narrow, formal AI and its detractors --\u003e\u003cbr\u003e AI gradually restored its reputation in the late 1990s and early 21st century by exploiting formal mathematical methods and by finding specific solutions to specific problems. This \"[[narrow AI|narrow]]\" and \"formal\" focus allowed researchers to produce verifiable results and collaborate with other fields (such as [[statistics]], [[economics]] and [[mathematical optimization|mathematics]]).\u003cref name=\"Formal and narrow methods adopted in the 1990s\"\u003e[[#Neat vs. scruffy|Formal]] and [[#Narrow vs. general AI|narrow]] methods adopted in the 1990s: {{Harvtxt |Russell|Norvig|2021|pp=24\u201326}}, {{Harvtxt|McCorduck|2004|pp=486\u2013487}}\u003c\u002fref\u003e By 2000, solutions developed by AI researchers were being widely used, although in the 1990s they were rarely described as \"artificial intelligence\" (a tendency known as the [[AI effect]]).\u003cref\u003eAI widely used in the late 1990s: {{Harvtxt|Kurzweil|2005|p=265}}, {{Harvtxt|NRC|1999|pp=216\u2013222}}, {{Harvtxt|Newquist|1994|pp=189\u2013201}}\u003c\u002fref\u003e\u003cbr\u003e@@ -452,15 +453,14 @@\u003cbr\u003e \u003cbr\u003e \u003c!--DEEP LEARNING BOOM 2012\u2013present--\u003e\u003cbr\u003e [[Deep learning]] began to dominate industry benchmarks in 2012 and was adopted throughout the field.\u003cref name=\"Deep learning revolution\"\u003e[[Deep learning]] revolution, [[AlexNet]]: {{Harvtxt|Goldman|2022}}, {{Harvtxt|Russell|Norvig|2021|p=26}}, {{Harvtxt|McKinsey|2018}}\u003c\u002fref\u003e\u003cbr\u003e-For many specific tasks, other methods were abandoned.{{Efn|Matteo Wong wrote in [[The Atlantic]]: \"Whereas for decades, computer-science fields such as natural-language processing, computer vision, and robotics used extremely different methods, now they all use a programming method called \"deep learning\". As a result, their code and approaches have become more similar, and their models are easier to integrate into one another.\"{{Sfnp|Wong|2023}}}}\u003cbr\u003e+For many specific tasks, other methods were abandoned.{{Efn|Matteo Wong wrote in [[The Atlantic]]: \"Whereas for decades, computer-science fields such as natural-language processing, computer vision, and robotics used extremely different methods, now they all use a programming method called \"deep learning.\" As a result, their code and approaches have become more similar, and their models are easier to integrate into one another.\"{{Sfnp|Wong|2023}}}}\u003cbr\u003e Deep learning's success was based on both hardware improvements ([[Moore's law|faster computers]],\u003cref\u003e[[Moore's Law]] and AI: {{Harvtxt|Russell|Norvig|2021|pp=14, 27}}\u003c\u002fref\u003e [[graphics processing unit]]s, [[cloud computing]]{{Sfnp|Clark|2015b}}) and access to [[big data|large amounts of data]]\u003cref\u003e[[Big data]]: {{Harvtxt|Russell|Norvig|2021|p=26}}\u003c\u002fref\u003e (including curated datasets,{{Sfnp|Clark|2015b}} such as [[ImageNet]]). Deep learning's success led to an enormous increase in interest and funding in AI.{{Efn|Jack Clark wrote in [[Bloomberg News|Bloomberg]]: \"After a half-decade of quiet breakthroughs in artificial intelligence, 2015 has been a landmark year. Computers are smarter and learning faster than ever\", and noted that the number of software projects that use machine learning at [[Google]] increased from a \"sporadic usage\" in 2012 to more than 2,700 projects in 2015.{{Sfnp|Clark|2015b}}}} The amount of machine learning research (measured by total publications) increased by 50% in the years 2015\u20132019.{{Sfnp|UNESCO|2021}}\u003cbr\u003e \u003cbr\u003e \u003c!-- ALIGNMENT PROBLEM --\u003e\u003cbr\u003e-[[File:20250202 \"AI\" (search term) on Google Trends.svg|thumb|The number of Google searches for the term \"AI\" accelerated in 2022.]]\u003cbr\u003e In 2016, issues of [[algorithmic fairness|fairness]] and the misuse of technology were catapulted into center stage at machine learning conferences, publications vastly increased, funding became available, and many researchers re-focussed their careers on these issues. The [[AI alignment|alignment problem]] became a serious field of academic study.{{Sfnp|Christian|2020|pp=67, 73}}\u003cbr\u003e \u003cbr\u003e \u003c!-- AI Boom 2020-present --\u003e\u003cbr\u003e-In the late 2010s and early 2020s, [[artificial general intelligence|AGI]] companies began to deliver programs that created enormous interest. In 2015, [[AlphaGo]], developed by [[DeepMind]], beat the world champion [[Go player]]. The program taught only the game's rules and developed a strategy by itself. [[GPT-3]] is a [[large language model]] that was released in 2020 by [[OpenAI]] and is capable of generating high-quality human-like text.\u003cref\u003e{{Cite web |last=Sagar |first=Ram |date=2020-06-03 |title=OpenAI Releases GPT-3, The Largest Model So Far |url=https:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200804173452\u002fhttps:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |archive-date=2020-08-04 |access-date=2023-03-15 |website=Analytics India Magazine}}\u003c\u002fref\u003e [[ChatGPT]], launched on November 30, 2022, became the fastest-growing consumer software application in history, gaining over 100 million users in two months.\u003cref\u003e{{Cite news |last=Milmo |first=Dan |date=2023-02-02 |title=ChatGPT reaches 100 million users two months after launch |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |access-date=2024-12-31 |work=The Guardian |language=en-GB |issn=0261-3077 |archive-date=3 February 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230203051356\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |url-status=live }}\u003c\u002fref\u003e It marked what is widely regarded as AI's breakout year, bringing it into the public consciousness.\u003cref\u003e{{Cite web |last=Gorichanaz |first=Tim |date=2023-11-29 |title=ChatGPT turns 1: AI chatbot's success says as much about humans as technology |url=https:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |access-date=2024-12-31 |website=The Conversation |language=en-US |archive-date=31 December 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241231073513\u002fhttps:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |url-status=live }}\u003c\u002fref\u003e These programs, and others, inspired an aggressive [[AI boom]], where large companies began investing billions of dollars in AI research. According to AI Impacts, about $50 billion annually was invested in \"AI\" around 2022 in the U.S. alone and about 20% of the new U.S. Computer Science PhD graduates have specialized in \"AI\".{{Sfnp|DiFeliciantonio|2023}} About 800,000 \"AI\"-related U.S. job openings existed in 2022.{{Sfnp|Goswami|2023}} According to PitchBook research, 22% of newly funded [[Startup company|startups]] in 2024 claimed to be AI companies.\u003cref\u003e{{cite web | title=Nearly 1 in 4 new startups is an AI company | website=PitchBook | date=2024-12-24 | url=https:\u002f\u002fpitchbook.com\u002fnews\u002farticles\u002fnearly-1-in-4-new-startups-is-an-ai-company | access-date=2025-01-03}}\u003c\u002fref\u003e\u003cbr\u003e+In the late teens and early 2020s, [[artificial general intelligence|AGI]] companies began to deliver programs that created enormous interest. In 2015, [[AlphaGo]], developed by [[DeepMind]], beat the world champion [[Go player]]. The program was taught only the rules of the game and developed strategy by itself. [[GPT-3]] is a [[large language model]] that was released in 2020 by [[OpenAI]] and is capable of generating high-quality human-like text.\u003cref\u003e{{Cite web |last=Sagar |first=Ram |date=2020-06-03 |title=OpenAI Releases GPT-3, The Largest Model So Far |url=https:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200804173452\u002fhttps:\u002f\u002fanalyticsindiamag.com\u002fopen-ai-gpt-3-language-model |archive-date=2020-08-04 |access-date=2023-03-15 |website=Analytics India Magazine}}\u003c\u002fref\u003e [[ChatGPT]], launched on November 30, 2022, became the fastest-growing consumer software application in history, gaining over 100 million users in two months.\u003cref\u003e{{Cite news |last=Milmo |first=Dan |date=2023-02-02 |title=ChatGPT reaches 100 million users two months after launch |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |access-date=2024-12-31 |work=The Guardian |language=en-GB |issn=0261-3077}}\u003c\u002fref\u003e It marked what is widely regarded as AI's breakout year, bringing it into the public consciousness.\u003cref\u003e{{Cite web |last=Gorichanaz |first=Tim |date=2023-11-29 |title=ChatGPT turns 1: AI chatbot\u2019s success says as much about humans as technology |url=https:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |access-date=2024-12-31 |website=The Conversation |language=en-US}}\u003c\u002fref\u003e These programs, and others, inspired an aggressive [[AI boom]], where large companies began investing billions of dollars in AI research. According to AI Impacts, about $50 billion annually was invested in \"AI\" around 2022 in the U.S. alone and about 20% of the new U.S. Computer Science PhD graduates have specialized in \"AI\".{{Sfnp|DiFeliciantonio|2023}} About 800,000 \"AI\"-related U.S. job openings existed in 2022.{{Sfnp|Goswami|2023}}\u003cbr\u003e \u003cbr\u003e == Philosophy ==\u003cbr\u003e {{Main|Philosophy of artificial intelligence}}\u003cbr\u003e@@ -472,13 +472,13 @@\u003cbr\u003e [[Alan Turing]] wrote in 1950 \"I propose to consider the question 'can machines think'?\"{{Sfnp|Turing|1950|p=1}} He advised changing the question from whether a machine \"thinks\", to \"whether or not it is possible for machinery to show intelligent behaviour\".{{Sfnp|Turing|1950|p=1}} He devised the Turing test, which measures the ability of a machine to simulate human conversation.\u003cref name=\"Turing\"\u003eTuring's original publication of the [[Turing test]] in \"[[Computing machinery and intelligence]]\": {{Harvtxt|Turing|1950}}\u003cbr\u003e Historical influence and philosophical implications: {{Harvtxt|Haugeland|1985|pp=6\u20139}}, {{Harvtxt|Crevier|1993|p=24}}, {{Harvtxt|McCorduck|2004|pp=70\u201371}}, {{Harvtxt|Russell|Norvig|2021|pp=2, 984}}\u003c\u002fref\u003e Since we can only observe the behavior of the machine, it does not matter if it is \"actually\" thinking or literally has a \"mind\". Turing notes that [[Problem of other minds|we can not determine these things about other people]] but \"it is usual to have a polite convention that everyone thinks.\"{{Sfnp|Turing|1950|loc=Under \"The Argument from Consciousness\"}}\u003cbr\u003e [[File:Weakness of Turing test 1.svg|thumb|The Turing test can provide some evidence of intelligence, but it penalizes non-human intelligent behavior.\u003cref\u003e{{Cite web |last1=Kirk-Giannini |first1=Cameron Domenico |last2=Goldstein |first2=Simon |date=2023-10-16 |title=AI is closer than ever to passing the Turing test for 'intelligence'. What happens when it does? |url=https:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |access-date=2024-08-17 |website=The Conversation |archive-date=25 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240925040612\u002fhttps:\u002f\u002ftheconversation.com\u002fai-is-closer-than-ever-to-passing-the-turing-test-for-intelligence-what-happens-when-it-does-214721 |url-status=live }}\u003c\u002fref\u003e]]\u003cbr\u003e-[[Stuart J. Russell|Russell]] and [[Norvig]] agree with Turing that intelligence must be defined in terms of external behavior, not internal structure.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} However, they are critical that the test requires the machine to imitate humans. \"[[Aeronautics|Aeronautical engineering]] texts\", they wrote, \"do not define the goal of their field as making 'machines that fly so exactly like [[pigeon]]s that they can fool other pigeons.{{' \"}}{{Sfnp|Russell|Norvig|2021|p=3}} AI founder [[John McCarthy (computer scientist)|John McCarthy]] agreed, writing that \"Artificial intelligence is not, by definition, simulation of human intelligence\".{{Sfnp|Maker|2006}}\u003cbr\u003e-\u003cbr\u003e-McCarthy defines intelligence as \"the computational part of the ability to achieve goals in the world\".{{Sfnp|McCarthy|1999}} Another AI founder, [[Marvin Minsky]], similarly describes it as \"the ability to solve hard problems\".{{Sfnp|Minsky|1986}} The leading AI textbook defines it as the study of agents that perceive their environment and take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} These definitions view intelligence in terms of well-defined problems with well-defined solutions, where both the difficulty of the problem and the performance of the program are direct measures of the \"intelligence\" of the machine\u2014and no other philosophical discussion is required, or may not even be possible.\u003cbr\u003e+[[Stuart J. Russell|Russell]] and [[Norvig]] agree with Turing that intelligence must be defined in terms of external behavior, not internal structure.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} However, they are critical that the test requires the machine to imitate humans. \"[[Aeronautics|Aeronautical engineering]] texts,\" they wrote, \"do not define the goal of their field as making 'machines that fly so exactly like [[pigeon]]s that they can fool other pigeons.{{' \"}}{{Sfnp|Russell|Norvig|2021|p=3}} AI founder [[John McCarthy (computer scientist)|John McCarthy]] agreed, writing that \"Artificial intelligence is not, by definition, simulation of human intelligence\".{{Sfnp|Maker|2006}}\u003cbr\u003e+\u003cbr\u003e+McCarthy defines intelligence as \"the computational part of the ability to achieve goals in the world\".{{Sfnp|McCarthy|1999}} Another AI founder, [[Marvin Minsky]] similarly describes it as \"the ability to solve hard problems\".{{Sfnp|Minsky|1986}} The leading AI textbook defines it as the study of agents that perceive their environment and take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} These definitions view intelligence in terms of well-defined problems with well-defined solutions, where both the difficulty of the problem and the performance of the program are direct measures of the \"intelligence\" of the machine\u2014and no other philosophical discussion is required, or may not even be possible.\u003cbr\u003e \u003cbr\u003e Another definition has been adopted by Google,\u003cref\u003e{{Cite web |title=What Is Artificial Intelligence (AI)? |url=https:\u002f\u002fcloud.google.com\u002flearn\u002fwhat-is-artificial-intelligence |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230731114802\u002fhttps:\u002f\u002fcloud.google.com\u002flearn\u002fwhat-is-artificial-intelligence |archive-date=31 July 2023 |access-date=16 October 2023 |website=[[Google Cloud Platform]]}}\u003c\u002fref\u003e a major practitioner in the field of AI. This definition stipulates the ability of systems to synthesize information as the manifestation of intelligence, similar to the way it is defined in biological intelligence.\u003cbr\u003e \u003cbr\u003e-Some authors have suggested in practice, that the definition of AI is vague and difficult to define, with contention as to whether classical algorithms should be categorised as AI,\u003cref\u003e{{Cite web |title=One of the Biggest Problems in Regulating AI Is Agreeing on a Definition |url=https:\u002f\u002fcarnegieendowment.org\u002fposts\u002f2022\u002f10\u002fone-of-the-biggest-problems-in-regulating-ai-is-agreeing-on-a-definition?lang=en |access-date=2024-07-31 |website=[[Carnegie Endowment for International Peace]]}}\u003c\u002fref\u003e with many companies during the early 2020s AI boom using the term as a marketing [[buzzword]], often even if they did \"not actually use AI in a material way\".\u003cref\u003e{{Cite web |title=AI or BS? How to tell if a marketing tool really uses artificial intelligence |url=https:\u002f\u002fwww.thedrum.com\u002fopinion\u002f2023\u002f03\u002f30\u002fai-or-bs-how-tell-if-marketing-tool-really-uses-artificial-intelligence |access-date=2024-07-31 |website=The Drum}}\u003c\u002fref\u003e\u003cbr\u003e+Some authors have suggested in practice, that the definition of AI is vague and difficult to define, with contention as to whether classical algorithms should be categorised as AI,\u003cref\u003e{{Cite web |title=One of the Biggest Problems in Regulating AI Is Agreeing on a Definition |url=https:\u002f\u002fcarnegieendowment.org\u002fposts\u002f2022\u002f10\u002fone-of-the-biggest-problems-in-regulating-ai-is-agreeing-on-a-definition?lang=en |access-date=2024-07-31 |website=carnegieendowment.org}}\u003c\u002fref\u003e with many companies during the early 2020s AI boom using the term as a marketing [[buzzword]], often even if they did \"not actually use AI in a material way\".\u003cref\u003e{{Cite web |title=AI or BS? How to tell if a marketing tool really uses artificial intelligence |url=https:\u002f\u002fwww.thedrum.com\u002fopinion\u002f2023\u002f03\u002f30\u002fai-or-bs-how-tell-if-marketing-tool-really-uses-artificial-intelligence |access-date=2024-07-31 |website=The Drum}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Evaluating approaches to AI ===\u003cbr\u003e \u003cbr\u003e@@ -549,13 +549,10 @@\u003cbr\u003e === Transhumanism ===\u003cbr\u003e {{Main|Transhumanism}}\u003cbr\u003e \u003c!-- TRANSHUMANISM --\u003e\u003cbr\u003e-Robot designer [[Hans Moravec]], cyberneticist [[Kevin Warwick]] and inventor [[Ray Kurzweil]] have predicted that humans and machines may merge in the future into [[cyborg]]s that are more capable and powerful than either. This idea, called transhumanism, has roots in the writings of [[Aldous Huxley]] and [[Robert Ettinger]].\u003cref\u003e[[Transhumanism]]: {{Harvtxt|Moravec|1988}}, {{Harvtxt|Kurzweil|2005}}, {{Harvtxt|Russell|Norvig|2021|p=1005}}\u003c\u002fref\u003e\u003cbr\u003e+Robot designer [[Hans Moravec]], cyberneticist [[Kevin Warwick]] and inventor [[Ray Kurzweil]] have predicted that humans and machines may merge in the future into [[cyborg]]s that are more capable and powerful than either. This idea, called [[transhumanism]], has roots in the writings of [[Aldous Huxley]] and [[Robert Ettinger]].\u003cref\u003e[[Transhumanism]]: {{Harvtxt|Moravec|1988}}, {{Harvtxt|Kurzweil|2005}}, {{Harvtxt|Russell|Norvig|2021|p=1005}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- EVOLUTION \u002f HUMAN REPLACEMENT --\u003e\u003cbr\u003e [[Edward Fredkin]] argues that \"artificial intelligence is the next step in evolution\", an idea first proposed by [[Samuel Butler (novelist)|Samuel Butler]]'s \"[[Darwin among the Machines]]\" as far back as 1863, and expanded upon by [[George Dyson (science historian)|George Dyson]] in his 1998 book ''[[Darwin Among the Machines#Evolution of Global Intelligence|Darwin Among the Machines: The Evolution of Global Intelligence]]''.\u003cref\u003eAI as evolution: [[Edward Fredkin]] is quoted in {{Harvtxt|McCorduck|2004|p=401}}, {{Harvtxt|Butler|1863}}, {{Harvtxt|Dyson|1998}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-===Decomputing===\u003cbr\u003e-Arguments for ''decomputing'' have been raised by [[Dan McQuillan]] (''Resisting AI: An Anti-fascist Approach to Artificial Intelligence'', 2022), meaning an opposition to the sweeping application and expansion of artificial intelligence. Similar to [[degrowth]], the approach criticizes AI as an outgrowth of the systemic issues and capitalist world we live in. It argues that a different future is possible, in which distance between people is reduced rather than increased through AI intermediaries.\u003cref name=\"v935\"\u003e{{cite web | last=McQuillan | first=Dan | title=a gift to the far right | website=ComputerWeekly.com | date=2025-01-14 | url=https:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == In fiction ==\u003cbr\u003e {{Main|Artificial intelligence in fiction}}\u003cbr\u003e@@ -575,17 +572,16 @@\u003cbr\u003e * {{Annotated link |Behavior selection algorithm}}\u003cbr\u003e * {{Annotated link |Business process automation}}\u003cbr\u003e * {{Annotated link |Case-based reasoning}}\u003cbr\u003e-* {{Annotated link|Computational intelligence}}\u003cbr\u003e-* {{Annotated link|Digital immortality}}\u003cbr\u003e+* {{Anl|Computational intelligence}}\u003cbr\u003e+* {{Anl|Digital immortality}}\u003cbr\u003e * {{Annotated link |Emergent algorithm}}\u003cbr\u003e * {{Annotated link |Female gendering of AI technologies}}\u003cbr\u003e * {{An
