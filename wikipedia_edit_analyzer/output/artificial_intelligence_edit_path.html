olume=6 |issue=2 |pages=94\u201398 |doi=10.7861\u002ffuturehosp.6-2-94 |pmc=6616181 |pmid=31363513}}\u003c\u002fref\u003e Through the lens of the [[Hippocratic Oath]], medical professionals are ethically compelled to use AI, if applications can more accurately diagnose and treat patients.\u003cref\u003e{{Cite journal |last1=Lyakhova |first1=U.A. |last2=Lyakhov |first2=P.A. |date=2024 |title=Systematic review of approaches to detection and classification of skin cancer using artificial intelligence: Development and prospects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |journal=Computers in Biology and Medicine |language=en |volume=178 |pages=108742 |doi=10.1016\u002fj.compbiomed.2024.108742 |pmid=38875908 |archive-date=3 December 2024 |access-date=10 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241203172502\u002fhttps:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0010482524008278 |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Alqudaihi |first1=Kawther S. |last2=Aslam |first2=Nida |last3=Khan |first3=Irfan Ullah |last4=Almuhaideb |first4=Abdullah M. |last5=Alsunaidi |first5=Shikah J. |last6=Ibrahim |first6=Nehad M. Abdel Rahman |last7=Alhaidari |first7=Fahd A. |last8=Shaikh |first8=Fatema S. |last9=Alsenbel |first9=Yasmine M. |last10=Alalharith |first10=Dima M. |last11=Alharthi |first11=Hajar M. |last12=Alghamdi |first12=Wejdan M. |last13=Alshahrani |first13=Mohammed S. |date=2021 |title=Cough Sound Detection and Diagnosis Using Artificial Intelligence Techniques: Challenges and Opportunities |journal=IEEE Access |volume=9 |pages=102327\u2013102344 |doi=10.1109\u002fACCESS.2021.3097559 |issn=2169-3536 |pmc=8545201 |pmid=34786317|bibcode=2021IEEEA...9j2327A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e For medical research, AI is an important tool for processing and integrating [[big data]]. This is particularly important for [[organoid]] and [[tissue engineering]] development which use [[microscopy]] imaging as a key technique in fabrication.\u003cref name=\"Bax-2023\"\u003e{{Cite journal |last1=Bax |first1=Monique |last2=Thorpe |first2=Jordan |last3=Romanov |first3=Valentin |date=December 2023 |title=The future of personalized cardiovascular medicine demands 3D and 4D printing, stem cells, and artificial intelligence |journal=Frontiers in Sensors |volume=4 |doi=10.3389\u002ffsens.2023.1294721 |issn=2673-5067 |doi-access=free}}\u003c\u002fref\u003e It has been suggested that AI can overcome discrepancies in funding allocated to different fields of research.\u003cref name=\"Bax-2023\"\u002f\u003e New AI tools can deepen the understanding of biomedically relevant pathways. For example, [[AlphaFold 2]] (2021) demonstrated the ability to approximate, in hours rather than months, the 3D [[Protein structure|structure of a protein]].\u003cref\u003e{{Cite journal |last1=Jumper |first1=J |last2=Evans |first2=R |last3=Pritzel |first3=A |date=2021 |title=Highly accurate protein structure prediction with AlphaFold |journal=Nature |volume=596 |issue=7873 |pages=583\u2013589 |bibcode=2021Natur.596..583J |doi=10.1038\u002fs41586-021-03819-2 |pmc=8371605 |pmid=34265844}}\u003c\u002fref\u003e In 2023, it was reported that AI-guided drug discovery helped find a class of antibiotics capable of killing two different types of drug-resistant bacteria.\u003cref\u003e{{Cite web |date=2023-12-20 |title=AI discovers new class of antibiotics to kill drug-resistant bacteria |url=https:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |access-date=5 October 2024 |archive-date=16 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240916014421\u002fhttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2409706-ai-discovers-new-class-of-antibiotics-to-kill-drug-resistant-bacteria\u002f |url-status=live }}\u003c\u002fref\u003e In 2024, researchers used machine learning to accelerate the search for [[Parkinson's disease]] drug treatments. Their aim was to identify compounds that block the clumping, or aggregation, of [[alpha-synuclein]] (the protein that characterises Parkinson's disease). They were able to speed up the initial screening process ten-fold and reduce the cost by a thousand-fold.\u003cref\u003e{{Cite web |date=2024-04-17 |title=AI speeds up drug design for Parkinson's ten-fold |url=https:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |publisher=Cambridge University |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005165755\u002fhttps:\u002f\u002fwww.cam.ac.uk\u002fresearch\u002fnews\u002fai-speeds-up-drug-design-for-parkinsons-ten-fold |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Horne |first1=Robert I. |last2=Andrzejewska |first2=Ewa A. |last3=Alam |first3=Parvez |last4=Brotzakis |first4=Z. Faidon |last5=Srivastava |first5=Ankit |last6=Aubert |first6=Alice |last7=Nowinska |first7=Magdalena |last8=Gregory |first8=Rebecca C. |last9=Staats |first9=Roxine |last10=Possenti |first10=Andrea |last11=Chia |first11=Sean |last12=Sormanni |first12=Pietro |last13=Ghetti |first13=Bernardino |last14=Caughey |first14=Byron |last15=Knowles |first15=Tuomas P. J. |last16=Vendruscolo |first16=Michele |date=2024-04-17 |title=Discovery of potent inhibitors of \u03b1-synuclein aggregation using structure-based iterative learning |journal=Nature Chemical Biology |publisher=Nature |volume=20 |issue=5 |pages=634\u2013645 |doi=10.1038\u002fs41589-024-01580-x |pmc=11062903 |pmid=38632492}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Sexuality ===\u003cbr\u003e \u003cbr\u003e-Applications of AI in this domain include AI-enabled menstruation and fertility trackers that analyze user data to offer prediction,\u003cref\u003e{ :\u002f\u002fwww.972mag.com\u002flavender-ai-israeli-army-gaza\u002f |access-date=2024-04-06 |website=+972 Magazine |language=en-US |archive-date=10 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241010022042\u002fhttps:\u002f\u002fwww.972mag.com\u002flavender-ai-israeli-army-gaza\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref name=\"Davies-2023\"\u003e{{Cite news |last1=Davies |first1=Harry |last2=McKernan |first2=Bethan |last3=Sabbagh |first3=Dan |date=2023-12-01 |title='The Gospel': how Israel uses AI to select bombing targets in Gaza |language=en-GB |work=The Guardian |url=https:\u002f\u002fwww.theguardian.com\u002fworld\u002f2023\u002fdec\u002f01\u002fthe-gospel-how-israel-uses-ai-to-select-bombing-targets |access-date=2023-12-04 |archive-date=6 December 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231206213901\u002fhttps:\u002f\u002fwww.theguardian.com\u002fworld\u002f2023\u002fdec\u002f01\u002fthe-gospel-how-israel-uses-ai-to-select-bombing-targets |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite news|last=Marti|first=J Werner|title=Drohnen haben den Krieg in der Ukraine revolutioniert, doch sie sind empfindlich auf St\u00f6rsender \u2013 deshalb sollen sie jetzt autonom operieren|url=https:\u002f\u002fwww.nzz.ch\u002finternational\u002fdie-ukraine-setzt-auf-drohnen-die-autonom-navigieren-und-toeten-koennen-ld.1838731|date=10 August 2024|access-date=10 August 2024|newspaper=Neue Z\u00fcrcher Zeitung|lang=German|archive-date=10 August 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240810054043\u002fhttps:\u002f\u002fwww.nzz.ch\u002finternational\u002fdie-ukraine-setzt-auf-drohnen-die-autonom-navigieren-und-toeten-koennen-ld.1838731|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Generative AI ===\u003cbr\u003e [[File:Vincent van Gogh in watercolour.png|thumb|[[Vincent van Gogh]] in watercolour created by generative AI software]]{{Excerpt|Generative artificial intelligence|only=paragraphs|paragraphs=1-3}}\u003cbr\u003e@@ -252,7 +252,7 @@\u003cbr\u003e \u003cbr\u003e Artificial intelligence is used in astronomy to analyze increasing amounts of available data and applications, mainly for \"classification, regression, clustering, forecasting, generation, discovery, and the development of new scientific insights.\" For example, it is used for discovering exoplanets, forecasting solar activity, and distinguishing between signals and instrumental effects in gravitational wave astronomy. Additionally, it could be used for activities in space, such as space exploration, including the analysis of data from space missions, real-time science decisions of spacecraft, space debris avoidance, and more autonomous operation.\u003cbr\u003e \u003cbr\u003e-During the [[2024 Indian general election|2024 Indian elections]], US$50 millions was spent on authorized AI-generated content, notably by creating [[deepfake]]s of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us}}\u003c\u002fref\u003e\u003cbr\u003e+During the [[2024 Indian general election|2024 Indian elections]], US$50 millions was spent on authorized AI-generated content, notably by creating [[deepfake]]s of allied (including sometimes deceased) politicians to better engage with voters, and by translating speeches to various local languages.\u003cref\u003e{{Cite web |date=2024-06-12 |title=India's latest election embraced AI technology. Here are some ways it was used constructively |url=https:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |access-date=2024-10-28 |website=PBS News |language=en-us |archive-date=17 September 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240917194950\u002fhttps:\u002f\u002fwww.pbs.org\u002fnewshour\u002fworld\u002findias-latest-election-embraced-ai-technology-here-are-some-ways-it-was-used-constructively |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Ethics==\u003cbr\u003e {{Main|Ethics of artificial intelligence}}\u003cbr\u003e@@ -290,9 +290,9 @@\u003cbr\u003e \u003cbr\u003e In September 2024, [[Microsoft]] announced an agreement with [[Constellation Energy]] to re-open the [[Three Mile Island]] nuclear power plant to provide Microsoft with 100% of all electric power produced by the plant for 20 years. Reopening the plant, which suffered a partial nuclear meltdown of its Unit 2 reactor in 1979, will require Constellation to get through strict regulatory processes which will include extensive safety scrutiny from the US [[Nuclear Regulatory Commission]]. If approved (this will be the first ever US re-commissioning of a nuclear plant), over 835 megawatts of power \u2013 enough for 800,000 homes \u2013 of energy will be produced. The cost for re-opening and upgrading is estimated at $1.6 billion (US) and is dependent on tax breaks for nuclear power contained in the 2022 US [[Inflation Reduction Act]].\u003cref\u003e{{Cite news |last=Halper |first=Evan |date=20 September 2024 |title=Microsoft deal would reopen Three Mile Island nuclear plant to power AI |url=https:\u002f\u002fwww.washingtonpost.com\u002fbusiness\u002f2024\u002f09\u002f20\u002fmicrosoft-three-mile-island-nuclear-constellation |newspaper=Washington Post}}\u003c\u002fref\u003e The US government and the state of Michigan are investing almost $2 billion (US) to reopen the [[Palisades Nuclear Generating Station|Palisades Nuclear]] reactor on Lake Michigan. Closed since 2022, the plant is planned to be reopened in October 2025. The Three Mile Island facility will be renamed the Crane Clean Energy Center after Chris Crane, a nuclear proponent and former CEO of [[Exelon]] who was responsible for Exelon spinoff of Constellation.\u003cref\u003e{{Cite news |last=Hiller |first=Jennifer |date=20 September 2024 |title=Three Mile Island's Nuclear Plant to Reopen, Help Power Microsoft's AI Centers |url=https:\u002f\u002fwww.wsj.com\u002fbusiness\u002fenergy-oil\u002fthree-mile-islands-nuclear-plant-to-reopen-help-power-microsofts-ai-centers-aebfb3c8?mod=Searchresults_pos1&page=1 |work=Wall Street Journal |publisher=Dow Jones |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170152\u002fhttps:\u002f\u002fwww.wsj.com\u002fbusiness\u002fenergy-oil\u002fthree-mile-islands-nuclear-plant-to-reopen-help-power-microsofts-ai-centers-aebfb3c8?mod=Searchresults_pos1&page=1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-After the last approval in September 2023, [[Taiwan]] suspended the approval of data centers north of [[Taoyuan, Taiwan|Taoyuan]] with a capacity of more than 5 MW in 2024, due to power supply shortages.\u003cref name=\"DatacenterDynamics\"\u003e{{Cite news |author=Niva Yadav |date=19 August 2024 |title=Taiwan to stop large data centers in the North, cites insufficient power |url=https:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |publisher=DatacenterDynamics}}\u003c\u002fref\u003e Taiwan aims to [[Nuclear power phase-out|phase out nuclear power]] by 2025.\u003cref name=\"DatacenterDynamics\" \u002f\u003e On the other hand, [[Singapore]] imposed a ban on the opening of data centers in 2019 due to electric power, but in 2022, lifted this ban.\u003cref name=\"DatacenterDynamics\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-Although most nuclear plants in Japan have been shut down after the 2011 [[Fukushima nuclear accident]], according to an October 2024 ''Bloomberg'' article in Japanese, cloud gaming services company Ubitus, in which Nvidia has a stake, is looking for land in Japan near nuclear power plant for a new data center for generative AI.\u003cref name=bloombergjp\u003e{{Cite news |last1=Mochizuki  |first1=Takashi |last2=Oda |first2=Shoko |date=18 October 2024 |title=\u30a8\u30cc\u30d3\u30c7\u30a3\u30a2\u51fa\u8cc7\u306e\u65e5\u672c\u4f01\u696d\u3001\u539f\u767a\u8fd1\u304f\u3067\uff21\uff29\u30c7\u30fc\u30bf\u30bb\u30f3\u30bf\u30fc\u65b0\u8a2d\u691c\u8a0e|url=https:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |newspaper=Bloomberg |language=Japanese}}\u003c\u002fref\u003e Ubitus CEO Wesley Kuo said nuclear power plants are the most efficient, cheap and stable power for AI.\u003cref name=bloombergjp \u002f\u003e\u003cbr\u003e+After the last approval in September 2023, [[Taiwan]] suspended the approval of data centers north of [[Taoyuan, Taiwan|Taoyuan]] with a capacity of more than 5 MW in 2024, due to power supply shortages.\u003cref name=\"DatacenterDynamics\"\u003e{{Cite news |author=Niva Yadav |date=19 August 2024 |title=Taiwan to stop large data centers in the North, cites insufficient power |url=https:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |publisher=DatacenterDynamics |archive-date=8 November 2024 |access-date=7 November 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241108213650\u002fhttps:\u002f\u002fwww.datacenterdynamics.com\u002fen\u002fnews\u002ftaiwan-to-stop-large-data-centers-in-the-north-cites-insufficient-power\u002f |url-status=live }}\u003c\u002fref\u003e Taiwan aims to [[Nuclear power phase-out|phase out nuclear power]] by 2025.\u003cref name=\"DatacenterDynamics\" \u002f\u003e On the other hand, [[Singapore]] imposed a ban on the opening of data centers in 2019 due to electric power, but in 2022, lifted this ban.\u003cref name=\"DatacenterDynamics\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Although most nuclear plants in Japan have been shut down after the 2011 [[Fukushima nuclear accident]], according to an October 2024 ''Bloomberg'' article in Japanese, cloud gaming services company Ubitus, in which Nvidia has a stake, is looking for land in Japan near nuclear power plant for a new data center for generative AI.\u003cref name=bloombergjp\u003e{{Cite news |last1=Mochizuki |first1=Takashi |last2=Oda |first2=Shoko |date=18 October 2024 |title=\u30a8\u30cc\u30d3\u30c7\u30a3\u30a2\u51fa\u8cc7\u306e\u65e5\u672c\u4f01\u696d\u3001\u539f\u767a\u8fd1\u304f\u3067\uff21\uff29\u30c7\u30fc\u30bf\u30bb\u30f3\u30bf\u30fc\u65b0\u8a2d\u691c\u8a0e |url=https:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |newspaper=Bloomberg |language=Japanese |archive-date=8 November 2024 |access-date=7 November 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241108213843\u002fhttps:\u002f\u002fwww.bloomberg.co.jp\u002fnews\u002farticles\u002f2024-10-18\u002fSLHGKKT0AFB400 |url-status=live }}\u003c\u002fref\u003e Ubitus CEO Wesley Kuo said nuclear power plants are the most efficient, cheap and stable power for AI.\u003cref name=bloombergjp \u002f\u003e\u003cbr\u003e \u003cbr\u003e On 1 November 2024, the [[Federal Energy Regulatory Commission]] (FERC) rejected an application submitted by [[Talen Energy]] for approval to supply some electricity from the nuclear power station [[Susquehanna Steam Electric Station|Susquehanna]] to Amazon's data center.\u003cref name=\"Bloomberg20241104\"\u003e{{Cite news |author=Naureen S Malik and Will Wade |date=5 November 2024 |title=Nuclear-Hungry AI Campuses Need New Plan to Find Power Fast |url=https:\u002f\u002fwww.bloomberg.com\u002fnews\u002farticles\u002f2024-11-04\u002fnuclear-hungry-ai-campuses-need-new-strategy-to-find-power-fast |publisher=Bloomberg}}\u003c\u002fref\u003e \u003cbr\u003e According to the Commission Chairman [[Willie L. Phillips]], it is a burden on the electricity grid as well as a significant cost shifting concern to households and other business sectors.\u003cref name=\"Bloomberg20241104\" \u002f\u003e\u003cbr\u003e@@ -371,7 +371,7 @@\u003cbr\u003e \u003c!-- Warnings of existential risk --\u003e\u003cbr\u003e The opinions amongst experts and industry insiders are mixed, with sizable fractions both concerned and unconcerned by risk from eventual superintelligent AI.{{Sfnp|M\u00fcller|Bostrom|2014}} Personalities such as [[Stephen Hawking]], [[Bill Gates]], and [[Elon Musk]],\u003cref\u003eLeaders' concerns about the existential risks of AI around 2015: {{Harvtxt|Rawlinson|2015}}, {{Harvtxt|Holley|2015}}, {{Harvtxt|Gibbs|2014}}, {{Harvtxt|Sainato|2015}}\u003c\u002fref\u003e as well as AI pioneers such as [[Yoshua Bengio]], [[Stuart J. Russell|Stuart Russell]], [[Demis Hassabis]], and [[Sam Altman]], have expressed concerns about existential risk from AI.\u003cbr\u003e \u003cbr\u003e-In May 2023, [[Geoffrey Hinton]] announced his resignation from Google in order to be able to \"freely speak out about the risks of AI\" without \"considering how this impacts Google.\"\u003cref\u003e{{Cite news |date=25 March 2023 |title=\"Godfather of artificial intelligence\" talks impact and potential of new AI |url=https:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230328225221\u002fhttps:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |archive-date=28 March 2023 |access-date=2023-03-28 |work=CBS News}}\u003c\u002fref\u003e He notably mentioned risks of an [[AI takeover]],\u003cref\u003e{{Cite news |last=Pittis |first=Don |date=May 4, 2023 |title=Canadian artificial intelligence leader Geoffrey Hinton piles on fears of computer takeover |url=https:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |work=CBC |access-date=5 October 2024 |archive-date=7 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240707032135\u002fhttps:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |url-status=live }}\u003c\u002fref\u003e and stressed that in order to avoid the worst outcomes, establishing safety guidelines will require cooperation among those competing in use of AI.\u003cref\u003e{{Cite web |date=2024-06-14 |title='50\u201350 chance' that AI outsmarts humanity, Geoffrey Hinton says |url=https:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |access-date=2024-07-06 |website=Bloomberg BNN}}\u003c\u002fref\u003e\u003cbr\u003e+In May 2023, [[Geoffrey Hinton]] announced his resignation from Google in order to be able to \"freely speak out about the risks of AI\" without \"considering how this impacts Google.\"\u003cref\u003e{{Cite news |date=25 March 2023 |title=\"Godfather of artificial intelligence\" talks impact and potential of new AI |url=https:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230328225221\u002fhttps:\u002f\u002fwww.cbsnews.com\u002fvideo\u002fgodfather-of-artificial-intelligence-talks-impact-and-potential-of-new-ai |archive-date=28 March 2023 |access-date=2023-03-28 |work=CBS News}}\u003c\u002fref\u003e He notably mentioned risks of an [[AI takeover]],\u003cref\u003e{{Cite news |last=Pittis |first=Don |date=May 4, 2023 |title=Canadian artificial intelligence leader Geoffrey Hinton piles on fears of computer takeover |url=https:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |work=CBC |access-date=5 October 2024 |archive-date=7 July 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240707032135\u002fhttps:\u002f\u002fwww.cbc.ca\u002fnews\u002fbusiness\u002fai-doom-column-don-pittis-1.6829302 |url-status=live }}\u003c\u002fref\u003e and stressed that in order to avoid the worst outcomes, establishing safety guidelines will require cooperation among those competing in use of AI.\u003cref\u003e{{Cite web |date=2024-06-14 |title='50\u201350 chance' that AI outsmarts humanity, Geoffrey Hinton says |url=https:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |access-date=2024-07-06 |website=Bloomberg BNN |archive-date=14 June 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240614144506\u002fhttps:\u002f\u002fwww.bnnbloomberg.ca\u002f50-50-chance-that-ai-outsmarts-humanity-geoffrey-hinton-says-1.2085394 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2023, many leading AI experts endorsed [[Statement on AI risk of extinction|the joint statement]] that \"Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war\".{{Sfnp|Valance|2023}}\u003cbr\u003e \u003cbr\u003e@@ -399,7 +399,7 @@\u003cbr\u003e * '''Care''' for the wellbeing of everyone\u003cbr\u003e * '''Protect''' social values, justice, and the public interest\u003cbr\u003e \u003cbr\u003e-Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal |last1=Floridi |first1=Luciano |last2=Cowls |first2=Josh |date=2019-06-23 |title=A Unified Framework of Five Principles for AI in Society |url=https:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |journal=Harvard Data Science Review |volume=1 |issue=1 |doi=10.1162\u002f99608f92.8cd550d1 |s2cid=198775713 |doi-access=free}}\u003c\u002fref\u003e however, these principles do not go without their criticisms, especially regards to the people chosen contributes to these frameworks.\u003cref\u003e{{Cite journal |last1=Buruk |first1=Banu |last2=Ekmekci |first2=Perihan Elif |last3=Arda |first3=Berna |date=2020-09-01 |title=A critical perspective on guidelines for responsible and trustworthy artificial intelligence |url=https:\u002f\u002fdoi.org\u002f10.1007\u002fs11019-020-09948-1 |journal=Medicine, Health Care and Philosophy |volume=23 |issue=3 |pages=387\u2013399 |doi=10.1007\u002fs11019-020-09948-1 |issn=1572-8633 |pmid=32236794 |s2cid=214766800 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170206\u002fhttps:\u002f\u002flink.springer.com\u002farticle\u002f10.1007\u002fs11019-020-09948-1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Other developments in ethical frameworks include those decided upon during the [[Asilomar Conference on Beneficial AI|Asilomar Conference]], the Montreal Declaration for Responsible AI, and the IEEE's Ethics of Autonomous Systems initiative, among others;\u003cref\u003e{{Cite journal |last1=Floridi |first1=Luciano |last2=Cowls |first2=Josh |date=2019-06-23 |title=A Unified Framework of Five Principles for AI in Society |url=https:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |journal=Harvard Data Science Review |volume=1 |issue=1 |doi=10.1162\u002f99608f92.8cd550d1 |s2cid=198775713 |doi-access=free |archive-date=7 August 2019 |access-date=5 December 2023 |archive-url=https:\u002f\u002farchive.today\u002f20190807202909\u002fhttps:\u002f\u002fhdsr.mitpress.mit.edu\u002fpub\u002fl0jsh9d1 |url-status=live }}\u003c\u002fref\u003e however, these principles do not go without their criticisms, especially regards to the people chosen contributes to these frameworks.\u003cref\u003e{{Cite journal |last1=Buruk |first1=Banu |last2=Ekmekci |first2=Perihan Elif |last3=Arda |first3=Berna |date=2020-09-01 |title=A critical perspective on guidelines for responsible and trustworthy artificial intelligence |url=https:\u002f\u002fdoi.org\u002f10.1007\u002fs11019-020-09948-1 |journal=Medicine, Health Care and Philosophy |volume=23 |issue=3 |pages=387\u2013399 |doi=10.1007\u002fs11019-020-09948-1 |issn=1572-8633 |pmid=32236794 |s2cid=214766800 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170206\u002fhttps:\u002f\u002flink.springer.com\u002farticle\u002f10.1007\u002fs11019-020-09948-1 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Promotion of the wellbeing of the people and communities that these technologies affect requires consideration of the social and ethical implications at all stages of AI system design, development and implementation, and collaboration between job roles such as data scientists, product managers, data engineers, domain experts, and delivery managers.\u003cref\u003e{{Cite journal |last1=Kamila |first1=Manoj Kumar |last2=Jasrotia |first2=Sahil Singh |date=2023-01-01 |title=Ethical issues in the development of artificial intelligence: recognizing the risks |url=https:\u002f\u002fdoi.org\u002f10.1108\u002fIJOES-05-2023-0107 |journal=International Journal of Ethics and Systems |volume=ahead-of-print |issue=ahead-of-print |doi=10.1108\u002fIJOES-05-2023-0107 |issn=2514-9369 |s2cid=259614124 |access-date=5 October 2024 |archive-date=5 October 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241005170207\u002fhttps:\u002f\u002fwww.emerald.com\u002finsight\u002fcontent\u002fdoi\u002f10.1108\u002fIJOES-05-2023-0107\u002ffull\u002fhtml |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -456,7 +456,7 @@\u003cbr\u003e In 2016, issues of [[algorithmic fairness|fairness ai-gpt-3-language-model |archive-date=2020-08-04 |access-date=2023-03-15 |website=Analytics India Magazine}}\u003c\u002fref\u003e [[ChatGPT]], launched on November 30, 2022, became the fastest-growing consumer software application in history, gaining over 100 million users in two months.\u003cref\u003e{{Cite news |last=Milmo |first=Dan |date=2023-02-02 |title=ChatGPT reaches 100 million users two months after launch |url=https:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |access-date=2024-12-31 |work=The Guardian |language=en-GB |issn=0261-3077 |archive-date=3 February 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230203051356\u002fhttps:\u002f\u002fwww.theguardian.com\u002ftechnology\u002f2023\u002ffeb\u002f02\u002fchatgpt-100-million-users-open-ai-fastest-growing-app |url-status=live }}\u003c\u002fref\u003e It marked what is widely regarded as AI's breakout year, bringing it into the public consciousness.\u003cref\u003e{{Cite web |last=Gorichanaz |first=Tim |date=2023-11-29 |title=ChatGPT turns 1: AI chatbot\u2019s success says as much about humans as technology |url=https:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |access-date=2024-12-31 |website=The Conversation |language=en-US |archive-date=31 December 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20241231073513\u002fhttps:\u002f\u002ftheconversation.com\u002fchatgpt-turns-1-ai-chatbots-success-says-as-much-about-humans-as-technology-218704 |url-status=live }}\u003c\u002fref\u003e These programs, and others, inspired an aggressive [[AI boom]], where large companies began investing billions of dollars in AI research. According to AI Impacts, about $50 billion annually was invested in \"AI\" around 2022 in the U.S. alone and about 20% of the new U.S. Computer Science PhD graduates have specialized in \"AI\".{ tps:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == In fiction ==\u003cbr\u003e {{Main|Artificial intelligence in fiction}}","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -551,7 +551,7 @@\u003cbr\u003e [[Edward Fredkin]] argues that \"artificial intelligence is the next step in evolution\", an idea first proposed by [[Samuel Butler (novelist)|Samuel Butler]]'s \"[[Darwin among the Machines]]\" as far back as 1863, and expanded upon by [[George Dyson (science historian)|George Dyson]] in his 1998 book ''[[Darwin Among the Machines#Evolution of Global Intelligence|Darwin Among the Machines: The Evolution of Global Intelligence]]''.\u003cref\u003eAI as evolution: [[Edward Fredkin]] is quoted in {{Harvtxt|McCorduck|2004|p=401}}, {{Harvtxt|Butler|1863}}, {{Harvtxt|Dyson|1998}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Decomputing===\u003cbr\u003e-Arguments for ''decomputing'' have been raised, meaning an opposition to the sweeping application and expansion of artificial intelligence. Similar to [[degrowth]] the approach criticizes AI as an outgrowth of the systemic issues and capitalist world we live in. Arguing that a different future is possible, in which distance between people is reduced and not increased to AI intermediaries.\u003cref name=\"v935\"\u003e{{cite web | last=McQuillan | first=Dan | title=a gift to the far right | website=ComputerWeekly.com | date=2025-01-14 | url=https:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e+Arguments for ''decomputing'' have been raised by [[Dan McQuillan]] (''Resisting AI: An Anti-fascist Approach to Artificial Intelligence'', 2022), meaning an opposition to the sweeping application and expansion of artificial intelligence. Similar to [[degrowth]] the approach criticizes AI as an outgrowth of the systemic issues and capitalist world we live in. Arguing that a different future is possible, in which distance between people is reduced and not increased to AI intermediaries.\u003cref name=\"v935\"\u003e{{cite web | last=McQuillan | first=Dan | title=a gift to the far right | website=ComputerWeekly.com | date=2025-01-14 | url=https:\u002f\u002fwww.computerweekly.com\u002fopinion\u002fLabours-AI-Action-Plan-a-gift-to-the-far-right | access-date=2025-01-22}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == In fiction ==\u003cbr\u003e {{Main|Artificial intelligence in fiction}}","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Artificial intelligence}}\u003c!-- portal --\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- DEFINITIONS --\u003e\u003cbr\u003e-'''Artificial intelligence''' ('''AI'''), in its broadest sense, is [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e+'''Artificial intelligence''' ('''AI'''), in its broadest sense, is the imitation of [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]\u003cref\u003e https:\u002f\u002fdoi.org\u002f10.1007\u002f978-3-031-21448-6_2\u003c\u002fref\u003e. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e","--- Revision 87\u003cbr\u003e+++ Revision 88\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Artificial intelligence}}\u003c!-- portal --\u003e\u003cbr\u003e \u003cbr\u003e \u003c!-- DEFINITIONS --\u003e\u003cbr\u003e-'''Artificial intelligence''' ('''AI'''), in its broadest sense, is the imitation of [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]\u003cref\u003e https:\u002f\u002fdoi.org\u002f10.1007\u002f978-3-031-21448-6_2\u003c\u002fref\u003e. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e+'''Artificial intelligence''' ('''AI'''), in its broadest sense, is the imitation of [[intelligence]] exhibited by [[machine]]s, particularly [[computer|computer systems]]\u003cref\u003e {{Citation |last=Sheikh |first=Haroon |title=Artificial Intelligence: Definition and Background |date=2023 |work=Mission AI: The New System Technology |pages=15\u201341 |editor-last=Sheikh |editor-first=Haroon |url=https:\u002f\u002flink.springer.com\u002fchapter\u002f10.1007\u002f978-3-031-21448-6_2 |access-date=2025-01-25 |place=Cham |publisher=Springer International Publishing |language=en |doi=10.1007\u002f978-3-031-21448-6_2 |isbn=978-3-031-21448-6 |last2=Prins |first2=Corien |last3=Schrijvers |first3=Erik |editor2-last=Prins |editor2-first=Corien |editor3-last=Schrijvers |editor3-first=Erik}}\u003c\u002fref\u003e. It is a [[field of research]] in [[computer science]] that develops and studies methods and [[software]] that enable machines to [[Machine perception|perceive their environment]] and use [[machine learning|learning]] and intelligence to take actions that maximize their chances of achieving defined goals.{{Sfnp|Russell|Norvig|2021|pp=1\u20134}} Such machines may be called AIs.\u003cbr\u003e \u003cbr\u003e \u003c!-- APPLICATIONS --\u003e\u003cbr\u003e High-profile [[applications of AI]] include advanced [[web search engine]]s (e.g., [[Google Search]]); [[recommendation systems]] (used by [[YouTube]], [[Amazon (company)|Amazon]], and [[Netflix]]); [[virtual assistant]]s (e.g., [[Google Assistant]], [[Siri]], and [[Amazon Alexa|Alexa]]); [[autonomous vehicles]] (e.g., [[Waymo]]); [[Generative artificial intelligence|generative]] and [[Computational creativity|creative]] tools (e.g., [[ChatGPT]] and [[AI art]]); and [[Superintelligence|superhuman]] play and analysis in [[strategy game]]s (e.g., [[chess]] and [[Go (game)|Go]]). However, many AI applications are not perceived as AI: \"A lot of cutting edge AI has filtered into general applications, often without being called AI because once something becomes useful enough and common enough it's [[AI effect|not labeled AI anymore]].\"\u003cref\u003e[http:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f AI set to exceed human brain power] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080219001624\u002fhttp:\u002f\u002fwww.cnn.com\u002f2006\u002fTECH\u002fscience\u002f07\u002f24\u002fai.bostrom\u002f|date=2008-02-19}} CNN.com (July 26, 2006)\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Kaplan |first1=Andreas |last2=Haenlein |first2=Michael |date=2019 |title=Siri, Siri, in my hand: Who's the fairest in the land? On the interpretations, illustrations, and implications of artificial intelligence |journal=Business Horizons |volume=62 |pages=15\u201325 |doi=10.1016\u002fj.bushor.2018.08.004 |issn=0007-6813 |s2cid=158433736}}\u003c\u002fref\u003e"],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"6mC\u002fP5pC1D82kDVAk4w3QIebMUCXyD5AsXjrQBAo80C0JPJAtUTvQIyC7kA="},"y":{"dtype":"f4","bdata":"HkzcwFc75MBGNtrAOBfawG5C3cAF7tTAfv\u002fHQNpRy0CufMVA\u002f7jFQARdw0A="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fext
