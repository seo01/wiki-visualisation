
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Edit Path Batch Summary</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        h1 { text-align: center; margin-bottom: 30px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); /* Responsive 2 columns */
            gap: 30px;
        }
        .grid-item {
            border: 1px solid #ccc;
            padding: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex; /* Use flexbox for internal layout */
            flex-direction: column;
        }
        .grid-item h2 { margin-top: 0; font-size: 1.2em; }
        .grid-item iframe {
            border: none;
            width: 100%;
            height: 500px; /* Adjust height as needed */
            flex-grow: 1; /* Allow iframe to fill available space */
        }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Wikipedia Edit Path Batch Summary</h1>
    <p>Results ordered by prediction error (lower is better).</p>
    <div class="grid-container">
        <div class="grid-item">
            <h2>World War II (Score: 2.331)</h2>
            <iframe src="world_war_ii_edit_path.html"></iframe>
        </div>
        <div class="grid-item">
            <h2>Python (programming language) (Score: 2.411)</h2>
            <iframe src="python_programming_language_edit_path.html"></iframe>
        </div>
        <div class="grid-item">
            <h2>Artificial intelligence (Score: 14.614)</h2>
            <iframe src="artificial_intelligence_edit_path.html"></iframe>
        </div>
        <div class="grid-item">
            <h2>JavaScript (Score: 22.831)</h2>
            <iframe src="javascript_edit_path.html"></iframe>
        </div>

    </div>
</body>
</html>
