ion of the leading edge and de-adhesion at the cell body and rear, and cytoskeletal contraction to pull the cell forward. Each step is driven by physical forces generated by unique segments of the cytoskeleton.\u003cref name=\"Alberts2\"\u003e{{cite book |last1=Alberts |first1=Bruce | name-list-style = vanc |title=Molecular biology of the cell |date=2002 |publisher=Garland Science |isbn=0815340729 |pages=973\u2013975 |edition=4th}}\u003c\u002fref\u003e\u003cref name=\"Ananthakrishnan\"\u003e{{cite journal | vauthors = Ananthakrishnan R, Ehrlicher A | title = The forces behind cell movement | journal = International Journal of Biological Sciences | volume = 3 | issue = 5 | pages = 303\u2013317 | date = June 2007 | pmid = 17589565 | pmc = 1893118 | doi = 10.7150\u002fijbs.3.303 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+====Navigation, control and communication====\u003cbr\u003e {{See also|Cybernetics#In biology}}\u003cbr\u003e-\u003cbr\u003e-In August 2020, scientists described one way cells\u2014in particular cells of a slime mold and mouse pancreatic cancer-derived cells\u2014are able to [[Chemotaxis|navigate]] efficiently through a body and identify the best routes through complex mazes: generating gradients after breaking down diffused [[chemoattractant]]s which enable them to sense upcoming maze junctions before reaching them, including around corners.\u003cref\u003e{{cite news |last1=Willingham |first1=Emily |title=Cells Solve an English Hedge Maze with the Same Skills They Use to Traverse the Body |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |access-date=7 September 2020 |work=Scientific American |language=en |archive-date=4 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200904102655\u002fhttps:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite news |title=How cells can find their way through the human body |url=https:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |access-date=7 September 2020 |work=phys.org |language=en |archive-date=3 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200903220400\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Tweedy |first1=Luke |last2=Thomason |first2=Peter A. |last3=Paschke |first3=Peggy I. |last4=Martin |first4=Kirsty |last5=Machesky |first5=Laura M. |last6=Zagnoni |first6=Michele |last7=Insall |first7=Robert H.|title=Seeing around corners: Cells solve mazes and respond at a distance using attractant breakdown |journal=Science |volume=369 |issue=6507 |date=August 2020 |page=eaay9792 |pmid=32855311 |doi=10.1126\u002fscience.aay9792 |s2cid=221342551 |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay9792 |access-date=2020-09-13 |archive-date=2020-09-12 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200912234645\u002fhttps:\u002f\u002fscience.sciencemag.org\u002fcontent\u002f369\u002f6507\u002feaay9792 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Multicellularity ==\u003cbr\u003e-\u003cbr\u003e+In August 2020, scientists described one way cells\u2014in particular cells of a slime mold and mouse pancreatic cancer-derived cells\u2014are able to [[Chemotaxis|navigate]] efficiently through a body and identify the best routes through complex mazes: generating gradients after breaking down diffused [[chemoattractant]]s which enable them to sense upcoming maze junctions before reaching them, including around corners.\u003cref\u003e{{cite news |last1=Willingham |first1=Emily |name-list-style=vanc |title=Cells Solve an English Hedge Maze with the Same Skills They Use to Traverse the Body |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |access-date=7 September 2020 |work=Scientific American |language=en |archive-date=4 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200904102655\u002fhttps:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite news |title=How cells can find their way through the human body |url=https:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |access-date=7 September 2020 |work=phys.org |language=en |archive-date=3 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200903220400\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite journal | vauthors = Tweedy L, Thomason PA, Paschke PI, Martin K, Machesky LM, Zagnoni M, Insall RH | title = Seeing around corners: Cells solve mazes and respond at a distance using attractant breakdown | journal = Science | volume = 369 | issue = 6507 | date = August 2020 | page = eaay9792 | pmid = 32855311 | doi = 10.1126\u002fscience.aay9792 | s2cid = 221342551 | url = https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay9792 | access-date = 2020-09-13 | archive-date = 2020-09-12 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20200912234645\u002fhttps:\u002f\u002fscience.sciencemag.org\u002fcontent\u002f369\u002f6507\u002feaay9792 | url-status = live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Multicellularity==\u003cbr\u003e {{main|Multicellular organism}}\u003cbr\u003e \u003cbr\u003e-=== Cell specialization\u002fdifferentiation ===\u003cbr\u003e-\u003cbr\u003e-{{main|Cellular differentiation}}\u003cbr\u003e-\u003cbr\u003e+===Cell specialization\u002fdifferentiation===\u003cbr\u003e+{{Main|Cellular differentiation}}\u003cbr\u003e [[File:C elegans stained.jpg|thumb|upright|Staining of a ''[[Caenorhabditis elegans]]'' highlights the nuclei of its cells.]]\u003cbr\u003e-\u003cbr\u003e-Multicellular organisms are [[organism]]s that consist of more than one cell, in contrast to [[single-celled organism]]s.\u003cref\u003e{{cite book |last=Becker |first=Wayne M. |display-authors=etal |title=The world of the cell |publisher=[[Benjamin Cummings|Pearson Benjamin Cummings]] |year=2009 |isbn=978-0321554185 |page=480}}\u003c\u002fref\u003e\u003cbr\u003e+Multicellular organisms are [[organism]]s that consist of more than one cell, in contrast to [[single-celled organism]]s.\u003cref\u003e{{cite book | last = Becker | first = Wayne M. | name-list-style = vanc | title = The world of the cell | publisher = [[Benjamin Cummings|Pearson Benjamin Cummings]] | year = 2009 | isbn = 978-0321554185 | page = 480|display-authors=etal}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In complex multicellular organisms, cells specialize into different [[cell type]]s that are adapted to particular functions. In mammals, major cell types include [[skin cells]], [[muscle cells]], [[neuron]]s, [[blood cell]]s, [[fibroblast]]s, [[stem cells]], and others. Cell types differ both in appearance and function, yet are [[Genetics|genetically]] identical. Cells are able to be of the same [[genotype]] but of different cell type due to the differential [[Regulation of gene expression|expression]] of the [[gene]]s they contain.\u003cbr\u003e \u003cbr\u003e Most distinct cell types arise from a single [[totipotent]] cell, called a [[zygote]], that [[Cellular differentiation|differentiates]] into hundreds of different cell types during the course of [[Development (biology)|development]]. Differentiation of cells is driven by different environmental cues (such as cell\u2013cell interaction) and intrinsic differences (such as those caused by the uneven distribution of [[molecule]]s during [[cell division|division]]).\u003cbr\u003e \u003cbr\u003e-=== Origin of multicellularity ===\u003cbr\u003e-\u003cbr\u003e-Multicellularity has evolved independently at least 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal |last1= Grosberg |first1=R. K. |last2=Strathmann |first2=R. R. |url=http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |title=The evolution of multicellularity: A minor major transition? |journal=Annu Rev Ecol Evol Syst |year=2007 |volume=38 |pages=621\u2013654 |doi=10.1146\u002fannurev.ecolsys.36.102403.114735 |access-date=2013-12-23 |archive-date=2016-03-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |url-status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last1=Popper |first1=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e-\u003cbr\u003e-The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested ''[[Grypania]] spiralis'' and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last1=Albani |first1=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e+===Origin of multicellularity===\u003cbr\u003e+Multicellularity has evolved independently at least 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal | vauthors = Grosberg RK, Strathmann RR | url = http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf | title = The evolution of multicellularity: A minor major transition? | journal = Annu Rev Ecol Evol Syst | year = 2007 | volume = 38 | pages = 621\u2013654 | doi = 10.1146\u002fannurev.ecolsys.36.102403.114735 | access-date = 2013-12-23 | archive-date = 2016-03-04 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf | url-status = dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], ''[[Magnetoglobus multicellularis]]'', or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal | vauthors = Popper ZA, Michel G, Herv\u00e9 C, Domozych DS, Willats WG, Tuohy MG, Kloareg B, Stengel DB | display-authors = 6 | title = Evolution and diversity of plant cell walls: from algae to flowering plants | journal = Annual Review of Plant Biology | volume = 62 | pages = 567\u2013590 | date = 2011 | pmid = 21351878 | doi = 10.1146\u002fannurev-arplant-042110-103809 | url = http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf | hdl = 10379\u002f6762 | s2cid = 11961888 | hdl-access = free | access-date = 2013-12-23 | archive-date = 2016-07-29 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf | url-status = live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal| last = Bonner | first = John Tyler | name-list-style = vanc |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e+\u003cbr\u003e+The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested [[Grypania]] spiralis and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal | vauthors = El Albani A, Bengtson S, Canfield DE, Bekker A, Macchiarelli R, Mazurier A, Hammarlund EU, Boulvais P, Dupuy JJ, Fontaine C, F\u00fcrsich FT, Gauthier-Lafaye F, Janvier P, Javaux E, Ossa FO, Pierson-Wickmann AC, Riboulleau A, Sardini P, Vachard D, Whitehouse M, Meunier A | display-authors = 6 | title = Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago | journal = Nature | volume = 466 | issue = 7302 | pages = 100\u2013104 | date = July 2010 | pmid = 20596019 | doi = 10.1038\u002fnature09166 | author-link = Abderrazak El Albani | s2cid = 4331375 | bibcode = 2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The evolution of multicellularity from unicellular ancestors has been replicated in the laboratory, in [[experimental evolution|evolution experiments]] using predation as the [[selective pressure]].\u003cref name=\"Grosberg2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== Origins ==\u003c!-- This section is linked from [[Timeline of evolution]] --\u003e\u003cbr\u003e-\u003cbr\u003e-{{main|Evolutionary history of life}}\u003cbr\u003e-\u003cbr\u003e+==Origins==\u003c!-- This section is linked from [[Timeline of evolution]] --\u003e\u003cbr\u003e+{{Main|Evolutionary history of life}}\u003cbr\u003e The origin of cells has to do with the [[Abiogenesis|origin of life]], which began the [[timeline of evolution|history of life]] on Earth.\u003cbr\u003e \u003cbr\u003e-=== Origin of life ===\u003cbr\u003e-\u003cbr\u003e+===Origin of the first cell===\u003cbr\u003e+[[File:Stromatolites.jpg|thumb|[[Stromatolites]] are left behind by [[cyanobacteria]], also called blue-green algae. They are the oldest known fossils of life on Earth. This one-billion-year-old fossil is from [[Glacier National Park (U.S.)|Glacier National Park]] in the United States.]]\u003cbr\u003e {{further|Abiogenesis|Evolution of cells}}\u003cbr\u003e \u003cbr\u003e-[[File:Stromatolites.jpg|thumb|[[Stromatolites]] are left behind by [[cyanobacteria]], also called blue-green algae. They are among the oldest fossils of life on Earth. This one-billion-year-old fossil is from [[Glacier National Park (U.S.)|Glacier National Park]] in the United States.]]\u003cbr\u003e-\u003cbr\u003e-Small molecules needed for life may have been carried to Earth on meteorites, created at [[Hydrothermal vent|deep-sea vents]], or [[Miller\u2013Urey experiment|synthesized by lightning in a reducing atmosphere]]. There is little experimental data defining what the first self-replicating forms were. [[RNA]] may have been [[RNA world hypothesis|the earliest self-replicating molecule]], as it can both store genetic information and catalyze chemical reactions.\u003cref name=OrgelLE\u003e{{cite journal |last= Orgel |first=L. E. |title=The origin of life--a review of facts and speculations |journal=Trends in Biochemical Sciences |volume=23 |issue=12 |pages=491\u2013495 |date=December 1998 |pmid=9868373 |doi=10.1016\u002fS0968-0004(98)01300-0 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Cells emerged around 4 billion years ago.\u003cref name=\"NAT-20170301\"\u003e{{cite journal |last1=Dodd |first1=Matthew S. |last2=Papineau |first2=Dominic |last3=Grenne |first3=Tor |last4=Slack |first4=John F. |last5=Rittner |first5=Martin |last6=Pirajno |first6=Franco |last7=O'Neil |first7=Jonathan |last8=Little |first8=Crispin T.S. |display-authors=3 |title=Evidence for early life in Earth's oldest hydrothermal vent precipitates |journal=[[Nature (journal)|Nature]] |date=1 March 2017 |volume=543 |issue=7643 |pages=60\u201364 |doi=10.1038\u002fnature21377 |doi-access=free |pmid=28252057 |bibcode=2017Natur.543...60D |url=http:\u002f\u002feprints.whiterose.ac.uk\u002f112179\u002f |access-date=2 March 2017 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170908201821\u002fhttp:\u002f\u002feprints.whiterose.ac.uk\u002f112179\u002f |archive-date=8 September 2017}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Betts |first1=Holly C. |last2=Puttick |first2=Mark N. |last3=Clark |first3=James W. |last4=Williams |first4=Tom A. |last5=Donoghue |first5=Philip C. J. |last6=Pisani |first6=Davide |date=20 August 2018 |title=Integrated genomic and fossil evidence illuminates life's early evolution and eukaryote origin |journal=Nature Ecology & Evolution |volume=2 |issue=10 |pages=1556\u20131562 |doi=10.1038\u002fs41559-018-0644-x |pmid=30127539|pmc=6152910 |bibcode=2018NatEE...2.1556B }}\u003c\u002fref\u003e The first cells were most likely [[heterotroph]]s. The early cell membranes were probably simpler and more permeable than modern ones, with only a single fatty acid chain per lipid. Lipids spontaneously form bilayered [[Vesicle (biology and chemistry)|vesicles]] in water, and could have preceded RNA.\u003cref name=\"Griffiths 2007\"\u003e{{cite journal |last=Griffiths |first=G. |title=Cell evolution and the problem of membrane topology |journal=Nature Reviews. Molecular Cell Biology |volume=8 |issue=12 |pages=1018\u20131024 |date=December 2007 |pmid=17971839 |doi=10.1038\u002fnrm2287 |s2cid=31072778 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"ScienceDaily 2021\"\u003e{{cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily |archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== First eukaryotic cells ===\u003cbr\u003e-\u003cbr\u003e-{{main|Eukaryogenesis}}\u003cbr\u003e-\u003cbr\u003e-[[File:Symbiogenesis 2 mergers.svg|thumb|upright=1.35|In the theory of [[symbiogenesis]], a merger of an [[archaea]]n and an aerobic bacterium created the eukaryotes, with aerobic [[Mitochondrion|mitochondria]], some 2.2 billion years ago. A second merger, 1.6 billion years ago, added [[chloroplast]]s, creating the green plants.\u003cref name=latorre\u002f\u003e]]\u003cbr\u003e-\u003cbr\u003e-[[Eukaryote|Eukaryotic]] cells were created some 2.2 billion years ago in a process called [[eukaryogenesis]]. This is widely agreed to have involved [[symbiogenesis]], in which [[archaea]] and [[bacteria]] came together to create the first eukaryotic common ancestor. This cell had a new level of complexity and capability, with a nucleus\u003cref name=\"McGrath 2022\"\u003e{{cite journal |last=McGrath |first=Casey |title=Highlight: Unraveling the Origins of LUCA and LECA on the Tree of Life |journal=Genome Biology and Evolution |volume=14 |issue=6 |date=31 May 2022 |pages=evac072 |doi=10.1093\u002fgbe\u002fevac072|pmc=9168435 }}\u003c\u002fref\u003e\u003cref name=\"Weiss et al 2016\"\u003e{{cite journal |last1=Weiss |first1=Madeline C. |last2=Sousa |first2=F. L. |last3=Mrnjavac |first3=N. |last4=Neukirchen |first4=S. |last5=Roettger |first5=M. |last6=Nelson-Sathi |first6=S. |last7=Martin |first7=William F. |author7-link=William F. Martin |display-authors=3 |s2cid=2997255 |year=2016 |title=The physiology and habitat of the last universal common ancestor |journal=Nature Microbiology |volume=1 |issue=9 |page=16116 |doi=10.1038\u002fnmicrobiol.2016.116 |pmid=27562259 |url=http:\u002f\u002fcomplexityexplorer.s3.amazonaws.com\u002fsupplemental_materials\u002f3.6+Early+Metabolisms\u002fWeiss_et_al_Nat_Microbiol_2016.pdf }}\u003c\u002fref\u003e and facultatively aerobic [[Mitochondrion|mitochondria]].\u003cref name=latorre\u003e{{cite book |last1=Latorre |first1=A. |last2=Durban |first2=A |last3=Moya |first3=A. |last4=Pereto |first4=J. |chapter-url=https:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |chapter=The role of symbiosis in eukaryotic evolution |title=Origins and Evolution of Life: An astrobiological perspective |editor1=Gargaud, Muriel |editor2=L\u00f3pez-Garc\u00eca, Purificacion |editor3=Martin, H. |year=2011 |location=Cambridge |publisher=Cambridge University Press |pages=326\u2013339 |isbn=978-0-521-76131-4 |access-date=27 August 2017 |archive-date=24 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190324055723\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |url-status=live }}\u003c\u002fref\u003e It evolved some 2 billion years ago into a population of single-celled organisms that included the last eukaryotic common ancestor, gaining capabilities along the way, though the sequence of the steps involved has been disputed, and may not have started with symbiogenesis. It featured at least one [[centriole]] and [[cilium]], sex ([[meiosis]] and [[syngamy]]), [[peroxisome]]s, and a dormant [[cyst]] with a cell wall of [[chitin]] and\u002for [[cellulose]].\u003cref\u003e{{cite journal |last=Leander |first=B. S. |title=Predatory protists |journal=Current Biology |volume=30 |issue=10 |pages=R510\u2013R516 |date=May 2020 |pmid=32428491 |doi=10.1016\u002fj.cub.2020.03.052 |s2cid=218710816 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"Strassert Irisarri Williams Burki 2021\"\u003e{{cite journal |last1=Strassert |first1=J\u00fcrgen F. H. |last2=Irisarri |first2=Iker |last3=Williams |first3=Tom A. |last4=Burki |first4=Fabien |title=A molecular timescale for eukaryote evolution with implications for the origin of red algal-derived plastids |journal=Nature Communications |volume=12 |issue=1 |date=25 March 2021 |page=1879 |doi=10.1038\u002fs41467-021-22044-z|pmid=33767194 |pmc=7994803 |bibcode=2021NatCo..12.1879S }}\u003c\u002fref\u003e In turn, the last eukaryotic common ancestor gave rise to the eukaryotes' [[crown group]], containing the ancestors of [[animal]]s, [[Fungus|fungi]], [[plant]]s, and a diverse range of single-celled organisms.\u003cref name=\"Gabald\u00f3n\"\u003e{{cite journal |last=Gabald\u00f3n |first=T. |title=Origin and Early Evolution of the Eukaryotic Cell |journal=Annual Review of Microbiology |volume=75 |issue=1 |pages=631\u2013647 |date=October 2021 |pmid=34343017 |doi=10.1146\u002fannurev-micro-090817-062213 |s2cid=236916203 }}\u003c\u002fref\u003e\u003cref name=\"w1990\"\u003e{{cite journal |last1=Woese |first1=C.R. |author1-link=Carl Woese |last2=Kandler |first2=Otto |author2-link=Otto Kandler |last3=Wheelis |first3=Mark L. |author3-link=Mark Wheelis |title=Towards a natural system of organisms: proposal for the domains Archaea, Bacteria, and Eucarya |journal=Proceedings of the National Academy of Sciences of the United States of America |volume=87 |issue=12 |pages=4576\u20134579 |date=June 1990 |pmid=2112744 |pmc=54159 |doi=10.1073\u002fpnas.87.12.4576 |bibcode=1990PNAS...87.4576W |doi-access=free }}\u003c\u002fref\u003e The plants were created around 1.6 billion years ago with a second episode of symbiogenesis that added [[chloroplast]]s, derived from [[cyanobacteria]].\u003cref name=latorre\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== History of research ==\u003cbr\u003e-\u003cbr\u003e-{{main|Cell theory}}\u003cbr\u003e-\u003cbr\u003e-[[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e-\u003cbr\u003e-In 1665, [[Robert Hooke]] examined a thin slice of cork under his [[microscope]], and saw a structure of small enclosures. He wrote \"I could exceeding plainly perceive it to be all perforated and porous, much like a [[Honeycomb|Honey-comb]], but that the pores of it were not regular\".\u003cref name=\"Hooke 1665\"\u003e{{cite book |last1=Hooke |first1=Robert |author1-link=Robert Hooke |title=[[Micrographia]] |date=1665 |chapter=Observation 18 |chapter-url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fMicrographia\u002fChapter_18}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-* 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e-* 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e\u003cbr\u003e-* 1839: [[Theodor Schwann]]\u003cref\u003e{{cite book |last=Schwann |first=Theodor |author-link=Theodor Schwann |year=1839 |title=Mikroskopische Untersuchungen \u00fcber die Uebereinstimmung in der Struktur und dem Wachsthum der Thiere und Pflanzen |publisher=Sander |place=Berlin |url=http:\u002f\u002fwww.deutschestextarchiv.de\u002fbook\u002fshow\u002fschwann_mikroskopische_1839}}\u003c\u002fref\u003e and [[Matthias Jakob Schleiden]] elucidated the principle that plants and animals are made of cells, concluding that cells are a common unit of structure and development, and thus founding the cell theory.\u003cbr\u003e+There are several theories about the origin of small molecules that led to life on the [[early Earth]]. They may have been carried to Earth on meteorites (see [[Murchison meteorite]]), created at [[Hydrothermal vent|deep-sea vents]], or synthesized by lightning in a reducing atmosphere (see [[Miller\u2013Urey experiment]]). There is little experimental data defining what the first self-replicating forms were. [[RNA]] is thought to be the earliest self-replicating molecule, as it is capable of both storing genetic information and catalyzing chemical reactions (see [[RNA world hypothesis]]), but some other entity with the potential to self-replicate could have preceded RNA, such as [[Abiogenesis#Clay hypothesis|clay]] or [[peptide nucleic acid]].\u003cref name=OrgelLE\u003e{{cite journal | vauthors = Orgel LE | title = The origin of life--a review of facts and speculations | journal = Trends in Biochemical Sciences | volume = 23 | issue = 12 | pages = 491\u2013495 | date = December 1998 | pmid = 9868373 | doi = 10.1016\u002fS0968-0004(98)01300-0 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Cells emerged at least 3.5 billion years ago.\u003cref name=\"Origin1\"\u003e{{cite journal | vauthors = Schopf JW, Kudryavtsev AB, Czaja AD, Tripathi AB | date = 2007 | title = Evidence of Archean life: Stromatolites and microfossils | journal = Precambrian Research | volume = 158 | issue = 3\u20134 | pages = 141\u2013155 | bibcode = 2007PreR..158..141S | doi = 10.1016\u002fj.precamres.2007.04.009 }}\u003c\u002fref\u003e\u003cref name=\"Origin2\"\u003e{{cite journal | vauthors = Schopf JW | title = Fossil evidence of Archaean life | journal = Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences | volume = 361 | issue = 1470 | pages = 869\u2013885 | date = June 2006 | pmid = 16754604 | pmc = 1578735 | doi = 10.1098\u002frstb.2006.1834 }}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson2002\"\u003e{{cite book | first1 = Peter Hamilton | last1 = Raven | first2 = George Brooks | last2 = Johnson | name-list-style =vanc |title=Biology|url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave| url-access = registration |access-date=7 July 2013|year=2002|publisher=McGraw-Hill Education|isbn=978-0071122610|page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68]}}\u003c\u002fref\u003e The current belief is that these cells were [[heterotroph]]s. The early cell membranes were probably more simple and permeable than modern ones, with only a single fatty acid chain per lipid. Lipids are known to spontaneously form bilayered [[Vesicle (biology and chemistry)|vesicles]] in water, and could have preceded RNA, but the first cell membranes could also have been produced by catalytic RNA, or even have required structural proteins before they could form.\u003cref\u003e{{cite journal | vauthors = Griffiths G | title = Cell evolution and the problem of membrane topology | journal = Nature Reviews. Molecular Cell Biology | volume = 8 | issue = 12 | pages = 1018\u20131024 | date = December 2007 | pmid = 17971839 | doi = 10.1038\u002fnrm2287 | s2cid = 31072778 | doi-access = free }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Origin of eukaryotic cells===\u003cbr\u003e+{{further|Evolution of sexual reproduction}}\u003cbr\u003e+The eukaryotic cell seems to have evolved from a [[symbiosis|symbiotic community]] of prokaryotic cells. DNA-bearing organelles like the [[mitochondria]] and the [[chloroplasts]] are descended from ancient symbiotic oxygen-breathing [[Alphaproteobacteria]] and \"[[Cyanobacteria]]\", respectively, which were [[Endosymbiotic theory|endosymbiosed]] by an ancestral [[archaea]]n prokaryote.\u003cbr\u003e+\u003cbr\u003e+There is still considerable debate about whether organelles like the [[hydrogenosome]] predated the origin of [[mitochondria]], or vice versa: see the [[hydrogen hypothesis]] for the origin of eukaryotic cells.\u003cbr\u003e+\u003cbr\u003e+==History of research==\u003cbr\u003e+{{Main|Cell theory}}\u003cbr\u003e+[[File:RobertHookeMicrographia1665.jpg|thumb|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e+* 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cbr\u003e+* 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book|last1=Hooke|first1=Robert|name-list-style=vanc|title=Micrographia: ...|date=1665|publisher=Royal Society of London|location=London|page=113|url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cbr\u003e+* 1839: [[Theodor Schwann]] and [[Matthias Jakob Schleiden]] elucidated the principle that plants and animals are made of cells, concluding that cells are a common unit of structure and development, and thus founding the cell theory.\u003cbr\u003e * 1855: [[Rudolf Virchow]] stated that new cells come from pre-existing cells by [[cell division]] (''omnis cellula ex cellula'').\u003cbr\u003e-* 1931: [[Ernst Ruska]] built the first [[transmission electron microscope]] (TEM) at the [[University of Berlin]].\u003cref name=\"Ruska\"\u003e{{cite book |title=The Early Development of Electron Lenses and Electron Microscopy |series=Applied Optics |volume=25 |issue=6 |pages=820 |author1=Ernst Ruska |translator=T. Mulvey |isbn=978-3-7776-0364-3 |date=January 1980 |doi=10.1364\u002fAO.25.000820 |bibcode=1986ApOpt..25..820R }}\u003c\u002fref\u003e By 1935, he had built an EM with twice the resolution of a light microscope, revealing previously unresolvable organelles.\u003cbr\u003e-* 1981: [[Lynn Margulis]] published ''Symbiosis in Cell Evolution'' detailing how eukaryotic cells were created by [[symbiogenesis]].\u003cref name=\"Cornish-Bowden 2017\"\u003e{{Cite journal |last=Cornish-Bowden |first=Athel |title=Lynn Margulis and the origin of the eukaryotes |journal=[[Journal of Theoretical Biology]] |series=The origin of mitosing cells: 50th anniversary of a classic paper by Lynn Sagan (Margulis) |date=7 December 2017 |volume=434 |page=1 |doi=10.1016\u002fj.jtbi.2017.09.027 |pmid=28992902 |bibcode=2017JThBi.434....1C |url=https:\u002f\u002fwww.sciencedirect.com\u002fscience\u002farticle\u002fpii\u002fS0022519317304459 }}\u003c\u002fref\u003e\u003cbr\u003e+* 1859: The belief that life forms can occur spontaneously (''[[Abiogenesis|generatio spontanea]]'') was contradicted by [[Louis Pasteur]] (1822\u20131895) (although [[Francesco Redi]] had performed an experiment in 1668 that suggested the same conclusion).\u003cbr\u003e+* 1931: [[Ernst Ruska]] built the first [[transmission electron microscope]] (TEM) at the [[University of Berlin]]. By 1935, he had built an EM with twice the resolution of a light microscope, revealing previously unresolvable organelles.\u003cbr\u003e+* 1953: Based on [[Rosalind Franklin]]'s work, [[James D. Watson|Watson]] and [[Francis Crick|Crick]] made their first announcement on the [[double helix]] structure of DNA.\u003cbr\u003e+* 1981: [[Lynn Margulis]] published ''Symbiosis in Cell Evolution'' detailing the [[endosymbiotic theory]].\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e-\u003cbr\u003e+{{Portal|Biology}}\u003cbr\u003e {{Div col}}\u003cbr\u003e * [[Cell cortex]]\u003cbr\u003e * [[Cell culture]]\u003cbr\u003e@@ -333,23 +293,19 @@\u003cbr\u003e {{div col end}}\u003cbr\u003e \u003cbr\u003e == References ==\u003cbr\u003e-\u003cbr\u003e {{Reflist}}\u003cbr\u003e \u003cbr\u003e == Further reading ==\u003cbr\u003e-\u003cbr\u003e {{Refbegin}}\u003cbr\u003e-* {{Cite book |last1=Alberts |first1=Bruce |last2=Johnson |first2=Alexander |last3=Lewis |first3=Julian |last4=Morgan |first4=David |last5=Raff |first5=Martin |last6=Roberts |first6=Keith |last7=Walter |first7=Peter |year=2015 |title=Molecular Biology of the Cell |edition=6th |publisher=Garland Science |page=2 |isbn=978-0815344322 |ref={{sfnRef|Alberts}} }}\u003cbr\u003e-* {{Cite book |last=Alberts |first=B. |display-authors=etal |title=Molecular Biology of the Cell |edition=6th |publisher=Garland |year=2014 |url=http:\u002f\u002fwww.garlandscience.com\u002fproduct\u0 nd communication between cells.\u003cbr\u003e \u003cbr\u003e ====Bacterial shapes====\u003cbr\u003e+{{Main|Bacteria#Morphology}}\u003cbr\u003e Cell shape, also called cell morphology, has been hypothesized to form from the arrangement and movement of the cytoskeleton.\u003cref\u003e{{Cite journal |last1=Pichoff |first1=Sebastien |last2=Lutkenhaus |first2=Joe |date=2007-12-01 |title=Overview of cell shape: cytoskeletons shape bacterial cells |journal=Current Opinion in Microbiology |series=Growth and Development |language=en |volume=10 |issue=6 |pages=601\u2013605 |doi=10.1016\u002fj.mib.2007.09.005 |pmid=17980647 |pmc=2703429 |issn=1369-5274 }}\u003c\u002fref\u003e Many advancements in the study of cell morphology come from studying simple bacteria such as ''[[Staphylococcus aureus]]'',\u00a0''[[Escherichia coli|E. coli]]'',\u00a0and [[Bacillus subtilis|''B. subtilis''.]]\u003cref name=\"Kysela-2016\"\u003e{{Cite journal |last1=Kysela |first1=David T. |last2=Randich |first2=Amelia M. |last3=Caccamo |first3=Paul D. |last4=Brun |first4=Yves V. |date=2016-10-03 |title=Diversity Takes Shape: Understanding the Mechanistic and Adaptive Basis of Bacterial Morphology |url=http:\u002f\u002fdx.doi.org\u002f10.1371\u002fjournal.pbio.1002565 |journal=PLOS Biology |volume=14 |issue=10 |page=e1002565 |doi=10.1371\u002fjournal.pbio.1002565 |pmid=27695035 |pmc=5047622 |issn=1545-7885 |access-date=2022-04-24 |archive-date=2022-05-11 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220511173927\u002fhttps:\u002f\u002fjournals.plos.org\u002fplosbiology\u002farticle?id=10.1371\u002fjournal.pbio.1002565 |url-status=live }}\u003c\u002fref\u003e Different cell shapes have been found and described, but how and why cells form different shapes is still widely unknown.\u003cref name=\"Kysela-2016\" \u002f\u003e Some cell shapes that have been identified include rods, cocci and spirochaetes. Cocci have a circular shape, bacilli have an elongated rod-like shape, and spirochaetes have a spiral shape. Many other shapes have also been determined.\u003cbr\u003e \u003cbr\u003e ===Eukaryotic cells===","--- Revision 51\u003cbr\u003e+++ Revision 52\u003cbr\u003e@@ -18,7 +18,7 @@\u003cbr\u003e | Lymph       =\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of [[life form]]s. Every cell consists of a [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[biomolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many small molecules of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia|title= cell\u016dla|encyclopedia= [[A Latin Dictionary]]|year= 1879|publisher= Charlton T. Lewis and Charles Short|url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789|archive-date= 7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula|url-status= live}}}}\u003c\u002fref\u003e\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life form|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia|title= cell\u016dla|encyclopedia= [[A Latin Dictionary]]|year= 1879|publisher= Charlton T. Lewis and Charles Short|url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789|archive-date= 7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula|url-status= live}}}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA]] repair, protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. Most cells are measured in micrometers due to their small size.\u003cbr\u003e ","--- Revision 52\u003cbr\u003e+++ Revision 53\u003cbr\u003e@@ -20,7 +20,7 @@\u003cbr\u003e \u003cbr\u003e The '''cell''' is the basic structural and functional unit of all [[life form|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia|title= cell\u016dla|encyclopedia= [[A Latin Dictionary]]|year= 1879|publisher= Charlton T. Lewis and Charles Short|url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789|archive-date= 7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula|url-status= live}}}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA]] repair, protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. Most cells are measured in micrometers due to their small size.\u003cbr\u003e+Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. Most cells are measured in micrometers due to their small size.\u003cbr\u003e \u003cbr\u003e Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |name-list-style=vanc |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37&nbsp;trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells.\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |url=https:\u002f\u002fdoi.org\u002f10.3109\u002f03014460.2013.807878 |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |access-date=2022-04-24 |archive-date=2022-05-11 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220511173925\u002fhttps:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.3109\u002f03014460.2013.807878?cookieSet=1 |url-status=live }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=6 |vauthors=Azevedo FA, Carvalho LR, Grinberg LT, Farfel JM, Ferretti RE, Leite RE, Jacob Filho W, Lent R, Herculano-Houzel S |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -20,7 +20,7 @@\u003cbr\u003e \u003cbr\u003e The '''cell''' is the basic structural and functional unit of all [[life form|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia|title= cell\u016dla|encyclopedia= [[A Latin Dictionary]]|year= 1879|publisher= Charlton T. Lewis and Charles Short|url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789|archive-date= 7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula|url-status= live}}}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. Most cells are measured in micrometers due to their small size.\u003cbr\u003e+Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e \u003cbr\u003e Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |name-list-style=vanc |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37&nbsp;trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells.\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |url=https:\u002f\u002fdoi.org\u002f10.3109\u002f03014460.2013.807878 |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |access-date=2022-04-24 |archive-date=2022-05-11 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220511173925\u002fhttps:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.3109\u002f03014460.2013.807878?cookieSet=1 |url-status=live }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=6 |vauthors=Azevedo FA, Carvalho LR, Grinberg LT, Farfel JM, Ferretti RE, Leite RE, Jacob Filho W, Lent R, Herculano-Houzel S |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -161,7 +161,7 @@\u003cbr\u003e * '''Endoplasmic reticulum''': The [[endoplasmic reticulum]] (ER) is a transport network for molecules targeted for certain modifications and specific destinations, as compared to molecules that float freely in the cytoplasm. The ER has two forms: the rough ER, which has ribosomes on its surface that secrete proteins into the ER, and the smooth ER, which lacks ribosomes.\u003cref name=\"NCBI\"\u002f\u003e The smooth ER plays a role in calcium sequestration and release and also helps in synthesis of [[lipid]].\u003cbr\u003e * '''Golgi apparatus''': The primary function of the Golgi apparatus is to process and package the [[macromolecule]]s such as [[protein]]s and [[lipid]]s that are synthesized by the cell.\u003cbr\u003e * '''Lysosomes and peroxisomes''': [[Lysosome]]s contain [[digestive enzyme]]s (acid [[hydrolase]]s). They digest excess or worn-out [[organelle]]s, food particles, and engulfed [[virus]]es or [[bacteria]]. [[Peroxisome]]s have enzymes that rid the cell of toxic [[peroxide]]s, Lysosomes are optimally active at [[acidic pH]]. The cell could not house these destructive enzymes if they were not contained in a membrane-bound system.\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e-* '''Centrosome''': the cytoskeleton organizer: The [[centrosome]] produces the [[microtubules]] of a cell\u2014a key component of the [[cytoskeleton]]. It directs the transport through the [[endoplasmic reticulum|ER]] and the [[Golgi apparatus]]. Centrosomes are composed of two [[centrioles]] which lie perpendicular to each other in which each has an organization like a [[Cart wheel|cartwheel]], which separate during [[cell division]] and help in the formation of the [[mitotic spindle]]. A single centrosome is present in the [[animal cell]]s. They are also found in some fungi and algae cells.\u003cbr\u003e+* '''Centrosome''': the cytoskeleton organizer: The [[centrosome]] produces the [[microtubules]] of a cell\u2014a key component of the [[cytoskeleton]]. It directs the transport through the [[endoplasmic reticulum|ER]] and the [[Golgi apparatus]]. Centrosomes are composed of two [[centrioles]] which lie perpendicular to each other in which each has an organization like a [[Cart wheel|cartwheel]], which separate during [[cell division]] and help in the formation of the [[mitotic spindle]]. A single centrosome is present in the animal cells. They are also found in some fungi and algae cells.\u003cbr\u003e * '''Vacuoles''': [[Vacuole]]s sequester waste products and in plant cells store water. They are often described as liquid filled spaces and are surrounded by a membrane. Some cells, most notably ''[[Amoeba (genus)|Amoeba]]'', have contractile vacuoles, which can pump water out of the cell if there is too much water. The vacuoles of plant cells and fungal cells are usually larger than those of animal cells. Vacuoles of plant cells are surrounded by [[tonoplast]] which helps in transport of ions and other substances against concentration gradients.\u003cbr\u003e \u003cbr\u003e ====Eukaryotic and prokaryotic====","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -252,7 +252,7 @@\u003cbr\u003e [[File:Stromatolites.jpg|thumb|[[Stromatolites]] are left behind by [[cyanobacteria]], also called blue-green algae. They are the oldest known fossils of life on Earth. This one-billion-year-old fossil is from [[Glacier National Park (U.S.)|Glacier National Park]] in the United States.]]\u003cbr\u003e {{further|Abiogenesis|Evolution of cells}}\u003cbr\u003e \u003cbr\u003e-There are several theories about the origin of small molecules that led to life on the [[early Earth]]. They may have been carried to Earth on meteorites (see [[Murchison meteorite]]), created at [[Hydrothermal vent|deep-sea vents]], or synthesized by lightning in a reducing atmosphere (see [[Miller\u2013Urey experiment]]). There is little experimental data defining what the first self-replicating forms were. [[RNA]] is thought to be the earliest self-replicating molecule, as it is capable of both storing genetic information and catalyzing chemical reactions (see [[RNA world hypothesis]]), but some other entity with the potential to self-replicate could have preceded RNA, such as [[Abiogenesis#Clay hypothesis|clay]] or [[peptide nucleic acid]].\u003cref name=OrgelLE\u003e{{cite journal | vauthors = Orgel LE | title = The origin of life--a review of facts and speculations | journal = Trends in Biochemical Sciences | volume = 23 | issue = 12 | pages = 491\u2013495 | date = December 1998 | pmid = 9868373 | doi = 10.1016\u002fS0968-0004(98)01300-0 }}\u003c\u002fref\u003e\u003cbr\u003e+There are several theories about the origin of small molecules that led to life on the [[early Earth]]. They may have been carried to Earth on meteorites (see [[Murchison meteorite]]), created at [[Hydrothermal vent|deep-sea vents]], or synthesized by lightning in a reducing atmosphere (see [[Miller\u2013Urey experiment]]). There is little experimental data defining what the first self-replicating forms were. [[RNA]] is thought to be the earliest self-replicating molecule, as it is capable of both storing genetic information and catalyzing chemical reactions (see [[RNA world hypothesis]]), but some other entity with the potential to self-replicate could have preceded RNA, such as [[Abiogenesis#Clay|clay]] or [[peptide nucleic acid]].\u003cref name=OrgelLE\u003e{{cite journal | vauthors = Orgel LE | title = The origin of life--a review of facts and speculations | journal = Trends in Biochemical Sciences | volume = 23 | issue = 12 | pages = 491\u2013495 | date = December 1998 | pmid = 9868373 | doi = 10.1016\u002fS0968-0004(98)01300-0 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Cells emerged at least 3.5 billion years ago.\u003cref name=\"Origin1\"\u003e{{cite journal | vauthors = Schopf JW, Kudryavtsev AB, Czaja AD, Tripathi AB | date = 2007 | title = Evidence of Archean life: Stromatolites and microfossils | journal = Precambrian Research | volume = 158 | issue = 3\u20134 | pages = 141\u2013155 | bibcode = 2007PreR..158..141S | doi = 10.1016\u002fj.precamres.2007.04.009 }}\u003c\u002fref\u003e\u003cref name=\"Origin2\"\u003e{{cite journal | vauthors = Schopf JW | title = Fossil evidence of Archaean life | journal = Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences | volume = 361 | issue = 1470 | pages = 869\u2013885 | date = June 2006 | pmid = 16754604 | pmc = 1578735 | doi = 10.1098\u002frstb.2006.1834 }}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson2002\"\u003e{{cite book | first1 = Peter Hamilton | last1 = Raven | first2 = George Brooks | last2 = Johnson | name-list-style =vanc |title=Biology|url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave| url-access = registration |access-date=7 July 2013|year=2002|publisher=McGraw-Hill Education|isbn=978-0071122610|page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68]}}\u003c\u002fref\u003e The current belief is that these cells were [[heterotroph]]s. The early cell membranes were probably more simple and permeable than modern ones, with only a single fatty acid chain per lipid. Lipids are known to spontaneously form bilayered [[Vesicle (biology and chemistry)|vesicles]] in water, and could have preceded RNA, but the first cell membranes could also have been produced by catalytic RNA, or even have required structural proteins before they could form.\u003cref\u003e{{cite journal | vauthors = Griffiths G | title = Cell evolution and the problem of membrane topology | journal = Nature Reviews. Molecular Cell Biology | volume = 8 | issue = 12 | pages = 1018\u20131024 | date = December 2007 | pmid = 17971839 | doi = 10.1038\u002fnrm2287 | s2cid = 31072778 | doi-access = free }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -28,8 +28,12 @@\u003cbr\u003e \u003cbr\u003e [[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. |name-list-style=vanc}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated. |name-list-style=vanc}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cref\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |name-list-style=vanc}}\u003c\u002fref\u003e Cells emerged on Earth about 4 billion years ago.\u003cref name=\"Origin12\"\u003e{{cite journal |vauthors=Schopf JW, Kudryavtsev AB, Czaja AD, Tripathi AB |date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009}}\u003c\u002fref\u003e\u003cref name=\"Origin22\"\u003e{{cite journal |vauthors=Schopf JW |date=June 2006 |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |doi=10.1098\u002frstb.2006.1834 |pmc=1578735 |pmid=16754604}}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson20022\"\u003e{{cite book |last1=Raven |first1=Peter Hamilton |url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave |title=Biology |last2=Johnson |first2=George Brooks |publisher=McGraw-Hill Education |year=2002 |isbn=978-0071122610 |page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68] |access-date=7 July 2013 |url-access=registration |name-list-style=vanc}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily |language=en |archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+== Discovery ==\u003cbr\u003e+{{Main|Cell theory}}\u003cbr\u003e+With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cbr\u003e+\u003cbr\u003e ==Cell types==\u003cbr\u003e-Cells are categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell @ BYJU'S|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJUS|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell @ BYJU'S|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJUS|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Prokaryotic cells===\u003cbr\u003e {{Main|Prokaryote}}","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -22,7 +22,7 @@\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]]
