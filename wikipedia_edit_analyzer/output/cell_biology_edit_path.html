e cells, most notably ''[[Amoeba (genus)|Amoeba]]'', have contractile vacuoles, which can pump water out of the cell if there is too much water. The vacuoles of plant cells and fungal cells are usually larger than those of animal cells. Vacuoles of plant cells are surrounded by a membrane which transports ions against concentration gradients.\u003cbr\u003e \u003cbr\u003e ==== Eukaryotic and prokaryotic ====\u003cbr\u003e ","--- Revision 77\u003cbr\u003e+++ Revision 78\u003cbr\u003e@@ -225,7 +225,7 @@\u003cbr\u003e \u003cbr\u003e {{main|DNA repair}}\u003cbr\u003e \u003cbr\u003e-In general, cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|DNA damage]] and carry out [[DNA repair|repair processes]] when damage is detected.\u003cref\u003eD. Peter Snustad, Michael J. Simmons, ''Principles of Genetics'', 5th ed. (DNA repair mechanisms) pp. 364\u2013368\u003c\u002fref\u003e Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: (1) [[nucleotide excision repair]], (2) [[DNA mismatch repair]], (3) [[non-homologous end joining]] of double-strand breaks, (4) [[homologous recombination|recombinational repair]] and (5) light-dependent repair ([[photolyase|photoreactivation]]).\u003cbr\u003e+Cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|DNA damage]] and carry out [[DNA repair|repair processes]] when damage is detected.\u003cref\u003e{{cite book |last1=Snustad |first1=D. Peter |last2=Simmons |first2=Michael J. |title=Principles of Genetics |edition=5th |at=DNA repair mechanisms, pp. 364\u2013368}}\u003c\u002fref\u003e Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: [[nucleotide excision repair]], [[DNA mismatch repair]], [[non-homologous end joining]] of double-strand breaks, [[homologous recombination|recombinational repair]] and light-dependent repair ([[photolyase|photoreactivation]]).\u003cbr\u003e \u003cbr\u003e === Growth and metabolism ===\u003cbr\u003e ","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -278,7 +278,7 @@\u003cbr\u003e \u003cbr\u003e Multicellularity has evolved independently at least 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal |last1= Grosberg |first1=R. K. |last2=Strathmann |first2=R. R. |url=http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |title=The evolution of multicellularity: A minor major transition? |journal=Annu Rev Ecol Evol Syst |year=2007 |volume=38 |pages=621\u2013654 |doi=10.1146\u002fannurev.ecolsys.36.102403.114735 |access-date=2013-12-23 |archive-date=2016-03-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |url-status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], ''[[Magnetoglobus multicellularis]]'', or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last=Popper |first=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e \u003cbr\u003e-The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested [[Grypania]] spiralis and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last=Albani |first=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain|display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e+The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested ''[[Grypania]] spiralis'' and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last=Albani |first=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The evolution of multicellularity from unicellular ancestors has been replicated in the laboratory, in [[experimental evolution|evolution experiments]] using predation as the [[selective pressure]].\u003cref name=\"Grosberg2007\"\u002f\u003e\u003cbr\u003e ","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -312,11 +312,10 @@\u003cbr\u003e \u003cbr\u003e [[File:RobertHookeMicrographia1665.jpg|thumb|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e-* 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cbr\u003e-* 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cbr\u003e-* 1839: [[Theodor Schwann]] and [[Matthias Jakob Schleiden]] elucidated the principle that plants and animals are made of cells, concluding that cells are a common unit of structure and development, and thus founding the cell theory.\u003cbr\u003e+* 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of  ''Symbiosis in Cell Evolution'' detailing how eukaryotic cells were created by [[symbiogenesis]].\u003cref name=\"Cornish-Bowden 2017\"\u003e{{Cite journal |last=Cornish-Bowden |first=Athel |title=Lynn Margulis and the origin of the eukaryotes |journal=[[Journal of Theoretical Biology]] |series=The origin of mitosing cells: 50th anniversary of a classic paper by Lynn Sagan (Margulis) |date=7 December 2017 |volume=434 |page=1 |doi=10.1016\u002fj.jtbi.2017.09.027 |pmid=28992902 |bibcode=2017JThBi.434....1C |url=https:\u002f\u002fwww.sciencedirect.com\u002fscience\u002farticle\u002fpii\u002fS0022519317304459 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == See also ==","--- Revision 83\u003cbr\u003e+++ Revision 84\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e \u003cbr\u003e-Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37&nbsp;trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells.\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last=Azevedo |first=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e\u003cbr\u003e+Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e \u003cbr\u003e@@ -23,6 +23,9 @@\u003cbr\u003e == Discovery ==\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cbr\u003e+\u003cbr\u003e+== Number of cells ==\u003cbr\u003e+The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e although more recent studies put this number at around 30 billion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref\u003e{{Cite journal |last=Hatton |first=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |url=https:\u002f\u002fpnas.org\u002fdoi\u002f10.1073\u002fpnas.2303077120 |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=PMC10523466 |pmid=37722043}}\u003c\u002fref\u003e The [[human brain]] ac 03cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]]  Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e ","--- Revision 89\u003cbr\u003e+++ Revision 90\u003cbr\u003e@@ -310,10 +310,9 @@\u003cbr\u003e [[Eukaryote|Eukaryotic]] cells were created some 2.2 billion years ago in a process called [[eukaryogenesis]]. This is widely agreed to have involved [[symbiogenesis]], in which [[archaea]] and [[bacteria]] came together to create the first eukaryotic common ancestor. This cell had a new level of complexity and capability, with a nucleus\u003cref name=\"McGrath 2022\"\u003e{{cite journal |last=McGrath |first=Casey |title=Highlight: Unraveling the Origins of LUCA and LECA on the Tree of Life |journal=Genome Biology and Evolution |volume=14 |issue=6 |date=31 May 2022 |doi=10.1093\u002fgbe\u002fevac072|pmc=9168435 }}\u003c\u002fref\u003e\u003cref name=\"Weiss et al 2016\"\u003e{{cite journal |last1=Weiss |first1=Madeline C. |last2=Sousa |first2=F. L. |last3=Mrnjavac |first3=N. |last4=Neukirchen |first4=S. |last5=Roettger |first5=M. |last6=Nelson-Sathi |first6=S. |last7=Martin |first7=William F. |author7-link=William F. Martin |display-authors=3 |s2cid=2997255 |year=2016 |title=The physiology and habitat of the last universal common ancestor |journal=Nature Microbiology |volume=1 |issue=9 |page=16116 |doi=10.1038\u002fnmicrobiol.2016.116 |pmid=27562259 |url=http:\u002f\u002fcomplexityexplorer.s3.amazonaws.com\u002fsupplemental_materials\u002f3.6+Early+Metabolisms\u002fWeiss_et_al_Nat_Microbiol_2016.pdf }}\u003c\u002fref\u003e and facultatively aerobic [[Mitochondrion|mitochondria]].\u003cref name=latorre\u003e{{cite book |last1=Latorre |first1=A. |last2=Durban |first2=A |last3=Moya |first3=A. |last4=Pereto |first4=J. |chapter-url=https:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |chapter=The role of symbiosis in eukaryotic evolution |title=Origins and Evolution of Life: An astrobiological perspective |editor1=Gargaud, Muriel |editor2=L\u00f3pez-Garc\u00eca, Purificacion |editor3=Martin, H. |year=2011 |location=Cambridge |publisher=Cambridge University Press |pages=326\u2013339 |isbn=978-0-521-76131-4 |access-date=27 August 2017 |archive-date=24 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190324055723\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |url-status=live }}\u003c\u002fref\u003e It evolved some 2 billion years ago into a population of single-celled organisms that included the last eukaryotic common ancestor, gaining capabilities along the way, though the sequence of the steps involved has been disputed, and may not have started with symbiogenesis. It featured at least one [[centriole]] and [[cilium]], sex ([[meiosis]] and [[syngamy]]), [[peroxisome]]s, and a dormant [[cyst]] with a cell wall of [[chitin]] and\u002for [[cellulose]].\u003cref\u003e{{cite journal |last=Leander |first=B. S. |title=Predatory protists |journal=Current Biology |volume=30 |issue=10 |pages=R510\u2013R516 |date=May 2020 |pmid=32428491 |doi=10.1016\u002fj.cub.2020.03.052 |s2cid=218710816 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"Strassert Irisarri Williams Burki 2021\"\u003e{{cite journal |last1=Strassert |first1=J\u00fcrgen F. H. |last2=Irisarri |first2=Iker |last3=Williams |first3=Tom A. |last4=Burki |first4=Fabien |title=A molecular timescale for eukaryote evolution with implications for the origin of red algal-derived plastids |journal=Nature Communications |volume=12 |issue=1 |date=25 March 2021 |page=1879 |doi=10.1038\u002fs41467-021-22044-z|pmid=33767194 |pmc=7994803 |bibcode=2021NatCo..12.1879S }}\u003c\u002fref\u003e In turn, the last eukaryotic common ancestor gave rise to the eukaryotes' [[crown group]], containing the ancestors of [[animal]]s, [[Fungus|fungi]], [[plant]]s, and a diverse range of single-celled organisms.\u003cref name=\"Gabald\u00f3n\"\u003e{{cite journal |last=Gabald\u00f3n |first=T. |title=Origin and Early Evolution of the Eukaryotic Cell |journal=Annual Review of Microbiology |volume=75 |issue=1 |pages=631\u2013647 |date=October 2021 |pmid=34343017 |doi=10.1146\u002fannurev-micro-090817-062213 |s2cid=236916203 }}\u003c\u002fref\u003e\u003cref name=\"w1990\"\u003e{{cite journal |last1=Woese |first1=C.R. |author1-link=Carl Woese |last2=Kandler |first2=Otto |author2-link=Otto Kandler |last3=Wheelis |first3=Mark L. |author3-link=Mark Wheelis |title=Towards a natural system of organisms: proposal for the domains Archaea, Bacteria, and Eucarya |journal=Proceedings of the National Academy of Sciences of the United States of America |volume=87 |issue=12 |pages=4576\u20134579 |date=June 1990 |pmid=2112744 |pmc=54159 |doi=10.1073\u002fpnas.87.12.4576 |bibcode=1990PNAS...87.4576W |doi-access=free }}\u003c\u002fref\u003e The plants were created around 1.6 billion years ago with a second episode of symbiogenesis that added [[chloroplast]]s, derived from [[cyanobacteria]].\u003cref name=latorre\u002f\u003e\u003cbr\u003e \u003cbr\u003e == History of research ==\u003cbr\u003e-\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e \u003cbr\u003e-[[File:RobertHookeMicrographia1665.jpg|thumb|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e+[[File:RobertHookeMicrographia1665.jpg|thumb|upright=.7|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e * 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -28,7 +28,7 @@\u003cbr\u003e The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last=Hatton |first=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |url=https:\u002f\u002fpnas.org\u002fdoi\u002f10.1073\u002fpnas.2303077120 |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043}}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last=Azevedo |first=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e Hatton et al. provide numbers for most other human organs.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e ==Cell types==\u003cbr\u003e-Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell @ BYJU'S|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJUS|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJU'S|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Prokaryotic cells===\u003cbr\u003e {{main|Prokaryote}}","--- Revision 91\u003cbr\u003e+++ Revision 92\u003cbr\u003e@@ -18,14 +18,14 @@\u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e \u003cbr\u003e-[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cref\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey}}\u003c\u002fref\u003e Cells emerged on Earth about 4 billion years ago.\u003cref name=\"Origin12\"\u003e{{cite journal |last=Schopf |first=J. William |last2=Kudryavtsev |first2=Anatoliy B. |last3=Czaja |first3=Andrew D. |last4=Tripathi |first4=Abhishek B. |date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009}}\u003c\u002fref\u003e\u003cref name=\"Origin22\"\u003e{{cite journal |last=Schopf |first=J. W. |date=June 2006 |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |doi=10.1098\u002frstb.2006.1834 |pmc=1578735 |pmid=16754604}}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson20022\"\u003e{{cite book |last1=Raven |first1=Peter Hamilton |url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave |title=Biology |last2=Johnson |first2=George B s are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cref\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey}}\u003c\u002fref\u003e Cells emerged on Earth about 4 billion years ago.\u003cref name=\"Origin12\"\u003e{{cite journal |last1=Schopf |first1=J. William |last2=Kudryavtsev |first2=Anatoliy B. |last3=Czaja |first3=Andrew D. |last4=Tripathi |first4=Abhishek B. |date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009}}\u003c\u002fref\u003e\u003cref name=\"Origin22\"\u003e{{cite journal |last=Schopf |first=J. W. |date=June 2006 |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |doi=10.1098\u002frstb.2006.1834 |pmc=1578735 |pmid=16754604}}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson20022\"\u003e{{cite book |last1=Raven |first1=Peter Hamilton |url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave |title=Biology |last2=Johnson |first2=George Brooks |publisher=McGraw-Hill Education |year=2002 |isbn=978-0071122610 |page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68] |access-date=7 July 2013 |url-access=registration}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily|archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Discovery ==\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cbr\u003e \u003cbr\u003e == Number of cells ==\u003cbr\u003e-The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 ryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJU'S|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e@@ -182,7 +182,7 @@\u003cbr\u003e \u003cbr\u003e ==== Eukaryotic and prokaryotic ====\u003cbr\u003e \u003cbr\u003e-* '''Ribosomes''': The [[ribosome]] is a large complex of [[RNA]] and [[protein]] molecules.\u003cref name=\"NCBI\"\u002f\u003e They each consist of two subunits, and act as an assembly line where RNA from the nucleus is used to synthesise proteins from amino acids. Ribosomes can be found either floating freely or bound to a membrane (the rough endoplasmatic reticulum in eukaryotes, or the cell membrane in prokaryotes).\u003cref\u003e{{cite journal  |last=M\u00e9n\u00e9tret |first=Jean-Fran\u00e7ois |last2=Schaletzky |first2=Julia |last3=Clemons |first3=William M. |last4=Osborne |first4=Andrew R. |last5=Sk\u00e5nland |first5=Sigrid S. |last6=Denison |first6=Carilee |last7=Gygi |first7=Steven P. |last8=Kirkpatrick |first8=Don S. |last9=Park |first9=Eunyong |last10=Ludtke |first10=Steven J. |last11=Rapoport |first11=Tom A. |last12=Akey |first12=Christopher W. |display-authors=3 |title=Ribosome binding of a single copy of the SecY complex: implications for protein translocation |journal=Molecular Cell |volume=28 |issue=6 |pages=1083\u20131092 |date=December 2007 |pmid=18158904 |doi=10.1016\u002fj.molcel.2007.10.034 |url=https:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |doi-access=free |access-date=2020-09-01 |archive-date=2021-01-21 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210121115905\u002fhttps:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+* '''Ribosomes''': The [[ribosome]] is a large complex of [[RNA]] and [[protein]] molecules.\u003cref name=\"NCBI\"\u002f\u003e They each consist of two subunits, and act as an assembly line where RNA from the nucleus is used to synthesise proteins from amino acids. Ribosomes can be found either floating freely or bound to a membrane (the rough endoplasmatic reticulum in eukaryotes, or the cell membrane in prokaryotes).\u003cref\u003e{{cite journal  |last1=M\u00e9n\u00e9tret |first1=Jean-Fran\u00e7ois |last2=Schaletzky |first2=Julia |last3=Clemons |first3=William M. |last4=Osborne |first4=Andrew R. |last5=Sk\u00e5nland |first5=Sigrid S. |last6=Denison |first6=Carilee |last7=Gygi |first7=Steven P. |last8=Kirkpatrick |first8=Don S. |last9=Park |first9=Eunyong |last10=Ludtke |first10=Steven J. |last11=Rapoport |first11=Tom A. |last12=Akey |first12=Christopher W. |display-authors=3 |title=Ribosome binding of a single copy of the SecY complex: implications for protein translocation |journal=Molecular Cell |volume=28 |issue=6 |pages=1083\u20131092 |date=December 2007 |pmid=18158904 |doi=10.1016\u002fj.molcel.2007.10.034 |url=https:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |doi-access=free |access-date=2020-09-01 |archive-date=2021-01-21 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210121115905\u002fhttps:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e * '''Plastids''': [[Plastid]] are membrane-bound organelle generally found in plant cells and [[Euglenid|euglenoids]] and contain specific ''pigments'', thus affecting the colour of the plant and organism. And these pigments also helps in food storage and tapping of light energy. There are three types of plastids based upon the specific pigments. [[Chloroplast]]s contain [[chlorophyll]] and some carotenoid pigments which helps in the tapping of light energy during photosynthesis. [[Chromoplast]]s contain fat-soluble [[carotenoid]] pigments like orange carotene and yellow xanthophylls which helps in synthesis and storage. [[Leucoplast]]s are non-pigmented plastids and helps in storage of nutrients.\u003cref\u003e{{cite book |last=Sato |first=N. |year=2006 |pages=75\u2013102 |title=The Structure and Function of Plastids |volume=23 |editor1=Wise, R. R. |editor2=Hoober, J. K. |publisher=Springer |chapter=Origin and Evolution of Plastids: Genomic View on the Unification and Diversity of Plastids |isbn=978-1-4020-4060-3 |doi=10.1007\u002f978-1-4020-4061-0_4 |series=Advances in Photosynthesis and Respiration}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Structures outside the cell membrane ==\u003cbr\u003e@@ -253,13 +253,13 @@\u003cbr\u003e \u003cbr\u003e Unicellular organisms can move in order to find food or escape predators. Common mechanisms of motion include [[flagella]] and [[cilia]].\u003cbr\u003e \u003cbr\u003e-In multicellular organisms, cells can move during processes such as wound healing, the immune response and [[cancer metastasis]]. For example, in wound healing in animals, white blood cells move to the wound site to kill the microorganisms that cause infection. Cell motility involves many receptors, crosslinking, bundling, binding, adhesion, motor and other proteins.\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u003e{{cite journal |last1=Ananthakrishnan |first1=R. |last2=Ehrlicher |first2=A. |title=The forces behind cell movement |journal=International Journal of Biological Sciences |volume=3 |issue=5 |pages=303\u2013317 |date=June 2007 |pmid=17589565 |pmc=1893118 |doi=10.7150\u002fijbs.3.303 |publisher=Biolsci.org }}\u003c\u002fref\u003e The process is divided into three steps: protrusion of the leading edge of the cell, adhesion of the leading edge and de-adhesion at the cell body and rear, and cytoskeletal contraction to pull the cell forward. Each step is driven by physical forces generated by unique segments of the cytoskeleton.\u003cref name=\"Alberts2\"\u003e{{cite book |last1=Alberts |first=Bruce |title=Molecular biology of the cell |date=2002 |publisher=Garland Science |isbn=0815340729 |pages=973\u2013975 |edition=4th}}\u003c\u002fref\u003e\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u002f\u003e\u003cbr\u003e+In multicellular organisms, cells can move during processes such as wound healing, the immune response and [[cancer metastasis]]. For example, in wound healing in animals, white blood cells move to the wound site to kill the microorganisms that cause infection. Cell motility involves many receptors, crosslinking, bundling, binding, adhesion, motor and other proteins.\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u003e{{cite journal |last1=Ananthakrishnan |first1=R. |last2=Ehrlicher |first2=A. |title=The forces behind cell movement |journal=International Journal of Biological Sciences |volume=3 |issue=5 |pages=303\u2013317 |date=June 2007 |pmid=17589565 |pmc=1893118 |doi=10.7150\u002fijbs.3.303 |publisher=Biolsci.org }}\u003c\u002fref\u003e The process is divided into three steps: protrusion of the leading edge of the cell, adhesion of the leading edge and de-adhesion at the cell body and rear, and cytoskeletal contraction to pull the cell forward. Each step is driven by physical forces generated by unique segments of the cytoskeleton.\u003cref name=\"Alberts2\"\u003e{{cite book |last1=Alberts |first1=Bruce |title=Molecular biology of the cell |date=2002 |publisher=Garland Science |isbn=0815340729 |pages=973\u2013975 |edition=4th}}\u003c\u002fref\u003e\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e ==== Navigation, control and communication ====\u003cbr\u003e \u003cbr\u003e {{See also|Cybernetics#In biology}}\u003cbr\u003e \u003cbr\u003e-In August 2020, scientists described one way cells\u2014in particular cells of a slime mold and mouse pancreatic cancer-derived cells\u2014are able to [[Chemotaxis|navigate]] efficiently through a body and identify the best routes through complex mazes: generating gradients after breaking down diffused [[chemoattractant]]s which enable them to sense upcoming maze junctions before reaching them, including around corners.\u003cref\u003e{{cite news |last1=Willingham |first1=Emily |title=Cells Solve an English Hedge Maze with the Same Skills They Use to Traverse the Body |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |access-date=7 September 2020 |work=Scientific American |language=en |archive-date=4 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200904102655\u002fhttps:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fcells-solve-an-english-hedge-maze-with-the-same-skills-they-use-to-traverse-the-body\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite news |title=How cells can find their way through the human body |url=https:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |access-date=7 September 2020 |work=phys.org |language=en |archive-date=3 September 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200903220400\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2020-08-cells-human-body.html |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last=Tweedy |first=Luke |last2=Thomason |first2=Peter A. |last3=Paschke |first3=Peggy I. |last4=Martin |first4=Kirsty |last5=Machesky |first5=Laura M. status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], ''[[Magnetoglobus multicellularis]]'', or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last=Popper |first=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url= st 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal |last1= Grosberg |first1=R. K. |last2=Strathmann |first2=R. R. |url=http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |title=The evolution of multicellularity: A minor major transition? |journal=Annu Rev Ecol Evol Syst |year=2007 |volume=38 |pages=621\u2013654 |doi=10.1146\u002fannurev.ecolsys.36.102403.114735 |access-date=2013-12-23 |archive-date=2016-03-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |url-status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], ''[[Magnetoglobus multicellularis]]'', or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last1=Popper |first1=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e+\u003cbr\u003e+The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested ''[[Grypania]] spiralis'' and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last1=Albani |first1=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The evolution of multicellularity from unicellular ancestors has been replicated in the laboratory, in [[experimental evolution|evolution experiments]] using predation as the [[selective pressure]].\u003cref name=\"Grosberg2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -299,7 +299,7 @@\u003cbr\u003e \u003cbr\u003e There are several theories about the origin of small molecules that led to life on the [[early Earth]]. They may have been carried to Earth on meteorites (see [[Murchison meteorite]]), created at [[Hydrothermal vent|deep-sea vents]], or synthesized by lightning in a reducing atmosphere (see [[Miller\u2013Urey experiment]]). There is little experimental data defining what the first self-replicating forms were. [[RNA]] is thought to be the earliest self-replicating molecule, as it is capable of both storing genetic information and catalyzing chemical reactions (see [[RNA world hypothesis]]), but some other entity with the potential to self-replicate could have preceded RNA, such as [[Abiogenesis#Clay|clay]] or [[peptide nucleic acid]].\u003cref name=OrgelLE\u003e{{cite journal |last= Orgel |first=L. E. |title=The origin of life--a review of facts and speculations |journal=Trends in Biochemical Sciences |volume=23 |issue=12 |pages=491\u2013495 |date=December 1998 |pmid=9868373 | \u002fsupplemental_materials\u002f3.6+Early+Metabolisms\u002fWeiss_et_al_Nat_Microbiol_2016.pdf }}\u003c\u002fref\u003e and facultatively aerobic [[Mitochondrion|mitochondria]].\u003cref name=latorre\u003e{{cite book |last1=Latorre |first1=A. |last2=Durban |first2=A |last3=Moya |first3=A. |last4=Pereto |first4=J. |chapter-url=https:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |chapter=The role of symbiosis in eukaryotic evolution |title=Origins and Evolution of Life: An astrobiological perspective |editor1=Gargaud, Muriel |editor2=L\u00f3pez-Garc\u00eca, Purificacion |editor3=Martin, H. |year=2011 |location=Cambridge |publisher=Cambridge University Press |pages=326\u2013339 |isbn=978-0-521-76131-4 |access-date=27 August 2017 |archive-date=24 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190324055723\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |url-status=live }}\u003c\u002fref\u003e It evolved some 2 billion years ago into a population of single-celled organisms that included the last eukaryotic common ancestor, gaining capabilities along the way, though the sequence of the steps involved has been disputed, and may not have started with symbiogenesis. It featured at least one [[centriole]] and [[cilium]], sex ([[meiosis]] and [[syngamy]]), [[peroxisome]]s, and a dormant [[cyst]] with a cell wall of [[chitin]] and\u002for [[cellulose]].\u003cref\u003e{{cite journal |last=Leander |first=B. S. |title=Predatory protists |journal=Current Biology |volume=30 |issue=10 |pages=R510\u2013R516 |date=May 2020 |pmid=32428491 |doi=10.1016\u002fj.cub.2020.03.052 |s2cid=218710816 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"Strassert Irisarri Williams Burki 2021\"\u003e{{cite journal |last1=Strassert |first1=J\u00fcrgen F. H. |last2=Irisarri |first2=Iker |last3=Williams |first3=Tom A. |last4=Burki |first4=Fabien |title=A molecular timescale for eukaryote evolution with implications for the o
