=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last1=Hatton |first1=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |pages=e2303077120 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043|bibcode=2023PNAS..12003077H }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last1=Azevedo |first1=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e Hatton et al. provide numbers for most other human organs.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e ==Cell types==\u003cbr\u003e Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJU'S|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e","--- Revision 93\u003cbr\u003e+++ Revision 94\u003cbr\u003e@@ -109,7 +109,7 @@\u003cbr\u003e |-\u003cbr\u003e !Organization\u003cbr\u003e |usually single cells\u003cbr\u003e-|single cells, colonies, higher multicellular organisms with specialized cells\u003cbr\u003e+|single cells, colonies, higher [[Multicellular organism|multicellular organisms]] with specialized cells\u003cbr\u003e |-\u003cbr\u003e ![[Cell division]]\u003cbr\u003e |[[binary fission]] (simple division)","--- Revision 94\u003cbr\u003e+++ Revision 95\u003cbr\u003e@@ -21,17 +21,23 @@\u003cbr\u003e [[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cref\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey}}\u003c\u002fref\u003e Cells emerged on Earth about 4 billion years ago.\u003cref name=\"Origin12\"\u003e{{cite journal |last1=Schopf |first1=J. William |last2=Kudryavtsev |first2=Anatoliy B. |last3=Czaja |first3=Andrew D. |last4=Tripathi |first4=Abhishek B. |date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009}}\u003c\u002fref\u003e\u003cref name=\"Origin22\"\u003e{{cite journal |last=Schopf |first=J. W. |date=June 2006 |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |doi=10.1098\u002frstb.2006.1834 |pmc=1578735 |pmid=16754604}}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson20022\"\u003e{{cite book |last1=Raven |first1=Peter Hamilton |url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave |title=Biology |last2=Johnson |first2=George Brooks |publisher=McGraw-Hill Education |year=2002 |isbn=978-0071122610 |page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68] |access-date=7 July 2013 |url-access=registration}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily|archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Discovery ==\u003cbr\u003e+\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e+\u003cbr\u003e With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cbr\u003e \u003cbr\u003e == Number of cells ==\u003cbr\u003e+\u003cbr\u003e The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last1=Hatton |first1=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |pages=e2303077120 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043|bibcode=2023PNAS..12003077H }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last1=Azevedo |first1=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e Hatton et al. provide numbers for most other human organs.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-==Cell types==\u003cbr\u003e-Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJU'S|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-===Prokaryotic cells===\u003cbr\u003e+== Cell types ==\u003cbr\u003e+\u003cbr\u003e+Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web |title=Differences Between Prokaryotic Cell and Eukaryotic Cell |url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f |access-date=2021-09-18 |website=BYJU'S |archive-date=2021-10-09 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Prokaryotic cells ===\u003cbr\u003e+\u003cbr\u003e {{main|Prokaryote}}\u003cbr\u003e+\u003cbr\u003e [[File:Prokaryote cell.svg|thumb|upright=1.25|Structure of a typical [[prokaryotic]] cell]]\u003cbr\u003e \u003cbr\u003e [[Prokaryote]]s include [[bacteria]] and [[archaea]], two of the [[three domain system|three]] [[Domain (biology)|domains of life]]. Prokaryotic cells were the first form of [[life]] on Earth, characterized by having vital [[biological process]]es including [[cell signaling]]. They are simpler and smaller than eukaryotic cells, and lack a [[cell nucleus|nucleus]], and other membrane-bound [[organelle]]s. The [[DNA]] of a prokaryotic cell consists of a single [[Circular prokaryote chromosome|circular chromosome]] that is in direct contact with the [[cytoplasm]]. The nuclear region in the cytoplasm is called the [[nucleoid]]. Most prokaryotes are the smallest of all organisms ranging from 0.5 to 2.0&nbsp;\u03bcm in diameter.\u003cref name=\"Black 2004 p. \"\u003e{{cite book |last=Black |first=Jacquelyn G. |title=Microbiology |publisher=Wiley |publication-place=New York Chichester |date=2004 |isbn=978-0-471-42084-2 |page=}}\u003c\u002fref\u003e{{pn|date=September 2023}}\u003cbr\u003e@@ -48,13 +54,15 @@\u003cbr\u003e \u003cbr\u003e Cell shape, also called cell morphology, has been hypothesized to form from the arrangement and movement of the cytoskeleton.\u003cref name=\"Pichoff Lutkenhaus 2007\"\u003e{{Cite journal |last1=Pichoff |first1=Sebastien |last2=Lutkenhaus |first2=Joe |date=2007-12-01 |title=Overview of cell shape: cytoskeletons shape bacterial cells |journal=Current Opinion in Microbiology |series=Growth and Development |volume=10 |issue=6 |pages=601\u2013605 |doi=10.1016\u002fj.mib.2007.09.005 |pmid=17980647 |pmc=2703429 |issn=1369-5274 }}\u003c\u002fref\u003e Many advancements in the study of cell morphology come from studying simple bacteria such as ''[[Staphylococcus aureus]]'',\u00a0''[[Escherichia coli|E. coli]]'',\u00a0and [[Bacillus subtilis|''B. subtilis''.]]\u003cref name=\"Kysela-2016\"\u003e{{Cite journal |last1=Kysela |first1=David T. |last2=Randich |first2=Amelia M. |last3=Caccamo |first3=Paul D. |last4=Brun |first4=Yves V. |date=2016-10-03 |title=Diversity Takes Shape: Understanding the Mechanistic and Adaptive Basis of Bacterial Morphology |journal=PLOS Biology |volume=14 |issue=10 |page=e1002565 |doi=10.1371\u002fjournal.pbio.1002565 |pmid=27695035 |pmc=5047622 |issn=1545-7885 |doi-access=free }}\u003c\u002fref\u003e Different cell shapes have been found and described, but how and why cells form different shapes is still widely unknown.\u003cref name=\"Kysela-2016\" \u002f\u003e Some cell shapes that have been identified include rods, cocci and spirochaetes. Cocci are circular, bacilli are elongated rods, and spirochaetes are spiral in form.\u003cref name=\"Pichoff Lutkenhaus 2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Eukaryotic cells===\u003cbr\u003e+=== Eukaryotic cells ===\u003cbr\u003e+\u003cbr\u003e {{main|Eukaryote}}\u003cbr\u003e \u003cbr\u003e [[File:Animal cell structure en.svg|thumb|upright=1.25|Structure of a typical animal cell]]\u003cbr\u003e [[File:Plant cell structure-en.svg|thumb|upright=1.25|Structure of a typical [[plant cell]]]]\u003cbr\u003e \u003cbr\u003e [[Plants]], [[animals]], [[fungi]], [[slime mould]]s, [[protozoa]], and [[algae]] are all [[eukaryotic]]. These cells are about fifteen times wider than a typical prokaryote and can be as much as a thousand times greater in volume. The main distinguishing feature of eukaryotes as compared to prokaryotes is [[Cellular compartment|compartmentalization]]: the presence of membrane-bound [[organelle]]s (compartments) in which specific activities take place. Most important among these is a [[cell nucleus]],\u003cref name=\"NCBI\"\u002f\u003e an organelle that houses the cell's [[DNA]]. This nucleus gives the eukaryote its name, which means \"true kernel (nucleus)\". Some of the other differences are:\u003cbr\u003e+\u003cbr\u003e * The plasma membrane resembles that of prokaryotes in function, with minor differences in the setup. Cell walls may or may not be present.\u003cbr\u003e * The eukaryotic DNA is organized in one or more linear molecules, called [[chromosome]]s, which are associated with [[histone]] proteins. All chromosomal DNA is stored in the [[cell nucleus]], separated from the cytoplasm by a membrane.\u003cref name=\"NCBI\"\u002f\u003e Some eukaryotic organelles such as [[mitochondria]] also contain some DNA.\u003cbr\u003e * Many eukaryotic cells are [[cilium|ciliated]] with [[primary cilia]]. Primary cilia play important roles in chemosensation, [[mechanosensation]], and [[thermosensation]]. Each cilium may thus be \"viewed as a sensory cellular [[Antenna (biology)|antennae]] that coordinates a large number of cellular signaling pathways, sometimes coupling the signaling to ciliary motility or alternatively to cell division and differentiation.\"\u003cref name=\"Christenson2008\"\u003e{{cite journal |last1=Satir |first1=P. |last2=Christensen |first2=S\u00f8ren T. |title=Structure and function of mammalian cilia |journal=Histochemistry and Cell Biology |volume=129 |issue=6 |pages=687\u2013693 |date=June 2008 |pmid=18365235 |pmc=2386530 |doi=10.1007\u002fs00418-008-0416-9 |id=1432-119X }}\u003c\u002fref\u003e\u003cbr\u003e@@ -228,7 +236,7 @@\u003cbr\u003e \u003cbr\u003e {{main|DNA repair}}\u003cbr\u003e \u003cbr\u003e-Cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|DNA damage]] and carry out [[DNA repair|repair processes]] when damage is detected.\u003cref\u003e{{cite book |last1=Snustad |first1=D. Peter |last2=Simmons |first2=Michael J. |title=Principles of Genetics |edition=5th |at=DNA repair mechanisms, pp. 364\u2013368}}\u003c\u002fref\u003e Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: [[nucleotide excision repair]], [[DNA mismatch repair]], [[non-homologous end joining]] of double-strand breaks, [[homologous recombination|recombinational repair]] and light-dependent repair ([[photolyase|photoreactivation]]).\u003cbr\u003e+Cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|DNA damage]] and carry out [[DNA repair|repair processes]] when damage is detected. Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: [[nucleotide excision repair]], [[DNA mismatch repair]], [[non-homologous end joining]] of double-strand breaks, [[homologous recombination|recombinational repair]] and light-dependent repair ([[photolyase|photoreactivation]]).\u003cref\u003e{{cite book |last1=Snustad |first1=D. Peter |last2=Simmons |first2=Michael J. |title=Principles of Genetics |edition=5th |at=DNA repair mechanisms, pp. 364\u2013368}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Growth and metabolism ===\u003cbr\u003e \u003cbr\u003e@@ -239,8 +247,6 @@\u003cbr\u003e \u003cbr\u003e === Protein synthesis ===\u003cbr\u003e \u003cbr\u003e-\u003c!--[[File:Proteinsynthesis.png|thumb|An overview of protein synthesis.\u003cbr \u002f\u003eWithin the [[cell nucleus|nucleus]] of the cell (''light blue''), [[gene]]s (DNA, ''dark blue'') are [[transcription (genetics)|transcribed]] into [[RNA]]. This RNA is then subject to post-transcriptional modification and control, resulting in a mature [[mRNA]] (''red'') that is then transported out of the nucleus and into the [[cytoplasm]] (''peach''), where it undergoes [[translation (genetics)|translation]] into a protein. mRNA is translated by [[ribosome]]s (''purple'') that match the three-base [[codon]]s of the mRNA to the three-base anti-codons of the appropriate [[transfer RNA|tRNA]]. Newly synthesized proteins (''black'') are often further modified, such as by binding to an effector molecule (''orange''), to become fully active.]]--\u003e\u003cbr\u003e-\u003cbr\u003e {{main|Protein biosynthesis}}\u003cbr\u003e \u003cbr\u003e Cells are capable of synthesizing new proteins, which are essential for the modulation and maintenance of cellular activities. This process involves the formation of new protein molecules from [[amino acid]] building blocks based on information encoded in DNA\u002fRNA. Protein synthesis generally consists of two major steps: [[transcription (genetics)|transcription]] and [[translation (genetics)|translation]].\u003cbr\u003e@@ -285,13 +291,13 @@\u003cbr\u003e \u003cbr\u003e The evolution of multicellularity from unicellular ancestors has been replicated in the laboratory, in [[experimental evolution|evolution experiments]] using predation as the [[selective pressure]].\u003cref name=\"Grosberg2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==Origins==\u003c!-- This section is linked from [[Timeline of evolution]] --\u003e\u003cbr\u003e+== Origins ==\u003c!-- This section is linked from [[Timeline of evolution]] --\u003e\u003cbr\u003e \u003cbr\u003e {{main|Evolutionary history of life}}\u003cbr\u003e \u003cbr\u003e The origin of cells has to do with the [[Abiogenesis|origin of life]], which began the [[timeline of evolution|history of life]] on Earth.\u003cbr\u003e \u003cbr\u003e-===Origin of the first cell===\u003cbr\u003e+=== Origin of the first cell ===\u003cbr\u003e \u003cbr\u003e [[File:Stromatolites.jpg|thumb|[[Stromatolites]] are left behind by [[cyanobacteria]], also called blue-green algae. They are the oldest known fossils of life on Earth. This one-billion-year-old fossil is from [[Glacier National Park (U.S.)|Glacier National Park]] in the United States.]]\u003cbr\u003e \u003cbr\u003e@@ -310,9 +316,10 @@\u003cbr\u003e [[Eukaryote|Eukaryotic]] cells were created some 2.2 billion years ago in a process called [[eukaryogenesis]]. This is widely agreed to have involved [[symbiogenesis]], in which [[archaea]] and [[bacteria]] came together to create the first eukaryotic common ancestor. This cell had a new level of complexity and capability, with a nucleus\u003cref name=\"McGrath 2022\"\u003e{{cite journal |last=McGrath |first=Casey |title=Highlight: Unraveling the Origins of LUCA and LECA on the Tree of Life |journal=Genome Biology and Evolution |volume=14 |issue=6 |date=31 May 2022 |pages=evac072 |doi=10.1093\u002fgbe\u002fevac072|pmc=9168435 }}\u003c\u002fref\u003e\u003cref name=\"Weiss et al 2016\"\u003e{{cite journal |last1=Weiss |first1=Madeline C. |last2=Sousa |first2=F. L. |last3=Mrnjavac |first3=N. |last4=Neukirchen |first4=S. |last5=Roettger |first5=M. |last6=Nelson-Sathi |first6=S. |last7=Martin |first7=William F. |author7-link=William F. Martin |display-authors=3 |s2cid=2997255 |year=2016 |title=The physiology and habitat of the last universal common ancestor |journal=Nature Microbiology |volume=1 |issue=9 |page=16116 |doi=10.1038\u002fnmicrobiol.2016.116 |pmid=27562259 |url=http:\u002f\u002fcomplexityexplorer.s3.amazonaws.com\u002fsupplemental_materials\u002f3.6+Early+Metabolisms\u002fWeiss_et_al_Nat_Microbiol_2016.pdf }}\u003c\u002fref\u003e and facultatively aerobic [[Mitochondrion|mitochondria]].\u003cref name=latorre\u003e{{cite book |last1=Latorre |first1=A. |last2=Durban |first2=A |last3=Moya |first3=A. |last4=Pereto |first4=J. |chapter-url=https:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |chapter=The role of symbiosis in eukaryotic evolution |title=Origins and Evolution of Life: An astrobiological perspective |editor1=Gargaud, Muriel |editor2=L\u00f3pez-Garc\u00eca, Purificacion |editor3=Martin, H. |year=2011 |location=Cambridge |publisher=Cambridge University Press |pages=326\u2013339 |isbn=978-0-521-76131-4 |access-date=27 August 2017 |archive-date=24 March 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190324055723\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=m3oFebknu1cC&pg=PA326 |url-status=live }}\u003c\u002fref\u003e It evolved some 2 billion years ago into a population of single-celled organisms that included the last eukaryotic common ancestor, gaining capabilities along the way, though the sequence of the steps involved has been disputed, and may not have started with symbiogenesis. It featured at least one [[centriole]] and [[cilium]], sex ([[meiosis]] and [[syngamy]]), [[peroxisome]]s, and a dormant [[cyst]] with a cell wall of [[chitin]] and\u002for [[cellulose]].\u003cref\u003e{{cite journal |last=Leander |first=B. S. |title=Predatory protists |journal=Current Biology |volume=30 |issue=10 |pages=R510\u2013R516 |date=May 2020 |pmid=32428491 |doi=10.1016\u002fj.cub.2020.03.052 |s2cid=218710816 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"Strassert Irisarri Williams Burki 2021\"\u003e{{cite journal |last1=Strassert |first1=J\u00fcrgen F. H. |last2=Irisarri |first2=Iker |last3=Williams |first3=Tom A. |last4=Burki |first4=Fabien |title=A molecular timescale for eukaryote evolution with implications for the origin of red algal-derived plastids |journal=Nature Communications |volume=12 |issue=1 |date=25 March 2021 |page=1879 |doi=10.1038\u002fs41467-021-22044-z|pmid=33767194 |pmc=7994803 |bibcode=2021NatCo..12.1879S }}\u003c\u002fref\u003e In turn, the last eukaryotic common ancestor gave rise to the eukaryotes' [[crown group]], containing the ancestors of [[animal]]s, [[Fungus|fungi]], [[plant]]s, and a diverse range of single-celled organisms.\u003cref name=\"Gabald\u00f3n\"\u003e{{cite journal |last=Gabald\u00f3n |first=T. |title=Origin and Early Evolution of the Eukaryotic Cell |journal=Annual Review of Microbiology |volume=75 |issue=1 |pages=631\u2013647 |date=October 2021 |pmid=34343017 |doi=10.1146\u002fannurev-micro-090817-062213 |s2cid=236916203 }}\u003c\u002fref\u003e\u003cref name=\"w1990\"\u003e{{cite journal |last1=Woese |first1=C.R. |author1-link=Carl Woese |last2=Kandler |first2=Otto |author2-link=Otto Kandler |last3=Wheelis |first3=Mark L. |author3-link=Mark Wheelis |title=Towards a natural system of organisms: proposal for the domains Archaea, Bacteria, and Eucarya |journal=Proceedings of the National Academy of Sciences of the United States of America |volume=87 |issue=12 |pages=4576\u20134579 |date=June 1990 |pmid=2112744 |pmc=54159 |doi=10.1073\u002fpnas.87.12.4576 |bibcode=1990PNAS...87.4576W |doi-access=free }}\u003c\u002fref\u003e The plants were created around 1.6 billion years ago with a second episode of symbiogenesis that added [[chloroplast]]s, derived from [[cyanobacteria]].\u003cref name=latorre\u002f\u003e\u003cbr\u003e \u003cbr\u003e == History of research ==\u003cbr\u003e+\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e \u003cbr\u003e-[[File:RobertHookeMicrographia1665.jpg|thumb|upright=.7|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e+[[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e * 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e","--- Revision 95\u003cbr\u003e+++ Revision 96\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e \u003cbr\u003e-Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e+Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]].\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e ","--- Revision 96\u003cbr\u003e+++ Revision 97\u003cbr\u003e@@ -18,7 +18,7 @@\u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e \u003cbr\u003e-[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork unde ame=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago.\u003cbr\u003e \u003cbr\u003e == Number of cells ==\u003cbr\u003e \u003cbr\u003e@@ -322,6 +316,8 @@\u003cbr\u003e {{main|Cell theory}}\u003cbr\u003e \u003cbr\u003e [[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e+\u003cbr\u003e+With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e * 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e"],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"HzTzwOmg+MBY1PzAvQkTwYK4EcF5QxPBojQcweNKGcFSiRnBX\u002fIbwZwuGsE="},"y":{"dtype":"f4","bdata":"6RC5QBgrs0A017BA1xqiQANzpkDZ+aNAByGgQP7lmUAqgpxA+XOZQImyk0A="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e |Caption2 =A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of all [[life form|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\
