        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="7197cf0e-57e0-4f7f-84ff-f835c67d6830" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("7197cf0e-57e0-4f7f-84ff-f835c67d6830")) {                    Plotly.newPlot(                        "7197cf0e-57e0-4f7f-84ff-f835c67d6830",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -18,8 +18,7 @@\u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e \u003cbr\u003e-[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cbr\u003e-[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp 20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref name=Tero 1990\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago.\u003cbr\u003e+[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery. [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago.\u003cbr\u003e \u003cbr\u003e == Number of cells ==\u003cbr\u003e \u003cbr\u003e@@ -318,7 +317,7 @@\u003cbr\u003e \u003cbr\u003e [[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e-With continual improvements made to [[Microscope|microscopes]] over time, magnification technology became advanced enough to discover cells. This discovery is largely attributed to [[Robert Hooke]], and began the scientific study of cells, known as [[cell biology]]. When observing a piece of cork under the scope, he was able to see pores. This was shocking at the time as it was believed no one else had seen these. To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e+In 1665, [[Robert Hooke]] examined a thin slice of cork under his [[microscope]], and saw a structure of small enclosures. He named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp 20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref name=\"Tero 1990\"\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e * 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e |Caption2 =A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002 e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref name=\"Tero 1990\"\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e-* 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u002f\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e\u003cbr\u003e+* 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e\u003cbr\u003e * 1839: [[Theodor Schwann]]\u003cref\u003e{{cite book |last=Schwann |first=Theodor |author-link=Theodor Schwann |year=1839 |title=Mikroskopische Untersuchungen \u00fcber die Uebereinstimmung in der Struktur und dem Wachsthum der Thiere und Pflanzen |publisher=Sander |place=Berlin |url=http:\u002f\u002fwww.deutschestextarchiv.de\u002fbook\u002fshow\u002fschwann_mikroskopische_1839}}\u003c\u002fref\u003e and [[Matthias Jakob Schleiden]] elucidated the principle that plants and animals are made of cells, concluding that cells are a common unit of structure and development, and thus founding the cell theory.\u003cbr\u003e * 1855: [[Rudolf Virchow]] stated that new cells come from pre-existing cells by [[cell division]] (''omnis cellula ex cellula'').\u003cbr\u003e * 1931: [[Ernst Ruska]] built the first [[transmission electron microscope]] (TEM) at the [[University of Berlin]].\u003cref name=\"Ruska\"\u003e{{cite book |title=The Early Development of Electron Lenses and Electron Microscopy |series=Applied Optics |volume=25 |issue=6 |pages=820 |author1=Ernst Ruska |translator=T. Mulvey |isbn=978-3-7776-0364-3 |date=January 1980 |bibcode=1986ApOpt..25..820R }}\u003c\u002fref\u003e By 1935, he had built an EM with twice the resolution of a light microscope, revealing previously unresolvable organelles.","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e \u003cbr\u003e-Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]].\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e+Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]].\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e \u003cbr\u003e@@ -39,7 +39,7 @@\u003cbr\u003e A prokaryotic cell has three regions:\u003cbr\u003e \u003cbr\u003e * Enclosing the cell is the [[cell envelope]], generally consisting of a [[plasma membrane]] covered by a [[cell wall]] which, for some bacteria, may be further covered by a third layer called a [[bacterial capsule|capsule]]. Though most prokaryotes have both a cell membrane and a cell wall, there are exceptions such as ''[[Mycoplasma]]'' (bacteria) and ''[[Thermoplasma]]'' (archaea) which only possess the cell membrane layer. The envelope gives rigidity to the cell and separates the interior of the cell from its environment, serving as a protective filter. The cell wall consists of [[peptidoglycan]] in bacteria and acts as an additional barrier against exterior forces. It also prevents the cell from expanding and bursting ([[cytolysis]]) from [[osmotic pressure]] due to a [[hypotonic]] environment. Some eukaryotic cells ([[plant cell]]s and [[fungal]] cells) also have a cell wall.\u003cbr\u003e-* Inside the cell is the [[cytoplasm|cytoplasmic region]] that contains the [[genome]] (DNA), ribosomes and various sorts of inclusions.\u003cref name=\"NCBI\"\u002f\u003e The genetic material is freely found in the cytoplasm. Prokaryotes can carry [[extrachromosomal DNA]] elements called [[plasmid]]s, which are usually circular. Linear bacterial plasmids have been identified in several species of [[spirochete]] bacteria, including members of the genus ''[[Borrelia]]'' notably ''[[Borrelia burgdorferi]]'', which causes Lyme disease.\u003cref\u003eEuropean Bioinformatics Institute, [http:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html Karyn's Genomes: Borrelia burgdorferi] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130506040937\u002fhttp:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html |date=2013-05-06 }}, part of 2can on the EBI-EMBL database. Retrieved 5 August 2012\u003c\u002fref\u003e Though not forming a nucleus, the [[DNA]] is condensed in a [[nucleoid]]. Plasmids encode additional genes, such as [[antibiotic resistance]] genes.\u003cbr\u003e+* Inside the cell is the [[cytoplasm|cytoplasmic region]] that contains the [[genome]] (DNA), ribosomes and various sorts of inclusions.\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer |article=What Is a Cell? |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html |access-date=3 May 2013 |date=30 March 2004}}\u003c\u002fref\u003e The genetic material is freely found in the cytoplasm. Prokaryotes can carry [[extrachromosomal DNA]] elements called [[plasmid]]s, which are usually circular. Linear bacterial plasmids have been identified in several species of [[spirochete]] bacteria, including members of the genus ''[[Borrelia]]'' notably ''[[Borrelia burgdorferi]]'', which causes Lyme disease.\u003cref\u003eEuropean Bioinformatics Institute, [http:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html Karyn's Genomes: Borrelia burgdorferi] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130506040937\u002fhttp:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html |date=2013-05-06 }}, part of 2can on the EBI-EMBL database. Retrieved 5 August 2012\u003c\u002fref\u003e Though not forming a nucleus, the [[DNA]] is condensed in a [[nucleoid]]. Plasmids encode additional genes, such as [[antibiotic resistance]] genes.\u003cbr\u003e * On the outside, some prokaryotes have [[flagella]] and [[Pilus|pili]] that project from the cell's surface. These are structures made of proteins that facilitate movement and communication between cells.\u003cbr\u003e \u003cbr\u003e ==== Bacterial shapes ====","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e \u003cbr\u003e Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e \u003cbr\u003e-Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]].\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e+Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e ","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -10,11 +10,11 @@\u003cbr\u003e |Caption2 =A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[macromolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many [[small molecule]]s of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cbr\u003e-\u003cbr\u003e-Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA repair]], protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. \u003cbr\u003e-\u003cbr\u003e-Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). Most [[unicellular organism]]s are classed as [[microorganism]]s. \u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]]; many cells contain [[organelle]]s, each with a specific function. The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cbr\u003e+\u003cbr\u003e+Within the cell, organelles carry out specialised functions such as [[Self-replication|replication]], [[DNA repair]], [[protein synthesis]], and [[cell motility|motility]]. \u003cbr\u003e+\u003cbr\u003e+Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e ","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -22,7 +22,7 @@\u003cbr\u003e \u003cbr\u003e == Number of cells ==\u003cbr\u003e \u003cbr\u003e-The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last1=Hatton |first1=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |pages=e2303077120 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043|bibcode=2023PNAS..12003077H }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last1=Azevedo |first1=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e Hatton et al. provide numbers for most other human organs.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e+The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last1=Hatton |first1=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |pages=e2303077120 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043|bibcode=2023PNAS..12003077H }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=3 |last1=Azevedo |first1=Frederico A.C. |last2=Carvalho |first2=Ludmila R.B. |last3=Grinberg |first3=Lea T. |last4=Farfel |first4=Jos\u00e9 Marcelo |last5=Ferretti |first5=Renata E.L. |last6=Leite |first6=Renata E.P. |last7=Filho |first7=Wilson Jacob |last8=Lent |first8=Roberto |last9=Herculano-Houzel |first9=Suzana |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Cell types ==\u003cbr\u003e ","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e \u003cbr\u003e Within the cell, organelles carry out specialised functions such as [[Self-replication|replication]], [[DNA repair]], [[protein synthesis]], and [[cell motility|motility]]. \u003cbr\u003e \u003cbr\u003e-Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals). \u003cbr\u003e+Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s such as [[bacteria]], whereas eukaryotes can be either single-celled, such as [[amoeba]]e, or [[multicellular organism|multicellular]], such as some [[Algae|alga]]e, [[plant]]s, [[animal]]s, and [[Fungus|fungi]]. \u003cbr\u003e \u003cbr\u003e The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e ","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -220,11 +220,11 @@\u003cbr\u003e \u003cbr\u003e {{main|Cell division}}\u003cbr\u003e \u003cbr\u003e-Cell division involves a single cell (called a ''mother cell'') dividing into two daughter cells. This leads to growth in [[multicellular organism]]s (the growth of [[biological tissue|tissue]]) and to procreation ([[vegetative reproduction]]) in [[unicellular organism]]s. [[Prokaryote|Prokaryotic]] cells divide by [[binary fission]], while [[Eukaryote|eukaryotic]] cells usually undergo a process of nuclear division, called [[mitosis]], followed by division of the cell, called [[cytokinesis]]. A [[diploid]] cell may also undergo [[meiosis]] to produce haploid cells, usually four. [[Haploid]] cells serve as [[gamete]]s in multicellular organisms, fusing to form new diploid cells.\u003cbr\u003e-\u003cbr\u003e-[[DNA replication]], or the process of duplicating a cell's genome,\u003cref name=\"NCBI\"\u002f\u003e always happens when a cell divides through mitosis or binary fission. This occurs during the S phase of the [[cell cycle]].\u003cbr\u003e-\u003cbr\u003e-In meiosis, the DNA is replicated only once, while the cell divides twice. DNA replication only occurs before [[meiosis I]]. DNA replication does not occur when the cells divide the second time, in [[meiosis II]].\u003cref\u003e{{cite book|title=Campbell Biology{{snd}}Concepts and Connections|year=2009|publisher=Pearson Education|page=138}}\u003c\u002fref\u003e Replication, like all cellular activities, requires specialized proteins for carrying out the job.\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e+Cell division involves a single cell (called a ''mother cell'') dividing into two daughter cells. This leads to growth in [[multicellular organism]]s (the growth of [[biological tissue|tissue]]) and to procreation ([[vegetative reproduction]]) in [[unicellular organism]]s. [[Prokaryote|Prokaryotic]] cells divide by [[binary fission]], while [[Eukaryote|eukaryotic]] cells usually undergo a process of nuclear division, called [[mitosis]], followed by division of the cell, called [[cytokinesis]]. A [[diploid]] eukaryotic cell may also undergo [[meiosis]] to produce haploid cells, usually four. [[Haploid]] cells serve as [[gamete]]s in multicellular organisms, fusing to form new diploid cells.\u003cbr\u003e+\u003cbr\u003e+[[DNA replication]], or the process of duplicating a cell's genome, always happens when a cell divides through mitosis or binary fission. This occurs during the S phase of the [[cell cycle]].\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+In meiosis, the DNA is replicated only once, while the cell divides twice. DNA replication only occurs before [[meiosis I]]. DNA replication does not occur when the cells divide the second time, in [[meiosis II]].\u003cref\u003e{{cite book|title=Campbell Biology{{snd}}Concepts and Connections|year=2009|publisher=Pearson Education|page=138}}\u003c\u002fref\u003e\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e === DNA repair ===\u003cbr\u003e ","--- Revision 8\u003cbr\u003e+++ Revision 9\u003cbr\u003e@@ -251,7 +251,7 @@\u003cbr\u003e \u003cbr\u003e {{main|Motility}}\u003cbr\u003e \u003cbr\u003e-Unicellular organisms can move in order to find food or escape predators. Common mechanisms of motion include [[flagella]] and [[cilia]].\u003cbr\u003e+Unicellular organisms can move in order to find food or escape predators. Organelles that enable cells to move include [[flagella]] and [[cilia]].\u003cbr\u003e \u003cbr\u003e In multicellular organisms, cells can move during processes such as wound healing, the immune response and [[cancer metastasis]]. For example, in wound healing in animals, white blood cells move to the wound site to kill the microorganisms that cause infection. Cell motility involves many receptors, crosslinking, bundling, binding, adhesion, motor and other proteins.\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u003e{{cite journal |last1=Ananthakrishnan |first1=R. |last2=Ehrlicher |first2=A. |titl unctioning of cellular metabolism. Cell metabolism is the process by which individual cells process nutrient molecules. Metabolism has two distinct divisions: [[catabolism]], in which the cell breaks down complex molecules to produce energy and [[Reducing agent|reducing power]], and [[anabolism]], in which the cell uses energy and reducing power to construct complex molecules and perform other biological functions.\u003cbr\u003e-Complex sugars consumed by the organism can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways.\u003cbr\u003e+\u003cbr\u003e+Complex sugars can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways. In eukaryotes, this is the function of [[Mitochondrion|mitochondria]]. Plants in addition contain [[chloroplast]]s, which [[photosynthesis|synthesise sugars]] using the energy of sunlight.\u003cbr\u003e \u003cbr\u003e === Protein synthesis ===\u003cbr\u003e ","--- Revision 10\u003cbr\u003e+++ Revision 11\u003cbr\u003e@@ -10,15 +10,11 @@\u003cbr\u003e |Caption2 =A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]]; many cells contain [[organelle]]s, each with a specific function. The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cbr\u003e-\u003cbr\u003e-Within the cell, organelles carry out specialised functions such as [[Self-replication|replication]], [[DNA repair]], [[protein synthesis]], and [[cell motility|motility]]. \u003cbr\u003e-\u003cbr\u003e-Most plant and animal cells, with dimensions between 1 and 100&nbsp;[[micrometre]]s, are only visible under a [[light microscope|microscope]]. Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s such as [[bacteria]], whereas eukaryotes can be either single-celled, such as [[amoeba]]e, or [[multicellular organism|multicellular]], such as some [[Algae|alga]]e, [[plant]]s, [[animal]]s, and [[Fungus|fungi]]. \u003cbr\u003e-\u003cbr\u003e-The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e-\u003cbr\u003e-[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery. [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago.\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]]; many cells contain [[organelle]]s, each with a specific function. The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'. Most cells are only visibl  journal |last1=Tweedy |first1=Luke |last2=Thomason |first2=Peter A. |last3=Paschke |first3=Peggy I. |last4=Martin |first4=Kirsty |last5=Machesky |first5=Laura M. |last6=Zagnoni |first6=Michele |last7=Insall |first7=Robert H.|title=Seeing around corners: Cells solve mazes and respond at a distance using attractant breakdown |journal=Science |volume=369 |issue=6507 |date=August 2020 |page=eaay9792 |pmid=32855311 |doi=10.1126\u002fscience.aay9792 |s2cid=221342551 |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.aay9792 |access-date=2020-09-13 |archive-date=2020-09-12 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200912234645\u002fhttps:\u002f\u002fscience.sciencemag.org\u002fcontent\u002f369\u002f6507\u002feaay9792 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Multicellularity ==\u003cbr\u003e ","--- Revision 11\u003cbr\u003e+++ Revision 12\u003cbr\u003e@@ -37,12 +37,6 @@\u003cbr\u003e * Enclosing the cell is the [[cell envelope]], generally consisting of a [[plasma membrane]] covered by a [[cell wall]] which, for some bacteria, may be further covered by a third layer called a [[bacterial capsule|capsule]]. Though most prokaryotes have both a cell membrane and a cell wall, there are exceptions such as ''[[Mycoplasma]]'' (bacteria) and ''[[Thermoplasma]]'' (archaea) which only possess the cell membrane layer. The envelope gives rigidity to the cell and separates the interior of the cell from its environment, serving as a protective filter. The cell wall consists of [[peptidoglycan]] in bacteria and acts as an additional barrier against exterior forces. It also prevents the cell from expanding and bursting ([[cytolysis]]) from [[osmotic pressure]] due to a [[hypotonic]] environment. Some eukaryotic cells ([[plant cell]]s and [[fungal]] cells) also have a cell wall.\u003cbr\u003e * Inside the cell is the [[cytoplasm|cytoplasmic region]] that contains the [[genome]] (DNA), ribosomes and various sorts of inclusions.\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer |article=What Is a Cell? |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html |access-date=3 May 2013 |date=30 March 2004}}\u003c\u002fref\u003e The genetic material is freely found in the cytoplasm. Prokaryotes can carry [[extrachromosomal DNA]] elements called [[plasmid]]s, which are usually circular. Linear bacterial plasmids have been identified in several species of [[spirochete]] bacteria, including members of the genus ''[[Borrelia]]'' notably ''[[Borrelia burgdorferi]]'', which causes Lyme disease.\u003cref\u003eEuropean Bioinformatics Institute, [http:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html Karyn's Genomes: Borrelia burgdorferi] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130506040937\u002fhttp:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html |date=2013-05-06 }}, part of 2can on the EBI-EMBL database. Retrieved 5 August 2012\u003c\u002fref\u003e Though not forming a nucleus, the [[DNA]] is condensed in a [[nucleoid]]. Plasmids encode additional genes, such as [[antibiotic resistance]] genes.\u003cbr\u003e * On the outside, some prokaryotes have [[flagella]] and [[Pilus|pili]] that project from the cell's surface. These are structures made of proteins that facilitate movement and communication between cells.\u003cbr\u003e-\u003cbr\u003e-==== Bacterial shapes ====\u003cbr\u003e-\u003cbr\u003e-{{main|Bacteria#Morphology}}\u003cbr\u003e-\u003cbr\u003e-Cell shape, also called cell morphology, has been hypothesized to form from the arrangement and movement of the cytoskeleton.\u003cref name=\"Pichoff Lutkenhaus 2007\"\u003e{{Cite journal |last1=Pichoff |first1=Sebastien |last2=Lutkenhaus |first2=Joe |date=2007-12-01 |title=Overview of cell shape: cytoskeletons shape bacterial cells |journal=Current Opinion in Microbiology |series=Growth and Development |volume=10 |issue=6 |pages=601\u2013605 |doi=10.1016\u002fj.mib.2007.09.005 |pmid=17980647 |pmc=2703429 |issn=1369-5274 }}\u003c\u002fref\u003e Many advancements in the study of cell morphology come from studying simple bacteria such as ''[[Staphylococcus aureus]]'',\u00a0''[[Escherichia coli|E. coli]]'',\u00a0and [[Bacillus subtilis|''B. subtilis''.]]\u003cref name=\"Kysela-2016\"\u003e{{Cite journal |last1=Kysela |first1=David T. |last2=Randich |first2=Amelia M. |last3=Caccamo |first3=Paul D. |last4=Brun |first4=Yves V. |date=2016-10-03 |title=Diversity Takes Shape: Understanding the Mechanistic and Adaptive Basis of Bacterial Morphology |journal=PLOS Biology |volume=14 |issue=10 |page=e1002565 |doi=10.1371\u002fjournal.pbio.1002565 |pmid=27695035 |pmc=5047622 |issn=1545-7885 |doi-access=free }}\u003c\u002fref\u003e Different cell shapes have been found and described, but how and why cells form different shapes is still widely unknown.\u003cref name=\"Kysela-2016\" \u002f\u003e Some cell shapes that have been identified include rods, cocci and spirochaetes. Cocci are circular, bacilli are elongated rods, and spirochaetes are spiral in form.\u003cref name=\"Pichoff Lutkenhaus 2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e === Eukaryotic cells ===\u003cbr\u003e ","--- Revision 12\u003cbr\u003e+++ Revision 13\u003cbr\u003e@@ -224,7 +224,7 @@\u003cbr\u003e \u003cbr\u003e === Growth and metabolism ===\u003cbr\u003e \u003cbr\u003e-{{main|Cell growth|Metabolism}}\u003cbr\u003e+{{main|Cell growth|Metabolism|Photosynthesis}}\u003cbr\u003e \u003cbr\u003e Between successive cell divisions, cells grow through the functioning of cellular metabolism. Cell metabolism is the process by which individual cells process nutrient molecules. Metabolism has two distinct divisions: [[catabolism]], in which the cell breaks down complex molecules to produce energy and [[Reducing agent|reducing power]], and [[anabolism]], in which the cell uses energy and reducing power to construct complex molecules and perform other biological functions.\u003cbr\u003e Complex sugars consumed by the organism can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways.","--- Revision 13\u003cbr\u003e+++ Revision 14\u003cbr\u003e@@ -61,7 +61,7 @@\u003cbr\u003e |-\u003cbr\u003e !Typical organisms\u003cbr\u003e |[[bacterium|bacteria]], [[archaea]]\u003cbr\u003e-|[[protist]]s, [[fungus|fungi]], [[plant]]s, [[animal]]s\u003cbr\u003e+|[[protist]]s, [[algae]], [[fungus|fungi]], [[plant]]s, [[animal]]s\u003cbr\u003e |-\u003cbr\u003e !Typical size\u003cbr\u003e |~ 1\u20135&nbsp;[[Micrometre|\u03bcm]]\u003cref name=\"CampbellBiology320\"\u003e{{cite book |title=Campbell Biology{{snd}}Concepts and Connections |publisher=Pearson Education |year=2009 |page=320}}\u003c\u002fref\u003e\u003cbr\u003e@@ -141,6 +141,7 @@\u003cbr\u003e {{main|DNA|RNA}}\u003cbr\u003e \u003cbr\u003e [[File:DNA orbit animated.gif|thumb|[[DNA|Deoxyribonucleic acid]] (DNA)]]\u003cbr\u003e+\u003cbr\u003e Two different kinds of genetic material exist: [[DNA|deoxyribonucleic acid]] (DNA) and [[RNA|ribonucleic acid]] (RNA). Cells use DNA for their long-term information storage. The biological information contained in an organism is [[Genetic code|encoded]] in its DNA sequence.\u003cref name=\"NCBI\"\u002f\u003e RNA is used for information transport (e.g., [[mRNA]]) and [[enzyme|enzymatic]] functions (e.g., [[ribosome|ribosomal]] RNA). [[Transfer RNA]] (tRNA) molecules are used to add amino acids during protein [[Translation (biology)|translation]].\u003cbr\u003e \u003cbr\u003e Prokaryotic genetic material is organized in a simple [[circular bacterial chromosome]] in the [[nucleoid region]] of the cytoplasm. Eukaryotic genetic material is divided into different,\u003cref name=\"NCBI\"\u002f\u003e linear molecules called [[chromosome]]s inside a discrete nucleus, usually with additional genetic material in some organelles like [[mitochondria]] and [[chloroplasts]] (see [[endosymbiotic theory]]).\u003cbr\u003e@@ -227,7 +228,8 @@\u003cbr\u003e {{main|Cell growth|Metabolism|Photosynthesis}}\u003cbr\u003e \u003cbr\u003e Between successive cell divisions, cells grow through the functioning of cellular metabolism. Cell metabolism is the process by which individual cells process nutrient molecules. Metabolism has two distinct divisions: [[catabolism]], in which the cell breaks down complex molecules to produce energy and [[Reducing agent|reducing power]], and [[anabolism]], in which the cell uses energy and reducing power to construct complex molecules and perform other biological functions.\u003cbr\u003e-Complex sugars consumed by the organism can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways.\u003cbr\u003e+\u003cbr\u003e+Complex sugars can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways. In plant cells, [[chloroplast]]s create sugars by [[photosynthesis]], using the energy of light to join molecules of water and [[carbon dioxide]].\u003cbr\u003e \u003cbr\u003e === Protein synthesis ===\u003cbr\u003e ","--- Revision 14\u003cbr\u003e+++ Revision 15\u003cbr\u003e@@ -271,7 +271,7 @@\u003cbr\u003e \u003cbr\u003e === Origin of multicellularity ===\u003cbr\u003e \u003cbr\u003e-Multicellularity has evolved independently at least 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal |last1= Grosberg |first1=R. K. |last2=Strathmann |first2=R. R. |url=http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |title=The evolution of multicellularity: A minor major transition? |journal=Annu Rev Ecol Evol Syst |year=2007 |volume=38 |pages=621\u2013654 |doi=10.1146\u002fannurev.ecolsys.36.102403.114735 |access-date=2013-12-23 |archive-date=2016-03-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |url-status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], ''[[Magnetoglobus multicellularis]]'', or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last1=Popper |first1=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e+Multicellularity has evolved independently at least 25 times,\u003cref name=\"Grosberg2007\"\u003e{{cite journal |last1= Grosberg |first1=R. K. |last2=Strathmann |first2=R. R. |url=http:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |title=The evolution of multicellularity: A minor major transition? |journal=Annu Rev Ecol Evol Syst |year=2007 |volume=38 |pages=621\u2013654 |doi=10.1146\u002fannurev.ecolsys.36.102403.114735 |access-date=2013-12-23 |archive-date=2016-03-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160304121329\u002fhttp:\u002f\u002fwww-eve.ucdavis.edu\u002fgrosberg\u002fGrosberg%20pdf%20papers\u002f2007%20Grosberg%20%26%20Strathmann.AREES.pdf |url-status=dead }}\u003c\u002fref\u003e including in some prokaryotes, like [[cyanobacteria]], [[myxobacteria]], [[actinomycetes]], or ''[[Methanosarcina]]''. However, complex multicellular organisms evolved only in six eukaryotic groups: animals, fungi, brown algae, red algae, green algae, and plants.\u003cref name=\"pmid21351878\"\u003e{{cite journal |last1=Popper |first1=Zo\u00eb A. |last2=Michel |first2=Gurvan |last3=Herv\u00e9 |first3=C\u00e9cile |last4=Domozych |first4=David S. |last5=Willats |first5=William G.T. |last6=Tuohy |first6=Maria G. |last7=Kloareg |first7=Bernard |last8=Stengel |first8=Dagmar B. |display-authors=3 |title=Evolution and diversity of plant cell walls: from algae to flowering plants |journal=Annual Review of Plant Biology |volume=62 |pages=567\u2013590 |date=2011 |pmid=21351878 |doi=10.1146\u002fannurev-arplant-042110-103809 |url=http:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |hdl=10379\u002f6762 |s2cid=11961888 |hdl-access=free |access-date=2013-12-23 |archive-date=2016-07-29 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160729224035\u002fhttp:\u002f\u002fpublic.wsu.edu\u002f~lange-m\u002fDocumnets\u002fTeaching2011\u002fPopper2011.pdf |url-status=live }}\u003c\u002fref\u003e It evolved repeatedly for plants ([[Chloroplastida]]), once or twice for [[animal]]s, once for [[brown algae]], and perhaps several times for [[fungi]], [[Mycetozoa|slime molds]], and [[red algae]].\u003cref\u003e{{cite journal|last=Bonner |first=John Tyler |author-link=John Tyler Bonner |year=1998 |title=The Origins of Multicellularity |journal=Integrative Biology |volume=1 |issue=1 |pages=27\u201336 |url=http:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |format=PDF, 0.2 MB |issn=1093-4391 |doi=10.1002\u002f(SICI)1520-6602(1998)1:1\u003c27::AID-INBI4\u003e3.0.CO;2-6 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120308175112\u002fhttp:\u002f\u002fcourses.cit.cornell.edu\u002fbiog1101\u002foutlines\u002fBonner%20-Origin%20of%20Multicellularity.pdf |archive-date=March 8, 2012 }}\u003c\u002fref\u003e Multicellularity may have evolved from [[Colony (biology)|colonies]] of interdependent organisms, from [[cellularization]], or from organisms in [[Symbiosis|symbiotic relationships]].\u003cbr\u003e \u003cbr\u003e The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested ''[[Grypania]] spiralis'' and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last1=Albani |first1=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 15\u003cbr\u003e+++ Revision 16\u003cbr\u003e@@ -291,7 +291,7 @@\u003cbr\u003e \u003cbr\u003e There are several theories about the origin of small molecules that led to life on the [[early Earth]]. They may have been carried to Earth on meteorites (see [[Murchison meteorite]]), created at [[Hydrothermal vent|deep-sea vents]], or synthesized by lightning in a reducing atmosphere (see [[Miller\u2013Urey experiment]]). There is little experimental data defining what the first self-replicating forms were. [[RNA]] is thought to be the earliest self-replicating molecule, as it is capable of both storing genetic information and catalyzing chemical reactions (see [[RNA world hypothesis]]), but some other entity with the potential to self-replicate could have preceded RNA, such as [[Abiogenesis#Clay|clay]] or [[peptide nucleic acid]].\u003cref name=OrgelLE\u003e{{cite journal |last= Orgel |first=L. E. |title=The origin of life--a review of facts and speculations |journal=Trends in Biochemical Sciences |volume=23 |issue=12 |pages=491\u2013495 |date=December 1998 |pmid=9868373 |doi=10.1016\u002fS0968-0004(98)01300-0 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Cells emerged at least 3.5 billion years ago.\u003cref name=\"Origin1\"\u003e{{cite journal |last1=Schopf |first1=J. William |last2=Kudryavtsev |first2=Anatoliy B. |last3=Czaja |first3=Andrew D. |last4=Tripathi |first4=Abhishek B.|date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009 }}\u003c\u002fref\u003e\u003cref name=\"Origin2\"\u003e{{cite journal |last=Schopf |first=J. William |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |date=June 2006 |pmid=16754604 |pmc=1578735 |doi=10.1098\u002frstb.2006.1834 }}\u003c\u002fref\u003e\u003cref name=\" ths 2007\"\u003e{{cite journal |last=Griffiths |first=G. |title=Cell evolution and the problem of membrane topology |journal=Nature Reviews. Molecular Cell Biology |volume=8 |issue=12 |pages=1018\u20131024 |date=December 2007 |pmid=17971839 |doi=10.1038\u002fnrm2287 |s2cid=31072778 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"ScienceDaily 2021\"\u003e{{cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily |archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Origin of eukaryotic cells ===\u003cbr\u003e ","--- Revision 18\u003cbr\u003e+++ Revision 19\u003cbr\u003e@@ -307,7 +307,7 @@\u003cbr\u003e \u003cbr\u003e [[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e-In 1665, [[Robert Hooke]] examined a thin slice of cork under his [[microscope]], and saw a structure of small enclosures. He named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp 20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. }}\u003c\u002fref\u003e\u003cref name=\"Tero 1990\"\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated.}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e+In 1665, [[Robert Hooke]] examined a thin slice of cork under his [[microscope]], and saw a structure of small enclosures. He wrote \"I could exceeding plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular; yet it was not unlike a Honey-comb in these particular\".\u003cref name=\"Hooke 1665\"\u003e{{cite book |last1=Hooke |first1=Robert |author1-link=Robert Hooke |title=[[Micrographia]] |date=1665 |chapter=Observation 18}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Schwann]] both also studied cells of both animal and plants. What they discovered were significant differences between the two types of cells. This put forth the idea that cells were not only fundamental to plants, but animals as well.\u003cref name=\"Maton 1997\"\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |pages=44-45 The Cell Theory}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e * 1632\u20131723: [[Antonie van Leeuwenhoek]] taught himself to make [[Lens (optics)|lenses]], constructed basic [[optical microscope]]s and drew protozoa, such as ''[[Vorticella]]'' from rain water, and [[Bacterium|bacteria]] from his own mouth.\u003cref name=\"Gest 2004\"\u003e{{cite journal |last=Gest |first=H. |year=2004 |title=The discovery of microorganisms by Robert Hooke and Antoni Van Leeuwenhoek, fellows of the Royal Society |journal=Notes and Records of the Royal Society of London |volume=58 |issue=2 |pages=187\u2013201 |doi=10.1098\u002frsnr.2004.0055 |pmid=15209075 |s2cid=8297229}}\u003c\u002fref\u003e\u003cbr\u003e * 1665: [[Robert Hooke]] discovered cells in [[Cork (material)|cork]], then in living plant tissue using an early compound microscope. He coined the term ''cell'' (from [[Latin]] ''cellula'', meaning \"small room\"\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia |title=cell\u016dla |encyclopedia=[[A Latin Dictionary]] |year=1879 |publisher=Charlton T. Lewis and Charles Short |url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789 |archive-date=7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula |url-status= live}} }}\u003c\u002fref\u003e) in his book ''[[Micrographia]]'' (1665).\u003cref name=\"Hooke\"\u003e{{cite book |last=Hooke |first=Robert |author-link=Robert Hooke |title=Micrographia: ...|date=1665 |publisher=Royal Society of London |location=London |page=113 |url=https:\u002f\u002farchive.org\u002fstream\u002fmobot31753000817897#page\u002f113\u002fmode\u002f2up|quote= ... I could exceedingly plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular [...] these pores, or cells, [...] were indeed the first microscopical pores I ever saw, and perhaps, that were ever seen, for I had not met with any Writer or Person, that had made any mention of them before this ... |postscript=none}} \u2013 Hooke describing his observations on a thin slice of cork. See also: [http:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html Robert Hooke] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f19970606013455\u002fhttp:\u002f\u002fwww.ucmp.berkeley.edu\u002fhistory\u002fhooke.html |date=1997-06-06 }}\u003c\u002fref\u003e\u003cref name=\"Gest 2004\"\u002f\u003e","--- Revision 19\u003cbr\u003e+++ Revision 20\u003cbr\u003e@@ -307,7 +307,7 @@\u003cbr\u003e \u003cbr\u003e [[File:RobertHookeMicrographia1665.jpg|thumb|upright|Robert Hooke's drawing of cells in [[Cork (material)|cork]], 1665]]\u003cbr\u003e \u003cbr\u003e-In 1665, [[Robert Hooke]] examined a thin slice of cork under his [[microscope]], and saw a structure of small enclosures. He wrote \"I could exceeding plainly perceive it to be all perforated and porous, much like a Honey-comb, but that the pores of it were not regular; yet it was not unlike a Honey-comb in these particular\".\u003cref name=\"Hooke 1665\"\u003e{{cite book |last1=Hooke |first1=Robert |author1-link=Robert Hooke |title=[[Micrographia]] |date=1665 |chapter=Observation 18}}\u003c\u002fref\u003e To further support his theory, [[Matthias Schleiden]] and [[Theodor Sch
