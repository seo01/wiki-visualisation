=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e+The first evidence of multicellularity is from [[cyanobacteria]]-like organisms that lived between 3 and 3.5 billion years ago.\u003cref name=\"Grosberg2007\"\u002f\u003e Other early fossils of multicellular organisms include the contested ''[[Grypania]] spiralis'' and the fossils of the black shales of the [[Palaeoproterozoic]] [[Francevillian Group Fossil]] B Formation in [[Gabon]].\u003cref\u003e{{cite journal |last1=Albani |first1=Abderrazak El |last2=Bengtson |first2=Stefan |last3=Canfield |first3=Donald E. |last4=Bekker |first4=Andrey |last5=Macchiarelli |first5=Roberto |last6=Mazurier |first6=Arnaud |last7=Hammarlund |first7=Emma U. |last8=Boulvais |first8=Philippe |last9=Dupuy |first9=Jean-Jacques |last10=Fontaine |first10=Claude |last11=F\u00fcrsich |first11=Franz T. |last12=Gauthier-Lafaye |first12=Fran\u00e7ois |last13=Janvier |first13=Philippe |last14=Javaux |first14=Emmanuelle |last15=Ossa |first15=Frantz Ossa |last16=Pierson-Wickmann |first16=Anne-Catherine |last17=Riboulleau |first17=Armelle |last18=Sardini |first18=Paul |last19=Vachard |first19=Daniel |last20=Whitehouse |first20=Martin |last21=Meunier |first21=Alain |display-authors=3 |title=Large colonial organisms with coordinated growth in oxygenated environments 2.1 Gyr ago |journal=Nature |volume=466 |issue=7302 |pages=100\u2013104 |date=July 2010 |pmid=20596019 |doi=10.1038\u002fnature09166 |author-link=Abderrazak El Albani |s2cid=4331375 |bibcode=2010Natur.466..100A }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The evolution of multicellularity from unicellular ancestors has been replicated in the laboratory, in [[experimental evolution|evolution experiments]] using predation as the [[selective pressure]].\u003cref name=\"Grosberg2007\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -300,7 +300,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Symbiogenesis 2 mergers.svg|thumb|upright=1.35|In the theory of [[symbiogenesis]], a merger of an [[archaea]]n and an aerobic bacterium created the eukaryotes, with aerobic [[Mitochondrion|mitochondria]], some 2.2 billion years ago. A second merger, 1.6 billion years ago, added [[chloroplast]]s, creating the green plants.\u003cref name=latorre\u002f\u003e]]\u003cbr\u003e \u003cbr\u003e-[[Eukaryote|Eukaryotic]] cells were created some 2.2 billion years ago in a process called eukaryogenesis. This is widely agreed to have involved [[symbiogenesis]], in which [[archaea]] and [[bacteria]] came together to create the first eukaryotic common ancestor. This cell had a new level of complexity and capability, with a nucleus\u003cref name=\"McGrath 2022\"\u003e{{cite journal |last=McGrath |first=Casey |title=Highlight: Unraveling the Origins of LUCA and LECA on the Tree of Life |journal=Genome Biology and Evolution |volume=14 |issue=6 |date=31 May 2022 |pages=evac072 |doi=10.1093\u002fgbe\u002fevac072|pmc=9168435 }}\u003c\u002fref\u003e\u003cref name=\"Weiss et al 2016\"\u003e{{cite journal |last1=Weiss |first1=Madeline C. |last2=Sousa |first2=F. L. |last3=Mrnjavac |first3=N. |last4=Neukirchen |first4=S. |last5=Roettger |first5=M. |last6=Nelson-Sathi |first6=S. |last7=Martin |first7=William F. |author7-link=William F. Martin |display-authors=3 |s ife]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]]; many cells contain [[organelle]]s, each with a specific function. The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'. Most cells are only visible under a [[light microscope|microscope]]. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago. All cells are capable of [[Self-replication|replication]], [[protein synthesis]], and [[cell motility|motility]]. \u003cbr\u003e \u003cbr\u003e-Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s such as [[bacteria]], whereas eukaryotes can be either single-celled, such as [[amoeba]]e, or [[multicellular organism|multicellular]], such as some [[algae]], [[plant]]s, [[animal]]s, and [[fungi]]. Eukaryotic cells contain organelles including [[Mitochondrion|mitochondria]], which provide energy for cell functions; [[chloroplast]]s, which create sugars by [[photosynthesis]], in plants; and [[ribosome]]s, which synthesise proteins.\u003cbr\u003e-\u003cbr\u003e-Cells were discovered by [[Robert Hooke]] in 1665, who named them after their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery. [[Cell theory]], developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells. \u003cbr\u003e+Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s such as [[bacteria]], whereas eukaryotes can be either single-celled, such as [[amoeba]]e, or [[multicellular organism|multicellular]], such as some [[algae]], [[plant]]s, [[animal]]s, and [[fungi]]. Eukaryotic cells contain organelles including [[Mitochondrion|mitochondria]], which provide energy for cell functions, [[chloroplast]]s, which in plants create sugars by [[photosynthesis]], and [[ribosome]]s, which synthesise proteins.\u003cbr\u003e+\u003cbr\u003e+Cells were discovered by [[Robert Hooke]] in 1665, who named them after their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery. [[Cell theory]], developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cbr\u003e \u003cbr\u003e == Cell types ==\u003cbr\u003e ","--- Revision 48\u003cbr\u003e+++ Revision 49\u003cbr\u003e@@ -28,7 +28,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Prokaryote cell.svg|thumb|upright=1.25|Structure of a typical [[prokaryotic]] cell]]\u003cbr\u003e \u003cbr\u003e-[[Prokaryote]]s include [[bacteria]] and [[archaea]], two of the [[three domain system|three]] [[Domain (biology)|domains of life]]. Prokaryotic cells were the first form of [[life]] on Earth, characterized by having vital [[biological process]]es including [[cell signaling]]. They are simpler and smaller than eukaryotic cells, and lack a [[cell nucleus|nucleus]], and other membrane-bound [[organelle]]s. The [[DNA]] of a prokaryotic cell consists of a single [[Circular prokaryote chromosome|circular chromosome]] that is in direct contact with the [[cytoplasm]]. The nuclear region in the cytoplasm is called the [[nucleoid]]. Most prokaryotes are the smallest of all organisms, ranging from 0.5 to 2.0&nbsp;\u03bcm in diameter.\u003cref name=\"Black 2004 p. \"\u003e{{cite book |last=Black |first=Jacquelyn G. |title=Microbiology |publisher=Wiley |publication-place=New York Chichester |date=2004 |isbn=978-0-471-42084-2 |page=}}\u003c\u002fref\u003e{{pn|date=September 2023}}\u003cbr\u003e+[[Prokaryote]]s include [[bacteria]] and [[archaea]], two of the [[three domain system|three]] [[Domain (biology)|domains of life]]. Prokaryotic cells were the first form of [[life]] on Earth, characterized by having vital [[biological process]]es including [[cell signaling]]. They are simpler and smaller than eukaryotic cells, and lack a [[cell nucleus|nucleus]], and other membrane-bound [[organelle]]s. The [[DNA]] of a prokaryotic cell consists of a single [[Circular prokaryote chromosome|circular chromosome]] that is in direct contact with the [[cytoplasm]]. The nuclear region in the cytoplasm is called the [[nucleoid]]. Most prokaryotes are the smallest of all organisms, ranging from 0.5 to 2.0&nbsp;\u03bcm in diameter.\u003cref name=\"Black 2004 p. \"\u003e{{cite book |last=Black |first=Jacquelyn G. |title=Microbiology |publisher=Wiley |publication-place=New York Chichester |date=2004 |isbn=978-0-471-42084-2 |page=}}\u003c\u002fref\u003e{{rp|78}}\u003cbr\u003e \u003cbr\u003e A prokaryotic cell has three regions:\u003cbr\u003e ","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -3,54 +3,61 @@\u003cbr\u003e {{Pp|small=yes}}\u003cbr\u003e {{pp-move-indef}}\u003cbr\u003e {{Infobox anatomy\u003cbr\u003e-|Name =Cell\u003cbr\u003e-|Image =Wilson1900Fig2.jpg\u003cbr\u003e-|Caption =[[Onion]] (''[[Allium cepa]]'') root cells in different phases of the [[cell cycle]] (drawn by [[Edmund Beecher Wilson|E.&nbsp;B. Wilson]], 1900)\u003cbr\u003e-|Image2 =celltypes.svg\u003cbr\u003e-|Caption2 =A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e+| Name        = Cell\u003cbr\u003e+| Latin       =\u003cbr\u003e+| Image       = Wilson1900Fig2.jpg\u003cbr\u003e+| Caption     = [[Onion]] (''[[Allium cepa]]'') root cells in different phases of the [[cell cycle]] (drawn by [[Edmund Beecher Wilson|E.&nbsp;B. Wilson]], 1900)\u003cbr\u003e+| Width       =\u003cbr\u003e+| Image2      = celltypes.svg\u003cbr\u003e+| Caption2    = A [[eukaryotic]] cell (left) and [[prokaryotic]] cell (right)\u003cbr\u003e+| Precursor   =\u003cbr\u003e+| System      =\u003cbr\u003e+| Artery      =\u003cbr\u003e+| Vein        =\u003cbr\u003e+| Nerve       =\u003cbr\u003e+| Lymph       =\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-The '''cell''' is the basic structural and functional unit of all [[life|forms of life]]. Every cell consists of [[cytoplasm]] enclosed within a [[Cell membrane|membrane]]; many cells contain [[organelle]]s, each with a specific function. The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'. Most cells are only visible under a [[light microscope|microscope]]. Cells [[Abiogenesis|emerged on Earth]] about 4 billion years ago. All cells are capable of [[Self-replication|replication]], [[protein synthesis]], and [[cell motility|motility]]. \u003cbr\u003e-\u003cbr\u003e-Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s such as [[bacteria]], whereas eukaryotes can be either single-celled, such as [[amoeba]]e, or [[multicellular organism|multicellular]], such as some [[algae]], [[plant]]s, [[animal]]s, and [[fungi]]. Eukaryotic cells contain organelles including [[Mitochondrion|mitochondria]], which provide energy for cell functions, [[chloroplast]]s, which in plants create sugars by [[photosynthesis]], and [[ribosome]]s, which synthesise proteins.\u003cbr\u003e-\u003cbr\u003e-Cells were discovered by [[Robert Hooke]] in 1665, who named them after their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery. [[Cell theory]], developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cbr\u003e-\u003cbr\u003e-== Cell types ==\u003cbr\u003e-\u003cbr\u003e-{{main|Cell type}}\u003cbr\u003e-\u003cbr\u003e-Cells are broadly categorized into two types: [[eukaryotic cell]]s, which possess a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but have a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cbr\u003e-\u003cbr\u003e-=== Prokaryotic cells ===\u003cbr\u003e-\u003cbr\u003e-{{main|Prokaryote}}\u003cbr\u003e-\u003cbr\u003e+The '''cell''' is the basic structural and functional unit of [[life form]]s. Every cell consists of a [[cytoplasm]] enclosed within a [[Cell membrane|membrane]], and contains many [[biomolecule]]s such as [[protein]]s, [[DNA]] and [[RNA]], as well as many small molecules of nutrients and [[metabolite]]s.\u003cref name=\"Alberts20022\"\u003e[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f Cell Movements and the Shaping of the Vertebrate Body] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055346\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK26863\u002f |date=2020-01-22 }} in Chapter 21 of ''[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f Molecular Biology of the Cell] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170927035510\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks\u002fNBK21054\u002f |date=2017-09-27 }}'' fourth edition, edited by Bruce Alberts (2002) published by Garland Science. The Alberts text discusses how the \"cellular building blocks\" move to shape developing [[embryo]]s. It is also common to describe small molecules such as [[amino acid]]s as \"[https:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fentrez\u002fquery.fcgi?cmd=Search&db=books&doptcmdl=GenBookHL&term=%22all+cells%22+AND+mboc4%5Bbook%5D+AND+372023%5Buid%5D&rid=mboc4.section.4#23 molecular building blocks] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200122055404\u002fhttps:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fbooks?cmd=Search&doptcmdl=GenBookHL&term=%22all%2Bcells%22%2BAND%2Bmboc4%5Bbook%5D%2BAND%2B372023%5Buid%5D&rid=mboc4.section.4#23 |date=2020-01-22 }}\".\u003c\u002fref\u003e The term comes from the [[Latin]] word {{lang|la|cellula}} meaning 'small room'.\u003cref name=\"npr12\"\u003e{{Multiref|{{Cite web |date=September 17, 2010 |title=The Origins Of The Word 'Cell' |url=https:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210805150111\u002fhttps:\u002f\u002fwww.npr.org\u002ftemplates\u002fstory\u002fstory.php?storyId=129934828&t=1628175572746 |archive-date=2021-08-05 |access-date=2021-08-05 |website=[[National Public Radio]] }}|{{cite encyclopedia|title= cell\u016dla|encyclopedia= [[A Latin Dictionary]]|year= 1879|publisher= Charlton T. Lewis and Charles Short|url= http:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus:text:1999.04.0059:entry=cellula|access-date= 5 August 2021|isbn= 978-1999855789|archive-date= 7 August 2021|archive-url= https:\u002f\u002fweb.archive.org\u002fweb\u002f20210807122358\u002fhttp:\u002f\u002fwww.perseus.tufts.edu\u002fhopper\u002ftext?doc=Perseus%3Atext%3A1999.04.0059%3Aentry%3Dcellula|url-status= live}}}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Cells can acquire specified function and carry out various tasks within the cell such as replication, [[DNA]] repair, protein synthesis, and motility. Cells are capable of specialization and mobility within the cell. Most cells are measured in micrometers due to their small size.\u003cbr\u003e+\u003cbr\u003e+Most plant and animal cells are only visible under a [[light microscope]], with dimensions between 1 and 100&nbsp;[[micrometre]]s.\u003cref\u003e{{cite book |last1=Campbell |first1=Neil A. |url=http:\u002f\u002fwww.phschool.com\u002fel_marketing.html |title=Biology: Exploring Life |last2=Williamson |first2=Brad |last3=Heyden |first3=Robin J. |publisher=Pearson Prentice Hall |year=2006 |isbn=978-0132508827 |location=Boston, Massachusetts |name-list-style=vanc |access-date=2009-02-16 |archive-date=2014-11-02 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20141102041816\u002fhttp:\u002f\u002fwww.phschool.com\u002fel_marketing.html |url-status=live }}\u003c\u002fref\u003e [[Electron microscopy]] gives a much higher resolution showing greatly detailed cell structure. Organisms can be classified as [[unicellular]] (consisting of a single cell such as [[bacteria]]) or [[multicellular]] (including plants and animals).\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer|article=What Is a Cell?|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html|access-date=3 May 2013|date=30 March 2004}}\u003c\u002fref\u003e Most [[unicellular organism]]s are classed as [[microorganism]]s. The number of cells in plants and animals varies from species to species; it has been estimated that the [[human body]] contains around 37&nbsp;trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells.\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |url=https:\u002f\u002fdoi.org\u002f10.3109\u002f03014460.2013.807878 |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |access-date=2022-04-24 |archive-date=2022-05-11 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220511173925\u002fhttps:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.3109\u002f03014460.2013.807878?cookieSet=1 |url-status=live }}\u003c\u002fref\u003e The [[human brain]] accounts for around 80 billion of these cells.\u003cref name=\"JCN2\"\u003e{{cite journal |display-authors=6 |vauthors=Azevedo FA, Carvalho LR, Grinberg LT, Farfel JM, Ferretti RE, Leite RE, Jacob Filho W, Lent R, Herculano-Houzel S |date=April 2009 |title=Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain |journal=The Journal of Comparative Neurology |volume=513 |issue=5 |pages=532\u2013541 |doi=10.1002\u002fcne.21974 |pmid=19226510 |s2cid=5200449}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The study of cells and how they work has led to many other studies in related areas of biology, including: [[discovery of DNA]], [[cancer systems biology]], [[ageing|aging]] and [[developmental biology]].\u003cbr\u003e+\u003cbr\u003e+[[Cell biology]] is the study of cells, which were discovered by [[Robert Hooke]] in 1665, who named them for their resemblance to [[Monastic cell|cells]] inhabited by [[Christian monasticism|Christian monks]] in a monastery.\u003cref name=\"Karp20092\"\u003e{{cite book |last=Karp |first=Gerald |title=Cell and Molecular Biology: Concepts and Experiments |date=2009 |publisher=John Wiley & Sons |isbn=978-0470483374 |page=2 |quote=Hooke called the pores cells because they reminded him of the cells inhabited by monks living in a monastery. |name-list-style=vanc}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last=Tero |first=Alan Chong |title=Achiever's Biology |date=1990 |publisher=Allied Publishers |isbn=978-8184243697 |page=36 |quote=In 1665, an Englishman, Robert Hooke observed a thin slice of\" cork under a simple microscope. (A simple microscope is a microscope with only one biconvex lens, rather like a magnifying glass). He saw many small box like structures. These reminded him of small rooms called \"cells\" in which Christian monks lived and meditated. |name-list-style=vanc}}\u003c\u002fref\u003e [[Cell theory]], first developed in 1839 by [[Matthias Jakob Schleiden]] and [[Theodor Schwann]], states that all organisms are composed of one or more cells, that cells are the fundamental unit of structure and function in all living organisms, and that all cells come from pre-existing cells.\u003cref\u003e{{cite book |last=Maton |first=Anthea |url=https:\u002f\u002farchive.org\u002fdetails\u002fcellsbuildingblo00mato |title=Cells Building Blocks of Life |publisher=Prentice Hall |year=1997 |isbn=978-0134234762 |location=New Jersey |name-list-style=vanc}}\u003c\u002fref\u003e Cells emerged on Earth about 4 billion years ago.\u003cref name=\"Origin12\"\u003e{{cite journal |vauthors=Schopf JW, Kudryavtsev AB, Czaja AD, Tripathi AB |date=2007 |title=Evidence of Archean life: Stromatolites and microfossils |journal=Precambrian Research |volume=158 |issue=3\u20134 |pages=141\u2013155 |bibcode=2007PreR..158..141S |doi=10.1016\u002fj.precamres.2007.04.009}}\u003c\u002fref\u003e\u003cref name=\"Origin22\"\u003e{{cite journal |vauthors=Schopf JW |date=June 2006 |title=Fossil evidence of Archaean life |journal=Philosophical Transactions of the Royal Society of London. Series B, Biological Sciences |volume=361 |issue=1470 |pages=869\u2013885 |doi=10.1098\u002frstb.2006.1834 |pmc=1578735 |pmid=16754604}}\u003c\u002fref\u003e\u003cref name=\"RavenJohnson20022\"\u003e{{cite book |last1=Raven |first1=Peter Hamilton |url=https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave |title=Biology |last2=Johnson |first2=George Brooks |publisher=McGraw-Hill Education |year=2002 |isbn=978-0071122610 |page=[https:\u002f\u002farchive.org\u002fdetails\u002fbiologyrave00rave\u002fpage\u002f68 68] |access-date=7 July 2013 |url-access=registration |name-list-style=vanc}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=First cells may have emerged because building blocks of proteins stabilized membranes |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |access-date=2021-09-18 |website=ScienceDaily |language=en |archive-date=2021-09-18 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918102211\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2019\u002f08\u002f190812155502.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Cell types==\u003cbr\u003e+Cells are categorized into two types: [[eukaryotic cell]]s, which possesses a [[Cell nucleus|nucleus]], and [[prokaryotic|prokaryotic cell]]s, which lack a nucleus but still has a nucleoid region. Prokaryotes are [[single-celled organism]]s, whereas eukaryotes can be either single-celled or [[multicellular organism|multicellular]].\u003cref\u003e{{Cite web|title=Differences Between Prokaryotic Cell and Eukaryotic Cell @ BYJU'S|url=https:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|access-date=2021-09-18|website=BYJUS|language=en-US|archive-date=2021-10-09|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211009221816\u002fhttps:\u002f\u002fbyjus.com\u002fbiology\u002fprokaryotic-and-eukaryotic-cells\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Prokaryotic cells===\u003cbr\u003e+{{Main|Prokaryote}}\u003cbr\u003e [[File:Prokaryote cell.svg|thumb|upright=1.25|Structure of a typical [[prokaryotic]] cell]]\u003cbr\u003e \u003cbr\u003e-[[Prokaryote]]s include [[bacteria]] and [[archaea]], two of the [[three domain system|three]] [[Domain (biology)|domains of life]]. Prokaryotic cells were the first form of [[life]] on Earth, characterized by having vital [[biological process]]es including [[cell signaling]]. They are simpler and smaller than eukaryotic cells, and lack a [[cell nucleus|nucleus]], and other membrane-bound [[organelle]]s. The [[DNA]] of a prokaryotic cell consists of a single [[Circular prokaryote chromosome|circular chromosome]] that is in direct contact with the [[cytoplasm]]. The nuclear region in the cytoplasm is called the [[nucleoid]]. Most prokaryotes are the smallest of all organisms, ranging from 0.5 to 2.0&nbsp;\u03bcm in diameter.\u003cref name=\"Black 2004 p. \"\u003e{{cite book |last=Black |first=Jacquelyn G. |title=Microbiology |publisher=Wiley |publication-place=New York Chichester |date=2004 |isbn=978-0-471-42084-2 |page=}}\u003c\u002fref\u003e{{rp|78}}\u003cbr\u003e+[[Prokaryote]]s include [[bacteria]] and [[archaea]], two of the [[three domain system|three]] [[Domain (biology)|domains of life]]. Prokaryotic cells were the first form of [[life]] on Earth, characterized by having vital [[biological process]]es including [[cell signaling]]. They are simpler and smaller than eukaryotic cells, and lack a [[cell nucleus|nucleus]], and other membrane-bound [[organelle]]s. The [[DNA]] of a prokaryotic cell consists of a single [[Circular prokaryote chromosome|circular chromosome]] that is in direct contact with the [[cytoplasm]]. The nuclear region in the cytoplasm is called the [[nucleoid]]. Most prokaryotes are the smallest of all organisms ranging from 0.5 to 2.0&nbsp;\u03bcm in diameter.\u003cref\u003e''Microbiology : Principles and Explorations'' By Jacquelyn G. Black\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e A prokaryotic cell has three regions:\u003cbr\u003e-\u003cbr\u003e * Enclosing the cell is the [[cell envelope]], generally consisting of a [[plasma membrane]] covered by a [[cell wall]] which, for some bacteria, may be further covered by a third layer called a [[bacterial capsule|capsule]]. Though most prokaryotes have both a cell membrane and a cell wall, there are exceptions such as ''[[Mycoplasma]]'' (bacteria) and ''[[Thermoplasma]]'' (archaea) which only possess the cell membrane layer. The envelope gives rigidity to the cell and separates the interior of the cell from its environment, serving as a protective filter. The cell wall consists of [[peptidoglycan]] in bacteria and acts as an additional barrier against exterior forces. It also prevents the cell from expanding and bursting ([[cytolysis]]) from [[osmotic pressure]] due to a [[hypotonic]] environment. Some eukaryotic cells ([[plant cell]]s and [[fungal]] cells) also have a cell wall.\u003cbr\u003e-* Inside the cell is the [[cytoplasm|cytoplasmic region]] that contains the [[genome]] (DNA), ribosomes and various sorts of inclusions.\u003cref name=\"NCBI\"\u003e{{NCBI-scienceprimer |article=What Is a Cell? |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130503014839\u002fhttp:\u002f\u002fwww.ncbi.nlm.nih.gov\u002fAbout\u002fprimer\u002fgenetics_cell.html |access-date=3 May 2013 |date=30 March 2004}}\u003c\u002fref\u003e The genetic material is freely found in the cytoplasm. Prokaryotes can carry [[extrachromosomal DNA]] elements called [[plasmid]]s, which are usually circular. Linear bacterial plasmids have been identified in several species of [[spirochete]] bacteria, including members of the genus ''[[Borrelia]]'' notably ''[[Borrelia burgdorferi]]'', which causes Lyme disease.\u003cref\u003eEuropean Bioinformatics Institute, [http:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html Karyn's Genomes: Borrelia burgdorferi] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130506040937\u002fhttp:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html |date=2013-05-06 }}, part of 2can on the EBI-EMBL database. Retrieved 5 August 2012\u003c\u002fref\u003e Though not forming a nucleus, the [[DNA]] is condensed in a [[nucleoid]]. Plasmids encode additional genes, such as [[antibiotic resistance]] genes.\u003cbr\u003e-* On the outside, some prokaryotes have [[flagella]] and [[Pilus|pili]] that project from the cell's surface. These are structures made of proteins that facilitate movement and communication between cells.\u003cbr\u003e-\u003cbr\u003e-=== Eukaryotic cells ===\u003cbr\u003e-\u003cbr\u003e-{{main|Eukaryote}}\u003cbr\u003e+* Inside the cell is the [[cytoplasm|cytoplasmic region]] that contains the [[genome]] (DNA), ribosomes and various sorts of inclusions.\u003cref name=\"NCBI\"\u002f\u003e The genetic material is freely found in the cytoplasm. Prokaryotes can carry [[extrachromosomal DNA]] elements called [[plasmid]]s, which are usually circular. Linear bacterial plasmids have been identified in several species of [[spirochete]] bacteria, including members of the genus ''[[Borrelia]]'' notably ''[[Borrelia burgdorferi]]'', which causes Lyme disease.\u003cref\u003eEuropean Bioinformatics Institute, [http:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html Karyn's Genomes: Borrelia burgdorferi] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130506040937\u002fhttp:\u002f\u002fwww.ebi.ac.uk\u002f2can\u002fgenomes\u002fbacteria\u002fBorrelia_burgdorferi.html |date=2013-05-06 }}, part of 2can on the EBI-EMBL database. Retrieved 5 August 2012\u003c\u002fref\u003e Though not forming a nucleus, the [[DNA]] is condensed in a [[nucleoid]]. Plasmids encode additional genes, such as [[antibiotic resistance]] genes.\u003cbr\u003e+* On the outside, [[flagella]] and [[Pilus|pili]] project from the cell's surface. These are structures (not present in all prokaryotes) made of proteins that facilitate movement and communication between cells.\u003cbr\u003e+\u003cbr\u003e+====Bacterial shapes====\u003cbr\u003e+Cell shape, also called cell morphology, has been hypothesized to form from the arrangement and movement of the cytoskeleton.\u003cref\u003e{{Cite journal |last1=Pichoff |first1=Sebastien |last2=Lutkenhaus |first2=Joe |date=2007-12-01 |title=Overview of cell shape: cytoskeletons shape bacterial cells |journal=Current Opinion in Microbiology |series=Growth and Development |language=en |volume=10 |issue=6 |pages=601\u2013605 |doi=10.1016\u002fj.mib.2007.09.005 |pmid=17980647 |pmc=2703429 |issn=1369-5274 }}\u003c\u002fref\u003e Many advancements in the study of cell morphology come from studying simple bacteria such as ''[[Staphylococcus aureus]]'',\u00a0''[[Escherichia coli|E. coli]]'',\u00a0and [[Bacillus subtilis|''B. subtilis''.]]\u003cref name=\"Kysela-2016\"\u003e{{Cite journal |last1=Kysela |first1=David T. |last2=Randich |first2=Amelia M. |last3=Caccamo |first3=Paul D. |last4=Brun |first4=Yves V. |date=2016-10-03 |title=Diversity Takes Shape: Understanding the Mechanistic and Adaptive Basis of Bacterial Morphology |url=http:\u002f\u002fdx.doi.org\u002f10.1371\u002fjournal.pbio.1002565 |journal=PLOS Biology |volume=14 |issue=10 |page=e1002565 |doi=10.1371\u002fjournal.pbio.1002565 |pmid=27695035 |pmc=5047622 |issn=1545-7885 |access-date=2022-04-24 |archive-date=2022-05-11 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220511173927\u002fhttps:\u002f\u002fjournals.plos.org\u002fplosbiology\u002farticle?id=10.1371\u002fjournal.pbio.1002565 |url-status=live }}\u003c\u002fref\u003e Different cell shapes have been found and described, but how and why cells form different shapes is still widely unknown.\u003cref name=\"Kysela-2016\" \u002f\u003e Some cell shapes that have been identified include rods, cocci and spirochaetes. Cocci have a circular shape, bacilli have an elongated rod-like shape, and spirochaetes have a spiral shape. Many other shapes have also been determined.\u003cbr\u003e+\u003cbr\u003e+===Eukaryotic cells===\u003cbr\u003e+{{Main|Eukaryote}}\u003cbr\u003e \u003cbr\u003e [[File:Animal cell structure en.svg|thumb|upright=1.25|Structure of a typical animal cell]]\u003cbr\u003e [[File:Plant cell structure-en.svg|thumb|upright=1.25|Structure of a typical [[plant cell]]]]\u003cbr\u003e \u003cbr\u003e [[Plants]], [[animals]], [[fungi]], [[slime mould]]s, [[protozoa]], and [[algae]] are all [[eukaryotic]]. These cells are about fifteen times wider than a typical prokaryote and can be as much as a thousand times greater in volume. The main distinguishing feature of eukaryotes as compared to prokaryotes is [[Cellular compartment|compartmentalization]]: the presence of membrane-bound [[organelle]]s (compartments) in which specific activities take place. Most important among these is a [[cell nucleus]],\u003cref name=\"NCBI\"\u002f\u003e an organelle that houses the cell's [[DNA]]. This nucleus gives the eukaryote its name, which means \"true kernel (nucleus)\". Some of the other differences are:\u003cbr\u003e-\u003cbr\u003e * The plasma membrane resembles that of prokaryotes in function, with minor differences in the setup. Cell walls may or may not be present.\u003cbr\u003e * The eukaryotic DNA is organized in one or more linear molecules, called [[chromosome]]s, which are associated with [[histone]] proteins. All chromosomal DNA is stored in the [[cell nucleus]], separated from the cytoplasm by a membrane.\u003cref name=\"NCBI\"\u002f\u003e Some eukaryotic organelles such as [[mitochondria]] also contain some DNA.\u003cbr\u003e-* Many eukaryotic cells are [[cilium|ciliated]] with [[primary cilia]]. Primary cilia play important roles in chemosensation, [[mechanosensation]], and [[thermosensation]]. Each cilium may thus be \"viewed as a sensory cellular [[Antenna (biology)|antennae]] that coordinates a large number of cellular signaling pathways, sometimes coupling the signaling to ciliary motility or alternatively to cell division and differentiation.\"\u003cref name=\"Christenson2008\"\u003e{{cite journal |last1=Satir |first1=P. |last2=Christensen |first2=S\u00f8ren T. |title=Structure and function of mammalian cilia |journal=Histochemistry and Cell Biology |volume=129 |issue=6 |pages=687\u2013693 |date=June 2008 |pmid=18365235 |pmc=2386530 |doi=10.1007\u002fs00418-008-0416-9 |id=1432-119X }}\u003c\u002fref\u003e\u003cbr\u003e-* Motile eukaryotes can move using [[motile cilia]] or [[flagella]]. Motile cells are absent in [[conifer]]s and [[flowering plant]]s.{{cn|date=September 2023}} Eukaryotic flagella are more complex than those of prokaryotes.\u003cref\u003e{{cite journal |last1=Blair |first1=D. F. |last2=Dutcher |first2=S. K. |title=Flagella in prokaryotes and lower eukaryotes |journal=Current Opinion in Genetics & Development |volume=2 |issue=5 |pages=756\u2013767 |date=October 1992 |pmid=1458024 |doi=10.1016\u002fS0959-437X(05)80136-4 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-{|class=\"wikitable\" style=\"margin-left: auto; margin-right: auto;\"\u003cbr\u003e+* Many eukaryotic cells are [[cilium|ciliated]] with [[primary cilia]]. Primary cilia play important roles in chemosensation, [[mechanosensation]], and [[thermosensation]]. Each cilium may thus be \"viewed as a sensory cellular [[Antenna (biology)|antennae]] that coordinates a large number of cellular signaling pathways, sometimes coupling the signaling to ciliary motility or alternatively to cell division and differentiation.\"\u003cref name=\"Christenson2008\"\u003e{{cite journal | vauthors = Satir P, Christensen ST | title = Structure and function of mammalian cilia | journal = Histochemistry and Cell Biology | volume = 129 | issue = 6 | pages = 687\u2013693 | date = June 2008 | pmid = 18365235 | pmc = 2386530 | doi = 10.1007\u002fs00418-008-0416-9 | author3 = S\u00f8ren T. Christensen | id = 1432-119X }}\u003c\u002fref\u003e\u003cbr\u003e+* Motile eukaryotes can move using [[motile cilia]] or [[flagella]]. Motile cells are absent in [[conifer]]s and [[flowering plant]]s.\u003cref name=raven\u003ePH Raven, Evert RF, Eichhorm SE (1999) ''Biology of Plants'', 6th edition. New York: WH Freeman {{ISBN?}}\u003c\u002fref\u003e Eukaryotic flagella are more complex than those of prokaryotes.\u003cref\u003e{{cite journal | vauthors = Blair DF, Dutcher SK | title = Flagella in prokaryotes and lower eukaryotes | journal = Current Opinion in Genetics & Development | volume = 2 | issue = 5 | pages = 756\u2013767 | date = October 1992 | pmid = 1458024 | doi = 10.1016\u002fS0959-437X(05)80136-4 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+{| class=\"wikitable\" style=\"margin-left: auto; margin-right: auto;\"\u003cbr\u003e |+Comparison of features of prokaryotic and eukaryotic cells\u003cbr\u003e |-\u003cbr\u003e !\u003cbr\u003e@@ -59,19 +66,19 @@\u003cbr\u003e |-\u003cbr\u003e !Typical organisms\u003cbr\u003e |[[bacterium|bacteria]], [[archaea]]\u003cbr\u003e-|[[protist]]s, [[algae]], [[fungus|fungi]], [[plant]]s, [[animal]]s\u003cbr\u003e+|[[protist]]s, [[fungus|fungi]], [[plant]]s, [[animal]]s\u003cbr\u003e |-\u003cbr\u003e !Typical size\u003cbr\u003e-|~ 1\u20135&nbsp;[[Micrometre|\u03bcm]]\u003cref name=\"CampbellBiology320\"\u003e{{cite book |title=Campbell Biology{{snd}}Concepts and Connections |publisher=Pearson Education |year=2009 |page=320}}\u003c\u002fref\u003e\u003cbr\u003e+|~ 1\u20135&nbsp;[[Micrometre|\u03bcm]]\u003cref name=\"CampbellBiology320\"\u003e{{cite book | title=Campbell Biology{{snd}}Concepts and Connections | publisher=Pearson Education | year=2009 | page=320}}\u003c\u002fref\u003e\u003cbr\u003e |~ 10\u2013100&nbsp;\u03bcm\u003cref name=CampbellBiology320 \u002f\u003e\u003cbr\u003e |-\u003cbr\u003e+!Type of [[cell nucleus|nucleus]]\u003cbr\u003e+|[[nucleoid region]]; no true nucleus\u003cbr\u003e+|true nucleus with double membrane\u003cbr\u003e+|-\u003cbr\u003e ![[DNA]]\u003cbr\u003e-|In [[nucleoid region]]\u003cbr\u003e-|In [[cell nucleus|nucleus]] with double membrane\u003cbr\u003e-|-\u003cbr\u003e-![[Chromosome]]s\u003cbr\u003e-|Single, usually [[Circular prokaryote chromosome|circular]]\u003cbr\u003e-|Multiple paired linear chromosomes with [[histone]] [[protein]]s\u003cbr\u003e+|[[Circular prokaryote chromosome|circular]] (usually)\u003cbr\u003e+|linear molecules ([[chromosome]]s) with [[histone]] [[protein]]s\u003cbr\u003e |-\u003cbr\u003e ![[RNA]]\u002f[[protein]] synthesis\u003cbr\u003e |coupled in the [[cytoplasm]]\u003cbr\u003e@@ -82,12 +89,12 @@\u003cbr\u003e |[[60S]] and [[40S]]\u003cbr\u003e |-\u003cbr\u003e !Cytoplasmic structure\u003cbr\u003e-|Microcompartments with proteins, [[cytoskeleton]]\u003cbr\u003e-| [[Endomembrane system]], cytoskeleton\u003cbr\u003e+|very few structures\u003cbr\u003e+|highly structured by [[endomembrane system|endomembranes]] and a [[cytoskeleton]]\u003cbr\u003e |-\u003cbr\u003e ![[Chemotaxis|Cell movement]]\u003cbr\u003e-|[[Flagellum|flagella]]\u003cbr\u003e-|flagella and [[Cilium|cilia]]; [[lamellipodia]] and [[filopodia]]\u003cbr\u003e+|[[Flagellum|flagella]] made of [[flagellin]]\u003cbr\u003e+|flagella and [[Cilium|cilia]] containing [[microtubule]]s; [[lamellipodia]] and [[filopodia]] containing [[actin]]\u003cbr\u003e |-\u003cbr\u003e ![[Mitochondrion|Mitochondria]]\u003cbr\u003e |none\u003cbr\u003e@@ -98,47 +105,38 @@\u003cbr\u003e |in [[algae]] and [[plant]]s\u003cbr\u003e |-\u003cbr\u003e !Organization\u003cbr\u003e-|single cells, colonies, [[biofilm]]s\u003cbr\u003e-|single cells, colonies, [[Multicellular organism|multicellular organisms]] with specialized cells\u003cbr\u003e+|usually single cells\u003cbr\u003e+|single cells, colonies, higher multicellular organisms with specialized cells\u003cbr\u003e |-\u003cbr\u003e ![[Cell division]]\u003cbr\u003e |[[binary fission]] (simple division)\u003cbr\u003e |[[mitosis]] (fission or budding) \u003cbr \u002f\u003e[[meiosis]]\u003cbr\u003e |-\u003cbr\u003e+![[Chromosome]]s\u003cbr\u003e+|single chromosome\u003cbr\u003e+|more than one chromosome\u003cbr\u003e+|-\u003cbr\u003e ![[Membrane]]s\u003cbr\u003e |[[cell membrane]]\u003cbr\u003e-|Cell membrane and membrane-bound organelles\u003cbr\u003e+|\u003cbr\u003e |}\u003cbr\u003e \u003cbr\u003e-Many groups of eukaryotes are single-celled. Among the many-celled groups are animals and plants. The number of cells in these groups vary with species; it has been estimated that the [[human body]] contains around 37 trillion (3.72\u00d710\u003csup\u003e13\u003c\u002fsup\u003e) cells,\u003cref\u003e{{Cite journal |last1=Bianconi |first1=Eva |last2=Piovesan |first2=Allison |last3=Facchin |first3=Federica |last4=Beraudi |first4=Alina |last5=Casadei |first5=Raffaella |last6=Frabetti |first6=Flavia |last7=Vitale |first7=Lorenza |last8=Pelleri |first8=Maria Chiara |last9=Tassani |first9=Simone |last10=Piva |first10=Francesco |last11=Perez-Amodio |first11=Soledad |date=2013-11-01 |title=An estimation of the number of cells in the human body |journal=Annals of Human Biology |volume=40 |issue=6 |pages=463\u2013471 |doi=10.3109\u002f03014460.2013.807878 |issn=0301-4460 |pmid=23829164 |hdl=11585\u002f152451 |s2cid=16247166 |doi-access=free }}\u003c\u002fref\u003e and more recent studies put this number at around 30 trillion (~36 trillion cells in the male, ~28 trillion in the female).\u003cref name=\":0\"\u003e{{Cite journal |last1=Hatton |first1=Ian A. |last2=Galbraith |first2=Eric D. |last3=Merleau |first3=Nono S. C. |last4=Miettinen |first4=Teemu P. |last5=Smith |first5=Benjamin McDonald |last6=Shander |first6=Jeffery A. |date=2023-09-26 |title=The human cell count and size distribution |journal=Proceedings of the National Academy of Sciences |language=en |volume=120 |issue=39 |pages=e2303077120 |doi=10.1073\u002fpnas.2303077120 |issn=0027-8424 |pmc=10523466 |pmid=37722043|bibcode=2023PNAS..12003077H }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Subcellular components ==\u003cbr\u003e-\u003cbr\u003e+==Subcellular components==\u003cbr\u003e All cells, whether [[prokaryotic]] or [[eukaryotic]], have a [[cell membrane|membrane]] that envelops the cell, regulates what moves in and out (selectively permeable), and maintains the [[Membrane potential|electric potential of the cell]]. Inside the membrane, the [[cytoplasm]] takes up most of the cell's volume. Except [[red blood cell]]s, which lack a cell nucleus and most organelles to accommodate maximum space for [[hemoglobin]], all cells possess [[DNA]], the hereditary material of [[gene]]s, and [[RNA]], containing the information necessary to [[gene expression|build]] various [[protein]]s such as [[enzyme]]s, the cell's primary machinery. There are also other kinds of [[biomolecule]]s in cells. This article lists these primary [[cellular component]]s, then briefly describes their function.\u003cbr\u003e \u003cbr\u003e-=== Cell membrane ===\u003cbr\u003e-\u003cbr\u003e-{{main|Cell membrane}}\u003cbr\u003e-\u003cbr\u003e+===Cell membrane===\u003cbr\u003e+{{Main|Cell membrane}}\u003cbr\u003e [[File: Cell membrane detailed diagram en.svg|thumb|upright=1.35|Detailed diagram of lipid bilayer of cell membrane]]\u003cbr\u003e-\u003cbr\u003e-The [[cell membrane]], or plasma membrane, is a selectively permeable{{Cn|date=May 2024}} [[biological membrane]] that surrounds the cytoplasm of a cell. In animals, the plasma membrane is the outer boundary of the cell, while in plants and prokaryotes it is usually covered by a [[cell wall]]. This membrane serves to separate and protect a cell from its surrounding environment and is made mostly from a [[lipid bilayer|double layer of phospholipids]], which are [[amphiphilic]] (partly [[hydrophobic]] and partly [[hydrophilic]]). Hence, the layer is called a [[phospholipid bilayer]], or sometimes a fluid mosaic membrane. Embedded within this membrane is a macromolecular structure called the [[porosome]] the universal secretory portal in cells and a variety of [[protein]] molecules that act as channels and pumps that move different molecules into and out of the cell.\u003cref name=\"NCBI\"\u002f\u003e The membrane is semi-permeable, and selectively permeable, in that it can either let a substance ([[molecule]] or [[ion]]) pass through freely, to a limited extent or not at all.{{Cn|date=May 2024}} Cell surface membranes also contain [[Receptor (biochemistry)#Transmembrane receptors|receptor]] proteins that allow cells to detect external signaling molecules such as [[hormone]]s.\u003cref name=\"Guyton Hall 2016\"\u003e{{cite book |last1=Guyton |first1=Arthur C. |last2=Hall |first2=John E. |year=2016 |title=Guyton and Hall Textbook of Medical Physiology |location=Philadelphia |publisher=Elsevier Saunders |pages=930\u2013937 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=3sWNCgAAQBAJ |oclc=1027900365 |isbn=978-1-4557-7005-2}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Cytoskeleton ===\u003cbr\u003e-\u003cbr\u003e-{{main|Cytoskeleton}}\u003cbr\u003e-{{further|Morphogenesis}}\u003cbr\u003e-\u003cbr\u003e+The [[cell membrane]], or plasma membrane, is a selectively permeable\u003cref\u003e{{Cite web|title=Why is the plasma membrane called a selectively permeable membrane? \u2013 Biology Q&A|url=https:\u002f\u002fbyjus.com\u002fquestions\u002fwhy-is-the-plasma-membrane-called-a-selectively-permeable-membrane\u002f|access-date=2021-09-18|website=BYJUS|language=en|archive-date=2021-09-18|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210918101505\u002fhttps:\u002f\u002fbyjus.com\u002fquestions\u002fwhy-is-the-plasma-membrane-called-a-selectively-permeable-membrane\u002f|url-status=live}}\u003c\u002fref\u003e [[biological membrane]] that surrounds the cytoplasm of a cell. In animals, the plasma membrane is the outer boundary of the cell, while in plants and prokaryotes it is usually covered by a [[cell wall]]. This membrane serves to separate and protect a cell from its surrounding environment and is made mostly from a [[lipid bilayer|double layer of phospholipids]], which are [[amphiphilic]] (partly [[hydrophobic]] and partly [[hydrophilic]]). Hence, the layer is called a [[phospholipid bilayer]], or sometimes a fluid mosaic membrane. Embedded within this membrane is a macromolecular structure called the [[porosome]] the universal secretory portal in cells and a variety of [[protein]] molecules that act as channels and pumps that move different molecules into and out of the cell.\u003cref name=\"NCBI\"\u002f\u003e The membrane is semi-permeable, and selectively permeable, in that it can either let a substance ([[molecule]] or [[ion]]) pass through freely, pass through to a limited extent or not pass through at all. Cell surface membranes also contain [[Receptor (biochemistry)#Transmembrane receptors|receptor]] proteins that allow cells to detect external signaling molecules such as [[hormone]]s.\u003cbr\u003e+\u003cbr\u003e+===Cytoskeleton===\u003cbr\u003e+{{Main|Cytoskeleton}}{{Further|Morphogenesis}}\u003cbr\u003e [[File:DAPIMitoTrackerRedAlexaFluor488BPAE.jpg|thumb|A fluorescent image of an endothelial cell. Nuclei are stained blue, [[mitochondria]] are stained red, and microfilaments are stained green.]]\u003cbr\u003e-\u003cbr\u003e-The cytoskeleton acts to organize and maintain the cell's shape; anchors organelles in place; helps during [[endocytosis]], the uptake of external materials by a cell, and [[cytokinesis]], the separation of daughter cells after [[cell division]]; and moves parts of the cell in processes of growth and mobility. The eukaryotic cytoskeleton is composed of [[microtubule]]s, [[intermediate filament]]s and [[microfilament]]s. In the cytoskeleton of a [[neuron]] the intermediate filaments are known as [[neurofilament]]s. There are a great number of proteins associated with them, each controlling a cell's structure by directing, bundling, and aligning filaments.\u003cref name=\"NCBI\"\u002f\u003e The prokaryotic cytoskeleton is less well-studied but is involved in the maintenance of cell shape, [[cell polarity|polarity]] and cytokinesis.\u003cref\u003e{{cite journal |last1=Michie |first1=K. A. |last2=L\u00f6we |first2=J. |title=Dynamic filaments of the bacterial cytoskeleton |journal=Annual Review of Biochemistry |volume=75 |pages=467\u2013492 |year=2006 |pmid=16756499 |doi=10.1146\u002fannurev.biochem.75.103004.142452 |s2cid=4550126 }}\u003c\u002fref\u003e The subunit protein of microfilaments is a small, monomeric protein called [[actin]]. The subunit of microtubules is a dimeric molecule called [[tubulin]]. Intermediate filaments are heteropolymers whose subunits vary among the cell types in different tissues. Some of the subunit proteins of intermediate filaments include [[vimentin]], [[desmin]], [[lamin]] (lamins A, B and C), [[keratin]] (multiple acidic and basic keratins), and [[neurofilament proteins]] ([[NEFL|NF\u2013L]], [[NEFM|NF\u2013M]]).\u003cbr\u003e-\u003cbr\u003e-=== Genetic material ===\u003cbr\u003e-\u003cbr\u003e-{{main|DNA|RNA}}\u003cbr\u003e-\u003cbr\u003e+The cytoskeleton acts to organize and maintain the cell's shape; anchors organelles in place; helps during [[endocytosis]], the uptake of external materials by a cell, and [[cytokinesis]], the separation of daughter cells after [[cell division]]; and moves parts of the cell in processes of growth and mobility. The eukaryotic cytoskeleton is composed of [[microtubule]]s, [[intermediate filament]]s and [[microfilament]]s. In the cytoskeleton of a [[neuron]] the intermediate filaments are known as [[neurofilament]]s. There are a great number of proteins associated with them, each controlling a cell's structure by directing, bundling, and aligning filaments.\u003cref name=\"NCBI\"\u002f\u003e The prokaryotic cytoskeleton is less well-studied but is involved in the maintenance of cell shape, [[cell polarity|polarity]] and cytokinesis.\u003cref\u003e{{cite journal | vauthors = Michie KA, L\u00f6we J | title = Dynamic filaments of the bacterial cytoskeleton | journal = Annual Review of Biochemistry | volume = 75 | pages = 467\u2013492 | year = 2006 | pmid = 16756499 | doi = 10.1146\u002fannurev.biochem.75.103004.142452 | s2cid = 4550126 }}\u003c\u002fref\u003e The subunit protein of microfilaments is a small, monomeric protein called [[actin]]. The subunit of microtubules is a dimeric molecule called [[tubulin]]. Intermediate filaments are heteropolymers whose subunits vary among the cell types in different tissues. Some of the subunit proteins of intermediate filaments include [[vimentin]], [[desmin]], [[lamin]] (lamins A, B and C), [[keratin]] (multiple acidic and basic keratins), and [[neurofilament proteins]] ([[NEFL|NF\u2013L]], [[NEFM|NF\u2013M]]).\u003cbr\u003e+\u003cbr\u003e+===Genetic material===\u003cbr\u003e+{{Main|DNA|RNA}}\u003cbr\u003e [[File:DNA orbit animated.gif|thumb|[[DNA|Deoxyribonucleic acid]] (DNA)]]\u003cbr\u003e-\u003cbr\u003e Two different kinds of genetic material exist: [[DNA|deoxyribonucleic acid]] (DNA) and [[RNA|ribonucleic acid]] (RNA). Cells use DNA for their long-term information storage. The biological information contained in an organism is [[Genetic code|encoded]] in its DNA sequence.\u003cref name=\"NCBI\"\u002f\u003e RNA is used for information transport (e.g., [[mRNA]]) and [[enzyme|enzymatic]] functions (e.g., [[ribosome|ribosomal]] RNA). [[Transfer RNA]] (tRNA) molecules are used to add amino acids during protein [[Translation (biology)|translation]].\u003cbr\u003e \u003cbr\u003e Prokaryotic genetic material is organized in a simple [[circular bacterial chromosome]] in the [[nucleoid region]] of the cytoplasm. Eukaryotic genetic material is divided into different,\u003cref name=\"NCBI\"\u002f\u003e linear molecules called [[chromosome]]s inside a discrete nucleus, usually with additional genetic material in some organelles like [[mitochondria]] and [[chloroplasts]] (see [[endosymbiotic theory]]).\u003cbr\u003e@@ -147,174 +145,136 @@\u003cbr\u003e \u003cbr\u003e Foreign genetic material (most commonly DNA) can also be artificially introduced into the cell by a process called [[transfection]]. This can be transient, if the DNA is not inserted into the cell's [[genome]], or stable, if it is. Certain [[virus]]es also insert their genetic material into the genome.\u003cbr\u003e \u003cbr\u003e-=== Organelles ===\u003cbr\u003e-\u003cbr\u003e-{{main|Organelle}}\u003cbr\u003e-\u003cbr\u003e+===Organelles===\u003cbr\u003e+{{Main|Organelle}}\u003cbr\u003e Organelles are parts of the cell that are adapted and\u002for specialized for carrying out one or more vital functions, analogous to the [[Organ (biology)|organs]] of the human body (such as the heart, lung, and kidney, with each organ performing a different function).\u003cref name=\"NCBI\"\u002f\u003e Both eukaryotic and prokaryotic cells have organelles, but prokaryotic organelles are generally simpler and are not membrane-bound.\u003cbr\u003e \u003cbr\u003e There are several types of organelles in a cell. Some (such as the [[Cell nucleus|nucleus]] and [[Golgi apparatus]]) are typically solitary, while others (such as [[mitochondria]], [[chloroplasts]], [[peroxisomes]] and [[lysosomes]]) can be numerous (hundreds to thousands). The [[cytosol]] is the gelatinous fluid that fills the cell and surrounds the organelles.\u003cbr\u003e \u003cbr\u003e-==== Eukaryotic ====\u003cbr\u003e-\u003cbr\u003e+====Eukaryotic====\u003cbr\u003e [[File:HeLa cells stained with Hoechst 33258.jpg|thumb|Human cancer cells, specifically [[HeLa cells]], with DNA stained blue. The central and rightmost cell are in [[interphase]], so their DNA is diffuse and the entire nuclei are labelled. The cell on the left is going through [[mitosis]] and its chromosomes have condensed.]]\u003cbr\u003e-\u003cbr\u003e * '''Cell nucleus''': A cell's information center, the [[cell nucleus]] is the most conspicuous organelle found in a [[eukaryotic]] cell. It houses the cell's [[chromosomes]], and is the place where almost all [[DNA]] replication and [[RNA]] synthesis ([[Transcription (genetics)|transcription]]) occur. The nucleus is spherical and separated from the cytoplasm by a double membrane called the [[nuclear envelope]], space between these two membrane is called perinuclear space. The nuclear envelope isolates and protects a cell's DNA from various molecules that could accidentally damage its structure or interfere with its processing. During processing, [[DNA]] is [[Transcription (genetics)|transcribed]], or copied into a special [[RNA]], called [[messenger RNA]] (mRNA). This mRNA is then transported out of the nucleus, where it is translated into a specific protein molecule. The [[nucleolus]] is a specialized region within the nucleus where ribosome subunits are assembled. In prokaryotes, DNA processing takes place in the [[cytoplasm]].\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e * '''Mitochondria and chloroplasts''': generate energy for the cell. [[Mitochondrion|Mitochondria]] are self-replicating double membrane-bound organelles that occur in various numbers, shapes, and sizes in the cytoplasm of all eukaryotic cells.\u003cref name=\"NCBI\"\u002f\u003e [[Cellular respiration|Respiration]] occurs in the cell mitochondria, which generate the cell's energy by [[oxidative phosphorylation]], using [[oxygen]] to release energy stored in cellular nutrients (typically pertaining to [[glucose]]) to generate [[adenosine triphosphate|ATP]] ([[aerobic respiration]]). Mitochondria multiply by [[binary fission]], like prokaryotes. Chloroplasts can only be found in plants and algae, and they capture the sun's energy to make carbohydrates through [[photosynthesis]].\u003cbr\u003e \u003cbr\u003e-[[File:Endomembrane system diagram en.svg|thumb|upright=1.25|Diagram of the [[endomembrane system]] ]]\u003cbr\u003e-\u003cbr\u003e+[[File:Endomembrane system diagram en.svg|thumb|upright=1.25|Diagram of the [[endomembrane system]]]]\u003cbr\u003e * '''Endoplasmic reticulum''': The [[endoplasmic reticulum]] (ER) is a transport network for molecules targeted for certain modifications and specific destinations, as compared to molecules that float freely in the cytoplasm. The ER has two forms: the rough ER, which has ribosomes on its surface that secrete proteins into the ER, and the smooth ER, which lacks ribosomes.\u003cref name=\"NCBI\"\u002f\u003e The smooth ER plays a role in calcium sequestration and release and also helps in synthesis of [[lipid]].\u003cbr\u003e * '''Golgi apparatus''': The primary function of the Golgi apparatus is to process and package the [[macromolecule]]s such as [[protein]]s and [[lipid]]s that are synthesized by the cell.\u003cbr\u003e-* '''Lysosomes and peroxisomes''': [[Lysosome]]s contain [[digestive enzyme]]s (acid [[hydrolase]]s). They digest excess or worn-out [[organelle]]s, food particles, and engulfed [[virus]]es or [[bacteria]]. [[Peroxisome]]s have enzymes that rid the cell of toxic [[peroxide]]s, Lysosomes are optimally active in an acidic environment. The cell could not house these destructive enzymes if they were not contained in a membrane-bound system.\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e-* '''Centrosome''': the cytoskeleton organizer: The [[centrosome]] produces the [[microtubules]] of a cell\u2014a key component of the [[cytoskeleton]]. It directs the transport through the [[endoplasmic reticulum|ER]] and the [[Golgi apparatus]]. Centrosomes are composed of two [[centrioles]] which lie perpendicular to each other in which each has an organization like a [[Cart wheel|cartwheel]], which separate during [[cell division]] and help in the formation of the [[mitotic spindle]]. A single centrosome is present in the animal cells. They are also found in some fungi and algae cells.\u003cbr\u003e-* '''Vacuoles''': [[Vacuole]]s sequester waste products and in plant cells store water. They are often described as liquid filled spaces and are surrounded by a membrane. Some cells, most notably ''[[Amoeba (genus)|Amoeba]]'', have contractile vacuoles, which can pump water out of the cell if there is too much water. The vacuoles of plant cells and fungal cells are usually larger than those of animal cells. Vacuoles of plant cells are surrounded by a membrane which transports ions against concentration gradients.\u003cbr\u003e-\u003cbr\u003e-==== Eukaryotic and prokaryotic ====\u003cbr\u003e-\u003cbr\u003e-* '''Ribosomes''': The [[ribosome]] is a large complex of [[RNA]] and [[protein]] molecules.\u003cref name=\"NCBI\"\u002f\u003e They each consist of two subunits, and act as an assembly line where RNA from the nucleus is used to synthesise proteins from amino acids. Ribosomes can be found either floating freely or bound to a membrane (the rough endoplasmatic reticulum in eukaryotes, or the cell membrane in prokaryotes).\u003cref\u003e{{cite journal  |last1=M\u00e9n\u00e9tret |first1=Jean-Fran\u00e7ois |last2=Schaletzky |first2=Julia |last3=Clemons |first3=William M. |last4=Osborne |first4=Andrew R. |last5=Sk\u00e5nland |first5=Sigrid S. |last6=Denison |first6=Carilee |last7=Gygi |first7=Steven P. |last8=Kirkpatrick |first8=Don S. |last9=Park |first9=Eunyong |last10=Ludtke |first10=Steven J. |last11=Rapoport |first11=Tom A. |last12=Akey |first12=Christopher W. |display-authors=3 |title=Ribosome binding of a single copy of the SecY complex: implications for protein translocation |journal=Molecular Cell |volume=28 |issue=6 |pages=1083\u20131092 |date=December 2007 |pmid=18158904 |doi=10.1016\u002fj.molcel.2007.10.034 |url=https:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |doi-access=free |access-date=2020-09-01 |archive-date=2021-01-21 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210121115905\u002fhttps:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-* '''Plastids''': [[Plastid]] are membrane-bound organelle generally found in plant cells and [[Euglenid|euglenoids]] and contain specific ''pigments'', thus affecting the colour of the plant and organism. And these pigments also helps in food storage and tapping of light energy. There are three types of plastids based upon the specific pigments. [[Chloroplast]]s contain [[chlorophyll]] and some carotenoid pigments which helps in the tapping of light energy during photosynthesis. [[Chromoplast]]s contain fat-soluble [[carotenoid]] pigments like orange carotene and yellow xanthophylls which helps in synthesis and storage. [[Leucoplast]]s are non-pigmented plastids and helps in storage of nutrients.\u003cref\u003e{{cite book |last=Sato |first=N. |year=2006 |pages=75\u2013102 |title=The Structure and Function of Plastids |volume=23 |editor1=Wise, R. R. |editor2=Hoober, J. K. |publisher=Springer |chapter=Origin and Evolution of Plastids: Genomic View on the Unification and Diversity of Plastids |isbn=978-1-4020-4060-3 |doi=10.1007\u002f978-1-4020-4061-0_4 |series=Advances in Photosynthesis and Respiration}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Structures outside the cell membrane ==\u003cbr\u003e-\u003cbr\u003e-Many cells also have structures which exist wholly or partially outside the cell membrane. These structures are notable because they are not protected from the external environment by the cell membrane. In order to assemble these structures, their components must be carried across the cell membrane by export processes.\u003cbr\u003e-\u003cbr\u003e-=== Cell wall ===\u003cbr\u003e-\u003cbr\u003e-{{further|Cell wall}}\u003cbr\u003e-\u003cbr\u003e+* '''Lysosomes and peroxisomes''': [[Lysosome]]s contain [[digestive enzyme]]s (acid [[hydrolase]]s). They digest excess or worn-out [[organelle]]s, food particles, and engulfed [[virus]]es or [[bacteria]]. [[Peroxisome]]s have enzymes that rid the cell of toxic [[peroxide]]s, Lysosomes are optimally active at [[acidic pH]]. The cell could not house these destructive enzymes if they were not contained in a membrane-bound system.\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e+* '''Centrosome''': the cytoskeleton organizer: The [[centrosome]] produces the [[microtubules]] of a cell\u2014a key component of the [[cytoskeleton]]. It directs the transport through the [[endoplasmic reticulum|ER]] and the [[Golgi apparatus]]. Centrosomes are composed of two [[centrioles]] which lie perpendicular to each other in which each has an organization like a [[Cart wheel|cartwheel]], which separate during [[cell division]] and help in the formation of the [[mitotic spindle]]. A single centrosome is present in the [[animal cell]]s. They are also found in some fungi and algae cells.\u003cbr\u003e+* '''Vacuoles''': [[Vacuole]]s sequester waste products and in plant cells store water. They are often described as liquid filled spaces and are surrounded by a membrane. Some cells, most notably ''[[Amoeba (genus)|Amoeba]]'', have contractile vacuoles, which can pump water out of the cell if there is too much water. The vacuoles of plant cells and fungal cells are usually larger than those of animal cells. Vacuoles of plant cells are surrounded by [[tonoplast]] which helps in transport of ions and other substances against concentration gradients.\u003cbr\u003e+\u003cbr\u003e+====Eukaryotic and prokaryotic====\u003cbr\u003e+* '''Ribosomes''': The [[ribosome]] is a large complex of [[RNA]] and [[protein]] molecules.\u003cref name=\"NCBI\"\u002f\u003e They each consist of two subunits, and act as an assembly line where RNA from the nucleus is used to synthesise proteins from amino acids. Ribosomes can be found either floating freely or bound to a membrane (the rough endoplasmatic reticulum in eukaryotes, or the cell membrane in prokaryotes).\u003cref\u003e{{cite journal | vauthors = M\u00e9n\u00e9tret JF, Schaletzky J, Clemons WM, Osborne AR, Sk\u00e5nland SS, Denison C, Gygi SP, Kirkpatrick DS, Park E, Ludtke SJ, Rapoport TA, Akey CW | display-authors = 6 | title = Ribosome binding of a single copy of the SecY complex: implications for protein translocation | journal = Molecular Cell | volume = 28 | issue = 6 | pages = 1083\u20131092 | date = December 2007 | pmid = 18158904 | doi = 10.1016\u002fj.molcel.2007.10.034 | url = https:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf | doi-access = free | access-date = 2020-09-01 | archive-date = 2021-01-21 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20210121115905\u002fhttps:\u002f\u002fauthors.library.caltech.edu\u002f90566\u002f2\u002f1-s2.0-S1097276507008258-mmc1.pdf | url-status = live }}\u003c\u002fref\u003e\u003cbr\u003e+* '''Plastids''': [[Plastid]] are membrane-bound organelle generally found in plant cells and [[Euglenid|euglenoids]] and contain specific ''pigments'', thus affecting the colour of the plant and organism. And these pigments also helps in food storage and tapping of light energy. There are three types of plastids based upon the specific pigments. [[Chloroplast]]s contain [[chlorophyll]] and some carotenoid pigments which helps in the tapping of light energy during photosynthesis. [[Chromoplast]]s contain fat-soluble [[carotenoid]] pigments like orange carotene and yellow xanthophylls which helps in synthesis and storage. [[Leucoplast]]s are non-pigmented plastids and helps in storage of nutrients.\u003cbr\u003e+\u003cbr\u003e+==Structures outside the cell membrane==\u003cbr\u003e+Many cells also have structures which exist wholly or partially outside the cell membrane. These structures are notable because they are not protected from the external environment by the [[semipermeable membrane|semipermeable cell membrane]]. In order to assemble these structures, their components must be carried across the cell membrane by export processes.\u003cbr\u003e+\u003cbr\u003e+===Cell wall===\u003cbr\u003e+{{Further|Cell wall}}\u003cbr\u003e Many types of prokaryotic and eukaryotic cells have a [[cell wall]]. The cell wall acts to protect the cell mechanically and chemically from its environment, and is an additional layer of protection to the cell membrane. Different types of cell have cell walls made up of different materials; plant cell walls are primarily made up of [[cellulose]], fungi cell walls are made up of [[chitin]] and bacteria cell walls are made up of [[peptidoglycan]].\u003cbr\u003e \u003cbr\u003e-=== Prokaryotic ===\u003cbr\u003e-\u003cbr\u003e-==== Capsule ====\u003cbr\u003e-\u003cbr\u003e+===Prokaryotic===\u003cbr\u003e+\u003cbr\u003e+====Capsule====\u003cbr\u003e A gelatinous [[bacterial capsule|capsule]] is present in some bacteria outside the cell membrane and cell wall. The capsule may be [[polysaccharide]] as in [[pneumococci]], [[meningococci]] or [[polypeptide]] as ''[[Bacillus anthracis]]'' or [[hyaluronic acid]] as in [[streptococci]].\u003cbr\u003e-Capsules are not marked by normal staining protocols and can be detected by [[India ink#Uses other than writing|India ink]] or [[methyl blue]], which allows for higher contrast between the cells for observation.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=N2GU-DYKkk0C&q=Prokaryotic+india+ink&pg=PA87 |title=Prokaryotes |publisher=Newnes |date=1996 |isbn=978-0080984735 |access-date=November 9, 2020 |archive-date=April 14, 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414134256\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=N2GU-DYKkk0C&q=Prokaryotic+india+ink&pg=PA87 |url-status=live }}\u003c\u002fref\u003e{{rp|87}}\u003cbr\u003e-\u003cbr\u003e-==== Flagella ====\u003cbr\u003e-\u003cbr\u003e+Capsules are not marked by normal staining protocols and can be detected by [[India ink#Uses other than writing|India ink]] or [[methyl blue]], which allows for higher contrast between the cells for observation.\u003cref\u003e{{cite book | url=https:\u002f\u002fbooks.google.com\u002fbooks?id=N2GU-DYKkk0C&q=Prokaryotic+india+ink&pg=PA87 | title=Prokaryotes | publisher=Newnes | date=1996 | isbn=978-0080984735 | access-date=November 9, 2020 | archive-date=April 14, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414134256\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=N2GU-DYKkk0C&q=Prokaryotic+india+ink&pg=PA87 | url-status=live }}\u003c\u002fref\u003e{{rp|87}}\u003cbr\u003e+\u003cbr\u003e+====Flagella====\u003cbr\u003e [[Flagella]] are organelles for cellular mobility. The bacterial flagellum stretches from cytoplasm through the cell membrane(s) and extrudes through the cell wall. They are long and thick thread-like appendages, protein in nature. A different type of flagellum is found in archaea and a different type is found in eukaryotes.\u003cbr\u003e \u003cbr\u003e-==== Fimbriae ====\u003cbr\u003e-\u003cbr\u003e+====Fimbriae====\u003cbr\u003e A [[fimbria (bacteriology)|fimbria]] (plural fimbriae also known as a [[pilus]], plural pili) is a short, thin, hair-like filament found on the surface of bacteria. Fimbriae are formed of a protein called [[pilin]] ([[antigenic]]) and are responsible for the attachment of bacteria to specific receptors on human cells ([[cell adhesion]]). There are special types of pili involved in [[bacterial conjugation]].\u003cbr\u003e \u003cbr\u003e-== Cellular processes ==\u003cbr\u003e-\u003cbr\u003e+==Cellular processes==\u003cbr\u003e [[File:Three cell growth types.svg|thumb|upright=1.25|[[Prokaryotes]] divide by [[binary fission]], while [[eukaryotes]] divide by [[mitosis]] or [[meiosis]].]]\u003cbr\u003e \u003cbr\u003e-=== Replication ===\u003cbr\u003e-\u003cbr\u003e-{{main|Cell division}}\u003cbr\u003e-\u003cbr\u003e+===Replication===\u003cbr\u003e+{{Main|Cell division}}\u003cbr\u003e Cell division involves a single cell (called a ''mother cell'') dividing into two daughter cells. This leads to growth in [[multicellular organism]]s (the growth of [[biological tissue|tissue]]) and to procreation ([[vegetative reproduction]]) in [[unicellular organism]]s. [[Prokaryote|Prokaryotic]] cells divide by [[binary fission]], while [[Eukaryote|eukaryotic]] cells usually undergo a process of nuclear division, called [[mitosis]], followed by division of the cell, called [[cytokinesis]]. A [[diploid]] cell may also undergo [[meiosis]] to produce haploid cells, usually four. [[Haploid]] cells serve as [[gamete]]s in multicellular organisms, fusing to form new diploid cells.\u003cbr\u003e \u003cbr\u003e [[DNA replication]], or the process of duplicating a cell's genome,\u003cref name=\"NCBI\"\u002f\u003e always happens when a cell divides through mitosis or binary fission. This occurs during the S phase of the [[cell cycle]].\u003cbr\u003e \u003cbr\u003e In meiosis, the DNA is replicated only once, while the cell divides twice. DNA replication only occurs before [[meiosis I]]. DNA replication does not occur when the cells divide the second time, in [[meiosis II]].\u003cref\u003e{{cite book|title=Campbell Biology{{snd}}Concepts and Connections|year=2009|publisher=Pearson Education|page=138}}\u003c\u002fref\u003e Replication, like all cellular activities, requires specialized proteins for carrying out the job.\u003cref name=\"NCBI\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== DNA repair ===\u003cbr\u003e-\u003cbr\u003e-{{main|DNA repair}}\u003cbr\u003e-\u003cbr\u003e-Cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|damage]] and carry out [[DNA repair|repair processes]] when it is detected. Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: [[nucleotide excision repair]], [[DNA mismatch repair]], [[non-homologous end joining]] of double-strand breaks, [[homologous recombination|recombinational repair]] and light-dependent repair ([[photolyase|photoreactivation]]).\u003cref\u003e{{cite book |last1=Snustad |first1=D. Peter |last2=Simmons |first2=Michael J. |title=Principles of Genetics |edition=5th |at=DNA repair mechanisms, pp. 364\u2013368}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Growth and metabolism ===\u003cbr\u003e-\u003cbr\u003e-{{main|Cell growth|Metabolism|Photosynthesis}}\u003cbr\u003e-\u003cbr\u003e+[[File:Catabolism schematic.svg|thumb|left|An outline of the [[catabolism]] of [[protein]]s, [[carbohydrate]]s and [[fat]]s]]\u003cbr\u003e+\u003cbr\u003e+===DNA repair===\u003cbr\u003e+{{Main|DNA repair}}\u003cbr\u003e+In general, cells of all organisms contain enzyme systems that scan their DNA for [[DNA damage (naturally occurring)|DNA damage]] and carry out [[DNA repair|repair processes]] when damage is detected.\u003cref\u003eD. Peter Snustad, Michael J. Simmons, ''Principles of Genetics'', 5th ed. (DNA repair mechanisms) pp. 364\u2013368\u003c\u002fref\u003e Diverse repair processes have evolved in organisms ranging from bacteria to humans. The widespread prevalence of these repair processes indicates the importance of maintaining cellular DNA in an undamaged state in order to avoid cell death or errors of replication due to damage that could lead to [[mutation]]. [[Escherichia coli|''E. coli'']] bacteria are a well-studied example of a cellular organism with diverse well-defined [[DNA repair]] processes. These include: (1) [[nucleotide excision repair]], (2) [[DNA mismatch repair]], (3) [[non-homologous end joining]] of double-strand breaks, (4) [[homologous recombination|recombinational repair]] and (5) light-dependent repair ([[photolyase|photoreactivation]]).\u003cbr\u003e+\u003cbr\u003e+===Growth and metabolism===\u003cbr\u003e+[[File:Proteinsynthesis.png|thumb|An overview of protein synthesis.\u003cbr \u002f\u003eWithin the [[cell nucleus|nucleus]] of the cell (''light blue''), [[gene]]s (DNA, ''dark blue'') are [[transcription (genetics)|transcribed]] into [[RNA]]. This RNA is then subject to post-transcriptional modification and control, resulting in a mature [[mRNA]] (''red'') that is then transported out of the nucleus and into the [[cytoplasm]] (''peach''), where it undergoes [[translation (genetics)|translation]] into a protein. mRNA is translated by [[ribosome]]s (''purple'') that match the three-base [[codon]]s of the mRNA to the three-base anti-codons of the appropriate [[transfer RNA|tRNA]]. Newly synthesized proteins (''black'') are often further modified, such as by binding to an effector molecule (''orange''), to become fully active.]]\u003cbr\u003e+{{Main|Cell growth|Metabolism}}\u003cbr\u003e Between successive cell divisions, cells grow through the functioning of cellular metabolism. Cell metabolism is the process by which individual cells process nutrient molecules. Metabolism has two distinct divisions: [[catabolism]], in which the cell breaks down complex molecules to produce energy and [[Reducing agent|reducing power]], and [[anabolism]], in which the cell uses energy and reducing power to construct complex molecules and perform other biological functions.\u003cbr\u003e-\u003cbr\u003e-Complex sugars can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways. In plant cells, [[chloroplast]]s create sugars by [[photosynthesis]], using the energy of light to join molecules of water and [[carbon dioxide]].\u003cbr\u003e-\u003cbr\u003e-=== Protein synthesis ===\u003cbr\u003e-\u003cbr\u003e-{{main|Protein biosynthesis}}\u003cbr\u003e-\u003cbr\u003e+Complex sugars consumed by the organism can be broken down into simpler sugar molecules called [[monosaccharides]] such as [[glucose]]. Once inside the cell, glucose is broken down to make adenosine triphosphate ([[adenosine triphosphate|ATP]]),\u003cref name=\"NCBI\"\u002f\u003e a molecule that possesses readily available energy, through two different pathways.\u003cbr\u003e+\u003cbr\u003e+===Protein synthesis===\u003cbr\u003e+{{Main|Protein biosynthesis}}\u003cbr\u003e Cells are capable of synthesizing new proteins, which are essential for the modulation and maintenance of cellular activities. This process involves the formation of new protein molecules from [[amino acid]] building blocks based on information encoded in DNA\u002fRNA. Protein synthesis generally consists of two major steps: [[transcription (genetics)|transcription]] and [[translation (genetics)|translation]].\u003cbr\u003e \u003cbr\u003e Transcription is the process where genetic information in DNA is used to produce a complementary RNA strand. This RNA strand is then processed to give [[messenger RNA]] (mRNA), which is free to migrate through the cell. mRNA molecules bind to protein-RNA complexes called [[ribosome]]s located in the [[cytosol]], where they are translated into polypeptide sequences. The ribosome mediates the formation of a polypeptide sequence based on the mRNA sequence. The mRNA sequence directly relates to the polypeptide sequence by binding to [[transfer RNA]] (tRNA) adapter molecules in binding pockets within the ribosome. The new polypeptide then folds into a functional three-dimensional protein molecule.\u003cbr\u003e \u003cbr\u003e-=== Motility ===\u003cbr\u003e-\u003cbr\u003e-{{main|Motility}}\u003cbr\u003e-\u003cbr\u003e+===Motility===\u003cbr\u003e+{{Main|Motility}}\u003cbr\u003e Unicellular organisms can move in order to find food or escape predators. Common mechanisms of motion include [[flagella]] and [[cilia]].\u003cbr\u003e \u003cbr\u003e-In multicellular organisms, cells can move during processes such as wound healing, the immune response and [[cancer metastasis]]. For example, in wound healing in animals, white blood cells move to the wound site to kill the microorganisms that cause infection. Cell motility involves many receptors, crosslinking, bundling, binding, adhesion, motor and other proteins.\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u003e{{cite journal |last1=Ananthakrishnan |first1=R. |last2=Ehrlicher |first2=A. |title=The forces behind cell movement |journal=International Journal of Biological Sciences |volume=3 |issue=5 |pages=303\u2013317 |date=June 2007 |pmid=17589565 |pmc=1893118 |doi=10.7150\u002fijbs.3.303 |publisher=Biolsci.org }}\u003c\u002fref\u003e The process is divided into three steps: protrusion of the leading edge of the cell, adhesion of the leading edge and de-adhesion at the cell body and rear, and cytoskeletal contraction to pull the cell forward. Each step is driven by physical forces generated by unique segments of the cytoskeleton.\u003cref name=\"Alberts2\"\u003e{{cite book |last1=Alberts |first1=Bruce |title=Molecular biology of the cell |date=2002 |publisher=Garland Science |isbn=0815340729 |pages=973\u2013975 |edition=4th}}\u003c\u002fref\u003e\u003cref name=\"Ananthakrishnan Ehrlicher 2007\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-==== Navigation, control and communication ====\u003cbr\u003e-\u003cbr\u003e+In multicellular organisms, cells can move during processes such as wound healing, the immune response and [[cancer metastasis]]. For example, in wound healing in animals, white blood cells move to the wound site to kill the microorganisms that cause infection. Cell motility involves many receptors, crosslinking, bundling, binding, adhesion, motor and other proteins.\u003cref\u003e{{cite journal | vauthors = Ananthakrishnan R, Ehrlicher A | title = The forces behind cell movement | journal = International Journal of Biological Sciences | volume = 3 | issue = 5 | pages = 303\u2013317 | date = June 2007 | pmid = 17589565 | pmc = 1893118 | doi = 10.7150\u002fijbs.3.303 | publisher = Biolsci.org }}\u003c\u002fref\u003e The process is divided into three steps: protrusion of the leading edge of the cell, adhes
