1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1088\u002f0004-637X\u002f808\u002f2\u002f139}}\u003c\u002fref\u003e Subsequent observations\u003cref\u003e{{Cite journal |last1=Bowler |first1=R. A. A. |last2=McLure |first2=R. J. |last3=Dunlop |first3=J. S. |last4=McLeod |first4=D. J. |last5=Stanway |first5=E. R. |last6=Eldridge |first6=J. J. |last7=Jarvis |first7=M. J. |date=2017-04-05 |title=No evidence for Population III stars or a direct collapse black hole in the z = 6.6 Lyman \u03b1 emitter 'CR7' |url=https:\u002f\u002fdoi.org\u002f10.1093\u002fmnras\u002fstx839 |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |issn=0035-8711|arxiv=1609.00727 }}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}} \u003cbr\u003e \u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e "],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"UE4iQUDKJUHZvyNBoNwkQTFgEUExmw5BXoIQQYaOB0H6cgVByOkFQfnGA0E="},"y":{"dtype":"f4","bdata":"YQNfQNytbUAvx2RAnuFpQCOTWECSLWBAExpYQCw+ZkDBOmlAhiBZQNfCcEA="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -666,10 +666,10 @@\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e }}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e+\u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal","Predicted Edit 1 (from step 90)","Predicted Edit 2 (from step 90)","Predicted Edit 3 (from step 90)","Predicted Edit 4 (from step 90)","Predicted Edit 5 (from step 90)","Predicted Edit 6 (from step 90)","Predicted Edit 7 (from step 90)","Predicted Edit 8 (from step 90)","Predicted Edit 9 (from step 90)","Predicted Edit 10 (from step 90)"],"line":{"dash":"dash","width":2.5},"marker":{"size":9,"symbol":"cross"},"mode":"lines+markers","name":"Predicted Edit Path (Tail)","x":{"dtype":"f4","bdata":"UE4iQamOJ0E+myhBeposQYneKUHE+ipBedArQU0wLUEqRyxBseQuQcSjLkE="},"y":{"dtype":"f4","bdata":"YQNfQMLZeEDVZYlA1bCOQBEHk0CZTJ1AghyfQDTWo
