        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="6eb2120d-20c3-4289-a862-d293c4d0a9dc" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("6eb2120d-20c3-4289-a862-d293c4d0a9dc")) {                    Plotly.newPlot(                        "6eb2120d-20c3-4289-a862-d293c4d0a9dc",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -14,9 +14,9 @@\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e \u003cbr\u003e == Etymology ==\u003cbr\u003e-The word ''galaxy'' was borrowed via [[French language|French]] and [[Medieval Latin]] from the [[Greek language|Greek]] term for the Milky Way, ''{{transliteration|grc|galax\u00edas (k\u00faklos)}}'' {{lang|grc|{{linktext|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}}} ({{lang|grc|{{linktext|\u03ba\u03cd\u03ba\u03bb\u03bf\u03c2}}}})\u003cref\u003e{{cite book|editor-last1=Onions|editor-first1=Charles T.|editor-link1=Charles Talbut Onions|editor-last2=Friedrichsen|editor-first2=G.W.S.|editor-last3=Burchfield|editor-first3=Robert W.|editor-link3=Robert Burchfield|url=https:\u002f\u002farchive.org\u002fdetails\u002fonions-ed.-the-oxford-dictionary-of-english-etymology-1966\u002fpage\u002f384\u002fmode\u002f2up|title=The Oxford Dictionary of English Etymology|year=1966|place=Oxford|publisher=[[Clarendon Press]]|page=385}}\u003c\u002fref\u003e\u003cref name=oed \u002f\u003e 'milky (circle)', named after its appearance as a milky band of light in the sky. In [[Greek mythology]], [[Zeus]] places his son born by a mortal woman, the infant [[Heracles]], on [[Hera]]'s breast while she is asleep so the baby will drink [[Milk of Hera|her divine milk]] and thus become immortal. Hera wakes up while breastfeeding and then realizes she is nursing an unknown baby: she pushes the baby away, some of her milk spills, and it produces the band of light known as the Milky Way.\u003cref name=waller_hodge2003 \u002f\u003e\u003cref name=konecny2006 \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-In the astronomical literature, the capitalized word \"Galaxy\" is often used to refer to the [[Milky Way]] galaxy, to distinguish it from the other galaxies in the observable [[universe]]. The English term ''Milky Way'' can be traced back to a story by [[Geoffrey Chaucer]] {{circa|1380}}:\u003cbr\u003e+The word ''galaxy'' was borrowed via [[French language|French]] and [[Medieval Latin]] from the [[Greek language|Greek]] term for the Milky Way, ''{{transliteration|grc|galax\u00edas (k\u00faklos)}}'' {{lang|grc|{{linktext|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}}} ({{lang|grc|{{linktext|\u03ba\u03cd\u03ba\u03bb\u03bf\u03c2}}}})\u003cref\u003e{{cite book|editor-last1=Onions|editor-first1=Charles T.|editor-link1=Charles Talbut Onions|editor-last2=Friedrichsen|editor-first2=G.W.S.|editor-last3=Burchfield|editor-first3=Robert W.|editor-link3=Robert Burchfield|url=https:\u002f\u002farchive.org\u002fdetails\u002fonions-ed.-the-oxford-dictionary-of-english-etymology-1966\u002fpage\u002f384\u002fmode\u002f2up|title=The Oxford Dictionary of English Etymology|year=1966|place=Oxford|publisher=[[Clarendon Press]]|page=385}}\u003c\u002fref\u003e\u003cref name=oed \u002f\u003e 'milky (circle)', named after its appearance as a milky band of light in the sky. In [[Greek mythology]], [[Zeus]] places his son, born by a mortal woman, the infant [[Heracles]], on [[Hera]]'s breast while she is asleep so the baby will drink [[Milk of Hera|her divine milk]] and thus become immortal. Hera wakes up while breastfeeding and then realises she is nursing an unknown baby: she pushes the baby away, some of her milk spills, and it produces the band of light known as the Milky Way.\u003cref name=waller_hodge2003 \u002f\u003e\u003cref name=konecny2006 \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+In the astronomical literature, the capitalised word \"Galaxy\" is often used to refer to the [[Milky Way]] galaxy, to distinguish it from the other galaxies in the observable [[universe]]. The English term ''Milky Way'' can be traced back to a story by [[Geoffrey Chaucer]] {{circa|1380}}:\u003cbr\u003e \u003cbr\u003e {{Blockquote|See yonder, lo, the Galaxy\u00eb\u003cbr \u002f\u003e&nbsp;Which men {{linktext|clepe}}th ''the Milky Wey'',\u003cbr \u002f\u003e&nbsp;For hit is whyt.|Geoffrey Chaucer|''[[The House of Fame]]''\u003cref name=oed \u002f\u003e}}\u003cbr\u003e ","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -25,7 +25,7 @@\u003cbr\u003e == Nomenclature ==\u003cbr\u003e [[File:Probing the distant past SDSS J1152+3313.tif|thumb|[[Galaxy cluster]] [[SDSS J1152+3313]]. SDSS stands for [[Sloan Digital Sky Survey]], J for [[Julian epoch]], and 1152+3313 for [[right ascension]] and [[declination]] respectively.]]\u003cbr\u003e \u003cbr\u003e-Millions of galaxies have been catalogued, but [[List of galaxies#Named galaxies|only a few]] have well-established names, such as the [[Andromeda Galaxy]], the [[Magellanic Clouds]], the [[Whirlpool Galaxy]], and the [[Sombrero Galaxy]]. Astronomers work with numbers from certain catalogues, such as the [[Messier catalogue]], the NGC ([[New General Catalogue]]), the IC ([[Index Catalogue]]), the CGCG ([[Catalogue of Galaxies and of Clusters of Galaxies]]), the MCG ([[Morphological Catalogue of Galaxies]]), the UGC ([[Uppsala General Catalogue]] of Galaxies), and the PGC ([[Catalogue of Principal Galaxies]], also known as LEDA). All the well-known galaxies appear in one or more of these catalogs but each time under a different number. For example, [[Messier 109]] (or \"M109\") is a spiral galaxy having the number 109 in the catalog of Messier.  It also has the designations NGC 3992, UGC 6937, CGCG 269\u2013023, MCG +09-20-044, and PGC 37617 (or LEDA 37617), among others.\u003cref\u003e{{cite web|url=https:\u002f\u002fned.ipac.caltech.edu\u002fbyname?objname=M109&hconst=67.8&omegam=0.308&omegav=0.692&wmap=4&corr_z=1 |title=Results for object MESSIER 109 (M109)| publisher=[[California Institute of Technology]]|website=[[NASA\u002fIPAC Extragalactic Database]] |access-date=2023-01-13}}\u003c\u002fref\u003e  Millions of fainter galaxies are known by their identifiers in [[sky surveys]] such as the [[Sloan Digital Sky Survey]].\u003cref\u003e{{Cite web |title=What is the Sloan Digital Sky Survey?|url=https:\u002f\u002fskyserver.sdss.org\u002fdr7\u002fen\u002fsdss\u002f |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240112203017\u002fhttps:\u002f\u002fskyserver.sdss.org\u002fdr7\u002fen\u002fsdss\u002f |archive-date=2024-01-12 |access-date=2024-03-03 |website=[[Sloan Digital Sky Survey]]}}\u003c\u002fref\u003e\u003cbr\u003e+Millions of galaxies have been catalogued, but [[List of galaxies#Named galaxies|only a few]] have well-established names, such as the [[Andromeda Galaxy]], the [[Magellanic Clouds]], the [[Whirlpool Galaxy]], and the [[Sombrero Galaxy]]. Astronomers work with numbers from certain catalogues, such as the [[Messier catalogue]], the NGC ([[New General Catalogue]]), the IC ([[Index Catalogue]]), the CGCG ([[Catalogue of Galaxies and of Clusters of Galaxies]]), the MCG ([[Morphological Catalogue of Galaxies]]), the UGC ([[Uppsala General Catalogue]] of Galaxies), and the PGC ([[Catalogue of Principal Galaxies]], also known as LEDA). All the well-known galaxies appear in one or more of these catalogues but each time under a different number. For example, [[Messier 109]] (or \"M109\") is a spiral galaxy having the number 109 in the catalogue of Messier.  It also has the designations NGC 3992, UGC 6937, CGCG 269\u2013023, MCG +09-20-044, and PGC 37617 (or LEDA 37617), among others.\u003cref\u003e{{cite web|url=https:\u002f\u002fned.ipac.caltech.edu\u002fbyname?objname=M109&hconst=67.8&omegam=0.308&omegav=0.692&wmap=4&corr_z=1 |title=Results for object MESSIER 109 (M109)| publisher=[[California Institute of Technology]]|website=[[NASA\u002fIPAC Extragalactic Database]] |access-date=2023-01-13}}\u003c\u002fref\u003e  Millions of fainter galaxies are known by their identifiers in [[sky surveys]] such as the [[Sloan Digital Sky Survey]].\u003cref\u003e{{Cite web |title=What is the Sloan Digital Sky Survey?|url=https:\u002f\u002fskyserver.sdss.org\u002fdr7\u002fen\u002fsdss\u002f |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240112203017\u002fhttps:\u002f\u002fskyserver.sdss.org\u002fdr7\u002fen\u002fsdss\u002f |archive-date=2024-01-12 |access-date=2024-03-03 |website=[[Sloan Digital Sky Survey]]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Observation history ==\u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -39,7 +39,7 @@\u003cbr\u003e \u003cbr\u003e Actual proof of the Milky Way consisting of many stars came in 1610 when the Italian astronomer [[Galileo Galilei]] used a [[optical telescope|telescope]] to study it and discovered it was composed of a huge number of faint stars.\u003cref name=Galilei\u002f\u003e\u003cref name=\"O'Connor_Robertson_2002\"\u002f\u003e In 1750, English astronomer [[Thomas Wright (astronomer)|Thomas Wright]], in his ''An Original Theory or New Hypothesis of the Universe'', correctly speculated that it might be a rotating body of a huge number of stars held together by [[gravitation]]al forces, akin to the [[Solar System]] but on a much larger scale, and that the resulting disk of stars could be seen as a band on the sky from a perspective inside it.{{efn|Wright called the Milky Way the ''Vortex Magnus'' (Great Whirlpool) and estimated its diameter to be 8.64\u00d710\u003csup\u003e12\u003c\u002fsup\u003e miles (13.9\u00d710\u003csup\u003e12\u003c\u002fsup\u003e km).{{sfn|Wright|1750|p=73}}}}{{sfn|Wright|1750|pp=48\u2013}}\u003cref name=\"our_galaxy\" \u002f\u003e In his 1755 treatise, [[Immanuel Kant]] elaborated on Wright's idea about the Milky Way's structure.\u003cref name=Kant_1755\u002f\u003e [[File:Herschel-Galaxy.png|thumb|The shape of the Milky Way as estimated from star counts by [[William Herschel]] in 1785; the Solar System was assumed to be near the center.]]\u003cbr\u003e \u003cbr\u003e-The first project to describe the shape of the Milky Way and the position of the Sun was undertaken by [[William Herschel]] in 1785 by counting the number of stars in different regions of the sky. He produced a diagram of the shape of the galaxy with [[Galactocentrism|the Solar System close to the center]].\u003cref name=Herschel_1785\u002f\u003e\u003cref name=paul1993 \u002f\u003e Using a refined approach, [[Jacobus Kapteyn|Kapteyn]] in 1920 arrived at the picture of a small (diameter about 15&nbsp;kiloparsecs) ellipsoid galaxy with the Sun close to the center. A different method by [[Harlow Shapley]] based on the cataloguing of [[globular cluster]]s led to a radically different picture: a flat disk with diameter approximately 70&nbsp;kiloparsecs and the Sun far from the center.\u003cref name=\"our_galaxy\" \u002f\u003e Both analyses failed to take into account the [[extinction (astronomy)|absorption of light]] by [[cosmic dust|interstellar dust]] present in the [[galactic plane]]; but after [[Robert Julius Trumpler]] quantified this effect in 1930 by studying [[open cluster]]s, the present picture of the Milky Way galaxy emerged.\u003cref name=Trimble_1999\u002f\u003e\u003cbr\u003e+The first project to describe the shape of the Milky Way and the position of the Sun was undertaken by [[William Herschel]] in 1785 by counting the number of stars in different regions of the sky. He produced a diagram of the shape of the galaxy with [[Galactocentrism|the Solar System close to the center]].\u003cref name=Herschel_1785\u002f\u003e\u003cref name=paul1993 \u002f\u003e Using a refined approach, [[Jacobus Kapteyn|Kapteyn]] in 1920 arrived at the picture of a small (diameter about 15&nbsp;kiloparsecs) ellipsoid galaxy with the Sun close to the center. A different method by [[Harlow Shapley]] based on the cataloguing of [[globular cluster]]s led to a radically different picture: a flat disk with diameter approximately 70&nbsp;kiloparsecs and the Sun far from the centre.\u003cref name=\"our_galaxy\" \u002f\u003e Both analyses failed to take into account the [[extinction (astronomy)|absorption of light]] by [[cosmic dust|interstellar dust]] present in the [[galactic plane]]; but after [[Robert Julius Trumpler]] quantified this effect in 1930 by studying [[open cluster]]s, the present picture of the Milky Way galaxy emerged.\u003cref name=Trimble_1999\u002f\u003e\u003cbr\u003e \u003cbr\u003e === Distinction from other nebulae ===\u003cbr\u003e A few galaxies outside the Milky Way are visible on a dark night to the [[naked eye|unaided eye]], including the [[Andromeda Galaxy]], [[Large Magellanic Cloud]], [[Small Magellanic Cloud]], and the [[Triangulum Galaxy]]. In the 10th century, Persian astronomer [[Abd al-Rahman al-Sufi]] made the earliest recorded identification of the Andromeda Galaxy, describing it as a \"small cloud\".\u003cref name=\"NSOG\" \u002f\u003e In 964, he probably mentioned the Large Magellanic Cloud in his ''[[Book of Fixed Stars]]'', referring to \"Al Bakr of the southern Arabs\",\u003cref name=\"obspm2\"\u002f\u003e since at a [[declination]] of about 70\u00b0 south it was not visible where he lived. It was not well known to Europeans until [[Ferdinand Magellan|Magellan]]'s voyage in the 16th century.\u003cref name=\"obspm\"\u002f\u003e\u003cref name=\"obspm2\"\u002f\u003e The Andromeda Galaxy was later independently noted by [[Simon Marius]] in 1612.\u003cref name=\"NSOG\" \u002f\u003e","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -1,9 +1,9 @@\u003cbr\u003e {{Short description|Large gravitationally bound system of stars and interstellar matter}}\u003cbr\u003e {{About|the astronomical structure|Earth's galaxy|Milky Way|other uses}}\u003cbr\u003e {{pp|small=yes}}\u003cbr\u003e-\u003cbr\u003e {{Featured article}}\u003cbr\u003e {{Use mdy dates|date=February 2015}}\u003cbr\u003e+{{Use British English|date=June 2024}}\u003cbr\u003e {{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about 55,000&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e \u003cbr\u003e A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -1259,22 +1259,22 @@\u003cbr\u003e  | url-status=live\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003cref name=Bouali_et_al_2008\u003e{{cite journal\u003cbr\u003e+\u003cref name=Bouali_et_al_2008\u003e{{cite book\u003cbr\u003e  | last1=Bouali\u003cbr\u003e  | first1=Hamid-Eddine\u003cbr\u003e  | last2=Zghal\u003cbr\u003e  | first2=Mourad\u003cbr\u003e  | last3=Lakhdar\u003cbr\u003e  | first3=Zohra B.\u003cbr\u003e+ | chapter=Popularisation of optical phenomena: Establishing the first Ibn Al-Haytham workshop on photography\u003cbr\u003e  | editor-first1=Fran\u00e7ois\u003cbr\u003e  | editor-last1=Flory\u003cbr\u003e  | date=2005\u003cbr\u003e- | title=Popularisation of Optical Phenomena: Establishing the First Ibn Al-Haytham Workshop on Photography\u003cbr\u003e+ | title=Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e  | journal=[[Proceedings of SPIE]]\u003cbr\u003e- | series=Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e  | volume=9664\u003cbr\u003e  | issue=Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e- | url=http:\u002f\u002fspie.org\u002fetop\u002fETOP2005_080.pdf\u003cbr\u003e+ | chapter-url=http:\u002f\u002fspie.org\u002fetop\u002fETOP2005_080.pdf\u003cbr\u003e  | doi=10.1117\u002f12.2207764\u003cbr\u003e  | bibcode=2005SPIE.9664E..22B\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e@@ -1563,7 +1563,7 @@\u003cbr\u003e  |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324072055\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=aCocRAAACAAJ\u003cbr\u003e  |url-status=live\u003cbr\u003e  }}\u003cbr\u003e-*{{Cite book |last=Longair |first=Malcolm S. |author-link=Malcolm Longair |title=Galaxy Formation |date=2008 |publisher=[[Springer Science+Business Media|Springer]] |isbn=978-3-540-73477-2 |edition=2nd |series=Astronomy and Astrophysics Library |location=Berlin |url=https:\u002f\u002flink.springer.com\u002fbook\u002f10.1007\u002f978-3-540-73478-9}}\u003cbr\u003e+*{{Cite book |last=Longair |first=Malcolm S. |author-link=Malcolm Longair |title=Galaxy Formation |date=2008 |publisher=[[Springer Science+Business Media|Springer]] |isbn=978-3-540-73477-2 |edition=2nd |series=Astronomy and Astrophysics Library |location=Berlin |doi=10.1007\u002f978-3-540-73478-9 |url=https:\u002f\u002flink.springer.com\u002fbook\u002f10.1007\u002f978-3-540-73478-9}}\u003cbr\u003e * {{Cite book\u003cbr\u003e  |last=Merritt\u003cbr\u003e  |first=David R.","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -149,17 +149,7 @@\u003cbr\u003e  |archive-date=May 7, 2012\u003cbr\u003e  |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120507101534\u002fhttp:\u002f\u002fradiojove.gsfc.nasa.gov\u002feducation\u002feduc\u002fradio\u002ftran-rec\u002fexerc\u002fiono.htm\u003cbr\u003e  |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e Large radio [[interferometry|interferometers]] have been used to map the active jets emitted from active nuclei. [[Radio telescope]]s can also be used to observe neutral hydrogen (via [[hydrogen line|21&nbsp;cm radiation]]), including, potentially, the non-ionized matter in the early universe that later collapsed to form galaxies.\u003cref\u003e{{cite web\u003cbr\u003e- |title=Giant Radio Telescope Imaging Could Make Dark Matter Visible\u003cbr\u003e- |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e- |website=[[ScienceDaily]]\u003cbr\u003e- |author=Max Planck Society\u003cbr\u003e- |date=December 14, 2006\u003cbr\u003e- |access-date=January 2, 2007\u003cbr\u003e- |archive-date=July 3, 2017\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170703211527\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e- |url-status=live\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e+ }}\u003c\u002fref\u003e Large radio [[interferometry|interferometers]] have been used to map the active jets emitted from active nuclei.\u003cbr\u003e \u003cbr\u003e [[UV astronomy|Ultraviolet]] and [[X-ray astronomy|X-ray telescopes]] can observe highly energetic galactic phenomena. Ultraviolet flares are sometimes observed when a star in a distant galaxy is torn apart from the tidal forces of a nearby black hole.\u003cref\u003e{{cite news\u003cbr\u003e  |title=NASA Telescope Sees Black Hole Munch on a Star","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -1249,7 +1249,7 @@\u003cbr\u003e  | url-status=live\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003cref name=Bouali_et_al_2008\u003e{{cite book\u003cbr\u003e+\u003cref name=Bouali_et_al_2008\u003e{{cite conference\u003cbr\u003e  | last1=Bouali\u003cbr\u003e  | first1=Hamid-Eddine\u003cbr\u003e  | last2=Zghal\u003cbr\u003e@@ -1262,8 +1262,7 @@\u003cbr\u003e  | date=2005\u003cbr\u003e  | title=Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e  | journal=[[Proceedings of SPIE]]\u003cbr\u003e- | volume=9664\u003cbr\u003e- | issue=Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e+ | volume=9664, Ninth International Topical Meeting on Education and Training in Optics and Photonics\u003cbr\u003e  | chapter-url=http:\u002f\u002fspie.org\u002fetop\u002fETOP2005_080.pdf\u003cbr\u003e  | doi=10.1117\u002f12.2207764\u003cbr\u003e  | bibcode=2005SPIE.9664E..22B","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -1266,6 +1266,7 @@\u003cbr\u003e  | chapter-url=http:\u002f\u002fspie.org\u002fetop\u002fETOP2005_080.pdf\u003cbr\u003e  | doi=10.1117\u002f12.2207764\u003cbr\u003e  | bibcode=2005SPIE.9664E..22B\u003cbr\u003e+ | doi-access=free\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Livingston\u003e{{cite journal","--- Revision 8\u003cbr\u003e+++ Revision 9\u003cbr\u003e@@ -289,7 +289,7 @@\u003cbr\u003e The [[List of largest galaxies|largest galaxies]] are the [[Type-cD galaxy|type-cD galaxies]].\u003cbr\u003e First described in 1964 by a paper by Thomas A. Matthews and others,\u003cref name=Matthews\u003e{{cite journal | url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1964ApJ...140...35M\u002fabstract | bibcode=1964ApJ...140...35M | title=A Discussion of Galaxies Indentified &#91;sic&#93; with Radio Sources | last1=Matthews | first1=Thomas A. | last2=Morgan | first2=William W. | last3=Schmidt | first3=Maarten | journal=[[The Astrophysical Journal]] | year=1964 | volume=140 | page=35 | doi=10.1086\u002f147890 }}\u003c\u002fref\u003e they are a subtype of the more general class of D galaxies, which are giant elliptical galaxies, except that they are much larger. They are popularly known as the '''supergiant elliptical galaxies''' and constitute the largest and most luminous galaxies known. These galaxies feature a central elliptical nucleus with an extensive, faint halo of stars extending to megaparsec scales.\u003cref name=\"NASAVlog\"\u003e{{cite web | url=https:\u002f\u002fwww.nasa.gov\u002fcontent\u002fdiscoveries-highlights-tracing-the-growth-of-galaxies |publisher=[[NASA]]|title=Tracing the Growth of Galaxies |access-date=April 20, 2024| date=6 February 2017 }}\u003c\u002fref\u003e The profile of their surface brightnesses as a function of their radius (or distance from their cores) falls off more slowly than their smaller counterparts.\u003cref name=Tonry\u003e{{cite book | chapter-url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1987IAUS..127...89T\u002fabstract | bibcode=1987IAUS..127...89T | last1=Tonry | first1=John L. | title=Structure and Dynamics of Elliptical Galaxies | chapter=Properties of cD Galaxies | year=1987 | volume=127 | page=89 | doi=10.1007\u002f978-94-009-3971-4_7 | isbn=978-90-277-2586-8 | s2cid=117980521 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The formation of these cD galaxies remains an active area of research, but the leading model is that they are the result of the mergers of smaller galaxies in the environments of dense clusters, or even those outside of clusters with random overdensities.\u003cref\u003e{{Cite journal |last1=Tovmassian |first1=Hrant M. |last2=Andernach |first2=Heinz |date=2012-12-11 |title=On the formation of cD galaxies and their parent clusters: Formation of cD galaxies and parent clusters |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle-lookup\u002fdoi\u002f10.1111\u002fj.1365-2966.2012.22044.x |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=427 |issue=3 |pages=2047\u20132056 |doi=10.1111\u002fj.1365-2966.2012.22044.x|arxiv=1212.0238 }}\u003c\u002fref\u003e These processes are the mechanisms that drive the formation of fossil groups or fossil clusters, where a large, relatively isolated, supergiant elliptical resides in the middle of the cluster and are surrounded by an extensive cloud of X-rays as the residue of these galactic collisions. Another older model posits the phenomenon of [[cooling flow]], where the heated gases in clusters collapses towards their centers as they cool, forming stars in the process,\u003cref\u003e{{Cite journal |last1=Bender |first1=Ralf |last2=Kormendy |first2=John |last3=Cornell |first3=Mark E. |last4=Fisher |first4=David B. |date=2015-06-30 |title=Structure and Formation of cD Galaxies: NGC 6166 in Abell 2199 |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1088\u002f0004-637X\u002f807\u002f1\u002f56 |journal=[[The Astrophysical Journal]] |volume=807 |issue=1 |pages=56 |doi=10.1088\u002f0004-637X\u002f807\u002f1\u002f56 |arxiv=1411.2598 |bibcode=2015ApJ...807...56B |issn=1538-4357 |quote=This idea was entertained in the heyday of the cooling-flow problem, when we observed large amounts of X-ray-emitting, hot gas in clusters but could not measure temperature profiles. [...] This possibility is now regarded as a non-starter.}}\u003c\u002fref\u003e a phenomenon observed in clusters such as [[Perseus Cluster|Perseus]],\u003cref name=Fabian\u003e{{cite journal | bibcode=1977MNRAS.180..479F | title=Subsonic accretion of cooling gas in clusters of galaxies | last1=Fabian | first1=A. C. | last2=Nulsen | first2=P. E. J. | journal=[[Monthly Notices of the Royal Astronomical Society]] | year=1977 | volume=180 | issue=3 | page=479 | doi=10.1093\u002fmnras\u002f180.3.479 | doi-access=free }}\u003c\u002fref\u003e and more recently in the [[Phoenix Cluster]].\u003cref\u003e{{Cite journal |last1=McDonald |first1=M. |last2=McNamara |first2=B. R. |last3=Voit |first3=G. M. |last4=Bayliss |first4=M. |last5=Benson |first5=B. A. |last6=Brodwin |first6=M. |last7=Canning |first7=R. E. A. |last8=Florian |first8=M. K. |last9=Garmire |first9=G. P. |last10=Gaspari |first10=M. |last11=Gladders |first11=M. D. |last12=Hlavacek-Larrondo |first12=J. |last13=Kara |first13=E. |last14=Reichardt |first14=C. L. |last15=Russell |first15=H. R. |date=2019-11-01 |title=Anatomy of a Cooling Flow: The Feedback Response to Pure Cooling in the Core of the Phoenix Cluster |journal=[[The Astrophysical Journal]] |volume=885 |issue=1 |pages=63 |doi=10.3847\u002f1538-4357\u002fab464c |doi-access=free |arxiv=1904.08942 |bibcode=2019ApJ...885...63M |issn=0004-637X}}\u003c\u002fref\u003e\u003cbr\u003e+The formation of these cD galaxies remains an active area of research, but the leading model is that they are the result of the mergers of smaller galaxies in the environments of dense clusters, or even those outside of clusters with random overdensities.\u003cref\u003e{{Cite journal |last1=Tovmassian |first1=Hrant M. |last2=Andernach |first2=Heinz |date=2012-12-11 |title=On the formation of cD galaxies and their parent clusters: Formation of cD galaxies and parent clusters |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=427 |issue=3 |pages=2047\u20132056 |doi=10.1111\u002fj.1365-2966.2012.22044.x|doi-access=free |arxiv=1212.0238 }}\u003c\u002fref\u003e These processes are the mechanisms that drive the formation of fossil groups or fossil clusters, where a large, relatively isolated, supergiant elliptical resides in the middle of the cluster and are surrounded by an extensive cloud of X-rays as the residue of these galactic collisions. Another older model posits the phenomenon of [[cooling flow]], where the heated gases in clusters collapses towards their centers as they cool, forming stars in the process,\u003cref\u003e{{Cite journal |last1=Bender |first1=Ralf |last2=Kormendy |first2=John |last3=Cornell |first3=Mark E. |last4=Fisher |first4=David B. |date=2015-06-30 |title=Structure and Formation of cD Galaxies: NGC 6166 in Abell 2199 |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1088\u002f0004-637X\u002f807\u002f1\u002f56 |journal=[[The Astrophysical Journal]] |volume=807 |issue=1 |pages=56 |doi=10.1088\u002f0004-637X\u002f807\u002f1\u002f56 |arxiv=1411.2598 |bibcode=2015ApJ...807...56B |issn=1538-4357 |quote=This idea was entertained in the heyday of the cooling-flow problem, when we observed large amounts of X-ray-emitting, hot gas in clusters but could not measure temperature profiles. [...] This possibility is now regarded as a non-starter.}}\u003c\u002fref\u003e a phenomenon observed in clusters such as [[Perseus Cluster|Perseus]],\u003cref name=Fabian\u003e{{cite journal | bibcode=1977MNRAS.180..479F | title=Subsonic accretion of cooling gas in clusters of galaxies | last1=Fabian | first1=A. C. | last2=Nulsen | first2=P. E. J. | journal=[[Monthly Notices of the Royal Astronomical Society]] | year=1977 | volume=180 | issue=3 | page=479 | doi=10.1093\u002fmnras\u002f180.3.479 | doi-access=free }}\u003c\u002fref\u003e and more recently in the [[Phoenix Cluster]].\u003cref\u003e{{Cite journal |last1=McDonald |first1=M. |last2=McNamara |first2=B. R. |last3=Voit |first3=G. M. |last4=Bayliss |first4=M. |last5=Benson |first5=B. A. |last6=Brodwin |first6=M. |last7=Canning |first7=R. E. A. |last8=Florian |first8=M. K. |last9=Garmire |first9=G. P. |last10=Gaspari |first10=M. |last11=Gladders |first11=M. D. |last12=Hlavacek-Larrondo |first12=J. |last13=Kara |first13=E. |last14=Reichardt |first14=C. L. |last15=Russell |first15=H. R. |date=2019-11-01 |title=Anatomy of a Cooling Flow: The Feedback Response to Pure Cooling in the Core of the Phoenix Cluster |journal=[[The Astrophysical Journal]] |volume=885 |issue=1 |pages=63 |doi=10.3847\u002f1538-4357\u002fab464c |doi-access=free |arxiv=1904.08942 |bibcode=2019ApJ...885...63M |issn=0004-637X}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Shell galaxy ====\u003cbr\u003e [[File:NGC 3923 Elliptical Shell Galaxy.jpg|thumb|[[NGC 3923]] Elliptical Shell Galaxy (Hubble photograph)]]\u003cbr\u003e@@ -300,7 +300,7 @@\u003cbr\u003e {{Main|Spiral galaxy|Barred spiral galaxy}}\u003cbr\u003e [[File:M101 hires STScI-PRC2006-10a.jpg|thumb|right|The [[Pinwheel Galaxy]], NGC 5457]]\u003cbr\u003e \u003cbr\u003e-Spiral galaxies resemble spiraling [[pinwheel (toy)|pinwheels]]. Though the stars and other visible material contained in such a galaxy lie mostly on a plane, the majority of mass in spiral galaxies exists in a roughly spherical halo of [[dark matter]] which extends beyond the visible component, as demonstrated by the universal rotation curve concept.\u003cref name=\"Williams2009\"\u003e{{Cite journal | last1 = Williams | first1 = M. J. | last2 = Bureau | first2 = M. | last3 = Cappellari | first3 = M. | s2cid = 17940107 | doi = 10.1111\u002fj.1365-2966.2009.15582.x | title = Kinematic constraints on the stellar and dark matter content of spiral and S0 galaxies | journal = [[Monthly Notices of the Royal Astronomical Society]] | volume = 400 | issue = 4 | pages = 1665\u20131689 | year = 2010 |arxiv = 0909.0680 |bibcode = 2009MNRAS.400.1665W }}\u003c\u002fref\u003e\u003cbr\u003e+Spiral galaxies resemble spiraling [[pinwheel (toy)|pinwheels]]. Though the stars and other visible material contained in such a galaxy lie mostly on a plane, the majority of mass in spiral galaxies exists in a roughly spherical halo of [[dark matter]] which extends beyond the visible component, as demonstrated by the universal rotation curve concept.\u003cref name=\"Williams2009\"\u003e{{Cite journal | last1 = Williams | first1 = M. J. | last2 = Bureau | first2 = M. | last3 = Cappellari | first3 = M. | s2cid = 17940107 | doi = 10.1111\u002fj.1365-2966.2009.15582.x | title = Kinematic constraints on the stellar and dark matter content of spiral and S0 galaxies | journal = [[Monthly Notices of the Royal Astronomical Society]] | volume = 400 | issue = 4 | pages = 1665\u20131689 | year = 2010 | doi-access = free |arxiv = 0909.0680 |bibcode = 2009MNRAS.400.1665W }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Spiral galaxies consist of a rotating disk of stars and interstellar medium, along with a central bulge of generally older stars. Extending outward from the [[bulge (astronomy)|bulge]] are relatively bright arms. In the Hubble classification scheme, spiral galaxies are listed as type ''S'', followed by a letter (''a'', ''b'', or ''c'') which indicates the degree of tightness of the spiral arms and the size of the central bulge. An ''Sa'' galaxy has tightly wound, poorly defined arms and possesses a relatively large core region. At the other extreme, an ''Sc'' galaxy has open, well-defined arms and a small core region.\u003cref\u003e{{cite web\u003cbr\u003e  |last1       = Smith\u003cbr\u003e@@ -353,7 +353,8 @@\u003cbr\u003e  |volume=337 |issue=3 |pages=808\u2013828\u003cbr\u003e  |bibcode=2002MNRAS.337..808K\u003cbr\u003e  |doi=10.1046\u002fj.1365-8711.2002.05840.x\u003cbr\u003e-|arxiv = astro-ph\u002f0207258 }}\u003c\u002fref\u003e\u003cbr\u003e+|doi-access=free\u003cbr\u003e+ |arxiv = astro-ph\u002f0207258 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Our own galaxy, the [[Milky Way]], is a large disk-shaped barred-spiral galaxy\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Alard |first1=Christophe\u003cbr\u003e@@ -622,7 +623,7 @@\u003cbr\u003e ==== Quasar ====\u003cbr\u003e {{Main|Quasar}}\u003cbr\u003e \u003cbr\u003e-Quasars are the most energetic and distant members of active galactic nuclei. Extremely luminous, they were first identified as high redshift sources of electromagnetic energy, including radio waves and visible light, that appeared more similar to stars than to extended sources similar to galaxies. Their luminosity can be 100 times that of the Milky Way.{{sfn|Fraknoi et al.|2023|pp=[https:\u002f\u002fopenstax.org\u002fbooks\u002fastronomy-2e\u002fpages\u002f27-1-quasars 899\u2013906]}} The nearest known quasar, [[Markarian 231]], is about 581 million light-years from Earth,\u003cref\u003e{{Cite journal |last1=Kova\u010devi\u0107 |first1=Andjelka B |last2=Yi |first2=Tignfeng |last3=Dai |first3=Xinyu |last4=Yang |first4=Xing |last5=\u010cvorovi\u0107-Hajdinjak |first5=Iva |last6=Popovi\u0107 |first6=Luka \u010c |date=2020-05-21 |title=Confirmed short periodic variability of subparsec supermassive binary black hole candidate Mrk 231 |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle\u002f494\u002f3\u002f4069\u002f5809369 |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=494 |issue=3 |pages=4069\u20134076 |doi=10.1093\u002fmnras\u002fstaa737 |issn=0035-8711|arxiv=2003.06359 }}\u003c\u002fref\u003e while others h u003e-=== ''Banana'' shape ===\u003cbr\u003e-Researcher Viraj Pandya, of [[Columbia University]], and colleagues found evidence of '''Banana''' shaped galaxies using the [[James Webb Space Telescope]]. These galaxies are 8-13 billion years old and Pandya believes that an unknown dark energy is responsible for the existence of these galaxies.\u003cref\u003ehttps:\u002f\u002fwww.newscientist.com\u002farticle\u002f2442369-banana-shaped-galaxies-are-helping-unpeel-the-mysteries-of-dark-matter\u002f\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e == Variants ==\u003cbr\u003e === Interacting ===\u003cbr\u003e {{Main|Interacting galaxy}}","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -300,7 +300,7 @@\u003cbr\u003e {{Main|Spiral galaxy|Barred spiral galaxy}}\u003cbr\u003e [[File:M101 hires STScI-PRC2006-10a.jpg|thumb|right|The [[Pinwheel Galaxy]], NGC 5457]]\u003cbr\u003e \u003cbr\u003e-Spiral galaxies resemble spiraling [[pinwheel (toy)|pinwheels]]. Though the stars and other visible material contained in such a galaxy lie mostly on a plane, the majority of mass in spiral galaxies exists in a roughly spherical halo of [[dark matter]] which extends beyond the visible component, as demonstrated by the universal rotation curve concept.\u003cref name=\"Williams2009\"\u003e{{Cite journal | last1 = Williams | first1 = M. J. | last2 = Bureau | first2 = M. | last3 = Cappellari | first3 = M. | s2cid = 17940107 | doi = 10.1111\u002fj.1365-2966.2009.15582.x | title = Kinematic constraints on the stellar and dark matter content of spiral and S0 galaxies | journal = [[Monthly Notices of the Royal Astronomical Society]] | volume = 400 | issue = 4 | pages = 1665\u20131689 | year = 2010 | doi-access = free |arxiv = 0909.0680 |bibcode = 2009MNRAS.400.1665W }}\u003c\u002fref\u003e\u003cbr\u003e+Spiral galaxies resemble spiraling [[pinwheel (toy)|pinwheels]]. Though the stars and other visible material contained in such a galaxy lie mostly on a plane, the majority of mass in spiral galaxies exists in a roughly spherical halo of [[dark matter]] which extends beyond the visible component, as demonstrated by the universal rotation curve concept.\u003cref name=\"Williams2009\"\u003e{{Cite journal | last1 = Williams | first1 = M. J. | last2 = ((Bureau)) | first2 = M. | last3 = Cappellari | first3 = M. | s2cid = 17940107 | doi = 10.1111\u002fj.1365-2966.2009.15582.x | title = Kinematic constraints on the stellar and dark matter content of spiral and S0 galaxies | journal = [[Monthly Notices of the Royal Astronomical Society]] | volume = 400 | issue = 4 | pages = 1665\u20131689 | year = 2010 | doi-access = free |arxiv = 0909.0680 |bibcode = 2009MNRAS.400.1665W }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Spiral galaxies consist of a rotating disk of stars and interstellar medium, along with a central bulge of generally older stars. Extending outward from the [[bulge (astronomy)|bulge]] are relatively bright arms. In the Hubble classification scheme, spiral galaxies are listed as type ''S'', followed by a letter (''a'', ''b'', or ''c'') which indicates the degree of tightness of the spiral arms and the size of the central bulge. An ''Sa'' galaxy has tightly wound, poorly defined arms and possesses a relatively large core region. At the other extreme, an ''Sc'' galaxy has open, well-defined arms and a small core region.\u003cref\u003e{{cite web\u003cbr\u003e  |last1       = Smith","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -8,7 +8,7 @@\u003cbr\u003e \u003cbr\u003e A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e-Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly.)\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e+Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The space between galaxies is filled with a tenuous gas (the [[Intergalactic space|intergalactic medium]]) with an average density of less than one [[atom]] per cubic metre. Most galaxies are gravitationally organised into [[galaxy group|groups]], [[galaxy cluster|clusters]] and [[supercluster]]s. The [[Milky Way]] is part of the [[Local Group]], which it dominates along with the [[Andromeda Galaxy]]. The group is part of the [[Virgo Supercluster]]. At the [[Large-scale structure of the Cosmos|largest scale]], these associations are generally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -127,7 +127,7 @@\u003cbr\u003e | image2 = Andromeda galaxy.jpg\u003cbr\u003e | caption2 = This ultraviolet image of [[Andromeda Galaxy|Andromeda]] shows blue regions containing young, massive stars.\u003cbr\u003e }}\u003cbr\u003e-Advances in astronomy have always been driven by technology. After centuries of success in [[optical astronomy]], recent decades have seen major progress in other regions of the [[electromagnetic spectrum]].\u003cref\u003e{{Cite book |last=Rieke |first=George Henry |author-link=George H. Rieke\u003cbr\u003e+Advances in astronomy have always been driven by technology. After centuries of success in [[optical astronomy]], [[infrared astronomy]] was attempted in the 1830s, but only blossomed in the early 1900s.  [[Radio astronomy]] was born in the 1930s, and matured by the 1950s and 1960s.  The problem was that air only allows visible light and radio waves to pass, with a little bit of near infrared.  The first [[Ultraviolet astronomy|ultraviolet]] [[Orbiting Astronomical Observatory 2|telescope]] was launched in 1968, and since then there's been major progress in all regions of the [[electromagnetic spectrum]].\u003cref\u003e{{Cite book |last=Rieke |first=George Henry |author-link=George H. Rieke\u003cbr\u003e |title=Measuring the Universe: A Multiwavelength Perspective |date=2012 |publisher=[[Cambridge University Press]] |isbn=978-0-521-76229-8 |page=xi}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[cosmic dust|dust]] present in the interstellar medium is opaque to visual light. It is more transparent to [[far infrared astronomy|far-infrared]], which can be used to observe the interior regions of giant molecular clouds and [[Bulge (astronomy)|galactic cores]] in great detail.\u003cref\u003e{{cite web","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -260,6 +260,8 @@\u003cbr\u003e \u003cbr\u003e A 2016 study published in ''[[The Astrophysical Journal]],'' led by [[Christopher Conselice]] of the [[University of Nottingham]], used 20 years of [[Hubble Space Telescope|Hubble]] images to estimate that the observable universe contained at least two trillion ({{val|2|e=12}}) galaxies.\u003cref name=\"Conselice\"\u003e{{cite journal|title=The Evolution of Galaxy Number Density at z \u003c{{nbsp}}8 and its Implications|first=Christopher J.|last=Conselice|s2cid=17424588|display-authors=etal|journal=[[The Astrophysical Journal]]|volume=830|issue=2|year=2016|arxiv=1607.03909|bibcode= 2016ApJ...830...83C|doi=10.3847\u002f0004-637X\u002f830\u002f2\u002f83|page=83 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=\"NYT-20161017\"\u003e{{cite news |last=Fountain |first=Henry |date=17 October 2016 |title=Two Trillion Galaxies, at the Very Least |work=[[The New York Times]] |url-access=registration |url=https:\u002f\u002fwww.nytimes.com\u002f2016\u002f10\u002f18\u002fscience\u002ftwo-trillion-galaxies-at-the-very-least.html |url-status=live |access-date=17 October 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191231233343\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2016\u002f10\u002f18\u002fscience\u002ftwo-trillion-galaxies-at-the-very-least.html |archive-date=December 31, 2019}}\u003c\u002fref\u003e However, later observations with the [[New Horizons]] space probe from outside the [[zodiacal light]] reduced this to roughly 200 billion ({{val|2|e=11}}).\u003cref name=\"Lauer\"\u002f\u003e\u003cref\u003e{{cite news |title=New Horizons spacecraft answers the question: How dark is space? |work=[[Phys.org]] |url=https:\u002f\u002fphys.org\u002fnews\u002f2021-01-horizons-spacecraft-dark-space.html |access-date=15 January 2021 |language=en |archive-date=January 15, 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210115110710\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2021-01-horizons-spacecraft-dark-space.html |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+In February 2024, a study explained the anomalies in the rotation curves of more than hundred spiral galaxies of different types from the SPARC (Spitzer Photometry and Accurate Rotation Curves) Galaxy collection taken with the [[Spitzer Space Telescope]], by accounting for [[Retarded potential|retarded gravitational potentials]] and without taking into account dark matter or modifying general relativity.\u003cref\u003e{{Cite journal |last=Glass |first=Yuval |last2=Zimmerman |first2=Tomer |last3=Yahalom |first3=Asher |date=2024-02-20 |title=Retarded Gravity in Disk Galaxies |url=https:\u002f\u002fwww.preprints.org\u002fmanuscript\u002f202402.1088\u002fv1 |journal=Symmetry |language=en |volume=16 |issue=4 |pages=387 |doi=10.3390\u002fsym16040387 |issn=2073-8994}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e == Types and morphology ==\u003cbr\u003e {{see also|Galactic bulge|Central massive object|Active galactic nucleus|Galaxy morphological classification}}\u003cbr\u003e [[File:Hubble sequence ph
