ices of the Royal Astronomical Society |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |issn=0035-8711}}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}} \u003cbr\u003e \u003cbr\u003e-The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e === Evolution ===","--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -666,10 +666,10 @@\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e }}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e+\u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal"],"line":{"width":1.5},"marker":{"size":6,"symbol":"circle"},"mode":"lines+markers","name":"Historical Path (Base)","x":{"dtype":"f4","bdata":"3iQCQQPLAUG02\u002fxAQyH9QJoq\u002fUBuLvhAGRACQcsVAUGUlAJBE5tcQQcgW0GaGF5BI1hWQQ1QV0Hj3FlBvNFeQVAGYkGe\u002fGBB20lkQZN5X0F8J2NBNM9fQeuzYUEKc1tBRQJbQTACW0E2h0K\u002frSr9vpIBFr9FJy+\u002fsWpMv88NO7\u002f3Xxm\u002f7LcMv0V1jr\u002fYRY6\u002fvA2Zv5aR4r6\u002fqZ6+3SWtvg3ZL75Mmws9o3FpPnHXXz452VU+ypBmPoHVSD28mNA96UExPqitWj65yoLBeROEweIQg8ETdYPBp5uEwZVYhsEx2oXBRT6FwXfjisHpy4vBfUeKwTH2hsGOMYfBfPuHwcXkiMF8uofBPkKJwXxgiMHeeInBU9eTQGmwmEBlQZpAXLqRQNyxjkAMIZlARk+XQH6elkBjS5FAAMSUQBeYekCjZIZA5GSBQB6ygkAtCHdAGwV6QLkTeEAZCnFAcjcjQQxdJUFQTiJB"},"y":{"dtype":"f4","bdata":"ZtBjQAHvZ0Cth2RAQzRZQMN\u002fYkDWX1xA8T89QNBsN0DhFzhAaWvSQTT60kEqJ9FBVaHQQcWq0UGQvM5B\u002fkTUQVF00EE9a89B3b\u002fRQbCWzkGywNJBBpTSQZBD0EED19FB6HHOQQUx1EE8kw9BJ4UNQSH9DUGEbxRBbQEWQaXdE0G40hFBCkcUQea\u002fEkFSuhBBP0oSQdDZOEG2IDZBmlU0QQJ8MkFnwDJBCs81QcPNMkFmqjVBjtM4QcQ8OUFwVjxB4kE8QV5uPEEVtcBAeYbGQGjlwECaAMNAQVTMQHfE00CcpNFAAl\u002fPQEMd7UBEiu9A\u002fRvrQEIf7EBC4vFAzsvsQNwY60BY4vRA9Kv5QLVb+kAx6\u002fVAM3fIvuxHn77CAca+4kfpvirN6L6sezq\u002f7NAivxj5ab8UUmW\u002fQ6iDv2ibpb+vD5O\u002fQvyfv3+Zhr9\u002fjYC\u002f2s+Ov7fnqr\u002fEs3e\u002fgQ9hQPwFbEBhA19A"},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -666,10 +666,10 @@\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e }}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e+\u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal","--- Revision 89\u003cbr\u003e+++ Revision 90\u003cbr\u003e@@ -115,6 +115,74 @@\u003cbr\u003e  | access-date=April 21, 2024 | archive-date=February 5, 2024\u003cbr\u003e  | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240205104433\u002fhttps:\u002f\u002fapod.nasa.gov\u002fdiamond_jubilee\u002f1996\u002fsandage_hubble.html\u003cbr\u003e  | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Multi-wavelength observation ===\u003cbr\u003e+{{See also|Observational astronomy}}\u003cbr\u003e+{{multiple image\u003cbr\u003e+| align = right\u003cbr\u003e+| direction = vertical\u003cbr\u003e+| width = 220\u003cbr\u003e+| image1 =\u003cbr\u003e+| caption1 = A visual light image of [[Andromeda Galaxy]] shows the emission of ordinary stars and the light reflected by dust.\u003cbr\u003e+| image2 = Andromeda galaxy.jpg\u003cbr\u003e+| caption2 = This ultraviolet image of [[Andromeda Galaxy|Andromeda]] shows blue regions containing young, massive stars.\u003cbr\u003e+}}\u003cbr\u003e+Advances in astronomy have always been driven by technology. After centuries of success in [[optical astronomy]], recent decades have seen major progress in other regions of the [[electromagnetic spectrum]].\u003cref\u003e{{Cite book |last=Rieke |first=George Henry |author-link=George H. Rieke\u003cbr\u003e+|title=Measuring the Universe: A Multiwavelength Perspective |date=2012 |publisher=[[Cambridge University Press]] |isbn=978-0-521-76229-8 |page=xi}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The [[cosmic dust|dust]] present in the interstellar medium is opaque to visual light. It is more transparent to [[far infrared astronomy|far-infrared]], which can be used to observe the interior regions of giant molecular clouds and [[Bulge (astronomy)|galactic cores]] in great detail.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=Near, Mid & Far Infrared\u003cbr\u003e+ |url=http:\u002f\u002fwww.ipac.caltech.edu\u002fOutreach\u002fEdu\u002fRegions\u002firregions.html\u003cbr\u003e+ |website=[[Infrared Processing and Analysis Center]]\u003cbr\u003e+ |publisher=[[California Institute of Technology]]\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20061230203454\u002fhttp:\u002f\u002fwww.ipac.caltech.edu\u002fOutreach\u002fEdu\u002fRegions\u002firregions.html\u003cbr\u003e+ |archive-date=December 30, 2006\u003cbr\u003e+}}\u003c\u002fref\u003e Infrared is also used to observe distant, [[redshift|red-shifted]] galaxies that were formed much earlier. Water vapor and [[carbon dioxide]] absorb a number of useful portions of the infrared spectrum, so high-altitude or space-based telescopes are used for [[infrared astronomy]].{{sfn|Fraknoi et al.|2023|pp=[https:\u002f\u002fopenstax.org\u002fbooks\u002fastronomy-2e\u002fpages\u002f5-2-the-electromagnetic-spectrum 144], [https:\u002f\u002fopenstax.org\u002fbooks\u002fastronomy-2e\u002fpages\u002f6-5-observations-outside-earths-atmosphere 202]}}\u003cbr\u003e+\u003cbr\u003e+The first non-visual study of galaxies, particularly active galaxies, was made using [[radio astronomy|radio frequencies]]. The Earth's atmosphere is nearly transparent to radio between 5&nbsp;[[Hertz|MHz]] and 30&nbsp;GHz. The [[ionosphere]] blocks signals below this range.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=The Effects of Earth's Upper Atmosphere on Radio Signals\u003cbr\u003e+ |url=http:\u002f\u002fradiojove.gsfc.nasa.gov\u002feducation\u002feduc\u002fradio\u002ftran-rec\u002fexerc\u002fiono.htm\u003cbr\u003e+ |publisher=[[NASA]]\u003cbr\u003e+ |access-date=August 10, 2006\u003cbr\u003e+ |archive-date=May 7, 2012\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120507101534\u002fhttp:\u002f\u002fradiojove.gsfc.nasa.gov\u002feducation\u002feduc\u002fradio\u002ftran-rec\u002fexerc\u002fiono.htm\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e Large radio [[interferometry|interferometers]] have been used to map the active jets emitted from active nuclei. [[Radio telescope]]s can also be used to observe neutral hydrogen (via [[hydrogen line|21&nbsp;cm radiation]]), including, potentially, the non-ionized matter in the early universe that later collapsed to form galaxies.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=Giant Radio Telescope Imaging Could Make Dark Matter Visible\u003cbr\u003e+ |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e+ |website=[[ScienceDaily]]\u003cbr\u003e+ |author=Max Planck Society\u003cbr\u003e+ |date=December 14, 2006\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=July 3, 2017\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170703211527\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e+ |url-status=live\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[UV astronomy|Ultraviolet]] and [[X-ray astronomy|X-ray telescopes]] can observe highly energetic galactic phenomena. Ultraviolet flares are sometimes observed when a star in a distant galaxy is torn apart from the tidal forces of a nearby black hole.\u003cref\u003e{{cite news\u003cbr\u003e+ |title=NASA Telescope Sees Black Hole Munch on a Star\u003cbr\u003e+ |url=http:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e+ |website=[[Galaxy Evolution Explorer]]\u003cbr\u003e+ |publisher=[[NASA]]\u003cbr\u003e+ |date=December 5, 2006\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=April 25, 2010\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100425205637\u002fhttp:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e The distribution of hot gas in galactic clusters can be mapped by X-rays. The existence of supermassive black holes at the cores of galaxies was confirmed through X-ray astronomy.\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Dunn\u003cbr\u003e+ |first1=Robert\u003cbr\u003e+ |title=An Introduction to X-ray Astronomy\u003cbr\u003e+ |url=http:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e+ |publisher=[[Institute of Astronomy, Cambridge|Institute of Astronomy]] X-Ray Group\u003cbr\u003e+ |date=August 9, 2005\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=January 1, 2007\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070101105849\u002fhttp:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e+ |url-status=live\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Modern research ===\u003cbr\u003e [[File:Rotation curve of spiral galaxy Messier 33 (Triangulum).png|thumb|upright=1.8|Rotation curve of spiral galaxy Messier 33 (yellow and blue points with error bars), and a predicted one from distribution of the visible matter (gray line). The discrepancy between the two curves can be accounted for by adding a dark matter halo surrounding the galaxy.\u003cref\u003e{{cite journal |last1=Corbelli |first1=E. |last2=Salucci |first2=P. |year=2000 |title=The extended rotation curve and the dark matter halo of M33 |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=311 |issue=2 |pages=441\u2013447 |arxiv=astro-ph\u002f9909252 |bibcode=2000MNRAS.311..441C |bibcode-access=free |doi=10.1046\u002fj.1365-8711.2000.03075.x |doi-access=free }}\u003c\u002fref\u003e]]\u003cbr\u003e@@ -1000,74 +1068,6 @@\u003cbr\u003e |doi-access=free\u003cbr\u003e  }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-== Multi-wavelength observation ==\u003cbr\u003e-{{See also|Observatio
