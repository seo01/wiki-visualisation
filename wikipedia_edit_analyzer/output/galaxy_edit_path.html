ember 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified an ultra-faint galaxy named JD1.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Galaxy JD1 was observed by the JWST using the NIRSpec instrument and was found to have a redshift value of 9.79.\u003cref name=JD1_1\u002f\u003e This means that JD1 was observed at 480 million years after the Big Bang when the universe was only about 4% of its present age.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 59\u003cbr\u003e+++ Revision 60\u003cbr\u003e@@ -668,7 +668,7 @@\u003cbr\u003e \u003cbr\u003e In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current oldest and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.p last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60. Such stars are likely to have existed in the very early universe (i.e. at high redshift), and may have started the production of [[chemical element]]s heavier than [[hydrogen]] that are needed for the later formation of planets and life as we know it.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Evolution ===\u003cbr\u003e Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release","--- Revision 60\u003cbr\u003e+++ Revision 61\u003cbr\u003e@@ -663,10 +663,7 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e-{{see also|List of the most distant astronomical objects}}\u003cbr\u003e-Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current oldest and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-I rk star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -697,18 +694,7 @@\u003cbr\u003e |doi-access=free\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]].\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Heger |first1=Alexander\u003cbr\u003e- |last2=Woosley |first2=Stanford E.\u003cbr\u003e- |author-link2=Stanford E. Woosley\u003cbr\u003e- |s2cid=16050642\u003cbr\u003e- |date=2002\u003cbr\u003e- |title=The Nucleosynthetic Signature of Population III\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=567 |issue=1 |pages=532\u2013543\u003cbr\u003e- |bibcode=2002ApJ...567..532H\u003cbr\u003e- |doi=10.1086\u002f338487\u003cbr\u003e-|arxiv = astro-ph\u002f0107037 }}\u003c\u002fref\u003e This first generation of stars re-ionized the surrounding neutral hydrogen, creating expanding bubbles of space through which light could readily travel.\u003cref\u003e{{cite journal\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e This first generation of stars re-ionized the surrounding neutral hydrogen, creating expanding bubbles of space through which light could readily travel.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e  |last2=Loeb\u003cbr\u003e@@ -725,9 +711,7 @@\u003cbr\u003e  |arxiv=astro-ph\u002f0010468\u003cbr\u003e  |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60. Such stars are likely to have existed in the very early universe (i.e. at high redshift), and may have started the production of [[chemical element]]s heavier than [[hydrogen]] that are needed for the later formation of planets and life as we know it.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |firs 003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e-Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current oldest and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current earliest observed and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy =e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 62\u003cbr\u003e+++ Revision 63\u003cbr\u003e@@ -470,11 +470,16 @@\u003cbr\u003e  |url-status=live\u003cbr\u003e  }}\u003c\u002fref\u003e but still contribute an estimated 15% to total star production.\u003cref\u003e{{cite conference\u003cbr\u003e  |last1=Kennicutt |first1=Robert C. Jr.\u003cbr\u003e+ |editor-last1=De Grijs |editor-first1=Richard\u003cbr\u003e+ |editor-last2=Gonz\u00e1lez Delgado |editor-first2=Rosa M.\u003cbr\u003e  |display-authors=etal\u003cbr\u003e  |date=2005\u003cbr\u003e- |title=Demographics and Host Galaxies of Starbursts\u003cbr\u003e- |work=Starbursts: covered as far away as [[UHZ1]], roughly 13.2 billion light-years distant.\u003cref\u003e{{Cite web |date=2023-11-10 |title=UHZ1: Distant Galaxy and Black Hole |url=https:\u002f\u002fapod.nasa.gov\u002fapod\u002fap231110.html |access-date=2024-02-18 |editor-last1=Nemiroff|editor-first1=Robert|editor-last2=Bonnell|editor-first2=Jerry|website=[[Astronomy Picture of the Day]]}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Bogd\u00e1n |first1=\u00c1kos |last2=Goulding |first2=Andy D. |last3=Natarajan |first3=Priyamvada |last4=Kov\u00e1cs |first4=Orsolya E. |last5=Tremblay |first5=Grant R. |last6=Chadayammuri |first6=Urmila |last7=Volonteri |first7=Marta |last8=Kraft |first8=Ralph P. |last9=Forman |first9=William R. |last10=Jones |first10=Christine |last11=Churazov |first11=Eugene |last12=Zhuravleva |first12=Irina |date=January 2024 |title=Evidence for heavy-seed origin of early supermassive black holes from a z \u2248 10 X-ray quasar |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41550-023-02111-9 |journal=[[Nature Astronomy]] |language=en |volume=8 |issue=1 |pages=126\u2013133 |arxiv=2305.15458 |bibcode=2024NatAs...8..126B |doi=10.1038\u002fs41550-023-02111-9 |s2cid=258887541 |issn=2397-3366}}\u003c\u002fref\u003e Quasars are noteworthy for providing the first demonstration of the phenomenon that [[Gravitational lens|gravity can act as a lens for light]].\u003cref\u003e{{Cite journal |last1=Blandford |first1=R. D. |last2=Narayan |first2=R. |date=September 1992 |title=Cosmological Applications of Gravitational Lensing |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev.aa.30.090192.001523 |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=30 |issue=1 |pages=311\u2013358 |doi=10.1146\u002fannurev.aa.30.090192.001523 |issn=0066-4146}}\u003c\u002fref\u003e\u003cbr\u003e+Quasars are the most energetic and distant members of active galactic nuclei. Extremely luminous, they were first identified as in The Universe Being Born |url=https:\u002f\u002fwww.sciencealert.com\u002fweve-just-seen-the-first-galaxies-in-the-universe-being-born |date=27 May 2024 |work=[[ScienceAlert]] |url-status=live |archiveurl=https:\u002f\u002farchive.ph\u002fwip\u002fczyFX |archivedate=28 May 2024 |accessdate=28 May 2024 }}\u003c\u002fref\u003e\u003cref name=SCI-20240523\"\u003e{{cite journal |author=Kasper E. Heintz |display-authors=et al. |title=Strong damped Lyman-\u03b1 absorption in young star-forming galaxies at redshifts 9 to 11 |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.adj0343 |date=23 May 2024 |journal=[[Science (journal)|Science]] |volume=384 |issue=6698 |pages=890-894 |doi=10.1126\u002fscience.adj0343 |url-status=live |archiveurl=https:\u002f\u002farchive.ph\u002fEZVmV |archivedate=24 May 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e === Evolution ===\u003cbr\u003e Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e  |date        = February 9, 2005","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -718,8 +718,6 @@\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e  }}\u003c\u002fref\u003e In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In May 2024, astronomers reported studies of the earliest observed galaxies at the moments of their formation.\u003cref name=\"NYT-20240527\"\u003e{{cite news |last=Starr |first=Michelle |title=We've Just Seen The First Galaxies in The Universe Being Born |url=https:\u002f\u002fwww.sciencealert.com\u002fweve-just-seen-the-first-galaxies-in-the-universe-being-born |date=27 May 2024 |work=[[ScienceAlert]] |url-status=live |archiveurl=https:\u002f\u002farchive.ph\u002fwip\u002fczyFX |archivedate=28 May 2024 |accessdate=28 May 2024 }}\u003c\u002fref\u003e\u003cref name=SCI-20240523\"\u003e{{cite journal |author=Kasper E. Heintz |display-authors=et al. |title=Strong damped Lyman-\u03b1 absorption in young star-forming galaxies at redshifts 9 to 11 |url=https:\u002f\u002fwww.science.org\u002fdoi\u002f10.1126\u002fscience.adj0343 |date=23 May 2024 |journal=[[Science (journal)|Science]] |volume=384 |issue=6698 |pages=890-894 |doi=10.1126\u002fscience.adj0343 |url-status=live |archiveurl=https:\u002f\u002farchive.ph\u002fEZVmV |archivedate=24 May 2024 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e === Evolution ===\u003cbr\u003e Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e  |date        = February 9, 2005","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -668,7 +668,7 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e-Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current earliest observed and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In May 2024, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = Brant E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e}}\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Robera|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e JADES-GS-z14-0 is estimated to have existed only 290 million years after the Big Bang, when the universe was only about 2% of its present age.\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170804\u002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NASA\u2019s James Webb Space Telescope Finds Most Distant Known Galaxy|url=https:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240530143356\u002fhttps:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|access-date=5 June 2024|archive-date=30 May 2024|url-status=live|editor-last1=Fisher|editor-first1=Alise|editor-last2=Betz|editor-first2=Laura|editor-last3=Pulliam|editor-first3=Christine}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 69\u003cbr\u003e+++ Revision 70\u003cbr\u003e@@ -668,7 +668,7 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e = nce for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = Brant E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Robera|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cre
