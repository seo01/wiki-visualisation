ast1=Chamba | first1=Nushkia | title=A historical perspective on the concept of galaxy size | journal=Research Notes of the American Astronomical Society | year=2020 | volume=4 | issue=7 | page=117 | doi=10.3847\u002f2515-5172\u002faba951 | bibcode=2020RNAAS...4..117C | s2cid=223953458 | doi-access=free }}\u003c\u002fref\u003e [[Isophote]]s are curves in a diagram - such as a picture of a galaxy - that adjoins points of equal brightnesses, and are useful in defining the extent of the galaxy.  The apparent brightness flux of a galaxy is measured in units of [[Magnitude (astronomy)|magnitudes]] per square [[Minute and second of arc|arcsecond]] (mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e; sometimes expressed as ''mag arcsec\u003csup\u003e\u22122\u003c\u002fsup\u003e''), which defines the brightness depth of the isophote. To illustrate how this unit works, a typical galaxy has a brightness flux of 18 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e at its central region. This brightness is equivalent to the light of an 18th magnitude hypothetical point object (like a star) being spread out evenly in a one square arcsecond area of the sky.\u003cref name=\"UMD_Week_6\"\u003e{{cite web | title=Measuring Galaxy Luminosities | work=ASTR620: Galaxies | first=Richard | last=Mushotzky | publisher=[[University of Maryland]] Astronomy Department | url=https:\u002f\u002fwww.astro.umd.edu\u002f~richard\u002fASTRO620\u002fdavis_week6.pdf | access-date=2024-02-14 }}\u003c\u002fref\u003e The isophotal diameter is typically defined as the region enclosing all the light down to 25 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e in the blue [[Jhk|B-band]],\u003cref name=\"sparkegallagher2000_131\"\u002f\u003e which is then referred to as the D\u003csub\u003e25\u003c\u002fsub\u003e standard.\u003cref\u003e{{Cite journal |last1=Fouque |first1=P. |last2=Paturel |first2=G. |date=September 1985 |title=Standard photometric diameters of galaxies. II - Reduction of the ESO, UGC, MCG catalogue |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f1985A%26A...150..192F |journal=Astronomy and Astrophysics |volume=150 |issue=2 |pages=192\u2013204|bibcode=1985A&A...150..192F }}\u003c\u002fref\u003e\u003cbr\u003e+The ''isophotal diameter'' is introduced as a conventional way of measuring a galaxy's size based on its apparent surface brightness.\u003cref name=Chamba\u003e{{cite journal | arxiv=2010.07946 | last1=Chamba | first1=Nushkia | title=A historical perspective on the concept of galaxy size | journal=Research Notes of the American Astronomical Society | year=2020 | volume=4 | issue=7 | page=117 | doi=10.3847\u002f2515-5172\u002faba951 | bibcode=2020RNAAS...4..117C | s2cid=223953458 | doi-access=free }}\u003c\u002fref\u003e [[Isophote]]s are curves in a diagram - such as a picture of a galaxy - that adjoins points of equal brightnesses, and are useful in defining the extent of the galaxy.  The apparent brightness flux of a galaxy is measured in units of [[Magnitude (astronomy)|magnitudes]] per square [[Minute and second of arc|arcsecond]] (mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e; sometimes expressed as ''mag arcsec\u003csup\u003e\u22122\u003c\u002fsup\u003e''), which defines the brightness depth of the isophote. To illustrate how this unit works, a typical galaxy has a brightness flux of 18 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e at its central region. This brightness is equivalent to the light of an 18th magnitude hypothetical point object (like a star) being spread out evenly in a one square arcsecond area of the sky.\u003cref name=\"UMD_Week_6\"\u003e{{cite web | title=Measuring Galaxy Luminosities | work=ASTR620: Galaxies | first=Richard | last=Mushotzky | publisher=[[University of Maryland]] Astronomy Department | url=https:\u002f\u002fwww.astro.umd.edu\u002f~richard\u002fASTRO620\u002fdavis_week6.pdf | access-date=2024-02-14 }}\u003c\u002fref\u003e The isophotal diameter is typically defined as the region enclosing all the light down to 25 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e in the blue [[Jhk|B-band]],\u003cref name=\"sparkegallagher2000_131\"\u002f\u003e which is then referred to as the D\u003csub\u003e25\u003c\u002fsub\u003e standard.\u003cref\u003e{{Cite journal |last1=Fouque |first1=P. |last2=Paturel |first2=G. |date=September 1985 |title=Standard photometric diameters of galaxies. II - Reduction of the ESO, UGC, MCG catalogue |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f1985A%26A...150..192F |journal=[[Astronomy & Astrophysics]] |volume=150 |issue=2 |pages=192\u2013204|bibcode=1985A&A...150..192F }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e {| class=\"wikitable\"\u003cbr\u003e |+ Examples of isophotal diameters (25.0 B-mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e isophote)","--- Revision 52\u003cbr\u003e+++ Revision 53\u003cbr\u003e@@ -574,9 +574,9 @@\u003cbr\u003e  |number=1-2\u003cbr\u003e  |bibcode=1980A&A....87..152H\u003cbr\u003e }}\u003c\u002fref\u003e Approximately one-third of nearby galaxies are classified as containing LINER nuclei.\u003cref name=\"keel\" \u002f\u003e\u003cref name=\"heckman1980\" \u002f\u003e\u003cref name=\"hoetal1997b\"\u003e{{cite journal\u003cbr\u003e- |last1=Ho |first1=L. C.\u003cbr\u003e- |last2=Filippenko |first2=A. V.\u003cbr\u003e- |last3=Sargent |first3=W. L. W.\u003cbr\u003e+ |last1=Ho |first1=Luis C.\u003cbr\u003e+ |last2=Filippenko |first2=Alexei V.\u003cbr\u003e+ |last3=Sargent |first3=Wallace L. W.\u003cbr\u003e  |s2cid=16742031\u003cbr\u003e  |date=1997\u003cbr\u003e  |title=A Search for \"Dwarf\" Seyfert Nuclei. V. Demographics of Nuclear Activity in Nearby Galaxies","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -6,9 +6,9 @@\u003cbr\u003e {{Use mdy dates|date=February 2015}}\u003cbr\u003e {{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about 55,000&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e \u003cbr\u003e-A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e-\u003cbr\u003e-Galaxies are categorized according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances on the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118}}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbor, by just over 750,000 parsecs (2.5 million ly.)\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e+A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e+\u003cbr\u003e+Galaxies are categorized according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances on the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbor, by just over 750,000 parsecs (2.5 million ly.)\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The space between galaxies is filled with a tenuous gas (the [[Intergalactic space|intergalactic medium]]) with an average density of less than one [[atom]] per cubic meter. Most galaxies are gravitationally organized into [[galaxy group|groups]], [[galaxy cluster|clusters]] and [[supercluster]]s. The [[Milky Way]] is part of the [[Local Group]], which it dominates along with the [[Andromeda Galaxy]]. The group is part of the [[Virgo Supercluster]]. At the [[Large-scale structure of the Cosmos|largest scale]], these associations are generally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e@@ -49,7 +49,7 @@\u003cbr\u003e In 1750, [[Thomas Wright (astronomer)|Thomas Wright]] correctly speculated that the Milky Way was a flattened disk of stars, and that some of the nebulae visible in the night sky might be separate Milky Ways.\u003cref name=\"our_galaxy\"\u002f\u003e\u003cref name=Dyson_1979\u002f\u003e\u003cbr\u003e [[File:Pic iroberts1.jpg|thumb|right|Photograph of the \"Great Andromeda Nebula\" by [[Isaac Roberts]], 1899, later identified as the [[Andromeda Galaxy]]]]\u003cbr\u003e \u003cbr\u003e-Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5,000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19-29 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e+Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5,000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |jstor=24944338 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19\u201329 |doi=10.3724\u002fSP.J.1440-2807.2012.01.03 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1912, [[Vesto M. Slipher]] made spectrographic studies of the brightest spiral nebulae to determine their composition. Slipher discovered that the spiral nebulae have high [[Doppler shift]]s, indicating that they are moving at a rate exceeding the velocity of the stars he had measured. He found that the majority of these nebulae are moving away from us.\u003cref name=Slipher_1913\u002f\u003e\u003cref name=Slipher_1915\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -571,7 +571,7 @@\u003cbr\u003e  |title=An Optical and Radio Survey of the Nuclei of Bright Galaxies\u003cbr\u003e  |journal=[[Astronomy & Astrophysics]]\u003cbr\u003e  |volume=87 |pages=152\u2013164\u003cbr\u003e- |number=1-2\u003cbr\u003e+ |number=1\u20132\u003cbr\u003e  |bibcode=1980A&A....87..152H\u003cbr\u003e }}\u003c\u002fref\u003e Approximately one-third of nearby galaxies are classified as containing LINER nuclei.\u003cref name=\"keel\" \u002f\u003e\u003cref name=\"heckman1980\" \u002f\u003e\u003cref name=\"hoetal1997b\"\u003e{{cite journal\u003cbr\u003e  |last1=Ho |first1=Luis C.\u003cbr\u003e@@ -590,7 +590,7 @@\u003cbr\u003e === Luminous infrared galaxy ===\u003cbr\u003e {{Main|Luminous infrared galaxy}}\u003cbr\u003e \u003cbr\u003e-Luminous infrared galaxies (LIRGs) are galaxies with luminosities\u2014the measurement of electromagnetic power output\u2014above 10\u003csup\u003e11\u003c\u002fsup\u003e L\u2609 (solar luminosities). In most cases, most of their energy comes from large numbers of young stars which heat surrounding dust, which reradiates the energy in the infrared.  Luminosity high enough to be a LIRG requires a star formation rate of at least 18&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e. Ultra-luminous infrared galaxies (ULIRGs) are at least ten times more luminous still and form stars at rates \u003e180&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e.  Many LIRGs also emit radiation from an AGN.\u003cref\u003e{{Cite journal |last1=P\u00e9rez-Torres |first1=Miguel |last2=Mattila |first2=Seppo |last3=Alonso-Herrero |first3=Almudena |last4=Aalto |first4=Susanne |last5=Efstathiou |first5=Andreas |date=December 2021 |title=Star formation and nuclear activity in luminous infrared galaxies: an infrared through radio review |url=https:\u002f\u002flink.springer.com\u002f10.1007\u002fs00159-020-00128-x |journal=[[The Astronomy and Astrophysics Review]] |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M. |last3=Colina |first3=L. |last4=Labiano |first4=A. |last5=S\u00e1nchez-Garc\u00eda |first5=M. |last6=Alonso-Herrero |first6=A. |last7=Arribas |first7=S. |last8=Garc\u00eda-Burillo |first8=S. |last9=Villar-Mart\u00edn |first9=M. |last10=Rigopoulou |first10=D. |last11=Valentino |first11=F. |last12=Puglisi |first12=A. |last13=D\u00edaz-Santos |first13=T. |last14=Cazzoli |first14=S. |last15=Usero |first15=A. |date=August 2022 |title=Compact molecular gas emission in local LIRGs among low- and high- z galaxies |url=https:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f202142802 |journal=[[Astronomy & Astrophysics]] |volume=664 |pages=A60 |doi=10.1051\u002f0004-6361\u002f202142802 |issn=0004-6361|arxiv=2204.02055 |bibcode=2022A&A...664A..60B }}\u003c\u002fref\u003e Infrared galaxies emit more energy in the infrared than all other wavelengths combined, with peak emission typically at wavelengths of 60 to 100 microns. LIRGs are believed to be created from the strong interaction and merger of   spiral galaxies.\u003cref\u003e{{Cite journal |last1=Sanders |first1=David B. |last2=Mirabel |first2=I. F. |date=Sep 1996 |title=Luminous Infrared Galaxies |url=https:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fSanders\u002fpaper.pdf |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=34 |issue=1 |pages=749\u2013792 [772-773] |doi=10.1146\u002fannurev.astro.34.1.749 |bibcode=1996ARA&A..34..749S|issn=0066-4146}}\u003c\u002fref\u003e While uncommon in the local universe, LIRGs and ULIRGS were more prevalent when the universe was younger.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e+Luminous infrared galaxies (LIRGs) are galaxies with luminosities\u2014the measurement of electromagnetic power output\u2014above 10\u003csup\u003e11\u003c\u002fsup\u003e L\u2609 (solar luminosities). In most cases, most of their energy comes from large numbers of young stars which heat surrounding dust, which reradiates the energy in the infrared.  Luminosity high enough to be a LIRG requires a star formation rate of at least 18&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e. Ultra-luminous infrared galaxies (ULIRGs) are at least ten times more luminous still and form stars at rates \u003e180&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e.  Many LIRGs also emit radiation from an AGN.\u003cref\u003e{{Cite journal |last1=P\u00e9rez-Torres |first1=Miguel |last2=Mattila |first2=Seppo |last3=Alonso-Herrero |first3=Almudena |last4=Aalto |first4=Susanne |last5=Efstathiou |first5=Andreas |date=December 2021 |title=Star formation and nuclear activity in luminous infrared galaxies: an infrared through radio review |url=https:\u002f\u002flink.springer.com\u002f10.1007\u002fs00159-020-00128-x |journal=[[The Astronomy and Astrophysics Review]] |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M. |last3=Colina |first3=L. |last4=Labiano |first4=A. |last5=S\u00e1nchez-Garc\u00eda |first5=M. |last6=Alonso-Herrero |first6=A. |last7=Arribas |first7=S. |last8=Garc\u00eda-Burillo |first8=S. |last9=Villar-Mart\u00edn |first9=M. |last10=Rigopoulou |first10=D. |last11=Valentino |first11=F. |last12=Puglisi |first12=A. |last13=D\u00edaz-Santos |first13=T. |last14=Cazzoli |first14=S. |last15=Usero |first15=A. |date=August 2022 |title=Compact molecular gas emission in local LIRGs among low- and high- z galaxies |url=https:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f202142802 |journal=[[Astronomy & Astrophysics]] |volume=664 |pages=A60 |doi=10.1051\u002f0004-6361\u002f202142802 |issn=0004-6361|arxiv=2204.02055 |bibcode=2022A&A...664A..60B }}\u003c\u002fref\u003e Infrared galaxies emit more energy in the infrared than all other wavelengths combined, with peak emission typically at wavelengths of 60 to 100 microns. LIRGs are believed to be created from the strong interaction and merger of   spiral galaxies.\u003cref\u003e{{Cite journal |last1=Sanders |first1=David B. |last2=Mirabel |first2=I. F. |date=Sep 1996 |title=Luminous Infrared Galaxies |url=https:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fSanders\u002fpaper.pdf |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=34 |issue=1 |pages=749\u2013792 [772\u2013773] |doi=10.1146\u002fannurev.astro.34.1.749 |bibcode=1996ARA&A..34..749S|issn=0066-4146}}\u003c\u002fref\u003e While uncommon in the local universe, LIRGs and ULIRGS were more prevalent when the universe was younger.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e ==Physical diameters==\u003cbr\u003e \u003cbr\u003e@@ -632,7 +632,7 @@\u003cbr\u003e \u003cbr\u003e Petrosian magnitudes have the advantage of being redshift and distance independent, allowing the measurement of the galaxy's apparent size since the Petrosian radius is defined in terms of the galaxy's overall luminous flux.\u003cref name=\"Graham\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-A critique of an earlier version of this method has been issued by the [[Infrared Processing and Analysis Center]],\u003cref name=ipac1\u003e{{cite web|url=https:\u002f\u002fwise2.ipac.caltech.edu\u002fstaff\u002fjarrett\u002f2mass\u002fphotmem\u002fnode3.html |last=Jarret|first=Tom|last2=Rosenberg|first2=Jessica|date=February 6, 1997|access-date=April 20, 2024|website=Comparison of GALWORKS and IRAF's STSDAS Photometry in a Polar Field, WISE Science Data Center|publisher=[[California Institute of Technology]]|title=Circular and Fixed Elliptical Apertures: The Petrosian and Isophotal Photometry}}\u003c\u002fref\u003e with the method causing a magnitude of error (upwards to 10%) of the values than using isophotal diameter. The use of Petrosian magnitudes also have the disadvantage of missing most of the light outside the Petrosian aperture, which is defined relative to the galaxy's overall brightness profile, especially for elliptical galaxies, with higher signal-to-noise ratios on higher distances and redshifts.\u003cref name=Ned2\u003e{{Cite web|date=July 19, 2017|url=https:\u002f\u002fned.ipac.caltech.edu\u002fDocuments\u002fHoldings\u002fSets\u002fSDSS-DR6\u002fphotometry#cmodel|title=Measures of SDSS flux, magnitudes, and diameters\u003cbr\u003e+A critique of an earlier version of this method has been issued by the [[Infrared Processing and Analysis Center]],\u003cref name=ipac1\u003e{{cite web|url=https:\u002f\u002fwise2.ipac.caltech.edu\u002fstaff\u002fjarrett\u002f2mass\u002fphotmem\u002fnode3.html |last1=Jarret|first1=Tom|last2=Rosenberg|first2=Jessica|date=February 6, 1997|access-date=April 20, 2024|website=Comparison of GALWORKS and IRAF's STSDAS Photometry in a Polar Field, WISE Science Data Center|publisher=[[California Institute of Technology]]|title=Circular and Fixed Elliptical Apertures: The Petrosian and Isophotal Photometry}}\u003c\u002fref\u003e with the method causing a magnitude of error (upwards to 10%) of the values than using isophotal diameter. The use of Petrosian magnitudes also have the disadvantage of missing most of the light outside the Petrosian aperture, which is defined relative to the galaxy's overall brightness profile, especially for elliptical galaxies, with higher signal-to-noise ratios on higher distances and redshifts.\u003cref name=Ned2\u003e{{Cite web|date=July 19, 2017|url=https:\u002f\u002fned.ipac.caltech.edu\u002fDocuments\u002fHoldings\u002fSets\u002fSDSS-DR6\u002fphotometry#cmodel|title=Measures of SDSS flux, magnitudes, and diameters\u003cbr\u003e |website=[[NASA\u002fIPAC Extragalactic Database]]|access-date=April 20, 2024}}\u003c\u002fref\u003e A correction for this method has been issued by Graham ''et al.'' in 2005, based on the assumption that galaxies follow [[S\u00e9rsic profile|S\u00e9rsic's law]].\u003cref name=Graham\u003e{{cite journal | arxiv=astro-ph\u002f0504287 | doi=10.1086\u002f444475 | title=Total Galaxy Magnitudes and Effective Radii from Petrosian Magnitudes and Radii | year=2005 | last1=Graham | first1=Alister W. | last2=Driver | first2=Simon P. | last3=Petrosian | first3=Vahe | last4=Conselice | first4=Christopher J. | last5=Bershady | first5=Matthew A. | last6=Crawford | first6=Steven M. | last7=Goto | first7=Tomotsugu | journal=[[The Astronomical Journal]] | volume=130 | issue=4 | pages=1535\u20131544 | bibcode=2005AJ....130.1535G | s2cid=11517686 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Near-infrared method===\u003cbr\u003e@@ -673,11 +673,11 @@\u003cbr\u003e  |doi=10.1038\u002f443151a\u003cbr\u003e  |pmid=16971933\u003cbr\u003e |bibcode = 2006Natur.443..151M }}\u003c\u002fref\u003e\u003cbr\u003e-While some scientists have claimed other objects, such as [[Galaxy Abell 1835 IR1916|Abell 1835 IR1916]], have higher redshifts, and therefore are seen in an earlier stage of the universe's evolution, [[IOK-1|IOK-1's]] age and composition have been more reliably established. In December 2012, astronomers reported [[UDFj-39546284]] to be the most distant object known at the time, with a redshift value of 11.9\u003cref name=\"Bouwens2013\"\u003e{{cite journal|bibcode=2013ApJ...765L..16B|arxiv=1211.3105|title=Photometric Constraints on the Redshift of z ~ 10 Candidate UDFj-39546284 from Deeper WFC3\u002fIR+ACS+IRAC Observations over the HUDF|journal=The Astrophysical Journal Letters|volume=765|pages=L16|last1=Bouwens|first1=R. J.| author-link1 = Rychard Bouwens| last2=Oesch|first2=P. A.|last3=Illingworth|first3=G. D.|last4=Labb\u00e9|first4=I.|last5=Van Dokkum|first5=P. G.|last6=Brammer|first6=G.|last7=Magee|first7=D.|last8=Spitler|first8=L. R.|last9=Franx|first9=M.|last10=Smit|first10=R.|last11=Trenti|first11=M.|last12=Gonzalez|first12=V.|last13=Carollo|first13=C. M.| author-link13 = C. Marcella Carollo|display-authors=1|year=2013|issue=1|doi=10.1088\u002f2041-8205\u002f765\u002f1\u002fL16}}\u003c\u002fref\u003e\u003cref name=\"Space-20121212\"\u003e{{cite web |last=Wall |first=Mike |title=Ancient Galaxy May Be Most Distant Ever Seen |url=http:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |date=December 12, 2012 |website=[[Space.com]] |access-date=December 12, 2012 |archive-date=May 4, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190504165521\u002fhttps:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |url-status=live }}\u003c\u002fref\u003e which was later confirmed to be 11.58 by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument on the [[James Webb Space Telescope]] (JWST).\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In September 2022, the JWST discovered [[JADES-GS-z13-0]], a galaxy with a redshift value of 13.2, establishing it as the oldest and most distant spectroscopically-confirmed astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w}}\u003c\u002fref\u003e JADES-GS-z13-0, estimated to have existed only 350 million years after the Big Bang, has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified an ultra-faint galaxy named JD1.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Galaxy JD1 was observed by the JWST using the NIRSpec instrument and was found to have a redshift value of 9.79.\u003cref name=JD1_1\u002f\u003e This means that JD1 was observed at 480 million years after the Big Bang when the universe was only about 4% of its present age.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |doi=10.3847\u002f1538-4357\u002fad1a13 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e+While some scientists have claimed other objects, such as [[Galaxy Abell 1835 IR1916|Abell 1835 IR1916]], have higher redshifts, and therefore are seen in an earlier stage of the universe's evolution, [[IOK-1|IOK-1's]] age and composition have been more reliably established. In December 2012, astronomers reported [[UDFj-39546284]] to be the most distant object known at the time, with a redshift value of 11.9\u003cref name=\"Bouwens2013\"\u003e{{cite journal|bibcode=2013ApJ...765L..16B|arxiv=1211.3105|title=Photometric Constraints on the Redshift of z ~ 10 Candidate UDFj-39546284 from Deeper WFC3\u002fIR+ACS+IRAC Observations over the HUDF|journal=The Astrophysical Journal Letters|volume=765|pages=L16|last1=Bouwens|first1=R. J.| author-link1 = Rychard Bouwens| last2=Oesch|first2=P. A.|last3=Illingworth|first3=G. D.|last4=Labb\u00e9|first4=I.|last5=Van Dokkum|first5=P. G.|last6=Brammer|first6=G.|last7=Magee|first7=D.|last8=Spitler|first8=L. R.|last9=Franx|first9=M.|last10=Smit|first10=R.|last11=Trenti|first11=M.|last12=Gonzalez|first12=V.|last13=Carollo|first13=C. M.| author-link13 = C. Marcella Carollo|display-authors=1|year=2013|issue=1|doi=10.1088\u002f2041-8205\u002f765\u002f1\u002fL16}}\u003c\u002fref\u003e\u003cref name=\"Space-20121212\"\u003e{{cite web |last=Wall |first=Mike |title=Ancient Galaxy May Be Most Distant Ever Seen |url=http:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |date=December 12, 2012 |website=[[Space.com]] |access-date=December 12, 2012 |archive-date=May 4, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190504165521\u002fhttps:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |url-status=live }}\u003c\u002fref\u003e which was later confirmed to be 11.58 by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument on the [[James Webb Space Telescope]] (JWST).\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In September 2022, the JWST discovered [[JADES-GS-z13-0]], a galaxy with a redshift value of 13.2, establishing it as the oldest and most distant spectroscopically-confirmed astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0, estimated to have existed only 350 million years after the Big Bang, has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest ima ger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetele 003cbr\u003e-Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=McMahon |first1=Richard\u003cbr\u003e- |s2cid=28977650\u003cbr\u003e- |date=2006\u003cbr\u003e- |title=Astronomy: Dawn after the dark age\u003cbr\u003e- |journal=[[Nature (journal)|Nature]]\u003cbr\u003e- |volume=443 |issue=7108 |pages=151\u20132\u003cbr\u003e- |doi=10.1038\u002f443151a\u003cbr\u003e- |pmid=16971933\u003cbr\u003e-|bibcode = 2006Natur.443..151M }}\u003c\u002fref\u003e\u003cbr\u003e-While some scientists have claimed other objects, such as [[Galaxy Abell 1835 IR1916|Abell 1835 IR1916]], have higher redshifts, and therefore are seen in an earlier stage of the universe's evolution, [[IOK-1|IOK-1's]] age and composition have been more reliably established. In December 2012, astronomers reported [[UDFj-39546284]] to be the most distant object known at the time, with a redshift value of 11.9\u003cref name=\"Bouwens2013\"\u003e{{cite journal|bibcode=2013ApJ...765L..16B|arxiv=1211.3105|title=Photometric Constraints on the Redshift of z ~ 10 Candidate UDFj-39546284 from Deeper WFC3\u002fIR+ACS+IRAC Observations over the HUDF|journal=The Astrophysical Journal Letters|volume=765|pages=L16|last1=Bouwens|first1=R. J.| author-link1 = Rychard Bouwens| last2=Oesch|first2=P. A.|last3=Illingworth|first3=G. D.|last4=Labb\u00e9|first4=I.|last5=Van Dokkum|first5=P. G.|last6=Brammer|first6=G.|last7=Magee|first7=D.|last8=Spitler|first8=L. R.|last9=Franx|first9=M.|last10=Smit|first10=R.|last11=Trenti|first11=M.|last12=Gonzalez|first12=V.|last13=Carollo|first13=C. M.| author-link13 = C. Marcella Carollo|display-authors=1|year=2013|issue=1|doi=10.1088\u002f2041-8205\u002f765\u002f1\u002fL16}}\u003c\u002fref\u003e\u003cref name=\"Space-20121212\"\u003e{{cite web |last=Wall |first=Mike |title=Ancient Galaxy May Be Most Distant Ever Seen |url=http:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |date=December 12, 2012 |website=[[Space.com]] |access-date=December 12, 2012 |archive-date=May 4, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190504165521\u002fhttps:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |url-status=live }}\u003c\u002fref\u003e which was later confirmed to be 11.58 by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument on the [[James Webb Space Telescope]] (JWST).\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e\u003cbr\u003e+In December 2012, astronomers reported [[UDFj-39546284]] to be the most distant object known at the time, with a redshift value of 11.9\u003cref name=\"Bouwens2013\"\u003e{{cite journal|bibcode=2013ApJ...765L..16B|arxiv=1211.3105|title=Photometric Constraints on the Redshift of z ~ 10 Candidate UDFj-39546284 from Deeper WFC3\u002fIR+ACS+IRAC Observations over the HUDF|journal=The Astrophysical Journal Letters|volume=765|pages=L16|last1=Bouwens|first1=R. J.| author-link1 = Rychard Bouwens| last2=Oesch|first2=P. A.|last3=Illingworth|first3=G. D.|last4=Labb\u00e9|first4=I.|last5=Van Dokkum|first5=P. G.|last6=Brammer|first6=G.|last7=Magee|first7=D.|last8=Spitler|first8=L. R.|last9=Franx|first9=M.|last10=Smit|first10=R.|last11=Trenti|first11=M.|last12=Gonzalez|first12=V.|last13=Carollo|first13=C. M.| author-link13 = C. Marcella Carollo|display-authors=1|year=2013|issue=1|doi=10.1088\u002f2041-8205\u002f765\u002f1\u002fL16}}\u003c\u002fref\u003e\u003cref name=\"Space-20121212\"\u003e{{cite web |last=Wall |first=Mike |title=Ancient Galaxy May Be Most Distant Ever Seen |url=http:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |date=December 12, 2012 |website=[[Space.com]] |access-date=December 12, 2012 |archive-date=May 4, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190504165521\u002fhttps:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |url-status=live }}\u003c\u002fref\u003e which was later confirmed to be 11.58 by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument on the [[James Webb Space Telescope]] (JWST).\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In September 2022, the JWST discovered [[JADES-GS-z13-0]], a galaxy with a redshift value of 13.2, establishing it as the oldest and most distant spectroscopically-confirmed astronomical object 01173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -666,7 +666,7 @@\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fre ..7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In September 2022, the JWST discovered [[JADES-GS-z13-0]], a galaxy with a redshift value of 13.2, establishing it as the oldest and most distant spectroscopically-confirmed astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0, estimated to have existed only 350 million years after the Big Bang, has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]], with subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument confirming a redshift value of 13.2 and establishing it as the oldest and most distant astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified an ultra-faint galaxy named JD1.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Galaxy JD1 was observed by the JWST using the NIRSpec instrument and was found to have a redshift value of 9.79.\u003cref name=JD1_1\u002f\u003e This means that JD1 was observed at 480 million years after the Big Bang when the universe was only about 4% of its present age.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -663,10 +663,11 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e+{{see also|List of the most distant astronomical objects}}\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2  intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|bibcode = 2023NatAs...7..611R |s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In September 2022, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]], with subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument confirming a redshift value of 13.2 and establishing it as the oldest and most distant astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fr [James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z13-0]]. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 13.2, establishing it as the current oldest and most distant astronomical object known.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w|hdl = 1887\u002f3716631 }}\u003c\u002fref\u003e JADES-GS-z13-0 is estimated to have existed only 350 million years after the Big Bang (when the universe was only about 2.5% of its present age) and has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified an ultra-faint galaxy named JD1.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Galaxy JD1 was observed by the JWST using the NIRSpec instrument and was found to have a redshift value of 9.79.\u003cref name=JD1_1\u002f\u003e This means that JD1 was observed at 480 million years after the Big Bang when the universe was only about 4% of its present age.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -665,7 +665,6 @@\u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e {{see also|List of the most distant astronomical objects}}\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has
