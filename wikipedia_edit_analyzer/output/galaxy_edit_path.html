 |url=https:\u002f\u002fphys.org\u002fnews\u002f2021-01-horizons-spacecraft-dark-space.html |access-date=15 January 2021 |language=en |archive-date=January 15, 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210115110710\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2021-01-horizons-spacecraft-dark-space.html |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In February 2024, a study explained the anomalies in the rotation curves of more than hundred spiral galaxies of different types from the SPARC (Spitzer Photometry and Accurate Rotation Curves) Galaxy collection taken with the [[Spitzer Space Telescope]], by accounting for [[Retarded potential|retarded gravitational potentials]] and without taking into account dark matter or modifying general relativity.\u003cref\u003e{{Cite journal |last=Glass |first=Yuval |last2=Zimmerman |first2=Tomer |last3=Yahalom |first3=Asher |date=2024-02-20 |title=Retarded Gravity in Disk Galaxies |url=https:\u002f\u002fwww.preprints.org\u002fmanuscript\u002f202402.1088\u002fv1 |journal=Symmetry |language=en |volume=16 |issue=4 |pages=387 |doi=10.3390\u002fsym16040387 |issn=2073-8994}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e == Types and morphology ==\u003cbr\u003e {{see also|Galactic bulge|Central massive object|Active galactic nucleus|Galaxy morphological classification}}\u003cbr\u003e [[File:Hubble sequence photo.png|thumb|360px|Types of galaxies according to the [[Hubble sequence|Hubble classification scheme]] : an ''E'' indicates a type of [[elliptical galaxy]]; an ''S'' is a [[Spiral galaxy|spiral]]; and ''SB'' is a [[barred spiral galaxy]]]]","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -1062,9 +1062,10 @@\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Gallery ==\u003cbr\u003e-\u003cgallery mode=packed heights=300\u003e\u003cbr\u003e+\u003cgallery mode=\"packed\" heights=\"300\"\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}\u003cbr\u003e File:PHANGS image mosaic.jpg|19 face-on spiral galaxies from the [[James Webb Space Telescope]] in near- and mid-infrared light. Older stars appear blue here, and are clustered at the galaxies\u2019 cores. Glowing dust, showing where it exists around and between stars \u2013 appearing in shades of red and orange. Stars that haven't yet fully formed and are encased in gas and dust appear bright red.\u003cref\u003e{{cite web |title=Webb reveals structure in 19 spiral galaxies |url=https:\u002f\u002fwww.esa.int\u002fScience_Exploration\u002fSpace_Science\u002fWebb\u002fWebb_reveals_structure_in_19_spiral_galaxies |date=29 January 2024 |publisher=[[ESA]] |access-date=30 January 2024 |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|[[Zooming in on the Andromeda Galaxy|''Zooming in on the Andromeda Galaxy'']] \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest images ever released by the [[Hubble Space Telescope]]\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == See also ==","--- Revision 29\u003cbr\u003e+++ Revision 30\u003cbr\u003e@@ -1065,7 +1065,7 @@\u003cbr\u003e \u003cgallery mode=\"packed\" heights=\"300\"\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}\u003cbr\u003e File:PHANGS image mosaic.jpg|19 face-on spiral galaxies from the [[James Webb Space Telescope]] in near- and mid-infrared light. Older stars appear blue here, and are clustered at the galaxies\u2019 cores. Glowing dust, showing where it exists around and between stars \u2013 appearing in shades of red and orange. Stars that haven't yet fully formed and are encased in gas and dust appear bright red.\u003cref\u003e{{cite web |title=Webb reveals structure in 19 spiral galaxies |url=https:\u002f\u002fwww.esa.int\u002fScience_Exploration\u002fSpace_Science\u002fWebb\u002fWebb_reveals_structure_in_19_spiral_galaxies |date=29 January 2024 |publisher=[[ESA]] |access-date=30 January 2024 |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|[[Zooming in on the Andromeda Galaxy|''Zooming in on the Andromeda Galaxy'']] \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest images ever released by the [[Hubble Space Telescope]]\u003cbr\u003e+File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|[[Zooming in on the Andromeda Galaxy|''Zooming in on the Andromeda Galaxy'']] \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest image ever released by the [[Hubble Space Telescope]]\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == See also ==","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -8,7 +8,7 @@\u003cbr\u003e \u003cbr\u003e A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e-Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e+Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The space between galaxies is filled with a tenuous gas (the [[Intergalactic space|intergalactic medium]]) with an average density of less than one [[atom]] per cubic metre. Most galaxies are gravitationally organised into [[galaxy group|groups]], [[galaxy cluster|clusters]] and [[supercluster]]s. The [[Milky Way]] is part of the [[Local Group]], which it dominates along with the [[Andromeda Galaxy]]. The group is part of the [[Virgo Supercluster]]. At the [[Large-scale structure of the Cosmos|largest scale]], these associations are generally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e@@ -580,7 +580,7 @@\u003cbr\u003e \u003cbr\u003e A giant radio galaxy is a special class of objects characterized by the presence of radio lobes generated by [[Astrophysical jet|relativistic jets]] powered by the central galaxy's [[supermassive black hole]]. Giant radio galaxies are different from ordinary radio galaxies in that they can extend to much larger scales, reaching upwards to several megaparsecs across, far larger than the diameters of their host galaxies.\u003cref\u003e{{Cite journal |last1=Oei |first1=Martijn S. S. L. |last2=van Weeren |first2=Reinout J. |last3=Hardcastle |first3=Martin J. |last4=Botteon |first4=Andrea |last5=Shimwell |first5=Tim W. |last6=Dabhade |first6=Pratik |last7=Gast |first7=Aivin R. D. J. G. I. B. |last8=R\u00f6ttgering |first8=Huub J. A. |last9=Br\u00fcggen |first9=Marcus |last10=Tasse |first10=Cyril |last11=Williams |first11=Wendy L. |last12=Shulevski |first12=Aleksandar |date=2022-04-01 |title=The discovery of a radio galaxy of at least 5 Mpc |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2022\u002f04\u002faa42778-21\u002faa42778-21.html |journal=[[Astronomy & Astrophysics]] |language=en |volume=660 |pages=A2 |arxiv=2202.05427 |bibcode=2022A&A...660A...2O |doi=10.1051\u002f0004-6361\u002f202142778 |issn=0004-6361}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-A \"normal\" radio galaxy do not have a source that is a supermassive black hole or monster neutron star; instead the source is [[synchrotron radiation]] from relativistic electrons accelerated by supernova. These sources are comparatively short lived, making the radio spectrum from normal radio galaxies an especially good way to study star formation. \u003cref\u003e{{Cite journal |last=Condon |first=J. J. |date=September 1992 |title=Radio Emission from Normal Galaxies |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev.aa.30.090192.003043 |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=30 |issue=1 |pages=575\u2013611 |doi=10.1146\u002fannurev.aa.30.090192.003043 |bibcode=1992ARA&A..30..575C |issn=0066-4146}}\u003c\u002fref\u003e\u003cbr\u003e+A \"normal\" radio galaxy do not have a source that is a supermassive black hole or monster neutron star; instead the source is [[synchrotron radiation]] from relativistic electrons accelerated by supernova. These sources are comparatively short lived, making the radio spectrum from normal radio galaxies an especially good way to study star formation.\u003cref\u003e{{Cite journal |last=Condon |first=J. J. |date=September 1992 |title=Radio Emission from Normal Galaxies |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev.aa.30.090192.003043 |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=30 |issue=1 |pages=575\u2013611 |doi=10.1146\u002fannurev.aa.30.090192.003043 |bibcode=1992ARA&A..30..575C |issn=0066-4146}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Active galaxy ===\u003cbr\u003e {{Main|Active galactic nucleus}}\u003cbr\u003e@@ -838,7 +838,7 @@\u003cbr\u003e  |bibcode=1982ApJ...257..389T\u003cbr\u003e  |doi=10.1086\u002f159999\u003cbr\u003e |doi-access=free\u003cbr\u003e- }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+ }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature (journal)|Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Magnetic fields==\u003cbr\u003e Galaxies have [[magnetic field]]s of their own. A galaxy's magnetic field influences its dynamics in multiple ways, including affecting the formation of spiral arms and transporting angular momentum in gas clouds. The latter effect is particularly important, as it is a necessary factor for the gravitational collapse of those clouds, and thus for star formation.\u003cref name=\"galactic_magnetic_fields\"\u003e{{Cite journal|title = Galactic magnetic fields|journal = [[Scholarpedia]] |volume = 2|issue = 8|page = 2411|last = Beck|first = Rainer|doi = 10.4249\u002fscholarpedia.2411|bibcode = 2007SchpJ...2.2411B |year = 2007|doi-access = free}}\u003c\u002fref\u003e\u003cbr\u003e@@ -1065,7 +1065,7 @@\u003cbr\u003e \u003cgallery mode=\"packed\" heights=\"300\"\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}\u003cbr\u003e File:PHANGS image mosaic.jpg|19 face-on spiral galaxies from the [[James Webb Space Telescope]] in near- and mid-infrared light. Older stars appear blue here, and are clustered at the galaxies\u2019 cores. Glowing dust, showing where it exists around and between stars \u2013 appearing in shades of red and orange. Stars that haven't yet fully formed and are encased in gas and dust appear bright red.\u003cref\u003e{{cite web |title=Webb reveals structure in 19 spiral galaxies |url=https:\u002f\u002fwww.esa.int\u002fScience_Exploration\u002fSpace_Science\u002fWebb\u002fWebb_reveals_structure_in_19_spiral_galaxies |date=29 January 2024 |publisher=[[ESA]] |access-date=30 January 2024 |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|[[Zooming in on the Andromeda Galaxy|''Zooming in on the Andromeda Galaxy'']] \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest image ever released by the [[Hubble Space Telescope]]\u003cbr\u003e+File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|''[[Zooming in on the Andromeda Galaxy]]'' \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest image ever released by the [[Hubble Space Telescope]]\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e@@ -1227,7 +1227,7 @@\u003cbr\u003e \u003cref name=Gibney_2014\u003e{{cite journal\u003cbr\u003e  | title=Earth's new address: 'Solar System, Milky Way, Laniakea'\u003cbr\u003e  | last=Gibney | first=Elizabeth |author-link=Elizabeth Gibney\u003cbr\u003e- | year=2014 | journal=[[Nature]]\u003cbr\u003e+ | year=2014 | journal=[[Nature (journal)|Nature]]\u003cbr\u003e  | s2cid = 124323774 | doi=10.1038\u002fnature.2014.15819 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=\"Plutarch\"\u003e{{cite book","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -4,11 +4,11 @@\u003cbr\u003e {{Featured article}}\u003cbr\u003e {{Use mdy dates|date=February 2015}}\u003cbr\u003e {{Use British English|date=June 2024}}\u003cbr\u003e-{{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about 55,000&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e+{{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about {{gaps|55|000}}&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e \u003cbr\u003e A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e-Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e+Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1000 to {{gaps|100|000}} [[parsec]]s in diameter (approximately 3000 to {{gaps|300|000}} [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least {{gaps|26|800}} parsecs ({{gaps|87|400}}&nbsp;ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over {{gaps|750|000}}&nbsp;parsecs (2.5&nbsp;million&nbsp;ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The space between galaxies is filled with a tenuous gas (the [[Intergalactic space|intergalactic medium]]) with an average density of less than one [[atom]] per cubic metre. Most galaxies are gravitationally organised into [[galaxy group|groups]], [[galaxy cluster|clusters]] and [[supercluster]]s. The [[Milky Way]] is part of the [[Local Group]], which it dominates along with the [[Andromeda Galaxy]]. The group is part of the [[Virgo Supercluster]]. At the [[Large-scale structure of the Cosmos|largest scale]], these associations are generally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e@@ -49,11 +49,11 @@\u003cbr\u003e In 1750, [[Thomas Wright (astronomer)|Thomas Wright]] correctly speculated that the Milky Way was a flattened disk of stars, and that some of the nebulae visible in the night sky might be separate Milky Ways.\u003cref name=\"our_galaxy\"\u002f\u003e\u003cref name=Dyson_1979\u002f\u003e\u003cbr\u003e [[File:Pic iroberts1.jpg|thumb|right|Photograph of the \"Great Andromeda Nebula\" by [[Isaac Roberts]], 1899, later identified as the [[Andromeda Galaxy]]]]\u003cbr\u003e \u003cbr\u003e-Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5,000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |jstor=24944338 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19\u201329 |doi=10.3724\u002fSP.J.1440-2807.2012.01.03 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e+Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |jstor=24944338 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19\u201329 |doi=10.3724\u002fSP.J.1440-2807.2012.01.03 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1912, [[Vesto M. Slipher]] made spectrographic studies of the brightest spiral nebulae to determine their composition. Slipher discovered that the spiral nebulae have high [[Doppler shift]]s, indicating that they are moving at a rate exceeding the velocity of the stars he had measured. He found that the majority of these nebulae are moving away from us.\u003cref name=Slipher_1913\u002f\u003e\u003cref name=Slipher_1915\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In 1917, [[Heber Doust Curtis]] observed nova [[S Andromedae]] within the \"Great [[Andromeda (constellation)|Andromeda]] Nebula\", as the Andromeda Galaxy, [[Messier object]] [[Andromeda Galaxy|M31]], was then known. Searching the photographic record, he found 11 more [[nova]]e. Curtis noticed that these novae were, on average, 10 [[magnitude (astronomy)|magnitudes]] fainter than those that occurred within this galaxy. As a result, he was able to come up with a distance estimate of 150,000&nbsp;[[parsec]]s. He became a proponent of the so-called \"island universes\" hypothesis, which holds that spiral nebulae are actually independent galaxies.\u003cref\u003e{{cite journal\u003cbr\u003e+In 1917, [[Heber Doust Curtis]] observed nova [[S Andromedae]] within the \"Great [[Andromeda (constellation)|Andromeda]] Nebula\", as the Andromeda Galaxy, [[Messier object]] [[Andromeda Galaxy|M31]], was then known. Searching the photographic record, he found 11 more [[nova]]e. Curtis noticed that these novae were, on average, 10 [[magnitude (astronomy)|magnitudes]] fainter than those that occurred within this galaxy. As a result, he was able to come up with a distance estimate of {{gaps|150|000}}&nbsp;[[parsec]]s. He became a proponent of the so-called \"island universes\" hypothesis, which holds that spiral nebulae are actually independent galaxies.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Curtis |first1=Heber D.\u003cbr\u003e  |author-link1 = Heber Doust Curtis\u003cbr\u003e  |date=1988\u003cbr\u003e@@ -284,7 +284,7 @@\u003cbr\u003e \u003cbr\u003e ====Type-cD galaxies====\u003cbr\u003e \u003cbr\u003e-[[Image:Galaxy Cluster Abell 1413.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over 800,000 light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e+[[Image:Galaxy Cluster Abell 1413.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over {{gaps|800|000}} light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e \u003cbr\u003e The [[List of largest galaxies|largest galaxies]] are the [[Type-cD galaxy|type-cD galaxies]].\u003cbr\u003e First described in 1964 by a paper by Thomas A. Matthews and others,\u003cref name=Matthews\u003e{{cite journal | url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1964ApJ...140...35M\u002fabstract | bibcode=1964ApJ...140...35M | title=A Discussion of Galaxies Indentified &#91;sic&#93; with Radio Sources | last1=Matthews | first1=Thomas A. | last2=Morgan | first2=William W. | last3=Schmidt | first3=Maarten | journal=[[The Astrophysical Journal]] | year=1964 | volume=140 | page=35 | doi=10.1086\u002f147890 }}\u003c\u002fref\u003e they are a subtype of the more general class of D galaxies, which are giant elliptical galaxies, except that they are much larger. They are popularly known as the '''supergiant elliptical galaxies''' and constitute the largest and most luminous galaxies known. These galaxies feature a central elliptical nucleus with an extensive, faint halo of stars extending to megaparsec scales.\u003cref name=\"NASAVlog\"\u003e{{cite web | url=https:\u002f\u002fwww.nasa.gov\u002fcontent\u002fdiscoveries-highlights-tracing-the-growth-of-galaxies |publisher=[[NASA]]|title=Tracing the Growth of Galaxies |access-date=April 20, 2024| date=6 February 2017 }}\u003c\u002fref\u003e The profile of their surface brightnesses as a function of their radius (or distance from their cores) falls off more slowly than their smaller counterparts.\u003cref name=Tonry\u003e{{cite book | chapter-url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1987IAUS..127...89T\u002fabstract | bibcode=1987IAUS..127...89T | last1=Tonry | first1=John L. | title=Structure and Dynamics of Elliptical Galaxies | chapter=Properties of cD Galaxies | year=1987 | volume=127 | page=89 | doi=10.1007\u002f978-94-009-3971-4_7 | isbn=978-90-277-2586-8 | s2cid=117980521 }}\u003c\u002fref\u003e\u003cbr\u003e@@ -387,7 +387,7 @@\u003cbr\u003e }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Super-luminous spiral ====\u003cbr\u003e-Recently, researchers described galaxies called super-luminous spirals. They are very large with an upward diameter of 437,000 light-years (compared to the Milky Way's 87,400 light-year diameter). With a mass of 340 billion solar masses, they generate a significant amount of ultraviolet and mid-infrared light. They are thought to have an increased star formation rate around 30 times faster than the Milky Way.\u003cref\u003e{{cite web|url=http:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy\u002f|title=We Just Discovered a New Type of Colossal Galaxy|last=Santos|first=Miguel|website=[[Futurism]]|language=en-US|access-date=2016-03-21|date=2016-03-21|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071443\u002fhttps:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Ogle|first1=Patrick M.|last2=Lanz|first2=Lauranne|last3=Nader|first3=Cyril|last4=Helou|first4=George|s2cid=35287348|date=2016-01-01|title=Superluminous Spiral Galaxies|journal=[[The Astrophysical Journal]]|language=en|volume=817|issue=2|page=109|doi=10.3847\u002f0004-637X\u002f817\u002f2\u002f109|issn=0004-637X|arxiv = 1511.00659 |bibcode = 2016ApJ...817..109O |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e+Recently, researchers described galaxies called super-luminous spirals. They are very large with an upward diameter of {{gaps|437|000}} light-years (compared to the Milky Way's {{gaps|87|400}} light-year diameter). With a mass of 340 billion solar masses, they generate a significant amount of ultraviolet and mid-infrared light. They are thought to have an increased star formation rate around 30 times faster than the Milky Way.\u003cref\u003e{{cite web|url=http:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy\u002f|title=We Just Discovered a New Type of Colossal Galaxy|last=Santos|first=Miguel|website=[[Futurism]]|language=en-US|access-date=2016-03-21|date=2016-03-21|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071443\u002fhttps:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Ogle|first1=Patrick M.|last2=Lanz|first2=Lauranne|last3=Nader|first3=Cyril|last4=Helou|first4=George|s2cid=35287348|date=2016-01-01|title=Superluminous Spiral Galaxies|journal=[[The Astrophysical Journal]]|language=en|volume=817|issue=2|page=109|doi=10.3847\u002f0004-637X\u002f817\u002f2\u002f109|issn=0004-637X|arxiv = 1511.00659 |bibcode = 2016ApJ...817..109O |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Other morphologies ===\u003cbr\u003e * [[Peculiar galaxy|Peculiar galaxies]] are galactic formations that develop unusual properties due to tidal interactions with other galaxies.\u003cbr\u003e@@ -851,7 +851,7 @@\u003cbr\u003e === Formation ===\u003cbr\u003e [[File:Artist's impression of a protocluster forming in the early Universe.jpg|right|thumb|Artist's impression of a protocluster forming in the early universe\u003cref\u003e{{cite press release|title=Construction Secrets of a Galactic Metropolis|url=http:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|publisher=[[European Southern Observatory]]|access-date=October 15, 2014|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071552\u002fhttps:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e-Current models of the formation of galaxies in the early universe are based on the [[Lambda-CDM model|\u039bCDM]] model. About 300,000 years after the [[Big Bang]], atoms of [[hydrogen]] and [[helium]] began to form, in an event called [[Recombination (cosmology)|recombination]]. Nearly all the hydrogen was neutral (non-ionized) and readily absorbed light, and no stars had yet formed. As a result, this period has been called the \"[[Timeline of the Big Bang#Dark Ages|dark ages]]\". It was from density fluctuations (or [[anisotropy|anisotropic]] irregularities) in this primordial matter that [[structure formation|larger structures]] began to appear. As a result, masses of [[baryon]]ic matter started to condense within [[cold dark matter]] halos.\u003cref name=\"hqrdvj\"\u003e{{cite web\u003cbr\u003e+Current models of the formation of galaxies in the early universe are based on the [[Lambda-CDM model|\u039bCDM]] model. About {{gaps|300|000}} years after the [[Big Bang]], atoms of [[hydrogen]] and [[helium]] began to form, in an event called [[Recombination (cosmology)|recombination]]. Nearly all the hydrogen was neutral (non-ionized) and readily absorbed light, and no stars had yet formed. As a result, this period has been called the \"[[Timeline of the Big Bang#Dark Ages|dark ages]]\". It was from density fluctuations (or [[anisotropy|anisotropic]] irregularities) in this primordial matter that [[structure formation|larger structures]] began to appear. As a result, masses of [[baryon]]ic matter started to condense within [[cold dark matter]] halos.\u003cref name=\"hqrdvj\"\u003e{{cite web\u003cbr\u003e  |date=November 18, 1999\u003cbr\u003e  |title=Protogalaxies\u003cbr\u003e  |url=http:\u002f\u002fcfa-www.harvard.edu\u002f~aas\u002ftenmeter\u002fproto.htm","--- Revision 32\u003cbr\u003e+++ Revision 33\u003cbr\u003e@@ -4,11 +4,11 @@\u003cbr\u003e {{Featured article}}\u003cbr\u003e {{Use mdy dates|date=February 2015}}\u003cbr\u003e {{Use British English|date=June 2024}}\u003cbr\u003e-{{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about {{gaps|55|000}}&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e+{{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about 55,000&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e \u003cbr\u003e A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e-Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1000 to {{gaps|100|000}} [[parsec]]s in diameter (approximately 3000 to {{gaps|300|000}} [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least {{gaps|26|800}} parsecs ({{gaps|87|400}}&nbsp;ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over {{gaps|750|000}}&nbsp;parsecs (2.5&nbsp;million&nbsp;ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e+Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The space between galaxies is filled with a tenuous gas (the [[Intergalactic space|intergalactic medium]]) with an average density of less than one [[atom]] per cubic metre. Most galaxies are gravitationally organised into [[galaxy group|groups]], [[galaxy cluster|clusters]] and [[supercluster]]s. The [[Milky Way]] is part of the [[Local Group]], which it dominates along with the [[Andromeda Galaxy]]. The group is part of the [[Virgo Supercluster]]. At the [[Large-scale structure of the Cosmos|largest scale]], these associations are generally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e@@ -49,11 +49,11 @@\u003cbr\u003e In 1750, [[Thomas Wright (astronomer)|Thomas Wright]] correctly speculated that the Milky Way was a flattened disk of stars, and that some of the nebulae visible in the night sky might be separate Milky Ways.\u003cref name=\"our_galaxy\"\u002f\u003e\u003cref name=Dyson_1979\u002f\u003e\u003cbr\u003e [[File:Pic iroberts1.jpg|thumb|right|Photograph of the \"Great Andromeda Nebula\" by [[Isaac Roberts]], 1899, later identified as the [[Andromeda Galaxy]]]]\u003cbr\u003e \u003cbr\u003e-Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |jstor=24944338 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19\u201329 |doi=10.3724\u002fSP.J.1440-2807.2012.01.03 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e+Toward the end of the 18th century, [[Charles Messier]] compiled a [[Messier object|catalog]] containing the 109 brightest celestial objects having nebulous appearance. Subsequently, William Herschel assembled a catalog of 5,000 nebulae.\u003cref name=\"our_galaxy\" \u002f\u003e In 1845, [[William Parsons, 3rd Earl of Rosse|Lord Rosse]] examined the nebulae catalogued by Herschel and observed the spiral structure of [[Whirlpool Galaxy|Messier object M51]], now known as the Whirlpool Galaxy.\u003cref\u003e{{Cite magazine |last=Payne-Gaposchkin |first=Cecilia H. |author-link=Cecilia Payne-Gaposchkin |date=1953 |title=Why Do Galaxies Have a Spiral Form? |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f24944338 |magazine=[[Scientific American]] |volume=189 |issue=3 |pages=89\u201399 |jstor=24944338 |issn=0036-8733}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Steinicke |first=Wolfgang |date=2012 |title=The M51 mystery: Lord Rosse, Robinson, South and the discovery of spiral structure in 1845 |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f2012JAHH...15...19S |journal=[[Journal of Astronomical History and Heritage]] |volume=15 |issue=1 |pages=19\u201329 |doi=10.3724\u002fSP.J.1440-2807.2012.01.03 |bibcode=2012JAHH...15...19S}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1912, [[Vesto M. Slipher]] made spectrographic studies of the brightest spiral nebulae to determine their composition. Slipher discovered that the spiral nebulae have high [[Doppler shift]]s, indicating that they are moving at a rate exceeding the velocity of the stars he had measured. He found that the majority of these nebulae are moving away from us.\u003cref name=Slipher_1913\u002f\u003e\u003cref name=Slipher_1915\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In 1917, [[Heber Doust Curtis]] observed nova [[S Andromedae]] within the \"Great [[Andromeda (constellation)|Andromeda]] Nebula\", as the Andromeda Galaxy, [[Messier object]] [[Andromeda Galaxy|M31]], was then known. Searching the photographic record, he found 11 more [[nova]]e. Curtis noticed that these novae were, on average, 10 [[magnitude (astronomy)|magnitudes]] fainter than those that occurred within this galaxy. As a result, he was able to come up with a distance estimate of {{gaps|150|000}}&nbsp;[[parsec]]s. He became a proponent of the so-called \"island universes\" hypothesis, which holds that spiral nebulae are actually independent galaxies.\u003cref\u003e{{cite journal\u003cbr\u003e+In 1917, [[Heber Doust Curtis]] observed nova [[S Andromedae]] within the \"Great [[Andromeda (constellation)|Andromeda]] Nebula\", as the Andromeda Galaxy, [[Messier object]] [[Andromeda Galaxy|M31]], was then known. Searching the photographic record, he found 11 more [[nova]]e. Curtis noticed that these novae were, on average, 10 [[magnitude (astronomy)|magnitudes]] fainter than those that occurred within this galaxy. As a result, he was able to come up with a distance estimate of 150,000&nbsp;[[parsec]]s. He became a proponent of the so-called \"island universes\" hypothesis, which holds that spiral nebulae are actually independent galaxies.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Curtis |first1=Heber D.\u003cbr\u003e  |author-link1 = Heber Doust Curtis\u003cbr\u003e  |date=1988\u003cbr\u003e@@ -284,7 +284,7 @@\u003cbr\u003e \u003cbr\u003e ====Type-cD galaxies====\u003cbr\u003e \u003cbr\u003e-[[Image:Galaxy Cluster Abell 1413.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over {{gaps|800|000}} light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e+[[Image:Galaxy Cluster Abell 1413.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over 800,000 light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e \u003cbr\u003e The [[List of largest galaxies|largest galaxies]] are the [[Type-cD galaxy|type-cD galaxies]].\u003cbr\u003e First described in 1964 by a paper by Thomas A. Matthews and others,\u003cref name=Matthews\u003e{{cite journal | url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1964ApJ...140...35M\u002fabstract | bibcode=1964ApJ...140...35M | title=A Discussion of Galaxies Indentified &#91;sic&#93; with Radio Sources | last1=Matthews | first1=Thomas A. | last2=Morgan | first2=William W. | last3=Schmidt | first3=Maarten | journal=[[The Astrophysical Journal]] | year=1964 | volume=140 | page=35 | doi=10.1086\u002f147890 }}\u003c\u002fref\u003e they are a subtype of the more general class of D galaxies, which are giant elliptical galaxies, except that they are much larger. They are popularly known as the '''supergiant elliptical galaxies''' and constitute the largest and most luminous galaxies known. These galaxies feature a central elliptical nucleus with an extensive, faint halo of stars extending to megaparsec scales.\u003cref name=\"NASAVlog\"\u003e{{cite web | url=https:\u002f\u002fwww.nasa.gov\u002fcontent\u002fdiscoveries-highlights-tracing-the-growth-of-galaxies |publisher=[[NASA]]|title=Tracing the Growth of Galaxies |access-date=April 20, 2024| date=6 February 2017 }}\u003c\u002fref\u003e The profile of their surface brightnesses as a function of their radius (or distance from their cores) falls off more slowly than their smaller counterparts.\u003cref name=Tonry\u003e{{cite book | chapter-url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1987IAUS..127...89T\u002fabstract | bibcode=1987IAUS..127...89T | last1=Tonry | first1=John L. | title=Structure and Dynamics of Elliptical Galaxies | chapter=Properties of cD Galaxies | year=1987 | volume=127 | page=89 | doi=10.1007\u002f978-94-009-3971-4_7 | isbn=978-90-277-2586-8 | s2cid=117980521 }}\u003c\u002fref\u003e\u003cbr\u003e@@ -387,7 +387,7 @@\u003cbr\u003e }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Super-luminous spiral ====\u003cbr\u003e-Recently, researchers described galaxies called super-luminous spirals. They are very large with an upward diameter of {{gaps|437|000}} light-years (compared to the Milky Way's {{gaps|87|400}} light-year diameter). With a mass of 340 billion solar masses, they generate a significant amount of ultraviolet and mid-infrared light. They are thought to have an increased star formation rate around 30 times faster than the Milky Way.\u003cref\u003e{{cite web|url=http:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy\u002f|title=We Just Discovered a New Type of Colossal Galaxy|last=Santos|first=Miguel|website=[[Futurism]]|language=en-US|access-date=2016-03-21|date=2016-03-21|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071443\u002fhttps:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Ogle|first1=Patrick M.|last2=Lanz|first2=Lauranne|last3=Nader|first3=Cyril|last4=Helou|first4=George|s2cid=35287348|date=2016-01-01|title=Superluminous Spiral Galaxies|journal=[[The Astrophysical Journal]]|language=en|volume=817|issue=2|page=109|doi=10.3847\u002f0004-637X\u002f817\u002f2\u002f109|issn=0004-637X|arxiv = 1511.00659 |bibcode = 2016ApJ...817..109O |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e+Recently, researchers described galaxies called super-luminous spirals. They are very large with an upward diameter of 437,000 light-years (compared to the Milky Way's 87,400 light-year diameter). With a mass of 340 billion solar masses, they generate a significant amount of ultraviolet and mid-infrared light. They are thought to have an increased star formation rate around 30 times faster than the Milky Way.\u003cref\u003e{{cite web|url=http:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy\u002f|title=We Just Discovered a New Type of Colossal Galaxy|last=Santos|first=Miguel|website=[[Futurism]]|language=en-US|access-date=2016-03-21|date=2016-03-21|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071443\u002fhttps:\u002f\u002ffuturism.com\u002fjust-discovered-new-type-colossal-galaxy|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Ogle|first1=Patrick M.|last2=Lanz|first2=Lauranne|last3=Nader|first3=Cyril|last4=Helou|first4=George|s2cid=35287348|date=2016-01-01|title=Superluminous Spiral Galaxies|journal=[[The Astrophysical Journal]]|language=en|volume=817|issue=2|page=109|doi=10.3847\u002f0004-637X\u002f817\u002f2\u002f109|issn=0004-637X|arxiv = 1511.00659 |bibcode = 2016ApJ...817..109O |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Other morphologies ===\u003cbr\u003e * [[Peculiar galaxy|Peculiar galaxies]] are galactic formations that develop unusual properties due to tidal interactions with other galaxie es (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}\u003cbr\u003e File:PHANGS image mosaic.jpg|19 face-on spiral galaxies from the [[James Webb Space Telescope]] in near- and mid-infrared light. Older stars appear blue here, and are clustered at the galaxies\u2019 cores. Glowing dust, showing where it exists around and between stars \u2013 appearing in shades of red and orange. Stars that haven't yet fully formed and are encased in gas and dust appear bright red.\u003cref\u003e{{cite web |title=Webb reveals structure in 19 spiral galaxies |url=https:\u002f\u002fwww.esa.int\u002fScience_Exploration\u002fSpace_Science\u002fWebb\u002fWebb_reveals_structure_in_19_spiral_galaxies |date=29 January 2024 |publisher=[[ESA]] |access-date=30 January 2024 |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|''[[Zooming in on the Andromeda Galaxy]]'' \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest image ever released by the [[Hubble Space Telescope]]\u003cbr\u003e+File:Andromeda Galaxy M31 - Heic1502a Full resolution.jpg|''[[Zooming In on the Andromeda Galaxy]]'' \u2013 A mosaic of the [[Andromeda Galaxy]] and the largest image ever released by the [[Hubble Space Telescope]]\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == See also ==","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -6,7 +6,7 @@\u003cbr\u003e {{Use British English|date=June 2024}}\u003cbr\u003e {{Multiple image |direction=vertical |align=right |width=310|image1=NGC 4414 (NASA-med).jpg|caption1=[[NGC 4414]], a typical [[spiral galaxy]] in the [[constellation]] [[Coma Berenices]], is about 55,000&nbsp;[[light-year]]s in diameter and approximately 60 million light-years from Earth.}}\u003cbr\u003e \u003cbr\u003e-A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e+A '''galaxy''' is a [[Physical system|system]] of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 |bibcode=2008Natur.454.1096S }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e Galaxies are categorised according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances in the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118|bibcode=1998Obs...118..201G }}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbour, by just over 750,000 parsecs (2.5 million ly).\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance to M31 from the Hubble Space Telescope Wide Field Camera 3|year=2012|last1=Riess|first1=Adam G.|author-link1=Adam Riess|last2=Fliri|first2=J\u00fcrgen|last3=Valls-Gabaud|first3=David|journal=The Astrophysical Journal|volume=745|issue=2|page=156|bibcode=2012ApJ...745..156R|s2cid=119113794}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 36\u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -127,7 +127,7 @@\u003cbr\u003e | image2 = Andromeda galaxy.jpg\u003cbr\u003e | caption2 = This ultraviolet image of [[Andromeda Galaxy|Andromeda]] shows blue regions containing young, massive stars.\u003cbr\u003e }}\u003cbr\u003e-Advances in astronomy have always been driven by technology. After centuries of success in [[optical astronomy]], [[infrared astronomy]] was attempted in the 1830s, but only blossomed in the early 1900s.  [[Radio astronomy]] was born in the 1930s, and matured by the 1950s and 1960s.  The problem was that air only allows visible light and radio waves to pas erally arranged into [[galaxy filament|sheets and filaments]] surrounded by immense [[void (astronomy)|voids]].\u003cref name=\"camb_lss\" \u002f\u003e Both the Local Group and the Virgo Supercluster are contained in a much larger cosmic structure named [[Laniakea Supercluster|Laniakea]].\u003cref name=Gibney_2014\u002f\u003e\u003cbr\u003e {{TOC limit|3}}\u003cbr\u003e \u003cbr\u003e == Etymology ==","--- Revision 38\u003cbr\u003e+++ Revision 39\u003cbr\u003e@@ -20,7 +20,7 @@\u003cbr\u003e \u003cbr\u003e {{Blockquote|See yonder, lo, the Galaxy\u00eb\u003cbr \u002f\u003e&nbsp;Which men {{linktext|clepe}}th ''the Milky Wey'',\u003cbr \u002f\u003e&nbsp;For hit is whyt.|Geoffrey Chaucer|''[[The House of Fame]]''\u003cref name=oed \u002f\u003e}}\u003cbr\u003e \u003cbr\u003e-Galaxies were initially discovered telescopically and were known as ''[[spiral nebula]]e''. Most 18th- to 19th-century astronomers considered them as either unresolved [[star cluster]]s or anagalactic [[nebula]]e, and were just thought of as a part of the Milky Way, but their true composition and natures remained a mystery. Observations using larger telescopes of a few nearby bright galaxies, like the [[Andromeda Galaxy]], began resolving them into huge conglomerations of stars, but based simply on the apparent faintness and sheer population of stars, the true distances of these objects placed them well beyond the Milky Way. For this reason they were popularly called ''island universes'', but this term quickly fell into disuse, as the word ''universe'' implied the entirety of existence. Instead, they became known simply as galaxies.\u003cref name=rao2005 \u002f\u003e\u003cbr\u003e+Galaxies were initially discovered telescopically and were known as ''[[spiral nebula]]e''. Most 18th- to 19th-century astronomers considered them as either unresolved [[star cluster]]s or [[Extragalactic astronomy|extragalactic]] nebulae, and were just thought of as a part of the Milky Way, but their true composition and na
