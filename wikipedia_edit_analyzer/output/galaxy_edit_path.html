erial.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e ","--- Revision 73\u003cbr\u003e+++ Revision 74\u003cbr\u003e@@ -700,7 +700,7 @@\u003cbr\u003e |doi-access=free\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e This first generation of stars re-ionized the surrounding neutral hydrogen, creating expanding bubbles of space through which light could readily travel.\u003cref\u003e{{cite journal\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e  |last2=Loeb","--- Revision 74\u003cbr\u003e+++ Revision 75\u003cbr\u003e@@ -664,7 +664,7 @@\u003cbr\u003e  |archive-date=2008-03-25\u003cbr\u003e  |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to stars, creating the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last=Dayal |first=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002}}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to stars, creating the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last=Dayal |first=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e ","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -669,6 +669,8 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e ==== Early galaxy formation ====\u003cbr\u003e+As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. Emission from the first stars heats the remaining gas helping to trigger additional star formation; the most massive stars collapse in violent [[supernova]] explosions further shaping the galaxy.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}}\u003cbr\u003e+\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cref\u003e{{cite arXiv|last=Carniani|first=Stefano|display-authors=etal|date=28 May 2024|title=A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z~14|eprint=2405.18485|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv|last=Robertson|first=Brant|display-authors=etal|date=28 May 2024|title=Earliest Galaxies in the JADES Origins Field: Luminosity Function and Cosmic Star-Formation Rate Density 300 Myr after the Big Bang|eprint=2312.10033v2|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref name=\"JadesPressRelease\"\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NASA\u2019s James Webb Space Telescope Finds Most Distant Known Galaxy|url=https:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240530143356\u002fhttps:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|access-date=5 June 2024|archive-date=30 May 2024|url-status=live|editor-last1=Fisher|editor-first1=Alise|editor-last2=Betz|editor-first2=Laura|editor-last3=Pulliam|editor-first3=Christine}}\u003c\u002fref\u003e JADES-GS-z14-0 is estimated to have existed only 290 million years after the Big Bang, when the universe was only about 2% of its present age.\u003cref name=\"JadesPressRelease\"\u002f\u003e\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170804\u002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e","--- Revision 76\u003cbr\u003e+++ Revision 77\u003cbr\u003e@@ -664,7 +664,7 @@\u003cbr\u003e  |archive-date=2008-03-25\u003cbr\u003e  |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to stars, creating the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last=Dayal |first=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last=Dayal |first=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e ","--- Revision 77\u003cbr\u003e+++ Revision 78\u003cbr\u003e@@ -668,7 +668,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e-==== Early galaxy formation ====\u003cbr\u003e+=== Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. Emission from the first stars heats the remaining gas helping to trigger additional star formation; the most massive stars collapse in violent [[supernova]] explosions further shaping the galaxy.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}}\u003cbr\u003e \u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cref\u003e{{cite arXiv|last=Carniani|first=Stefano|display-authors=etal|date=28 May 2024|title=A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z~14|eprint=2405.18485|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv|last=Robertson|first=Brant|display-authors=etal|date=28 May 2024|title=Earliest Galaxies in the JADES Origins Field: Luminosity Function and Cosmic Star-Formation Rate Density 300 Myr after the Big Bang|eprint=2312.10033v2|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref name=\"JadesPressRelease\"\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NASA\u2019s James Webb Space Telescope Finds Most Distant Known Galaxy|url=https:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240530143356\u002fhttps:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|access-date=5 June 2024|archive-date=30 May 2024|url-status=live|editor-last1=Fisher|editor-first1=Alise|editor-last2=Betz|editor-first2=Laura|editor-last3=Pulliam|editor-first3=Christine}}\u003c\u002fref\u003e JADES-GS-z14-0 is estimated to have existed only 290 million years after the Big Bang, when the universe was only about 2% of its present age.\u003cref name=\"JadesPressRelease\"\u002f\u003e\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170804\u002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -677,31 +677,6 @@\u003cbr\u003e \u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e-The existence of galaxies so soon after the Big Bang suggests that [[protogalaxy|protogalaxies]] must have grown in the so-called \"dark ages\".\u003cref name=\"hqrdvj\" \u002f\u003e The detailed process by which the earliest galaxies formed is an open question in astrophysics. Theories can be divided into two categories: top-down and bottom-up. In top-down correlations (such as the Eggen\u2013Lynden-Bell\u2013Sandage [ELS] model), protogalaxies form in a large-scale simultaneous collapse lasting about one hundred million years.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Eggen |first1=Olin J.\u003cbr\u003e- |author-link1=Olin J. Eggen\u003cbr\u003e- |last2=Lynden-Bell |first2=Donald\u003cbr\u003e- |author-link2=Donald Lynden-Bell\u003cbr\u003e- |last3=Sandage |first3=Allan R.\u003cbr\u003e- |author-link3=Allan Sandage\u003cbr\u003e- |date=1962\u003cbr\u003e- |title=Evidence from the motions of old stars that the Galaxy collapsed\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=136 |page=748\u003cbr\u003e- |bibcode=1962ApJ...136..748E\u003cbr\u003e- |doi=10.1086\u002f147433\u003cbr\u003e-}}\u003c\u002fref\u003e In bottom-up theories (such as the Searle-Zinn [SZ] model), small structures such as [[globular cluster]]s form first, and then a number of such bodies accrete to form a larger galaxy.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Searle |first1=L.\u003cbr\u003e- |last2=Zinn |first2=R.\u003cbr\u003e- |date=1978\u003cbr\u003e- |title=Compositions of halo clusters and the formation of the galactic halo\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=225 |issue=1 |pages=357\u2013379\u003cbr\u003e- |bibcode=1978ApJ...225..357S\u003cbr\u003e- |doi=10.1086\u002f156499\u003cbr\u003e-|doi-access=free\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -671,12 +671,6 @@\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. Emission from the first stars heats the remaining gas helping to trigger additional star formation; the most massive stars collapse in violent [[supernova]] explosions further shaping the galaxy.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}}\u003cbr\u003e \u003cbr\u003e-Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cref\u003e{{cite arXiv|last=Carniani|first=Stefano|display-authors=etal|date=28 May 2024|title=A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z~14|eprint=2405.18485|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv|last=Robertson|first=Brant|display-authors=etal|date=28 May 2024|title=Earliest Galaxies in the JADES Origins Field: Luminosity Function and Cosmic Star-Formation Rate Density 300 Myr after the Big Bang|eprint=2312.10033v2|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref name=\"JadesPressRelease\"\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NASA\u2019s James Webb Space Telescope Finds Most Distant Known Galaxy|url=https:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240530143356\u002fhttps:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|access-date=5 June 2024|archive-date=30 May 2024|url-status=live|editor-last1=Fisher|editor-first1=Alise|editor-last2=Betz|editor-first2=Laura|editor-last3=Pulliam|editor-first3=Christine}}\u003c\u002fref\u003e JADES-GS-z14-0 is estimated to have existed only 290 million years after the Big Bang, when the universe was only about 2% of its present age.\u003cref name=\"JadesPressRelease\"\u002f\u003e\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170804\u002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e-\u003cbr\u003e Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e@@ -695,6 +689,12 @@\u003cbr\u003e  |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e  }}\u003c\u002fref\u003e In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cref\u003e{{cite arXiv|last=Carniani|first=Stefano|display-authors=etal|date=28 May 2024|title=A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z~14|eprint=2405.18485|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv|last=Robertson|first=Brant|display-authors=etal|date=28 May 2024|title=Earliest Galaxies in the JADES Origins Field: Luminosity Function and Cosmic Star-Formation Rate Density 300 Myr after the Big Bang|eprint=2312.10033v2|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref name=\"JadesPressRelease\"\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NASA\u2019s James Webb Space Telescope Finds Most Distant Known Galaxy|url=https:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240530143356\u002fhttps:\u002f\u002fwebbtelescope.org\u002fcontents\u002fearly-highlights\u002fnasas-james-webb-space-telescope-finds-most-distant-known-galaxy|access-date=5 June 2024|archive-date=30 May 2024|url-status=live|editor-last1=Fisher|editor-first1=Alise|editor-last2=Betz|editor-first2=Laura|editor-last3=Pulliam|editor-first3=Christine}}\u003c\u002fref\u003e JADES-GS-z14-0 is estimated to have existed only 290 million years after the Big Bang, when the universe was only about 2% of its present age.\u003cref name=\"JadesPressRelease\"\u002f\u003e\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170 ous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -664,7 +664,7 @@\u003cbr\u003e  |archive-date=2008-03-25\u003cbr\u003e  |publisher=[[Harvard-Smithsonian Center for Astro ] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 82\u003cbr\u003e+++ Revision 83\u003cbr\u003e@@ -671,7 +671,7 @@\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. Emission from the first stars heats the remaining gas helping to trigger additional star formation; the most massive stars collapse in violent [[supernova]] explosions further shaping the galaxy.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}}\u003cbr\u003e \u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e  |last2=Loeb","--- Revision 83\u003cbr\u003e+++ Revision 84\u003cbr\u003e@@ -669,9 +669,10 @@\u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e \u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e-As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. Emission from the first stars heats the remaining gas helping to trigger additional star formation; the most massive stars collapse in violent [[supernova]] explosions further shaping the galaxy.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}}\u003cbr\u003e-\u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]] necessary for the later formation of planets and life as we know it.\u003cref\u003e{{cite journal|last1=Heger |first1=Alexander|last2=Woosley |first2=Stanford E.|author-link2=Stanford E. Woosley|s2cid=16050642|date=2002|title=The Nucleosynthetic Signature of Population III|journal=[[The Astrophysical Journal]]|volume=567 |issue=1 |pages=532\u2013543|bibcode=2002ApJ...567..532H|doi=10.1086\u002f338487|arxiv = astro-ph\u002f0107037}}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e The ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe.\u003cref\u003e{{cite journal\u003cbr\u003e+As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e+\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e+Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e  |last2=Loeb\u003cbr\u003e@@ -688,7 +689,9 @@\u003cbr\u003e  |arxiv=astro-ph\u002f0010468\u003cbr\u003e  |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e- }}\u003c\u002fref\u003e In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u002f\u003e\u003cbr\u003e+ }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e \u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e+\u003cbr\u003e+In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors.\u003cref\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez |first10=Vital |last11=Fujimoto |first11=Seiji |last12=Jung |first12=Intae |last13=Krips |first13=Melanie |last14=Larson |first14=Rebecca L. |last15=Papovich |first15=Casey |date=2023-10-26 |title=Confirmation and refutation of very luminous galaxies in the early Universe |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-023-06521-7 |journal=Nature |language=en |volume=622 |issue=7984 |pages=707\u2013711 |doi=10.1038\u002fs41586-023-06521-7 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604065929\u002fhttps:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|archive-date=4 June 2024}}\u003c\u002fref\u003e}}\u003cref\u003e{{cite arXiv|last=Carniani|first=Stefano|display-authors=etal|date=28 May 2024|title=A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z~14|eprint=2405.18485|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv|last=Robertson|first=Brant|display-authors=etal|date=28 May 2024|title=Earliest Galaxies in the JADES Origins Field: Luminosity Function and Cosmic Star-Formation Rate Density 300 Myr after the Big Bang|eprint=2312.10033v2|class=astro-ph.GA}}\u003c\u002fref\u003e\u003cref name=\"JadesPressRelease\"\u003e{{cite press release|work=[[James Webb Space Telescope]]|publisher=[[NASA]]|date=30 May 2024|title=NA rse was only about 2% of its present age.\u003cref name=\"JadesPressRelease\"\u002f\u003e\u003cref\u003e{{cite news|work=[[BBC News]]|url=https:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|url-status=live|first=Jonathan|last=Amos|archive-date=4 June 2024|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240604170804\u002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -671,7 +671,7 @@\u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e \u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e@@ -693,6 +693,8 @@\u003cbr\u003e \u003cbr\u003e Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors.\u003cref\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez |first10=Vital |last11=Fujimoto |first11=Seiji |last12=Jung |first12=Intae |last13=Krips |first13=Melanie |last14=Larson |first14=Rebecca L. |last15=Papovich |first15=Casey |date=2023-10-26 |title=Confirmation and refutation of very luminous galaxies in the early Universe |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-023-06521-7 |journal=Nature |language=en |volume=622 |issue=7984 |pages=707\u2013711 |doi=10.1038\u002fs41586-023-06521-7 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant galaxy seen at the time.\u003cref\u003e{{cite journal|last1=McMahon |first1=Richard|s2cid=28977650|date=2006|title=Astronomy: Dawn after the dark age|journal=[[Nature (journal)|Nature]]|volume=443 |issue=7108 |pages=151\u20132|doi=10.1038\u002f443151a|pmid=16971933|bibcode = 2006Natur.443..151M}}\u003c\u002fref\u003e In early 2023, the [[James Webb Space Telescope]] (JWST) discovered the galaxy [[JADES-GS-z14-0]], which showed evidence of a redshift value greater than 14. Subsequent spectroscopic observations by the [[Near-Infrared Spectrograph]] (NIRSpec) confirmed a redshift value of 14.32, establishing it as the earliest observed and most distant galaxy known.{{efn|It broke [[JADES-GS-z13-0]]'s previous record of 13.2.\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors=etal|first1=Brant|last1=Robertson|title=Identification and properties of intense star-forming galaxies at redshifts z \u003e 10|journal=[[Nature Astronomy]]|date=2023|volume=7|issue=5|pages =611\u2013621|doi=10.1038\u002fs41550-023-01921-1|arxiv=2212.04480|bibcode=2023NatAs...7..611R |s2cid=257968812}}\u003c\u002fref\u003e\u003cref name=\"RobertaLea\"\u003e{{cite web|title=James Webb Space Telescope spots the most distant galaxy ever seen (image)|url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-two-oldest-most-distant-galaxies|website=[[Space.com]]|first=Roberta|last=Lea|date=30 May 2024|access-date=5 June 2024|url-status=live 002fhttps:\u002f\u002fwww.bbc.co.uk\u002fnews\u002farticles\u002fcjeenyw8rd2o|date=31 May 2024|title=Earliest and most distant galaxy ever observed|access-date=5 June 2024}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Evidence for individual Population III stars in early galaxies is even more challenging. Even seemingly confirmed spectroscopic evidence may turn out to have other origins. For example, astronomers reported He\u003csub\u003eII\u003c\u002fsub\u003e emission evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e Subsequent observations\u003cref\u003e{{Cite journal |last=Bowler |first=R. A. A. |last2=McLure |first2=R. J. |last3=Dunlop |first3=J. S. |last4=McLeod |first4=D. J. |last5=Stanway |first5=E. R. |last6=Eldridge |first6=J. J. |last7=Jarvis |first7=M. J. |date=2017-04-05 |title=No evidence for Population III stars or a direct collapse black hole in the z\u00a0=\u00a06.6 Lyman\u2009\u03b1 emitter \u2018CR7\u2019 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002fmnras\u002fstx839 |journal=Monthly Notices of the Royal Astronomical Society |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |issn=0035-8711}}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}} \u003cbr\u003e \u003cbr\u003e The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified the galaxy JD1 to be the faintest one ever seen.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Spectroscopic observations using the NIRSpec instrument found a redshift value of 9.79, meaning JD1 was observed at 480 million years after the Big Bang.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |page=54 |doi=10.3847\u002f1538-4357\u002fad1a13 |doi-access=free |arxiv=2310.15232 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -691,8 +691,8 @@\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e  }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e \u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e \u003cbr\u003e-Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors.\u003cref\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez |first10=Vital |last11=Fujimoto |first11=Seiji |last12=Jung |
