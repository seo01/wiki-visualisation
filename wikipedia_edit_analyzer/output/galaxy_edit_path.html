d with a galaxy as large as Andromeda before, it has collided and merged with other galaxies in the past.\u003cref name=\"Buser\"\u003e{{Cite journal |last1=Buser |first1=Roland |title=The Formation and Early Evolution of the Milky Way Galaxy |doi=10.1126\u002fscience.287.5450.69 |bibcode=2000Sci...287...69B |journal=Science |volume=287 |issue=5450 |pages=69\u201374 |year=2000 |pmid=10615051 }}\u003c\u002fref\u003e Cosmological simulations indicate that, 11 billion years ago, it merged with a particularly large galaxy that has been labeled the [[Kraken galaxy|Kraken]].\u003cref\u003e{{Cite journal |last1=Kruijssen |first1=J M Diederik |last2=Pfeffer |first2=Joel L |last3=Chevance |first3=M\u00e9lanie |last4=Bonaca |first4=Ana |last5=Trujillo-Gomez |first5=Sebastian |last6=Bastian |first6=Nate |last7=Reina-Campos |first7=Marta |last8=Crain |first8=Robert A |last9=Hughes |first9=Meghan E |date=October 2020 |title=Kraken reveals itself \u2013 the merger history of the Milky Way reconstructed with the E-MOSAICS simulations |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle-abstract\u002f498\u002f2\u002f2472\u002f5893320 |url-status=live |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=498 |issue=2 |pages=2472\u20132491 |arxiv=2003.01119 |doi=10.1093\u002fmnras\u002fstaa2452}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Young |first=Monica |date=November 13, 2020 |title=Star Clusters reveal the \"Kraken\" in the Milky Way's Past |url=https:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115190620\u002fhttps:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |archive-date=November 15, 2020 |access-date=November 15, 2020 |website=[[Sky & Telescope]]}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Such large-scale interactions are rare. As time passes, mergers of two systems of equal size become less common. Most bright galaxies have remained fundamentally unchanged for the last few billion years, and the net rate of star formation probably also peaked about ten billion years ago.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Panter |first1=B.\u003cbr\u003e@@ -1002,8 +844,7 @@\u003cbr\u003e  |journal=[[Monthly Notices of the Royal Astronomical Society]]\u003cbr\u003e  |volume=378 |issue=4 |pages=1550\u20131564\u003cbr\u003e  |arxiv=astro-ph\u002f0608531\u003cbr\u003e- |doi=10.1111\u002fj.1365-2966.2007.11909.x |doi-access=free\u003cbr\u003e- |bibcode=2007MNRAS.378.1550P\u003cbr\u003e+ |doi=10.1111\u002fj.1365-2966.2007.11909.x |bibcode=2007MNRAS.378.1550P\u003cbr\u003e }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Future trends ===\u003cbr\u003e@@ -1021,7 +862,7 @@\u003cbr\u003e  |doi=10.1086\u002f174790\u003cbr\u003e }}\u003c\u002fref\u003e Elliptical galaxies are largely devoid of this gas, and so form few new stars.\u003cref\u003e{{cite book\u003cbr\u003e  |last1=Knapp\u003cbr\u003e- |first1=Gillian R.\u003cbr\u003e+ |first1=Gillian R. \u003cbr\u003e  |author-link1=Gillian Knapp\u003cbr\u003e  |date=1999\u003cbr\u003e  |title=Star Formation in Early Type Galaxies\u003cbr\u003e@@ -1061,11 +902,212 @@\u003cbr\u003e  |url-status=dead\u003cbr\u003e  }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+== Larger-scale structures ==\u003cbr\u003e+{{Main|Observable universe#Large-scale structure|Galaxy filament|Galaxy groups and clusters}}\u003cbr\u003e+{{multiple image\u003cbr\u003e+| align = left\u003cbr\u003e+| direction = vertical\u003cbr\u003e+| width = 230\u003cbr\u003e+| image1 = Seyfert Sextet full.jpg\u003cbr\u003e+| width1 =\u003cbr\u003e+| alt1 =\u003cbr\u003e+| caption1 = [[Seyfert's Sextet]] is an example of a compact galaxy group.\u003cbr\u003e+| image2 =\u003cbr\u003e+| width2 =\u003cbr\u003e+| alt2 =\u003cbr\u003e+| caption2 = [[Millennium Simulation]] showing large-scale structure of the Cosmos. The image spans about 400 million light years across.\u003cbr\u003e+}}\u003cbr\u003e+\u003cbr\u003e+Deep-sky surveys show that galaxies are often found in groups and [[Clusters of galaxies|clusters]]. Solitary galaxies that have not significantly interacted with other galaxies of comparable mass in the past few billion years are relatively scarce.\u003cref\u003e{{Cite journal |last=Argudo-Fern\u00e1ndez |first=M. |last2=Verley |first2=S. |last3=Bergond |first3=G. |last4=Duarte Puertas |first4=S. |last5=Ramos Carmona |first5=E. |last6=Sabater |first6=J. |last7=Fern\u00e1ndez Lorenzo |first7=M. |last8=Espada |first8=D. |last9=Sulentic |first9=J. |last10=Ruiz |first10=J. E. |last11=Leon |first11=S. |date=June 2015 |title=Catalogues of isolated galaxies, isolated pairs, and isolated triplets in the local Universe |url=http:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f201526016 |journal=[[Astronomy & Astrophysics]] |volume=578 |pages=A110 |doi=10.1051\u002f0004-6361\u002f201526016 |issn=0004-6361|arxiv=1504.00117 }}\u003c\u002fref\u003e Only about 5% of the galaxies surveyed are isolated in this sense.\u003cref\u003e{{Cite journal |last=Karachentsev |first=I. D. |last2=Makarov |first2=D. I. |last3=Karachentseva |first3=V. E. |last4=Melnyk |first4=O. V. |date=January 2011 |title=Catalog of nearby isolated galaxies in the volume z \u003c 0.01 |url=http:\u002f\u002flink.springer.com\u002f10.1134\u002fS1990341311010019 |journal=Astrophysical Bulletin |language=en |volume=66 |issue=1 |pages=1\u201327 |arxiv=1103.3990 |doi=10.1134\u002fS1990341311010019 |issn=1990-3413}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Melnyk |first=O. |last2=Karachentseva |first2=V. |last3=Karachentsev |first3=I. |date=2015-08-01 |title=Star formation rates in isolated galaxies selected from the Two-Micron All-Sky Survey |url=http:\u002f\u002facademic.oup.com\u002fmnras\u002farticle\u002f451\u002f2\u002f1482\u002f1750461\u002fStar-formation-rates-in-isolated-galaxies-selected |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=451 |issue=2 |pages=1482\u20131495 |doi=10.1093\u002fmnras\u002fstv950 |issn=1365-2966|arxiv=1504.07990 }}\u003c\u002fref\u003e However, they may have interacted and even merged with other galaxies in the past,\u003cref\u003e{{Cite journal |last=Hirschmann |first=Michaela |last2=De Lucia |first2=Gabriella |last3=Iovino |first3=Angela |last4=Cucciati |first4=Olga |date=2013-08-01 |title=Isolated galaxies in hierarchical galaxy formation models \u2013 present-day properties and environmental histories |url=http:\u002f\u002facademic.oup.com\u002fmnras\u002farticle\u002f433\u002f2\u002f1479\u002f1750237\u002fIsolated-galaxies-in-hierarchical-galaxy-formation |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=433 |issue=2 |pages=1479\u20131491 |arxiv=1302.3616 |bibcode=2013MNRAS.433.1479H |doi=10.1093\u002fmnras\u002fstt827 |issn=1365-2966}}\u003c\u002fref\u003e and may still be orbited by smaller satellite galaxies.\u003cref\u003e{{Cite journal |last=Wang |first=Wenting |last2=White |first2=Simon D. M. |date=2012-08-21 |title=Satellite abundances around bright isolated galaxies: Satellite abundances |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle-lookup\u002fdoi\u002f10.1111\u002fj.1365-2966.2012.21256.x |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=424 |issue=4 |pages=2574\u20132598 |arxiv=1203.0009 |bibcode=2012MNRAS.424.2574W |doi=10.1111\u002fj.1365-2966.2012.21256.x}}\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+On the largest scale, the universe is continually expanding, resulting in an average increase in the separation between individual galaxies (see [[Hubble's law]]). Associations of galaxies can overcome this expansion on a local scale through their mutual gravitational attraction. These associations formed early, as clumps of dark matter pulled their respective galaxies together. Nearby groups later merged to form larger-scale clusters. This ongoing merging process, as well as an influx of infalling gas, heats the intergalactic gas in a cluster to very high temperatures of 30\u2013100 [[megakelvin]]s.\u003cref\u003e{{cite web\u003cbr\u003e+ |url=http:\u002f\u002fchandra.harvard.edu\u002fxray_sources\u002fgalaxy_clusters.html\u003cbr\u003e+ |title=Groups & Clusters of Galaxies\u003cbr\u003e+ |website=[[Chandra X-ray Observatory]]\u003cbr\u003e+ |publisher=[[Harvard\u2013Smithsonian Center for Astrophysics]]\u003cbr\u003e+ |access-date=January 15, 2007\u003cbr\u003e+ |archive-date=February 22, 2024\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240222032114\u002fhttps:\u002f\u002fchandra.harvard.edu\u002fxray_sources\u002fgalaxy_clusters.html\u003cbr\u003e+ |url-status=live\u003cbr\u003e+ }}\u003c\u002fref\u003e About 70\u201380% of a cluster's mass is in the form of dark matter, with 10\u201330% consisting of this heated gas and the remaining few percent in the form of galaxies.\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Ricker\u003cbr\u003e+ |first1=Paul\u003cbr\u003e+ |title=When Galaxy Clusters Collide\u003cbr\u003e+ |url=http:\u002f\u002fwww.sdsc.edu\u002fpub\u002fenvision\u002fv15.2\u002fricker.html\u003cbr\u003e+ |website=[[San Diego Supercomputer Center]]\u003cbr\u003e+ |publisher=[[University of California, San Diego]]\u003cbr\u003e+ |access-date=April 21, 2024\u003cbr\u003e+ |archive-date=August 2, 2023\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230802142051\u002fhttps:\u002f\u002fwww.sdsc.edu\u002fpub\u002fenvision\u002fv15.2\u002fricker.html\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Most galaxies are gravitationally bound to a number of other galaxies. These form a [[fractal]]-like hierarchical distribution of clustered structures, with the smallest such associations being termed groups. A group of galaxies is the most common type of galactic cluster; these formations contain the majority of galaxies (as well as most of the [[baryon]]ic mass) in the universe.\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Pompei|first1=Emanuela\u003cbr\u003e+ |last2=Dahlem|first2=Michael\u003cbr\u003e+ |last3=Iovino|first3=Angela\u003cbr\u003e+ |editor-last=Dahlem |editor-first=Michael\u003cbr\u003e+ |date=November 24, 2006\u003cbr\u003e+ |title=Optical and radio survey of Southern Compact Groups of galaxies\u003cbr\u003e+ |url=http:\u002f\u002fwww.atnf.csiro.au\u002fpeople\u002fmdahlem\u002fsci\u002fSCGs.html\u003cbr\u003e+ |publisher=[[University of Birmingham]] Astrophysics and Space Research Group\u003cbr\u003e+ |access-date=January 15, 2007\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070613151936\u002fhttp:\u002f\u002fwww.atnf.csiro.au\u002fpeople\u002fmdahlem\u002fsci\u002fSCGs.html\u003cbr\u003e+ |archive-date=June 13, 2007\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Ponman |first1=Trevor\u003cbr\u003e+ |date=February 25, 2005\u003cbr\u003e+ |title=Galaxy Systems: Groups\u003cbr\u003e+ |url=http:\u002f\u002fwww.sr.bham.ac.uk\u002fresearch\u002fgroups.html\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20090215023446\u002fhttp:\u002f\u002fwww.sr.bham.ac.uk\u002fresearch\u002fgroups.html\u003cbr\u003e+ |archive-date=2009-02-15\u003cbr\u003e+ |publisher=[[University of Birmingham]] Astrophysics and Space Research Group\u003cbr\u003e+ |access-date=January 15, 2007\u003cbr\u003e+}}\u003c\u002fref\u003e To remain gravitationally bound to such a group, each member galaxy must have a sufficiently low velocity to prevent it from escaping (see [[Virial theorem]]). If there is insufficient [[kinetic energy]], however, the group may evolve into a smaller number of galaxies through mergers.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Girardi |first1=Marisa\u003cbr\u003e+ |last2=Giuricin |first2=G.\u003cbr\u003e+ |s2cid=14059401\u003cbr\u003e+ |date=2000\u003cbr\u003e+ |title=The Observational Mass Function of Loose Galaxy Groups\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=540 |issue=1 |pages=45\u201356\u003cbr\u003e+ |bibcode=2000ApJ...540...45G\u003cbr\u003e+ |doi=10.1086\u002f309314\u003cbr\u003e+|arxiv = astro-ph\u002f0004149 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+\u003c!---{{unsolved|physics|The [[List of largest cosmic structures|largest structures]] in the universe are larger than expected. Are these actual structures or random density fluctuations?}}---\u003e\u003cbr\u003e+Clusters of galaxies consist of hundreds to thousands of galaxies bound together by gravity.\u003cref name=\"Hubble protocluster\"\u003e{{cite press release|title=Hubble Pinpoints Furthest Protocluster of Galaxies Ever Seen|url=http:\u002f\u002fwww.spacetelescope.org\u002fnews\u002fheic1201\u002f|access-date=January 22, 2015|publisher=[[NASA]], [[European Space Agency]]|archive-date=June 12, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180612140011\u002fhttp:\u002f\u002fwww.spacetelescope.org\u002fnews\u002fheic1201\u002f|url-status=live}}\u003c\u002fref\u003e Clusters of galaxies are often dominated by a single giant elliptical galaxy, known as the [[brightest cluster galaxy]], which, over time, [[tidal force|tidally]] destroys its satellite galaxies and adds their mass to its own.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last         = Dubinski\u003cbr\u003e+ |first        = John\u003cbr\u003e+ |s2cid = 3137328\u003cbr\u003e+ |date         = 1998\u003cbr\u003e+ |title        = The Origin of the Brightest Cluster Galaxies\u003cbr\u003e+ |url          = https:\u002f\u002fweb.archive.org\u002fweb\u002f20110514155953\u002fhttp:\u002f\u002fwww.cita.utoronto.ca\u002f~dubinski\u002fbcg\u002f\u003cbr\u003e+ |journal      = [[The Astrophysical Journal]]\u003cbr\u003e+ |volume       = 502\u003cbr\u003e+ |issue        = 2\u003cbr\u003e+ |pages        = 141\u2013149\u003cbr\u003e+ |doi          = 10.1086\u002f305901\u003cbr\u003e+ |bibcode      = 1998ApJ...502..141D\u003cbr\u003e+ |arxiv        = astro-ph\u002f9709102\u003cbr\u003e+ |df           = mdy-all\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:The southern plane of the Milky Way from the ATLASGAL survey.jpg|right|thumb|Southern plane of the Milky Way from submillimeter wavelengths\u003cref\u003e{{cite web|title=ATLASGAL Survey of Milky Way Completed|publisher=[[European Southern Observatory]]|url=http:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1606\u002f|access-date=7 March 2016|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324074529\u002fhttps:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1606\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e+[[Supercluster]]s contain tens of thousands of galaxies, which are found in clusters, groups and sometimes individually. At the [[large-scale structure of the Cosmos|supercluster scale]], galaxies are arranged into sheets and filaments surrounding vast empty voids.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Bahcall |first1=Neta A.\u003cbr\u003e+ |date=1988\u003cbr\u003e+ |title=Large-scale structure in the Universe indicated by galaxy clusters\u003cbr\u003e+ |journal=[[Annual Review of Astronomy and Astrophysics]]\u003cbr\u003e+ |volume=26\u003cbr\u003e+ |issue=1 |pages=631\u2013686\u003cbr\u003e+ |bibcode=1988ARA&A..26..631B\u003cbr\u003e+ |doi=10.1146\u002fannurev.aa.26.090188.003215\u003cbr\u003e+}}\u003c\u002fref\u003e Above this scale, the universe appears to be the same in all directions ([[isotropy|isotropic]] and [[wikt:Homogeneity|homogeneous]]),\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Mandolesi |first1=Nazzareno\u003cbr\u003e+ |s2cid=4349689\u003cbr\u003e+ |display-authors=etal\u003cbr\u003e+ |date=1986\u003cbr\u003e+ |title=Large-scale homogeneity of the Universe measured by the microwave background\u003cbr\u003e+ |journal=[[Letters to Nature]]\u003cbr\u003e+ |volume=319\u003cbr\u003e+ |issue=6056 |pages=751\u2013753\u003cbr\u003e+ |doi=10.1038\u002f319751a0\u003cbr\u003e+|bibcode = 1986Natur.319..751M }}\u003c\u002fref\u003e though this notion has been challenged in recent years by numerous findings of large-scale structures that appear to be exceeding this scale. The [[Hercules\u2013Corona Borealis Great Wall]], currently the [[List of largest cosmic structures|largest structure]] in the universe found so far, is 10 billion [[light-year]]s (three gigaparsecs) in length.\u003cref name=HBHT2\u003e{{cite journal|last1=Horv\u00e1th|first1=Istv\u00e1n|last2=Bagoly|first2=Zsolt|last3=Hakkila|first3=Jon|last4=T\u00f3th|first4=L. Viktor|s2cid=56073380|title=New data support the existence of the Hercules\u2013Corona Borealis Great Wall|journal=[[Astronomy & Astrophysics]]|volume = 584|pages = A48|arxiv=1510.01933|year = 2015|doi = 10.1051\u002f0004-6361\u002f201424829|bibcode = 2015A&A...584A..48H }}\u003c\u002fref\u003e\u003cref name=HBHT\u003e{{cite journal|last1=Horv\u00e1th|first1=Istv\u00e1n|last2=Bagoly|first2=Zsolt|last3=Hakkila|first3=Jon|last4=T\u00f3th|first4=L. Viktor|title=Anomalies in the GRB spatial distribution|journal=Proceedings of Science|page=78|arxiv=1507.05528|bibcode = 2014styd.confE..78H |year=2014|doi=10.22323\u002f1.233.0078 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=cookie\u003e{{Cite journal|arxiv =1507.00675 |last1 = Balazs|first1 = L. G.|title = A giant ring-like structure at 0.78\u003cz\u003c0.86 displayed by GRBs|journal = [[Monthly Notices of the Royal Astronomical Society]]|volume = 452|issue = 3|page = 2236|last2 =  Bagoly|first2 = Zsolt|last3 =  Hakkila|first3 = Jon E.|last4 = Horv\u00e1th|first4 = I.|last5 = Kobori|first5 = J.|last6 = Racz|first6 = I.|last7 = T\u00f3th|first7 = Laszlo V.|s2cid = 109936564|year = 2015|doi = 10.1093\u002fmnras\u002fstv1421|bibcode = 2015MNRAS.452.2236B }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Milky Way galaxy is a member of an association named the [[Local Group]], a relatively small group of galaxies that has a diameter of approximately one&nbsp;megaparsec. The Milky Way and the Andromeda Galaxy are the two brightest galaxies within the group; many of the other member galaxies are dwarf companions of these two.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=van den Bergh |first1=Sidney\u003cbr\u003e+ |author-link1=Sidney van den Bergh\u003cbr\u003e+ |s2cid=1805423\u003cbr\u003e+ |date=2000\u003cbr\u003e+ |title=Updated Information on the Local Group\u003cbr\u003e+ |journal=[[Publications of the Astronomical Society of the Pacific]]\u003cbr\u003e+ |volume=112 |issue=770 |pages=529\u2013536\u003cbr\u003e+ |bibcode=2000PASP..112..529V\u003cbr\u003e+ |doi=10.1086\u002f316548\u003cbr\u003e+|arxiv = astro-ph\u002f0001040 }}\u003c\u002fref\u003e The Local Group itself is a part of a cloud-like structure within the [[Virgo Supercluster]], a large, extended structure of groups and clusters of galaxies centered on the [[Virgo Cluster]].\u003cref name=\"tully1982\"\u003e{{cite journal\u003cbr\u003e+ |last1=Tully |first1=Richard Brent\u003cbr\u003e+ |author-link1=R. Brent Tully\u003cbr\u003e+ |date=1982\u003cbr\u003e+ |title=The Local Supercluster\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=257 |pages=389\u2013422\u003cbr\u003e+ |bibcode=1982ApJ...257..389T\u003cbr\u003e+ |doi=10.1086\u002f159999\u003cbr\u003e+|doi-access=free\u003cbr\u003e+ }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+== Multi-wavelength observation ==\u003cbr\u003e+{{See also|Observational astronomy}}\u003cbr\u003e+{{multiple image\u003cbr\u003e+| align = right\u003cbr\u003e+| direction = vertical\u003cbr\u003e+| width = 220\u003cbr\u003e+| image1 =\u003cbr\u003e+| caption1 = A visual light image of [[Andromeda Galaxy]] shows the emission of ordinary stars and the light reflected by dust.\u003cbr\u003e+| image2 = Andromeda galaxy.jpg\u003cbr\u003e+| caption2 = This ultraviolet image of [[Andromeda Galaxy|Andromeda]] shows blue regions containing young, massive stars.\u003cbr\u003e+}}\u003cbr\u003e+Advances in astronomy have always been driven by technology. After centuries of success in [[optical astronomy]], recent decades have seen major progress in other regions of the [[electromagnetic spectrum]].\u003cref\u003e{{Cite book |last=Rieke |first=George Henry |author-link=George H. Rieke\u003cbr\u003e+|title=Measuring the Universe: A Multiwavelength Perspective |date=2012 |publisher=[[Cambridge University Press]] |isbn=978-0-521-76229-8 |page=xi}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The [[cosmic dust|dust]] present in the interstellar medium is opaque to visual light. It is more transparent to [[far infrared astronomy|far-infrared]], which can be used to observe the interior regions of giant molecular clouds and [[Bulge (astronomy)|galactic cores]] in great detail.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=Near, Mid & Far Infrared\u003cbr\u003e+ |url=http:\u002f\u002fwww.ipac.caltech.edu\u002fOutreach\u002fEdu\u002fRegions\u002firregions.html\u003cbr\u003e+ |website=[[Infrared Processing and Analysis Center]]\u003cbr\u003e+ |publisher=[[California Institute of Technology]]\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20061230203454\u002fhttp:\u002f\u002fwww.ipac.caltech.edu\u002fOutreach\u002fEdu\u002fRegions\u002firregions.html\u003cbr\u003e+ |archive-date=December 30, 2006\u003cbr\u003e+}}\u003c\u002fref\u003e Infrared is also used to observe distant, [[redshift|red-shifted]] galaxies that were formed much earlier. Water vapor and [[carbon dioxide]] absorb a number of useful portions of the infrared spectrum, so high-altitude or space-based telescopes are used for [[infrared astronomy]].{{sfn|Fraknoi et al.|2023|pp=[https:\u002f\u002fopenstax.org\u002fbooks\u002fastronomy-2e\u002fpages\u002f5-2-the-electromagnetic-spectrum 144], [https:\u002f\u002fopenstax.org\u002fbooks\u002fastronomy-2e\u002fpages\u002f6-5-observations-outside-earths-atmosphere 202]}}\u003cbr\u003e+\u003cbr\u003e+The first non-visual study of galaxies, particularly active galaxies, was made using [[radio astronomy|radio frequencies]]. The Earth's atmosphere is nearly transparent to radio between 5&nbsp;[[Hertz|MHz]] and 30&nbsp;GHz. The [[ionosphere]] blocks signals below this range.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=The Effects of Earth's Upper Atmosphere on Radio Signals\u003cbr\u003e+ |url=http:\u002f\u002fradiojove.gsfc.nasa.gov\u002feducation\u002feduc\u002fradio\u002ftran-rec\u002fexerc\u002fiono.htm\u003cbr\u003e+ |publisher=[[NASA]]\u003cbr\u003e+ |access-date=August 10, 2006\u003cbr\u003e+ |archive-date=May 7, 2012\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120507101534\u002fhttp:\u002f\u002fradiojove.gsfc.nasa.gov\u002feducation\u002feduc\u002fradio\u002ftran-rec\u002fexerc\u002fiono.htm\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e Large radio [[interferometry|interferometers]] have been used to map the active jets emitted from active nuclei. [[Radio telescope]]s can also be used to observe neutral hydrogen (via [[hydrogen line|21&nbsp;cm radiation]]), including, potentially, the non-ionized matter in the early universe that later collapsed to form galaxies.\u003cref\u003e{{cite web\u003cbr\u003e+ |title=Giant Radio Telescope Imaging Could Make Dark Matter Visible\u003cbr\u003e+ |url=https:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e+ |website=[[ScienceDaily]]\u003cbr\u003e+ |author=Max Planck Society\u003cbr\u003e+ |date=December 14, 2006\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=July 3, 2017\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170703211527\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e+ |url-status=live\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[UV astronomy|Ultraviolet]] and [[X-ray astronomy|X-ray telescopes]] can observe highly energetic galactic phenomena. Ultraviolet flares are sometimes observed when a star in a distant galaxy is torn apart from the tidal forces of a nearby black hole.\u003cref\u003e{{cite news\u003cbr\u003e+ |title=NASA Telescope Sees Black Hole Munch on a Star\u003cbr\u003e+ |url=http:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e+ |website=[[Galaxy Evolution Explorer]]\u003cbr\u003e+ |publisher=[[NASA]]\u003cbr\u003e+ |date=December 5, 2006\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=April 25, 2010\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100425205637\u002fhttp:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e The distribution of hot gas in galactic clusters can be mapped by X-rays. The existence of supermassive black holes at the cores of galaxies was confirmed through X-ray astronomy.\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Dunn\u003cbr\u003e+ |first1=Robert\u003cbr\u003e+ |title=An Introduction to X-ray Astronomy\u003cbr\u003e+ |url=http:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e+ |publisher=[[Institute of Astronomy, Cambridge|Institute of Astronomy]] X-Ray Group\u003cbr\u003e+ |date=August 9, 2005\u003cbr\u003e+ |access-date=January 2, 2007\u003cbr\u003e+ |archive-date=February 24, 2024\u003cbr\u003e+ |archive-url=https:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e+ |url-status=live\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e == Gallery ==\u003cbr\u003e-\u003cgallery mode=\"packed\" heights=\"300\"\u003e\u003cbr\u003e+\u003cgallery mode=packed heights=300\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}\u003cbr\u003e File:PHANGS image mosaic.jpg|19 face-on spiral galaxies from the [[James Webb Space Telescope]] in near- and mid-infrared light. Older stars appear blue here, and are clustered at the galaxies\u2019 cores. Glowing dust, showing where it exists around and between stars \u2013 appearing in shades of red and orange. Stars that haven't yet fully formed and are encased in gas and dust appear bright red.\u003cref\u003e{{cite web |title=Webb reveals structure in 19 spiral galaxies |url=https:\u002f\u002fwww.esa.int\u002fScience_Exploration\u002fSpace_Science\u002fWebb\u002fWebb_reveals_structure_in_19_spiral_galaxies |date=29 January 2024 |publisher=[[ESA]] |access-date=30 nce to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e+A '''galaxy''' is a system of [[star]]s, [[stellar remnant]]s, [[interstellar medium|interstellar gas]], [[cosmic dust|dust]], and [[dark matter]] bound together by [[gravity]].\u003cref name=\"sparkegallagher2000\" \u002f\u003e\u003cref name=nasa060812 \u002f\u003e The word is derived from the [[Ancient Greek|Greek]] ''{{transliteration|grc|galaxias}}'' ({{lang|grc|\u03b3\u03b1\u03bb\u03b1\u03be\u03af\u03b1\u03c2}}), literally 'milky', a reference to the [[Milky Way]] galaxy that contains the [[Solar System]]. Galaxies, averaging an estimated 100 million stars,\u003cref name=\"SPC-20220211\"\u002f\u003e range in size from [[dwarf galaxy|dwarfs]] with less than a thousand stars,\u003cref\u003e{{Cite journal |last1=Strigari |first1=Louis E. |last2=Bullock |first2=James S. |last3=Kaplinghat |first3=Manoj |last4=Simon |first4=Joshua D. |last5=Geha |first5=Marla|author5-link= Marla Geha |last6=Willman |first6=Beth |last7=Walker |first7=Matthew G. |date=2008 |title=A common mass scale for satellite galaxies of the Milky Way |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fnature07222 |journal=Nature |language=en |volume=454 |issue=7208 |pages=1096\u20131097 |doi=10.1038\u002fnature07222 |pmid=18756252 |issn=0028-0836|arxiv=0808.3772 }}\u003c\u002fref\u003e to the [[List of largest galaxies|largest galaxies known]] \u2013 [[Type-cD galaxy|supergiants]] with one hundred [[10^12|trillion]] stars, each orbiting its galaxy's [[center of mass]]. Most of the mass in a typical galaxy is in the form of [[dark matter]], with only a few percent of that mass visible in the form of stars and nebulae. [[Supermassive black hole]]s are a common feature at the centres of galaxies.\u003cbr\u003e \u003cbr\u003e Galaxies are categorized according to their visual [[morphology (astronomy)|morphology]] as [[elliptical galaxy|elliptical]],\u003cref name=uf030616 \u002f\u003e [[Spiral galaxy|spiral]], or [[irregular galaxy|irregular]].\u003cref name=\"IRatlas\" \u002f\u003e The Milky Way is an example of a spiral galaxy. It is estimated that there are between 200 billion\u003cref name=\"jpost\" \u002f\u003e ({{val|2e11}}) to 2 trillion\u003cref name=\"Saunders_2023\" \u002f\u003e galaxies in the [[observable universe]]. Most galaxies are 1,000 to 100,000 [[parsec]]s in diameter (approximately 3,000 to 300,000 [[light year]]s) and are separated by distances on the order of millions of parsecs (or megaparsecs). For comparison, the Milky Way has a diameter of at least 26,800 parsecs (87,400 ly)\u003cref name=\"MilkyWaySize\"\u003e{{cite journal|url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998Obs...118..201G&defaultprint=YES&filetype=.pdf|last1=Goodwin|first1=Simon P.|last2=Gribbin|first2=John|author-link2=John Gribbin|last3=Hendry|first3=Martin A.|title=The relative size of the Milky Way|year=1998|pages=201\u2013208|journal=[[The Observatory (journal)|The Observatory]]|volume=118}}\u003c\u002fref\u003e{{efn|This is the diameter measured using the [[Galaxy#Isophotal_diameter|D\u003csub\u003e25\u003c\u002fsub\u003e standard]]. A 2018 study suggested that there is a presence of disk stars beyond this diameter, although it is not clear how much of this influences the surface brightness profile.\u003cref\u003e{{Cite journal |last1=L\u00f3pez-Corredoira |first1=M. |last2=Allende Prieto |first2=C. |last3=Garz\u00f3n |first3=F. |last4=Wang |first4=H. |last5=Liu |first5=C. |last6=Deng |first6=L. |date=9 April 2018 |title=Disk stars in the Milky Way detected beyond 25 kpc from its center |url=https:\u002f\u002fwww.aanda.org\u002farticles\u002faa\u002fabs\u002f2018\u002f04\u002faa32880-18\u002faa32880-18.html |journal=[[Astronomy & Astrophysics]] |volume=612 |pages=L8 |arxiv=1804.03064 |bibcode=2018A&A...612L...8L |doi=10.1051\u002f0004-6361\u002f201832880 |s2cid=59933365}}\u003c\u002fref\u003e\u003cref\u003e{{cite press release |last=Freeman |first=David |title=The Milky Way galaxy may be much bigger than we thought |url=https:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |date=May 25, 2018 |publisher=[[CNBC]] |access-date=August 13, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180813182050\u002fhttps:\u002f\u002fwww.nbcnews.com\u002fmach\u002fscience\u002fmilky-way-galaxy-may-be-much-bigger-we-thought-ncna876966 |archive-date=August 13, 2018 |url-status=live}}\u003c\u002fref\u003e}} and is separated from the [[Andromeda Galaxy]], its nearest large neighbor, by just over 750,000 parsecs (2.5 million ly.)\u003cref\u003e{{cite journal|arxiv=1110.3769|doi=10.1088\u002f0004-637X\u002f745\u002f2\u002f156|title=Cepheid Period-Luminosity Relations in the Near-Infrared and the Distance uminous still and form stars at rates \u003e180&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e.  Many LIRGs also emit radiation from an AGN.\u003cref\u003e{{Cite journal |last1=P\u00e9rez-Torres |first1=Miguel |last2=Mattila |first2=Seppo |last3=Alonso-Herrero |first3=Almudena |last4=Aalto |first4=Susanne |last5=Efstathiou |first5=Andreas |date=December 2021 |title=Star formation and nuclear activity in luminous infrared galaxies: an infrared through radio review |url=https:\u002f\u002flink.springer.com\u002f10.1007\u002fs00159-020-00128-x |journal=The Astronomy and Astrophysics Review |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M. |last3=Colina |first3=L. |last4=Labiano |first4=A. |last5=S\u00e1nchez-Garc\u00eda |first5=M. |last6=Alonso-Herrero |first6=A. |last7=Arribas |first7=S. |last8=Garc\u00eda-Burillo |first8=S. |last9=Villar-Mart\u00edn |first9=M. |last10=Rigopoulou |first10=D. |last11=Valentino |first11=F. |last12=Puglisi |first12=A. |last13=D\u00edaz-Santos |first13=T. |last14=Cazzoli |first14=S. |last15=Usero |first15=A. |date=August 2022 |title=Compact molecular gas emission in local LIRGs among low- and high- z galaxies |url=https:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f202142802 |journal=[[Astronomy & Astrophysics]] |volume=664 |pages=A60 |doi=10.1051\u002f0004-6361\u002f202142802 |issn=0004-6361|arxiv=2204.02055 |bibcode=2022A&A...664A..60B }}\u003c\u002fref\u003e Infrared galaxies emit more energy in the infrared than all other wavelengths combined, with peak emission typically at wavelengths of 60 to 100 microns. LIRGs are believed to be created from the strong interaction and merger of   spiral galaxies.\u003cref\u003e{{Cite journal |last1=Sanders |first1=David B. |last2=Mirabel |first2=I. F. |date=Sep 1996 |title=Luminous Infrared Galaxies |url=https:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fSanders\u002fpaper.pdf |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=34 |issue=1 |pages=749\u2013792 [772-773] |doi=10.1146\u002fannurev.astro.34.1.749 |bibcode=1996ARA&A..34..749S|issn=0066-4146}}\u003c\u002fref\u003e While uncommon in the local universe, LIRGs and ULIRGS were more prevalent when the universe was younger.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e+Luminous infrared galaxies (LIRGs) are galaxies with luminosities\u2014the measurement of electromagnetic power output\u2014above 10\u003csup\u003e11\u003c\u002fsup\u003e L\u2609 (solar luminosities). In most cases, most of their energy comes from large numbers of young stars which heat surrounding dust, which reradiates the energy in the infrared.  Luminosity high enough to be a LIRG requires a star formation rate of at least 18&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e. Ultra-luminous infrared galaxies (ULIRGs) are at least ten times more luminous still and form stars at rates \u003e180&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e.  Many LIRGs also emit radiation from an AGN.\u003cref\u003e{{Cite journal |last1=P\u00e9rez-Torres |first1=Miguel |last2=Mattila |first2=Seppo |last3=Alonso-Herrero |first3=Almudena |last4=Aalto |first4=Susanne |last5=Efstathiou |first5=Andreas |date=December 2021 |title=Star formation and nuclear activity in luminous infrared galaxies: an infrared through radio review |url=https:\u002f\u002flink.springer.com\u002f10.1007\u002fs00159-020-00128-x |journal=[[The Astronomy and Astrophysics Review]] |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M.
