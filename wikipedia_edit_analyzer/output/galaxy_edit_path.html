ses\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e- |website=[[ScienceDaily]]\u003cbr\u003e- |author=Max Planck Society\u003cbr\u003e- |date=December 14, 2006\u003cbr\u003e- |access-date=January 2, 2007\u003cbr\u003e- |archive-date=July 3, 2017\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170703211527\u002fhttps:\u002f\u002fwww.sciencedaily.com\u002freleases\u002f2006\u002f12\u002f061214135537.htm\u003cbr\u003e- |url-status=live\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[UV astronomy|Ultraviolet]] and [[X-ray astronomy|X-ray telescopes]] can observe highly energetic galactic phenomena. Ultraviolet flares are sometimes observed when a star in a distant galaxy is torn apart from the tidal forces of a nearby black hole.\u003cref\u003e{{cite news\u003cbr\u003e- |title=NASA Telescope Sees Black Hole Munch on a Star\u003cbr\u003e- |url=http:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e- |website=[[Galaxy Evolution Explorer]]\u003cbr\u003e- |publisher=[[NASA]]\u003cbr\u003e- |date=December 5, 2006\u003cbr\u003e- |access-date=January 2, 2007\u003cbr\u003e- |archive-date=April 25, 2010\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100425205637\u002fhttp:\u002f\u002fwww.nasa.gov\u002fmission_pages\u002fgalex\u002fgalex-20061205.html\u003cbr\u003e- |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e The distribution of hot gas in galactic clusters can be mapped by X-rays. The existence of supermassive black holes at the cores of galaxies was confirmed through X-ray astronomy.\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Dunn\u003cbr\u003e- |first1=Robert\u003cbr\u003e- |title=An Introduction to X-ray Astronomy\u003cbr\u003e- |url=http:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e- |publisher=[[Institute of Astronomy, Cambridge|Institute of Astronomy]] X-Ray Group\u003cbr\u003e- |date=August 9, 2005\u003cbr\u003e- |access-date=January 2, 2007\u003cbr\u003e- |archive-date=January 1, 2007\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070101105849\u002fhttp:\u002f\u002fwww-xray.ast.cam.ac.uk\u002fxray_introduction\u002f\u003cbr\u003e- |url-status=live\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e == Gallery ==\u003cbr\u003e \u003cgallery mode=packed heights=300\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -713,225 +713,6 @@\u003cbr\u003e \u003cbr\u003e The standard aperture ellipse (area of detection) is defined by the infrared isophote at the [[K band (infrared)|K\u003csub\u003es\u003c\u002fsub\u003e band]] (roughly 2.2 \u03bcm wavelength) of 20 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e. Gathering the overall luminous flux of the galaxy has been employed by at least four methods: the first being a circular aperture extending 7 arcseconds from the center, an isophote at 20 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e, a \"total\" aperture defined by the radial light distribution that covers the supposed extent of the galaxy, and the Kron aperture (defined as 2.5 times the first-moment radius, an integration of the flux of the \"total\" aperture).\u003cref name=Jarrett \u002f\u003e\u003cbr\u003e \u003cbr\u003e-==Magnetic fields==\u003cbr\u003e-Galaxies have [[magnetic field]]s of their own. A galaxy's magnetic field influences its dynamics in multiple ways, including affecting the formation of spiral arms and transporting angular momentum in gas clouds. The latter effect is particularly important, as it is a necessary factor for the gravitational collapse of those clouds, and thus for star formation.\u003cref name=\"galactic_magnetic_fields\"\u003e{{Cite journal|title = Galactic magnetic fields|journal = [[Scholarpedia]] |volume = 2|issue = 8|page = 2411|last = Beck|first = Rainer|doi = 10.4249\u002fscholarpedia.2411|bibcode = 2007SchpJ...2.2411B |year = 2007|doi-access = free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The typical average [[Equipartition theorem|equipartition]] strength for [[Spiral galaxy|spiral galaxies]] is about 10 \u03bcG ([[Gauss (unit)|microgauss]]) or 1{{nbsp}}nT ([[Tesla (unit)|nanotesla]]). By comparison, the Earth's magnetic field has an average strength of about 0.3 G (Gauss) or 30 \u03bcT ([[Tesla (unit)|microtesla]]). Radio-faint galaxies like [[Andromeda Galaxy|M 31]] and [[Triangulum Galaxy|M33]], the [[Milky Way]]'s neighbors, have weaker fields (about 5{{nbsp}}\u03bcG), while gas-rich galaxies with high star-formation rates, like M 51, M 83 and NGC 6946, have 15 \u03bcG on average. In prominent spiral arms, the field strength can be up to 25 \u03bcG, in regions where cold gas and dust are also concentrated. The strongest total equipartition fields (50\u2013100 \u03bcG) were found in [[Starburst galaxy|starburst galaxies]]\u2014for example, in M 82 and the [[Antennae Galaxies|Antennae]]; and in nuclear starburst regions, such as the centers of NGC 1097 and other [[Barred spiral galaxy|barred galaxies]].\u003cref name=\"galactic_magnetic_fields\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== Formation and evolution ==\u003cbr\u003e-{{Main|Galaxy formation and evolution}}\u003cbr\u003e-\u003cbr\u003e-=== Formation ===\u003cbr\u003e-[[File:Artist's impression of a protocluster forming in the early Universe.jpg|right|thumb|Artist's impression of a protocluster forming in the early universe\u003cref\u003e{{cite press release|title=Construction Secrets of a Galactic Metropolis|url=http:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|publisher=[[European Southern Observatory]]|access-date=October 15, 2014|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071552\u002fhttps:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e-\u003cbr\u003e-Current models of the formation of galaxies in the early universe are based on the [[Lambda-CDM model|\u039bCDM]] model. About 300,000 years after the [[Big Bang]], atoms of [[hydrogen]] and [[helium]] began to form, in an event called [[Recombination (cosmology)|recombination]]. Nearly all the hydrogen was neutral (non-ionized) and readily absorbed light, and no stars had yet formed. As a result, this period has been called the \"[[Timeline of the Big Bang#Dark Ages|dark ages]]\". It was from density fluctuations (or [[anisotropy|anisotropic]] irregularities) in this primordial matter that [[structure formation|larger structures]] began to appear. As a result, masses of [[baryon]]ic matter started to condense within [[cold dark matter]] halos.\u003cref name=\"hqrdvj\"\u003e{{cite web\u003cbr\u003e- |date=November 18, 1999\u003cbr\u003e- |title=Protogalaxies\u003cbr\u003e- |url=http:\u002f\u002fcfa-www.harvard.edu\u002f~aas\u002ftenmeter\u002fproto.htm\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080325183740\u002fhttp:\u002f\u002fcfa-www.harvard.edu\u002f~aas\u002ftenmeter\u002fproto.htm\u003cbr\u003e- |archive-date=2008-03-25\u003cbr\u003e- |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e- |access-date=January 10, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e-\u003cbr\u003e-=== Early galaxy formation ===\u003cbr\u003e-As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e-\u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e-Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Barkana\u003cbr\u003e- |first1=Rennan\u003cbr\u003e- |last2=Loeb\u003cbr\u003e- |first2=Abraham\u003cbr\u003e- |author-link2=Avi Loeb\u003cbr\u003e- |s2cid=119094218\u003cbr\u003e- |year=2001\u003cbr\u003e- |title=In the beginning: the first sources of light and the reionization of the Universe\u003cbr\u003e- |journal=[[Physics Reports]]\u003cbr\u003e- |volume=349\u003cbr\u003e- |issue=2\u003cbr\u003e- |pages=125\u2013238\u003cbr\u003e- |bibcode=2001PhR...349..125B\u003cbr\u003e- |arxiv=astro-ph\u002f0010468\u003cbr\u003e- |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e- |archive-date=March 14, 2021\u003cbr\u003e- }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e \u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e-\u003cbr\u003e-Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors. For example, a high redshift (z ~ 16) photometric observation by [[James Webb Space Telescope]] (JWST) was later corrected to be closer to z ~ 5.\u003cref name=ConfirmRefute\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez |first10=Vital |last11=Fujimoto |first11=Seiji |last12=Jung |first12=Intae |last13=Krips |first13=Melanie |last14=Larson |first14=Rebecca L. |last15=Papovich |first15=Casey |date=2023-10-26 |title=Confirmation and refutation of very luminous galaxies in the early Universe |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-023-06521-7 |journal=Nature |language=en |volume=622 |issue=7984 |pages=707\u2013711 |doi=10.1038\u002fs41586-023-06521-7 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e-Nevertheless, confirmed observations from the JWST and other observatories are accumulating, allowing systematic comparison of early galaxies to predictions of theory.\u003cref\u003e{{Cite journal |last=Boylan-Kolchin |first=Michael |date=2023-04-13 |title=Stress testing \u039bCDM with high-redshift galaxy candidates |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41550-023-01937-7 |journal=Nature Astronomy |language=en |volume=7 |issue=6 |pages=731\u2013735 |doi=10.1038\u002fs41550-023-01937-7 |issn=2397-3366 |pmc=PMC10281863 |pmid=37351007}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Evidence for individual Population III stars in early galaxies is even more challenging. Even seemingly confirmed spectroscopic evidence may turn out to have other origins. For example, astronomers reported He\u003csub\u003eII\u003c\u002fsub\u003e emission evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e Subsequent observations\u003cref\u003e{{Cite journal |last=Bowler |first=R. A. A. |last2=McLure |first2=R. J. |last3=Dunlop |first3=J. S. |last4=McLeod |first4=D. J. |last5=Stanway |first5=E. R. |last6=Eldridge |first6=J. J. |last7=Jarvis |first7=M. J. |date=2017-04-05 |title=No evidence for Population III stars or a direct collapse black hole in the z\u00a0=\u00a06.6 Lyman\u2009\u03b1 emitter \u2018CR7\u2019 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002fmnras\u002fstx839 |journal=Monthly Notices of the Royal Astronomical Society |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |issn=0035-8711}}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}} \u003cbr\u003e-\u003cbr\u003e-[[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e-\u003cbr\u003e-=== Evolution ===\u003cbr\u003e-Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e- |date        = February 9, 2005\u003cbr\u003e- |title       = Simulations Show How Growing Black Holes Regulate Galaxy Formation\u003cbr\u003e- |url         = http:\u002f\u002fwww.cmu.edu\u002fPR\u002freleases05\u002f050209_blackhole.html\u003cbr\u003e- |publisher   = [[Carnegie Mellon University]]\u003cbr\u003e- |access-date  = January 7, 2007\u003cbr\u003e- |url-status  = dead\u003cbr\u003e- |archive-url  = https:\u002f\u002fweb.archive.org\u002fweb\u002f20120331130051\u002fhttp:\u002f\u002fwww.cmu.edu\u002fPR\u002freleases05\u002f050209_blackhole.html\u003cbr\u003e- |archive-date = March 31, 2012\u003cbr\u003e- |df          = mdy-all\u003cbr\u003e-}}\u003c\u002fref\u003e During this early epoch, galaxies undergo a major burst of star formation.\u003cref\u003e{{cite news\u003cbr\u003e- |last1=Massey |first1=Robert\u003cbr\u003e- |last2=Heward |first2=Anita\u003cbr\u003e- |date=April 21, 2007\u003cbr\u003e- |title=Caught in the act; forming galaxies captured in the young Universe\u003cbr\u003e- |url=http:\u002f\u002fwww.ras.org.uk\u002findex.php?option=com_content&task=view&id=1190&Itemid=2\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131115031412\u002fhttp:\u002f\u002fwww.ras.org.uk\u002findex.php?option=com_content&task=view&id=1190&Itemid=2\u003cbr\u003e- |archive-date=2013-11-15\u003cbr\u003e- |publisher=[[Royal Astronomical Society]]\u003cbr\u003e- |access-date=April 20, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-During the following two billion years, the accumulated matter settles into a [[disc (galaxy)|galactic disc]].\u003cref\u003e{{cite journal\u003cbr\u003e- |last=Noguchi |first=Masafumi\u003cbr\u003e- |s2cid=17963236\u003cbr\u003e- |date=1999\u003cbr\u003e- |title=Early Evolution of Disk Galaxies: Formation of Bulges in Clumpy Young Galactic Disks\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=514 |issue=1 |pages=77\u201395\u003cbr\u003e- |bibcode=1999ApJ...514...77N\u003cbr\u003e- |doi=10.1086\u002f306932\u003cbr\u003e-|arxiv = astro-ph\u002f9806355 }}\u003c\u002fref\u003e A galaxy will continue to absorb infalling material from [[high-velocity cloud]]s and [[dwarf galaxy|dwarf galaxies]] throughout its life.\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Baugh |first1=Carlton\u003cbr\u003e- |last2=Frenk |first2=Carlos\u003cbr\u003e- |date=May 1999\u003cbr\u003e- |url=http:\u002f\u002fphysicsweb.org\u002farticles\u002fworld\u002f12\u002f5\u002f9\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070426043157\u002fhttp:\u002f\u002fphysicsweb.org\u002farticles\u002fworld\u002f12\u002f5\u002f9\u003cbr\u003e- |archive-date=2007-04-26\u003cbr\u003e- |title=How are galaxies made?\u003cbr\u003e- |publisher=[[Institute of Physics]]\u003cbr\u003e- |access-date=January 16, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e This matter is mostly hydrogen and helium. The cycle of stellar birth and death slowly increases the abundance of heavy elements, eventually allowing the [[planetary formation|formation]] of [[planet]]s.\u003cref\u003e{{cite conference\u003cbr\u003e- |last1=Gonzalez |first1=Guillermo\u003cbr\u003e- |date=1998\u003cbr\u003e- |title=The Stellar Metallicity&nbsp;\u2014 Planet Connection\u003cbr\u003e- |url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998ASPC..134..431G&defaultprint=YES&filetype=.pdf\u003cbr\u003e- |editor-last1=Rebolo |editor-first1=Rafael\u003cbr\u003e- |editor-last2=Martin |editor-first2=Eduardo L.\u003cbr\u003e- |editor-last3=Osorio |editor-first3=Maria Rosa Zapatero\u003cbr\u003e- |journal=Brown Dwarfs and Extrasolar Planets \u003cbr\u003e- |series=ASP Conference Series\u003cbr\u003e- |volume=134\u003cbr\u003e- |pages=431\u2013437\u003cbr\u003e- |bibcode=1998ASPC..134..431G\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cbr\u003e-{{Multiple image |direction=vertical |align=right |width=200 |image1=XDF-scale.jpg|image2=The Hubble eXtreme Deep Field.jpg |image3=XDF-separated.jpg |caption1=''[[Hubble Extreme Deep Field|XDF]]'' view field compared to the [[angular diameter|angular size]] of the [[Moon]]. Several thousand galaxies, each consisting of billions of [[star]]s, are in this small view. |caption2=''[[Hubble Extreme Deep Field|XDF]]'' (2012) view: Each light speck is a galaxy, some of which are as old as 13.2 billion years\u003cref name=\"Space-20120925\"\u003e{{cite web |last=Moskowitz |first=Clara | author-link= Clara Moskowitz |title=Hubble Telescope Reveals Farthest View Into Universe Ever |url=http:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |date=September 25, 2012 |website=[[Space.com]] |access-date=September 26, 2012 |archive-date=May 5, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200505111220\u002fhttps:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |url-status=live }}\u003c\u002fref\u003e&nbsp;\u2013 the [[observable universe]] is estimated to contain 200 billion to two trillion galaxies. |caption3=''[[Hubble Extreme Deep Field|XDF]]'' image shows (from left) fully mature galaxies, nearly mature galaxies (from five to nine billion years ago), and [[Protogalaxy|protogalaxies]], blazing with [[young star]]s (beyond nine billion years). |header=''[[Hubble Extreme Deep Field|Hubble eXtreme Deep Field (XDF)]]'' }}\u003cbr\u003e-\u003cbr\u003e-Star formation rates in galaxies depend upon their local environment. Isolated 'void' galaxies have highest rate per stellar mass, with 'field' galaxies associated with spiral galaxies having lower rates and galaxies in dense cluster having the lowest rates.\u003cref\u003e{{Cite journal |last1=Rojas |first1=Randall R. |last2=Vogeley |first2=Michael S. |last3=Hoyle |first3=Fiona |last4=Brinkmann |first4=Jon |date=2005-05-10 |title=Spectroscopic Properties of Void Galaxies in the Sloan Digital Sky Survey |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1086\u002f428476 |journal=[[The Astrophysical Journal]] |language=en |volume=624 |issue=2 |pages=571\u2013585 |doi=10.1086\u002f428476 |issn=0004-637X|arxiv=astro-ph\u002f0409074 |bibcode=2005ApJ...624..571R }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The evolution of galaxies can be significantly affected by interactions and collisions. Mergers of galaxies were common during the early epoch, and the majority of galaxies were peculiar in morphology.\u003cref name=\"sa296\"\u003e{{cite magazine\u003cbr\u003e- |last1=Conselice |first1=Christopher J.\u003cbr\u003e- |date=February 2007\u003cbr\u003e- |title=The Universe's Invisible Hand\u003cbr\u003e- |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fthe-universes-invisible-hand\u002f\u003cbr\u003e- |url-access=subscription\u003cbr\u003e- |magazine=[[Scientific American]]\u003cbr\u003e- |volume=296 |issue=2 |pages=35\u201341\u003cbr\u003e- |doi=10.1038\u002fscientificamerican0207-34\u003cbr\u003e-|bibcode = 2007SciAm.296b..34C }}\u003c\u002fref\u003e Given the distances between the stars, the great majority of stellar systems in colliding galaxies will be unaffected. However, gravitational stripping of the interstellar gas and dust that makes up the spiral arms produces a long train of stars known as tidal tails. Examples of these formations can be seen in [[NGC 4676]]\u003cref\u003e{{cite press release\u003cbr\u003e- |last1=Ford\u003cbr\u003e- |first1=H.\u003cbr\u003e- |display-authors=etal\u003cbr\u003e- |date=April 30, 2002\u003cbr\u003e- |title=The Mice (NGC 4676): Colliding Galaxies With Tails of Stars and Gas\u003cbr\u003e- |url=http:\u002f\u002fhubblesite.org\u002fnewscenter\u002farchive\u002freleases\u002f2002\u002f11\u002fimage\u002fd\u003cbr\u003e- |website=Hubble News Desk\u003cbr\u003e- |publisher=[[NASA]]\u003cbr\u003e- |access-date=May 8, 2007\u003cbr\u003e- |archive-date=September 7, 2016\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160907062239\u002fhttp:\u002f\u002fhubblesite.org\u002fnewscenter\u002farchive\u002freleases\u002f2002\u002f11\u002fimage\u002fd\u002f\u003cbr\u003e- |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e or the [[Antennae Galaxies]].\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Struck |first1=Curtis\u003cbr\u003e- |s2cid=119369136\u003cbr\u003e- |date=1999\u003cbr\u003e- |title=Galaxy Collisions\u003cbr\u003e- |doi=10.1016\u002fS0370-1573(99)00030-7\u003cbr\u003e- |journal=[[Physics Reports]]\u003cbr\u003e- |volume=321\u003cbr\u003e- |issue=1\u20133\u003cbr\u003e- |pages=1\u2013137\u003cbr\u003e- |arxiv=astro-ph\u002f9908269\u003cbr\u003e-|bibcode = 1999PhR...321....1S }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Milky Way galaxy and the nearby Andromeda Galaxy are moving toward each other at about 130&nbsp;[[metre per second|km\u002fs]], and\u2014depending upon the lateral movements\u2014the two might collide in about five to six billion years. Although the Milky Way has never collided with a galaxy as large as Andromeda before, it has collided and merged with other galaxies in the past.\u003cref name=\"Buser\"\u003e{{Cite journal |last1=Buser |first1=Roland |title=The Formation and Early Evolution of the Milky Way Galaxy |doi=10.1126\u002fscience.287.5450.69 |bibcode=2000Sci...287...69B |journal=Science |volume=287 |issue=5450 |pages=69\u201374 |year=2000 |pmid=10615051 }}\u003c\u002fref\u003e Cosmological simulations indicate that, 11 billion years ago, it merged with a particularly large galaxy that has been labeled the [[Kraken galaxy|Kraken]].\u003cref\u003e{{Cite journal |last1=Kruijssen |first1=J M Diederik |last2=Pfeffer |first2=Joel L |last3=Chevance |first3=M\u00e9lanie |last4=Bonaca |first4=Ana |last5=Trujillo-Gomez |first5=Sebastian |last6=Bastian |first6=Nate |last7=Reina-Campos |first7=Marta |last8=Crain |first8=Robert A |last9=Hughes |first9=Meghan E |date=October 2020 |title=Kraken reveals itself \u2013 the merger history of the Milky Way reconstructed with the E-MOSAICS simulations |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle-abstract\u002f498\u002f2\u002f2472\u002f5893320 |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=498 |issue=2 |pages=2472\u20132491 |arxiv=2003.01119 |doi=10.1093\u002fmnras\u002fstaa2452}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Young |first=Monica |date=November 13, 2020 |title=Star Clusters reveal the \"Kraken\" in the Milky Way's Past |url=https:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115190620\u002fhttps:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |archive-date=November 15, 2020 |access-date=November 15, 2020 |website=[[Sky & Telescope]]}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Such large-scale interactions are rare. As time passes, mergers of two systems of equal size become less common. Most bright galaxies have remained fundamentally unchanged for the last few billion years, and the net rate of star formation probably also peaked about ten billion years ago.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Panter |first1=B.\u003cbr\u003e- |last2=Jimenez |first2=R.\u003cbr\u003e- |last3=Heavens |first3=A. F.\u003cbr\u003e- |last4=Charlot |first4=S.\u003cbr\u003e- |s2cid=15174718\u003cbr\u003e- |date=2007\u003cbr\u003e- |title=The star formation histories of galaxies in the Sloan Digital Sky Survey\u003cbr\u003e- |journal=[[Monthly Notices of the Royal Astronomical Society]]\u003cbr\u003e- |volume=378 |issue=4 |pages=1550\u20131564\u003cbr\u003e- |arxiv=astro-ph\u002f0608531\u003cbr\u003e- |doi=10.1111\u002fj.1365-2966.2007.11909.x |bibcode=2007MNRAS.378.1550P\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Future trends ===\u003cbr\u003e-{{Main|Future of an expanding universe}}\u003cbr\u003e-\u003cbr\u003e-Spiral galaxies, like the [[Milky Way]], produce new generations of stars as long as they have dense [[molecular cloud]]s of interstellar hydrogen in their spiral arms.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Kennicutt |first1=Robert C. Jr.\u003cbr\u003e- |last2=Tamblyn |first2=Peter\u003cbr\u003e- |last3=Congdon |first3=Charles E.\u003cbr\u003e- |date=1994\u003cbr\u003e- |title=Past and future star formation in disk galaxies\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=435 |issue=1 |pages=22\u201336\u003cbr\u003e- |bibcode=1994ApJ...435...22K\u003cbr\u003e- |doi=10.1086\u002f174790\u003cbr\u003e-}}\u003c\u002fref\u003e Elliptical galaxies are largely devoid of this gas, and so form few new stars.\u003cref\u003e{{cite book\u003cbr\u003e- |last1=Knapp\u003cbr\u003e- |first1=Gillian R. \u003cbr\u003e- |author-link1=Gillian Knapp\u003cbr\u003e- |date=1999\u003cbr\u003e- |title=Star Formation in Early Type Galaxies\u003cbr\u003e- |volume=163\u003cbr\u003e- |page=119\u003cbr\u003e- |publisher=[[Astronomical Society of the Pacific]]\u003cbr\u003e- |bibcode=1999ASPC..163..119K\u003cbr\u003e- |oclc=41302839\u003cbr\u003e- |isbn=978-1-886733-84-8\u003cbr\u003e- |arxiv=astro-ph\u002f9808266\u003cbr\u003e- |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=tpDvAAAAMAAJ\u003cbr\u003e- }}\u003c\u002fref\u003e The supply of star-forming material is finite; once stars have converted the available supply of hydrogen into heavier elements, new star formation will come to an end.\u003cref name=\"cosmic_battle\"\u003e{{cite web\u003cbr\u003e- |last1=Adams\u003cbr\u003e- |first1=Fred\u003cbr\u003e- |last2=Laughlin\u003cbr\u003e- |first2=Greg\u003cbr\u003e- |date=July 13, 2006\u003cbr\u003e- |title=The Great Cosmic Battle\u003cbr\u003e- |url=http:\u002f\u002fwww.astrosociety.org\u002fpubs\u002fmercury\u002f0001\u002fcosmic.html\u003cbr\u003e- |publisher=[[Astronomical Society of the Pacific]]\u003cbr\u003e- |access-date=January 16, 2007\u003cbr\u003e- |archive-date=May 13, 2012\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120513053244\u002fhttp:\u002f\u002fwww.astrosociety.org\u002fpubs\u002fmercury\u002f0001\u002fcosmic.html\u003cbr\u003e- |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|title = Cosmic 'Murder Mystery' Solved: Galaxies Are 'Strangled to Death'|website = [[Space.com]]|last=Choi|first=Charles Q.|date = May 13, 2015|url = http:\u002f\u002fwww.space.com\u002f29398-galaxy-strangulation-death-mystery.html|access-date = 2015-05-14|archive-date = March 24, 2021|archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071733\u002fhttps:\u002f\u002fwww.space.com\u002f29398-galaxy-strangulation-death-mystery.html|url-status = live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The current era of star formation is expected to continue for up to one hundred billion years, and then the \"stellar age\" will wind down after about ten trillion to one hundred trillion years (10\u003csup\u003e13\u003c\u002fsup\u003e\u201310\u003csup\u003e14\u003c\u002fsup\u003e&nbsp;years), as the smallest, longest-lived stars in the visible universe, tiny [[red dwarf]]s, begin to fade. At the end of the stellar age, galaxies will be composed of [[compact star|compact objects]]: [[brown dwarf]]s, [[white dwarf]]s that are cooling or cold (\"[[black dwarf]]s\"), [[neutron star]]s, and [[black hole]]s. Eventually, as a result of [[Relaxation (physics)#Relaxation in astronomy|gravitational relaxation]], all stars will either fall into central supermassive black holes or be flung into intergalactic space as a result of collisions.\u003cref name=\"cosmic_battle\" \u002f\u003e\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Pobojewski\u003cbr\u003e- |first1=Sally\u003cbr\u003e- |date=January 21, 1997\u003cbr\u003e- |title=Physics offers glimpse into the dark side of the Universe\u003cbr\u003e- |url=http:\u002f\u002fwww.umich.edu\u002f~urecord\u002f9697\u002fJan21_97\u002fartcl17.htm\u003cbr\u003e- |publisher=[[University of Michigan]]\u003cbr\u003e- |access-date=January 13, 2007\u003cbr\u003e- |archive-date=January 21, 2005\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20050121050829\u002fhttp:\u002f\u002fwww.umich.edu\u002f~urecord\u002f9697\u002fJan21_97\u002fartcl17.htm\u003cbr\u003e- |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e == Larger-scale structures ==\u003cbr\u003e {{Main|Observable universe#Large-scale structure|Galaxy filament|Galaxy groups and clusters}}\u003cbr\u003e {{multiple image\u003cbr\u003e@@ -1068,6 +849,225 @@\u003cbr\u003e |doi-access=free\u003cbr\u003e  }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+==Magnetic fields==\u003cbr\u003e+Galaxies have [[magnetic field]]s of their own. A galaxy's magnetic field influences its dynamics in multiple ways, including affecting the formation of spiral arms and transporting angular momentum in gas clouds. The latter effect is particularly important, as it is a necessary factor for the gravitational collapse of those clouds, and thus for star formation.\u003cref name=\"galactic_magnetic_fields\"\u003e{{Cite journal|title = Galactic magnetic fields|journal = [[Scholarpedia]] |volume = 2|issue = 8|page = 2411|last = Beck|first = Rainer|doi = 10.4249\u002fscholarpedia.2411|bibcode = 2007SchpJ...2.2411B |year = 2007|doi-access = free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The typical average [[Equipartition theorem|equipartition]] strength for [[Spiral galaxy|spiral galaxies]] is about 10 \u03bcG ([[Gauss (unit)|microgauss]]) or 1{{nbsp}}nT ([[Tesla (unit)|nanotesla]]). By comparison, the Earth's magnetic field has an average strength of about 0.3 G (Gauss) or 30 \u03bcT ([[Tesla (unit)|microtesla]]). Radio-faint galaxies like [[Andromeda Galaxy|M 31]] and [[Triangulum Galaxy|M33]], the [[Milky Way]]'s neighbors, have weaker fields (about 5{{nbsp}}\u03bcG), while gas-rich galaxies with high star-formation rates, like M 51, M 83 and NGC 6946, have 15 \u03bcG on average. In prominent spiral arms, the field strength can be up to 25 \u03bcG, in regions where cold gas and dust are also concentrated. The strongest total equipartition fields (50\u2013100 \u03bcG) were found in [[Starburst galaxy|starburst galaxies]]\u2014for example, in M 82 and the [[Antennae Galaxies|Antennae]]; and in nuclear starburst regions, such as the centers of NGC 1097 and other [[Barred spiral galaxy|barred galaxies]].\u003cref name=\"galactic_magnetic_fields\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+== Formation and evolution ==\u003cbr\u003e+{{Main|Galaxy formation and evolution}}\u003cbr\u003e+\u003cbr\u003e+=== Formation ===\u003cbr\u003e+[[File:Artist's impression of a protocluster forming in the early Universe.jpg|right|thumb|Artist's impression of a protocluster forming in the early universe\u003cref\u003e{{cite press release|title=Construction Secrets of a Galactic Metropolis|url=http:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|publisher=[[European Southern Observatory]]|access-date=October 15, 2014|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071552\u002fhttps:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1431\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e+\u003cbr\u003e+Current models of the formation of galaxies in the early universe are based on the [[Lambda-CDM model|\u039bCDM]] model. About 300,000 years after the [[Big Bang]], atoms of [[hydrogen]] and [[helium]] began to form, in an event called [[Recombination (cosmology)|recombination]]. Nearly all the hydrogen was neutral (non-ionized) and readily absorbed light, and no stars had yet formed. As a result, this period has been called the \"[[Timeline of the Big Bang#Dark Ages|dark ages]]\". It was from density fluctuations (or [[anisotropy|anisotropic]] irregularities) in this primordial matter that [[structure formation|larger structures]] began to appear. As a result, masses of [[baryon]]ic matter started to condense within [[cold dark matter]] halos.\u003cref name=\"hqrdvj\"\u003e{{cite web\u003cbr\u003e+ |date=November 18, 1999\u003cbr\u003e+ |title=Protogalaxies\u003cbr\u003e+ |url=http:\u002f\u002fcfa-www.harvard.edu\u002f~aas\u002ftenmeter\u002fproto.htm\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080325183740\u002fhttp:\u002f\u002fcfa-www.harvard.edu\u002f~aas\u002ftenmeter\u002fproto.htm\u003cbr\u003e+ |archive-date=2008-03-25\u003cbr\u003e+ |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e+ |access-date=January 10, 2007\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e+\u003cbr\u003e+=== Early galaxy formation ===\u003cbr\u003e+As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e+\u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e+\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e+Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Barkana\u003cbr\u003e+ |first1=Rennan\u003cbr\u003e+ |last2=Loeb\u003cbr\u003e+ |first2=Abraham\u003cbr\u003e+ |author-link2=Avi Loeb\u003cbr\u003e+ |s2cid=119094218\u003cbr\u003e+ |year=2001\u003cbr\u003e+ |title=In the beginning: the first sources of light and the reionization of the Universe\u003cbr\u003e+ |journal=[[Physics Reports]]\u003cbr\u003e+ |volume=349\u003cbr\u003e+ |issue=2\u003cbr\u003e+ |pages=125\u2013238\u003cbr\u003e+ |bibcode=2001PhR...349..125B\u003cbr\u003e+ |arxiv=astro-ph\u002f0010468\u003cbr\u003e+ |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e+ |archive-date=March 14, 2021\u003cbr\u003e+ }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e \u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e+\u003cbr\u003e+Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors. For example, a high redshift (z ~ 16) photometric observation by [[James Webb Space Telescope]] (JWST) was later corrected to be closer to z ~ 5.\u003cref name=ConfirmRefute\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez |first10=Vital |last11=Fujimoto |first11=Seiji |last12=Jung |first12=Intae |last13=Krips |first13=Melanie |last14=Larson |first14=Rebecca L. |last15=Papovich |first15=Casey |date=2023-10-26 |title=Confirmation and refutation of very luminous galaxies in the early Universe |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-023-06521-7 |journal=Nature |language=en |volume=622 |issue=7984 |pages=707\u2013711 |doi=10.1038\u002fs41586-023-06521-7 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e+Nevertheless, confirmed observations from the JWST and other observatories are accumulating, allowing systematic comparison of early galaxies to predictions of theory.\u003cref\u003e{{Cite journal |last=Boylan-Kolchin |first=Michael |date=2023-04-13 |title=Stress testing \u039bCDM with high-redshift galaxy candidates |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41550-023-01937-7 |journal=Nature Astronomy |language=en |volume=7 |issue=6 |pages=731\u2013735 |doi=10.1038\u002fs41550-023-01937-7 |issn=2397-3366 |pmc=PMC10281863 |pmid=37351007}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Evidence for individual Population III stars in early galaxies is even more challenging. Even seemingly confirmed spectroscopic evidence may turn out to have other origins. For example, astronomers reported He\u003csub\u003eII\u003c\u002fsub\u003e emission evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy, with a redshift value of 6.60.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e Subsequent observations\u003cref\u003e{{Cite journal |last=Bowler |first=R. A. A. |last2=McLure |first2=R. J. |last3=Dunlop |first3=J. S. |last4=McLeod |first4=D. J. |last5=Stanway |first5=E. R. |last6=Eldridge |first6=J. J. |last7=Jarvis |first7=M. J. |date=2017-04-05 |title=No evidence for Population III stars or a direct collapse black hole in the z\u00a0=\u00a06.6 Lyman\u2009\u03b1 emitter \u2018CR7\u2019 |url=https:\u002f\u002fdoi.org\u002f10.1093\u002fmnras\u002fstx839 |journal=Monthly Notices of the Royal Astronomical Society |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |issn=0035-8711}}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}} \u003cbr\u003e+\u003cbr\u003e+[[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e+\u003cbr\u003e+=== Evolution ===\u003cbr\u003e+Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e+ |date        = February 9, 2005\u003cbr\u003e+ |title       = Simulations Show How Growing Black Holes Regulate Galaxy Formation\u003cbr\u003e+ |url         = http:\u002f\u002fwww.cmu.edu\u002fPR\u002freleases05\u002f050209_blackhole.html\u003cbr\u003e+ |publisher   = [[Carnegie Mellon University]]\u003cbr\u003e+ |access-date  = January 7, 2007\u003cbr\u003e+ |url-status  = dead\u003cbr\u003e+ |archive-url  = https:\u002f\u002fweb.archive.org\u002fweb\u002f20120331130051\u002fhttp:\u002f\u002fwww.cmu.edu\u002fPR\u002freleases05\u002f050209_blackhole.html\u003cbr\u003e+ |archive-date = March 31, 2012\u003cbr\u003e+ |df          = mdy-all\u003cbr\u003e+}}\u003c\u002fref\u003e During this early epoch, galaxies undergo a major burst of star formation.\u003cref\u003e{{cite news\u003cbr\u003e+ |last1=Massey |first1=Robert\u003cbr\u003e+ |last2=Heward |first2=Anita\u003cbr\u003e+ |date=April 21, 2007\u003cbr\u003e+ |title=Caught in the act; forming galaxies captured in the young Universe\u003cbr\u003e+ |url=http:\u002f\u002fwww.ras.org.uk\u002findex.php?option=com_content&task=view&id=1190&Itemid=2\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131115031412\u002fhttp:\u002f\u002fwww.ras.org.uk\u002findex.php?option=com_content&task=view&id=1190&Itemid=2\u003cbr\u003e+ |archive-date=2013-11-15\u003cbr\u003e+ |publisher=[[Royal Astronomical Society]]\u003cbr\u003e+ |access-date=April 20, 2007\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+During the following two billion years, the accumulated matter settles into a [[disc (galaxy)|galactic disc]].\u003cref\u003e{{cite journal\u003cbr\u003e+ |last=Noguchi |first=Masafumi\u003cbr\u003e+ |s2cid=17963236\u003cbr\u003e+ |date=1999\u003cbr\u003e+ |title=Early Evolution of Disk Galaxies: Formation of Bulges in Clumpy Young Galactic Disks\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=514 |issue=1 |pages=77\u201395\u003cbr\u003e+ |bibcode=1999ApJ...514...77N\u003cbr\u003e+ |doi=10.1086\u002f306932\u003cbr\u003e+|arxiv = astro-ph\u002f9806355 }}\u003c\u002fref\u003e A galaxy will continue to absorb infalling material from [[high-velocity cloud]]s and [[dwarf galaxy|dwarf galaxies]] throughout its life.\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Baugh |first1=Carlton\u003cbr\u003e+ |last2=Frenk |first2=Carlos\u003cbr\u003e+ |date=May 1999\u003cbr\u003e+ |url=http:\u002f\u002fphysicsweb.org\u002farticles\u002fworld\u002f12\u002f5\u002f9\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070426043157\u002fhttp:\u002f\u002fphysicsweb.org\u002farticles\u002fworld\u002f12\u002f5\u002f9\u003cbr\u003e+ |archive-date=2007-04-26\u003cbr\u003e+ |title=How are galaxies made?\u003cbr\u003e+ |publisher=[[Institute of Physics]]\u003cbr\u003e+ |access-date=January 16, 2007\u003cbr\u003e+}}\u003c\u002fref\u003e This matter is mostly hydrogen and helium. The cycle of stellar birth and death slowly increases the abundance of heavy elements, eventually allowing the [[planetary formation|formation]] of [[planet]]s.\u003cref\u003e{{cite conference\u003cbr\u003e+ |last1=Gonzalez |first1=Guillermo\u003cbr\u003e+ |date=1998\u003cbr\u003e+ |title=The Stellar Metallicity&nbsp;\u2014 Planet Connection\u003cbr\u003e+ |url=https:\u002f\u002farticles.adsabs.harvard.edu\u002fcgi-bin\u002fnph-iarticle_query?1998ASPC..134..431G&defaultprint=YES&filetype=.pdf\u003cbr\u003e+ |editor-last1=Rebolo |editor-first1=Rafael\u003cbr\u003e+ |editor-last2=Martin |editor-first2=Eduardo L.\u003cbr\u003e+ |editor-last3=Osorio |editor-first3=Maria Rosa Zapatero\u003cbr\u003e+ |journal=Brown Dwarfs and Extrasolar Planets \u003cbr\u003e+ |series=ASP Conference Series\u003cbr\u003e+ |volume=134\u003cbr\u003e+ |pages=431\u2013437\u003cbr\u003e+ |bibcode=1998ASPC..134..431G\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cbr\u003e+{{Multiple image |direction=vertical |align=right |width=200 |image1=XDF-scale.jpg|image2=The Hubble eXtreme Deep Field.jpg |image3=XDF-separated.jpg |caption1=''[[Hubble Extreme Deep Field|XDF]]'' view field compared to the [[angular diameter|angular size]] of the [[Moon]]. Several thousand galaxies, each consisting of billions of [[star]]s, are in this small view. |caption2=''[[Hubble Extreme Deep Field|XDF]]'' (2012) view: Each light speck is a galaxy, some of which are as old as 13.2 billion years\u003cref name=\"Space-20120925\"\u003e{{cite web |last=Moskowitz |first=Clara | author-link= Clara Moskowitz |title=Hubble Telescope Reveals Farthest View Into Universe Ever |url=http:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |date=September 25, 2012 |website=[[Space.com]] |access-date=September 26, 2012 |archive-date=May 5, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200505111220\u002fhttps:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |url-status=live }}\u003c\u002fref\u003e&nbsp;\u2013 the [[observable universe]] is estimated to contain 200 billion to two trillion galaxies. |caption3=''[[Hubble Extreme Deep Field|XDF]]'' image shows (from left) fully mature galaxies, nearly mature galaxies (from five to nine billion years ago), and [[Protogalaxy|protogalaxies]], blazing with [[young star]]s (beyond nine billion years). |header=''[[Hubble Extreme Deep Field|Hubble eXtreme Deep Field (XDF)]]'' }}\u003cbr\u003e+\u003cbr\u003e+Star formation rates in galaxies depend upon their local environment. Isolated 'void' galaxies have highest rate per stellar mass, with 'field' galaxies associated with spiral galaxies having lower rates and galaxies in dense cluster having the lowest rates.\u003cref\u003e{{Cite journal |last1=Rojas |first1=Randall R. |last2=Vogeley |first2=Michael S. |last3=Hoyle |first3=Fiona |last4=Brinkmann |first4=Jon |date=2005-05-10 |title=Spectroscopic Properties of Void Galaxies in the Sloan Digital Sky Survey |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1086\u002f428476 |journal=[[The Astrophysical Journal]] |language=en |volume=624 |issue=2 |pages=571\u2013585 |doi=10.1086\u002f428476 |issn=0004-637X|arxiv=astro-ph\u002f0409074 |bibcode=2005ApJ...624..571R }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The evolution of galaxies can be significantly affected by interactions and collisions. Mergers of galaxies were common during the early epoch, and the majority of galaxies were peculiar in morphology.\u003cref name=\"sa296\"\u003e{{cite magazine\u003cbr\u003e+ |last1=Conselice |first1=Christopher J.\u003cbr\u003e+ |date=February 2007\u003cbr\u003e+ |title=The Universe's Invisible Hand\u003cbr\u003e+ |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fthe-universes-invisible-hand\u002f\u003cbr\u003e+ |url-access=subscription\u003cbr\u003e+ |magazine=[[Scientific American]]\u003cbr\u003e+ |volume=296 |issue=2 |pages=35\u201341\u003cbr\u003e+ |doi=10.1038\u002fscientificamerican0207-34\u003cbr\u003e+|bibcode = 2007SciAm.296b..34C }}\u003c\u002fref\u003e Given the distances between the stars, the great majority of stellar systems in colliding galaxies will be unaffected. However, gravitational stripping of the interstellar gas and dust that makes up the spiral arms produces a long train of stars known as tidal tails. Examples of these formations can be seen in [[NGC 4676]]\u003cref\u003e{{cite press release\u003cbr\u003e+ |last1=Ford\u003cbr\u003e+ |first1=H.\u003cbr\u003e+ |display-authors=etal\u003cbr\u003e+ |date=April 30, 2002\u003cbr\u003e+ |title=The Mice (NGC 4676): Colliding Galaxies With Tails of Stars and Gas\u003cbr\u003e+ |url=http:\u002f\u002fhubblesite.org\u002fnewscenter\u002farchive\u002freleases\u002f2002\u002f11\u002fimage\u002fd\u003cbr\u003e+ |website=Hubble News Desk\u003cbr\u003e+ |publisher=[[NASA]]\u003cbr\u003e+ |access-date=May 8, 2007\u003cbr\u003e+ |archive-date=September 7, 2016\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160907062239\u002fhttp:\u002f\u002fhubblesite.org\u002fnewscenter\u002farchive\u002freleases\u002f2002\u002f11\u002fimage\u002fd\u002f\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e or the [[Antennae Galaxies]].\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Struck |first1=Curtis\u003cbr\u003e+ |s2cid=119369136\u003cbr\u003e+ |date=1999\u003cbr\u003e+ |title=Galaxy Collisions\u003cbr\u003e+ |doi=10.1016\u002fS0370-1573(99)00030-7\u003cbr\u003e+ |journal=[[Physics Reports]]\u003cbr\u003e+ |volume=321\u003cbr\u003e+ |issue=1\u20133\u003cbr\u003e+ |pages=1\u2013137\u003cbr\u003e+ |arxiv=astro-ph\u002f9908269\u003cbr\u003e+|bibcode = 1999PhR...321....1S }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Milky Way galaxy and the nearby Andromeda Galaxy are moving toward each other at about 130&nbsp;[[metre per second|km\u002fs]], and\u2014depending upon the lateral movements\u2014the two might collide in about five to six billion years. Although the Milky Way has never collided with a galaxy as large as Andromeda before, it has collided and merged with other galaxies in the past.\u003cref name=\"Buser\"\u003e{{Cite journal |last1=Buser |first1=Roland |title=The Formation and Early Evolution of the Milky Way Galaxy |doi=10.1126\u002fscience.287.5450.69 |bibcode=2000Sci...287...69B |journal=Science |volume=287 |issue=5450 |pages=69\u201374 |year=2000 |pmid=10615051 }}\u003c\u002fref\u003e Cosmological simulations indicate that, 11 billion years ago, it merged with a particularly large galaxy that has been labeled the [[Kraken galaxy|Kraken]].\u003cref\u003e{{Cite journal |last1=Kruijssen |first1=J M Diederik |last2=Pfeffer |first2=Joel L |last3=Chevance |first3=M\u00e9lanie |last4=Bonaca |first4=Ana |last5=Trujillo-Gomez |first5=Sebastian |last6=Bastian |first6=Nate |last7=Reina-Campos |first7=Marta |last8=Crain |first8=Robert A |last9=Hughes |first9=Meghan E |date=October 2020 |title=Kraken reveals itself \u2013 the merger history of the Milky Way reconstructed with the E-MOSAICS simulations |url=https:\u002f\u002facademic.oup.com\u002fmnras\u002farticle-abstract\u002f498\u002f2\u002f2472\u002f5893320 |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=498 |issue=2 |pages=2472\u20132491 |arxiv=2003.01119 |doi=10.1093\u002fmnras\u002fstaa2452}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Young |first=Monica |date=November 13, 2020 |title=Star Clusters reveal the \"Kraken\" in the Milky Way's Past |url=https:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115190620\u002fhttps:\u002f\u002fskyandtelescope.org\u002fastronomy-news\u002fstellar-fossils-reveal-the-kraken-in-the-milky-ways-past\u002f |archive-date=November 15, 2020 |access-date=November 15, 2020 |website=[[Sky & Telescope]]}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Such large-scale interactions are rare. As time passes, mergers of two systems of equal size become less common. Most bright galaxies have remained fundamentally unchanged for the last few billion years, and the net rate of star formation probably also peaked about ten billion years ago.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Panter |first1=B.\u003cbr\u003e+ |last2=Jimenez |first2=R.\u003cbr\u003e+ |last3=Heavens |first3=A. F.\u003cbr\u003e+ |last4=Charlot |first4=S.\u003cbr\u003e+ |s2cid=15174718\u003cbr\u003e+ |date=2007\u003cbr\u003e+ |title=The star formation histories of galaxies in the Sloan Digital Sky Survey\u003cbr\u003e+ |journal=[[Monthly Notices of the Royal Astronomical Society]]\u003cbr\u003e+ |volume=378 |issue=4 |pages=1550\u20131564\u003cbr\u003e+ |arxiv=astro-ph\u002f0608531\u003cbr\u003e+ |doi=10.1111\u002fj.1365-2966.2007.11909.x |bibcode=2007MNRAS.378.1550P\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Future trends ===\u003cbr\u003e+{{Main|Future of an expanding universe}}\u003cbr\u003e+\u003cbr\u003e+Spiral galaxies, like the [[Milky Way]], produce new generations of stars as long as they have dense [[molecular cloud]]s of interstellar hydrogen in their spiral arms.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Kennicutt |first1=Robert C. Jr.\u003cbr\u003e+ |last2=Tamblyn |first2=Peter\u003cbr\u003e+ |last3=Congdon |first3=Charles E.\u003cbr\u003e+ |date=1994\u003cbr\u003e+ |title=Past and future star formation in disk galaxies\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=435 |issue=1 |pages=22\u201336\u003cbr\u003e+ |bibcode=1994ApJ...435...22K\u003cbr\u003e+ |doi=10.1086\u002f174790\u003cbr\u003e+}}\u003c\u002fref\u003e Elliptical galaxies are largely devoid of this gas, and so form few new stars.\u003cref\u003e{{cite book\u003cbr\u003e+ |last1=Knapp\u003cbr\u003e+ |first1=Gillian R. \u003cbr\u003e+ |author-link1=Gillian Knapp\u003cbr\u003e+ |date=1999\u003cbr\u003e+ |title=Star Formation in Early Type Galaxies\u003cbr\u003e+ |volume=163\u003cbr\u003e+ |page=119\u003cbr\u003e+ |publisher=[[Astronomical Society of the Pacific]]\u003cbr\u003e+ |bibcode=1999ASPC..163..119K\u003cbr\u003e+ |oclc=41302839\u003cbr\u003e+ |isbn=978-1-886733-84-8\u003cbr\u003e+ |arxiv=astro-ph\u002f9808266\u003cbr\u003e+ |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=tpDvAAAAMAAJ\u003cbr\u003e+ }}\u003c\u002fref\u003e The supply of star-forming material is finite; once stars have converted the available supply of hydrogen into heavier elements, new star formation will come to an end.\u003cref name=\"cosmic_battle\"\u003e{{cite web\u003cbr\u003e+ |last1=Adams\u003cbr\u003e+ |first1=Fred\u003cbr\u003e+ |last2=Laughlin\u003cbr\u003e+ |first2=Greg\u003cbr\u003e+ |date=July 13, 2006\u003cbr\u003e+ |title=The Great Cosmic Battle\u003cbr\u003e+ |url=http:\u002f\u002fwww.astrosociety.org\u002fpubs\u002fmercury\u002f0001\u002fcosmic.html\u003cbr\u003e+ |publisher=[[Astronomical Society of the Pacific]]\u003cbr\u003e+ |access-date=January 16, 2007\u003cbr\u003e+ |archive-date=May 13, 2012\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120513053244\u002fhttp:\u002f\u002fwww.astrosociety.org\u002fpubs\u002fmercury\u002f0001\u002fcosmic.html\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|title = Cosmic 'Murder Mystery' Solved: Galaxies Are 'Strangled to Death'|website = [[Space.com]]|last=Choi|first=Charles Q.|date = May 13, 2015|url = http:\u002f\u002fwww.space.com\u002f29398-galaxy-strangulation-death-mystery.html|access-date = 2015-05-14|archive-date = March 24, 2021|archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324071733\u002fhttps:\u002f\u002fwww.space.com\u002f29398-galaxy-strangulation-death-mystery.html|url-status = live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The current era of star formation is expected to continue for up to one hundred billion years, and then the \"stellar age\" will wind down after about ten trillion to one hundred trillion years (10\u003csup\u003e13\u003c\u002fsup\u003e\u201310\u003csup\u003e14\u003c\u002fsup\u003e&nbsp;years), as the smallest, longest-lived stars in the visible universe, tiny [[red dwarf]]s, begin to fade. At the end of the stellar age, galaxies will be composed of [[compact star|compact objects]]: [[brown dwarf]]s, [[white dwarf]]s that are cooling or cold (\"[[black dwarf]]s\"), [[neutron star]]s, and [[black hole]]s. Eventually, as a result of [[Relaxation (physics)#Relaxation in astronomy|gravitational relaxation]], all stars will either fall into central supermassive black holes or be flung into intergalactic space as a result of collisions.\u003cref name=\"cosmic_battle\" \u002f\u003e\u003cref\u003e{{cite web\u003cbr\u003e+ |last1=Pobojewski\u003cbr\u003e+ |first1=Sally\u003cbr\u003e+ |date=January 21, 1997\u003cbr\u003e+ |title=Physics offers glimpse into the dark side of the Universe\u003cbr\u003e+ |url=http:\u002f\u002fwww.umich.edu\u002f~urecord\u002f9697\u002fJan21_97\u002fartcl17.htm\u003cbr\u003e+ |publisher=[[University of Michigan]]\u003cbr\u003e+ |access-date=January 13, 2007\u003cbr\u003e+ |archive-date=January 21, 2005\u003cbr\u003e+ |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20050121050829\u002fhttp:\u002f\u002fwww.umich.edu\u002f~urecord\u002f9697\u002fJan21_97\u002fartcl17.htm\u003cbr\u003e+ |url-status=dead\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e == Gallery ==\u003cbr\u003e \u003cgallery mode=packed heights=300\u003e\u003cbr\u003e File:Hubble-Space-Telescope-Galaxy-Collection.jpg|Galaxies (left\u002ftop, right\u002fbottom): {{small|[[NGC 7537|NGC 7541]], [[NGC 3021]], [[NGC 5643]], [[NGC 3254]], [[NGC 3147]], [[NGC 105]], [[NGC 2608]], [[NGC 3583]], [[NGC 3147]], [[Spiral galaxy#Gallery|MRK 1337]], [[NGC 5861]], [[NGC 2525]], [[NGC 1015]], [[UGC 9391]], [[NGC 691]], [[Atlas of Peculiar Galaxies#One heavy arm|NGC 7678]], [[NGC 2442]], [[NGC 5468]], [[NGC 5917]], [[NGC 4639]], [[NGC 3972]], [[Antennae Galaxies|The Antennae Galaxies]], [[NGC 5584]], [[Messier 106|M106]], [[NGC 7250]], [[NGC 3370]], [[NGC 5728]], [[NGC 4424]], [[NGC 1559]], [[NGC 3982]], [[NGC 1448]], [[NGC 4680]], [[Messier 101|M101]], [[NGC 1365]], [[NGC 7329]], [[Interacting galaxy#Gallery|NGC 3447]]}}","--- Revision 91\u003cbr\u003e+++ Revision 92\u003cbr\u003e@@ -868,14 +868,14 @@\u003cbr\u003e  |archive-date=2008-03-25\u003cbr\u003e  |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=Physics Reports |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=[[Physics Reports]] |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e === Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e \u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=Annual Review of Astronomy and Astrophysics |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist impression of a young galaxy accreting material]]\u003cbr\u003e+\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last=Klessen |first=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium. \u003cbr\u003e Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e@@ -893,12 +893,12 @@\u003cbr\u003e  |arxiv=astro-ph\u002f0010468\u003cbr\u003e  |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e  |archive-date=March 14, 2021\u003cbr\u003e- }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e \u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e-\u003cbr\u003e-Theoretical models for early galaxy fo rchive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e ","--- Revision 93\u003cbr\u003e+++ Revision 94\u003cbr\u003e@@ -294,7 +294,7 @@\u003cbr\u003e \u003cbr\u003e ====Type-cD galaxies====\u003cbr\u003e \u003cbr\u003e-[[Image:Hubble reveals a super-rich galactic neighbourhood.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over 800,000 light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e+[[Image:Galaxy Cluster Abell 1413.jpg|thumb|right|300px|The galaxy cluster [[Abell 1413]] is dominated by this cD elliptical galaxy designated Abell 1413 BCG. It has an isophotal diameter of over 800,000 light-years across. Note the [[gravitational lens]]ing.]]\u003cbr\u003e \u003cbr\u003e The [[List of largest galaxies|largest galaxies]] are the [[Type-cD galaxy|type-cD galaxies]].\u003cbr\u003e First described in 1964 by a paper by Thomas A. Matthews and others,\u003cref name=Matthews\u003e{{cite journal | url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1964ApJ...140...35M\u002fabstract | bibcode=1964ApJ...140...35M | title=A Discussion of Galaxies Indentified &#91;sic&#93; with Radio Sources | last1=Matthews | first1=Thomas A. | last2=Morgan | first2=William W. | last3=Schmidt | first3=Maarten | journal=[[The Astrophysical Journal]] | year=1964 | volume=140 | page=35 | doi=10.1086\u002f147890 }}\u003c\u002fref\u003e they are a subtype of the more general class of D galaxies, which are giant elliptical galaxies, except that they are much larger. They are popularly known as the '''supergiant elliptical galaxies''' and constitute the largest and most luminous galaxies known. These galaxies feature a central elliptical nucleus with an extensive, faint halo of stars extending to megaparsec scales.\u003cref name=\"NASAVlog\"\u003e{{cite web | url=https:\u002f\u002fwww.nasa.gov\u002fcontent\u002fdiscoveries-highlights-tracing-the-growth-of-galaxies |publisher=[[NASA]]|title=Tracing the Growth of Galaxies |access-date=April 20, 2024| date=6 February 2017 }}\u003c\u002fref\u003e The profile of their surface brightnesses as a function of their radius (or distance from their cores) falls off more slowly than their smaller counterparts.\u003cref name=Tonry\u003e{{cite book | chapter-url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f1987IAUS..127...89T\u002fabstract | bibcode=1987IAUS..127...89T | last1=Tonry | first1=John L. | title=Structure and Dynamics of Elliptical Galaxies | chapter=Properties of cD Galaxies | year=1987 | volume=127 | page=89 | doi=10.1007\u002f978-94-009-3971-4_7 | isbn=978-90-277-2586-8 | s2cid=117980521 }}\u003c\u002fref\u003e","--- Revision 94\u003cbr\u003e+++ Revision 95\u003cbr\u003e@@ -870,7 +870,6 @@\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e }}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=[[Physics Reports]] |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 |bibcode=2018PhR...780....1D }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e \u003cbr\u003e-=== Early galaxy formation ===\u003cbr\u003e As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars. \u003cbr\u003e \u003cbr\u003e [[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist impression of a young galaxy accreting material]]","--- Revision 95\u003cbr\u003e+++ Revision 96\u003cbr\u003e@@ -902,6 +902,8 @@\u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e === Evolution ===\u003cbr\u003e+Once stars begin to form, emit radiation, and in some cases explode, process of galaxy formation becomes very complex, involving interactions between the forces of gravity, radiation, and thermal energy. Many details are poorly understood.\u003cref\u003e{{Cite book |last=Longair |first=Malcolm S. |title=Galaxy formation |date=2008 |publisher=Springer |isbn=978-3-540-73477-2 |edition=2nd ed |series=Astronomy and astrophysics library |location=Berlin}}\u003c\u002fref\u003e{{rp|583}}\u003cbr\u003e+\u003cbr\u003e Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e  |date        = February 9, 2005\u003cbr\u003e  |title       = Simulations Show How Growing Black Holes Regulate Galaxy Formation","--- Revision 96\u003cbr\u003e+++ Revision 97\u003cbr\u003e@@ -902,7 +902,7 @@\u003cbr\u003e [[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e === Evolution ===\u003cbr\u003e-Once stars begin to form, emit radiation, and in some cases explode, process of galaxy formation becomes very complex, involving interactions between the forces of gravity, radiation, and thermal energy. Many details are poorly understood.\u003cref\u003e{{Cite book |last=Longair |first=Malcolm S. |title=Galaxy formation |date=2008 |publisher=Springer |isbn=978-3-540-73477-2 |edition=2nd ed |series=Astronomy and astrophysics library |location=Berlin}}\u003c\u002fref\u003e{{rp|583}}\u003cbr\u003e+Once stars begin to form, emit radiation, and in some cases
