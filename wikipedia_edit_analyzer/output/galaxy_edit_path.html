ronomy and Astrophysics Review]] |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M. |last3=Colina |first3=L. |last4=Labiano |first4=A. |last5=S\u00e1nchez-Garc\u00eda |first5=M. |last6=Alonso-Herrero |first6=A. |last7=Arribas |first7=S. |last8=Garc\u00eda-Burillo |first8=S. |last9=Villar-Mart\u00edn |first9=M. |last10=Rigopoulou |first10=D. |last11=Valentino |first11=F. |last12=Puglisi |first12=A. |last13=D\u00edaz-Santos |first13=T. |last14=Cazzoli |first14=S. |last15=Usero |first15=A. |date=August 2022 |title=Compact molecular gas emission in local LIRGs among low- and high- z galaxies |url=https:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f202142802 |journal=[[Astronomy & Astrophysics]] |volume=664 |pages=A60 |doi=10.1051\u002f0004-6361\u002f202142802 |issn=0004-6361|arxiv=2204.02055 |bibcode=2022A&A...664A..60B }}\u003c\u002fref\u003e Infrared galaxies emit more energy in the infrared than all other wavelengths combined, with peak emission typically at wavelengths of 60 to 100 microns. LIRGs are believed to be created from the strong interaction and merger of   spiral galaxies.\u003cref\u003e{{Cite journal |last1=Sanders |first1=David B. |last2=Mirabel |first2=I. F. |date=Sep 1996 |title=Luminous Infrared Galaxies |url=https:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fSanders\u002fpaper.pdf |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=34 |issue=1 |pages=749\u2013792 [772\u2013773] |doi=10.1146\u002fannurev.astro.34.1.749 |bibcode=1996ARA&A..34..749S|issn=0066-4146}}\u003c\u002fref\u003e While uncommon in the local universe, LIRGs and ULIRGS were more prevalent when the universe was younger.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e+Luminous infrared galaxies (LIRGs) are galaxies with luminosities\u2014the measurement of electromagnetic power output\u2014above 10\u003csup\u003e11\u003c\u002fsup\u003e L\u2609 (solar luminosities). In most cases, most of their energy comes from large numbers of young stars which heat surrounding dust, which reradiates the energy in the infrared.  Luminosity high enough to be a LIRG requires a star formation rate of at least 18&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e. Ultra-luminous infrared galaxies (ULIRGs) are at least ten times more luminous still and form stars at rates \u003e180&nbsp;M\u2609&nbsp;yr\u003csup\u003e\u22121\u003c\u002fsup\u003e.  Many LIRGs also emit radiation from an AGN.\u003cref\u003e{{Cite journal |last1=P\u00e9rez-Torres |first1=Miguel |last2=Mattila |first2=Seppo |last3=Alonso-Herrero |first3=Almudena |last4=Aalto |first4=Susanne |last5=Efstathiou |first5=Andreas |date=December 2021 |title=Star formation and nuclear activity in luminous infrared galaxies: an infrared through radio review |url=https:\u002f\u002flink.springer.com\u002f10.1007\u002fs00159-020-00128-x |journal=The Astronomy and Astrophysics Review |language=en |volume=29 |issue=1 |page=2 |arxiv=2010.05072 |bibcode=2021A&ARv..29....2P |doi=10.1007\u002fs00159-020-00128-x |s2cid=253687419 |issn=0935-4956}}\u003c\u002fref\u003e\u003cref name=\":0\"\u003e{{Cite journal |last1=Bellocchi |first1=E. |last2=Pereira-Santaella |first2=M. |last3=Colina |first3=L. |last4=Labiano |first4=A. |last5=S\u00e1nchez-Garc\u00eda |first5=M. |last6=Alonso-Herrero |first6=A. |last7=Arribas |first7=S. |last8=Garc\u00eda-Burillo |first8=S. |last9=Villar-Mart\u00edn |first9=M. |last10=Rigopoulou |first10=D. |last11=Valentino |first11=F. |last12=Puglisi |first12=A. |last13=D\u00edaz-Santos |first13=T. |last14=Cazzoli |first14=S. |last15=Usero |first15=A. |date=August 2022 |title=Compact molecular gas emission in local LIRGs among low- and high- z galaxies |url=https:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f202142802 |journal=[[Astronomy & Astrophysics]] |volume=664 |pages=A60 |doi=10.1051\u002f0004-6361\u002f202142802 |issn=0004-6361|arxiv=2204.02055 |bibcode=2022A&A...664A..60B }}\u003c\u002fref\u003e Infrared galaxies emit more energy in the infrared than all other wavelengths combined, with peak emission typically at wavelengths of 60 to 100 microns. LIRGs are believed to be created from the strong interaction and merger of   spiral galaxies.\u003cref\u003e{{Cite journal |last1=Sanders |first1=David B. |last2=Mirabel |first2=I. F. |date=Sep 1996 |title=Luminous Infrared Galaxies |url=https:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fSanders\u002fpaper.pdf |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=34 |issue=1 |pages=749\u2013792 [772-773] |doi=10.1146\u002fannurev.astro.34.1.749 |bibcode=1996ARA&A..34..749S|issn=0066-4146}}\u003c\u002fref\u003e While uncommon in the local universe, LIRGs and ULIRGS were more prevalent when the universe was younger.\u003cref name=\":0\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e ==Physical diameters==\u003cbr\u003e \u003cbr\u003e-Galaxies do not have a definite boundary by their nature, and are characterized by a gradually decreasing stellar density as a function of increasing distance from their center, making measurements of their true extents difficult. Nevertheless, astronomers over the past few decades have made several criteria  in defining the sizes of galaxies.\u003cbr\u003e+Galaxies do not have a definite boundary by their nature, and are characterized by a gradually decreasing stellar density as a function of increasing distance from their center, making measurements of their true extents difficult. Nevertheless, astronomers over the past few decades have made several criteria  in defining the sizes of galaxies. \u003cbr\u003e \u003cbr\u003e ===Angular diameter===\u003cbr\u003e \u003cbr\u003e-As early as the time of [[Edwin Hubble]] in 1936, there have been attempts to characterize the diameters of galaxies. The earliest efforts were based on the observed angle subtended by the galaxy and its estimated distance, leading to an ''angular diameter'' (also called \"metric diameter\").{{sfn|Sandage|Kron|Longair|1995|p=43}}\u003cbr\u003e+As early as the time of [[Edwin Hubble]] in 1936, there have been attempts to characterize the diameters of galaxies. The earliest efforts were based on the observed angle subtended by the galaxy and its estimated distance, leading to an ''angular diameter'' (also called \"metric diameter\").{{sfn|Sandage|Kron|Longair|1995|p=43}}  This type of measurement is subject to two significant issues, namely that the estimated distance to the galaxy must be corrected for the redshift-related space expansion and that collections of angular-diameter data are subject to selection bias as more distant observations preferentially select the most luminous objects.{{sfn|Sandage|Kron|Longair|1995|p=73}}\u003cbr\u003e \u003cbr\u003e ===Isophotal diameter===\u003cbr\u003e \u003cbr\u003e-The ''isophotal diameter'' is introduced as a conventional way of measuring a galaxy's size based on its apparent surface brightness.\u003cref name=Chamba\u003e{{cite journal | arxiv=2010.07946 | last1=Chamba | first1=Nushkia | title=A historical perspective on the concept of galaxy size | journal=Research Notes of the American Astronomical Society | year=2020 | volume=4 | issue=7 | page=117 | doi=10.3847\u002f2515-5172\u002faba951 | bibcode=2020RNAAS...4..117C | s2cid=223953458 | doi-access=free }}\u003c\u002fref\u003e [[Isophote]]s are curves in a diagram - such as a picture of a galaxy - that adjoins points of equal brightnesses, and are useful in defining the extent of the galaxy.  The apparent brightness flux of a galaxy is measured in units of [[Magnitude (astronomy)|magnitudes]] per square [[Minute and second of arc|arcsecond]] (mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e; sometimes expressed as ''mag arcsec\u003csup\u003e\u22122\u003c\u002fsup\u003e''), which defines the brightness depth of the isophote. To illustrate how this unit works, a typical galaxy has a brightness flux of 18 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e at its central region. This brightness is equivalent to the light of an 18th magnitude hypothetical point object (like a star) being spread out evenly in a one square arcsecond area of the sky.\u003cref name=\"UMD_Week_6\"\u003e{{cite web | title=Measuring Galaxy Luminosities | work=ASTR620: Galaxies | first=Richard | last=Mushotzky | publisher=[[University of Maryland]] Astronomy Department | url=https:\u002f\u002fwww.astro.umd.edu\u002f~richard\u002fASTRO620\u002fdavis_week6.pdf | access-date=2024-02-14 }}\u003c\u002fref\u003e The isophotal diameter is typically defined as the region enclosing all the light down to 25 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e in the blue [[Jhk|B-band]],\u003cref name=\"sparkegallagher2000_131\"\u002f\u003e which is then referred to as the D\u003csub\u003e25\u003c\u002fsub\u003e standard.\u003cref\u003e{{Cite journal |last1=Fouque |first1=P. |last2=Paturel |first2=G. |date=September 1985 |title=Standard photometric diameters of galaxies. II - Reduction of the ESO, UGC, MCG catalogue |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f1985A%26A...150..192F |journal=[[Astronomy & Astrophysics]] |volume=150 |issue=2 |pages=192\u2013204|bibcode=1985A&A...150..192F }}\u003c\u002fref\u003e\u003cbr\u003e+The ''isophotal diameter'' is introduced as a conventional way of measuring a galaxy's size based on its apparent surface brightness.\u003cref name=Chamba\u003e{{cite journal | arxiv=2010.07946 | last1=Chamba | first1=Nushkia | title=A historical perspective on the concept of galaxy size | journal=Research Notes of the American Astronomical Society | year=2020 | volume=4 | issue=7 | page=117 | doi=10.3847\u002f2515-5172\u002faba951 | bibcode=2020RNAAS...4..117C | s2cid=223953458 | doi-access=free }}\u003c\u002fref\u003e [[Isophote]]s are curves in a diagram - such as a picture of a galaxy - that adjoins points of equal brightnesses, and are useful in defining the extent of the galaxy.  The apparent brightness flux of a galaxy is measured in units of [[Magnitude (astronomy)|magnitudes]] per square [[Minute and second of arc|arcsecond]] (mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e; sometimes expressed as ''mag arcsec\u003csup\u003e\u22122\u003c\u002fsup\u003e''), which defines the brightness depth of the isophote. To illustrate how this unit works, a typical galaxy has a brightness flux of 18 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e at its central region. This brightness is equivalent to the light of an 18th magnitude hypothetical point object (like a star) being spread out evenly in a one square arcsecond area of the sky.\u003cref name=\"UMD_Week_6\"\u003e{{cite web | title=Measuring Galaxy Luminosities | work=ASTR620: Galaxies | first=Richard | last=Mushotzky | publisher=[[University of Maryland]] Astronomy Department | url=https:\u002f\u002fwww.astro.umd.edu\u002f~richard\u002fASTRO620\u002fdavis_week6.pdf | access-date=2024-02-14 }}\u003c\u002fref\u003e The isophotal diameter is typically defined as the region enclosing all the light down to 25 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e in the blue [[Jhk|B-band]],\u003cref name=\"sparkegallagher2000_131\"\u002f\u003e which is then referred to as the D\u003csub\u003e25\u003c\u002fsub\u003e standard.\u003cref\u003e{{Cite journal |last1=Fouque |first1=P. |last2=Paturel |first2=G. |date=September 1985 |title=Standard photometric diameters of galaxies. II - Reduction of the ESO, UGC, MCG catalogue |url=https:\u002f\u002fadsabs.harvard.edu\u002ffull\u002f1985A%26A...150..192F |journal=Astronomy and Astrophysics |volume=150 |issue=2 |pages=192\u2013204|bibcode=1985A&A...150..192F }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e {| class=\"wikitable\"\u003cbr\u003e |+ Examples of isophotal diameters (25.0 B-mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e isophote)\u003cbr\u003e@@ -677,7 +613,7 @@\u003cbr\u003e |-\u003cbr\u003e | [[Milky Way]] || {{convert|26.8|kpc|ly|sigfig=3|abbr=off|lk=on}} || \u003cref name=\"MilkyWaySize\"\u002f\u003e\u003cbr\u003e |-\u003cbr\u003e-| [[Messier 87]] ||  {{convert|40.55|kpc|ly|sigfig=3|abbr=off|lk=on}} ||\u003cbr\u003e+| [[Messier 87]] ||  {{convert|40.55|kpc|ly|sigfig=3|abbr=off|lk=on}} || \u003cbr\u003e \u003cref\u003e{{Cite web |title=Results for object MESSIER 087 (NGC 4486)\u003cbr\u003e  |website=[[NASA\u002fIPAC Extragalactic Database]] |publisher=[[California Institute of Technology]]|url=https:\u002f\u002fned.ipac.caltech.edu\u002fbyname?objname=NGC+4486&hconst=67.8&omegam=0.308&omegav=0.692&wmap=4&corr_z=1 |access-date=2024-03-08}}\u003c\u002fref\u003e\u003cbr\u003e |-\u003cbr\u003e@@ -696,149 +632,13 @@\u003cbr\u003e \u003cbr\u003e Petrosian magnitudes have the advantage of being redshift and distance independent, allowing the measurement of the galaxy's apparent size since the Petrosian radius is defined in terms of the galaxy's overall luminous flux.\u003cref name=\"Graham\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-A critique of an earlier version of this method has been issued by the [[Infrared Processing and Analysis Center]],\u003cref name=ipac1\u003e{{cite web|url=https:\u002f\u002fwise2.ipac.caltech.edu\u002fstaff\u002fjarrett\u002f2mass\u002fphotmem\u002fnode3.html |last1=Jarret|first1=Tom|last2=Rosenberg|first2=Jessica|date=February 6, 1997|access-date=April 20, 2024|website=Comparison of GALWORKS and IRAF's STSDAS Photometry in a Polar Field, WISE Science Data Center|publisher=[[California Institute of Technology]]|title=Circular and Fixed Elliptical Apertures: The Petrosian and Isophotal Photometry}}\u003c\u002fref\u003e with the method causing a magnitude of error (upwards to 10%) of the values than using isophotal diameter. The use of Petrosian magnitudes also have the disadvantage of missing most of the light outside the Petrosian aperture, which is defined relative to the galaxy's overall brightness profile, especially for elliptical galaxies, with higher signal-to-noise ratios on higher distances and redshifts.\u003cref name=Ned2\u003e{{Cite web|date=July 19, 2017|url=https:\u002f\u002fned.ipac.caltech.edu\u002fDocuments\u002fHoldings\u002fSets\u002fSDSS-DR6\u002fphotometry#cmodel|title=Measures of SDSS flux, magnitudes, and diameters\u003cbr\u003e+A critique of an earlier version of this method has been issued by the [[Infrared Processing and Analysis Center]],\u003cref name=ipac1\u003e{{cite web|url=https:\u002f\u002fwise2.ipac.caltech.edu\u002fstaff\u002fjarrett\u002f2mass\u002fphotmem\u002fnode3.html |last=Jarret|first=Tom|last2=Rosenberg|first2=Jessica|date=February 6, 1997|access-date=April 20, 2024|website=Comparison of GALWORKS and IRAF's STSDAS Photometry in a Polar Field, WISE Science Data Center|publisher=[[California Institute of Technology]]|title=Circular and Fixed Elliptical Apertures: The Petrosian and Isophotal Photometry}}\u003c\u002fref\u003e with the method causing a magnitude of error (upwards to 10%) of the values than using isophotal diameter. The use of Petrosian magnitudes also have the disadvantage of missing most of the light outside the Petrosian aperture, which is defined relative to the galaxy's overall brightness profile, especially for elliptical galaxies, with higher signal-to-noise ratios on higher distances and redshifts.\u003cref name=Ned2\u003e{{Cite web|date=July 19, 2017|url=https:\u002f\u002fned.ipac.caltech.edu\u002fDocuments\u002fHoldings\u002fSets\u002fSDSS-DR6\u002fphotometry#cmodel|title=Measures of SDSS flux, magnitudes, and diameters\u003cbr\u003e |website=[[NASA\u002fIPAC Extragalactic Database]]|access-date=April 20, 2024}}\u003c\u002fref\u003e A correction for this method has been issued by Graham ''et al.'' in 2005, based on the assumption that galaxies follow [[S\u00e9rsic profile|S\u00e9rsic's law]].\u003cref name=Graham\u003e{{cite journal | arxiv=astro-ph\u002f0504287 | doi=10.1086\u002f444475 | title=Total Galaxy Magnitudes and Effective Radii from Petrosian Magnitudes and Radii | year=2005 | last1=Graham | first1=Alister W. | last2=Driver | first2=Simon P. | last3=Petrosian | first3=Vahe | last4=Conselice | first4=Christopher J. | last5=Bershady | first5=Matthew A. | last6=Crawford | first6=Steven M. | last7=Goto | first7=Tomotsugu | journal=[[The Astronomical Journal]] | volume=130 | issue=4 | pages=1535\u20131544 | bibcode=2005AJ....130.1535G | s2cid=11517686 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Near-infrared method===\u003cbr\u003e This method has been used by [[2MASS]] as an adaptation from the previously used methods of isophotal measurement. Since 2MASS operates in the near infrared, which has the advantage of being able to recognize dimmer, cooler, and older stars, it has a different form of approach compared to other methods that normally use B-filter. The detail of the method used by 2MASS has been described thoroughly in a document by Jarrett ''et al.'', with the survey measuring several parameters.\u003cref name=Jarrett\u003e{{cite journal | doi=10.1086\u002f345794 | title=The 2MASS Large Galaxy Atlas | year=2003 | last1=Jarrett | first1=T. H. | last2=Chester | first2=T. | last3=Cutri | first3=R. | last4=Schneider | first4=S. E. | last5=Huchra | first5=J. P. | journal=[[The Astronomical Journal]] | volume=125 | issue=2 | pages=525\u2013554 | bibcode=2003AJ....125..525J | s2cid=117784410 | doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The standard aperture ellipse (area of detection) is defined by the infrared isophote at the [[K band (infrared)|K\u003csub\u003es\u003c\u002fsub\u003e band]] (roughly 2.2 \u03bcm wavelength) of 20 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e. Gathering the overall luminous flux of the galaxy has been employed by at least four methods: the first being a circular aperture extending 7 arcseconds from the center, an isophote at 20 mag\u002farcsec\u003csup\u003e2\u003c\u002fsup\u003e, a \"total\" aperture defined by the radial light distribution that covers the supposed extent of the galaxy, and the Kron aperture (defined as 2.5 times the first-moment radius, an integration of the flux of the \"total\" aperture).\u003cref name=Jarrett \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== Larger-scale structures ==\u003cbr\u003e-{{Main|Observable universe#Large-scale structure|Galaxy filament|Galaxy groups and clusters}}\u003cbr\u003e-{{multiple image\u003cbr\u003e-| align = left\u003cbr\u003e-| direction = vertical\u003cbr\u003e-| width = 230\u003cbr\u003e-| image1 = Seyfert Sextet full.jpg\u003cbr\u003e-| width1 =\u003cbr\u003e-| alt1 =\u003cbr\u003e-| caption1 = [[Seyfert's Sextet]] is an example of a compact galaxy group.\u003cbr\u003e-| image2 =\u003cbr\u003e-| width2 =\u003cbr\u003e-| alt2 =\u003cbr\u003e-| caption2 = [[Millennium Simulation]] showing large-scale structure of the Cosmos. The image spans about 400 million light years across.\u003cbr\u003e-}}\u003cbr\u003e-\u003cbr\u003e-Deep-sky surveys show that galaxies are often found in groups and [[Clusters of galaxies|clusters]]. Solitary galaxies that have not significantly interacted with other galaxies of comparable mass in the past few billion years are relatively scarce.\u003cref\u003e{{Cite journal |last1=Argudo-Fern\u00e1ndez |first1=M. |last2=Verley |first2=S. |last3=Bergond |first3=G. |last4=Duarte Puertas |first4=S. |last5=Ramos Carmona |first5=E. |last6=Sabater |first6=J. |last7=Fern\u00e1ndez Lorenzo |first7=M. |last8=Espada |first8=D. |last9=Sulentic |first9=J. |last10=Ruiz |first10=J. E. |last11=Leon |first11=S. |date=June 2015 |title=Catalogues of isolated galaxies, isolated pairs, and isolated triplets in the local Universe |url=http:\u002f\u002fwww.aanda.org\u002f10.1051\u002f0004-6361\u002f201526016 |journal=[[Astronomy & Astrophysics]] |volume=578 |pages=A110 |doi=10.1051\u002f0004-6361\u002f201526016 |issn=0004-6361|arxiv=1504.00117 |bibcode=2015A&A...578A.110A }}\u003c\u002fref\u003e Only about 5% of the galaxies surveyed are isolated in this sense.\u003cref\u003e{{Cite journal |last1=Karachentsev |first1=I. D. |last2=Makarov |first2=D. I. |last3=Karachentseva |first3=V. E. |last4=Melnyk |first4=O. V. |date=January 2011 |title=Catalog of nearby isolated galaxies in the volume z \u003c 0.01 |url=http:\u002f\u002flink.springer.com\u002f10.1134\u002fS1990341311010019 |journal=Astrophysical Bulletin |language=en |volume=66 |issue=1 |pages=1\u201327 |arxiv=1103.3990 |doi=10.1134\u002fS1990341311010019 |bibcode=2011AstBu..66....1K |issn=1990-3413}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Melnyk |first1=O. |last2=Karachentseva |first2=V. |last3=Karachentsev |first3=I. |date=2015-08-01 |title=Star formation rates in isolated galaxies selected from the Two-Micron All-Sky Survey |url=http:\u002f\u002facademic.oup.com\u002fmnras\u002farticle\u002f451\u002f2\u002f1482\u002f1750461\u002fStar-formation-rates-in-isolated-galaxies-selected |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=451 |issue=2 |pages=1482\u20131495 |doi=10.1093\u002fmnras\u002fstv950 |doi-access=free |issn=1365-2966|arxiv=1504.07990 }}\u003c\u002fref\u003e However, they may have interacted and even merged with other galaxies in the past,\u003cref\u003e{{Cite journal |last1=Hirschmann |first1=Michaela |last2=De Lucia |first2=Gabriella |last3=Iovino |first3=Angela |last4=Cucciati |first4=Olga |date=2013-08-01 |title=Isolated galaxies in hierarchical galaxy formation models \u2013 present-day properties and environmental histories |url=http:\u002f\u002facademic.oup.com\u002fmnras\u002farticle\u002f433\u002f2\u002f1479\u002f1750237\u002fIsolated-galaxies-in-hierarchical-galaxy-formation |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=433 |issue=2 |pages=1479\u20131491 |arxiv=1302.3616 |bibcode=2013MNRAS.433.1479H |doi=10.1093\u002fmnras\u002fstt827 |doi-access=free |issn=1365-2966}}\u003c\u002fref\u003e and may still be orbited by smaller satellite galaxies.\u003cref\u003e{{Cite journal |last1=Wang |first1=Wenting |last2=White |first2=Simon D. M. |date=2012-08-21 |title=Satellite abundances around bright isolated galaxies: Satellite abundances |journal=[[Monthly Notices of the Royal Astronomical Society]] |language=en |volume=424 |issue=4 |pages=2574\u20132598 |arxiv=1203.0009 |bibcode=2012MNRAS.424.2574W |doi=10.1111\u002fj.1365-2966.2012.21256.x|doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-On the largest scale, the universe is continually expanding, resulting in an average increase in the separation between individual galaxies (see [[Hubble's law]]). Associations of galaxies can overcome this expansion on a local scale through their mutual gravitational attraction. These associations formed early, as clumps of dark matter pulled their respective galaxies together. Nearby groups later merged to form larger-scale clusters. This ongoing merging process, as well as an influx of infalling gas, heats the intergalactic gas in a cluster to very high temperatures of 30\u2013100 [[megakelvin]]s.\u003cref\u003e{{cite web\u003cbr\u003e- |url=http:\u002f\u002fchandra.harvard.edu\u002fxray_sources\u002fgalaxy_clusters.html\u003cbr\u003e- |title=Groups & Clusters of Galaxies\u003cbr\u003e- |website=[[Chandra X-ray Observatory]]\u003cbr\u003e- |publisher=[[Harvard\u2013Smithsonian Center for Astrophysics]]\u003cbr\u003e- |access-date=January 15, 2007\u003cbr\u003e- |archive-date=February 22, 2024\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240222032114\u002fhttps:\u002f\u002fchandra.harvard.edu\u002fxray_sources\u002fgalaxy_clusters.html\u003cbr\u003e- |url-status=live\u003cbr\u003e- }}\u003c\u002fref\u003e About 70\u201380% of a cluster's mass is in the form of dark matter, with 10\u201330% consisting of this heated gas and the remaining few percent in the form of galaxies.\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Ricker\u003cbr\u003e- |first1=Paul\u003cbr\u003e- |title=When Galaxy Clusters Collide\u003cbr\u003e- |url=http:\u002f\u002fwww.sdsc.edu\u002fpub\u002fenvision\u002fv15.2\u002fricker.html\u003cbr\u003e- |website=[[San Diego Supercomputer Center]]\u003cbr\u003e- |publisher=[[University of California, San Diego]]\u003cbr\u003e- |access-date=April 21, 2024\u003cbr\u003e- |archive-date=August 2, 2023\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230802142051\u002fhttps:\u002f\u002fwww.sdsc.edu\u002fpub\u002fenvision\u002fv15.2\u002fricker.html\u003cbr\u003e- |url-status=dead\u003cbr\u003e- }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Most galaxies are gravitationally bound to a number of other galaxies. These form a [[fractal]]-like hierarchical distribution of clustered structures, with the smallest such associations being termed groups. A group of galaxies is the most common type of galactic cluster; these formations contain the majority of galaxies (as well as most of the [[baryon]]ic mass) in the universe.\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Pompei|first1=Emanuela\u003cbr\u003e- |last2=Dahlem|first2=Michael\u003cbr\u003e- |last3=Iovino|first3=Angela\u003cbr\u003e- |editor-last=Dahlem |editor-first=Michael\u003cbr\u003e- |date=November 24, 2006\u003cbr\u003e- |title=Optical and radio survey of Southern Compact Groups of galaxies\u003cbr\u003e- |url=http:\u002f\u002fwww.atnf.csiro.au\u002fpeople\u002fmdahlem\u002fsci\u002fSCGs.html\u003cbr\u003e- |publisher=[[University of Birmingham]] Astrophysics and Space Research Group\u003cbr\u003e- |access-date=January 15, 2007\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20070613151936\u002fhttp:\u002f\u002fwww.atnf.csiro.au\u002fpeople\u002fmdahlem\u002fsci\u002fSCGs.html\u003cbr\u003e- |archive-date=June 13, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref\u003e{{cite web\u003cbr\u003e- |last1=Ponman |first1=Trevor\u003cbr\u003e- |date=February 25, 2005\u003cbr\u003e- |title=Galaxy Systems: Groups\u003cbr\u003e- |url=http:\u002f\u002fwww.sr.bham.ac.uk\u002fresearch\u002fgroups.html\u003cbr\u003e- |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20090215023446\u002fhttp:\u002f\u002fwww.sr.bham.ac.uk\u002fresearch\u002fgroups.html\u003cbr\u003e- |archive-date=2009-02-15\u003cbr\u003e- |publisher=[[University of Birmingham]] Astrophysics and Space Research Group\u003cbr\u003e- |access-date=January 15, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e To remain gravitationally bound to such a group, each member galaxy must have a sufficiently low velocity to prevent it from escaping (see [[Virial theorem]]). If there is insufficient [[kinetic energy]], however, the group may evolve into a smaller number of galaxies through mergers.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Girardi |first1=Marisa\u003cbr\u003e- |last2=Giuricin |first2=G.\u003cbr\u003e- |s2cid=14059401\u003cbr\u003e- |date=2000\u003cbr\u003e- |title=The Observational Mass Function of Loose Galaxy Groups\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=540 |issue=1 |pages=45\u201356\u003cbr\u003e- |bibcode=2000ApJ...540...45G\u003cbr\u003e- |doi=10.1086\u002f309314\u003cbr\u003e-|arxiv = astro-ph\u002f0004149 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-\u003c!---{{unsolved|physics|The [[List of largest cosmic structures|largest structures]] in the universe are larger than expected. Are these actual structures or random density fluctuations?}}---\u003e\u003cbr\u003e-Clusters of galaxies consist of hundreds to thousands of galaxies bound together by gravity.\u003cref name=\"Hubble protocluster\"\u003e{{cite press release|title=Hubble Pinpoints Furthest Protocluster of Galaxies Ever Seen|url=http:\u002f\u002fwww.spacetelescope.org\u002fnews\u002fheic1201\u002f|access-date=January 22, 2015|publisher=[[NASA]], [[European Space Agency]]|archive-date=June 12, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180612140011\u002fhttp:\u002f\u002fwww.spacetelescope.org\u002fnews\u002fheic1201\u002f|url-status=live}}\u003c\u002fref\u003e Clusters of galaxies are often dominated by a single giant elliptical galaxy, known as the [[brightest cluster galaxy]], which, over time, [[tidal force|tidally]] destroys its satellite galaxies and adds their mass to its own.\u003cref\u003e{{cite journal\u003cbr\u003e- |last         = Dubinski\u003cbr\u003e- |first        = John\u003cbr\u003e- |s2cid = 3137328\u003cbr\u003e- |date         = 1998\u003cbr\u003e- |title        = The Origin of the Brightest Cluster Galaxies\u003cbr\u003e- |url          = http:\u002f\u002fwww.cita.utoronto.ca\u002f~dubinski\u002fbcg\u002f\u003cbr\u003e- |journal      = [[The Astrophysical Journal]]\u003cbr\u003e- |volume       = 502\u003cbr\u003e- |issue        = 2\u003cbr\u003e- |pages        = 141\u2013149\u003cbr\u003e- |doi          = 10.1086\u002f305901\u003cbr\u003e- |bibcode      = 1998ApJ...502..141D\u003cbr\u003e- |arxiv        = astro-ph\u002f9709102\u003cbr\u003e- |archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20110514155953\u002fhttp:\u002f\u002fwww.cita.utoronto.ca\u002f~dubinski\u002fbcg\u002f\u003cbr\u003e- |archive-date = May 14, 2011\u003cbr\u003e- |df           = mdy-all\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cbr\u003e-[[File:The southern plane of the Milky Way from the ATLASGAL survey.jpg|right|thumb|Southern plane of the Milky Way from submillimeter wavelengths\u003cref\u003e{{cite web|title=ATLASGAL Survey of Milky Way Completed|publisher=[[European Southern Observatory]]|url=http:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1606\u002f|access-date=7 March 2016|archive-date=March 24, 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210324074529\u002fhttps:\u002f\u002fwww.eso.org\u002fpublic\u002fnews\u002feso1606\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e-[[Supercluster]]s contain tens of thousands of galaxies, which are found in clusters, groups and sometimes individually. At the [[large-scale structure of the Cosmos|supercluster scale]], galaxies are arranged into sheets and filaments surrounding vast empty voids.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Bahcall |first1=Neta A.\u003cbr\u003e- |date=1988\u003cbr\u003e- |title=Large-scale structure in the Universe indicated by galaxy clusters\u003cbr\u003e- |journal=[[Annual Review of Astronomy and Astrophysics]]\u003cbr\u003e- |volume=26\u003cbr\u003e- |issue=1 |pages=631\u2013686\u003cbr\u003e- |bibcode=1988ARA&A..26..631B\u003cbr\u003e- |doi=10.1146\u002fannurev.aa.26.090188.003215\u003cbr\u003e-}}\u003c\u002fref\u003e Above this scale, the universe appears to be the same in all directions ([[isotropy|isotropic]] and [[wikt:Homogeneity|homogeneous]]),\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=Mandolesi |first1=Nazzareno\u003cbr\u003e- |s2cid=4349689\u003cbr\u003e- |display-authors=etal\u003cbr\u003e- |date=1986\u003cbr\u003e- |title=Large-scale homogeneity of the Universe measured by the microwave background\u003cbr\u003e- |journal=[[Letters to Nature]]\u003cbr\u003e- |volume=319\u003cbr\u003e- |issue=6056 |pages=751\u2013753\u003cbr\u003e- |doi=10.1038\u002f319751a0\u003cbr\u003e-|bibcode = 1986Natur.319..751M }}\u003c\u002fref\u003e though this notion has been challenged in recent years by numerous findings of large-scale structures that appear to be exceeding this scale. The [[Hercules\u2013Corona Borealis Great Wall]], currently the [[List of largest cosmic structures|largest structure]] in the universe found so far, is 10 billion [[light-year]]s (three gigaparsecs) in length.\u003cref name=HBHT2\u003e{{cite journal|last1=Horv\u00e1th|first1=Istv\u00e1n|last2=Bagoly|first2=Zsolt|last3=Hakkila|first3=Jon|last4=T\u00f3th|first4=L. Viktor|s2cid=56073380|title=New data support the existence of the Hercules\u2013Corona Borealis Great Wall|journal=[[Astronomy & Astrophysics]]|volume = 584|pages = A48|arxiv=1510.01933|year = 2015|doi = 10.1051\u002f0004-6361\u002f201424829|bibcode = 2015A&A...584A..48H }}\u003c\u002fref\u003e\u003cref name=HBHT\u003e{{cite journal|last1=Horv\u00e1th|first1=Istv\u00e1n|last2=Bagoly|first2=Zsolt|last3=Hakkila|first3=Jon|last4=T\u00f3th|first4=L. Viktor|title=Anomalies in the GRB spatial distribution|journal=Proceedings of Science|page=78|arxiv=1507.05528|bibcode = 2014styd.confE..78H |year=2014|doi=10.22323\u002f1.233.0078 |doi-access=free }}\u003c\u002fref\u003e\u003cref name=cookie\u003e{{Cite journal|arxiv =1507.00675 |last1 = Balazs|first1 = L. G.|title = A giant ring-like structure at 0.78\u003cz\u003c0.86 displayed by GRBs|journal = [[Monthly Notices of the Royal Astronomical Society]]|volume = 452|issue = 3|page = 2236|last2 =  Bagoly|first2 = Zsolt|last3 =  Hakkila|first3 = Jon E.|last4 = Horv\u00e1th|first4 = I.|last5 = Kobori|first5 = J.|last6 = Racz|first6 = I.|last7 = T\u00f3th|first7 = Laszlo V.|s2cid = 109936564|year = 2015|doi = 10.1093\u002fmnras\u002fstv1421| doi-access=free |bibcode = 2015MNRAS.452.2236B }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Milky Way galaxy is a member of an association named the [[Local Group]], a relatively small group of galaxies that has a diameter of approximately one&nbsp;megaparsec. The Milky Way and the Andromeda Galaxy are the two brightest galaxies within the group; many of the other member galaxies are dwarf companions of these two.\u003cref\u003e{{cite journal\u003cbr\u003e- |last1=van den Bergh |first1=Sidney\u003cbr\u003e- |author-link1=Sidney van den Bergh\u003cbr\u003e- |s2cid=1805423\u003cbr\u003e- |date=2000\u003cbr\u003e- |title=Updated Information on the Local Group\u003cbr\u003e- |journal=[[Publications of the Astronomical Society of the Pacific]]\u003cbr\u003e- |volume=112 |issue=770 |pages=529\u2013536\u003cbr\u003e- |bibcode=2000PASP..112..529V\u003cbr\u003e- |doi=10.1086\u002f316548\u003cbr\u003e-|arxiv = astro-ph\u002f0001040 }}\u003c\u002fref\u003e The Local Group itself is a part of a cloud-like structure within the [[Virgo Supercluster]], a large, extended structure of groups and clusters of galaxies centered on the [[Virgo Cluster]].\u003cref name=\"tully1982\"\u003e{{cite journal\u003cbr\u003e- |last1=Tully |first1=Richard Brent\u003cbr\u003e- |author-link1=R. Brent Tully\u003cbr\u003e- |date=1982\u003cbr\u003e- |title=The Local Supercluster\u003cbr\u003e- |journal=[[The Astrophysical Journal]]\u003cbr\u003e- |volume=257 |pages=389\u2013422\u003cbr\u003e- |bibcode=1982ApJ...257..389T\u003cbr\u003e- |doi=10.1086\u002f159999\u003cbr\u003e-|doi-access=free\u003cbr\u003e- }}\u003c\u002fref\u003e In turn, the Virgo Supercluster is a portion of the [[Laniakea Supercluster]].\u003cref\u003e{{Cite journal|last=Tempel|first=Elmo|date=2014-09-01|title=Cosmology: Meet the Laniakea supercluster|journal=[[Nature (journal)|Nature]]|volume=513|issue=7516|pages=41\u201342|doi=10.1038\u002f513041a|pmid=25186896|bibcode=2014Natur.513...41T|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Magnetic fields==\u003cbr\u003e Galaxies have [[magnetic field]]s of their own. A galaxy's magnetic field influences its dynamics in multiple ways, including affecting the formation of spiral arms and transporting angular momentum in gas clouds. The latter effect is particularly important, as it is a necessary factor for the gravitational collapse of those clouds, and thus for star formation.\u003cref name=\"galactic_magnetic_fields\"\u003e{{Cite journal|title = Galactic magnetic fields|journal = [[Scholarpedia]] |volume = 2|issue = 8|page = 2411|last = Beck|first = Rainer|doi = 10.4249\u002fscholarpedia.2411|bibcode = 2007SchpJ...2.2411B |year = 2007|doi-access = free}}\u003c\u002fref\u003e\u003cbr\u003e@@ -859,14 +659,65 @@\u003cbr\u003e  |archive-date=2008-03-25\u003cbr\u003e  |publisher=[[Harvard-Smithsonian Center for Astrophysics]]\u003cbr\u003e  |access-date=January 10, 2007\u003cbr\u003e-}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures allowed gasses to condense in to [[protogalaxies]], large scale gas clouds that were precursors to the first galaxies.\u003cref name=DayalFerrara2018\u003e{{Cite journal |last1=Dayal |first1=Pratika |last2=Ferrara |first2=Andrea |date=December 2018 |title=Early galaxy formation and its large-scale effects |url=https:\u002f\u002flinkinghub.elsevier.com\u002fretrieve\u002fpii\u002fS0370157318302266 |journal=[[Physics Reports]] |language=en |volume=780-782 |pages=1\u201364 |doi=10.1016\u002fj.physrep.2018.10.002|arxiv=1809.09136 |bibcode=2018PhR...780....1D }}\u003c\u002fref\u003e{{rp|6}}\u003cbr\u003e-\u003cbr\u003e-As gas falls in to the gravity of the dark matter halos, its pressure and temperature rise. To condense further, the gas must radiate energy. This process was slow in the early universe dominated by hydrogen atoms and molecules which are inefficient radiators compared to heavier elements. As clumps of gas aggregate forming rotating disks, temperatures and pressures continue to increase. Some places within the disk reach high enough density to form stars.\u003cbr\u003e-\u003cbr\u003e-[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist impression of a young galaxy accreting material]]\u003cbr\u003e-\u003cbr\u003e-Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them.\u003cref name=KlessenGlover2023\u003e{{Cite journal |last1=Klessen |first1=Ralf S. |last2=Glover |first2=Simon C.O. |date=2023-08-18 |title=The First Stars: Formation, Properties, and Impact |url=https:\u002f\u002fwww.annualreviews.org\u002fdoi\u002f10.1146\u002fannurev-astro-071221-053453 |journal=[[Annual Review of Astronomy and Astrophysics]] |language=en |volume=61 |issue=1 |pages=65\u2013130 |doi=10.1146\u002fannurev-astro-071221-053453 |arxiv=2303.12500 |bibcode=2023ARA&A..61...65K |issn=0066-4146}}\u003c\u002fref\u003e These were composed of primordial gas, almost entirely of hydrogen and helium.\u003cbr\u003e-Emission from the first stars heats the remaining gas helping to trigger additional star formation; the ultraviolet light emission from the first generation of stars re-ionized the surrounding neutral hydrogen in expanding spheres eventually reaching the entire universe, an event called [[reionization]].\u003cref\u003e{{cite journal\u003cbr\u003e+}}\u003c\u002fref\u003e\u003cref name=rmaa17_107 \u002f\u003e These primordial structures eventually became the galaxies we see today.\u003cref name=\"WRD-20230110\"\u003e{{cite magazine |last=Skibba |first=Ramin |title=Astronomers May Have Just Spotted the Universe's First Galaxies |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fastronomers-may-have-just-spotted-the-universes-first-galaxies\u002f |date=10 January 2023 |magazine=[[Wired (magazine)|Wired]] |accessdate=10 January 2023 }}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Young Galaxy Accreting Material.jpg|thumb|right|Artist's impression of a young galaxy accreting material]]\u003cbr\u003e+\u003cbr\u003e+==== Early galaxy formation ====\u003cbr\u003e+Evidence for the appearance of galaxies very early in the Universe's history was found in 2006, when it was discovered that the galaxy [[IOK-1]] has an unusually high [[redshift]] of 6.96, corresponding to just 750 million years after the Big Bang and making it the most distant and earliest-to-form galaxy seen at that time.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=McMahon |first1=Richard\u003cbr\u003e+ |s2cid=28977650\u003cbr\u003e+ |date=2006\u003cbr\u003e+ |title=Astronomy: Dawn after the dark age\u003cbr\u003e+ |journal=[[Nature (journal)|Nature]]\u003cbr\u003e+ |volume=443 |issue=7108 |pages=151\u20132\u003cbr\u003e+ |doi=10.1038\u002f443151a\u003cbr\u003e+ |pmid=16971933\u003cbr\u003e+|bibcode = 2006Natur.443..151M }}\u003c\u002fref\u003e\u003cbr\u003e+While some scientists have claimed other objects, such as [[Galaxy Abell 1835 IR1916|Abell 1835 IR1916]], have higher redshifts, and therefore are seen in an earlier stage of the universe's evolution, [[IOK-1|IOK-1's]] age and composition have been more reliably established. In December 2012, astronomers reported [[UDFj-39546284]] to be the most distant object known at the time, with a redshift value of 11.9\u003cref name=\"Bouwens2013\"\u003e{{cite journal|bibcode=2013ApJ...765L..16B|arxiv=1211.3105|title=Photometric Constraints on the Redshift of z ~ 10 Candidate UDFj-39546284 from Deeper WFC3\u002fIR+ACS+IRAC Observations over the HUDF|journal=The Astrophysical Journal Letters|volume=765|pages=L16|last1=Bouwens|first1=R. J.| author-link1 = Rychard Bouwens| last2=Oesch|first2=P. A.|last3=Illingworth|first3=G. D.|last4=Labb\u00e9|first4=I.|last5=Van Dokkum|first5=P. G.|last6=Brammer|first6=G.|last7=Magee|first7=D.|last8=Spitler|first8=L. R.|last9=Franx|first9=M.|last10=Smit|first10=R.|last11=Trenti|first11=M.|last12=Gonzalez|first12=V.|last13=Carollo|first13=C. M.| author-link13 = C. Marcella Carollo|display-authors=1|year=2013|issue=1|doi=10.1088\u002f2041-8205\u002f765\u002f1\u002fL16}}\u003c\u002fref\u003e\u003cref name=\"Space-20121212\"\u003e{{cite web |last=Wall |first=Mike |title=Ancient Galaxy May Be Most Distant Ever Seen |url=http:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |date=December 12, 2012 |website=[[Space.com]] |access-date=December 12, 2012 |archive-date=May 4, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190504165521\u002fhttps:\u002f\u002fwww.space.com\u002f18879-hubble-most-distant-galaxy.html |url-status=live }}\u003c\u002fref\u003e which was later confirmed to be 11.58 by the [[Near-Infrared Spectrograph]] (NIRSpec) instrument on the [[James Webb Space Telescope]] (JWST).\u003cref name=\"Robertson2022\"\u003e{{cite journal |display-authors = etal |first1 = B. E. |last1 = Robertson |title = Identification and properties of intense star-forming galaxies at redshifts z \u003e 10 |journal = [[Nature Astronomy]] |date = 2023 |volume = 7 |issue = 5 |pages = 611\u2013621 |doi = 10.1038\u002fs41550-023-01921-1 |arxiv = 2212.04480|s2cid = 257968812 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In September 2022, the JWST discovered [[JADES-GS-z13-0]], a galaxy with a redshift value of 13.2, establishing it as the oldest and most distant spectroscopically-confirmed astronomical object known as of 2024.\u003cref name=\"Robertson2022\"\u002f\u003e\u003cref name=\"Curtis-Lake2022\"\u003e{{cite journal|display-authors = etal|first1 = Emma |last1 = Curtis-Lake|first2 = Stefano |last2 = Carniani|first3 = Alex |last3 = Cameron|title = Spectroscopy of four metal-poor galaxies beyond redshift ten|url = https:\u002f\u002fwebbtelescope.org\u002ffiles\u002flive\u002fsites\u002fwebb\u002ffiles\u002fhome\u002fwebb-science\u002fearly-highlights\u002f_documents\u002f2022-061-jades\u002fJADES_CurtisLake.pdf|journal = [[Nature Astronomy]]|volume = 7|pages = 622\u2013632|year = 2023|arxiv = 2212.04568|doi=10.1038\u002fs41550-023-01918-w}}\u003c\u002fref\u003e JADES-GS-z13-0, estimated to have existed only 350 million years after the Big Bang, has a [[light-travel distance]] of 13.4 billion years.{{efn|That is, the light from this galaxy has taken 13.4 billion years to reach Earth.}}\u003cref name=\"ThaddeusCesari\"\u003e{{cite press release|title = NASA's Webb Reaches New Milestone in Quest for Distant Galaxies|url = https:\u002f\u002fblogs.nasa.gov\u002fwebb\u002f2022\u002f12\u002f09\u002fnasas-webb-reaches-new-milestone-in-quest-for-distant-galaxies\u002f|publisher=[[NASA]]|first = Thaddeus |last = Cesari|date = 9 December 2022|accessdate = 23 April 2024}}\u003c\u002fref\u003e Although thought to be a galaxy, a 2023 study suggested that this object is actually a [[Dark star (dark matter)|dark star]],\u003cref\u003e{{Cite journal |last1=Ilie |first1=Cosmin |last2=Paulin |first2=Jillian |last3=Freese |first3=Katherine |year=2023 |title=Supermassive Dark Star candidates seen by JWST? |journal=[[Proceedings of the National Academy of Sciences of the United States of America|Proceedings of the National Academy of Sciences]] |volume=120 |issue=30 |pages=e2305762120 |doi=10.1073\u002fpnas.2305762120 |pmid=37433001 |pmc=10372643 |arxiv=2304.01173 |bibcode=2023PNAS..12005762I |url=https:\u002f\u002fui.adsabs.harvard.edu\u002fabs\u002f2023arXiv230401173I}}\u003c\u002fref\u003e which would make [[UNCOVER-z13]] the most distant galaxy instead.\u003cref\u003e{{Cite journal |last1=Wang |first1=Bingjie |last2=Fujimoto |first2=Seiji |last3=Labb\u00e9 |first3=Ivo |last4=Furtak |first4=Lukas J. |last5=Miller |first5=Tim B. |last6=Setton |first6=David J. |last7=Zitrin |first7=Adi |last8=Atek |first8=Hakim |last9=Bezanson |first9=Rachel |last10=Brammer |first10=Gabriel |last11=Leja |first11=Joel |last12=Oesch |first12=Pascal A. |last13=Price |first13=Sedona H. |last14=Chemerynska |first14=Iryna |last15=Cutler |first15=Sam E. |display-authors=1|date=November 2023 |title=UNCOVER: Illuminating the Early Universe\u2014JWST\u002fNIRSpec Confirmation of z \u003e 12 Galaxies |journal=[[The Astrophysical Journal Letters]] |language=en |volume=957 |issue=2 |pages=L34 |doi=10.3847\u002f2041-8213\u002facfe07 |doi-access=free |arxiv=2308.03745 |bibcode=2023ApJ...957L..34W |issn=2041-8205}}\u003c\u002fref\u003e\u003cref\u003e{{cite web| title=James Webb Space Telescope finds 2 of the most distant galaxies ever seen| last1=Cooper | first1=Keith | date=14 November 2023 | website=[[Space.com]]| url=https:\u002f\u002fwww.space.com\u002fjames-webb-space-telescope-distant-galaxies| accessdate=23 April 2024 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The [[Near Infrared Camera]] (NIRCam) on the JWST has imaged numerous other very early galaxies.\u003cref name=\"UT-20220817\"\u003e{{cite news |last=Atkinson |first=Nancy |title=Here's the Largest Image JWST Has Taken So Far |url=https:\u002f\u002fwww.universetoday.com\u002f157168\u002fheres-the-largest-image-jwst-has-taken-so-far\u002f |date=17 August 2022 |work=[[Universe Today]] |accessdate=18 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"ES-20220818\"\u003e{{cite news |last=Whitt |first=Kelly Kizer |title=Webb's largest image of galaxies yet |url=https:\u002f\u002fearthsky.org\u002fspace\u002fwebb-largest-image-of-galaxies-yet\u002f |date=18 August 2022 |work=[[Earth & Sky]] |accessdate=19 August 2022 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20220823\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=How the Webb Telescope Expanded My Universe |url=https:\u002f\u002fwww.nytimes.com\u002f2022\u002f08\u002f23\u002fscience\u002fjames-webb-telescope-jupiter-galaxies.html |date=23 August 2022 |url-access=registration |work=[[The New York Times]] |accessdate=24 August 2022 }}\u003c\u002fref\u003e In May 2023, a study in the journal ''[[Nature (journal)|Nature]]'' identified an ultra-faint galaxy named JD1.\u003cref name=JD1_1\u003e{{cite journal| title=The nature of an ultra-faint galaxy in the cosmic dark ages seen with JWST| last1=Roberts-Borsani|first1=Guido|last2=Treu|first2=Tommaso |last3=Chen|first3=Wenlei|display-authors=1|journal=[[Nature (journal)|Nature]]| date=17 May 2023| volume=618| issue=7965| pages=480\u2013483| doi=10.1038\u002fs41586-023-05994-w| pmid=37198479| arxiv=2210.15639| bibcode=2023Natur.618..480R| s2cid=258741077}}\u003c\u002fref\u003e Galaxy JD1 was observed by the JWST using the NIRSpec instrument and was found to have a redshift value of 9.79.\u003cref name=JD1_1\u002f\u003e This means that JD1 was observed at 480 million years after the Big Bang when the universe was only about 4% of its present age.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u003e{{cite news| title=Astrophysicists confirm the faintest galaxy ever seen in the early universe| first=Holly| last=Ober| url=https:\u002f\u002fphys.org\u002fnews\u002f2023-06-astrophysicists-faintest-galaxy-early-universe.html| work=[[Phys.org]]| date=1 June 2023| access-date=12 June 2023}}\u003c\u002fref\u003e Observations of this ultra-faint galaxy were aided by the effect of a [[gravitational lens]] in the galaxy cluster [[Abell 2744]] which helped make the image of JD1 larger and 13 times brighter than it otherwise would be.\u003cref name=JD1_1\u002f\u003e\u003cref name=JD1_2\u002f\u003e This effect and the use of the JWST's [[NIRCam]] showed JD1's structure to be three starforming clumps of dust and gas.\u003cref name=JD1_2\u002f\u003e In late 2023, scientists also reported results suggesting that newborn galaxies in the very early universe were \"banana\"-shaped.\u003cref name=\"NYT-20240105\"\u003e{{cite news |last=Overbye |first=Dennis |authorlink=Dennis Overbye |title=The Early Universe Was Bananas |url=https:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |date=5 January 2024 |work=[[The New York Times]] |url-access=registration |url-status=live |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240106003249\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2024\u002f01\u002f05\u002fscience\u002fspace\u002fastronomy-galaxies-bananas.html |archivedate=6 January 2024 |accessdate=6 January 2024 }}\u003c\u002fref\u003e\u003cref name=\"AXV-2023\"\u003e{{cite journal |last1=Pandya |first1=Viraj |display-authors=et al. |title=Galaxies Going Bananas: Inferring the 3D Geometry of High-Redshift Galaxies with JWST-CEERS |journal=[[The Astrophysical Journal]] |volume=963 |number=1 |year=2024 |doi=10.3847\u002f1538-4357\u002fad1a13 |bibcode=2024ApJ...963...54P}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e+\u003cbr\u003e+The existence of galaxies so soon after the Big Bang suggests that [[protogalaxy|protogalaxies]] must have grown in the so-called \"dark ages\".\u003cref name=\"hqrdvj\" \u002f\u003e The detailed process by which the earliest galaxies formed is an open question in astrophysics. Theories can be divided into two categories: top-down and bottom-up. In top-down correlations (such as the Eggen\u2013Lynden-Bell\u2013Sandage [ELS] model), protogalaxies form in a large-scale simultaneous collapse lasting about one hundred million years.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Eggen |first1=Olin J.\u003cbr\u003e+ |author-link1=Olin J. Eggen\u003cbr\u003e+ |last2=Lynden-Bell |first2=Donald\u003cbr\u003e+ |author-link2=Donald Lynden-Bell\u003cbr\u003e+ |last3=Sandage |first3=Allan R.\u003cbr\u003e+ |author-link3=Allan Sandage\u003cbr\u003e+ |date=1962\u003cbr\u003e+ |title=Evidence from the motions of old stars that the Galaxy collapsed\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=136 |page=748\u003cbr\u003e+ |bibcode=1962ApJ...136..748E\u003cbr\u003e+ |doi=10.1086\u002f147433\u003cbr\u003e+}}\u003c\u002fref\u003e In bottom-up theories (such as the Searle-Zinn [SZ] model), small structures such as [[globular cluster]]s form first, and then a number of such bodies accrete to form a larger galaxy.\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Searle |first1=L.\u003cbr\u003e+ |last2=Zinn |first2=R.\u003cbr\u003e+ |date=1978\u003cbr\u003e+ |title=Compositions of halo clusters and the formation of the galactic halo\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=225 |issue=1 |pages=357\u2013379\u003cbr\u003e+ |bibcode=1978ApJ...225..357S\u003cbr\u003e+ |doi=10.1086\u002f156499\u003cbr\u003e+|doi-access=free\u003cbr\u003e+ }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Once protogalaxies began to form and contract, the first [[halo star]]s, called [[Population 3 stars|Population III stars]], appeared within them. These were composed almost entirely of hydrogen and helium and may have been more massive than 100 times the Sun's mass. If so, these huge stars would have quickly consumed their supply of fuel and became [[supernova]]e, releasing heavy elements into the [[interstellar medium]].\u003cref\u003e{{cite journal\u003cbr\u003e+ |last1=Heger |first1=Alexander\u003cbr\u003e+ |last2=Woosley |first2=Stanford E.\u003cbr\u003e+ |author-link2=Stanford E. Woosley\u003cbr\u003e+ |s2cid=16050642\u003cbr\u003e+ |date=2002\u003cbr\u003e+ |title=The Nucleosynthetic Signature of Population III\u003cbr\u003e+ |journal=[[The Astrophysical Journal]]\u003cbr\u003e+ |volume=567 |issue=1 |pages=532\u2013543\u003cbr\u003e+ |bibcode=2002ApJ...567..532H\u003cbr\u003e+ |doi=10.1086\u002f338487\u003cbr\u003e+|arxiv = astro-ph\u002f0107037 }}\u003c\u002fref\u003e This first generation of stars re-ionized the surrounding neutral hydrogen, creating expanding bubbles of space through which light could readily travel.\u003cref\u003e{{cite journal\u003cbr\u003e  |last1=Barkana\u003cbr\u003e  |first1=Rennan\u003cbr\u003e  |last2=Loeb\u003cbr\u003e@@ -881,20 +732,11 @@\u003cbr\u003e  |pages=125\u2013238\u003cbr\u003e  |bibcode=2001PhR...349..125B\u003cbr\u003e  |arxiv=astro-ph\u002f0010468\u003cbr\u003e- |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf\u003cbr\u003e- |archive-date=March 14, 2021\u003cbr\u003e- }}\u003c\u002fref\u003e The most massive stars collapse in violent [[supernova]] explosions releasing heavy elements (\"metals\") into the [[interstellar medium]].\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e\u003cref name=DayalFerrara2018\u002f\u003e{{rp|14}} This metal content is incorporated into [[population II stars]].\u003cbr\u003e-\u003cbr\u003e-Theoretical models for early galaxy formation have been verified and informed by a large number and variety of sophisticated astronomical observations.\u003cref name=DayalFerrara2018\u002f\u003e{{rp|43}} The photometric observations generally need spectroscopic confirmation due the large number mechanisms that can introduce systematic errors. For example, a high redshift (z ~ 16) photometric observation by [[James Webb Space Telescope]] (JWST) was later corrected to be closer to z ~ 5.\u003cref name=ConfirmRefute\u003e{{Cite journal |last1=Arrabal Haro |first1=Pablo |last2=Dickinson |first2=Mark |last3=Finkelstein |first3=Steven L. |last4=Kartaltepe |first4=Jeyhan S. |last5=Donnan |first5=Callum T. |last6=Burgarella |first6=Denis |last7=Carnall |first7=Adam C. |last8=Cullen |first8=Fergus |last9=Dunlop |first9=James S. |last10=Fern\u00e1ndez | the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1088\u002f0004-637X\u002f808\u002f2\u002f139}}\u003c\u002fref\u003e Subsequent observations\u003cref\u003e{{Cite journal |last1=Bowler |first1=R. A. A. |last2=McLure |first2=R. J. |last3=Dunlop |first3=J. S. |last4=McLeod |first4=D. J. |last5=Stanway |first5=E. R. |last6=Eldridge |first6=J. J. |last7=Jarvis |first7=M. J. |date=2017-04-05 |title=No evidence for Population III stars or a direct collapse black hole in the z = 6.6 Lyman \u03b1 emitter 'CR7' |journal=[[Monthly Notices of the Royal Astronomical Society]] |volume=469 |issue=1 |pages=448\u2013458 |doi=10.1093\u002fmnras\u002fstx839 |doi-access=free |issn=0035-8711|arxiv=1609.00727 }}\u003c\u002fref\u003e found metallic emission lines, O\u003csub\u003eIII\u003c\u002fsub\u003e, inconsistent with an early-galaxy star.\u003cref name=KlessenGlover2023\u002f\u003e{{rp|108}}\u003cbr\u003e-\u003cbr\u003e-[[File:Signatures of the Earliest Galaxies.jpg|thumb|right|Different components of near-infrared background light detected by the [[Hubble Space Telescope]] in deep-sky surveys\u003cref\u003e{{cite web|title=Signatures of the Earliest Galaxies|publisher=[[European Space Agency]]|url=http:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|access-date=15 September 2015|archive-date=August 6, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200806191830\u002fhttps:\u002f\u002fwww.spacetelescope.org\u002fimages\u002fopo1534a\u002f|url-status=live}}\u003c\u002fref\u003e]]\u003cbr\u003e+ |doi=10.1016\u002fS0370-1573(01)00019-9 |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210314114618\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f471794\u002ffiles\u002f0010468.pdf}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In June 2015, astronomers reported evidence for [[Population 3 stars|Population III stars]] in the [[Cosmos Redshift 7]] galaxy at {{math|''z'' {{=}} 6.60}}. Such stars are likely to have existed in the very early universe (i.e., at high redshift), and may have started the production of [[chemical element]]s heavier than [[hydrogen]] that are needed for the later formation of planets and life as we know it.\u003cref name=\"AJ-20150604\"\u003e{{cite journal |last1=Sobral |first1=David |last2=Matthee |first2=Jorryt |last3=Darvish |first3=Behnam |last4=Schaerer |first4=Daniel |last5=Mobasher |first5=Bahram |last6=R\u00f6ttgering |first6=Huub J. A. |last7=Santos |first7=S\u00e9rgio |last8=Hemmati |first8=Shoubaneh |display-authors=1 |s2cid=18471887 |title=Evidence for POPIII-like Stellar Populations in the Most Luminous LYMAN-\u03b1 Emitters at the Epoch of Re-ionisation: Spectroscopic Confirmation |date=4 June 2015 |journal=[[The Astrophysical Journal]] |doi=10.1088\u002f0004-637x\u002f808\u002f2\u002f139 |bibcode=2015ApJ...808..139S |volume=808 |issue=2 |page=139|arxiv = 1504.01734 }}\u003c\u002fref\u003e\u003cref name=\"NYT-20150617\"\u003e{{cite news |last=Overbye |first=Dennis |author-link=Dennis Overbye |title=Traces of Earliest Stars That Enriched Cosmos Are Spied |url=https:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |date=17 June 2015 |work=[[The New York Times]] |url-access=registration |access-date=17 June 2015 |archive-date=June 29, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190629125022\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2015\u002f06\u002f18\u002fscience\u002fspace\u002fastronomers-report-finding-earliest-stars-that-enriched-cosmos.html |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Evolution ===\u003cbr\u003e-Once stars begin to form, emit radiation, and in some cases explode, the process of galaxy formation becomes very complex, involving interactions between the forces of gravity, radiation, and thermal energy. Many details are still poorly understood.{{sfn|Longair|2008|p=583}}\u003cbr\u003e-\u003cbr\u003e Within a billion years of a galaxy's formation, key structures begin to appear.\u003cref name=\"SA-20221206\"\u003e{{cite news |last=O'Callaghan |first=Jonathan |date=6 December 2022 |title=Astronomers Grapple with JWST's Discovery of Early Galaxies |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fastronomers-grapple-with-jwsts-discovery-of-early-galaxies\u002f |url-access=subscription |accessdate=6 December 2022 |work=[[Scientific American]]}}\u003c\u002fref\u003e [[Globular cluster]]s, the central [[supermassive black hole]], and a [[bulge (astronomy)|galactic bulge]] of metal-poor [[metallicity|Population II stars]] form. The creation of a supermassive black hole appears to play a key role in actively regulating the growth of galaxies by limiting the total amount of additional matter added.\u003cref\u003e{{cite press release\u003cbr\u003e  |date        = February 9, 2005\u003cbr\u003e  |title       = Simulations Show How Growing Black Holes Regulate Galaxy Formation\u003cbr\u003e@@ -944,7 +786,7 @@\u003cbr\u003e  |editor-last1=Rebolo |editor-first1=Rafael\u003cbr\u003e  |editor-last2=Martin |editor-first2=Eduardo L.\u003cbr\u003e  |editor-last3=Osorio |editor-first3=Maria Rosa Zapatero\u003cbr\u003e- |journal=Brown Dwarfs and Extrasolar Planets\u003cbr\u003e+ |journal=Brown Dwarfs and Extrasolar Planets \u003cbr\u003e  |series=ASP Conference Series\u003cbr\u003e  |volume=134\u003cbr\u003e  |pages=431\u2013437\u003cbr\u003e@@ -952,7 +794,7 @@\u003cbr\u003e }}\u003c\u002fref\u003e\u003cbr\u003e {{Multiple image |direction=vertical |align=right |width=200 |image1=XDF-scale.jpg|image2=The Hubble eXtreme Deep Field.jpg |image3=XDF-separated.jpg |caption1=''[[Hubble Extreme Deep Field|XDF]]'' view field compared to the [[angular diameter|angular size]] of the [[Moon]]. Several thousand galaxies, each consisting of billions of [[star]]s, are in this small view. |caption2=''[[Hubble Extreme Deep Field|XDF]]'' (2012) view: Each light speck is a galaxy, some of which are as old as 13.2 billion years\u003cref name=\"Space-20120925\"\u003e{{cite web |last=Moskowitz |first=Clara | author-link= Clara Moskowitz |title=Hubble Telescope Reveals Farthest View Into Universe Ever |url=http:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |date=September 25, 2012 |website=[[Space.com]] |access-date=September 26, 2012 |archive-date=May 5, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200505111220\u002fhttps:\u002f\u002fwww.space.com\u002f17755-farthest-universe-view-hubble-space-telescope.html |url-status=live }}\u003c\u002fref\u003e&nbsp;\u2013 the [[observable universe]] is estimated to contain 200 billion to two trillion galaxies. |caption3=''[[Hubble Extreme Deep Field|XDF]]'' image shows (from left) fully mature galaxies, nearly mature galaxies (from five to nine billion years ago), and [[Protogalaxy|protogalaxies]], blazing with [[young star]]s (beyond nine billion years). |header=''[[Hubble Extreme Deep Field|Hubble eXtreme Deep Field (XDF)]]'' }}\u003cbr\u003e \u003cbr\u003e-Star formation rates in galaxies depend upon their local environment. Isolated 'void' galaxies have highest rate per stellar mass, with 'field' galaxies associated with spiral galaxies having lower rates and galaxies in dense cluster having the lowest rates.\u003cref\u003e{{Cite journal |last1=Rojas |first1=Randall R. |last2=Vogeley |first2=Michael S. |last3=Hoyle |first3=Fiona |last4=Brinkmann |first4=Jon |date=2005-05-10 |title=Spectroscopic Properties of Void Galaxies in the Sloan Digital Sky Survey |url=https:\u002f\u002fiopscience.iop.org\u002farticle\u002f10.1086\u002f428476 |journal=[[The Astrophysical Journal]] |langua
