 graph in this context is made up of ''[[Vertex (graph theory)|vertices]]'' (also called ''nodes'' or ''points'') which are connected by ''[[Glossary of graph theory terms#edge|edges]]'' (also called ''arcs'', ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in [[discrete mathematics]].\u003cbr\u003e ","--- Revision 47\u003cbr\u003e+++ Revision 48\u003cbr\u003e@@ -1,6 +1,6 @@\u003cbr\u003e {{about|sets of vertices connected by edges|graphs of mathematical functions|Graph of a function|other uses|Graph (disambiguation)}}\u003cbr\u003e {{short description|Area of discrete mathematics}}\u003cbr\u003e-[[File:Example of simple undirected graph 3.svg|thumb|upright=1|A graph with 6 vertices and 7 edges]]\u003cbr\u003e+[[File:Example of simple undirected graph 3.svg|thumb|upright=0.8|A graph with 6 vertices and 7 edges]]\u003cbr\u003e \u003cbr\u003e In [[mathematics]] and [[computer science]], '''graph theory''' is the study of ''[[graph (discrete mathematics)|graph]]s'', which are [[mathematical structures]] used to model pairwise relations between objects. A graph in this context is made up of ''[[Vertex (graph theory)|vertices]]'' (also called ''nodes'' or ''points'') which are connected by ''[[Glossary of graph theory terms#edge|edges]]'' (also called ''arcs'', ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in [[discrete mathematics]].\u003cbr\u003e ","--- Revision 48\u003cbr\u003e+++ Revision 49\u003cbr\u003e@@ -267,6 +267,7 @@\u003cbr\u003e * {{springer|title=Graph theory|id=p\u002fg045010}}\u003cbr\u003e * [http:\u002f\u002fwww.utm.edu\u002fdepartments\u002fmath\u002fgraph\u002f Graph theory tutorial] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120116185332\u002fhttp:\u002f\u002fwww.utm.edu\u002fdepartments\u002fmath\u002fgraph\u002f |date=2012-01-16 }}\u003cbr\u003e * [http:\u002f\u002fwww.gfredericks.com\u002fmain\u002fsandbox\u002fgraphs A searchable database of small connected graphs]\u003cbr\u003e+* [https:\u002f\u002fhouseofgraphs.org\u002f House of Graphs] \u2014 searchable database of graphs with a drawing-based search feature.\u003cbr\u003e * {{webarchive |url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20060206155001\u002fhttp:\u002f\u002fwww.nd.edu\u002f~networks\u002fgallery.htm |date=February 6, 2006 |title=Image gallery: graphs }}\u003cbr\u003e * {{usurped|1=[https:\u002f\u002fweb.archive.org\u002fweb\u002f20161114100939\u002fhttp:\u002f\u002fwww.babelgraph.org\u002flinks.html Concise, annotated list of graph theory resources for researchers]}}\u003cbr\u003e * [http:\u002f\u002fwww.kde.org\u002fapplications\u002feducation\u002frocs\u002f rocs] \u2014 a graph theory IDE","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -1,15 +1,14 @@\u003cbr\u003e {{about|sets of vertices connected by edges|graphs of mathematical functions|Graph of a function|other uses|Graph (disambiguation)}}\u003cbr\u003e {{short description|Area of discrete mathematics}}\u003cbr\u003e-[[File:Example of simple undirected graph 3.svg|thumb|upright=0.8|A graph with 6 vertices and 7 edges]]\u003cbr\u003e-\u003cbr\u003e-In [[mathematics]] and [[computer science]], '''graph theory''' is the study of ''[[graph (discrete mathematics)|graph]]s'', which are [[mathematical structures]] used to model pairwise relations between objects. A graph in this context is made up of ''[[Vertex (graph theory)|vertices]]'' (also called ''nodes'' or ''points'') which are connected by ''[[Glossary of graph theory terms#edge|edges]]'' (also called ''arcs'', ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in [[discrete mathematics]].\u003cbr\u003e+[[File:6n-graf.svg|thumb|A [[Graph drawing|drawing]] of a graph.]]\u003cbr\u003e+In mathematics, '''graph theory''' is the study of ''graphs'', which are mathematical structures used to model pairwise relations between objects. A graph in this context is made up of ''vertices'' (also called ''nodes'' or ''points'') which are connected by ''edges'' (also called ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in discrete mathematics.\u003cbr\u003e \u003cbr\u003e == Definitions ==\u003cbr\u003e {{further|Glossary of graph theory}}\u003cbr\u003e Definitions in graph theory vary. The following are some of the more basic ways of defining graphs and related [[mathematical structure]]s.\u003cbr\u003e \u003cbr\u003e === Graph ===\u003cbr\u003e-[[File:Example of simple undirected graph.svg|150 px|thumb|An undirected graph with three vertices and three edges.]]\u003cbr\u003e+[[File:Undirected.svg|thumb|A graph with three vertices and three edges.]]\u003cbr\u003e \u003cbr\u003e In one restricted but very common sense of the term,{{sfn|Bender|Williamson|2010|p=148}}\u003cref\u003eSee, for instance, Iyanaga and Kawada, ''69 J'', p. 234 or Biggs, p. 4.\u003c\u002fref\u003e a '''graph''' is an [[ordered pair]] \u003cmath\u003eG=(V,E)\u003c\u002fmath\u003e comprising:\u003cbr\u003e * \u003cmath\u003eV\u003c\u002fmath\u003e, a [[Set (mathematics)|set]] of '''vertices''' (also called '''nodes''' or '''points''');\u003cbr\u003e@@ -17,35 +16,26 @@\u003cbr\u003e \u003cbr\u003e To avoid ambiguity, this type of object may be called precisely an '''undirected simple graph'''.\u003cbr\u003e \u003cbr\u003e-In the edge \u003cmath\u003e\\{x, y\\}\u003c\u002fmath\u003e, the vertices \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are called the '''endpoints''' of the edge. The edge is said to '''join''' \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e and to be '''incident''' on \u003cmath\u003ex\u003c\u002fmath\u003e and on \u003cmath\u003ey\u003c\u002fmath\u003e. A vertex may exist in a graph and not belong to an edge. Under this definition, '''[[multiple edges]]''', in which two or more edges connect the same vertices, are not allowed.\u003cbr\u003e-[[File:Example of simple undirected graph with loops.svg|150px|thumb|Example of an undirected multigraph with 3 vertices, 3 edges and 4 loops.]]\u003cbr\u003e-{{Multiple image\u003cbr\u003e- | image1 = Example of simple undirected graph 2.svg\u003cbr\u003e- | width1 = 75\u003cbr\u003e- | caption1 =For vertices A,B,C and D, the degrees are respectively 4,4,5,1\u003cbr\u003e- | image2 = Example of simple undirected graph 1.svg\u003cbr\u003e- | width2 = 75\u003cbr\u003e- | caption2 = For vertices U,V,W and X, the degrees are 2,2,3 and 1 respectively.\u003cbr\u003e- | footer = Examples of finding the degree of vertices.\u003cbr\u003e-}}\u003cbr\u003e+In the edge \u003cmath\u003e\\{x, y\\}\u003c\u002fmath\u003e, the vertices \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are called the '''endpoints''' of the edge. The edge is said to '''join''' \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e and to be '''incident''' on \u003cmath\u003ex\u003c\u002fmath\u003e and on \u003cmath\u003ey\u003c\u002fmath\u003e. A vertex may exist in a graph and not belong to an edge. '''[[Multiple edges]]''', not allowed under the definition above, are two or more edges that join the same two vertices.\u003cbr\u003e+\u003cbr\u003e In one more general sense of the term allowing multiple edges,{{sfn|Bender|Williamson|2010|p=149}}\u003cref\u003eSee, for instance, Graham et al., p. 5.\u003c\u002fref\u003e a '''graph''' is an ordered triple \u003cmath\u003eG=(V,E,\\phi)\u003c\u002fmath\u003e comprising:\u003cbr\u003e * \u003cmath\u003eV\u003c\u002fmath\u003e, a [[Set (mathematics)|set]] of '''vertices''' (also called '''nodes''' or '''points''');\u003cbr\u003e * \u003cmath\u003eE\u003c\u002fmath\u003e, a [[Set (mathematics)|set]] of '''edges''' (also called '''links''' or '''lines''');\u003cbr\u003e * \u003cmath\u003e\\phi : E \\to \\{ \\{x, y\\} \\mid x, y \\in V \\;\\textrm{ and }\\; x \\neq y \\}\u003c\u002fmath\u003e, an '''incidence function''' mapping every edge to an [[unordered pair]] of vertices (that is, an edge is associated with two distinct vertices).\u003cbr\u003e \u003cbr\u003e-To avoid ambiguity, this type of object may be called precisely an '''undirected [[multigraph]]'''.\u003cbr\u003e-\u003cbr\u003e-A '''[[Loop (graph theory)|loop]]''' is an edge that joins a vertex to itself. Graphs as defined in the two definitions above cannot have loops, because a loop joining a vertex \u003cmath\u003ex\u003c\u002fmath\u003e to itself is the edge (for an undirected simple graph) or is incident on (for an undirected multigraph) \u003cmath\u003e\\{x, x\\} = \\{x\\}\u003c\u002fmath\u003e which is not in \u003cmath\u003e\\{ \\{x, y\\} \\mid x, y \\in V \\;\\textrm{ and }\\; x \\neq y \\}\u003c\u002fmath\u003e. To allow loops, the definitions must be expanded. For undirected simple graphs, the definition of \u003cmath\u003eE\u003c\u002fmath\u003e should be modified to \u003cmath\u003eE \\subseteq \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. For undirected multigraphs, the definition of \u003cmath\u003e\\phi\u003c\u002fmath\u003e should be modified to \u003cmath\u003e\\phi : E \\to \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. To avoid ambiguity, these types of objects may be called '''undirected simple graph permitting loops''' and '''undirected multigraph permitting loops''' (sometimes also '''undirected [[pseudograph]]'''), respectively.\u003cbr\u003e+To avoid ambiguity, this type of object may be called precisely an '''undirected multigraph'''.\u003cbr\u003e+\u003cbr\u003e+A '''[[Loop (graph theory)|loop]]''' is an edge that joins a vertex to itself. Graphs as defined in the two definitions above cannot have loops, because a loop joining a vertex \u003cmath\u003ex\u003c\u002fmath\u003e to itself is the edge (for an undirected simple graph) or is incident on (for an undirected multigraph) \u003cmath\u003e\\{x, x\\} = \\{x\\}\u003c\u002fmath\u003e which is not in \u003cmath\u003e\\{ \\{x, y\\} \\mid x, y \\in V \\;\\textrm{ and }\\; x \\neq y \\}\u003c\u002fmath\u003e. So to allow loops the definitions must be expanded. For undirected simple graphs, the definition of \u003cmath\u003eE\u003c\u002fmath\u003e should be modified to \u003cmath\u003eE \\subseteq \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. For undirected multigraphs, the definition of \u003cmath\u003e\\phi\u003c\u002fmath\u003e should be modified to \u003cmath\u003e\\phi : E \\to \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. To avoid ambiguity, these types of objects may be called '''undirected simple graph permitting loops''' and '''undirected multigraph permitting loops''', respectively.\u003cbr\u003e \u003cbr\u003e \u003cmath\u003eV\u003c\u002fmath\u003e and \u003cmath\u003eE\u003c\u002fmath\u003e are usually taken to be finite, and many of the well-known results are not true (or are rather different) for infinite graphs because many of the arguments fail in the [[infinite graph|infinite case]]. Moreover, \u003cmath\u003eV\u003c\u002fmath\u003e is often assumed to be non-empty, but \u003cmath\u003eE\u003c\u002fmath\u003e is allowed to be the empty set. The '''order''' of a graph is \u003cmath\u003e|V|\u003c\u002fmath\u003e, its number of vertices. The '''size''' of a graph is \u003cmath\u003e|E|\u003c\u002fmath\u003e, its number of edges. The '''degree''' or '''valency''' of a vertex is the number of edges that are incident to it, where a loop is counted twice. The '''degree''' of a graph is the maximum of the degrees of its vertices.\u003cbr\u003e \u003cbr\u003e-In an undirected simple graph of order ''n'', the maximum degree of each vertex is {{nowrap|''n'' \u2212 1}} and the maximum size of the graph is {{sfrac|''n''(''n'' \u2212 1)|2}}.\u003cbr\u003e-\u003cbr\u003e-The edges of an undirected simple graph permitting loops \u003cmath\u003eG\u003c\u002fmath\u003e induce a symmetric [[Binary relation#Homogeneous relation|homogeneous relation]] \u003cmath\u003e\\sim\u003c\u002fmath\u003e on the vertices of \u003cmath\u003eG\u003c\u002fmath\u003e that is called the '''adjacency relation''' of \u003cmath\u003eG\u003c\u002fmath\u003e. Specifically, for each edge \u003cmath\u003e(x,y)\u003c\u002fmath\u003e, its endpoints \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are said to be '''adjacent''' to one another, which is denoted \u003cmath\u003ex \\sim y\u003c\u002fmath\u003e.\u003cbr\u003e+In an undirected simple graph of order ''n'', the maximum degree of each vertex is {{nowrap|''n'' \u2212 1}} and the maximum size of the graph is {{nowrap|''n''(''n'' \u2212 1)\u002f2}}.\u003cbr\u003e+\u003cbr\u003e+The edges of an undirected simple graph permitting loops \u003cmath\u003eG\u003c\u002fmath\u003e induce a symmetric [[Binary relation#Homogeneous relation|homogeneous relation]] ~ on the vertices of \u003cmath\u003eG\u003c\u002fmath\u003e that is called the '''adjacency relation''' of \u003cmath\u003eG\u003c\u002fmath\u003e. Specifically, for each edge \u003cmath\u003e(x,y)\u003c\u002fmath\u003e, its endpoints \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are said to be '''adjacent''' to one another, which is denoted \u003cmath\u003ex\u003c\u002fmath\u003e ~ \u003cmath\u003ey\u003c\u002fmath\u003e.\u003cbr\u003e \u003cbr\u003e === Directed graph ===\u003cbr\u003e {{main|Directed graph}}\u003cbr\u003e-[[File:Example of simple directed graph.svg|thumb|150px|A directed graph with three vertices and four directed edges (the double arrow represents an edge in each direction).]]\u003cbr\u003e+[[File:Directed.svg|thumb|A directed graph with three vertices and four directed edges (the double arrow represents an edge in each direction).]]\u003cbr\u003e \u003cbr\u003e A '''directed graph''' or '''digraph''' is a graph in which edges have orientations.\u003cbr\u003e \u003cbr\u003e@@ -53,7 +43,7 @@\u003cbr\u003e * \u003cmath\u003eV\u003c\u002fmath\u003e, a [[Set (mathematics)|set]] of ''vertices'' (also called ''nodes'' or ''points'');\u003cbr\u003e * \u003cmath\u003eE \\subseteq \\left\\{(x,y) \\mid (x, y) \\in V^2 \\;\\textrm{ and }\\; x \\neq y \\right\\}\u003c\u002fmath\u003e, a [[Set (mathematics)|set]] of ''edges'' (also called ''directed edges'', ''directed links'', ''directed lines'', ''arrows'' or ''arcs'') which are [[ordered pair]]s of vertices (that is, an edge is associated with two distinct vertices).\u003cbr\u003e \u003cbr\u003e-To avoid ambiguity, this type of object may be called precisely a '''directed simple graph'''. In set theory and graph theory, \u003cmath\u003eV^n\u003c\u002fmath\u003e denotes the set of {{mvar|n}}-[[tuple]]s of elements of \u003cmath\u003eV,\u003c\u002fmath\u003e that is, ordered sequences of \u003cmath\u003en\u003c\u002fmath\u003e elements that are not necessarily distinct.\u003cbr\u003e+To avoid ambiguity, this type of object may be called precisely a '''directed simple graph'''.\u003cbr\u003e \u003cbr\u003e In the edge \u003cmath\u003e(x, y)\u003c\u002fmath\u003e directed from \u003cmath\u003ex\u003c\u002fmath\u003e to \u003cmath\u003ey\u003c\u002fmath\u003e, the vertices \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are called the ''endpoints'' of the edge, \u003cmath\u003ex\u003c\u002fmath\u003e the ''tail'' of the edge and \u003cmath\u003ey\u003c\u002fmath\u003e the ''head'' of the edge. The edge is said to ''join'' \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e and to be ''incident'' on \u003cmath\u003ex\u003c\u002fmath\u003e and on \u003cmath\u003ey\u003c\u002fmath\u003e. A vertex may exist in a graph and not belong to an edge. The edge \u003cmath\u003e(y,x)\u003c\u002fmath\u003e is called the ''inverted edge'' of \u003cmath\u003e(x, y)\u003c\u002fmath\u003e. ''[[Multiple edges]]'', not allowed under the definition above, are two or more edges with both the same tail and the same head.\u003cbr\u003e \u003cbr\u003e@@ -69,12 +59,12 @@\u003cbr\u003e The edges of a directed simple graph permitting loops \u003cmath\u003eG\u003c\u002fmath\u003e is a [[Binary relation#Homogeneous relation|homogeneous relation]] ~ on the vertices of \u003cmath\u003eG\u003c\u002fmath\u003e that is called the ''adjacency relation'' of \u003cmath\u003eG\u003c\u002fmath\u003e. Specifically, for each edge \u003cmath\u003e(x,y)\u003c\u002fmath\u003e, its endpoints \u003cmath\u003ex\u003c\u002fmath\u003e and \u003cmath\u003ey\u003c\u002fmath\u003e are said to be ''adjacent'' to one another, which is denoted \u003cmath\u003ex\u003c\u002fmath\u003e ~ \u003cmath\u003ey\u003c\u002fmath\u003e.\u003cbr\u003e \u003cbr\u003e == Applications ==\u003cbr\u003e-[[File:Wikipedia multilingual network graph July 2013.svg|thumb|The network graph formed by Wikipedia editors (edges) contributing to different Wikipedia language versions (vertices) during one month in summer 2013.\u003cref\u003e{{Cite book|arxiv=1312.0976|last1=Hale|first1=Scott A.|title=Proceedings of the 2014 ACM conference on Web science |chapter=Multilinguals and Wikipedia editing |date=2014 |doi=10.1145\u002f2615569.2615684|pages=99\u2013108|isbn=9781450326223|bibcode=2013arXiv1312.0976H|s2cid=14027025}}\u003c\u002fref\u003e]]\u003cbr\u003e-\u003cbr\u003e-Graphs can be used to model many types of relations and processes in physical, biological,\u003cref\u003e{{cite journal |last=Mashaghi |first=A. |title=Investigation of a protein complex network |journal=European Physical Journal B |volume=41 |issue=1 |pages=113\u2013121 |year=2004 |doi=10.1140\u002fepjb\u002fe2004-00301-0 |display-authors=etal|arxiv=cond-mat\u002f0304207 |bibcode=2004EPJB...41..113M |s2cid=9233932 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Shah|first1=Preya|last2=Ashourvan|first2=Arian|last3=Mikhail|first3=Fadi|last4=Pines|first4=Adam|last5=Kini|first5=Lohith|last6=Oechsel|first6=Kelly|last7=Das|first7=Sandhitsu R|last8=Stein|first8=Joel M|last9=Shinohara|first9=Russell T|date=2019-07-01|title=Characterizing the role of the structural connectome in seizure dynamics|journal=Brain|language=en|volume=142|issue=7|pages=1955\u20131972|doi=10.1093\u002fbrain\u002fawz125|pmid=31099821|issn=0006-8950|pmc=6598625}}\u003c\u002fref\u003e social and information systems.\u003cref\u003e{{Cite journal|last1=Adali|first1=Tulay|last2=Ortega|first2=Antonio|date=May 2018|title=Applications of Graph Theory [Scanning the Issue]|url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f8349656|journal=Proceedings of the IEEE|volume=106|issue=5|pages=784\u2013786|doi=10.1109\u002fJPROC.2018.2820300|issn=0018-9219|url-access=subscription}}\u003c\u002fref\u003e Many practical problems can be represented by graphs. Emphasizing their application to real-world systems, the term ''network'' is sometimes defined to mean a graph in which attributes (e.g. names) are associated with the vertices and edges, and the subject that expresses and understands real-world systems as a network is called [[network science]].\u003cbr\u003e+[[File:Wikipedia multilingual network graph July 2013.svg|thumb|The network graph formed by Wikipedia editors (edges) contributing to different Wikipedia language versions (vertices) during one month in summer 2013.\u003cref\u003e{{Cite journal|arxiv=1312.0976|last1=Hale|first1=Scott A.|title=Multilinguals and Wikipedia Editing|year=2013|doi=10.1145\u002f2615569.2615684|journal=Proceedings of the 2014 ACM Conference on Web Science - WebSci '14|pages=99\u2013108|isbn=9781450326223|bibcode=2013arXiv1312.0976H|s2cid=14027025}}\u003c\u002fref\u003e]]\u003cbr\u003e+\u003cbr\u003e+Graphs can be used to model many types of relations and processes in physical, biological,\u003cref\u003e{{cite journal |last=Mashaghi |first=A. |title=Investigation of a protein complex network |journal=European Physical Journal B |volume=41 |issue=1 |pages=113\u2013121 |year=2004 |doi=10.1140\u002fepjb\u002fe2004-00301-0 |display-authors=etal|arxiv=cond-mat\u002f0304207 |bibcode=2004EPJB...41..113M |s2cid=9233932 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Shah|first1=Preya|last2=Ashourvan|first2=Arian|last3=Mikhail|first3=Fadi|last4=Pines|first4=Adam|last5=Kini|first5=Lohith|last6=Oechsel|first6=Kelly|last7=Das|first7=Sandhitsu R|last8=Stein|first8=Joel M|last9=Shinohara|first9=Russell T|date=2019-07-01|title=Characterizing the role of the structural connectome in seizure dynamics|journal=Brain|language=en|volume=142|issue=7|pages=1955\u20131972|doi=10.1093\u002fbrain\u002fawz125|pmid=31099821|issn=0006-8950|pmc=6598625}}\u003c\u002fref\u003e social and information systems.\u003cref\u003e{{Cite journal|last1=Adali|first1=Tulay|last2=Ortega|first2=Antonio|date=May 2018|title=Applications of Graph Theory [Scanning the Issue]|url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f8349656|journal=Proceedings of the IEEE|volume=106|issue=5|pages=784\u2013786|doi=10.1109\u002fJPROC.2018.2820300|issn=0018-9219}}\u003c\u002fref\u003e Many practical problems can be represented by graphs. Emphasizing their application to real-world systems, the term ''network'' is sometimes defined to mean a graph in which attributes (e.g. names) are associated with the vertices and edges, and the subject that expresses and understands the real-world systems as a network is called [[network science]].\u003cbr\u003e \u003cbr\u003e === Computer science ===\u003cbr\u003e-Within [[computer science]], '[[cybernetics|causal]]' and 'non-causal' linked structures are graphs that are used to represent networks of communication, data organization, computational devices, the flow of computation, etc. For instance, the link structure of a [[website]] can be represented by a directed graph, in which the vertices represent web pages and directed edges represent [[Hyperlink|links]] from one page to another. A similar approach can be taken to problems in social media,\u003cref\u003e{{Cite journal | volume = 3| issue = 1| last = Grandjean| first = Martin| title = A social network analysis of Twitter: Mapping the digital humanities community| journal =Cogent Arts & Humanities| date = 2016| pages = 1171458|doi=10.1080\u002f23311983.2016.1171458| s2cid = 114999767| url = https:\u002f\u002fhal.archives-ouvertes.fr\u002fhal-01517493\u002ffile\u002fA%20social%20network%20analysis%20of%20Twitter%20Mapping%20the%20digital%20humanities%20community.pdf| doi-access = free}}\u003c\u002fref\u003e travel, biology, computer chip design, mapping the progression of neuro-degenerative diseases,\u003cref\u003e{{Cite journal | volume = 11| issue = 2| last = Vecchio | first = F| title = \"Small World\" architecture in brain connectivity and hippocampal volume in Alzheimer's disease: a study via graph theory from EEG data| journal =Brain Imaging and Behavior| date = 2017| pages = 473\u2013485| pmid =26960946 | doi = 10.1007\u002fs11682-016-9528-3| s2cid = 3987492}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal | volume = 81| issue = 2| last = Vecchio | first = F| title = Brain network connectivity assessed using graph theory in frontotemporal dementia| journal = Neurology| date = 2013| pages = 134\u2013143| doi = 10.1212\u002fWNL.0b013e31829a33f8| pmid = 23719145| s2cid = 28334693}}\u003c\u002fref\u003e and many other fields. The development of [[algorithm]]s to [[List of algorithms#Graph algorithms|handle graphs]] is therefore of major interest in computer science. The [[Graph transformation|transformation of graph]]s is often formalized and represented by [[graph rewriting|graph rewrite system]]s. Complementary to [[graph transformation]] systems focusing on rule-based in-memory manipulation of graphs are [[graph database]]s geared towards [[Database transaction|transaction]]-safe, [[Persistence (computer science)|persistent]] storing and querying of [[Graph (data structure)|graph-structured data]].\u003cbr\u003e+In [[computer science]], graphs are used to represent networks of communication, data organization, computational devices, the flow of computation, etc. For instance, the link structure of a [[website]] can be represented by a directed graph, in which the vertices represent web pages and directed edges represent [[Hyperlink|links]] from one page to another. A similar approach can be taken to problems in social media,\u003cref\u003e{{Cite journal | volume = 3| issue = 1| last = Grandjean| first = Martin| title = A social network analysis of Twitter: Mapping the digital humanities community| journal =Cogent Arts & Humanities| date = 2016| pages = 1171458|doi=10.1080\u002f23311983.2016.1171458| s2cid = 114999767| url = https:\u002f\u002fhal.archives-ouvertes.fr\u002fhal-01517493\u002ffile\u002fA%20social%20network%20analysis%20of%20Twitter%20Mapping%20the%20digital%20humanities%20community.pdf| doi-access = free}}\u003c\u002fref\u003e travel, biology, computer chip design, mapping the progression of neuro-degenerative diseases,\u003cref\u003e{{Cite journal | volume = 11| issue = 2| last = Vecchio | first = F| title = \"Small World\" architecture in brain connectivity and hippocampal volume in Alzheimer's disease: a study via graph theory from EEG data| journal =Brain Imaging and Behavior| date = 2017| pages = 473\u2013485| pmid =26960946 | doi = 10.1007\u002fs11682-016-9528-3| s2cid = 3987492}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal | volume = 81| issue = 2| last = Vecchio | first = F| title = Brain network connectivity assessed using graph theory in frontotemporal dementia| journal = Neurology| date = 2013| pages = 134\u2013143| doi = 10.1212\u002fWNL.0b013e31829a33f8| pmid = 23719145| s2cid = 28334693}}\u003c\u002fref\u003e and many other fields. The development of [[algorithm]]s to handle graphs is therefore of major interest in computer science. The [[Graph transformation|transformation of graph]]s is often formalized and represented by [[graph rewriting|graph rewrite system]]s. Complementary to [[graph transformation]] systems focusing on rule-based in-memory manipulation of graphs are [[graph database]]s geared towards [[Database transaction|transaction]]-safe, [[Persistence (computer science)|persistent]] storing and querying of [[Graph (data structure)|graph-structured data]].\u003cbr\u003e \u003cbr\u003e === Linguistics ===\u003cbr\u003e Graph-theoretic methods, in various forms, have proven particularly useful in [[linguistics]], since natural language often lends itself well to discrete structure. Traditionally, [[syntax]] and compositional semantics follow tree-based structures, whose expressive power lies in the [[principle of compositionality]], modeled in a hierarchical graph. More contemporary approaches such as [[head-driven phrase structure grammar]] model the syntax of natural language using [[feature structure|typed feature structure]]s, which are [[directed acyclic graph]]s. \u003cbr\u003e@@ -84,7 +74,8 @@\u003cbr\u003e Graph theory is also used to study molecules in [[chemistry]] and [[physics]]. In [[condensed matter physics]], the three-dimensional structure of complicated simulated atomic structures can be studied quantitatively by gathering statistics on graph-theoretic properties related to the topology of the atoms. Also, \"the [[Feynman diagram|Feynman graphs and rules of calculation]] summarize [[quantum field theory]] in a form in close contact with the experimental numbers one wants to understand.\"\u003cref\u003e{{cite book|first1=J. D.|last1=Bjorken |first2=S. D. |last2=Drell |title=Relativistic Quantum Fields |url=https:\u002f\u002farchive.org\u002fdetails\u002frelativisticquan0000bjor_c5q0|url-access=registration|publisher=McGraw-Hill |location=New York |year=1965 |page=viii }}\u003c\u002fref\u003e In chemistry a graph makes a natural model for a molecule, where vertices represent [[atom]]s and edges [[Chemical bond|bond]]s. This approach is especially used in computer processing of molecular structures, ranging from [[Molecule editor|chemical editor]]s to database searching. In [[statistical physics]], graphs can represent local connections between interacting parts of a system, as well as the dynamics of a physical process on such\u003cbr\u003e systems. Similarly, in [[computational neuroscience]] graphs can be used to represent functional connections between brain areas that interact to give rise to various cognitive processes, where the vertices represent different areas of the brain and the edges represent the connections between those areas. Graph theory plays an important role in electrical modeling of electrical networks, here, weights are associated with resistance of the wire segments to obtain electrical properties of network structures.\u003cref\u003e{{Cite journal|last1=Kumar|first1=Ankush|last2=Kulkarni|first2=G. U.|date=2016-01-04|title=Evaluating conducting network based transparent electrodes from geometrical considerations|journal=Journal of Applied Physics|volume=119|issue=1|pages=015102|doi=10.1063\u002f1.4939280|issn=0021-8979|bibcode=2016JAP...119a5102K}}\u003c\u002fref\u003e Graphs are also used to represent the micro-scale channels of [[Porous medium|porous media]], in which the vertices represent the pores and the edges represent the smaller channels connecting the pores. [[Chemical graph theory]] uses the [[molecular graph]] as a means to model molecules.\u003cbr\u003e Graphs and networks are excellent models to study and understand phase transitions and critical phenomena.\u003cbr\u003e-Removal of nodes or edges leads to a critical transition where the network breaks into small clusters which is studied as a phase transition. This breakdown is studied via [[percolation theory]].\u003cref\u003e{{Cite book| last = Newman| first = Mark| title = Networks: An Introduction| publisher = Oxford University Press| date = 2010| url = http:\u002f\u002fmath.sjtu.edu.cn\u002ffaculty\u002fxiaodong\u002fcourse\u002fNetworks%20An%20introduction.pdf| access-date = 2019-10-30| archive-date = 2020-07-28| archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20200728132820\u002fhttp:\u002f\u002fmath.sjtu.edu.cn\u002ffaculty\u002fxiaodong\u002fcourse\u002fNetworks%20An%20introduction.pdf| url-status = dead}}\u003c\u002fref\u003e\u003cbr\u003e+Removal of nodes or edges lead to a critical transition where the network breaks into small clusters which is studied as a phase transition. This breakdown is studied via percolation theory.\u003cref\u003e{{Cite book |last = Newman| first = Mark | title = Networks: An Introduction| publisher=Oxford University Press| date = 2010|  url = http:\u002f\u002fmath.sjtu.edu.cn\u002ffaculty\u002fxiaodong\u002fcourse\u002fNetworks%20An%20introduction.pdf}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref\u003eReuven Cohen, Shlomo Havlin (2010). Complex Networks: Structure, Robustness and Function  Cambridge University Press. \u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Social sciences ===\u003cbr\u003e [[File:Moreno Sociogram 2nd Grade.png|thumb|Graph theory in sociology: [[Jacob L. Moreno|Moreno]] [[Sociogram]] (1953).\u003cref\u003eGrandjean, Martin (2015). [http:\u002f\u002fwww.martingrandjean.ch\u002fsocial-network-analysis-visualization-morenos-sociograms-revisited\u002f \"Social network analysis and visualization: Moreno\u2019s Sociograms revisited\"]. Redesigned network strictly based on Moreno (1934), ''Who Shall Survive''.\u003c\u002fref\u003e]]\u003cbr\u003e@@ -93,12 +84,12 @@\u003cbr\u003e === Biology ===\u003cbr\u003e Likewise, graph theory is useful in [[biology]] and conservation efforts where a vertex can represent regions where certain species exist (or inhabit) and the edges represent migration paths or movement between the regions. This information is important when looking at breeding patterns or tracking the spread of disease, parasites or how changes to the movement can affect other species.\u003cbr\u003e \u003cbr\u003e-Graphs are also commonly used in [[molecular biology]] and [[genomics]] to model and analyse datasets with complex relationships. For example, graph-based methods are often used to 'cluster' cells together into cell-types in [[Single-cell_analysis#Transcriptomics|single-cell transcriptome analysis]]. Another use is to model genes or proteins in a [[Biological pathway|pathway]] and study the relationships between them, such as metabolic pathways and gene regulatory networks.\u003cref\u003e{{cite journal | last1=Kelly | first1=S. | last2=Black | first2=Michael | title=graphsim: An R package for simulating gene expression data from graph structures of biological pathways | journal=Journal of Open Source Software | publisher=The Open Journal | volume=5 | issue=51 | date=2020-07-09 | issn=2475-9066 | doi=10.21105\u002fjoss.02161 | page=2161| bibcode=2020JOSS....5.2161K |biorxiv=10.1101\u002f2020.03.02.972471|s2cid=214722561| doi-access=free | url=https:\u002f\u002fwww.biorxiv.org\u002fcontent\u002fbiorxiv\u002fearly\u002f2020\u002f06\u002f30\u002f2020.03.02.972471.full.pdf }}\u003c\u002fref\u003e Evolutionary trees, ecological networks, and hierarchical clustering of gene expression patterns are also represented as graph structures. \u003cbr\u003e+Graphs are also commonly used in [[molecular biology]] and [[genomics]] to model and analyse datasets with complex relationships. For example, graph-based methods are often used to 'cluster' cells together into cell-types in [[Single-cell_analysis#Transcriptomics|single-cell transcriptome analysis]]. Another use is to model genes or proteins in a [[Biological pathway|pathway]] and study the relationships between them, such as metabolic pathways and gene regulatory networks.\u003cref\u003e{{cite journal | last1=Kelly | first1=S. | last2=Black | first2=Michael | title=graphsim: An R package for simulating gene expression data from graph structures of biological pathways | journal=Journal of Open Source Software | publisher=The Open Journal | volume=5 | issue=51 | date=2020-07-09 | issn=2475-9066 | doi=10.21105\u002fjoss.02161 | page=2161|biorxiv=10.1101\u002f2020.03.02.972471|s2cid=214722561}}\u003c\u002fref\u003e Evolutionary trees, ecological networks, and hierarchical clustering of gene expression patterns are also represented as graph structures. \u003cbr\u003e \u003cbr\u003e Graph theory is also used in [[connectomics]];\u003cref\u003e{{Cite journal|last1=Shah|first1=Preya|last2=Ashourvan|first2=Arian|last3=Mikhail|first3=Fadi|last4=Pines|first4=Adam|last5=Kini|first5=Lohith|last6=Oechsel|first6=Kelly|last7=Das|first7=Sandhitsu R|last8=Stein|first8=Joel M|last9=Shinohara|first9=Russell T|date=2019-07-01|title=Characterizing the role of the structural connectome in seizure dynamics|journal=Brain|language=en|volume=142|issue=7|pages=1955\u20131972|doi=10.1093\u002fbrain\u002fawz125|pmid=31099821|issn=0006-8950|pmc=6598625}}\u003c\u002fref\u003e nervous systems can be seen as a graph, where the nodes are neurons and the edges are the connections between them.\u003cbr\u003e \u003cbr\u003e === Mathematics ===\u003cbr\u003e-In mathematics, graphs are useful in geometry and certain parts of [[topology]] such as [[knot theory]]. [[Algebraic graph theory]] has close links with [[group theory]]. Algebraic graph theory has been applied to many areas including dynamic systems and complexity.\u003cbr\u003e+In mathematics, graphs are useful in geometry and certain parts of topology such as [[knot theory]]. [[Algebraic graph theory]] has close links with [[group theory]]. Algebraic graph theory has been applied to many areas including dynamic systems and complexity.\u003cbr\u003e \u003cbr\u003e === Other topics ===\u003cbr\u003e A graph structure can be extended by assigning a weight to each edge of the graph. Graphs with weights, or [[weighted graph]]s, are used to represent structures in which pairwise connections have some numerical values. For example, if a graph represents a road network, the weights could represent the length of each road. There may be several weights associated with each edge, including distance (as in the previous example), travel time, or monetary cost. Such weighted graphs are commonly used to program GPS's, and travel-planning search engines that compare flight times and costs.\u003cbr\u003e@@ -107,39 +98,36 @@\u003cbr\u003e [[File:Konigsberg bridges.png|thumb|The K\u00f6nigsberg Bridge problem]]\u003cbr\u003e The paper written by [[Leonhard Euler]] on the [[Seven Bridges of K\u00f6nigsberg]] and published in 1736 is regarded as the first paper in the history of graph theory.\u003cref name=\"Biggs\"\u003e{{Citation|author1=Biggs, N. |author2=Lloyd, E. |author3=Wilson, R. |title=Graph Theory, 1736-1936|title-link=Graph Theory, 1736\u20131936|publisher=Oxford University Press|year=1986}}\u003c\u002fref\u003e This paper, as well as the one written by [[Alexandre-Th\u00e9ophile Vandermonde|Vandermonde]] on the ''[[Knight's tour|knight problem]],'' carried on with the ''analysis situs'' initiated by [[Gottfried Wilhelm Leibniz|Leibniz]]. Euler's formula relating the number of edges, vertices, and faces of a convex polyhedron was studied and generalized by [[Augustin-Louis Cauchy|Cauchy]]\u003cref name=\"Cauchy\"\u003e{{Citation|author=Cauchy, A. L.|year=1813|title=Recherche sur les poly\u00e8dres - premier m\u00e9moire|journal=[[Journal de l'\u00c9cole Polytechnique]]|volume= 9 (Cahier 16)|pages=66\u201386|postscript=.}}\u003c\u002fref\u003e and [[Simon Antoine Jean L'Huilier|L'Huilier]],\u003cref name=\"Lhuillier\"\u003e{{Citation|author=L'Huillier, S.-A.-J.|title=M\u00e9moire sur la poly\u00e8drom\u00e9trie|journal=Annales de Math\u00e9matiques|volume=3|year=1812\u20131813|pages=169\u2013189|postscript=.}}\u003c\u002fref\u003e and represents the beginning of the branch of mathematics known as [[topology]].\u003cbr\u003e \u003cbr\u003e-More than one century after Euler's paper on the bridges of [[K\u00f6nigsberg]] and while [[Johann Benedict Listing|Listing]] was introducing the concept of topology, [[Arthur Cayley|Cayley]] was led by an interest in particular analytical forms arising from [[differential calculus]] to study a particular class of graphs, the ''[[tree (graph theory)|tree]]s''.\u003cref\u003e{{citation|first=A.|last=Cayley|author-link=Arthur Cayley|year=1857|title=On the theory of the analytical forms called trees|journal=[[Philosophical Magazine]]|series=Series IV|volume=13|issue=85|pages=172\u2013176|doi=10.1017\u002fCBO9780511703690.046|isbn=9780511703690|url=https:\u002f\u002frcin.org.pl\u002fdlibra\u002fdocmetadata?showContent=true&id=173708|url-access=subscription}}\u003c\u002fref\u003e This study had many implications for theoretical [[chemistry]]. The techniques he used mainly concern the [[enumeration of graphs]] with particular properties. Enumerative graph theory then arose from the results of Cayley and the fundamental results published by [[George P\u00f3lya|P\u00f3lya]] between 1935 and 1937. These were generalized by [[Nicolaas Govert de Bruijn|De Bruijn]] in 1959. Cayley linked his results on trees with contemporary studies of chemical composition.\u003cref name=\"Cayley1\"\u003e{{Citation|author=Cayley, A.|year=1875|journal=Berichte der Deutschen Chemischen Gesellschaft|title=Ueber die Analytischen Figuren, welche in der Mathematik B\u00e4ume genannt werden und ihre Anwendung auf die Theorie chemischer Verbindungen|volume=8|pages=1056\u20131059|doi=10.1002\u002fcber.18750080252|postscript=.|issue=2|url=https:\u002f\u002fzenodo.org\u002frecord\u002f1425086}}\u003c\u002fref\u003e The fusion of ideas from mathematics with those from chemistry began what has become part of the standard terminology of graph theory.\u003cbr\u003e+More than one century after Euler's paper on the bridges of [[K\u00f6nigsberg]] and while [[Johann Benedict Listing|Listing]] was introducing the concept of topology, [[Arthur Cayley|Cayley]] was led by an interest in particular analytical forms arising from [[differential calculus]] to study a particular class of graphs, the ''[[tree (graph theory)|tree]]s''.\u003cref\u003e{{citation|first=A.|last=Cayley|author-link=Arthur Cayley|year=1857|title=On the theory of the analytical forms called trees|journal=[[Philosophical Magazine]]|series=Series IV|volume=13|issue=85|pages=172\u2013176|doi=10.1017\u002fCBO9780511703690.046|isbn=9780511703690|url=https:\u002f\u002frcin.org.pl\u002fdlibra\u002fdocmetadata?showContent=true&id=173708}}\u003c\u002fref\u003e This study had many implications for theoretical [[chemistry]]. The techniques he used mainly concern the [[enumeration of graphs]] with particular properties. Enumerative graph theory then arose from the results of Cayley and the fundamental results published by [[George P\u00f3lya|P\u00f3lya]] between 1935 and 1937. These were generalized by [[Nicolaas Govert de Bruijn|De Bruijn]] in 1959. Cayley linked his results on trees with contemporary studies of chemical composition.\u003cref name=\"Cayley1\"\u003e{{Citation|author=Cayley, A.|year=1875|journal=Berichte der Deutschen Chemischen Gesellschaft|title=Ueber die Analytischen Figuren, welche in der Mathematik B\u00e4ume genannt werden und ihre Anwendung auf die Theorie chemischer Verbindungen|volume=8|pages=1056\u20131059|doi=10.1002\u002fcber.18750080252|postscript=.|issue=2|url=https:\u002f\u002fzenodo.org\u002frecord\u002f1425086}}\u003c\u002fref\u003e The fusion of ideas from mathematics with those from chemistry began what has become part of the standard terminology of graph theory.\u003cbr\u003e \u003cbr\u003e In particular, the term \"graph\" was introduced by [[James Joseph Sylvester|Sylvester]] in a paper published in 1878 in ''[[Nature (journal)|Nature]]'', where he draws an analogy between \"quantic invariants\" and \"co-variants\" of algebra and molecular diagrams:\u003cref name=\"Sylvester\"\u003e{{cite journal | last1 = Sylvester | first1 = James Joseph | year = 1878 | title = Chemistry and Algebra | url = https:\u002f\u002farchive.org\u002fstream\u002fnature15unkngoog#page\u002fn312\u002fmode\u002f1up | journal = Nature | volume = 17 | issue = 432| page = 284 | doi = 10.1038\u002f017284a0 | bibcode = 1878Natur..17..284S | doi-access = free }}\u003c\u002fref\u003e\u003cbr\u003e :\"[\u2026] Every invariant and co-variant thus becomes expressible by a ''graph'' precisely identical with a [[August Kekul\u00e9|Kekul\u00e9an]] diagram or chemicograph. [\u2026] I give a rule for the geometrical multiplication of graphs, ''i.e.'' for constructing a ''graph'' to the product of in- or co-variants whose separate graphs are given. [\u2026]\" (italics as in the original).\u003cbr\u003e \u003cbr\u003e-The first textbook on graph theory was written by [[D\u00e9nes K\u0151nig]], and published in 1936.\u003cref\u003e{{citation|last1=Tutte|first1=W.T.|author-link=W. T. Tutte|title=Graph Theory|publisher=Cambridge University Press|year=2001|isbn=978-0-521-79489-3|page=30|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=uTGhooU37h4C&pg=PA30|access-date=2016-03-14}}\u003c\u002fref\u003e Another book by [[Frank Harary]], published in 1969, was \"considered the world over to be the definitive textbook on the subject\",\u003cref\u003e{{citation|page=203|title=Fractal Music, Hypercards, and more\u2026Mathematical Recreations from Scientific American|first=Martin|last=Gardner|author-link=Martin Gardner|publisher=W. H. Freeman and Company|year=1992}}\u003c\u002fref\u003e and enabled mathematicians, chemists, electrical engineers and social scientists to talk to each other. Harary donated all of the royalties to fund the [[George P\u00f3lya Prize|P\u00f3lya Prize]].\u003cref\u003e{{citation|contribution=The George Polya Prize|url=http:\u002f\u002fwww.siam.org\u002fabout\u002fmore\u002fsiam50.pdf|page=26|title=Looking Back, Looking Ahead: A SIAM History|author=Society for Industrial and Applied Mathematics|year=2002|access-date=2016-03-14|author-link=Society for Industrial and Applied Mathematics|archive-date=2016-03-05|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160305010030\u002fhttp:\u002f\u002fwww.siam.org\u002fabout\u002fmore\u002fsiam50.pdf|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e+The first textbook on graph theory was written by [[D\u00e9nes K\u0151nig]], and published in 1936.\u003cref\u003e{{citation|last1=Tutte|first1=W.T.|author-link=W. T. Tutte|title=Graph Theory|publisher=Cambridge University Press|year=2001|isbn=978-0-521-79489-3|page=30|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=uTGhooU37h4C&pg=PA30|access-date=2016-03-14}}\u003c\u002fref\u003e Another book by [[Frank Harary]], published in 1969, was \"considered the world over to be the definitive textbook on the subject\",\u003cref\u003e{{citation|page=203|title=Fractal Music, Hypercards, and more\u2026Mathematical Recreations from Scientific American|first=Martin|last=Gardner|author-link=Martin Gardner|publisher=W. H. Freeman and Company|year=1992}}\u003c\u002fref\u003e and enabled mathematicians, chemists, electrical engineers and social scientists to talk to each other. Harary donated all of the royalties to fund the [[George P\u00f3lya Prize|P\u00f3lya Prize]].\u003cref\u003e{{citation|contribution=The George Polya Prize|url=http:\u002f\u002fwww.siam.org\u002fabout\u002fmore\u002fsiam50.pdf|page=26|title=Looking Back, Looking Ahead: A SIAM History|author=Society for Industrial and Applied Mathematics|year=2002|access-date=2016-03-14|author-link=Society for Industrial and Applied Mathematics}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the most famous and stimulating problems in graph theory is the [[four color problem]]: \"Is it true that any map drawn in the plane may have its regions colored with four colors, in such a way that any two regions having a common border have different colors?\" This problem was first posed by [[Francis Guthrie]] in 1852 and its first written record is in a letter of [[Augustus De Morgan|De Morgan]] addressed to [[William Rowan Hamilton|Hamilton]] the same year. Many incorrect proofs have been proposed, including those by Cayley, [[Alfred Kempe|Kempe]], and others. The study and the generalization of this problem by [[Peter Tait (physicist)|Tait]], [[Percy John Heawood|Heawood]], [[Frank P. Ramsey|Ramsey]] and [[Hugo Hadwiger|Hadwiger]] led to the study of the colorings of the graphs embedded on surfaces with arbitrary [[Genus (mathematics)|genus]]. Tait's reformulation generated a new class of problems, the ''factorization problems'', particularly studied by [[Julius Petersen|Petersen]] and [[D\u00e9nes K\u0151nig|K\u0151nig]]. The works of Ramsey on colorations and more specially the results obtained by [[P\u00e1l Tur\u00e1n|Tur\u00e1n]] in 1941 was at the origin of another branch of graph theory, ''[[extremal graph theory]]''.\u003cbr\u003e \u003cbr\u003e-The four color problem remained unsolved for more than a century. In 1969 [[Heinrich Heesch]] published a method for solving the problem using computers.\u003cref\u003eHeinrich Heesch: Untersuchungen zum Vierfarbenproblem. Mannheim: Bibliographisches Institut 1969.\u003c\u002fref\u003e A computer-aided proof produced in 1976 by [[Kenneth Appel]] and [[Wolfgang Haken]] makes fundamental use of the notion of \"discharging\" developed by Heesch.\u003cref name=\"AA1\"\u003e{{Citation|author1=Appel, K. |author2=Haken, W.|title=Every planar map is four colorable. Part I. Discharging|journal=Illinois J. Math.|volume=21|issue=3|year=1977|pages=429\u2013490|postscript=.|doi=10.1215\u002fijm\u002f1256049011|doi-access=free|url=https:\u002f\u002fprojecteuclid.org\u002fjournals\u002fillinois-journal-of-mathematics\u002fvolume-21\u002fissue-3\u002fEvery-planar-map-is-four-colorable-Part-I-Discharging\u002f10.1215\u002fijm\u002f1256049011.pdf}}\u003c\u002fref\u003e\u003cref name=\"AA2\"\u003e{{Citation|author1=Appel, K. |author2=Haken, W.|title=Every planar map is four colorable. Part II. Reducibility|journal=Illinois J. Math.|volume=21|issue=3|year=1977|pages=491\u2013567|postscript=.|doi=10.1215\u002fijm\u002f1256049012|doi-access=free}}\u003c\u002fref\u003e The proof involved checking the properties of 1,936 configurations by computer, and was not fully accepted at the time due to its complexity. A simpler proof considering only 633 configurations was given twenty years later by [[Neil Robertson (mathematician)|Robertson]], [[Paul Seymour (mathematician)|Seymour]], [[Daniel P. Sanders|Sanders]] and [[Robin Thomas (mathematician)|Thomas]].\u003cref name=\"RSST\"\u003e{{Citation|author1=Robertson, N. |author2=Sanders, D. |author3=Seymour, P. |author4=Thomas, R. |title=The four color theorem|journal=Journal of Combinatorial Theory, Series B|volume=70|year=1997|pages=2\u201344|doi=10.1006\u002fjctb.1997.1750|postscript=.|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+The four color problem remained unsolved for more than a century. In 1969 [[Heinrich Heesch]] published a method for solving the problem using computers.\u003cref\u003eHeinrich Heesch: Untersuchungen zum Vierfarbenproblem. Mannheim: Bibliographisches Institut 1969.\u003c\u002fref\u003e A computer-aided proof produced in 1976 by [[Kenneth Appel]] and [[Wolfgang Haken]] makes fundamental use of the notion of \"discharging\" developed by Heesch.\u003cref name=\"AA1\"\u003e{{Citation|author1=Appel, K.  |author2=Haken, W.|title=Every planar map is four colorable. Part I. Discharging|journal=Illinois J. Math.|volume=21|issue=3|year=1977|pages=429\u2013490|postscript=.|doi=10.1215\u002fijm\u002f1256049011|doi-access=free}}\u003c\u002fref\u003e\u003cref name=\"AA2\"\u003e{{Citation|author1=Appel, K.  |author2=Haken, W.|title=Every planar map is four colorable. Part II. Reducibility|journal=Illinois J. Math.|volume=21|issue=3|year=1977|pages=491\u2013567|postscript=.|doi=10.1215\u002fijm\u002f1256049012|doi-access=free}}\u003c\u002fref\u003e The proof involved checking the properties of 1,936 configurations by computer, and was not fully accepted at the time due to its complexity. A simpler proof considering only 633 configurations was given twenty years later by [[Neil Robertson (mathematician)|Robertson]], [[Paul Seymour (mathematician)|Seymour]], [[Daniel P. Sanders|Sanders]] and [[Robin Thomas (mathematician)|Thomas]].\u003cref name=\"RSST\"\u003e{{Citation|author1=Robertson, N. |author2=Sanders, D. |author3=Seymour, P. |author4=Thomas, R. |title=The four color theorem|journal=Journal of Combinatorial Theory, Series B|volume=70|year=1997|pages=2\u201344|doi=10.1006\u002fjctb.1997.1750|postscript=.|doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The autonomous development of topology from 1860 and 1930 fertilized graph theory back through the works of [[Camille Jordan|Jordan]], [[Kazimierz Kuratowski|Kuratowski]] and [[Hassler Whitney|Whitney]]. Another important factor of common development of graph theory and [[topology]] came from the use of the techniques of modern algebra. The first example of such a use comes from the work of the physicist [[Gustav Kirchhoff]], who published in 1845 his [[Kirchhoff's circuit laws]] for calculating the [[voltage]] and [[Electric current|current]] in [[electric circuit]]s.\u003cbr\u003e \u003cbr\u003e The introduction of probabilistic methods in graph theory, especially in the study of [[Paul Erd\u0151s|Erd\u0151s]] and [[Alfr\u00e9d R\u00e9nyi|R\u00e9nyi]] of the asymptotic probability of graph connectivity, gave rise to yet another branch, known as ''[[Random graph|random graph theory]]'', which has been a fruitful source of graph-theoretic results.\u003cbr\u003e \u003cbr\u003e-== Representation ==\u003cbr\u003e-A graph is an abstraction of relationships that emerge in nature; hence, it cannot be coupled to a certain representation. The way it is represented depends on the degree of convenience such representation provides for a certain application. The most common representations are the visual, in which, usually, vertices are drawn and connected by edges, and the tabular, in which rows of a table provide information about the relationships between the vertices within the graph.\u003cbr\u003e-\u003cbr\u003e-=== Visual: Graph drawing ===\u003cbr\u003e+== Graph drawing ==\u003cbr\u003e {{main|Graph drawing}}\u003cbr\u003e-Graphs are usually represented visually by drawing a point or circle for every vertex, and drawing a line between two vertices if they are connected by an edge. If the graph is directed, the direction is indicated by drawing an arrow. If the graph is weighted, the weight is added on the arrow.\u003cbr\u003e+Graphs are represented visually by drawing a point or circle for every vertex, and drawing a line between two vertices if they are connected by an edge. If the graph is directed, the direction is indicated by drawing an arrow.\u003cbr\u003e \u003cbr\u003e A graph drawing should not be confused with the graph itself (the abstract, non-visual structure) as there are several ways to structure the graph drawing. All that matters is which vertices are connected to which others by how many edges and not the exact layout. In practice, it is often difficult to decide if two drawings represent the same graph. Depending on the problem domain some layouts may be better suited and easier to understand than others.\u003cbr\u003e \u003cbr\u003e The pioneering work of [[W. T. Tutte]] was very influential on the subject of graph drawing. Among other achievements, he introduced the use of linear algebraic methods to obtain graph drawings.\u003cbr\u003e \u003cbr\u003e-Graph drawing also can be said to encompass problems that deal with the [[Crossing number (graph theory)|crossing number]] and its various generalizations. The crossing number of a graph is the minimum number of intersections between edges that a drawing of the graph in the plane must contain. For a [[planar graph]], the crossing number is zero by definition. Drawings on surfaces other than the plane are also studied.\u003cbr\u003e-\u003cbr\u003e-There are other techniques to visualize a graph away from vertices and edges, including [[circle packing theorem|circle packings]], [[intersection graph]], and other visualizations of the [[adjacency matrix]].\u003cbr\u003e-\u003cbr\u003e-=== Tabular: Graph data structures ===\u003cbr\u003e+Graph drawing also can be said to encompass problems that deal with the [[Crossing number (graph theory)|crossing number]] and its various generalizations. The crossing number of a graph is the minimum number of intersections between edges that a drawing of the graph in the plane must contain. For a [[planar graph]], the crossing number is zero by definition.\u003cbr\u003e+\u003cbr\u003e+Drawings on surfaces other than the plane are also studied.\u003cbr\u003e+\u003cbr\u003e+== Graph-theoretic data structures ==\u003cbr\u003e {{main|Graph (abstract data type)}}\u003cbr\u003e-The tabular representation lends itself well to computational applications. There are different ways to store graphs in a computer system. The [[data structure]] used depends on both the graph structure and the [[algorithm]] used for manipulating the graph. Theoretically one can distinguish between list and matrix structures but in concrete applications the best structure is often a combination of both. List structures are often preferred for [[sparse graph]]s as they have smaller memory requirements. [[Matrix (mathematics)|Matrix]] structures on the other hand provide faster access for some applications but can consume huge amounts of memory. Implementations of sparse matrix structures that are efficient on modern parallel computer architectures are an object of current investigation.\u003cref\u003e{{Cite book | last1 = Kepner | first1 = Jeremy| last2 = Gilbert | first2 = John| title = Graph Algorithms in the Language of Linear Algebra| date = 2011| pages = 1171458|isbn=978-0-898719-90-1| publisher = SIAM | url = https:\u002f\u002fmy.siam.org\u002fStore\u002fProduct\u002fviewproduct\u002f?ProductId=106663}}\u003c\u002fref\u003e\u003cbr\u003e+There are different ways to store graphs in a computer system. The [[data structure]] used depends on both the graph structure and the [[algorithm]] used for manipulating the graph. Theoretically one can distinguish between list and matrix structures but in concrete applications the best structure is often a combination of both. List structures are often preferred for [[sparse graph]]s as they have smaller memory requirements. [[Matrix(mathematics)|Matrix]] structures on the other hand provide faster access for some applications but can consume huge amounts of memory. Implementations of sparse matrix structures that are efficient on modern parallel computer architectures are an object of current investigation.\u003cref\u003e{{Cite book | last1 = Kepner | first1 = Jeremy| last2 = Gilbert | first2 = John| title = Graph Algorithms in the Language of Linear Algebra| date = 2011| pages = 1171458|isbn=978-0-898719-90-1| publisher = SIAM | url = https:\u002f\u002fmy.siam.org\u002fStore\u002fProduct\u002fviewproduct\u002f?ProductId=106663}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e List structures include the [[edge list]], an array of pairs of vertices, and the [[adjacency list]], which separately lists the neighbors of each vertex: Much like the edge list, each vertex has a list of which vertices it is adjacent to.\u003cbr\u003e \u003cbr\u003e@ 003e \u003cbr\u003e === Graph coloring ===\u003cbr\u003e {{main|Graph coloring}}\u003cbr\u003e-Many problems and theorems in graph theory have to do with various ways of coloring graphs. Typically, one is interested in coloring a graph so that no two adjacent vertices have the same color, or with other similar restrictions. One may also consider coloring edges (possibly so that no two coincident edges are the same color), or other variations. Among the famous results and conjectures concerning graph coloring are the following:\u003cbr\u003e+Many problems and theorems in graph theory have to do with various ways of coloring graphs.  Typically, one is interested in coloring a graph so that no two adjacent vertices have the same color, or with other similar restrictions.  One may also consider coloring edges (possibly so that no two coincident edges are the same color), or other variations.  Among the famous results and conjectures concerning graph coloring are the following:\u003cbr\u003e * [[Four-color theorem]]\u003cbr\u003e * [[Strong perfect graph theorem]]\u003cbr\u003e-* [[Erd\u0151s\u2013Faber\u2013Lov\u00e1sz conjecture]] \u003cbr\u003e+* [[Erd\u0151s\u2013Faber\u2013Lov\u00e1sz conjecture]] (unsolved)\u003cbr\u003e * [[Total coloring|Total coloring conjecture]], also called [[Mehdi Behzad|Behzad]]'s conjecture (unsolved)\u003cbr\u003e * [[List edge-coloring|List coloring conjecture]] (unsolved)\u003cbr\u003e * [[Hadwiger conjecture (graph theory)]] (unsolved)\u003cbr\u003e@@ -212,9 +200,9 @@\u003cbr\u003e === Decomposition problems ===\u003cbr\u003e Decomposition, defined as partitioning the edge set of a graph (with as many vertices as necessary accompanying the edges of each part of the partition), has a wide variety of questions. Often, the problem is to decompose a graph into subgraphs isomorphic to a fixed graph; for instance, decomposing a complete graph into Hamiltonian cycles. Other problems specify a family of graphs into which a given graph should b es'' (also called ''nodes'' or ''points'') which are connected by ''edges'' (also called ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in discrete mathematics.\u003cbr\u003e+In [[mathematics]], '''graph theory''' is the study of ''[[graph (discrete mathematics)|graph]]s'', which are mathematical structures used to model pairwise relations between objects. A graph in this context is made up of ''[[Vertex (graph theory)|vertices]]'' (also called ''nodes'' or ''points'') which are connected by ''[[Glossary of graph theory terms#edge|edges]]'' (also called ''links'' or ''lines''). A distinction is made between '''undirected graphs''', where edges link two vertices symmetrically, and '''directed graphs''', where edges link two vertices asymmetrically. Graphs are one of the principal objects of study in [[discrete mathematics]].\u003cbr\u003e \u003cbr\u003e == Definitions ==\u003cbr\u003e {{further|Glossary of graph theory}}","--- Revision 51\u003cbr\u003e+++ Revision 52\u003cbr\u003e@@ -74,7 +74,7 @@\u003cbr\u003e Graph theory is also used to study molecules in [[chemistry]] and [[physics]]. In [[condensed matter physics]], the three-dimensional structure of complicated simulated atomic structures can be studied quantitatively by gathering statistics on graph-theoretic properties related to the topology of the atoms. Also, \"the [[Feynman diagram|Feynman graphs and rules of calculation]] summarize [[quantum field theory]] in a form in close contact with the experimental numbers one wants to understand.\"\u003cref\u003e{{cite book|first1=J. D.|last1=Bjorken |first2=S. D. |last2=Drell |title=Relativistic Quantum Fields |url=https:\u002f\u002farchive.org\u002fdetails\u002frelativisticquan0000bjor_c5q0|url-access=registration|publisher=McGraw-Hill |location=New York |year=1965 n network connectivity assessed using graph theory in frontotemporal dementia| journal = Neurology| date = 2013| pages = 134\u2013143| doi = 10.1212\u002fWNL.0b013e31829a33f8| pmid = 23719145| s2cid = 28334693}}\u003c\u002fref\u003e and many other fields. The development of [[algorithm]]s to handle graphs is therefore of major interest in computer science. The [[Graph transformation|transformation of graph]]s is often formalized and represented by [[graph rewriting|graph rewrite system]]s. Complementary to [[graph transformation]] systems focusing on rule-based in-memory manipulation of graphs are [[graph database]]s geared towards [[Database transaction|transaction]]-safe, [[Persistence (computer science)|persistent]] storing and querying of [[Graph (data structure)|graph-structured data]].\u003cbr\u003e \u003cbr\u003e === Linguistics ===\u003cbr\u003e Graph-theoretic methods, in various forms, have proven particularly useful in [[linguistics]], since natural language often lends itself well to discrete structure. Traditionally, [[syntax]] and compositional semantics follow tree-based structures, whose expressive power lies in the [[principle of compositionality]], modeled in a hierarchical graph. More contemporary approaches such as [[head-driven phrase structure grammar]] model the syntax of natural language using [[feature structure|typed feature structure]]s, which are [[directed acyclic graph]]s. ","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -74,8 +74,7 @@\u003cbr\u003e Graph theory is also used to study molecules in [[chemistry]] and [[physics]]. In [[condensed matter physics]], the three-dimensional structure of complicated simulated atomic structures can be studied quantitatively by gathering statistics on graph-theoretic properties related to the topology of the atoms. Also, \"the [[Feynman diagram|Feynman graphs and rules of calculation]] summarize [[quantum field theory]] in a form in close contact with the experimental numbers one wants to understand.\"\u003cref\u003e{{cite book|first1=J. D.|last1=Bjorken |first2=S. D. |last2=Drell |title=Relativistic Quantum Fields |url=https:\u002f\u002farchive.org\u002fdetails\u002frelativisticquan0000bjor_c5q0|url-access=registration|publisher=McGraw-Hill |location=New York |year=1965 |page=viii }}\u003c\u002fref\u003e In chemistry a graph makes a natural model for a molecule, where vertices represent [[atom]]s and edges [[Chemical bond|bond]]s. This approach is especially used in computer processing of molecular structures, ranging from [[Molecule editor|chemical editor]]s to database searching. In [[statistical physics]], graphs can represent local connections between interacting parts of a system, as well as the dynamics of a physical process on such\u003cbr\u003e systems. Similarly, in [[computational neuroscience]] graphs can be used to represent functional connections between brain areas that interact to give rise to various cognitive processes, where the vertices represent different areas of the brain and the edges represent the connections between those areas. Graph theory plays an important role in electrical modeling of electrical networks, here, weights are associated with resistance of the wire segments to obtain electrical properties of network structures.\u003cref\u003e{{Cite journal|last1=Kumar|first1=Ankush|last2=Kulkarni|first2=G. U.|date=2016-01-04|title=Evaluating conducting network based transparent electrodes from geometrical considerations|journal=Journal of Applied Physics|volume=119|issue=1|pages=015102|doi=10.1063\u002f1.4939280|issn=0021-8979|bibcode=2016JAP...119a5102K}}\u003c\u002fref\u003e Graphs are also used to represent the micro-scale channels of [[Porous medium|porous media]], in which the vertices represent the pores and the edges represent the smaller channels connecting the pores. [[Chemical graph theory]] uses the [[molecular graph]] as a means to model molecules.\u003cbr\u003e Graphs and networks are excellent models to study and understand phase transitions and critical phenomena.\u003cbr\u003e-Removal of nodes or edges leads to a critical transition where the network breaks into small clusters which is studied as a phase transition. This breakdown is studied via [[percolation theory]].\u003cref\u003e{{Cite book |last = Newman| first = Mark | title = Networks: An Introduction| publisher=Oxford University Press| date = 2010|  URL = http:\u002f\u002fmath.sjtu.edu.cn\u002ffaculty\u002fxiaodong\u002fcourse\u002fNetworks%20An%20introduction.pdf}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref\u003eReuven Cohen, Shlomo Havlin (2010). Complex Networks: Structure, Robustness, and Function  Cambridge University Press. \u003c\u002fref\u003e\u003cbr\u003e+Removal of nodes or edges leads to a critical transition where the network breaks into small clusters which is studied as a phase transition. This breakdown is studied via [[percolation theory]].\u003cref\u003e{{Cite book |last = Newman| first = Mark | title = Networks: An Introduction| publisher=Oxford University Press| date = 2010| url = http:\u002f\u002fmath.sjtu.edu.cn\u002ffaculty\u002fxiaodong\u002fcourse\u002fNetworks%20An%20introduction.pdf}}\u003c\u002fref\u003e\u003cref\u003eReuven Cohen, Shlomo Havlin (2010). Complex Networks: Structure, Robustness, and Function  Cambridge University Press. \u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Social sciences ===\u003cbr\u003e [[File:Moreno Sociogram 2nd Grade.png|thumb|Graph theory in sociology: [[Jacob L. Moreno|Moreno]] [[Sociogram]] (1953).\u003cref\u003eGrandjean, Martin (2015). [http:\u002f\u002fwww.martingrandjean.ch\u002fsocial-network-analysis-visualization-morenos-sociograms-revisited\u002f \"Social network analysis and visualization: Moreno\u2019s Sociograms revisited\"]. Redesigned network strictly based on Moreno (1934), ''Who Shall Survive''.\u003c\u002fref\u003e]]","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -112,21 +112,24 @@\u003cbr\u003e \u003cbr\u003e The introduction of probabilistic methods in graph theory, especially in the study of [[Paul Erd\u0151s|Erd\u0151s]] and [[Alfr\u00e9d R\u00e9nyi|R\u00e9nyi]] of the asymptotic probability of graph connectivity, gave rise to yet another branch, known as ''[[Random graph|random graph theory]]'', which has been a fruitful source of graph-theoretic results.\u003cbr\u003e \u003cbr\u003e-== Graph drawing ==\u003cbr\u003e+== Representation ==\u003cbr\u003e+A graph is an abstraction of relationships that emerge in nature; hence, it cannot be coupled to a certain representation. The way it is represented depends on the degree of convenience such representation provides for a certain application. The most common representations are the visual, in which, usually, vertices are drawn and connected by edges, and the tabular, in which rows of a table provide information about the relationships between the vertices within the graph.\u003cbr\u003e+\u003cbr\u003e+=== Visual: Graph drawing ===\u003cbr\u003e {{main|Graph drawing}}\u003cbr\u003e-Graphs are represented visually by drawing a point or circle for every vertex, and drawing a line between two vertices if they are connected by an edge. If the graph is directed, the direction is indicated by drawing an arrow.\u003cbr\u003e+Graphs are usually represented visually by drawing a point or circle for every vertex, and drawing a line between two vertices if they are connected by an edge. If the graph is directed, the direction is indicated by drawing an arrow. If the graph is weighted, the weight is added on the arrow.\u003cbr\u003e \u003cbr\u003e A graph drawing should not be confused with the graph itself (the abstract, non-visual structure) as there are several ways to structure the graph drawing. All that matters is which vertices are connected to which others by how many edges and not the exact layout. In practice, it is often difficult to decide if two drawings represent the same graph. Depending on the problem domain some layouts may be better suited and easier to understand than others.\u003cbr\u003e \u003cbr\u003e The pioneering work of [[W. T. Tutte]] was very influential on the subject of graph drawing. Among other achievements, he introduced the use of linear algebraic methods to obtain graph drawings.\u003cbr\u003e \u003cbr\u003e-Graph drawing also can be said to encompass problems that deal with the [[Crossing number (graph theory)|crossing number]] and its various generalizations. The crossing number of a graph is the minimum number of intersections between edges that a drawing of the graph in the plane must contain. For a [[planar graph]], the crossing number is zero by definition.\u003cbr\u003e-\u003cbr\u003e-Drawings on surfaces other than the plane are also studied.\u003cbr\u003e-\u003cbr\u003e-== Graph-theoretic data structures ==\u003cbr\u003e+Graph drawing also can be said to encompass problems that deal with the [[Crossing number (graph theory)|crossing number]] and its various generalizations. The crossing number of a graph is the minimum number of intersections between edges that a drawing of the graph in the plane must contain. For a [[planar graph]], the crossing number is zero by definition. Drawings on surfaces other than the plane are also studied.\u003cbr\u003e+\u003cbr\u003e+There are other techniques to visualize a graph away from vertices and edges, including [[circle packing theorem|circle packings]], [[intersection graph|intersection graph]], and other visualizations of the [[adjacency matrix]].\u003cbr\u003e+\u003cbr\u003e+=== Tabular: Graph data structures ===\u003cbr\u003e {{main|Graph (abstract data type)}}\u003cbr\u003e-There are different ways to store graphs in a computer system. The [[data structure]] used depends on both the graph structure and the [[algorithm]] used for manipulating the graph. Theoretically one can distinguish between list and matrix structures but in concrete applications the best structure is often a combination of both. List structures are often preferred for [[sparse graph]]s as they have smaller memory requirements. [[Matrix(mathematics)|Matrix]] structures on the other hand provide faster access for some applications but can consume huge amounts of memory. Implementations of sparse matrix structures that are efficient on modern parallel computer architectures are an object of current investigation.\u003cref\u003e{{Cite book | last1 = Kepner | first1 = Jeremy| last2 = Gilbert | first2 = John| title = Graph Algorithms in the Language of Linear Algebra| date = 2011| pages = 1171458|isbn=978-0-898719-90-1| publisher = SIAM | url = https:\u002f\u002fmy.siam.org\u002fStore\u002fProduct\u002fviewproduct\u002f?ProductId=106663}}\u003c\u002fref\u003e\u003cbr\u003e+The tabular representation lends itself well to computational applications. There are different ways to store graphs in a computer system. The [[data structure]] used depends on both the graph structure and the [[algorithm]] used for manipulating the graph. Theoretically one can distinguish between list and matrix structures but in concrete applications the best structure is often a combination of both. List structures are often preferred for [[sparse graph]]s as they have smaller memory requirements. [[Matrix(mathematics)|Matrix]] structures on the other hand provide faster access for some applications but can consume huge amounts of memory. Implementations of sparse matrix structures that are efficient on modern parallel computer architectures are an object of current investigation.\u003cref\u003e{{Cite book | last1 = Kepner | first1 = Jeremy| last2 = Gilbert | first2 = John| title = Graph Algorithms in the Language of Linear Algebra| date = 2011| pages = 1171458|isbn=978-0-898719-90-1| publisher = SIAM | url = https:\u002f\u002fmy.siam.org\u002fStore\u002fProduct\u002fviewproduct\u002f?ProductId=106663}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e List structures include the [[edge list]], an array of pairs of vertices, this type of object may be called precisely an '''undirected [[multigraph]]'''.\u003cbr\u003e+\u003cbr\u003e+A '''[[Loop (graph theory)|loop]]''' is an edge that joins a vertex to itself. Graphs as defined in the two definitions above cannot have loops, because a loop joining a vertex \u003cmath\u003ex\u003c\u002fmath\u003e to itself is the edge (for an undirected simple graph) or is incident on (for an undirected multigraph) \u003cmath\u003e\\{x, x\\} = \\{x\\}\u003c\u002fmath\u003e which is not in \u003cmath\u003e\\{ \\{x, y\\} \\mid x, y \\in V \\;\\textrm{ and }\\; x \\neq y \\}\u003c\u002fmath\u003e. So to allow loops the definitions must be expanded. For undirected simple graphs, the definition of \u003cmath\u003eE\u003c\u002fmath\u003e should be modified to \u003cmath\u003eE \\subseteq \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. For undirected multigraphs, the definition of \u003cmath\u003e\\phi\u003c\u002fmath\u003e should be modified to \u003cmath\u003e\\phi : E \\to \\{ \\{x, y\\} \\mid x, y \\in V \\}\u003c\u002fmath\u003e. To avoid ambiguity, these types of objects may be called '''undirected simple graph permitting loops''' and '''undirected multigraph permitting loops''' (sometimes also '''undirected [[pseudograph]]'''), respectively.\u003cbr\u003e \u003cbr\u003e \u003cmath\u003eV\u003c\u002fmath\u003e and \u003cmath\u003eE\u003c\u002fmath\u003e are usually taken to be finite, and many of the well-known results are not true (or are rather different) for infinite graphs because many of the arguments fail in the [[infinite graph|infinite case]]. Moreover, \u003cmath\u003eV\u003c\u002fmath\u003e is often assumed to be non-empty, but \u003cmath\u003eE\u003c\u002fmath\u003e is allowed to be the empty set. The '''order''' of a graph is \u003cmath\u003e|V|\u003c\u002fmath\u003e, its number of vertices. The '''size''' of a graph is \u003cmath\u003e|E|\u003c\u002fmath\u003e, its number of edges. The '''degree''' or '''valency''' of a vertex is the number of edges that are incident to it, where a loop is counted twice. The '''degree''' of a graph is the maximum of the degrees of its vertices.\u003cbr\u003e ","--- Revision 59\u003cbr\u003e+++ Revision 60\u003cbr\u003e@@ -64,7 +64,7 @@\u003cbr\u003e Graphs can be used to model many types of relations and processes in physical, biological,\u003cref\u003e{{cite journal |last=Mashaghi |first=A. |title=Investigation of a protein complex network |journal=European Physical Journal B |volume=41 |issue=1 |pages=113\u2013121 |year=2004 |doi=10.1140\u002fepjb\u002fe2004-00301-0 |display-authors=etal|arxiv=cond-mat\u002f0304207 |bibcode=2004EPJB...41..113M |s2cid=9233932 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last1=Shah|first1=Preya|last2=Ashourvan|first2=Arian|last3=Mikhail|first3=Fadi|last4=Pines|first4=Adam|last5=Kini|first5=Lohith|last6=Oechsel|first6=Kelly|last7=Das|first7=Sandhitsu R|last8=Stein|first8=Joel M|last9=Shinohara|first9=Russell T|date=2019-07-01|title=Characterizing the role of the structural connectome in seizure dynamics|journal=Brain|language=en|volume=142|issue=7|pages=1955\u20131972|doi=10.1093\u002fbrain\u002fawz125|pmid=31099821|issn=0006-8950|pmc=6598625}}\u003c\u002fref\u003e social and information systems.\u003cref\u003e{{Cite journal|last1=Adali|first1=Tulay|last2=Ortega|first2=Antonio|date=May 2018|title=Applications of Graph Theory [Scanning the Issue]|url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f8349656|journal=Proceedings of the IEEE|volume=106|issue=5|pages=784\u2013786|doi=10.1109\u002fJPROC.2018.2820300|issn=0018-9219}}\u003c\u002fref\u003e Many practical problems can be represented by graphs. Emphasizing their application to real-world systems, the term ''network'' is sometimes defined to mean a graph in which attributes (e.g. names) are associated with the vertices and edges, and the subject that expresses and understands the real-world systems as a network is called [[network science]].\u003cbr\u003e \u003cbr\u003e === Computer science ===\u003cbr\u003e-In [[computer science]], graphs are used to represent networks of communication, data organization, computational devices, the flow of computation, etc. For instance, the link structure of a [[website]] can be represented by a directed graph, in which the vertices represent web pages and directed edges represent [[Hyperlink|links]] from one page to another. A similar approach can be taken to problems in social media,\u003cref\u003e{{Cite journal | volume = 3| issue = 1| last = Grandjean| first = Martin| title = A social network analysis of Twitter: Mapping the digital humanities community| journal =Cogent Arts & Humanities| date = 2016| pages = 1171458|doi=10.1080\u002f23311983.2016.1171458| s2cid = 114999767| url = https:\u002f\u002fhal.archives-ouvertes.fr\u002fhal-01517493\u002ffile\u002fA%20social%20network%20analysis%20of%20Twitter%20Mapping%20the%20digital%20humanities%20community.pdf| doi-access = free}}\u003c\u002fref\u003e travel, biology, computer chip design, mapping the progression of neuro-degenerative diseases,\u003cref\u003e{{Cite journal | volume = 11| issue = 2| last = Vecchio | first = F| title = \"Small World\" architecture in brain connectivity and hippocampal volume in Alzheimer's disease: a study via graph theory from EEG data| journal =Brain Imaging and Behavior| date = 2017| pages = 473\u2013485| pmid =26960946 | doi = 10.1007\u002fs11682-016-9528-3| s2cid = 3987492}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal | volume = 81| issue = 2| last = Vecchio | first = F| title = Brain network connectivity assessed using graph theory in frontotemporal dementia| journal = Neurology| date = 2013| pages = 134\u2013143| doi = 10.1212\u002fWNL.0b013e31829a33f8| pmid = 23719145| s2cid = 28334693}}\u003c\u002fref\u003e and many other fields. The development of [[algorithm]]s to handle graphs is therefore of major interest in computer science. The [[Graph transformation|transformation of graph]]s is
