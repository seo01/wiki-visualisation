Gary Tinterow, Origins of Impressionism, Metropolitan Museum of Art,1994, page 433 |isbn=9780870997174 |access-date=6 November 2015 |archive-date=12 November 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131928\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&pg=PA433&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&hl=en&sa=X&ei=dwnPUtm_GKnNsQTV-4KIDA&ved=0CEIQ6AEwAA#v=onepage&q=Terrasse%20%C3%A0%20Sainte-Adresse%20japanese%20prints&f=false |url-status=live |last1=Tinterow |first1=Gary |last2=Loyrette |first2=Henri |year=1994 |publisher=Metropolitan Museum of Art }}\u003c\u002fref\u003e\u003cbr\u003e+Another major influence was Japanese [[ukiyo-e]] art prints ([[Japonism]]). The art of these prints contributed significantly to the \"snapshot\" angles and unconventional compositions that became characteristic of Impressionism. An example is Monet's ''Jardin \u00e0 Sainte-Adresse'', 1867, with its bold blocks of colour and composition on a strong diagonal slant showing the influence of Japanese prints.\u003cref\u003e{{Cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&pg=PA433 |title=Origins of Impressionism |page=433 |isbn=9780870997174 |access-date=6 November 2015 |archive-date=12 November 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131928\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&pg=PA433&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&hl=en&sa=X&ei=dwnPUtm_GKnNsQTV-4KIDA&ved=0CEIQ6AEwAA#v=onepage&q=Terrasse%20%C3%A0%20Sainte-Adresse%20japanese%20prints&f=false |url-status=live |last1=Tinterow |first1=Gary |last2=Loyrette |first2=Henri |year=1994 |publisher=Metropolitan Museum of Art }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.{{sfnp|Baumann|Karabelnik|1994|p=112}} His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e ","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -87,7 +87,7 @@\u003cbr\u003e \u003cbr\u003e Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |isbn=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=177 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=178 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003c\u002fref\u003e\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]\u003cbr\u003e@@ -361,6 +361,7 @@\u003cbr\u003e * {{cite book |last1=Richardson |first1=John |date=1976 |title=Manet |edition=3rd |location=Oxford |publisher=Phaidon Press Ltd. |isbn=0-7148-1743-0 }}\u003cbr\u003e * {{cite book |last1=Rosenblum |first1=Robert |date=1989 |title=Paintings in the Mus\u00e9e d'Orsay |location=New York |publisher=Stewart, Tabori & Chang |isbn=1-55670-099-7 }}\u003cbr\u003e * {{cite book |last1=Moffett |first1=Charles S |date=1986 |title=The New Painting, Impressionism 1874\u20131886 |location=Geneva |publisher=Richard Burton SA }}\u003cbr\u003e+* {{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003cbr\u003e {{Refend}}\u003cbr\u003e \u003cbr\u003e == External links ==","--- Revision 76\u003cbr\u003e+++ Revision 77\u003cbr\u003e@@ -356,11 +356,11 @@\u003cbr\u003e * {{cite book |last1=Gowing |first1=Lawrence |last2=Adriani |first2=G\u00f6tz |author2-link=G\u00f6tz Adriani |last3=Krumrine |first3=Mary Louise |last4=Lewis |first4=Mary Tompkins |last5=Patin |first5=Sylvie |author5-link=Sylvie Patin |last6=Rewald |first6=John |editor1-last=Stevens |editor1-first=Mary Anne |date=1988 |title=C\u00e9zanne: The Early Years 1859\u20131872 |location=New York |publisher=Harry N. Abrams, Inc. |url=https:\u002f\u002farchive.org\u002fdetails\u002fcezanneearlyyear0000unse_a9n0\u002fpage\u002fn3\u002fmode\u002f2up }}\u003cbr\u003e * {{cite book |last1=Huyghe |first1=Ren\u00e9 |date=1973 |title=Impressionism |location=New York |publisher=Chartwell Books |oclc=49692648}}\u003cbr\u003e * {{cite book |last1=Jensen |first1=Robert |date=1994 |title=Marketing modernism in fin-de-si\u00e8cle Europe |location=Princeton, NJ |publisher=Princeton University Press |isbn=0-691-03333-1 }}\u003cbr\u003e-* {{cite book |editor1-last=Moskowitz |editor1-first=Ira |last1=S\u00e9rullaz |first1=Maurice |date=1962 |title=French Impressionists: A Selection of Drawings of the French 19th Century |location=Boston and Toronto |publisher=Little, Brown and Company |isbn=0-316-58560-2}}\u003cbr\u003e+* {{cite book |last1=Moffett |first1=Charles S |date=1986 |title=The New Painting, Impressionism 1874\u20131886 |location=Geneva |publisher=Richard Burton SA }}\u003cbr\u003e * {{cite book |last1=Rewald |first1=John |author1-link=John Rewald |date=1973 |title=The History of Impressionism |edition=4th Revised |location=New York |publisher=The Museum of Modern Art |isbn=0-87070-360-9 |url=https:\u002f\u002farchive.org\u002fdetails\u002fhistoryofimpress0000unse_x5j4\u002f }}\u003cbr\u003e * {{cite book |last1=Richardson |first1=John |date=1976 |title=Manet |edition=3rd |location=Oxford |publisher=Phaidon Press Ltd. |isbn=0-7148-1743-0 }}\u003cbr\u003e * {{cite book |last1=Rosenblum |first1=Robert |date=1989 |title=Paintings in the Mus\u00e9e d'Orsay |location=New York |publisher=Stewart, Tabori & Chang |isbn=1-55670-099-7 }}\u003cbr\u003e-* {{cite book |last1=Moffett |first1=Charles S |date=1986 |title=The New Painting, Impressionism 1874\u20131886 |location=Geneva |publisher=Richard Burton SA }}\u003cbr\u003e+* {{cite book |editor1-last=Moskowitz |editor1-first=Ira |last1=S\u00e9rullaz |first1=Maurice |date=1962 |title=French Impressionists: A Selection of Drawings of the French 19th Century |location=Boston and Toronto |publisher=Little, Brown and Company |isbn=0-316-58560-2}}\u003cbr\u003e * {{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003cbr\u003e {{Refend}}\u003cbr\u003e ","--- Revision 77\u003cbr\u003e+++ Revision 78\u003cbr\u003e@@ -111,13 +111,13 @@\u003cbr\u003e == Female Impressionists ==\u003cbr\u003e [[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=9|oclc=14368525}}\u003c\u002fref\u003e Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.\u003cref name=\":1\"\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=6|oclc=14368525}}\u003c\u002fref\u003e It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.\u003cref name=\":1\" \u002f\u003e\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e \u003cbr\u003e Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Young Girl at a Window.JPG|thumb|upright|[[Mary Cassatt]], ''Young Girl at a Window,'' 1885, oil on canvas, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=36|oclc=14368525}}\u003c\u002fref\u003e Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e+The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.{{sfnp|Garb|1986|p=36}} Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The women Impressionists, like their male counterparts, were striving for \"truth\", for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e \u003cbr\u003e@@ -352,6 +352,7 @@\u003cbr\u003e * {{cite book |last1=Denvir |first1=Bernard |date=1990 |title=The Thames and Hudson Encyclopaedia of Impressionism |location=London |publisher=Thames and Hudson |isbn=0-500-20239-7 |url=https:\u002f\u002farchive.org\u002fdetails\u002fthameshudsonency0000denv\u002f }}\u003cbr\u003e * {{cite book |last1=Distel |first1=Anne |author1-link=Anne Distel |first2=Michel |last2=Hoog |first3=Charles S. |last3=Moffett |url=http:\u002f\u002flibmma.contentdm.oclc.org\u002fcdm\u002fcompoundobject\u002fcollection\u002fp15324coll10\u002fid\u002f78705\u002frec\u002f222 |title=Impressionism; A Centenary Exhibition |publisher=Metropolitan Museum of Art |location=New York |date=1974 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20181108221731\u002fhttp:\u002f\u002flibmma.contentdm.oclc.org\u002fcdm\u002fcompoundobject\u002fcollection\u002fp15324coll10\u002fid\u002f78705\u002frec\u002f222 |archive-date=8 November 2018 |isbn=0-87099-097-7 }}\u003cbr\u003e * {{cite book |last1=Eisenman |first1=Stephen F. |date=2010 |title=From Corot to Monet: The Ecology of Impressionism |location=Milan |publisher=Skira |isbn=978-88-572-0706-3 |url=https:\u002f\u002farchive.org\u002fdetails\u002ffromcorottomonet0000unse\u002f }}\u003cbr\u003e+* {{Cite book |last=Garb |first=Tamar |title=Women Impressionists |publisher=Rizzoli International Publications |year=1986 |isbn=0-8478-0757-6 |location=New York |oclc=14368525}}\u003cbr\u003e * {{cite book |last1=Gordon |first1=Robert |last2=Forge |first2=Andrew |date=1988 |title=Degas |location=New York |publisher=Harry N. Abrams, Inc. |isbn=0-8109-1142-6 }}\u003cbr\u003e * {{cite book |last1=Gowing |first1=Lawrence |last2=Adriani |first2=G\u00f6tz |author2-link=G\u00f6tz Adriani |last3=Krumrine |first3=Mary Louise |last4=Lewis |first4=Mary Tompkins |last5=Patin |first5=Sylvie |author5-link=Sylvie Patin |last6=Rewald |first6=John |editor1-last=Stevens |editor1-first=Mary Anne |date=1988 |title=C\u00e9zanne: The Early Years 1859\u20131872 |location=New York |publisher=Harry N. Abrams, Inc. |url=https:\u002f\u002farchive.org\u002fdetails\u002fcezanneearlyyear0000unse_a9n0\u002fpage\u002fn3\u002fmode\u002f2up }}\u003cbr\u003e * {{cite book |last1=Huyghe |first1=Ren\u00e9 |date=1973 |title=Impressionism |location=New York |publisher=Chartwell Books |oclc=49692648}}","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -21,7 +21,7 @@\u003cbr\u003e == Overview ==\u003cbr\u003e [[File:The Fighting Temeraire, JMW Turner, National Gallery.jpg|thumb|left|[[J. M. W. Turner]]'s atmospheric work was influential on the birth of Impressionism, here ''[[The Fighting Temeraire]]'' (1839)]]\u003cbr\u003e \u003cbr\u003e-Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.\u003cref\u003eExceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].\u003c\u002fref\u003e The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e+Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.{{efn|Exceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].}} The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e [[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -343,9 +343,13 @@\u003cbr\u003e * [[Western Painting]]\u003cbr\u003e \u003cbr\u003e == Notes ==\u003cbr\u003e+{{notelist}}\u003cbr\u003e+\u003cbr\u003e+== References ==\u003cbr\u003e+=== Citations ===\u003cbr\u003e {{reflist}}\u003cbr\u003e \u003cbr\u003e-== References ==\u003cbr\u003e+=== Works cited ===\u003cbr\u003e {{Refbegin|30em|indent=yes}}\u003cbr\u003e * {{cite book |editor1-last=Baumann |editor1-first=Felix |editor2-last=Karabelnik |date=1994 |title=Degas Portraits |location=London |publisher=Merrell Holberton |isbn=1-85894-014-1 |url=https:\u002f\u002farchive.org\u002fdetails\u002fdegasportraits0000unse\u002f }}\u003cbr\u003e * {{cite book |last1=Bomford |first1=David |first2=Jo |last2=Kirby |first3=John |last3=Leighton |first4=Ashok |last4=Roy |date=1990 |title=Art in the Making: Impressionism |location=London |publisher=The National Gallery of London |isbn=0-300-05035-6 |url=https:\u002f\u002farchive.org\u002fdetails\u002fimpressionism0000unse_z3w3\u002f }}","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -43,7 +43,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Alfred Sisley 001.jpg|thumb|left|[[Alfred Sisley]], ''[[View of the Canal Saint-Martin]]'', 1870, [[Mus\u00e9e d'Orsay]]]]\u003cbr\u003e \u003cbr\u003e-Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the [[Batignolles group|''Soci\u00e9t\u00e9 Anonyme Coop\u00e9rative des Artistes Peintres, Sculpteurs, Graveurs'']] (\"Company of Painters, Sculptors, and Engravers\") to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e+Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the {{lang|fr|[[Batignolles group|Soci\u00e9t\u00e9 anonyme des artistes peintres, sculpteurs, graveurs, etc.]]}}{{efn|name=\"societe-anonyme\"|English: \"Anonymous Society of painters, sculptors, engravers, etc.\"}} to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}}{{sfnp|Moffett|1986|page=18}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Graystaks I.JPG|thumb|right|[[Claude Monet]], ''[[Haystacks (Monet)|Haystacks, (sunset)]]'', 1890\u20131891, [[Museum of Fine Arts, Boston]]]]\u003cbr\u003e ","--- Revision 80\u003cbr\u003e+++ Revision 81\u003cbr\u003e@@ -43,7 +43,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Alfred Sisley 001.jpg|thumb|left|[[Alfred Sisley]], ''[[View of the Canal Saint-Martin]]'', 1870, [[Mus\u00e9e d'Orsay]]]]\u003cbr\u003e \u003cbr\u003e-Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the {{lang|fr|[[Batignolles group|Soci\u00e9t\u00e9 anonyme des artistes peintres, sculpteurs, graveurs, etc.]]}}{{efn|name=\"societe-anonyme\"|English: \"Anonymous Society of painters, sculptors, engravers, etc.\"}} to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}}{{sfnp|Moffett|1986|page=18}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e+Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the {{lang|fr|[[Batignolles group#Society_of_Artists,_Painters,_Sculptors_and_Etchers|Soci\u00e9t\u00e9 anonyme des artistes peintres, sculpteurs, graveurs, etc.]]}}{{efn|name=\"societe-anonyme\"|English: \"Anonymous Society of painters, sculptors, engravers, etc.\"}} to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}}{{sfnp|Moffett|1986|page=18}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Graystaks I.JPG|thumb|right|[[Claude Monet]], ''[[Haystacks (Monet)|Haystacks, (sunset)]]'', 1890\u20131891, [[Museum of Fine Arts, Boston]]]]\u003cbr\u003e ","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -333,6 +333,18 @@\u003cbr\u003e File:Card Players-Paul Cezanne.jpg|[[Paul C\u00e9zanne]], ''[[The Card Players]]'', 1894\u20131895, [[Mus\u00e9e d'Orsay]], Paris\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e+== Documentary Films ==\u003cbr\u003e+\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fmary-cassatt\u002f Mary Cassatt (2023)] - Directed by Ali Ray\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fpissarro\u002f Pissarro: Father of Impressionism (2022)] - Directed by David Bickerstaff\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fex20-degas-passion-for-perfection\u002f Degas: Passion for Perfection (2018)] - Directed by David Bickerstaff\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fcezanne-portraits-of-a-life-2\u002f C\u00e9zanne \u2013 Portraits of a Life (2018)] - Directed by David Bickerstaff\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fthe-artists-garden-american-impressionism\u002f The Artist\u2019s Garden: American Impressionism (2017)] - Directed by [[Phil Grabsky]]\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fi-claude-monet\u002f I, Claude Monet (2017)] - Directed by [[Phil Grabsky]]\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fpainting-the-modern-garden-monet-to-matisse\u002f Painting the Modern Garden \u2013 Monet to Matisse (2016)] - Directed by David Bickerstaff\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002frenoir-revered-and-reviled\u002f Renoir \u2013 Revered and Reviled (2016)] - Directed by [[Phil Grabsky]]\u003cbr\u003e+* Exhibition on Screen: [https:\u002f\u002fseventh-art.com\u002fproduct\u002fthe-impressionists-and-the-man-who-made-them\u002f The Impressionists and The Man Who Made Them (2015)] - Directed by [[Phil Grabsky]]\u003cbr\u003e+\u003cbr\u003e == See also ==\u003cbr\u003e * [[Art periods]]\u003cbr\u003e * [[Cantonese school of painting]]","--- Revision 82\u003cbr\u003e+++ Revision 83\u003cbr\u003e@@ -333,18 +333,6 @@\u003cbr\u003e File:Card Players-Paul Cezanne.jpg|[[Paul C\u00e9zanne]], ''[[The Card Players]]'', 1894\u20131895, [[Mus\u00e9e d'Orsay]], Paris\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e-== Documentary Films ==\u003cbr\u003e-\u003cbr\u003e-* Exhibition on pressionism}}\u003cbr\u003e {{Wikiquote}}\u003cbr\u003e {{Wiktionary|impressionism}}\u003cbr\u003e+* [https:\u002f\u002fwww.rehahnphotographer.com\u002fimpressionism-photography-rehahn Contemporary Impressionism in Photography]\u003cbr\u003e * [https:\u002f\u002fweb.archive.org\u002fweb\u002f20080614210111\u002fhttp:\u002f\u002fmushecht.haifa.ac.il\u002fhecht\u002fart\u002ffrenchart_eng.aspx Hecht Museum]\u003cbr\u003e * {{Gutenberg|no=14056|name=The French Impressionists (1860\u20131900)}}\u003cbr\u003e * [https:\u002f\u002fweb.archive.org\u002fweb\u002f20070312105907\u002fhttp:\u002f\u002fwww.museen-sh.de\u002fml\u002fdigicult.php?digiID=601.9&s=2 Museumsportal Schleswig-Holstein]","--- Revision 84\u003cbr\u003e+++ Revision 85\u003cbr\u003e@@ -263,7 +263,7 @@\u003cbr\u003e * The [[Amsterdam Impressionism|Amsterdam Impressionists]] in the [[Netherlands]], including [[George Hendrik Breitner]], [[Isaac Isra\u00ebls]], [[Willem Bastiaan Tholen]], [[Willem de Zwart]], [[Willem Witsen]] and [[Jan Toorop]].\u003cbr\u003e * The [[California Impressionism|California Impressionists]], including [[William Wendt]], [[Guy Rose]], [[Alson Clark]], [[Donna N. Schuster]], and [[Sam Hyde Harris]].\u003cbr\u003e * [[Anna Boch]], [[Vincent van Gogh]]'s friend [[Eug\u00e8ne Boch]], [[Georges Lemmen]] and [[Th\u00e9o van Rysselberghe]], Impressionist painters from [[Belgium]].\u003cbr\u003e-* [[Ivan Grohar]], [[Rihard Jakopi\u010d]], [[Matija Jama]], and [[Matej Sternen]], Impressionists from Slovenia. Their beginning was in the school of [[Anton A\u017ebe]] in Munich and they were influenced by [[Jurij \u0160ubic]] and [[Ivana Kobilca]], Slovenian painters working in Paris.\u003cbr\u003e+* The [[Slovenian Impressionism|Slovenian Impressionists]], [[Ivan Grohar]], [[Rihard Jakopi\u010d]], [[Matija Jama]], and [[Matej Sternen]]. Their beginning was in the school of [[Anton A\u017ebe]] in Munich and they were influenced by [[Jurij \u0160ubic]] and [[Ivana Kobilca]], Slovenian painters working in Paris.\u003cbr\u003e * [[Wynford Dewhurst]], [[Walter Richard Sickert]], and [[Philip Wilson Steer]] were well known Impressionist painters from the United Kingdom. [[Pierre Adolphe Valette]], who was born in France but who worked in Manchester, was the tutor of [[L. S. Lowry]].\u003cbr\u003e * The [[German Impressionists]], including [[Max Liebermann]], [[Lovis Corinth]], [[Ernst Oppler]], [[Max Slevogt]] and [[August von Brandis]].\u003cbr\u003e * [[L\u00e1szl\u00f3 Medny\u00e1nszky]] and [[P\u00e1l Szinyei Merse|P\u00e1l Szinyei-Merse]] in Hungary","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -23,7 +23,7 @@\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.{{efn|Exceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].}} The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e+[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003eIn 1876, Mallarme explained to Impressionism that the details of the subject of the picture are not fixed, and the subject is composed of light and reflection.They look different because the light is constantly changing.\u003cref\u003e{{Cite book |last=Hook |first=Philip |url=https:\u002f\u002fbooks.google.com\u002fbooks?hl=zh-CN&lr=&id=h-vq5phx00AC&oi=fnd&pg=PT5&ots=xLadaoJmnm&sig=MH2nG-T-yHMWlOSJoEGAjnT38vg |title=The Ultimate Trophy: How The Impressionist Painting Conquered The World |date=2012-12-17 |publisher=Prestel Verlag |isbn=978-3-641-08955-9 |language=de}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The public, at first hostile, gradually came to believe that the Impressionists had captured a fresh and original vision, even if the art critics and art establishment disapproved of the new style. By recreating the sensation in the eye that views the subject, rather than delineating the details of the subject, and by creating a welter of techniques and forms, Impressionism is a precursor of various painting styles, including [[Neo-Impressionism]], [[Post-Impressionism]], [[Fauvism]], and [[Cubism]].{{fact|date=November 2023}}\u003cbr\u003e ","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -111,7 +111,7 @@\u003cbr\u003e == Female Impressionists ==\u003cbr\u003e [[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}}Until the late 19th century in Europe, women were prohibited from entering public schools. So during that period, female artists were more focused on depicting small categories of objects, such as still life and portrait painting. \u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12}}\u003c\u002fref\u003eFemale Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e \u003cbr\u003e Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 87\u003cbr\u003e+++ Revision 88\u003cbr\u003e@@ -312,6 +312,8 @@\u003cbr\u003e \u003cbr\u003e Musical Impressionism is the name given to a movement in [[European classical music]] that arose in the late 19th century and continued into the middle of the 20th century. Originating in France, musical Impressionism is characterized by suggestion and atmosphere, and eschews the emotional excesses of the Romantic era. Impressionist composers favoured short forms such as the [[nocturne]], [[Arabesque (classical music)|arabesque]], and [[Prelude (music)|prelude]], and often explored uncommon scales such as the [[whole tone scale]]. Perhaps the most notable innovations of Impressionist composers were the introduction of major 7th chords and the extension of chord structures in 3rds to five- and six-part harmonies.\u003cbr\u003e \u003cbr\u003e+American Impressionist music differs from European Impressionist music, and these differences are mainly reflected in Charles Griffith's poetry of flute and orchestral music. He is also the most prolific Impressionist composer in the United States.\u003cref\u003e{{Cite journal |last=Haefliger |first=Kathleen |last2=Griffes |first2=Charles Tomlinson |date=1986 |title=Piano Music of Charles Tomlinson Griffes |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002f3052237 |journal=American Music |volume=4 |issue=4 |pages=481 |doi=10.2307\u002f3052237 |issn=0734-4392}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. [[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e \u003cbr\u003e === Literature ===","--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -297,6 +297,8 @@\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+Many Impressionist sculptors create based on animals in order to break away from old world concepts and original academic images. They endow birds and beasts with new spiritual characteristics, known as carriers of mobile spiritual matter.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024 |archive-date=21 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240321030851\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |url-status=live }}\u003c\u002fref\u003e"],"line":{"width":1.5},"marker":{"size":6,"symbol":"circle"},"mode":"lines+markers","name":"Historical Path (Base)","x":{"dtype":"f4","bdata":"4EhOvgG+Er6ZkLa+xLPGvufdDr+3gwO\u002ff\u002f4Zv4r+M79qSudAwszkQCBO5EA1VdpA7MHeQCnf0kD4ptFA6JXXQP4Y2UBcRdlAjR7WQFvK0EDH2uZAHJjnQPSl6kBPf9RAYyLfQEl32UCQh+JAKqzRQMUYhUHzW4ZBFueFQa6Th0HzeIRBN92EQQRkhkEXRIlB+Y+IQSL0ikGTY5FBYW2RQWl8k0GJ9ZNBpQGWQSiPl0EuOJdBsheWQUP\u002flEHJEJlBwdCWQYSplUFAeh3BFawdwUFsHMEBtRjBVJUbwcU0FMFRxhHB+\u002fgTwbODFcFStBTBXdMSwXLpE8GwvRLBX5QRwXoVFMH2zRPBEMlfQD1zXEDxmGFA3\u002f5zQFV2b0D12X9A3BaDQAKth0C9JpBAgleZQADGlkCvjpVAnKilQLACrEBQJLFAPjypQCMfrEDX9qxAkp2vQME7skCZ97pAQoe9QIMHxUBJw4A\u002f"},"y":{"dtype":"f4","bdata":"3o ing on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024 |archive-date=21 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240321030851\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |url-status=live }}\u003c\u002fref\u003e","--- Revision 89\u003cbr\u003e+++ Revision 90\u003cbr\u003e@@ -321,7 +321,7 @@\u003cbr\u003e === Literature ===\u003cbr\u003e {{Main|Impressionism (literature)}}\u003cbr\u003e \u003cbr\u003e-The term Impressionism has also been used to describe works of literature in which a few select details suffice to convey the sensory impressions of an incident or scene. Impressionist literature is closely related to [[Symbolism (arts)|Symbolism]], with its major exemplars being [[Charles Baudelaire|Baudelaire]], [[St\u00e9phane Mallarm\u00e9|Mallarm\u00e9]], [[Arthur Rimbaud|Rimbaud]], and [[Paul Verlaine|Verlaine]]. Authors such as [[Virginia Woolf]], [[D.H. Lawrence]], [[Henry James]], and [[Joseph Conrad]] have written works that are Impressionistic in the way that they describe, rather than interpret, the impressions, sensations and emotions that constitute a character's mental life.\u003cbr\u003e+The term Impressionism has also been used to describe works of literature in which a few select details suffice to convey the sensory impressions of an incident or scene. Impressionist literature is closely related to [[Symbolism (arts)|Symbolism]], with its major exemplars being [[Charles Baudelaire|Baudelaire]], [[St\u00e9phane Mallarm\u00e9|Mallarm\u00e9]], [[Arthur Rimbaud|Rimbaud]], and [[Paul Verlaine|Verlaine]]. Authors such as [[Virginia Woolf]], [[D.H. Lawrence]], [[Henry James]], and [[Joseph Conrad]] have written works that are Impressionistic in the way that they describe, rather than interpret, the impressions, sensations and emotions that constitute a character's mental life.Impressionist scholars define literary impressionism as the \"way in which humans acquire knowledge\" and compare it to Impressionist painting.\u003cref\u003e{{Cite journal |last=Berrong |first=Richard M. |date=2006-06-01 |title=Modes of Literary Impressionism |url=http:\u002f\u002fdx.doi.org\u002f10.1215\u002f00166928-39-2-203 |journal=Genre |volume=39 |issue=2 |pages=203\u2013228 |doi=10.1215\u002f00166928-39-2-203 |issn=0016-6928}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Camille Pissarro 019.jpg|thumb|[[Camille Pissarro]], ''Children on a Farm'', 1887]]\u003cbr\u003e ","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -328,7 +328,7 @@\u003cbr\u003e == Post-Impressionism ==\u003cbr\u003e {{Main|Post-Impressionism}}\u003cbr\u003e \u003cbr\u003e-During the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e+The only meaning of post-impressionism, born in the late 19th century, is that after Impressionism, it was neither a movement nor an independent style, but a short period of time.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online}}\u003c\u002fref\u003eDuring the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e \u003cbr\u003e \u003cgallery widths=\"160px\" heights=\"160px\" perrow=\"4\"\u003e\u003cbr\u003e File:A Sunday on La Grande Jatte, Georges Seurat, 1884.png|[[Georges Seurat]], ''[[A Sunday Afternoon on the Island of La Grande Jatte]]'', 1884\u20131886, [[The Art Institute of Chicago]]","--- Revision 91\u003cbr\u003e+++ Revision 92\u003cbr\u003e@@ -328,7 +328,7 @@\u003cbr\u003e == Post-Impressionism ==\u003cbr\u003e {{Main|Post-Impressionism}}\u003cbr\u003e \u003cbr\u003e-The only meaning of post-impressionism, born in the late 19th century, is that after Impressionism, it was neither a movement nor an independent style, but a short period of time.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online}}\u003c\u002fref\u003eDuring the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e+The only meaning of post-impressionism, born in the late 19th century, is that after Impressionism, it was neither a movement nor an independent style, but a short period of time.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online}}\u003c\u002fref\u003ePost-Impressionism has the characteristics of futurism and cubism, reflecting the change of attitude towards art in European society.\u003cref\u003e{{Cite book |url=https:\u002f\u002fwww.taylorfrancis.com\u002fbooks\u002fmono\u002f10.4324\u002f9781032699707\u002fpost-impressionists-england-barrie-bullen |title=Post-Impressionists in England: The Critical Reception |date=2024-03-08 |publisher=Routledge |isbn=978-1-032-69970-7 |editor-last=Bullen |editor-first=Barrie |location=London |doi=10.4324\u002f9781032699707}}\u003c\u002fref\u003eDuring the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painter
