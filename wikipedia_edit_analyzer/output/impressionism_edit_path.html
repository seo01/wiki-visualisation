PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e-During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003e{{cite book |last1=Seiberling |first1=Grace |chapter=Impressionism |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.{{sfnp|Denvir|1990|p=133}} The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e-\u003cbr\u003e-After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) was organized. While many viewers came only to laugh, the Salon des Refus\u00e9s drew attention to the existence of a new tendency in art and attracted more visitors than the regular Salon.{{sfnp|Denvir|1990|p=194}}\u003cbr\u003e+During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003eSeiberling, Grace, \"Impressionism\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.\u003cref\u003eDenvir (1990), p.133.\u003c\u002fref\u003e The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e+\u003cbr\u003e+After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) was organized. While many viewers came only to laugh, the Salon des Refus\u00e9s drew attention to the existence of a new tendency in art and attracted more visitors than the regular Salon.\u003cref\u003eDenvir (1990), p.194.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Alfred Sisley 001.jpg|thumb|left|[[Alfred Sisley]], ''[[View of the Canal Saint-Martin]]'', 1870, [[Mus\u00e9e d'Orsay]]]]\u003cbr\u003e \u003cbr\u003e-Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the {{lang|fr|[[Batignolles group#Society_of_Artists,_Painters,_Sculptors_and_Etchers|Soci\u00e9t\u00e9 anonyme des artistes peintres, sculpteurs, graveurs, etc.]]}}{{efn|name=\"societe-anonyme\"|English: \"Anonymous Society of painters, sculptors, engravers, etc.\"}} to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}}{{sfnp|Moffett|1986|page=18}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e+Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the [[Batignolles group|''Soci\u00e9t\u00e9 Anonyme Coop\u00e9rative des Artistes Peintres, Sculpteurs, Graveurs'']] (\"Company of Painters, Sculptors, and Engravers\") to exhibit their artworks independently.\u003cref\u003eBomford et al. 1990, p. 209.\u003c\u002fref\u003e Members of the association were expected to forswear participation in the Salon.\u003cref\u003eJensen 1994, p. 90.\u003c\u002fref\u003e The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.\u003cref\u003eDenvir (1990), p.32.\u003c\u002fref\u003e Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Graystaks I.JPG|thumb|right|[[Claude Monet]], ''[[Haystacks (Monet)|Haystacks, (sunset)]]'', 1890\u20131891, [[Museum of Fine Arts, Boston]]]]\u003cbr\u003e \u003cbr\u003e@@ -56,22 +52,20 @@\u003cbr\u003e He wrote, in the form of a dialogue between viewers,\u003cbr\u003e \u003cbr\u003e {{Blockquote\u003cbr\u003e-|text=\"Impression\u2014I was certain of it. I was just telling myself that, since I was impressed, there had to be some impression in it ... and what freedom, what ease of workmanship! Wallpaper in its embryonic state is more finished than that seascape.\"{{sfnp|Rewald|1973|p=323}}\u003cbr\u003e+|text=\"Impression\u2014I was certain of it. I was just telling myself that, since I was impressed, there had to be some impression in it ... and what freedom, what ease of workmanship! Wallpaper in its embryonic state is more finished than that seascape.\"\u003cref\u003eRewald (1973), p. 323.\u003c\u002fref\u003e\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Woman with a Parasol - Madame Monet and Her Son - Google Art Project.jpg|thumb|upright|[[Claude Monet]], ''[[Woman with a Parasol \u2013 Madame Monet and Her Son]]'' (Camille and Jean Monet), 1875, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e The term ''Impressionist'' quickly gained favour with the public. It was also accepted by the artists themselves, even though they were a diverse group in style and temperament, unified primarily by their spirit of independence and rebellion. They exhibited together\u2014albeit with shifting membership\u2014eight times between 1874 and 1886. The Impressionists' style, with its loose, spontaneous brushstrokes, would soon become synonymous with modern life.\u003cref name=\"The Met\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-Monet, Sisley, Morisot, and Pissarro may be considered the \"purest\" Impressionists, in their consistent pursuit of an art of spontaneity, sunlight, and colour. Degas rejected much of this, as he believed in the primacy of drawing over colour and belittled the practice of painting outdoors.{{sfnp|Gordon|Forge|1988|pp=11\u201312}} Renoir turned away from Impressionism for a time during the 1880s, and never entirely regained his commitment to its ideas. \u00c9douard Manet, although regarded by the Impressionists as their leader,{{sfnp|Distel|Hoog|Moffett|1974|p=127}} never abandoned his liberal use of black as a colour (while Impressionists avoided its use and preferred to obtain darker colours by mixing), and never participated in the Impressionist exhibitions. He continued to submit his works to the Salon, where his painting ''Spanish Singer'' had won a 2nd class medal in 1861, and he urged the others to do likewise, arguing that \"the Salon is the real field of battle\" where a reputation could be made.{{sfnp|Richardson|1976|p=3}}\u003cbr\u003e+Monet, Sisley, Morisot, and Pissarro may be considered the \"purest\" Impressionists, in their consistent pursuit of an art of spontaneity, sunlight, and colour. Degas rejected much of this, as he believed in the primacy of drawing over colour and belittled the practice of painting outdoors.\u003cref\u003eGordon; Forge (1988), pp. 11\u201312.\u003c\u002fref\u003e Renoir turned away from Impressionism for a time during the 1880s, and never entirely regained his commitment to its ideas. \u00c9douard Manet, although regarded by the Impressionists as their leader,\u003cref\u003eDistel et al. (1974), p. 127.\u003c\u002fref\u003e never abandoned his liberal use of black as a colour (while Impressionists avoided its use and preferred to obtain darker colours by mixing), and never participated in the Impressionist exhibitions. He continued to submit his works to the Salon, where his painting ''Spanish Singer'' had won a 2nd class medal in 1861, and he urged the others to do likewise, arguing that \"the Salon is the real field of battle\" where a reputation could be made.\u003cref\u003eRichardson (1976), p. 3.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Camille Pissarro - Boulevard Montmartre - Eremitage.jpg|thumb|left|[[Camille Pissarro]], ''Boulevard Montmartre'', 1897, the [[Hermitage Museum|Hermitage]], [[Saint Petersburg]]]]\u003cbr\u003e \u003cbr\u003e-Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.{{sfn|Denvir|1990|p=105}} Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".{{sfnp|Rewald|1973|p=603}} \u003cbr\u003e-\u003cbr\u003e-In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e-\u003cbr\u003e-The individual artists achieved few financial rewards from the Impressionist exhibitions, but their art gradually won a degree of public acceptance and support. Their dealer, [[Paul Durand-Ruel|Durand-Ruel]], played a major role in this as he kept their work before the public and arranged shows for them in London and New York. Although Sisley died in poverty in 1899, Renoir had a great Salon success in 1879.{{sfnp|Distel|Hoog|Moffett|1974|p=190}} Monet became secure financially during the early 1880s and so did Pissarro by the early 1890s. By this time the methods of Impressionist painting, in a diluted form, had become commonplace in Salon art.{{sfnp|Rewald|1973|p=475\u2013476}}\u003cbr\u003e+Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.\u003cref\u003eDenvir (1990), p.105.\u003c\u002fref\u003e Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".\u003cref\u003eRewald (1973), p. 603.\u003c\u002fref\u003e In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e+\u003cbr\u003e+The individual artists achieved few financial rewards from the Impressionist exhibitions, but their art gradually won a degree of public acceptance and support. Their dealer, [[Paul Durand-Ruel|Durand-Ruel]], played a major role in this as he kept their work before the public and arranged shows for them in London and New York. Although Sisley died in poverty in 1899, Renoir had a great Salon success in 1879.\u003cref\u003eDistel, Anne, Michel Hoog, and Charles S. Moffett. 1974. [https:\u002f\u002fbooks.google.com\u002fbooks?id=dhc-U0t14vMC&pg=PA190 ''Impressionism; a Centenary Exhibition, the Metropolitan Museum of Art, December 12, 1974 \u2013 February 10, 1975'']. [New York]: [Metropolitan Museum of Art]. p. 190. {{ISBN|0-87099-097-7}}.\u003c\u002fref\u003e Monet became secure financially during the early 1880s and so did Pissarro by the early 1890s. By this time the methods of Impressionist painting, in a diluted form, had become commonplace in Salon art.\u003cref\u003eRewald (1973), p. 475\u2013476.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Impressionist techniques ==\u003cbr\u003e [[File:Cassatt Mary At the Theater 1879.jpg|thumb|upright|[[Mary Cassatt]], ''Lydia Leaning on Her Arms'' (in a theatre box), 1879]]\u003cbr\u003e@@ -87,68 +81,64 @@\u003cbr\u003e * Impressionist paintings do not exploit the transparency of thin paint films (glazes), which earlier artists manipulated carefully to produce effects. The impressionist painting surface is typically opaque.\u003cbr\u003e * The paint is applied to a white or light-coloured [[Ground (art)|ground]]. Previously, painters often used dark grey or strongly coloured grounds.\u003cbr\u003e * The play of natural light is emphasized. Close attention is paid to the reflection of colours from object to object. Painters often worked in the evening to produce ''[[effets de soir]]''\u2014the shadowy effects of evening or twilight.\u003cbr\u003e-* In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. Blue shadows on snow inspired the technique.\u003cbr\u003e-\u003cbr\u003e-New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |url-status=dead |title=Renoir and the Impressionist Process |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |archive-date=2011-01-05 |website=[[The Phillips Collection]] |access-date=21 May 2011}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |isbn=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}\u003cbr\u003e+* In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. (Blue shadows on snow inspired the technique.)\u003cbr\u003e+\u003cbr\u003e+New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.\u003cref\u003eBomford et al. 1990, pp. 39\u201341.\u003c\u002fref\u003e Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e[http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf Renoir and the Impressionist Process] {{webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |date=2011-01-05 }}. ''[[The Phillips Collection]]'', retrieved 21 May 2011\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003eWallert, Arie; Hermens, Erma; Peek, Marja (1995). [https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 ''Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995'']. [Marina Del Rey, Calif.]: Getty Conservation Institute. p. 159. {{ISBN|0-89236-322-3}}.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003eStoner, Joyce Hill; Rushfield, Rebecca Anne (2012). [https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 ''The conservation of easel paintings''. London: Routledge. p. 177] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |date=12 November 2022 }}. {{ISBN|1-136-00041-0}}.\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003eStoner, Joyce Hill; Rushfield, Rebecca Anne (2012). [https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 ''The conservation of easel paintings''. London: Routledge. p. 178] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |date=12 November 2022 }}. {{ISBN|1-136-00041-0}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]\u003cbr\u003e-[[File:Berthe Morisot Reading.jpg|thumb|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e-The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003e{{cite book |editor1-last=Poulet |editor1-first=Anne L. |last1=Murphy |first1=Alexandra R. |year=1979 |title=Corot to Braque: French Paintings from the Museum of Fine Arts, Boston |location=Boston |publisher=The Museum of Fine Arts, Boston |page=XV |isbn=0-87846-134-5}}\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.{{sfnp|Huyghe|1973|pp=54, 77, 121}} \u003cbr\u003e-\u003cbr\u003e-A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003e{{cite book |last1=Varnedoe |first1=Kirk |year=1987 |title=Gustave Caillebotte |publisher=Yale University Press |page=90 |isbn=9780300037227}}\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003e{{cite book |last1=Rubin |first1=James Henry |year=2008 |title=Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh |location=Berkeley |publisher=University of California Press |page=128 |isbn=9780520248014}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |website=Britannica |title=J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.{{sfnp|Rosenblum|1989|p=228}} Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003e{{cite journal |last1=Varnedoe |first1=J. Kirk T. |title=The Artifice of Candor: Impressionism and Photography Reconsidered |journal=Art in America |volume=68 |issue=1 |date=January 1980 |pages=66\u201378}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Herbert |first1=Robert L. |title=Impressionism: Art, Leisure, and Parisian Society  |publisher=Yale University Press |year=1988 |pages=311, 319 |isbn=0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003ePoulet, A. L., & Murphy, A. R. (1979). ''Corot to Braque: French Paintings from the Museum of Fine Arts, Boston''. Boston: The Museum. p. XV. {{ISBN|0-87846-134-5}}.\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.\u003cref\u003eHuyghe (1973), pp. 54, 77, 121.\u003c\u002fref\u003e  A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003eVarnedoe, Kirk (1987). ''Gustave Caillebotte''. Yale University Press. p. 90. {{ISBN|9780300037227}}.\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003eRubin, James Henry (2008). ''Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh''. Berkeley: University of California Press. p. 128. {{ISBN|9780520248014}}.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |title=Britannica.com J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.\u003cref\u003eRosenblum (1989), p. 228.\u003c\u002fref\u003e Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003eVarnedoe, J. Kirk T. ''The Artifice of Candor: Impressionism and Photography Reconsidered'', Art in America 68, January 1980, pp. 66\u201378\u003c\u002fref\u003e\u003cref\u003eHerbert, Robert L. ''Impressionism: Art, Leisure, and Parisian Society'', Yale University Press, 1988, pp. 311, 319 {{ISBN|0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Berthe Morisot Reading.jpg|thumb|left|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e \u003cbr\u003e The development of Impressionism can be considered partly as a reaction by artists to the challenge presented by photography, which seemed to devalue the artist's skill in reproducing reality. Both portrait and [[Landscape art|landscape]] paintings were deemed somewhat deficient and lacking in truth as photography \"produced lifelike images much more efficiently and reliably\".\u003cref name=\"impressionism757\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-In spite of this, photography actually inspired artists to pursue other means of creative expression, and rather than compete with photography to emulate reality, artists focused \"on the one thing they could inevitably do better than the photograph\u2014by further developing into an art form its very subjectivity in the conception of the image, the very subjectivity that photography eliminated\".\u003cref name=\"impressionism757\" \u002f\u003e The Impressionists sought to express their perceptions of nature, rather than create exact representations. This allowed artists to depict subjectively what they saw with their \"tacit imperatives of taste and conscience\".\u003cref name=\"impressionism758\"\u003e{{cite book |last1=Sontag |first1=Susan |year=1977 |title=On Photography |publisher=Penguin |location=London}}\u003c\u002fref\u003e Photography encouraged painters to exploit aspects of the painting medium, like colour, which photography then lacked: \"The Impressionists were the first to consciously offer a subjective alternative to the photograph\".\u003cref name=\"impressionism757\"\u003e{{cite book |last1=Levinson |first1=Paul |year=1997 |title=The Soft Edge; a Natural History and Future of the Information Revolution |publisher=Routledge |location=London and New York}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:Claude Monet - Jardin \u00e0 Sainte-Adresse.jpg|thumb|[[Claude Monet]], ''[[Garden at Sainte-Adresse|Jardin \u00e0 Sainte-Adresse]],'' 1867, [[Metropolitan Museum of Art]], New York.,\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133 |title=Garden at Sainte-Adresse |website=Metropolitan Museum of Art |access-date=11 January 2014 |archive-date=23 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220123074936\u002fhttp:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |url-status=live }}\u003c\u002fref\u003e a work showing the influence of Japanese prints]]\u003cbr\u003e-\u003cbr\u003e-Another major influence was Japanese [[ukiyo-e]] art prints ([[Japonism]]). The art of these prints contributed significantly to the \"snapshot\" angles and unconventional compositions that became characteristic of Impressionism. An example is Monet's ''Jardin \u00e0 Sainte-Adresse'', 1867, with its bold blocks of colour and composition on a strong diagonal slant showing the influence of Japanese prints.\u003cref\u003e{{Cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&pg=PA433 |title=Origins of Impressionism |page=433 |isbn=9780870997174 |access-date=6 November 2015 |archive-date=12 November 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131928\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&pg=PA433&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&hl=en&sa=X&ei=dwnPUtm_GKnNsQTV-4KIDA&ved=0CEIQ6AEwAA#v=onepage&q=Terrasse%20%C3%A0%20Sainte-Adresse%20japanese%20prints&f=false |url-status=live |last1=Tinterow |first1=Gary |last2=Loyrette |first2=Henri |year=1994 |publisher=Metropolitan Museum of Art }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.{{sfnp|Baumann|Karabelnik|1994|p=112}} His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e+In spite of this, photography actually inspired artists to pursue other means of creative expression, and rather than compete with photography to emulate reality, artists focused \"on the one thing they could inevitably do better than the photograph\u2014by further developing into an art form its very subjectivity in the conception of the image, the very subjectivity that photography eliminated\".\u003cref name=\"impressionism757\" \u002f\u003e The Impressionists sought to express their perceptions of nature, rather than create exact representations. This allowed artists to depict subjectively what they saw with their \"tacit imperatives of taste and conscience\".\u003cref name=\"impressionism758\"\u003eSontag, Susan (1977) On Photography, Penguin, London\u003c\u002fref\u003e Photography encouraged painters to exploit aspects of the painting medium, like colour, which photography then lacked: \"The Impressionists were the first to consciously offer a subjective alternative to the photograph\".\u003cref name=\"impressionism757\"\u003eLevinson, Paul (1997) ''The Soft Edge; a Natural History and Future of the Information Revolution'', Routledge, London and New York\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Claude Monet - Jardin \u00e0 Sainte-Adresse.jpg|thumb|[[Claude Monet]], ''[[Garden at Sainte-Adresse|Jardin \u00e0 Sainte-Adresse]],'' 1867, [[Metropolitan Museum of Art]], New York.,\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |title=Metropolitan Museum of Art |access-date=11 January 2014 |archive-date=23 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220123074936\u002fhttp:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |url-status=live }}\u003c\u002fref\u003e a work showing the influence of Japanese prints]]\u003cbr\u003e+\u003cbr\u003e+Another major influence was Japanese [[ukiyo-e]] art prints ([[Japonism]]). The art of these prints contributed significantly to the \"snapshot\" angles and unconventional compositions that became characteristic of Impressionism. An example is Monet's ''Jardin \u00e0 Sainte-Adresse'', 1867, with its bold blocks of colour and composition on a strong diagonal slant showing the influence of Japanese prints.\u003cref\u003e{{Cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&pg=PA433 |title=Gary Tinterow, Origins of Impressionism, Metropolitan Museum of Art,1994, page 433 |isbn=9780870997174 |access-date=6 November 2015 |archive-date=12 November 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131928\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&pg=PA433&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&hl=en&sa=X&ei=dwnPUtm_GKnNsQTV-4KIDA&ved=0CEIQ6AEwAA#v=onepage&q=Terrasse%20%C3%A0%20Sainte-Adresse%20japanese%20prints&f=false |url-status=live |last1=Tinterow |first1=Gary |last2=Loyrette |first2=Henri |year=1994 |publisher=Metropolitan Museum of Art }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.\u003cref\u003eBaumann; Karabelnik, et al. (1994), p. 112.\u003c\u002fref\u003e His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e \u003cbr\u003e == Female Impressionists ==\u003cbr\u003e-[[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|[[Berthe Morisot]], ''[[The Harbour at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e-\u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists.\u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12|doi-access=free }}\u003c\u002fref\u003e They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places. That was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects, which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art, since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e-\u003cbr\u003e-Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e+\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.\u003cref\u003e{{Cite book|title=Women impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=9|oclc=14368525}}\u003c\u002fref\u003e Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.\u003cref name=\":1\"\u003e{{Cite book|title=Women impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=6|oclc=14368525}}\u003c\u002fref\u003e It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.\u003cref name=\":1\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e[https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot \"Berthe Morisot\"] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |date=6 January 2020 }}, National Museum of Women in the Arts. Retrieved 18 May 2019.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Young Girl at a Window.JPG|thumb|upright|[[Mary Cassatt]], ''Young Girl at a Window,'' 1885, oil on canvas, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.{{sfnp|Garb|1986|p=36}} Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003e\u003cbr\u003e-\u003cbr\u003e-While Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings, which could offer commissions, were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The women Impressionists, like their male counterparts, were striving for \"truth\", for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists, particularly Morisot and Cassatt, were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e+The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=36|oclc=14368525}}\u003c\u002fref\u003e Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The women Impressionists, like their male counterparts, were striving for \"truth,\" for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e \u003cbr\u003e [[File:Eva Gonzal\u00e8s (1849-1883) Een loge in het Th\u00e9\u00e2tre des Italiens (1874) Mus\u00e9e d'Orsay 22-8-2017 17-29-43.JPG|thumb|[[Eva Gonzal\u00e8s]], ''Une Loge aux Italiens,'' or, ''Box at the Italian Opera,'' {{Circa|1874}}, oil on canvas, [[Mus\u00e9e d'Orsay]], Paris]]\u003cbr\u003e \u003cbr\u003e-Despite their success in their ability to have a career and Impressionism's demise attributed to its allegedly feminine characteristics\u2014its sensuality, dependence on sensation, physicality, and fluidity\u2014the four women artists, and other, lesser-known women Impressionists, were largely omitted from art historical textbooks covering Impressionist artists until Tamar Garb's ''Women Impressionists'' published in 1986.\u003cref\u003e{{Cite book|title=Perspectives on Morisot|last=Adler|first=Kathleen|publisher=Hudson Hills Press|others=Edelstein, T. J., Mount Holyoke College. Art Museum.|year=1990|isbn=1-55595-049-3|edition=1st|location=New York|page=57|oclc=21764484}}\u003c\u002fref\u003e For example, ''Impressionism'' by Jean Leymarie, published in 1955 included no information on any women Impressionists.\u003cbr\u003e-\u003cbr\u003e-Painter [[Androniqi Zengo Antoniu]] is co-credited with the introduction of impressionism to Albania.\u003cref\u003e{{Cite book |last1=Keefe |first1=Eugene K. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=CXmB6nDu4_AC&dq=Androniqi+Zengo+Antoniu&pg=PA142 |title=Area Handbook for Albania |author2=American University (Washington, D. C.) Foreign Area Studies |date=1971 |publisher=U.S. Government Printing Office |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+Despite their success in their ability to have a career and Impressionism's demise attributed to its allegedly feminine characteristics (its sensuality, dependence on sensation, physicality, and fluidity) the four women artists (and other, lesser-known women Impressionists) were largely omitted from art historical textbooks covering Impressionist artists until Tamar Garb's ''Women Impressionists'' published in 1986.\u003cref\u003e{{Cite book|title=Perspectives on Morisot|last=Adler|first=Kathleen|publisher=Hudson Hills Press|others=Edelstein, T. J., Mount Holyoke College. Art Museum.|year=1990|isbn=1-55595-049-3|edition=1st|location=New York|page=57|oclc=21764484}}\u003c\u002fref\u003e For example, ''Impressionism'' by Jean Leymarie, published in 1955 included no information on any women Impressionists.\u003cbr\u003e+\u003cbr\u003e+Painter [[Androniqi Zengo Antoniu]] is co-credited with the introduction of impressionism to Albania.\u003cref\u003e{{Cite book |last1=Keefe |first1=Eugene K. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=CXmB6nDu4_AC&dq=Androniqi+Zengo+Antoniu&pg=PA142 |title=Area Handbook for Albania |last2=Studies |first2=American University (Washington, D. C.) Foreign Area |date=1971 |publisher=U.S. Government Printing Office |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Prominent Impressionists ==\u003cbr\u003e-The central figures in the development of Impressionism in France,\u003cref\u003e{{Cite web |url=https:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |title=Exposition du boulevard des Capucines |lang=French |date=29 April 1874 |access-date=18 October 2018 |archive-date=9 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220109181659\u002fhttps:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |title=''Les expositions impressionnistes'', Larousse |lang=French |access-date=18 October 2018 |archive-date=2 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170602205003\u002fhttp:\u002f\u002flarousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |url-status=live }}\u003c\u002fref\u003e listed alphabetically, were:\u003cbr\u003e+The central figures in the development of Impressionism in France,\u003cref\u003e{{Cite web |url=https:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |title=Exposition du boulevard des Capucines (French) |date=29 April 1874 |access-date=18 October 2018 |archive-date=9 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220109181659\u002fhttps:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |title=''Les expositions impressionnistes'', Larousse (French) |access-date=18 October 2018 |archive-date=2 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170602205003\u002fhttp:\u002f\u002flarousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |url-status=live }}\u003c\u002fref\u003e listed alphabetically, were:\u003cbr\u003e * [[Fr\u00e9d\u00e9ric Bazille]] (1841\u20131870), who only posthumously participated in the Impressionist exhibitions\u003cbr\u003e * [[Gustave Caillebotte]] (1848\u20131894), who, younger than the others, joined forces with them in the mid-1870s\u003cbr\u003e * [[Mary Cassatt]] (1844\u20131926), American-born, she lived in Paris and participated in four Impressionist exhibitions\u003cbr\u003e * [[Paul C\u00e9zanne]] (1839\u20131906), although he later broke away from the Impressionists\u003cbr\u003e * [[Edgar Degas]] (1834\u20131917), who despised the term ''Impressionist''\u003cbr\u003e * [[Armand Guillaumin]] (1841\u20131927)\u003cbr\u003e-* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003e{{cite book |last1=Cole |first1=Bruce |year=1991 |title=Art of the Western World: From Ancient Greece to Post Modernism |publisher=Simon and Schuster |page=242 |isbn=0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e-* [[Claude Monet]] (1840\u20131926), the most prolific of the Impressionists and the one who embodies their aesthetic most obviously{{sfnp|Denvir|1990|p=140}}\u003cbr\u003e+* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003eCole, Bruce (1991). ''Art of the Western World: From Ancient Greece to Post Modernism''. Simon and Schuster. p. 242. {{ISBN|0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e+* [[Claude Monet]] (1840\u20131926), the most prolific of the Impressionists and the one who embodies their aesthetic most obviously\u003cref\u003eDenvir (1990), p.140.\u003c\u002fref\u003e\u003cbr\u003e * [[Berthe Morisot]] (1841\u20131895) who participated in all Impressionist exhibitions except in 1879\u003cbr\u003e-* [[Camille Pissarro]] (1830\u20131903), who was the only artist to participate in all eight Impressionist exhibitions.{{sfnp|Rewald|1973|p=591}}\u003cbr\u003e+* [[Camille Pissarro]] (1830\u20131903), who was the only artist to participate in all eight Impressionist exhibitions.\u003cref\u003eRewald (1973), p. 591.\u003c\u002fref\u003e\u003cbr\u003e * [[Pierre-Auguste Renoir]] (1841\u20131919), who participated in Impressionist exhibitions in 1874, 1876, 1877 and 1882\u003cbr\u003e * [[Alfred Sisley]] (1839\u20131899)\u003cbr\u003e \u003cbr\u003e@@ -228,7 +218,6 @@\u003cbr\u003e File:Berthe Morisot, Le berceau (The Cradle), 1872.jpg|[[Berthe Morisot]], ''[[The Cradle (Morisot)|The Cradle]]'', 1872, [[Mus\u00e9e d'Orsay]]\u003cbr\u003e File:Guillaumin SoleilCouchantAIvry.jpg|[[Armand Guillaumin]], ''Sunset at Ivry (Soleil couchant \u00e0 Ivry)'', 1873, [[Mus\u00e9e d'Orsay]]\u003cbr\u003e File:Edouard Manet Boating.jpg|[[\u00c9douard Manet]], ''Boating'', 1874, [[Metropolitan Museum of Art]]\u003cbr\u003e-File:Premi\u00e8re Exposition 1874, 35 Boulevard des Capucines Catalogue.jpg|Catalogue cover from the [[First Impressionist Exhibition]], 1874\u003cbr\u003e File:Sisley la seine au point du jour 1877.jpg|[[Alfred Sisley]], ''La Seine au Point du jour'', 1877, [[Museum of modern art Andr\u00e9 Malraux - MuMa]], [[Le Havre]]\u003cbr\u003e File:Edouard Manet 039.jpg|[[\u00c9douard Manet]], ''[[The Plum]]'', 1878, [[National Gallery of Art]], Washington, D.C.\u003cbr\u003e File:La Falaise \u00e0 F\u00e9camp - Claude Monet - ABDAG003046.jpg|alt=Landscape painting depicting the cliffs of Normandy by Claude Monet|[[Claude Monet]], ''La Falaise \u00e0 F\u00e9camp'', 1881, [[Aberdeen Art Gallery]]\u003cbr\u003e@@ -252,17 +241,15 @@\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == Associates and influenced artists ==\u003cbr\u003e-[[File:Vangoghmuseum-s0277V1962-800.jpg|thumb|left|[[Victor Vignon|Victor Alfred Paul Vignon]], ''Woman in a Vineyard'', c. 1880, [[Van Gogh Museum]]]]\u003cbr\u003e+[[File:Vangoghmuseum-s0277V1962-800.jpg|thumb|left|upright|[[Victor Vignon|Victor Alfred Paul Vignon]], ''Woman in a Vineyard'', c. 1880, [[Van Gogh Museum]]]]\u003cbr\u003e \u003cbr\u003e [[File:James Abbot McNeill Whistler 012.jpg|thumb|upright|[[James Abbott McNeill Whistler]], ''[[Nocturne in Black and Gold: The Falling Rocket]]'', 1874, [[Detroit Institute of Arts]]]]\u003cbr\u003e \u003cbr\u003e Among the close associates of the Impressionists, [[Victor Vignon]] is the only artist outside the group of prominent names who participated to the most exclusive Seventh Paris Impressionist Exhibition in 1882, which was indeed a rejection to the previous less restricted exhibitions chiefly organized by Degas. Originally from the school of [[Corot]], Vignon was a friend of [[Camille Pissarro]], whose influence is evident in his impressionist style after the late 1870s, and a friend of post-impressionist [[Vincent van Gogh]].\u003cbr\u003e \u003cbr\u003e-There were several other close associates of the Impressionists who adopted their methods to some degree. These include [[Jean-Louis Forain]], who participated in Impressionist exhibitions in 1879, 1880, 1881 and 1886,\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|title=Joconde : catalogue collectif des collections des mus\u00e9es de France|website=www.culture.gouv.fr|access-date=2017-12-28|archive-date=28 December 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171228172700\u002fhttp:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|url-status=dead|lang=French}}\u003c\u002fref\u003e and [[Giuseppe De Nittis]], an Italian artist living in Paris who participated in the first Impressionist exhibit at the invitation of Degas, although the other Impressionists disparaged his work.{{sfnp|Denvir|1990|p=152}} [[Federico Zandomeneghi]] was another Italian friend of Degas who showed with the Impressionists. [[Eva Gonzal\u00e8s]] was a follower of Manet who did not exhibit with the group. \u003cbr\u003e-\u003cbr\u003e-[[James Abbott McNeill Whistler]] was an American-born painter who played a part in Impressionism although he did not join the group and preferred grayed colours. [[Walter Sickert]], an English artist, was initially a follower of Whistler, and later an important disciple of Degas. He did not exhibit with the Impressionists. In 1904, the artist and writer [[Wynford Dewhurst]] wrote the first important study of the French painters published in English, ''Impressionist Painting: its genesis and development'', which did much to popularize Impressionism in Great Britain.\u003cbr\u003e-\u003cbr\u003e-By the early 1880s, Impressionist methods were affecting, at least superficially, the art of the Salon. Fashionable painters such as [[Jean B\u00e9raud]] and [[Henri Gervex]] found critical and financial success by brightening their palettes while retaining the smooth finish expected of Salon art.{{sfnp|Rewald|1973|pp=476\u2013477}} Works by these artists are sometimes casually referred to as Impressionism, despite their remoteness from Impressionist practice.\u003cbr\u003e+There were several other close associates of the Impressionists who adopted their methods to some degree. These include [[Jean-Louis Forain]] (who participated in Impressionist exhibitions in 1879, 1880, 1881 and 1886)\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|title=Joconde : catalogue collectif des collections des mus\u00e9es de France|website=www.culture.gouv.fr|access-date=2017-12-28|archive-date=28 December 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171228172700\u002fhttp:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|url-status=live}}\u003c\u002fref\u003e and [[Giuseppe De Nittis]], an Italian artist living in Paris who participated in the first Impressionist exhibit at the invitation of Degas, although the other Impressionists disparaged his work.\u003cref\u003eDenvir (1990), p.152.\u003c\u002fref\u003e [[Federico Zandomeneghi]] was another Italian friend of Degas who showed with the Impressionists. [[Eva Gonzal\u00e8s]] was a follower of Manet who did not exhibit with the group. [[James Abbott McNeill Whistler]] was an American-born painter who played a part in Impressionism although he did not join the group and preferred grayed colours. [[Walter Sickert]], an English artist, was initially a follower of Whistler, and later an important disciple of Degas; he did not exhibit with the Impressionists. In 1904 the artist and writer [[Wynford Dewhurst]] wrote the first important study of the French painters published in English, ''Impressionist Painting: its genesis and development'', which did much to popularize Impressionism in Great Britain.\u003cbr\u003e+\u003cbr\u003e+By the early 1880s, Impressionist methods were affecting, at least superficially, the art of the Salon. Fashionable painters such as [[Jean B\u00e9raud]] and [[Henri Gervex]] found critical and financial success by brightening their palettes while retaining the smooth finish expected of Salon art.\u003cref\u003eRewald (1973), p.476\u2013477.\u003c\u002fref\u003e Works by these artists are sometimes casually referred to as Impressionism, despite their remoteness from Impressionist practice.\u003cbr\u003e \u003cbr\u003e The influence of the French Impressionists lasted long after most of them had died. Artists like [[Jesekiel David Kirszenbaum|J.D. Kirszenbaum]] were borrowing Impressionist techniques throughout the twentieth century.\u003cbr\u003e \u003cbr\u003e@@ -272,11 +259,11 @@\u003cbr\u003e [[File:Hip, Hip, Hurrah! Artists\u2019 Party, Skagen (Peder Severin Kr\u00f8yer) - Gothenburg Museum of Art - F 62.tif|thumb|[[Peder Severin Kr\u00f8yer]]'s 1888 work ''[[Hip, Hip, Hurrah!]]'', held at the [[Gothenburg Museum of Art]], shows members of the [[Skagen Painters]].]]\u003cbr\u003e As the influence of Impressionism spread beyond France, artists, too numerous to list, became identified as practitioners of the new style. Some of the more important examples are:\u003cbr\u003e * The [[American Impressionism|American Impressionists]], including [[Mary Cassatt]], [[William Merritt Chase]], [[Frederick Carl Frieseke]], [[Childe Hassam]], [[Willard Metcalf]], [[Lilla Cabot Perry]], [[Theodore Robinson]], [[Edmund C. Tarbell|Edmund Charles Tarbell]], [[John Henry Twachtman]], [[Catherine Wiley]] and [[J. Alden Weir]].\u003cbr\u003e-* The [[Australian Impressionism|Australian Impressionists]], including [[Tom Roberts]], [[Arthur Streeton]], [[Walter Withers]], [[Charles Conder]], [[Frederick McCubbin]] and [[E. Phillips Fox]] (who were prominent members of the [[Heidelberg School]]), and [[John Russell (Australian artist)|John Russell]], a friend of Van Gogh, Rodin, Monet and Matisse.\u003cbr\u003e-* The [[Amsterdam Impressionism|Amsterdam Impressionists]] in the [[Netherlands]], including [[George Hendrik Breitner]], [[Isaac Isra\u00ebls]], [[Willem Bastiaan Tholen]], [[Willem de Zwart]], [[Willem Witsen]], [[Marie Henry Mackenzie]] and [[Jan Toorop]].\u003cbr\u003e+* The [[Australian Impressionism|Australian Impressionists]], including [[Tom Roberts]], [[Arthur Streeton]], [[Walter Withers]], [[Charles Conder]] and [[Frederick McCubbin]] (who were prominent members of the [[Heidelberg School]]), and [[John Russell (Australian artist)|John Russell]], a friend of Van Gogh, Rodin, Monet and Matisse.\u003cbr\u003e+* The [[Amsterdam Impressionism|Amsterdam Impressionists]] in the [[Netherlands]], including [[George Hendrik Breitner]], [[Isaac Isra\u00ebls]], [[Willem Bastiaan Tholen]], [[Willem de Zwart]], [[Willem Witsen]] and [[Jan Toorop]].\u003cbr\u003e * The [[California Impressionism|California Impressionists]], including [[William Wendt]], [[Guy Rose]], [[Alson Clark]], [[Donna N. Schuster]], and [[Sam Hyde Harris]].\u003cbr\u003e * [[Anna Boch]], [[Vincent van Gogh]]'s friend [[Eug\u00e8ne Boch]], [[Georges Lemmen]] and [[Th\u00e9o van Rysselberghe]], Impressionist painters from [[Belgium]].\u003cbr\u003e-* The [[Slovenian Impressionism|Slovenian Impressionists]], [[Ivan Grohar]], [[Rihard Jakopi\u010d]], [[Matija Jama]], and [[Matej Sternen]]. Their beginning was in the school of [[Anton A\u017ebe]] in Munich and they were influenced by [[Jurij \u0160ubic]] and [[Ivana Kobilca]], Slovenian painters working in Paris.\u003cbr\u003e+* [[Ivan Grohar]], [[Rihard Jakopi\u010d]], [[Matija Jama]], and [[Matej Sternen]], Impressionists from Slovenia. Their beginning was in the school of [[Anton A\u017ebe]] in Munich and they were influenced by [[Jurij \u0160ubic]] and [[Ivana Kobilca]], Slovenian painters working in Paris.\u003cbr\u003e * [[Wynford Dewhurst]], [[Walter Richard Sickert]], and [[Philip Wilson Steer]] were well known Impressionist painters from the United Kingdom. [[Pierre Adolphe Valette]], who was born in France but who worked in Manchester, was the tutor of [[L. S. Lowry]].\u003cbr\u003e * The [[German Impressionists]], including [[Max Liebermann]], [[Lovis Corinth]], [[Ernst Oppler]], [[Max Slevogt]] and [[August von Brandis]].\u003cbr\u003e * [[L\u00e1szl\u00f3 Medny\u00e1nszky]] and [[P\u00e1l Szinyei Merse|P\u00e1l Szinyei-Merse]] in Hungary\u003cbr\u003e@@ -286,14 +273,14 @@\u003cbr\u003e * [[Francisco Oller|Francisco Oller y Cestero]], a native of [[Puerto Rico]] and a friend of Pissarro and C\u00e9zanne\u003cbr\u003e * [[James Nairn]] in New Zealand\u003cbr\u003e * [[William McTaggart]] in Scotland\u003cbr\u003e-* [[Maurice Cullen (artist)|Maurice Cullen]], [[Laura Muntz Lyall]] and [[Helen McNicoll]], Canadian artists\u003cbr\u003e+* [[Laura Muntz Lyall]], a Canadian artist\u003cbr\u003e * [[W\u0142adys\u0142aw Podkowi\u0144ski]], a Polish Impressionist and [[Symbolism (arts)|symbolist]]\u003cbr\u003e * [[Nicolae Grigorescu]] in Romania\u003cbr\u003e * [[Nazmi Ziya G\u00fcran]], who brought Impressionism to [[Turkey]]\u003cbr\u003e * [[Chafik Charobim]] in Egypt\u003cbr\u003e * [[Eliseu Visconti]] in Brazil\u003cbr\u003e * [[Joaqu\u00edn Sorolla]] and [[Ferm\u00edn Arango]] in Spain\u003cbr\u003e-* Faustino Brughetti, [[Fernando Fader]], [[Candido Lopez]], [[Mart\u00edn Malharro]], Walter de Navazio, [[Ram\u00f3n Silva (painter)|Ram\u00f3n Silva]] in Argentina\u003cbr\u003e+* Faustino Brughetti, [[Fernando Fader]], [[Candido Lopez]], [[Mart\u00edn Malharro]], Walter de Navazio, [[Ram\u00f3n Silva]] in Argentina\u003cbr\u003e * [[Skagen Painters]] a group of Scandinavian artists who painted in a small Danish fishing village\u003cbr\u003e * [[Nade\u017eda Petrovi\u0107]], [[Milo Milunovi\u0107]], [[Kosta Mili\u010devi\u0107]], [[Milan Milovanovi\u0107 (painter)|Milan Milovanovi]] and [[Mali\u0161a Gli\u0161i\u0107]] in Serbia\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.politika.rs\u002fscc\u002fclanak\u002f292020\u002fSrpski-impresionisti-su-se-umetnoscu-borili |title=\u0421\u0440\u043f\u0441\u043a\u0438 \u0438\u043c\u043f\u0440\u0435\u0441\u0438\u043e\u043d\u0438\u0441\u0442\u0438 \u0441\u0443 \u0441\u0435 \u0443\u043c\u0435\u0442\u043d\u043e\u0448\u045b\u0443 \u0431\u043e\u0440\u0438\u043b\u0438 |lang=Serbian |trans-title=Serbian Impressionists fought with art |first=Biljana |last=Lijeski\u0107 |date=5 May 2014 |website=politika.rs |access-date=27 May 2022 |archive-date=27 May 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220527140833\u002fhttps:\u002f\u002fwww.politika.rs\u002fscc\u002fclanak\u002f292020\u002fSrpski-impresionisti-su-se-umetnoscu-borili |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.zeptermuseum.rs\u002fodnosi-francuskog-i-srpskog-impresionizma |title=Odnosi Francuskog I Srpskog Impresionizma &#124; Zepter Muzej |publisher=Zeptermuseum.rs |date=2016-02-22 |accessdate=2022-05-31 |archive-date=18 March 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160318152911\u002fhttp:\u002f\u002fzeptermuseum.rs\u002fodnosi-francuskog-i-srpskog-impresionizma |url-status=dead }}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fmsub.org.rs\u002fselection\u002fzbirka-slikarstva-od-1900-do-1945-godine\u002f |title=Zbirka slikarstva od 1900. do 1945. godine \u2013 Muzej savremene umetnosti u Beogradu |publisher=Msub.org.rs |date= |accessdate=2022-05-31 |archive-date=24 May 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220524152048\u002fhttps:\u002f\u002fmsub.org.rs\u002fselection\u002fzbirka-slikarstva-od-1900-do-1945-godine\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e * [[\u00c1sgr\u00edmur J\u00f3nsson]] in Iceland\u003cbr\u003e@@ -306,50 +293,38 @@\u003cbr\u003e \u003cbr\u003e [[File:Bailarina Degas Washington.jpg|upright=0.5|thumb|right|Edgar Degas's ''Little Dancer of Fourteen Years'' at the [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-While Edgar Degas was primarily known as a painter in his lifetime, he began to pursue the medium of sculpture later in his artistic career in the 1880s. He created as many as 150 sculptures during his lifetime. Degas preferred the medium of wax for his sculptures because it allowed him to make changes, start over, and further explore the modelling process.\u003cref\u003e{{cite journal |last1=Locheed |first1=Jessica |title=Beyond the form: the ineffable essence of Degas' sculpture |journal=Sculpture Journal |date=June 2009 |volume=18 |issue=1 |pages=86\u
