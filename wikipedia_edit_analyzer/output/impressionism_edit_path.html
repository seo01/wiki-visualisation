y the application of a golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e ","--- Revision 61\u003cbr\u003e+++ Revision 62\u003cbr\u003e@@ -29,7 +29,7 @@\u003cbr\u003e \u003cbr\u003e == Beginnings ==\u003cbr\u003e {{French art history}}\u003cbr\u003e-In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a thick golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live |quote=Many of the independent artists chose not to apply the thick golden varnish that painters customarily used to tone down their works.}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e ","--- Revision 62\u003cbr\u003e+++ Revision 63\u003cbr\u003e@@ -301,7 +301,7 @@\u003cbr\u003e \u003cbr\u003e While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art : Distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate processs]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+[[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate process]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[French Impressionist Cinema]] is a term applied to a loosely defined group of films and filmmakers in France from 1919 to 1929, although these years are debatable. French Impressionist filmmakers include [[Abel Gance]], [[Jean Epstein]], [[Germaine Dulac]], Marcel L'Herbier, [[Louis Delluc]], and Dmitry Kirsanoff.\u003cbr\u003e ","--- Revision 63\u003cbr\u003e+++ Revision 64\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e | influenced    = {{unbulleted list|[[Post-Impressionism]]|[[Neo-Impressionism]]|[[Expressionism]]}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during the 1870s and 1880s.\u003cbr\u003e+'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during 1874 to 1886.\u003cbr\u003e \u003cbr\u003e The Impressionists faced harsh opposition from the conventional art community in [[France]]. The name of the style derives from the title of a [[Claude Monet]] work, ''Impression, soleil levant'' (''[[Impression, Sunrise]]''), which provoked the critic [[Louis Leroy]] to coin the term in a [[Satire|satirical]] 1874 review of the [[First Impressionist Exhibition]] published in the Parisian newspaper ''[[Le Charivari]]''. The development of Impressionism in the visual arts was soon followed by analogous styles in other media that became known as [[Impressionist music]] and [[Impressionism (literature)|Impressionist literature]].\u003cbr\u003e ","--- Revision 64\u003cbr\u003e+++ Revision 65\u003cbr\u003e@@ -14,7 +14,7 @@\u003cbr\u003e | influenced    = {{unbulleted list|[[Post-Impressionism]]|[[Neo-Impressionism]]|[[Expressionism]]}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during 1874 to 1886.\u003cbr\u003e+'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during the 1870s and 1880s.\u003cbr\u003e \u003cbr\u003e The Impressionists faced harsh opposition from the conventional art community in [[France]]. The name of the style derives from the title of a [[Claude Monet]] work, ''Impression, soleil levant'' (''[[Impression, Sunrise]]''), which provoked the critic [[Louis Leroy]] to coin the term in a [[Satire|satirical]] 1874 review of the [[First Impressionist Exhibition]] published in the Parisian newspaper ''[[Le Charivari]]''. The development of Impressionism in the visual arts was soon followed by analogous styles in other media that became known as [[Impressionist music]] and [[Impressionism (literature)|Impressionist literature]].\u003cbr\u003e ","--- Revision 65\u003cbr\u003e+++ Revision 66\u003cbr\u003e@@ -23,27 +23,27 @@\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.\u003cref\u003eExceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].\u003c\u002fref\u003e The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ Ingo F. Walther, ''Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1''], Centralibros Hispania Edicion y Distribucion, S.A., 1999, {{ISBN|3-8228-7031-5}}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e+[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1'' |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |ISBN=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The public, at first hostile, gradually came to believe that the Impressionists had captured a fresh and original vision, even if the art critics and art establishment disapproved of the new style. By recreating the sensation in the eye that views the subject, rather than delineating the details of the subject, and by creating a welter of techniques and forms, Impressionism is a precursor of various painting styles, including [[Neo-Impressionism]], [[Post-Impressionism]], [[Fauvism]], and [[Cubism]].{{fact|date=November 2023}}\u003cbr\u003e \u003cbr\u003e == Beginnings ==\u003cbr\u003e {{French art history}}\u003cbr\u003e-In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a thick golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live |quote=Many of the independent artists chose not to apply the thick golden varnish that painters customarily used to tone down their works.}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003eWhite, Harrison C., Cynthia A. White (1993). ''[https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 Canvases and Careers: Institutional Change in the French Painting World] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e+In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.{{sfnp|Huyghe|1973|pp=13, 16\u201318}} The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003e{{cite book |first1=Nathalia |last1=Brodskaya |title=Impressionism |publisher=Parkstone International |year=2014 |pp=13\u201314}}\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a thick golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |last1=Samu |first1=Margaret |title=Impressionism: Art and Modernity |website=Heilbrunn Timeline of Art History |location=New York |publisher=The Metropolitan Museum of Art |date=October 2004 |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live |quote=Many of the independent artists chose not to apply the thick golden varnish that painters customarily used to tone down their works.}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.{{sfnp|Huyghe|1973|pp=11, 16\u201317}} By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003e{{cite book |last1=Masan\u00e8s |first1=Fabrice |year=2006 |title=Courbet |publisher=Taschen |pp=31\u201333. |ISBN=978-3-8228-5683-3 }}.\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003e{{cite book |last1=White |first1=Harrison C. |first2=Cynthia A. |last2=White |year=1993 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |title=Canvases and Careers: Institutional Change in the French Painting World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |archive-date=12 November 2022 |publisher=University of Chicago Press |page=116 |ISBN=0-226-89487-8 }}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=21\u201327}} By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003e{{cite book |last1=Greenspan |first1=Taube G |chapter=Armand Guillaumin |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e-During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003eSeiberling, Grace, \"Impressionism\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.\u003cref\u003eDenvir (1990), p.133.\u003c\u002fref\u003e The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e-\u003cbr\u003e-After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) was organized. While many viewers came only to laugh, the Salon des Refus\u00e9s drew attention to the existence of a new tendency in art and attracted more visitors than the regular Salon.\u003cref\u003eDenvir (1990), p.194.\u003c\u002fref\u003e\u003cbr\u003e+During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003e{{cite book |last1=Seiberling |first=Grace |chapter=Impressionism |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.{{sfnp|Denvir|1990|p=133}} The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e+\u003cbr\u003e+After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) was organized. While many viewers came only to laugh, the Salon des Refus\u00e9s drew attention to the existence of a new tendency in art and attracted more visitors than the regular Salon.{{sfnp|Denvir|1990|p=194}}\u003cbr\u003e \u003cbr\u003e [[File:Alfred Sisley 001.jpg|thumb|left|[[Alfred Sisley]], ''[[View of the Canal Saint-Martin]]'', 1870, [[Mus\u00e9e d'Orsay]]]]\u003cbr\u003e \u003cbr\u003e-Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the [[Batignolles group|''Soci\u00e9t\u00e9 Anonyme Coop\u00e9rative des Artistes Peintres, Sculpteurs, Graveurs'']] (\"Company of Painters, Sculptors, and Engravers\") to exhibit their artworks independently.\u003cref\u003eBomford et al. 1990, p. 209.\u003c\u002fref\u003e Members of the association were expected to forswear participation in the Salon.\u003cref\u003eJensen 1994, p. 90.\u003c\u002fref\u003e The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.\u003cref\u003eDenvir (1990), p.32.\u003c\u002fref\u003e Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e+Artists' petitions requesting a new Salon des Refus\u00e9s in 1867, and again in 1872, were denied. In December 1873, [[Claude Monet|Monet]], [[Pierre-Auguste Renoir|Renoir]], [[Camille Pissarro|Pissarro]], [[Alfred Sisley|Sisley]], [[Paul C\u00e9zanne|C\u00e9zanne]], [[Berthe Morisot]], [[Edgar Degas]] and several other artists founded the [[Batignolles group|''Soci\u00e9t\u00e9 Anonyme Coop\u00e9rative des Artistes Peintres, Sculpteurs, Graveurs'']] (\"Company of Painters, Sculptors, and Engravers\") to exhibit their artworks independently.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|p=209}} Members of the association were expected to forswear participation in the Salon.{{sfnp|Jensen|1994|p=90}} The organizers invited a number of other progressive artists to join them in their inaugural exhibition, including the older [[Eug\u00e8ne Boudin]], whose example had first persuaded Monet to adopt ''plein air'' painting years before.{{sfnp|Denvir|1990|p=32}} Another painter who greatly influenced Monet and his friends, [[Johan Jongkind]], declined to participate, as did \u00c9douard Manet. In total, thirty artists participated in their first exhibition, held in April 1874 at the studio of the photographer [[Nadar (photographer)|Nadar]].\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Graystaks I.JPG|thumb|right|[[Claude Monet]], ''[[Haystacks (Monet)|Haystacks, (sunset)]]'', 1890\u20131891, [[Museum of Fine Arts, Boston]]]]\u003cbr\u003e \u003cbr\u003e@@ -52,20 +52,20 @@\u003cbr\u003e He wrote, in the form of a dialogue between viewers,\u003cbr\u003e \u003cbr\u003e {{Blockquote\u003cbr\u003e-|text=\"Impression\u2014I was certain of it. I was just telling myself that, since I was impressed, there had to be some impression in it ... and what freedom, what ease of workmanship! Wallpaper in its embryonic state is more finished than that seascape.\"\u003cref\u003eRewald (1973), p. 323.\u003c\u002fref\u003e\u003cbr\u003e+|text=\"Impression\u2014I was certain of it. I was just telling myself that, since I was impressed, there had to be some impression in it ... and what freedom, what ease of workmanship! Wallpaper in its embryonic state is more finished than that seascape.\"{{sfnp|Rewald|1973|p=323}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Woman with a Parasol - Madame Monet and Her Son - Google Art Project.jpg|thumb|upright|[[Claude Monet]], ''[[Woman with a Parasol \u2013 Madame Monet and Her Son]]'' (Camille and Jean Monet), 1875, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e The term ''Impressionist'' quickly gained favour with the public. It was also accepted by the artists themselves, even though they were a diverse group in style and temperament, unified primarily by their spirit of independence and rebellion. They exhibited together\u2014albeit with shifting membership\u2014eight times between 1874 and 1886. The Impressionists' style, with its loose, spontaneous brushstrokes, would soon become synonymous with modern life.\u003cref name=\"The Met\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-Monet, Sisley, Morisot, and Pissarro may be considered the \"purest\" Impressionists, in their consistent pursuit of an art of spontaneity, sunlight, and colour. Degas rejected much of this, as he believed in the primacy of drawing over colour and belittled the practice of painting outdoors.\u003cref\u003eGordon; Forge (1988), pp. 11\u201312.\u003c\u002fref\u003e Renoir turned away from Impressionism for a time during the 1880s, and never entirely regained his commitment to its ideas. \u00c9douard Manet, although regarded by the Impressionists as their leader,\u003cref\u003eDistel et al. (1974), p. 127.\u003c\u002fref\u003e never abandoned his liberal use of black as a colour (while Impressionists avoided its use and preferred to obtain darker colours by mixing), and never participated in the Impressionist exhibitions. He continued to submit his works to the Salon, where his painting ''Spanish Singer'' had won a 2nd class medal in 1861, and he urged the others to do likewise, arguing that \"the Salon is the real field of battle\" where a reputation could be made.\u003cref\u003eRichardson (1976), p. 3.\u003c\u002fref\u003e\u003cbr\u003e+Monet, Sisley, Morisot, and Pissarro may be considered the \"purest\" Impressionists, in their consistent pursuit of an art of spontaneity, sunlight, and colour. Degas rejected much of this, as he believed in the primacy of drawing over colour and belittled the practice of painting outdoors.{{sfnp|Gordon|Forge|1988|pp=11\u201312}} Renoir turned away from Impressionism for a time during the 1880s, and never entirely regained his commitment to its ideas. \u00c9douard Manet, although regarded by the Impressionists as their leader,{{sfnp|Distel|Hoog|Moffett|1974|p=127}} never abandoned his liberal use of black as a colour (while Impressionists avoided its use and preferred to obtain darker colours by mixing), and never participated in the Impressionist exhibitions. He continued to submit his works to the Salon, where his painting ''Spanish Singer'' had won a 2nd class medal in 1861, and he urged the others to do likewise, arguing that \"the Salon is the real field of battle\" where a reputation could be made.{{sfnp|Richardson|1976|p=3}}\u003cbr\u003e \u003cbr\u003e [[File:Camille Pissarro - Boulevard Montmartre - Eremitage.jpg|thumb|left|[[Camille Pissarro]], ''Boulevard Montmartre'', 1897, the [[Hermitage Museum|Hermitage]], [[Saint Petersburg]]]]\u003cbr\u003e \u003cbr\u003e-Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.\u003cref\u003eDenvir (1990), p.105.\u003c\u002fref\u003e Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".\u003cref\u003eRewald (1973), p. 603.\u003c\u002fref\u003e In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e-\u003cbr\u003e-The individual artists achieved few financial rewards from the Impressionist exhibitions, but their art gradually won a degree of public acceptance and support. Their dealer, [[Paul Durand-Ruel|Durand-Ruel]], played a major role in this as he kept their work before the public and arranged shows for them in London and New York. Although Sisley died in poverty in 1899, Renoir had a great Salon success in 1879.\u003cref\u003eDistel, Anne, Michel Hoog, and Charles S. Moffett. 1974. [https:\u002f\u002fbooks.google.com\u002fbooks?id=dhc-U0t14vMC&pg=PA190 ''Impressionism; a Centenary Exhibition, the Metropolitan Museum of Art, December 12, 1974 \u2013 February 10, 1975'']. [New York]: [Metropolitan Museum of Art]. p. 190. {{ISBN|0-87099-097-7}}.\u003c\u002fref\u003e Monet became secure financially during the early 1880s and so did Pissarro by the early 1890s. By this time the methods of Impressionist painting, in a diluted form, had become commonplace in Salon art.\u003cref\u003eRewald (1973), p. 475\u2013476.\u003c\u002fref\u003e\u003cbr\u003e+Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.{{sfn|Denvir|1990|p=105}} Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".{{sfnp|Rewald|1973|p=603}} In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e+\u003cbr\u003e+The individual artists achieved few financial rewards from the Impressionist exhibitions, but their art gradually won a degree of public acceptance and support. Their dealer, [[Paul Durand-Ruel|Durand-Ruel]], played a major role in this as he kept their work before the public and arranged shows for them in London and New York. Although Sisley died in poverty in 1899, Renoir had a great Salon success in 1879.{{sfnp|Distel|Hoog|Moffett|1974|p=190}} Monet became secure financially during the early 1880s and so did Pissarro by the early 1890s. By this time the methods of Impressionist painting, in a diluted form, had become commonplace in Salon art.{{sfnp|Rewald|1973|p=475\u2013476}}\u003cbr\u003e \u003cbr\u003e == Impressionist techniques ==\u003cbr\u003e [[File:Cassatt Mary At the Theater 1879.jpg|thumb|upright|[[Mary Cassatt]], ''Lydia Leaning on Her Arms'' (in a theatre box), 1879]]\u003cbr\u003e@@ -83,7 +83,7 @@\u003cbr\u003e * The play of natural light is emphasized. Close attention is paid to the reflection of colours from object to object. Painters often worked in the evening to produce ''[[effets de soir]]''\u2014the shadowy effects of evening or twilight.\u003cbr\u003e * In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. (Blue shadows on snow inspired the technique.)\u003cbr\u003e \u003cbr\u003e-New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.\u003cref\u003eBomford et al. 1990, pp. 39\u201341.\u003c\u002fref\u003e Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e[http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf Renoir and the Impressionist Process] {{webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |date=2011-01-05 }}. ''[[The Phillips Collection]]'', retrieved 21 May 2011\u003c\u002fref\u003e\u003cbr\u003e+New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e[http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf Renoir and the Impressionist Process] {{webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |date=2011-01-05 }}. ''[[The Phillips Collection]]'', retrieved 21 May 2011\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003eWallert, Arie; Hermens, Erma; Peek, Marja (1995). [https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 ''Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995'']. [Marina Del Rey, Calif.]: Getty Conservation Institute. p. 159. {{ISBN|0-89236-322-3}}.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -23,21 +23,21 @@\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.\u003cref\u003eExceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].\u003c\u002fref\u003e The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1'' |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |ISBN=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e+[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1'' |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The public, at first hostile, gradually came to believe that the Impressionists had captured a fresh and original vision, even if the art critics and art establishment disapproved of the new style. By recreating the sensation in the eye that views the subject, rather than delineating the details of the subject, and by creating a welter of techniques and forms, Impressionism is a precursor of various painting styles, including [[Neo-Impressionism]], [[Post-Impressionism]], [[Fauvism]], and [[Cubism]].{{fact|date=November 2023}}\u003cbr\u003e \u003cbr\u003e == Beginnings ==\u003cbr\u003e {{French art history}}\u003cbr\u003e-In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.{{sfnp|Huyghe|1973|pp=13, 16\u201318}} The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003e{{cite book |first1=Nathalia |last1=Brodskaya |title=Impressionism |publisher=Parkstone International |year=2014 |pp=13\u201314}}\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a thick golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |last1=Samu |first1=Margaret |title=Impressionism: Art and Modernity |website=Heilbrunn Timeline of Art History |location=New York |publisher=The Metropolitan Museum of Art |date=October 2004 |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live |quote=Many of the independent artists chose not to apply the thick golden varnish that painters customarily used to tone down their works.}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.{{sfnp|Huyghe|1973|pp=11, 16\u201317}} By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003e{{cite book |last1=Masan\u00e8s |first1=Fabrice |year=2006 |title=Courbet |publisher=Taschen |pp=31\u201333. |ISBN=978-3-8228-5683-3 }}.\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003e{{cite book |last1=White |first1=Harrison C. |first2=Cynthia A. |last2=White |year=1993 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |title=Canvases and Careers: Institutional Change in the French Painting World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |archive-date=12 November 2022 |publisher=University of Chicago Press |page=116 |ISBN=0-226-89487-8 }}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=21\u201327}} By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003e{{cite book |last1=Greenspan |first1=Taube G |chapter=Armand Guillaumin |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e\u003cbr\u003e+In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.{{sfnp|Huyghe|1973|pp=13, 16\u201318}} The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003e{{cite book |first1=Nathalia |last1=Brodskaya |title=Impressionism |publisher=Parkstone International |year=2014 |pages=13\u201314}}\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a thick golden [[varnish]].\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |last1=Samu |first1=Margaret |title=Impressionism: Art and Modernity |website=Heilbrunn Timeline of Art History |location=New York |publisher=The Metropolitan Museum of Art |date=October 2004 |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live |quote=Many of the independent artists chose not to apply the thick golden varnish that painters customarily used to tone down their works.}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.{{sfnp|Huyghe|1973|pp=11, 16\u201317}} By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003e{{cite book |last1=Masan\u00e8s |first1=Fabrice |year=2006 |title=Courbet |publisher=Taschen |pages=31\u201333 |isbn=978-3-8228-5683-3 }}.\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while
