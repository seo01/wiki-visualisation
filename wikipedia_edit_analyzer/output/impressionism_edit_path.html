rtists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003e{{cite book |last1=Greenspan |first1=Taube G |chapter=Armand Guillaumin |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e-During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003e{{cite book |last1=Seiberling |first=Grace |chapter=Impressionism |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.{{sfnp|Denvir|1990|p=133}} The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e+During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003e{{cite book |last1=Seiberling |first1=Grace |chapter=Impressionism |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.{{sfnp|Denvir|1990|p=133}} The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e \u003cbr\u003e After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) was organized. While many viewers came only to laugh, the Salon des Refus\u00e9s drew attention to the existence of a new tendency in art and attracted more visitors than the regular Salon.{{sfnp|Denvir|1990|p=194}}\u003cbr\u003e ","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -23,7 +23,7 @@\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.\u003cref\u003eExceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].\u003c\u002fref\u003e The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1'' |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e+[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The public, at first hostile, gradually came to believe that the Impressionists had captured a fresh and original vision, even if the art critics and art establishment disapproved of the new style. By recreating the sensation in the eye that views the subject, rather than delineating the details of the subject, and by creating a welter of techniques and forms, Impressionism is a precursor of various painting styles, including [[Neo-Impressionism]], [[Post-Impressionism]], [[Fauvism]], and [[Cubism]].{{fact|date=November 2023}}\u003cbr\u003e ","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -83,11 +83,11 @@\u003cbr\u003e * The play of natural light is emphasized. Close attention is paid to the reflection of colours from object to object. Painters often worked in the evening to produce ''[[effets de soir]]''\u2014the shadowy effects of evening or twilight.\u003cbr\u003e * In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. (Blue shadows on snow inspired the technique.)\u003cbr\u003e \u003cbr\u003e-New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e[http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf Renoir and the Impressionist Process] {{webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |date=2011-01-05 }}. ''[[The Phillips Collection]]'', retrieved 21 May 2011\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003eWallert, Arie; Hermens, Erma; Peek, Marja (1995). [https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 ''Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995'']. [Marina Del Rey, Calif.]: Getty Conservation Institute. p. 159. {{ISBN|0-89236-322-3}}.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003eStoner, Joyce Hill; Rushfield, Rebecca Anne (2012). [https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 ''The conservation of easel paintings''. London: Routledge. p. 177] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |date=12 November 2022 }}. {{ISBN|1-136-00041-0}}.\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003eStoner, Joyce Hill; Rushfield, Rebecca Anne (2012). [https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 ''The conservation of easel paintings''. London: Routledge. p. 178] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |date=12 November 2022 }}. {{ISBN|1-136-00041-0}}.\u003c\u002fref\u003e\u003cbr\u003e+New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |url-status=dead |title=Renoir and the Impressionist Process |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |archive-date=2011-01-05 |website=[[The Phillips Collection]] |access-date=21 May 2011}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |ISBN=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=177 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |ISBN=1-136-00041-0}}\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=178 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |archive-date=12 November 2022 |ISBN=1-136-00041-0}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]","--- Revision 69\u003cbr\u003e+++ Revision 70\u003cbr\u003e@@ -85,9 +85,9 @@\u003cbr\u003e \u003cbr\u003e New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |url-status=dead |title=Renoir and the Impressionist Process |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |archive-date=2011-01-05 |website=[[The Phillips Collection]] |access-date=21 May 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |ISBN=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=177 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |ISBN=1-136-00041-0}}\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=178 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |archive-date=12 November 2022 |ISBN=1-136-00041-0}}\u003c\u002fref\u003e\u003cbr\u003e+Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |isbn=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.\u003cref name=\"Hill_177\"\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=177 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003c\u002fref\u003e By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.\u003cref name=\"Hill_177\" \u002f\u003e By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.\u003cref\u003e{{cite book |last1=Stoner |first1=Joyce Hill |last2=Rushfield |first2=Rebecca Anne |year=2012 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 |title=The Conservation of Easel Paintings |location=London |publisher=Routledge |page=178 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131927\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178&dq= |archive-date=12 November 2022 |isbn=978-1-136-00041-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]","--- Revision 70\u003cbr\u003e+++ Revision 71\u003cbr\u003e@@ -92,9 +92,9 @@\u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]\u003cbr\u003e \u003cbr\u003e-The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003ePoulet, A. L., & Murphy, A. R. (1979). ''Corot to Braque: French Paintings from the Museum of Fine Arts, Boston''. Boston: The Museum. p. XV. {{ISBN|0-87846-134-5}}.\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.\u003cref\u003eHuyghe (1973), pp. 54, 77, 121.\u003c\u002fref\u003e  A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003eVarnedoe, Kirk (1987). ''Gustave Caillebotte''. Yale University Press. p. 90. {{ISBN|9780300037227}}.\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003eRubin, James Henry (2008). ''Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh''. Berkeley: University of California Press. p. 128. {{ISBN|9780520248014}}.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |title=Britannica.com J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.\u003cref\u003eRosenblum (1989), p. 228.\u003c\u002fref\u003e Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003eVarnedoe, J. Kirk T. ''The Artifice of Candor: Impressionism and Photography Reconsidered'', Art in America 68, January 1980, pp. 66\u201378\u003c\u002fref\u003e\u003cref\u003eHerbert, Robert L. ''Impressionism: Art, Leisure, and Parisian Society'', Yale University Press, 1988, pp. 311, 319 {{ISBN|0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e+The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003e{{cite book |editor1-last=Poulet |editor1-first=Anne L. |last1=Murphy |first1=Alexandra R. |year=1979 |title=Corot to Braque: French Paintings from the Museum of Fine Arts, Boston |location=Boston |publisher=The Museum of Fine Arts, Boston |page=XV |ISBN=0-87846-134-5}}\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.{{sfnp|Huyghe|1973|pp=54, 77, 121}} A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003e{{cite book |last1=Varnedoe |first1=Kirk |year=1987 |title=Gustave Caillebotte |publisher=Yale University Press |page=90 |ISBN=9780300037227}}\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003e{{cite book |last1=Rubin |first1=James Henry |year=2008 |title=Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh |location=Berkeley |publisher=University of California Press |p=128 |ISBN=9780520248014}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |website=Britannica.com |title=J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.{{sfnp|Rosenblum|1989|p=228}} Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003e{{cite journal |last1=Varnedoe |first1=J. Kirk T. |title=The Artifice of Candor: Impressionism and Photography Reconsidered |journal=Art in America |volume=68 |issue=1 |date=January 1980 |pages=66\u201378}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Herbert |first1=Robert L. |title=Impressionism: Art, Leisure, and Parisian Society  |publisher=Yale University Press |year=1988 |pages=311, 319 |ISBN=0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Berthe Morisot Reading.jpg|thumb|left|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e ","--- Revision 71\u003cbr\u003e+++ Revision 72\u003cbr\u003e@@ -92,9 +92,9 @@\u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]\u003cbr\u003e \u003cbr\u003e-T  L. |last1=Murphy |first1=Alexandra R. |year=1979 |title=Corot to Braque: French Paintings from the Museum of Fine Arts, Boston |location=Boston |publisher=The Museum of Fine Arts, Boston |page=XV |isbn=0-87846-134-5}}\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.{{sfnp|Huyghe|1973|pp=54, 77, 121}} A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003e{{cite book |last1=Varnedoe |first1=Kirk |year=1987 |title=Gustave Caillebotte |publisher=Yale University Press |page=90 |isbn=9780300037227}}\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003e{{cite book |last1=Rubin |first1=James Henry |year=2008 |title=Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh |location=Berkeley |publisher=University of California Press |page=128 |isbn=9780520248014}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |website=Britannica.com |title=J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.{{sfnp|Rosenblum|1989|p=228}} Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003e{{cite journal |last1=Varnedoe |first1=J. Kirk T. |title=The Artifice of Candor: Impressionism and Photography Reconsidered |journal=Art in America |volume=68 |issue=1 |date=January 1980 |pages=66\u201378}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Herbert |first1=Robert L. |title=Impressionism: Art, Leisure, and Parisian Society  |publisher=Yale University Press |year=1988 |pages=311, 319 |isbn=0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Berthe Morisot Reading.jpg|thumb|left|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e ","--- Revision 72\u003cbr\u003e+++ Revision 73\u003cbr\u003e@@ -100,24 +100,24 @@\u003cbr\u003e \u003cbr\u003e The development of Impressionism can be considered partly as a reaction by artists to the challenge presented by photography, which seemed to devalue the artist's skill in reproducing reality. Both portrait and [[Landscape art|landscape]] paintings were deemed somewhat deficient and lacking in truth as photography \"produced lifelike images much more efficiently and reliably\".\u003cref name=\"impressionism757\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-In spite of this, photography actually inspired artists to pursue other means of creative expression, and rather than compete with photography to emulate reality, artists focused \"on the one thing they could inevitably do better than the photograph\u2014by further developing into an art form its very subjectivity in the conception of the image, the very subjectivity that photography eliminated\".\u003cref name=\"impressionism757\" \u002f\u003e The Impressionists sought to express their perceptions of nature, rather than create exact representations. This allowed artists to depict subjectively what they saw with their \"tacit imperatives of taste and conscience\".\u003cref name=\"impressionism758\"\u003eSontag, Susan (1977) On Photography, Penguin, London\u003c\u002fref\u003e Photography encouraged painters to exploit aspects of the painting medium, like colour, which photography then lacked: \"The Impressionists were the first to consciously offer a subjective alternative to the photograph\".\u003cref name=\"impressionism757\"\u003eLevinson, Paul (1997) ''The Soft Edge; a Natural History and Future of the Information Revolution'', Routledge, London and New York\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:Claude Monet - Jardin \u00e0 Sainte-Adresse.jpg|thumb|[[Claude Monet]], ''[[Garden at Sainte-Adresse|Jardin \u00e0 Sainte-Adresse]],'' 1867, [[Metropolitan Museum of Art]], New York.,\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |title=Metropolitan Museum of Art |access-date=11 January 2014 |archive-date=23 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220123074936\u002fhttp:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |url-status=live }}\u003c\u002fref\u003e a work showing the influence of Japanese prints]]\u003cbr\u003e+In spite of this, photography actually inspired artists to pursue other means of creative expression, and rather than compete with photography to emulate reality, artists focused \"on the one thing they could inevitably do better than the photograph\u2014by further developing into an art form its very subjectivity in the conception of the image, the very subjectivity that photography eliminated\".\u003cref name=\"impressionism757\" \u002f\u003e The Impressionists sought to express their perceptions of nature, rather than create exact representations. This allowed artists to depict subjectively what they saw with their \"tacit imperatives of taste and conscience\".\u003cref name=\"impressionism758\"\u003e{{cite book |last1=Sontag |first1=Susan |year=1977 |title=On Photography |publisher=Penguin |location=London}}\u003c\u002fref\u003e Photography encouraged painters to exploit aspects of the painting medium, like colour, which photography then lacked: \"The Impressionists were the first to consciously offer a subjective alternative to the photograph\".\u003cref name=\"impressionism757\"\u003e{{cite book |last1=Levinson |first1=Paul |year=1997 |title=The Soft Edge; a Natural History and Future of the Information Revolution |publisher=Routledge |location=London and New York}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Claude Monet - Jardin \u00e0 Sainte-Adresse.jpg|thumb|[[Claude Monet]], ''[[Garden at Sainte-Adresse|Jardin \u00e0 Sainte-Adresse]],'' 1867, [[Metropolitan Museum of Art]], New York.,\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133 |title=Garden at Sainte-Adresse |website=Metropolitan Museum of Art |access-date=11 January 2014 |archive-date=23 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220123074936\u002fhttp:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |url-status=live }}\u003c\u002fref\u003e a work showing the influence of Japanese prints]]\u003cbr\u003e \u003cbr\u003e Another major influence was Japanese [[ukiyo-e]] art prints ([[Japonism]]). The art of these prints contributed significantly to the \"snapshot\" angles and unconventional compositions that became characteristic of Impressionism. An example is Monet's ''Jardin \u00e0 Sainte-Adresse'', 1867, with its bold blocks of colour and composition on a strong diagonal slant showing the influence of Japanese prints.\u003cref\u003e{{Cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&pg=PA433 |title=Gary Tinterow, Origins of Impressionism, Metropolitan Museum of Art,1994, page 433 |isbn=9780870997174 |access-date=6 November 2015 |archive-date=12 November 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131928\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&pg=PA433&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&hl=en&sa=X&ei=dwnPUtm_GKnNsQTV-4KIDA&ved=0CEIQ6AEwAA#v=onepage&q=Terrasse%20%C3%A0%20Sainte-Adresse%20japanese%20prints&f=false |url-status=live |last1=Tinterow |first1=Gary |last2=Loyrette |first2=Henri |year=1994 |publisher=Metropolitan Museum of Art }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.\u003cref\u003eBaumann; Karabelnik, et al. (1994), p. 112.\u003c\u002fref\u003e His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e+[[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.{{sfnp|Baumann|Karabelnik|1994|p=112}} His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e \u003cbr\u003e == Female Impressionists ==\u003cbr\u003e [[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.\u003cref\u003e{{Cite book|title=Women impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=9|oclc=14368525}}\u003c\u002fref\u003e Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.\u003cref name=\":1\"\u003e{{Cite book|title=Women impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=6|oclc=14368525}}\u003c\u002fref\u003e It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.\u003cref name=\":1\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e[https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot \"Berthe Morisot\"] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |date=6 January 2020 }}, National Museum of Women in the Arts. Retrieved 18 May 2019.\u003c\u002fref\u003e\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=9|oclc=14368525}}\u003c\u002fref\u003e Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.\u003cref name=\":1\"\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=6|oclc=14368525}}\u003c\u002fref\u003e It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.\u003cref name=\":1\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Young Girl at a Window.JPG|thumb|upright|[[Mary Cassatt]], ''Young Girl at a Window,'' 1885, oil on canvas, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=36|oclc=14368525}}\u003c\u002fref\u003e Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e+The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=36|oclc=14368525}}\u003c\u002fref\u003e Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The women Impressionists, like their male counterparts, were striving for \"truth\", for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e \u003cbr\u003e@@ -125,20 +125,20 @@\u003cbr\u003e \u003cbr\u003e Despite their success in their ability to have a career and Impressionism's demise attributed to its allegedly feminine characteristics (its sensuality, dependence on sensation, physicality, and fluidity) the four women artists (and other, lesser-known women Impressionists) were largely omitted from art historical textbooks covering Impressionist artists until Tamar Garb's ''Women Impressionists'' published in 1986.\u003cref\u003e{{Cite book|title=Perspectives on Morisot|last=Adler|first=Kathleen|publisher=Hudson Hills Press|others=Edelstein, T. J., Mount Holyoke College. Art Museum.|year=1990|isbn=1-55595-049-3|edition=1st|location=New York|page=57|oclc=21764484}}\u003c\u002fref\u003e For example, ''Impressionism'' by Jean Leymarie, published in 1955 included no information on any women Impressionists.\u003cbr\u003e \u003cbr\u003e-Painter [[Androniqi Zengo Antoniu]] is co-credited with the introduction of impressionism to Albania.\u003cref\u003e{{Cite book |last1=Keefe |first1=Eugene K. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=CXmB6nDu4_AC&dq=Androniqi+Zengo+Antoniu&pg=PA142 |title=Area Handbook for Albania |last2=Studies |first2=American University (Washington, D. C.) Foreign Area |date=1971 |publisher=U.S. Government Printing Office |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+Painter [[Androniqi Zengo Antoniu]] is co-credited with the introduction of impressionism to Albania.\u003cref\u003e{{Cite book |last1=Keefe |first1=Eugene K. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=CXmB6nDu4_AC&dq=Androniqi+Zengo+Antoniu&pg=PA142 |title=Area Handbook for Albania |author2=American University (Washington, D. C.) Foreign Area Studies |date=1971 |publisher=U.S. Government Printing Office |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Prominent Impressionists ==\u003cbr\u003e-The central figures in the development of Impressionism in France,\u003cref\u003e{{Cite web |url=https:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |title=Exposition du boulevard des Capucines (French) |date=29 April 1874 |access-date=18 October 2018 |archive-date=9 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220109181659\u002fhttps:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |title=''Les expositions impressionnistes'', Larousse (French) |access-date=18 October 2018 |archive-date=2 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170602205003\u002fhttp:\u002f\u002flarousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |url-status=live }}\u003c\u002fref\u003e listed alphabetically, were:\u003cbr\u003e+The central figures in the development of Impressionism in France,\u003cref\u003e{{Cite web |url=https:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |title=Exposition du boulevard des Capucines |lang=French |date=29 April 1874 |access-date=18 October 2018 |archive-date=9 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220109181659\u002fhttps:\u002f\u002fgallica.bnf.fr\u002fark:\u002f12148\u002fbpt6k733402z\u002ff3.item.zoom |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |title=''Les expositions impressionnistes'', Larousse |lang=French |access-date=18 October 2018 |archive-date=2 June 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170602205003\u002fhttp:\u002f\u002flarousse.fr\u002fencyclopedie\u002fdivers\u002fles_expositions_impressionnistes\u002f187080#10938875 |url-status=live }}\u003c\u002fref\u003e listed alphabetically, were:\u003cbr\u003e * [[Fr\u00e9d\u00e9ric Bazille]] (1841\u20131870), who only posthumously participated in the Impressionist exhibitions\u003cbr\u003e * [[Gustave Caillebotte]] (1848\u20131894), who, younger than the others, joined forces with them in the mid-1870s\u003cbr\u003e * [[Mary Cassatt]] (1844\u20131926), American-born, she lived in Paris and participated in four Impressionist exhibitions\u003cbr\u003e * [[Paul C\u00e9zanne]] (1839\u20131906), although he later broke away from the Impressionists\u003cbr\u003e * [[Edgar Degas]] (1834\u20131917), who despised the term ''Impressionist''\u003cbr\u003e * [[Armand Guillaumin]] (1841\u20131927)\u003cbr\u003e-* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003eCole, Bruce (1991). ''Art of the Western World: From Ancient Greece to Post Modernism''. Simon and Schuster. p. 242. {{ISBN|0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e-* [[Claude Monet]] (1840\u20131926), the most prolific of the Impressionists and the one who embodies their aesthetic most obviously\u003cref\u003eDenvir (1990), p.140.\u003c\u002fref\u003e\u003cbr\u003e+* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003e{{cite book |last1=Cole |first1=Bruce |year=1991 |title=Art of the Western World: From Ancient Greece to Post Modernism |publisher=Simon and Schuster |page=242 |ISBN=0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e+* [[Claude Monet]] (1840\u20131926), the most prolific of the Impressionists and the one who embodies their aesthetic most obviously{{sfnp|Denvir|1990|p=140}}\u003cbr\u003e * [[Berthe Morisot]] (1841\u20131895) who participated in all Impressionist exhibitions except in 1879\u003cbr\u003e-* [[Camille Pissarro]] (1830\u20131903), who was the only artist to participate in all eight Impressionist exhibitions.\u003cref\u003eRewald (1973), p. 591.\u003c\u002fref\u003e\u003cbr\u003e+* [[Camille Pissarro]] (1830\u20131903), who was the only artist to participate in all eight Impressionist exhibitions.{{sfnp|Rewald|1973|p=591}}\u003cbr\u003e * [[Pierre-Auguste Renoir]] (1841\u20131919), who participated in Impressionist exhibitions in 1874, 1876, 1877 and 1882\u003cbr\u003e * [[Alfred Sisley]] (1839\u20131899)\u003cbr\u003e \u003cbr\u003e@@ -247,9 +247,9 @@\u003cbr\u003e \u003cbr\u003e Among the close associates of the Impressionists, [[Victor Vignon]] is the only artist outside the group of prominent names who participated to the most exclusive Seventh Paris Impressionist Exhibition in 1882, which was indeed a rejection to the previous less restricted exhibitions chiefly organized by Degas. Originally from the school of [[Corot]], Vignon was a friend of [[Camille Pissarro]], whose influence is evident in his impressionist style after the late 1870s, and a friend of post-impressionist [[Vincent van Gogh]].\u003cbr\u003e \u003cbr\u003e-There were several other close associates of the Impressionists who adopted their methods to some degree. These include [[Jean-Louis Forain]] (who participated in Impressionist exhibitions in 1879, 1880, 1881 and 1886)\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|title=Joconde : catalogue collectif des collections des mus\u00e9es de France|website=www.culture.gouv.fr|access-date=2017-12-28|archive-date=28 December 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171228172700\u002fhttp:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|url-status=live}}\u003c\u002fref\u003e and [[Giuseppe De Nittis]], an Italian artist living in Paris who participated in the first Impressionist exhibit at the invitation of Degas, although the other Impressionists disparaged his work.\u003cref\u003eDenvir (1990), p.152.\u003c\u002fref\u003e [[Federico Zandomeneghi]] was another Italian friend of Degas who showed with the Impressionists. [[Eva Gonzal\u00e8s]] was a follower of Manet who did not exhibit with the group. [[James Abbott McNeill Whistler]] was an American-born painter who played a part in Impressionism although he did not join the group and preferred grayed colours. [[Walter Sickert]], an English artist, was initially a follower of Whistler, and later an important disciple of Degas; he did not exhibit with the Impressionists. In 1904 the artist and writer [[Wynford Dewhurst]] wrote the first important study of the French painters published in English, ''Impressionist Painting: its genesis and development'', which did much to popularize Impressionism in Great Britain.\u003cbr\u003e-\u003cbr\u003e-By the early 1880s, Impressionist methods were affecting, at least superficially, the art of the Salon. Fashionable painters such as [[Jean B\u00e9raud]] and [[Henri Gervex]] found critical and financial success by brightening their palettes while retaining the smooth finish expected of Salon art.\u003cref\u003eRewald (1973), p.476\u2013477.\u003c\u002fref\u003e Works by these artists are sometimes casually referred to as Impressionism, despite their remoteness from Impressionist practice.\u003cbr\u003e+There were several other close associates of the Impressionists who adopted their methods to some degree. These include [[Jean-Louis Forain]] (who participated in Impressionist exhibitions in 1879, 1880, 1881 and 1886)\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|title=Joconde : catalogue collectif des collections des mus\u00e9es de France|website=www.culture.gouv.fr|access-date=2017-12-28|archive-date=28 December 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171228172700\u002fhttp:\u002f\u002fwww.culture.gouv.fr\u002fdocumentation\u002fjoconde\u002ffr\u002fdecouvrir\u002fexpositions\u002fimpressionnisme\u002ftheme_imprart.htm|url-status=dead|lang=French}}\u003c\u002fref\u003e and [[Giuseppe De Nittis]], an Italian artist living in Paris who participated in the first Impressionist exhibit at the invitation of Degas, although the other Impressionists disparaged his work.{{sfnp|Denvir|1990|p=152}} [[Federico Zandomeneghi]] was another Italian friend of Degas who showed with the Impressionists. [[Eva Gonzal\u00e8s]] was a follower of Manet who did not exhibit with the group. [[James Abbott McNeill Whistler]] was an American-born painter who played a part in Impressionism although he did not join the group and preferred grayed colours. [[Walter Sickert]], an English artist, was initially a follower of Whistler, and later an important disciple of Degas; he did not exhibit with the Impressionists. In 1904 the artist and writer [[Wynford Dewhurst]] wrote the first important study of the French painters published in English, ''Impressionist Painting: its genesis and development'', which did much to popularize Impressionism in Great Britain.\u003cbr\u003e+\u003cbr\u003e+By the early 1880s, Impressionist methods were affecting, at least superficially, the art of the Salon. Fashionable painters such as [[Jean B\u00e9raud]] and [[Henri Gervex]] found critical and financial success by brightening their palettes while retaining the smooth finish expected of Salon art.{{sfnp|Rewald|1973|pp=476\u2013477}} Works by these artists are sometimes casually referred to as Impressionism, despite their remoteness from Impressionist practice.\u003cbr\u003e \u003cbr\u003e The influence of the French Impressionists lasted long after most of them had died. Artists like [[Jesekiel David Kirszenbaum|J.D. Kirszenbaum]] were borrowing Impressionist techniques throughout the twentieth century.\u003cbr\u003e \u003cbr\u003e@@ -299,7 +299,7 @@\u003cbr\u003e \u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e-While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art : Distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate process]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 73\u003cbr\u003e+++ Revision 74\u003cbr\u003e@@ -293,13 +293,13 @@\u003cbr\u003e \u003cbr\u003e [[File:Bailarina Degas Washington.jpg|upright=0.5|thumb|right|Edgar Degas's ''Little Dancer of Fourteen Years'' at the [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-While Edgar Degas was primarily known as a painter in his lifetime, he began to pursue the medium of sculpture later in his artistic career in the 1880s. He created as many as 150 sculptures during his lifetime. Degas preferred the medium of wax for his sculptures because it allowed him to make changes, start over, and further explore the modelling process.\u003cref\u003e{{cite journal |last1=Locheed |first1=Jessica |title=Beyond the form: the ineffable essence of Degas' sculpture |journal=Sculpture Journal |date=June 2009 |volume=18 |issue=1 |pages=86\u201399 |doi=10.3828\u002fsj.18.1.7 |url=https:\u002f\u002fwww.liverpooluniversitypress.co.uk\u002fdoi\u002f10.3828\u002fsj.18.1.7 |access-date=18 March 2024 |language=en |issn=1366-2724}}\u003c\u002fref\u003e Only one of Degas's sculptures, ''[[Little Dancer of Fourteen Years]]'', was exhibited in his lifetime, which was exhibited at the Sixth Impressionist Exhibition in 1881. ''Little Dancer'' proved to be controversial with critics. Some considered Degas to have overthrown sculptural traditions in the same way that Impressionism had overthrown the traditions of painting. Others found it to be ugly. \u003cref\u003e{{cite journal |last1=Barbour |first1=Daphne |title=Degas's Little Dancer: Not Just a Study in the Nude |journal=Art Journal |date=1995 |volume=54 |issue=2 |pages=28\u201332 |doi=10.2307\u002f777459 |jstor=777459 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |access-date=18 March 2024 |issn=0004-3249}}\u003c\u002fref\u003e Following the Degas's death in 1917, his heirs authorized bronze castings from 73 of the artist's sculptures.\u003cref\u003e{{cite journal |last1=Kendall |first1=Richard |title=Degas's sculpture in the twenty-first century |journal=The Burlington Magazine |date=2012 |volume=154 |issue=1309 |pages=268\u2013271 |jstor=23232564 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |access-date=18 March 2024 |issn=0007-6287}}\u003c\u002fref\u003e\u003cbr\u003e+While Edgar Degas was primarily known as a painter in his lifetime, he began to pursue the medium of sculpture later in his artistic career in the 1880s. He created as many as 150 sculptures during his lifetime. Degas preferred the medium of wax for his sculptures because it allowed him to make changes, start over, and further explore the modelling process.\u003cref\u003e{{cite journal |last1=Locheed |first1=Jessica |title=Beyond the form: the ineffable essence of Degas' sculpture |journal=Sculpture Journal |date=June 2009 |volume=18 |issue=1 |pages=86\u201399 |doi=10.3828\u002fsj.18.1.7 |url=https:\u002f\u002fwww.liverpooluniversitypress.co.uk\u002fdoi\u002f10.3828\u002fsj.18.1.7 |access-date=18 March 2024 |language=en |issn=1366-2724}}\u003c\u002fref\u003e Only one of Degas's sculptures, ''[[Little Dancer of Fourteen Years]]'', was exhibited in his lifetime, which was exhibited at the Sixth Impressionist Exhibition in 1881. ''Little Dancer'' proved to be controversial with critics. Some considered Degas to have overthrown sculptural traditions in the same way that Impressionism had overthrown the traditions of painting. Others found it to be ugly. \u003cref\u003e{{cite journal |last1=Barbour |first1=Daphne |title=Degas's Little Dancer: Not Just a Study in the Nude |journal=Art Journal |date=1995 |volume=54 |issue=2 |pages=28\u201332 |doi=10.2307\u002f777459 |jstor=777459 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |access-date=18 March 2024 |issn=0004-3249 |archive-date=18 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240318144700\u002fhttps:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |url-status=live }}\u003c\u002fref\u003e Following the Degas's death in 1917, his heirs authorized bronze castings from 73 of the artist's sculptures.\u003cref\u003e{{cite journal |last1=Kendall |first1=Richard |title=Degas's sculpture in the twenty-first century |journal=The Burlington Magazine |date=2012 |volume=154 |issue=1309 |pages=268\u2013271 |jstor=23232564 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |access-date=18 March 2024 |issn=0007-6287 |archive-date=18 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240318144700\u002fhttps:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e-While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024 |archive-date=21 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240321030851\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate process]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 74\u003cbr\u003e+++ Revision 75\u003cbr\u003e@@ -104,7 +104,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Claude Monet - Jardin \u00e0 Sainte-Adresse.jpg|thumb|[[Claude Monet]], ''[[Garden at Sainte-Adresse|Jardin \u00e0 Sainte-Adresse]],'' 1867, [[Metropolitan Museum of Art]], New York.,\u003cref\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133 |title=Garden at Sainte-Adresse |website=Metropolitan Museum of Art |access-date=11 January 2014 |archive-date=23 January 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220123074936\u002fhttp:\u002f\u002fwww.metmuseum.org\u002fCollections\u002fsearch-the-collections\u002f437133?rpp=20&pg=1&ao=on&ft=Claude+Monet&pos=1 |url-status=live }}\u003c\u002fref\u003e a work showing the influence of Japanese prints]]\u003cbr\u003e \u003cbr\u003e-Another major influence was Japanese [[ukiyo-e]] art prints ([[Japonism]]). The art of these prints contributed significantly to the \"snapshot\" angles and unconventional compositions that became characteristic of Impressionism. An example is Monet's ''Jardin \u00e0 Sainte-Adresse'', 1867, with its bold blocks of colour and composition on a strong diagonal slant showing the influence of Japanese prints.\u003cref\u003e{{Cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=kLEpf5a49V0C&dq=Terrasse+%C3%A0+Sainte-Adresse+japanese+prints&pg=PA433 |title=
