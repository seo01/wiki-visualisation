        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="4e601b41-1fb0-4d3e-88fe-2ef0b09757d4" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("4e601b41-1fb0-4d3e-88fe-2ef0b09757d4")) {                    Plotly.newPlot(                        "4e601b41-1fb0-4d3e-88fe-2ef0b09757d4",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -111,7 +111,7 @@\u003cbr\u003e == Female Impressionists ==\u003cbr\u003e [[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}}Until the late 19th century in Europe, women were prohibited from entering public schools. So during that period, female artists were more focused on depicting small categories of objects, such as still life and portrait painting. \u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12}}\u003c\u002fref\u003eFemale Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists. They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists.\u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12}}\u003c\u002fref\u003e They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e \u003cbr\u003e Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -297,7 +297,7 @@\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Many Impressionist sculptors create based on animals in order to break away from old world concepts and original academic images. They endow birds and beasts with new spiritual characteristics, known as carriers of mobile spiritual matter.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965}}\u003c\u002fref\u003e\u003cbr\u003e+Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Photography and film ===\u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -314,9 +314,9 @@\u003cbr\u003e \u003cbr\u003e Musical Impressionism is the name given to a movement in [[European classical music]] that arose in the late 19th century and continued into the middle of the 20th century. Originating in France, musical Impressionism is characterized by suggestion and atmosphere, and eschews the emotional excesses of the Romantic era. Impressionist composers favoured short forms such as the [[nocturne]], [[Arabesque (classical music)|arabesque]], and [[Prelude (music)|prelude]], and often explored uncommon scales such as the [[whole tone scale]]. Perhaps the most notable innovations of Impressionist composers were the introduction of major 7th chords and the extension of chord structures in 3rds to five- and six-part harmonies.\u003cbr\u003e \u003cbr\u003e+The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. [[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e+\u003cbr\u003e American Impressionist music differs from European Impressionist music, and these differences are mainly reflected in Charles Griffith's poetry of flute and orchestral music. He is also the most prolific Impressionist composer in the United States.\u003cref\u003e{{Cite journal |last=Haefliger |first=Kathleen |last2=Griffes |first2=Charles Tomlinson |date=1986 |title=Piano Music of Charles Tomlinson Griffes |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002f3052237 |journal=American Music |volume=4 |issue=4 |pages=481 |doi=10.2307\u002f3052237 |issn=0734-4392}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. [[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e \u003cbr\u003e === Literature ===\u003cbr\u003e {{Main|Impressionism (literature)}}","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -111,7 +111,7 @@\u003cbr\u003e == Female Impressionists ==\u003cbr\u003e [[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], e 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -297,7 +297,7 @@\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965}}\u003c\u002fref\u003e\u003cbr\u003e+Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965|doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Photography and film ===\u003cbr\u003e ","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -218,6 +218,7 @@\u003cbr\u003e File:Berthe Morisot, Le berceau (The Cradle), 1872.jpg|[[Berthe Morisot]], ''[[The Cradle (Morisot)|The Cradle]]'', 1872, [[Mus\u00e9e d'Orsay]]\u003cbr\u003e File:Guillaumin SoleilCouchantAIvry.jpg|[[Armand Guillaumin]], ''Sunset at Ivry (Soleil couchant \u00e0 Ivry)'', 1873, [[Mus\u00e9e d'Orsay]]\u003cbr\u003e File:Edouard Manet Boating.jpg|[[\u00c9douard Manet]], ''Boating'', 1874, [[Metropolitan Museum of Art]]\u003cbr\u003e+File:Premi\u00e8re Exposition 1874, 35 Boulevard des Capucines Catalogue.jpg|Catalogue cover from the [[First Impressionist Exhibition]], 1874\u003cbr\u003e File:Sisley la seine au point du jour 1877.jpg|[[Alfred Sisley]], ''La Seine au Point du jour'', 1877, [[Museum of modern art Andr\u00e9 Malraux - MuMa]], [[Le Havre]]\u003cbr\u003e File:Edouard Manet 039.jpg|[[\u00c9douard Manet]], ''[[The Plum]]'', 1878, [[National Gallery of Art]], Washington, D.C.\u003cbr\u003e File:La Falaise \u00e0 F\u00e9camp - Claude Monet - ABDAG003046.jpg|alt=Landscape painting depicting the cliffs of Normandy by Claude Monet|[[Claude Monet]], ''La Falaise \u00e0 F\u00e9camp'', 1881, [[Aberdeen Art Gallery]]","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -87,7 +87,7 @@\u003cbr\u003e \u003cbr\u003e Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |isbn=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}9\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -87,7 +87,7 @@\u003cbr\u003e \u003cbr\u003e Many vivid synthetic pigments became commercially available to artists for the first time during the 19th century. These included [[cobalt blue]], [[viridian]], [[cadmium yellow]], and synthetic [[ultramarine blue]], all of which were in use by the 1840s, before Impressionism.\u003cref name=\"Wallert_159\" \u002f\u003e The Impressionists' manner of painting made bold use of these pigments, and of even newer colours such as [[cerulean blue]],\u003cref name=\"The Met\" \u002f\u003e which became commercially available to artists in the 1860s.\u003cref name=\"Wallert_159\"\u003e{{cite book |last1=Wallert |first1=Arie |last2=Hermens |first2=Erma |last3=Peek |first3=Marja |year=1995 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=pdFOAgAAQBAJ&pg=PA159 |title=Historical painting techniques, materials, and studio practise: preprints of a symposium, University of Leiden, Netherlands, 26\u201329 June 1995 |location=Marina Del Rey, Calif |publisher=Getty Conservation Institute |page=159 |isbn=0-89236-322-3}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}9\u003cbr\u003e+The Impressionists' progress toward a brighter style of painting was gradual. During the 1860s, Monet and Renoir sometimes painted on canvases prepared with the traditional red-brown or grey ground.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1870s, Monet, Renoir, and Pissarro usually chose to paint on grounds of a lighter grey or beige colour, which functioned as a middle tone in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA177 177]}} By the 1880s, some of the Impressionists had come to prefer white or slightly off-white grounds, and no longer allowed the ground colour a significant role in the finished painting.{{sfnp|Stoner|Rushfield|2012|p=[https:\u002f\u002fbooks.google.com\u002fbooks?id=1msM3h9mbaoC&pg=PA178 178]}}\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -16,14 +16,14 @@\u003cbr\u003e \u003cbr\u003e '''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during the 1870s and 1880s.\u003cbr\u003e \u003cbr\u003e-The Impressionists faced harsh opposition from the conventional art community in [[France]]. The name of the style derives from the title of a [[Claude Monet]] work, ''Impression, soleil levant'' (''[[Impression, Sunrise]]''), which provoked the critic [[Louis Leroy]] to coin the term in a [[Satire|satirical]] 1874 review of the [[First Impressionist Exhibition]] published in the Parisian newspaper ''[[Le Charivari]]''.\u003cref\u003eThe term \"impression\" indicates the direct impact of surface markers on spiritual perception or experiential cognition.{{Citation |last=Eisenman |first=Stephen F. |title=The Intransigent Artist or How the Impressionists Got Their Name |date=2023-12-22 |work=Critical Readings in Impressionism and Post-Impressionism |pages=149\u2013161 |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002fjj.8501295.10 |access-date=2024-06-14 |publisher=University of California Press |isbn=978-0-520-94044-4}}\u003c\u002fref\u003e The development of Impressionism in the visual arts was soon followed by analogous styles in other media that became known as [[Impressionist music]] and [[Impressionism (literature)|Impressionist literature]].\u003cbr\u003e+The Impressionists faced harsh opposition from the conventional art community in [[France]]. The name of the style derives from the title of a [[Claude Monet]] work, ''Impression, soleil levant'' (''[[Impression, Sunrise]]''), which provoked the critic [[Louis Leroy]] to coin the term in a [[Satire|satirical]] 1874 review of the [[First Impressionist Exhibition]] published in the Parisian newspaper ''[[Le Charivari]]''.\u003cref\u003eThe term \"impression\" indicates the direct impact of surface markers on spiritual perception or experiential cognition.{{Citation |last=Eisenman |first=Stephen F. |title=The Intransigent Artist or How the Impressionists Got Their Name |date=2023-12-22 |work=Critical Readings in Impressionism and Post-Impressionism |pages=149\u2013161 |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002fjj.8501295.10 |access-date=2024-06-14 |publisher=University of California Press |doi=10.2307\u002fjj.8501295.10 |isbn=978-0-520-94044-4}}\u003c\u002fref\u003e The development of Impressionism in the visual arts was soon followed by analogous styles in other media that became known as [[Impressionist music]] and [[Impressionism (literature)|Impressionist literature]].\u003cbr\u003e \u003cbr\u003e == Overview ==\u003cbr\u003e [[File:The Fighting Temeraire, JMW Turner, National Gallery.jpg|thumb|left|[[J. M. W. Turner]]'s atmospheric work was influential on the birth of Impressionism, here ''[[The Fighting Temeraire]]'' (1839)]]\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.{{efn|Exceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].}} The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e In 1876, the poet and critic [[St\u00e9phane Mallarm\u00e9]] said of the new style: \"The represented subject, being composed of a harmony of reflected and ever-changing lights, cannot be supposed always to look the same but palpitates with movement, light, and life\".\u003cref\u003e{{Cite book |last=Hook |first=Philip |url=https:\u002f\u002fbooks.google.com\u002fbooks?hl=zh-CN&lr=&id=h-vq5phx00AC&oi=fnd&pg=PT5&ots=xLadaoJmnm&sig=MH2nG-T-yHMWlOSJoEGAjnT38vg |title=The Ultimate Trophy: How The Impressionist Painting Conquered The World |date=2012-12-17 |publisher=Prestel Verlag |isbn=978-3-641-08955-9 |language=de}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Pierre-Auguste Renoir, Le Moulin de la Galette.jpg|thumb|right|[[Pierre-Auguste Renoir]], ''Dance at Le Moulin de la Galette ([[Bal du moulin de la Galette]])'', 1876, [[Mus\u00e9e d'Orsay]], one of Impressionism's most celebrated masterpieces.\u003cref\u003e{{cite book |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=AXdOAAAAYAAJ |editor1-first=Ingo F. |editor1-last=Walther |title=Masterpieces of Western Art: A History of Art in 900 Individual Studies from the Gothic to the Present Day, Part 1 |edition=Centralibros Hispania Edicion y Distribucion, S.A. |date=1999 |publisher=Taschen |isbn=3-8228-7031-5 }}\u003c\u002fref\u003e]]Impressionism emerged in France at the same time that a number of other painters, including the Italian artists known as the [[Macchiaioli]], and [[Winslow Homer]] in the United States, were also exploring ''[[En plein air|plein-air]]'' painting. The Impressionists, however, developed new techniques specific to the style. Encompassing what its adherents argued was a different way of seeing, it is an art of immediacy and movement, of candid poses and compositions, of the play of light expressed in a bright and varied use of colour.\u003cref name=\"Seiberling\" \u002f\u003e In 1876, the poet and critic [[St\u00e9phane Mallarm\u00e9]] said of the new style: \"The represented subject, being composed of a harmony of reflected and ever-changing lights, cannot be supposed always to look the same but palpitates with movement, light, and life\".\u003cref\u003e{{Cite book |last=Hook |first=Philip |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=h-vq5phx00AC&pg=PT5 |title=The Ultimate Trophy: How The Impressionist Painting Conquered The World |date=2012-12-17 |publisher=Prestel Verlag |isbn=978-3-641-08955-9 |language=de}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The public, at first hostile, gradually came to believe that the Impressionists had captured a fresh and original vision, even if the art critics and art establishment disapproved of the new style. By recreating the sensation in the eye that views the subject, rather than delineating the details of the subject, and by creating a welter of techniques and forms, Impressionism is a precursor of various painting styles, including [[Neo-Impressionism]], [[Post-Impressionism]], [[Fauvism]], and [[Cubism]].{{fact|date=November 2023}}\u003cbr\u003e \u003cbr\u003e@@ -135,7 +135,7 @@\u003cbr\u003e * [[Paul C\u00e9zanne]] (1839\u20131906), although he later broke away from the Impressionists\u003cbr\u003e * [[Edgar Degas]] (1834\u20131917), who despised the term ''Impressionist''\u003cbr\u003e * [[Armand Guillaumin]] (1841\u20131927)\u003cbr\u003e-* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003e{{cite book |last1=Cole |first1=Bruce |year=1991 |title=Art of the Western World: From Ancient Greece to Post Modernism |publisher=Simon and Schuster |page=242 |ISBN=0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e+* [[\u00c9douard Manet]] (1832\u20131883), who did not participate in any of the Impressionist exhibitions\u003cref\u003e{{cite book |last1=Cole |first1=Bruce |year=1991 |title=Art of the Western World: From Ancient Greece to Post Modernism |publisher=Simon and Schuster |page=242 |isbn=0-671-74728-2}}\u003c\u002fref\u003e\u003cbr\u003e * [[Claude Monet]] (1840\u20131926), the most prolific of the Impressionists and the one who embodies their aesthetic most obviously{{sfnp|Denvir|1990|p=140}}\u003cbr\u003e * [[Berthe Morisot]] (1841\u20131895) who participated in all Impressionist exhibitions except in 1879\u003cbr\u003e * [[Camille Pissarro]] (1830\u20131903), who was the only artist to participate in all eight Impressionist exhibitions.{{sfnp|Rewald|1973|p=591}}\u003cbr\u003e@@ -298,7 +298,7 @@\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |url=http:\u002f\u002fdx.doi.org\u002f10.36340\u002f2071-6818-2019-15-4-82-107 |journal=Scientific and analytical journal Burganov House. The space of culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |issn=2618-7965|doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e+Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |journal=Scientific and Analytical Journal Burganov House. The Space of Culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |doi-broken-date=15 July 2024 |issn=2618-7965|doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e@@ -317,7 +317,7 @@\u003cbr\u003e \u003cbr\u003e The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. [[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e \u003cbr\u003e-American Impressionist music differs from European Impressionist music, and these differences are mainly reflected in Charles Griffith's poetry of flute and orchestral music. He is also the most prolific Impressionist composer in the United States.\u003cref\u003e{{Cite journal |last=Haefliger |first=Kathleen |last2=Griffes |first2=Charles Tomlinson |date=1986 |title=Piano Music of Charles Tomlinson Griffes |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002f3052237 |journal=American Music |volume=4 |issue=4 |pages=481 |doi=10.2307\u002f3052237 |issn=0734-4392}}\u003c\u002fref\u003e\u003cbr\u003e+American Impressionist music differs from European Impressionist music, and these differences are mainly reflected in Charles Griffith's poetry of flute and orchestral music. He is also the most prolific Impressionist composer in the United States.\u003cref\u003e{{Cite journal |last1=Haefliger |first1=Kathleen |last2=Griffes |first2=Charles Tomlinson |date=1986 |title=Piano Music of Charles Tomlinson Griffes |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002f3052237 |journal=American Music |volume=4 |issue=4 |pages=481 |doi=10.2307\u002f3052237 |jstor=3052237 |issn=0734-4392}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Literature ===\u003cbr\u003e {{Main|Impressionism (literature)}}\u003cbr\u003e@@ -328,7 +328,7 @@\u003cbr\u003e \u003cbr\u003e == Post-Impressionism ==\u003cbr\u003e {{Main|Post-Impressionism}}\u003cbr\u003e-During the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Post-Impressionist artists reacted against the Impressionists' concern with realistically reproducing the optical sensations of light and colour; they turned instead toward symbolic content and the expression of emotion.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online}}\u003c\u002fref\u003e Post-Impressionism prefigured the characteristics of [[Futurism]] and [[Cubism]], reflecting the change of attitude towards art in European society.\u003cref\u003e{{Cite book |url=https:\u002f\u002fwww.taylorfrancis.com\u002fbooks\u002fmono\u002f10.4324\u002f9781032699707\u002fpost-impressionists-england-barrie-bullen |title=Post-Impressionists in England: The Critical Reception |date=2024-03-08 |publisher=Routledge |isbn=978-1-032-69970-7 |editor-last=Bullen |editor-first=Barrie |location=London |doi=10.4324\u002f9781032699707}}\u003c\u002fref\u003e Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e+During the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Post-Impressionist artists reacted against the Impressionists' concern with realistically reproducing the optical sensations of light and colour; they turned instead toward symbolic content and the expression of emotion.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online|doi=10.1093\u002fgao\u002f9781884446054.article.t068996 }}\u003c\u002fref\u003e Post-Impressionism prefigured the characteristics of [[Futurism]] and [[Cubism]], reflecting the change of attitude towards art in European society.\u003cref\u003e{{Cite book |url=https:\u002f\u002fwww.taylorfrancis.com\u002fbooks\u002fmono\u002f10.4324\u002f9781032699707\u002fpost-impressionists-england-barrie-bullen |title=Post-Impressionists in England: The Critical Reception |date=2024-03-08 |publisher=Routledge |isbn=978-1-032-69970-7 |editor-last=Bullen |editor-first=Barrie |location=London |doi=10.4324\u002f9781032699707}}\u003c\u002fref\u003e Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e \u003cbr\u003e \u003cgallery widths=\"160px\" heights=\"160px\" perrow=\"4\"\u003e\u003cbr\u003e File:A Sunday on La Grande Jatte, Georges Seurat, 1884.png|[[Georges Seurat]], ''[[A Sunday Afternoon on the Island of La Grande Jatte]]'', 1884\u20131886, [[The Art Institute of Chicago]]","--- Revision 8\u003cbr\u003e+++ Revision 9\u003cbr\u003e@@ -274,7 +274,7 @@\u003cbr\u003e * [[Francisco Oller|Francisco Oller y Cestero]], a native of [[Puerto Rico]] and a friend of Pissarro and C\u00e9zanne\u003cbr\u003e * [[James Nairn]] in New Zealand\u003cbr\u003e * [[William McTaggart]] in Scotland\u003cbr\u003e-* [[Laura Muntz Lyall]], a Canadian artist\u003cbr\u003e+* [[Laura Muntz Lyall]] and [[Helen McNicoll]] Canadian artists\u003cbr\u003e * [[W\u0142adys\u0142aw Podkowi\u0144ski]], a Polish Impressionist and [[Symbolism (arts)|symbolist]]\u003cbr\u003e * [[Nicolae Grigorescu]] in Romania\u003cbr\u003e * [[Nazmi Ziya G\u00fcran]], who brought Impressionism to [[Turkey]]","--- Revision 9\u003cbr\u003e+++ Revision 10\u003cbr\u003e@@ -274,7 +274,7 @@\u003cbr\u003e * [[Francisco Oller|Francisco Oller y Cestero]], a native of [[Puerto Rico]] and a friend of Pissarro and C\u00e9zanne\u003cbr\u003e * [[James Nairn]] in New Zealand\u003cbr\u003e * [[William McTaggart]] in Scotland\u003cbr\u003e-* [[Laura Muntz Lyall]] and [[Helen McNicoll]] Canadian artists\u003cbr\u003e+* [[Laura Muntz Lyall]] and [[Helen McNicoll]], Canadian artists\u003cbr\u003e * [[W\u0142adys\u0142aw Podkowi\u0144ski]], a Polish Impressionist and [[Symbolism (arts)|symbolist]]\u003cbr\u003e * [[Nicolae Grigorescu]] in Romania\u003cbr\u003e * [[Nazmi Ziya G\u00fcran]], who brought Impressionism to [[Turkey]]","--- Revision 10\u003cbr\u003e+++ Revision 11\u003cbr\u003e@@ -14,12 +14,12 @@\u003cbr\u003e | influenced    = {{unbulleted list|[[Post-Impressionism]]|[[Neo-Impressionism]]|[[Expressionism]]}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities (often accentuating the effects of the passage of time), ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during the 1870s and 1880s.\u003cbr\u003e+'''Impressionism''' was a 19th-century [[art movement]] characterized by relatively small, thin, yet visible brush strokes, open [[Composition (visual arts)|composition]], emphasis on accurate depiction of light in its changing qualities, often accentuating the effects of the passage of time, ordinary subject matter, unusual visual angles, and inclusion of movement as a crucial element of human perception and experience. Impressionism originated with a group of [[Paris]]-based artists whose independent exhibitions brought them to prominence during the 1870s and 1880s.\u003cbr\u003e \u003cbr\u003e The Impressionists faced harsh opposition from the conventional art community in [[France]]. The name of the style derives from the title of a [[Claude Monet]] work, ''Impression, soleil levant'' (''[[Impression, Sunrise]]''), which provoked the critic [[Louis Leroy]] to coin the term in a [[Satire|satirical]] 1874 review of the [[First Impressionist Exhibition]] published in the Parisian newspaper ''[[Le Charivari]]''.\u003cref\u003eThe term \"impression\" indicates the direct impact of surface markers on spiritual perception or experiential cognition.{{Citation |last=Eisenman |first=Stephen F. |title=The Intransigent Artist or How the Impressionists Got Their Name |date=2023-12-22 |work=Critical Readings in Impressionism and Post-Impressionism |pages=149\u2013161 |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002fjj.8501295.10 |access-date=2024-06-14 |publisher=University of California Press |doi=10.2307\u002fjj.8501295.10 |isbn=978-0-520-94044-4}}\u003c\u002fref\u003e The development of Impressionism in the visual arts was soon followed by analogous styles in other media that became known as [[Impressionist music]] and [[Impressionism (literature)|Impressionist literature]].\u003cbr\u003e \u003cbr\u003e == Overview ==\u003cbr\u003e-[[File:The Fighting Temeraire, JMW Turner, National Gallery.jpg|thumb|left|[[J. M. W. Turner]]'s atmospheric work was influential on the birth of Impressionism, here ''[[The Fighting Temeraire]]'' (1839)]]\u003cbr\u003e+[[File:The Fighting Temeraire, JMW Turner, National Gallery.jpg|thumb|left|[[J. M. W. Turner]]'s atmospheric work was influential on the birth of Impressionism, here ''[[The Fighting Temeraire]]'', 1839]]\u003cbr\u003e \u003cbr\u003e Radicals in their time, the early Impressionists violated the rules of academic painting. They constructed their pictures from freely brushed colours that took precedence over lines and contours, following the example of painters such as [[Eug\u00e8ne Delacroix]] and [[J. M. W. Turner]]. They also painted realistic scenes of modern life, and often painted outdoors. Previously, [[still life]]s and [[portrait]]s as well as [[landscape art|landscapes]] were usually painted in a studio.{{efn|Exceptions include [[Canaletto#Outdoor painting|Canaletto]], who painted outside and may have used the [[camera obscura]].}} The Impressionists found that they could capture the momentary and transient effects of sunlight by painting outdoors or ''[[en plein air]]''. They portrayed overall visual effects instead of details, and used short \"broken\" brush strokes of mixed and pure unmixed colour\u2014not blended smoothly or shaded, as was customary\u2014to achieve an effect of intense colour vibration.\u003cref name=\"Seiberling\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -33,7 +33,9 @@\u003cbr\u003e \u003cbr\u003e The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.{{sfnp|Huyghe|1973|pp=11, 16\u201317}} By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003e{{cite book |last1=Masan\u00e8s |first1=Fabrice |year=2006 |title=Courbet |publisher=Taschen |pages=31\u201333 |isbn=978-3-8228-5683-3 }}.\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e-In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003e{{cite book |last1=White |first1=Harrison C. |first2=Cynthia A. |last2=White |year=1993 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |title=Canvases and Careers: Institutional Change in the French Painting World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |archive-date=12 November 2022 |publisher=University of Chicago Press |page=116 |isbn=0-226-89487-8 }}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=21\u201327}} By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003e{{cite book |last1=Greenspan |first1=Taube G |chapter=Armand Guillaumin |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e\u003cbr\u003e+In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003e{{cite book |last1=White |first1=Harrison C. |first2=Cynthia A. |last2=White |year=1993 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |title=Canvases and Careers: Institutional Change in the French Painting World |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |archive-date=12 November 2022 |publisher=University of Chicago Press |page=116 |isbn=0-226-89487-8 }}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=21\u201327}} \u003cbr\u003e+\u003cbr\u003e+By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003e{{cite book |last1=Greenspan |first1=Taube G |chapter=Armand Guillaumin |title=Grove Art Online. Oxford Art Online |publisher=Oxford University Press }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e@@ -63,7 +65,9 @@\u003cbr\u003e \u003cbr\u003e [[File:Camille Pissarro - Boulevard Montmartre - Eremitage.jpg|thumb|left|[[Camille Pissarro]], ''Boulevard Montmartre'', 1897, the [[Hermitage Museum|Hermitage]], [[Saint Petersburg]]]]\u003cbr\u003e \u003cbr\u003e-Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.{{sfn|Denvir|1990|p=105}} Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".{{sfnp|Rewald|1973|p=603}} In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e+Among the artists of the core group (minus Bazille, who had died in the [[Franco-Prussian War]] in 1870), defections occurred as C\u00e9zanne, followed later by Renoir, Sisley, and Monet, abstained from the group exhibitions so they could submit their works to the Salon. Disagreements arose from issues such as Guillaumin's membership in the group, championed by Pissarro and C\u00e9zanne against opposition from Monet and Degas, who thought him unworthy.{{sfn|Denvir|1990|p=105}} Degas invited [[Mary Cassatt]] to display her work in the 1879 exhibition, but also insisted on the inclusion of [[Jean-Fran\u00e7ois Raffa\u00eblli]], [[Ludovic-Napol\u00e9on Lepic|Ludovic Lepic]], and other realists who did not represent Impressionist practices, causing Monet in 1880 to accuse the Impressionists of \"opening doors to first-come daubers\".{{sfnp|Rewald|1973|p=603}} \u003cbr\u003e+\u003cbr\u003e+In this regard, the seventh Paris Impressionist exhibition in 1882 was the most selective of all including the works of only nine \"true\" impressionists, namely [[Gustave Caillebotte]], [[Paul Gauguin]], [[Armand Guillaumin]], [[Claude Monet]], [[Berthe Morisot]], [[Camille Pissarro]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Victor Vignon]]. The group then divided again over the invitations to [[Paul Signac]] and [[Georges Seurat]] to exhibit with them at the 8th Impressionist exhibition in 1886. Pissarro was the only artist to show at all eight Paris Impressionist exhibitions.\u003cbr\u003e \u003cbr\u003e The individual artists achieved few financial rewards from the Impressionist exhibitions, but their art gradually won a degree of public acceptance and support. Their dealer, [[Paul Durand-Ruel|Durand-Ruel]], played a major role in this as he kept their work before the public and arranged shows for them in London and New York. Although Sisley died in poverty in 1899, Renoir had a great Salon success in 1879.{{sfnp|Distel|Hoog|Moffett|1974|p=190}} Monet became secure financially during the early 1880s and so did Pissarro by the early 1890s. By this time the methods of Impressionist painting, in a diluted form, had become commonplace in Salon art.{{sfnp|Rewald|1973|p=475\u2013476}}\u003cbr\u003e \u003cbr\u003e@@ -81,7 +85,7 @@\u003cbr\u003e * Impressionist paintings do not exploit the transparency of thin paint films (glazes), which earlier artists manipulated carefully to produce effects. The impressionist painting surface is typically opaque.\u003cbr\u003e * The paint is applied to a white or light-coloured [[Ground (art)|ground]]. Previously, painters often used dark grey or strongly coloured grounds.\u003cbr\u003e * The play of natural light is emphasized. Close attention is paid to the reflection of colours from object to object. Painters often worked in the evening to produce ''[[effets de soir]]''\u2014the shadowy effects of evening or twilight.\u003cbr\u003e-* In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. (Blue shadows on snow inspired the technique.)\u003cbr\u003e+* In paintings made ''[[en plein air]]'' (outdoors), shadows are boldly painted with the blue of the sky as it is reflected onto surfaces, giving a sense of freshness previously not represented in painting. Blue shadows on snow inspired the technique.\u003cbr\u003e \u003cbr\u003e New technology played a role in the development of the style. Impressionists took advantage of the mid-century introduction of premixed paints in tin tubes (resembling modern toothpaste tubes), which allowed artists to work more spontaneously, both outdoors and indoors.{{sfnp|Bomford|Kirby|Leighton|Roy|1990|pp=39\u201341}} Previously, painters made their own paints individually, by grinding and mixing dry pigment powders with linseed oil, which were then stored in animal bladders.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.phillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |url-status=dead |title=Renoir and the Impressionist Process |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110105173433\u002fhttp:\u002f\u002fphillipscollection.org\u002fdocs\u002feducation\u002flbp-kit_4.pdf |archive-date=2011-01-05 |website=[[The Phillips Collection]] |access-date=21 May 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -91,13 +95,13 @@\u003cbr\u003e \u003cbr\u003e == Content and composition ==\u003cbr\u003e [[File:Hay Harvest at \u00c9ragny, 1901, Camille Pissarro.jpg|thumb|[[Camille Pissarro]], ''[[Hay Harvest at \u00c9ragny]],'' 1901, [[National Gallery of Canada]], [[Ottawa]], Ontario]]\u003cbr\u003e-\u003cbr\u003e-The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003e{{cite book |editor1-last=Poulet |editor1-first=Anne L. |last1=Murphy |first1=Alexandra R. |year=1979 |title=Corot to Braque: French Paintings from the Museum of Fine Arts, Boston |location=Boston |publisher=The Museum of Fine Arts, Boston |page=XV |isbn=0-87846-134-5}}\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.{{sfnp|Huyghe|1973|pp=54, 77, 121}} A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003e{{cite book |last1=Varnedoe |first1=Kirk |year=1987 |title=Gustave Caillebotte |publisher=Yale University Press |page=90 |isbn=9780300037227}}\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003e{{cite book |last1=Rubin |first1=James Henry |year=2008 |title=Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh |location=Berkeley |publisher=University of California Press |page=128 |isbn=9780520248014}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Berthe Morisot Reading.jpg|thumb|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e+The Impressionists reacted to modernity by exploring \"a wide range of non-academic subjects in art\" such as middle-class leisure activities and \"urban themes, including train stations, caf\u00e9s, brothels, the theater, and dance.\"\u003cref\u003e{{cite book |editor1-last=Poulet |editor1-first=Anne L. |last1=Murphy |first1=Alexandra R. |year=1979 |title=Corot to Braque: French Paintings from the Museum of Fine Arts, Boston |location=Boston |publisher=The Museum of Fine Arts, Boston |page=XV |isbn=0-87846-134-5}}\u003c\u002fref\u003e They found inspiration in the [[Haussmann's renovation of Paris|newly widened avenues]] of Paris, bounded by new tall buildings that offered opportunities to depict bustling crowds, popular entertainments, and nocturnal lighting in artificially closed-off spaces.{{sfnp|Huyghe|1973|pp=54, 77, 121}} \u003cbr\u003e+\u003cbr\u003e+A painting such as Caillebotte's ''[[Paris Street; Rainy Day]]'' (1877) strikes a modern note by emphasizing the isolation of individuals amid the outsized buildings and spaces of the urban environment.\u003cref\u003e{{cite book |last1=Varnedoe |first1=Kirk |year=1987 |title=Gustave Caillebotte |publisher=Yale University Press |page=90 |isbn=9780300037227}}\u003c\u002fref\u003e When painting landscapes, the Impressionists did not hesitate to include the factories that were proliferating in the countryside. Earlier painters of landscapes had conventionally avoided smokestacks and other signs of industrialization, regarding them as blights on nature's order and unworthy of art.\u003cref\u003e{{cite book |last1=Rubin |first1=James Henry |year=2008 |title=Impressionism and the Modern Landscape: Productivity Technology and Urbanization from Manet to Van Gogh |location=Berkeley |publisher=University of California Press |page=128 |isbn=9780520248014}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Prior to the Impressionists, other painters, notably such [[Dutch Golden Age painting|17th-century Dutch painters]] as [[Jan Steen]], had emphasized common subjects, but their methods of [[composition (visual arts)|composition]] were traditional. They arranged their compositions so that the main subject commanded the viewer's attention. [[J. M. W. Turner]], while an artist of the [[Romanticism|Romantic era]], anticipated the style of impressionism with his artwork.\u003cref\u003e{{Cite web |url=https:\u002f\u002fwww.britannica.com\u002fbiography\u002fJ-M-W-Turner |website=Britannica |title=J.M.W. Turner |access-date=8 December 2018 |archive-date=30 January 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100130101931\u002fhttp:\u002f\u002fwww.britannica.com\u002fEBchecked\u002ftopic\u002f610274\u002fJ-M-W-Turner |url-status=live }}\u003c\u002fref\u003e The Impressionists relaxed the boundary between subject and background so that the effect of an Impressionist painting often resembles a snapshot, a part of a larger reality captured as if by chance.{{sfnp|Rosenblum|1989|p=228}} Photography was gaining popularity, and as cameras became more portable, photographs became more candid. Photography inspired Impressionists to represent momentary action, not only in the fleeting lights of a landscape, but in the day-to-day lives of people.\u003cref\u003e{{cite journal |last1=Varnedoe |first1=J. Kirk T. |title=The Artifice of Candor: Impressionism and Photography Reconsidered |journal=Art in America |volume=68 |issue=1 |date=January 1980 |pages=66\u201378}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Herbert |first1=Robert L. |title=Impressionism: Art, Leisure, and Parisian Society  |publisher=Yale University Press |year=1988 |pages=311, 319 |isbn=0-300-05083-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Berthe Morisot Reading.jpg|thumb|left|[[Berthe Morisot]], ''Reading,'' 1873, [[Cleveland Museum of Art]]]]\u003cbr\u003e-\u003cbr\u003e The development of Impressionism can be considered partly as a reaction by artists to the challenge presented by photography, which seemed to devalue the artist's skill in reproducing reality. Both portrait and [[Landscape art|landscape]] paintings were deemed somewhat deficient and lacking in truth as photography \"produced lifelike images much more efficiently and reliably\".\u003cref name=\"impressionism757\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e In spite of this, photography actually inspired artists to pursue other means of creative expression, and rather than compete with photography to emulate reality, artists focused \"on the one thing they could inevitably do better than the photograph\u2014by further developing into an art form its very subjectivity in the conception of the image, the very subjectivity that photography eliminated\".\u003cref name=\"impressionism757\" \u002f\u003e The Impressionists sought to express their perceptions of nature, rather than create exact representations. This allowed artists to depict subjectively what they saw with their \"tacit imperatives of taste and conscience\".\u003cref name=\"impressionism758\"\u003e{{cite book |last1=Sontag |first1=Susan |year=1977 |title=On Photography |publisher=Penguin |location=London}}\u003c\u002fref\u003e Photography encouraged painters to exploit aspects of the painting medium, like colour, which photography then lacked: \"The Impressionists were the first to consciously offer a subjective alternative to the photograph\".\u003cref name=\"impressionism757\"\u003e{{cite book |last1=Levinson |first1=Paul |year=1997 |title=The Soft Edge; a Natural History and Future of the Information Revolution |publisher=Routledge |location=London and New York}}\u003c\u002fref\u003e\u003cbr\u003e@@ -109,21 +113,25 @@\u003cbr\u003e [[Edgar Degas]] was both an avid photographer and a collector of Japanese prints.{{sfnp|Baumann|Karabelnik|1994|p=112}} His ''The Dance Class'' ''(La classe de danse)'' of 1874 shows both influences in its asymmetrical composition. The dancers are seemingly caught off guard in various awkward poses, leaving an expanse of empty floor space in the lower right quadrant. He also captured his dancers in sculpture, such as the ''[[Little Dancer of Fourteen Years]]''.\u003cbr\u003e \u003cbr\u003e == Female Impressionists ==\u003cbr\u003e-[[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|left|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e-\u003cbr\u003e-Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists.\u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12|doi-access=free }}\u003c\u002fref\u003e They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places; that was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e+[[File:Berthe Morisot The Harbor at Lorient.jpg|thumb|[[Berthe Morisot]], ''[[The Harbor at Lorient]]'', 1869, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e+\u003cbr\u003e+Impressionists, in varying degrees, were looking for ways to depict visual experience and contemporary subjects.{{sfnp|Garb|1986|p=9}} Female Impressionists were interested in these same ideals but had many social and career limitations compared to male Impressionists.\u003cref\u003e{{Cite journal |last=Murray |first=Gale |date=2018-03-15 |title=Her Paris: Women Artists in the Age of Impressionism |url=http:\u002f\u002fwww.19thc-artworldwide.org\u002fspring18\u002fmurray-reviews-her-paris-women-artists-in-the-age-of-impressionism |journal=Nineteenth-Century Art Worldwide |volume=17 |issue=1 |doi=10.29411\u002fncaw.2018.17.1.12|doi-access=free }}\u003c\u002fref\u003e They were particularly excluded from the imagery of the bourgeois social sphere of the boulevard, cafe, and dance hall.\u003cref name=\":0\"\u003e{{Cite book|title=Women, art, and society|last=Chadwick|first=Whitney|publisher=Thames & Hudson|year=2012|isbn=978-0-500-20405-4|edition=Fifth|location=London|page=232|oclc=792747353}}\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+As well as imagery, women were excluded from the formative discussions that resulted in meetings in those places. That was where male Impressionists were able to form and share ideas about Impressionism.\u003cref name=\":0\" \u002f\u003e In the academic realm, women were believed to be incapable of handling complex subjects, which led teachers to restrict what they taught female students.{{sfnp|Garb|1986|p=6}} It was also considered unladylike to excel in art, since women's true talents were then believed to center on homemaking and mothering.{{sfnp|Garb|1986|p=6}}\u003cbr\u003e \u003cbr\u003e Yet several women were able to find success during their lifetime, even though their careers were affected by personal circumstances \u2013 Bracquemond, for example, had a husband who was resentful of her work which caused her to give up painting.\u003cref name=\":2\"\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New Haven|page=41|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The four most well known, namely, [[Mary Cassatt]], [[Eva Gonzal\u00e8s]], [[Marie Bracquemond]], and [[Berthe Morisot]], are, and were, often referred to as the 'Women Impressionists'. Their participation in the series of eight Impressionist exhibitions that took place in Paris from 1874 to 1886 varied: Morisot participated in seven, Cassatt in four, Bracquemond in three, and Gonzal\u00e8s did not participate.\u003cref name=\":2\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |title=Berthe Morisot |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200106035811\u002fhttps:\u002f\u002fnmwa.org\u002fexplore\u002fartist-profiles\u002fberthe-morisot |archive-date=6 January 2020 |website=National Museum of Women in the Arts |access-date=18 May 2019 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Young Girl at a Window.JPG|thumb|upright|[[Mary Cassatt]], ''Young Girl at a Window,'' 1885, oil on canvas, [[National Gallery of Art]], Washington, D.C.]]\u003cbr\u003e \u003cbr\u003e-The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.{{sfnp|Garb|1986|p=36}} Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women Artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The women Impressionists, like their male counterparts, were striving for \"truth\", for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e+The critics of the time lumped these four together without regard to their personal styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fre
