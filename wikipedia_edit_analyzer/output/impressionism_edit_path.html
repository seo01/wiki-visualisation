201399 |doi=10.3828\u002fsj.18.1.7 |url=https:\u002f\u002fwww.liverpooluniversitypress.co.uk\u002fdoi\u002f10.3828\u002fsj.18.1.7 |access-date=18 March 2024 |language=en |issn=1366-2724}}\u003c\u002fref\u003e Only one of Degas's sculptures, ''[[Little Dancer of Fourteen Years]]'', was exhibited in his lifetime, which was exhibited at the Sixth Impressionist Exhibition in 1881. ''Little Dancer'' proved to be controversial with critics. Some considered Degas to have overthrown sculptural traditions in the same way that Impressionism had overthrown the traditions of painting. Others found it to be ugly.\u003cref\u003e{{cite journal |last1=Barbour |first1=Daphne |title=Degas's Little Dancer: Not Just a Study in the Nude |journal=Art Journal |date=1995 |volume=54 |issue=2 |pages=28\u201332 |doi=10.2307\u002f777459 |jstor=777459 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |access-date=18 March 2024 |issn=0004-3249 |archive-date=18 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240318144700\u002fhttps:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |url-status=live }}\u003c\u002fref\u003e Following the Degas's death in 1917, his heirs authorized bronze castings from 73 of the artist's sculptures.\u003cref\u003e{{cite journal |last1=Kendall |first1=Richard |title=Degas's sculpture in the twenty-first century |journal=The Burlington Magazine |date=2012 |volume=154 |issue=1309 |pages=268\u2013271 |jstor=23232564 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |access-date=18 March 2024 |issn=0007-6287 |archive-date=18 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240318144700\u002fhttps:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+While Edgar Degas was primarily known as a painter in his lifetime, he began to pursue the medium of sculpture later in his artistic career in the 1880s. He created as many as 150 sculptures during his lifetime. Degas preferred the medium of wax for his sculptures because it allowed him to make changes, start over, and further explore the modelling process.\u003cref\u003e{{cite journal |last1=Locheed |first1=Jessica |title=Beyond the form: the ineffable essence of Degas' sculpture |journal=Sculpture Journal |date=June 2009 |volume=18 |issue=1 |pages=86\u201399 |doi=10.3828\u002fsj.18.1.7 |url=https:\u002f\u002fwww.liverpooluniversitypress.co.uk\u002fdoi\u002f10.3828\u002fsj.18.1.7 |access-date=18 March 2024 |language=en |issn=1366-2724}}\u003c\u002fref\u003e Only one of Degas's sculptures, ''[[Little Dancer of Fourteen Years]]'', was exhibited in his lifetime, which was exhibited at the Sixth Impressionist Exhibition in 1881. ''Little Dancer'' proved to be controversial with critics. Some considered Degas to have overthrown sculptural traditions in the same way that Impressionism had overthrown the traditions of painting. Others found it to be ugly. \u003cref\u003e{{cite journal |last1=Barbour |first1=Daphne |title=Degas's Little Dancer: Not Just a Study in the Nude |journal=Art Journal |date=1995 |volume=54 |issue=2 |pages=28\u201332 |doi=10.2307\u002f777459 |jstor=777459 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f777459 |access-date=18 March 2024 |issn=0004-3249}}\u003c\u002fref\u003e Following the Degas's death in 1917, his heirs authorized bronze castings from 73 of the artist's sculptures.\u003cref\u003e{{cite journal |last1=Kendall |first1=Richard |title=Degas's sculpture in the twenty-first century |journal=The Burlington Magazine |date=2012 |volume=154 |issue=1309 |pages=268\u2013271 |jstor=23232564 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f23232564 |access-date=18 March 2024 |issn=0007-6287}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The sculptor [[Auguste Rodin]] is sometimes called an Impressionist for the way he used roughly modeled surfaces to suggest transient light effects.\u003cref\u003eKleiner, Fred S., and Helen Gardner (2014). ''Gardner's art through the ages: a concise Western history''. Boston, MA: Wadsworth, Cengage Learning. p. 382. {{ISBN|978-1-133-95479-8}}.\u003c\u002fref\u003e The sculptor [[Medardo Rosso]] has also been called an Impressionist.\u003cref\u003e{{cite book |last1=Caramel |first1=Luciano |title=Medardo Rosso: Impressions in Wax & Bronze: 1882-1906 |date=1988 |publisher=Kent Fine Arts |location=New York |isbn=978-1-878607-02-7 |pages=10\u201315 |edition=First |url=https:\u002f\u002farchive.org\u002fdetails\u002fmedardorossoimpr0000luci\u002f |access-date=18 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Some Russian artists created Impressionistic sculptures of animals in order to break away from old world concepts. Their works have been described as endowing birds and beasts with new spiritual characteristics.\u003cref\u003e{{Cite journal |last=Portnova |first=Irina |date=2019-12-10 |title=On the meaning and novelty of impressionistic thinking on the example of Russian animalistic sculpture of the late XIX \u2013 early XX centuries |journal=Scientific and Analytical Journal Burganov House. The Space of Culture |volume=15 |issue=4 |pages=82\u2013107 |doi=10.36340\u002f2071-6818-2019-15-4-82-107 |doi-broken-date=1 November 2024 |issn=2618-7965|doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e === Photography and film ===\u003cbr\u003e \u003cbr\u003e-While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art, distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024 |archive-date=21 March 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240321030851\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate process]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[French Impressionist Cinema]] is a term applied to a loosely defined group of films and filmmakers in France from 1919 to 1929, although these years are debatable. French Impressionist filmmakers include [[Abel Gance]], [[Jean Epstein]], [[Germaine Dulac]], Marcel L'Herbier, [[Louis Delluc]], and Dmitry Kirsanoff.\u003cbr\u003e+While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art : Distributed by H.N. Abrams |location=New York |isbn=0-87099-883-8 |pages=6, 11\u201313 |url=https:\u002f\u002fwww.metmuseum.org\u002fart\u002fmetpublications\u002fedgar_degas_photographer |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[Pictorialism|Pictorialist]] photographers whose work is characterized by soft focus and atmospheric effects have also been called Impressionists. These Impressionist photographers used various techniques, such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[Pinhole lens|pinhole lenses]], and manipulating the [[Gum printing|gum bichromate processs]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778-781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[French Impressionist Cinema]] is a term applied to a loosely defined group of films and filmmakers in France from 1919 to 1929, although these years are debatable. French Impressionist filmmakers include [[Abel Gance]], [[Jean Epstein]], [[Germaine Dulac]], Marcel L\u2019Herbier, [[Louis Delluc]], and Dmitry Kirsanoff.\u003cbr\u003e \u003cbr\u003e === Music ===\u003cbr\u003e {{Main|Impressionist music}}\u003cbr\u003e-{{Listen\u003cbr\u003e-| type         = music\u003cbr\u003e-| filename     = Debussy , Reflets dans l'eau.ogg\u003cbr\u003e-| title        = ''Reflets dans l'eau'' (5:33)\u003cbr\u003e-| description  = Composed by Debussy in 1905, performed by [[Giorgi Latso]] in 2017.\u003cbr\u003e-}}\u003cbr\u003e+{{Listen|type=music|filename=Clair de lune (Claude Debussy) Suite bergamasque.ogg|title=''Clair de Lune'' (5:04)|description=Composed by Claude Debussy in 1890, performed by Laurens Goedhart in 2011.}}\u003cbr\u003e [[File:\u30af\u30ed\u30fc\u30c9\u30fb\u30e2\u30cd\uff08Claude Monet\uff09\u300a\u7761\u84ee\uff08Water Lilies\uff09\u300b1916\uff08\u5927\u6b635\uff09\u5e74\u3001\u56fd\u7acb\u897f\u6d0b\u7f8e\u8853\u9928\uff08\u677e\u65b9\u30b3\u30ec\u30af\u30b7\u30e7\u30f3\uff09\u3001\u6771\u4eac.jpg|thumb|[[Claude Monet]], ''[[Water Lilies (Monet series)|Water Lilies]],'' 1916, [[National Museum of Western Art]], Tokyo]]\u003cbr\u003e \u003cbr\u003e Musical Impressionism is the name given to a movement in [[European classical music]] that arose in the late 19th century and continued into the middle of the 20th century. Originating in France, musical Impressionism is characterized by suggestion and atmosphere, and eschews the emotional excesses of the Romantic era. Impressionist composers favoured short forms such as the [[nocturne]], [[Arabesque (classical music)|arabesque]], and [[Prelude (music)|prelude]], and often explored uncommon scales such as the [[whole tone scale]]. Perhaps the most notable innovations of Impressionist composers were the introduction of major 7th chords and the extension of chord structures in 3rds to five- and six-part harmonies.\u003cbr\u003e \u003cbr\u003e-The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. \u003cbr\u003e-\u003cbr\u003e-[[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e-\u003cbr\u003e-American Impressionist music differs from European Impressionist music, and these differences are mainly reflected in Charles Griffith's poetry of flute and orchestral music. He is also the most prolific Impressionist composer in the United States.\u003cref\u003e{{Cite journal |last1=Haefliger |first1=Kathleen |last2=Griffes |first2=Charles Tomlinson |date=1986 |title=Piano Music of Charles Tomlinson Griffes |url=http:\u002f\u002fdx.doi.org\u002f10.2307\u002f3052237 |journal=American Music |volume=4 |issue=4 |pages=481 |doi=10.2307\u002f3052237 |jstor=3052237 |issn=0734-4392}}\u003c\u002fref\u003e\u003cbr\u003e+The influence of visual Impressionism on its musical counterpart is debatable. [[Claude Debussy]] and [[Maurice Ravel]] are generally considered the greatest Impressionist composers, but Debussy disavowed the term, calling it the invention of critics. [[Erik Satie]] was also considered in this category, though his approach was regarded as less serious, more musical novelty in nature. [[Paul Dukas]] is another French composer sometimes considered an Impressionist, but his style is perhaps more closely aligned to the late Romanticists. Musical Impressionism beyond France includes the work of such composers as [[Ottorino Respighi]] (Italy), [[Ralph Vaughan Williams]], [[Cyril Scott]], and [[John Ireland (composer)|John Ireland]] (England), [[Manuel De Falla]] and [[Isaac Albeniz]] (Spain), and [[Charles Griffes]] (America).\u003cbr\u003e \u003cbr\u003e === Literature ===\u003cbr\u003e {{Main|Impressionism (literature)}}\u003cbr\u003e \u003cbr\u003e-The term Impressionism has also been used to describe works of literature in which a few select details suffice to convey the sensory impressions of an incident or scene. Impressionist literature is closely related to [[Symbolism (arts)|Symbolism]], with its major exemplars being [[Charles Baudelaire|Baudelaire]], [[St\u00e9phane Mallarm\u00e9|Mallarm\u00e9]], [[Arthur Rimbaud|Rimbaud]], and [[Paul Verlaine|Verlaine]]. Authors such as [[Virginia Woolf]], [[D.H. Lawrence]], [[Henry James]], and [[Joseph Conrad]] have written works that are Impressionistic in the way that they describe, rather than interpret, the impressions, sensations and emotions that constitute a character's mental life. Some literary scholars, such as John G. Peters, believe literary Impressionism is better defined by its philosophical stance than by any supposed relationship with Impressionist painting.\u003cref\u003e{{Cite journal |last=Berrong |first=Richard M. |date=2006-06-01 |title=Modes of Literary Impressionism |url=http:\u002f\u002fdx.doi.org\u002f10.1215\u002f00166928-39-2-203 |journal=Genre |volume=39 |issue=2 |pages=203\u2013228 |doi=10.1215\u002f00166928-39-2-203 |issn=0016-6928}}\u003c\u002fref\u003e\u003cbr\u003e+The term Impressionism has also been used to describe works of literature in which a few select details suffice to convey the sensory impressions of an incident or scene. Impressionist literature is closely related to [[Symbolism (arts)|Symbolism]], with its major exemplars being [[Charles Baudelaire|Baudelaire]], [[St\u00e9phane Mallarm\u00e9|Mallarm\u00e9]], [[Arthur Rimbaud|Rimbaud]], and [[Paul Verlaine|Verlaine]]. Authors such as [[Virginia Woolf]], [[D.H. Lawrence]], [[Henry James]], and [[Joseph Conrad]] have written works that are Impressionistic in the way that they describe, rather than interpret, the impressions, sensations and emotions that constitute a character's mental life.\u003cbr\u003e \u003cbr\u003e [[File:Camille Pissarro 019.jpg|thumb|[[Camille Pissarro]], ''Children on a Farm'', 1887]]\u003cbr\u003e \u003cbr\u003e == Post-Impressionism ==\u003cbr\u003e {{Main|Post-Impressionism}}\u003cbr\u003e-During the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Post-Impressionist artists reacted against the Impressionists' concern with realistically reproducing the optical sensations of light and colour; they turned instead toward symbolic content and the expression of emotion.\u003cref\u003e{{Cite book |last=Boyle-Turner |first=Caroline |url=http:\u002f\u002fdx.doi.org\u002f10.1093\u002fgao\u002f9781884446054.article.t068996 |title=Post-Impressionism |date=2017-12-12 |publisher=Oxford University Press |series=Oxford Art Online|doi=10.1093\u002fgao\u002f9781884446054.article.t068996 }}\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-Post-Impressionism prefigured the characteristics of [[Futurism]] and [[Cubism]], reflecting the change of attitude towards art in European society.\u003cref\u003e{{Cite book |url=https:\u002f\u002fwww.taylorfrancis.com\u002fbooks\u002fmono\u002f10.4324\u002f9781032699707\u002fpost-impressionists-england-barrie-bullen |title=Post-Impressionists in England: The Critical Reception |date=2024-03-08 |publisher=Routledge |isbn=978-1-032-69970-7 |editor-last=Bullen |editor-first=Barrie |location=London |doi=10.4324\u002f9781032699707}}\u003c\u002fref\u003e Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e+\u003cbr\u003e+During the 1880s several artists began to develop different precepts for the use of colour, pattern, form, and line, derived from the Impressionist example: [[Vincent van Gogh]], [[Paul Gauguin]], [[Georges Seurat]], and [[Henri de Toulouse-Lautrec]]. These artists were slightly younger than the Impressionists, and their work is known as post-Impressionism. Some of the original Impressionist artists also ventured into this new territory; [[Camille Pissarro]] briefly painted in a [[Pointillism|pointillist]] manner, and even Monet abandoned strict ''plein air'' painting. [[Paul C\u00e9zanne]], who participated in the first and third Impressionist exhibitions, developed a highly individual vision emphasising pictorial structure, and he is more often called a post-Impressionist. Although these cases illustrate the difficulty of assigning labels, the work of the original Impressionist painters may, by definition, be categorised as Impressionism.\u003cbr\u003e \u003cbr\u003e \u003cgallery widths=\"160px\" heights=\"160px\" perrow=\"4\"\u003e\u003cbr\u003e File:A Sunday on La Grande Jatte, Georges Seurat, 1884.png|[[Georges Seurat]], ''[[A Sunday Afternoon on the Island of La Grande Jatte]]'', 1884\u20131886, [[The Art Institute of Chicago]]\u003cbr\u003e@@ -359,48 +334,39 @@\u003cbr\u003e \u003c\u002fgallery\u003e\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e-* [[Expressionism]], a reaction to Impressionism\u003cbr\u003e+* [[Art periods]]\u003cbr\u003e+* [[Cantonese school of painting]]\u003cbr\u003e+* [[Expressionism]] (as a reaction to Impressionism)\u003cbr\u003e+* [[Les XX]]\u003cbr\u003e * [[Luminism (Impressionism)]]\u003cbr\u003e-* [[Cantonese school of painting]], influenced by Impressionism\u003cbr\u003e-* [[Les XX]]\u003cbr\u003e-\u003cbr\u003e-'''General:'''\u003cbr\u003e-* [[Art periods]]\u003cbr\u003e * al styles, techniques, or subject matter.\u003cref\u003e{{Cite book|title=Berthe Morisot: Woman Impressionist|last=Kang|first=Cindy|publisher=Rizzoli Electra|year=2018|isbn=978-0-8478-6131-6|location=New York, NY|page=31|oclc=1027042476}}\u003c\u002fref\u003e Critics viewing their works at the exhibitions often attempted to acknowledge the women artists' talents but circumscribed them within a limited notion of femininity.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Garb|first=Tamar|publisher=Rizzoli International Publications|year=1986|isbn=0-8478-0757-6|location=New York|page=36|oclc=14368525}}\u003c\u002fref\u003e Arguing for the suitability of Impressionist technique to women's manner of perception, Parisian critic S.C. de Soissons wrote:\u003cblockquote\u003eOne can understand that women have no originality of thought, and that literature and music have no feminine character; but surely women know how to observe, and what they see is quite different from that which men see, and the art which they put in their gestures, in their toilet, in the decoration of their environment is sufficient to give is the idea of an instinctive, of a peculiar genius which resides in each one of them.\u003cref\u003e{{cite book |last1=Adler |first1=Kathleen |title=Perspectives on Morisot |date=1990 |publisher=Hudson Hills Press |location=New York |isbn=1-55595-049-3 |page=60 |edition=1st |url=https:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |access-date=28 April 2019 |archive-date=25 February 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210225171013\u002fhttps:\u002f\u002fprimo.lib.umn.edu\u002fprimo-explore\u002ffulldisplay?docid=UMN_ALMA21430754870001701&context=L&vid=MORRIS&search_scope=Primocentral&tab=primocentral&lang=en_US |url-status=live }}\u003c\u002fref\u003e\u003c\u002fblockquote\u003eWhile Impressionism legitimized the domestic social life as subject matter, of which women had intimate knowledge, it also tended to limit them to that subject matter. Portrayals of often-identifiable sitters in domestic settings (which could offer commissions) were dominant in the exhibitions.\u003cref\u003e{{Cite book|title=Women artists in Paris, 1850\u20131900|last1=Laurence|first1=Madeline|last2=Kendall|first2=Richard|publisher=Yale University Press|year=2017|isbn=978-0-300-22393-4|location=New York, New York|page=49|chapter=Women Artists and Impressionism|oclc=982652244}}\u003c\u002fref\u003e The subjects of the paintings were often women interacting with their environment by either their gaze or movement. Cassatt, in particular, was aware of her placement of subjects: she kept her predominantly female figures from objectification and cliche; when they are not reading, they converse, sew, drink tea, and when they are inactive, they seem lost in thought.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63 63]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f63}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The women Impressionists, like their male counterparts, were striving for \"truth,\" for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e+The women Impressionists, like their male counterparts, were striving for \"truth\", for new ways of seeing and new painting techniques; each artist had an individual painting style.\u003cref\u003e{{Cite book|title=Women Impressionists|last=Pfeiffer|first=Ingrid|publisher=Schirn Kunsthalle Frankfurt|year=2008|isbn=978-3-7757-2079-3|location=Frankfurt am Main|page=22|chapter=Impressionism Is Feminine: On the Reception of Morisot, Cassatt, Gonzal\u00e8s, and Bracquemond|oclc=183262558}}\u003c\u002fref\u003e Women Impressionists (particularly Morisot and Cassatt) were conscious of the balance of power between women and objects in their paintings \u2013 the bourgeois women depicted are not defined by decorative objects, but instead, interact with and dominate the things with which they live.\u003cref\u003e{{Cite book|title=Mary Cassatt, Modern Woman|last=Barter|first=Judith A.|publisher=Art Institute of Chicago in association with H.N. Abrams|year=1998|isbn=0-8109-4089-2|edition=1st|location=New York|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65 65]|oclc=38966030|url=https:\u002f\u002farchive.org\u002fdetails\u002fmarycassattmoder0000cass\u002fpage\u002f65}}\u003c\u002fref\u003e There are many similarities in their depictions of women who seem both at ease and subtly confined.\u003cref\u003e{{Cite journal|last=Meyers|first=Jeffery|date=September 2008|title=Longing and Constraint|journal=Apollo|volume=168|page=128|via=ProQuest LLC}}\u003c\u002fref\u003e Gonzal\u00e8s' ''Box at the Italian Opera'' depicts a woman staring into the distance, at ease in a social sphere but confined by the box and the man standing next to her. Cassatt's painting ''Young Girl at a Window'' is brighter in color but remains constrained by the canvas edge as she looks out the window.\u003cbr\u003e \u003cbr\u003e [[File:Eva Gonzal\u00e8s (1849-1883) Een loge in het Th\u00e9\u00e2tre des Italiens (1874) Mus\u00e9e d'Orsay 22-8-2017 17-29-43.JPG|thumb|[[Eva Gonzal\u00e8s]], ''Une Loge aux Italiens,'' or, ''Box at the Italian Opera,'' {{Circa|1874}}, oil on canvas, [[Mus\u00e9e d'Orsay]], Paris]]\u003cbr\u003e \u003cbr\u003e@@ -301,9 +301,9 @@\u003cbr\u003e \u003cbr\u003e While his photographs are less known than his paintings or his sculptures, Edgar Degas also pursued photography later in his life. His photographs were never exhibited during his lifetime, and not much attention was given to them following his death. It was not until the late 20th century that scholars started to take interest in Degas's photographs.\u003cref\u003e{{cite book |last1=Daniel |first1=Malcolm |title=Edgar Degas, Photographer |date=1998 |publisher=Metropolitan Museum of Art : D g the [[Gum printing|gum bichromate processs]], to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+[[Pictorialism|Pictorialist]] photographers, whose work is characterized by soft focus and atmospheric effects, have also been called Impressionists. These Impressionist photographers used various techniques such as photographing subjects [[out of focus]], using [[Soft focus|soft focus lenses]] or [[pinhole lens]]es, and manipulating the [[Gum printing|gum bichromate processs]] to create images that resembled Impressionist paintings.\u003cref\u003e{{cite book |editor1-last=Warren |editor1-first=Lynne |title=Encyclopedia of Twentieth Century Photography |volume=1, A-F Index |chapter=Impressionism |date=2006 |publisher=Routledge |location=New York, NY |isbn=978-1-57958-393-4 |pages=778\u2013781 |url=https:\u002f\u002farchive.org\u002fdetails\u002fencyclopedia-of-twentieth-century-photography\u002f |access-date=21 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[French Impressionist Cinema]] is a term applied to a loosely defined group of films and filmmakers in France from 1919 to 1929, although these years are debatable. French Impressionist filmmakers include [[Abel Gance]], [[Jean Epstein]], [[Germaine Dulac]], Marcel L'Herbier, [[Louis Delluc]], and Dmitry Kirsanoff.\u003cbr\u003e ","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -259,7 +259,7 @@\u003cbr\u003e [[File:Hip, Hip, Hurrah! Artists\u2019 Party, Skagen (Peder Severin Kr\u00f8yer) - Gothenburg Museum of Art - F 62.tif|thumb|[[Peder Severin Kr\u00f8yer]]'s 1888 work ''[[Hip, Hip, Hurrah!]]'', held at the [[Gothenburg Museum of Art]], shows members of the [[Skagen Painters]].]]\u003cbr\u003e As the influence of Impressionism spread beyond France, artists, too numerous to list, became identified as practitioners of the new style. Some of the more important examples are:\u003cbr\u003e * The [[American Impressionism|American Impressionists]], including [[Mary Cassatt]], [[William Merritt Chase]], [[Frederick Carl Frieseke]], [[Childe Hassam]], [[Willard Metcalf]], [[Lilla Cabot Perry]], [[Theodore Robinson]], [[Edmund C. Tarbell|Edmund Charles Tarbell]], [[John Henry Twachtman]], [[Catherine Wiley]] and [[J. Alden Weir]].\u003cbr\u003e-* The [[Australian Impressionism|Australian Impressionists]], including [[Tom Roberts]], [[Arthur Streeton]], [[Walter Withers]], [[Charles Conder]] and [[Frederick McCubbin]] (who were prominent members of the [[Heidelberg School]]), and [[John Russell (Australian artist)|John Russell]], a friend of Van Gogh, Rodin, Monet and Matisse.\u003cbr\u003e+* The [[Australian Impressionism|Australian Impressionists]], including [[Tom Roberts]], [[Arthur Streeton]], [[Walter Withers]], [[Charles Conder]], [[Frederick McCubbin]] and [[E. Phillips Fox]] (who were prominent members of the [[Heidelberg School]]), and [[John Russell (Australian artist)|John Russell]], a friend of Van Gogh, Rodin, Monet and Matisse.\u003cbr\u003e * The [[Amsterdam Impressionism|Amsterdam Impressionists]] in the [[Netherlands]], including [[George Hendrik Breitner]], [[Isaac Isra\u00ebls]], [[Willem Bastiaan Tholen]], [[Willem de Zwart]], [[Willem Witsen]] and [[Jan Toorop]].\u003cbr\u003e * The [[California Impressionism|California Impressionists]], including [[William Wendt]], [[Guy Rose]], [[Alson Clark]], [[Donna N. Schuster]], and [[Sam Hyde Harris]].\u003cbr\u003e * [[Anna Boch]], [[Vincent van Gogh]]'s friend [[Eug\u00e8ne Boch]], [[Georges Lemmen]] and [[Th\u00e9o van Rysselberghe]], Impressionist painters from [[Belgium]].","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -29,7 +29,7 @@\u003cbr\u003e \u003cbr\u003e == Beginnings ==\u003cbr\u003e {{French art history}}\u003cbr\u003e-In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden varnish.\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden vanish.\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e ","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -31,7 +31,7 @@\u003cbr\u003e {{French art history}}\u003cbr\u003e In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden vanish.\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e+The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censorship by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003eWhite, Harrison C., Cynthia A. White (1993). ''[https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 Canvases and Careers: Institutional Change in the French Painting World] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -33,11 +33,11 @@\u003cbr\u003e \u003cbr\u003e The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censorship by depicting contemporary realities without the idealization demanded by the Acad\u00 d synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e+In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003eWhite, Harrison C., Cynthia A. White (1993). ''[https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 Canvases and Careers: Institutional Change in the French Painting World] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out of doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e-During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003eSeiberling, Grace, \"Impressionism\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted pressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden vanish.\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censorship by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003eWhite, Harrison C., Cynthia A. White (1993). ''[https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 Canvases and Careers: Institutional Change in the French Painting World] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out of doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e+In the middle of the 19th century\u2014a time of rapid industrialization and unsettling social change in France, as Emperor [[Napoleon III]] [[Haussmann's renovation of Paris|rebuilt Paris]] and waged war\u2014the {{Lang|fr|[[Acad\u00e9mie des Beaux-Arts]]|italic=no}} dominated French art.\u003cref\u003eHuyghe (1973), pp. 13, 16\u201318.\u003c\u002fref\u003e The Acad\u00e9mie was the preserver of traditional French painting standards of content and style. Historical subjects, religious themes, and portraits were valued; landscape and still life were not. The Acad\u00e9mie preferred carefully finished images that looked realistic when examined closely. Paintings in this style were made up of precise brush strokes carefully blended to hide the artist's hand in the work.\u003cref\u003eNathalia Brodskaya, Impressionism, Parkstone International, 2014, pp. 13\u201314\u003c\u002fref\u003e Colour was restrained and often toned down further by the application of a golden varnish.\u003cref name=\"The Met\"\u003e{{Cite web |url=http:\u002f\u002fwww.metmuseum.org\u002ftoah\u002fhd\u002fimml\u002fhd_imml.htm |title=Samu, Margaret. \"Impressionism: Art and Modernity\". In Heilbrunn Timeline of Art History. New York: The Metropolitan Museum of Art, 2000 (October 2004) |access-date=29 June 2014 |archive-date=4 February 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200204131331\u002fhttps:\u002f\u002fwww.metmuseum.org\u002fTOAH\u002fHD\u002fimml\u002fhd_imml.htm |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The Acad\u00e9mie had an annual, juried art show, the [[Salon de Paris]], and artists whose work was displayed in the show won prizes, garnered commissions, and enhanced their prestige. The standards of the juries represented the values of the Acad\u00e9mie, represented by the works of such artists as [[Jean-L\u00e9on G\u00e9r\u00f4me]] and [[Alexandre Cabanel]]. Using an eclectic mix of techniques and formulas established in Western painting since the [[Renaissance]]\u2014such as [[linear perspective]] and figure types derived from [[Ancient_Greek_art#Classical|Classical Greek art]]\u2014these artists produced escapist visions of a reassuringly ordered world.\u003cref\u003eHuyghe (1973), pp. 11, 16\u201317.\u003c\u002fref\u003e By the 1850s, some artists, notably the [[Realism (arts)|Realist]] painter [[Gustave Courbet]], had gained public attention and critical censure by depicting contemporary realities without the idealization demanded by the Acad\u00e9mie.\u003cref\u003eMasan\u00e8s, Fabrice (2006) ''Courbet''. Taschen. pp. 31\u201333. {{ISBN|978-3-8228-5683-3}}.\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+In the early 1860s, four young painters\u2014[[Claude Monet]], [[Pierre-Auguste Renoir]], [[Alfred Sisley]], and [[Fr\u00e9d\u00e9ric Bazille]]\u2014met while studying under the academic artist [[Marc-Charles-Gabriel Gleyre|Charles Gleyre]]. They discovered that they shared an interest in painting landscape and contemporary life rather than historical or mythological scenes. Following a practice\u2014pioneered by artists such as the Englishman [[John Constable]]\u2014\u003cref\u003e{{Cite web |last=Tate |title=Impressionism |url=https:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |access-date=2022-09-30 |website=Tate |language=en-GB |archive-date=30 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220930190904\u002fhttps:\u002f\u002fwww.tate.org.uk\u002fart\u002fart-terms\u002fi\u002fimpressionism |url-status=live }}\u003c\u002fref\u003e that had become increasingly popular by mid-century, they often ventured into the countryside together to paint in the open air.\u003cref\u003eWhite, Harrison C., Cynthia A. White (1993). ''[https:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 Canvases and Careers: Institutional Change in the French Painting World] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20221112131900\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2D_ehhO_14QC&pg=PA116 |date=12 November 2022 }}''. University of Chicago Press. p. 116. {{ISBN|0-226-89487-8}}.\u003c\u002fref\u003e Their purpose was not to make sketches to be developed into carefully finished works in the studio, as was the usual custom, but to complete their paintings out-of-doors.\u003cref\u003eBomford et al. 1990, pp. 21\u201327.\u003c\u002fref\u003e By painting in sunlight directly from nature, and making bold use of the vivid synthetic pigments that had become available since the beginning of the century, they began to develop a lighter and brighter manner of painting that extended further the [[Realism (art movement)|Realism]] of Courbet and the [[Barbizon school]]. A favourite meeting place for the artists was the [[Caf\u00e9 Guerbois]] on Avenue de Clichy in Paris, where the discussions were often led by [[\u00c9douard Manet]], whom the younger artists greatly admired. They were soon joined by [[Camille Pissarro]], [[Paul C\u00e9zanne]], and [[Armand Guillaumin]].\u003cref\u003eGreenspan, Taube G. \"Armand Guillaumin\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg|thumb|left|[[\u00c9douard Manet]], ''[[Le d\u00e9jeuner sur l'herbe|The Luncheon on the Grass]]'' ({{Lang|fr|Le d\u00e9jeuner sur l'herbe}}), 1863]]\u003cbr\u003e \u003cbr\u003e-During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favor of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003eSeiberling, Grace, \"Impressionism\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.\u003cref\u003eDenvir (1990), p.133.\u003c\u002fref\u003e The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e+During the 1860s, the Salon jury routinely rejected about half of the works submitted by Monet and his friends in favour of works by artists faithful to the approved style.\u003cref name=\"Seiberling\"\u003eSeiberling, Grace, \"Impressionism\", ''Grove Art Online. Oxford Art Online'', Oxford University Press.\u003c\u002fref\u003e In 1863, the Salon jury rejected Manet's ''The Luncheon on the Grass'' ({{Lang|fr|[[Le d\u00e9jeuner sur l'herbe]]}}) primarily because it depicted a nude woman with two clothed men at a picnic. While the Salon jury routinely accepted nudes in historical and allegorical paintings, they condemned Manet for placing a realistic nude in a contemporary setting.\u003cref\u003eDenvir (1990), p.133.\u003c\u002fref\u003e The jury's severely worded rejection of Manet's painting appalled his admirers, and the unusually large number of rejected works that year perturbed many French artists.\u003cbr\u003e \u003cbr\u003e After Emperor Napoleon III saw the rejected works of 1863, he decreed that the public be allowed to judge the work themselves, and the [[Salon des Refus\u00e9s]] (Salon of the Refused) w
