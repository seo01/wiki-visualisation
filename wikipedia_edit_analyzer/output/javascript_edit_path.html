s (which terminate statements) to be omitted.\u003cref name=\"Flanagan2006\"\u003e{{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide: The Definitive Guide|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|date=August 17, 2006|publisher=\"O'Reilly Media, Inc.\"|isbn=978-0-596-55447-7|page=16|access-date=March 29, 2019|archive-date=August 1, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200801065235\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Weakly typed===\u003cbr\u003e+=== Weakly typed ===\u003cbr\u003e {{Main|Weakly typed}}\u003cbr\u003e \u003cbr\u003e JavaScript is [[Strong and weak typing|weakly typed]], which means certain types are implicitly cast depending on the operation used.\u003cref name=\"casting_rules\"\u003e{{cite web |last=Korolev |first=Mikhail |date=2019-03-01 |title=JavaScript quirks in one image from the Internet |url=https:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191028204723\u002fhttps:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |archive-date=October 28, 2019 |access-date=October 28, 2019 |website=The DEV Community |language=en}}\u003c\u002fref\u003e\u003cbr\u003e@@ -199,9 +199,9 @@\u003cbr\u003e |\u003ccode\u003e[[NaN]]\u003c\u002fcode\u003e (number)\u003cbr\u003e |}\u003cbr\u003e \u003cbr\u003e-Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. If the expression is wrapped in parentheses - \u003ccode\u003e({} + [])\u003c\u002fcode\u003e - the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-===Dynamic===\u003cbr\u003e+Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. If the expression is wrapped in parentheses - \u003ccode\u003e({} + [])\u003c\u002fcode\u003e \u2013 the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+=== Dynamic ===\u003cbr\u003e {{Main|Dynamic Programming}}\u003cbr\u003e \u003cbr\u003e ==== Typing ====\u003cbr\u003e@@ -213,7 +213,7 @@\u003cbr\u003e {{Main|eval}}\u003cbr\u003e JavaScript includes an \u003ccode\u003e[[eval]]\u003c\u002fcode\u003e function that can execute statements provided as strings at run-time.\u003cbr\u003e \u003cbr\u003e-===Object-orientation (prototype-based)===\u003cbr\u003e+=== Object-orientation (prototype-based) ===\u003cbr\u003e Prototypal inheritance in JavaScript is described by [[Douglas Crockford]] as:\u003cbr\u003e {{Blockquote\u003cbr\u003e |You make prototype objects, and then ... make new instances. Objects are mutable in JavaScript, so we can augment the new instances, giving them new fields and methods. These can then act as prototypes for even newer objects. We don't need classes to make lots of similar objects... Objects inherit from objects. What could be more object oriented than that?\u003cref\u003e{{cite web|last=Crockford|first=Douglas|title=Prototypal Inheritance in JavaScript|url=https:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|access-date=20 August 2013|archive-date=13 August 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130813163035\u002fhttps:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e@@ -236,10 +236,10 @@\u003cbr\u003e \u003cbr\u003e Unlike in many object-oriented languages, in JavaScript there is no distinction between a function definition and a [[method (computer science)|method]] definition. Rather, the distinction occurs during function calling. When a function is called as a method of an object, the function's local ''this'' keyword is bound to that object for that invocation.\u003cbr\u003e \u003cbr\u003e-===Functional===\u003cbr\u003e+=== Functional ===\u003cbr\u003e {{Main|Functional programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript [[Subroutine|functions]] are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Lexical closure ====\u003cbr\u003e {{Main|Closure (computer programming)}}\u003cbr\u003e@@ -253,7 +253,7 @@\u003cbr\u003e \u003cbr\u003e JavaScript also supports [[anonymous function]]s.\u003cbr\u003e \u003cbr\u003e-===Delegative===\u003cbr\u003e+=== Delegative ===\u003cbr\u003e {{Main|Delegation (object-oriented programming)}}\u003cbr\u003e JavaScript supports implicit and explicit [[Delegation (object-oriented programming)|delegation]].\u003cbr\u003e \u003cbr\u003e@@ -265,7 +265,7 @@\u003cbr\u003e ==== Object composition and inheritance ====\u003cbr\u003e Whereas explicit function-based delegation does cover [[Object composition|composition]] in JavaScript, implicit delegation already happens every time the prototype chain is walked in order to, e.g., find a method that might be related to but is not directly owned by an object. Once the method is found it gets called within this object's context. Thus [[Inheritance (object-oriented programming)|inheritance]] in JavaScript is covered by a delegation automatism that is bound to the prototype property of constructor functions.\u003cbr\u003e \u003cbr\u003e-===Miscellaneous===\u003cbr\u003e+=== Miscellaneous ===\u003cbr\u003e ==== Zero-based numbering ====\u003cbr\u003e JavaScript is a [[Zero-based numbering#Usage in programming languages|zero-index]] language.\u003cbr\u003e \u003cbr\u003e@@ -298,17 +298,17 @@\u003cbr\u003e \u003cbr\u003e Async\u002fawait allows an asynchronous, non-blocking function to be structured in a way similar to an ordinary synchronous function. Asynchronous, non-blocking code can be written, with minimal overhead, structured similarly to traditional synchronous, blocking code.\u003cbr\u003e \u003cbr\u003e-===Vendor-specific extensions===\u003cbr\u003e+=== Vendor-specific extensions ===\u003cbr\u003e Historically, some [[JavaScript engine]]s supported these non-standard features:\u003cbr\u003e * conditional \u003ccode\u003ecatch\u003c\u002fcode\u003e clauses (like Java)\u003cbr\u003e * [[List comprehension|array comprehensions]] and generator expressions (like Python)\u003cbr\u003e * concise function expressions (\u003ccode\u003efunction(args) expr\u003c\u002fcode\u003e; this experimental syntax predated arrow functions)\u003cbr\u003e * [[ECMAScript for XML]] (E4X), an extension that adds native XML support to ECMAScript (unsupported in Firefox since version 21\u003cref\u003e{{cite web|title=E4X \u2013 Archive of obsolete content |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fArchive\u002fWeb\u002fE4X|website=Mozilla Developer Network|publisher=Mozilla Foundation|date=February 14, 2014|access-date=July 13, 2014|archive-date=July 24, 2014|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140724100129\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fArchive\u002fWeb\u002fE4X|url-status=dead}}\u003c\u002fref\u003e)\u003cbr\u003e \u003cbr\u003e-==Syntax==\u003cbr\u003e+== Syntax ==\u003cbr\u003e {{Main|JavaScript syntax}}\u003cbr\u003e \u003cbr\u003e-===Simple examples===\u003cbr\u003e+=== Simple examples ===\u003cbr\u003e [[Variable (computer science)|Variables]] in JavaScript can be defined using either the \u003ccode\u003evar\u003c\u002fcode\u003e,\u003cref\u003e{{cite web | url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | title=var \u2013 JavaScript | publisher=The [[Mozilla Developer Network]] | access-date=December 22, 2012 | archive-date=December 23, 2012 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121223162713\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | url-status=live }}\u003c\u002fref\u003e \u003ccode\u003elet\u003c\u002fcode\u003e\u003cref name=\"moz_let\"\u003e{{cite web |title=let |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_let |archive-date=May 28, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190528140803\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |url-status=live }}\u003c\u002fref\u003e or \u003ccode\u003econst\u003c\u002fcode\u003e\u003cref name=\"moz_const\"\u003e{{cite web |title=const |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_const |archive-date=June 28, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180628044054\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |url-status=live }}\u003c\u002fref\u003e keywords.  Variables defined without keywords will be defined at the global scope.\u003cbr\u003e \u003cbr\u003e \u003csyntaxhighlight lang=\"javascript\" start=\"1\"\u003e\u003cbr\u003e@@ -423,7 +423,7 @@\u003cbr\u003e \u003cbr\u003e This example shows that, in JavaScript, [[Closure (computer programming)|function closures]] capture their non-local variables by reference.\u003cbr\u003e \u003cbr\u003e-Arrow functions were first introduced in [[ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition - ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e+Arrow functions were first introduced in [[ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition \u2013 ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e \u003cbr\u003e Example of arrow function:\u003cbr\u003e \u003cbr\u003e@@ -549,7 +549,7 @@\u003cbr\u003e counter.increment(); \u002f\u002f Returns 7\u003cbr\u003e counter.increment(); \u002f\u002f Returns 8\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e- \t\u003cbr\u003e+\u003cbr\u003e [[Generator (computer programming)|Generator]] objects (in the form of generator functions) provide a function which can be called, exited, and re-entered while maintaining internal context (statefulness).\u003cref\u003e{{Cite web |title=function* - JavaScript {{!}} MDN |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002ffunction* |access-date=2022-09-27 |website=developer.mozilla.org |language=en-US}}\u003c\u002fref\u003e\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e function* rawCounter() {\u003cbr\u003e     yield 1;\u003cbr\u003e@@ -631,7 +631,7 @@\u003cbr\u003e \u002f\u002f\u003e 3\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e \u003cbr\u003e-===More advanced example===\u003cbr\u003e+=== More advanced example ===\u003cbr\u003e This sample code displays various JavaScript features.\u003cbr\u003e \u003c!-- Don't try to standardize any styling in this example\u2014its purpose is to showcase language syntax, not provide some standard role model. --\u003e\u003cbr\u003e \u003cbr\u003e@@ -734,7 +734,7 @@\u003cbr\u003e LCMCalculator: a = 22, b = 58, gcd = 2, lcm = 638\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e \u003cbr\u003e-==Security==\u003cbr\u003e+== Security ==\u003cbr\u003e {{See also|Browser security}}\u003cbr\u003e JavaScript and the [[Document Object Model|DOM]] provide the potential for malicious authors to deliver scripts to run on a client computer via the Web. Browser authors minimize this risk using two restrictions. First, scripts run in a [[Sandbox (computer security)|sandbox]] in which they can only perform Web-related actions, not general-purpose programming tasks like creating files. Second, scripts are constrained by the [[same-origin policy]]: scripts from one website do not have access to information such as usernames, passwords, or cookies sent to another site. Most JavaScript-related security bugs are breaches of either the same origin policy or the sandbox.\u003cbr\u003e \u003cbr\u003e@@ -742,7 +742,7 @@\u003cbr\u003e \u003cbr\u003e [[Content Security Policy]] is the main intended method of ensuring that only trusted code is executed on a Web page.\u003cbr\u003e \u003cbr\u003e-===Cross-site scripting===\u003cbr\u003e+=== Cross-site scripting ===\u003cbr\u003e {{Main|Cross-site scripting}}\u003cbr\u003e \u003cbr\u003e A common JavaScript-related security problem is [[cross-site scripting]] (XSS), a violation of the [[same-origin policy]]. XSS vulnerabilities occur when an attacker can cause a target Website, such as an online banking website, to include a malicious script in the webpage presented to a victim. The script in this example can then access the banking application with the privileges of the victim, potentially disclosing secret information or transferring money without the victim's authorization. One important solution to XSS vulnerabilities is [[HTML sanitization]].\u003cbr\u003e@@ -751,7 +751,7 @@\u003cbr\u003e \u003cbr\u003e XSS vulnerabilities can also occur because of implementation mistakes by browser authors.\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |title=Mozilla Cross-Site Scripting Vulnerability Reported and Fixed&nbsp;\u2013 MozillaZine Talkback |website=Mozillazine.org |access-date=February 24, 2017 |archive-date=July 21, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110721230916\u002fhttp:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Cross-site request forgery===\u003cbr\u003e+=== Cross-site request forgery ===\u003cbr\u003e {{Main|Cross-site request forgery}}\u003cbr\u003e \u003cbr\u003e Another cross-site vulnerability is [[cross-site request forgery]] (CSRF). In CSRF, code on an attacker's site tricks the victim's browser into taking actions the user did not intend at a target site (like transferring money at a bank). When target sites rely solely on cookies for request authentication, requests originating from code on the attacker's site can carry the same valid login credentials of the initiating user. In general, the solution to CSRF is to require an authentication value in a hidden form field, and not only in the cookies, to authenticate any request that might have lasting effects. Checking the HTTP Referrer header can also help.\u003cbr\u003e@@ -760,7 +760,7 @@\u003cbr\u003e \u003cbr\u003e * requiring an authentication token in the [[POST (HTTP)|POST]] and [[GET (HTTP)|GET]] parameters for any response that returns private information.\u003cbr\u003e \u003cbr\u003e-===Misplaced trust in the client===\u003cbr\u003e+=== Misplaced trust in the client ===\u003cbr\u003e Developers of client-server applications must recognize that untrusted clients may be under the control of attackers. The application author cannot assume that their JavaScript code will run as intended (or at all) because any secret embedded in the code could be extracted by a determined adversary. Some implications are:\u003cbr\u003e * Website authors cannot perfectly conceal how their JavaScript operates because the raw source code must be sent to the client. The code can be [[obfuscated code|obfuscated]], but obfuscation can be reverse-engineered.\u003cbr\u003e * JavaScript form validation only provides convenience for users, not security. If a site verifies that the user agreed to its terms of service, or filters invalid characters out of fields that should only contain numbers, it must do so on the server, not only the client.\u003cbr\u003e@@ -768,10 +768,10 @@\u003cbr\u003e * It is considered very bad practice to embed sensitive information such as passwords in JavaScript because it can be extracted by an attacker.\u003cref\u003e{{cite web |last1=Rehorik |first1=Jan |title=Why You Should Never Put Sensitive Data in Your JavaScript |url=https:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |website=ServiceObjects Blog |date=29 November 2016 |publisher=ServiceObjects |access-date=June 3, 2019 |archive-date=June 3, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190603142957\u002fhttps:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e * [[Prototype pollution]] is a runtime vulnerability in which attackers can overwrite arbitrary properties in an object's prototype.\u003cbr\u003e \u003cbr\u003e-===Misplaced trust in developers===\u003cbr\u003e-Package management systems such as [[npm (software)|npm]] and Bower are popular with JavaScript developers. Such systems allow a developer to easily manage their program's dependencies upon other developers' program libraries. Developers trust that the maintainers of the libraries will keep them secure and up to date, but that is not always the case. A vulnerability has emerged because of this blind trust. Relied-upon libraries can have new releases that cause bugs or vulnerabilities to appear in all programs that rely upon the libraries. Inversely, a library can go unpatched with known vulnerabilities out in the wild. In a study done looking over a sample of 133,000 websites, researchers found 37% of the websites included a library with at least one known vulnerability.\u003cref name=\"jslibs\"\u003e{{citation |last1=Lauinger |first1=Tobias |last2=Chaabane |first2=Abdelberi |last3=Arshad |first3=Sajjad |last4=Robertson |first4=William |last5=Wilson |first5=Christo |last6=Kirda |first6=Engin |title=Thou Shalt Not Depend on Me: Analysing the Use of Outdated JavaScript Libraries on the Web |url=https:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |website=Northeastern University |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170329045344\u002fhttps:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |archive-date=29 March 2017 |doi = 10.14722\u002fndss.2017.23414 |date = December 21, 2016|arxiv=1811.00918 |isbn=978-1-891562-46-4 |s2cid=17885720 |url-status=dead}}\u003c\u002fref\u003e \"The median lag between the oldest library version used on each website and the newest available version of that library is 1,177 days in ALEXA, and development of some libraries still in active use ceased years ago.\"\u003cref name=\"jslibs\"\u002f\u003e Another possibility is that the maintainer of a library may remove the library entirely. This occurred in March 2016 when Azer Ko\u00e7ulu removed his repository from npm. This caused tens of thousands of programs and websites depending upon his libraries to break.\u003cref\u003e{{cite news |work=Quartz |url=https:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |title=How one programmer broke the internet by deleting a tiny piece of code |first=Keith |last=Collins |date=March 27, 2016 |access-date=February 22, 2017 |archive-date=February 22, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170222200836\u002fhttps:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003eSC Magazine UK, [https:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f Developer's 11 lines of deleted code 'breaks the internet'] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170223041434\u002fhttps:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f |date=February 23, 2017 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-===Browser and plugin coding errors===\u003cbr\u003e+=== Misplaced trust in developers ===\u003cbr\u003e+Package management systems such as [[npm (software)|npm]] and Bower are popular with JavaScript developers. Such systems allow a developer to easily manage their program's dependencies upon other developers' program libraries. Developers trust that the maintainers of the libraries will keep them secure and up to date, but that is not always the case. A vulnerability has emerged because of this blind trust. Relied-upon libraries can have new releases that cause bugs or vulnerabilities to appear in all programs that rely upon the libraries. Inversely, a library can go unpatched with known vulnerabilities out in the wild. In a study done looking over a sample of 133,000 websites, researchers found 37% of the websites included a library with at least one known vulnerability.\u003cref name=\"jslibs\"\u003e{{citation |last1=Lauinger |first1=Tobias |last2=Chaabane |first2=Abdelberi |last3=Arshad |first3=Sajjad |last4=Robertson |first4=William |last5=Wilson |first5=Christo |last6=Kirda |first6=Engin |title=Thou Shalt Not Depend on Me: Analysing the Use of Outdated JavaScript Libraries on the Web |url=https:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |website=Northeastern University |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170329045344\u002fhttps:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |archive-date=29 March 2017 |doi = 10.14722\u002fndss.2017.23414 |date = December 21, 2016|arxiv=1811.00918 |isbn=978-1-891562-46-4 |s2cid=17885720 |url-status=dead}}\u003c\u002fref\u003e \"The median lag between the oldest library version used on each website and the newest available version of that library is 1,177 days in ALEXA, and development of some libraries still in active use ceased years ago.\"\u003cref name=\"jslibs\" \u002f\u003e Another possibility is that the maintainer of a library may remove the library entirely. This occurred in March 2016 when Azer Ko\u00e7ulu removed his repository from npm. This caused tens of thousands of programs and websites depending upon his libraries to break.\u003cref\u003e{{cite news |work=Quartz |url=https:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |title=How one programmer broke the internet by deleting a tiny piece of code |first=Keith |last=Collins |date=March 27, 2016 |access-date=February 22, 2017 |archive-date=February 22, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170222200836\u002fhttps:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003eSC Magazine UK, [https:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f Developer's 11 lines of deleted code 'breaks the internet'] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170223041434\u002fhttps:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f |date=February 23, 2017 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Browser and plugin coding errors ===\u003cbr\u003e {{Further|Buffer overflow}}\u003cbr\u003e JavaScript provides an interface to a wide range of browser capabilities, some of which may have flaws such as [[buffer overflow]]s. These flaws can allow attackers to write scripts that would run any code they wish on the user's system. This code is not by any means limited to another JavaScript application. For example, a buffer overrun exploit can allow an attacker to gain access to the operating system's [[API]] with superuser privileges.\u003cbr\u003e \u003cbr\u003e@@ -781,21 +781,21 @@\u003cbr\u003e \u003cbr\u003e In Windows Vista, Microsoft has attempted to contain the risks of bugs such as buffer overflows by running the Internet Explorer process with limited privileges.\u003cref\u003e{{cite web |url=https:\u002f\u002fblogs.msdn.com\u002fie\u002farchive\u002f2006\u002f02\u002f09\u002f528963.aspx |title=Protected Mode in Vista IE7 \u2013 IEBlog |website=Blogs.msdn.com |date=February 9, 2006 |access-date=February 24, 2017 |archive-date=January 23, 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100123103719\u002fhttps:\u002f\u002fblogs.msdn.com\u002fie\u002farchive\u002f2006\u002f02\u002f09\u002f528963.aspx |url-status=live }}\u003c\u002fref\u003e [[Google Chrome]] similarly confines its page renderers to their own \"[[Sandbox (computer security)|sandbox]]\".\u003cbr\u003e \u003cbr\u003e-===Sandbox implementation errors===\u003cbr\u003e+=== Sandbox implementation errors ===\u003cbr\u003e Web browsers are capable of running JavaScript outside the sandbox, with the privileges necessary to, for example, create or delete files. Such privileges are not intended to be granted to code from the Web.\u003cbr\u003e \u003cbr\u003e Incorrectly granting privileges to JavaScript from the Web has played a role in vulnerabilities in both Internet Explorer\u003cref\u003eUS CERT, [https:\u002f\u002fwww.kb.cert.org\u002fvuls\u002fid\u002f713878 Vulnerability Note VU#713878: Microsoft Internet Explorer does not properly validate source of redirected frame] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20091030051811\u002fhttps:\u002f\u002fwww.kb.cert.org\u002fvuls\u002fid\u002f713878\u002f |date=2009-10-30 }}\u003c\u002fref\u003e and Firefox.\u003cref\u003eMozilla Foundation, [https:\u002f\u002fwww.mozilla.org\u002fsecurity\u002fannounce\u002f2005\u002fmfsa2005-41.html Mozilla Foundation Security Advisory 2005\u201341: Privilege escalation via DOM property overrides] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140604014832\u002fhttps:\u002f\u002fwww.mozilla.org\u002fsecurity\u002fannounce\u002f2005\u002fmfsa2005-41.html |date=2014-06-04 }}\u003c\u002fref\u003e In Windows XP Service Pack 2, Microsoft demoted JScript's privileges in Internet Explorer.\u003cref\u003e{{cite web |last=Andersen |first=Starr |date=2004-08-09 |url=https:\u002f\u002fdocs.microsoft.com\u002fen-us\u002fprevious-versions\u002fwindows\u002fit-pro\u002fwindows-xp\u002fbb457150(v=technet.10) |title=Part 5: Enhanced Browsing Security |department=[[Microsoft TechNet|TechNet]] |website=[[Microsoft Docs]] |series=Changes to Functionality in Windows XP Service Pack 2 |access-date=2021-10-20}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Microsoft Windows]] allows JavaScript source files on a computer's hard drive to be launched as general-purpose, non-sandboxed programs (see: [[Windows Script Host]]). This makes JavaScript (like [[VBScript]]) a theoretically viable vector for a [[Trojan horse (computing)|Trojan horse]], although JavaScript Trojan horses are uncommon in practice.\u003cref\u003eFor one example of a rare JavaScript Trojan Horse, see Symantec Corporation, [https:\u002f\u002fwww.symantec.com\u002fsecurity_response\u002fwriteup.jsp?docid=2003-100111-0931-99 JS.Seeker.K] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110913210848\u002fhttp:\u002f\u002fwww.symantec.com\u002fsecurity_response\u002fwriteup.jsp?docid=2003-100111-0931-99 |date=2011-09-13 }}\u003c\u002fref\u003e{{failed verification|date=March 2017}}\u003cbr\u003e \u003cbr\u003e-===Hardware vulnerabilities===\u003cbr\u003e+=== Hardware vulnerabilities ===\u003cbr\u003e In 2015, a JavaScript-based proof-of-concept implementation of a [[rowhammer]] attack was described in a paper by security researchers.\u003cref\u003e{{cite arXiv | eprint = 1507.06955 | title = Rowhammer.js: A Remote Software-Induced Fault Attack in JavaScript | date = July 24, 2015 | last1 = Gruss | first1 = Daniel | last2 = Maurice | first2 = Cl\u00e9mentine | last3 = Mangard | first3 = Stefan | class = cs.CR }}\u003c\u002fref\u003e\u003cref\u003e{{cite news |work=Motherboard |publisher=[[Vice (magazine)|Vice]] |title=Rowhammer.js Is the Most Ingenious Hack I've Ever Seen |first=Alix |last=Jean-Pharuns |date=July 30, 2015 |url=https:\u002f\u002fmotherboard.vice.com\u002fen_us\u002farticle\u002f9akpwz\u002frowhammerjs-is-the-most-ingenious-hack-ive-ever-seen |access-date=January 26, 2018 |archive-date=January 27, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180127084042\u002fhttps:\u002f\u002fmotherboard.vice.com\u002fen_us\u002farticle\u002f9akpwz\u002frowhammerjs-is-the-most-ingenious-hack-ive-ever-seen |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|website=[[Ars Technica]]|title=DRAM 'Bitflipping' exploit for attacking PCs: Just add JavaScript|first=Dan|last=Goodin|date=August 4, 2015|url=https:\u002f\u002farstechnica.com\u002finformation-technology\u002f2015\u002f08\u002fdram-bitflipping-exploit-for-attacking-pcs-just-add-javascript\u002f|access-date=January 26, 2018|archive-date=January 27, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180127143154\u002fhttps:\u002f\u002farstechnica.com\u002finformation-technology\u002f2015\u002f08\u002fdram-bitflipping-exploit-for-attacking-pcs-just-add-javascript\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url = https:\u002f\u002fwww.slate.com\u002farticles\u002ftechnology\u002fbitwise\u002f2015\u002f07\u002frowhammer_security_exploit_why_a_new_security_attack_is_truly_terrifying.html | title = Rowhammer security exploit: Why a new security attack is truly terrifying | date = July 28, 2015 | access-date = July 29, 2015 | first = David | last = Auerbach | author-link = David Auerbach | website = slate.com | archive-date = July 30, 2015 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20150730004023\u002fhttps:\u002f\u002fwww.slate.com\u002farticles\u002ftechnology\u002fbitwise\u002f2015\u002f07\u002frowhammer_security_exploit_why_a_new_security_attack_is_truly_terrifying.html | url-status = live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2017, a JavaScript-based attack via browser was demonstrated that could bypass [[Address space layout randomization|ASLR]]. It is called \"ASLR\u2295Cache\" or AnC.\u003cref\u003e[https:\u002f\u002fwww.vusec.net\u002fprojects\u002fanc\u002f AnC] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170316055626\u002fhttps:\u002f\u002fwww.vusec.net\u002fprojects\u002fanc\u002f |date=2017-03-16 }} VUSec, 2017\u003c\u002fref\u003e\u003cref\u003e[https:\u002f\u002farstechnica.com\u002fsecurity\u002f2017\u002f02\u002fnew-aslr-busting-javascript-is-about-to-make-drive-by-exploits-much-nastier\u002f New ASLR-busting JavaScript is about to make drive-by exploits much nastier] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170316024419\u002fhttps:\u002f\u002farstechnica.com\u002fsecurity\u002f2017\u002f02\u002fnew-aslr-busting-javascript-is-about-to-make-drive-by-exploits-much-nastier\u002f |date=2017-03-16 }} Ars Technica, 2017\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2018, the paper that announced the [[Spectre (security vulnerability)|Spectre]] attacks against Speculative Execution in Intel and other processors included a JavaScript implementation.\u003cref\u003e[https:\u002f\u002fspectreattack.com\u002fspectre.pdf Spectre Attack] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180103225843\u002fhttps:\u002f\u002fspectreattack.com\u002fspectre.pdf |date=2018-01-03 }} Spectre Attack\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Development tools==\u003cbr\u003e+== Development tools ==\u003cbr\u003e Important tools have evolved with the language.\u003cbr\u003e \u003cbr\u003e * Every major web browser has built-in [[web development tools]], including a JavaScript [[debugger]].\u003cbr\u003e@@ -803,41 +803,41 @@\u003cbr\u003e * Some browsers have built-in [[Profiling (computer programming)|profilers]]. Stand-alone profiling libraries have also been created, such as benchmark.js and jsbench.\u003cref\u003e{{cite web|url=https:\u002f\u002fbenchmarkjs.com\u002f|title=Benchmark.js|website=benchmarkjs.com|access-date=2016-11-06|archive-date=2016-12-19|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20161219182724\u002fhttps:\u002f\u002fbenchmarkjs.com\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref name=\"auto1\"\u003e{{cite web|url=https:\u002f\u002fjsben.ch|title=JSBEN.CH Performance Benchmarking Playground for JavaScript|last=JSBEN.CH|website=jsben.ch|access-date=2021-08-13|archive-date=2021-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210227052409\u002fhttps:\u002f\u002fjsben.ch\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Many [[text editor]]s have syntax highlighting support for JavaScript code.\u003cbr\u003e \u003cbr\u003e-==Related technologies==\u003cbr\u003e-===Java===\u003cbr\u003e+== Related technologies ==\u003cbr\u003e+=== Java ===\u003cbr\u003e A common misconception is that JavaScript is directly related to [[Java (programming language)|Java]].\u003c!-- While one is intentionally similar to the other, they're different. (Previously the misconception sentence said \"JavaScript is similar to Java\" but that's not a misconception) --\u003e Both indeed have a C-like syntax (the C language being their most immediate common ancestor language). They are also typically [[Sandbox (computer security)|sandboxed]], and JavaScript was designed with Java's syntax and standard library in mind. In particular, all Java keywords were reserved in original JavaScript, JavaScript's standard library follows Java's naming conventions, and JavaScript's {{code|lang=javascript|code=Math}} and {{code|lang=javascript|code=Date}} objects are based on classes from Java 1.0.\u003cref name=\"popularity\"\u003e{{cite web | url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f | title=Popularity | first=Brendan | last=Eich | author-link=Brendan Eich | date=April 3, 2008 | access-date=January 19, 2012 | archive-date=July 3, 2011 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110703020955\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Both languages first appeared in 1995, but Java was developed by [[James Gosling]] of Sun Microsystems and JavaScript by [[Brendan Eich]] of Netscape Communications.\u003cbr\u003e \u003cbr\u003e The differences between the two languages are more prominent than their similarities. Java has [[static typing]], while JavaScript's typing is [[Dynamic typing|dynamic]]. Java is loaded from [[Compiler|compiled]] bytecode, while JavaScript is loaded as human-readable source code. Java's objects are [[Class-based programming|class-based]], while JavaScript's are [[Prototype-based programming|prototype-based]]. Finally, Java did not support functional programming until Java 8, while JavaScript has done so from the beginning, being influenced by [[Scheme (programming language)|Scheme]].\u003cbr\u003e \u003cbr\u003e-===JSON===\u003cbr\u003e+=== JSON ===\u003cbr\u003e [[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely used format supported by many other programming languages.\u003cbr\u003e \u003cbr\u003e-===Transpilers===\u003cbr\u003e+=== Transpilers ===\u003cbr\u003e Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |access-date=February 6, 2020 |archive-date=January 31, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200131233044\u002fhttps:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[TypeScript]] and [[CoffeeScript]] are two notable languages that transpile to JavaScript.\u003cbr\u003e \u003cbr\u003e-===WebAssembly===\u003cbr\u003e+=== WebAssembly ===\u003cbr\u003e [[WebAssembly]] is a newer language with a [[bytecode]] format designed to complement JavaScript, especially the performance-critical portions of [[web page]] scripts. All of the major [[JavaScript engine]]s support WebAssembly,\u003cref\u003e{{cite web|url=https:\u002f\u002fvisualstudiomagazine.com\u002farticles\u002f2017\u002f11\u002f06\u002fedge-webassembly.aspx|title=Edge Browser Switches WebAssembly to 'On' -- Visual Studio Magazine|website=Visual Studio Magazine|access-date=2018-02-09|archive-date=2018-02-10|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180210002432\u002fhttps:\u002f\u002fvisualstudiomagazine.com\u002farticles\u002f2017\u002f11\u002f06\u002fedge-webassembly.aspx|url-status=live}}\u003c\u002fref\u003e which runs in the same [[Sandbox (computer security)|sandbox]] as regular JavaScript code.\u003cbr\u003e \u003cbr\u003e [[asm.js]] is a subset of JavaScript that served as the forerunner of WebAssembly.\u003cref\u003e{{cite web | url=https:\u002f\u002fasmjs.org\u002ffaq.html | title=frequently asked questions | publisher=asm.js | access-date=April 13, 2014 | archive-date=June 4, 2014 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140604012024\u002fhttps:\u002f\u002fasmjs.org\u002ffaq.html | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==References==\u003cbr\u003e+== References ==\u003cbr\u003e {{Reflist}}\u003cbr\u003e \u003cbr\u003e-==Sources==\u003cbr\u003e+== Sources ==\u003cbr\u003e * {{cite news |last=Dere |first=Mohan |date=2017-12-21|title=How to integrate create-react-app with all the libraries you need to make a great app |language=en-US |work=freeCodeCamp |url=https:\u002f\u002fmedium.freecodecamp.org\u002fintegrating-create-react-app-redux-react-router-redux-observable-bootstrap-altogether-216db97e89a3 |access-date=2018-06-14}}\u003cbr\u003e * {{cite news |last=Panchal |first=Krunal |date=2022-04-26 |title=Angular vs React Detailed Comparison |language=en-US |work=Groovy Web |url=https:\u002f\u002fwww.groovyweb.co\u002fblog\u002fangular-vs-react-detail-comparison |access-date=2023-06-05}}\u003cbr\u003e \u003cbr\u003e-==Further reading==\u003cbr\u003e+== Further reading ==\u003cbr\u003e {{See also|ECMAScript#External_links|l1=ECMAScript Specification Documents}}\u003cbr\u003e * Flanagan, David. ''JavaScript: The Definitive Guide''. 7th edition. Sebastopol, California: O'Reilly, 2020. {{isbn|978-1-491-95202-3}}.\u003cbr\u003e * Haverbeke, Marijn. ''Eloquent JavaScript''. 3rd edition. No Starch Press, 2018. 472 pages. {{ISBN|978-1593279509}}.\u003csmall\u003e[https:\u002f\u002feloquentjavascript.net\u002f ''(download)'']\u003c\u002fsmall\u003e\u003cbr\u003e * Zakas, Nicholas. ''Principles of Object-Oriented JavaScript'', 1st edition. No Starch Press, 2014. 120 pages. {{ISBN|978-1593275402}}.\u003cbr\u003e \u003cbr\u003e-==External links==\u003cbr\u003e+== External links ==\u003cbr\u003e {{sister project links|commons=Category:JavaScript|n=no|v=Topic:JavaScript|q=no|s=no|m=no|voy=no|species=no|mw=JavaScript}}\u003cbr\u003e {{Spoken Wikipedia|En-JavaScript.ogg|date=August 20, 2013}}\u003cbr\u003e * [https:\u002f\u002fjavascript.info\u002f The Modern JavaScript Tutorial]. A community maintained continuously updated collection of tutorials on the entirety of the language.","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -79,7 +79,7 @@\u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e \u003cbr\u003e === Reaching maturity ===\u003cbr\u003e-Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript]] 6 in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180318064130\u002fhttps:\u002f\u002fes6-features.org\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript]] 6 in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180318064130\u002fhttps:\u002f\u002fes6-features.org\u002f |url-status=usurped }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The creation of [[Node.js]] in 2009 by [[Ryan Dahl]] sparked a significant increase in the usage of JavaScript outside of web browsers. Node combines the [[V8 (JavaScript engine)|V8]] engine, an [[event loop]], and [[Input\u002foutput|I\u002fO]] [[Application programming interface|APIs]], thereby providing a stand-alone JavaScript runtime system.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&q=nodejs Professional Node.js: Building JavaScript Based Scalable Software] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170324021220\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&printsec=frontcover&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-24 }}, John Wiley & Sons, 01-Oct-2012\u003c\u002fref\u003e\u003cref name=\"b3\"\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&dq=nodejs&pg=PT24 Sams Teach Yourself Node.js in 24 Hours] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170323192039\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&pg=PT24&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-23 }}, Sams Publishing, 05-Sep-2012\u003c\u002fref\u003e As of 2018, Node had been used by millions of developers,\u003cref\u003e{{cite web |last1=Lawton |first1=George |title=The secret history behind the success of npm and Node |url=https:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |website=TheServerSide |access-date=2 August 2021 |date=19 July 2018 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165613\u002fhttps:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |url-status=live }}\u003c\u002fref\u003e and [[npm (software)|npm]] had the most modules of any [[package manager]] in the world.\u003cref\u003e{{cite web |last1=Brown |first1=Paul |title=State of the Union: npm |url=https:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |website=Linux.com |access-date=2 August 2021 |date=13 January 2017 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165614\u002fhttps:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 8\u003cbr\u003e+++ Revision 9\u003cbr\u003e@@ -79,7 +79,7 @@\u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e \u003cbr\u003e === Reaching maturity ===\u003cbr\u003e-Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript]] 6 in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\
