nagan|2006|p=141}} \u003cbr\u003e \u003cbr\u003e ==== Anonymous function ====\u003cbr\u003e {{Main|Anonymous function}}\u003cbr\u003e \u003cbr\u003e JavaScript also supports [[anonymous function]]s.\u003cbr\u003e \u003cbr\u003e-=== Delegative ===\u003cbr\u003e+===Delegative===\u003cbr\u003e {{Main|Delegation (object-oriented programming)}}\u003cbr\u003e JavaScript supports implicit and explicit [[Delegation (object-oriented programming)|delegation]].\u003cbr\u003e \u003cbr\u003e ==== Functions as roles (Traits and Mixins) ====\u003cbr\u003e {{Main|Role-oriented programming|Traits (computer science)|Mixin}}\u003cbr\u003e \u003cbr\u003e-JavaScript natively supports various function-based implementations of [[Role-oriented programming|Role]]\u003cref\u003e[https:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins The many talents of JavaScript for generalizing Role-Oriented Programming approaches like Traits and Mixins] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171005050713\u002fhttps:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins |date=2017-10-05 }}, Peterseliger.blogspot.de, April 11, 2014.\u003c\u002fref\u003e patterns like [[Traits (computer science)|Traits]]\u003cref\u003e[https:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f Traits for JavaScript] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140724052500\u002fhttps:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f |date=2014-07-24 }}, 2010.\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fcocktailjs.github.io\u002f |title=Home &#124; CocktailJS |website=Cocktailjs.github.io |access-date=February 24, 2017 |archive-date=February 4, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170204083608\u002fhttps:\u002f\u002fcocktailjs.github.io\u002f |url-status=live }}\u003c\u002fref\u003e and [[Mixin]]s.\u003cref\u003e{{cite web |url-status=live |first1=Angus |last1=Croll |url=https:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |title=A fresh look at JavaScript Mixins |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200415004603\u002fhttps:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |archive-date=2020-04-15 |date=May 31, 2011 |website= JavaScript, JavaScript\u2026 }}\u003c\u002fref\u003e Such a function defines additional behavior by at least one method bound to the \u003ccode\u003ethis\u003c\u002fcode\u003e keyword within its \u003ccode\u003efunction\u003c\u002fcode\u003e body. A Role then has to be delegated explicitly via \u003ccode\u003ecall\u003c\u002fcode\u003e or \u003ccode\u003eapply\u003c\u002fcode\u003e to objects that need to feature additional behavior that is not shared via the prototype chain.\u003cbr\u003e+JavaScript natively supports various function-based implementations of [[Role-oriented programming|Role]]\u003cref\u003e[https:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins The many talents of JavaScript for generalizing Role-Oriented Programming approaches like Traits and Mixins] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171005050713\u002fhttps:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins |date=2017-10-05 }}, Peterseliger.blogpsot.de, April 11, 2014.\u003c\u002fref\u003e patterns like [[Traits (computer science)|Traits]]\u003cref\u003e[https:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f Traits for JavaScript] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140724052500\u002fhttps:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f |date=2014-07-24 }}, 2010.\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fcocktailjs.github.io\u002f |title=Home &#124; CocktailJS |website=Cocktailjs.github.io |access-date=February 24, 2017 |archive-date=February 4, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170204083608\u002fhttps:\u002f\u002fcocktailjs.github.io\u002f |url-status=live }}\u003c\u002fref\u003e and [[Mixin]]s.\u003cref\u003e{{cite web |url-status=live |first1=Angus |last1=Croll |url=https:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |title=A fresh look at JavaScript Mixins |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200415004603\u002fhttps:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |archive-date=2020-04-15 |date=May 31, 2011 |website= JavaScript, JavaScript\u2026 }}\u003c\u002fref\u003e Such a function defines additional behavior by at least one method bound to the \u003ccode\u003ethis\u003c\u002fcode\u003e keyword within its \u003ccode\u003efunction\u003c\u002fcode\u003e body. A Role then has to be delegated explicitly via \u003ccode\u003ecall\u003c\u002fcode\u003e or \u003ccode\u003eapply\u003c\u002fcode\u003e to objects that need to feature additional behavior that is not shared via the prototype chain.\u003cbr\u003e \u003cbr\u003e ==== Object composition and inheritance ====\u003cbr\u003e Whereas explicit function-based delegation does cover [[Object composition|composition]] in JavaScript, implicit delegation already happens every time the prototype chain is walked in order to, e.g., find a method that might be related to but is not directly owned by an object. Once the method is found it gets called within this object's context. Thus [[Inheritance (object-oriented programming)|inheritance]] in JavaScript is covered by a delegation automatism that is bound to the prototype property of constructor functions.\u003cbr\u003e \u003cbr\u003e-=== Miscellaneous ===\u003cbr\u003e+===Miscellaneous===\u003cbr\u003e ==== Zero-based numbering ====\u003cbr\u003e JavaScript is a [[Zero-based numbering#Usage in programming languages|zero-index]] language.\u003cbr\u003e \u003cbr\u003e@@ -313,34 +291,34 @@\u003cbr\u003e ==== Regular expressions ====\u003cbr\u003e {{Main|Regular expression}}\u003cbr\u003e \u003cbr\u003e-JavaScript supports [[regular expression]]s for text searches and manipulation.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e+In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.\u003cref\u003e{{cite book | last=Haverbeke | first=Marijn | title=Eloquent JavaScript | year=2011 | publisher=No Starch Press|isbn=978-1-59327-282-1|pages=139\u2013149 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA139 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e-JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}\u003cbr\u003e+JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{cn|date=August 2023}} \u003cbr\u003e \u003cbr\u003e ===== Promises =====\u003cbr\u003e {{Main|Futures and promises}}\u003cbr\u003e \u003cbr\u003e-A built-in Promise object provides functionality for handling promises and associating handlers with an asynchronous action's eventual result. JavaScript supplies combinator methods, which allow developers to combine multiple JavaScript promises and do operations based on different scenarios. The methods introduced are: Promise.race, Promise.all, Promise.allSettled and Promise.any.\u003cbr\u003e+A built-in Promise object provides functionality for handling promises and associating handlers with an asynchronous action's eventual result. Recently, the JavaScript specification introduced combinator methods, which allow developers to combine multiple JavaScript promises and do operations based on different scenarios. The methods introduced are: Promise.race, Promise.all, Promise.allSettled and Promise.any.\u003cbr\u003e \u003cbr\u003e ===== Async\u002fawait =====\u003cbr\u003e {{Main|Async\u002fawait}}\u003cbr\u003e \u003cbr\u003e Async\u002fawait allows an asynchronous, non-blocking function to be structured in a way similar to an ordinary synchronous function. Asynchronous, non-blocking code can be written, with minimal overhead, structured similarly to traditional synchronous, blocking code.\u003cbr\u003e \u003cbr\u003e-=== Vendor-specific extensions ===\u003cbr\u003e+===Vendor-specific extensions===\u003cbr\u003e Historically, some [[JavaScript engine]]s supported these non-standard features:\u003cbr\u003e+* conditional \u003ccode\u003ecatch\u003c\u002fcode\u003e clauses (like Java)\u003cbr\u003e * [[List comprehension|array comprehensions]] and generator expressions (like Python)\u003cbr\u003e * concise function expressions (\u003ccode\u003efunction(args) expr\u003c\u002fcode\u003e; this experimental syntax predated arrow functions)\u003cbr\u003e * [[ECMAScript for XML]] (E4X), an extension that adds native XML support to ECMAScript (unsupported in Firefox since version 21\u003cref\u003e{{cite web|title=E4X \u2013 Archive of obsolete content |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fArchive\u002fWeb\u002fE4X|website=Mozilla Developer Network|publisher=Mozilla Foundation|date=February 14, 2014|access-date=July 13, 2014|archive-date=July 24, 2014|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140724100129\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fArchive\u002fWeb\u002fE4X|url-status=dead}}\u003c\u002fref\u003e)\u003cbr\u003e \u003cbr\u003e-== Syntax ==\u003cbr\u003e+==Syntax==\u003cbr\u003e {{Main|JavaScript syntax}}\u003cbr\u003e+\u003cbr\u003e+===Simple examples===\u003cbr\u003e [[Variable (computer science)|Variables]] in JavaScript can be defined using either the \u003ccode\u003evar\u003c\u002fcode\u003e,\u003cref\u003e{{cite web | url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | title=var \u2013 JavaScript | publisher=The [[Mozilla Developer Network]] | access-date=December 22, 2012 | archive-date=December 23, 2012 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121223162713\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | url-status=live }}\u003c\u002fref\u003e \u003ccode\u003elet\u003c\u002fcode\u003e\u003cref name=\"moz_let\"\u003e{{cite web |title=let |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_let |archive-date=May 28, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190528140803\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |url-status=live }}\u003c\u002fref\u003e or \u003ccode\u003econst\u003c\u002fcode\u003e\u003cref name=\"moz_const\"\u003e{{cite web |title=const |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_const |archive-date=June 28, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180628044054\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |url-status=live }}\u003c\u002fref\u003e keywords.  Variables defined without keywords will be defined at the global scope.\u003cbr\u003e \u003cbr\u003e-Arrow functions were first introduced in [[w:ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition \u2013 ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e-\u003cbr\u003e-Here is an example of JavaScript syntax.\u003cbr\u003e \u003csyntaxhighlight lang=\"javascript\" start=\"1\"\u003e\u003cbr\u003e \u002f\u002f Declares a function-scoped variable named `x`, and implicitly assigns the\u003cbr\u003e \u002f\u002f special value `undefined` to it. Variables without value are automatically\u003cbr\u003e@@ -378,9 +356,393 @@\u003cbr\u003e \u003cbr\u003e Note the [[Comment (computer programming)|comments]] in the examples above, all of which were preceded with two [[Slash (punctuation)|forward slashes]].\u003cbr\u003e \u003cbr\u003e-More examples can be found at the [[wikibooks:JavaScript\u002fSyntax examples|Wikibooks page on JavaScript syntax examples]].\u003cbr\u003e-\u003cbr\u003e-== Security ==\u003cbr\u003e+There is no built-in [[Input\u002foutput]] functionality in JavaScript, instead it is provided by the run-time environment. The ECMAScript specification in edition 5.1 mentions that \"there are no provisions in this specification for input of external data or output of computed results\".\u003cref\u003e{{cite web| url=https:\u002f\u002fwww.ecma-international.org\u002fecma-262\u002f5.1\u002f#sec-4| title=ECMAScript Language Specification \u2013 ECMA-262 Edition 5.1| publisher=[[Ecma International]]| access-date=December 22, 2012| archive-date=November 26, 2012| archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121126044218\u002fhttps:\u002f\u002fecma-international.org\u002fecma-262\u002f5.1\u002f#sec-4| url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+However, most runtime environments have a \u003ccode\u003econsole\u003c\u002fcode\u003e object that can be used to print output.\u003cref\u003e{{cite web|title=console|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fDOM\u002fconsole|work=Mozilla Developer Network|publisher=[[Mozilla]]|access-date=April 6, 2013|archive-date=February 28, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130228112150\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fDOM\u002fconsole|url-status=live}}\u003c\u002fref\u003e Here is a minimalist [[\"Hello, World!\" program]] in JavaScript in a runtime environment with a console object:\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+console.log(\"Hello, World!\");\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+In HTML documents, a program like this is required for an output:\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+\u002f\u002f Text nodes can be made using the \"write\" method.\u003cbr\u003e+\u002f\u002f This is frowned upon, as it can overwrite the document if the document is fully loaded.\u003cbr\u003e+document.write('foo');\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Elements can be made too. First, they have to be created in the DOM.\u003cbr\u003e+const myElem = document.createElement('span');\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Attributes like classes and the id can be set as well\u003cbr\u003e+myElem.classList.add('foo');\u003cbr\u003e+myElem.id = 'bar';\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f After setting this, the tag will look like this: `\u003cspan class=\"foo\" id=\"bar\" data-attr=\"baz\"\u003e\u003c\u002fspan\u003e`\u003cbr\u003e+myElem.setAttribute('data-attr', 'baz'); \u002f\u002f Which could also be written as `myElem.dataset.attr = 'baz'`\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Finally append it as a child element to the \u003cbody\u003e in the HTML\u003cbr\u003e+document.body.appendChild(myElem);\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Elements can be imperatively grabbed with querySelector for one element, or querySelectorAll for multiple elements that can be looped with forEach\u003cbr\u003e+document.querySelector('.class'); \u002f\u002f Selects the first element with the \"class\" class\u003cbr\u003e+document.querySelector('#id'); \u002f\u002f Selects the first element with an `id` of \"id\"\u003cbr\u003e+document.querySelector('[data-other]'); \u002f\u002f Selects the first element with the \"data-other\" attribute\u003cbr\u003e+document.querySelectorAll('.multiple'); \u002f\u002f Returns an Array-like NodeList of all elements with the \"multiple\" class\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003eA simple [[Recursion (computer science)|recursive]] function to calculate the [[factorial]] of a [[natural number]]:\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+function factorial(n) {\u003cbr\u003e+    \u002f\u002f Checking the argument for legitimacy. Factorial is defined for positive integers.\u003cbr\u003e+    if (isNaN(n)) {\u003cbr\u003e+        console.error(\"Non-numerical argument not allowed.\");\u003cbr\u003e+        return NaN; \u002f\u002f The special value: Not a Number\u003cbr\u003e+    }\u003cbr\u003e+    if (n === 0)\u003cbr\u003e+        return 1; \u002f\u002f 0! = 1\u003cbr\u003e+    if (n \u003c 0)\u003cbr\u003e+        return undefined; \u002f\u002f Factorial of negative numbers is not defined.\u003cbr\u003e+    if (n % 1) {\u003cbr\u003e+        console.warn(`${n} will be rounded to the closest integer. For non-integers consider using gamma function instead.`);\u003cbr\u003e+        n = Math.round(n);\u003cbr\u003e+    }\u003cbr\u003e+    \u002f\u002f The above checks need not be repeated in the recursion, hence defining the actual recursive part separately below.\u003cbr\u003e+\u003cbr\u003e+    \u002f\u002f The following line is a function expression to recursively compute the factorial. It uses the arrow syntax introduced in ES6.\u003cbr\u003e+    const recursivelyCompute = a =\u003e a \u003e 1 ? a * recursivelyCompute(a - 1) : 1; \u002f\u002f Note the use of the ternary operator `?`.\u003cbr\u003e+    return recursivelyCompute(n);\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+factorial(3); \u002f\u002f Returns 6\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+An [[anonymous function]] (or lambda):\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+const counter = function() {\u003cbr\u003e+    let count = 0;\u003cbr\u003e+    return function() {\u003cbr\u003e+        return ++count;\u003cbr\u003e+    }\u003cbr\u003e+};\u003cbr\u003e+\u003cbr\u003e+const x = counter();\u003cbr\u003e+x(); \u002f\u002f Returns 1\u003cbr\u003e+x(); \u002f\u002f Returns 2\u003cbr\u003e+x(); \u002f\u002f Returns 3\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+This example shows that, in JavaScript, [[Closure (computer programming)|function closures]] capture their non-local variables by reference.\u003cbr\u003e+\u003cbr\u003e+Arrow functions were first introduced in [[ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition - ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e+\u003cbr\u003e+Example of arrow function:\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+\u002f\u002f Arrow functions let us omit the `function` keyword.\u003cbr\u003e+\u002f\u002f Here `long_example` points to an anonymous function value.\u003cbr\u003e+const long_example = (input1, input2) =\u003e {\u003cbr\u003e+    console.log(\"Hello, World!\");\u003cbr\u003e+    const output = input1 + input2;\u003cbr\u003e+\u003cbr\u003e+    return output;\u003cbr\u003e+};\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f If there are no braces, the arrow function simply returns the expression\u003cbr\u003e+\u002f\u002f So here it's (input1 + input2)\u003cbr\u003e+const short_example = (input1, input2) =\u003e input1 + input2;\u003cbr\u003e+\u003cbr\u003e+long_example(2, 3); \u002f\u002f Prints \"Hello, World!\" and returns 5\u003cbr\u003e+short_example(2, 5);  \u002f\u002f Returns 7\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f If an arrow function has only one parameter, the parentheses can be removed.\u003cbr\u003e+const no_parentheses = input =\u003e input + 2;\u003cbr\u003e+\u003cbr\u003e+no_parentheses(3); \u002f\u002f Returns 5\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f An arrow function, like other function definitions, can be executed in the same statement as they are created.\u003cbr\u003e+\u002f\u002f This is useful when writing libraries to avoid filling the global scope, and for closures.\u003cbr\u003e+let three = ((a, b) =\u003e a + b) (1, 2);\u003cbr\u003e+\u003cbr\u003e+const generate_multiplier_function = a =\u003e (b =\u003e isNaN(b) || !b ? a : a*=b);\u003cbr\u003e+const five_multiples = generate_multiplier_function(5); \u002f\u002f The supplied argument \"seeds\" the expression and is retained by a.\u003cbr\u003e+five_multiples(1); \u002f\u002f Returns 5\u003cbr\u003e+five_multiples(3); \u002f\u002f Returns 15\u003cbr\u003e+five_multiples(4); \u002f\u002f Returns 60\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+In JavaScript, [[Object (computer science)|objects]] can be created as [[Instance (computer science)|instances]] of a [[class (computer science)|class]].\u003cbr\u003e+\u003cbr\u003e+Object class example:\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+class Ball {\u003cbr\u003e+\u003cbr\u003e+   constructor(radius) {\u003cbr\u003e+      this.radius = radius;\u003cbr\u003e+      this.area = Math.PI * ( radius ** 2 );\u003cbr\u003e+   }\u003cbr\u003e+\u003cbr\u003e+   \u002f\u002f Classes (and thus objects) can contain functions known as methods\u003cbr\u003e+   show() {\u003cbr\u003e+      console.log(this.radius);\u003cbr\u003e+   }\u003cbr\u003e+};\u003cbr\u003e+\u003cbr\u003e+const myBall = new Ball(5); \u002f\u002f Creates a new instance of the ball object with radius 5\u003cbr\u003e+myBall.radius++; \u002f\u002f Object properties can usually be modified from the outside\u003cbr\u003e+myBall.show();   \u002f\u002f Using the inherited \"show\" function logs \"6\"\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+In JavaScript, [[Object (computer science)|objects]] can be instantiated directly from a function.\u003cbr\u003e+\u003cbr\u003e+Object functional example:\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+function Ball(radius) {\u003cbr\u003e+\u003cbr\u003e+   const area = Math.PI * ( radius ** 2 );\u003cbr\u003e+   const obj = { radius, area };\u003cbr\u003e+\u003cbr\u003e+   \u002f\u002f Objects are mutable, and functions can be added as properties.\u003cbr\u003e+   obj.show = () =\u003e console.log(obj.radius);\u003cbr\u003e+   return obj;\u003cbr\u003e+};\u003cbr\u003e+\u003cbr\u003e+const myBall = Ball(5); \u002f\u002f Creates a new ball object with radius 5. No \"new\" keyword needed.\u003cbr\u003e+myBall.radius++; \u002f\u002f The instance property can be modified.\u003cbr\u003e+myBall.show();   \u002f\u002f Using the \"show\" function logs \"6\" - the new instance value.\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+[[Variadic function]] demonstration (\u003ccode\u003earguments\u003c\u002fcode\u003e is a special [[variable (programming)|variable]]):\u003cref\u003e{{cite web|title=arguments|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fFunctions_and_function_scope\u002farguments|work=Mozilla Developer Network|publisher=[[Mozilla]]|access-date=April 6, 2013|archive-date=April 13, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130413230225\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fFunctions_and_function_scope\u002farguments|url-status=live}}\u003c\u002fref\u003e\u003c!-- What about spread syntax? https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fOperators\u002fSpread_syntax --\u003e\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+function sum() {\u003cbr\u003e+    let x = 0;\u003cbr\u003e+\u003cbr\u003e+    for (let i = 0; i \u003c arguments.length; ++i)\u003cbr\u003e+        x += arguments[i];\u003cbr\u003e+\u003cbr\u003e+    return x;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+sum(1, 2); \u002f\u002f Returns 3\u003cbr\u003e+sum(1, 2, 3); \u002f\u002f Returns 6\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f As of ES6, using the rest operator.\u003cbr\u003e+function sum(...args) {\u003cbr\u003e+    return args.reduce((a, b) =\u003e a + b);\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+sum(1, 2); \u002f\u002f Returns 3\u003cbr\u003e+sum(1, 2, 3); \u002f\u002f Returns 6\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+[[Immediately-invoked function expression]]s are often used to create closures. Closures allow gathering properties and methods in a namespace and making some of them private:\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+let counter = (function() {\u003cbr\u003e+    let i = 0; \u002f\u002f Private property\u003cbr\u003e+\u003cbr\u003e+    return {   \u002f\u002f Public methods\u003cbr\u003e+        get: function() {\u003cbr\u003e+            alert(i);\u003cbr\u003e+        },\u003cbr\u003e+        set: function(value) {\u003cbr\u003e+            i = value;\u003cbr\u003e+        },\u003cbr\u003e+        increment: function() {\u003cbr\u003e+            alert(++i);\u003cbr\u003e+        }\u003cbr\u003e+    };\u003cbr\u003e+})(); \u002f\u002f Module\u003cbr\u003e+\u003cbr\u003e+counter.get(); \u002f\u002f Returns 0\u003cbr\u003e+counter.set(6);\u003cbr\u003e+counter.increment(); \u002f\u002f Returns 7\u003cbr\u003e+counter.increment(); \u002f\u002f Returns 8\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+ \t\u003cbr\u003e+[[Generator (computer programming)|Generator]] objects (in the form of generator functions) provide a function which can be called, exited, and re-entered while maintaining internal context (statefulness).\u003cref\u003e{{Cite web |title=function* - JavaScript {{!}} MDN |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002ffunction* |access-date=2022-09-27 |website=developer.mozilla.org |language=en-US}}\u003c\u002fref\u003e\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+function* rawCounter() {\u003cbr\u003e+    yield 1;\u003cbr\u003e+    yield 2;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+function* dynamicCounter() {\u003cbr\u003e+    let count = 0;\u003cbr\u003e+    while (true) {\u003cbr\u003e+        \u002f\u002f It is not recommended to utilize while true loops in most cases.\u003cbr\u003e+        yield ++count;\u003cbr\u003e+    }\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Instances\u003cbr\u003e+const counter1 = rawCounter();\u003cbr\u003e+const counter2 = dynamicCounter();\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Implementation\u003cbr\u003e+counter1.next(); \u002f\u002f {value: 1, done: false}\u003cbr\u003e+counter1.next(); \u002f\u002f {value: 2, done: false}\u003cbr\u003e+counter1.next(); \u002f\u002f {value: undefined, done: true}\u003cbr\u003e+\u003cbr\u003e+counter2.next(); \u002f\u002f {value: 1, done: false}\u003cbr\u003e+counter2.next(); \u002f\u002f {value: 2, done: false}\u003cbr\u003e+counter2.next(); \u002f\u002f {value: 3, done: false}\u003cbr\u003e+\u002f\u002f ...infinitely\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+JavaScript can export and import from modules:\u003cref name=\"moz_modules\"\u003e{{cite web |title=JavaScript modules |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fGuide\u002fModules |website=MDN Web Docs |publisher=Mozilla |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220717083604\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fGuide\u002fModules |archive-date=17 July 2022 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Export example:\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+\u002f* mymodule.js *\u002f\u003cbr\u003e+\u002f\u002f This function remains private, as it is not exported\u003cbr\u003e+let sum = (a, b) =\u003e {\u003cbr\u003e+    return a + b;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Export variables\u003cbr\u003e+export let name = 'Alice';\u003cbr\u003e+export let age = 23;\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Export named functions\u003cbr\u003e+export function add(num1, num2) {\u003cbr\u003e+    return num1 + num2;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Export class\u003cbr\u003e+export class Multiplication {\u003cbr\u003e+    constructor(num1, num2) {\u003cbr\u003e+        this.num1 = num1;\u003cbr\u003e+        this.num2 = num2;\u003cbr\u003e+    }\u003cbr\u003e+\u003cbr\u003e+    add() {\u003cbr\u003e+        return sum(this.num1, this.num2);\u003cbr\u003e+    }\u003cbr\u003e+}\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+Import example:\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+\u002f\u002f Import one property\u003cbr\u003e+import { add } from '.\u002fmymodule.js';\u003cbr\u003e+console.log(add(1, 2));\u003cbr\u003e+\u002f\u002f\u003e 3\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Import multiple properties\u003cbr\u003e+import { name, age } from '.\u002fmymodule.js';\u003cbr\u003e+console.log(name, age);\u003cbr\u003e+\u002f\u002f\u003e \"Alice\", 23\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Import all properties from a module\u003cbr\u003e+import * from '.\u002fmodule.js'\u003cbr\u003e+console.log(name, age);\u003cbr\u003e+\u002f\u002f\u003e \"Alice\", 23\u003cbr\u003e+console.log(add(1,2));\u003cbr\u003e+\u002f\u002f\u003e 3\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+===More advanced example===\u003cbr\u003e+This sample code displays various JavaScript features.\u003cbr\u003e+\u003c!-- Don't try to standardize any styling in this example\u2014its purpose is to showcase language syntax, not provide some standard role model. --\u003e\u003cbr\u003e+\u003cbr\u003e+\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+\u002f* Finds the lowest common multiple (LCM) of two numbers *\u002f\u003cbr\u003e+function LCMCalculator(x, y) { \u002f\u002f constructor function\u003cbr\u003e+    if (isNaN(x*y)) throw new TypeError(\"Non-numeric arguments not allowed.\");\u003cbr\u003e+    const checkInt = function(x) { \u002f\u002f inner function\u003cbr\u003e+        if (x % 1 !== 0)\u003cbr\u003e+            throw new TypeError(x + \"is not an integer\");\u003cbr\u003e+\u003cbr\u003e+        return x;\u003cbr\u003e+    };\u003cbr\u003e+\u003cbr\u003e+    this.a = checkInt(x)\u003cbr\u003e+    \u002f\u002f   semicolons   ^^^^  are optional, a newline is enough\u003cbr\u003e+    this.b = checkInt(y);\u003cbr\u003e+}\u003cbr\u003e+\u002f\u002f The prototype of object instances created by a constructor is\u003cbr\u003e+\u002f\u002f that constructor's \"prototype\" property.\u003cbr\u003e+LCMCalculator.prototype = { \u002f\u002f object literal\u003cbr\u003e+    constructor: LCMCalculator, \u002f\u002f when reassigning a prototype, set the constructor property appropriately\u003cbr\u003e+    gcd: function() { \u002f\u002f method that calculates the greatest common divisor\u003cbr\u003e+        \u002f\u002f Euclidean algorithm:\u003cbr\u003e+        let a = Math.abs(this.a), b = Math.abs(this.b), t;\u003cbr\u003e+\u003cbr\u003e+        if (a \u003c b) {\u003cbr\u003e+            \u002f\u002f swap variables\u003cbr\u003e+            \u002f\u002f t = b; b = a; a = t;\u003cbr\u003e+            [a, b] = [b, a]; \u002f\u002f swap using destructuring assignment (ES6)\u003cbr\u003e+        }\u003cbr\u003e+\u003cbr\u003e+        while (b !== 0) {\u003cbr\u003e+            t = b;\u003cbr\u003e+            b = a % b;\u003cbr\u003e+            a = t;\u003cbr\u003e+        }\u003cbr\u003e+\u003cbr\u003e+        \u002f\u002f Only need to calculate GCD once, so \"redefine\" this method.\u003cbr\u003e+        \u002f\u002f (Actually not redefinition\u2014it's defined on the instance itself,\u003cbr\u003e+        \u002f\u002f so that this.gcd refers to this \"redefinition\" instead of LCMCalculator.prototype.gcd.\u003cbr\u003e+        \u002f\u002f Note that this leads to a wrong result if the LCMCalculator object members \"a\" and\u002for \"b\" are altered afterwards.)\u003cbr\u003e+        \u002f\u002f Also, 'gcd' === \"gcd\", this['gcd'] === this.gcd\u003cbr\u003e+        this['gcd'] = function() {\u003cbr\u003e+            return a;\u003cbr\u003e+        };\u003cbr\u003e+\u003cbr\u003e+        return a;\u003cbr\u003e+    },\u003cbr\u003e+\u003cbr\u003e+    \u002f\u002f Object property names can be specified by strings delimited by double (\") or single (') quotes.\u003cbr\u003e+    \"lcm\": function() {\u003cbr\u003e+        \u002f\u002f Variable names do not collide with object properties, e.g., |lcm| is not |this.lcm|.\u003cbr\u003e+        \u002f\u002f not using |this.a*this.b| to avoid FP precision issues\u003cbr\u003e+        let lcm = this.a \u002f this.gcd() * this.b;\u003cbr\u003e+\u003cbr\u003e+        \u002f\u002f Only need to calculate lcm once, so \"redefine\" this method.\u003cbr\u003e+        this.lcm = function() {\u003cbr\u003e+            return lcm;\u003cbr\u003e+        };\u003cbr\u003e+\u003cbr\u003e+        return lcm;\u003cbr\u003e+    },\u003cbr\u003e+\u003cbr\u003e+    \u002f\u002f Methods can also be declared using ES6 syntax\u003cbr\u003e+    toString() {\u003cbr\u003e+        \u002f\u002f Using both ES6 template literals and the (+) operator to concatenate values\u003cbr\u003e+        return `LCMCalculator: a = ${this.a}, b = ` + this.b;\u003cbr\u003e+    }\u003cbr\u003e+};\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Define generic output function; this implementation only works for Web browsers\u003cbr\u003e+function output(x) {\u003cbr\u003e+    document.body.appendChild(document.createTextNode(x));\u003cbr\u003e+    document.body.appendChild(document.createElement('br'));\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+\u002f\u002f Note: Array's map() and forEach() are defined in JavaScript 1.6.\u003cbr\u003e+\u002f\u002f They are used here to demonstrate JavaScript's inherent functional nature.\u003cbr\u003e+[\u003cbr\u003e+    [25, 55],\u003cbr\u003e+    [21, 56],\u003cbr\u003e+    [22, 58],\u003cbr\u003e+    [28, 56]\u003cbr\u003e+].map(function(pair) { \u002f\u002f array literal + mapping function\u003cbr\u003e+    return new LCMCalculator(pair[0], pair[1]);\u003cbr\u003e+}).sort((a, b) =\u003e a.lcm() - b.lcm()) \u002f\u002f sort with this comparative function; =\u003e is a shorthand form of a function, called \"arrow function\"\u003cbr\u003e+    .forEach(printResult);\u003cbr\u003e+\u003cbr\u003e+function printResult(obj) {\u003cbr\u003e+    output(obj + \", gcd = \" + obj.gcd() + \", lcm = \" + obj.lcm());\u003cbr\u003e+}\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+The following output should be displayed in the browser window.\u003cbr\u003e+\u003csyntaxhighlight lang=\"output\"\u003e\u003cbr\u003e+LCMCalculator: a = 28, b = 56, gcd = 28, lcm = 56\u003cbr\u003e+LCMCalculator: a = 21, b = 56, gcd = 7, lcm = 168\u003cbr\u003e+LCMCalculator: a = 25, b = 55, gcd = 5, lcm = 275\u003cbr\u003e+LCMCalculator: a = 22, b = 58, gcd = 2, lcm = 638\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+\u003cbr\u003e+==Security==\u003cbr\u003e {{See also|Browser security}}\u003cbr\u003e JavaScript and the [[Document Object Model|DOM]] provide the potential for malicious authors to deliver scripts to run on a client computer via the Web. Browser authors minimize this risk using two restrictions. First, scripts run in a [[Sandbox (computer security)|sandbox]] in which they can only perform Web-related actions, not general-purpose programming tasks like creating files. Second, scripts are constrained by the [[same-origin policy]]: scripts from one website do not have access to information such as usernames, passwords, or cookies sent to another site. Most JavaScript-related security bugs are breaches of either the same origin policy or the sandbox.\u003cbr\u003e \u003cbr\u003e@@ -388,7 +750,10 @@\u003cbr\u003e \u003cbr\u003e [[Content Security Policy]] is the main intended method of ensuring that only trusted code is executed on a Web page.\u003cbr\u003e \u003cbr\u003e-=== Cross-site scripting ===\u003cbr\u003e+===Cross-site vulnerabilities===\u003cbr\u003e+{{Main|Cross-site scripting|Cross-site request forgery}}\u003cbr\u003e+\u003cbr\u003e+====Cross-site scripting====\u003cbr\u003e {{Main|Cross-site scripting}}\u003cbr\u003e \u003cbr\u003e A common JavaScript-related security problem is [[cross-site scripting]] (XSS), a violation of the [[same-origin policy]]. XSS vulnerabilities occur when an attacker can cause a target Website, such as an online banking website, to include a malicious script in the webpage presented to a victim. The script in this example can then access the banking application with the privileges of the victim, potentially disclosing secret information or transferring money without the victim's authorization. One important solution to XSS vulnerabilities is [[HTML sanitization]].\u003cbr\u003e@@ -397,7 +762,7 @@\u003cbr\u003e \u003cbr\u003e XSS vulnerabilities can also occur because of implementation mistakes by browser authors.\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |title=Mozilla Cross-Site Scripting Vulnerability Reported and Fixed&nbsp;\u2013 MozillaZine Talkback |website=Mozillazine.org |access-date=February 24, 2017 |archive-date=July 21, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110721230916\u002fhttp:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Cross-site request forgery ===\u003cbr\u003e+====Cross-site request forgery====\u003cbr\u003e {{Main|Cross-site request forgery}}\u003cbr\u003e \u003cbr\u003e Another cross-site vulnerability is [[cross-site request forgery]] (CSRF). In CSRF, code on an attacker's site tricks the victim's browser into taking actions the user did not intend at a target site (like transferring money at a bank). When target sites rely solely on cookies for request authentication, requests originating from code on the attacker's site can carry the same valid login credentials of the initiating user. In general, the solution to CSRF is to require an authentication value in a hidden form field, and not only in the cookies, to authenticate any request that might have lasting effects. Checking the HTTP Referrer header can also help.\u003cbr\u003e@@ -406,18 +771,17 @@\u003cbr\u003e \u003cbr\u003e * requiring an authentication token in the [[POST (HTTP)|POST]] and [[GET (HTTP)|GET]] parameters for any response that returns private information.\u003cbr\u003e \u003cbr\u003e-=== Misplaced trust in the client ===\u003cbr\u003e-Developers of client-server applications must recognize that untrusted clients may be under the control of attackers. The author of an application should not assume that their JavaScript code will run as intended (or at all) because any secret embedded in the code could be extracted by a determined adversary. Some implications are:\u003cbr\u003e+===Misplaced trust in the client===\u003cbr\u003e+Developers of client-server applications must recognize that untrusted clients may be under the control of attackers. The application author cannot assume that their JavaScript code will run as intended (or at all) because any secret embedded in the code could be extracted by a determined adversary. Some implications are:\u003cbr\u003e * Website authors cannot perfectly conceal how their JavaScript operates because the raw source code must be sent to the client. The code can be [[obfuscated code|obfuscated]], but obfuscation can be reverse-engineered.\u003cbr\u003e * JavaScript form validation only provides convenience for users, not security. If a site verifies that the user agreed to its terms of service, or filters invalid characters out of fields that should only contain numbers, it must do so on the server, not only the client.\u003cbr\u003e * Scripts can be selectively disabled, so JavaScript cannot be relied on to prevent operations such as right-clicking on an image to save it.\u003cref\u003e{{cite web |last1=Kottelin |first1=Thor |title=Right-click \"protection\"? Forget about it |url=https:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |website=blog.anta.net |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110809195359\u002fhttps:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |archive-date=9 August 2011 |date=17 June 2008}}\u003c\u002fref\u003e\u003cbr\u003e * It is considered very bad practice to embed sensitive information such as passwords in JavaScript because it can be extracted by an attacker.\u003cref\u003e{{cite web |last1=Rehorik |first1=Jan |title=Why You Should Never Put Sensitive Data in Your JavaScript |url=https:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |website=ServiceObjects Blog |date=29 November 2016 |publisher=ServiceObjects |access-date=June 3, 2019 |archive-date=June 3, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190603142957\u002fhttps:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-* [[Prototype pollution]] is a runtime vulnerability in which attackers can overwrite arbitrary properties in an object's prototype.\u003cbr\u003e-\u003cbr\u003e-=== Misplaced trust in developers ===\u003cbr\u003e-Package management systems such as [[npm (software)|npm]] and Bower are popular with JavaScript developers. Such systems allow a developer to easily manage their program's dependencies upon other developers' program libraries. Developers trust that the maintainers of the libraries will keep them secure and up to date, but that is not always the case. A vulnerability has emerged because of this blind trust. Relied-upon libraries can have new releases that cause bugs or vulnerabilities to appear in all programs that rely upon the libraries. Inversely, a library can go unpatched with known vulnerabilities out in the wild. In a study done looking over a sample of 133,000 websites, researchers found 37% of the websites included a library with at least one known vulnerability.\u003cref name=\"jslibs\"\u003e{{citation |last1=Lauinger |first1=Tobias |last2=Chaabane |first2=Abdelberi |last3=Arshad |first3=Sajjad |last4=Robertson |first4=William |last5=Wilson |first5=Christo |last6=Kirda |first6=Engin |title=Thou Shalt Not Depend on Me: Analysing the Use of Outdated JavaScript Libraries on the Web |url=https:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |website=Northeastern University |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170329045344\u002fhttps:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |archive-date=29 March 2017 |doi = 10.14722\u002fndss.2017.23414 |date = December 21, 2016|arxiv=1811.00918 |isbn=978-1-891562-46-4 |s2cid=17885720 |url-status=dead}}\u003c\u002fref\u003e \"The median lag between the oldest library version used on each website and the newest available version of that library is 1,177 days in ALEXA, and development of some libraries still in active use ceased years ago.\"\u003cref name=\"jslibs\" \u002f\u003e Another possibility is that the maintainer of a library may remove the library entirely. This occurred in March 2016 when Azer Ko\u00e7ulu removed his repository from npm. This caused tens of thousands of programs and websites depending upon his libraries to break.\u003cref\u003e{{cite news |work=Quartz |url=https:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |title=How one programmer broke the internet by deleting a tiny piece of code |first=Keith |last=Collins |date=March 27, 2016 |access-date=February 22, 2017 |archive-date=February 22, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170222200836\u002fhttps:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003eSC Magazine UK, [https:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f Developer's 11 lines of deleted code 'breaks the internet'] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170223041434\u002fhttps:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f |date=February 23, 2017 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Browser and plugin coding errors ===\u003cbr\u003e+\u003cbr\u003e+===Misplaced trust in developers===\u003cbr\u003e+Package management systems such as [[npm (software)|npm]] and Bower are popular with JavaScript developers. Such systems allow a developer to easily manage their program's dependencies upon other developers' program libraries. Developers trust that the maintainers of the libraries will keep them secure and up to date, but that is not always the case. A vulnerability has emerged because of this blind trust. Relied-upon libraries can have new releases that cause bugs or vulnerabilities to appear in all programs that rely upon the libraries. Inversely, a library can go unpatched with known vulnerabilities out in the wild. In a study done looking over a sample of 133,000 websites, researchers found 37% of the websites included a library with at least one known vulnerability.\u003cref name=\"jslibs\"\u003e{{citation |last1=Lauinger |first1=Tobias |last2=Chaabane |first2=Abdelberi |last3=Arshad |first3=Sajjad |last4=Robertson |first4=William |last5=Wilson |first5=Christo |last6=Kirda |first6=Engin |title=Thou Shalt Not Depend on Me: Analysing the Use of Outdated JavaScript Libraries on the Web |url=https:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |website=Northeastern University |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170329045344\u002fhttps:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |archive-date=29 March 2017 |doi = 10.14722\u002fndss.2017.23414 |date = December 21, 2016|arxiv=1811.00918 |isbn=978-1-891562-46-4 |s2cid=17885720 |url-status=dead}}\u003c\u002fref\u003e \"The median lag between the oldest library version used on each website and the newest available version of that library is 1,177 days in ALEXA, and development of some libraries still in active use ceased years ago.\"\u003cref name=\"jslibs\"\u002f\u003e Another possibility is that the maintainer of a library may remove the library entirely. This occurred in March 2016 when Azer Ko\u00e7ulu removed his repository from npm. This caused tens of thousands of programs and websites depending upon his libraries to break.\u003cref\u003e{{cite news |work=Quartz |url=https:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |title=How one programmer broke the internet by deleting a tiny piece of code |first=Keith |last=Collins |date=March 27, 2016 |access-date=February 22, 2017 |archive-date=February 22, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170222200836\u002fhttps:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003eSC Magazine UK, [https:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f Developer's 11 lines of deleted code 'breaks the internet'] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170223041434\u002fhttps:\u002f\u002fwww.scmagazineuk.com\u002fdevelopers-11-lines-of-deleted-code-breaks-the-internet\u002farticle\u002f532050\u002f |date=February 23, 2017 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Browser and plugin coding errors===\u003cbr\u003e {{Further|Buffer overflow}}\u003cbr\u003e JavaScript provides an interface to a wide range of browser capabilities, some of which may have flaws such as [[buffer overflow]]s. These flaws can allow attackers to write scripts that would run any code they wish on the user's system. This code is not by any means limited to another JavaScript application. For example, a buffer overrun exploit can allow an attacker to gain access to the operating system's [[API]] with superuser privileges.\u003cbr\u003e \u003cbr\u003e@@ -427,21 +791,21 @@\u003cbr\u003e \u003cbr\u003e In Windows Vista, Microsoft has attempted to contain the risks of bugs such as buffer overflows by running the Internet Explorer process with limited privileges.\u003cref\u003e{{cite web |url=https:\u002f\u002fblogs.msdn.com\u002fie\u002farchive\u002f2006\u002f02\u002f09\u002f528963.aspx |title=Protected Mode in Vista IE7 \u2013 IEBlog |website=Blogs.msdn.com |date=February 9, 2006 |access-date=February 24, 2017 |archive-date=January 23, 2010 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20100123103719\u002fhttps:\u002f\u002fblogs.msdn.com\u002fie\u002farchive\u002f2006\u002f02\u002f09\u002f528963.aspx |url-status=live }}\u003c\u002fref\u003e [[Google Chrome]] similarly confines its page renderers to their own \"[[Sandbox (computer security)|sandbox]]\".\u003cbr\u003e \u003cbr\u003e-=== Sandbox implementation errors ===\u003cbr\u003e+===Sandbox implementation errors===\u003cbr\u003e Web browsers are capable of running JavaScript outside the sandbox, with the privileges necessary to, for example, create or delete files. Such privileges are not intended to be granted to code from the Web.\u003cbr\u003e \u003cbr\u003e Incorrectly granting privileges to JavaScript from the Web has played a role in vulnerabilities in both Internet Explorer\u003cref\u003eUS CERT, [https:\u002f\u002fwww.kb.cert.org\u002fvuls\u002fid\u002f713878 Vulnerability Note VU#713878: Microsoft Internet Explorer does not properly validate source of redirected frame] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20091030051811\u002fhttps:\u002f\u002fwww.kb.cert.org\u002fvuls\u002fid\u002f713878\u002f |date=2009-10-30 }}\u003c\u002fref\u003e and Firefox.\u003cref\u003eMozilla Foundation, [https:\u002f\u002fwww.mozilla.org\u002fsecurity\u002fannounce\u002f2005\u002fmfsa2005-41.html Mozilla Foundation Security Advisory 2005\u201341: Privilege escalation via DOM property overrides] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140604014832\u002fhttps:\u002f\u002fwww.mozilla.org\u002fsecurity\u002fannounce\u002f2005\u002fmfsa2005-41.html |date=2014-06-04 }}\u003c\u002fref\u003e In Windows XP Service Pack 2, Microsoft demoted JScript's privileges in Internet Explorer.\u003cref\u003e{{cite web |last=Andersen |first=Starr |date=2004-08-09 |url=https:\u002f\u002fdocs.microsoft.com\u002fen-us\u002fprevious-versions\u002fwindows\u002fit-pro\u002fwindows-xp\u002fbb457150(v=technet.10) |title=Part 5: Enhanced Browsing Security |department=[[Microsoft TechNet|TechNet]] |website=[[Microsoft Docs]] |series=Changes to Functionality in Windows XP Service Pack 2 |access-date=2021-10-20}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Microsoft Windows]] allows JavaScript source files on a computer's hard drive to be launched as general-purpose, non-sandboxed programs (see: [[Windows Script Host]]). This makes JavaScript (like [[VBScript]]) a theoretically viable vector for a [[Trojan horse (computing)|Trojan horse]], although JavaScript Trojan horses are uncommon in practice.\u003cref\u003eFor one example of a rare JavaScript Trojan Horse, see Symantec Corporation, [https:\u002f\u002fwww.symantec.com\u002fsecurity_response\u002fwriteup.jsp?docid=2003-100111-0931-99 JS.Seeker.K] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110913210848\u002fhttp:\u002f\u002fwww.symantec.com\u002fsecurity_response\u002fwriteup.jsp?docid=2003-100111-0931-99 |date=2011-09-13 }}\u003c\u002fref\u003e{{failed verification|date=March 2017}}\u003cbr\u003e \u003cbr\u003e-=== Hardware vulnerabilities ===\u003cbr\u003e+===Hardware vulnerabilities===\u003cbr\u003e In 2015, a JavaScript-based proof-of-concept implementation of a [[rowhammer]] attack was described in a paper by security researchers.\u003cref\u003e{{cite arXiv | eprint = 1507.06955 | title = Rowhammer.js: A Remote Software-Induced Fault Attack in JavaScript | date = July 24, 2015 | last1 = Gruss | first1 = Daniel | last2 = Maurice | first2 = Cl\u00e9mentine | last3 = Mangard | first3 = Stefan | class = cs.CR }}\u003c\u002fref\u003e\u003cref\u003e{{cite news |work=Motherboard |publisher=[[Vice (magazine)|Vice]] |title=Rowhammer.js Is the Most Ingenious Hack I've Ever Seen |first=Alix |last=Jean-Pharuns |date=July 30, 2015 |url=https:\u002f\u002fmotherboard.vice.com\u002fen_us\u002farticle\u002f9akpwz\u002frowhammerjs-is-the-most-ingenious-hack-ive-ever-seen |access-date=January 26, 2018 |archive-date=January 27, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180127084042\u002fhttps:\u002f\u002fmotherboard.vice.com\u002fen_us\u002farticle\u002f9akpwz\u002frowhammerjs-is-the-most-ingenious-hack-ive-ever-seen |url-status=live }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|website=[[Ars Technica]]|title=DRAM 'Bitflipping' exploit for attacking PCs: Just add JavaScript|first=Dan|last=Goodin|date=August 4, 2015|url=https:\u002f\u002farstechnica.com\u002finformation-technology\u002f2015\u002f08\u002fdram-bitflipping-exploit-for-attacking-pcs-just-add-javascript\u002f|access-date=January 26, 2018|archive-date=January 27, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180127143154\u002fhttps:\u002f\u002farstechnica.com\u002finformation-technology\u002f2015\u002f08\u002fdram-bitflipping-exploit-for-attacking-pcs-just-add-javascript\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url = https:\u002f\u002fwww.slate.com\u002farticles\u002ftechnology\u002fbitwise\u002f2015\u002f07\u002frowhammer_security_exploit_why_a_new_security_attack_is_truly_terrifying.html | title = Rowhammer security exploit: Why a new security attack is truly terrifying | date = July 28, 2015 | access-date = July 29, 2015 | first = David | last = Auerbach | author-link = David Auerbach | website = slate.com | archive-date = July 30, 2015 | archive-url = https:\u002f\u002fweb.archive.org\u002fweb\u002f20150730004023\u002fhttps:\u002f\u002fwww.slate.com\u002farticles\u002ftechnology\u002fbitwise\u002f2015\u002f07\u002frowhammer_security_exploit_why_a_new_security_attack_is_truly_terrifying.html | url-status = live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2017, a JavaScript-based attack via browser was demonstrated that could bypass [[Address space layout randomization|ASLR]]. It is called \"ASLR\u2295Cache\" or AnC.\u003cref\u003e[https:\u002f\u002fwww.vusec.net\u002fprojects\u002fanc\u002f AnC] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170316055626\u002fhttps:\u002f\u002fwww.vusec.net\u002fprojects\u002fanc\u002f |date=2017-03-16 }} VUSec, 2017\u003c\u002fref\u003e\u003cref\u003e[https:\u002f\u002farstechnica.com\u002fsecurity\u002f2017\u002f02\u002fnew-aslr-busting-javascript-is-about-to-make-drive-by-exploits-much-nastier\u002f New ASLR-busting JavaScript is about to make drive-by exploits much nastier] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170316024419\u002fhttps:\u002f\u002farstechnica.com\u002fsecurity\u002f2017\u002f02\u002fnew-aslr-busting-javascript-is-about-to-make-drive-by-exploits-much-nastier\u002f |date=2017-03-16 }} Ars Technica, 2017\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2018, the paper that announced the [[Spectre (security vulnerability)|Spectre]] attacks against Speculative Execution in Intel and other processors included a JavaScript implementation.\u003cref\u003e[https:\u002f\u002fspectreattack.com\u002fspectre.pdf Spectre Attack] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180103225843\u002fhttps:\u002f\u002fspectreattack.com\u002fspectre.pdf |date=2018-01-03 }} Spectre Attack\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-== Development tools ==\u003cbr\u003e+==Development tools==\u003cbr\u003e Important tools have evolved with the language.\u003cbr\u003e \u003cbr\u003e * Every major web browser has built-in [[web development tools]], including a JavaScript [[debugger]].\u003cbr\u003e@@ -449,40 +813,44 @@\u003cbr\u003e * Some browsers have built-in [[Profiling (computer programming)|profilers]]. Stand-alone profiling libraries have also been created, such as benchmark.js and jsbench.\u003cref\u003e{{cite web|url=https:\u002f\u002fbenchmarkjs.com\u002f|title=Benchmark.js|website=benchmarkjs.com|access-date=2016-11-06|archive-date=2016-12-19|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20161219182724\u002fhttps:\u002f\u002fbenchmarkjs.com\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref name=\"auto1\"\u003e{{cite web|url=https:\u002f\u002fjsben.ch|title=JSBEN.CH Performance Benchmarking Playground for JavaScript|last=JSBEN.CH|website=jsben.ch|access-date=2021-08-13|archive-date=2021-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210227052409\u002fhttps:\u002f\u002fjsben.ch\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Many [[text editor]]s have syntax highlighting support for JavaScript code.\u003cbr\u003e \u003cbr\u003e-== Related technologies ==\u003cbr\u003e-=== Java ===\u003cbr\u003e+==Related technologies==\u003cbr\u003e+===Java===\u003cbr\u003e A common misconception is that JavaScript is directly related to [[Java (programming language)|Java]].\u003c!-- While one is intentionally similar to the other, they're different. (Previously the misconception sentence said \"JavaScript is similar to Java\" but that's not a misconception) --\u003e Both indeed have a C-like syntax (the C language being their most immediate common ancestor language). They are also typically [[Sandbox (computer security)|sandboxed]], and JavaScript was designed with Java's syntax and standard library in mind. In particular, all Java keywords were reserved in original JavaScript, JavaScript's standard library follows Java's naming conventions, and JavaScript's {{code|lang=javascript|code=Math}} and {{code|lang=javascript|code=Date}} objects are based on classes from Java 1.0.\u003cref name=\"popularity\"\u003e{{cite web | url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f | title=Popularity | first=Brendan | last=Eich | author-link=Brendan Eich | date=April 3, 2008 | access-date=January 19, 2012 | archive-date=July 3, 2011 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110703020955\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Both languages first appeared in 1995, but Java was developed by [[James Gosling]] of Sun Microsystems and JavaScript by [[Brendan Eich]] of Netscape Communications.\u003cbr\u003e \u003cbr\u003e The differences between the two languages are more prominent than their similarities. Java has [[static typing]], while JavaScript's typing is [[Dynamic typing|dynamic]]. Java is loaded from [[Compiler|compiled]] bytecode, while JavaScript is loaded as human-readable source code. Java's objects are [[Class-based programming|class-based]], while JavaScript's are [[Prototype-based programming|prototype-based]]. Finally, Java did not support functional programming until Java 8, while JavaScript has done so from the beginning, being influenced by [[Scheme (programming language)|Scheme]].\u003cbr\u003e \u003cbr\u003e-=== JSON ===\u003cbr\u003e-[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely used format supported by many other programming languages.\u003cbr\u003e-\u003cbr\u003e-=== Transpilers ===\u003cbr\u003e-Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |access-date=February 6, 2020 |archive-date=January 31, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200131233044\u002fhttps:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[TypeScript]] and [[CoffeeScript]] are two notable languages that transpile to JavaScript.\u003cbr\u003e-\u003cbr\u003e-=== WebAssembly ===\u003cbr\u003e+===JSON===\u003cbr\u003e+{{Excerpt|JSON}}\u003cbr\u003e+\u003cbr\u003e+{{anchor|transpilers}}\u003cbr\u003e+===Transpilers===\u003cbr\u003e+Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |access-date=February 6, 2020 |archive-date=January 31, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200131233044\u002fhttps:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |url-status=live }}\u003c\u002fref\u003e [[TypeScript]] is the most-used language for transpilation to JavaScript.\u003cbr\u003e+\u003cbr\u003e+===WebAssembly===\u003cbr\u003e [[WebAssembly]] is a newer language with a [[bytecode]] format designed to complement JavaScript, especially the performance-critical portions of [[web page]] scripts. All of the major [[JavaScript engine]]s support WebAssembly,\u003cref\u003e{{cite web|url=https:\u002f\u002fvisualstudiomagazine.com\u002farticles\u002f2017\u002f11\u002f06\u002fedge-webassembly.aspx|title=Edge Browser Switches WebAssembly to 'On' -- Visual Studio Magazine|website=Visual Studio Magazine|access-date=2018-02-09|archive-date=2018-02-10|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180210002432\u002fhttps:\u002f\u002fvisualstudiomagazine.com\u002farticles\u002f2017\u002f11\u002f06\u002fedge-webassembly.aspx|url-status=live}}\u003c\u002fref\u003e which runs in the same [[Sandbox (computer security)|sandbox]] as regular JavaScript code.\u003cbr\u003e \u003cbr\u003e [[asm.js]] is a subset of JavaScript that served as the forerunner of WebAssembly.\u003cref\u003e{{cite web | url=https:\u002f\u002fasmjs.org\u002ffaq.html | title=frequently asked questions | publisher=asm.js | access-date=April 13, 2014 | archive-date=June 4, 2014 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140604012024\u002fhttps:\u002f\u002fasmjs.org\u002ffaq.html | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-== References ==\u003cbr\u003e+==References==\u003cbr\u003e {{Reflist}}\u003cbr\u003e \u003cbr\u003e-== Further reading ==\u003cbr\u003e+==Sources==\u003cbr\u003e+* {{cite news |last=Dere |first=Mohan |date=2017-12-21|title=How to integrate create-react-app with all the libraries you need to make a great app |language=en-US |work=freeCodeCamp |url=https:\u002f\u002fmedium.freecodecamp.org\u002fintegrating-create-react-app-redux-react-router-redux-observable-bootstrap-altogether-216db97e89a3 |access-date=2018-06-14}}\u003cbr\u003e+* {{cite news |last=Panchal |first=Krunal |date=2022-04-26 |title=Angular vs React Detailed Comparison |language=en-US |work=Groovy Web |url=https:\u002f\u002fwww.groovyweb.co\u002fblog\u002fangular-vs-react-detail-comparison |access-date=2023-06-05}}\u003cbr\u003e+\u003cbr\u tract data type)|queue]] one at a time. JavaScript calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program [[input\u002foutput]] is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for instance, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-====Examples====\u003cbr\u003e-=====Node.js=====\u003cbr\u003e-{{Excerpt|Node.js|only=paragraphs|paragraph=1}}\u003cbr\u003e-\u003cbr\u003e-=====Deno=====\u003cbr\u003e-{{Excerpt|Deno (software)|only=paragraphs|paragraph=1}}\u003cbr\u003e \u003cbr\u003e ==Features==\u003cbr\u003e The following features are common to all conforming ECMAScript implementations unless explicitly specified otherwise.","--- Revision 60\u003cbr\u003e+++ Revision 61\u003cbr\u003e@@ -127,8 +127,10 @@\u003cbr\u003e ===JavaScript engine=== ncy (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program [[input\u002foutput]] is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e ","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -128,7 +128,7 @@\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e === Runtime system ===\u003cbr\u003e-JavaScript requires a [[runtime system]] (either a [[web browser]] or a standalone system) to provide objects and methods by which scripts can interact with the larger environment. This includes the necessary APIs for [[input\u002foutput]], such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. The runtime also provides the ability to import scripts.\u003cbr\u003e+The JavaScript engine must be embedded within a [[runtime system]] (either a [[web browser]] or a standalone system) to provide objects and methods by which scripts can interact with the larger environment. This includes the necessary APIs for [[input\u002foutput]], such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. The runtime also provides the ability to import scripts.\u003cbr\u003e \u003cbr\u003e JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program [[input\u002foutput]] is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -128,9 +128,9 @@\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e === Runtime system ===\u003cbr\u003e-The JavaScript engine must be embedded within a [[runtime system]] (either a [[web browser]] or a standalone system)
