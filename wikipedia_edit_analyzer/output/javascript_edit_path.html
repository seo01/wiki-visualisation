u003e | name = JavaScript\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Office]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Legal Notices |url=https:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210605142505\u002fhttps:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |archive-date=2021-06-05 |access-date=2021-05-08 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e The trademark was originally issued to [[Sun Microsystems]] on 6 May 1997, and was transferred to Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Website client-side usage ==\u003cbr\u003e-JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]]. \u003cbr\u003e+JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e \u003cbr\u003e All major [[web browser]]s have a built-in [[JavaScript engine]] that executes the [[Source code|code]] on the user's device.\u003cbr\u003e \u003cbr\u003e@@ -226,7 +226,7 @@\u003cbr\u003e \u003cbr\u003e JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==== Functions as object constructors ==== \u003cbr\u003e+==== Functions as object constructors ====\u003cbr\u003e \u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -239,14 +239,14 @@\u003cbr\u003e ===Functional===\u003cbr\u003e {{Main|Functional programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e \u003cbr\u003e+JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Lexical closure ====\u003cbr\u003e {{Main|Closure (computer programming)}}\u003cbr\u003e \u003cbr\u003e-A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked. \u003cbr\u003e-\u003cbr\u003e-In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}} \u003cbr\u003e+A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked.\u003cbr\u003e+\u003cbr\u003e+In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}}\u003cbr\u003e \u003cbr\u003e ==== Anonymous function ====\u003cbr\u003e {{Main|Anonymous function}}\u003cbr\u003e@@ -286,7 +286,7 @@\u003cbr\u003e In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.\u003cref\u003e{{cite book | last=Haverbeke | first=Marijn | title=Eloquent JavaScript | year=2011 | publisher=No Starch Press|isbn=978-1-59327-282-1|pages=139\u2013149 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA139 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e-JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{cn|date=August 2023}} \u003cbr\u003e+JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}\u003cbr\u003e \u003cbr\u003e ===== Promises =====\u003cbr\u003e {{Main|Futures and promises}}\u003cbr\u003e@@ -812,7 +812,7 @@\u003cbr\u003e The differences between the two languages are more prominent than their similarities. Java has [[static typing]], while JavaScript's typing is [[Dynamic typing|dynamic]]. Java is loaded from [[Compiler|compiled]] bytecode, while JavaScript is loaded as human-readable source code. Java's objects are [[Class-based programming|class-based]], while JavaScript's are [[Prototype-based programming|prototype-based]]. Finally, Java did not support functional programming until Java 8, while JavaScript has done so from the beginning, being influenced by [[Scheme (programming language)|Scheme]].\u003cbr\u003e \u003cbr\u003e ===JSON===\u003cbr\u003e-[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely-used format supported by many other programming languages.\u003cbr\u003e+[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely used format supported by many other programming languages.\u003cbr\u003e \u003cbr\u003e ===Transpilers===\u003cbr\u003e Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-tha
