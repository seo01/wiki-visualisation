        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="a000cc47-439e-4df8-a15d-887b38056821" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("a000cc47-439e-4df8-a15d-887b38056821")) {                    Plotly.newPlot(                        "a000cc47-439e-4df8-a15d-887b38056821",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -39,7 +39,7 @@\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e-Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e+Although, [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e+The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although, the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript, when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -129,7 +129,7 @@\u003cbr\u003e === Runtime system ===\u003cbr\u003e A JavaScript engine must be embedded within a [[runtime system]] (such as a [[web browser]] or a standalone system) to enable scripts to interact with the broader environment. The runtime system includes the necessary APIs for [[input\u002foutput]] operations, such as [[computer network|networking]], [[data storage|storage]], and [[computer graphics|graphics]], and provides the ability to import scripts.\u003cbr\u003e \u003cbr\u003e-JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=[[Mozilla Developer Network]]|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e ","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -74,7 +74,7 @@\u003cbr\u003e \u003cbr\u003e Meanwhile, very important developments were occurring in open-source communities not affiliated with ECMA work. In 2005, [[Jesse James Garrett]] released a white paper in which he coined the term [[Ajax (programming)|Ajax]] and described a set of technologies, of which JavaScript was the backbone, to create [[web application]]s where data can be loaded in the background, avoiding the need for full page reloads. This sparked a renaissance period of JavaScript, spearheaded by open-source libraries and the communities that formed around them. Many new libraries were created, including [[jQuery]], [[Prototype JavaScript Framework|Prototype]], [[Dojo Toolkit]], and [[MooTools]].\u003cbr\u003e \u003cbr\u003e-[[Google]] debuted its [[Google Chrome|Chrome]] browser in 2008, with the [[V8 (JavaScript engine)|V8]] JavaScript engine that was faster than its competition.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|title=Big browser comparison test: Internet Explorer vs. Firefox, Opera, Safari and Chrome|work=PC Games Hardware|date=3 July 2009|publisher=Computec Media AG|access-date=June 28, 2010|archive-date=May 2, 2012|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120502043027\u002fhttp:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url=https:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | title=Lifehacker Speed Tests: Safari 4, Chrome 2 | first=Kevin | last=Purdy | work=[[Lifehacker]] | date=June 11, 2009 | access-date=May 8, 2021 | archive-date=April 14, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414095403\u002fhttps:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | url-status=live }}\u003c\u002fref\u003e The key innovation was [[just-in-time compilation]] (JIT),\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|title=TraceMonkey: JavaScript Lightspeed, Brendan Eich's Blog|access-date=July 22, 2020|archive-date=December 4, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151204091540\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|url-status=live}}\u003c\u002fref\u003e so other browser vendors needed to overhaul their engines for JIT.\u003cref\u003e{{cite magazine |title=Mozilla asks, 'Are we fast yet?' |url=https:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |magazine=Wired |access-date=January 18, 2019 |archive-date=June 22, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180622213244\u002fhttps:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+[[Google]] debuted its [[Google Chrome|Chrome]] browser in 2008, with the [[V8 (JavaScript engine)|V8]] JavaScript engine, that was faster than its competition.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|title=Big browser comparison test: Internet Explorer vs. Firefox, Opera, Safari and Chrome|work=PC Games Hardware|date=3 July 2009|publisher=Computec Media AG|access-date=June 28, 2010|archive-date=May 2, 2012|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120502043027\u002fhttp:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url=https:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | title=Lifehacker Speed Tests: Safari 4, Chrome 2 | first=Kevin | last=Purdy | work=[[Lifehacker]] | date=June 11, 2009 | access-date=May 8, 2021 | archive-date=April 14, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414095403\u002fhttps:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | url-status=live }}\u003c\u002fref\u003e The key innovation was [[just-in-time compilation]] (JIT),\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|title=TraceMonkey: JavaScript Lightspeed, Brendan Eich's Blog|access-date=July 22, 2020|archive-date=December 4, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151204091540\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|url-status=live}}\u003c\u002fref\u003e so other browser vendors needed to overhaul their engines for JIT.\u003cref\u003e{{cite magazine |title=Mozilla asks, 'Are we fast yet?' |url=https:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |magazine=Wired |access-date=January 18, 2019 |archive-date=June 22, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180622213244\u002fhttps:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e ","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -33,13 +33,13 @@\u003cbr\u003e \u003cbr\u003e '''JavaScript''' ({{IPAc-en|\u02c8|d\u0292|\u0251\u02d0|v|\u0259|s|k|r|\u026a|p|t}}), often abbreviated as '''JS''', is a [[programming language]] and core technology of [[World Wide Web|the Web]], alongside [[HTML]] and [[CSS]]. \u003c!--don't add dating or decimals: it'll remain 99% indefinitely--\u003e99% of [[website]]s use JavaScript on the [[Client (computing)|client]] side for [[Web page|webpage]] behavior.\u003cref name=\"deployedstats\"\u003e{{cite web |title=Usage Statistics of JavaScript as Client-side Programming Language on Websites |url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002fdetails\u002fcp-javascript |access-date=2024-02-27 |website=W3Techs }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Web browser]]s have a dedicated [[JavaScript engine]], that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e+[[Web browser]]s have a dedicated [[JavaScript engine]] that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e \u003cbr\u003e JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming style]]s. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e-Although, [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e+Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although, the new language and its [[Interpreter (computing)|interpreter]] implementation were called ion\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -74,7 +74,7 @@\u003cbr\u003e \u003cbr\u003e Meanwhile, very important developments were occurring in open-source communities not affiliated with ECMA work. In 2005, [[Jesse James Garrett]] released a white paper in which he coined the term [[Ajax (programming)|Ajax]] and described a set of technologies, of which JavaScript was the backbone, to create [[web application]]s where data can be loaded in the background, avoiding the need for full page reloads. This sparked a renaissance period of JavaScript, spearheaded by open-source libraries and the communities that formed around them. Many new libraries were created, including [[jQuery]], [[Prototype JavaScript Framework|Prototype]], [[Dojo Toolkit]], and [[MooTools]].\u003cbr\u003e \u003cbr\u003e-[[Google]] debuted its [[Google Chrome|Chrome]] browser in 2008, with the [[V8 (JavaScript engine)|V8]] JavaScript engine, that was faster than its competition.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|title=Big browser comparison test: Internet Explorer vs. Firefox, Opera, Safari and Chrome|work=PC Games Hardware|date=3 July 2009|publisher=Computec Media AG|access-date=June 28, 2010|archive-date=May 2, 2012|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120502043027\u002fhttp:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url=https:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | title=Lifehacker Speed Tests: Safari 4, Chrome 2 | first=Kevin | last=Purdy | work=[[Lifehacker]] | date=June 11, 2009 | access-date=May 8, 2021 | archive-date=April 14, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414095403\u002fhttps:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | url-status=live }}\u003c\u002fref\u003e The key innovation was [[just-in-time compilation]] (JIT),\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|title=TraceMonkey: JavaScript Lightspeed, Brendan Eich's Blog|access-date=July 22, 2020|archive-date=December 4, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151204091540\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|url-status=live}}\u003c\u002fref\u003e so other browser vendors needed to overhaul their engines for JIT.\u003cref\u003e{{cite magazine |title=Mozilla asks, 'Are we fast yet?' |url=https:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |magazine=Wired |access-date=January 18, 2019 |archive-date=June 22, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180622213244\u002fhttps:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+[[Google]] debuted its [[Google Chrome|Chrome]] browser in 2008, with the [[V8 (JavaScript engine)|V8]] JavaScript engine that was faster than its competition.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|title=Big browser comparison test: Internet Explorer vs. Firefox, Opera, Safari and Chrome|work=PC Games Hardware|date=3 July 2009|publisher=Computec Media AG|access-date=June 28, 2010|archive-date=May 2, 2012|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120502043027\u002fhttp:\u002f\u002fwww.pcgameshardware.com\u002faid,687738\u002fBig-browser-comparison-test-Internet-Explorer-vs-Firefox-Opera-Safari-and-Chrome-Update-Firefox-35-Final\u002fPractice\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web | url=https:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | title=Lifehacker Speed Tests: Safari 4, Chrome 2 | first=Kevin | last=Purdy | work=[[Lifehacker]] | date=June 11, 2009 | access-date=May 8, 2021 | archive-date=April 14, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210414095403\u002fhttps:\u002f\u002flifehacker.com\u002flifehacker-speed-tests-safari-4-chrome-2-and-more-5286869 | url-status=live }}\u003c\u002fref\u003e The key innovation was [[just-in-time compilation]] (JIT),\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|title=TraceMonkey: JavaScript Lightspeed, Brendan Eich's Blog|access-date=July 22, 2020|archive-date=December 4, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151204091540\u002fhttps:\u002f\u002fbrendaneich.com\u002f2008\u002f08\u002ftracemonkey-javascript-lightspeed\u002f|url-status=live}}\u003c\u002fref\u003e so other browser vendors needed to overhaul their engines for JIT.\u003cref\u003e{{cite magazine |title=Mozilla asks, 'Are we fast yet?' |url=https:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |magazine=Wired |access-date=January 18, 2019 |archive-date=June 22, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180622213244\u002fhttps:\u002f\u002fwww.wired.com\u002f2010\u002f09\u002fmozilla-asks-are-we-fast-yet\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e \u003cbr\u003e@@ -129,7 +129,7 @@\u003cbr\u003e === Runtime system ===\u003cbr\u003e A JavaScript engine must be embedded within a [[runtime system]] (such as a [[web browser]] or a standalone system) to enable scripts to interact with the broader environment. The runtime system includes the necessary APIs for [[input\u002foutput]] operations, such as [[computer network|networking]], [[data storage|storage]], and [[computer graphics|graphics]], and provides the ability to import scripts.\u003cbr\u003e \u003cbr\u003e-JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=[[Mozilla Developer Network]]|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e ","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -260,7 +260,7 @@\u003cbr\u003e ==== Functions as roles (Traits and Mixins) ====\u003cbr\u003e {{Main|Role-oriented programming|Traits (computer science)|Mixin}}\u003cbr\u003e \u003cbr\u003e-JavaScript natively supports various function-based implementations of [[Role-oriented programming|Role]]\u003cref\u003e[https:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins The many talents of JavaScript for generalizing Role-Oriented Programming approaches like Traits and Mixins] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171005050713\u002fhttps:\u002f\u002fpeterseliger.blogspot.de\u002f2014\  function-based implementations of [[Role-oriented programming|Role]]\u003cref\u003e[https:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins The many talents of JavaScript for generalizing Role-Oriented Programming approaches like Traits and Mixins] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171005050713\u002fhttps:\u002f\u002fpeterseliger.blogspot.de\u002f2014\u002f04\u002fthe-many-talents-of-javascript.html#the-many-talents-of-javascript-for-generalizing-role-oriented-programming-approaches-like-traits-and-mixins |date=2017-10-05 }}, Peterseliger.blogspot.de, April 11, 2014.\u003c\u002fref\u003e patterns like [[Traits (computer science)|Traits]]\u003cref\u003e[https:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f Traits for JavaScript] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140724052500\u002fhttps:\u002f\u002fsoft.vub.ac.be\u002f~tvcutsem\u002ftraitsjs\u002f |date=2014-07-24 }}, 2010.\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fcocktailjs.github.io\u002f |title=Home &#124; CocktailJS |website=Cocktailjs.github.io |access-date=February 24, 2017 |archive-date=February 4, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170204083608\u002fhttps:\u002f\u002fcocktailjs.github.io\u002f |url-status=live }}\u003c\u002fref\u003e and [[Mixin]]s.\u003cref\u003e{{cite web |url-status=live |first1=Angus |last1=Croll |url=https:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |title=A fresh look at JavaScript Mixins |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200415004603\u002fhttps:\u002f\u002fjavascriptweblog.wordpress.com\u002f2011\u002f05\u002f31\u002fa-fresh-look-at-javascript-mixins\u002f |archive-date=2020-04-15 |date=May 31, 2011 |website= JavaScript, JavaScript\u2026 }}\u003c\u002fref\u003e Such a function defines additional behavior by at least one method bound to the \u003ccode\u003ethis\u003c\u002fcode\u003e keyword within its \u003ccode\u003efunction\u003c\u002fcode\u003e body. A Role then has to be delegated explicitly via \u003ccode\u003ecall\u003c\u002fcode\u003e or \u003ccode\u003eapply\u003c\u002fcode\u003e to objects that need to feature additional behavior that is not shared via the prototype chain.\u003cbr\u003e \u003cbr\u003e ==== Object composition and inheritance ====\u003cbr\u003e Whereas explicit function-based delegation does cover [[Object composition|composition]] in JavaScript, implicit delegation already happens every time the prototype chain is walked in order to, e.g., find a method that might be related to but is not directly owned by an object. Once the method is found it gets called within this object's context. Thus [[Inheritance (object-oriented programming)|inheritance]] in JavaScript is covered by a delegation automatism that is bound to the prototype property of constructor functions.","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -27,7 +27,7 @@\u003cbr\u003e | latest release date = {{start date and age|{{wikidata|qualifier|single|P548=Q2804309|P348|P577}}}}\u003cbr\u003e | latest preview version = {{wikidata|property|edit|reference|P548=Q51930650|P348}}\u003cbr\u003e | latest preview date = {{start date and age|{{wikidata|qualifier|single|P548=Q51930650|P348|P577}}}}\u003cbr\u003e-| influenced by = [[Java (programming language)|Java]],\u003cref name=\"looklikejava\"\u003e{{cite book|last=Seibel|first=Peter|title=Coders at Work: Reflections on the Craft of Programming|isbn=9781430219484|quote=\"Eich: The immediate concern at Netscape was it must look like Java.\"|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=nneBa6-mWfgC&q=The+immediate+concern+at+Netscape+was+it+must+look+like+Java.&pg=PA141|access-date=December 25, 2018|date=September ape+was+it+must+look+like+Java.&pg=PA141|access-date=December 25, 2018|date=September 16, 2009|publisher=Apress |archive-date=December 24, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201224233514\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=nneBa6-mWfgC&q=The+immediate+concern+at+Netscape+was+it+must+look+like+Java.&pg=PA141|url-status=live}}\u003c\u002fref\u003e\u003cref name=\"origin\" \u002f\u003e [[Scheme (programming language)|Scheme]],\u003cref name=\"origin\" \u002f\u003e [[Self (programming language)|Self]],\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f|title = Popularity \u2013 Brendan Eich}}\u003c\u002fref\u003e [[AWK]],\u003cref\u003e{{cite web|title=Brendan Eich: An Introduction to JavaScript, JSConf 2010|website=[[YouTube]]|date=20 January 2013 |quote=\"Eich: \"function\", eight letters, I was influenced by AWK.\"|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=1EyRscXrehw|access-date=November 25, 2019|page=22m|archive-date=August 29, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200829024704\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=1EyRscXrehw|url-status=live}}\u003c\u002fref\u003e [[HyperTalk]]\u003cref\u003e{{cite book |last=Eich |first=Brendan |authorlink1=Brendan Eich |chapter=Foreword |editor1-last=Goodman |editor1-first=Danny |editor1-link=Danny Goodman |year=1998 |title=JavaScript Bible |edition=3rd |publisher=[[John Wiley & Sons]] |isbn=0-7645-3188-3 |lccn=97078208 |oclc=38888873 |ol=712205M |url-access=registration |url=https:\u002f\u002farchive.org\u002fdetails\u002fjavascriptbible000good}}\u003c\u002fref\u003e\u003cbr\u003e | website = {{URL|https:\u002f\u002fecma-international.org\u002fpublications-and-standards\u002fstandards\u002fecma-262\u002f}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e@@ -35,39 +35,39 @@\u003cbr\u003e \u003cbr\u003e [[Web browser]]s have a dedicated [[JavaScript engine]] that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e \u003cbr\u003e-JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming style]]s. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e+JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming styles]]. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e \u003cbr\u003e-==History==\u003cbr\u003e-===Creation at Netscape===\u003cbr\u003e+== History ==\u003cbr\u003e+=== Creation at Netscape ===\u003cbr\u003e The first popular [[web browser]] with a [[graphical user interface]], [[Mosaic (web browser)|Mosaic]], was released in 1993. Accessible to non-technical people, it played a prominent role in the rapid growth of the early [[World Wide Web]].\u003cref\u003e{{cite news |date=March 17, 2011 |title=Bloomberg Game Changers: Marc Andreessen |work=[[Bloomberg L.P.|Bloomberg]] |publisher=Bloomberg |url=https:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394 |url-status=live |access-date=December 7, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120516093712\u002fhttps:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394\u002f |archive-date=May 16, 2012}}\u003c\u002fref\u003e The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e+The goal was a \"language for the masses\",\u003cref name=\"EichVideo\" \u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\" \u002f\u003e\u003cref name=\"origin\" \u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\" \u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Adoption by Microsoft===\u003cbr\u003e+=== Adoption by Microsoft ===\u003cbr\u003e [[Microsoft]] debuted [[Internet Explorer]] in 1995, leading to a [[browser war]] with Netscape. On the JavaScript front, Microsoft created its own [[Interpreter (computing)|interpreter]] called [[JScript]].\u003cref name=\"sjsch5\"\u003e{{cite web |title=Chapter 5. Standardization: ECMAScript |url=https:\u002f\u002fspeakingjs.com\u002fes5\u002fch05.html |website=speakingjs.com |access-date=1 November 2021 |archive-date=1 November 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211101184346\u002fhttp:\u002f\u002fspeakingjs.com\u002fes5\u002fch05.html |url-status=dead }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Microsoft first released JScript in 1996, alongside initial support for [[CSS]] and extensions to [[HTML]]. Each of these [[implementation]]s was noticeably different from their counterparts in [[Netscape Navigator]].\u003cref name=\"O'Reilly-2001\"\u003e{{cite web |url=https:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |title=JavaScript, How Did We Get Here? |last=Champeon |first=Steve |date=April 6, 2001 |website=oreilly.com |access-date=July 16, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160719020828\u002fhttps:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |archive-date=July 19, 2016 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |title=Microsoft Internet Explorer 3.0 Beta Now Available |publisher=Microsoft |date=May 29, 1996 |website=microsoft.com |access-date=July 16, 2016 |archive-date=November 24, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201124154053\u002fhttps:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |url-status=live }}\u003c\u002fref\u003e These differences made it difficult for developers to make their websites work well in both browsers, leading to widespread use of \"best viewed in Netscape\" and \"best viewed in Internet Explorer\" logos for several years.\u003cref name=\"O'Reilly-2001\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |title=The Unwelcome Return of \"Best Viewed with Internet Explorer\" |last=McCracken |first=Harry |date=September 16, 2010 |website=technologizer.com |access-date=July 16, 2016 |archive-date=June 23, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180623192402\u002fhttps:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===The rise of JScript===\u003cbr\u003e-{{Quote box|[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\"\u002f\u003e|width=30%}}\u003cbr\u003e+=== The rise of JScript ===\u003cbr\u003e+{{Quote box|[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\" \u002f\u003e|width=30%}}\u003cbr\u003e \u003cbr\u003e In November 1996, [[Netscape]] submitted JavaScript to [[Ecma International]], as the starting point for a standard specification that all browser vendors could conform to. This led to the official release of the first [[ECMAScript]] language specification in June 1997.\u003cbr\u003e \u003cbr\u003e-The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\"\u002f\u003e\u003cbr\u003e+The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e However, the effort to fully standardize the language was undermined by [[Microsoft]] gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e \u003cbr\u003e Microsoft initially participated in the standards process and implemented some proposals in its JScript language, but eventually it stopped collaborating on ECMA work. Thus ECMAScript 4 was mothballed.\u003cbr\u003e \u003cbr\u003e-===Growth and standardization===\u003cbr\u003e+=== Growth and standardization ===\u003cbr\u003e During the period of [[Internet Explorer]] dominance in the early 2000s, client-side scripting was stagnant. This started to change in 2004, when the successor of Netscape, [[Mozilla]], released the [[Firefox]] browser. Firefox was well received by many, taking significant market share from Internet Explorer.\u003cref\u003e{{cite news |url=https:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |title=The assault on software giant Microsoft |last=Weber |first=Tim |date=May 9, 2005 |work=[[BBC News]] |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170925233936\u002fhttps:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |archive-date=September 25, 2017}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2005, Mozilla joined ECMA International, and work started on the [[ECMAScript for XML]] (E4X) standard. This led to Mozilla working jointly with [[Macromedia]] (later acquired by [[Adobe Systems]]), who were implementing E4X in their ActionScript 3 language, which was based on an ECMAScript 4 draft. The goal became standardizing ActionScript 3 as the new ECMAScript 4. To this end, Adobe Systems released the [[Tamarin (software)|Tamarin]] implementation as an [[Open-source model|open source]] project. However, Tamarin and ActionScript 3 were too different from established client-side scripting, and without cooperation from [[Microsoft]], ECMAScript 4 never reached fruition.\u003cbr\u003e@@ -78,25 +78,25 @@\u003cbr\u003e \u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e \u003cbr\u003e-===Reaching maturity===\u003cbr\u003e+=== Reaching maturity ===\u003cbr\u003e Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript]] 6 in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180318064130\u002fhttps:\u002f\u002fes6-features.org\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The creation of [[Node.js]] in 2009 by [[Ryan Dahl]] sparked a significant increase in the usage of JavaScript outside of web browsers. Node combines the [[V8 (JavaScript engine)|V8]] engine, an [[event loop]], and [[Input\u002foutput|I\u002fO]] [[Application programming interface|APIs]], thereby providing a stand-alone JavaScript runtime system.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&q=nodejs Professional Node.js: Building JavaScript Based Scalable Software] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170324021220\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&printsec=frontcover&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-24 }}, John Wiley & Sons, 01-Oct-2012\u003c\u002fref\u003e\u003cref name=\"b3\"\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&dq=nodejs&pg=PT24 Sams Teach Yourself Node.js in 24 Hours] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170323192039\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&pg=PT24&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-23 }}, Sams Publishing, 05-Sep-2012\u003c\u002fref\u003e As of 2018, Node had been used by millions of developers,\u003cref\u003e{{cite web |last1=Lawton |first1=George |title=The secret history behind the success of npm and Node |url=https:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |website=TheServerSide |access-date=2 August 2021 |date=19 July 2018 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165613\u002fhttps:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |url-status=live }}\u003c\u002fref\u003e and [[npm (software)|npm]] had the most modules of any [[package manager]] in the world.\u003cref\u003e{{cite web |last1=Brown |first1=Paul |title=State of the Union: npm |url=https:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |website=Linux.com |access-date=2 August 2021 |date=13 January 2017 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165614\u002fhttps:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The ECMAScript draft specification is currently maintained openly on [[GitHub]],\u003cref name=branscombe\u002f\u003e and editions are produced via regular annual snapshots.\u003cref name=branscombe\u003e{{cite web |url=https:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |title=JavaScript Standard Moves to Yearly Release Schedule; Here is What's New for ES16 |last=Branscombe |first=Mary |date=2016-05-04 |access-date=2021-01-15 |work=The New Stack |archive-date=2021-01-16 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210116181757\u002fhttps:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |url-status=live }}\u003c\u002fref\u003e Potential revisions to the language are vetted through a comprehensive proposal process.\u003cref\u003e{{cite web|url=https:\u002f\u002ftc39.es\u002fprocess-document\u002f|title=The TC39 Process|publisher=Ecma International|work=tc39.es|access-date=2021-01-15|archive-date=2021-02-07|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210207105535\u002fhttps:\u002f\u002ftc39.es\u002fprocess-document\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |title=ECMAScript proposals |access-date=2021-01-15 |publisher=TC39 |archive-date=2020-12-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201204221147\u002fhttps:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |url-status=live }}\u003c\u002fref\u003e Now, instead of edition numbers, developers check the status of upcoming features individually.\u003cref name=branscombe \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-The current JavaScript ecosystem has many [[List of JavaScript libraries|libraries]] and [[web framework|frameworks]], established programming practices, and substantial usage of JavaScript outside of web browsers.\u003cref name=\"wired2024\"\u002f\u003e Plus, with the rise of [[single-page application]]s and other JavaScript-heavy websites, several [[source-to-source compiler|transpilers]] have been created to aid the development process.\u003cref name=\"transpilers\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-==Trademark==\u003cbr\u003e+The ECMAScript draft specification is currently maintained openly on [[GitHub]],\u003cref name=branscombe \u002f\u003e and editions are produced via regular annual snapshots.\u003cref name=branscombe\u003e{{cite web |url=https:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |title=JavaScript Standard Moves to Yearly Release Schedule; Here is What's New for ES16 |last=Branscombe |first=Mary |date=2016-05-04 |access-date=2021-01-15 |work=The New Stack |archive-date=2021-01-16 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210116181757\u002fhttps:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |url-status=live }}\u003c\u002fref\u003e Potential revisions to the language are vetted through a comprehensive proposal process.\u003cref\u003e{{cite web|url=https:\u002f\u002ftc39.es\u002fprocess-document\u002f|title=The TC39 Process|publisher=Ecma International|work=tc39.es|access-date=2021-01-15|archive-date=2021-02-07|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210207105535\u002fhttps:\u002f\u002ftc39.es\u002fprocess-document\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |title=ECMAScript proposals |access-date=2021-01-15 |publisher=TC39 |archive-date=2020-12-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201204221147\u002fhttps:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |url-status=live }}\u003c\u002fref\u003e Now, instead of edition numbers, developers check the status of upcoming features individually.\u003cref name=branscombe \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+The current JavaScript ecosystem has many [[List of JavaScript libraries|libraries]] and [[web framework|frameworks]], established programming practices, and substantial usage of JavaScript outside of web browsers.\u003cref name=\"wired2024\" \u002f\u003e Plus, with the rise of [[single-page application]]s and other JavaScript-heavy websites, several [[source-to-source compiler|transpilers]] have been created to aid the development process.\u003cref name=\"transpilers\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+== Trademark ==\u003cbr\u003e \"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Office]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Legal Notices |url=https:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210605142505\u002fhttps:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |archive-date=2021-06-05 |access-date=2021-05-08 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e The trademark was originally issued to [[Sun Microsystems]] on 6 May 1997, and was transferred to Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Website client-side usage ==\u003cbr\u003e-JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e+JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\" \u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e \u003cbr\u003e All major [[web browser]]s have a built-in [[JavaScript engine]] that executes the [[Source code|code]] on the user's device.\u003cbr\u003e \u003cbr\u003e-===Examples of scripted behavior===\u003cbr\u003e-* Loading new [[web page]] content without reloading the page, via [[Ajax (programming)|Ajax]] or a [[WebSocket]]. For example, [[user (computing)|user]]s of [[social media]] can send and receive messages without leaving the current page.\u003cbr\u003e+=== Examples of scripted behavior ===\u003cbr\u003e+* Loading new [[web page]] content without reloading the page, via [[Ajax (programming)|Ajax]] or a [[WebSocket]]. For example, [[user (computing)|users]] of [[social media]] can send and receive messages without leaving the current page.\u003cbr\u003e * Web page animations, such as fading objects in and out, resizing, and moving them.\u003cbr\u003e * Playing [[browser game]]s.\u003cbr\u003e * Controlling the [[Media player software|playback]] of [[streaming media]].\u003cbr\u003e@@ -106,24 +106,24 @@\u003cbr\u003e *Redirecting a user to another page.\u003cbr\u003e * Storing and retrieving data on the user's device, via the [[web storage|storage]] or [[Indexed Database API|IndexedDB]] standards.\u003cbr\u003e \u003cbr\u003e-=== Libraries and frameworks===\u003cbr\u003e+=== Libraries and frameworks ===\u003cbr\u003e Over 80% of websites use a third-party JavaScript [[Library (computing)|library]] or [[web framework]] as part of their client-side scripting.\u003cref name=\"lib_usage\"\u003e{{cite web|url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002foverview\u002fjavascript_library|title=Usage statistics of JavaScript libraries for websites|website=W3Techs|access-date=2021-04-09}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[jQuery]] is by far the most-used.\u003cref name=\"lib_usage\"\u002f\u003e Other notable ones include \u003c!--alphabetically is fair here--\u003e[[Angular (web framework)|Angular]], [[Bootstrap (front-end framework)|Bootstrap]], [[Lodash]], [[Modernizr]], [[React (software)|React]], [[Underscore.js|Underscore]], and [[Vue.js|Vue]].\u003cref name=\"lib_usage\"\u002f\u003e Multiple options can be used in conjunction, such as jQuery and Bootstrap.\u003cref\u003e{{cite web |title=Using jQuery with Bootstrap |url=https:\u002f\u002fclouddevs.com\u002fjquery\u002fweb-projects-with-bootstrap\u002f |website=clouddevs.com |date=10 June 2019 |access-date=17 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e+[[jQuery]] is by far the most-used.\u003cref name=\"lib_usage\" \u002f\u003e Other notable ones include \u003c!--alphabetically is fair here--\u003e[[Angular (web framework)|Angular]], [[Bootstrap (front-end framework)|Bootstrap]], [[Lodash]], [[Modernizr]], [[React (software)|React]], [[Underscore.js|Underscore]], and [[Vue.js|Vue]].\u003cref name=\"lib_usage\" \u002f\u003e Multiple options can be used in conjunction, such as jQuery and Bootstrap.\u003cref\u003e{{cite web |title=Using jQuery with Bootstrap |url=https:\u002f\u002fclouddevs.com\u002fjquery\u002fweb-projects-with-bootstrap\u002f |website=clouddevs.com |date=10 June 2019 |access-date=17 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e However, the term \"Vanilla JS\" was coined for websites not using any libraries or frameworks at all, instead relying entirely on standard JavaScript functionality.\u003cref\u003e{{cite web |date=2020-06-16 |title=Vanilla JS |url=https:\u002f\u002fvanilla-js.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200616052335\u002fhttps:\u002f\u002fvanilla-js.com\u002f |archive-date=June 16, 2020 |access-date=June 17, 2020 |website=vanilla-js.com}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Other usage{{anchor|Server-side_JavaScript|Uses_outside_web_pages}}==\u003cbr\u003e+== Other usage{{anchor|Server-side_JavaScript|Uses_outside_web_pages}} ==\u003cbr\u003e The use of JavaScript has expanded beyond its [[web browser]] roots. [[JavaScript engine]]s are now embedded\u003c!--don't link Embedded system here--\u003e in a variety of other software systems, both for [[server-side]] website deployments and non-browser [[application software|applications]].\u003cbr\u003e \u003cbr\u003e-Initial attempts at promoting server-side JavaScript usage were [[Netscape Enterprise Server]] and [[Microsoft]]'s [[Internet Information Services]],\u003cref\u003e{{cite web |date=December 11, 1998 |title=Server-Side JavaScript Guide |url=https:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210311173120\u002fhttps:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |archive-date=March 11, 2021 |access-date=May 8, 2021 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Clinick|first1=Andrew|title=Introducing JScript .NET|url=https:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|website=Microsoft Developer Network|publisher=Microsoft|access-date=April 10, 2018|date=July 14, 2000|quote=[S]ince the 1996 introduction of JScript version 1.0 ... we've been seeing a steady increase in the usage of JScript on the server\u2014particularly in Active Server Pages (ASP)|archive-date=November 10, 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171110201649\u002fhttps:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|url-status=live}}\u003c\u002fref\u003e but they were small niches.\u003cref name=\"2009server\"\u002f\u003e Server-side usage eventually started to grow in the late 2000s, with the creation of [[Node.js]] and [[List of server-side JavaScript implementations|other approaches]].\u003cref name=\"2009server\"\u003e{{cite web |url=https:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |title=Server-Side JavaScript, Back with a Vengeance |date=December 17, 2009 |website=readwrite.com |access-date=July 16, 2016 |author=Mahemoff, Michael |archive-date=June 17, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160617030219\u002fhttps:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Initial attempts at promoting server-side JavaScript usage were [[Netscape Enterprise Server]] and [[Microsoft]]'s [[Internet Information Services]],\u003cref\u003e{{cite web |date=December 11, 1998 |title=Server-Side JavaScript Guide |url=https:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210311173120\u002fhttps:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |archive-date=March 11, 2021 |access-date=May 8, 2021 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Clinick|first1=Andrew|title=Introducing JScript .NET|url=https:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|website=Microsoft Developer Network|publisher=Microsoft|access-date=April 10, 2018|date=July 14, 2000|quote=[S]ince the 1996 introduction of JScript version 1.0 ... we've been seeing a steady increase in the usage of JScript on the server\u2014particularly in Active Server Pages (ASP)|archive-date=November 10, 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171110201649\u002fhttps:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|url-status=live}}\u003c\u002fref\u003e but they were small niches.\u003cref name=\"2009server\" \u002f\u003e Server-side usage eventually started to grow in the late 2000s, with the creation of [[Node.js]] and [[List of server-side JavaScript implementations|other approaches]].\u003cref name=\"2009server\"\u003e{{cite web |url=https:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |title=Server-Side JavaScript, Back with a Vengeance |date=December 17, 2009 |website=readwrite.com |access-date=July 16, 2016 |author=Mahemoff, Michael |archive-date=June 17, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160617030219\u002fhttps:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Electron (software framework)|Electron]], [[Apache Cordova|Cordova]], [[React Native]], and other [[application framework]]s have been used to create many applications with behavior implemented in JavaScript. Other non-browser applications include [[Adobe Acrobat]] support for scripting [[PDF]] documents\u003cref\u003e{{cite web |date=2009-08-07 |title=JavaScript for Acrobat |url=https:\u002f\u002fwww.adobe.com\u002fdevnet\u002facrobat\u002fjavascript.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20090807065130\u002fhttps:\u002f\u002fwww.adobe.com\u002fdevnet\u002facrobat\u002fjavascript.html |archive-date=August 7, 2009 |access-date=August 18, 2009 |website=adobe.com}}\u003c\u002fref\u003e and [[GNOME Shell]] extensions written in JavaScript.\u003cref\u003e{{cite web |last=treitter |date=2013-02-02 |title=Answering the question: \"How do I develop an app for GNOME?\" |url=https:\u002f\u002ftreitter.livejournal.com\u002f14871.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130211032900\u002fhttps:\u002f\u002ftreitter.livejournal.com\u002f14871.html |archive-date=2013-02-11 |access-date=2013-02-07 |website=livejournal.com}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e JavaScript has been used in some [[embedded system]]s, usually by leveraging Node.js.\u003cref\u003e{{cite web |title=Tessel 2... Leverage all the libraries of Node.JS to create useful devices in minutes with Tessel. |url=https:\u002f\u002ftessel.io\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210526212559\u002fhttps:\u002f\u002ftessel.io\u002f |archive-date=2021-05-26 |access-date=2021-05-08 |website=tessel.io}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Node.js Raspberry Pi GPIO Introduction |url=https:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210813192938\u002fhttps:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |archive-date=2021-08-13 |access-date=2020-05-03 |website=w3schools.com}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Espruino&nbsp;\u2013 JavaScript for Microcontrollers |url=https:\u002f\u002fwww.espruino.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200501010722\u002fhttps:\u002f\u002fwww.espruino.com\u002f |archive-date=2020-05-01 |access-date=2020-05-03 |website=espruino.com}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Execution ==\u003cbr\u003e-===JavaScript engine===\u003cbr\u003e+=== JavaScript engine ===\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e === Runtime system ===\u003cbr\u003e@@ -133,15 +133,15 @@\u003cbr\u003e \u003cbr\u003e The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e \u003cbr\u003e-==Features==\u003cbr\u003e+== Features ==\u003cbr\u003e The following features are common to all conforming ECMAScript implementations unless explicitly specified otherwise.\u003cbr\u003e \u003cbr\u003e-===Imperative and structured===\u003cbr\u003e+=== Imperative and structured ===\u003cbr\u003e {{Main|Structured programming}}\u003cbr\u003e \u003cbr\u003e JavaScript supports much of the [[structured programming]] syntax from [[C (computer language)|C]] (e.g., \u003ccode\u003eif\u003c\u002fcode\u003e statements, \u003ccode\u003ewhile\u003c\u002fcode\u003e loops, \u003ccode\u003eswitch\u003c\u002fcode\u003e statements, \u003ccode\u003edo while\u003c\u002fcode\u003e loops, etc.). One partial exception is [[scope (computer science)|scoping]]: originally JavaScript only had [[function scoping]] with \u003ccode\u003evar\u003c\u002fcode\u003e; [[block scoping]] was added in ECMAScript 2015 with the keywords \u003ccode\u003elet\u003c\u002fcode\u003e and \u003ccode\u003e[[const (computer programming)|const]]\u003c\u002fcode\u003e. Like C, JavaScript makes a distinction between [[Expression (computer science)|expressions]] and [[Statement (computer science)|statements]]. One syntactic difference from C is [[Defensive semicolon|automatic semicolon insertion]], which allow semicolon
