.youtube.com\u002fwatch?v=1EyRscXrehw|access-date=November 25, 2019|page=22m|archive-date=August 29, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200829024704\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=1EyRscXrehw|url-status=live}}\u003c\u002fref\u003e [[HyperTalk]]\u003cref\u003e{{cite book |last=Eich |first=Brendan |authorlink1=Brendan Eich |chapter=Foreword |editor1-last=Goodman |editor1-first=Danny |editor1-link=Danny Goodman |year=1998 |title=JavaScript Bible |edition=3rd |publisher=[[John Wiley & Sons]] |isbn=0-7645-3188-3 |lccn=97078208 |oclc=38888873 |ol=712205M |url-access=registration |url=https:\u002f\u002farchive.org\u002fdetails\u002fjavascriptbible000good}}\u003c\u002fref\u003e\u003cbr\u003e+| influenced by = [[Java (programming language)|Java]],\u003cref name=\"looklikejava\"\u003e{{cite book|last=Seibel|first=Peter|title=Coders at Work: Reflections on the Craft of Programming|isbn=9781430219484|quote=\"Eich: The immediate concern at Netscape was it must look like Java.\"|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=nneBa6-mWfgC&q=The+immediate+concern+at+Netscape+was+it+must+look+like+Java.&pg=PA141|access-date=December 25, 2018|date=September 16, 2009|publisher=Apress |archive-date=December 24, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201224233514\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=nneBa6-mWfgC&q=The+immediate+concern+at+Netscape+was+it+must+look+like+Java.&pg=PA141|url-status=live}}\u003c\u002fref\u003e\u003cref name=\"origin\"\u002f\u003e [[Scheme (programming language)|Scheme]],\u003cref name=\"origin\"\u002f\u003e [[Self (programming language)|Self]],\u003cref\u003e{{cite web|url=https:\u002f\u002fbrendaneich.com\u002f2008\u002f04\u002fpopularity\u002f|title = Popularity \u2013 Brendan Eich}}\u003c\u002fref\u003e [[AWK]],\u003cref\u003e{{cite web|title=Brendan Eich: An Introduction to JavaScript, JSConf 2010|website=[[YouTube]]|quote=\"Eich: \"function\", eight letters, I was influenced by AWK.\"|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=1EyRscXrehw|access-date=November 25, 2019|page=22m|archive-date=August 29, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200829024704\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=1EyRscXrehw|url-status=live}}\u003c\u002fref\u003e [[HyperTalk]]\u003cref\u003e{{cite book |last=Eich |first=Brendan |authorlink1=Brendan Eich |chapter=Foreword |editor1-last=Goodman |editor1-first=Danny |editor1-link=Danny Goodman |year=1998 |title=JavaScript Bible |edition=3rd |publisher=[[John Wiley & Sons]] |isbn=0-7645-3188-3 |lccn=97078208 |oclc=38888873 |ol=712205M |url-access=registration |url=https:\u002f\u002farchive.org\u002fdetails\u002fjavascriptbible000good}}\u003c\u002fref\u003e\u003cbr\u003e | website = {{URL|https:\u002f\u002fecma-international.org\u002fpublications-and-standards\u002fstandards\u002fecma-262\u002f}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-'''JavaScript''' ({{IPAc-en|\u02c8|d\u0292|\u0251\u02d0|v|\u0259|s|k|r|\u026a|p|t|audio=LL-Q1860 (eng)-Flame, not lame-JavaScript.wav}}), often abbreviated as '''JS''', is a [[programming language]] and core technology of the [[World Wide Web]], alongside [[HTML]] and [[CSS]]. \u003c!--don't add dating or decimals: it'll remain 99% indefinitely--\u003eNinety-nine percent of [[website]]s use JavaScript on the [[Client (computing)|client]] side for [[Web page|webpage]] behavior.\u003cref name=\"deployedstats\"\u003e{{cite web |title=Usage Statistics of JavaScript as Client-side Programming Language on Websites |url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002fdetails\u002fcp-javascript |access-date=2024-02-27 |website=W3Techs }}\u003c\u002fref\u003e\u003cbr\u003e+'''JavaScript''' ({{IPAc-en|\u02c8|d\u0292|\u0251\u02d0|v|\u0259|s|k|r|\u026a|p|t}}), often abbreviated as '''JS''', is a [[programming language]] and core technology of [[World Wide Web|the Web]], alongside [[HTML]] and [[CSS]]. \u003c!--don't add dating or decimals: it'll remain 99% indefinitely--\u003e99% of [[website]]s use JavaScript on the [[Client (computing)|client]] side for [[Web page|webpage]] behavior.\u003cref name=\"deployedstats\"\u003e{{cite web |title=Usage Statistics of JavaScript as Client-side Programming Language on Websites |url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002fdetails\u002fcp-javascript |access-date=2024-02-27 |website=W3Techs }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Web browser]]s have a dedicated [[JavaScript engine]] that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e \u003cbr\u003e-JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming styles]]. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e+JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript\u00ae 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming style]]s. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e-Although [[Java (programming language)|Java]] and JavaScript are similar in name and [[Syntax (programming languages)|syntax]], the two languages are distinct and differ greatly in design.\u003cbr\u003e-\u003cbr\u003e-== History ==\u003cbr\u003e-=== Creation at Netscape ===\u003cbr\u003e+Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e+\u003cbr\u003e+==History==\u003cbr\u003e+===Creation at Netscape===\u003cbr\u003e The first popular [[web browser]] with a [[graphical user interface]], [[Mosaic (web browser)|Mosaic]], was released in 1993. Accessible to non-technical people, it played a prominent role in the rapid growth of the early [[World Wide Web]].\u003cref\u003e{{cite news |date=March 17, 2011 |title=Bloomberg Game Changers: Marc Andreessen |work=[[Bloomberg L.P.|Bloomberg]] |publisher=Bloomberg |url=https:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394 |url-status=live |access-date=December 7, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120516093712\u002fhttps:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394\u002f |archive-date=May 16, 2012}}\u003c\u002fref\u003e The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\" \u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\" \u002f\u003e\u003cref name=\"origin\" \u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\" \u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e+The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Adoption by Microsoft ===\u003cbr\u003e+===Adoption by Microsoft===\u003cbr\u003e [[Microsoft]] debuted [[Internet Explorer]] in 1995, leading to a [[browser war]] with Netscape. On the JavaScript front, Microsoft created its own [[Interpreter (computing)|interpreter]] called [[JScript]].\u003cref name=\"sjsch5\"\u003e{{cite web |title=Chapter 5. Standardization: ECMAScript |url=https:\u002f\u002fspeakingjs.com\u002fes5\u002fch05.html |website=speakingjs.com |access-date=1 November 2021 |archive-date=1 November 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20211101184346\u002fhttp:\u002f\u002fspeakingjs.com\u002fes5\u002fch05.html |url-status=dead }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Microsoft first released JScript in 1996, alongside initial support for [[CSS]] and extensions to [[HTML]]. Each of these [[implementation]]s was noticeably different from their counterparts in [[Netscape Navigator]].\u003cref name=\"O'Reilly-2001\"\u003e{{cite web |url=https:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |title=JavaScript, How Did We Get Here? |last=Champeon |first=Steve |date=April 6, 2001 |website=oreilly.com |access-date=July 16, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160719020828\u002fhttps:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |archive-date=July 19, 2016 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |title=Microsoft Internet Explorer 3.0 Beta Now Available |publisher=Microsoft |date=May 29, 1996 |website=microsoft.com |access-date=July 16, 2016 |archive-date=November 24, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201124154053\u002fhttps:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |url-status=live }}\u003c\u002fref\u003e These differences made it difficult for developers to make their websites work well in both browsers, leading to widespread use of \"best viewed in Netscape\" and \"best viewed in Internet Explorer\" logos for several years.\u003cref name=\"O'Reilly-2001\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |title=The Unwelcome Return of \"Best Viewed with Internet Explorer\" |last=McCracken |first=Harry |date=September 16, 2010 |website=technologizer.com |access-date=July 16, 2016 |archive-date=June 23, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180623192402\u002fhttps:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== The rise of JScript ===\u003cbr\u003e-{{Quote box|[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\" \u002f\u003e|width=30%}}\u003cbr\u003e-\u003cbr\u003e+===The rise of JScript===\u003cbr\u003e In November 1996, [[Netscape]] submitted JavaScript to [[Ecma International]], as the starting point for a standard specification that all browser vendors could conform to. This led to the official release of the first [[ECMAScript]] language specification in June 1997.\u003cbr\u003e \u003cbr\u003e-The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-However, the effort to fully standardize the language was undermined by Microsoft gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e+The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+The effort to fully standardize the language was undermined by [[Microsoft]] gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e \u003cbr\u003e Microsoft initially participated in the standards process and implemented some proposals in its JScript language, but eventually it stopped collaborating on ECMA work. Thus ECMAScript 4 was mothballed.\u003cbr\u003e \u003cbr\u003e-=== Growth and standardization ===\u003cbr\u003e+===Growth and standardization===\u003cbr\u003e During the period of [[Internet Explorer]] dominance in the early 2000s, client-side scripting was stagnant. This started to change in 2004, when the successor of Netscape, [[Mozilla]], released the [[Firefox]] browser. Firefox was well received by many, taking significant market share from Internet Explorer.\u003cref\u003e{{cite news |url=https:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |title=The assault on software giant Microsoft |last=Weber |first=Tim |date=May 9, 2005 |work=[[BBC News]] |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170925233936\u002fhttps:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |archive-date=September 25, 2017}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In 2005, Mozilla joined ECMA International, and work started on the [[ECMAScript for XML]] (E4X) standard. This led to Mozilla working jointly with [[Macromedia]] (later acquired by [[Adobe Systems]]), who were implementing E4X in their ActionScript 3 language, which was based on an ECMAScript 4 draft. The goal became standardizing ActionScript 3 as the new ECMAScript 4. To this end, Adobe Systems released the [[Tamarin (software)|Tamarin]] implementation as an [[Open-source model|open source]] project. However, Tamarin and ActionScript 3 were too different from established client-side scripting, and without cooperation from Microsoft, ECMAScript 4 never reached fruition.\u003cbr\u003e+In 2005, Mozilla joined ECMA International, and work started on the [[ECMAScript for XML]] (E4X) standard. This led to Mozilla working jointly with [[Macromedia]] (later acquired by [[Adobe Systems]]), who were implementing E4X in their ActionScript 3 language, which was based on an ECMAScript 4 draft. The goal became standardizing ActionScript 3 as the new ECMAScript 4. To this end, Adobe Systems released the [[Tamarin (software)|Tamarin]] implementation as an [[Open-source model|open source]] project. However, Tamarin and ActionScript 3 were too different from established client-side scripting, and without cooperation from [[Microsoft]], ECMAScript 4 never reached fruition.\u003cbr\u003e \u003cbr\u003e Meanwhile, very important developments were occurring in open-source communities not affiliated with ECMA work. In 2005, [[Jesse James Garrett]] released a white paper in which he coined the term [[Ajax (programming)|Ajax]] and described a set of technologies, of which JavaScript was the backbone, to create [[web application]]s where data can be loaded in the background, avoiding the need for full page reloads. This sparked a renaissance period of JavaScript, spearheaded by open-source libraries and the communities that formed around them. Many new libraries were created, including [[jQuery]], [[Prototype JavaScript Framework|Prototype]], [[Dojo Toolkit]], and [[MooTools]].\u003cbr\u003e \u003cbr\u003e@@ -78,27 +79,25 @@\u003cbr\u003e \u003cbr\u003e In July 2008, these disparate parties came together for a conference in [[Oslo]]. This led to the eventual agreement in early 2009 to combine all relevant work and drive the language forward. The result was the ECMAScript 5 standard, released in December 2009.\u003cbr\u003e \u003cbr\u003e-=== Reaching maturity ===\u003cbr\u003e-Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript 6]] in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180318064130\u002fhttps:\u002f\u002fes6-features.org\u002f |url-status=usurped }}\u003c\u002fref\u003e\u003cbr\u003e+===Reaching maturity===\u003cbr\u003e+Ambitious work on the language continued for several years, culminating in an extensive collection of additions and refinements being formalized with the publication of [[ECMAScript]] 6 in 2015.\u003cref\u003e{{cite web |url=https:\u002f\u002fes6-features.org\u002f |title=ECMAScript 6: New Features: Overview and Comparison |website=es6-features.org |access-date=March 19, 2018 |archive-date=March 18, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180318064130\u002fhttps:\u002f\u002fes6-features.org\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The creation of [[Node.js]] in 2009 by [[Ryan Dahl]] sparked a significant increase in the usage of JavaScript outside of web browsers. Node combines the [[V8 (JavaScript engine)|V8]] engine, an [[event loop]], and [[Input\u002foutput|I\u002fO]] [[Application programming interface|APIs]], thereby providing a stand-alone JavaScript runtime system.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&q=nodejs Professional Node.js: Building JavaScript Based Scalable Software] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170324021220\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=ZH6bpbcrlvYC&printsec=frontcover&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-24 }}, John Wiley & Sons, 01-Oct-2012\u003c\u002fref\u003e\u003cref name=\"b3\"\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&dq=nodejs&pg=PT24 Sams Teach Yourself Node.js in 24 Hours] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170323192039\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=KGt-FxUEj48C&pg=PT24&dq=nodejs&hl=en&sa=X#v=onepage&q=nodejs&f=false |date=2017-03-23 }}, Sams Publishing, 05-Sep-2012\u003c\u002fref\u003e As of 2018, Node had been used by millions of developers,\u003cref\u003e{{cite web |last1=Lawton |first1=George |title=The secret history behind the success of npm and Node |url=https:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |website=TheServerSide |access-date=2 August 2021 |date=19 July 2018 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165613\u002fhttps:\u002f\u002fwww.theserverside.com\u002fblog\u002fCoffee-Talk-Java-News-Stories-and-Opinions\u002fThe-secret-history-behind-the-success-of-npm-and-Node |url-status=live }}\u003c\u002fref\u003e and [[npm (software)|npm]] had the most modules of any [[package manager]] in the world.\u003cref\u003e{{cite web |last1=Brown |first1=Paul |title=State of the Union: npm |url=https:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |website=Linux.com |access-date=2 August 2021 |date=13 January 2017 |archive-date=2 August 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210802165614\u002fhttps:\u002f\u002fwww.linux.com\u002fnews\u002fstate-union-npm\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The ECMAScript draft specification is currently maintained openly on [[GitHub]],\u003cref name=branscombe \u002f\u003e and editions are produced via regular annual snapshots.\u003cref name=branscombe\u003e{{cite web |url=https:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |title=JavaScript Standard Moves to Yearly Release Schedule; Here is What's New for ES16 |last=Branscombe |first=Mary |date=2016-05-04 |access-date=2021-01-15 |work=The New Stack |archive-date=2021-01-16 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210116181757\u002fhttps:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |url-status=live }}\u003c\u002fref\u003e Potential revisions to the language are vetted through a comprehensive proposal process.\u003cref\u003e{{cite web|url=https:\u002f\u002ftc39.es\u002fprocess-document\u002f|title=The TC39 Process|publisher=Ecma International|work=tc39.es|access-date=2021-01-15|archive-date=2021-02-07|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210207105535\u002fhttps:\u002f\u002ftc39.es\u002fprocess-document\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |title=ECMAScript proposals |access-date=2021-01-15 |publisher=TC39 |archive-date=2020-12-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201204221147\u002fhttps:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |url-status=live }}\u003c\u002fref\u003e Now, instead of edition numbers, developers check the status of upcoming features individually.\u003cref name=branscombe \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-The current JavaScript ecosystem has many [[List of JavaScript libraries|libraries]] and [[web framework|frameworks]], established programming practices, and substantial usage of JavaScript outside of web browsers.\u003cref name=\"wired2024\" \u002f\u003e Plus, with the rise of [[single-page application]]s and other JavaScript-heavy websites, several [[source-to-source compiler|transpilers]] have been created to aid the development process.\u003cref name=\"transpilers\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== Trademark ==\u003cbr\u003e-\"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Office]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Legal Notices |url=https:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210605142505\u002fhttps:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |archive-date=2021-06-05 |access-date=2021-05-08 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e The trademark was originally issued to [[Sun Microsystems]] on 6 May 1997, and was transferred to Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |title=Oracle urged again to give up JavaScript trademark |work=The Register |url=https:\u002f\u002fwww.theregister.com\u002f2024\u002f09\u002f17\u002foracle_urged_to_surrender_javascript_trademark\u002f |date=17 September 2024 |last1=Claburn |first1=Thomas |access-date=2 February 2025}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-A letter was circulated in September 2024, spearheaded by [[Ryan Dahl]], calling on Oracle to free the JavaScript trademark.\u003cref\u003e{{Cite news|last=Krill|first=Paul|date=September 20, 2024|title=JavaScript community challenges Oracle\u2019s JavaScript trademark|url=https:\u002f\u002fwww.infoworld.com\u002farticle\u002f3532457\u002fjavascript-community-challenges-oracles-javascript-trademark.html|work=InfoWorld}}\u003c\u002fref\u003e [[Brendan Eich]], the original creator of JavaScript, was among the over 14,000 signatories who supported the initiative.\u003cbr\u003e+The ECMAScript draft specification is currently maintained openly on [[GitHub]],\u003cref name=branscombe\u002f\u003e and editions are produced via regular annual snapshots.\u003cref name=branscombe\u003e{{cite web |url=https:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |title=JavaScript Standard Moves to Yearly Release Schedule; Here is What's New for ES16 |last=Branscombe |first=Mary |date=2016-05-04 |access-date=2021-01-15 |work=The New Stack |archive-date=2021-01-16 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210116181757\u002fhttps:\u002f\u002fthenewstack.io\u002fwhats-new-es2016\u002f |url-status=live }}\u003c\u002fref\u003e Potential revisions to the language are vetted through a comprehensive proposal process.\u003cref\u003e{{cite web|url=https:\u002f\u002ftc39.es\u002fprocess-document\u002f|title=The TC39 Process|publisher=Ecma International|work=tc39.es|access-date=2021-01-15|archive-date=2021-02-07|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210207105535\u002fhttps:\u002f\u002ftc39.es\u002fprocess-document\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |title=ECMAScript proposals |access-date=2021-01-15 |publisher=TC39 |archive-date=2020-12-04 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201204221147\u002fhttps:\u002f\u002fgithub.com\u002ftc39\u002fproposals\u002fblob\u002fmaster\u002fREADME.md |url-status=live }}\u003c\u002fref\u003e Now, instead of edition numbers, developers check the status of upcoming features individually.\u003cref name=branscombe \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+The current JavaScript ecosystem has many [[List of JavaScript libraries|libraries]] and [[web framework|frameworks]], established programming practices, and substantial usage of JavaScript outside of web browsers. Plus, with the rise of [[single-page application]]s and other JavaScript-heavy websites, several [[source-to-source compiler|transpilers]] have been created to aid the development process.\u003cref name=\"transpilers\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==Trademark==\u003cbr\u003e+\"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Office]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Legal Notices |url=https:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210605142505\u002fhttps:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |archive-date=2021-06-05 |access-date=2021-05-08 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e The trademark was originally issued to [[Sun Microsystems]] on 6 May 1997, and was transferred to Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Website client-side usage ==\u003cbr\u003e-JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\" \u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e+JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]]. \u003cbr\u003e \u003cbr\u003e All major [[web browser]]s have a built-in [[JavaScript engine]] that executes the [[Source code|code]] on the user's device.\u003cbr\u003e \u003cbr\u003e-=== Examples of scripted behavior ===\u003cbr\u003e-* Loading new [[web page]] content without reloading the page, via [[Ajax (programming)|Ajax]] or a [[WebSocket]]. For example, [[user (computing)|users]] of [[social media]] can send and receive messages without leaving the current page.\u003cbr\u003e+===Examples of scripted behavior===\u003cbr\u003e+* Loading new [[web page]] content without reloading the page, via [[Ajax (programming)|Ajax]] or a [[WebSocket]]. For example, [[user (computing)|user]]s of [[social media]] can send and receive messages without leaving the current page.\u003cbr\u003e * Web page animations, such as fading objects in and out, resizing, and moving them.\u003cbr\u003e * Playing [[browser game]]s.\u003cbr\u003e * Controlling the [[Media player software|playback]] of [[streaming media]].\u003cbr\u003e@@ -108,51 +107,56 @@\u003cbr\u003e *Redirecting a user to another page.\u003cbr\u003e * Storing and retrieving data on the user's device, via the [[web storage|storage]] or [[Indexed Database API|IndexedDB]] standards.\u003cbr\u003e \u003cbr\u003e-=== Libraries and frameworks ===\u003cbr\u003e+=== Web libraries and frameworks===\u003cbr\u003e Over 80% of websites use a third-party JavaScript [[Library (computing)|library]] or [[web framework]] as part of their client-side scripting.\u003cref name=\"lib_usage\"\u003e{{cite web|url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002foverview\u002fjavascript_library|title=Usage statistics of JavaScript libraries for websites|website=W3Techs|access-date=2021-04-09}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[jQuery]] is by far the most-used.\u003cref name=\"lib_usage\" \u002f\u003e Other notable ones include \u003c!--alphabetically is fair here--\u003e[[Angular (web framework)|Angular]], [[Bootstrap (front-end framework)|Bootstrap]], [[Lodash]], [[Modernizr]], [[React (software)|React]], [[Underscore.js|Underscore]], and [[Vue.js|Vue]].\u003cref name=\"lib_usage\" \u002f\u003e Multiple options can be used in conjunction, such as jQuery and Bootstrap.\u003cref\u003e{{cite web |title=Using jQuery with Bootstrap |url=https:\u002f\u002fclouddevs.com\u002fjquery\u002fweb-projects-with-bootstrap\u002f |website=clouddevs.com |date=10 June 2019 |access-date=17 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-However, the term \"Vanilla JS\" was coined for websites not using any libraries or frameworks at all, instead relying entirely on standard JavaScript functionality.\u003cref\u003e{{cite web |date=2020-06-16 |title=Vanilla JS |url=https:\u002f\u002fvanilla-js.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200616052335\u002fhttps:\u002f\u002fvanilla-js.com\u002f |archive-date=June 16, 2020 |access-date=June 17, 2020 |website=vanilla-js.com}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Other usage{{anchor|Server-side_JavaScript|Uses_outside_web_pages}} ==\u003cbr\u003e+[[jQuery]] is by far the most-used library, with over 75% of websites using it client-side.\u003cref name=\"lib_usage\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Other notable ones are [[Angular (web framework)|Angular]], [[Bootstrap (front-end framework)|Bootstrap]], [[Lodash]], [[Modernizr]], [[React (software)|React]], and [[Underscore.js|Underscore]].\u003cref name=\"lib_usage\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+However, the term \"Vanilla JS\" was coined for websites not using any libraries or frameworks at all, instead relying entirely on standard JavaScript functionality.\u003cref\u003e{{cite web |date=2020-06-16 |title=Vanilla JS |url=https:\u002f\u002fvanilla-js.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200616052335\u002fhttps:\u002f\u002fvanilla-js.com\u002f |archive-date=June 16, 2020 |access-date=June 17, 2020 |website=vanilla-js.com}}\u003c\u002fref\u003e This is the case for over 18% of websites that use JavaScript.\u003cref name=\"lib_usage\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==Other usage{{anchor|Server-side_JavaScript|Uses_outside_web_pages}}==\u003cbr\u003e The use of JavaScript has expanded beyond its [[web browser]] roots. [[JavaScript engine]]s are now embedded\u003c!--don't link Embedded system here--\u003e in a variety of other software systems, both for [[server-side]] website deployments and non-browser [[application software|applications]].\u003cbr\u003e \u003cbr\u003e-Initial attempts at promoting server-side JavaScript usage were [[Netscape Enterprise Server]] and [[Microsoft]]'s [[Internet Information Services]],\u003cref\u003e{{cite web |date=December 11, 1998 |title=Server-Side JavaScript Guide |url=https:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210311173120\u002fhttps:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |archive-date=March 11, 2021 |access-date=May 8, 2021 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Clinick|first1=Andrew|title=Introducing JScript .NET|url=https:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|website=Microsoft Developer Network|publisher=Microsoft|access-date=April 10, 2018|date=July 14, 2000|quote=[S]ince the 1996 introduction of JScript version 1.0 ... we've been seeing a steady increase in the usage of JScript on the server\u2014particularly in Active Server Pages (ASP)|archive-date=November 10, 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171110201649\u002fhttps:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|url-status=live}}\u003c\u002fref\u003e but they were small niches.\u003cref name=\"2009server\" \u002f\u003e Server-side usage eventually started to grow in the late 2000s, with the creation of [[Node.js]] and [[List of server-side JavaScript implementations|other approaches]].\u003cref name=\"2009server\"\u003e{{cite web |url=https:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |title=Server-Side JavaScript, Back with a Vengeance |date=December 17, 2009 |website=readwrite.com |access-date=July 16, 2016 |author=Mahemoff, Michael |archive-date=June 17, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160617030219\u002fhttps:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Initial attempts at promoting server-side JavaScript usage were [[Netscape Enterprise Server]] and [[Microsoft]]'s [[Internet Information Services]],\u003cref\u003e{{cite web |date=December 11, 1998 |title=Server-Side JavaScript Guide |url=https:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210311173120\u002fhttps:\u002f\u002fdocs.oracle.com\u002fcd\u002fE19957-01\u002f816-6411-10\u002fcontents.htm |archive-date=March 11, 2021 |access-date=May 8, 2021 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Clinick|first1=Andrew|title=Introducing JScript .NET|url=https:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|website=Microsoft Developer Network|publisher=Microsoft|access-date=April 10, 2018|date=July 14, 2000|quote=[S]ince the 1996 introduction of JScript version 1.0 ... we've been seeing a steady increase in the usage of JScript on the server\u2014particularly in Active Server Pages (ASP)|archive-date=November 10, 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171110201649\u002fhttps:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|url-status=live}}\u003c\u002fref\u003e but they were small niches.\u003cref name=\"2009server\"\u002f\u003e Server-side usage eventually started to grow in the late 2000s, with the creation of [[Node.js]] and [[List of server-side JavaScript implementations|other approaches]].\u003cref name=\"2009server\"\u003e{{cite web |url=https:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |title=Server-Side JavaScript, Back with a Vengeance |date=December 17, 2009 |website=readwrite.com |access-date=July 16, 2016 |author=Mahemoff, Michael |archive-date=June 17, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160617030219\u002fhttps:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Electron (software framework)|Electron]], [[Apache Cordova|Cordova]], [[React Native]], and other [[application framework]]s have been used to create many applications with behavior implemented in JavaScript. Other non-browser applications include [[Adobe Acrobat]] support for scripting [[PDF]] documents\u003cref\u003e{{cite web |date=2009-08-07 |title=JavaScript for Acrobat |url=https:\u002f\u002fwww.adobe.com\u002fdevnet\u002facrobat\u002fjavascript.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20090807065130\u002fhttps:\u002f\u002fwww.adobe.com\u002fdevnet\u002facrobat\u002fjavascript.html |archive-date=August 7, 2009 |access-date=August 18, 2009 |website=adobe.com}}\u003c\u002fref\u003e and [[GNOME Shell]] extensions written in JavaScript.\u003cref\u003e{{cite web |last=treitter |date=2013-02-02 |title=Answering the question: \"How do I develop an app for GNOME?\" |url=https:\u002f\u002ftreitter.livejournal.com\u002f14871.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130211032900\u002fhttps:\u002f\u002ftreitter.livejournal.com\u002f14871.html |archive-date=2013-02-11 |access-date=2013-02-07 |website=livejournal.com}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[Oracle Corporation|Oracle]] used to provide [[Nashorn (JavaScript engine)| Nashorn]], a JavaScript interpreter, as part of their [[JDK|Java Development Kit (JDK)]] API library along with '''jjs''' a command line interpreter as of JDK version 8.  It was removed in JDK 15. As a replacement Oracle offered GraalJS which can also be used with the [[OpenJDK]]  which allows one to create and reference Java objects in JavaScript code and add runtime scripting in JavaScript to applications written in Java.\u003cref\u003e {{cite web |last=Ponge |first=Julien |date=2018-04-19 |title=Oracle Nashorn: A Next-Generation JavaScript Engine for the JVM |website=oracle.com |url=https:\u002f\u002fwww.oracle.com\u002ftechnical-resources\u002farticles\u002fjava\u002fjf14-nashorn.html |publisher=Oracle Corporation |access-date=Feb 17, 2025}} \u003c\u002fref\u003e\u003cref\u003e{{cite web |author=\u003c!-- not stated --\u003e |title=Migration Guide from Nashorn to GraalJS |url=https:\u002f\u002fwww.graalvm.org\u002flatest\u002freference-manual\u002fjs\u002fNashornMigrationGuide\u002f |website=graalvm.org | access-date=Feb 17, 2025}} \u003c\u002fref\u003e\u003cref\u003e{{cite web |author=\u003c!-- not stated --\u003e |title=GraalJS |url=https:\u002f\u002fwww.graalvm.org\u002flatest\u002freference-manual\u002fjs\u002f |website=|publisher=GraalVM |access-date=Feb 17, 2025}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |author=\u003c!-- not stated --\u003e |title=Java Interoperability | url=https:\u002f\u002fdocs.oracle.com\u002fen\u002fgraalvm\u002fenterprise\u002f21\u002fdocs\u002freference-manual\u002fjs\u002fJavaInteroperability\u002f|website=oracle.com|publisher=Oracle |access-date=Feb 17, 2025}}\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-JavaScript has been used in some [[embedded system]]s, usually by leveraging Node.js.\u003cref\u003e{{cite web |title=Tessel 2... Leverage all the libraries of Node.JS to create useful devices in minutes with Tessel. |url=https:\u002f\u002ftessel.io\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210526212559\u002fhttps:\u002f\u002ftessel.io\u002f |archive-date=2021-05-26 |access-date=2021-05-08 |website=tessel.io}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Node.js Raspberry Pi GPIO Introduction |url=https:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210813192938\u002fhttps:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |archive-date=2021-08-13 |access-date=2020-05-03 |website=w3schools.com}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Espruino&nbsp;\u2013 JavaScript for Microcontrollers |url=https:\u002f\u002fwww.espruino.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200501010722\u002fhttps:\u002f\u002fwww.espruino.com\u002f |archive-date=2020-05-01 |access-date=2020-05-03 |website=espruino.com}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Execution ==\u003cbr\u003e-=== JavaScript engine ===\u003cbr\u003e+JavaScript has recently begun to appear in some [[embedded system]]s, usually by leveraging Node.js.\u003cref\u003e{{cite web |title=Tessel 2... Leverage all the libraries of Node.JS to create useful devices in minutes with Tessel. |url=https:\u002f\u002ftessel.io\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210526212559\u002fhttps:\u002f\u002ftessel.io\u002f |archive-date=2021-05-26 |access-date=2021-05-08 |website=tessel.io}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Node.js Raspberry Pi GPIO Introduction |url=https:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210813192938\u002fhttps:\u002f\u002fwww.w3schools.com\u002fnodejs\u002fnodejs_raspberrypi_gpio_intro.asp |archive-date=2021-08-13 |access-date=2020-05-03 |website=w3schools.com}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Espruino&nbsp;\u2013 JavaScript for Microcontrollers |url=https:\u002f\u002fwww.espruino.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200501010722\u002fhttps:\u002f\u002fwww.espruino.com\u002f |archive-date=2020-05-01 |access-date=2020-05-03 |website=espruino.com}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Execution system ==\u003cbr\u003e+\u003cbr\u003e+===Just-in-time compilation===\u003cbr\u003e+====JavaScript engine====\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e-=== Runtime system ===\u003cbr\u003e-A JavaScript engine must be embedded within a [[runtime system]] (such as a [[web browser]] or a standalone system) to enable scripts to interact with the broader environment. The runtime system includes the necessary APIs for [[input\u002foutput]] operations, such as [[computer network|networking]], [[data storage|storage]], and [[computer graphics|graphics]], and provides the ability to import scripts.\u003cbr\u003e-\u003cbr\u003e-JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e-\u003cbr\u003e-== Features ==\u003cbr\u003e+=== Run-time environment ===\u003cbr\u003e+JavaScript typically relies on a run-time environment (e.g., a [[web browser]]) to provide objects and methods by which scripts can interact with the environment (e.g., a web page [[Document Object Model|DOM]]). These environments are single-[[Thread (computing)|threaded]]. JavaScript also relies on the run-time environment to provide the ability to include\u002fimport scripts (e.g., [[HTML]] \u003ccode\u003e\u003cnowiki\u003e\u003cscript\u003e\u003c\u002fnowiki\u003e\u003c\u002fcode\u003e elements). This is not a language feature per se, but it is common in most JavaScript implementations. JavaScript processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time. JavaScript calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program [[input\u002foutput]] is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for instance, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+====Examples====\u003cbr\u003e+=====Node.js=====\u003cbr\u003e+{{Excerpt|Node.js|only=paragraphs|paragraph=1}}\u003cbr\u003e+\u003cbr\u003e+=====Deno=====\u003cbr\u003e+{{Excerpt|Deno (software)|only=paragraphs|paragraph=1}}\u003cbr\u003e+\u003cbr\u003e+==Features==\u003cbr\u003e The following features are common to all conforming ECMAScript implementations unless explicitly specified otherwise.\u003cbr\u003e \u003cbr\u003e-=== Imperative and structured ===\u003cbr\u003e+===Imperative and structured===\u003cbr\u003e {{Main|Structured programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript supports much of the [[structured programming]] syntax from [[C (computer language)|C]] (e.g., \u003ccode\u003eif\u003c\u002fcode\u003e statements, \u003ccode\u003ewhile\u003c\u002fcode\u003e loops, \u003ccode\u003eswitch\u003c\u002fcode\u003e statements, \u003ccode\u003edo while\u003c\u002fcode\u003e loops, etc.). One partial exception is [[scope (computer science)|scoping]]: originally JavaScript only had [[function scoping]] with \u003ccode\u003evar\u003c\u002fcode\u003e; [[block scoping]] was added in ECMAScript 2015 with the keywords \u003ccode\u003elet\u003c\u002fcode\u003e and \u003ccode\u003e[[const (computer programming)|const]]\u003c\u002fcode\u003e. Like C, JavaScript makes a distinction between [[Expression (computer science)|expressions]] and [[Statement (computer science)|statements]]. One syntactic difference from C is [[Defensive semicolon|automatic semicolon insertion]], which allow semicolons (which terminate statements) to be omitted.\u003cref name=\"Flanagan2006\"\u003e{{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|date=August 17, 2006|publisher=[[O'Reilly Media, Inc.]]|isbn=978-0-596-55447-7|page=16|access-date=March 29, 2019|archive-date=August 1, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200801065235\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Weakly typed ===\u003cbr\u003e+JavaScript supports much of the [[structured programming]] syntax from [[C (computer language)|C]] (e.g., \u003ccode\u003eif\u003c\u002fcode\u003e statements, \u003ccode\u003ewhile\u003c\u002fcode\u003e loops, \u003ccode\u003eswitch\u003c\u002fcode\u003e statements, \u003ccode\u003edo while\u003c\u002fcode\u003e loops, etc.). One partial exception is [[scope (computer science)|scoping]]: originally JavaScript only had [[function scoping]] with \u003ccode\u003evar\u003c\u002fcode\u003e; [[block scoping]] was added in ECMAScript 2015 with the keywords \u003ccode\u003elet\u003c\u002fcode\u003e and \u003ccode\u003e[[const (computer programming)|const]]\u003c\u002fcode\u003e. Like C, JavaScript makes a distinction between [[Expression (computer science)|expressions]] and [[Statement (computer science)|statements]]. One syntactic difference from C is [[Defensive semicolon|automatic semicolon insertion]], which allow semicolons (which terminate statements) to be omitted.\u003cref name=\"Flanagan2006\"\u003e{{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide: The Definitive Guide|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|date=August 17, 2006|publisher=\"O'Reilly Media, Inc.\"|isbn=978-0-596-55447-7|page=16|access-date=March 29, 2019|archive-date=August 1, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200801065235\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Weakly typed===\u003cbr\u003e {{Main|Weakly typed}}\u003cbr\u003e \u003cbr\u003e JavaScript is [[Strong and weak typing|weakly typed]], which means certain types are implicitly cast depending on the operation used.\u003cref name=\"casting_rules\"\u003e{{cite web |last=Korolev |first=Mikhail |date=2019-03-01 |title=JavaScript quirks in one image from the Internet |url=https:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191028204723\u002fhttps:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |archive-date=October 28, 2019 |access-date=October 28, 2019 |website=The DEV Community |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e * The binary \u003ccode\u003e+\u003c\u002fcode\u003e operator casts both operands to a string unless both operands are numbers. This is because the addition operator doubles as a concatenation operator\u003cbr\u003e * The binary \u003ccode\u003e-\u003c\u002fcode\u003e operator always casts both operands to a number\u003cbr\u003e-* Both unary operators (\u003ccode\u003e+\u003c\u002fcode\u003e, \u003ccode\u003e-\u003c\u002fcode\u003e) always cast the operand to a number. However, \u003ccode\u003e+\u003c\u002fcode\u003e always casts to \u003ccode\u003eNumber\u003c\u002fcode\u003e ([[Double-precision floating-point format|binary64]]) while \u003ccode\u003e-\u003c\u002fcode\u003e preserves \u003ccode\u003eBigInt\u003c\u002fcode\u003e ([[Arbitrary-precision arithmetic|integer]])\u003cref\u003e{{cite web | url=https:\u002f\u002fgithub.com\u002ftc39\u002fproposal-bigint\u002fblob\u002fmaster\u002fADVANCED.md#dont-break-asmjs | title=Proposal-bigint\u002fADVANCED.md at master \u00b7 tc39\u002fProposal-bigint | website=[[GitHub]] }}\u003c\u002fref\u003e\u003cbr\u003e+* Both unary operators (\u003ccode\u003e+\u003c\u002fcode\u003e, \u003ccode\u003e-\u003c\u002fcode\u003e) always cast the operand to a number\u003cbr\u003e \u003cbr\u003e Values are cast to strings like the following:\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -203,9 +207,9 @@\u003cbr\u003e |\u003ccode\u003e[[NaN]]\u003c\u002fcode\u003e (number)\u003cbr\u003e |}\u003cbr\u003e \u003cbr\u003e-Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. If the expression is wrapped in parentheses - \u003ccode\u003e({} + [])\u003c\u002fcode\u003e \u2013 the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== Dynamic ===\u003cbr\u003e+Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. The expression is wrapped in parentheses \u003ccode\u003e({} + [])\u003c\u002fcode\u003e the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+===Dynamic===\u003cbr\u003e {{Main|Dynamic Programming}}\u003cbr\u003e \u003cbr\u003e ==== Typing ====\u003cbr\u003e@@ -217,48 +221,22 @@\u003cbr\u003e {{Main|eval}}\u003cbr\u003e JavaScript includes an \u003ccode\u003e[[eval]]\u003c\u002fcode\u003e function that can execute statements provided as strings at run-time.\u003cbr\u003e \u003cbr\u003e-=== Object-orientation (prototype-based) ===\u003cbr\u003e+===Object-orientation (prototype-based)===\u003cbr\u003e Prototypal inheritance in JavaScript is described by [[Douglas Crockford]] as:\u003cbr\u003e {{Blockquote\u003cbr\u003e |You make prototype objects, and then ... make new instances. Objects are mutable in JavaScript, so we can augment the new instances, giving them new fields and methods. These can then act as prototypes for even newer objects. We don't need classes to make lots of similar objects... Objects inherit from objects. What could be more object oriented than that?\u003cref\u003e{{cite web|last=Crockford|first=Douglas|title=Prototypal Inheritance in JavaScript|url=https:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|access-date=20 August 2013|archive-date=13 August 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130813163035\u002fhttps:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-In JavaScript, an [[Object (computer science)|object]] is an [[associative array]], augmented with a prototype (see below); each key provides the name for an object [[Property (programming)|property]], and there are two syntactical ways to specify such a name: dot notation (\u003ccode\u003eobj.x = 10\u003c\u002fcode\u003e) and bracket notation (\u003ccode\u003eobj[\"x\"] = 10\u003c\u002fcode\u003e). A property may be added, rebound, or deleted at run-time. Most [[property (programming)|properties]] of an object (and any property that belongs to an object's prototype inheritance chain) can be enumerated using a \u003ccode\u003efor...in\u003c\u002fcode\u003e loop.\u003cbr\u003e+In JavaScript, an [[Object (computer science)|object]] is an [[associative array]], augmented with a prototype (see below); each key provides the name for an object [[Property (programming)|property]], and there are two syntactical ways to specify such a name: dot notation (\u003ccode\u003eobj.x&nbsp;=&nbsp;10\u003c\u002fcode\u003e) and bracket notation (\u003ccode\u003eobj['x']&nbsp;=&nbsp;10\u003c\u002fcode\u003e). A property may be added, rebound, or deleted at run-time. Most [[property (programming)|properties]] of an object (and any property that belongs to an object's prototype inheritance chain) can be enumerated using a \u003ccode\u003efor...in\u003c\u002fcode\u003e loop.\u003cbr\u003e \u003cbr\u003e ==== Prototypes ====\u003cbr\u003e {{Main|Prototype-based programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]],\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e but it's still possible to simulate most class-based features with the prototype system.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e Additionally, [[ECMAScript |ECMAScript version 6]] (released June 2015) introduced the keywords '''class''', '''extends''' and '''super''', which serve as syntactic sugar to abstract the underlying prototypal inheritance system with a more conventional interface. Constructors are declared by specifying a method named '''constructor''', and all classes are automatically subclasses of the base class Object, similarly to Java. \u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-class Person {\u003cbr\u003e-    constructor(name) {\u003cbr\u003e-        this.name = name;\u003cbr\u003e-    }\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-class Student extends Person {\u003cbr\u003e-    constructor(name, id) {\u003cbr\u003e-        super(name);\u003cbr\u003e-        this.id = id;\u003cbr\u003e-    }\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-const bob = new Student(\"Robert\", 12345);\u003cbr\u003e-console.log(bob.name); \u002f\u002f Robert\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003eThough the underlying object mechanism is still based on prototypes, the newer syntax is similar to other object oriented languages. Private variables are declared by prefixing the field name with a [[number sign]] (#), and [[Polymorphism (computer science)|polymorphism]] is not directly supported, although it can be emulated by manually calling different functions depending on the number and type of arguments provided.\u003cref name=\"JavaScriptNext\"\u003e{{cite book |last=Ghandi |first=Raju |date=2019 |title=JavaScript Next|location=New York City |publisher=Apress Media |pages=159\u2013171 |isbn=978-1-4842-5394-6}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-==== Functions as object constructors ====\u003cbr\u003e-Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref name=\"Haverbeke2024\"\u003e{{Cite book |title=Eloquent JavaScript |last=Haverbeke |first=Marijn |publisher=[[No Starch Press]] |isbn=978-1-71850-411-0 |edition=4th |location=San Francisco |publication-date=September 2024 |pages=[https:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf#section*.204 97\u201398] |language=en |url=https:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20250312193854\u002fhttps:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-date=2025-03-12 |url-status=live}}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor.\u003csyntaxhighlight lang=\"javascript\"\u003e\u002f\u002f This code is completely equivalent to the previous snippet\u003cbr\u003e-function Person(name) {\u003cbr\u003e-    this.name = name;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-function Student(name, id) {\u003cbr\u003e-    Person.call(this, name);\u003cbr\u003e-    this.id = id;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-var bob = new Student(\"Robert\", 12345);\u003cbr\u003e-console.log(bob.name); \u002f\u002f Robert\u003c\u002fsyntaxhighlight\u003eJavaScript's built-in classes, such as \u003ccode\u003eArray\u003c\u002fcode\u003e and \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. However, it's generally considered bad practice to [[Monkey patch|modify built-in objects]], because third-party code may use or inherit methods and properties from these objects, and may not expect the prototype to be modified.\u003cref\u003e{{cite book |last=Herman |first=David |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 |title=Effective JavaScript |publisher=Addison-Wesley |year=2013 |isbn=978-0-321-81218-6 |pages=125\u2013127}}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==== Functions as object constructors ==== \u003cbr\u003e+\u003cbr\u003e+Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as methods ====\u003cbr\u003e {{Main|Method (computer science)}}\u003cbr\u003e@@ -266,36 +244,36 @@\u003cbr\u003e \u003cbr\u003e Unlike in many object-oriented languages, in JavaScript there is no distinction between a function definition and a [[method (computer science)|method]] definition. Rather, the distinction occurs during function calling. When a function is called as a method of an object, the function's local ''this'' keyword is bound to that object for that invocation.\u003cbr\u003e \u003cbr\u003e-=== Functional ===\u003cbr\u003e+===Functional===\u003cbr\u003e {{Main|Functional programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript [[Subroutine|functions]] are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e ==== Lexical closure ====\u003cbr\u003e {{Main|Closure (computer programming)}}\u003cbr\u003e \u003cbr\u003e-A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked.\u003cbr\u003e-\u003cbr\u003e-In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}}\u003cbr\u003e+A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked. \u003cbr\u003e+\u003cbr\u003e+In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Fla
