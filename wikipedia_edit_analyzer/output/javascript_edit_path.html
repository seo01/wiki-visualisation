thin a [[runtime system]] (either a [[web browser]] or a standalone system) to provide objects and methods by which scripts can interact with the larger environment. This includes the necessary APIs for [[input\u002foutput|I\u002fO]], such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. The runtime also provides the ability to import scripts.\u003cbr\u003e+\u003cbr\u003e+JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The notable standalone runtimes are [[Node.js]], [[Deno (software)|Deno]], and [[Bun (software)|Bun]].\u003cbr\u003e ","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -58,13 +58,13 @@\u003cbr\u003e Microsoft first released JScript in 1996, alongside initial support for [[CSS]] and extensions to [[HTML]]. Each of these [[implementation]]s was noticeably different from their counterparts in [[Netscape Navigator]].\u003cref name=\"O'Reilly-2001\"\u003e{{cite web |url=https:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |title=JavaScript, How Did We Get Here? |last=Champeon |first=Steve |date=April 6, 2001 |website=oreilly.com |access-date=July 16, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160719020828\u002fhttps:\u002f\u002farchive.oreilly.com\u002fpub\u002fa\u002fjavascript\u002f2001\u002f04\u002f06\u002fjs_history.html |archive-date=July 19, 2016 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |title=Microsoft Internet Explorer 3.0 Beta Now Available |publisher=Microsoft |date=May 29, 1996 |website=microsoft.com |access-date=July 16, 2016 |archive-date=November 24, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201124154053\u002fhttps:\u002f\u002fnews.microsoft.com\u002f1996\u002f05\u002f29\u002fmicrosoft-internet-explorer-3-0-beta-now-available\u002f |url-status=live }}\u003c\u002fref\u003e These differences made it difficult for developers to make their websites work well in both browsers, leading to widespread use of \"best viewed in Netscape\" and \"best viewed in Internet Explorer\" logos for several years.\u003cref name=\"O'Reilly-2001\" \u002f\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |title=The Unwelcome Return of \"Best Viewed with Internet Explorer\" |last=McCracken |first=Harry |date=September 16, 2010 |website=technologizer.com |access-date=July 16, 2016 |archive-date=June 23, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180623192402\u002fhttps:\u002f\u002fwww.technologizer.com\u002f2010\u002f09\u002f16\u002fthe-unwelcome-return-of-best-viewed-with-internet-explorer\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===The rise of JScript===\u003cbr\u003e+{{Quote box|[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\"\u002f\u003e|width=30%}}\u003cbr\u003e+\u003cbr\u003e In November 1996, [[Netscape]] submitted JavaScript to [[Ecma International]], as the starting point for a standard specification that all browser vendors could conform to. This led to the official release of the first [[ECMAScript]] language specification in June 1997.\u003cbr\u003e \u003cbr\u003e The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[Brendan Eich]] later said of this period: \"It's still kind of a [[sidekick]] language. It's considered slow or annoying. People do [[Pop-up ad|pop-ups]] or those scrolling messages in the old [[status bar]] at the bottom of your old [[web browser|browser]].\"\u003cref name=\"EichVideo\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-The effort to fully standardize the language was undermined by [[Microsoft]] gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e+However, the effort to fully standardize the language was undermined by [[Microsoft]] gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e \u003cbr\u003e Microsoft initially participated in the standards process and implemented some proposals in its JScript language, but eventually it stopped collaborating on ECMA work. Thus ECMAScript 4 was mothballed.\u003cbr\u003e ","--- Revision 69\u003cbr\u003e+++ Revision 70\u003cbr\u003e@@ -825,6 +825,8 @@\u003cbr\u003e \u003cbr\u003e [[asm.js]] is a subset of JavaScript that served as the forerunner of WebAssembly.\u003cref\u003e{{cite web | url=https:\u002f\u002fasmjs.org\u002ffaq.html | title=frequently asked questions | publisher=asm.js | access-date=April 13, 2014 | archive-date=June 4, 2014 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20140604012024\u002fhttps:\u002f\u002fasmjs.org\u002ffaq.html | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+==See also==\u003cbr\u003e+* [[Prototype pollution]]\u003cbr\u003e ==References==\u003cbr\u003e {{Reflist}}\u003cbr\u003e ","--- Revision 70\u003cbr\u003e+++ Revision 71\u003cbr\u003e@@ -743,8 +743,7 @@\u003cbr\u003e \u003cbr\u003e [[Content Security Policy]] is the main intended method of ensuring that only trusted code is executed on a Web page.\u003cbr\u003e \u003cbr\u003e-===Cross-site vulnerabilities===\u003cbr\u003e-====Cross-site scripting====\u003cbr\u003e+===Cross-site scripting===\u003cbr\u003e {{Main|Cross-site scripting}}\u003cbr\u003e \u003cbr\u003e A common JavaScript-related security problem is [[cross-site scripting]] (XSS), a violation of the [[same-origin policy]]. XSS vulnerabilities occur when an attacker can cause a target Website, such as an online banking website, to include a malicious script in the webpage presented to a victim. The script in this example can then access the banking application with the privileges of the victim, potentially disclosing secret information or transferring money without the victim's authorization. One important solution to XSS vulnerabilities is [[HTML sanitization]].\u003cbr\u003e@@ -753,7 +752,7 @@\u003cbr\u003e \u003cbr\u003e XSS vulnerabilities can also occur because of implementation mistakes by browser authors.\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |title=Mozilla Cross-Site Scripting Vulnerability Reported and Fixed&nbsp;\u2013 MozillaZine Talkback |website=Mozillazine.org |access-date=February 24, 2017 |archive-date=July 21, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110721230916\u002fhttp:\u002f\u002fwww.mozillazine.org\u002ftalkback.html?article=4392 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-====Cross-site request forgery====\u003cbr\u003e+===Cross-site request forgery===\u003cbr\u003e {{Main|Cross-site request forgery}}\u003cbr\u003e \u003cbr\u003e Another cross-site vulnerability is [[cross-site request forgery]] (CSRF). In CSRF, code on an attacker's site tricks the victim's browser into taking actions the user did not intend at a target site (like transferring money at a bank). When target sites rely solely on cookies for request authentication, requests originating from code on the attacker's site can carry the same valid login credentials of the initiating user. In general, the solution to CSRF is to require an authentication value in a hidden form field, and not only in the cookies, to authenticate any request that might have lasting effects. Checking the HTTP Referrer header can also help.\u003cbr\u003e@@ -768,6 +767,7 @@\u003cbr\u003e * JavaScript form validation only provides convenience for users, not security. If a site verifies that the user agreed to its terms of service, or filters invalid characters out of fields that should only contain numbers, it must do so on the server, not only the client.\u003cbr\u003e * Scripts can be selectively disabled, so JavaScript cannot be relied on to prevent operations such as right-clicking on an image to save it.\u003cref\u003e{{cite web |last1=Kottelin |first1=Thor |title=Right-click \"protection\"? Forget about it |url=https:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |website=blog.anta.net |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110809195359\u002fhttps:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |archive-date=9 August 2011 |date=17 June 2008}}\u003c\u002fref\u003e\u003cbr\u003e * It is considered very bad practice to embed sensitive information such as passwords in JavaScript because it can be extracted by an attacker.\u003cref\u003e{{cite web |last1=Rehorik |first1=Jan |title=Why You Should Never Put Sensitive Data in Your JavaScript |url=https:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |website=ServiceObjects Blog |date=29 November 2016 |publisher=ServiceObjects |access-date=June 3, 2019 |archive-date=June 3, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190603142957\u002fhttps:\u002f\u002fwww.serviceobjects.com\u002fblog\u002fwhy-you-should-never-put-sensitive-data-in-your-javascript\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+* [[Prototype pollution]] is a runtime vulnerability in which attackers can overwrite arbitrary properties in an object's prototype.\u003cbr\u003e \u003cbr\u003e ===Misplaced trust in developers===\u003cbr\u003e Package management systems such as [[npm (software)|npm]] and Bower are popular with JavaScript developers. Such systems allow a developer to easily manage their program's dependencies upon other developers' program libraries. Developers trust that the maintainers of the libraries will keep them secure and up to date, but that is not always the case. A vulnerability has emerged because of this blind trust. Relied-upon libraries can have new releases that cause bugs or vulnerabilities to appear in all programs that rely upon the libraries. Inversely, a library can go unpatched with known vulnerabilities out in the wild. In a study done looking over a sample of 133,000 websites, researchers found 37% of the websites included a library with at least one known vulnerability.\u003cref name=\"jslibs\"\u003e{{citation |last1=Lauinger |first1=Tobias |last2=Chaabane |first2=Abdelberi |last3=Arshad |first3=Sajjad |last4=Robertson |first4=William |last5=Wilson |first5=Christo |last6=Kirda |first6=Engin |title=Thou Shalt Not Depend on Me: Analysing the Use of Outdated JavaScript Libraries on the Web |url=https:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |website=Northeastern University |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170329045344\u002fhttps:\u002f\u002fwww.ccs.neu.edu\u002fhome\u002farshad\u002fpublications\u002fndss2017jslibs.pdf |archive-date=29 March 2017 |doi = 10.14722\u002fndss.2017.23414 |date = December 21, 2016|arxiv=1811.00918 |isbn=978-1-891562-46-4 |s2cid=17885720 |url-status=dead}}\u003c\u002fref\u003e \"The median lag between the oldest library version used on each website and the newest available version of that library is 1,177 days in ALEXA, and development of some libraries still in active use ceased years ago.\"\u003cref name=\"jslibs\"\u002f\u003e Another possibility is that the maintainer of a library may remove the library entirely. This occurred in March 2016 when Azer Ko\u00e7ulu removed his repository from npm. This caused tens of thousands of programs and websites depending upon his libraries to break.\u003cref\u003e{{cite news |work=Quartz |url=https:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |title=How one programmer broke the internet by deleting a tiny piece of code |first=Keith |last=Collins |date=March 27, 2016 |access-date=February 22, 2017 |archive-date=February 22, 2017 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170222200836\u002fhttps:\u002f\u002fqz.com\u002f646467\u002fhow-one-programmer-broke-the-internet-by-deleting-a-tiny-piece-of-code\u002f |url-status=live }}\u003c\u002fref\u003e\u003cref\u003eSC Magazine UK Script Modules are basically libraries which are included in the given program. They are used for connecting two JavaScript programs together to call the functions written in one program without writing the body of the functions itself in another program\u003cref\u003e{{Cite web |date=15 Dec 2022 |title=JavaScript Importing and Exporting Modules |url=https:\u002f\u002fwww.geeksforgeeks.org\u002fjavascript-importing-and-exporting-modules\u002f |url-status=live |access-date=1 April 2024 |website=GeeksforGeeks}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e ===Vendor-specific extensions===\u003cbr\u003e Historically, some [[JavaScript engine]]s supported these non-standard features:\u003cbr\u003e * conditional \u003ccode\u003ecatch\u003c\u002fcode\u003e clauses (like Java)\u003cbr\u003e@@ -820,9 +816,6 @@\u003cbr\u003e ===JSON===\u003cbr\u003e [[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely-used format supported by many other programming languages.\u003cbr\u003e \u003cbr\u003e-=== Node.js ===\u003cbr\u003e-[[Node.js]] is an event-based, non-blocking, asynchronous I\u002fO framework that uses Google's V8JavaScript engine. It is used for developing applications that make heavy use of the ability to run. JavaScript both on the client, as well as on server side and therefore benefit from the re-usability of code and the lack of context switching. It is open-source and cross-platform. Node.js applications are written in pure JavaScript and can be run within Node.js environment on Windows, Linux etc\u003cref\u003e{{Cite web |date=12 Jan 2018 |title=Node-js.pdf |url=https:\u002f\u002friptutorial.com\u002fDownload\u002fnode-js.pdf |url-status=live |access-date=1 April 2024 |website=RIP Tutorial}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e ===Transpilers===\u003cbr\u003e Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |access-date=February 6, 2020 |archive-date=January 31, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200131233044\u002fhttps:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -201,7 +201,7 @@\u003cbr\u003e |\u003ccode\u003e[[NaN]]\u003c\u002fcode\u003e (number)\u003cbr\u003e |}\u003cbr\u003e \u003cbr\u003e-Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. The expression is wrapped in parentheses \u003ccode\u003e({} + [])\u003c\u002fcode\u003e the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e+Often also mentioned is \u003ccode\u003e{} + []\u003c\u002fcode\u003e resulting in \u003ccode\u003e0\u003c\u002fcode\u003e (number). This is misleading: the \u003ccode\u003e{}\u003c\u002fcode\u003e is interpreted as an empty code block instead of an empty object, and the empty array is cast to a number by the remaining unary \u003ccode\u003e+\u003c\u002fcode\u003e operator. If the expression is wrapped in parentheses - \u003ccode\u003e({} + [])\u003c\u002fcode\u003e - the curly brackets are interpreted as an empty object and the result of the expression is \u003ccode\u003e\"[object Object]\"\u003c\u002fcode\u003e as expected.\u003cref name=\"casting_rules\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e ===Dynamic===\u003cbr\u003e {{Main|Dynamic Programming}}","--- Revision 76\u003cbr\u003e+++ Revision 77\u003cbr\u003e@@ -37,7 +37,7 @@\u003cbr\u003e \u003cbr\u003e [[Web browser]]s have a dedicated [[JavaScript engine]] that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e \u003cbr\u003e-JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript\u00ae 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming style]]s. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e+JavaScript is a [[High-level programming language|high-level]], often [[Just-in-time compilation|just-in-time compiled]] language that conforms to the [[ECMAScript]] standard.\u003cref name=\"tc39\"\u003e{{cite web|title=ECMAScript 2020 Language Specification|url=https:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|url-status=live|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200508053013\u002fhttps:\u002f\u002ftc39.es\u002fecma262\u002f#sec-overview|archive-date=2020-05-08|access-date=2020-05-08}}\u003c\u002fref\u003e It has [[dynamic typing]], [[Prototype-based programming|prototype-based]] [[object-oriented programming|object-orientation]], and [[first-class function]]s. It is [[Programming paradigm|multi-paradigm]], supporting [[Event-driven programming|event-driven]], [[functional programming|functional]], and [[imperative programming|imperative]] [[programming paradigm|programming style]]s. It has [[application programming interface]]s (APIs) for working with text, dates, [[regular expression]]s, standard [[data structure]]s, and the [[Document Object Model]] (DOM).\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e ","--- Revision 77\u003cbr\u003e+++ Revision 78\u003cbr\u003e@@ -45,7 +45,7 @@\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===\u003cbr\u003e-The first popular [[web browser]] with a [[graphical user interface]], [[Mosaic (web browser)|Mosaic]], was released in 1993. Accessible to non-technical people, it played a prominent role in the rapid growth of the early [[World Wide Web]].\u003cref\u003e{{cite news |date=March 17, 2011 |title=Bloomberg Game Changers: Marc Andreessen |work=[[Bloomberg L.P.|Bloomberg]] |publisher=Bloomberg |url=https:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394 |url-status=live |access-date=December 7, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120516093712\u002fhttps:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394\u002f |archive-date=May 16, 2012}}\u003c\u002fref\u003e The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e+The first popular [[web browser]], [[Mosaic (web browser)|Mosaic]], was released in 1993. The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used browser.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 78\u003cbr\u003e+++ Revision 79\u003cbr\u003e@@ -45,7 +45,7 @@\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===\u003cbr\u003e-The first popular [[web browser]], [[Mosaic (web browser)|Mosaic]], was released in 1993. The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used browser.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e+The first popular [[web browser]] with a [[graphical user interface]], [[Mosaic (web browser)|Mosaic]], was released in 1993. Accessible to non-technical people, it played a prominent role in the rapid growth of the early [[World Wide Web]].\u003cref\u003e{{cite news |date=March 17, 2011 |title=Bloomberg Game Changers: Marc Andreessen |work=[[Bloomberg L.P.|Bloomberg]] |publisher=Bloomberg |url=https:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394 |url-status=live |access-date=December 7, 2011 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20120516093712\u002fhttps:\u002f\u002fwww.bloomberg.com\u002fvideo\u002f67758394\u002f |archive-date=May 16, 2012}}\u003c\u002fref\u003e The lead developers of Mosaic then founded the [[Netscape]] corporation, which released a more polished browser, [[Netscape Navigator]], in 1994. This quickly became the most-used.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|title=The Evolution of the Web Browsers|last=Enzer|first=Larry|date=August 31, 2018|website=Monmouth Web Developers|access-date=August 31, 2018|archive-date=August 31, 2018|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180831174847\u002fhttps:\u002f\u002fwww.mwdwebsites.com\u002fnj-web-design-web-browsers.html|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -129,7 +129,7 @@\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e === Runtime system ===\u003cbr\u003e-The JavaScript engine must be embedded within a [[runtime system]] (either a [[web browser]] or a standalone system) to provide objects and methods by which scripts can interact with the larger environment. This includes the necessary APIs for [[input\u002foutput|I\u002fO]], such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. The runtime also provides the ability to import scripts.\u003cbr\u003e+A JavaScript engine needs to be embedded within a runtime system, such as a web browser or a standalone application, to enable scripts to interact with the broader environment. This runtime system offers essential APIs for input\u002foutput operations, including networking, [[Storage virtualization|storage]], and graphics. Additionally, it allows for the importing of scripts.\u003cbr\u003e \u003cbr\u003e JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 80\u003cbr\u003e+++ Revision 81\u003cbr\u003e@@ -41,7 +41,7 @@\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e-Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e+Although JavaScript is similar to the programming language [[Java (programming language)|Java]] in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -41,7 +41,7 @@\u003cbr\u003e \u003cbr\u003e The ECMAScript standard does not include any [[input\u002foutput]] (I\u002fO), such as [[computer network|networking]], [[data storage|storage]], or [[computer graphics|graphics]] facilities. In practice, the web browser or other runtime system provides JavaScript APIs for I\u002fO.\u003cbr\u003e \u003cbr\u003e-Although JavaScript is similar to the programming language [[Java (programming language)|Java]] in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e+Although [[Java (programming language)|Java]] and JavaScript are similar in name, [[Syntax (programming languages)|syntax]], and respective [[Standard library|standard libraries]], the two languages are distinct and differ greatly in design.\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e ===Creation at Netscape===\u003cbr\u003e@@ -129,7 +129,7 @@\u003cbr\u003e {{Excerpt|JavaScript engine}}\u003cbr\u003e \u003cbr\u003e === Runtime system ===\u003cbr\u003e-A JavaScript engine needs to be embedded within a runtime system, such as a web browser or a standalone application, to enable scripts to interact with the broader environment. This runtime system offers essential APIs for input\u002foutput operations, including networking, [[Storage virtualization|storage]], and graphics. Additionally, it allows for the importing of scripts.\u003cbr\u003e+A JavaScript engine must be embedded within a [[runtime system]] (such as a [[web browser]] or a standalone system) to enable scripts to interact with the broader environment. The runtime system includes the necessary APIs for [[input\u002foutput]] operations, such as [[computer network|networking]], [[data storage|storage]], and [[computer graphics|graphics]], and provides the ability to import scripts.\u003cbr\u003e \u003cbr\u003e JavaScript is a single-[[Thread (computing)|threaded]] language. The runtime processes [[Message (computer science)|messages]] from a [[Queue (abstract data type)|queue]] one at a time, and it calls a [[Subroutine|function]] associated with each new message, creating a [[call stack]] frame with the function's [[Parameter (computer programming)|arguments]] and [[local variable]]s. The call stack shrinks and grows based on the function's needs. When the call stack is empty upon function completion, JavaScript proceeds to the next message in the queue. This is called the [[event loop]], described as \"run to completion\" because each message is fully processed before the next message is considered. However, the language's [[Concurrency (computer science)|concurrency model]] describes the event loop as [[Asynchronous I\u002fO|non-blocking]]: program I\u002fO is performed using [[Event (computing)|events]] and [[Callback (computer programming)|callback functions]]. This means, for example, that JavaScript can process a mouse click while waiting for a database query to return information.\u003cref\u003e{{cite web|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|title=Concurrency model and Event Loop|website=Mozilla Developer Network|access-date=August 28, 2015|archive-date=September 5, 2015|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150905045241\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fEventLoop|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 82\u003cbr\u003e+++ Revision 83\u003cbr\u003e@@ -4,6 +4,8 @@\u003cbr\u003e {{Redirect|.js|the Microsoft dialect used in Internet Explorer|JScript|}}\u003cbr\u003e {{For|the uses of JavaScript on Wikipedia|Wikipedia:WikiProject JavaScript|selfref=yes}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e+\u003cbr\u003e+{{Good article}}\u003cbr\u003e \u003cbr\u003e {{Infobox programming language\u003cbr\u003e | name = JavaScript","--- Revision 83\u003cbr\u003e+++ Revision 84\u003cbr\u003e@@ -4,8 +4,6 @@\u003cbr\u003e {{Redirect|.js|the Microsoft dialect used in Internet Explorer|JScript|}}\u003cbr\u003e {{For|the uses of JavaScript on Wikipedia|Wikipedia:WikiProject JavaScript|selfref=yes}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e-\u003cbr\u003e-{{Good article}}\u003cbr\u003e \u003cbr\u003e {{Infobox programming language\u003c ref name=\"lib_usage\"\u002f\u003e Other notable ones include \u003c!--alphabetically is fair here--\u003e[[Angular (web framework)|Angular]], [[Bootstrap (front-end framework)|Bootstrap]], [[Lodash]], [[Modernizr]], [[React (software)|React]], [[Underscore.js|Underscore]], and [[Vue.js|Vue]].\u003cref name=\"lib_usage\"\u002f\u003e Multiple options can be used in conjunction, such as jQuery and Bootstrap.\u003cref\u003e{{cite web |title=Using jQuery with Bootstrap |url=https:\u002f\u002fclouddevs.com\u002fjquery\u002fweb-projects-with-bootstrap\u002f |website=clouddevs.com |date=10 June 2019 |access-date=17 March 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e However, the term \"Vanilla JS\" was coined for websites not using any libraries or frameworks at all, instead relying entirely on standard JavaScript functionality.\u003cref\u003e{{cite web |date=2020-06-16 |title=Vanilla JS |url=https:\u002f\u002fvanilla-js.com\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200616052335\u002fhttps:\u002f\u002fvanilla-js.com\u002f |archive-date=June 16, 2020 |access-date=June 17, 2020 |website=vanilla-js.com}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -2,7 +2,6 @@\u003cbr\u003e {{Use dmy dates|date=March 2024}}\u003cbr\u003e {{Distinguish|Java (programming language)|Javanese script|ECMAScript}}\u003cbr\u003e {{Redirect|.js|the Microsoft dialect used in Internet Explorer|JScript|}}\u003cbr\u003e-{{For|the uses of JavaScript on Wikipedia|Wikipedia:WikiProject JavaScript|selfref=yes}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e \u003cbr\u003e {{Infobox programming language","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -1,7 +1,6 @@\u003cbr\u003e {{Short description|High-level programming language}}\u003cbr\u003e {{Use dmy dates|date=March 2024}}\u003cbr\u003e {{Distinguish|Java (programming language)|Javanese script|ECMAScript}}\u003cbr\u003e-{{Re ish|Java (programming language)|Javanese script|ECMAScript}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e+{{Use dmy dates|date=March 2024}}\u003cbr\u003e \u003cbr\u003e {{Infobox programming language\u003cbr\u003e | name = JavaScript\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Office]]}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Legal Notices |url=https:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210605142505\u002fhttps:\u002f\u002fwww.oracle.com\u002flegal\u002ftrademarks.html |archive-date=2021-06-05 |access-date=2021-05-08 |website=oracle.com |publisher=[[Oracle Corporation]]}}\u003c\u002fref\u003e The trademark was originally issued to [[Sun Microsystems]] on 6 May 1997, and was transferred to Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Website client-side usage ==\u003cbr\u003e-JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]]. \u003cbr\u003e+JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e \u003cbr\u003e All major [[web browser]]s have a built-in [[JavaScript engine]] that executes the [[Source code|code]] on the user's device.\u003cbr\u003e \u003cbr\u003e@@ -226,7 +226,7 @@\u003cbr\u003e \u003cbr\u003e JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==== Functions as object constructors ==== \u003cbr\u003e+==== Functions as object constructors ====\u003cbr\u003e \u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -239,14 +239,14 @@\u003cbr\u003e ===Functional===\u003cbr\u003e {{Main|Functional programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e \u003cbr\u003e+JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Lexical closure ====\u003cbr\u003e {{Main|Closure (computer programming)}}\u003cbr\u003e \u003cbr\u003e-A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked. \u003cbr\u003e-\u003cbr\u003e-In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}} \u003cbr\u003e+A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked.\u003cbr\u003e+\u003cbr\u003e+In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}}\u003cbr\u003e \u003cbr\u003e ==== Anonymous function ====\u003cbr\u003e {{Main|Anonymous function}}\u003cbr\u003e@@ -286,7 +286,7 @@\u003cbr\u003e In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.\u003cref\u003e{{cite book | last=Haverbeke | first=Marijn | title=Eloquent JavaScript | year=2011 | publisher=No Starch Press|isbn=978-1-59327-282-1|pages=139\u2013149 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA139 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e-JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{cn|date=August 2023}} \u003cbr\u003e+JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}\u003cbr\u003e \u003cbr\u003e ===== Promises =====\u003cbr\u003e {{Main|Futures and promises}}\u003cbr\u003e@@ -812,7 +812,7 @@\u003cbr\u003e The differences between the two languages are more prominent than their similarities. Java has [[static typing]], while JavaScript's typing is [[Dynamic typing|dynamic]]. Java is loaded from [[Compiler|compiled]] bytecode, while JavaScript is loaded as human-readable source code. Java's objects are [[Class-based programming|class-based]], while JavaScript's are [[Prototype-based programming|prototype-based]]. Finally, Java did not support functional programming until Java 8, while JavaScript has done so from the beginning, being influenced by [[Scheme (programming language)|Scheme]].\u003cbr\u003e \u003cbr\u003e ===JSON===\u003cbr\u003e-[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely-used format supported by many other programming languages.\u003cbr\u003e+[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely used format supported by many other programming languages.\u003cbr\u003e \u003cbr\u003e ===Transpilers===\u003cbr\u003e Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title ]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]]. \u003cbr\u003e+JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\"\u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e \u003cbr\u003e All major [[web browser]]s have a built-in [[JavaScript engine]] that executes the [[Source code|code]] on the user's device.\u003cbr\u003e \u003cbr\u003e@@ -226,7 +226,7 @@\u003cbr\u003e \u003cbr\u003e JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==== Functions as object constructors ==== \u003cbr\u003e+==== Functions as object constructors ====\u003cbr\u003e \u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -239,14 +239,14 @@\u003cbr\u003e ===Functional===\u003cbr\u003e {{Main|Functional programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e \u003cbr\u003e+JavaScript [[Subroutine|function]]s are [[first-class function|first-class]]; a function is considered to be an object.\u003cref\u003e{{cite web|title=Function&nbsp;\u2013 JavaScript|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fGlobal_Objects\u002fFunction|access-date=2021-10-30|website=[[MDN Web Docs]]|language=en-US}}\u003c\u002fref\u003e As such, a function may have properties and methods, such as \u003ccode\u003e.call()\u003c\u002fcode\u003e and \u003ccode\u003e.bind()\u003c\u002fcode\u003e.\u003cref\u003e{{cite web | url=https:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | title=Properties of the Function Object | publisher=Es5.github.com | access-date=May 26, 2013 | archive-date=January 28, 2013 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130128185825\u002fhttps:\u002f\u002fes5.github.com\u002f#x15.3.4-toc | url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Lexical closure ====\u003cbr\u003e {{Main|Closure (computer programming)}}\u003cbr\u003e \u003cbr\u003e-A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked. \u003cbr\u003e-\u003cbr\u003e-In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}} \u003cbr\u003e+A ''nested'' function is a function defined within another function. It is created each time the outer function is invoked.\u003cbr\u003e+\u003cbr\u003e+In addition, each nested function forms a [[Closure (computer programming)|lexical closure]]: the [[Scope (programming)#Lexical scoping vs. dynamic scoping|lexical scope]] of the outer function (including any constant, local variable, or argument value) becomes part of the internal state of each inner function object, even after execution of the outer function concludes.{{Sfn|Flanagan|2006|p=141}}\u003cbr\u003e \u003cbr\u003e ==== Anonymous function ====\u003cbr\u003e {{Main|Anonymous function}}\u003cbr\u003e@@ -286,7 +286,7 @@\u003cbr\u003e In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.\u003cref\u003e{{cite book | last=Haverbeke | first=Marijn | title=Eloquent JavaScript | year=2011 | publisher=No Starch Press|isbn=978-1-59327-282-1|pages=139\u2013149 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA139 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e-JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{cn|date=August 2023}} \u003cbr\u003e+JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}\u003cbr\u003e \u003cbr\u003e ===== Promises =====\u003cbr\u003e {{Main|Futures and promises}}\u003cbr\u003e@@ -812,7 +812,7 @@\u003cbr\u003e The differences between the two languages are more prominent than their similarities. Java has [[static typing]], while JavaScript's typing is [[Dynamic typing|dynamic]]. Java is loaded from [[Compiler|compiled]] bytecode, while JavaScript is loaded as human-readable source code. Java's objects are [[Class-based programming|class-based]], while JavaScript's are [[Prototype-based programming|prototype-based]]. Finally, Java did not support functional programming until Java 8, while JavaScript has done so from the beginning, being influenced by [[Scheme (programming language)|Scheme]].\u003cbr\u003e \u003cbr\u003e ===JSON===\u003cbr\u003e-[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely-used format supported by many other programming languages.\u003cbr\u003e+[[JSON]] is a data format derived from JavaScript; hence the name JavaScript Object Notation. It is a widely used format supported by many other programming languages.\u003cbr\u003e \u003cbr\u003e ===Transpilers===\u003cbr\u003e Many websites are JavaScript-heavy, so [[transpiler]]s have been created to convert code written in other languages, which can aid the development process.\u003cref name=\"transpilers\"\u003e{{cite web |title=List of languages that compile to JS |first=Jeremy |last=Ashkenas |website=[[GitHub]] |author-link=Jeremy Ashkenas |url=https:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |access-date=February 6, 2020 |archive-date=January 31, 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200131233044\u002fhttps:\u002f\u002fgithub.com\u002fjashkenas\u002fcoffeescript\u002fwiki\u002fList-of-languages-that-compile-to-JS |url-status=live }}\u003c\u002fref\u003e","--- Revision 89\u003cbr\u003e+++ Revision 90\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cbr\u003e+The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e \u003cref name=\"wired2024\"\u003e [https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f JavaScript Runs the World\u2014Maybe Even Literally], by Sheon Han, March 4 2024, Wired.com website. \u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e \u003cbr\u003e During these formative years of the Web, [[web page]]s could only be static, lacking the capability for dynamic behavior after the page was loaded in the browser. There was a desire in the flourishing web development scene to remove this limitation, so in 1995, Netscape decided to add a [[programming language]] to Navigator. They pursued two routes to achieve this: collaborating with [[Sun Microsystems]] to embed the [[Java (programming language)|Java]] language, while also hiring [[Brendan Eich]] to embed the [[Scheme (programming language)|Scheme]] language.\u003cref name=\"origin\"\u003e{{cite web|url=https:\u002f\u002fexploringjs.com\u002fes5\u002fch04.html|title=Chapter 4. How JavaScript Was Created|website=speakingjs.com|access-date=2017-11-21|archive-date=2020-02-27|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200227184037\u002fhttps:\u002f\u002fspeakingjs.com\u002fes5\u002fch04.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The goal was a \"language for the masses\",\u003cref name=\"EichVideo\"\u002f\u003e \"to help nonprogrammers create dynamic, interactive [[website|Web sites]]\".\u003cref\u003e\"Netscape Communications Corp.\", Browser enhancements. Encyclop\u00e6dia Britannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e \u003cref name=\"wired2024\"\u003e [https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u00 ritannica 2006 Ultimate Reference Suite DVD\u003c\u002fref\u003e Netscape management soon decided that the best option was for Eich to devise a new language, with syntax similar to Java and less like Scheme or other extant [[scripting language]]s.\u003cref name=\"looklikejava\"\u002f\u003e\u003cref name=\"origin\"\u002f\u003e Although the new language and its [[Interpreter (computing)|interpreter]] implementation were called LiveScript when first shipped as part of a Navigator [[beta software|beta]] in September 1995, the name was changed to JavaScript for the official release in December.\u003cref name=\"origin\"\u002f\u003e\u003cref name=\"press_release\" \u002f\u003e\u003cref name=\"techvision\"\u003e{{cite web | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20080208124612\u002fhttps:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html | archive-date=February 8, 2008 | title=TechVision: Innovators of the Net: Brendan Eich and JavaScript | url=https:\u002f\u002fwp.netscape.com\u002fcomprod\u002fcolumns\u002ftechvision\u002finnovators_be.html }}\u003c\u002fref\u003e\u003cref name=\"wired2024\"\u003e{{cite magazine |last1=Han |first1=Sheon |title=JavaScript Runs the World\u2014Maybe Even Literally |url=https:\u002f\u002fwww.wired.com\u002fstory\u002fjavascript-runs-the-world-maybe-literally\u002f |magazine=Wired |date=4 March 2024 |access-date=21 August 2024}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The choice of the JavaScript name has caused confusion, implying that it is directly related to Java. At the time, the [[Dot-com bubble|dot-com boom]] had begun and Java was a popular new language, so Eich considered the JavaScript name a marketing ploy by Netscape.\u003cref name=\"EichVideo\"\u003e{{Citation|last=Fin JS|title=Brendan Eich&nbsp;\u2013 CEO of Brave|date=June 17, 2016|url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=XOmhtfTrRxc |website=YouTube |access-date=February 7, 2018 }}\u003c\u002fre
