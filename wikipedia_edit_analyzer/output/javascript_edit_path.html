n Eich]], the original creator of JavaScript, was among the over 14,000 signatories who supported the initiative.\u003cbr\u003e+\u003cbr\u003e == Website client-side usage ==\u003cbr\u003e JavaScript is the dominant [[client-side]] [[scripting language]] of the Web, with 99% of all [[website]]s using it for this purpose.\u003cref name=\"deployedstats\" \u002f\u003e Scripts are embedded in or included from [[HTML]] documents and interact with the [[Document Object Model|DOM]].\u003cbr\u003e ","--- Revision 21\u003cbr\u003e+++ Revision 22\u003cbr\u003e@@ -764,7 +764,7 @@\u003cbr\u003e * requiring an authentication token in the [[POST (HTTP)|POST]] and [[GET (HTTP)|GET]] parameters for any response that returns private information.\u003cbr\u003e \u003cbr\u003e === Misplaced trust in the client ===\u003cbr\u003e-Developers of client-server applications must recognize that untrusted clients may be under the control of attackers. The application author cannot assume that their JavaScript code will run as intended (or at all) because any secret embedded in the code could be extracted by a determined adversary. Some implications are:\u003cbr\u003e+Developers of client-server applications must recognize that untrusted clients may be under the control of attackers. The author of an application should not assume that their JavaScript code will run as intended (or at all) because any secret embedded in the code could be extracted by a determined adversary. Some implications are:\u003cbr\u003e * Website authors cannot perfectly conceal how their JavaScript operates because the raw source code must be sent to the client. The code can be [[obfuscated code|obfuscated]], but obfuscation can be reverse-engineered.\u003cbr\u003e * JavaScript form validation only provides convenience for users, not security. If a site verifies that the user agreed to its terms of service, or filters invalid characters out of fields that should only contain numbers, it must do so on the server, not only the client.\u003cbr\u003e * Scripts can be selectively disabled, so JavaScript cannot be relied on to prevent operations such as right-clicking on an image to save it.\u003cref\u003e{{cite web |last1=Kottelin |first1=Thor |title=Right-click \"protection\"? Forget about it |url=https:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |website=blog.anta.net |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20110809195359\u002fhttps:\u002f\u002fblog.anta.net\u002f2008\u002f06\u002f17\u002fright-click-%E2%80%9Cprotection%E2%80%9D-forget-about-it\u002f |archive-date=9 August 2011 |date=17 June 2008}}\u003c\u002fref\u003e","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -230,7 +230,6 @@\u003cbr\u003e JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as object constructors ====\u003cbr\u003e-\u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as methods ====\u003cbr\u003e@@ -310,10 +309,11 @@\u003cbr\u003e \u003cbr\u003e == Syntax ==\u003cbr\u003e {{Main|JavaScript syntax}}\u003cbr\u003e-\u003cbr\u003e-=== Simple examples ===\u003cbr\u003e [[Variable (computer science)|Variables]] in JavaScript can be defined using either the \u003ccode\u003evar\u003c\u002fcode\u003e,\u003cref\u003e{{cite web | url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | title=var \u2013 JavaScript | publisher=The [[Mozilla Developer Network]] | access-date=December 22, 2012 | archive-date=December 23, 2012 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121223162713\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fStatements\u002fvar | url-status=live }}\u003c\u002fref\u003e \u003ccode\u003elet\u003c\u002fcode\u003e\u003cref name=\"moz_let\"\u003e{{cite web |title=let |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_let |archive-date=May 28, 2019 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190528140803\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002flet |url-status=live }}\u003c\u002fref\u003e or \u003ccode\u003econst\u003c\u002fcode\u003e\u003cref name=\"moz_const\"\u003e{{cite web |title=const |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |website=MDN web docs |publisher=Mozilla |access-date=June 27, 2018 |ref=moz_const |archive-date=June 28, 2018 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180628044054\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002fconst |url-status=live }}\u003c\u002fref\u003e keywords.  Variables defined without keywords will be defined at the global scope.\u003cbr\u003e \u003cbr\u003e+Arrow functions were first introduced in [[w:ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition \u2013 ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e+\u003cbr\u003e+Here is an example of JavaScript syntax.\u003cbr\u003e \u003csyntaxhighlight lang=\"javascript\" start=\"1\"\u003e\u003cbr\u003e \u002f\u002f Declares a function-scoped variable named `x`, and implicitly assigns the\u003cbr\u003e \u002f\u002f special value `undefined` to it. Variables without value are automatically\u003cbr\u003e@@ -351,391 +351,7 @@\u003cbr\u003e \u003cbr\u003e Note the [[Comment (computer programming)|comments]] in the examples above, all of which were preceded with two [[Slash (punctuation)|forward slashes]].\u003cbr\u003e \u003cbr\u003e-There is no built-in [[Input\u002foutput]] functionality in JavaScript, instead it is provided by the run-time environment. The ECMAScript specification in edition 5.1 mentions that \"there are no provisions in this specification for input of external data or output of computed results\".\u003cref\u003e{{cite web| url=https:\u002f\u002fwww.ecma-international.org\u002fecma-262\u002f5.1\u002f#sec-4| title=ECMAScript Language Specification \u2013 ECMA-262 Edition 5.1| publisher=[[Ecma International]]| access-date=December 22, 2012| archive-date=November 26, 2012| archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121126044218\u002fhttps:\u002f\u002fecma-international.org\u002fecma-262\u002f5.1\u002f#sec-4| url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-However, most runtime environments have a \u003ccode\u003econsole\u003c\u002fcode\u003e object that can be used to print output.\u003cref\u003e{{cite web|title=console|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fDOM\u002fconsole|work=Mozilla Developer Network|publisher=[[Mozilla]]|access-date=April 6, 2013|archive-date=February 28, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130228112150\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fDOM\u002fconsole|url-status=live}}\u003c\u002fref\u003e Here is a minimalist [[\"Hello, World!\" program]] in JavaScript in a runtime environment with a console object:\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-console.log(\"Hello, World!\");\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-In HTML documents, a program like this is required for an output:\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-\u002f\u002f Text nodes can be made using the \"write\" method.\u003cbr\u003e-\u002f\u002f This is frowned upon, as it can overwrite the document if the document is fully loaded.\u003cbr\u003e-document.write('foo');\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Elements can be made too. First, they have to be created in the DOM.\u003cbr\u003e-const myElem = document.createElement('span');\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Attributes like classes and the id can be set as well\u003cbr\u003e-myElem.classList.add('foo');\u003cbr\u003e-myElem.id = 'bar';\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f After setting this, the tag will look like this: `\u003cspan class=\"foo\" id=\"bar\" data-attr=\"baz\"\u003e\u003c\u002fspan\u003e`\u003cbr\u003e-myElem.setAttribute('data-attr', 'baz'); \u002f\u002f Which could also be written as `myElem.dataset.attr = 'baz'`\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Finally append it as a child element to the \u003cbody\u003e in the HTML\u003cbr\u003e-document.body.appendChild(myElem);\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Elements can be imperatively grabbed with querySelector for one element, or querySelectorAll for multiple elements that can be looped with forEach\u003cbr\u003e-document.querySelector('.class'); \u002f\u002f Selects the first element with the \"class\" class\u003cbr\u003e-document.querySelector('#id'); \u002f\u002f Selects the first element with an `id` of \"id\"\u003cbr\u003e-document.querySelector('[data-other]'); \u002f\u002f Selects the first element with the \"data-other\" attribute\u003cbr\u003e-document.querySelectorAll('.multiple'); \u002f\u002f Returns an Array-like NodeList of all elements with the \"multiple\" class\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003eA simple [[Recursion (computer science)|recursive]] function to calculate the [[factorial]] of a [[natural number]]:\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-function factorial(n) {\u003cbr\u003e-    \u002f\u002f Checking the argument for legitimacy. Factorial is defined for positive integers.\u003cbr\u003e-    if (isNaN(n)) {\u003cbr\u003e-        console.error(\"Non-numerical argument not allowed.\");\u003cbr\u003e-        return NaN; \u002f\u002f The special value: Not a Number\u003cbr\u003e-    }\u003cbr\u003e-    if (n === 0)\u003cbr\u003e-        return 1; \u002f\u002f 0! = 1\u003cbr\u003e-    if (n \u003c 0)\u003cbr\u003e-        return undefined; \u002f\u002f Factorial of negative numbers is not defined.\u003cbr\u003e-    if (n % 1) {\u003cbr\u003e-        console.warn(`${n} will be rounded to the closest integer. For non-integers consider using gamma function instead.`);\u003cbr\u003e-        n = Math.round(n);\u003cbr\u003e-    }\u003cbr\u003e-    \u002f\u002f The above checks need not be repeated in the recursion, hence defining the actual recursive part separately below.\u003cbr\u003e-\u003cbr\u003e-    \u002f\u002f The following line is a function expression to recursively compute the factorial. It uses the arrow syntax introduced in ES6.\u003cbr\u003e-    const recursivelyCompute = a =\u003e a \u003e 1 ? a * recursivelyCompute(a - 1) : 1; \u002f\u002f Note the use of the ternary operator `?`.\u003cbr\u003e-    return recursivelyCompute(n);\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-factorial(3); \u002f\u002f Returns 6\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-An [[anonymous function]] (or lambda):\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-const counter = function() {\u003cbr\u003e-    let count = 0;\u003cbr\u003e-    return function() {\u003cbr\u003e-        return ++count;\u003cbr\u003e-    }\u003cbr\u003e-};\u003cbr\u003e-\u003cbr\u003e-const x = counter();\u003cbr\u003e-x(); \u002f\u002f Returns 1\u003cbr\u003e-x(); \u002f\u002f Returns 2\u003cbr\u003e-x(); \u002f\u002f Returns 3\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-This example shows that, in JavaScript, [[Closure (computer programming)|function closures]] capture their non-local variables by reference.\u003cbr\u003e-\u003cbr\u003e-Arrow functions were first introduced in [[ECMAScript#6th Edition \u2013 ECMAScript 2015|6th Edition \u2013 ECMAScript 2015]]. They shorten the syntax for writing functions in JavaScript. Arrow functions are anonymous, so a variable is needed to refer to them in order to invoke them after their creation, unless surrounded by parenthesis and executed immediately.\u003cbr\u003e-\u003cbr\u003e-Example of arrow function:\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-\u002f\u002f Arrow functions let us omit the `function` keyword.\u003cbr\u003e-\u002f\u002f Here `long_example` points to an anonymous function value.\u003cbr\u003e-const long_example = (input1, input2) =\u003e {\u003cbr\u003e-    console.log(\"Hello, World!\");\u003cbr\u003e-    const output = input1 + input2;\u003cbr\u003e-\u003cbr\u003e-    return output;\u003cbr\u003e-};\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f If there are no braces, the arrow function simply returns the expression\u003cbr\u003e-\u002f\u002f So here it's (input1 + input2)\u003cbr\u003e-const short_example = (input1, input2) =\u003e input1 + input2;\u003cbr\u003e-\u003cbr\u003e-long_example(2, 3); \u002f\u002f Prints \"Hello, World!\" and returns 5\u003cbr\u003e-short_example(2, 5);  \u002f\u002f Returns 7\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f If an arrow function has only one parameter, the parentheses can be removed.\u003cbr\u003e-const no_parentheses = input =\u003e input + 2;\u003cbr\u003e-\u003cbr\u003e-no_parentheses(3); \u002f\u002f Returns 5\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f An arrow function, like other function definitions, can be executed in the same statement as they are created.\u003cbr\u003e-\u002f\u002f This is useful when writing libraries to avoid filling the global scope, and for closures.\u003cbr\u003e-let three = ((a, b) =\u003e a + b) (1, 2);\u003cbr\u003e-\u003cbr\u003e-const generate_multiplier_function = a =\u003e (b =\u003e isNaN(b) || !b ? a : a*=b);\u003cbr\u003e-const five_multiples = generate_multiplier_function(5); \u002f\u002f The supplied argument \"seeds\" the expression and is retained by a.\u003cbr\u003e-five_multiples(1); \u002f\u002f Returns 5\u003cbr\u003e-five_multiples(3); \u002f\u002f Returns 15\u003cbr\u003e-five_multiples(4); \u002f\u002f Returns 60\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-In JavaScript, [[Object (computer science)|objects]] can be created as [[Instance (computer science)|instances]] of a [[class (computer science)|class]].\u003cbr\u003e-\u003cbr\u003e-Object class example:\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-class Ball {\u003cbr\u003e-\u003cbr\u003e-   constructor(radius) {\u003cbr\u003e-      this.radius = radius;\u003cbr\u003e-      this.area = Math.PI * ( radius ** 2 );\u003cbr\u003e-   }\u003cbr\u003e-\u003cbr\u003e-   \u002f\u002f Classes (and thus objects) can contain functions known as methods\u003cbr\u003e-   show() {\u003cbr\u003e-      console.log(this.radius);\u003cbr\u003e-   }\u003cbr\u003e-};\u003cbr\u003e-\u003cbr\u003e-const myBall = new Ball(5); \u002f\u002f Creates a new instance of the ball object with radius 5\u003cbr\u003e-myBall.radius++; \u002f\u002f Object properties can usually be modified from the outside\u003cbr\u003e-myBall.show();   \u002f\u002f Using the inherited \"show\" function logs \"6\"\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-In JavaScript, [[Object (computer science)|objects]] can be instantiated directly from a function.\u003cbr\u003e-\u003cbr\u003e-Object functional example:\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-function Ball(radius) {\u003cbr\u003e-\u003cbr\u003e-   const area = Math.PI * ( radius ** 2 );\u003cbr\u003e-   const obj = { radius, area };\u003cbr\u003e-\u003cbr\u003e-   \u002f\u002f Objects are mutable, and functions can be added as properties.\u003cbr\u003e-   obj.show = () =\u003e console.log(obj.radius);\u003cbr\u003e-   return obj;\u003cbr\u003e-};\u003cbr\u003e-\u003cbr\u003e-const myBall = Ball(5); \u002f\u002f Creates a new ball object with radius 5. No \"new\" keyword needed.\u003cbr\u003e-myBall.radius++; \u002f\u002f The instance property can be modified.\u003cbr\u003e-myBall.show();   \u002f\u002f Using the \"show\" function logs \"6\" - the new instance value.\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-[[Variadic function]] demonstration (\u003ccode\u003earguments\u003c\u002fcode\u003e is a special [[variable (programming)|variable]]):\u003cref\u003e{{cite web|title=arguments|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fFunctions_and_function_scope\u002farguments|work=Mozilla Developer Network|publisher=[[Mozilla]]|access-date=April 6, 2013|archive-date=April 13, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130413230225\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fReference\u002fFunctions_and_function_scope\u002farguments|url-status=live}}\u003c\u002fref\u003e\u003c!-- What about spread syntax? https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fOperators\u002fSpread_syntax --\u003e\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-function sum() {\u003cbr\u003e-    let x = 0;\u003cbr\u003e-\u003cbr\u003e-    for (let i = 0; i \u003c arguments.length; ++i)\u003cbr\u003e-        x += arguments[i];\u003cbr\u003e-\u003cbr\u003e-    return x;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-sum(1, 2); \u002f\u002f Returns 3\u003cbr\u003e-sum(1, 2, 3); \u002f\u002f Returns 6\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f As of ES6, using the rest operator.\u003cbr\u003e-function sum(...args) {\u003cbr\u003e-    return args.reduce((a, b) =\u003e a + b);\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-sum(1, 2); \u002f\u002f Returns 3\u003cbr\u003e-sum(1, 2, 3); \u002f\u002f Returns 6\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-[[Immediately-invoked function expression]]s are often used to create closures. Closures allow gathering properties and methods in a namespace and making some of them private:\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-let counter = (function() {\u003cbr\u003e-    let i = 0; \u002f\u002f Private property\u003cbr\u003e-\u003cbr\u003e-    return {   \u002f\u002f Public methods\u003cbr\u003e-        get: function() {\u003cbr\u003e-            alert(i);\u003cbr\u003e-        },\u003cbr\u003e-        set: function(value) {\u003cbr\u003e-            i = value;\u003cbr\u003e-        },\u003cbr\u003e-        increment: function() {\u003cbr\u003e-            alert(++i);\u003cbr\u003e-        }\u003cbr\u003e-    };\u003cbr\u003e-})(); \u002f\u002f Module\u003cbr\u003e-\u003cbr\u003e-counter.get(); \u002f\u002f Returns 0\u003cbr\u003e-counter.set(6);\u003cbr\u003e-counter.increment(); \u002f\u002f Returns 7\u003cbr\u003e-counter.increment(); \u002f\u002f Returns 8\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-[[Generator (computer programming)|Generator]] objects (in the form of generator functions) provide a function which can be called, exited, and re-entered while maintaining internal context (statefulness).\u003cref\u003e{{Cite web |title=function* - JavaScript {{!}} MDN |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fReference\u002fStatements\u002ffunction* |access-date=2022-09-27 |website=developer.mozilla.org |language=en-US}}\u003c\u002fref\u003e\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-function* rawCounter() {\u003cbr\u003e-    yield 1;\u003cbr\u003e-    yield 2;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-function* dynamicCounter() {\u003cbr\u003e-    let count = 0;\u003cbr\u003e-    while (true) {\u003cbr\u003e-        \u002f\u002f It is not recommended to utilize while true loops in most cases.\u003cbr\u003e-        yield ++count;\u003cbr\u003e-    }\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Instances\u003cbr\u003e-const counter1 = rawCounter();\u003cbr\u003e-const counter2 = dynamicCounter();\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Implementation\u003cbr\u003e-counter1.next(); \u002f\u002f {value: 1, done: false}\u003cbr\u003e-counter1.next(); \u002f\u002f {value: 2, done: false}\u003cbr\u003e-counter1.next(); \u002f\u002f {value: undefined, done: true}\u003cbr\u003e-\u003cbr\u003e-counter2.next(); \u002f\u002f {value: 1, done: false}\u003cbr\u003e-counter2.next(); \u002f\u002f {value: 2, done: false}\u003cbr\u003e-counter2.next(); \u002f\u002f {value: 3, done: false}\u003cbr\u003e-\u002f\u002f ...infinitely\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-JavaScript can export and import from modules:\u003cref name=\"moz_modules\"\u003e{{cite web |title=JavaScript modules |url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fGuide\u002fModules |website=MDN Web Docs |publisher=Mozilla |access-date=28 July 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220717083604\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fWeb\u002fJavaScript\u002fGuide\u002fModules |archive-date=17 July 2022 |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Export example:\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-\u002f* mymodule.js *\u002f\u003cbr\u003e-\u002f\u002f This function remains private, as it is not exported\u003cbr\u003e-let sum = (a, b) =\u003e {\u003cbr\u003e-    return a + b;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Export variables\u003cbr\u003e-export let name = 'Alice';\u003cbr\u003e-export let age = 23;\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Export named functions\u003cbr\u003e-export function add(num1, num2) {\u003cbr\u003e-    return num1 + num2;\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Export class\u003cbr\u003e-export class Multiplication {\u003cbr\u003e-    constructor(num1, num2) {\u003cbr\u003e-        this.num1 = num1;\u003cbr\u003e-        this.num2 = num2;\u003cbr\u003e-    }\u003cbr\u003e-\u003cbr\u003e-    add() {\u003cbr\u003e-        return sum(this.num1, this.num2);\u003cbr\u003e-    }\u003cbr\u003e-}\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-Import example:\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-\u002f\u002f Import one property\u003cbr\u003e-import { add } from '.\u002fmymodule.js';\u003cbr\u003e-console.log(add(1, 2));\u003cbr\u003e-\u002f\u002f\u003e 3\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Import multiple properties\u003cbr\u003e-import { name, age } from '.\u002fmymodule.js';\u003cbr\u003e-console.log(name, age);\u003cbr\u003e-\u002f\u002f\u003e \"Alice\", 23\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Import all properties from a module\u003cbr\u003e-import * from '.\u002fmodule.js'\u003cbr\u003e-console.log(name, age);\u003cbr\u003e-\u002f\u002f\u003e \"Alice\", 23\u003cbr\u003e-console.log(add(1,2));\u003cbr\u003e-\u002f\u002f\u003e 3\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-=== More advanced example ===\u003cbr\u003e-This sample code displays various JavaScript features.\u003cbr\u003e-\u003c!-- Don't try to standardize any styling in this example\u2014its purpose is to showcase language syntax, not provide some standard role model. --\u003e\u003cbr\u003e-\u003cbr\u003e-\u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e-\u002f* Finds the lowest common multiple (LCM) of two numbers *\u002f\u003cbr\u003e-function LCMCalculator(x, y) { \u002f\u002f constructor function\u003cbr\u003e-    if (isNaN(x*y)) throw new TypeError(\"Non-numeric arguments not allowed.\");\u003cbr\u003e-    const checkInt = function(x) { \u002f\u002f inner function\u003cbr\u003e-        if (x % 1 !== 0)\u003cbr\u003e-            throw new TypeError(x + \"is not an integer\");\u003cbr\u003e-\u003cbr\u003e-        return x;\u003cbr\u003e-    };\u003cbr\u003e-\u003cbr\u003e-    this.a = checkInt(x)\u003cbr\u003e-    \u002f\u002f   semicolons   ^^^^  are optional, a newline is enough\u003cbr\u003e-    this.b = checkInt(y);\u003cbr\u003e-}\u003cbr\u003e-\u002f\u002f The prototype of object instances created by a constructor is\u003cbr\u003e-\u002f\u002f that constructor's \"prototype\" property.\u003cbr\u003e-LCMCalculator.prototype = { \u002f\u002f object literal\u003cbr\u003e-    constructor: LCMCalculator, \u002f\u002f when reassigning a prototype, set the constructor property appropriately\u003cbr\u003e-    gcd: function() { \u002f\u002f method that calculates the greatest common divisor\u003cbr\u003e-        \u002f\u002f Euclidean algorithm:\u003cbr\u003e-        let a = Math.abs(this.a), b = Math.abs(this.b), t;\u003cbr\u003e-\u003cbr\u003e-        if (a \u003c b) {\u003cbr\u003e-            \u002f\u002f swap variables\u003cbr\u003e-            \u002f\u002f t = b; b = a; a = t;\u003cbr\u003e-            [a, b] = [b, a]; \u002f\u002f swap using destructuring assignment (ES6)\u003cbr\u003e-        }\u003cbr\u003e-\u003cbr\u003e-        while (b !== 0) {\u003cbr\u003e-            t = b;\u003cbr\u003e-            b = a % b;\u003cbr\u003e-            a = t;\u003cbr\u003e-        }\u003cbr\u003e-\u003cbr\u003e-        \u002f\u002f Only need to calculate GCD once, so \"redefine\" this method.\u003cbr\u003e-        \u002f\u002f (Actually not redefinition\u2014it's defined on the instance itself,\u003cbr\u003e-        \u002f\u002f so that this.gcd refers to this \"redefinition\" instead of LCMCalculator.prototype.gcd.\u003cbr\u003e-        \u002f\u002f Note that this leads to a wrong result if the LCMCalculator object members \"a\" or \"b\" are altered afterwards.)\u003cbr\u003e-        \u002f\u002f Also, 'gcd' === \"gcd\", this['gcd'] === this.gcd\u003cbr\u003e-        this['gcd'] = function() {\u003cbr\u003e-            return a;\u003cbr\u003e-        };\u003cbr\u003e-\u003cbr\u003e-        return a;\u003cbr\u003e-    },\u003cbr\u003e-\u003cbr\u003e-    \u002f\u002f Object property names can be specified by strings delimited by double (\") or single (') quotes.\u003cbr\u003e-    \"lcm\": function() {\u003cbr\u003e-        \u002f\u002f Variable names do not collide with object properties, e.g., |lcm| is not |this.lcm|.\u003cbr\u003e-        \u002f\u002f not using |this.a*this.b| to avoid FP precision issues\u003cbr\u003e-        let lcm = this.a \u002f this.gcd() * this.b;\u003cbr\u003e-\u003cbr\u003e-        \u002f\u002f Only need to calculate lcm once, so \"redefine\" this method.\u003cbr\u003e-        this.lcm = function() {\u003cbr\u003e-            return lcm;\u003cbr\u003e-        };\u003cbr\u003e-\u003cbr\u003e-        return lcm;\u003cbr\u003e-    },\u003cbr\u003e-\u003cbr\u003e-    \u002f\u002f Methods can also be declared using ES6 syntax\u003cbr\u003e-    toString() {\u003cbr\u003e-        \u002f\u002f Using both ES6 template literals and the (+) operator to concatenate values\u003cbr\u003e-        return `LCMCalculator: a = ${this.a}, b = ` + this.b;\u003cbr\u003e-    }\u003cbr\u003e-};\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Define generic output function; this implementation only works for Web browsers\u003cbr\u003e-function output(x) {\u003cbr\u003e-    document.body.appendChild(document.createTextNode(x));\u003cbr\u003e-    document.body.appendChild(document.createElement('br'));\u003cbr\u003e-}\u003cbr\u003e-\u003cbr\u003e-\u002f\u002f Note: Array's map() and forEach() are defined in JavaScript 1.6.\u003cbr\u003e-\u002f\u002f They are used here to demonstrate JavaScript's inherent functional nature.\u003cbr\u003e-[\u003cbr\u003e-    [25, 55],\u003cbr\u003e-    [21, 56],\u003cbr\u003e-    [22, 58],\u003cbr\u003e-    [28, 56]\u003cbr\u003e-].map(function(pair) { \u002f\u002f array literal + mapping function\u003cbr\u003e-    return new LCMCalculator(pair[0], pair[1]);\u003cbr\u003e-}).sort((a, b) =\u003e a.lcm() - b.lcm()) \u002f\u002f sort with this comparative function; =\u003e is a shorthand form of a function, called \"arrow function\"\u003cbr\u003e-    .forEach(printResult);\u003cbr\u003e-\u003cbr\u003e-function printResult(obj) {\u003cbr\u003e-    output(obj + \", gcd = \" + obj.gcd() + \", lcm = \" + obj.lcm());\u003cbr\u003e-}\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-The following output should be displayed in the browser window.\u003cbr\u003e-\u003csyntaxhighlight lang=\"output\"\u003e\u003cbr\u003e-LCMCalculator: a = 28, b = 56, gcd = 28, lcm = 56\u003cbr\u003e-LCMCalculator: a = 21, b = 56, gcd = 7, lcm = 168\u003cbr\u003e-LCMCalculator: a = 25, b = 55, gcd = 5, lcm = 275\u003cbr\u003e-LCMCalculator: a = 22, b = 58, gcd = 2, lcm = 638\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e+More examples can be found at the [[wikibooks:JavaScript\u002fSyntax examples|Wikibooks page on JavaScript syntax examples]].\u003cbr\u003e \u003cbr\u003e == Security ==\u003cbr\u003e {{See also|Browser security}}","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -89,7 +89,7 @@\u003cbr\u003e The current JavaScript ecosystem has many [[List of JavaScript libraries|libraries]] and [[web framework|frameworks]], established programming practices, and substantial usage of JavaScript outside of web browsers.\u003cref name=\"wired2024\" \u002f\u003e Plus, with the rise of [[single-page application]]s and other JavaScript-heavy websites, several [[source-to-source compiler|transpilers]] have been created to aid the development process.\u003cref name=\"transpilers\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e == Trademark ==\u003cbr\u003e-\"JavaScript\" is a [[trademark]] of [[Oracle Corporation]] in the United States.\u003cref\u003e{{cite web |date=1997-05-06 |title=U.S. Trademark Serial No. 75026640 |url=https:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210713022850\u002fhttps:\u002f\u002ftsdr.uspto.gov\u002f#caseNumber=75026640&caseType=SERIAL_NO&searchType=statusSearch |archive-date=2021-07-13 |access-date=2021-05-08 |website=uspto.gov |publisher=[[United States Patent and Trademark Of o Oracle when they acquired Sun in 2009.\u003cref\u003e{{Cite news |title=Oracle to buy Sun in $7.4-bn deal | newspaper=The Economic Times |url=https:\u002f\u002feconomictimes.indiatimes.com\u002ftech\u002fsoftware\u002foracle-to-buy-sun-in-7-4-bn-deal\u002farticleshow\u002f4427747.cms | date = 21 April 2009}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |title=Oracle urged again to give up JavaScript trademark |work=The Register |url=https:\u002f\u002fwww.theregister.com\u002f2024\u002f09\u002f17\u002foracle_urged_to_surrender_javascript_trademark\u002f |date=17 September 2024 |last1=Claburn |first1=Thomas |access-date=2 February 2025}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e A letter was circulated in September 2024, spearheaded by [[Ryan Dahl]], calling on Oracle to free the JavaScript trademark.\u003cref\u003e{{Cite web |title=JavaScript\u2122\ufe0f |url=https:\u002f\u002fjavascript.tm\u002f}}\u003c\u002fref\u003e [[Brendan Eich]], the original creator of JavaScript, was among the over 14,000 signatories who supported the initiative.\u003cbr\u003e ","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -2,7 +2,6 @@\u003cbr\u003e {{Distinguish|Java (programming language)|Javanese script|ECMAScript}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e {{Use dmy dates|date=March 2024}}\u003cbr\u003e-\u003cbr\u003e {{Infobox programming language\u003cbr\u003e | name = JavaScript\u003cbr\u003e | logo = \u003c!-- Do not add the unofficial logo, per [[Talk:JavaScript\u002fArchive 5#Why is the unofficial logo present?]] --\u003e\u003cbr\u003e@@ -32,7 +31,7 @@\u003cbr\u003e | website = {{URL|https:\u002f\u002fecma-international.org\u002fpublications-and-standards\u002fstandards\u002fecma-262\u002f}}\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-'''JavaScript''' ({{IPAc-en|\u02c8|d\u0292|\u0251\u02d0|v|\u0259|s|k|r|\u026a|p|t}}), often abbreviated as '''JS''', is a [[programming language]] and core technology of [[World Wide Web|the Web]], alongside [[HTML]] and [[CSS]]. \u003c!--don't add dating or decimals: it'll remain 99% indefinitely--\u003e99% of [[website]]s use JavaScript on the [[Client (computing)|client]] side for [[Web page|webpage]] behavior.\u003cref name=\"deployedstats\"\u003e{{cite web |title=Usage Statistics of JavaScript as Client-side Programming Language on Websites |url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002fdetails\u002fcp-javascript |access-date=2024-02-27 |website=W3Techs }}\u003c\u002fref\u003e\u003cbr\u003e+'''JavaScript''' ({{IPAc-en|\u02c8|d\u0292|\u0251\u02d0|v|\u0259|s|k|r|\u026a|p|t}}), often abbreviated as '''JS''', is a [[programming language]] and core technology of [[World Wide Web|the Web]], alongside [[HTML]] and [[CSS]]. \u003c!--don't add dating or decimals: it'll remain 99% indefinitely--\u003eNinety-nine percent of [[website]]s use JavaScript on the [[Client (computing)|client]] side for [[Web page|webpage]] behavior.\u003cref name=\"deployedstats\"\u003e{{cite web |title=Usage Statistics of JavaScript as Client-side Programming Language on Websites |url=https:\u002f\u002fw3techs.com\u002ftechnologies\u002fdetails\u002fcp-javascript |access-date=2024-02-27 |website=W3Techs }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Web browser]]s have a dedicated [[JavaScript engine]] that executes the client [[Source code|code]]. These engines are also utilized in some [[Server (computing)|servers]] and a variety of [[Application software|apps]]. The most popular [[runtime system]] for non-browser usage is [[Node.js]].\u003cbr\u003e ","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -226,7 +226,17 @@\u003cbr\u003e ==== Prototypes ====\u003cbr\u003e {{Main|Prototype-based programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript initially used [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e [[ECMAScript | ECMAScript version 6]] (released June 2015) introduced the keywords '''class''', '''extends''' and '''super'''. Constructors are introduced using a method named '''constructor'''.  All classes are automatically subclasses of the superclass  Object. \u003cbr\u003e+\u003cbr\u003e+''\u003cpre\u003eclass Person {\u003cbr\u003e+     constructor(name) {\u003cbr\u003e+        this.name=name;\u003cbr\u003e+       }\u003cbr\u003e+     }\u003cbr\u003e+\u003cbr\u003e+ bob=new Person(\"Robert\");\u003c\u002fpre\u003e ''\u003cbr\u003e+  \u003cbr\u003e+Though the underlying mechanism is still based on prototypes the newer syntax is similar to other object oriented languages. What is different is that all methods and attributes of a class are public and modifiers such as private, public or protected are not provided, nor is  [[polymorphism (computer science)| polymophism]] directly supported.   \u003cref name=JavaScriptNext\u003e{{cite book |last=Ghandi |first=Raju |date=2019 |title=JavaScript Next|location=New York City |publisher=Apress Media |pages=159-171 |isbn=978-1-4842-5394-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as object constructors ====\u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -221,25 +221,42 @@\u003cbr\u003e |You make prototype objects, and then ... make new instances. Objects are mutable in JavaScript, so we can augment the new instances, giving them new fields and methods. These can then act as prototypes for even newer objects. We don't need classes to make lots of similar objects... Objects inherit from objects. What could be more object oriented than that?\u003cref\u003e{{cite web|last=Crockford|first=Douglas|title=Prototypal Inheritance in JavaScript|url=https:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|access-date=20 August 2013|archive-date=13 August 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130813163035\u002fhttps:\u002f\u002fjavascript.crockford.com\u002fprototypal.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e }}\u003cbr\u003e \u003cbr\u003e-In JavaScript, an [[Object (computer science)|object]] is an [[associative array]], augmented with a prototype (see below); each key provides the name for an object [[Property (programming)|property]], and there are two syntactical ways to specify such a name: dot notation (\u003ccode\u003eobj.x&nbsp;=&nbsp;10\u003c\u002fcode\u003e) and bracket notation (\u003ccode\u003eobj['x']&nbsp;=&nbsp;10\u003c\u002fcode\u003e). A property may be added, rebound, or deleted at run-time. Most [[property (programming)|properties]] of an object (and any property that belongs to an object's prototype inheritance chain) can be enumerated using a \u003ccode\u003efor...in\u003c\u002fcode\u003e loop.\u003cbr\u003e+In JavaScript, an [[Object (computer science)|object]] is an [[associative array]], augmented with a prototype (see below); each key provides the name for an object [[Property (programming)|property]], and there are two syntactical ways to specify such a name: dot notation (\u003ccode\u003eobj.x = 10\u003c\u002fcode\u003e) and bracket notation (\u003ccode\u003eobj[\"x\"] = 10\u003c\u002fcode\u003e). A property may be added, rebound, or deleted at run-time. Most [[property (programming)|properties]] of an object (and any property that belongs to an object's prototype inheritance chain) can be enumerated using a \u003ccode\u003efor...in\u003c\u002fcode\u003e loop.\u003cbr\u003e \u003cbr\u003e ==== Prototypes ====\u003cbr\u003e {{Main|Prototype-based programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript initially used [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]].\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e It is possible to simulate many class-based features with prototypes in JavaScript.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e [[ECMAScript | ECMAScript version 6]] (released June 2015) introduced the keywords '''class''', '''extends''' and '''super'''. Constructors are introduced using a method named '''constructor'''.  All classes are automatically subclasses of the superclass  Object. \u003cbr\u003e-\u003cbr\u003e-''\u003cpre\u003eclass Person {\u003cbr\u003e-     constructor(name) {\u003cbr\u003e-        this.name=name;\u003cbr\u003e-       }\u003cbr\u003e-     }\u003cbr\u003e-\u003cbr\u003e- bob=new Person(\"Robert\");\u003c\u002fpre\u003e ''\u003cbr\u003e-  \u003cbr\u003e-Though the underlying mechanism is still based on prototypes the newer syntax is similar to other object oriented languages. What is different is that all methods and attributes of a class are public and modifiers such as private, public or protected are not provided, nor is  [[polymorphism (computer science)| polymophism]] directly supported.   \u003cref name=JavaScriptNext\u003e{{cite book |last=Ghandi |first=Raju |date=2019 |title=JavaScript Next|location=New York City |publisher=Apress Media |pages=159-171 |isbn=978-1-4842-5394-6}}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript uses [[prototype-based programming|prototypes]] where many other object-oriented languages use [[Class (computer science)|classes]] for [[Inheritance (object-oriented programming)|inheritance]],\u003cref\u003e{{cite web|title=Inheritance and the prototype chain|url=https:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|work=[[Mozilla]] Developer Network |access-date=April 6, 2013|archive-date=April 25, 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130425144207\u002fhttps:\u002f\u002fdeveloper.mozilla.org\u002fen-US\u002fdocs\u002fJavaScript\u002fGuide\u002fInheritance_and_the_prototype_chain|url-status=live}}\u003c\u002fref\u003e but it's still possible to simulate most class-based features with the prototype system.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|page=83 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA83 }}\u003c\u002fref\u003e Additionally, [[ECMAScript |ECMAScript version 6]] (released June 2015) introduced the keywords '''class''', '''extends''' and '''super''', which serve as syntactic sugar to abstract the underlying prototypal inheritance system with a more conventional interface. Constructors are declared by specifying a method named '''constructor''', and all classes are automatically subclasses of the base class Object, similarly to Java. \u003csyntaxhighlight lang=\"javascript\"\u003e\u003cbr\u003e+class Person {\u003cbr\u003e+    constructor(name) {\u003cbr\u003e+        this.name = name;\u003cbr\u003e+    }\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+class Student extends Person {\u003cbr\u003e+    constructor(name, id) {\u003cbr\u003e+        super(name);\u003cbr\u003e+        this.id = id;\u003cbr\u003e+    }\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+const bob = new Student(\"Robert\", 12345);\u003cbr\u003e+console.log(bob.name); \u002f\u002f Robert\u003cbr\u003e+\u003c\u002fsyntaxhighlight\u003eThough the underlying object mechanism is still based on prototypes, the newer syntax is similar to other object oriented languages. Private variables are declared by prefixing the field name with a hashtag (#), and [[Polymorphism (computer science)|polymorphism]] is not directly supported, although it can be emulated by manually calling different functions depending on the number and type of arguments provided.\u003cref name=\"JavaScriptNext\"\u003e{{cite book |last=Ghandi |first=Raju |date=2019 |title=JavaScript Next|location=New York City |publisher=Apress Media |pages=159-171 |isbn=978-1-4842-5394-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as object constructors ====\u003cbr\u003e-Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor. JavaScript's built-in constructors, such as \u003ccode\u003eArray\u003c\u002fcode\u003e or \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. While it is possible to modify the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, it is generally considered bad practice because most objects in JavaScript will inherit methods and properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype, and they may not expect the prototype to be modified.\u003cref\u003e{{cite book|last=Herman|first=David|title=Effective JavaScript|year=2013|publisher=Addison-Wesley|isbn=978-0-321-81218-6|pages=125\u2013127 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 }}\u003c\u002fref\u003e\u003cbr\u003e+Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor.\u003csyntaxhighlight lang=\"javascript\"\u003e\u002f\u002f This code is completely equivalent to the previous snippet\u003cbr\u003e+function Person(name) {\u003cbr\u003e+    this.name = name;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+function Student(name, id) {\u003cbr\u003e+    Person.call(this, name);\u003cbr\u003e+    this.id = id;\u003cbr\u003e+}\u003cbr\u003e+\u003cbr\u003e+var bob = new Student(\"Robert\", 12345);\u003cbr\u003e+console.log(bob.name); \u002f\u002f Robert\u003c\u002fsyntaxhighlight\u003eJavaScript's built-in classes, such as \u003ccode\u003eArray\u003c\u002fcode\u003e and \u003ccode\u003eObject\u003c\u002fcode\u003e, also have prototypes that can be modified. However, it's generally considered bad practice to [[Monkey patch|modify built-in objects]], because third-party code may use or inherit methods and properties from these objects, and may not expect the prototype to be modified.\u003cref\u003e{{cite book |last=Herman |first=David |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Nz9iAwAAQBAJ&pg=PA125 |title=Effective JavaScript |publisher=Addison-Wesley |year=2013 |isbn=978-0-321-81218-6 |pages=125\u2013127}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as methods ====\u003cbr\u003e {{Main|Method (computer science)}}","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -148,7 +148,7 @@\u003cbr\u003e \u003cbr\u003e JavaScript is [[Strong and weak typing|weakly typed]], which means certain types are implicitly cast depending on the operation used.\u003cref name=\"casting_rules\"\u003e{{cite web |last=Korolev |first=Mikhail |date=2019-03-01 |title=JavaScript quirks in one image from the Internet |url=https:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20191028204723\u002fhttps:\u002f\u002fdev.to\u002fmkrl\u002fjavascript-quirks-in-one-image-from-the-internet-52m7 |archive-date=October 28, 2019 |access-date=October 28, 2019 |website=The DEV Community |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-* The binary \u003ccode\u003e+\u003c\u002fcode\u003e operator casts both operands to a string unless both operands are numbers. This is because the addition operator doubles as a concatenation operator\u003cbr\u003e+* The binary \u003ccode\u003e+\u003c\u002fcode\u003e operator casts both operands to a string unless both operands are numbers, since the addition operator doubles as a concatenation operator\u003cbr\u003e * The binary \u003ccode\u003e-\u003c\u002fcode\u003e operator always casts both operands to a number\u003cbr\u003e * Both unary operators (\u003ccode\u003e+\u003c\u002fcode\u003e, \u003ccode\u003e-\u003c\u002fcode\u003e) always cast the operand to a number. However, \u003ccode\u003e+\u003c\u002fcode\u003e always casts to \u003ccode\u003eNumber\u003c\u002fcode\u003e ([[Double-precision floating-point format|binary64]]) while \u003ccode\u003e-\u003c\u002fcode\u003e preserves \u003ccode\u003eBigInt\u003c\u002fcode\u003e ([[Arbitrary- ia |pages=159\u2013171 |isbn=978-1-4842-5394-6}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Functions as object constructors ====\u003cbr\u003e Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref\u003e{{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|year=2011|publisher=No Starch Press|isbn=978-1-59327-282-1|pages=95\u201397 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor.\u003csyntaxhighlight lang=\"javascript\"\u003e\u002f\u002f This code is completely equivalent to the previous snippet","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -328,7 +328,6 @@\u003cbr\u003e \u003cbr\u003e === Vend om\u002fen-us\u002flibrary\u002fms974588.aspx|website=Microsoft Developer Network|publisher=Microsoft|access-date=April 10, 2018|date=July 14, 2000|quote=[S]ince the 1996 introduction of JScript version 1.0 ... we've been seeing a steady increase in the usage of JScript on the server\u2014particularly in Active Server Pages (ASP)|archive-date=November 10, 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20171110201649\u002fhttps:\u002f\u002fmsdn.microsoft.com\u002fen-us\u002flibrary\u002fms974588.aspx|url-status=live}}\u003c\u002fref\u003e but they were small niches.\u003cref name=\"2009server\" \u002f\u003e Server-side usage eventually started to grow in the late 2000s, with the creation of [[Node.js]] and [[List of server-side JavaScript implementations|other approaches]].\u003cref name=\"2009server\"\u003e{{cite web |url=https:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |title=Server-Side JavaScript, Back with a Vengeance |date=December 17, 2009 |website=readwrite.com |access-date=July 16, 2016 |author=Mahemoff, Michael |archive-date=June 17, 2016 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20160617030219\u002fhttps:\u002f\u002freadwrite.com\u002f2009\u002f12\u002f17\u002fserver-side_javascript_back_with_a_vengeance\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Electron (software framework)|Electron]], [[Apache Cordova|Cordova]], [[React Native]], and other [[application framework]]s have been used to create many applications with behavior implemented in JavaScript. Other non-browser applications include [[Adobe Acrobat]] support for scripting [[PDF]] documents\u003cref\u003e{{cite web |date=2009-08-07 |title=JavaScript for Acrobat |url=https:\u002f\u002fwww.adobe.com\u002fdevnet\u002facrobat\u002fjavascript.html |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20090807065130\u002fhttps:\u002f\u002fwww.adobe 002fbooks?id=9U5I_tskq9MC&pg=PA95 }}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor.\u003csyntaxhighlight lang=\"javascript\"\u003e\u002f\u002f This code is completely equivalent to the previous snippet\u003cbr\u003e+Functions double as object constructors, along with their typical role. Prefixing a function call with ''new'' will create an instance of a prototype, inheriting properties and methods from the constructor (including properties from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype).\u003cref name=\"Haverbeke2024\"\u003e{{Cite book |title=Eloquent JavaScript |last=Haverbeke |first=Marijn |publisher=[[No Starch Press]] |isbn=978-1-71850-411-0 |edition=4th |location=San Francisco |publication-date=September 2024 |pages=[https:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf#section*.204 97\u201398] |language=en |url=https:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20250312193854\u002fhttps:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-date=2025-03-12 |url-status=live}}\u003c\u002fref\u003e ECMAScript 5 offers the \u003ccode\u003eObject.create\u003c\u002fcode\u003e method, allowing explicit creation of an instance without automatically inheriting from the \u003ccode\u003eObject\u003c\u002fcode\u003e prototype (older environments can assign the prototype to \u003ccode\u003enull\u003c\u002fcode\u003e).\u003cref\u003e{{cite web|last=Katz|first=Yehuda|title=Understanding \"Prototypes\" in JavaScript|date=12 August 2011|url=https:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|access-date=April 6, 2013|archive-date=5 April 2013|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130405154842\u002fhttps:\u002f\u002fyehudakatz.com\u002f2011\u002f08\u002f12\u002funderstanding-prototypes-in-javascript\u002f|url-status=live}}\u003c\u002fref\u003e The constructor's \u003ccode\u003eprototype\u003c\u002fcode\u003e property determines the object used for the new object's internal prototype. New methods can be added by modifying the prototype of the function used as a constructor.\u003csyntaxhighlight lang=\"javascript\"\u003e\u002f\u002f This code is completely equivalent to the previous snippet\u003cbr\u003e function Person(name) {\u003cbr\u003e     this.name = name;\u003cbr\u003e }\u003cbr\u003e@@ -313,7 +313,7 @@\u003cbr\u003e ==== Regular expressions ====\u003cbr\u003e {{Main|Regular expression}}\u003cbr\u003e \u003cbr\u003e-In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.\u003cref\u003e{{cite book | last=Haverbeke | first=Marijn | title=Eloquent JavaScript | year=2011 | publisher=No Starch Press|isbn=978-1-59327-282-1|pages=139\u2013149 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=9U5I_tskq9MC&pg=PA139 }}\u003c\u002fref\u003e\u003cbr\u003e+In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}\u003cbr\u003e@@ -476,7 +476,7 @@\u003cbr\u003e == Further reading ==\u003cbr\u003e {{See also|ECMAScript#External_links|l1=ECMAScript Specification Documents}}\u003cbr\u003e * {{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide|edition=7th|location=Sebastopol, California|publisher=O'Reilly|year=2020|isbn=978-1-491-95202-3}}\u003cbr\u003e-* {{cite book|last=Haverbeke|first=Marijn|title=Eloquent JavaScript|url=https:\u002f\u002feloquentjavascript.net|edition=3rd|publisher=No Starch Press|year=2018|isbn=978-1593279509}}\u003cbr\u003e+* {{Cite book |title=Eloquent JavaScript |last=Haverbeke |first=Marijn |publisher=[[No Starch Press]] |isbn=978-1-71850-411-0 |edition=4th |location=San Francisco |publication-date=2024 |url=https:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20250312193854\u002fhttps:\u002f\u002feloquentjavascript.net\u002fEloquent_JavaScript.pdf |archive-date=2025-03-12 |url-status=live}}\u003cbr\u003e * {{cite book|last=Zakas|first=Nicholas|title=Principles of Object-Oriented JavaScript|edition=1st|publisher=No Starch Press|year=2014|isbn=978-1593275402}}\u003cbr\u003e \u003cbr\u003e == External links ==","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -143,7 +143,7 @@\u003cbr\u003e === Imperative and structured ===\u003cbr\u003e {{Main|Structured programming}}\u003cbr\u003e \u003cbr\u003e-JavaScript supports much of the [[structured programming]] syntax from [[C (computer language)|C]] (e.g., \u003ccode\u003eif\u003c\u002fcode\u003e statements, \u003ccode\u003ewhile\u003c\u002fcode\u003e loops, \u003ccode\u003eswitch\u003c\u002fcode\u003e statements, \u003ccode\u003edo while\u003c\u002fcode\u003e loops, etc.). One partial exception is [[scope (computer science)|scoping]]: originally JavaScript only had [[function scoping]] with \u003ccode\u003evar\u003c\u002fcode\u003e; [[block scoping]] was added in ECMAScript 2015 with the keywords \u003ccode\u003elet\u003c\u002fcode\u003e and \u003ccode\u003e[[const (computer programming)|const]]\u003c\u002fcode\u003e. Like C, JavaScript makes a distinction between [[Expression (computer science)|expressions]] and [[Statement (computer science)|statements]]. One syntactic difference from C is [[Defensive semicolon|automatic semicolon insertion]], which allow semicolons (which terminate statements) to be omitted.\u003cref name=\"Flanagan2006\"\u003e{{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide: The Definitive Guide|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|date=August 17, 2006|publisher=\"O'Reilly Media, Inc.\"|isbn=978-0-596-55447-7|page=16|access-date=March 29, 2019|archive-date=August 1, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200801065235\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+JavaScript supports much of the [[structured programming]] syntax from [[C (computer language)|C]] (e.g., \u003ccode\u003eif\u003c\u002fcode\u003e statements, \u003ccode\u003ewhile\u003c\u002fcode\u003e loops, \u003ccode\u003eswitch\u003c\u002fcode\u003e statements, \u003ccode\u003edo while\u003c\u002fcode\u003e loops, etc.). One partial exception is [[scope (computer science)|scoping]]: originally JavaScript only had [[function scoping]] with \u003ccode\u003evar\u003c\u002fcode\u003e; [[block scoping]] was added in ECMAScript 2015 with the keywords \u003ccode\u003elet\u003c\u002fcode\u003e and \u003ccode\u003e[[const (computer programming)|const]]\u003c\u002fcode\u003e. Like C, JavaScript makes a distinction between [[Expression (computer science)|expressions]] and [[Statement (computer science)|statements]]. One syntactic difference from C is [[Defensive semicolon|automatic semicolon insertion]], which allow semicolons (which terminate statements) to be omitted.\u003cref name=\"Flanagan2006\"\u003e{{cite book|last=Flanagan|first=David|title=JavaScript: The Definitive Guide |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|date=August 17, 2006|publisher=[[O'Reilly Media, Inc.]]|isbn=978-0-596-55447-7|page=16|access-date=March 29, 2019|archive-date=August 1, 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200801065235\u002fhttps:\u002f\u002fbooks.google.com\u002fbooks?id=2weL0iAfrEMC|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Weakly typed ===\u003cbr\u003e {{Main|Weakly typed}}","--- Revision 45\u003cbr\u003e+++ Revision 46\u003cbr\u003e@@ -63,14 +63,14 @@\u003cbr\u003e \u003cbr\u003e The standards process continued for a few years, with the release of ECMAScript 2 in June 1998 and ECMAScript 3 in December 1999. Work on ECMAScript 4 began in 2000.\u003cref name=\"sjsch5\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e-However, the effort to fully standardize the language was undermined by [[Microsoft]] gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e+However, the effort to fully standardize the language was undermined by Microsoft gaining an increasingly dominant position in the browser market. By the early 2000s, [[Internet Explorer]]'s market share reached 95%.\u003cref name=\"searchenginejournal.com\"\u003e{{cite news | url=https:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | title=Mozilla Firefox Internet Browser Market Share Gains to 7.4% | first=Loren | last=Baker | work=Search Engine Journal | date=November 24, 2004 | access-date=May 8, 2021 | archive-date=May 7, 2021 | archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210507013607\u002fhttps:\u002f\u002fwww.searchenginejournal.com\u002fmozilla-firefox-internet-browser-market-share-gains-to-74\u002f1082\u002f | url-status=live }}\u003c\u002fref\u003e This meant that [[JScript]] became the de facto standard for [[client-side scripting]] on the Web.\u003cbr\u003e \u003cbr\u003e Microsoft initially participated in the standards process and implemented some proposals in its JScript language, but eventually it stopped collaborating on ECMA work. Thus ECMAScript 4 was mothballed.\u003cbr\u003e \u003cbr\u003e === Growth and standardization ===\u003cbr\u003e During the period of [[Internet Explorer]] dominance in the early 2000s, client-side scripting was stagnant. This started to change in 2004, when the successor of Netscape, [[Mozilla]], released the [[Firefox]] browser. Firefox was well received by many, taking significant market share from Internet Explorer.\u003cref\u003e{{cite news |url=https:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |title=The assault on software giant Microsoft |last=Weber |first=Tim |date=May 9, 2005 |work=[[BBC News]] |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170925233936\u002fhttps:\u002f\u002fnews.bbc.co.uk\u002f2\u002fhi\u002fbusiness\u002f4508897.stm |archive-date=September 25, 2017}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In 2005, Mozilla joined ECMA International, and work started on the [[ECMAScript for XML]] (E4X) standard. This led to Mozilla working jointly with [[Macromedia]] (later acquired by [[Adobe Systems]]), who were implementing E4X in their ActionScript 3 language, which was based on an ECMAScript 4 draft. The goal became standardizing ActionScript 3 as the new ECMAScript 4. To this end, Adobe Systems released the [[Tamarin (software)|Tamarin]] implementation as an [[Open-source model|open source]] project. However, Tamarin and ActionScript 3 were too different from established client-side scripting, and without cooperation from [[Microsoft]], ECMAScript 4 never reached fruition.\u003cbr\u003e+In 2005, Mozilla joined ECMA International, and work started on the [[ECMAScript for XML]] (E4X) standard. This led to Mozilla working jointly with [[Macromedia]] (later acquired by [[Adobe Systems]]), who were implementing E4X in their ActionScript 3 language, which was based on an ECMAScript 4 draft. The goal became standardizing ActionScript 3 as the new ECMAScript 4. To this end, Adobe Systems released the [[Tamarin (software)|Tamarin]] implementation as an [[Open-source model|open source]] project. However, Tamarin and ActionScript 3 were too different from established client-side scripting, and without cooperation from Microsoft, ECMAScript 4 never reached fruition.\u003cbr\u003e \u003cbr\u003e Meanwhile, very important developments were occurring in open-source communities not affiliated with ECMA work. In 2005, [[Jesse James Garrett]] released a white paper in which he coined the term [[Ajax (programming)|Ajax]] and described a set of technologies, of which JavaScript was the backbone, to create [[web application]]s where data can be loaded in the background, avoiding the need for full page reloads. This sparked a renaissance period of JavaScript, spearheaded by open-source libraries and the communities that formed around them. Many new libraries were created, including [[jQuery]], [[Prototype JavaScript Framework|Prototype]], [[Dojo Toolkit]], and [[MooTools]].\u003cbr\u003e ","--- Revision 46\u003cbr\u003e+++ Revision 47\u003cbr\u003e@@ -313,7 +313,7 @@\u003cbr\u003e ==== Regular expressions ====\u003cbr\u003e {{Main|Regular expression}}\u003cbr\u003e \u003cbr\u003e-In a manner similar to [[Perl]], JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e+JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}","--- Revision 47\u003cbr\u003e+++ Revision 48\u003cbr\u003e@@ -313,7 +313,7 @@\u003cbr\u003e ==== Regular expressions ====\u003cbr\u003e {{Main|Regular expression}}\u003cbr\u003e \u003cbr\u003e-JavaScript also supports [[regular expression]]s, which provide a concise and powerful syntax for text manipulation that is more sophisticated than the built-in string functions.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e+JavaScript supports [[regular expression]]s for text searches and manipulation.{{r|n=Haverbeke2024|p=139}}\u003cbr\u003e \u003cbr\u003e ==== Promises and Async\u002fawait ====\u003cbr\u003e JavaScript supports [[futures and promises|promises]] and [[Async\u002fawait]] for handling asynchronous operations.{{citation needed|date=August 2023}}","--- Revision 48\u003cbr\u003e+++ Revision 49\u003cbr\u003e@@ -321,7 +321,7 @@\u003cbr\u003e ===== Promises =====\u003cbr\u003e {{Main|Futures and promises}}\u003cbr\u003e \u003cbr\u003e-A built-in Promise object provides functionality for handling promises and associating handlers with an asynchronous action's eventual result. Recently, the JavaScript specification introduced combinator methods, which allow developers to combine multiple JavaScript promises and do operations based on different scenarios. The methods introduced are: Promise.race, Promise.all, Promise.allSettled and Promise.any.\u003cbr\u003e+A built-in Promise object provides functionality for handling promises and associating handlers with an asynchronous action's eventual result. JavaScript supplies combinator methods, which allow developers to combine multiple JavaScript promises and do operations based on different scenarios. The methods introduced are: Promise.race, Promise.all, Promise.allSettled and Promise.any.\u003cbr\u003e \u003cbr\u003e ===== Async\u002fawait =====\u003cbr\u003e {{Main|Async\u002fawait}}","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -1,7 +1,9 @@\u003cbr\u003e {{Short description|High-level programming language}}\u003cbr\u003e {{Distinguish|Java (programming language)|Javanese script|ECMAScript}}\u003cbr\u003e+{{Redirect|.js|the Microsoft dialect used in Internet Explorer|JScript|}}\u003cbr\u003e+{{For|the uses of JavaScript on Wikipedia|Wikipedia:WikiProject JavaScript|selfref=yes}}\u003cbr\u003e {{pp-semi-indef|small=yes}}\u003cbr\u003e-{{Use dmy dates|date=March 2024}}\u003cbr\u003e+\u003cbr\u003e {{Infobox programming language\u003cbr\u003e | name = JavaScript\u003cbr\u003e | logo = \u003c!-- Do not add the unofficial logo, per [[Talk:JavaScript\u002
