[\"Hello, World!\" program]]:\u003cbr\u003e-\u003csyntaxhighlight lang=\"python\"\u003e\u003cbr\u003e-print('Hello, world!')\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e-\u003cbr\u003e-Program to calculate the [[factorial]] of a positive integer:\u003cbr\u003e-\u003csyntaxhighlight lang=\"python\" line=\"1\"\u003e\u003cbr\u003e-n = int(input('Type a number, and its factorial will be printed: '))\u003cbr\u003e-\u003cbr\u003e-if n \u003c 0:\u003cbr\u003e-    raise ValueError('You must enter a non-negative integer')\u003cbr\u003e-\u003cbr\u003e-factorial = 1\u003cbr\u003e-for i in range(2, n + 1):\u003cbr\u003e-    factorial *= i\u003cbr\u003e-\u003cbr\u003e-print(factorial)\u003cbr\u003e-\u003cbr\u003e-\u003c\u002fsyntaxhighlight\u003e\u003c!--\u003cbr\u003e-\u003cbr\u003e-Please don\u2019t add more examples.\u003cbr\u003e-\u003cbr\u003e---\u003e\u003cbr\u003e+import random\u003cbr\u003e+\u003cbr\u003e+def main():\u003cbr\u003e+    print(\"Selamat datang di game Tebak Angka!\")\u003cbr\u003e+    angka_rahasia = random.randint(1, 100)\u003cbr\u003e+    percobaan = 0\u003cbr\u003e+    batas_percobaan = 10\u003cbr\u003e+    \u003cbr\u003e+    while percobaan \u003c batas_percobaan:\u003cbr\u003e+        try:\u003cbr\u003e+            tebakan = int(input(f\"Percobaan {percobaan + 1}\u002f{batas_percobaan}: Tebak angka (1-100): \"))\u003cbr\u003e+        except ValueError:\u003cbr\u003e+            print(\"Masukkan angka yang valid!\")\u003cbr\u003e+            continue\u003cbr\u003e+        \u003cbr\u003e+        percobaan += 1\u003cbr\u003e+        \u003cbr\u003e+        if tebakan \u003c angka_rahasia:\u003cbr\u003e+            print(\"Terlalu kecil!\")\u003cbr\u003e+        elif tebakan \u003e angka_rahasia:\u003cbr\u003e+            print(\"Terlalu besar!\")\u003cbr\u003e+        else:\u003cbr\u003e+            print(f\"Selamat! Anda menebak angka {angka_rahasia} dengan benar dalam {percobaan} percobaan.\")\u003cbr\u003e+            break\u003cbr\u003e+    else:\u003cbr\u003e+        print(f\"Game over! Angka yang benar adalah {angka_rahasia}.\")\u003cbr\u003e+\u003cbr\u003e+if __name__ == \"__main__\":\u003cbr\u003e+    main()\u003cbr\u003e \u003cbr\u003e ==Libraries==\u003cbr\u003e Python's large standard library\u003cref name=\"AutoNT-86\"\u002f\u003e provides tools suited to many tasks and is commonly cited as one of its greatest strengths. For Internet-facing applications, many standard formats and protocols such as [[MIME]] and [[HTTP]] are supported. It includes modules for creating [[graphical user interface]]s, connecting to [[relational database]]s, [[pseudorandom number generator|generating pseudorandom numbers]], arithmetic with arbitrary-precision decimals,\u003cref name=\"AutoNT-88\"\u002f\u003e manipulating [[regular expression]]s, and [[unit testing]].","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -374,35 +374,30 @@\u003cbr\u003e # already there\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003eIf you want the attribute to have a set value if no value is given, use the variable-defining syntax inside the function definition.\u003cbr\u003e \u003cbr\u003e-import random\u003cbr\u003e-\u003cbr\u003e-def main():\u003cbr\u003e-    print(\"Selamat datang di game Tebak Angka!\")\u003cbr\u003e-    angka_rahasia = random.randint(1, 100)\u003cbr\u003e-    percobaan = 0\u003cbr\u003e-    batas_percobaan = 10\u003cbr\u003e-    \u003cbr\u003e-    while percobaan \u003c batas_percobaan:\u003cbr\u003e-        try:\u003cbr\u003e-            tebakan = int(input(f\"Percobaan {percobaan + 1}\u002f{batas_percobaan}: Tebak angka (1-100): \"))\u003cbr\u003e-        except ValueError:\u003cbr\u003e-            print(\"Masukkan angka yang valid!\")\u003cbr\u003e-            continue\u003cbr\u003e-        \u003cbr\u003e-        percobaan += 1\u003cbr\u003e-        \u003cbr\u003e-        if tebakan \u003c angka_rahasia:\u003cbr\u003e-            print(\"Terlalu kecil!\")\u003cbr\u003e-        elif tebakan \u003 ]]s, and [[unit testing]].","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -400,7 +400,7 @@\u003cbr\u003e --\u003e\u003cbr\u003e \u003cbr\u003e ==Libraries==\u003cbr\u003e-Python's large standard library\u003cref name=\"AutoNT-86\"\u002f\u003e provides tools suited to many tasks and is commonly cited as one of its greatest strengths. For Internet-facing applications, many standard formats and protocols such as [[MIME]] and [[HTTP]] are supported. It includes modules for creating [[graphical user interface]]s, connecting to [[relational database]]s, [[pseudorandom number generator|generating pseudorandom numbers]], arithmetic with arbitrary-precision decimals,\u003cref name=\"AutoNT-88\"\u002f\u003e manipulating [[regular expression]]s, and [[unit testing]].\u003cbr\u003e+Python's large standard library\u003cref name=\"AutoNT-86\"\u002f\u003e is commonly cited as one of its greatest strengths. For Internet-facing applications, many standard formats and protocols such as [[MIME]] and [[HTTP]] are supported. It includes modules for creating [[graphical user interface]]s, connecting to [[relational database]]s, [[pseudorandom number generator|generating pseudorandom numbers]], arithmetic with arbitrary-precision decimals,\u003cref name=\"AutoNT-88\"\u002f\u003e manipulating [[regular expression]]s, and [[unit testing]].\u003cbr\u003e \u003cbr\u003e Some parts of the standard library are covered by specifications\u2014for example, the [[Web Server Gateway Interface]] (WSGI) implementation \u003ccode\u003ewsgiref\u003c\u002fcode\u003e follows PEP 333\u003cref name=\"AutoNT-89\"\u002f\u003e\u2014but most are specified by their code, internal documentation, and [[test suite]]s. However, because most of the standard library is cross-platform Python code, only a few modules need altering or rewriting for variant implementations.\u003cbr\u003e ","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -536,7 +536,7 @@\u003cbr\u003e \u003cbr\u003e Python can also be used for [[graphical user interface]] (GUI) by using libraries like [[Tkinter]].\u003cref\u003e{{cite web |url=https:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002ftkinter.html |title=Tkinter \u2014 Python interface to TCL\u002fTk |access-date=9 June 2023 |archive-date=18 October 2012 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121018043136\u002fhttp:\u002f\u002fdocs.python.org\u002flibrary\u002ftkinter.html |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.geeksforgeeks.org\u002fpython-tkinter-tutorial\u002f |title=Python Tkinter Tutorial |date=3 June 2020 |access-date=9 June 2023 |archive-date=9 June 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230609031631\u002fhttps:\u002f\u002fwww.geeksforgeeks.org\u002fpython-tkinter-tutorial\u002f |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Python has been successfully embedded in many software products as a scripting language, including in [[finite element method]] software such as [[Abaqus]], 3D parametric modelers like [[FreeCAD]], 3D animation packages such as [[3ds Max]], [[Blender (software)|Blender]], [[Cinema 4D]], [[LightWave 3D|Lightwave]], [[Houdini (software)|Houdini]], [[Maya (software)|Maya]], [[modo (software)|modo]], [[MotionBuilder]], [[Autodesk Softimage|Softimage]], the visual effects compositor [[Nuke (software)|Nuke]], 2D imaging programs like [[GIMP]],\u003cref\u003e{{cite web |url=http:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |title=Installers for GIMP for Windows \u2013 Frequently Asked Questions |author=\u003c!-- Staff writer(s); no by-line. --\u003e |date=26 July 2013 |access-date=26 July 2013 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130717070814\u002fhttp:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |archive-date=17 July 2013}}\u003c\u002fref\u003e [[Inkscape]], [[Scribus]] and [[Paint Shop Pro]],\u003cref name=\"AutoNT-38\"\u002f\u003e and [[musical notation]] programs like [[scorewriter]] and [[Capella (notation program)|capella]]. [[GNU Debugger]] uses Python as a [[pretty printer]] to show complex structures such as C++ containers. [[Esri]] promotes Python as the best choice for writing scripts in [[ArcGIS]].\u003cref name=\"AutoNT-39\"\u002f\u003e It has also been used in several video games,\u003cref name=\"AutoNT-40\"\u002f\u003e\u003cref name=\"AutoNT-41\"\u002f\u003e and has been adopted as first of the three available [[programming language]]s in [[Google App Engine]], the other two being [[Java (software platform)|Java]] and [[Go (programming language)|Go]].\u003cref name=\"AutoNT-42\"\u002f\u003e\u003cbr\u003e+Python is embedded in many software products as a scripting language, including in [[finite element method]] software such as [[Abaqus]], 3D parametric modelers like [[FreeCAD]], 3D animation packages such as [[3ds Max]], [[Blender (software)|Blender]], [[Cinema 4D]], [[LightWave 3D|Lightwave]], [[Houdini (software)|Houdini]], [[Maya (software)|Maya]], [[modo (software)|modo]], [[MotionBuilder]], [[Autodesk Softimage|Softimage]], the visual effects compositor [[Nuke (software)|Nuke]], 2D imaging programs like [[GIMP]],\u003cref\u003e{{cite web |url=http:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |title=Installers for GIMP for Windows \u2013 Frequently Asked Questions |author=\u003c!-- Staff writer(s); no by-line. --\u003e |date=26 July 2013 |access-date=26 July 2013 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130717070814\u002fhttp:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |archive-date=17 July 2013}}\u003c\u002fref\u003e [[Inkscape]], [[Scribus]] and [[Paint Shop Pro]],\u003cref name=\"AutoNT-38\"\u002f\u003e and [[musical notation]] programs like [[scorewriter]] and [[Capella (notation program)|capella]]. [[GNU Debugger]] uses Python as a [[pretty printer]] to show complex structures such as C++ containers. [[Esri]] promotes Python as the best choice for writing scripts in [[ArcGIS]].\u003cref name=\"AutoNT-39\"\u002f\u003e It has also been used in several video games,\u003cref name=\"AutoNT-40\"\u002f\u003e\u003cref name=\"AutoNT-41\"\u002f\u003e and has been adopted as first of the three available [[programming language]]s in [[Google App Engine]], the other two being [[Java (software platform)|Java]] and [[Go (programming language)|Go]].\u003cref name=\"AutoNT-42\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e Many operating systems include Python as a standard component. It ships with most [[Linux distribution]]s,\u003cref\u003e{{Cite web|url=https:\u002f\u002fdocs.python.org\u002f3\u002fusing\u002funix.html|title=Python Setup and Usage|publisher=Python Software Foundation|access-date=10 January 2020|archive-date=17 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200617143505\u002fhttps:\u002f\u002fdocs.python.org\u002f3\u002fusing\u002funix.html|url-status=live}}\u003c\u002fref\u003e [[AmigaOS 4]] (using Python&nbsp;2.7), [[FreeBSD]] (as a package), [[NetBSD]], and [[OpenBSD]] (as a package) and can be used from the command line (terminal). Many Linux distributions use installers written in Python: [[Ubuntu]] uses the [[Ubiquity (software)|Ubiquity]] installer, while [[Red Hat Linux]] and [[Fedora Linux]] use the [[Anaconda (installer)|Anaconda]] installer. [[Gentoo Linux]] uses Python in its [[package management system]], [[Portage (software)|Portage]].\u003cbr\u003e ","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -157,7 +157,7 @@\u003cbr\u003e \u003cbr\u003e Python's developers usually strive to avoid [[premature optimization]] and reject patches to non-critical parts of the [[CPython]] reference implementation that would offer marginal increases in speed at the cost of clarity.\u003cref name=\"AutoNT-20\"\u002f\u003e Execution speed can be improved by moving speed-critical functions to extension modules written in languages such as C, or by using a [[just-in-time compiler]] like [[PyPy]]. It is also possible to [[#Cross-compilers to other languages|cross-compile to other languages]], but it either doesn't provide the full speed-up that might be expected, since Python is a very [[dynamic language]], or a restricted subset of Python is compiled, and possibly semantics are slightly changed.\u003cref name=PyJL\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Python's developers aim for it to be fun to use. This is reflected in its name\u2014a tribute to the British comedy group [[Monty Python]]\u003cref name=\"whyname\"\u002f\u003e\u2014and in occasionally playful approaches to tutorials and reference materials, such as the use of the terms \"spam\" and \"eggs\" (a reference to [[Spam (Monty Python)|a Monty Python sketch]]) in examples, instead of the often-used [[foobar|\"foo\" and \"bar\"]].\u003cref\u003e{{Cite web|url=https:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|title=15 Ways Python Is a Powerful Force on the Web|access-date=3 July 2018|archive-date=11 May 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190511065650\u002fhttp:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=pprint \u2013 Data pretty printer \u2013 Python 3.11.0 documentation |url=https:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |access-date=2022-11-05 |website=docs.python.org |quote=stuff=['spam', 'eggs', 'lumberjack', 'knights', 'ni'] |archive-date=22 January 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210122224848\u002fhttps:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |url-status=live}}\u003c\u002fref\u003e A common [[neologism]] in the Python community is ''pythonic'', which has a wide range of meanings related to program style. \"Pyth or]] function (and also an operator); used to implement [[coroutine]]s\u003cbr\u003e * The \u003ccode\u003ereturn\u003c\u002fcode\u003e statement, used to return a value from a function\u003cbr\u003e * The \u003ccode\u003e[[include directive|import]]\u003c\u002fcode\u003e and \u003ccode\u003efrom\u003c\u002fcode\u003e statements, used to import modules whose functions or variables can be used in the current program\u003cbr\u003e+* The \u003ccode\u003eas\u003c\u002fcode\u003e statement, used with the \u003ccode\u003eimport\u003c\u002fcode\u003e and \u003ccode\u003ewith\u003c\u002fcode\u003e statements to refer to the module or context manager by an alias\u003cbr\u003e * The \u003ccode\u003ematch\u003c\u002fcode\u003e and \u003ccode\u003ecase\u003c\u002fcode\u003e statements, an analog of the [[switch statement]] construct, that compares an expression against one or more cases as a control-of-flow measure.\u003cbr\u003e \u003cbr\u003e The assignment statement (\u003ccode\u003e=\u003c\u002fcode\u003e) binds a name as a [[pointer (computer programming)|reference]] to a separate, dynamically allocated [[object (computer science)|object]]. Variables may subsequently be rebound at any time to any object. In Python, a variable name is a generic reference holder without a fixed [[Type system|data type]]; however, it always refers to ''some'' object with a type. This is called [[dynamic typing]]\u2014in contrast to [[statically-typed]] languages, where each variable may contain only a value of a certain type.","--- Revision 34\u003cbr\u003e+++ Revision 35\u003cbr\u003e@@ -190,7 +190,7 @@\u003cbr\u003e * The \u003ccode\u003eyield\u003c\u002fcode\u003e statement, which returns a value from a [[generator (computer programming)#Python|generator]] function (and also an operator); used to implement [[coroutine]]s\u003cbr\u003e * The \u003ccode\u003ereturn\u003c\u002fcode\u003e statement, used to return a value from a function\u003cbr\u003e * The \u003ccode\u003e[[include directive|import]]\u003c\u002fcode\u003e and \u003ccode\u003efrom\u003c\u002fcode\u003e statements, used to import modules whose functions or variables can be used in the current program\u003cbr\u003e-* The \u003ccode\u003eas\u003c\u002fcode\u003e statement, used with the \u003ccode\u003eimport\u003c\u002fcode\u003e and \u003ccode\u003ewith\u003c\u002fcode\u003e statements to refer to the module or context manager by an alias\u003cbr\u003e+* The \u003ccode\u003eas\u003c\u002fcode\u003e statement, placed after the \u003ccode\u003eimport\u003c\u002fcode\u003e and \u003ccode\u003ewith\u003c\u002fcode\u003e statements to refer to the module or context manager by an alias\u003cbr\u003e * The \u003ccode\u003ematch\u003c\u002fcode\u003e and \u003ccode\u003ecase\u003c\u002fcode\u003e statements, an analog of the [[switch statement]] construct, that compares an expression against one or more cases as a control-of-flow measure.\u003cbr\u003e \u003cbr\u003e The assignment statement (\u003ccode\u003e=\u003c\u002fcode\u003e) binds a name as a [[pointer (computer programming)|reference]] to a separate, dynamically allocated [[object (computer science)|object]]. Variables may subsequently be rebound at any time to any object. In Python, a variable name is a generic reference holder without a fixed [[Type system|data type]]; however, it always refers to ''some'' object with a type. This is called [[dynamic typing]]\u2014in contrast to [[statically-typed]] languages, where each variable may contain only a value of a certain type.","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -378,25 +378,24 @@\u003cbr\u003e ==Programming examples==\u003cbr\u003e [[\"Hello, World!\" program]]:\u003cbr\u003e \u003csyntaxhighlight lang=\"python\"\u003e\u003cbr\u003e-print('Hello, world!')\u003cbr\u003e+print(\"Hello, world!\")\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e \u003cbr\u003e Program to calculate the [[factorial]] of a positive integer:\u003cbr\u003e \u003csyntaxhighlight lang=\"python\" line=\"1\"\u003e\u003cbr\u003e-n = int(input('Type a number, and its factorial will be printed: '))\u003cbr\u003e+n = int(input(\"Type a number, and its factorial will be printed: \"))\u003cbr\u003e \u003cbr\u003e if n \u003c 0:\u003cbr\u003e-    raise ValueError('You must enter a non-negative integer')\u003cbr\u003e+    raise ValueError(\"You must enter a non-negative integer\")\u003cbr\u003e \u003cbr\u003e factorial = 1\u003cbr\u003e for i in range(2, n + 1):\u003cbr\u003e     factorial *= i\u003cbr\u003e \u003cbr\u003e print(factorial)\u003cbr\u003e-\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003c!--\u003cbr\u003e \u003cbr\u003e-Please don\u2019t add more examples.\u003cbr\u003e+Please don't add more examples.\u003cbr\u003e \u003cbr\u003e --\u003e\u003cbr\u003e ","--- Revision 36\u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -487,6 +487,13 @@\u003cbr\u003e ===Performance===\u003cbr\u003e Performance comparison of various Python implementations on a non-numerical (combinatorial) workload was presented at EuroSciPy '13.\u003cref\u003e{{cite conference |title=Performance of Python runtimes on a non-numeric scientific code |last=Murri |first=Riccardo |conference=European Conference on Python in Science (EuroSciPy) |year=2013 |arxiv=1404.6388|bibcode=2014arXiv1404.6388M}}\u003c\u002fref\u003e Python's performance compared to other programming languages is also benchmarked by [[The Computer Language Benchmarks Game]].\u003cref\u003e{{cite web|title=The Computer Language Benchmarks Game|url=https:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|access-date=30 April 2020|archive-date=14 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200614210246\u002fhttps:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+There are some ways of optimizing performance due to the slower nature of Python being an [[interpreted language]]. These optimizations use different strategies or tools:\u003cbr\u003e+\u003cbr\u003e+* [[Just-in-time compilation]]: Compiling code just before it is executed dynamically. These implementations are seen in libraries like [[Numba]] and [[PyPy]].\u003cbr\u003e+* [[Compiler|Static compilation]]: Code gets compiled into machine code before execution. An example of this is Cython which compiles Python into C.\u003cbr\u003e+* Concurrency and Parallelism: Multiple tasks can be run at the same time. Python contains modules like `multiprocessing` to allow for this form of parallelism. Additionally, it helps to overcome limitations of the [[Global interpreter lock|Global Interpreter Lock]] (GIL) in CPU tasks.\u003cbr\u003e+* Efficient Data Structures: Using data types such as \u003ccode\u003eSet\u003c\u002fcode\u003e for membership tests or \u003ccode\u003edeque\u003c\u002fcode\u003e from \u003ccode\u003ecollections\u003c\u002fcode\u003e for [[Queueing theory|queue]] operations can also improve performance.\u003cbr\u003e+\u003cbr\u003e ==Development==\u003cbr\u003e Python's development is conducted largely through the ''Python Enhancement Proposal'' (PEP) process, the primary mechanism for proposing major new features, collecting community input on issues, and documenting Python design decisions.\u003cref name=\"PepCite000\"\u002f\u003e Python coding style is covered in PEP&nbsp;8.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0008\u002f|title=PEP 8 \u2013 Style Guide for Python Code|website=Python.org|access-date=26 March 2019|archive-date=17 April 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190417223549\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0008\u002f|url-status=live}}\u003c\u002fref\u003e Outstanding PEPs are reviewed and commented on by the Python community and the steering council.\u003cref name=\"PepCite000\"\u002f\u003e\u003cbr\u003e ","--- Revision 37\u003cbr\u003e+++ Revision 38\u003cbr\u003e@@ -110,6 +110,8 @@\u003cbr\u003e ..\u003cbr\u003e The current implementation --\u003e [and it] has many corner cases and oddities. Code that works around those may need to be changed. Code that uses \u003ccode\u003elocals()\u003c\u002fcode\u003e for simple templating, or print debugging, will continue to work correctly.\u003c!-- Debuggers and other tools that use \u003ccode\u003ef_locals\u003c\u002fcode\u003e to modify local variables, will now work correctly, even in the presence of threaded code, coroutines and generators. --\u003e\"\u003cref\u003e{{Cite web |title=PEP 667 \u2013 Consistent views of namespaces {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0667\u002f |access-date=2024-10-07 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e+Python 3.13 introduces some changes in behavior, including new \"well-defined semantics\" and the removal of deprecated classes, functions, methods, and outdated modules from the C API. One of the most significant additions is the experimental free-threaded build mode, which disables the Global Interpreter Lock (GIL), a feature of CPython that previously prevented multiple threads from executing Python bytecode simultaneously. This optional build, introduced through PEP 703, enables better exploitation of multi-core CPUs. By allowing multiple threads to run Python code in parallel, the free-threaded mode addresses long-standing performance bottlenecks associated with the GIL, offering a new path for parallelism in Python without resorting to multiprocessing or external concurrency frameworks.\u003cref\u003e{{Cite web |title=PEP 703 \u2013 Making the GIL Optional in CPython |url=https:\u002f\u002fpeps.python.org\u002fpep-0703\u002f |access-date=2025-03-30 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e Some (more) standard library modules and many deprecated classes, functions and methods, will be removed in Python 3.15 or 3.16.\u003cref\u003e{{Cite web |last=Wouters |first=Thomas |date=2024-04-09 |title=Python Insider: Python 3.12.3 and 3.13.0a6 released |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2024\u002f04\u002fpython-3123-and-3130a6-released.html |access-date=2024-04-29 |website=Python Insider}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=PEP 594 \u2013 Removing dead batteries from the standard library |url=https:\u002f\u002fpeps.python.org\u002fpep-0594\u002f |website=Python Enhancement Proposals |publisher=Python Softtware Foundation |date=20 May 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Python 3.11 adds Sigstore digital verification signatures for all CPython artifacts (in addition to [[Pretty Good Privacy|PGP]]). Since use of PGP has been criticized by security practitioners, \u003c!-- \"for years now\" --\u003e Python is moving to Sigstore exclusively and dropping PGP from 3.14.\u003cref\u003e{{Cite web |title=PEP 761 \u2013 Deprecating PGP signatures for CPython artifacts {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0761\u002f |access-date=2025-01-06 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e@@ -190,7 +192,6 @@\u003cbr\u003e * The \u003ccode\u003eyield\u003c\u002fcode\u003e statement, which returns a value from a [[generator (computer programming)#Python|generator]] function (and also an operator); used to implement [[coroutine]]s\u003cbr\u003e * The \u003ccode\u003ereturn\u003c\u002fcode\u003e statement, used to return a value from a function\u003cbr\u003e * The \u003ccode\u003e[[include directive|import]]\u003c\u002fcode\u003e and \u003ccode\u003efrom\u003c\u002fcode\u003e statements, used to import modules whose functions or variables can be used in the current program\u003cbr\u003e-* The \u003ccode\u003eas\u003c\u002fcode\u003e statement, placed after the \u003ccode\u003eimport\u003c\u002fcode\u003e and \u003ccode\u003ewith\u003c\u002fcode\u003e statements to refer to the module or context manager by an alias\u003cbr\u003e * The \u003ccode\u003ematch\u003c\u002fcode\u003e and \u003ccode\u003ecase\u003c\u002fcode\u003e statements, an analog of the [[switch statement]] construct, that compares an expression against one or more cases as a control-of-flow measure.\u003cbr\u003e \u003cbr\u003e The assignment statement (\u003ccode\u003e=\u003c\u002fcode\u003e) binds a name as a [[pointer (computer programming)|reference]] to a separate, dynamically allocated [[object (computer science)|object]]. Variables may subsequently be rebound at any time to any object. In Python, a variable name is a generic reference holder without a fixed [[Type system|data type]]; however, it always refers to ''some'' object with a type. This is called [[dynamic typing]]\u2014in contrast to [[statically-typed]] languages, where each variable may contain only a value of a certain type.\u003cbr\u003e@@ -378,24 +379,25 @@\u003cbr\u003e ==Programming examples==\u003cbr\u003e [[\"Hello, World!\" program]]:\u003cbr\u003e \u003csyntaxhighlight lang=\"python\"\u003e\u003cbr\u003e-print(\"Hello, world!\")\u003cbr\u003e+print('Hello, world!')\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003cbr\u003e \u003cbr\u003e Program to calculate the [[factorial]] of a positive integer:\u003cbr\u003e \u003csyntaxhighlight lang=\"python\" line=\"1\"\u003e\u003cbr\u003e-n = int(input(\"Type a number, and its factorial will be printed: \"))\u003cbr\u003e+n = int(input('Type a number, and its factorial will be printed: '))\u003cbr\u003e \u003cbr\u003e if n \u003c 0:\u003cbr\u003e-    raise ValueError(\"You must enter a non-negative integer\")\u003cbr\u003e+    raise ValueError('You must enter a non-negative integer')\u003cbr\u003e \u003cbr\u003e factorial = 1\u003cbr\u003e for i in range(2, n + 1):\u003cbr\u003e     factorial *= i\u003cbr\u003e \u003cbr\u003e print(factorial)\u003cbr\u003e+\u003cbr\u003e \u003c\u002fsyntaxhighlight\u003e\u003c!--\u003cbr\u003e \u003cbr\u003e-Please don't add more examples.\u003cbr\u003e+Please don\u2019t add more examples.\u003cbr\u003e \u003cbr\u003e --\u003e\u003cbr\u003e \u003cbr\u003e@@ -486,13 +488,6 @@\u003cbr\u003e \u003cbr\u003e ===Performance===\u003cbr\u003e Performance comparison of various Python implementations on a non-numerical (combinatorial) workload was presented at EuroSciPy '13.\u003cref\u003e{{cite conference |title=Performance of Python runtimes on a non-numeric scientific code |last=Murri |first=Riccardo |conference=European Conference on Python in Science (EuroSciPy) |year=2013 |arxiv=1404.6388|bibcode=2014arXiv1404.6388M}}\u003c\u002fref\u003e Python's performance compared to other programming languages is also benchmarked by [[The Computer Language Benchmarks Game]].\u003cref\u003e{{cite web|title=The Computer Language Benchmarks Game|url=https:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|access-date=30 April 2020|archive-date=14 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200614210246\u002fhttps:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-There are some ways of optimizing performance due to the slower nature of Python being an [[interpreted language]]. These optimizations use different strategies or tools:\u003cbr\u003e-\u003cbr\u003e-* [[Just-in-time compilation]]: Compiling code just before it is executed dynamically. These implementations are seen in libraries like [[Numba]] and [[PyPy]].\u003cbr\u003e-* [[Compiler|Static compilation]]: Code gets compiled into machine code before execution. An example of this is Cython which compiles Python into C.\u003cbr\u003e-* Concurrency and Parallelism: Multiple tasks can be run at the same time. Python contains y==\u003cbr\u003e-Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web|last=Blake|first=Troy|date=2021-01-18|title=TIOBE Index for January 2021|url=https:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|access-date=2021-02-26|website=Technology News and Information by SeniorDBA|language=en|archive-date=21 March 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210321143253\u002fhttps:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|url-status=live}}\u003c\u002fref\u003e).\u003cbr\u003e+Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web|last=Blake|first=Troy|date=2021-01-18|title=TIOBE Index for January 2021|url=https:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|access-date=2021-02-26|website=Technology News and Information by SeniorDBA|language=en|archive-date=21 March 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210321143253\u002fhttps:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|url-status=live}}\u003c\u002fref\u003e). In the TIOBE Index, monthly rankings are based on the volume of searches for programming languages on Google, Amazon, Wikipedia, Bing, and 20 other platforms. According to the accompanying graph, Python has shown a marked upward trend since the early 2000s, eventually passing long-established languages such as C, C++, and Java. This progression can be attributed to Python\u2019s readable syntax, comprehensive standard library, and application in data science and machine learning fields\u003cref\u003e{{Cite web |title=TIOBE Index |url=https:\u002f\u002fwww.tiobe.com\u002ftiobe-index\u002f |access-date=2025-03-31 |website=TIOBE |language=en-US}}\u003c\u002fref\u003e.\u003cbr\u003e+[[File:Tiobeindex.png|thumb|TIOBE Index Chart showing Python's popularity compared to other programming languages.]]\u003cbr\u003e \u003cbr\u003e Large organizations that use Python include [[Wikipedia]], [[Google]],\u003cref name=\"quotes-about-python\"\u002f\u003e [[Yahoo!]],\u003cref name=\"AutoNT-29\"\u002f\u003e [[CERN]],\u003cref name=\"AutoNT-30\"\u002f\u003e [[NASA]],\u003cref name=\"AutoNT-31\"\u002f\u003e [[Facebook]],\u003cref\u003e{{Cite web|url=https:\u002f\u002fdevelopers.facebook.com\u002fblog\u002fpost\u002f301|title=Tornado: Facebook's Real-Time Web Framework for Python \u2013 Facebook for Developers|website=Facebook for Developers|language=en-US|access-date=19 June 2018|archive-date=19 February 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190219031313\u002fhttps:\u002f\u002fdevelopers.facebook.com\u002fblog\u002fpost\u002f301|url-status=live}}\u003c\u002fref\u003e [[Amazon (company)|Amazon]], [[Instagram]],\u003cref\u003e{{cite web |url=https:\u002f\u002finstagram-engineering.com\u002fwhat-powers-instagram-hundreds-of-instances-dozens-of-technologies-adf2e22da2ad |title=What Powers Instagram: Hundreds of Instances, Dozens of Technologies |date=11 December 2016 |publisher=Instagram Engineering |access-date=27 May 2019 |archive-date=15 June 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200615183410\u002fhttps:\u002f\u002finstagram-engineering.com\u002fwhat-powers-instagram-hundreds-of-instances-dozens-of-technologies-adf2e22da2ad |url-status=live}}\u003c\u002fref\u003e [[Spotify]],\u003cref\u003e{{Cite web|url=https:\u002f\u002flabs.spotify.com\u002f2013\u002f03\u002f20\u002fhow-we-use-python-at-spotify\u002f|title=How we use Python at Spotify|website=Spotify Labs|language=en-US|access-date=25 July 2018|date=20 March 2013|archive-date=10 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200610005143\u002fhttps:\u002f\u002flabs.spotify.com\u002f2013\u002f03\u002f20\u002fhow-we-use-python-at-spotify\u002f|url-status=live}}\u003c\u002fref\u003e and some smaller entities like [[Industrial Light & Magic]]\u003cref name=\"AutoNT-32\"\u002f\u003e and [[ITA Software|ITA]].\u003cref name=\"AutoNT-33\"\u002f\u003e The social news networking site [[Reddit]] was written mostly in Python.\u003cref\u003e{{Citation|title=GitHub \u2013 reddit-archive\u002freddit: historical code from reddit.com.|url=https:\u002f\u002fgithub.com\u002freddit-archive\u002freddit|publisher=The Reddit Archives|access-date=20 March 2019|archive-date=1 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200601104939\u002fhttps:\u002f\u002fgithub.com\u002freddit-archive\u002freddit|url-status=live}}\u003c\u002fref\u003e Organizations that partially use Python include [[Discord]]\u003cref\u003e{{cite web | url=https:\u002f\u002felixir-lang.org\u002fblog\u002f2020\u002f10\u002f08\u002freal-time-communication-at-scale-with-elixir-at-discord\u002f | title=Real time communication at scale with Elixir at Discord | date=8 October 2020 }}\u003c\u002fref\u003e and [[Baidu]].\u003cref\u003e{{cite web | url=https:\u002f\u002fwww.freelancinggig.com\u002fblog\u002f2018\ ams; [[Project Jupyter|Jupyter Notebooks]], an open-source interactive computing platform; [[PythonAnywhere]], a browser-based IDE and hosting environment; and Canopy IDE, a commercial IDE emphasizing [[scientific computing]].\u003cref\u003e{{cite web|last1=Enthought|first1=Canopy|title=Canopy|url=https:\u002f\u002fwww.enthought.com\u002fproducts\u002fcanopy\u002f|website=www.enthought.com|access-date=20 August 2016|archive-date=15 July 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170715151703\u002fhttps:\u002f\u002fwww.enthought.com\u002fproducts\u002fcanopy\u002f|url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=Project Jupyter |url=https:\u002f\u002fjupyter.org |website=Jupyter.org |access-date=2 April 2025 |archive-date=12 October 2023 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20231012055917\u002fhttps:\u002f\u002fjupyter.org\u002f |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Implementations==\u003cbr\u003e {{See also|List of Python software#Python implementations}}","--- Revision 43\u003cbr\u003e+++ Revision 44\u003cbr\u003e@@ -523,7 +523,7 @@\u003cbr\u003e The prefix ''Py-'' is used to show that something is related to Python. Examples of the use of this prefix in names of Python applications or libraries include [[Pygame]], a [[language binding|binding]] of [[Simple DirectMedia Layer]] to Python (commonly used to create games); [[PyQt]] and [[PyGTK]], which bind [[Qt (software)|Qt]] and GTK to Python respectively; and [[PyPy]], a Python implementation originally written in Python.\u003cbr\u003e \u003cbr\u003e ==Popularity==\u003cbr\u003e-Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web|last=Blake|first=Troy|date=2021-01-18|title=TIOBE Index for January 2021|url=https:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|access-date=2021-02-26|website=Technology News and Information by SeniorDBA|language=en|archive-date=21 March 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210321143253\u002fhttps:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|url-status=live}}\u003c\u002fref\u003e). In the TIOBE Index, monthly rankings are based on the volume of searches for programming languages on Google, Amazon, Wikipedia, Bing, and 20 other platforms. According to the accompanying graph, Python has shown a marked upward trend since the early 2000s, eventually passing long-established languages such as C, C++, and Java. This progression can be attributed to Python\u2019s readable syntax, comprehensive standard library, and application in data science and machine learning fields\u003cref\u003e{{Cite web |title=TIOBE Index |url=https:\u002f\u002fwww.tiobe.com\u002ftiobe-index\u002f |access-date=2025-03-31 |website=TIOBE |language=en-US}}\u003c\u002fref\u003e.\u003cbr\u003e+Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web|last=Blake|first=Troy|date=2021-01-18|title=TIOBE Index for January 2021|url 003c!-- Do not put in as there's also a pure Java implementation (Jython): | programming language = [[C (programming language)|C]] --\u003e\u003cbr\u003e | wikibooks = Python Programming\u003cbr\u003e }}\u003cbr\u003e@@ -81,16 +83,17 @@\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e {{Main|History of Python}}\u003cbr\u003e-[[File:Guido van Rossum in PyConUS24.jpg|thumb|311x311px|The designer of Python, [[Guido van Rossum]], at PyCon US 2024]]\u003cbr\u003e+[[File:Guido van Rossum OSCON 2006 cropped.png|thumb|150px|The designer of Python, [[Guido van Rossum]], at [[O'Reilly Open Source Convention|OSCON]] 2006]]\u003cbr\u003e+\u003cbr\u003e Python was conceived in the late 1980s\u003cref name=\"venners-interview-pt-1\"\u002f\u003e by [[Guido van Rossum]] at [[Centrum Wiskunde & Informatica]] (CWI) in the [[Netherlands]] as a successor to the [[ABC (programming language)|ABC]] programming language, which was inspired by [[SETL]],\u003cref name=\"AutoNT-12\"\u002f\u003e capable of [[exception handling]] and interfacing with the [[Amoeba (operating system)|Amoeba]] operating system.\u003cref name=\"faq-created\"\u002f\u003e Its implementation began in December&nbsp;1989.\u003cref name=\"timeline-of-python\"\u002f\u003e Van Rossum shouldered sole responsibility for the project, as the lead developer, until 12 July 2018, when he announced his \"permanent vacation\" from his responsibilities as Python's \"[[benevolent dictator for life]]\" (BDFL), a title the Python community bestowed upon him to reflect his long-term commitment as the project's chief decision-maker\u003cref name=\"lj-bdfl-resignation\"\u002f\u003e (he has since come out of retirement and is self-titled \"BDFL-emeritus\"\u003c!-- on his Twitter--\u003e). In January&nbsp;2019, active Python core developers elected a five-member Steering Council to lead the project.\u003cref\u003e{{cite web |title=PEP 8100 |url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-8100\u002f |publisher=Python Software Foundation |access-date=4 May 2019 |archive-date=4 June 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200604235027\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-8100\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|title=PEP 13 \u2013 Python Language Governance|url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0013\u002f|access-date=2021-08-25|website=Python.org|language=en|archive-date=27 May 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210527000035\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0013\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The name Python is said to come from the British comedy series [[Monty Python's Flying Circus]].\u003cref name=\":0\"\u003e{{Cite book |last1=Briggs |first1=Jason R. |title=Python for kids: a playful introduction to programming |last2=Lipova\u010da |first2=Miran |date=2013 |publisher=No Starch Press |isbn=978-1-59327-407-8 |location=San Francisco, Calif}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Python 2.0 was released on 16 October 2000, with many major new features such as [[list comprehension]]s, [[cycle detection|cycle-detecting]] garbage collection, [[reference counting]], and [[Unicode]] support.\u003cref name=\"newin-2.0\"\u002f\u003e Python 2.7's [[end-of-life product|end-of-life]] was initially set for 2015, then postponed to 2020 out of concern that a large body of existing code could not easily be forward-ported to Python&nbsp;3.\u003cref\u003e{{cite web |url=https:\u002f\u002flegacy.python.org\u002fdev\u002fpeps\u002fpep-0373\u002f |title=PEP 373 \u2013 Python 2.7 Release Schedule |work=python.org |access-date=9 January 2017 |archive-date=19 May 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200519075520\u002fhttps:\u002f\u002flegacy.python.org\u002fdev\u002fpeps\u002fpep-0373\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0466\u002f |title=PEP 466 \u2013 Network Security Enhancements for Python 2.7.x |work=python.org |access-date=9 January 2017 |archive-date=4 June 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200604232833\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0466\u002f |url-status=live}}\u003c\u002fref\u003e It no longer receives security patches or updates.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.python.org\u002fdoc\u002fsunset-python-2\u002f|title=Sunsetting Python 2|website=Python.org|language=en|access-date=22 September 2019|archive-date=12 January 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200112080903\u002fhttps:\u002f\u002fwww.python.org\u002fdoc\u002fsunset-python-2\u002f|url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0373\u002f|title=PEP 373 \u2013 Python 2.7 Release Schedule|website=Python.org|language=en|access-date=22 September 2019|archive-date=13 January 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200113033257\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0373\u002f|url-status=live}}\u003c\u002fref\u003e While Python 2.7 and older versions are officially unsupported, a different unofficial Python implementation, [[PyPy]], continues to support Python 2, i.e. \"2.7.18+\" (plus 3.10), with the plus meaning (at least some) \"[[backporting|backported]] security updates\".\u003cref\u003e{{Cite web |last=mattip |date=2023-12-25 |title=PyPy v7.3.14 release |url=https:\u002f\u002fwww.pypy.org\u002fposts\u002f2023\u002f12\u002fpypy-v7314-release.html |access-date=2024-01-05 |website=PyPy |language=en |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105132820\u002fhttps:\u002f\u002fwww.pypy.org\u002fposts\u002f2023\u002f12\u002fpypy-v7314-release.html |url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Python&nbsp;3.0 was released on 3 December 2008, with some new semantics and changed syntax. At least every Python release since (now unsupported) 3.5 has added some syntax to the language, and a few later releases have dropped outdated modules, and changed semantics, at least in a minor way.\u003cbr\u003e-\u003cbr\u003e-{{As of|2025|3|12|since=n}}, Python 3.13 is the latest stable release. Python 3.13 currently receives full bug-fix and security updates, while Python 3.12\u2014released in October 2023\u2014will have active bug-fix support only until April 2025. Python 3.9\u003cref\u003e{{Cite web |last=Langa |first=\u0141ukasz |date=2022-05-17 |title=Python 3.9.13 is now available |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f05\u002fpython-3913-is-now-available.html |access-date=2022-05-21 |website=Python Insider |archive-date=17 May 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220517173546\u002fhttps:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f05\u002fpython-3913-is-now-available.html |url-status=live}}\u003c\u002fref\u003e is the oldest supported version of Python (albeit in the 'security support' phase), due to Python 3.8 reaching [[end-of-life product|end-of-life]].\u003cref\u003e{{Cite web |title=Status of Python versions |url=https:\u002f\u002fdevguide.python.org\u002fversions\u002f |access-date=2024-10-07 |website=Python Developer's Guide |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |date=8 October 2024 |title=Python |url=https:\u002f\u002fendoflife.date\u002fpython |access-date=2024-11-20 |website=endoflife.date |language=en-US }}\u003c\u002fref\u003e Starting with 3.13, it and later versions have 2 years of full support (up from one and a half), followed by 3 years of security support (for same total support as before).\u003cbr\u003e+Python 2.0 was released on 16 October 2000, with many major new features such as Python (albeit in the 'security support' phase), due to Python 3.8 reaching [[end-of-life product|end-of-life]].\u003cref\u003e{{Cite web |title=Status of Python versions |url=https:\u002f\u002fdevguide.python.org\u002fversions\u002f |access-date=2024-10-07 |website=Python Developer's Guide |language=en}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |date=8 October 2024 |title=Python |url=https:\u002f\u002fendoflife.date\u002fpython |access-date=2024-11-20 |website=endoflife.date |language=en-US }}\u003c\u002fref\u003e Starting with 3.13, it and later versions have 2 years of full support (up from one and a half), followed by 3 years of security support (for same total support as before).\u003cbr\u003e \u003cbr\u003e Security updates were expedited in 2021 (and again twice in 2022, and more fixed in 2023 and in September 2024 for Python 3.12.6 down to 3.8.20), since all Python versions were insecure (including 2.7\u003cref\u003e{{Cite web|title=CVE-2021-3177 |url=https:\u002f\u002faccess.redhat.com\u002fsecurity\u002fcve\u002fcve-2021-3177|access-date=2021-02-26|website=Red Hat Customer Portal |archive-date=6 March 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210306183700\u002fhttps:\u002f\u002faccess.redhat.com\u002fsecurity\u002fcve\u002fcve-2021-3177|url-status=live}}\u003c\u002fref\u003e) because of security issues leading to possible [[remote code execution]]\u003cref\u003e{{Cite web|title=CVE-2021-3177|url=https:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2021-3177|access-date=2021-02-26|website=CVE|archive-date=27 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210227192918\u002fhttps:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2021-3177|url-status=live}}\u003c\u002fref\u003e and [[cache poisoning|web-cache poisoning]].\u003cref\u003e{{Cite web|title=CVE-2021-23336|url=https:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2021-23336|access-date=2021-02-26|website=CVE|archive-date=24 February 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210224160700\u002fhttps:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2021-23336|url-status=live}}\u003c\u002fref\u003e \u003c!-- In 2022, Python&nbsp;3.10.4 and 3.9.12 were expedited\u003cref\u003e{{Cite web |last=Langa |first=\u0141ukasz |date=2022-03-24 |title=Python 3.10.4 and 3.9.12 are now available out of schedule |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f03\u002fpython-3104-and-3912-are-now-available.html |access-date=2022-04-19 |website=Python Insider |archive-date=21 April 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220421205820\u002fhttps:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f03\u002fpython-3104-and-3912-are-now-available.html |url-status=live}}\u003c\u002fref\u003e and 3.8.13, because of many security issues.\u003cref\u003e{{Cite web |last=Langa |first=\u0141ukasz |date=2022-03-16 |title=Python 3.10.3, 3.9.11, 3.8.13, and 3.7.13 are now available with security content |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f03\u002fpython-3103-3911-3813-and-3713-are-now.html |access-date=2022-04-19 |website=Python Insider |archive-date=17 April 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220417215022\u002fhttps:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f03\u002fpython-3103-3911-3813-and-3713-are-now.html |url-status=live}}\u003c\u002fref\u003e --\u003e  \u003c!-- On 7 September 2022, four new releases were made due to a potential [[denial-of-service attack]]: 3.10.7, 3.9.14, 3.8.14, and 3.7.14.\u003cref\u003e{{Cite web |title=Python releases 3.10.7, 3.9.14, 3.8.14, and 3.7.14 are now available |work=Python Insider |first1=\u0141ukasz |last1=Langa |date=7 September 2022 |access-date=16 September 2022 |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f09\u002fpython-releases-3107-3914-3814-and-3714.html |archive-date=13 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220913001104\u002fhttps:\u002f\u002fpythoninsider.blogspot.com\u002f2022\u002f09\u002fpython-releases-3107-3914-3814-and-3714.html |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=CVE-2020-10735 |work=CVE |access-date=16 September 2022 |url=https:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2020-10735 |archive-date=20 September 2022 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220920170528\u002fhttps:\u002f\u002fcve.mitre.org\u002fcgi-bin\u002fcvename.cgi?name=CVE-2020-10735 |url-status=live}}\u003c\u002fref\u003e --\u003e\u003cbr\u003e \u003cbr\u003e@@ -110,16 +113,12 @@\u003cbr\u003e ..\u003cbr\u003e The current implementation --\u003e [and it] has many corner cases and oddities. Code that works around those may need to be changed. Code that uses \u003ccode\u003elocals()\u003c\u002fcode\u003e for simple templating, or print debugging, will continue to work correctly.\u003c!-- Debuggers and other tools that use \u003ccode\u003ef_locals\u003c\u002fcode\u003e to modify local variables, will now work correctly, even in the presence of threaded code, coroutines and generators. --\u003e\"\u003cref\u003e{{Cite web |title=PEP 667 \u2013 Consistent views of namespaces {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0667\u002f |access-date=2024-10-07 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Python 3.13 introduces the experimental free-threaded build mode, which disables the Global Interpreter Lock (GIL), a feature of CPython that previously prevented multiple threads from executing Python bytecode simultaneously. This optional build, introduced through PEP 703, enables better exploitation of multi-core CPUs. By allowing multiple threads to run Python code in parallel, the free-threaded mode addresses long-standing performance bottlenecks associated with the GIL, offering a new path for parallelism in Python without resorting to multiprocessing or external concurrency frameworks.\u003cref\u003e{{Cite web |title=PEP 703 \u2013 Making the GIL Optional in CPython |url=https:\u002f\u002fpeps.python.org\u002fpep-0703\u002f |access-date=2025-03-30 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e Some (more) standard library modules and many deprecated classes, functions and methods, will be removed in Python 3.15 or 3.16.\u003cref\u003e{{Cite web |last=Wouters |first=Thomas |date=2024-04-09 |title=Python Insider: Python 3.12.3 and 3.13.0a6 released |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2024\u002f04\u002fpython-3123-and-3130a6-released.html |access-date=2024-04-29 |website=Python Insider}}\u003c\u002fref\u003e\u003cref\u003e{{cite web |title=PEP 594 \u2013 Removing dead batteries from the standard library |url=https:\u002f\u002fpeps.python.org\u002fpep-0594\u002f |website=Python Enhancement Proposals |publisher=Python Softtware Foundation |date=20 May 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Python 3.11 adds Sigstore digital verification signatures for all CPython artifacts (in addition to [[Pretty Good Privacy|PGP]]). Since use of PGP has been criticized by security practitioners, \u003c!-- \"for years now\" --\u003e Python is moving to Sigstore exclusively and dropping PGP from 3.14.\u003cref\u003e{{Cite web |title=PEP 761 \u2013 Deprecating PGP signatures for CPython artifacts {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0761\u002f |access-date=2025-01-06 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Python 3.14 is now in alpha 3; \u003c!-- has changes for annotations \u003c!- \"PEP 563 [for Python 3.7 also] changed the semantics of annotations. -\u003e, with PEP 649 \"[preserving] nearly all existing behavior of annotations from stock semantics\u003c!- .. This will print \u003cclass 'str'\u003e with stock semantics and \u003cclass 'int'\u003e when this PEP is active. This is therefore a backwards-incompatible change. However, this example is poor programming style, so this change seems acceptable. -\u003e\".\u003cref\u003e{{Cite web |title=PEP 649 \u2013 Deferred Evaluation Of Annotations Using Descriptors {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0649\u002f |access-date=2024-10-16 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+Python 3.14 is now in alpha 2;\u003cref\u003e{{Cite web |last=Hugo |date=2024-10-15 |title=Python Insider: Python 3.14.0 alpha 1 is now available |url=https:\u002f\u002fpythoninsider.blogspot.com\u002f2024\u002f10\u002fpython-3140-alpha-1-is-now-available.html |access-date=2024-10-16 |website=Python Insider}}\u003c\u002fref\u003e \u003c!-- has changes for annotations \u003c!- \"PEP 563 [for Python 3.7 also] changed the semantics of annotations. -\u003e, with PEP 649 \"[preserving] nearly all existing behavior of annotations from stock semantics\u003c!- .. This will print \u003cclass 'str'\u003e with stock semantics and \u003cclass 'int'\u003e when this PEP is active. This is therefore a backwards-incompatible change. However, this example is poor programming style, so this change seems acceptable. -\u003e\".\u003cref\u003e{{Cite web |title=PEP 649 \u2013 Deferred Evaluation Of Annotations Using Descriptors {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0649\u002f |access-date=2024-10-16 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e PEP 649 is an \"Accepted PEP\" and seemingly implemented in 3.14, however there is under \"Open PEPs (under consideration)\":\u003cbr\u003e---\u003eregarding possible change to annotations: \"In Python 3.14, \u003ccode\u003efrom __future__ import\u003c\u002fcode\u003e annotations will continue to work as it did before, converting annotations into strings.\"\u003c!-- I think there's a minor breaking change if this is *omitted*, though I'm not sure omitting it was valid before while using annotations.\u003cbr\u003e+--\u003eregarding possible change to annotations: \"In Python 3.14, \u003ccode\u003efrom __future__ import\u003c\u002fcode\u003e annotations will continue to work as it did before, converting annotations into strings.\"  \u003c!-- I think there's a minor breaking change if this is *omitted*, though I'm not sure omitting it was valid before while using annotations.\u003cbr\u003e \u003cbr\u003e \"Since PEP 649 was written, Python 3.12 and 3.13 gained support for several new features that also use deferred evaluation, similar to the behavior this PEP proposes for annotations:\"--\u003e\u003cref\u003e{{Cite web |title=PEP 749 \u2013 Implementing PEP 649 {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0749\u002f |access-date=2024-11-20 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003c!--\u003cbr\u003e@@ -137,7 +136,7 @@\u003cbr\u003e Python 3.15 will \"Make UTF-8 mode default\",\u003cref\u003e{{Cite web |title=PEP 686 \u2013 Make UTF-8 mode default {{!}} peps.python.org |url=https:\u002f\u002fpeps.python.org\u002fpep-0686\u002f |access-date=2024-11-20 |website=Python Enhancement Proposals (PEPs) |language=en}}\u003c\u002fref\u003e the mode exists in all current Python versions, but currently needs to be opted into. [[UTF-8]] is already used, by default, on Windows (and elsewhere), for most things, but e.g. to \u003ccode\u003eopen\u003c\u002fcode\u003e files it's not and enabling also makes code fully cross-platform, i.e. use UTF-8 for everything on all platforms.\u003cbr\u003e \u003cbr\u003e ==Design philosophy and features==\u003cbr\u003e-Python is a [[multi-paradigm programming language]]. [[Object-oriented programming]] and [[structured programming]] are fully supported, and many of their features support functional programming and [[aspect-oriented programming]] (including [[metaprogramming]]\u003cref name=\"AutoNT-13\"\u002f\u003e and [[metaobject]]s).\u003cref name=\"AutoNT-14\"\u002f\u003e Many other paradigms are supported via extensions, including [[design by contract]]\u003cref name=\"AutoNT-15\"\u002f\u003e\u003cref name=\"AutoNT-16\"\u002f\u003e and [[logic programming]].\u003cref name=\"AutoNT-17\"\u002f\u003e Python is often referred to as a ''[[glue language|\u003cnowiki\u002f\u003e'glue language]]'''\u003cref\u003e{{Cite web |title=Glue It All Together With Python |url=https:\u002f\u002fwww.python.org\u002fdoc\u002fessays\u002fomg-darpa-mcc-position\u002f |access-date=2024-09-30 |website=Python.org |language=en}}\u003c\u002fref\u003e because it can seamlessly integrate components written in other languages.\u003cbr\u003e+Python is a [[multi-paradigm programming language]]. [[Object-oriented programming]] and [[structured programming]] are fully supported, and many of their features support functional programming and [[aspect-oriented programming]] (including [[metaprogramming]]\u003cref name=\"AutoNT-13\"\u002f\u003e and [[metaobject]]s).\u003cref name=\"AutoNT-14\"\u002f\u003e Many other paradigms are supported via extensions, including [[design by contract]]\u003cref name=\"AutoNT-15\"\u002f\u003e\u003cref name=\"AutoNT-16\"\u002f\u003e and [[logic programming]].\u003cref name=\"AutoNT-17\"\u002f\u003e Python is known as a ''[[glue language]]'',\u003cref\u003e{{Cite web |title=Glue It All Together With Python |url=https:\u002f\u002fwww.python.org\u002fdoc\u002fessays\u002fomg-darpa-mcc-position\u002f |access-date=2024-09-30 |website=Python.org |language=en}}\u003c\u002fref\u003e able to work very well with many other languages with ease of access.\u003cbr\u003e \u003cbr\u003e Python uses [[dynamic typing]] and a combination of [[reference counting]] and a cycle-detecting garbage collector for [[memory management]].\u003cref name=\"Reference_counting\"\u003e{{Cite web |url=https:\u002f\u002fdocs.python.org\u002fextending\u002fextending.html#reference-counts |title=Extending and Embedding the Python Interpreter: Reference Counts |publisher=Docs.python.org |language=en |access-date=5 June 2020 |quote=Since Python makes heavy use of \u003ccode\u003emalloc()\u003c\u002fcode\u003e and \u003ccode\u003efree()\u003c\u002fcode\u003e, it needs a strategy to avoid memory leaks as well as the use of freed memory. The chosen method is called ''reference counting''. |archive-date=18 October 2012 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121018063230\u002fhttp:\u002f\u002fdocs.python.org\u002fextending\u002fextending.html#reference-counts |url-status=live}}\u003c\u002fref\u003e It uses dynamic [[Name resolution (programming languages)|name resolution]] ([[late binding]]), which binds method and variable names during program execution.\u003cbr\u003e \u003cbr\u003e@@ -159,7 +158,7 @@\u003cbr\u003e \u003cbr\u003e Python's developers usually strive to avoid [[premature optimization]] and reject patches to non-critical parts of the [[CPython]] reference implementation that would offer marginal increases in speed at the cost of clarity.\u003cref name=\"AutoNT-20\"\u002f\u003e Execution speed can be improved by moving speed-critical functions to extension modules written in languages such as C, or by using a [[just-in-time compiler]] like [[PyPy]]. It is also possible to [[#Cross-compilers to other languages|cross-compile to other languages]], but it either doesn't provide the full speed-up that might be expected, since Python is a very [[dynamic language]], or a restricted subset of Python is compiled, and possibly semantics are slightly changed.\u003cref name=PyJL\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Python's developers aim for it to be fun to use. This is reflected in its name\u2014a tribute to the British comedy group [[Monty Python]]\u003cref name=\"whyname\"\u002f\u003e\u2014and in occasionally playful approaches to tutorials and reference materials, such as the use of the terms \"spam\" and \"eggs\" (a reference to [[Spam (Monty Python)|a Monty Python sketch]]) in examples, instead of the often-used [[foobar|\"foo\" and \"bar\"]].\u003cref\u003e{{Cite web|url=https:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|title=15 Ways Python Is a Powerful Force on the Web|access-date=3 July 2018|archive-date=11 May 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190511065650\u002fhttp:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=pprint \u2013 Data pretty printer \u2013 Python 3.11.0 documentation |url=https:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |access-date=2022-11-05 |website=docs.python.org |quote=stuff=['spam', 'eggs', 'lumberjack', 'knights', 'ni'] |archive-date=22 January 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210122224848\u002fhttps:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |url-status=live}}\u003c\u002fref\u003e A common [[neologism]] in the Python community is ''pythonic'', which has a wide range of meanings related to program style. \"Pythonic\" code may use Python [[Programming idiom|idioms]] well, be natural or show fluency in the language, or conform with Python's minimalist philosophy and emphasis on readability.\u003cref\u003e{{Cite web|url=https:\u002f\u002fdocs.python-guide.org\u002fwriting\u002fstyle|title=Code Style \u2013 The Hitchhiker's Guide to Python|website=docs.python-guide.org|access-date=20 January 2021|archive-date=27 January 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210127154341\u002fhttps:\u002f\u002fdocs.python-guide.org\u002fwriting\u002fstyle\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e+Python's developers aim for it to be fun to use. This is reflected in its name\u2014a tribute to the British comedy group [[Monty Python]]\u003cref name=\"whyname\"\u002f\u003e\u2014and in occasionally playful approaches to tutorials and reference materials, such as the use of the terms \"spam\" and \"eggs\" (a reference to [[Spam (Monty Python)|a Monty Python sketch]]) in examples, instead of the often-used [[foobar|\"foo\" and \"bar\"]].\u003cref\u003e{{Cite web|url=https:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|title=15 Ways Python Is a Powerful Force on the Web|access-date=3 July 2018|archive-date=11 May 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190511065650\u002fhttp:\u002f\u002finsidetech.monster.com\u002ftraining\u002farticles\u002f8114-15-ways-python-is-a-powerful-force-on-the-web|url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=pprint \u2013 Data pretty printer \u2013 Python 3.11.0 documentation |url=https:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |access-date=2022-11-05 |website=docs.python.org |quote=stuff=['spam', 'eggs', 'lumberjack', 'knights', 'ni'] |archive-date=22 January 2021 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210122224848\u002fhttps:\u002f\u002fdocs.python.org\u002f3\u002flibrary\u002fpprint.html |url-status=live}}\u003c\u002fref\u003e A common [[neologism]] in the Python community is ''pythonic'', which has a wide range of meanings related to program style. \"Pythonic\" code may use Python [[Programming idiom|idioms]] well, be natural or show fluency in the language, or conform with Python's minimalist philosophy and emphasis on readability. Code that is difficult to understand or reads like a rough transcription from another programming language is called ''unpythonic''.\u003cref\u003e{{Cite web|url=https:\u002f\u002fdocs.python-guide.org\u002fwriting\u002fstyle|title=Code Style \u2013 The Hitchhiker's Guide to Python|website=docs.python-guide.org|access-date=20 January 2021|archive-date=27 January 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210127154341\u002fhttps:\u002f\u002fdocs.python-guide.org\u002fwriting\u002fstyle\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Syntax and semantics==\u003cbr\u003e {{Main|Python syntax and semantics}}\u003cbr\u003e@@ -176,7 +175,7 @@\u003cbr\u003e ===Statements and control flow===\u003cbr\u003e Python's [[statement (computer science)|statements]] include:\u003cbr\u003e * The [[Assignment (computer science)|assignment]] statement, using a single equals sign \u003ccode\u003e=\u003c\u002fcode\u003e\u003cbr\u003e-* The \u003ccode\u003e[[if-then-else|if]]\u003c\u002fcode\u003e statement, which conditionally executes a block of code, along with \u003ccode\u003eelse\u003c\u002fcode\u003e and \u003ccode\u003eelif\u003c\u002fcode\u003e (a contraction of \u003ccode\u003eelse if\u003c\u002fcode\u003e)\u003cbr\u003e+* The \u003ccode\u003e[[if-then-else|if]]\u003c\u002fcode\u003e statement, which conditionally executes a block of code, along with \u003ccode\u003eelse\u003c\u002fcode\u003e and \u003ccode\u003eelif\u003c\u002fcode\u003e (a contraction of else-if)\u003cbr\u003e * The \u003ccode\u003e[[Foreach#Python|for]]\u003c\u002fcode\u003e statement, which iterates over an ''iterable'' object, capturing each element to a local variable for use by the attached block\u003cbr\u003e * The \u003ccode\u003e[[While loop#Python|while]]\u003c\u002fcode\u003e statement, which executes a block of code as long as its condition is true\u003cbr\u003e * The \u003ccode\u003e[[Exception handling syntax#Python|try]]\u003c\u002fcode\u003e statement, which allows exceptions raised in its attached code block to be caught and handled by \u003ccode\u003eexcept\u003c\u002fcode\u003e clauses (or new syntax \u003ccode\u003eexcept*\u003c\u0 ting [[regular expression]]s, and [[unit testing]].\u003cbr\u003e \u003cbr\u003e Some parts of the standard library are covered by specifications\u2014for example, the [[Web Server Gateway Interface]] (WSGI) implementation \u003ccode\u003ewsgiref\u003c\u002fcode\u003e follows PEP 333\u003cref name=\"AutoNT-89\"\u002f\u003e\u2014but most are specified by their code, internal documentation, and [[test suite]]s. However, because most of the standard library is cross-platform Python code, only a few modules need altering or rewriting for variant implementations.\u003cbr\u003e \u003cbr\u003e-{{As of|2025|03|13|post=,}} the [[Python Package Index]] (PyPI), the official repository for third-party Python software, contains over 614,339\u003cref name=\"PyPI\"\u003e{{cite web |date=2025-03-13 |title=PyPI |url=https:\u002f\u002fpypi.org\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20250222013445\u002fhttps:\u002f\u002fpypi.org\u002f |archive-date=2025-02-22 |website=PyPI}}\u003c\u002fref\u003e packages with a wide range of functionality, including:\u003cbr\u003e+{{As of|2024|03|17|post=,}} the [[Python Package Index]] (PyPI), the official repository for third-party Python software, contains over 523,000\u003cref name=\"PyPI\"\u003e{{cite web |date=2024-03-17 |title=PyPI |url=https:\u002f\u002fpypi.org\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240317112557\u002fhttps:\u002f\u002fpypi.org\u002f |archive-date=2024-03-17 |website=PyPI}}\u003c\u002fref\u003e packages with a wide range of functionality, including:\u003cbr\u003e \u003cbr\u003e {{columns-list|colwidth=30em|\u003cbr\u003e * [[Automation]]\u003cbr\u003e@@ -436,7 +435,7 @@\u003cbr\u003e \u003cbr\u003e Other shells, including [[IDLE]] and [[IPython]], add further abilities such as improved auto-completion, session state retention, and [[syntax highlighting]].\u003cbr\u003e \u003cbr\u003e-As well as standard desktop [[integrated development
