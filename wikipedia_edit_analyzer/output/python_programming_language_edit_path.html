List of Python software#Python implementations}}\u003cbr\u003e@@ -453,12 +452,12 @@\u003cbr\u003e All alternative implementations have at least slightly different semantics (e.g. may have unordered dictionaries\u003c!-- like with Codon; also PyPy? Cython? --\u003e, unlike all current Python versions), e.g. with the larger Python ecosystem, such as with supporting the C Python API of with PyPy:\u003cbr\u003e \u003cbr\u003e * [[PyPy]] is a fast, compliant interpreter of Python&nbsp;2.7 and \u003c!-- 3.8 (both are outdated CPython versions) --\u003e 3.10.\u003cref name=\"AutoNT-70\"\u002f\u003e\u003cref\u003e{{Cite web|last=Team|first=The PyPy|date=2019-12-28|title=Download and Install|url=https:\u002f\u002fwww.pypy.org\u002fdownload.html|access-date=2022-01-08|website=PyPy|language=en|archive-date=8 January 2022|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20220108212951\u002fhttps:\u002f\u002fwww.pypy.org\u002fdownload.html|url-status=live}}\u003c\u002fref\u003e Its [[just-in-time compiler]] often brings a significant speed improvement over CPython, but some libraries written in C cannot be used with it.\u003cref name=\"AutoNT-71\"\u002f\u003e It has e.g. [[RISC-V]] support.\u003cbr\u003e-* Codon is a language with an [[ahead-of-time compilation|ahead-of-time (AOT) compiler]], that (AOT) compiles a statically-typed Python-like language with \"syntax and semantics are nearly identical to Python's, there are some notable differences\"\u003cref\u003e{{Cite web |title=Codon: Differences with Python |url=https:\u002f\u002fdocs.exaloop.io\u002fcodon\u002fgeneral\u002fdifferences |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230525002540\u002fhttps:\u002f\u002fdocs.exaloop.io\u002fcodon\u002fgeneral\u002fdifferences |archive-date=2023-05-25 |access-date=2023-08-28}}\u003c\u002fref\u003e e.g. it uses 64-bit machine integers, for speed, not arbitrary like Python, and it claims speedups over CPython are usually on the order of 10\u2013100x. It compiles to machine code (via [[LLVM]]) and supports native multithreading.\u003cref\u003e{{Cite web |last=Lawson |first=Loraine |date=2023-03-14 |title=MIT-Created Compiler Speeds up Python Code |url=https:\u002f\u002fthenewstack.io\u002fmit-created-compiler-speeds-up-python-code\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230406054200\u002fhttps:\u002f\u002fthenewstack.io\u002fmit-created-compiler-speeds-up-python-code\u002f |archive-date=2023-04-06 |access-date=2023-08-28 |website=The New Stack |language=en-US}}\u003c\u002fref\u003e \u003c!-- It's compile has a restrictive BSL licence, but it doesn't affect generated code: --\u003e Codon can also compile to Python extension modules that can be imported and used from Python.\u003cbr\u003e+* [https:\u002f\u002fgithub.com\u002fexaloop\u002fcodon Codon] is a language with an [[ahead-of-time compilation|ahead-of-time (AOT) compiler]], that (AOT) compiles a statically-typed Python-like language with \"syntax and semantics are nearly identical to Python's, there are some notable differences\"\u003cref\u003e{{Cite web |title=Codon: Differences with Python |url=https:\u002f\u002fdocs.exaloop.io\u002fcodon\u002fgeneral\u002fdifferences |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230525002540\u002fhttps:\u002f\u002fdocs.exaloop.io\u002fcodon\u002fgeneral\u002fdifferences |archive-date=2023-05-25 |access-date=2023-08-28}}\u003c\u002fref\u003e e.g. it uses 64-bit machine integers, for speed, not arbitrary like Python, and it claims speedups over CPython are usually on the order of 10\u2013100x. It compiles to machine code (via [[LLVM]]) and supports native multithreading.\u003cref\u003e{{Cite web |last=Lawson |first=Loraine |date=2023-03-14 |title=MIT-Created Compiler Speeds up Python Code |url=https:\u002f\u002fthenewstack.io\u002fmit-created-compiler-speeds-up-python-code\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20230406054200\u002fhttps:\u002f\u002fthenewstack.io\u002fmit-created-compiler-speeds-up-python-code\u002f |archive-date=2023-04-06 |access-date=2023-08-28 |website=The New Stack |language=en-US}}\u003c\u002fref\u003e \u003c!-- It's compile has a restrictive BSL licence, but it doesn't affect generated code: --\u003e Codon can also compile to Python extension modules that can be imported and used from Python.\u003cbr\u003e * [[Stackless Python]] is a significant fork of CPython that implements [[microthread]]s; it does not use the [[call stack]] in the same way, thus allowing massively concurrent programs. PyPy also has a stackless version.\u003cref name=\"AutoNT-73\"\u002f\u003e\u003cbr\u003e * [[MicroPython]] and [[CircuitPython]] are Python&nbsp;3 variants optimized for [[microcontroller]]s, including [[Lego Mindstorms EV3]].\u003cref\u003e{{Cite web|url=https:\u002f\u002feducation.lego.com\u002fen-us\u002fsupport\u002fmindstorms-ev3\u002fpython-for-ev3|title=Python-for-EV3|website=LEGO Education|language=en|access-date=17 April 2019|archive-date=7 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200607234814\u002fhttps:\u002f\u002feducation.lego.com\u002fen-us\u002fsupport\u002fmindstorms-ev3\u002fpython-for-ev3|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Pyston is a variant of the Python runtime that uses just-in-time compilation to speed up the execution of Python programs.\u003cref\u003e{{cite news|url=https:\u002f\u002fwww.infoworld.com\u002farticle\u002f3587591\u002fpyston-returns-from-the-dead-to-speed-python.html|title=Pyston returns from the dead to speed Python|last=Yegulalp|first=Serdar|date=29 October 2020|website=[[InfoWorld]]|access-date=26 January 2021|archive-date=27 January 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210127113233\u002fhttps:\u002f\u002fwww.infoworld.com\u002farticle\u002f3587591\u002fpyston-returns-from-the-dead-to-speed-python.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Cinder is a performance-oriented fork of CPython 3.8 that contains a number of optimizations, including bytecode inline caching, eager evaluation of coroutines, a method-at-a-time [[Just-in-time compilation|JIT]], and an experimental bytecode compiler.\u003cref\u003e{{Cite web|url=https:\u002f\u002fgithub.com\u002ffacebookincubator\u002fcinder|title=cinder: Instagram's performance-oriented fork of CPython.|website=[[GitHub]]|access-date=4 May 2021|language=en|archive-date=4 May 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210504112500\u002fhttps:\u002f\u002fgithub.com\u002ffacebookincubator\u002fcinder|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-* Snek\u003c!-- (previously named Newt) --\u003e\u003cref\u003e{{Cite web |last=Aroca |first=Rafael |date=2021-08-07 |title=Snek Lang: feels like Python on Arduinos |url=https:\u002f\u002frafaelaroca.wordpress.com\u002f2021\u002f08\u002f07\u002fsnek-lang-feels-like-python-on-arduinos\u002f |access-date=2024-01-04 |website=Yet Another Technology Blog |language=en |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002frafaelaroca.wordpress.com\u002f2021\u002f08\u002f07\u002fsnek-lang-feels-like-python-on-arduinos\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Aufranc (CNXSoft) |first=Jean-Luc |date=2020-01-16 |title=Snekboard Controls LEGO Power Functions with CircuitPython or Snek Programming Languages (Crowdfunding) \u2013 CNX Software |url=https:\u002f\u002fwww.cnx-software.com\u002f2020\u002f01\u002f16\u002fsnekboard-controls-lego-power-functions-with-circuitpython-or-snek-programming-languages\u002f |access-date=2024-01-04 |website=CNX Software \u2013 Embedded Systems News |language=en-US |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002fwww.cnx-software.com\u002f2020\u002f01\u002f16\u002fsnekboard-controls-lego-power-functions-with-circuitpython-or-snek-programming-languages\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Kennedy (@mkennedy) |first=Michael |title=Ready to find out if you're git famous? |url=https:\u002f\u002fpythonbytes.fm\u002fepisodes\u002fshow\u002f187\u002fready-to-find-out-if-youre-git-famous |access-date=2024-01-04 |website=pythonbytes.fm |language=en-US |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002fpythonbytes.fm\u002fepisodes\u002fshow\u002f187\u002fready-to-find-out-if-youre-git-famous |url-status=live}}\u003c\u002fref\u003e\u003c!-- https:\u002f\u002fkeithp.com\u002fblogs\u002fnewt-lola\u002f https:\u002f\u002fbipes.net.br\u002fsnek-web-uploader\u002f --\u003e Embedded Computing Language (compatible with e.g. 8-bit [[AVR microcontrollers]] such as [[ATmega|ATmega 328P]]-based Arduino, as well as larger ones compatible with [[MicroPython]]) \"is Python-inspired, but it is not Python. It is possible to write Snek programs that run under a full Python system, but most Python programs will not run under Snek.\"\u003cref\u003e{{Cite web |last=Packard |first=Keith |date=2022-12-20 |title=The Snek Programming Language: A Python-inspired Embedded Computing Language |url=https:\u002f\u002fsneklang.org\u002fdoc\u002fsnek.pdf |access-date=4 January 2024 |archive-date=4 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240104162458\u002fhttps:\u002f\u002fsneklang.org\u002fdoc\u002fsnek.pdf |url-status=live}}\u003c\u002fref\u003e It is an imperative language not including [[Object-oriented programming|OOP]] \u002f classes, unlike Python, and simplifying to one number type with 32-bit [[single-precision]] (similar to [[JavaScript]], except smaller). \u003c!-- \"Snek is a tiny embeddable language targeting processors with only a few kB of flash and ram. Think of something that would have been running BASIC years ago and you'll have the idea. These processors are too small to run MicroPython.\" \"Snekboard is a custom embedded computer designed to run Snek or CircuitPython.\" --\u003e\u003cbr\u003e+* [https:\u002f\u002fsneklang.org\u002f Snek]\u003c!-- (previously named Newt) --\u003e\u003cref\u003e{{Cite web |last=Aroca |first=Rafael |date=2021-08-07 |title=Snek Lang: feels like Python on Arduinos |url=https:\u002f\u002frafaelaroca.wordpress.com\u002f2021\u002f08\u002f07\u002fsnek-lang-feels-like-python-on-arduinos\u002f |access-date=2024-01-04 |website=Yet Another Technology Blog |language=en |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002frafaelaroca.wordpress.com\u002f2021\u002f08\u002f07\u002fsnek-lang-feels-like-python-on-arduinos\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Aufranc (CNXSoft) |first=Jean-Luc |date=2020-01-16 |title=Snekboard Controls LEGO Power Functions with CircuitPython or Snek Programming Languages (Crowdfunding) \u2013 CNX Software |url=https:\u002f\u002fwww.cnx-software.com\u002f2020\u002f01\u002f16\u002fsnekboard-controls-lego-power-functions-with-circuitpython-or-snek-programming-languages\u002f |access-date=2024-01-04 |website=CNX Software \u2013 Embedded Systems News |language=en-US |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002fwww.cnx-software.com\u002f2020\u002f01\u002f16\u002fsnekboard-controls-lego-power-functions-with-circuitpython-or-snek-programming-languages\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Kennedy (@mkennedy) |first=Michael |title=Ready to find out if you're git famous? |url=https:\u002f\u002fpythonbytes.fm\u002fepisodes\u002fshow\u002f187\u002fready-to-find-out-if-youre-git-famous |access-date=2024-01-04 |website=pythonbytes.fm |language=en-US |archive-date=5 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240105001031\u002fhttps:\u002f\u002fpythonbytes.fm\u002fepisodes\u002fshow\u002f187\u002fready-to-find-out-if-youre-git-famous |url-status=live}}\u003c\u002fref\u003e\u003c!-- https:\u002f\u002fkeithp.com\u002fblogs\u002fnewt-lola\u002f https:\u002f\u002fbipes.net.br\u002fsnek-web-uploader\u002f --\u003e Embedded Computing Language (compatible with e.g. 8-bit [[AVR microcontrollers]] such as [[ATmega|ATmega 328P]]-based Arduino, as well as larger ones compatible with [[MicroPython]]) \"is Python-inspired, but it is not Python. It is possible to write Snek programs that run under a full Python system, but most Python programs will not run under Snek.\"\u003cref\u003e{{Cite web |last=Packard |first=Keith |date=2022-12-20 |title=The Snek Programming Language: A Python-inspired Embedded Computing Language |url=https:\u002f\u002fsneklang.org\u002fdoc\u002fsnek.pdf |access-date=4 January 2024 |archive-date=4 January 2024 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20240104162458\u002fhttps:\u002f\u002fsneklang.org\u002fdoc\u002fsnek.pdf |url-status=live}}\u003c\u002fref\u003e It is an imperative language not including [[Object-oriented programming|OOP]] \u002f classes, unlike Python, and simplifying to one number type with 32-bit [[single-precision]] (similar to [[JavaScript]], except smaller). \u003c!-- \"Snek is a tiny embeddable language targeting processors with only a few kB of flash and ram. Think of something that would have been running BASIC years ago and you'll have the idea. These processors are too small to run MicroPython.\" \"Snekboard is a custom embedded computer designed to run Snek or CircuitPython.\" --\u003e\u003cbr\u003e \u003cbr\u003e ===No longer supported implementations===\u003cbr\u003e Other just-in-time Python compilers have been developed, but are now unsupported:\u003cbr\u003e@@ -489,13 +488,6 @@\u003cbr\u003e ===Performance===\u003cbr\u003e Performance comparison of various Python implementations on a non-numerical (combinatorial) workload was presented at EuroSciPy '13.\u003cref\u003e{{cite conference |title=Performance of Python runtimes on a non-numeric scientific code |last=Murri |first=Riccardo |conference=European Conference on Python in Science (EuroSciPy) |year=2013 |arxiv=1404.6388|bibcode=2014arXiv1404.6388M}}\u003c\u002fref\u003e Python's performance compared to other programming languages is also benchmarked by [[The Computer Language Benchmarks Game]].\u003cref\u003e{{cite web|title=The Computer Language Benchmarks Game|url=https:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|access-date=30 April 2020|archive-date=14 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200614210246\u002fhttps:\u002f\u002fbenchmarksgame-team.pages.debian.net\u002fbenchmarksgame\u002ffastest\u002fpython.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-There are some ways of optimizing performance due to the slower nature of Python being an [[interpreted language]]. These optimizations use different strategies or tools:\u003cbr\u003e-\u003cbr\u003e-* [[Just-in-time compilation]]: Compiling code just before it is executed dynamically. These implementations are seen in libraries like [[Numba]] and [[PyPy]].\u003cbr\u003e-* [[Compiler|Static compilation]]: Code gets compiled into machine code before execution. An example of this is Cython which compiles Python into C.\u003cbr\u003e-* Concurrency and Parallelism: Multiple tasks can be run at the same time. Python contains modules like `multiprocessing` to allow for this form of parallelism. Additionally, it helps to overcome limitations of the [[Global interpreter lock|Global Interpreter Lock]] (GIL) in CPU tasks.\u003cbr\u003e-* Efficient Data Structures: Using data types such as \u003ccode\u003eSet\u003c\u002fcode\u003e for membership tests or \u003ccode\u003edeque\u003c\u002fcode\u003e from \u003ccode\u003ecollections\u003c\u002fcode\u003e for [[Queueing theory|queue]] operations can also improve performance.\u003cbr\u003e-\u003cbr\u003e ==Development==\u003cbr\u003e Python's development is conducted largely through the ''Python Enhancement Proposal'' (PEP) process, the primary mechanism for proposing major new features, collecting community input on issues, and documenting Python design decisions.\u003cref name=\"PepCite000\"\u002f\u003e Python coding style is covered in PEP&nbsp;8.\u003cref\u003e{{cite web|url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0008\u002f|title=PEP 8 \u2013 Style Guide for Python Code|website=Python.org|access-date=26 March 2019|archive-date=17 April 2019|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190417223549\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0008\u002f|url-status=live}}\u003c\u002fref\u003e Outstanding PEPs are reviewed and commented on by the Python community and the steering council.\u003cref name=\"PepCite000\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -523,8 +515,7 @@\u003cbr\u003e The prefix ''Py-'' is used to show that something is related to Python. Examples of the use of this prefix in names of Python applications or libraries include [[Pygame]], a [[language binding|binding]] of [[Simple DirectMedia Layer]] to Python (commonly used to create games); [[PyQt]] and [[PyGTK]], which bind [[Qt (software)|Qt]] and GTK to Python respectively; and [[PyPy]], a Python implementation originally written in Python.\u003cbr\u003e \u003cbr\u003e ==Popularity==\u003cbr\u003e-Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web|last=Blake|first=Troy|date=2021-01-18|title=TIOBE Index for January 2021|url=https:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|access-date=2021-02-26|website=Technology News and Information by SeniorDBA|language=en|archive-date=21 March 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210321143253\u002fhttps:\u002f\u002fseniordba.wordpress.com\u002f2021\u002f01\u002f18\u002ftiobe-index-for-january-2021\u002f|url-status=live}}\u003c\u002fref\u003e). In the TIOBE Index, monthly rankings are based on the volume of searches for programming languages on Google, Amazon, Wikipedia, Bing, and 20 other platforms. According to the accompanying graph, Python has shown a marked upward trend since the early 2000s, eventually passing long-established languages such as C, C++, and Java. This progression can be attributed to Python\u2019s readable syntax, comprehensive standard library, and application in data science and machine learning fields.\u003cref\u003e{{Cite web |title=TIOBE Index |url=https:\u002f\u002fwww.tiobe.com\u002ftiobe-index\u002f |access-date=2025-03-31 |website=TIOBE |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e-[[File:Tiobeindex.png|thumb|TIOBE Index Chart showing Python's popularity compared to other programming languages.]]\u003cbr\u003e+Since 2003, Python has consistently ranked in the top ten most popular programming languages in the [[TIOBE Programming Community Index]] where {{as of|2022|12|lc=y}} it was the most popular language (ahead of C, C++, and [[Java (programming language)|Java]]).\u003cref name=tiobecurrent\u002f\u003e It was selected as Programming Language of the Year (for \"the highest rise in ratings in a year\") in 2007, 2010, 2018, and 2020 (the only language to have done so four times {{as of|2020|lc=true}}\u003cref\u003e{{Cite web| ogram)|capella]]. [[GNU Debugger]] uses Python as a [[pretty printer]] to show complex structures such as C++ containers. [[Esri]] promotes Python as the best choice for writing scripts in [[ArcGIS]].\u003cref name=\"AutoNT-39\"\u002f\u003e It has also been used in several video games,\u003cref name=\"AutoNT-40\"\u002f\u003e\u003cref name=\"AutoNT-41\"\u002f\u003e and has been adopted as first of the three available [[programming language]]s in [[Google App Engine]], the other two being [[Java (software platform)|Java]] and [[Go (programming language)|Go]].\u003cref name=\"AutoNT-42\"\u002f\u003e\u003cbr\u003e+Python has been successfully embedded in many software products as a scripting language, including in [[finite element method]] software such as [[Abaqus]], 3D parametric modelers like [[FreeCAD]], 3D animation packages such as [[3ds Max]], [[Blender (software)|Blender]], [[Cinema 4D]], [[LightWave 3D|Lightwave]], [[Houdini (software)|Houdini]], [[Maya (software)|Maya]], [[modo (software)|modo]], [[MotionBuilder]], [[Autodesk Softimage|Softimage]], the visual effects compositor [[Nuke (software)|Nuke]], 2D imaging programs like [[GIMP]],\u003cref\u003e{{cite web |url=http:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |title=Installers for GIMP for Windows \u2013 Frequently Asked Questions |author=\u003c!-- Staff writer(s); no by-line. --\u003e |date=26 July 2013 |access-date=26 July 2013 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130717070814\u002fhttp:\u002f\u002fgimp-win.sourceforge.net\u002ffaq.html |archive-date=17 July 2013}}\u003c\u002fref\u003e [[Inkscape]], [[Scribus]] and [[Paint Shop Pro]],\u003cref name=\"AutoNT-38\"\u002f\u003e and [[musical notation]] programs like [[scorewriter]] and [[Capella (notation program)|capella]]. [[GNU Debugger]] uses Python as a [[pretty printer]] to show complex structures such as C++ containers. [[Esri]] promotes Python as the best choice for writing scripts in [[ArcGIS]].\u003cref name=\"AutoNT-39\"\u002f\u003e It has also been used in several video games,\u003cref name=\"AutoNT-40\"\u002f\u003e\u003cref name=\"AutoNT-41\"\u002f\u003e and has been adopted as first of the three available [[programming language]]s in [[Google App Engine]], the other two being [[Java (software platform)|Java]] and [[Go (programming language)|Go]].\u003cref name=\"AutoNT-42\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e Many operating systems include Python as a standard component. It ships with most [[Linux distribution]]s,\u003cref\u003e{{Cite web|url=https:\u002f\u002fdocs.python.org\u002f3\u002fusing\u002funix.html|title=Python Setup and Usage|publisher=Python Software Foundation|access-date=10 January 2020|archive-date=17 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200617143505\u002fhttps:\u002f\u002fdocs.python.org\u002f3\u002fusing\u002funix.html|url-status=live}}\u003c\u002fref\u003e [[AmigaOS 4]] (using Python&nbsp;2.7), [[FreeBSD]] (as a package), [[NetBSD]], and [[OpenBSD]] (as a package) and can be used from the command line (terminal). Many Linux distributions use installers written in Python: [[Ubuntu]] uses the [[Ubiquity (software)|Ubiquity]] installer, while [[Red Hat Linux]] and [[Fedora Linux]] use the [[Anaconda (installer)|Anaconda]] installer. [[Gentoo Linux]] uses Python in its [[package management system]], [[Portage (software)|Portage]].\u003cbr\u003e \u003cbr\u003e@@ -581,7 +572,6 @@\u003cbr\u003e * [[List of programming languages]]\u003cbr\u003e * [[History of programming languages]]\u003cbr\u003e * [[Comparison of programming languages]]\u003cbr\u003e-\u003cbr\u003e {{Clear}}\u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e@@ -621,6 +611,8 @@\u003cbr\u003e \u003cbr\u003e \u003cref name=\"newin-2.0\"\u003e{{cite web |url=https:\u002f\u002fdocs.python.org\u002fwhatsnew\u002f2.0.html |title=What's New in Python 2.0 |last1=Kuchling |first1=A. M. |last2=Zadka |first2=Moshe |date=16 October 2000 |publi loper, until 12 July 2018, when he announced his \"permanent vacation\" from his responsibilities as Python's \"[[benevolent dictator for life]]\" (BDFL), a title the Python community bestowed upon him to reflect his long-term commitment as the project's chief decision-maker\u003cref name=\"lj-bdfl-resignation\"\u002f\u003e (he has since come out of retirement and is self-titled \"BDFL-emeritus\"\u003c!-- on his Twitter--\u003e). In January&nbsp;2019, active Python core developers elected a five-member Steering Council to lead the project.\u003cref\u003e{{cite web |title=PEP 8100 |url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-8100\u002f |publisher=Python Software Foundation |access-date=4 May 2019 |archive-date=4 June 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200604235027\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-8100\u002f |url-status=live}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web|title=PEP 13 \u2013 Python Language Governance|url=https:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0013\u002f|access-date=2021-08-25|website=Python.org|language=en|archive-date=27 May 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210527000035\u002fhttps:\u002f\u002fwww.python.org\u002fdev\u002fpeps\u002fpep-0013\u002f|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The name Python is said to come from the British comedy series [[Monty Python's Flying Circus]].\u003cref name=\":0\"\u003e{{Cite book |last1=Briggs |first1=Jason R. |title=Python for kids: a playful introduction to programming |last2=Lipova\u010da |first2=Miran |date=2013 |publisher=No Starch Press |isbn=978-1-59327-407-8 |location=San Francisco, Calif}}\u003c\u002fref\u003e","--- Revision 61\u003cbr\u003e+++ Revision 62\u003cbr\u003e@@ -83,8 +83,8 @@\u003cbr\u003e \u003cbr\u003e ==History==\u003cbr\u003e {{Main|History of Python}}\u003cbr\u003e-[[File:Guido van Rossum in PyConUS24.jpg|thumb|311x311p roller]]s, including [[Lego Mindstorms EV3]].\u003cref\u003e{{Cite web|url=https:\u002f\u002feducation.lego.com\u002fen-us\u002fsupport\u002fmindstorms-ev3\u002fpython-for-ev3|title=Python-for-EV3|website=LEGO Education|language=en|access-date=17 April 2019|archive-date=7 June 2020|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20200607234814\u002fhttps:\u002f\u002feducation.lego.com\u002fen-us\u002fsupport\u002fmindstorms-ev3\u002fpython-for-ev3|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Pyston is a variant of the Python runtime that uses just-in-time compilation to speed up the execution of Python programs.\u003cref\u003e{{cite news|url=https:\u002f\u002fwww.infoworld.com\u002farticle\u002f3587591\u002fpyston-returns-from-the-dead-to-speed-python.html|title=Pyston returns from the dead to speed Python|last=Yegulalp|first=Serdar|date=29 October 2020|website=[[InfoWorld]]|access-date=26 January 2021|archive-date=27 January 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210127113233\u002fhttps:\u002f\u002fwww.infoworld.com\u002farticle\u002f3587591\u002fpyston-returns-from-the-dead-to-speed-python.html|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e * Cinder is a performance-oriented fork of CPython 3.8 that contains a number of optimizations, including bytecode inline caching, eager evaluation of coroutines, a method-at-a-time [[Just-in-time compilation|JIT]], and an experimental bytecode compiler.\u003cref\u003e{{Cite web|url=https:\u002f\u002fgithub.com\u002ffacebookincubator\u002fcinder|title=cinder: Instagram's performance-oriented fork of CPython.|website=[[GitHub]]|access-date=4 May 2021|language=en|archive-date=4 May 2021|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210504112500\u002fhttps:\u002f\u002fgithub.com\u002ffacebookincubator\u002fcinder|url-status=live}}\u003c\u002fref\u003e\u003cbr\u003e-* [https:\u002f\u002fsneklang.org\u002f Snek]\u003c!-- (previously named Newt) --\u003e\u003cref
