um logic gate#Universal quantum gates|universal gate set]], since a computer that can run such circuits is a [[universal quantum computer]]. One common such set includes all single-qubit gates as well as the CNOT gate from above. This means any quantum computation can be performed by executing a sequence of single-qubit gates together with CNOT gates. Though this gate set is infinite, it can be replaced with a finite gate set by appealing to the [[Solovay\u2013Kitaev theorem|Solovay-Kitaev theorem]]. Implementation of Boolean functions using the few-qubit quantum gates is presented here.\u003cref\u003e{{Cite book |last1=Kurgalin |first1=Sergei |title=Concise guide to quantum computing: algorithms, exercises, and implementations |last2=Borzunov |first2=Sergei |date=2021 |publisher=Springer |isbn=978-3-030-65054-4 |series=Texts in computer science |location=Cham}}\u003c\u002fref\u003e\u003cbr\u003e+A [[quantum circuit|quantum gate array]] decomposes computation into a sequence of few-qubit [[quantum gate]]s. A quantum computation can be described as a network of quantum logic gates and measurements. However, any measurement can be deferred to the end of quantum computation, though this deferment may come at a computational cost, so most [[quantum circuit]]s depict a network consisting only of quantum logic gates and no measurements.\u003cbr\u003e+\u003cbr\u003e+Any quantum computation (which is, in the above formalism, any [[unitary matrix]] of size \u003cmath\u003e2^n \\times 2^n\u003c\u002fmath\u003e over \u003cmath\u003en\u003c\u002fmath\u003e qubits) can be represented as a network of quantum logic gates from a fairly small family of gates. A choice of gate family that enables this construction is known as a [[Quantum logic gate#Universal quantum gates|universal gate set]], since a computer that can run such circuits is a [[universal quantum computer]]. One common such set includes all single-qubit gates as well as the CNOT gate from above. This means any quantum computation can be performed by executing a sequence of single-qubit gates together with CNOT gates. Though this gate set is infinite, it can be replaced with a finite gate set by appealing to the [[Solovay\u2013Kitaev theorem|Solovay-Kitaev theorem]]. Implementation of Boolean functions using the few-qubit quantum gates is presented here.\u003cref\u003e{{Cite book |last1=Kurgalin |first1=Sergei |title=Concise guide to quantum computing: algorithms, exercises, and implementations |last2=Borzunov |first2=Sergei |date=2021 |publisher=Springer |isbn=978-3-030-65054-4 |series=Texts in computer science |location=Cham}}\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e ==== Measurement-based quantum computing ====\u003cbr\u003e \u003cbr\u003e@@ -114,7 +119,7 @@\u003cbr\u003e An [[Adiabatic quantum computation|adiabatic quantum computer]], based on [[quantum annealing]], decomposes computation into a slow continuous transformation of an initial [[Hamiltonian (quantum mechanics)|Hamiltonian]] into a final Hamiltonian, whose ground states contain the solution.\u003cref name=\"Das 2008 1061\u20131081\"\u003e{{cite journal|last1=Das|first1=A.|last2=Chakrabarti|first2=B. K.|year=2008|title=Quantum Annealing and Analog Quantum Computation|journal=[[Reviews of Modern Physics|Rev. Mod. Phys.]]|volume=80|issue=3|pages=1061\u20131081|arxiv=0801.2193|bibcode=2008RvMP...80.1061D|citeseerx=10.1.1.563.9990|doi=10.1103\u002fRevModPhys.80.1061|s2cid=14255125}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Neuromorphic quantum computing ====\u003cbr\u003e-Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that quantum algorithms, which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and do not follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e+Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional computing type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that [[Quantum algorithm|quantum algorithms]], which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and don\u2019t follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand, and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e \u003cbr\u003e ==== Topological quantum computing ====\u003cbr\u003e \u003cbr\u003e@@ -129,10 +134,11 @@\u003cbr\u003e Scientists at [[Harvard University|Harvard]] University successfully created \"quantum circuits\" that correct errors more efficiently than alternative methods, which may potentially remove a major obstacle to practical quantum computers.\u003cref\u003e{{Cite journal |last1=Bluvstein |first1=Dolev |last2=Evered |first2=Simon J. |last3=Geim |first3=Alexandra A. |last4=Li |first4=Sophie H. |last5=Zhou |first5=Hengyun |last6=Manovitz |first6=Tom |last7=Ebadi |first7=Sepehr |last8=Cain |first8=Madelyn |last9=Kalinowski |first9=Marcin |last10=Hangleiter |first10=Dominik |last11=Ataides |first11=J. Pablo Bonilla |last12=Maskara |first12=Nishad |last13=Cong |first13=Iris |last14=Gao |first14=Xun |last15=Rodriguez |first15=Pedro Sales |date=2023-12-06 |title=Logical quantum processor based on reconfigurable atom arrays |journal=Nature |volume=626 |issue=7997 |language=en |pages=58\u201365 |doi=10.1038\u002fs41586-023-06927-3 |pmid=38056497 |pmc=10830422 |issn=1476-4687|arxiv=2312.03982 |s2cid=266052773 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Freedberg Jr. |first=Sydney J. |date=2023-12-07 |title='Off to the races': DARPA, Harvard breakthrough brings quantum computing years closer |url=https:\u002f\u002fbreakingdefense.sites.breakingmedia.com\u002f2023\u002f12\u002foff-to-the-races-darpa-harvard-breakthrough-brings-quantum-computing-years-closer\u002f |access-date=2023-12-09 |website=Breaking Defense |language=en-US}}\u003c\u002fref\u003e The Harvard research team was supported by [[Massachusetts Institute of Technology|MIT]], [[QuEra Computing]], [[California Institute of Technology|Caltech]], and [[Princeton University|Princeton]] University and funded by [[DARPA]]'s Optimization with Noisy Intermediate-Scale Quantum devices (ONISQ) program.\u003cref\u003e{{Cite web |date=December 6, 2023 |title=DARPA-Funded Research Leads to Quantum Computing Breakthrough |url=https:\u002f\u002fwww.darpa.mil\u002fnews-events\u002f2023-12-06 |access-date=January 5, 2024 |website=darpa.mil}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Choudhury |first=Rizwan |date=2023-12-30 |title=Top 7 innovation stories of 2023 \u2013 Interesting Engineering |url=https:\u002f\u002finterestingengineering.com\u002flists\u002ftop-7-innovation-stories-of-2023-interesting-engineering |access-date=2024-01-06 |website=interestingengineering.com |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Quantum cryptography and cybersecurity ===\u003cbr\u003e+[[Image:Laser optique.jpg|thumb|right|Example of a quantum cryptosystem layout]]\u003cbr\u003e \u003cbr\u003e Quantum computing has significant potential applications in the fields of cryptography and cybersecurity. Quantum cryptography, which relies on the principles of quantum mechanics, offers the possibility of secure communication channels that are resistant to eavesdropping. Quantum key distribution (QKD) protocols, such as BB84, enable the secure exchange of cryptographic keys between parties, ensuring the confidentiality and integrity of communication. Moreover, quantum random number generators (QRNGs) can produce high-quality random numbers, which are essential for secure encryption.\u003cbr\u003e \u003cbr\u003e-However, quantum computing also poses challenges to traditional cryptographic systems. Shor's algorithm, a quantum algorithm for integer factorization, could potentially break widely used public-key cryptography schemes like RSA, which rely on the difficulty of factoring large numbers. Post-quantum cryptography, which involves the development of cryptographic algorithms that are resistant to attacks by both classical and quantum computers, is an active area of research aimed at addressing this concern.\u003cbr\u003e+However, quantum computing also poses challenges to traditional cryptographic systems. [[Shor's algorithm]], a quantum algorithm for integer factorization, could potentially break widely used public-key cryptography schemes like RSA, which rely on the difficulty of factoring large numbers. Post-quantum cryptography, which involves the development of cryptographic algorithms that are resistant to attacks by both classical and quantum computers, is an active area of research aimed at addressing this concern.\u003cbr\u003e \u003cbr\u003e Ongoing research in quantum cryptography and post-quantum cryptography is crucial for ensuring the security of communication and data in the face of evolving quantum computing capabilities. Advances in these fields, such as the development of new QKD protocols, the improvement of QRNGs, and the standardization of post-quantum cryptographic algorithms, will play a key role in maintaining the integrity and confidentiality of information in the quantum era.\u003cref\u003e{{cite journal |last1=Pirandola |first1=S. |last2=Andersen |first2=U. L. |last3=Banchi |first3=L. |last4=Berta |first4=M. |last5=Bunandar |first5=D. |last6=Colbeck |first6=R. |last7=Englund |first7=D. |last8=Gehring |first8=T. |last9=Lupo |first9=C. |last10=Ottaviani |first10=C. |last11=Pereira |first11=J. |last12=Razavi |first12=M. |last13=Shamsul Shaari |first13=J. |last14=Tomamichel |first14=M. |last15=Usenko |first15=V. C. |year=2020 |title=Advances in quantum cryptography |journal=Advances in Optics and Photonics |volume=12 |issue=4 |pages=1012\u20131236 |doi=10.1364\u002fAOP.361502 |last16=Vallone |first16=G. |last17=Villoresi |first17=P. |last18=Wallden |first18=P.|arxiv=1906.01645 |bibcode=2020AdOP...12.1012P }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -148,9 +154,9 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e-\u003cbr\u003e-Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]], have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include [[Shor's algorithm]] for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+\u003cbr\u003e+Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e \u003cbr\u003e@@ -159,19 +165,19 @@\u003cbr\u003e \u003cbr\u003e Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e+About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid 2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Post-quantum cryptography ===\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e-A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e+A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using [[Shor's algorithm]] to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e \u003cbr\u003e Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e \u003cbr\u003e === Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Main|Grover's algorithm}}\u003cbr\u003e \u003cbr\u003e-The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by [[Grover's algorithm]] using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e #There is no searchable structure in the collection of possible answers,\u003cbr\u003e@@ -213,15 +219,15 @@\u003cbr\u003e \u003cbr\u003e ==== Decoherence\u003cspan class=\"anchor\" id=\"Quantum decoherence\"\u003e\u003c\u002fspan\u003e ====\u003cbr\u003e \u003cbr\u003e-One of the greatest challenges involved in constructing quantum computers is controlling or removing quantum decoherence. This usually means isolating the system from its environment as interactions with the external world cause the system to decohere. However, other sources of decoherence also exist. Examples include the quantum gates and the lattice vibrations and background thermonuclear spin of the physical system used to implement the qubits. Decoherence is irreversible, as it is effectively non-unitary, and is usually something that should be highly controlled, if not avoided. Decoherence times for candidate systems in particular, the transverse relaxation time ''T''\u003csub\u003e2\u003c\u002fsub\u003e (for [[Nuclear magnetic resonance|NMR]] and [[MRI]] technology, also called the ''dephasing time''), typically range between nanoseconds and seconds at low temperatures.\u003cref name=\"DiVincenzo 1995\"\u003e{{cite journal |last=DiVincenzo |first=David P. |title=Quantum Computation |journal=Science |year=1995 |volume=270 |issue=5234 |pages=255\u2013261 |doi=10.1126\u002fscience.270.5234.255 |bibcode=1995Sci...270..255D |citeseerx=10.1.1.242.2165 |s2cid=220110562}}\u003c\u002fref\u003e Currently, some quantum computers require their qubits to be cooled to 20 millikelvin (usually using a [[dilution refrigerator]]\u003cref\u003e{{Cite journal |doi=10.1016\u002fj.cryogenics.2021.103390| issn=0011-2275 |title=Development of Dilution refrigerators \u2013 A review |journal=Cryogenics| volume=121| year=2022| last1=Zu| first1=H.| last2=Dai| first2=W.| last3=de Waele| first3=A.T.A.M.| s2cid=244005391}}\u003c\u002fref\u003e) in order to prevent significant decoherence.\u003cref\u003e{{cite journal |last1=Jones |first1=Nicola |title=Computing: The quantum company |journal=Nature |date=19 June 2013 |volume=498 |issue=7454 |pages=286\u2013288 |doi=10.1038\u002f498286a|pmid=23783610|bibcode=2013Natur.498..286J|doi-access=free}}\u003c\u002fref\u003e A 2020 study argues that [[ionizing radiation]] such as [[cosmic rays]] can nevertheless cause certain systems to decohere within milliseconds.\u003cref\u003e{{cite journal |last1=Veps\u00e4l\u00e4inen |first1=Antti P. |last2=Karamlou |first2=Amir H. |last3=Orrell |first3=John L. |last4=Dogra |first4=Akshunna S. |last5=Loer |first5=Ben |last6=Vasconcelos |first6=Francisca |last7=Kim |first7=David K. |last8=Melville |first8=Alexander J. |last9=Niedzielski |first9=Bethany M. |last10=Yoder |first10=Jonilyn L. |last11=Gustavsson |first11=Simon |last12=Formaggio |first12=Joseph A. |last13=VanDevender |first13=Brent A. |last14=Oliver |first14=William D. |display-authors=5 |title=Impact of ionizing radiation on superconducting qubit coherence |journal=Nature |date=August 2020 |volume=584 |issue=7822 |pages=551\u2013556 |doi=10.1038\u002fs41586-020-2619-8 |pmid=32848227 |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-020-2619-8 |language=en |issn=1476-4687|arxiv=2001.09190 |bibcode=2020Natur.584..551V |s2cid=210920566 }}\u003c\u002fref\u003e\u003cbr\u003e+One of the greatest challenges involved with constructing quantum computers is controlling or removing [[quantum decoherence]]. This usually means isolating the system from its environment as interactions with the external world cause the system to decohere. However, other sources of decoherence also exist. Examples include the quantum gates, and the lattice vibrations and background thermonuclear spin of the physical system used to implement the qubits. Decoherence is irreversible, as it is effectively non-unitary, and is usually something that should be highly controlled, if not avoided. Decoherence times for candidate systems in particular, the transverse relaxation time ''T''\u003csub\u003e2\u003c\u002fsub\u003e (for [[Nuclear magnetic resonance|NMR]] and [[MRI]] technology, also called the ''dephasing time''), typically range between nanoseconds and seconds at low temperature.\u003cref name=\"DiVincenzo 1995\"\u003e{{cite journal |last=DiVincenzo |first=David P. |title=Quantum Computation |journal=Science |year=1995 |volume=270 |issue=5234 |pages=255\u2013261 |doi=10.1126\u002fscience.270.5234.255 |bibcode=1995Sci...270..255D |citeseerx=10.1.1.242.2165 |s2cid=220110562}}\u003c\u002fref\u003e Currently, some quantum computers require their qubits to be cooled to 20 millikelvin (usually using a [[dilution refrigerator]]\u003cref\u003e{{Cite journal |doi=10.1016\u002fj.cryogenics.2021.103390| issn=0011-2275 |title=Development of Dilution refrigerators \u2013 A review |journal=Cryogenics| volume=121| year=2022| last1=Zu| first1=H.| last2=Dai| first2=W.| last3=de Waele| first3=A.T.A.M.| s2cid=244005391}}\u003c\u002fref\u003e) in order to prevent significant decoherence.\u003cref\u003e{{cite journal |last1=Jones |first1=Nicola |title=Computing: The quantum company |journal=Nature |date=19 June 2013 |volume=498 |issue=7454 |pages=286\u2013288 |doi=10.1038\u002f498286a|pmid=23783610|bibcode=2013Natur.498..286J|doi-access=free}}\u003c\u002fref\u003e A 2020 study argues that [[ionizing radiation]] such as [[cosmic rays]] can nevertheless cause certain systems to decohere within milliseconds.\u003cref\u003e{{cite journal |last1=Veps\u00e4l\u00e4inen |first1=Antti P. |last2=Karamlou |first2=Amir H. |last3=Orrell |first3=John L. |last4=Dogra |first4=Akshunna S. |last5=Loer |first5=Ben |last6=Vasconcelos |first6=Francisca |last7=Kim |first7=David K. |last8=Melville |first8=Alexander J. |last9=Niedzielski |first9=Bethany M. |last10=Yoder |first10=Jonilyn L. |last11=Gustavsson |first11=Simon |last12=Formaggio |first12=Joseph A. |last13=VanDevender |first13=Brent A. |last14=Oliver |first14=William D. |display-authors=5 |title=Impact of ionizing radiation on superconducting qubit coherence |journal=Nature |date=August 2020 |volume=584 |issue=7822 |pages=551\u2013556 |doi=10.1038\u002fs41586-020-2619-8 |pmid=32848227 |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-020-2619-8 |language=en |issn=1476-4687|arxiv=2001.09190 |bibcode=2020Natur.584..551V |s2cid=210920566 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e As a result, time-consuming tasks may render some quantum algorithms inoperable, as attempting to maintain the state of qubits for a long enough duration will eventually corrupt the superpositions.\u003cref\u003e{{cite arXiv |last1=Amy |first1=Matthew |last2=Matteo |first2=Olivia |last3=Gheorghiu |first3=Vlad |last4=Mosca |first4=Michele |last5=Parent |first5=Alex |last6=Schanck |first6=John |title=Estimating the cost of generic quantum pre-image attacks on SHA-2 and SHA-3 |date=30 November 2016 |eprint=1603.09383 |class=quant-ph}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-These issues are more difficult for optical approaches as the timescales are orders of magnitude shorter and an often-cited approach to overcoming them is optical [[pulse shaping]]. Error rates are typically proportional to the ratio of operating time to decoherence time; hence any operation must be completed much more quickly than the decoherence time.\u003cbr\u003e+These issues are more difficult for optical approaches as the timescales are orders of magnitude shorter and an often-cited approach to overcoming them is optical [[pulse shaping]]. Error rates are typically proportional to the ratio of operating time to decoherence time, hence any operation must be completed much more quickly than the decoherence time.\u003cbr\u003e \u003cbr\u003e As described by the [[threshold theorem]], if the error rate is small enough, it is thought to be possible to use [[quantum error correction]] to suppress errors and decoherence. This allows the total calculation time to be longer than the decoherence time if the error correction scheme can correct errors faster than decoherence introduces them. An often-cited figure for the required error rate in each gate for fault-tolerant computation is 10\u003csup\u003e\u22123\u003c\u002fsup\u003e, assuming the noise is depolarizing.\u003cbr\u003e \u003cbr\u003e-Meeting this scalability condition is possible for a wide range of systems. However, the use of error correction brings with it the cost of a greatly increased number of required qubits. The number required to factor integers using Shor's algorithm is still polynomial, and thought to be between ''L'' and ''L''\u003csup\u003e2\u003c\u002fsup\u003e, where ''L'' is the number of binary digits in the number to be factored; error correction algorithms would inflate this figure by an additional factor of ''L''. For a 1000-bit number, this implies a need for about 10\u003csup\u003e4\u003c\u002fsup\u003e bits without error correction.\u003cref\u003e{{cite journal |last=Dyakonov |first=M. I. |date=14 October 2006 |editor2=Xu |editor2-first=J. |editor3=Zaslavsky |editor3-first=A. |title=Is Fault-Tolerant Quantum Computation Really Possible? |journal=Future Trends in Microelectronics. Up the Nano Creek |pages=4\u201318 |arxiv=quant-ph\u002f0610117 |bibcode=2006quant.ph.10117D |editor1=S. Luryi}}\u003c\u002fref\u003e With error correction, the figure would rise to about 10\u003csup\u003e7\u003c\u002fsup\u003e bits. Computation time is about ''L''\u003csup\u003e2\u003c\u002fsup\u003e or about 10\u003csup\u003e7\u003c\u002fsup\u003e steps and at 1{{nbsp}}MHz, about 10 seconds. However, the encoding and error-correction overheads increase the size of a real fault-tolerant quantum computer by several orders of magnitude. Careful estimates\u003cref name=\":1\"\u003e{{Cite book |last=Ahsan |first=Muhammad |url=http:\u002f\u002fworldcat.org\u002foclc\u002f923881411 |title=Architecture Framework for Trapped-ion Quantum Computer based on Performance Simulation Tool |date=2015 |bibcode=2015PhDT........56A |language=en-US |oclc=923881411}}\u003c\u002fref\u003e\u003cref name=\":2\"\u003e{{Cite journal |last1=Ahsan |first1=Muhammad |last2=Meter |first2=Rodney Van |last3=Kim |first3=Jungsang |date=2016-12-28 |title=Designing a Million-Qubit Quantum Computer Using a Resource Performance Simulator |journal=ACM Journal on Emerging Technologies in Computing Systems |volume=12 |issue=4 |pages=39:1\u201339:25 |doi=10.1145\u002f2830570 |s2cid=1258374 |issn=1550-4832|doi-access=free |arxiv=1512.00796 }}\u003c\u002fref\u003e show that at least 3{{nbsp}}million physical qubits would factor 2,048-bit integer in 5 months on a fully error-corrected trapped-ion quantum computer. In terms of the number of physical qubits, to date, this remains the lowest estimate\u003cref\u003e{{Cite journal |last1=Gidney |first1=Craig |last2=Eker\u00e5 |first2=Martin |date=2021-04-15 |title=How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits |journal=Quantum |volume=5 |pages=433 |doi=10.22331\u002fq-2021-04-15-433 |arxiv=1905.09749 |bibcode=2021Quant...5..433G |s2cid=162183806 |issn=2521-327X}}\u003c\u002fref\u003e for practically useful integer factorization problem sizing 1,024-bit or larger.\u003cbr\u003e+Meeting this scalability condition is possible for a wide range of systems. However, the use of error correction brings with it the cost of a greatly increased number of required qubits. The number required to factor integers using Shor's algorithm is still polynomial, and thought to be between ''L'' and ''L''\u003csup\u003e2\u003c\u002fsup\u003e, where ''L'' is the number of digits in the number to be factored; error correction algorithms would inflate this figure by an additional factor of ''L''. For a 1000-bit number, this implies a need for about 10\u003csup\u003e4\u003c\u002fsup\u003e bits without error correction.\u003cref\u003e{{cite journal |last=Dyakonov |first=M. I. |date=14 October 2006 |editor2=Xu |editor2-first=J. |editor3=Zaslavsky |editor3-first=A. |title=Is Fault-Tolerant Quantum Computation Really Possible? |journal=Future Trends in Microelectronics. Up the Nano Creek |pages=4\u201318 |arxiv=quant-ph\u002f0610117 |bibcode=2006quant.ph.10117D |editor1=S. Luryi}}\u003c\u002fref\u003e With error correction, the figure would rise to about 10\u003csup\u003e7\u003c\u002fsup\u003e bits. Computation time is about ''L''\u003csup\u003e2\u003c\u002fsup\u003e or about 10\u003csup\u003e7\u003c\u002fsup\u003e steps and at 1{{nbsp}}MHz, about 10 seconds. However, the encoding and error-correction overheads increase the size of a real fault-tolerant quantum computer by several orders of magnitude. Careful estimates\u003cref name=\":1\"\u003e{{Cite book |last=Ahsan |first=Muhammad |url=http:\u002f\u002fworldcat.org\u002foclc\u002f923881411 |title=Architecture Framework for Trapped-ion Quantum Computer based on Performance Simulation Tool |date=2015 |language=en-US |oclc=923881411}}\u003c\u002fref\u003e\u003cref name=\":2\"\u003e{{Cite journal |last1=Ahsan |first1=Muhammad |last2=Meter |first2=Rodney Van |last3=Kim |first3=Jungsang |date=2016-12-28 |title=Designing a Million-Qubit Quantum Computer Using a Resource Performance Simulator |journal=ACM Journal on Emerging Technologies in Computing Systems |volume=12 |issue=4 |pages=39:1\u201339:25 |doi=10.1145\u002f2830570 |s2cid=1258374 |issn=1550-4832|doi-access=free |arxiv=1512.00796 }}\u003c\u002fref\u003e show that at least 3{{nbsp}}million physical qubits would factor 2,048-bit integer in 5 months on a fully error-corrected trapped-ion quantum computer. In terms of the number of physical qubits, to date, this remains the lowest estimate\u003cref\u003e{{Cite journal |last1=Gidney |first1=Craig |last2=Eker\u00e5 |first2=Martin |date=2021-04-15 |title=How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits |journal=Quantum |volume=5 |pages=433 |doi=10.22331\u002fq-2021-04-15-433 |arxiv=1905.09749 |bibcode=2021Quant...5..433G |s2cid=162183806 |issn=2521-327X}}\u003c\u002fref\u003e for practically useful integer factorization problem sizing 1,024-bit or larger.\u003cbr\u003e \u003cbr\u003e Another approach to the stability-decoherence problem is to create a [[topological quantum computer]] with [[anyon]]s, [[quasi-particle]]s used as threads, and relying on [[braid theory]] to form stable logic gates.\u003cref\u003e{{cite journal\u003cbr\u003e  | last1 = Freedman | first1 = Michael H. | author1-link = Michael Freedman\u003cbr\u003e@@ -240,7 +246,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum supremacy ===\u003cbr\u003e \u003cbr\u003e-Physicist [[John Preskill]] coined the term ''quantum supremacy'' to describe the engineering feat of demonstrating that a programmable quantum device can solve a problem beyond the capabilities of state-of-the-art classical computers.\u003cref\u003e{{cite arXiv |last=Preskill |first=John |date=2012-03-26 |title=Quantum computing and the entanglement frontier |eprint=1203.5813 |class=quant-ph}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last=Preskill |first=John |date=2018-08-06 |title=Quantum Computing in the NISQ era and beyond |journal=Quantum |volume=2 |pages=79 |doi=10.22331\u002fq-2018-08-06-79 |arxiv=1801.00862 |bibcode=2018Quant...2...79P |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |title=Characterizing Quantum Supremacy in Near-Term Devices|journal=Nature Physics |volume=14 |issue=6 |pages=595\u2013600 |first1=Sergio |last1=Boixo |first2=Sergei V. |last2=Isakov |first3=Vadim N. |last3=Smelyanskiy |first4=Ryan |last4=Babbush |first5=Nan |last5=Ding |first6=Zhang |last6=Jiang |first7=Michael J. |last7=Bremner |first8=John M. |last8=Martinis |first9=Hartmut |last9=Neven |display-authors=5 |year=2018 |arxiv=1608.00263 |doi=10.1038\u002fs41567-018-0124-x |bibcode=2018NatPh..14..595B |s2cid=4167494}}\u003c\u002fref\u003e The problem need not be useful, so some view the quantum supremacy test only as a potential future benchmark.\u003cref\u003e{{cite web |first=Neil |last=Savage |date=5 July 2017 |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fquantum-computers-compete-for-supremacy\u002f |title=Quantum Computers Compete for \"Supremacy\" |work=Scientific American}}\u003c\u002fref\u003e\u003cbr\u003e+Physicist [[John Preskill]] coined the term ''[[quantum supremacy]]'' to describe the engineering feat of demonstrating that a programmable quantum device can solve a problem beyond the capabilities of state-of-the-art classical computers.\u003cref\u003e{{cite arXiv |last=Preskill |first=John |date=2012-03-26 |title=Quantum computing and the entanglement frontier |eprint=1203.5813 |class=quant-ph}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal|last=Preskill |first=John |date=2018-08-06 |title=Quantum Computing in the NISQ era and beyond |journal=Quantum |volume=2 |pages=79 |doi=10.22331\u002fq-2018-08-06-79 |arxiv=1801.00862 |bibcode=2018Quant...2...79P |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |title=Characterizing Quantum Supremacy in Near-Term Devices|journal=Nature Physics |volume=14 |issue=6 |pages=595\u2013600 |first1=Sergio |last1=Boixo |first2=Sergei V. |last2=Isakov |first3=Vadim N. |last3=Smelyanskiy |first4=Ryan |last4=Babbush |first5=Nan |last5=Ding |first6=Zhang |last6=Jiang |first7=Michael J. |last7=Bremner |first8=John M. |last8=Martinis |first9=Hartmut |last9=Neven |display-authors=5 |year=2018 |arxiv=1608.00263 |doi=10.1038\u002fs41567-018-0124-x |bibcode=2018NatPh..14..595B |s2cid=4167494}}\u003c\u002fref\u003e The problem need not be useful, so some view the quantum supremacy test only as a potential future benchmark.\u003cref\u003e{{cite web |first=Neil |last=Savage |date=5 July 2017 |url=https:\u002f\u002fwww.scientificamerican.com\u002farticle\u002fquantum-computers-compete-for-supremacy\u002f |title=Quantum Computers Compete for \"Supremacy\" |work=Scientific American}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In October 2019, Google AI Quantum, with the help of NASA, became the first to claim to have achieved quantum supremacy by performing calculations on the [[Sycamore processor|Sycamore quantum computer]] more than 3,000,000 times faster than they could be done on [[Summit (supercomputer)|Summit]], generally considered the world's fastest computer.\u003cref name=\"1910.11333\"\u002f\u003e\u003cref\u003e{{cite web |last=Giles |first=Martin |date=September 20, 2019 |title=Google researchers have reportedly achieved 'quantum supremacy' |website=MIT Technology Review |language=en |url=https:\u002f\u002fwww.technologyreview.com\u002ff\u002f614416\u002fgoogle-researchers-have-reportedly-achieved-quantum-supremacy\u002f |access-date=May 15, 2020}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Tavares |first=Frank |date=2019-10-23 |title=Google and NASA Achieve Quantum Supremacy |url=http:\u002f\u002fwww.nasa.gov\u002ffeature\u002fames\u002fquantum-supremacy |access-date=2021-11-16 |website=NASA |language=en-US}}\u003c\u002fref\u003e This claim has been subsequently challenged: IBM has stated that Summit can perform samples much faster than claimed,\u003cref\u003e{{cite arXiv |last1=Pednault |first1=Edwin |last2=Gunnels |first2=John A. |last3=Nannicini |first3=Giacomo |last4=Horesh |first4=Lior |last5=Wisnieff |first5=Robert |date=2019-10-22|title=Leveraging Secondary Storage to Simulate Deep 54-qubit Sycamore Circuits |class=quant-ph |eprint=1910.09534}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=Cho |first=Adrian |date=2019-10-23 |title=IBM casts doubt on Google's claims of quantum supremacy |url=https:\u002f\u002fwww.science.org\u002fcontent\u002farticle\u002fibm-casts-doubt-googles-claims-quantum-supremacy |journal=Science |doi=10.1126\u002fscience.aaz6080 |s2cid=211982610 |issn=0036-8075}}\u003c\u002fref\u003e and researchers have since developed better algorithms for the sampling problem used to claim quantum supremacy, giving substantial reductions to the gap between Sycamore and classical supercomputers\u003cref\u003e{{Cite book |last1=Liu |first1=Yong (Alexander) |last2=Liu |first2=Xin (Lucy) |last3=Li |first3=Fang (Nancy) |last4=Fu |first4=Haohuan |last5=Yang |first5=Yuling |last6=Song |first6=Jiawei |last7=Zhao |first7=Pengpeng |last8=Wang |first8=Zhen |last9=Peng |first9=Dajia |last10=Chen |first10=Huarong |last11=Guo |first11=Chu |title=Proceedings of the International Conference for High Performance Computing, Networking, Storage and Analysis |chapter=Closing the \"quantum supremacy\" gap |display-authors=5 |date=2021-11-14 |series=SC '21 |location=New York, New York |publisher=Association for Computing Machinery |pages=1\u201312 |arxiv=2110.14502 |doi=10.1145\u002f3458817.3487399 |isbn=978-1-4503-8442-1 |s2cid=239036985}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Bulmer |first1=Jacob F. F. |last2=Bell |first2=Bryn A. |last3=Chadwick |first3=Rachel S. |last4=Jones |first4=Alex E. |last5=Moise |first5=Diana |last6=Rigazzi |first6=Alessandro |last7=Thorbecke |first7=Jan |last8=Haus |first8=Utz-Uwe |last9=Van Vaerenbergh |first9=Thomas |last10=Patel |first10=Raj B. |last11=Walmsley |first11=Ian A. |display-authors=5 |date=2022-01-28 |title=The boundary for quantum advantage in Gaussian boson sampling |journal=Science Advances |language=en |volume=8 |issue=4 |pages=eabl9236 |doi=10.1126\u002fsciadv.abl9236 |issn=2375-2548 |pmc=8791606 |pmid=35080972 |arxiv=2108.01622 |bibcode=2022SciA....8.9236B}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last=McCormick |first=Katie |date=2022-02-10 |title=Race Not Over Between Classical and Quantum Computers |url=https:\u002f\u002fphysics.aps.org\u002farticles\u002fv15\u002f19 |journal=Physics |language=en |volume=15|page=19 |doi=10.1103\u002fPhysics.15.19 |bibcode=2022PhyOJ..15...19M |s2cid=246910085 |doi-access=free }}\u003c\u002fref\u003e and even beating it.\u003cref\u003e{{Cite journal |title=Solving the Sampling Problem of the Sycamore Quantum Circuits |journal=Physical Review Letters |arxiv=2111.03011 |last1=Pan |first1=Feng |last2=Chen |first2=Keyang |last3=Zhang |first3=Pan |year=2022 |volume=129 |issue=9 |page=090502 |doi=10.1103\u002fPhysRevLett.129.090502 |pmid=36083655 |bibcode=2022PhRvL.129i0502P |s2cid=251755796}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |author=Cho |first=Adrian |date=2022-08-02 |title=Ordinary computers can beat Google's quantum computer after all |url=https:\u002f\u002fwww.science.org\u002fcontent\u002farticle\u002fordinary-computers-can-beat-google-s-quantum-computer-after-all |journal=Science |volume=377 |doi=10.1126\u002fscience.ade2364}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |title=Google's 'quantum supremacy' usurped by researchers using ordinary supercomputer |url=https:\u002f\u002ftechcrunch.com\u002f2022\u002f08\u002f05\u002fgoogles-quantum-supremacy-usurped-by-researchers-using-ordinary-supercomputer\u002f |access-date=2022-08-07 |website=TechCrunch |date=5 August 2022 |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -252,7 +258,7 @@\u003cbr\u003e \u003cbr\u003e === Skepticism ===\u003cbr\u003e \u003cbr\u003e-Despite high hopes for quantum computing, significant progress in hardware, and optimism about future applications, a 2023 [[Nature (journal)|Nature]] spotlight article summarized current quantum computers as being \"For now, [good for] absolutely nothing\".\u003cref name=\"good-for-nothing\"\u003e\u003cbr\u003e+Despite high hopes for quantum computing, significant progress in hardware, and optimism about future applications, a 2023 [[Nature (journal)|Nature]] spotlight article summarised current quantum computers as being \"For now, [good for] absolutely nothing\".\u003cref name=\"good-for-nothing\"\u003e\u003cbr\u003e {{Cite journal| journal = Nature | title = Quantum computers: what are they good for? | date = 24 May 2023 | first = Michael | last = Brooks| volume = 617 | issue = 7962 | pages = S1\u2013S3 | doi = 10.1038\u002fd41586-023-01692-9 | pmid = 37225885 | bibcode = 2023Natur.617S...1B | s2cid = 258847001 | doi-access = free }}\u003cbr\u003e \u003c\u002fref\u003e The article elaborated that quantum computers are yet to be more useful or efficient than conventional computers in any case, though it also argued that in the long term such computers are likely to be useful. A 2023 [[Communications of the ACM]] article\u003cref name = \"CACM\"\u003e{{Cite web | url = https:\u002f\u002fm-cacm.acm.org\u002fmagazines\u002f2023\u002f5\u002f272276-disentangling-hype-from-practicality-on-realistically-achieving-quantum-advantage\u002ffulltext | publisher = Communications of the ACM | date = May 2023 | title = Disentangling Hype from Practicality: On Realistically Achieving Quantum Advantage | \u003cbr\u003e author1 = Torsten Hoefler | author2 =  Thomas H\u00e4ner | author3 = Matthias Troyer}}\u003cbr\u003e@@ -262,41 +268,41 @@\u003cbr\u003e \u003cbr\u003e * Conventional computer hardware and algorithms are not only optimized for practical tasks, but are still improving rapidly, particularly [[GPU]] accelerators. \u003cbr\u003e * Current quantum computing hardware generates only a limited amount of [[Quantum entanglement|entanglement]] before getting overwhelmed by noise.\u003cbr\u003e-* Quantum algorithms provide speedup over conventional algorithms only for some tasks, and matching these tasks with practical applications proved challenging. Some promising tasks and applications require resources far beyond those available today.\u003cref\u003e{{Cite web| url = https:\u002f\u002fm-cacm.acm.org\u002fmagazines\u002f2022\u002f12\u002f266916-quantum-computers-and-the-universe\u002ffulltext | publisher = Communications of the ACM |\u003cbr\u003e+* [[Quantum algorithm]]s provide speedup over conventional algorithms only for some tasks, and matching these tasks with practical applications proved challenging. Some promising tasks and applications require resources far beyond those available today.\u003cref\u003e{{Cite web| url = https:\u002f\u002fm-cacm.acm.org\u002fmagazines\u002f2022\u002f12\u002f266916-quantum-computers-and-the-universe\u002ffulltext | publisher = Communications of the ACM |\u003cbr\u003e title = Quantum Computers and the Universe | first = Don | last = Monroe | date = December 2022}}\u003cbr\u003e \u003c\u002fref\u003e\u003cref\u003e{{Cite web| url = https:\u002f\u002fthequantuminsider.com\u002f2023\u002f06\u002f20\u002fpsiquantum-sees-700x-reduction-in-computational-resource-requirements-to-break-elliptic-curve-cryptography-with-a-fault-tolerant-quantum-computer\u002f | website = The Quanrum Insider | title = PsiQuantum Sees 700x Reduction in Computational Resource Requirements to Break Elliptic Curve Cryptography With a Fault Tolerant Quantum Computer| first = Matt | last = Swayne | date = June 20, 2023 }}\u003cbr\u003e \u003c\u002fref\u003e In particular, processing large amounts of non-quantum data is a challenge for quantum computers.\u003cref name=CACM\u002f\u003e\u003cbr\u003e * Some promising algorithms have been \"dequantized\", i.e., their non-quantum analogues with similar complexity have been found.\u003cbr\u003e * If [[quantum error correction]] is used to scale quantum computers to practical applications, its overhead may undermine speedup offered by many quantum algorithms.\u003cref name=CACM\u002f\u003e\u003cbr\u003e-* Complexity analysis of algorithms sometimes makes abstract assumptions that do not hold in applications. For example, input data may not already be available encoded in quantum states, and \"oracle functions\" used in Grover's algorithm often have internal structure that can be exploited for faster algorithms.\u003cbr\u003e-\u003cbr\u003e-In particular, building computers with large numbers of qubits may be futile if those qubits are not connected well enough and cannot maintain sufficiently high degree of entanglement for a long time. When trying to outperform conventional computers, quantum computing researchers often look for new tasks that can be solved on quantum computers, but this leaves the possibility that efficient non-quantum techniques will be developed in response, as seen for Quantum supremacy demonstrations. Therefore, it is desirable to prove lower bounds on the complexity of best possible non-quantum algorithms (which may be unknown) and show that some quantum algorithms asymptomatically improve upon those bounds.\u003cbr\u003e+* Complexity analysis of algorithms sometimes makes abstract assumptions that do not hold in applications. For example, input data may not already be available encoded in quantum states, and \"oracle functions\" used in [[Grover's algorithm]] often have internal structure that can be exploited for faster algorithms.\u003cbr\u003e+\u003cbr\u003e+In particular, building computers with large numbers of qubits may be futile if those qubits are not connected well enough and cannot maintain sufficiently high degree of entanglement for long time. When trying to outperform conventional computers, quantum computing researchers often look for new tasks that can be solved on quantum computers, but this leaves the possibility that efficient non-quantum techniques will be developed in response, as seen for [[Quantum supremacy]] demonstrations. Therefore, it is desirable to prove lower bounds on the complexity of best possible non-quantum algorithms (which may be unknown) and show that some quantum algorithms asymptomatically improve upon those bounds.\u003cbr\u003e \u003cbr\u003e Some researchers have expressed skepticism that scalable quantum computers could ever be built, typically because of the issue of maintaining coherence at large scales, but also for other reasons.\u003cbr\u003e \u003cbr\u003e [[Bill Unruh]] doubted the practicality of quantum computers in a paper published in 1994.\u003cref\u003e{{Cite journal |last1=Unruh |first1=Bill |title=Maintaining coherence in Quantum Computers |journal=Physical Review A |volume=51 |issue=2 |pages=992\u2013997 |arxiv=hep-th\u002f9406058 |bibcode=1995PhRvA..51..992U |year=1995 |doi=10.1103\u002fPhysRevA.51.992 |pmid=9911677 |s2cid=13980886}}\u003c\u002fref\u003e [[Paul Davies]] argued that a 400-qubit computer would even come into conflict with the cosmological information bound implied by the [[holographic principle]].\u003cref\u003e{{cite arXiv|last1=Davies|first1=Paul|date=6 March 2007 |title=The implications of a holographic universe for quantum information science and the nature of physical law |eprint=quant-ph\u002f0703041}}\u003c\u002fref\u003e Skeptics like [[Gil Kalai]] doubt that quantum supremacy will ever be achieved.\u003cref\u003e{{cite web |author=Regan |first=K. W. |date=23 April 2016 |title=Quantum Supremacy and Complexity |url=https:\u002f\u002frjlipton.wordpress.com\u002f2016\u002f04\u002f22\u002fquantum-supremacy-and-complexity\u002f |website=G\u00f6del's Lost Letter and P=NP}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Kalai |first1=Gil |date=May 2016 |title=The Quantum Computer Puzzle |journal=Notices of the AMS |volume=63 |number=5 |pages=508\u2013516 |url=https:\u002f\u002fwww.ams.org\u002fjournals\u002fnotices\u002f201605\u002frnoti-p508.pdf}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last1=Rinott |first1=Yosef |last2=Shoham |first2=Tomer |last3=Kalai |first3=Gil |date=2021-07-13 |title=Statistical Aspects of the Quantum Supremacy Demonstration |class=quant-ph |eprint=2008.05177}}\u003c\u002fref\u003e Physicist [[Mikhail Dyakonov]] has expressed skepticism of quantum computing as follows:\u003cbr\u003e-:\"So the number of continuous parameters describing the state of such a useful quantum computer at any given moment must be... about 10\u003csup\u003e300\u003c\u002fsup\u003e... Could we ever learn to control the more than 10\u003csup\u003e300\u003c\u002fsup\u003e continuously variable parameters defining the quantum state of such a system? My answer is simple. ''No, never.''\"\u003cref\u003e{{cite web |last1=Dyakonov |first1=Mikhail |title=The Case Against Quantum Computing |url=https:\u002f\u002fspectrum.ieee.org\u002fthe-case-against-quantum-computing |website=IEEE Spectrum |date=15 November 2018 |access-date=3 December 2019}}\u003c\u002fref\u003e\u003cbr\u003e+:\"So the number of continuous parameters describing the state of such a useful quantum computer at any given moment must be... about 10\u003csup\u003e300\u003c\u002fsup\u003e... Could we ever learn to control the more than 10\u003csup\u003e300\u003c\u002fsup\u003e continuously variable parameters defining the quantum state of such a system? My answer is simple. ''No, never.''\"\u003cref\u003e{{cite web |last1=Dyakonov |first1=Mikhail |title=The Case Against Quantum Computing |url=https:\u002f\u002fspectrum.ieee.org\u002fthe-case-against-quantum-computing |website=IEEE Spectrum |date=15 November 2018 |access-date=3 December 2019}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Dyakonov |first1=Mikhail |title=Will We Ever Have a Quantum Computer? |date=24 March 2020 |url=https:\u002f\u002fwww.springer.com\u002fgp\u002fbook\u002f9783030420185 |publisher=Springer |isbn=9783030420185 |access-date=22 May 2020}}{{page needed|date=May 2020}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Physical realizations ===\u003cbr\u003e {{Further|List of proposed quantum registers}}\u003cbr\u003e \u003cbr\u003e-[[File:IBM Q system (Fraunhofer 2).jpg|thumb|upright=1.2|[[IBM Q System One|Quantum System One]], a quantum computer by [[IBM]] from 2019 with 20 superconducting qubits\u003cref\u003e{{Cite news |last=Russell |first=John |date=January 10, 2019 |title=IBM Quantum Update: Q System One Launch, New Collaborators, and QC Center Plans |language=en-US |website=HPCwire |url=https:\u002f\u002fwww.hpcwire.com\u002f2019\u002f01\u002f10\u002fibm-quantum-update-q-system-one-launch-new-collaborators-and-qc-center-plans\u002f |access-date=2023-01-09}}\u003c\u002fref\u003e]]\u003cbr\u003e-\u003cbr\u003e-A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}} \u003cbr\u003e-For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last1=Nayak |first1=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083|arxiv=0707.1889 |bibcode=2008RvMP...80.1083N }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However, the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover, the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e-\u003cbr\u003e-The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e+[[File:IBM Q system (Fraunhofer 2).jpg|thumb|upright=1.2|[[IBM Q System One|Quantum System One]], a quantum computer by [[IBM]] from 2019 with 20 [[Superconducting quantum computing|superconducting qubits]]\u003cref\u003e{{Cite news |last=Russell |first=John |date=January 10, 2019 |title=IBM Quantum Update: Q System One Launch, New Collaborators, and QC Center Plans |language=en-US |website=HPCwire |url=https:\u002f\u002fwww.hpcwire.com\u002f2019\u002f01\u002f10\u002fibm-quantum-update-q-system-one-launch-new-collaborators-and-qc-center-plans\u002f |access-date=2023-01-09}}\u003c\u002fref\u003e]]\u003cbr\u003e+\u003cbr\u003e+A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}}\u003cbr\u003e+\u003cbr\u003e+The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e+\u003cbr\u003e+The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e+\u003cbr\u003e+Research efforts to create stabler qubits for quantum computing include [[topological quantum computer]] approaches. For example, [[Microsoft Azure Quantum| Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]].\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Potential applications ==\u003cbr\u003e \u003cbr\u003e-With focus on business management's point of view, the potential applications of quantum computing into four major categories are cybersecurity, data analytics and artificial intelligence, optimization and simulation, and data management and searching.\u003cref\u003e{{cite web |last1=Leong |first1=Kelvin |last2=Sung |first2=Anna |date= November 2022 |title= What Business Managers Should Know About Quantum Computing? |url=http:\u002f\u002fjournalofinterdisciplinarysciences.com\u002fwp-content\u002fuploads\u002f2022\u002f10\u002f3-What-Business-Managers-Should-Know-About-Quantum-Computing.pdf |access-date=13 August 2023 |website=[[Journal of Interdisciplinary Sciences]] |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e+With focus on business management\u2019s point of view, the potential applications of quantum computing into four major categories are cybersecurity, data analytics and artificial intelligence, optimization and simulation, and data management and searching.\u003cref\u003e{{cite web |last1=Leong |first1=Kelvin |last2=Sung |first2=Anna |date= November 2022 |title= What Business Managers Should Know About Quantum Computing? |url=http:\u002f\u002fjournalofinterdisciplinarysciences.com\u002fwp-content\u002fuploads\u002f2022\u002f10\u002f3-What-Business-Managers-Should-Know-About-Quantum-Computing.pdf |access-date=13 August 2023 |website=[[Journal of Interdisciplinary Sciences]] |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Investment in quantum computing research has increased in the public and private sectors.\u003cref\u003e{{cite journal |last1=Gibney |first1=Elizabeth |title=Quantum gold rush: the private funding pouring into quantum start-ups |journal=Nature |date=2 October 2019 |volume=574 |issue=7776 |pages=22\u201324 |doi=10.1038\u002fd41586-019-02935-4 |doi-access= |pmid=31578480 |bibcode=2019Natur.574...22G|s2cid=203626236 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |last=Rodrigo |first=Chris Mills |date=12 February 2020 |title=Trump budget proposal boosts funding for artificial intelligence, quantum computing |language=en-US |work=The Hill |url=https:\u002f\u002fthehill.com\u002fpolicy\u002ftechnology\u002f482402-trump-budget-proposal-boosts-funding-for-artificial-intelligence-quantum |access-date=July 11, 2021}}\u003c\u002fref\u003e\u003cbr\u003e As one consulting firm summarized,\u003cref\u003e{{cite web |last1=Biondi |first1=Matteo |last2=Heid |first2=Anna |last3=Henke |first3=Nicolaus |last4=Mohr |first4=Niko |last5=Pautasso |first5=Lorenzo |last6=Ostojic |first6=Ivan |last7=Wester |first7=Linde |last8=Zemmel |first8=Rodney |display-authors=5 |date=14 December 2021 |title=Quantum computing use cases are getting real\u2014what you need to know |url=https:\u002f\u002fwww.mckinsey.com\u002fbusiness-functions\u002fmckinsey-digital\u002four-insights\u002fquantum-computing-use-cases-are-getting-real-what-you-need-to-know |access-date=1 April 2022 |website=[[McKinsey & Company]] |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e {{blockquote|...{{nbsp}}investment dollars are pouring in, and quantum-computing start-ups are proliferating.{{nbsp}}... While quantum computing promises to help businesses solve problems that are beyond the reach and speed of conventional [[high-performance computers]], use cases are largely experimental and hypothetical at this early stage.}}\u003cbr\u003e-\u003cbr\u003e == Theory\u003cspan class=\"anchor\" id=\"Relation to computability and complexity theory\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e \u003cbr\u003e === Computability\u003cspan class=\"anchor\" id=\"Computability theory\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e@@ -313,11 +319,11 @@\u003cbr\u003e While quantum computers cannot solve any problems that classical computers cannot already solve, it is suspected that they can solve certain problems faster than classical computers. For instance, it is known that quantum computers can efficiently [[integer factorization|factor integers]], while this is not believed to be the case for classical computers.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic definition of BQP --\u003e\u003cbr\u003e-The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time quantum Turing machine with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (
