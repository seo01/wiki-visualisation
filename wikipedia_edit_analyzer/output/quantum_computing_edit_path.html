]] University successfully created \"quantum circuits\" that correct errors more efficiently than alternative methods, which may potentially remove a major obstacle to practical quantum computers.\u003cref\u003e{{Cite journal |last1=Bluvstein |first1=Dolev |last2=Evered |first2=Simon J. |last3=Geim |first3=Alexandra A. |last4=Li |first4=Sophie H. |last5=Zhou |first5=Hengyun |last6=Manovitz |first6=Tom |last7=Ebadi |first7=Sepehr |last8=Cain |first8=Madelyn |last9=Kalinowski |first9=Marcin |last10=Hangleiter |first10=Dominik |last11=Ataides |first11=J. Pablo Bonilla |last12=Maskara |first12=Nishad |last13=Cong |first13=Iris |last14=Gao |first14=Xun |last15=Rodriguez |first15=Pedro Sales |date=2023-12-06 |title=Logical quantum processor based on reconfigurable atom arrays |journal=Nature |volume=626 |issue=7997 |language=en |pages=58\u201365 |doi=10.1038\u002fs41586-023-06927-3 |pmid=38056497 |pmc=10830422 |issn=1476-4687|arxiv=2312.03982 |s2cid=266052773 }}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Freedberg Jr. |first=Sydney J. |date=2023-12-07 |title='Off to the races': DARPA, Harvard breakthrough brings quantum computing years closer |url=https:\u002f\u002fbreakingdefense.sites.breakingmedia.com\u002f2023\u002f12\u002foff-to-the-races-darpa-harvard-breakthrough-brings-quantum-computing-years-closer\u002f |access-date=2023-12-09 |website=Breaking Defense |language=en-US}}\u003c\u002fref\u003e The Harvard research team was supported by [[Massachusetts Institute of Technology|MIT]], [[QuEra Computing]], [[California Institute of Technology|Caltech]], and [[Princeton University|Princeton]] University and funded by [[DARPA]]'s Optimization with Noisy Intermediate-Scale Quantum devices (ONISQ) program.\u003cref\u003e{{Cite web |date=December 6, 2023 |title=DARPA-Funded Research Leads to Quantum Computing Breakthrough |url=https:\u002f\u002fwww.darpa.mil\u002fnews-events\u002f2023-12-06 |access-date=January 5, 2024 |website=darpa.mil}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Choudhury |first=Rizwan |date=2023-12-30 |title=Top 7 innovation stories of 2023 \u2013 Interesting Engineering |url=https:\u002f\u002finterestingengineering.com\u002flists\u002ftop-7-innovation-stories-of-2023-interesting-engineering |access-date=2024-01-06 |website=interestingengineering.com |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Quantum cryptography and cybersecurity ===\u003cbr\u003e-[[Image:Laser optique.jpg|thumb|right|Example of a quantum cryptosystem layout]]\u003cbr\u003e \u003cbr\u003e Quantum computing has significant potential applications in the fields of cryptography and cybersecurity. Quantum cryptography, which relies on the principles of quantum mechanics, offers the possibility of secure communication channels that are resistant to eavesdropping. Quantum key distribution (QKD) protocols, such as BB84, enable the secure exchange of cryptographic keys between parties, ensuring the confidentiality and integrity of communication. Moreover, quantum random number generators (QRNGs) can produce high-quality random numbers, which are essential for secure encryption.\u003cbr\u003e ","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -135,6 +135,8 @@\u003cbr\u003e However, quantum computing also poses challenges to traditional cryptographic systems. Shor's algorithm, a quantum algorithm for integer factorization, could potentially break widely used public-key cryptography schemes like RSA, which rely on the difficulty of factoring large numbers. Post-quantum cryptography, which involves the development of cryptographic algorithms that are resistant to attacks by both classical and quantum computers, is an active area of research aimed at addressing this concern.\u003cbr\u003e \u003cbr\u003e Ongoing research in quantum cryptography and post-quantum cryptography is crucial for ensuring the security of communication and data in the face of evolving quantum computing capabilities. Advances in these fields, such as the development of new QKD protocols, the improvement of QRNGs, and the standardization of post-quantum cryptographic algorithms, will play a key role in maintaining the integrity and confidentiality of information in the quantum era.\u003cref\u003e{{cite journal |last1=Pirandola |first1=S. |last2=Andersen |first2=U. L. |last3=Banchi |first3=L. |last4=Berta |first4=M. |last5=Bunandar |first5=D. |last6=Colbeck |first6=R. |last7=Englund |first7=D. |last8=Gehring |first8=T. |last9=Lupo |first9=C. |last10=Ottaviani |first10=C. |last11=Pereira |first11=J. |last12=Razavi |first12=M. |last13=Shamsul Shaari |first13=J. |last14=Tomamichel |first14=M. |last15=Usenko |first15=V. C. |year=2020 |title=Advances in quantum cryptography |journal=Advances in Optics and Photonics |volume=12 |issue=4 |pages=1012\u20131236 |doi=10.1364\u002fAOP.361502 |last16=Vallone |first16=G. |last17=Villoresi |first17=P. |last18=Wallden |first18=P.|arxiv=1906.01645 |bibcode=2020AdOP...12.1012P }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In 2023, researchers at Google Quantum AI announced a significant breakthrough in quantum error correction, demonstrating improved logical qubit performance by reducing error rates as more physical qubits were added. This marks a step toward fault-tolerant quantum computing, addressing one of the major challenges in scaling quantum systems. The study, published in Nature, highlights how stabilizing logical qubits can bring quantum computing closer to practical applications. \u003cref\u003e{{cite journal |last1=Pirandola |first1=S. |last2=Andersen |first2=U. L. |last3=Banchi |first3=L. |last4=Berta |first4=M. |last5=Bunandar |first5=D. |last6=Colbeck |first6=R. |last7=Englund |first7=D. |last8=Gehring |first8=T. |last9=Lupo |first9=C. |last10=Ottaviani |first10=C. |last11=Pereira |first11=J. |last12=Razavi |first12=M. |last13=Shamsul Shaari |first13=J. |last14=Tomamichel |first14=M. |last15=Usenko |first15=V. C. |year=2020 |title=Advance a |first1=S. |last2=Andersen |first2=U. L. |last3=Banchi |first3=L. |last4=Berta |first4=M. |last5=Bunandar |first5=D. |last6=Colbeck |first6=R. |last7=Englund |first7=D. |last8=Gehring |first8=T. |last9=Lupo |first9=C. |last10=Ottaviani |first10=C. |last11=Pereira |first11=J. |last12=Razavi |first12=M. |last13=Shamsul Shaari |first13=J. |last14=Tomamichel |first14=M. |last15=Usenko |first15=V. C. |year=2020 |title=Advances in quantum cryptography |journal=Advances in Optics and Photonics |volume=12 |issue=4 |pages=1012\u20131236 |doi=10.1364\u002fAOP.361502 |last16=Vallone |first16=G. |last17=Villoresi |first17=P. |last18=Wallden |first18=P.|arxiv=1906.01645 |bibcode=2020AdOP...12.1012P }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In 2023, researchers at Google Quantum AI announced a significant breakthrough in quantum error correction, demonstrating improved logical qubit performance by reducing error rates as more physical qubits were added. This marks a step toward fault-tolerant quantum computing, addressing one of the major challenges in scaling quantum systems. The study, published in Nature, highlights how stabilizing logical qubits can bring quantum computing closer to practical applications. \u003cref\u003e{{cite journal |last1=Pirandola |first1=S. |last2=Andersen |first2=U. L. |last3=Banchi |first3=L. |last4=Berta |first4=M. |last5=Bunandar |first5=D. |last6=Colbeck |first6=R. |last7=Englund |first7=D. |last8=Gehring |first8=T. |last9=Lupo |first9=C. |last10=Ottaviani |first10=C. |last11=Pereira |first11=J. |last12=Razavi |first12=M. |last13=Shamsul Shaari |first13=J. |last14=Tomamichel |first14=M. |last15=Usenko |first15=V. C. |year=2020 |title=Advances in quantum cryptography |journal=Advances in Optics and Photonics |volume=12 |issue=4 |pages=1012\u20131236 |doi=10.1364\u002fAOP.361502 |last16=Vallone |first16=G. |last17=Villoresi |first17=P. |last18=Wallden |first18=P.|arxiv=1906.01645 |bibcode=2020AdOP...12.1012P }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Communication ==\u003cbr\u003e {{Further|Quantum information science}}","--- Revision 10\u003cbr\u003e+++ Revision 11\u003cbr\u003e@@ -114,7 +114,7 @@\u003cbr\u003e An [[Adiabatic quantum computation|adiabatic quantum computer]], based on [[quantum annealing]], decomposes computation into a slow continuous transformation of an initial [[Hamiltonian (quantum mechanics)|Hamiltonian]] into a final Hamiltonian, whose ground states contain the solution.\u003cref name=\"Das 2008 1061\u20131081\"\u003e{{cite journal|last1=Das|first1=A.|last2=Chakrabarti|first2=B. K.|year=2008|title=Quantum Annealing and Analog Quantum Computation|journal=[[Reviews of Modern Physics|Rev. Mod. Phys.]]|volume=80|issue=3|pages=1061\u20131081|arxiv=0801.2193|bibcode=2008RvMP...80.1061D|citeseerx=10.1.1.563.9990|doi=10.1103\u002fRevModPhys.80.1061|s2cid=14255125}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Neuromorphic quantum computing ====\u003cbr\u003e-Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional computing type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that quantum algorithms, which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and do not follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e+Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that quantum algorithms, which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and do not follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e \u003cbr\u003e ==== Topological quantum computing ====\u003cbr\u003e ","--- Revision 11\u003cbr\u003e+++ Revision 12\u003cbr\u003e@@ -399,6 +399,7 @@\u003cbr\u003e * [[Stanford Encyclopedia of Philosophy]]: \"[https:\u002f\u002fplato.stanford.edu\u002fentries\u002fqt-quantcomp\u002f Quantum Computing]\" by Amit Hagar and Michael E. Cuffaro.\u003cbr\u003e * {{springer|title=Quantum computation, theory of|id=p\u002fq130020}}\u003cbr\u003e * [https:\u002f\u002fquantum.country\u002fqcvc Quantum computing for the very curious] by Andy Matuschak and [[Michael Nielsen]]\u003cbr\u003e+* [https:\u002f\u002fquantumcomputingmadeeasy.com Quantum Computing Made Easy]\u003cbr\u003e * [https:\u002f\u002flink.springer.com\u002fbook\u002f10.1007\u002f978-3-031-64136-7 Quantum Software: Aspects of Theory and System Design]\u003cbr\u003e \u003cbr\u003e ;Lectures","--- Revision 12\u003cbr\u003e+++ Revision 13\u003cbr\u003e@@ -399,7 +399,6 @@\u003cbr\u003e * [[Stanford Encyclopedia of Philosophy]]: \"[https:\u002f\u002fplato.stanford.edu\u002fentries\u002fqt-quantcomp\u002f Quantum Computing]\" by Amit Hagar and Michael E. Cuffaro.\u003cbr\u003e * {{springer|title=Quantum computation, theory of|id=p\u002fq1 tps:\u002f\u002fwww.youtube.com\u002fplaylist?list=PL1826E60FD05B44E4 Quantum computing for the determined] \u2013 22 video lectures by [[Michael Nielsen]]","--- Revision 18\u003cbr\u003e+++ Revision 19\u003cbr\u003e@@ -402,7 +402,6 @@\u003cbr\u003e ;Lectures\u003cbr\u003e * [https:\u002f\u002fwww.youtube.com\u002fplaylist?list=PL1826E60FD05B44E4 Quantum computing for the determined] \u2013 22 video lectures by [[Michael Nielsen]]\u003cbr\u003e * [http:\u002f\u002fwww.quiprocone.org\u002fProtected\u002fDD_lectures.htm Video Lectures] by [[David Deutsch]]\u003cbr\u003e-* [https:\u002f\u002fweb.archive.org\u002fweb\u002f20130901004919\u002fhttp:\u002f\u002fnanohub.org\u002fresources\u002f4778 Online lecture on An Introduction to Quantum Computing, Edward Gerjuoy (2008)]\u003cbr\u003e * Lomonaco, Sam. [http:\u002f\u002fwww.csee.umbc.edu\u002f~lomonaco\u002fLectures.html#OxfordLectures Four Lectures on Quantum Computing given at Oxford University in July 2006]\u003cbr\u003e \u003cbr\u003e {{CPU technologies}}","--- Revision 19\u003cbr\u003e+++ Revision 20\u003cbr\u003e@@ -289,6 +289,8 @@\u003cbr\u003e The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e \u003cbr\u003e Research efforts to create stabler qubits for quantum computing include topological quantum computer approaches. For example, [[Microsoft Azure Quantum|Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]].\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+As part of this research, [[Microsoft Azure Quantum|Microsoft]] unveiled [[Majorana 1]] in February 2025, a quantum processor which leverages topological [[Superconductivity|superconductors]] with potential [[Majorana zero modes]]. Microsoft intends to use these modes to develop [[Topological qubit|topological qubits]], with the ultimate goal of scaling to a large-scale [[topological quantum computer]].\u003cref\u003e{{Cite web |last=Nayak |first=Chetan |date=2025-02-19 |title=Microsoft unveils Majorana 1, the world\u2019s first quantum processor powered by topological qubits |url=https:\u002f\u002fazure.microsoft.com\u002fen-us\u002fblog\u002fquantum\u002f2025\u002f02\u002f19\u002fmicrosoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits\u002f |access-date=2025-02-20 |website=Microsoft Azure Quantum Blog |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Potential applications ==\u003cbr\u003e ","--- Revision 20\u003cbr\u003e+++ Revision 21\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}","--- Revision 21\u003cbr\u003e+++ Revision 22\u003cbr\u003e@@ -148,16 +148,14 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-=== Simulation of quantum systems ===\u003cbr\u003e-{{Main|Quantum simulation}}\u003cbr\u003e-\u003cbr\u003e-Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -165,34 +163,6 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e-\u003cbr\u003e-Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e-\u003cbr\u003e-=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-{{Main|Grover's algorithm}}\u003cbr\u003e-\u003cbr\u003e-The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e-#There is no searchable structure in the collection of possible answers,\u003cbr\u003e-#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e-#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e-\u003cbr\u003e-For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-\u003cbr\u003e-[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Machine learning ===\u003cbr\u003e-{{Main|Quantum machine learning}}\u003cbr\u003e-\u003cbr\u003e-Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e-Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -148,14 +148,16 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+=== Simulation of quantum systems ===\u003cbr\u003e+{{Main|Quantum simulation}}\u003cbr\u003e+\u003cbr\u003e+Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -163,6 +165,34 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e+\u003cbr\u003e+Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e+\u003cbr\u003e+=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+{{Main|Grover's algorithm}}\u003cbr\u003e+\u003cbr\u003e+The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e+#There is no searchable structure in the collection of possible answers,\u003cbr\u003e+#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e+#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e+\u003cbr\u003e+For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+\u003cbr\u003e+[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Machine learning ===\u003cbr\u003e+{{Main|Quantum machine learning}}\u003cbr\u003e+\u003cbr\u003e+Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e+Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -13,26 +13,6 @@\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e-\u003cbr\u003e-== History ==\u003cbr\u003e-{{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e-\u003cbr\u003e-For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e-When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |author-link=Yuri Manin |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |author-link=Richard Feynman |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e-In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[Quantum algorithm]]s then emerged for solving [[oracle machine|oracle problems]], such as [[Deutsch's algorithm]] in 1985,\u003cref\u003e{{Cite journal |date=1985-07-08 |title=Quantum theory, the Church\u2013Turing principle and the universal quantum computer |journal=Proceedings of the Royal Society of London. A. Mathematical and Physical Sciences |language=en |volume=400 |issue=1818 |pages=97\u2013117 |doi=10.1098\u002frspa.1985.0070 |bibcode=1985RSPSA.400...97D |s2cid=1438116 |issn=0080-4630|last1=Deutsch |first1=D. }}\u003c\u002fref\u003e the [[Bernstein{{en dash}}Vazirani algorithm]] in 1993,\u003cref\u003e{{Cite book |last1=Bernstein |first1=Ethan |title=Proceedings of the twenty-fifth annual ACM symposium on Theory of computing \u2013 STOC '93 |last2=Vazirani |first2=Umesh |date=1993 |publisher=ACM Press |isbn=978-0-89791-591-5 |location=San Diego, California, United States |pages=11\u201320 |language=en |chapter=Quantum complexity theory |doi=10.1145\u002f167088.167097 |chapter-url=http:\u002f\u002fportal.acm.org\u002fcitation.cfm?doid=167088.167097 |s2cid=676378}}\u003c\u002fref\u003e and [[Simon's algorithm]] in 1994.\u003cref\u003e{{Cite book |last=Simon |first=D. R. |title=Proceedings 35th Annual Symposium on Foundations of Computer Science |chapter=On the power of quantum computation |date=1994 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\
