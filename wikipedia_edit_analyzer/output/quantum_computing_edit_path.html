\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e+Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -148,16 +148,14 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-=== Simulation of quantum systems ===\u003cbr\u003e-{{Main|Quantum simulation}}\u003cbr\u003e-\u003cbr\u003e-Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -165,34 +163,6 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e-\u003cbr\u003e-Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e-\u003cbr\u003e-=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-{{Main|Grover's algorithm}}\u003cbr\u003e-\u003cbr\u003e-The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e-#There is no searchable structure in the collection of possible answers,\u003cbr\u003e-#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e-#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e-\u003cbr\u003e-For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-\u003cbr\u003e-[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Machine learning ===\u003cbr\u003e-{{Main|Quantum machine learning}}\u003cbr\u003e-\u003cbr\u003e-Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e-Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -148,14 +148,16 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+=== Simulation of quantum systems ===\u003cbr\u003e+{{Main|Quantum simulation}}\u003cbr\u003e+\u003cbr\u003e+Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -163,6 +165,34 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e+\u003cbr\u003e+Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e+\u003cbr\u003e+=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+{{Main|Grover's algorithm}}\u003cbr\u003e+\u003cbr\u003e+The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e+#There is no searchable structure in the collection of possible answers,\u003cbr\u003e+#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e+#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e+\u003cbr\u003e+For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+\u003cbr\u003e+[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Machine learning ===\u003cbr\u003e+{{Main|Quantum machine learning}}\u003cbr\u003e+\u003cbr\u003e+Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e+Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 29\u003cbr\u003e+++ Revision 30\u003cbr\u003e@@ -289,8 +289,6 @@\u003cbr\u003e The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e \u003cbr\u003e Research efforts to create stabler qubits for quantum computing include topological quantum computer approaches. For example, [[Microsoft Azure Quantum|Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]].\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-As part of this research, [[Microsoft Azure Quantum|Microsoft]] unveiled [[Majorana 1]] in February 2025, a quantum processor which leverages topological [[Superconductivity|superconductors]] with potential [[Majorana zero modes]]. Microsoft intends to use these modes to develop [[Topological qubit|topological qubits]], with the ultimate goal of scaling to a large-scale [[topological quantum computer]].\u003cref\u003e{{Cite web |last=Nayak |first=Chetan |date=2025-02-19 |title=Microsoft unveils Majorana 1, the world\u2019s first quantum processor powered by topological qubits |url=https:\u002f\u002fazure.microsoft.com\u002fen-us\u002fblog\u002fquantum\u002f2025\u002f02\u002f19\u002fmicrosoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits\u002f |access-date=2025-02-20 |website=Microsoft Azure Quantum Blog |language=en-US}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Potential applications ==\u003cbr\u003e ","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -9,10 +9,10 @@\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e\u003cbr\u003e-Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e+Quantum computers are not yet practical for real-world applications. Physically engineering high-quality qubits is proven to be challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research aimed at developing  scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e-In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e+In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems that are unsolvable by a classical computer in any reasonable amount of time. This concept of additional ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e \u003cbr\u003e == History ==\u003cbr\u003e {{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e@@ -150,7 +150,7 @@\u003cbr\u003e \u003cbr\u003e Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e-Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e+Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] ,have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e \u003cbr\u003e@@ -213,7 +213,7 @@\u003cbr\u003e \u003cbr\u003e ==== Decoherence\u003cspan class=\"anchor\" id=\"Quantum decoherence\"\u003e\u003c\u002fspan\u003e ====\u003cbr\u003e \u003cbr\u003e-One of the greatest challenges involved with constructing quantum computers is controlling or removing quantum decoherence. This usually means isolating the system from its environment as interactions with the external world cause the system to decohere. However, other sources of decoherence also exist. Examples include the quantum gates, and the lattice vibrations and background thermonuclear spin of the physical system used to implement the qubits. Decoherence is irreversible, as it is effectively non-unitary, and is usually something that should be highly controlled, if not avoided. Decoherence times for candidate systems in particular, the transverse relaxation time ''T''\u003csub\u003e2\u003c\u002fsub\u003e (for [[Nuclear magnetic resonance|NMR]] and [[MRI]] technology, also called the ''dephasing time''), typically range between nanoseconds and seconds at low temperature.\u003cref name=\"DiVincenzo 1995\"\u003e{{cite journal |last=DiVincenzo |first=David P. |title=Quantum Computation |journal=Science |year=1995 |volume=270 |issue=5234 |pages=255\u2013261 |doi=10.1126\u002fscience.270.5234.255 |bibcode=1995Sci...270..255D |citeseerx=10.1.1.242.2165 |s2cid=220110562}}\u003c\u002fref\u003e Currently, some quantum computers require their qubits to be cooled to 20 millikelvin (usually using a [[dilution refrigerator]]\u003cref\u003e{{Cite journal |doi=10.1016\u002fj.cryogenics.2021.103390| issn=0011-2275 |title=Development of Dilution refrigerators \u2013 A review |journal=Cryogenics| volume=121| year=2022| last1=Zu| first1=H.| last2=Dai| first2=W.| last3=de Waele| first3=A.T.A.M.| s2cid=244005391}}\u003c\u002fref\u003e) in order to prevent significant decoherence.\u003cref\u003e{{cite journal |last1=Jones |first1=Nicola |title=Computing: The quantum company |journal=Nature |date=19 June 2013 |volume=498 |issue=7454 |pages=286\u2013288 |doi=10.1038\u002f498286a|pmid=23783610|bibcode=2013Natur.498..286J|doi-access=free}}\u003c\u002fref\u003e A 2020 study argues that [[ionizing radiation]] such as [[cosmic rays]] can nevertheless cause certain systems to decohere within milliseconds.\u003cref\u003e{{cite journal |last1=Veps\u00e4l\u00e4inen |first1=Antti P. |last2=Karamlou |first2=Amir H. |last3=Orrell |first3=John L. |last4=Dogra |first4=Akshunna S. |last5=Loer |first5=Ben |last6=Vasconcelos |first6=Francisca |last7=Kim |first7=David K. |last8=Melville |first8=Alexander J. |last9=Niedzielski |first9=Bethany M. |last10=Yoder |first10=Jonilyn L. |last11=Gustavsson |first11=Simon |last12=Formaggio |first12=Joseph A. |last13=VanDevender |first13=Brent A. |last14=Oliver |first14=William D. |display-authors=5 |title=Impact of ionizing radiation on superconducting qubit coherence |journal=Nature |date=August 2020 |volume=584 |issue=7822 |pages=551\u2013556 |doi=10.1038\u002fs41586-020-2619-8 |pmid=32848227 |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-020-2619-8 |language=en |issn=1476-4687|arxiv=2001.09190 |bibcode=2020Natur.584..551V |s2cid=210920566 }}\u003c\u002fref\u003e\u003cbr\u003e+One of the greatest challenges involved in constructing quantum computers is controlling or removing quantum decoherence. This usually means isolating the system from its environment as interactions with the external world cause the system to decohere. However, other sources of decoherence also exist. Examples include the quantum gates and the lattice vibrations and background thermonuclear spin of the physical system used to implement the qubits. Decoherence is irreversible, as it is effectively non-unitary, and is usually something that should be highly controlled, if not avoided. Decoherence times for candidate systems in particular, the transverse relaxation time ''T''\u003csub\u003e2\u003c\u002fsub\u003e (for [[Nuclear magnetic resonance|NMR]] and [[MRI]] technology, also called the ''dephasing time''), typically range between nanoseconds and seconds at low temperatures.\u003cref name=\"DiVincenzo 1995\"\u003e{{cite journal |last=DiVincenzo |first=David P. |title=Quantum Computation |journal=Science |year=1995 |volume=270 |issue=5234 |pages=255\u2013261 |doi=10.1126\u002fscience.270.5234.255 |bibcode=1995Sci...270..255D |citeseerx=10.1.1.242.2165 |s2cid=220110562}}\u003c\u002fref\u003e Currently, some quantum computers require their qubits to be cooled to 20 millikelvin (usually using a [[dilution refrigerator]]\u003cref\u003e{{Cite journal |doi=10.1016\u002fj.cryogenics.2021.103390| issn=0011-2275 |title=Development of Dilution refrigerators \u2013 A review |journal=Cryogenics| volume=121| year=2022| last1=Zu| first1=H.| last2=Dai| first2=W.| last3=de Waele| first3=A.T.A.M.| s2cid=244005391}}\u003c\u002fref\u003e) in order to prevent significant decoherence.\u003cref\u003e{{cite journal |last1=Jones |first1=Nicola |title=Computing: The quantum company |journal=Nature |date=19 June 2013 |volume=498 |issue=7454 |pages=286\u2013288 |doi=10.1038\u002f498286a|pmid=23783610|bibcode=2013Natur.498..286J|doi-access=free}}\u003c\u002fref\u003e A 2020 study argues that [[ionizing radiation]] such as [[cosmic rays]] can nevertheless cause certain systems to decohere within milliseconds.\u003cref\u003e{{cite journal |last1=Veps\u00e4l\u00e4inen |first1=Antti P. |last2=Karamlou |first2=Amir H. |last3=Orrell |first3=John L. |last4=Dogra |first4=Akshunna S. |last5=Loer |first5=Ben |last6=Vasconcelos |first6=Francisca |last7=Kim |first7=David K. |last8=Melville |first8=Alexander J. |last9=Niedzielski |first9=Bethany M. |last10=Yoder |first10=Jonilyn L. |last11=Gustavsson |first11=Simon |last12=Formaggio |first12=Joseph A. |last13=VanDevender |first13=Brent A. |last14=Oliver |first14=William D. |display-authors=5 |title=Impact of ionizing radiation on superconducting qubit coherence |journal=Nature |date=August 2020 |volume=584 |issue=7822 |pages=551\u2013556 |doi=10.1038\u002fs41586-020-2619-8 |pmid=32848227 |url=https:\u002f\u002fwww.nature.com\u002farticles\u002fs41586-020-2619-8 |language=en |issn=1476-4687|arxiv=2001.09190 |bibcode=2020Natur.584..551V |s2cid=210920566 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e As a result, time-consuming tasks may render some quantum algorithms inoperable, as attempting to maintain the state of qubits for a long enough duration will eventually corrupt the superpositions.\u003cref\u003e{{cite arXiv |last1=Amy |first1=Matthew |last2=Matteo |first2=Olivia |last3=Gheorghiu |first3=Vlad |last4=Mosca |first4=Michele |last5=Parent |first5=Alex |last6=Schanck |first6=John |title=Estimating the cost of generic quantum pre-image attacks on SHA-2 and SHA-3 |date=30 November 2016 |eprint=1603.09383 |class=quant-ph}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -288,7 +288,7 @@\u003cbr\u003e \u003cbr\u003e The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e \u003cbr\u003e-Research efforts to create stabler qubits for quantum computing include topological quantum computer approaches. For example, [[Microsoft Azure Quantum|Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]].\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e+Research efforts to create stabler qubits for quantum computing include [[topological quantum computer]] approaches. For example, [[Microsoft Azure Quantum|Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]], developing the first quantum processing unit based on a topological core ([[Majorana 1]]) in 2025.\u003cref name=\"Forbes Majorana\"\u003e{{Cite web |title=Massive Microsoft Quantum Computer Breakthrough Uses New State Of Matter |url=https:\u002f\u002fwww.forbes.com\u002fsites\u002fjohnkoetsier\u002f2025\u002f02\u002f19\u002fmassive-microsoft-quantum-computer-breakthrough-uses-new-state-of-matter\u002f |date=19 Feb 2025 |last1=Koetsier |first1=John |access-date=2025-02-19 |website=Forbes |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Potential applications ==\u003cbr\u003e ","--- Revision 32\u003cbr\u003e+++ Revision 33\u003cbr\u003e@@ -282,13 +282,14 @@\u003cbr\u003e \u003cbr\u003e [[File:IBM Q system (Fraunhofer 2).jpg|thumb|upright=1.2|[[IBM Q System One|Quantum System One]], a quantum computer by [[IBM]] from 2019 with 20 superconducting qubits\u003cref\u003e{{Cite news |last=Russell |first=John |date=January 10, 2019 |title=IBM Quantum Update: Q System One Launch, New Collaborators, and QC Center Plans |language=en-US |website=HPCwire |url=https:\u002f\u002fwww.hpcwire.com\u002f2019\u002f01\u002f10\u002fibm-quantum-update-q-system-one-launch-new-collaborators-and-qc-center-plans\u002f |access-date=2023-01-09}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e-A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}}\u003cbr\u003e+A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspec
