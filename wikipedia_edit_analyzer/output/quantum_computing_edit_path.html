ecember 2023, physicists, for the first time, reported the entanglement of individual molecules, which may have significant applications in quantum computing.\u003cref name=\"PHYS-20231207\"\u003e{{cite news |author=Staff |title=Physicists 'entangle' individual molecules for the first time, hastening possibilities for quantum computing |url=https:\u002f\u002fphys.org\u002fnews\u002f2023-12-physicists-entangle-individual-molecules-hastening.html |date=7 December 2023 |work=[[Phys.org]] |url-status=live |archiveurl=https:\u002f\u002farchive.today\u002f20231208152543\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2023-12-physicists-entangle-individual-molecules-hastening.html |archivedate=8 December 2023 |accessdate=8 December 2023 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Quantum information processing ==\u003cbr\u003e {{See also|Introduction to quantum mechanics}}","--- Revision 65\u003cbr\u003e+++ Revision 66\u003cbr\u003e@@ -6,7 +6,7 @@\u003cbr\u003e A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e-The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, which loosely means that it is in both states simultaneously. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e+The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e\u003cbr\u003e Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -388,7 +388,6 @@\u003cbr\u003e *{{cite book |last=Berthiaume |first=Andre |title=Solution Manual for Quantum Mechanics |date=1 December 1998 |chapter=Quantum Computation |s2cid=128255429 |doi=10.1142\u002f9789814541893_0016 |via=Semantic Scholar|pages=233\u2013234 |isbn=978-981-4541-88-6 }}\u003cbr\u003e *{{Cite journal |last1=DiVincenzo |first1=David P. |author1-link=David DiVincenzo |title=The Physical Implementation of Quantum Computation|journal=Fortschritte der Physik |volume=48|issue=9\u201311|pages=771\u2013783|year=2000 |doi=10.1002\u002f1521-3978(200009)48:9\u002f11\u003c771::AID-PROP771\u003e3.0.CO;2-E |arxiv=quant-ph\u002f0002077 |bibcode=2000ForPh..48..771D |s2cid=15439711 }}\u003cbr\u003e *{{cite journal |last=DiVincenzo |first=David P. |title=Quantum Computation |journal=Science |year=1995 |volume=270 |issue=5234 |pages=255\u2013261 |doi= 10.1126\u002fscience.270.5234.255 |bibcode = 1995Sci...270..255D |citeseerx=10.1.1.242.2165 |s2cid=220110562 }} Table 1 lists switching and dephasing times for various systems.\u003cbr\u003e-*{{cite journal |last=Feynman |first=Richard |author-link=Richard Feynman |title=Simulating physics with computers |journal=International Journal of Theoretical Physics |volume=21 |issue=6\u20137 |pages=467\u2013488 |year=1982 |doi=10.1007\u002fBF02650179 |bibcode=1982IJTP...21..467F |citeseerx=10.1.1.45.9310 |s2cid=124545445 }}\u003cbr\u003e *{{cite journal |last=Jeutner |first=Valentin |title=The Quantum Imperative: Addressing the Legal Dimension of Quantum Computers |journal=Morals & Machines |volume=1 |pages=52\u201359 |year=2021 |doi=10.5771\u002f2747-5174-2021-1-52 |issue=1 |s2cid=236664155 |url=https:\u002f\u002flup.lub.lu.se\u002frecord\u002fe034e7b7-d17c-4863-9cee-7e654f97225b |doi-access=free }}\u003cbr\u003e *{{Cite journal |last1=Krantz |first1=P. |last2=Kjaergaard |first2=M. |last3=Yan |first3=F. |last4=Orlando |first4=T. P. |last5=Gustavsson |first5=S. |last6=Oliver |first6=W. D. |date=2019-06-17 |title=A Quantum Engineer's Guide to Superconducting Qubits |journal=[[Applied Physics Reviews]] |language=en |volume=6 |issue=2 |pages=021318 |doi=10.1063\u002f1.5089550 |arxiv=1904.06560 |bibcode=2019ApPRv...6b1318K |s2cid=119104251 |issn=1931-9401}}\u003cbr\u003e *{{cite web |last=Mitchell |first=Ian |year=1998 |title=Computing Power into the 21st Century: Moore's Law and Beyond |url=http:\u002f\u002fciteseer.ist.psu.edu\u002fmitchell98computing.html }}","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -17,10 +17,10 @@\u003cbr\u003e == History ==\u003cbr\u003e {{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e \u003cbr\u003e-For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain the [[wave{{en dash}}particle duality]] observed at atomic scales,\u003cref\u003e{{Cite journal |last=Bhatta |first=Varun S. |date=2020-05-10 |title=Plurality of Wave\u2013Particle Duality |url=https:\u002f\u002fwww.currentscience.ac.in\u002fVolumes\u002f118\u002f09\u002f1365.pdf |journal=Current Science |language=en-US |volume=118 |issue=9 |pages=1365 |doi=10.18520\u002fcs\u002fv118\u002fi9\u002f1365-1374 |issn=0011-3891 |s2cid=216143449}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul|year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e-When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=http 03c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e-The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e+The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly. guuga gaga\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e\u003cbr\u003e Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e@@ -19,15 +19,15 @@\u003cbr\u003e \u003cbr\u003e For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e+As [[physicists]] applied quantum mechanical model to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |author-link=Yuri Manin |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |author-link=Richard Feynman |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Quantum algorithm]]s then emerged for solving [[oracle machine|oracle problems]], such as [[Deutsch's algorithm]] in 1985,\u003cref\u003e{{Cite journal |date=1985-07-08 |title=Quantum theory, the Church\u2013Turing principle and the universal quantum computer |journal=Proceedings of the Royal Society of London. A. Mathematical and Physical Sciences |language=en |volume=400 |issue=1818 |pages=97\u2013117 |doi=10.1098\u002frspa.1985.0070 |bibcode=1985RSPSA.400...97D |s2cid=1438116 |issn=0080-4630|last1=Deutsch |first1=D. }}\u003c\u002fref\u003e the [[Bernstein{{en dash}}Vazirani algorithm]] in 1993,\u003cref\u003e{{Cite book |last1=Bernstein |first1=Ethan |title=Proceedings of the twenty-fifth annual ACM symposium on Theory of computing \u2013 STOC '93 |last2=Vazirani |first2=Umesh |date=1993 |publisher=ACM Press |isbn=978-0-89791-591-5 |location=San Diego, California, United States |pages=11\u201320 |language=en |chapter=Quantum complexity theory |doi=10.1145\u002f167088.167097 |chapter-url=http:\u002f\u002fportal.acm.org\u002fcitation.cfm?doid=167088.167097 |s2cid=676378}}\u003c\u002fref\u003e and [[Simon's algorithm]] in 1994.\u003cref\u003e{{Cite book |last=Simon |first=D. R. |title=Proceedings 35th Annual Symposium on Foundations of Computer Science |chapter=On the power of quantum computation |date=1994 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f365701 |location=Santa Fe, New Mexico, USA |publisher=IEEE Comput. Soc. Press |pages=116\u2013123 |doi=10.1109\u002fSFCS.1994.365701 |isbn=978-0-8186-6580-6 |s2cid=7457814}}\u003c\u002fref\u003e\u003cbr\u003e-These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e+These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum inki  pinky'' .''onky daddy bought a donkey'' {{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e \u003cbr\u003e [[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e-[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e+[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] said khelge free fire hardunga proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and superconductors.{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e In 1998, a two-qubit quantum computer demonstrated the feasibility of the technology,\u003cref\u003e{{cite journal |last1=Chuang |first1=Isaac L. |last2=Gershenfeld |first2=Neil |last3=Kubinec |first3=Markdoi |date=April 1998 |title=Experimental Implementation of Fast Quantum Searching |journal=Physical Review Letters |publisher=[[American Physical Society]] |volume=80 |issue=15 |pages=3408\u20133411 |bibcode=1998PhRvL..80.3408C |doi=10.1103\u002fPhysRevLett.80.3408}}\u003c\u002fref\u003e\u003cref\u003e{{cite news |last=Holton |first=William Coffeen |title=quantum computer |url=https:\u002f\u002fwww.britannica.com\u002ftechnology\u002fquantum-computer |access-date=4 Dec 2021 |newspaper=Encyclopedia Britannica |publisher=[[Encyclop\u00e6dia Britannica]]}}\u003c\u002fref\u003e and subsequent experiments have increased the number of qubits and reduced error rates.{{sfn|Grumbling|Horowitz|2019 |pp=164-169}}\u003cbr\u003e@@ -38,7 +38,7 @@\u003cbr\u003e {{See also|Introduction to quantum mechanics}}\u003cbr\u003e \u003cbr\u003e [[Computer engineer]]s typically describe a [[modern computer]]'s operation in terms of [[classical electrodynamics]].\u003cbr\u003e-Within these \"classical\" computers, some components (such as [[semiconductors]] and [[random number generators]]) may rely on quantum behavior, but these components are not [[isolated system|isolated]] from their environment, so any [[quantum information]] quickly [[quantum decoherence|decoheres]].\u003cbr\u003e+Within these \"classical\" computers, some components (such as my son so dumb Iq 21 he try to make friends but they call him ching chong) may rely on quantum behavior, but these components are not [[isolated system|isolated]] from their environment, so any [[quantum information]] quickly [[quantum decoherence|decoheres]].\u003cbr\u003e While [[programmers]] may depend on [[probability theory]] when designing a [[randomized algorithm]], quantum mechanical notions like superposition and [[quantum interference|interference]] are largely irrelevant for [[program analysis]].\u003cbr\u003e \u003cbr\u003e [[Quantum program]]s, in contrast, rely on precise control of [[quantum coherence|coherent]] quantum systems. Physicists [[mathematical formulation of quantum mechanics|describe these systems mathematically]] using [[linear algebra]]. [[Complex number]]s model [[probability amplitude]]s, [[vector (mathematics and physics)|vectors]] model [[quantum state]]s, and [[matrix (mathematics)|matrices]] model the operations that can be performed on these states. Programming a quantum computer is then a matter of [[function composition (computer science)|composing]] operations in such a way that the resulting program computes a useful result in theory and is implementable in practice.\u003cbr\u003e@@ -47,9 +47,12 @@\u003cbr\u003e {{Blockquote|text=A classical computer is a quantum computer&nbsp;... so we shouldn't be asking about \"where do quantum speedups come from?\" We should say, \"well, all computers are quantum.&nbsp;... Where do classical slowdowns come from?\"}}\u003cbr\u003e \u003cbr\u003e === Quantum information ===\u003cbr\u003e-Just as the bit is the basic concept of classical information theory, the ''[[qubit]]'' is the fundamental unit of [[quantum information]]. The same term ''qubit'' is used to refer to an abstract mathematical model and to any physical system that is represented by that model. A classical bit, by definition, exists in either of two physical states, which can be denoted 0 and 1. A qubit is also described by a state, and two states often written \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e serve as the quantum counterparts of the classical states 0 and 1. However, the quantum states \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e belong to a [[vector space]], meaning that they can be multiplied by constants and added together, and the result is again a valid quantum state. Such a combination is known as a ''superposition'' of \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.{{sfn|Nielsen|Chuang|2010|page=13}}{{sfn|Mermin|2007|p=17}}\u003cbr\u003e-\u003cbr\u003e-A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[linear algebra]], writing \u003cmath\u003e|\\psi\\rangle\u003c\u002fmath\u003e {{gloss|ket [[psi (Greek)|psi]]}} for a vector labeled \u003cmath\u003e\\psi\u003c\u002fmath\u003e . Because a qubit is a two-state system, any qubit state takes the form \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e , where \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e are the standard ''basis states'',{{efn|The [[standard basis]] is also the ''computational basis''.{{sfn|Mermin|2007|p=18}}}} and \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e are the ''[[probability amplitude]]s,'' which are in general [[complex numbers]].{{sfn|Mermin|2007|p=17}} If either \u003cmath\u003e\\alpha\u003c\u002fmath\u003e or \u003cmath\u003e\\beta\u003c\u002fmath\u003e is zero, the qubit is effectively a classical bit; when both are nonzero, the qubit is in superposition. Such a [[quantum state vector]] acts similarly to a (classical) [[probability vector]], with one key difference: unlike probabilities, probability {{em|amplitudes}} are not necessarily positive numbers.{{sfn|Aaronson|2013|page=110}} Negative amplitudes allow for destructive wave interference.\u003cbr\u003e+Just as the bit is the basic concept of classical information theory, the meters is the fundamental unit of [[quantum information]]. The same term meter is used to refer to an abstract mathematical model and to any physical system that is represented by that model. A classical bit, by definition, exists in either of two physical states, which can be denoted 0 and 1. A qubit is also described by a state, and two states often written \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|\\rangle2\u003cbr\u003e+\u003c\u002fmath\u003e serve as the quantum counterparts of the classical states 0 and 1. However, the quantum states \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e belong to a [[vector space]], meaning that they can be multiplied by constants and added together, and the result is again a valid quantum state. Such a combination is known as a ''superposition'' of \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.{{sfn|Nielsen|Chuang|2010|page=13}}{{sfn|Mermin|2007|p=17}}\u003cbr\u003e+\u003cbr\u003e+A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[linear algebra]], writing \u003cmath\u003e|\\psi\\rangle\u003c\u002fmath\u003e {{gloss|ket [[psi (Greek)|psi]]}} for a vector labeled \u003cmath\u003e\\psi\u003c\u002fmath\u003e . Because a qubit is a two-state system, any qubit state takes the form \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e , where \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e are the standard ''basis states'',{{efn|The [[standard basis]] is also the ''computational basis''.{{sfn|Mermin|2007|p=18}}}} and \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e are the ''[[probability amplitude]]s,'' which are in general [[complex numbers]].{{sfn|Mermin|2007|p=17}} If either \u003cmath\u003e\\alpha\u003c\u002fmath\u003e or \u003cmath\u003e\\beta\u003c\u002fmath\u003e is zero, the qubit is effectively a classical bit; when both are nonzero, the qubit is in superposition. Such a [[quantum state vector]] acts similarly to a (classical ) [[probability vector]], with one key difference: unlike probabilities, probability {{em|amplitudes}} are not necessarily positive numbers.{{sfn|Aaronson|2013|page=110}} Negative amplitudes allow for destructive wave interference. EMINEM\u003e Snoo\u003cbr\u003e+\u003cbr\u003e+ogd\u003cbr\u003e \u003cbr\u003e When a qubit is [[quantum measurement|measured]] in the [[standard basis]], the result is a classical bit. The [[Born rule]] describes the [[norm-squared]] correspondence between amplitudes and probabilities{{mdash}}when measuring a qubit \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e, the state [[wave function collapse|collapses]] to \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\alpha|^2\u003c\u002fmath\u003e, or to \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\beta|^2\u003c\u002fmath\u003e.\u003cbr\u003e Any valid qubit state has coefficients \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e such that \u003cmath\u003e|\\alpha|^2+|\\beta|^2 = 1\u003c\u002fmath\u003e.","--- Revision 76\u003cbr\u003e+++ Revision 77\u003cbr\u003e@@ -6,7 +6,7 @@\u003cbr\u003e A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e-The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly. guuga gaga\u003cbr\u003e+The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e\u003cbr\u003e Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e@@ -19,15 +19,15 @@\u003cbr\u003e \u003cbr\u003e For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-As [[physicists]] applied quantum mechanical model to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e+As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |author-link=Yuri Manin |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |author-link=Richard Feynman |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Quantum algorithm]]s then emerged for solving [[oracle machine|oracle problems]], such as [[Deutsch's algorithm]] in 1985,\u003cref\u003e{{Cite journal |date=1985-07-08 |title=Quantum theory, the Church\u2013Turing principle and the universal quantum computer |journal=Proceedings of the Royal Society of London. A. Mathematical and Physical Sciences |language=en |volume=400 |issue=1818 |pages=97\u2013117 |doi=10.1098\u002frspa.1985.0070 |bibcode=1985RSPSA.400...97D |s2cid=1438116 |issn=0080-4630|last1=Deutsch |first1=D. }}\u003c\u002fref\u003e the [[Bernstein{{en dash}}Vazirani algorithm]] in 1993,\u003cref\u003e{{Cite book |last1=Bernstein |first1=Ethan |title=Proceedings of the twenty-fifth annual ACM symposium on Theory of computing \u2013 STOC '93 |last2=Vazirani |first2=Umesh |date=1993 |publisher=ACM Press |isbn=978-0-89791-591-5 |location=San Diego, California, United States |pages=11\u201320 |language=en |chapter=Quantum complexity theory |doi=10.1145\u002f167088.167097 |chapter-url=http:\u002f\u002fportal.acm.org\u002fcitation.cfm?doid=167088.167097 |s2cid=676378}}\u003c\u002fref\u003e and [[Simon's algorithm]] in 1994.\u003cref\u003e{{Cite book |last=Simon |first=D. R. |title=Proceedings 35th Annual Symposium on Foundations of Computer Science |chapter=On the power of quantum computation |date=1994 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f365701 |location=Santa Fe, New Mexico, USA |publisher=IEEE Comput. Soc. Press |pages=116\u2013123 |doi=10.1109\u002fSFCS.1994.365701 |isbn=978-0-8186-6580-6 |s2cid=7457814}}\u003c\u002fref\u003e\u003cbr\u003e-These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum inki  pinky'' .''onky daddy bought a donkey'' {{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e+These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e \u003cbr\u003e [[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e-[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] said khelge free fire hardunga proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |la ter]]'s operation in terms of [[classical electrodynamics]].\u003cbr\u003e-Within these \"classical\" computers, some components (such as my son so dumb Iq 21 he try to make friends but they call him ching chong) may rely on quantum behavior, but these components are not [[isolated system|isolated]] from their environment, so any [[quantum information]] quickly [[quantum decoherence|decoheres]].\u003cbr\u003e+Within these \"classical\" computers, some components (such as [[semiconductors]] and [[random number generators]]) may rely on quantum behavior, but these components are not [[isolated system|isolated]] from their environment, so any [[quantum information]] quickly [[quantum decoherence|decoheres]].\u003cbr\u003e While [[programmers]] may depend on [[probability theory]] when designing a [[randomized algorithm]], quantum mechanical notions like superposition and [[quantum interference|interference]] are largely irrelevant for [[program analysis]].\u003cbr\u003e \u003cbr\u003e [[Quantum program]]s, in contrast, rely on precise control of [[quantum coherence|coherent]] quantum systems. Physicists [[mathematical formulation of quantum mechanics|describe these systems mathematically]] using [[linear algebra]]. [[Complex number]]s model [[probability amplitude]]s, [[vector (mathematics and physics)|vectors]] model [[quantum state]]s, and [[matrix (mathematics)|matrices]] model the operations that can be performed on these states. Programming a quantum computer is then a matter of [[function composition (computer science)|composing]] operations in such a way that the resulting program computes a useful result in theory and is implementable in practice.\u003cbr\u003e@@ -47,12 +47,9 @@\u003cbr\u003e {{Blockquote|text=A classical computer is a quantum computer&nbsp;... so we shouldn't be asking about \"where do quantum speedups come from?\" We should say, \"well, all computers are quantum.&nbsp;... Where do classical slowdowns come from?\"}}\u003cbr\u003e \u003cbr\u003e === Quantum information ===\u003cbr\u003e-Just as the bit is the basic concept of classical information theory, the meters is the fundamental unit of [[quantum information]]. The same term meter is used to refer to an abstract mathematical model and to any physical system that is represented by that model. A classical bit, by definition, exists in either of two physical states, which can be denoted 0 and 1. A qubit is also described by a state, and two states often written \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|\\rangle2\u003cbr\u003e-\u003c\u002fmath\u003e serve as the quantum counterparts of the classical states 0 and 1. However, the quantum states \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e belong to a [[vector space]], meaning that they can be multiplied by constants and added together, and the result is again a valid quantum state. Such a combination is known as a ''superposition'' of \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.{{sfn|Nielsen|Chuang|2010|page=13}}{{sfn|Mermin|2007|p=17}}\u003cbr\u003e-\u003cbr\u003e-A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[linear algebra]], writing \u003cmath\u003e|\\psi\\rangle\u003c\u002fmath\u003e {{gloss|ket [[psi (Greek)|psi]]}} for a vector labeled \u003cmath\u003e\\psi\u003c\u002fmath\u003e . Because a qubit is a two-state system, any qubit state takes the form \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e , where \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e are the standard ''basis states'',{{efn|The [[standard basis]] is also the ''computational basis''.{{sfn|Mermin|2007|p=18}}}} and \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e are the ''[[probability amplitude]]s,'' which are in general [[complex numbers]].{{sfn|Mermin|2007|p=17}} If either \u003cmath\u003e\\alpha\u003c\u002fmath\u003e or \u003cmath\u003e\\beta\u003c\u002fmath\u003e is zero, the qubit is effectively a classical bit; when both are nonzero, the qubit is in superposition. Such a [[quantum state vector]] acts similarly to a (classical ) [[probability vector]], with one key difference: unlike probabilities, probability {{em|amplitudes}} are not necessarily positive numbers.{{sfn|Aaronson|2013|page=110}} Negative amplitudes allow for destructive wave interference. EMINEM\u003e Snoo\u003cbr\u003e-\u003cbr\u003e-ogd\u003cbr\u003e+Just as the bit is the basic concept of classical information theory, the ''[[qubit]]'' is the fundamental unit of [[quantum information]]. The same term ''qubit'' is used to refer to an abstract mathematical model and to any physical system that is represented by that model. A classical bit, by definition, exists in either of two physical states, which can be denoted 0 and 1. A qubit is also described by a state, and two states often written \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e serve as the quantum counterparts of the classical states 0 and 1. However, the quantum states \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e belong to a [[vector space]], meaning that they can be multiplied by constants and added together, and the result is again a valid quantum state. Such a combination is known as a ''superposition'' of \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.{{sfn|Nielsen|Chuang|2010|page=13}}{{sfn|Mermin|2007|p=17}}\u003cbr\u003e+\u003cbr\u003e+A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[l er of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e+A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -19,7 +19,7 @@\u003cbr\u003e \u003cbr\u003e For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u uld perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications\u003cref\u003e{{Cite web |last=Malik |first=Mohd Amin |date=2024-09-22 |title=Quantum Computers: The Dawn of a New Era |url=https:\u002f\u002fwww.greaterkashmir.com\u002fopinion\u002fquantum-computers-the-dawn-of-a-new-era\u002f#google_vignette |access-date=2025-02-04 |website=Greater Kashmir |language=en-US}}\u003c\u002fref\u003e.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating pro devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e-\u003cbr\u003e-\u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e","--- Revision 97\u003cbr\u003e+++ Revision 98\u003cbr\u003e@@ -3,9 +3,8 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e-\u003cbr\u003e-\u003c!--Physical implementations--\u003e\u003cbr\u003e+The basic [[unit of information]] in quant\u003cbr\u003e+\u003cbr\u003e Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e"],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"aWSSQYZIjkFakpBBWMaNQfr+k0Gai5FBGeKSQf9+kkEmY5RBW+GRQbiCkkE="},"y":{"dtype":"f4","bdata":"nfr6QbEC\u002fkH4Lv5BHQ3+QTS3+kEor\u002fdBV8z5QaIu+kHZh\u002fhBn4kAQpOkAEI="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 87\u003cbr\u003e+++ Revision 88\u003cbr\u003e@@ -396,14 +396,14 @@\u003cbr\u003e == External links ==\u003cbr\u003e *{{Commons-inline|Quantum computer}}\u003cbr\u003e *{{Wikiversity inline|Quantum computing}}\u003cbr\u003e-* [[Stanford Encyclopedia of Philosophy]]: \"[http:\u002f\u002fplato.stanford.edu\u002fentries\u002fqt-quantcomp\u002f Quantum Computing]\" by Amit Hagar and Michael E. Cuffaro.\u003cbr\u003e+* [[Stanford Encyclopedia of Philosophy]]: \"[https:\u002f\u002fplato.stanford.edu\u002fentries\u002fqt-quantcomp\u002f Quantum Computing]\" by Amit Hagar and Michael E. Cuffaro.\u003cbr\u003e * {{springer|title=Quantum computation, theory of|id=p\u002fq130020}}\u003cbr\u003e * [https:\u002f\u002fquantum.country\u002fqcvc Quantum computing for the very curious] by Andy Matuschak and [[Michael Nielsen]]\u003cbr\u003e- \u003cbr\u003e+* [https:\u002f\u002flink.springer.com\u002fbook\u002f10.1007\u002f978-3-031-64136-7 Quantum Software: Aspects of Theory and System Design]\u003cbr\u003e+\u003cbr\u003e ;Lectures\u003cbr\u003e * [https:\u002f\u002fwww.youtube.com\u002fplaylist?list=PL1826E60FD05B44E4 Quantum computing for the determined] \u2013 22 video lectures by [[Michael Nielsen]]\u003cbr\u003e * [http:\u002f\u002fwww.quiprocone.org\u002fProtected\u002fDD_
