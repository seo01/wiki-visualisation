tives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}} \u003cbr\u003e+For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last=Nayak |first=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However, the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover, the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e \u003cbr\u003e The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e \u003cbr\u003e-Research efforts to create stabler qubits for quantum computing include [[topological quantum computer]] approaches. For example, [[Microsoft Azure Quantum|Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]], developing the first quantum processing unit based on a topological core ([[Majorana 1]]) in 2025.\u003cref name=\"Forbes Majorana\"\u003e{{Cite web |title=Massive Microsoft Quantum Computer Breakthrough Uses New State Of Matter |url=https:\u002f\u002fwww.forbes.com\u002fsites\u002fjohnkoetsier\u002f2025\u002f02\u002f19\u002fmassive-microsoft-quantum-computer-breakthrough-uses-new-state-of-matter\u002f |date=19 Feb 2025 |last1=Koetsier |first1=John |access-date=2025-02-19 |website=Forbes |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardw \u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -283,7 +283,7 @@\u003cbr\u003e [[File:IBM Q system (Fraunhofer 2).jpg|thumb|upright=1.2|[[IBM Q System One|Quantum System One]], a quantum computer by [[IBM]] from 2019 with 20 superconducting qubits\u003cref\u003e{{Cite news |last=Russell |first=John |date=January 10, 2019 |title=IBM Quantum Update: Q System One Launch, New Collaborators, and QC Center Plans |language=en-US |website=HPCwire |url=https:\u002f\u002fwww.hpcwire.com\u002f2019\u002f01\u002f10\u002fibm-quantum-update-q-system-one-launch-new-collaborators-and-qc-center-plans\u002f |access-date=2023-01-09}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}} \u003cbr\u003e-For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last=Nayak |first=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083}}\u003c\u002fref\u003e\u003cbr\u003e+For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last=Nayak |first=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083|arxiv=0707.1889 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However, the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover, the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e ","--- Revision 37\u003cbr\u003e+++ Revision 38\u003cbr\u003e@@ -3,6 +3,7 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e+oui on non\u003cbr\u003e A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e","--- Revision 38\u003cbr\u003e+++ Revision 39\u003cbr\u003e@@ -3,7 +3,7 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-oui on non\u003cbr\u003e+oui ou non\u003cbr\u003e A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e","--- Revision 39\u003cbr\u003e+++ Revision 40\u003cbr\u003e@@ -3,7 +3,6 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-oui ou non\u003cbr\u003e A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e","--- Revision 40\u003cbr\u003e+++ Revision 41\u003cbr\u003e@@ -150,7 +150,7 @@\u003cbr\u003e \u003cbr\u003e Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e-Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] ,have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e+Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]], have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e ","--- Revision 41\u003cbr\u003e+++ Revision 42\u003cbr\u003e@@ -313,7 +313,7 @@\u003cbr\u003e While quantum computers cannot solve any problems that classical computers cannot already solve, it is suspected that they can solve certain problems faster than classical computers. For instance, it is known that quantum computers can efficiently [[integer factorization|factor integers]], while this is not believed to be the case for classical computers.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic definition of BQP --\u003e\u003cbr\u003e-The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time quantum Turing machine with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BQP\\subsetneq BPP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e+The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time quantum Turing machine with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BPP\\subsetneq BQP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e \u003cbr\u003e \u003c!-- Relation of BQP to basic complexity classes --\u003e\u003cbr\u003e [[File:BQP complexity class diagram.svg|thumb|The suspected relationship of BQP to several classical complexity classes{{sfn|Nielsen|Chuang|2010|p=42}}]]","--- Revision 42\u003cbr\u003e+++ Revision 43\u003cbr\u003e@@ -313,7 +313,7 @@\u003cbr\u003e While quantum computers cannot solve any problems that classical computers cannot already solve, it is suspected that they can solve certain problems faster than classical computers. For instance, it is known that quantum computers can efficiently [[integer factorization|factor integers]], while this is not believed to be the case for classical computers.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic definition of BQP --\u003e\u003cbr\u003e-The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time quantum Turing machine with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BPP\\subsetneq BQP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e+The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time quantum Turing machine with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BQP\\subsetneq BPP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e \u003cbr\u003e \u003c!-- Relation of BQP to basic complexity classes --\u003e\u003cbr\u003e [[File:BQP complexity class diagram.svg|thumb|The suspected relationship of BQP to several classical complexity classes{{sfn|Nielsen|Chuang|2010|p=42}}]]","--- Revision 43\u003cbr\u003e+++ Revision 44\u003cbr\u003e@@ -3,7 +3,7 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state rticle, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications. They are typically made of humans and cheese.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -3,7 +3,7 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\ra rimental research aimed at developing  scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e+Quantum computers are not yet practical for real-world applications. Physically engineering high-quality qubits has proven to be challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research aimed at developing  scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems that are unsolvable by a classical computer in any reasonable amount of time. This concept of additional ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain uantum Computation Really Possible? |journal=Future Trends in Microelectronics. Up the Nano Creek |pages=4\u201318 |arxiv=quant-ph\u002f0610117 |bibcode=2006quant.ph.10117D |editor1=S. Luryi}}\u003c\u002fref\u003e With error correction, the figure would rise to about 10\u003csup\u003e7\u003c\u002fsup\u003e bits. Computation time is about ''L''\u003csup\u003e2\u003c\u002fsup\u003e or about 10\u003csup\u003e7\u003c\u002fsup\u003e steps and at 1{{nbsp}}MHz, about 10 seconds. However, the encoding and error-correction overheads increase the size of a real fault-tolerant quantum computer by several orders of magnitude. Careful estimates\u003cref name=\":1\"\u003e{{Cite book |last=Ahsan |first=Muhammad |url=http:\u002f\u002fworldcat.org\u002foclc\u002f923881411 |title=Architecture Framework for Trapped-ion Quantum Computer based on Performance Simulation Tool |date=2015 |language=en-US |oclc=923881411}}\u003c\u002fref\u003e\u003cref name=\":2\"\u003e{{Cite journal |last1=Ahsan |first1=Muhammad |last2=Meter |first2=Rodney Van |last3=Kim |first3=Jungsang |date=2016-12-28 |title=Designing a Million-Qubit Quantum Computer Using a Resource Performance Simulator |journal=ACM Journal on Emerging Technologies in Computing Systems |volume=12 |issue=4 |pages=39:1\u201339:25 |doi=10.1145\u002f2830570 |s2cid=1258374 |issn=1550-4832|doi-access=free |arxiv=1512.00796 }}\u003c\u002fref\u003e show that at least 3{{nbsp}}million physical qubits would factor 2,048-bit integer in 5 months on a fully error-corrected trapped-ion quantum computer. In terms of the number of physical qubits, to date, this remains the lowest estimate\u003cref\u003e{{Cite journal |last1=Gidney |first1=Craig |last2=Eker\u00e5 |first2=Martin |date=2021-04-15 |title=How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits |journal=Quantum |volume=5 |pages=433 |doi=10.22331\u002fq-2021-04-15-433 |arxiv=1905.09749 |bibcode=2021Quant...5..433G |s2cid=162183806 |issn=2521-327X}}\u003c\u002fref\u003e for practically useful integer factorization problem sizing 1,024-bit or larger.\u003cbr\u003e+Meeting this scalability condition is possible for a wide range of systems. However, the use of error correction brings with it the cost of a greatly increased number of required qubits. The number required to factor integers using Shor's algorithm is still polynomial, and thought to be between ''L'' and ''L''\u003csup\u003e2\u003c\u002fsup\u003e, where ''L'' is the number of binary digits in the number to be factored; error correction algorithms would inflate this figure by an additional factor of ''L''. For a 1000-bit number, this implies a need for about 10\u003csup\u003e4\u003c\u002fsup\u003e bits without error correction.\u003cref\u003e{{cite journal |last=Dyakonov |first=M. I. |date=14 October 2006 |editor2=Xu |editor2-first=J. |editor3=Zaslavsky |editor3-first=A. |title=Is Fault-Tolerant Quantum Computation Really Possible? |journal=Future Trends in Microelectronics. Up the Nano Creek |pages=4\u201318 |arxiv=quant-ph\u002f0610117 |bibcode=2006quant.ph.10117D |editor1=S. Luryi}}\u003c\u002fref\u003e With error correction, the figure would rise to about 10\u003csup\u003e7\u003c\u002fsup\u003e bits. Computation time is about ''L''\u003csup\u003e2\u003c\u002fsup\u003e or about 10\u003csup\u003e7\u003c\u002fsup\u003e steps and at 1{{nbsp}}MHz, about 10 seconds. However, the encoding and error-correction overheads increase the size of a real fault-tolerant quantum computer by several orders of magnitude. Careful estimates\u003cref name=\":1\"\u003e{{Cite book |last=Ahsan |first=Muhammad |url=http:\u002f\u002fworldcat.org\u002foclc\u002f923881411 |title=Architecture Framework for Trapped-ion Quantum Computer based on Performance Simulation Tool |date=2015 |bibcode=2015PhDT........56A |language=en-US |oclc=923881411}}\u003c\u002fref\u003e\u003cref name=\":2\"\u003e{{Cite journal |last1=Ahsan |first1=Muhammad |last2=Meter |first2=Rodney Van |last3=Kim |first3=Jungsang |date=2016-12-28 |title=Designing a Million-Qubit Quantum Computer Using a Resource Performance Simulator |journal=ACM Journal on Emerging Technologies in Computing Systems |volume=12 |issue=4 |pages=39:1\u201339:25 |doi=10.1145\u002f2830570 |s2cid=1258374 |issn=1550-4832|doi-access=free |arxiv=1512.00796 }}\u003c\u002fref\u003e show that at least 3{{nbsp}}million physical qubits would factor 2,048-bit integer in 5 months on a fully error-corrected trapped-ion quantum computer. In terms of the number of physical qubits, to date, this remains the lowest estimate\u003cref\u003e{{Cite journal |last1=Gidney |first1=Craig |last2=Eker\u00e5 |first2=Martin |date=2021-04-15 |title=How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits |journal=Quantum |volume=5 |pages=433 |doi=10.22331\u002fq-2021-04-15-433 |arxiv=1905.09749 |bibcode=2021Quant...5..433G |s2cid=162183806 |issn=2521-327X}}\u003c\u002fref\u003e for practically useful integer factorization problem sizing 1,024-bit or larger.\u003cbr\u003e \u003cbr\u003e Another approach to the stability-decoherence problem is to create a [[topological quantum computer]] with [[anyon]]s, [[quasi-particle]]s used as threads, and relying on [[braid theory]] to form stable logic gates.\u003cref\u003e{{cite journal\u003cbr\u003e  | last1 = Freedman | first1 = Michael H. | author1-link = Michael Freedman\u003cbr\u003e@@ -283,7 +283,7 @@\u003cbr\u003e [[File:IBM Q system (Fraunhofer 2).jpg|thumb|upright=1.2|[[IBM Q System One|Quantum System One]], a quantum computer by [[IBM]] from 2019 with 20 superconducting qubits\u003cref\u003e{{Cite news |last=Russell |first=John |date=January 10, 2019 |title=IBM Quantum Update: Q System One Launch, New Collaborators, and QC Center Plans |language=en-US |website=HPCwire |url=https:\u002f\u002fwww.hpcwire.com\u002f2019\u002f01\u002f10\u002fibm-quantum-update-q-system-one-launch-new-collaborators-and-qc-center-plans\u002f |access-date=2023-01-09}}\u003c\u002fref\u003e]]\u003cbr\u003e \u003cbr\u003e A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}} \u003cbr\u003e-For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last=Nayak |first=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083|arxiv=0707.1889 }}\u003c\u002fref\u003e\u003cbr\u003e+For example, [[topological quantum computer]] approaches are being explored for more fault-tolerance computing systems.\u003cref\u003e{{Cite journal |last1=Nayak |first1=Chetan |last2=Simon |first2=Steven H. |last3=Stern |first3=Ady |last4=Freedman |first4=Michael |last5=Das Sarma |first5=Sankar |date=2008-09-12 |title=Non-Abelian anyons and topological quantum computation |url=https:\u002f\u002fjournals.aps.org\u002frmp\u002fabstract\u002f10.1103\u002fRevModPhys.80.1083 |journal=Reviews of Modern Physics |volume=80 |issue=3 |pages=1083\u20131159 |doi=10.1103\u002fRevModPhys.80.1083|arxiv=0707.1889 |bibcode=2008RvMP...80.1083N }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However, the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover, the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e ","--- Revision 48\u003cbr\u003e+++ Revision 49\u003cbr\u003e@@ -275,7 +275,7 @@\u003cbr\u003e Some researchers have expressed skepticism that scalable quantum computers could ever be built, typically because of the issue of maintaining coherence at large scales, but also for other reasons.\u003cbr\u003e \u003cbr\u003e [[Bill Unruh]] doubted the practicality of quantum computers in a paper published in 1994.\u003cref\u003e{{Cite journal |last1=Unruh |first1=Bill |title=Maintaining coherence in Quantum Computers |journal=Physical Review A |volume=51 |issue=2 |pages=992\u2013997 |arxiv=hep-th\u002f9406058 |bibcode=1995PhRvA..51..992U |year=1995 |doi=10.1103\u002fPhysRevA.51.992 |pmid=9911677 |s2cid=13980886}}\u003c\u002fref\u003e [[Paul Davies]] argued that a 400-qubit computer would even come into conflict with the cosmological information bound implied by the [[holographic principle]].\u003cref\u003e{{cite arXiv|last1=Davies|first1=Paul|date=6 March 2007 |title=The implications of a holographic universe for quantum information science and the nature of physical law |eprint=quant-ph\u002f0703041}}\u003c\u002fref\u003e Skeptics like [[Gil Kalai]] doubt that quantum supremacy will ever be achieved.\u003cref\u003e{{cite web |author=Regan |first=K. W. |date=23 April 2016 |title=Quantum Supremacy and Complexity |url=https:\u002f\u002frjlipton.wordpress.com\u002f2016\u002f04\u002f22\u002fquantum-supremacy-and-complexity\u002f |website=G\u00f6del's Lost Letter and P=NP}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Kalai |first1=Gil |date=May 2016 |title=The Quantum Computer Puzzle |journal=Notices of the AMS |volume=63 |number=5 |pages=508\u2013516 |url=https:\u002f\u002fwww.ams.org\u002fjournals\u002fnotices\u002f201605\u002frnoti-p508.pdf}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last1=Rinott |first1=Yosef |last2=Shoham |first2=Tomer |last3=Kalai |first3=Gil |date=2021-07-13 |title=Statistical Aspects of the Quantum Supremacy Demonstration |class=quant-ph |eprint=2008.05177}}\u003c\u002fref\u003e Physicist [[Mikhail Dyakonov]] has expressed skepticism of quantum computing as follows:\u003cbr\u003e-:\"So the number of continuous parameters describing the state of such a useful quantum computer at any given moment must be... about 10\u003csup\u003e300\u003c\u002fsup\u003e... Could we ever learn to control the more than 10\u003csup\u003e300\u003c\u002fsup\u003e continuously variable parameters defining the quantum state of such a system? My answer is simple. ''No, never.''\"\u003cref\u003e{{cite web |last1=Dyakonov |first1=Mikhail |title=The Case Against Quantum Computing |url=https:\u002f\u002fspectrum.ieee.org\u002fthe-case-against-quantum-computing |website=IEEE Spectrum |date=15 November 2018 |access-date=3 December 2019}}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Dyakonov |first1=Mikhail |title=Will We Ever Have a Quantum Computer? |date=24 March 2020 |url=https:\u002f\u002fwww.springer.com\u002fgp\u002fbook\u002f9783030420185 |publisher=Springer |isbn=9783030420185 |access-date=22 May 2020}}{{page needed|date=May 2020}}\u003c\u002fref\u003e\u003cbr\u003e+:\"So the number of continuous parameters describing the state of such a useful quantum computer at any given moment must be... about 10\u003csup\u003e300\u003c\u002fsup\u003e... Could we ever learn to control the more than 10\u003csup\u003e300\u003c\u002fsup\u003e continuously variable parameters defining the quantum state of such a system? My answer is simple. ''No, never.''\"\u003cref\u003e{{cite web |last1=Dyakonov |first1=Mikhail |title=The Case Against Quantum Computing |url=https:\u002f\u002fspectrum.ieee.org\u002fthe-case-against-quantum-computing |website=IEEE Spectrum |date=15 November 2018 |access-date=3 December 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Physical realizations ===\u003cbr\u003e {{Further|List of proposed quantum registers}}","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -1,45 +1,49 @@\u003cbr\u003e-{{Short description|Computer hardware technology that uses quantum mechanics}}\u003cbr\u003e+{{Short description|Technology that uses quantum mechanics}}\u003cbr\u003e {{Use American English|date=February 2023}}\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing takes advantage of this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e+A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e-The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, a state that is in an abstract sense \"between\" the two basis states. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e+The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, which loosely means that it is in both states simultaneously. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.\u003cbr\u003e \u003cbr\u003e \u003c!--Physical implementations--\u003e\u003cbr\u003e-Quantum computers are not yet practical for real-world applications. Physically engineering high-quality qubits has proven to be challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research aimed at developing  scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e+Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e-In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems that are not solvable within a reasonable timeframe for a classical computer. This concept of additional ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e+In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e \u003cbr\u003e == History ==\u003cbr\u003e {{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e \u003cbr\u003e-For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e-When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |author-link=Yuri Manin |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |author-link=Richard Feynman |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e+For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain the [[wave{{en dash}}particle duality]] observed at atomic scales,\u003cref\u003e{{Cite journal |last=Bhatta |first=Varun S. |date=2020-05-10 |title=Plurality of Wave\u2013Particle Duality |url=https:\u002f\u002fwww.currentscience.ac.in\u002fVolumes\u002f118\u002f09\u002f1365.pdf |journal=Current Science |language=en-US |volume=118 |issue=9 |pages=1365 |doi=10.18520\u002fcs\u002fv118\u002fi9\u002f1365-1374 |issn=0011-3891 |s2cid=216143449}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge.\u003cbr\u003e+In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul|year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e+When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Quantum algorithm]]s then emerged for solving [[oracle machine|oracle problems]], such as [[Deutsch's algorithm]] in 1985,\u003cref\u003e{{Cite journal |date=1985-07-08 |title=Quantum theory, the Church\u2013Turing principle and the universal quantum computer |journal=Proceedings of the Royal Society of London. A. Mathematical and Physical Sciences |language=en |volume=400 |issue=1818 |pages=97\u2013117 |doi=10.1098\u002frspa.1985.0070 |bibcode=1985RSPSA.400...97D |s2cid=1438116 |issn=0080-4630|last1=Deutsch |first1=D. }}\u003c\u002fref\u003e the [[Bernstein{{en dash}}Vazirani algorithm]] in 1993,\u003cref\u003e{{Cite book |last1=Bernstein |first1=Ethan |title=Proceedings of the twenty-fifth annual ACM symposium on Theory of computing \u2013 STOC '93 |last2=Vazirani |first2=Umesh |date=1993 |publisher=ACM Press |isbn=978-0-89791-591-5 |location=San Diego, California, United States |pages=11\u201320 |language=en |chapter=Quantum complexity theory |doi=10.1145\u002f167088.167097 |chapter-url=http:\u002f\u002fportal.acm.org\u002fcitation.cfm?doid=167088.167097 |s2cid=676378}}\u003c\u002fref\u003e and [[Simon's algorithm]] in 1994.\u003cref\u003e{{Cite book |last=Simon |first=D. R. |title=Proceedings 35th Annual Symposium on Foundations of Computer Science |chapter=On the power of quantum computation |date=1994 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f365701 |location=Santa Fe, New Mexico, USA |publisher=IEEE Comput. Soc. Press |pages=116\u2013123 |doi=10.1109\u002fSFCS.1994.365701 |isbn=978-0-8186-6580-6 |s2cid=7457814}}\u003c\u002fref\u003e\u003cbr\u003e These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e \u003cbr\u003e [[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e-[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and superconductors.{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e+[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing.{{sfn|Grumbling|Horowitz|2019|p=15}}\u003cbr\u003e+In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and [[superconducting quantum computing|superconductors]].{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e In 1998, a two-qubit quantum computer demonstrated the feasibility of the technology,\u003cref\u003e{{cite journal |last1=Chuang |first1=Isaac L. |last2=Gershenfeld |first2=Neil |last3=Kubinec |first3=Markdoi |date=April 1998 |title=Experimental Implementation of Fast Quantum Searching |journal=Physical Review Letters |publisher=[[American Physical Society]] |volume=80 |issue=15 |pages=3408\u20133411 |bibcode=1998PhRvL..80.3408C |doi=10.1103\u002fPhysRevLett.80.3408}}\u003c\u002fref\u003e\u003cref\u003e{{cite news |last=Holton |first=William Coffeen |title=quantum computer |url=https:\u002f\u002fwww.britannica.com\u002ftechnology\u002fquantum-computer |access-date=4 Dec 2021 |newspaper=Encyclopedia Britannica |publisher=[[Encyclop\u00e6dia Britannica]]}}\u003c\u002fref\u003e and subsequent experiments have increased the number of qubits and reduced error rates.{{sfn|Grumbling|Horowitz|2019 |pp=164-169}}\u003cbr\u003e \u003cbr\u003e In 2019, [[Google AI]] and [[NASA]] announced that they had achieved [[quantum supremacy]] with a 54-qubit machine, performing a computation that is impossible for any classical computer.\u003cref\u003e{{Cite journal |last=Gibney |first=Elizabeth |date=2019-10-23 |title=Hello quantum world! Google publishes landmark quantum supremacy claim |journal=Nature |language=en |volume=574 |issue=7779 |pages=461\u2013462 |doi=10.1038\u002fd41586-019-03213-z |pmid=31645740 |bibcode=2019Natur.574..461G |doi-access=free}}\u003c\u002fref\u003e\u003cref name=\"1910.11333\"\u003eLay summary: {{cite journal |url=https:\u002f\u002fai.googleblog.com\u002f2019\u002f10\u002fquantum-supremacy-using-programmable.html |title=Quantum Supremacy Using a Programmable Superconducting Processor |journal=Nature |publisher=[[Google AI]] |first1=John |last1=Martinis |first2=Sergio |last2=Boixo |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822 |access-date=2022-04-27}}\u003cbr \u002f\u003e{{*}}Journal article: {{cite journal |last1=Arute |first1=Frank |last2=Arya |first2=Kunal |last3=Babbush |first3=Ryan |last4=Bacon |first4=Dave |last5=Bardin |first5=Joseph C. |last6=Barends |first6=Rami |last7=Biswas |first7=Rupak |last8=Boixo |first8=Sergio |last9=Brandao |first9=Fernando G. S. L. |last10=Buell |first10=David A. |last11=Burkett |first11=Brian |first15=Roberto |first57=Murphy Yuezhen |last64=Rubin |first63=Pedram |last63=Roushan |first62=Eleanor G. |last62=Rieffel |first61=Chris |last using a programmable superconducting processor |journal=Nature |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |last=Aaronson |first=Scott |date=2019-10-30 |title=Opinion {{!}} Why Google's Quantum Supremacy Milestone Matters |url=https:\u002f\u002fwww.nytimes.com\u002f2019\u002f10\u002f30\u002fopinion\u002fgoogle-quantum-computer-sycamore.html |access-date=2021-09-25 |work=The New York Times |issn=0362-4331}}\u003c\u002fref\u003e However, the validity of this claim is still being actively researched.\u003cref\u003e{{cite web |last=Pednault |first=Edwin |date=22 October 2019 |title=On 'Quantum Supremacy' |url=https:\u002f\u002fwww.ibm.com\u002fblogs\u002fresearch\u002f2019\u002f10\u002fon-quantum-supremacy\u002f |access-date=9 February 2021 |website=IBM Research Blog}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last1=Pan |first1=Feng |last2=Zhang |first2=Pan |date=2021-03-04 |title=Simulating the Sycamore quantum supremacy circuits |class=quant-ph |eprint=2103.03074}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In December 2023, physicists, for the first time, reported the entanglement of individual molecules, which may have significant applications in quantum computing.\u003cref name=\"PHYS-20231207\"\u003e{{cite news |author=Staff |title=Physicists 'entangle' individual molecules for the first time, hastening possibilities for quantum computing |url=https:\u002f\u002fphys.org\u002fnews\u002f2023-12-physicists-entangle-individual-molecules-hastening.html |date=7 December 2023 |work=[[Phys.org]] |url-status=live |archiveurl=https:\u002f\u002farchive.today\u002f20231208152543\u002fhttps:\u002f\u002fphys.org\u002fnews\u002f2023-12-physicists-entangle-individual-molecules-hastening.html |archivedate=8 December 2023 |accessdate=8 December 2023 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Quantum information processing ==\u003cbr\u003e {{See also|Introduction to quantum mechanics}}\u003cbr\u003e \u003cbr\u003e [[Computer engineer]]s typically describe a [[modern computer]]'s operation in terms of [[classical electrodynamics]].\u003cbr\u003e Within these \"classical\" computers, some components (such as [[semiconductors]] and [[random number generators]]) may rely on quantum behavior, but these components are not [[isolated system|isolated]] from their environment, so any [[quantum information]] quickly [[quantum decoherence|decoheres]].\u003cbr\u003e-While [[programmers]] may depend on [[probability theory]] when designing a [[randomized algorithm]], quantum mechanical notions like superposition and [[quantum interference|interference]] are largely irrelevant for [[program analysis]].\u003cbr\u003e+While [[programmers]] may depend on [[probability theory]] when designing a [[randomized algorithm]], quantum mechanical notions like [[quantum superposition|superposition]] and [[quantum interference|interference]] are largely irrelevant for [[program analysis]].\u003cbr\u003e \u003cbr\u003e [[Quantum program]]s, in contrast, rely on precise control of [[quantum coherence|coherent]] quantum systems. Physicists [[mathematical formulation of quantum mechanics|describe these systems mathematically]] using [[linear algebra]]. [[Complex number]]s model [[probability amplitude]]s, [[vector (mathematics and physics)|vectors]] model [[quantum state]]s, and [[matrix (mathematics)|matrices]] model the operations that can be performed on these states. Programming a quantum computer is then a matter of [[function composition (computer science)|composing]] operations in such a way that the resulting program computes a useful result in theory and is implementable in practice.\u003cbr\u003e \u003cbr\u003e@@ -51,14 +55,15 @@\u003cbr\u003e \u003cbr\u003e A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[linear algebra]], writing \u003cmath\u003e|\\psi\\rangle\u003c\u002fmath\u003e {{gloss|ket [[psi (Greek)|psi]]}} for a vector labeled \u003cmath\u003e\\psi\u003c\u002fmath\u003e . Because a qubit is a two-state system, any qubit state takes the form \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e , where \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e are the standard ''basis states'',{{efn|The [[standard basis]] is also the ''computational basis''.{{sfn|Mermin|2007|p=18}}}} and \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e are the ''[[probability amplitude]]s,'' which are in general [[complex numbers]].{{sfn|Mermin|2007|p=17}} If either \u003cmath\u003e\\alpha\u003c\u002fmath\u003e or \u003cmath\u003e\\beta\u003c\u002fmath\u003e is zero, the qubit is effectively a classical bit; when both are nonzero, the qubit is in superposition. Such a [[quantum state vector]] acts similarly to a (classical) [[probability vector]], with one key difference: unlike probabilities, probability {{em|amplitudes}} are not necessarily positive numbers.{{sfn|Aaronson|2013|page=110}} Negative amplitudes allow for destructive wave interference.\u003cbr\u003e \u003cbr\u003e-When a qubit is [[quantum measurement|measured]] in the [[standard basis]], the result is a classical bit. The [[Born rule]] describes the [[norm-squared]] correspondence between amplitudes and probabilities{{mdash}}when measuring a qubit \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e, the state [[wave function collapse|collapses]] to \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\alpha|^2\u003c\u002fmath\u003e, or to \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\beta|^2\u003c\u002fmath\u003e.\u003cbr\u003e+When a qubit is [[quantum measurement|measured]] in the [[standard basis]], the result is a classical bit.\u003cbr\u003e+The [[Born rule]] describes the [[norm-squared]] correspondence between amplitudes and probabilities{{mdash}}when measuring a qubit \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e, the state [[wave function collapse|collapses]] to \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\alpha|^2\u003c\u002fmath\u003e, or to \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\beta|^2\u003c\u002fmath\u003e.\u003cbr\u003e Any valid qubit state has coefficients \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e such that \u003cmath\u003e|\\alpha|^2+|\\beta|^2 = 1\u003c\u002fmath\u003e.\u003cbr\u003e As an example, measuring the qubit \u003cmath\u003e1\u002f\\sqrt {2}|0\\rangle+1\u002f\\sqrt{2}|1\\rangle\u003c\u002fmath\u003e would produce either \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e or \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with equal probability.\u003cbr\u003e \u003cbr\u003e Each additional qubit doubles the [[dimension (vector space)|dimension]] of the [[state space (physics)|state space]].{{sfn|Mermin|2007|p=18}}\u003cbr\u003e As an example, the vector {{nowrap|{{sfrac|1|\u221a2}}{{ket|00}} + {{sfrac|1|\u221a2}}{{ket|01}}}} represents a two-qubit state, a [[tensor product]] of the qubit {{ket|0}} with the qubit {{nowrap|{{sfrac|1|\u221a2}}{{ket|0}} + {{sfrac|1|\u221a2}}{{ket|1}}}}.\u003cbr\u003e This vector inhabits a four-dimensional [[vector space]] spanned by the basis vectors {{ket|00}}, {{ket|01}}, {{ket|10}}, and {{ket|11}}.\u003cbr\u003e-The [[Bell state]] {{nowrap|{{sfrac|1|\u221a2}}{{ket|00}} + {{sfrac|1|\u221a2}}{{ket|11}}}} is impossible to decompose into the tensor product of two individual qubits{{mdash}}the two qubits are ''[[quantum entanglement|entangled]]'' because neither qubit has a state vector of its own.\u003cbr\u003e+The [[Bell state]] {{nowrap|{{sfrac|1|\u221a2}}{{ket|00}} + {{sfrac|1|\u221a2}}{{ket|11}}}} is impossible to decompose into the tensor product of two individual qubits{{mdash}}the two qubits are ''[[quantum entanglement|entangled]]'' because their probability amplitudes are [[correlated]].\u003cbr\u003e In general, the vector space for an ''n''-qubit system is 2\u003csup\u003e''n''\u003c\u002fsup\u003e-dimensional, and this makes it challenging for a classical computer to simulate a quantum one: representing a 100-qubit system requires storing 2\u003csup\u003e100\u003c\u002fsup\u003e classical values.\u003cbr\u003e \u003cbr\u003e === Unitary operators\u003cspan class=\"anchor\" id=\"gate-application\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e@@ -91,7 +96,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states, and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -101,9 +106,9 @@\u003cbr\u003e ==== Gate array {{anchor|Quantum circuit|Definition}} ====\u003cbr\u003e [[File:Quantum Toffoli Gate Implementation.svg|thumb|A quantum circuit diagram implementing a [[Toffoli gate]] from [[Quantum logic gate|more primitive gates]]|upright=1.15]]\u003cbr\u003e \u003cbr\u003e-A [[quantum circuit|quantum gate array]] decomposes computation into a sequence of few-qubit [[quantum gate]]s. A quantum computation can be described as a network of quantum logic gates and measurements. However, any measurement can be deferred to the end of quantum computation, though this deferment may come at a computational cost, so most quantum circuits depict a network consisting only of quantum logic gates and no measurements.\u003cbr\u003e-\u003cbr\u003e-Any quantum computation (which is, in the above formalism, any [[unitary matrix]] of size \u003cmath\u003e2^n \\times 2^n\u003c\u002fmath\u003e over \u003cmath\u003en\u003c\u002fmath\u003e qubits) can be represented as a network of quantum logic gates from a fairly small family of gates. A choice of gate family that enables this construction is known as a [[Quant
