u002fdocument\u002f365701 |location=Santa Fe, New Mexico, USA |publisher=IEEE Comput. Soc. Press |pages=116\u2013123 |doi=10.1109\u002fSFCS.1994.365701 |isbn=978-0-8186-6580-6 |s2cid=7457814}}\u003c\u002fref\u003e\u003cbr\u003e-These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e-\u003cbr\u003e-[[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e-[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and superconductors.{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e-In 1998, a two-qubit quantum computer demonstrated the feasibility of the technology,\u003cref\u003e{{cite journal |last1=Chuang |first1=Isaac L. |last2=Gershenfeld |first2=Neil |last3=Kubinec |first3=Markdoi |date=April 1998 |title=Experimental Implementation of Fast Quantum Searching |journal=Physical Review Letters |publisher=[[American Physical Society]] |volume=80 |issue=15 |pages=3408\u20133411 |bibcode=1998PhRvL..80.3408C |doi=10.1103\u002fPhysRevLett.80.3408}}\u003c\u002fref\u003e\u003cref\u003e{{cite news |last=Holton |first=William Coffeen |title=quantum computer |url=https:\u002f\u002fwww.britannica.com\u002ftechnology\u002fquantum-computer |access-date=4 Dec 2021 |newspaper=Encyclopedia Britannica |publisher=[[Encyclop\u00e6dia Britannica]]}}\u003c\u002fref\u003e and subsequent experiments have increased the number of qubits and reduced error rates.{{sfn|Grumbling|Horowitz|2019 |pp=164-169}}\u003cbr\u003e-\u003cbr\u003e-In 2019, [[Google AI]] and [[NASA]] announced that they had achieved [[quantum supremacy]] with a 54-qubit machine, performing a computation that is impossible for any classical computer.\u003cref\u003e{{Cite journal |last=Gibney |first=Elizabeth |date=2019-10-23 |title=Hello quantum world! Google publishes landmark quantum supremacy claim |journal=Nature |language=en |volume=574 |issue=7779 |pages=461\u2013462 |doi=10.1038\u002fd41586-019-03213-z |pmid=31645740 |bibcode=2019Natur.574..461G |doi-access=free}}\u003c\u002fref\u003e\u003cref name=\"1910.11333\"\u003eLay summary: {{cite journal |url=https:\u002f\u002fai.googleblog.com\u002f2019\u002f10\u002fquantum-supremacy-using-programmable.html |title=Quantum Supremacy Using a Programmable Superconducting Processor |journal=Nature |publisher=[[Google AI]] |first1=John |last1=Martinis |first2=Sergio |last2=Boixo |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822 |access-date=2022-04-27}}\u003cbr \u002f\u003e{{*}}Journal article: {{cite journal |last1=Arute |first1=Frank |last2=Arya |first2=Kunal |last3=Babbush |first3=Ryan |last4=Bacon |first4=Dave |last5=Bardin |first5=Joseph C. |last6=Barends |first6=Rami |last7=Biswas |first7=Rupak |last8=Boixo |first8=Sergio |last9=Brandao |first9=Fernando G. S. L. |last10=Buell |first10=David A. |last11=Burkett |first11=Brian |first15=Roberto |first57=Murphy Yuezhen |last64=Rubin |first63=Pedram |last63=Roushan |first62=Eleanor G. |last62=Rieffel |first61=Chris |last61=Quintana |first60=John C. |last60=Platt |first59=Andre |last59=Petukhov |first58=Eric |last58=Ostby |last57=Niu |last65=Sank |first56=Charles |last56=Neill |first55=Matthew |last55=Neeley |first54=Ofer |last54=Naaman |first53=Josh |last53=Mutus |first52=Masoud |last52=Mohseni |first51=Kristel |last51=Michielsen |first50=Xiao |last50=Mi |first64=Nicholas C. |first65=Daniel |last49=Megrant |last74=Yeh |last12=Chen |first12=Yu |last13=Chen |first13=Zijun |last14=Chiaro |first14=Ben |first77=John M. |last77=Martinis |first76=Hartmut |last76=Neven |first75=Adam |last75=Zalcman |first74=Ping |first73=Z. Jamie |last66=Satzinger |last73=Yao |first72=Theodore |last72=White |first71=Benjamin |last71=Villalonga |first70=Amit |last70=Vainsencher |first69=Matthew D. |last69=Trevithick |first68=Kevin J. |last68=Sung |first67=Vadim |last67=Smelyanskiy |first66=Kevin J. |first49=Anthony |first48=Matthew |last16=Courtney |last24=Guerin |first30=Trent |last30=Huang |first29=Markus |last29=Hoffman |first28=Alan |last28=Ho |first27=Michael J. |last27=Hartmann |first26=Matthew P. |last26=Harrigan |first25=Steve |last25=Habegger |first24=Keith |first23=Rob |first31=Travis S. |last23=Graff |first22=Marissa |last22=Giustina |first21=Craig |last21=Gidney |first20=Austin |last20=Fowler |first19=Brooks|last19=Foxen |first18=Edward |last18=Farhi |first17=Andrew |last17=Dunsworsth |first16=William |last31=Humble |last32=Isakov |last48=McEwen |first40=Alexander |first47=Jarrod R. |last47=McClean |first46=Salvatore |last46=Mandr\u00e0 |first45=Dmitry |last45=Lyakh |first44=Erik |last44=Lucero |first43=Mike |last43=Lindmark |first42=David |last42=Landhuis |first41=Fedor |last15=Collins |last40=Korotov |first32=Sergei V. |first39=Sergey |last39=Knysh |first38=Paul V. |last38=Klimov |first37=Julian |last37=Kelly |first36=Kostyantyn |last36=Kechedzhi |first35=Dvir |last35=Kafri |first34=Zhang |last34=Jiang |first33=Evan |last33=Jeffery |last41=Kostritsa |display-authors=5 |title=Quantum supremacy using a programmable superconducting processor |journal=Nature |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |last=Aaronson |first=Scott |date=2019-10-30 |title=Opinion {{!}} Why Google's Quantum Supremacy Milestone Matters |url=https:\u002f\u002fwww.nytimes.com\u002f2019\u002f10\u002f30\u002fopinion\u002fgoogle-quantum-computer-sycamore.html |access-date=2021-09-25 |work=The New York Times |issn=0362-4331}}\u003c\u002fref\u003e However, the validity of this claim is still being actively researched.\u003cref\u003e{{cite web |last=Pednault |first=Edwin |date=22 October 2019 |title=On 'Quantum Supremacy' |url=https:\u002f\u002fwww.ibm.com\u002fblogs\u002fresearch\u002f2019\u002f10\u002fon-quantum-supremacy\u002f |access-date=9 February 2021 |website=IBM Research Blog}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last1=Pan |first1=Feng |last2=Zhang |first2=Pan |date=2021-03-04 |title=Simulating the Sycamore quantum supremacy circuits |class=quant-ph |eprint=2103.03074}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Quantum information processing ==\u003cbr\u003e {{See also|Introduction to quantum mechanics}}","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -13,6 +13,26 @@\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e+\u003cbr\u003e+== History ==\u003cbr\u003e+{{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e+\u003cbr\u003e+For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain perplexing physical phenomena observed at atomic scales,\u003cref name=\"Zwiebach2022\"\u003e{{cite book|first=Barton |last=Zwiebach |title=Mastering Quantum Mechanics: Essentials, Theory, and Applications |author-link=Barton Zwiebach |publisher=MIT Press |year=2022 |isbn=978-0-262-04613-8 |at=\u00a71 |quote=Quantum physics has replaced classical physics as the correct fundamental description of our physical universe. It is used routinely to describe most phenomena that occur at short distances. [...] The era of quantum physics began in earnest in 1925 with the discoveries of Erwin Schr\u00f6dinger and Werner Heisenberg. The seeds for these discoveries were planted by Max Planck, Albert Einstein, Niels Bohr, Louis de Broglie, and others.}}\u003c\u002fref\u003e\u003cref\u003e{{cite book|first=Steven |last=Weinberg |author-link=Steven Weinberg |title=Lectures on Quantum Mechanics |year=2015 |publisher=Cambridge University Press |edition=2nd |isbn=978-1-107-11166-0|chapter=Historical Introduction |pages=1\u201330}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |author-link=Andrew Hodges |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul |author-link=Paul Benioff |year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e+When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |author-link=Yuri Manin |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |author-link=Richard Feynman |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e+In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[Quantum algorithm]]s then emerged for solving [[oracle machine|oracle problems]], such as [[Deutsch's algorithm]] in 1985,\u003cref\u003e{{Cite journal |date=1985-07-08 |title=Quantum theory, the Church\u2013Turing principle and the universal quantum computer |journal=Proceedings of the Royal Society of London. A. Mathematical and Physical Sciences |language=en |volume=400 |issue=1818 |pages=97\u2013117 |doi=10.1098\u002frspa.1985.0070 |bibcode=1985RSPSA.400...97D |s2cid=1438116 |issn=0080-4630|last1=Deutsch |first1=D. }}\u003c\u002fref\u003e the [[Bernstein{{en dash}}Vazirani algorithm]] in 1993,\u003cref\u003e{{Cite book |last1=Bernstein |first1=Ethan |title=Proceedings of the twenty-fifth annual ACM symposium on Theory of computing \u2013 STOC '93 |last2=Vazirani |first2=Umesh |date=1993 |publisher=ACM Press |isbn=978-0-89791-591-5 |location=San Diego, California, United States |pages=11\u201320 |language=en |chapter=Quantum complexity theory |doi=10.1145\u002f167088.167097 |chapter-url=http:\u002f\u002fportal.acm.org\u002fcitation.cfm?doid=167088.167097 |s2cid=676378}}\u003c\u002fref\u003e and [[Simon's algorithm]] in 1994.\u003cref\u003e{{Cite book |last=Simon |first=D. R. |title=Proceedings 35th Annual Symposium on Foundations of Computer Science |chapter=On the power of quantum computation |date=1994 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f365701 |location=Santa Fe, New Mexico, USA |publisher=IEEE Comput. Soc. Press |pages=116\u2013123 |doi=10.1109\u002fSFCS.1994.365701 |isbn=978-0-8186-6580-6 |s2cid=7457814}}\u003c\u002fref\u003e\u003cbr\u003e+These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e+\u003cbr\u003e+[[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e+[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and superconductors.{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e+In 1998, a two-qubit quantum computer demonstrated the feasibility of the technology,\u003cref\u003e{{cite journal |last1=Chuang |first1=Isaac L. |last2=Gershenfeld |first2=Neil |last3=Kubinec |first3=Markdoi |date=April 1998 |title=Experimental Implementation of Fast Quantum Searching |journal=Physical Review Letters |publisher=[[American Physical Society]] |volume=80 |issue=15 |pages=3408\u20133411 |bibcode=1998PhRvL..80.3408C |doi=10.1103\u002fPhysRevLett.80.3408}}\u003c\u002fref\u003e\u003cref\u003e{{cite news |last=Holton |first=William Coffeen |title=quantum computer |url=https:\u002f\u002fwww.britannica.com\u002ftechnology\u002fquantum-computer |access-date=4 Dec 2021 |newspaper=Encyclopedia Britannica |publisher=[[Encyclop\u00e6dia Britannica]]}}\u003c\u002fref\u003e and subsequent experiments have increased the number of qubits and reduced error rates.{{sfn|Grumbling|Horowitz|2019 |pp=164-169}}\u003cbr\u003e+\u003cbr\u003e+In 2019, [[Google AI]] and [[NASA]] announced that they had achieved [[quantum supremacy]] with a 54-qubit machine, performing a computation that is impossible for any classical computer.\u003cref\u003e{{Cite journal |last=Gibney |first=Elizabeth |date=2019-10-23 |title=Hello quantum world! Google publishes landmark quantum supremacy claim |journal=Nature |language=en |volume=574 |issue=7779 |pages=461\u2013462 |doi=10.1038\u002fd41586-019-03213-z |pmid=31645740 |bibcode=2019Natur.574..461G |doi-access=free}}\u003c\u002fref\u003e\u003cref name=\"1910.11333\"\u003eLay summary: {{cite journal |url=https:\u002f\u002fai.googleblog.com\u002f2019\u002f10\u002fquantum-supremacy-using-programmable.html |title=Quantum Supremacy Using a Programmable Superconducting Processor |journal=Nature |publisher=[[Google AI]] |first1=John |last1=Martinis |first2=Sergio |last2=Boixo |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822 |access-date=2022-04-27}}\u003cbr \u002f\u003e{{*}}Journal article: {{cite journal |last1=Arute |first1=Frank |last2=Arya |first2=Kunal |last3=Babbush |first3=Ryan |last4=Bacon |first4=Dave |last5=Bardin |first5=Joseph C. |last6=Barends |first6=Rami |last7=Biswas |first7=Rupak |last8=Boixo |first8=Sergio |last9=Brandao |first9=Fernando G. S. L. |last10=Buell |first10=David A. |last11=Burkett |first11=Brian |first15=Roberto |first57=Murphy Yuezhen |last64=Rubin |first63=Pedram |last63=Roushan |first62=Eleanor G. |last62=Rieffel |first61=Chris |last61=Quintana |first60=John C. |last60=Platt |first59=Andre |last59=Petukhov |first58=Eric |last58=Ostby |last57=Niu |last65=Sank |first56=Charles |last56=Neill |first55=Matthew |last55=Neeley |first54=Ofer |last54=Naaman |first53=Josh |last53=Mutus |first52=Masoud |last52=Mohseni |first51=Kristel |last51=Michielsen |first50=Xiao |last50=Mi |first64=Nicholas C. |first65=Daniel |last49=Megrant |last74=Yeh |last12=Chen |first12=Yu |last13=Chen |first13=Zijun |last14=Chiaro |first14=Ben |first77=John M. |last77=Martinis |first76=Hartmut |last76=Neven |first75=Adam |last75=Zalcman |first74=Ping |first73=Z. Jamie |last66=Satzinger |last73=Yao |first72=Theodore |last72=White |first71=Benjamin |last71=Villalonga |first70=Amit |last70=Vainsencher |first69=Matthew D. |last69=Trevithick |first68=Kevin J. |last68=Sung |first67=Vadim |last67=Smelyanskiy |first66=Kevin J. |first49=Anthony |first48=Matthew |last16=Courtney |last24=Guerin |first30=Trent |last30=Huang |first29=Markus |last29=Hoffman |first28=Alan |last28=Ho |first27=Michael J. |last27=Hartmann |first26=Matthew P. |last26=Harrigan |first25=Steve |last25=Habegger |first24=Keith |first23=Rob |first31=Travis S. |last23=Graff |first22=Marissa |last22=Giustina |first21=Craig |last21=Gidney |first20=Austin |last20=Fowler |first19=Brooks|last19=Foxen |first18=Edward |last18=Farhi |first17=Andrew |last17=Dunsworsth |first16=William |last31=Humble |last32=Isakov |last48=McEwen |first40=Alexander |first47=Jarrod R. |last47=McClean |first46=Salvatore |last46=Mandr\u00e0 |first45=Dmitry |last45=Lyakh |first44=Erik |last44=Lucero |first43=Mike |last43=Lindmark |first42=David |last42=Landhuis |first41=Fedor |last15=Collins |last40=Korotov |first32=Sergei V. |first39=Sergey |last39=Knysh |first38=Paul V. |last38=Klimov |first37=Julian |last37=Kelly |first36=Kostyantyn |last36=Kechedzhi |first35=Dvir |last35=Kafri |first34=Zhang |last34=Jiang |first33=Evan |last33=Jeffery |last41=Kostritsa |display-authors=5 |title=Quantum supremacy using a programmable superconducting processor |journal=Nature |date=October 23, 2019 |volume=574 |issue=7779 |pages=505\u2013510 |doi=10.1038\u002fs41586-019-1666-5 |pmid=31645734 |arxiv=1910.11333 |bibcode=2019Natur.574..505A |s2cid=204836822}}\u003c\u002fref\u003e\u003cref\u003e{{Cite news |last=Aaronson |first=Scott |date=2019-10-30 |title=Opinion {{!}} Why Google's Quantum Supremacy Milestone Matters |url=https:\u002f\u002fwww.nytimes.com\u002f2019\u002f10\u002f30\u002fopinion\u002fgoogle-quantum-computer-sycamore.html |access-date=2021-09-25 |work=The New York Times |issn=0362-4331}}\u003c\u002fref\u003e However, the validity of this claim is still being actively researched.\u003cref\u003e{{cite web |last=Pednault |first=Edwin |date=22 October 2019 |title=On 'Quantum Supremacy' |url=https:\u002f\u002fwww.ibm.com\u002fblogs\u002fresearch\u002f2019\u002f10\u002fon-quantum-supremacy\u002f |access-date=9 February 2021 |website=IBM Research Blog}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last1=Pan |first1=Feng |last2=Zhang |first2=Pan |date=2021-03-04 |title=Simulating the Sycamore quantum supremacy circuits |class=quant-ph |eprint=2103.03074}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Quantum information processing ==\u003cbr\u003e {{See also|Introduction to quantum mechanics}}","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -148,16 +148,14 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-=== Simulation of quantum systems ===\u003cbr\u003e-{{Main|Quantum simulation}}\u003cbr\u003e-\u003cbr\u003e-Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -165,34 +163,6 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e-\u003cbr\u003e-Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e-\u003cbr\u003e-=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-{{Main|Grover's algorithm}}\u003cbr\u003e-\u003cbr\u003e-The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e-#There is no searchable structure in the collection of possible answers,\u003cbr\u003e-#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e-#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e-\u003cbr\u003e-For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e-\u003cbr\u003e-[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Machine learning ===\u003cbr\u003e-{{Main|Quantum machine learning}}\u003cbr\u003e-\u003cbr\u003e-Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=2021-12-01 |title=Quantum computing based hybrid deep learning for fault diagnosis in electrical power systems |journal=Applied Energy |language=en |volume=303 |pages=117628 |doi=10.1016\u002fj.apenergy.2021.117628 |issn=0306-2619 |doi-access=free|bibcode=2021ApEn..30317628A }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-{{anchor|Computer-aided drug design and generative chemistry}}\u003cbr\u003e-Deep generative chemistry models emerge as powerful tools to expedite [[drug discovery]]. However, the immense size and complexity of the structural space of all possible drug-like molecules pose significant obstacles, which could be overcome in the future by quantum computers. Quantum computers are naturally good for solving complex quantum many-body problems\u003cref name=\"273.5278.1073\"\u002f\u003e and thus may be instrumental in applications involving quantum chemistry. Therefore, one can expect that quantum-enhanced generative models\u003cref\u003e{{cite journal |last1=Gao |first1=Xun |last2=Anschuetz |first2=Eric R. |last3=Wang |first3=Sheng-Tao |last4=Cirac |first4=J. Ignacio |last5=Lukin |first5=Mikhail D. |title=Enhancing Generative Models via Quantum Correlations |journal=Physical Review X |year=2022 |volume=12 |issue=2 |page=021037 |doi=10.1103\u002fPhysRevX.12.021037 |arxiv=2101.08354 |bibcode=2022PhRvX..12b1037G |s2cid=231662294}}\u003c\u002fref\u003e including quantum GANs\u003cref\u003e{{cite arXiv |last1=Li |first1=Junde |last2=Topaloglu |first2=Rasit |last3=Ghosh |first3=Swaroop |title=Quantum Generative Models for Small Molecule Drug Discovery |date=9 January 2021 |class=cs.ET |eprint=2101.03438}}\u003c\u002fref\u003e may eventually be developed into ultimate generative chemistry algorithms.\u003cbr\u003e \u003cbr\u003e == Engineering\u003cspan class=\"anchor\" id=\"Developing physical quantum computers\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e [[File:A Wafer of the Latest D-Wave Quantum Computers (39188583425).jpg|thumb|A [[wafer (electronics)|wafer]] of [[adiabatic quantum computer]]s]]","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -91,7 +91,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -148,14 +148,16 @@\u003cbr\u003e \u003c!-- Overview of quantum algorithms, particularly abstract routines with no explicit application --\u003e\u003cbr\u003e Progress in finding [[quantum algorithms]] typically focuses on this quantum circuit model, though exceptions like the [[Adiabatic quantum computation|quantum adiabatic algorithm]] exist. Quantum algorithms can be roughly categorized by the type of speedup achieved over corresponding classical algorithms.\u003cref name=\"zoo\"\u003e{{cite web |author=Jordan |first=Stephen |date=14 October 2022 |title=Quantum Algorithm Zoo |url=http:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |url-status=live |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180429014516\u002fhttps:\u002f\u002fmath.nist.gov\u002fquantum\u002fzoo\u002f |archive-date=29 April 2018 |orig-year=22 April 2011}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered. Still, evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups. However, this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e+Quantum algorithms that offer more than a polynomial speedup over the best-known classical algorithm include Shor's algorithm for factoring and the related quantum algorithms for computing [[discrete logarithm]]s, solving [[Pell's equation]], and more generally solving the [[hidden subgroup problem]] for [[Abelian group|abelian]] finite groups.\u003cref name=\"zoo\"\u002f\u003e These algorithms depend on the primitive of the [[quantum Fourier transform]]. No mathematical proof has been found that shows that an equally fast classical algorithm cannot be discovered, but evidence suggests that this is unlikely.\u003cref\u003e{{Cite conference |last1=Aaronson |first1=Scott |last2=Arkhipov |first2=Alex |date=2011-06-06 |title=The computational complexity of linear optics |book-title=Proceedings of the forty-third annual ACM symposium on Theory of computing |language=en |location=[[San Jose, California]] |publisher=[[Association for Computing Machinery]] |pages=333\u2013342 |doi=10.1145\u002f1993636.1993682 |isbn=978-1-4503-0691-1 |author-link=Scott Aaronson |arxiv=1011.3245}}\u003c\u002fref\u003e Certain oracle problems like [[Simon's problem]] and the [[Bernstein\u2013Vazirani algorithm|Bernstein\u2013Vazirani problem]] do give provable speedups, though this is in the [[quantum complexity theory#Quantum query complexity|quantum query model]], which is a restricted model where lower bounds are much easier to prove and doesn't necessarily translate to speedups for practical problems.\u003cbr\u003e \u003cbr\u003e Other problems, including the simulation of quantum physical processes from chemistry and solid-state physics, the approximation of certain [[Jones polynomial]]s, and the [[quantum algorithm for linear systems of equations]] have quantum algorithms appearing to give super-polynomial speedups and are [[BQP]]-complete. Because these problems are BQP-complete, an equally fast classical algorithm for them would imply that ''no quantum algorithm'' gives a super-polynomial speedup, which is believed to be unlikely.{{sfn|Nielsen|Chuang|2010|p=42}}\u003cbr\u003e \u003cbr\u003e-Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for many problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e+Some quantum algorithms, like [[Grover's algorithm]] and [[amplitude amplification]], give polynomial speedups over corresponding classical algorithms.\u003cref name=\"zoo\"\u002f\u003e Though these algorithms give comparably modest quadratic speedup, they are widely applicable and thus give speedups for a wide range of problems.{{sfn|Nielsen|Chuang|2010|p=7}}\u003cbr\u003e+\u003cbr\u003e+=== Simulation of quantum systems ===\u003cbr\u003e+{{Main|Quantum simulation}}\u003cbr\u003e+\u003cbr\u003e+Since chemistry and nanotechnology rely on understanding quantum systems, and such systems are impossible to simulate in an efficient manner classically, [[Quantum simulator|quantum simulation]] may be an important application of quantum computing.\u003cref\u003e{{Cite magazine |url=http:\u002f\u002farchive.wired.com\u002fscience\u002fdiscoveries\u002fnews\u002f2007\u002f02\u002f72734 |title=The Father of Quantum Computing |magazine=Wired |first=Quinn |last=Norton |date=15 February 2007 }}\u003c\u002fref\u003e Quantum simulation could also be used to simulate the behavior of atoms and particles at unusual conditions such as the reactions inside a [[collider]].\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.ias.edu\u002fias-letter\u002fambainis-quantum-computing |title=What Can We Do with a Quantum Computer? |first=Andris |last=Ambainis |date=Spring 2014 |publisher=Institute for Advanced Study}}\u003c\u002fref\u003e In June 2023, IBM computer scientists reported that a quantum computer produced better results for a physics problem than a conventional supercomputer.\u003cref name=\"NYT-20230614\"\u003e{{cite news |last=Chang |first=Kenneth |date=14 June 2023 |title=Quantum Computing Advance Begins New Era, IBM Says \u2013 A quantum computer came up with better answers to a physics problem than a conventional supercomputer. |work=[[The New York Times]] |url=https:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |url-status=live |accessdate=15 June 2023 |archiveurl=https:\u002f\u002farchive.today\u002f20230614151835\u002fhttps:\u002f\u002fwww.nytimes.com\u002f2023\u002f06\u002f14\u002fscience\u002fibm-quantum-computing.html |archivedate=14 June 2023}}\u003c\u002fref\u003e\u003cref name=\"NAT-20230614\"\u003e{{cite journal |author=Kim, Youngseok |display-authors=et al. |title=Evidence for the utility of quantum computing before fault tolerance |date=14 June 2023 |journal=[[Nature (journal)|Nature]] |volume=618 |issue=7965 |pages=500\u2013505 |doi=10.1038\u002fs41586-023-06096-3 |pmid=37316724 |pmc=10266970 |bibcode=2023Natur.618..500K }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e About 2% of the annual global energy output is used for [[nitrogen fixation]] to produce [[ammonia]] for the [[Haber process]] in the agricultural fertilizer industry (even though naturally occurring organisms also produce ammonia). Quantum simulations might be used to understand this process and increase the energy efficiency of production.\u003cref\u003e{{Cite AV media |url=https:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20210215140237\u002fhttps:\u002f\u002fwww.youtube.com\u002fwatch?v=7susESgnDv8 |archive-date=15 February 2021 |url-status=bot: unknown |title=Lunch & Learn: Quantum Computing |publisher=[[Sibos (conference)|Sibos TV]] |via=YouTube |date=21 November 2018 |access-date=4 February 2021 |first=Andrea |last=Morello |author-link=Andrea Morello }}\u003c\u002fref\u003e It is expected that an early use of quantum computing will be modeling that improves the efficiency of the Haber\u2013Bosch process\u003cref\u003e{{Cite news |last1=Ruane |first1=Jonathan |last2=McAfee |first2=Andrew |last3=Oliver |first3=William D. |date=2022-01-01 |title=Quantum Computing for Business Leaders |work=Harvard Business Review |url=https:\u002f\u002fhbr.org\u002f2022\u002f01\u002fquantum-computing-for-business-leaders |access-date=2023-04-12 |issn=0017-8012}}\u003c\u002fref\u003e by the mid-2020s\u003cref\u003e{{Cite web |last1=Budde |first1=Florian |last2=Volz |first2=Daniel |date=July 12, 2019 |title=Quantum computing and the chemical industry {{!}} McKinsey |url=https:\u002f\u002fwww.mckinsey.com\u002findustries\u002fchemicals\u002four-insights\u002fthe-next-big-thing-quantum-computings-potential-impact-on-chemicals |access-date=2023-04-12 |website=www.mckinsey.com |publisher=McKinsey and Company}}\u003c\u002fref\u003e although some have predicted it will take longer.\u003cref\u003e{{Cite web |last=Bourzac |first=Katherine |date=October 30, 2017 |title=Chemistry is quantum computing's killer app |url=https:\u002f\u002fcen.acs.org\u002farticles\u002f95\u002fi43\u002fChemistry-quantum-computings-killer-app.html |access-date=2023-04-12 |website=cen.acs.org |publisher=American Chemical Society}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -163,6 +165,34 @@\u003cbr\u003e {{Main|Post-quantum cryptography}}\u003cbr\u003e \u003cbr\u003e A notable application of quantum computation is for [[cryptanalysis|attacks]] on cryptographic systems that are currently in use. [[Integer factorization]], which underpins the security of [[public key cryptography|public key cryptographic]] systems, is believed to be computationally infeasible with an ordinary computer for large integers if they are the product of few [[prime number]]s (e.g., products of two 300-digit primes).\u003cref\u003e{{cite journal |last=Lenstra |first=Arjen K. |url=http:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |title=Integer Factoring |journal=Designs, Codes and Cryptography |volume=19 |pages=101\u2013128 |year=2000 |doi=10.1023\u002fA:1008397921377 |issue=2\u002f3 |s2cid=9816153 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20150410234239\u002fhttp:\u002f\u002fsage.math.washington.edu\u002fedu\u002f124\u002fmisc\u002farjen_lenstra_factoring.pdf |archive-date=10 April 2015 }}\u003c\u002fref\u003e By comparison, a quantum computer could solve this problem exponentially faster using Shor's algorithm to find its factors.{{sfn|Nielsen|Chuang|2010|p=216}} This ability would allow a quantum computer to break many of the [[cryptography|cryptographic]] systems in use today, in the sense that there would be a [[polynomial time]] (in the number of digits of the integer) algorithm for solving the problem. In particular, most of the popular [[Asymmetric Algorithms|public key ciphers]] are based on the difficulty of factoring integers or the [[discrete logarithm]] problem, both of which can be solved by Shor's algorithm. In particular, the [[RSA (algorithm)|RSA]], [[Diffie\u2013Hellman]], and [[elliptic curve Diffie\u2013Hellman]] algorithms could be broken. These are used to protect secure Web pages, encrypted email, and many other types of data. Breaking these would have significant ramifications for electronic privacy and security.\u003cbr\u003e+\u003cbr\u003e+Identifying cryptographic systems that may be secure against quantum algorithms is an actively researched topic under the field of ''post-quantum cryptography''.\u003cref name=\"pqcrypto_survey\"\u003e{{cite book |doi=10.1007\u002f978-3-540-88702-7_1 |chapter=Introduction to post-quantum cryptography |title=Post-Quantum Cryptography |year=2009 |last1=Bernstein |first1=Daniel J. |pages=1\u201314 |isbn=978-3-540-88701-0 |place=Berlin, Heidelberg |publisher=Springer|s2cid=61401925 }}\u003c\u002fref\u003e\u003cref\u003eSee also [http:\u002f\u002fpqcrypto.org\u002f pqcrypto.org], a bibliography maintained by Daniel J. Bernstein and [[Tanja Lange]] on cryptography not known to be broken by quantum computing.\u003c\u002fref\u003e Some public-key algorithms are based on problems other than the integer factorization and discrete logarithm problems to which Shor's algorithm applies, like the [[McEliece cryptosystem]] based on a problem in [[coding theory]].\u003cref name=\"pqcrypto_survey\" \u002f\u003e\u003cref\u003e{{cite journal |last1=McEliece |first1=R. J. |title=A Public-Key Cryptosystem Based On Algebraic Coding Theory |journal=DSNPR |date=January 1978 |volume=44 |pages=114\u2013116 |url=http:\u002f\u002fipnpr.jpl.nasa.gov\u002fprogress_report2\u002f42-44\u002f44N.PDF |bibcode=1978DSNPR..44..114M}}\u003c\u002fref\u003e [[Lattice-based cryptography|Lattice-based cryptosystems]] are also not known to be broken by quantum computers, and finding a polynomial time algorithm for solving the [[dihedral group|dihedral]] [[hidden subgroup problem]], which would break many lattice based cryptosystems, is a well-studied open problem.\u003cref\u003e{{cite journal |last1=Kobayashi |first1=H. |last2=Gall |first2=F. L. |year=2006 |title=Dihedral Hidden Subgroup Problem: A Survey |journal=Information and Media Technologies |volume=1 |issue=1 |pages=178\u2013185 |doi=10.2197\u002fipsjdc.1.470 |doi-access=free}}\u003c\u002fref\u003e It has been proven that applying Grover's algorithm to break a [[Symmetric-key algorithm|symmetric (secret key) algorithm]] by brute force requires time equal to roughly 2\u003csup\u003e''n''\u002f2\u003c\u002fsup\u003e invocations of the underlying cryptographic algorithm, compared with roughly 2\u003csup\u003e''n''\u003c\u002fsup\u003e in the classical case,\u003cref name=bennett_1997\u003e{{cite journal |last1=Bennett |first1=Charles H. |last2=Bernstein |first2=Ethan |last3=Brassard |first3=Gilles |last4=Vazirani |first4=Umesh |title=Strengths and Weaknesses of Quantum Computing |journal=SIAM Journal on Computing |date=October 1997 |volume=26 |issue=5 |pages=1510\u20131523 |doi=10.1137\u002fs0097539796300933 |arxiv=quant-ph\u002f9701001 |bibcode=1997quant.ph..1001B |s2cid=13403194 }}\u003c\u002fref\u003e meaning that symmetric key lengths are effectively halved: AES-256 would have the same security against an attack using Grover's algorithm that AES-128 has against classical brute-force search (see ''[[Key size#Effect of quantum computing attacks on key strength|Key size]]'').\u003cbr\u003e+\u003cbr\u003e+=== Search problems\u003cspan class=\"anchor\" id=\"Quantum search\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+{{Main|Grover's algorithm}}\u003cbr\u003e+\u003cbr\u003e+The most well-known example of a problem that allows for a polynomial quantum speedup is ''unstructured search'', which involves finding a marked item out of a list of \u003cmath\u003en\u003c\u002fmath\u003e items in a database. This can be solved by Grover's algorithm using \u003cmath\u003eO(\\sqrt{n})\u003c\u002fmath\u003e queries to the database, quadratically fewer than the \u003cmath\u003e\\Omega(n)\u003c\u002fmath\u003e queries required for classical algorithms. In this case, the advantage is not only provable but also optimal: it has been shown that Grover's algorithm gives the maximal possible probability of finding the desired element for any number of oracle lookups. Many examples of provable quantum speedups for query problems are based on Grover's algorithm, including [[BHT algorithm|Brassard, H\u00f8yer, and Tapp's algorithm]] for finding collisions in two-to-one functions,\u003cref\u003e{{cite encyclopedia |year=2016 |title=Quantum Algorithm for the Collision Problem |encyclopedia=Encyclopedia of Algorithms |publisher=Springer |place=New York, New York |editor-last=Kao |editor-first=Ming-Yang |pages=1662\u20131664 |language=en |arxiv=quant-ph\u002f9705002 |doi=10.1007\u002f978-1-4939-2864-4_304 |isbn=978-1-4939-2864-4 |last2=H\u00f8yer |first2=Peter |last3=Tapp |first3=Alain |last1=Brassard |first1=Gilles |s2cid=3116149}}\u003c\u002fref\u003e and Farhi, Goldstone, and Gutmann's algorithm for evaluating NAND trees.\u003cref\u003e{{Cite journal |last1=Farhi |first1=Edward |last2=Goldstone |first2=Jeffrey |last3=Gutmann |first3=Sam |date=23 December 2008 |title=A Quantum Algorithm for the Hamiltonian NAND Tree |journal=Theory of Computing |language=EN |volume=4 |issue=1 |pages=169\u2013190 |doi=10.4086\u002ftoc.2008.v004a008 |s2cid=8258191 |issn=1557-2862 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Problems that can be efficiently addressed with Grover's algorithm have the following properties:\u003cref\u003e{{cite book |author=Williams |first=Colin P. |title=Explorations in Quantum Computing |publisher=[[Springer Science+Business Media|Springer]] |year=2011 |isbn=978-1-84628-887-6 |pages=242\u2013244}}\u003c\u002fref\u003e\u003cref\u003e{{cite arXiv |last=Grover| first=Lov| author-link=Lov Grover |title=A fast quantum mechanical algorithm for database search |date=29 May 1996| eprint=quant-ph\u002f9605043}}\u003c\u002fref\u003e\u003cbr\u003e+#There is no searchable structure in the collection of possible answers,\u003cbr\u003e+#The number of possible answers to check is the same as the number of inputs to the algorithm, and\u003cbr\u003e+#There exists a Boolean function that evaluates each input and determines whether it is the correct answer.\u003cbr\u003e+\u003cbr\u003e+For problems with all these properties, the running time of Grover's algorithm on a quantum computer scales as the square root of the number of inputs (or elements in the database), as opposed to the linear scaling of classical algorithms. A general class of problems to which Grover's algorithm can be applied\u003cref\u003e{{cite journal |last1=Ambainis |first1=Ambainis |title=Quantum search algorithms |journal=ACM SIGACT News |date=June 2004 |volume=35 |issue=2 |pages=22\u201335 |doi=10.1145\u002f992287.992296 |arxiv=quant-ph\u002f0504012 |bibcode=2005quant.ph..4012A |s2cid=11326499 }}\u003c\u002fref\u003e is a [[Boolean satisfiability problem]], where the ''database'' through which the algorithm iterates is that of all possible answers. An example and possible application of this is a [[Password cracking|password cracker]] that attempts to guess a password. Breaking [[Symmetric-key algorithm|symmetric ciphers]] with this algorithm is of interest to government agencies.\u003cref\u003e{{cite news |url=https:\u002f\u002fwww.washingtonpost.com\u002fworld\u002fnational-security\u002fnsa-seeks-to-build-quantum-computer-that-could-crack-most-types-of-encryption\u002f2014\u002f01\u002f02\u002f8fff297e-7195-11e3-8def-a33011492df2_story.html |title=NSA seeks to build quantum computer that could crack most types of encryption |first1=Steven |last1=Rich |first2=Barton |last2=Gellman |date=1 February 2014 |newspaper=The Washington Post}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Quantum annealing\u003cspan class=\"anchor\" id=\"Quantum annealing and adiabatic optimization\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+\u003cbr\u003e+[[Quantum annealing]] relies on the adiabatic theorem to undertake calculations. A system is placed in the ground state for a simple Hamiltonian, which slowly evolves to a more complicated Hamiltonian whose ground state represents the solution to the problem in question. The adiabatic theorem states that if the evolution is slow enough the system will stay in its ground state at all times through the process. {{anchor|Computational biology}}Adiabatic optimization may be helpful for solving [[computational biology]] problems.\u003cref\u003e{{cite journal |last1=Outeiral |first1=Carlos| last2=Strahm |first2=Martin |last3=Morris |first3=Garrett |last4=Benjamin |first4=Simon |last5=Deane |first5=Charlotte |last6=Shi |first6=Jiye |title=The prospects of quantum computing in computational molecular biology |journal=WIREs Computational Molecular Science |year=2021|volume=11|doi=10.1002\u002fwcms.1481 |arxiv=2005.12792 |s2cid=218889377 |doi-access=free}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Machine learning ===\u003cbr\u003e+{{Main|Quantum machine learning}}\u003cbr\u003e+\u003cbr\u003e+Since quantum computers can produce outputs that classical computers cannot produce efficiently, and since quantum computation is fundamentally linear algebraic, some express hope in developing quantum algorithms that can speed up [[machine learning]] tasks.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref\u003e{{Cite journal |last1=Biamonte |first1=Jacob |last2=Wittek |first2=Peter |last3=Pancotti |first3=Nicola |last4=Rebentrost |first4=Patrick |last5=Wiebe |first5=Nathan |last6=Lloyd |first6=Seth |date=September 2017 |title=Quantum machine learning |journal=Nature |language=en |volume=549 |issue=7671 |pages=195\u2013202 |doi=10.1038\u002fnature23474 |pmid=28905917 |arxiv=1611.09347 |bibcode=2017Natur.549..195B |s2cid=64536201 |issn=0028-0836}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+For example, the [[HHL Algorithm]], named after its discoverers Harrow, Hassidim, and Lloyd, is believed to provide speedup over classical counterparts.\u003cref name=\"preskill2018\"\u002f\u003e\u003cref name=\"Quantum algorithm for solving linear systems of equations by Harrow et al.\"\u003e{{Cite journal |arxiv=0811.3171 |last1=Harrow |first1=Aram |last2=Hassidim |first2=Avinatan |last3=Lloyd |first3=Seth |title=Quantum algorithm for solving linear systems of equations |journal=Physical Review Letters |volume=103 |issue=15 |page=150502 |year=2009 |doi=10.1103\u002fPhysRevLett.103.150502 |pmid=19905613 |bibcode=2009PhRvL.103o0502H |s2cid=5187993}}\u003c\u002fref\u003e Some research groups have recently explored the use of quantum annealing hardware for training [[Boltzmann machine]]s and [[deep neural networks]].\u003cref\u003e{{Cite journal |last1=Benedetti |first1=Marcello |last2=Realpe-G\u00f3mez |first2=John |last3=Biswas |first3=Rupak |last4=Perdomo-Ortiz |first4=Alejandro |date=9 August 2016 |title=Estimation of effective temperatures in quantum annealers for sampling applications: A case study with possible applications in deep learning |journal=Physical Review A |volume=94 |issue=2 |page=022308 |doi=10.1103\u002fPhysRevA.94.022308 |arxiv=1510.07611 |bibcode=2016PhRvA..94b2308B |doi-access=free}}\u003c\u002fref\u003e\u003cref\u003e{{Cite journal |last1=Ajagekar |first1=Akshay |last2=You |first2=Fengqi |date=5 December 2020 |title=Quantum computing assisted deep learning for fault detection and diagnosis in industrial process systems |journal=Computers & Chemical Engineering |language=en |volume=143 |page=107119 |arxiv=2003.00264 |s2cid=211678230 |doi=10.1016\u002fj.compchemeng.2020.107119 |issn=0098-1354}}\u003c
