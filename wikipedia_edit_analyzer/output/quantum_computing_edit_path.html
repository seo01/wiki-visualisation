\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BQP\\subsetneq BPP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e+The class of [[computational problem|problems]] that can be efficiently solved by a quantum computer with bounded error is called [[BQP]], for \"bounded error, quantum, polynomial time\". More formally, BQP is the class of problems that can be solved by a polynomial-time [[quantum Turing machine]] with an error probability of at most 1\u002f3. As a class of probabilistic problems, BQP is the quantum counterpart to [[Bounded-error probabilistic polynomial|BPP]] (\"bounded error, probabilistic, polynomial time\"), the class of problems that can be solved by polynomial-time [[probabilistic Turing machine]]s with bounded error.{{sfn|Nielsen|Chuang|2010|p=41}} It is known that \u003cmath\u003e\\mathsf{BPP\\subseteq BQP}\u003c\u002fmath\u003e and is widely suspected that \u003cmath\u003e\\mathsf{BQP\\subsetneq BPP}\u003c\u002fmath\u003e, which intuitively would mean that quantum computers are more powerful than classical computers in terms of [[time complexity]].{{sfn|Nielsen|Chuang|2010|p=201}}\u003cbr\u003e \u003cbr\u003e \u003c!-- Relation of BQP to basic complexity classes --\u003e\u003cbr\u003e [[File:BQP complexity class diagram.svg|thumb|The suspected relationship of BQP to several classical complexity classes{{sfn|Nielsen|Chuang|2010|p=42}}]]\u003cbr\u003e-The exact relationship of BQP to [[P (complexity)|P]], [[NP (complexity)|NP]], and [[PSPACE (complexity)|PSPACE]] is not known. However, it is known that \u003cmath\u003e\\mathsf{P\\subseteq BQP \\subseteq PSPACE}\u003c\u002fmath\u003e; that is, all problems that can be efficiently solved by a deterministic classical computer can also be efficiently solved by a quantum computer, and all problems that can be efficiently solved by a quantum computer can also be solved by a deterministic classical computer with polynomial space resources. It is further suspected that BQP is a strict superset of P, meaning there are problems that are efficiently solvable by quantum computers that are not efficiently solvable by deterministic classical computers. For instance, integer factorization and the [[discrete logarithm problem]] are known to be in BQP and are suspected to be outside of P. On the relationship of BQP to NP, little is known beyond the fact that some NP problems that are believed not to be in P are also in BQP (integer factorization and the discrete logarithm problem are both in NP, for example). It is suspected that \u003cmath\u003e\\mathsf{NP\\nsubseteq BQP}\u003c\u002fmath\u003e; that is, it is believed that there are efficiently checkable problems that are not efficiently solvable by a quantum computer. As a direct consequence of this belief, it is also suspected that BQP is disjoint from the class of [[NP-complete]] problems (if an NP-complete problem were in BQP, then it would follow from [[NP-hard]]ness that all problems in NP are in BQP).\u003cref name=BernVazi\u003e{{cite journal |last1=Bernstein |first1=Ethan |last2=Vazirani |first2=Umesh |doi=10.1137\u002fS0097539796300921 |title=Quantum Complexity Theory |year=1997 |pages=1411\u20131473 |volume=26 |journal=SIAM Journal on Computing |url=http:\u002f\u002fwww.cs.berkeley.edu\u002f~vazirani\u002fbv.ps |issue=5|citeseerx=10.1.1.144.7852 }}\u003c\u002fref\u003e\u003cbr\u003e+The exact relationship of BQP to [[P (complexity)|P]], [[NP (complexity)|NP]], and [[PSPACE (complexity)|PSPACE]] is not known. However, it is known that \u003cmath\u003e\\mathsf{P\\subseteq BQP \\subseteq PSPACE}\u003c\u002fmath\u003e; that is, all problems that can be efficiently solved by a deterministic classical computer can also be efficiently solved by a quantum computer, and all problems that can be efficiently solved by a quantum computer can also be solved by a deterministic classical computer with polynomial space resources. It is further suspected that BQP is a strict superset of P, meaning there are problems that are efficiently solvable by quantum computers that are not efficiently solvable by deterministic classical computers. For instance, [[integer factorization]] and the [[discrete logarithm problem]] are known to be in BQP and are suspected to be outside of P. On the relationship of BQP to NP, little is known beyond the fact that some NP problems that are believed not to be in P are also in BQP (integer factorization and the discrete logarithm problem are both in NP, for example). It is suspected that \u003cmath\u003e\\mathsf{NP\\nsubseteq BQP}\u003c\u002fmath\u003e; that is, it is believed that there are efficiently checkable problems that are not efficiently solvable by a quantum computer. As a direct consequence of this belief, it is also suspected that BQP is disjoint from the class of [[NP-complete]] problems (if an NP-complete problem were in BQP, then it would follow from [[NP-hard]]ness that all problems in NP are in BQP).\u003cref name=BernVazi\u003e{{cite journal |last1=Bernstein |first1=Ethan |last2=Vazirani |first2=Umesh |doi=10.1137\u002fS0097539796300921 |title=Quantum Complexity Theory |year=1997 |pages=1411\u20131473 |volume=26 |journal=SIAM Journal on Computing |url=http:\u002f\u002fwww.cs.berkeley.edu\u002f~vazirani\u002fbv.ps |issue=5|citeseerx=10.1.1.144.7852 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e {{Commons category|Quantum computing}}\u003cbr\u003e@@ -327,9 +333,7 @@\u003cbr\u003e *{{annotated link|Electronic quantum holography}}\u003cbr\u003e *{{annotated link|Glossary of quantum computing}}\u003cbr\u003e *{{annotated link|IARPA}}\u003cbr\u003e-*{{annotated link|India's quantum computer}}\u003cbr\u003e *{{annotated link|IonQ}}\u003cbr\u003e-*{{annotated link|IQM}}\u003cbr\u003e *{{annotated link|List of emerging technologies}}\u003cbr\u003e *{{annotated link|List of quantum processors}}\u003cbr\u003e *{{annotated link|Magic state distillation}}\u003cbr\u003e@@ -338,7 +342,6 @@\u003cbr\u003e *{{annotated link|Optical computing}}\u003cbr\u003e *{{annotated link|Quantum bus}}\u003cbr\u003e *{{annotated link|Quantum cognition}}\u003cbr\u003e-*{{annotated link|Quantum sensor}}\u003cbr\u003e *{{annotated link|Quantum volume}}\u003cbr\u003e *{{annotated link|Quantum weirdness}}\u003cbr\u003e *{{annotated link|Rigetti Computing}}\u003cbr\u003e@@ -363,14 +366,13 @@\u003cbr\u003e \u003cbr\u003e == Further reading ==\u003cbr\u003e {{refbegin|30em}}\u003cbr\u003e-\u003cbr\u003e ===Textbooks===\u003cbr\u003e * {{cite book |last=Akama |first=Seiki |year=2014 |title=Elements of Quantum Computing: History, Theories and Engineering Applications |publisher=Springer |isbn=978-3-319-08284-4 |oclc=884786739 |doi=10.1007\u002f978-3-319-08284-4 }}\u003cbr\u003e * {{cite book |last1=Benenti |first1=Giuliano |last2=Casati |first2=Giulio |last3=Rossini |first3=Davide |last4=Strini |first4=Giuliano |title=Principles of Quantum Computation and Information: A Comprehensive Textbook |edition=2nd |year=2019 |isbn=978-981-3237-23-0 |oclc=1084428655 |doi=10.1142\u002f10909 |s2cid=62280636 }}\u003cbr\u003e * {{cite book |last=Bernhardt |first=Chris |year=2019 |title=Quantum Computing for Everyone |publisher=MIT Press |oclc=1082867954 |isbn=978-0-262-35091-4 }}\u003cbr\u003e * {{cite book |last=Hidary |first=Jack D. |year=2021 |edition=2nd |title=Quantum Computing: An Applied Approach |oclc=1272953643 |isbn=978-3-03-083274-2 |doi=10.1007\u002f978-3-030-83274-2 |s2cid=238223274 }}\u003cbr\u003e * {{cite book |editor-last1=Hiroshi |editor-first1=Imai |editor-last2=Masahito |edito ctures on Quantum Computing given at Oxford University in July 2006]\u003cbr\u003e \u003cbr\u003e {{CPU technologies}}","--- Revision 50\u003cbr\u003e+++ Revision 51\u003cbr\u003e@@ -3,7 +3,9 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e+A '''quantum computer''' is a JoJo reference\u003cbr\u003e+\u003cbr\u003e+[[computer]] that exploits [[quantum mechanical]] phenomena. On smal  +3,7 @@\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]\u003cbr\u003e \u003cbr\u003e-A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e+A '''quantum computer''' is a [[computer]] that exploits [[quantum mechanical]] phenomena. On small scales, physical matter exhibits properties of [[wave-particle duality|both particles and waves]], and quantum computing leverages this behavior using specialized hardware. [[Classical physics]] cannot explain the operation of these quantum devices, and a scalable quantum computer could perform some calculations [[Exponential growth|exponentially]] faster{{efn|As used in this article, \"exponentially faster\" has a precise [[computational complexity|complexity theoretical]] meaning. Usually, it means that as a function of input size in bits, the best known classical algorithm for a problem requires an [[exponential growth|exponentially growing]] number of steps, while a quantum algorithm uses only a polynomial number of steps.}} than any modern \"classical\" computer. Theoretically a large-scale quantum computer could [[post-quantum cryptography|break some widely used encryption schemes]] and aid physicists in performing [[quantum simulator|physical simulations]]; however, the current state of the art is largely experimental and impractical, with several obstacles to useful applications.\u003cbr\u003e \u003cbr\u003e \u003c!-- Basic principles of quantum computing --\u003e\u003cbr\u003e The basic [[unit of information]] in quantum computing, the [[qubit]] (or \"quantum bit\"), serves the same function as the [[bit]] in classical computing. However, unlike a classical bit, which can be in one of two states (a [[Binary number|binary]]), a qubit can exist in a [[quantum superposition|superposition]] of its two \"basis\" states, which loosely means that it is in both states simultaneously. When [[measurement in quantum mechanics|measuring]] a qubit, the result is a [[Born rule|probabilistic output]] of a classical bit. If a quantum computer manipulates the qubit in a particular way, [[wave interference]] effects can amplify the desired measurement results. The design of [[quantum algorithms]] involves creating procedures that allow a quantum computer to perform calculations efficiently and quickly.","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -276,7 +276,7 @@\u003cbr\u003e * If [[quantum error correction]] is used to scale quantum computers to practical applications, its overhead may undermine speedup offered by many quantum algorithms.\u003cref name=CACM\u002f\u003e\u003cbr\u003e * Complexity analysis of algorithms sometimes makes abstract assumptions that do not hold in applications. For example, input data may not already be available encoded in quantum states, and \"oracle functions\" used in [[Grover's algorithm]] often have internal structure that can be exploited for faster algorithms.\u003cbr\u003e \u003cbr\u003e-In particular, building computers with large numbers of qubits may be futile if those qubits are not connected well enough and cannot maintain sufficiently high degree of entanglement for long time. When trying to outperform conventional computers, quantum computing researchers often look for new tasks that can be solved on quantum computers, but this leaves the possibility that efficient non-quantum techniques will be developed in response, as seen for [[Quantum supremacy]] demonstrations. Therefore, it is desirable to prove lower bounds on the complexity of best possible non-quantum algorithms (which may be unknown) and show that some quantum algorithms asymptomatically improve upon those bounds.\u003cbr\u003e+In particular, building computers with large numbers of qubits may be futile if those qubits are not connected well enough and cannot maintain sufficiently high degree of entanglement for a long time. When trying to outperform conventional computers, quantum computing researchers often look for new tasks that can be solved on quantum computers, but this leaves the possibility that efficient non-quantum techniques will be developed in response, as seen for [[Quantum supremacy]] demonstrations. Therefore, it is desirable to prove lower bounds on the complexity of best possible non-quantum algorithms (which may be unknown) and show that some quantum algorithms asymptomatically improve upon those bounds.\u003cbr\u003e \u003cbr\u003e Some researchers have expressed skepticism that scalable quantum computers could ever be built, typically because of the issue of maintaining coherence at large scales, but also for other reasons.\u003cbr\u003e ","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -12,15 +12,14 @@\u003cbr\u003e Quantum computers are not yet practical for real work. Physically engineering high-quality qubits has proven challenging. If a physical qubit is not sufficiently [[isolated system|isolated]] from its environment, it suffers from [[quantum decoherence]], introducing [[noise (signal processing)|noise]] into calculations. National governments have invested heavily in experimental research that aims to develop scalable qubits with longer coherence times and lower error rates. Example implementations include [[superconducting quantum computing|superconductors]] (which isolate an [[electrical current]] by eliminating [[electrical resistance]]) and [[trapped ion quantum computer|ion traps]] (which confine a single [[atom|atomic particle]] using [[electromagnetic fields]]).\u003cbr\u003e \u003cbr\u003e \u003c!-- Computability and complexity --\u003e\u003cbr\u003e-In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e+In principle, a classical computer can solve the same computational problems as a quantum computer, given enough time. Quantum advantage comes in the form of [[time complexity]] rather than [[computability]], and [[quantum complexity theory]] shows that some quantum algorithms are exponentially more efficient than the best-known classical algorithms. A large-scale quantum computer could in theory solve computational problems unsolvable by a classical computer in any reasonable amount of time. This concept of extra ability has been called \"[[quantum supremacy]]\". While such claims have drawn significant attention to the discipline, near-term practical use cases remain limited.\u003cbr\u003e \u003cbr\u003e == History ==\u003cbr\u003e {{For timeline|Timeline of quantum computing and communication}}\u003cbr\u003e \u003cbr\u003e For many years, the fields of [[quantum mechanics]] and [[computer science]] formed distinct academic communities.{{sfn|Aaronson|2013|p=132}} [[Modern quantum theory]] developed in the 1920s to explain the [[wave{{en dash}}particle duality]] observed at atomic scales,\u003cref\u003e{{Cite journal |last=Bhatta |first=Varun S. |date=2020-05-10 |title=Plurality of Wave\u2013Particle Duality |url=https:\u002f\u002fwww.currentscience.ac.in\u002fVolumes\u002f118\u002f09\u002f1365.pdf |journal=Current Science |language=en-US |volume=118 |issue=9 |pages=1365 |doi=10.18520\u002fcs\u002fv118\u002fi9\u002f1365-1374 |issn=0011-3891 |s2cid=216143449}}\u003c\u002fref\u003e and [[digital computers]] emerged in the following decades to replace [[human computers]] for tedious calculations.\u003cref\u003e{{Cite book |last=Ceruzzi |first=Paul E. |title=Computing: A Concise History |date=2012 |isbn=978-0-262-31038-3 |publisher=MIT Press |location=[[Cambridge, Massachusetts]] |pages=3, 46 |language=en-US |oclc=796812982}}\u003c\u002fref\u003e Both disciplines had practical applications during [[World War II]]; computers played a major role in [[World War II cryptography|wartime cryptography]],\u003cref\u003e{{Cite book |last=Hodges |first=Andrew |title=Alan Turing: The Enigma |publisher=[[Princeton University Press]] |year=2014 |isbn=9780691164724 |location=Princeton, New Jersey |page=xviii |language=en-US}}\u003c\u002fref\u003e and quantum physics was essential for [[nuclear physics]] used in the [[Manhattan Project]].\u003cref\u003e{{Cite journal |last=M\u00e5rtensson-Pendrill |first=Ann-Marie |date=2006-11-01 |title=The Manhattan project\u2014a part of physics history |journal=Physics Education |language=en-US |volume=41 |issue=6 |pages=493\u2013501 |bibcode=2006PhyEd..41..493M |doi=10.1088\u002f0031-9120\u002f41\u002f6\u002f001 |issn=0031-9120 |s2cid=120294023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge.\u003cbr\u003e-In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul|year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e+As [[physicists]] applied quantum mechanical models to computational problems and swapped digital [[bit]]s for [[qubits]], the fields of quantum mechanics and computer science began to converge. In 1980, [[Paul Benioff]] introduced the [[quantum Turing machine]], which uses quantum theory to describe a simplified computer.\u003cref name=\"The computer as a physical system\"\u003e{{cite journal|last1=Benioff|first1=Paul|year=1980|title=The computer as a physical system: A microscopic quantum mechanical Hamiltonian model of computers as represented by Turing machines|journal=Journal of Statistical Physics|volume=22|issue=5|pages=563\u2013591|bibcode=1980JSP....22..563B|doi=10.1007\u002fbf01011339|s2cid=122949592}}\u003c\u002fref\u003e\u003cbr\u003e When digital computers became faster, physicists faced an [[exponential time|exponential]] increase in overhead when [[simulating quantum dynamics]],\u003cref\u003e{{Cite journal |last1=Buluta |first1=Iulia |last2=Nori |first2=Franco |date=2009-10-02 |title=Quantum Simulators |journal=Science |language=en |volume=326 |issue=5949 |pages=108\u2013111 |doi=10.1126\u002fscience.1177838 |pmid=19797653 |bibcode=2009Sci...326..108B |s2cid=17187000 |issn=0036-8075}}\u003c\u002fref\u003e prompting [[Yuri Manin]] and [[Richard Feynman]] to independently suggest that hardware based on quantum phenomena might be more efficient for computer simulation.\u003cref name=\"manin1980vychislimoe\"\u003e{{cite book |author=Manin |first=Yu. I. |url=http:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5bdjv-fax%5d.zip |title=Vychislimoe i nevychislimoe |publisher=Soviet Radio |year=1980 |pages=13\u201315 |language=ru |trans-title=Computable and Noncomputable |access-date=4 March 2013 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130510173823\u002fhttp:\u002f\u002fpubl.lib.ru\u002fARCHIVES\u002fM\u002fMANIN_Yuriy_Ivanovich\u002fManin_Yu.I._Vychislimoe_i_nevychislimoe.(1980).%5Bdjv%5D.zip |archive-date=10 May 2013 |url-status=dead}}\u003c\u002fref\u003e\u003cref\u003e{{cite journal |last1=Feynman |first1=Richard |title=Simulating Physics with Computers |journal=International Journal of Theoretical Physics |date=June 1982 |volume=21 |issue=6\u002f7 |pages=467\u2013488 |doi=10.1007\u002fBF02650179 |url=https:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |access-date=28 February 2019 |bibcode=1982IJTP...21..467F |s2cid=124545445 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20190108115138\u002fhttps:\u002f\u002fpeople.eecs.berkeley.edu\u002f~christos\u002fclassics\u002fFeynman.pdf |archive-date=8 January 2019 |url-status=dead}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010|p=214}}\u003cbr\u003e In a 1984 paper, [[Charles H. Bennett (physicist)|Charles Bennett]] and [[Gilles Brassard]] applied quantum theory to [[cryptography]] protocols and demonstrated that quantum key distribution could enhance [[information security]].\u003cref name=\"bb84\"\u003e{{Cite conference |last1=Bennett |first1=Charles H. |author-link1=Charles H. Bennett (physicist) |last2=Brassard |first2=Gilles |author-link2=Gilles Brassard |date=December 1984 |title=Quantum cryptography: Public key distribution and coin tossing |conference=IEEE International Conference on Computers, Systems & Signal Processing |language=en |location=Bangalore, India |pages=175\u2013179 |arxiv=2003.06557 |doi=10.1016\u002fj.tcs.2014.05.025}}\u003c\u002fref\u003e\u003cref name=\"personal\"\u003e{{Cite book |last=Brassard |first=G. |title=IEEE Information Theory Workshop on Theory and Practice in Information-Theoretic Security, 2005 |chapter=Brief history of quantum cryptography: A personal perspective |date=2005 |chapter-url=https:\u002f\u002fieeexplore.ieee.org\u002fdocument\u002f1543949 |location=Awaji Island, Japan |publisher=IEEE |pages=19\u201323 |doi=10.1109\u002fITWTPI.2005.1543949 |arxiv=quant-ph\u002f0604072 |isbn=978-0-7803-9491-9|s2cid=16118245 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -28,8 +27,7 @@\u003cbr\u003e These algorithms did not solve practical problems, but demonstrated mathematically that one could gain more information by querying a [[black box]] with a quantum state in [[quantum superposition|superposition]], sometimes referred to as ''quantum parallelism''.{{sfn|Nielsen|Chuang|2010|p=30-32}}\u003cbr\u003e \u003cbr\u003e [[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e-[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing.{{sfn|Grumbling|Horowitz|2019|p=15}}\u003cbr\u003e-In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e+[[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\u003e{{Cite journal |last1=Cao |first1=Yudong |last2=Romero |first2=Jonathan |last3=Olson |first3=Jonathan P. |last4=Degroote |first4=Matthias |last5=Johnson |first5=Peter D. |last6=Kieferov\u00e1 |first6=M\u00e1ria |last7=Kivlichan |first7=Ian D. |last8=Menke |first8=Tim |last9=Peropadre |first9=Borja |last10=Sawaya |first10=Nicolas P. D. |last11=Sim |first11=Sukin |last12=Veis |first12=Libor |last13=Aspuru-Guzik |first13=Al\u00e1n |date=2019-10-09 |title=Quantum Chemistry in the Age of Quantum Computing |journal=Chemical Reviews |language=en-US |volume=119 |issue=19 |pages=10856\u201310915 |arxiv=1812.09976 |doi=10.1021\u002facs.chemrev.8b00803 |issn=0009-2665 |pmid=31469277 |s2cid=119417908 |display-authors=5}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Over the years, [[experimental physics|experimentalists]] have constructed small-scale quantum computers using [[trapped ion quantum computer|trapped ions]] and [[superconducting quantum computing|superconductors]].{{sfn|Grumbling|Horowitz|2019|pp=164-169}}\u003cbr\u003e In 1998, a two-qubit quantum computer demonstrated the feasibility of the technology,\u003cref\u003e{{cite journal |last1=Chuang |first1=Isaac L. |last2=Gershenfeld |first2=Neil |last3=Kubinec |first3=Markdoi |date=April 1998 |title=Experimental Implementation of Fast Quantum Searching |journal=Physical Review Letters |publisher=[[American Physical Society]] |volume=80 |issue=15 |pages=3408\u20133411 |bibcode=1998PhRvL..80.3408C |doi=10.1103\u002fPhysRevLett.80.3408}}\u003c\u002fref\u003e\u003cref\u003e{{cite news |last=Holton |first=William Coffeen |title=quantum computer |url=https:\u002f\u002fwww.britannica.com\u002ftechnology\u002fquantum-computer |access-date=4 Dec 2021 |newspaper=Encyclopedia Britannica |publisher=[[Encyclop\u00e6dia Britannica]]}}\u003c\u002fref\u003e and subsequent experiments have increased the number of qubits and reduced error rates.{{sfn|Grumbling|Horowitz|2019 |pp=164-169}}\u003cbr\u003e@@ -55,8 +53,7 @@\u003cbr\u003e \u003cbr\u003e A two-dimensional [[vector (mathematics and physics)|vector]] mathematically represents a qubit state. Physicists typically use [[Dirac notation]] for quantum mechanical [[linear algebra]], writing \u003cmath\u003e|\\psi\\rangle\u003c\u002fmath\u003e {{gloss|ket [[psi (Greek)|psi]]}} for a vector labeled \u003cmath\u003e\\psi\u003c\u002fmath\u003e . Because a qubit is a two-state system, any qubit state takes the form \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e , where \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e are the standard ''basis states'',{{efn|The [[standard basis]] is also the ''computational basis''.{{sfn|Mermin|2007|p=18}}}} and \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e are the ''[[probability amplitude]]s,'' which are in general [[complex numbers]].{{sfn|Mermin|2007|p=17}} If either \u003cmath\u003e\\alpha\u003c\u002fmath\u003e or \u003cmath\u003e\\beta\u003c\u002fmath\u003e is zero, the qubit is effectively a classical bit; when both are nonzero, the qubit is in superposition. Such a [[quantum state vector]] acts similarly to a (classical) [[probability vector]], with one key difference: unlike probabilities, probability {{em|amplitudes}} are not necessarily positive numbers.{{sfn|Aaronson|2013|page=110}} Negative amplitudes allow for destructive wave interference.\u003cbr\u003e \u003cbr\u003e-When a qubit is [[quantum measurement|measured]] in the [[standard basis]], the result is a classical bit.\u003cbr\u003e-The [[Born rule]] describes the [[norm-squared]] correspondence between amplitudes and probabilities{{mdash}}when measuring a qubit \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e, the state [[wave function collapse|collapses]] to \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\alpha|^2\u003c\u002fmath\u003e, or to \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\beta|^2\u003c\u002fmath\u003e.\u003cbr\u003e+When a qubit is [[quantum measurement|measured]] in the [[standard basis]], the result is a classical bit. The [[Born rule]] describes the [[norm-squared]] correspondence between amplitudes and probabilities{{mdash}}when measuring a qubit \u003cmath\u003e\\alpha|0\\rangle+\\beta|1\\rangle\u003c\u002fmath\u003e, the state [[wave function collapse|collapses]] to \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\alpha|^2\u003c\u002fmath\u003e, or to \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with probability \u003cmath\u003e|\\beta|^2\u003c\u002fmath\u003e.\u003cbr\u003e Any valid qubit state has coefficients \u003cmath\u003e\\alpha\u003c\u002fmath\u003e and \u003cmath\u003e\\beta\u003c\u002fmath\u003e such that \u003cmath\u003e|\\alpha|^2+|\\beta|^2 = 1\u003c\u002fmath\u003e.\u003cbr\u003e As an example, measuring the qubit \u003cmath\u003e1\u002f\\sqrt {2}|0\\rangle+1\u002f\\sqrt{2}|1\\rangle\u003c\u002fmath\u003e would produce either \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e or \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e with equal probability.\u003cbr\u003e \u003cbr\u003e@@ -96,7 +93,7 @@\u003cbr\u003e \u003cbr\u003e === Quantum parallelism ===\u003cbr\u003e \u003cbr\u003e-''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states, and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e+''Quantum parallelism'' is the heuristic that quantum computers can be thought of as evaluating a function for multiple input values simultaneously. This can be achieved by preparing a quantum system in a superposition of input states and applying a unitary transformation that encodes the function to be evaluated. The resulting state encodes the function's output values for all input values in the superposition, allowing for the computation of multiple outputs simultaneously. This property is key to the speedup of many quantum algorithms. However, \"parallelism\" in this sense is insufficient to speed up a computation, because the measurement at the end of the computation gives only one value. To be useful, a quantum algorithm must also incorporate some other conceptual ingredient.{{sfn|Nielsen|Chuang|2010|p=30\u201332}}{{sfn|Mermin|2007|pp=38\u201339}}\u003cbr\u003e \u003cbr\u003e === Quantum programming\u003cspan class=\"anchor\" id=\"Models of computation for quantum computing\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e {{Further|Quantum programming}}\u003cbr\u003e@@ -119,7 +116,7 @@\u003cbr\u003e An [[Adiabatic quantum computation|adiabatic quantum computer]], based on [[quantum annealing]], decomposes computation into a slow continuous transformation of an initial [[Hamiltonian (quantum mechanics)|Hamiltonian]] into a final Hamiltonian, whose ground states contain the solution.\u003cref name=\"Das 2008 1061\u20131081\"\u003e{{cite journal|last1=Das|first1=A.|last2=Chakrabarti|first2=B. K.|year=2008|title=Quantum Annealing and Analog Quantum Computation|journal=[[Reviews of Modern Physics|Rev. Mod. Phys.]]|volume=80|issue=3|pages=1061\u20131081|arxiv=0801.2193|bibcode=2008RvMP...80.1061D|citeseerx=10.1.1.563.9990|doi=10.1103\u002fRevModPhys.80.1061|s2cid=14255125}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Neuromorphic quantum computing ====\u003cbr\u003e-Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional computing type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that [[Quantum algorithm|quantum algorithms]], which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and don\u2019t follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand, and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e+Neuromorphic quantum computing (abbreviated as \u2018n.quantum computing\u2019) is an unconventional computing type of computing that uses [[Neuromorphic engineering|neuromorphic computing]] to perform quantum operations. It was suggested that [[Quantum algorithm|quantum algorithms]], which are algorithms that run on a realistic model of quantum computation, can be computed equally efficiently with neuromorphic quantum computing. Both, traditional quantum computing and neuromorphic quantum computing are physics-based unconventional computing approaches to computations and don\u2019t follow the [[von Neumann architecture]]. They both construct a system (a circuit) that represents the physical problem at hand and then leverage their respective physics properties of the system to seek the \u201cminimum\u201d. Neuromorphic quantum computing and quantum computing share similar physical properties during computation.\u003cbr\u003e \u003cbr\u003e ==== Topological quantum computing ====\u003cbr\u003e \u003cbr\u003e@@ -223,7 +220,7 @@\u003cbr\u003e \u003cbr\u003e As a result, time-consuming tasks may render some quantum algorithms inoperable, as attempting to maintain the state of qubits for a long enough duration will eventually corrupt the superpositions.\u003cref\u003e{{cite arXiv |last1=Amy |first1=Matthew |last2=Matteo |first2=Olivia |last3=Gheorghiu |first3=Vlad |last4=Mosca |first4=Michele |last5=Parent |first5=Alex |last6=Schanck |first6=John |title=Estimating the cost of generic quantum pre-image attacks on SHA-2 and SHA-3 |date=30 November 2016 |eprint=1603.09383 |class=quant-ph}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-These issues are more difficult for optical approaches as the timescales are orders of magnitude shorter and an often-cited approach to overcoming them is optical [[pulse shaping]]. Error rates are typically proportional to the ratio of operating time to decoherence time, hence any operation must be completed much more quickly than the decoherence time.\u003cbr\u003e+These issues are more difficult for optical approaches as the timescales are orders of magnitude shorter and an often-cited approach to overcoming them is optical [[pulse shaping]]. Error rates are typically proportional to the ratio of operating time to decoherence time; hence any operation must be completed much more quickly than the decoherence time.\u003cbr\u003e \u003cbr\u003e As described by the [[threshold theorem]], if the error rate is small enough, it is thought to be possible to use [[quantum error correction]] to suppress errors and decoherence. This allows the total calculation time to be longer than the decoherence time if the error correction scheme can correct errors faster than decoherence introduces them. An often-cited figure for the required error rate in each gate for fault-tolerant computation is 10\u003csup\u003e\u22123\u003c\u002fsup\u003e, assuming the noise is depolarizing.\u003cbr\u003e \u003cbr\u003e@@ -258,7 +255,7 @@\u003cbr\u003e \u003cbr\u003e === Skepticism ===\u003cbr\u003e \u003cbr\u003e-Despite high hopes for quantum computing, significant progress in hardware, and optimism about future applications, a 2023 [[Nature (journal)|Nature]] spotlight article summarised current quantum computers as being \"For now, [good for] absolutely nothing\".\u003cref name=\"good-for-nothing\"\u003e\u003cbr\u003e+Despite high hopes for quantum computing, significant progress in hardware, and optimism about future applications, a 2023 [[Nature (journal)|Nature]] spotlight article summarized current quantum computers as being \"For now, [good for] absolutely nothing\".\u003cref name=\"good-for-nothing\"\u003e\u003cbr\u003e {{Cite journal| journal = Nature | title = Quantum computers: what are they good for? | date = 24 May 2023 | first = Michael | last = Brooks| volume = 617 | issue = 7962 | pages = S1\u2013S3 | doi = 10.1038\u002fd41586-023-01692-9 | pmid = 37225885 | bibcode = 2023Natur.617S...1B | s2cid = 258847001 | doi-access = free }}\u003cbr\u003e \u003c\u002fref\u003e The article elaborated that quantum computers are yet to be more useful or efficient than conventional computers in any case, though it also argued that in the long term such computers are likely to be useful. A 2023 [[Communications of the ACM]] article\u003cref name = \"CACM\"\u003e{{Cite web | url = https:\u002f\u002fm-cacm.acm.org\u002fmagazines\u002f2023\u002f5\u002f272276-disentangling-hype-from-practicality-on-realistically-achieving-quantum-advantage\u002ffulltext | publisher = Communications of the ACM | date = May 2023 | title = Disentangling Hype from Practicality: On Realistically Achieving Quantum Advantage | \u003cbr\u003e author1 = Torsten Hoefler | author2 =  Thomas H\u00e4ner | author3 = Matthias Troyer}}\u003cbr\u003e@@ -290,9 +287,9 @@\u003cbr\u003e \u003cbr\u003e A practical quantum computer must use a physical system as a programmable quantum register.\u003cref\u003e{{Cite journal |last1=Tacchino |first1=Francesco |last2=Chiesa |first2=Alessandro |last3=Carretta |first3=Stefano |last4=Gerace |first4=Dario |date=2019-12-19 |title=Quantum Computers as Universal Quantum Simulators: State-of-the-Art and Perspectives |url=https:\u002f\u002fonlinelibrary.wiley.com\u002fdoi\u002f10.1002\u002fqute.201900052 |journal=Advanced Quantum Technologies |language=en |volume=3 |issue=3 |pages=1900052 |doi=10.1002\u002fqute.201900052 |arxiv=1907.03505 |s2cid=195833616 |issn=2511-9044}}\u003c\u002fref\u003e Researchers are exploring several technologies as candidates for reliable qubit implementations.{{sfn|Grumbling|Horowitz|2019|page=127}} [[Superconductors]] and [[trapped ion]]s are some of the most developed proposals, but experimentalists are considering other hardware possibilities as well.{{sfn|Grumbling|Horowitz|2019|page=114}}\u003cbr\u003e \u003cbr\u003e-The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e-\u003cbr\u003e-The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e+The first quantum logic gates were implemented with [[trapped ion]]s and prototype general purpose machines with up to 20 qubits have been realized. However, the technology behind these devices combines complex vacuum equipment, lasers, microwave and radio frequency equipment making full scale processors difficult to integrate with standard computing equipment. Moreover, the trapped ion system itself has engineering challenges to overcome.{{sfn|Grumbling|Horowitz|2019|page=119}}\u003cbr\u003e+\u003cbr\u003e+The largest commercial systems are based on [[superconductor]] devices and have scaled to 2000 qubits. However, the error rates for larger machines have been on the order of 5%. Technologically these devices are all cryogenic and scaling to large numbers of qubits requires wafer-scale integration, a serious engineering challenge by itself.{{sfn|Grumbling|Horowitz|2019|page=126}}\u003cbr\u003e \u003cbr\u003e Research efforts to create stabler qubits for quantum computing include [[topological quantum computer]] approaches. For example, [[Microsoft Azure Quantum| Microsoft]] is working on a computer based on the quantum properties of two-dimensional quasiparticles called [[anyons]].\u003cref\u003e{{Cite web |last=Mackie |first=Kurt |date=February 8, 2024 |title=Microsoft Quantum Computing Getting DARPA Funding |url=https:\u002f\u002frcpmag.com\u002fArticles\u002f2024\u002f02\u002f08\u002fMicrosoft-Quantum-Computing-DARPA.aspx |access-date=February 9, 2024 |website=rcpmag.com}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |last=Gent |first=Edd |date=2023-07-05 |title=Microsoft Wants to Build a Quantum Supercomputer Within a Decade |url=https:\u002f\u002fsingularityhub.com\u002f2023\u002f07\u002f05\u002fmicrosoft-plans-to-build-a-quantum-supercomputer-within-a-decade\u002f |access-date=2024-10-18 |website=Singularity Hub |language=en-US}}\u003c\u002fref\u003e\u003cref\u003e{{Cite web |author1=Lucian Armasu |date=2016-11-22 |title=Microsoft Aims To Create World's First Topological Quantum Computer |url=https:\u002f\u002fwww.tomshardware.com\u002fnews\u002fmicrosoft-first-topological-quantum-computer,33068.html |access-date=2024-10-18 |website=Tom's Hardware |language=en}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -1,4 +1,4 @@\u003cbr\u003e-{{Short description|Technology that uses quantum mechanics}}\u003cbr\u003e+{{Short description|Computer hardware technology that uses quantum mechanics}}\u003cbr\u003e {{Use American English|date=February 2023}}\u003cbr\u003e {{Use dmy dates|date=February 2021}}\u003cbr\u003e [[File:Bloch sphere.svg|thumb|[[Bloch sphere]] representation of a qubit. The state \u003cmath\u003e| \\psi \\rangle = \\alpha |0 \\rangle + \\beta |1 \\rangle\u003c\u002fmath\u003e is a point on the surface of the sphere, partway between the poles, \u003cmath\u003e|0\\rangle\u003c\u002fmath\u003e and \u003cmath\u003e|1\\rangle\u003c\u002fmath\u003e.]]","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -29,7 +29,7 @@\u003cbr\u003e [[File:Peter Shor 2017 Dirac Medal Award Ceremony.png|thumb|[[Peter Shor]] (pictured here in 2017) showed in 1994 that a scalable quantum computer would be able to break [[RSA encryption]].|upright=0.9]]\u003cbr\u003e [[Peter Shor]] built on these results with [[Shor's algorithm|his 1994 algorithm]] for breaking the widely used [[RSA (cryptosystem)|RSA]] and [[Diffie{{en dash}}Hellman]] encryption protocols,{{sfn|Shor|1994}} which drew significant attention to the field of quantum computing. In 1996, [[Grover's algorithm]] established a quantum speedup for the widely applicable [[unstructured data|unstructured]] search problem.\u003cref\u003e{{Cite conference |last=Grover |first=Lov K. |date=1996 |title=A fast quantum mechanical algorithm for database search |conference=ACM symposium on Theory of computing |language=en |location=[[Philadelphia]] |publisher=ACM Press |pages=212\u2013219 |doi=10.1145\u002f237814.237866 |isbn=978-0-89791-785-8 |arxiv=quant-ph\u002f9605043}}\u003c\u002fref\u003e{{sfn|Nielsen|Chuang|2010 |p=7}} The same year, [[Seth Lloyd]] proved that quantum computers could simulate quantum systems without the exponential overhead present in classical simulations,\u003cref name=\"273.5278.1073\"\u003e{{Cite journal |last=Lloyd |first=Seth |date=1996-08-23 |title=Universal Quantum Simulators |journal=Science |volume=273 |issue=5278 |pages=1073\u20131078 |pmid=8688088 |s2cid=43496899 |bibcode=1996Sci...273.1073L |doi=10.1126\u002fscience.273.5278.1073 |issn=0036-8075}}\u003c\u002fref\u003e validating Feynman's 1982 conjecture.\u003cref\
