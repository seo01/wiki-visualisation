\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e ","--- Revision 83\u003cbr\u003e+++ Revision 84\u003cbr\u003e@@ -64,14 +64,14 @@\u003cbr\u003e ===English===\u003cbr\u003e ====Tudor and Stuart period====\u003cbr\u003e \u003cbr\u003e-[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some twenty five of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge 1964, pp. 166\u2013208\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\u201d]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, \"Finding his Feet: Wyatt and the Founding of English Pentameter\", [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005)]\u003c\u002fref\u003e But in addition Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e-\u003cbr\u003e-Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp.174\u201379\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p.12\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a sceptical eye. [[Sir John Davies]] mocked these in a series of nine 'gulling sonnets'\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \u201cMy mistress\u2019 eyes are nothing like the sun\u201d.\u003cbr\u003e-\u003cbr\u003e-[[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of Shakespeare's ''Sonnets'']]\u003cbr\u003e+[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some 25 of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge, 1964, pp. 166\u2013208.\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\".]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter \"Finding his Feet: Wyatt and the Founding of English Pentameter\"], ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005).\u003c\u002fref\u003e But, in addition, Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e+\u003cbr\u003e+Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp. 174\u201379.\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p. 12.\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a sceptical eye. [[Sir John Davies]] mocked these in a series of nine \"gulling sonnets\"\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes.\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \"My mistress' eyes are nothing like the sun\".\u003cbr\u003e+\u003cbr\u003e+[[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of [[Shakespeare]]'s ''Sonnets'']]\u003cbr\u003e [[Shakespeare's sonnets|Shakespeare's sequence of 154 sonnets]] departs from the norm in addressing more than one person in its course, male as well as female. In addition, other sonnets by him were incorporated into some of his plays. Another exception at this time was the form used in [[Spenserian sonnet|Edmund Spenser's ''Amoretti'']], which has the interlaced rhyme scheme ABAB BCBC CDCD EE. And soon after, in the following century, [[John Donne]] adapted the emerging Baroque style to the new subject matter of his series of ''[[Holy Sonnets]]''.\u003cbr\u003e \u003cbr\u003e-[[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', Ed. Alex Preminger and T.V.F. Brogan, Princeton UP, 1993.\u003c\u002fref\u003e\u003cbr\u003e+[[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'', Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373.]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', ed. Alex Preminger and T. V. F. Brogan, Princeton University Press, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th\u201319th centuries====\u003cbr\u003e The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.","--- Revision 84\u003cbr\u003e+++ Revision 85\u003cbr\u003e@@ -154,13 +154,13 @@\u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===\u003cbr\u003e * See [[Irish poetry]]\u003cbr\u003e-Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish \u2013 and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e+Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books), p. 40.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e{{cite news|url=https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 |title=Shakespeare's work has been translated into Irish \u2013 and it sounds amazing|first=Fiona |last=Audley|newspaper=[[The Irish Post]]|date=14 March 2018}}\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme and rhythms while rendering into Irish.\u003cref\u003e Sion\u00f3id, Muiris, [https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f \"Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love\"], shakespeare.org.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e-According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eJan Morris (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]]. Page 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press. Pages ''ix-x''\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 'Canu'r carchar': Prison Sonnets of T. E. Nicholas] [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e+According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Semitic languages==\u003cbr\u003e ===Hebrew===","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -191,6 +191,7 @@\u003cbr\u003e * U. Hennigfeld. ''Der ruinierte K\u00f6rper: Petrarkistische Sonette in transkultureller Perspektive''. K\u00f6nigshausen & Neumann, 2008. {{ISBN|978-3-8260-3768-9}}.\u003cbr\u003e * J. Hollander. ''Sonnets: From Dante to the Present''. Everyman's Library, 2001. {{ISBN|0-375-41177-1}}.\u003cbr\u003e * P. Levin. ''The Penguin Book of the Sonnet: 500 Years of a Classic Tradition in English''. Penguin, 2001. {{ISBN|0-14-058929-5}}.\u003cbr\u003e+* T. M\u00fcller. ''The African American Sonnet: A Literary History''. University Press of Mississippi, 2018. {{ISBN|978-1496817839}}\u003cbr\u003e * J. Phelan. ''The Nineteenth Century Sonnet''. [[Palgrave Macmillan]], 2005. {{ISBN|1-4039-3804-0}}.\u003cbr\u003e * S. Regan. ''The Sonnet''. Oxford University Press, 2006.  {{ISBN|0-19-289307-6}}.\u003cbr\u003e * H. Robbins. ''Forms of Contention: Influence and the African American Sonnet Tradition''. University of Georgia Press, 2020. {{ISBN|9780820357645}}.","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -183,9 +183,9 @@\u003cbr\u003e \u003cbr\u003e ==Further reading==\u003cbr\u003e * I. Bell, et al. ''A Companion to Shakespeare's Sonnets''. [[Blackwell Publishing]], 2006. {{ISBN|1-4051-2155-6}}.\u003cbr\u003e-* {{cite book|last=Bertoni|first=Giulio|title=I Trovatori d'Italia: Biografie, testi, tradizioni, note|location=Rome|publisher=Societ\u00e0 Multigrafica Editrice Somu|year=1915}}\u003cbr\u003e * Burt, Stephen (now Stephanie) and Mikics, David. ''The Art of the Sonnet'', [[The Belknap Press]], 2010. {{ISBN|978-0-674-04814-0}}.\u003cbr\u003e * T. W. H. Crosland. ''The English Sonnet''. Hesperides Press, 2006. {{ISBN|1-4067-9691-3}}.\u003cbr\u003e+* Paula R. Feldman and Daniel Robinson, ''A Century of Sonnets: The Romantic Era Revival, 1750-1850''. Oxford University Press, 1999. {{ISBN|0-19-511561-9}}.\u003cbr\u003e * J. Fuller. ''The Oxford Book of Sonnets''. [[Oxford University Press]], 2002. {{ISBN|0-19-280389-1}}.\u003cbr\u003e * J. Fuller. ''The Sonnet.'' (The Critical Idiom: #26).  Methuen & Co., 1972. {{ISBN|0-416-65690-0}}.\u003cbr\u003e * U. Hennigfeld. ''Der ruinierte K\u00f6rper: Petrarkistische Sonette in transkultureller Perspektive''. K\u00f6nigshausen & Neumann, 2008. {{ISBN|978-3-8260-3768-9}}.\u003cbr\u003e@@ -195,6 +195,8 @@\u003cbr\u003e * J. Phelan. ''The Nineteenth Century Sonnet''. [[Palgrave Macmillan]], 2005. {{ISBN|1-4039-3804-0}}.\u003cbr\u003e * S. Regan. ''The Sonnet''. Oxford University Press, 2006.  {{ISBN|0-19-289307-6}}.\u003cbr\u003e * H. Robbins. ''Forms of Contention: Influence and the African American Sonnet Tradition''. University of Georgia Press, 2020. {{ISBN|9780820357645}}.\u003cbr\u003e+* John Rutherford, ''The Spanish Golden Age Sonnet''. University of Wales Press, 2016. {{ISBN|9781783168989}}, {{ISBN|1783168986}}.\u003cbr\u003e+* William Sharp, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fSonnets_of_this_Century\u002fKLQvAQAAMAAJ?hl=en&gbpv=1 ''Sonnets of this Century''], London 1887.\u003cbr\u003e * M. R. G. Spiller. ''The Development of the Sonnet: An Introduction''. Routledge, 1992. {{ISBN|0-415-08741-4}}.\u003cbr\u003e * M. R. G. Spiller. ''The Sonnet Sequence: A Study of Its Strategies''. Twayne Pub., 1997. {{ISBN|0-8057-0970-3}}.\u003cbr\u003e ","--- Revision 87\u003cbr\u003e+++ Revision 88\u003cbr\u003e@@ -5,7 +5,7 @@\u003cbr\u003e {{Literature}}\u003cbr\u003e A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e \u003cbr\u003e-The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e+The term \"sonnet\" is derived from the Italian word ''sonetto'' ({{lit|little song}}, derived from the Latin word ''sonus'', {{lit|sound}}). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e \u003cbr\u003e According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e ","--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -119,6 +119,8 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Nearly half of the 170 known poems of legendary Montreal poet \u00c9mile Nelligan are sonnets, of which all but a handful are in the French alexandrine form (i.e., with 12-syllable lines). \u003cref\u003e{{cite book |last1=Allaby |first1=Ian |title=Selected Verse of \u00c9mile Nelligan |date=2023 |publisher=Petra Books |location=Ottawa |isbn=9781989048771 |page=17 |edition=1}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In German===\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}"],"line":{"width":1.5},"marker":{"size":6,"symbol":"circle"},"mode":"lines+markers","name":"Historical Path (Base)","x":{"dtype":"f4","bdata":"12IIQfXMCkGtLgZBNUAFQTZqF0FxIxlBi9YaQZv7G0ESPhpBqwscQYKfGkGrIRVBkjUWQbqiFkGBPBNBpJgSQfGeFEGmgBlBlKcbQYHKF0GkgRhB9mcXQQO5GEEvLRlBCJsXQeA1mUBVVp1ANXCbQKKChUCKypVALluRQCT8lUChM5JAijmRQCUblUDuvpRAwJmGQELWiUDFb41AAsyNQOlLhUAGCYBAu89\u002fQOCFdkBKbnlAQTaBQGzVrEDA0qtAym6tQHeMrkAq7khAqrBGQDerOUC1gUxARndEQKea6T971fU\u002fbkHwP9WL9T\u002fbrwpAAQUGQA4BGEA\u002frg1ACVizPxL5nT+4S5o\u002fZPOQPyMbrj\u002fYn4s\u002fMD6jP\u002f22rz94Nak\u002fgPl8P69Vuj+fG5I\u002fXrE5P1+3tD88N4E\u002fbgvIP5G3Yz8R+Go\u002ff76UP6qlmT\u002f1is8+2QaEPoXT1z2gGwA+M8dYv9GnRb+g8xPB"},"y":{"dtype":"f4","bdata":"1s32v8vZ57\u002faIQLA4fj2v2aehD7T9Gg+qCa3PeeaHD5\u002fFCY+hlIePtA\u002fbj\u002fEhktA+gBDQNNsQUApP1hAalFeQPxMSUBZ8l5AP+hVQFJTXEBUvnhA4rmCQOe1h0AkxIJAkBWGQFu8gkExi4FBMo2BQRRPg0G5dYVBJNKEQeRUi0HrpYxBcG6MQceoi0EoA4xBAtCCQX15gkFkcIFBClKAQVWrf0FacYRBR3KCQUKIg0FKx4FBTvx\u002fQXbHe0HgNHxBYE97Qa9Re0GqyaK+3CWWvtaikb3p7MS+Z9x9vkpxWj+8t3E\u002fN5t9P8Begj9Mdag\u002f0UWiP43Vgz+fDrc\u002fnuQJQIsDEkBt9A5AjgcPQG7HJ0Cb+C5AqoJEQIVLQUDVpD1Ap4MvQOeSNEDkYTZAq589QNYxP0AilVxAxv1WQPtSRECN31dAI2llQP5sa0BoUlhAlvdNQJBePUAkiT5AwE9MQNf1SECioAhB"},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -119,6 +119,8 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Nearly half of the 170 known poems of legendary Montreal poet \u00c9mile Nelligan are sonnets, of which all but a handful are in the French alexandrine form (i.e., with 12-syllable lines). \u003cref\u003e{{cite book |last1=Allaby |first1=Ian |title=Selected Verse of \u00c9mile Nelligan |date=2023 |publisher=Petra Books |location=Ottawa |isbn=9781989048771 |page=17 |edition=1}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In German===\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}","--- Revision 89\u003cbr\u003e+++ Revision 90\u003cbr\u003e@@ -119,8 +119,6 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Nearly half of the 170 known poems of legendary Montreal poet \u00c9mile Nelligan are sonnets, of which all but a handful are in the French alexandrine form (i.e., with 12-syllable lines). \u003cref\u003e{{cite book |last1=Allaby |first1=Ian |title=Selected Verse of \u00c9mile Nelligan |date=2023 |publisher=Petra Books |location=Ottawa |isbn=9781989048771 |page=17 |edition=1}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In German===\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -57,7 +57,9 @@\u003cbr\u003e \u003cbr\u003e In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e+By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+During the latter half of the 19th century, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e ","--- Revision 91\u003cbr\u003e+++ Revision 92\u003cbr\u003e@@ -121,6 +121,8 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Nearly half of the 170 known poems of legendary Montreal poet \u00c9mile Nelligan are sonnets, of which all but a handful are in the French alexandrine form (i.e., with 12-syllable lines).\u003cref\u003e{{cite book |last1=Allaby |first1=Ian |title=Selected Verse of \u00c9mile Nelligan |date=2023 |publisher=Petra Books |location=Ottawa |isbn=9781989048771 |page=17 |edition=1}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In German===\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}","--- Revision 92\u003cbr\u003e+++ Revision 93\u003cbr\u003e@@ -121,8 +121,6 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Nearly half of the 170 known poems of legendary Montreal poet \u00c9mile Nelligan are sonnets, of which all but a handful are in the French alexandrine form (i.e., with 12-syllable lines).\u003cref\u003e{{cite book |last1=Allaby |first1=Ian |title=Selected Verse of \u00c9mile Nelligan |date=2023 |publisher=Petra Books |location=Ottawa |isbn=9781989048771 |page=17 |edition=1}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In German===\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}","--- Revision 93\u003cbr\u003e+++ Revision 94\u003cbr\u003e@@ -39,9 +39,9 @@\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e-Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish, some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (October 1898) (p. 518).\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp. 311\u2013325.]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm Spanish text online]\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm Online text]\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e+Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e{{Cite web|url=https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante|title=Un soneto me manda hacer Violante - Wikisource|website=es.wikisource.org}}\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish, some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (October 1898) (p. 518).\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp. 311\u2013325.]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm|title=LOS PARQUES ABANDONADOSE|website=www.los-poetas.com}}\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm|title=Los \u00e9xtasis de la monta\u00f1a|website=www.los-poetas.com}}\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Soon afterwards, the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -78,29 +78,29 @@\u003cbr\u003e ====18th\u201319th centuries====\u003cbr\u003e The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e \u003cbr\u003e-[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e[https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421 Poetry Explorer]\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word\u002fpage\u002fn3\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e[http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm Wordsworth Centre]\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm ''The Poetical Works of William Wordsworth'', Vol. VII]\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e+[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421|title=Poetry Explorer- Classic Contemporary Poetry, ELEGIAC SONNET TO A MOPSTICK, by WILLIAM BECKFORD|website=www.poetryexplorer.net}}\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word|title=The River Duddon : a series of sonnets : Vaudracour and Julia: and other poems. To which is annexed, a topographical description of the country of the lakes, in the north of England|first=William|last=Wordsworth|date=17 April 1820|publisher=London : Printed for Longman, Hurst, Rees, Orme, and Brown|via=Internet Archive}}\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm|title=Sonnet Series and Itinerary Poems, 1820-1845, by William Wordsworth, ed. Geoffrey Jackson|website=www.wordsworthcentre.co.uk}}\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm|title=The Project Gutenberg eBook of The Poetical Works Of William Wordsworth (7 of 8), by William Wordsworth.|website=www.gutenberg.org}}\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation}}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm|title=Sonnets from the Portuguese, by Elizabeth Barrett Browning|website=www.gutenberg.org}}\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31\u201382]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e \u003cbr\u003e-Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855\u20131891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy\u002fpage\u002fn5\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=J7QwAQAAMAAJ Google Books]\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e+Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855\u20131891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy|title=Echoes From Theocritus by Edward Cracroft Lefroy and John Austen|first=Edward Cracroft|last=Lefroy|date=17 April 1922|via=Internet Archive}}\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e{{Cite web|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=J7QwAQAAMAAJ|title=Imaginary Sonnets|first=Eugene|last=Lee-Hamilton|date=17 April 1888|publisher=E. Stock|via=Google Books}}\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e \u003cbr\u003e ====20th century====\u003cbr\u003e As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e[https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html The Life and Work of Dylan Thomas]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england Poetry Foundation]\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e[https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets The Adrian Brinkerhoff Poetry Foundation]\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e+The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html|title=The Life and Work of Dylan Thomas}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation}}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In North America===\u003cbr\u003e ====USA====\u003cbr\u003e-The earliest American sonnet is [[David Humphreys (soldier)|David Humphreys]]'s\u003cref\u003e{{cite encyclopedia |editor1-last=Greene |editor1-first=Roland |editor2-last=Cushman |editor2-first=Stephen |editor3-last=Cavanagh |editor3-first=Clare |editor4-last=Ramazani |editor4-first=Jahan |editor5-last=Rouzer |editor5-first=Paul |editor1-link=Roland Greene |display-editors=2 |author1-last=Brogan |author1-first=T.V.F. |author2-last=Zillman |author2-first=L.J. |author3-last=Scott |author3-first=C.|author4-last=Lewin |author4-first=J. |title=Sonnet |pages=1318\u20131321 |date=2012 |encyclopedia=The Princeton Encyclopedia of Poetry and Poeti
