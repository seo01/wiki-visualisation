ed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e@@ -116,7 +116,7 @@\u003cbr\u003e The contemporary reaction against the strict form is described in the introduction to [[William Baer (writer)|William Baer]]'s anthology ''Sonnets: 150 Contemporary Sonnets'' (2005).  But for all that a number of writers were declaring then that the sonnet was dead, others \u2013 including [[Richard Wilbur]], [[Howard Nemerov]] and [[Anthony Hecht]] \u2013 continued to write sonnets and eventually became associated with the magazines ''[[The Formalist]]'' and then ''[[Measure (journal)|Measure]]''. These journals, champions of the [[New Formalism]] between the years 1994 and 2017, sponsored the annual [[Howard Nemerov Sonnet Award]].\u003cbr\u003e \u003cbr\u003e ====Canada====\u003cbr\u003e-In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii-xii\u003c\u002fref\u003e\u003cbr\u003e+In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -124,13 +124,13 @@\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}\u003cbr\u003e \u003c\u002fref\u003e But the man who did most to raise the sonnet to German consciousness was [[Martin Opitz]], who in two works, ''Buch von der deutschen Poeterey'' (1624) and ''Acht B\u00fccher Deutscher Poematum'' (1625), established the sonnet as a separate genre and its rules of composition. It was to be written in iambic alexandrines, with alternating masculine and feminine enclosed rhymes in the octave and a more flexible sestet with three rhymes. Reinforcing them were translated examples from Petrarch, Ronsard and [[Daniel Heinsius]].\u003cref\u003eMichael Haldane, [https:\u002f\u002fwww.michaelhaldane.com\u002fOpitz.htm \"Martin Opitz, Father of German Poetry: Translation and the Sonnet\"], 2005\u003c\u002fref\u003e Thereafter in the 18th century, [[Johann Wolfgang von Goethe]] wrote several love sonnets, using a rhyme scheme derived from Italian poetry. After his death, Goethe's followers created the freer 'German sonnet', which is rhymed ABBA BCCB CDD CDD.\u003cbr\u003e \u003cbr\u003e-The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.com\u002fbooks?id=yh90bNsI5wkC p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.com\u002fbooks?id=Gb_1DwAAQBAJ ''Rilke, The Life of the Work''], OUP 2020, pp.455-509\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e+The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.com\u002fbooks?id=yh90bNsI5wkC p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.com\u002fbooks?id=Gb_1DwAAQBAJ ''Rilke, The Life of the Work''], OUP 2020, pp.455\u2013509\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914\u201318,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Dutch ===\u003cbr\u003e-In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268-9\u003c\u002fref\u003e Another of his\u003cbr\u003e-sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237-8, 304-5\u003c\u002fref\u003e\u003cbr\u003e+In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268\u20139\u003c\u002fref\u003e Another of his\u003cbr\u003e+sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-agrandisment of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -146,7 +146,7 @@\u003cbr\u003e the Tsar sentenced him to [[exile]] in the [[Crimean Peninsula]]. Mickiewicz's sonnet sequence focuses heavily on the culture and [[Islam]]ic religion of the [[Crimean Tatars]]. The sequence was translated into English by [[Edna Worthley Underwood]].\u003cref\u003eEdna W. Underwood (translator), [https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f27069\u002f27069-h\u002f27069-h.htm \"Sonnets from the Crimea] by Adam Mickiewicz\", Paul Elder and Company, San Francisco (1917)\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Russian===\u003cbr\u003e-In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191-5]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e+In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191\u20135]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cbr\u003e@@ -156,7 +156,7 @@\u003cbr\u003e * See [[Irish poetry]]\u003cbr\u003e Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish - and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e+In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish \u2013 and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e@@ -172,7 +172,7 @@\u003cbr\u003e In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e-[[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm - e - Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e+[[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==See also==\u003cbr\u003e ;Associated forms","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -132,7 +132,7 @@\u003cbr\u003e In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268\u20139\u003c\u002fref\u003e Another of his\u003cbr\u003e sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-agrandisment of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e+Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-aggrandisement of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Slavic languages==\u003cbr\u003e ===Czech===","--- Revision 80\u003cbr\u003e+++ Revision 81\u003cbr\u003e@@ -7,7 +7,7 @@\u003cbr\u003e \u003cbr\u003e The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e \u003cbr\u003e-According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e+According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e According to [[Seo-Young Chu]], \"Originally the sonnet was a site of [[sexual violence]]. Male poets were rewarded for celebrating the women they hunted.\"\u003cref\u003e{{Cite web |last=Chu |first=Seo-Young |title=A Refuge for Jae-in Doe: Fugues in the Key of English Major |url=https:\u002f\u002facademicworks.cuny.edu\u002fcgi\u002fviewcontent.cgi?article=1523&context=qc_pubs}}\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Italian===","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -7,7 +7,7 @@\u003cbr\u003e \u003cbr\u003e The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e \u003cbr\u003e-According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e According to [[Seo-Young Chu]], \"Originally the sonnet was a site of [[sexual violence]]. Male poets were rewarded for celebrating the women they hunted.\"\u003cref\u003e{{Cite web |last=Chu |first=Seo-Young |title=A Refuge for Jae-in Doe: Fugues in the Key of English Major |url=https:\u002f\u002facademicworks.cuny.edu\u002fcgi\u002fviewcontent.cgi?article=1523&context=qc_pubs}}\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e+According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Italian===","--- Revision 82\u003cbr\u003e+++ Revision 83\u003cbr\u003e@@ -12,20 +12,20 @@\u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Italian===\u003cbr\u003e {{Main|Petrarchan sonnet}}\u003cbr\u003e-The sonnet is believed to have been created by [[Giacomo da Lentini]], leader of the [[Sicilian School]] under [[Frederick II, Holy Roman Emperor|Emperor Frederick II]]. [[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to its survival far beyond its region of origin. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp.151\u20134\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two \"tercets\" each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n.80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of Petrarch's ''Il Canzoniere'']]\u003cbr\u003e-[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]] where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e-\u003cbr\u003e-The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) which proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e-\u003cbr\u003e-Later, the ABBA ABBA pattern became the standard for Italian sonnets. For the sestet there were two different possibilities: CDE CDE and CDC CDC. In time, other variants on this rhyming scheme were introduced, such as CDC DCD or CDE DCE. Petrarch typically used an ABBA ABBA pattern for the octave, followed by either CDE CDE or CDC CDC rhymes in the sestet.\u003cbr\u003e-\u003cbr\u003e-At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Geminiano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation 2000\u201302\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation 2002\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 409]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian, \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p.ix]\u003c\u002fref\u003e\u003cbr\u003e+The sonnet is believed to have been created by [[Giacomo da Lentini]], leader of the [[Sicilian School]] under [[Frederick II, Holy Roman Emperor|Emperor Frederick II]]. [[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to its survival far beyond its region of origin. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n. 80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of [[Petrarch]]'s ''Il Canzoniere'']]\u003cbr\u003e+[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]], where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e+\u003cbr\u003e+The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) that proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e+\u003cbr\u003e+Later, the ABBA ABBA pattern became the standard for Italian sonnets. For the sestet, there were two different possibilities: CDE CDE and CDC CDC. In time, other variants on this rhyming scheme were introduced, such as CDC DCD or CDE DCE. Petrarch typically used an ABBA ABBA pattern for the octave, followed by either CDE CDE or CDC CDC rhymes in the sestet.\u003cbr\u003e+\u003cbr\u003e+At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Geminiano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation, 2000\u201302.\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation, 2002\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 409.]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian: \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p. ix.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Occitan===\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e@@ -35,29 +35,29 @@\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e-The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7\u20138]\u003c\u002fref\u003e\u003cbr\u003e+The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016.\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7\u20138.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e-Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311\u2013325]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm Spanish text online]\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm Online text]\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p.207]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Soon afterwards the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e+Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish, some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (October 1898) (p. 518).\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp. 311\u2013325.]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm Spanish text online]\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm Online text]\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Soon afterwards, the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e-[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12 vol.2 p.13]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610\u20131663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&q=sonnet+Portuguese+-Browning  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11\u201313, 290\u201393\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357\u20139\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35\u20136\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871\u20131920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AyzGBQAAQBAJ&dq=parnassian+triad&pg=PT831 p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e+[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12 vol. 2, p. 13.]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610\u20131663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&q=sonnet+Portuguese+-Browning  ''History of Spanish and Portuguese Literature''], Volume 2, London, 1823, pp. 11\u201313, 290\u201393.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp. 357\u20139.\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil, which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp. 35\u20136.\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871\u20131920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AyzGBQAAQBAJ&dq=parnassian+triad&pg=PT831 p. 204.]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e-In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp.113\u201315]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman Mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones.\" La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-By the late 17th century the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p.270]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp.21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s ''Sur une dame blonde'' limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p.273]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p.27]\u003c\u002fref\u003e\u003cbr\u003e+In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c
