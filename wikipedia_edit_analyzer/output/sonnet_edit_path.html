ubjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word|title=The River Duddon : a series of sonnets : Vaudracour and Julia: and other poems. To which is annexed, a topographical description of the country of the lakes, in the north of England|first=William|last=Wordsworth|date=17 April 1820|publisher=London : Printed for Longman, Hurst, Rees, Orme, and Brown|via=Internet Archive}}\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm|title=Sonnet Series and Itinerary Poems, 1820-1845, by William Wordsworth, ed. Geoffrey Jackson|website=www.wordsworthcentre.co.uk}}\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm|title=The Project Gutenberg eBook of The Poetical Works Of William Wordsworth (7 of 8), by William Wordsworth.|website=www.gutenberg.org}}\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e+At the start of the 19th century, [[Capel Lofft]] expressed his sense of the importance of the sonnet's history to the new generation of English poets. In the long preface to his idiosyncratic ''Laura, or an anthology of sonnets (on the Petrarchan model) and elegiac quatorzains'' (London 1814), the thesis is developed that beyond the sonnet's Sicilian origin lies the system of musical notation developed by the mediaeval [[Guido of Arezzo]], and before that the musical arrangement of the [[Pindar#Structure|Greek ode]].\u003cref\u003eLofft 1814, [https:\u002f\u002fbooks.google.com\u002fbooks?id=hhouAQAAIAAJ pp.iii-ix]\u003c\u002fref\u003e The young Milton, he noted, had learned the mature Italian style while travelling in Italy and conversing on equal terms with its writers (as well as writing five sonnets in Italian as well).\u003cref\u003eLofft 1814, pp. cxli-clv\u003c\u002fref\u003e In form, his are modelled on Petrarch's and, dealing as they do with both personal and contemporary issues, are reminiscent in their organisation of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29-73]\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+Impressed too by Milton's sonnets, Wordsworth described the form as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e In that its compression could be adapted to a great variety of themes, he eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word|title=The River Duddon : a series of sonnets : Vaudracour and Julia: and other poems. To which is annexed, a topographical description of the country of the lakes, in the north of England|first=William|last=Wordsworth|date=17 April 1820|publisher=London : Printed for Longman, Hurst, Rees, Orme, and Brown|via=Internet Archive}}\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm|title=Sonnet Series and Itinerary Poems, 1820-1845, by William Wordsworth, ed. Geoffrey Jackson|website=www.wordsworthcentre.co.uk}}\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm|title=The Project Gutenberg eBook of The Poetical Works Of William Wordsworth (7 of 8), by William Wordsworth.|website=www.gutenberg.org}}\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e ","--- Revision 46\u003cbr\u003e+++ Revision 47\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-The term '''sonnet''' refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e It derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+A '''sonnet''' is a fixed [[poetic form]] with a structure traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e It derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 47\u003cbr\u003e+++ Revision 48\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-A '''sonnet''' is a fixed [[poetic form]] with a structure traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e It derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+A '''sonnet''' is a fixed [[poetic form]] with a structure traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e The term derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 48\u003cbr\u003e+++ Revision 49\u003cbr\u003e@@ -22,7 +22,7 @@\u003cbr\u003e \u003cbr\u003e Later, the ABBA ABBA pattern became the standard for Italian sonnets. For the sestet, there were two different possibilities: CDE CDE and CDC CDC. In time, other variants on this rhyming scheme were introduced, such as CDC DCD or CDE DCE. Petrarch typically used an ABBA ABBA pattern for the octave, followed by either CDE CDE or CDC CDC rhymes in the sestet.\u003cbr\u003e \u003cbr\u003e-At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Geminiano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation, 2000\u201302.\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation, 2002\u003c\u002fref\u003e\u003cbr\u003e+At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Gimignano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation, 2000\u201302.\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation, 2002\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 409.]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian: \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p. ix.]\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -3,124 +3,120 @@\u003cbr\u003e {{Use British English|date=May 2012}}\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e-\u003cbr\u003e-A '''sonnet''' is a fixed [[poetic form]] with a structure traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e The term derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e+\u003cbr\u003e+The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e+\u003cbr\u003e+According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e-===Sicilian===\u003cbr\u003e-[[Giacomo da Lentini]]  is credited with the sonnet's invention at the Court of [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. Those earliest sonnets no longer survive in the original [[Sicilian language]], however, but only after being translated into [[Tuscan dialect]]. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cbr\u003e-\u003cbr\u003e-[[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to the sonnet's survival far beyond its region of origin.\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as the \"invention\" of the Sicilian School of poets. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n. 80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e ===Italian===\u003cbr\u003e-[[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of [[Petrarch]]'s ''Il Canzoniere'']]\u003cbr\u003e-[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]], where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003| publisher = Routledge}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e-\u003cbr\u003e-The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) that proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e-\u003cbr\u003e-Later, the ABBA ABBA pattern became the standard for Italian sonnets. For the sestet, there were two different possibilities: CDE CDE and CDC CDC. In time, other variants on this rhyming scheme were introduced, such as CDC DCD or CDE DCE. Petrarch typically used an ABBA ABBA pattern for the octave, followed by either CDE CDE or CDC CDC rhymes in the sestet.\u003cbr\u003e-\u003cbr\u003e-At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Gimignano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation, 2000\u201302.\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation, 2002\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 409.]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian: \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p. ix.]\u003c\u002fref\u003e\u003cbr\u003e+{{Main|Petrarchan sonnet}}\u003cbr\u003e+The sonnet is believed to have been created by [[Giacomo da Lentini]], leader of the [[Sicilian School]] under [[Frederick II, Holy Roman Emperor|Emperor Frederick II]]. [[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to its survival far beyond its region of origin. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp.151-4\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153-154.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two \"tercets\" each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n.80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of Petrarch's ''Il Canzoniere'']]\u003cbr\u003e+[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]] where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]]. \u003cbr\u003e+\u003cbr\u003e+The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) which proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e+\u003cbr\u003e+Later, the ABBA ABBA pattern became the standard for Italian sonnets. For the sestet there were two different possibilities: CDE CDE and CDC CDC. In time, other variants on this rhyming scheme were introduced, such as CDC DCD or CDE DCE. Petrarch typically used an ABBA ABBA pattern for the octave, followed by either CDE CDE or CDC CDC rhymes in the sestet.\u003cbr\u003e+\u003cbr\u003e+At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Geminiano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation 2000-02\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation 2002\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fDublin_Review\u002fm1YVAQAAIAAJ?hl=en&gbpv=1&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418&printsec=frontcover p. 409]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian, \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p.ix]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Occitan===\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e \u003cbr\u003e ===Catalan===\u003cbr\u003e-One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436\u20131486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480\u20131630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010| publisher = Cambridge Scholars}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e+One of the earliest sonnets in [[Catalan language]] was written by Pere Torroella (1436-1486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th  century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480-1630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e-The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016.\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Girona University, 2017, [https:\u002f\u002fdugi-doc.udg.edu\u002fbitstream\u002fhandle\u002f10256\u002f14701\u002fLozanoAnguloAnna_Treball.pdf?sequence=1 pp. 35ff.]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e-\u003cbr\u003e-Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e{{Cite web|url=https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante|title=Un soneto me manda hacer Violante - Wikisource|website=es.wikisource.org}}\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish, some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (October 1898) (p. 518).\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp. 311\u2013325.]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm|title=LOS PARQUES ABANDONADOSE|website=www.los-poetas.com}}\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm|title=Los \u00e9xtasis de la monta\u00f1a|website=www.los-poetas.com}}\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[C\u00e9sar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Soon afterwards, the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e+The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Ic1RDwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=jhCWVKkkbH0C&printsec=frontcover#v=onepage&q&f=false pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in [[The Book of the Courtier]] (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-consciousness, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e+\u003cbr\u003e+Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340?seq=6#metadata_info_tab_contents \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311-325]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585-1646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm Spanish text online]\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm Online text]\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p.207]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Soon afterwards the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e-[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12 vol. 2, p. 13.]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610\u20131663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&q=sonnet+Portuguese+-Browning  ''History of Spanish and Portuguese Literature''], Volume 2, London, 1823, pp. 11\u201313, 290\u201393.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp. 357\u20139.\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil, which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp. 35\u20136.\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871\u20131920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AyzGBQAAQBAJ&dq=parnassian+triad&pg=PT831 p. 204.]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e+The first sonnets in Portuguese literature are ascribed to Dom Pedro in the early 15th century. A son of [[John I of Portugal|King John I]], he was also responsible for translations of sonnets by Petrarch. But the form did not come into its own until the following century in the work of  [[Lu\u00eds de Cam\u00f5es]], who generally follows the styles of [[Italian poetry]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in them the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The introduction of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e-In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the human race. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-During the latter half of the 19th century, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e+In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874-; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp.113-15]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman Mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones.\" La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+By the late 17th century the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original - Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p.270]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp.21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s ''Sur une dame blonde'' limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p.273]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788 - 1862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p.27]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e \u003cbr\u003e ===English===\u003cbr\u003e ====Tudor and Stuart period====\u003cbr\u003e \u003cbr\u003e-[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some 25 of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge, 1964, pp. 166\u2013208.\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\".]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter \"Finding his Feet: Wyatt and the Founding of English Pentameter\"], ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005).\u003c\u002fref\u003e But, in addition, Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e-\u003cbr\u003e-Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp. 174\u201379.\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p. 12.\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a sceptical eye. [[Sir John Davies]] mocked these in a series of nine \"gulling sonnets\"\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes.\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \"My mistress' eyes are nothing like the sun\".\u003cbr\u003e-\u003cbr\u003e-[[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of [[Shakespeare]]'s ''Sonnets'']]\u003cbr\u003e+[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some twenty five of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge 1964, pp. 166-208\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\u201d]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, \"Finding his Feet: Wyatt and the Founding of English Pentameter\", [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005)]\u003c\u002fref\u003e But in addition Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e+\u003cbr\u003e+Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp.174-79\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p.12\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a sceptical eye. [[Sir John Davies]] mocked these in a series of nine 'gulling sonnets'\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \u201cMy mistress\u2019 eyes are nothing like the sun\u201d.\u003cbr\u003e+\u003cbr\u003e+[[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of Shakespeare's ''Sonnets'']]\u003cbr\u003e [[Shakespeare's sonnets|Shakespeare's sequence of 154 sonnets]] departs from the norm in addressing more than one person in its course, male as well as female. In addition, other sonnets by him were incorporated into some of his plays. Another exception at this time was the form used in [[Spenserian sonnet|Edmund Spenser's ''Amoretti'']],
