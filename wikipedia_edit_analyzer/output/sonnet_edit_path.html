cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Several African American women poets won prizes for volumes that included sonnets, such as [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e Though Langston Hughes and [[Amiri Baraka]] were to question the appropriateness of the sonnet for Black poetry, both had published sonnets themselves.\u003cref name=\"ugapress.org\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Acdw0ZY1dMAC&printsec=frontcover&source=gbs_vpt_reviews#v=onepage&q&f=false ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Shortly afterwards, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Myawoc_PbF4C&pg=PA95&dq=petrarchan+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiR6LeY7M_3AhVQUcAKHTbMA8AQ6AF6BAgJEAI#v=onepage&q=petrarchan%20%22fungi%20from%20yuggoth%22&f=false p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=syJgDwAAQBAJ&pg=PT253&dq=petrarchan+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiR6LeY7M_3AhVQUcAKHTbMA8AQ6AF6BAgIEAI#v=onepage&q=rhyme&f=false p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=S3oH_VdH3BcC&pg=PA36&dq=rhyme+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwimx8mdg9D3AhURZMAKHacMCh4Q6AF6BAgIEAI#v=onepage&q=rhyme%20%22fungi%20from%20yuggoth%22&f=false p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e+One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Shortly afterwards, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Solt-moonshot 2.jpg|thumb|upright=0.45|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e@@ -125,7 +125,7 @@\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}\u003cbr\u003e \u003c\u002fref\u003e But the man who did most to raise the sonnet to German consciousness was [[Martin Opitz]], who in two works, ''Buch von der deutschen Poeterey'' (1624) and ''Acht B\u00fccher Deutscher Poematum'' (1625), established the sonnet as a separate genre and its rules of composition. It was to be written in iambic alexandrines, with alternating masculine and feminine enclosed rhymes in the octave and a more flexible sestet with three rhymes. Reinforcing them were translated examples from Petrarch, Ronsard and [[Daniel Heinsius]].\u003cref\u003eMichael Haldane, [https:\u002f\u002fwww.michaelhaldane.com\u002fOpitz.htm \"Martin Opitz, Father of German Poetry: Translation and the Sonnet\"], 2005\u003c\u002fref\u003e Thereafter in the 18th century, [[Johann Wolfgang von Goethe]] wrote several love sonnets, using a rhyme scheme derived from Italian poetry. After his death, Goethe's followers created the freer 'German sonnet', which is rhymed ABBA BCCB CDD CDD.\u003cbr\u003e \u003cbr\u003e-The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=yh90bNsI5wkC&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Gb_1DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false ''Rilke, The Life of the Work''], OUP 2020, pp.455-509\u003c\u002fref\u003e\u003cbr\u003e+The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.com\u002fbooks?id=yh90bNsI5wkC p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.com\u002fbooks?id=Gb_1DwAAQBAJ ''Rilke, The Life of the Work''], OUP 2020, pp.455-509\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fDublin_Review\u002fm1YVAQAAIAAJ?hl=en&gbpv=1&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418&printsec=frontcover p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -147,7 +147,7 @@\u003cbr\u003e the Tsar sentenced him to [[exile]] in the [[Crimean Peninsula]]. Mickiewicz's sonnet sequence focuses heavily on the culture and [[Islam]]ic religion of the [[Crimean Tatars]]. The sequence was translated into English by [[Edna Worthley Underwood]].\u003cref\u003eEdna W. Underwood (translator), [https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f27069\u002f27069-h\u002f27069-h.htm \"Sonnets from the Crimea] by Adam Mickiewicz\", Paul Elder and Company, San Francisco (1917)\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Russian===\u003cbr\u003e-In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=pngV3Ff2EBcC&pg=PA192&dq=%22Onegin+sonnet%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiXpN3O4JTzAhUJgFwKHapXDEwQ6AF6BAgKEAI#v=onepage&q=%22Onegin%20sonnet%22&f=false pp.191-5]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=EPuAI-tHo48C&pg=PA144&dq=Lermontov+%22Onegin+stanza%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwibmMjM55TzAhXinFwKHTBIBKkQ6AF6BAgGEAI#v=onepage&q=Lermontov%20%22Onegin%20stanza%22&f=false p.144]\u003c\u002fref\u003e\u003cbr\u003e+In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191-5]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -25,7 +25,7 @@\u003cbr\u003e \u003cbr\u003e At the turn of the 14th century there arrive early examples of the [[sonnet sequence]] unified about a single theme. This is represented by [[Folgore da San Geminiano]]'s series on the months of the year,\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002ffolgore.htm\" Of the months\"], translated by Dante Gabriel Rossetti,\u003c\u002fref\u003e followed by his sequence on the days of the week.\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.rossettiarchive.org\u002fdocs\u002f1-1874.rad.html#p369| title = Rossetti Archive}}\u003c\u002fref\u003e At a slightly earlier date, Dante had published his ''[[La Vita Nuova]]'', a narrative commentary in which appear sonnets and other lyrical forms centred on the poet's love for Beatrice.\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fTheNewLife.php ''La Vita Nuova'' (The New Life)], A. S. Kline, Poetry in Translation 2000-02\u003c\u002fref\u003e Most of the sonnets there are Petrarchan (here used as a purely stylistic term since Dante predated Petrarch). Chapter VII gives the sonnet \"O voi che per la via\", with two sestets (AABAAB AABAAB) and two quatrains (CDDC CDDC), and Ch. VIII, \"Morte villana\", with two sestets (AABBBA AABBBA) and two quatrains (CDDC CDDC). Petrarch followed in his footsteps later in the next century with the 366 sonnets of the ''Canzionere'', which chronicle his life-long love for [[Petrarch#Laura and poetry|Laura]].\u003cref\u003e[https:\u002f\u002fwww.poetryintranslation.com\u002fPITBR\u002fItalian\u002fPetrarchhome.php \"Petrarch: ''The Canzonieri''\"], A. S. Kline, Poetry in Translation 2002\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fDublin_Review\u002fm1YVAQAAIAAJ?hl=en&gbpv=1&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418&printsec=frontcover p. 409]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian, \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p.ix]\u003c\u002fref\u003e\u003cbr\u003e+Widespread as sonnet writing became in Italian society, among practitioners were to be found some better known for other things: the painters [[Giotto]] and [[Michelangelo]], for example, and the astronomer [[Galileo Galilei|Galileo]]. The academician [[Giovanni Mario Crescimbeni]] lists 661 poets just in the 16th century.\u003cref\u003e\"Critical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 409]\u003c\u002fref\u003e So common were they that eventually, in the words of a literary historian, \"No event was so trivial, none so commonplace, a tradesman could not open a larger shop, a government clerk could not obtain a few additional ''[[scudi]]'' of salary, but all his friends and acquaintance must celebrate the event, and clothe their congratulations in a copy of verses, which almost invariably assumed this shape.\"\u003cref\u003e[[Richard Chevenix Trench]], \"The History of the English Sonnet\" (London, 1884), [https:\u002f\u002farchive.org\u002fdetails\u002fsonnetswilliamw00wordgoog\u002fpage\u002fn13\u002fmode\u002f2up p.ix]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Occitan===\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e@@ -47,7 +47,7 @@\u003cbr\u003e \u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e-[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fHistory_of_Spanish_and_Portuguese_Litera\u002fd25DhbGrH2AC?hl=en&gbpv=1&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12&printsec=frontcover vol.2 p.13]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e\u003cbr\u003e+[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12 vol.2 p.13]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e\u003cbr\u003e However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&q=sonnet+Portuguese+-Browning  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AyzGBQAAQBAJ&dq=parnassian+triad&pg=PT831 p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e@@ -75,9 +75,9 @@\u003cbr\u003e [[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29-73]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', Ed. Alex Preminger and T.V.F. Brogan, Princeton UP, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th-19th centuries====\u003cbr\u003e-The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fThe_Cambridge_History_of_English_Literat\u002fUtmE5JzCOFAC?hl=en&gbpv=1&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231&printsec=frontcover p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e-\u003cbr\u003e-[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e[https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421 Poetry Explorer]\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fPoems_on_Various_Subjects\u002fn61aAAAAcAAJ?hl=en&gbpv=1&dq=Coleridge+%22Poems+on+Various+Subjects%22&printsec=frontcover p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fSappho_and_Phaon_In_a_series_of_legitima\u002f7K5YAAAAcAAJ?hl=en&gbpv=1&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10&printsec=frontcover p.10]\u003c\u002fref\u003e\u003cbr\u003e+The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e+\u003cbr\u003e+[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e[https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421 Poetry Explorer]\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225-251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word\u002fpage\u002fn3\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e[http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm Wordsworth Centre]\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm ''The Poetical Works of William Wordsworth'', Vol. VII]\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229-35\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -127,7 +127,7 @@\u003cbr\u003e \u003cbr\u003e The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.com\u002fbooks?id=yh90bNsI5wkC p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.com\u002fbooks?id=Gb_1DwAAQBAJ ''Rilke, The Life of the Work''], OUP 2020, pp.455-509\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fDublin_Review\u002fm1YVAQAAIAAJ?hl=en&gbpv=1&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418&printsec=frontcover p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e+Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Dutch ===\u003cbr\u003e In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268-9\u003c\u002fref\u003e Another of his","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -3,7 +3,7 @@\u003cbr\u003e {{Use British English|date=May 2012}}\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e-A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e+A '''sonnet''' is a [[poetic form]] that originated in the  fat pigcomposed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e \u003cbr\u003e The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e ","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -3,7 +3,7 @@\u003cbr\u003e {{Use British English|date=May 2012}}\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e-A '''sonnet''' is a [[poetic form]] that originated in the  fat pigcomposed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e+A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e \u003cbr\u003e The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e ","--- Revision 58\u003cbr\u003e+++ Revision 59\u003cbr\u003e@@ -84,7 +84,7 @@\u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?hl=en&lr=&id=WduHxc6iYp4C&oi=fnd&pg=PA1&dq=nineteenth+century+sonnets&ots=vXw2IpOycT&sig=wX2IuCbQ3vwjPel_My4Klmb2elA#v=onepage&q=nineteenth%20century%20sonnets&f=false p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976?seq=6#metadata_info_tab_contents p.356]\u003c\u002fref\u003e\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976?seq=6#metadata_info_tab_contents p.356]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e ","--- Revision 59\u003cbr\u003e+++ Revision 60\u003cbr\u003e@@ -31,7 +31,7 @@\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e \u003cbr\u003e ===Catalan===\u003cbr\u003e-One of the earliest sonnets in [[Catalan language]] was written by Pere Torroella (1436-1486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th  century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480-1630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e+One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436-1486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th  century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480-1630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}","--- Revision 60\u003cbr\u003e+++ Revision 61\u003cbr\u003e@@ -37,7 +37,7 @@\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in [[The Book of the Courtier]] (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-consciousness, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e+Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-consciousness, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340?seq=6#metadata_info_tab_contents \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311-325]\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 61\u003cbr\u003e+++ Revision 62\u003cbr\u003e@@ -37,7 +37,7 @@\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=j
