 which has the interlaced rhyme scheme ABAB BCBC CDCD EE. And soon after, in the following century, [[John Donne]] adapted the emerging Baroque style to the new subject matter of his series of ''[[Holy Sonnets]]''.\u003cbr\u003e \u003cbr\u003e-[[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'', Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373.]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', ed. Alex Preminger and T. V. F. Brogan, Princeton University Press, 1993.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-====18th\u201319th centuries====\u003cbr\u003e-{{See also|Romantic sonnets}}\u003cbr\u003e-The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e-\u003cbr\u003e-[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421|title=Poetry Explorer- Classic Contemporary Poetry, ELEGIAC SONNET TO A MOPSTICK, by WILLIAM BECKFORD|website=www.poetryexplorer.net}}\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-At the start of the 19th century, [[Capel Lofft]] expressed his sense of the importance of the sonnet's history to the new generation of English poets. In the long preface to his idiosyncratic ''Laura, or an anthology of sonnets (on the Petrarchan model) and elegiac quatorzains'' (London 1814), the thesis is developed that beyond the sonnet's Sicilian origin lies the system of musical notation developed by the mediaeval [[Guido of Arezzo]], and before that the musical arrangement of the [[Pindar#Structure|Greek ode]].\u003cref\u003eLofft 1814, [https:\u002f\u002fbooks.google.com\u002fbooks?id=hhouAQAAIAAJ pp.iii-ix]\u003c\u002fref\u003e The young Milton, he noted, had learned the mature Italian style while travelling in Italy and conversing on equal terms with its writers (as well as writing five sonnets in Italian as well).\u003cref\u003eLofft 1814, pp. cxli-clv\u003c\u002fref\u003e In form, his are modelled on Petrarch's and, dealing as they do with both personal and contemporary issues, are reminiscent in their organisation of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29-73]\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-Impressed too by Milton's sonnets, Wordsworth described the form as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e In that its compression could be adapted to a great variety of themes, he eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word|title=The River Duddon : a series of sonnets : Vaudracour and Julia: and other poems. To which is annexed, a topographical description of the country of the lakes, in the north of England|first=William|last=Wordsworth|date=17 April 1820|publisher=London : Printed for Longman, Hurst, Rees, Orme, and Brown|via=Internet Archive}}\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm|title=Sonnet Series and Itinerary Poems, 1820-1845, by William Wordsworth, ed. Geoffrey Jackson|website=www.wordsworthcentre.co.uk}}\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm|title=The Project Gutenberg eBook of The Poetical Works Of William Wordsworth (7 of 8), by William Wordsworth.|website=www.gutenberg.org}}\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e+[[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29-73]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', Ed. Alex Preminger and T.V.F. Brogan, Princeton UP, 1993.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+====18th-19th centuries====\u003cbr\u003e+The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AC27DwAAQBAJ&dq=poem+%22Thomas+Warwick%22&source=gbs_navlinks_s p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fThe_Cambridge_History_of_English_Literat\u002fUtmE5JzCOFAC?hl=en&gbpv=1&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231&printsec=frontcover p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e+\u003cbr\u003e+[[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e[https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421 Poetry Explorer]\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fPoems_on_Various_Subjects\u002fn61aAAAAcAAJ?hl=en&gbpv=1&dq=Coleridge+%22Poems+on+Various+Subjects%22&printsec=frontcover p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fSappho_and_Phaon_In_a_series_of_legitima\u002f7K5YAAAAcAAJ?hl=en&gbpv=1&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10&printsec=frontcover p.10]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225-251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word\u002fpage\u002fn3\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e[http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm Wordsworth Centre]\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm ''The Poetical Works of William Wordsworth'', Vol. VII]\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229-35\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=PZYkimc1bZUC&printsec=frontcover#v=onepage&q&f=false   p.116]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm|title=Sonnets from the Portuguese, by Elizabeth Barrett Browning|website=www.gutenberg.org}}\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31\u201382]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e-\u003cbr\u003e-Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855\u20131891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy|title=Echoes From Theocritus by Edward Cracroft Lefroy and John Austen|first=Edward Cracroft|last=Lefroy|date=17 April 1922|via=Internet Archive}}\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e{{Cite web|url=https:\u002f\u002fbooks.google.com\u002fbooks?id=J7QwAQAAMAAJ|title=Imaginary Sonnets|first=Eugene|last=Lee-Hamilton|date=17 April 1888|publisher=E. Stock|via=Google Books}}\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?hl=en&lr=&id=WduHxc6iYp4C&oi=fnd&pg=PA1&dq=nineteenth+century+sonnets&ots=vXw2IpOycT&sig=wX2IuCbQ3vwjPel_My4Klmb2elA#v=onepage&q=nineteenth%20century%20sonnets&f=false p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976?seq=6#metadata_info_tab_contents p.356]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=MwFdAAAAcAAJ&printsec=frontcover&dq=Meredith+%22Modern+Love%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiLqtzf9J_2AhVhQEEAHbq5A18Q6AF6BAgJEAI#v=onepage&q=Meredith%20%22Modern%20Love%22&f=false pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e+\u003cbr\u003e+Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855-1891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy\u002fpage\u002fn5\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=J7QwAQAAMAAJ&printsec=frontcover#v=onepage&q&f=false Google Books]\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=WduHxc6iYp4C&printsec=frontcover#v=onepage&q&f=false Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e \u003cbr\u003e ====20th century====\u003cbr\u003e-As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003eJulian Scutts, ''A Defence of Wandering and Poetry'' (2019), [https:\u002f\u002fbooks.google.com\u002fbooks?id=5t2rDwAAQBAJ&dq=%22altarwise+by+owl+light%22&pg=PA154 \"A critical survey of the linguistic features of Altarwise by Owl-light], pp. 155ff\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e+As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example . He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e[https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html The Life and Work of Dylan Thomas]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england Poetry Foundation]\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e[https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets The Adrian Brinkerhoff Poetry Foundation]\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In North America===\u003cbr\u003e ====USA====\u003cbr\u003e-The earliest American sonnet is [[David Humphreys (soldier)|David Humphreys]]'s\u003cref\u003e{{cite encyclopedia |editor1-last=Greene |editor1-first=Roland |editor2-last=Cushman |editor2-first=Stephen |editor3-last=Cavanagh |editor3-first=Clare |editor4-last=Ramazani |editor4-first=Jahan |editor5-last=Rouzer |editor5-first=Paul |editor1-link=Roland Greene |display-editors=2 |author1-last=Brogan |author1-first=T.V.F. |author2-last=Zillman |author2-first=L.J. |author3-last=Scott |author3-first=C.|author4-last=Lewin |author4-first=J. |title=Sonnet |pages=1318\u20131321 |date=2012 |encyclopedia=The Princeton Encyclopedia of Poetry and Poetics |edition=Fourth |location=Princeton, NJ |publisher=Princeton University Press |isbn=978-0-691-13334-8 |oclc=908736323}} (p. 1320)\u003c\u002fref\u003e 1776 sonnet \"Addressed to my Friends at Yale College, on my Leaving them to join the Army\".\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.sonnets.org\u002fhumphreys.htm#001| title = Sonnets.org}}\u003c\u002fref\u003e The sonnet form was used widely thereafter, including by [[William Lloyd Garrison]] and [[William Cullen Bryant]].\u003cref name=\"ugapress.org\"\u003e{{Cite web|url=https:\u002f\u002fwww.ugapress.org\u002fbook\u002f9780820357645\u002fforms-of-contention\u002f|title = Forms of Contention: Influence and the African American Sonnet Tradition}}\u003c\u002fref\u003e Later, [[Henry Wadsworth Longfellow]] and others followed suit.\u003cref\u003eLewis Sterner, [http:\u002f\u002fwww.sonnets.org\u002fsterner.htm ''The Sonnet in American Literature'' (1930)]\u003c\u002fref\u003e His were characterised by a \"purple richness of diction\" and by their use of material images to illustrate niceties of thought and emotion.\u003cref\u003e''The book of the sonnet'', ed. by Leigh Hunt and S. Adams (1866), p.102\u003c\u002fref\u003e He also translated several sonnets, including seven by [[Michelangelo]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.online-literature.com\u002fforums\u002fshowthread.php?3965-Sonnets-of-Michelangelo| title = Online Literature}}\u003c\u002fref\u003e Later on, among [[Emma Lazarus]]' many sonnets, perhaps the best-known is \"[[The New Colossus]]\" of 1883,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002flazarus.htm|title=Emma Lazarus|website=www.sonnets.org}}\u003c\u002fref\u003e which celebrates the [[Statue of Liberty]] and its role in welcoming immigrants to the New World.\u003cbr\u003e+The earliest American sonnet is [[David Humphreys (soldier)|David Humphreys]]'s\u003cref\u003e{{cite encyclopedia |editor1-last=Greene |editor1-first=Roland |editor2-last=Cushman |editor2-first=Stephen |editor3-last=Cavanagh |editor3-first=Clare |editor4-last=Ramazani |editor4-first=Jahan |editor5-last=Rouzer |editor5-first=Paul |editor1-link=Roland Greene |display-editors=2 |author1-last=Brogan |author1-first=T.V.F. |author2-last=Zillman |author2-first=L.J. |author3-last=Scott |author3-first=C.|author4-last=Lewin |author4-first=J. |title=Sonnet |pages=1318\u20131321 |date=2012 |encyclopedia=The Princeton Encyclopedia of Poetry and Poetics |edition=Fourth |location=Princeton, NJ |publisher=Princeton University Press |isbn=978-0-691-13334-8 |oclc=908736323}} (p. 1320)\u003c\u002fref\u003e 1776 sonnet \"Addressed to my Friends at Yale College, on my Leaving them to join the Army\".\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.sonnets.org\u002fhumphreys.htm#001| title = Sonnets.org}}\u003c\u002fref\u003e The sonnet form was used widely thereafter, including by [[William Lloyd Garrison]] and [[William Cullen Bryant]].\u003cref name=\"ugapress.org\"\u003e{{Cite web|url=https:\u002f\u002fwww.ugapress.org\u002fbook\u002f9780820357645\u002fforms-of-contention\u002f|title = Forms of Contention: Influence and the African American Sonnet Tradition}}\u003c\u002fref\u003e Later, [[Henry Wadsworth Longfellow]] and others followed suit.\u003cref\u003eLewis Sterner, [http:\u002f\u002fwww.sonnets.org\u002fsterner.htm ''The Sonnet in American Literature'' (1930)]\u003c\u002fref\u003e His were characterised by a \"purple richness of diction\" and by their use of material images to illustrate niceties of thought and emotion.\u003cref\u003e''The book of the sonnet'', ed. by Leigh Hunt and S. Adams (1866), p.102\u003c\u002fref\u003e He also translated several sonnets, including seven by [[Michelangelo]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.online-literature.com\u002fforums\u002fshowthread.php?3965-Sonnets-of-Michelangelo| title = Online Literature}}\u003c\u002fref\u003e Later on, among [[Emma Lazarus]]' many sonnets, perhaps the best-known is \"[[The New Colossus]]\" of 1883,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002flazarus.htm|title=Emma Lazarus}}\u003c\u002fref\u003e which celebrates the [[Statue of Liberty]] and its role in welcoming immigrants to the New World.\u003cbr\u003e \u003cbr\u003e In the 19th century, sonnets written by American poets began to be anthologised as such. They were included in a separate section in Leigh Hunt and S. Adams' ''The Book of the Sonnet'' (London and Boston, 1867), which included an essay by Adams on \"American Sonnets and Sonneteers\" and a section devoted only to sonnets by American women.\u003cref\u003e''The Book of the Sonnet'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=uc1.$b250912&view=1up&seq=11&skin=2021 vol.1] and [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=coo.31924064948346&view=1up&seq=16&skin=2021 vol.2], Hathi Trust\u003c\u002fref\u003e Later came [[William Sharp (writer)|William Sharp]]'s anthology of ''American Sonnets'' (1889)\u003cref\u003e{{cite web| url = https:\u002f\u002farchive.org\u002fdetails\u002famericansonnets00shar\u002fpage\u002fn9\u002fmode\u002f2up| title = Internet Archive| year = 1889}}\u003c\u002fref\u003e and Charles H. Crandall's ''Representative sonnets by American poets, with an essay on the sonnet, its nature and history'' ([[Houghton Mifflin & Co.]], 1890). The essay also surveyed the whole history of the sonnet, including English examples and European examples in translation, in order to contextualise the American achievement.\u003cref\u003e''Representative sonnets by American poets'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=hvd.32044013711908&view=1up&seq=17&skin=2021 Hathi Trust]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Countee Cullen]], [[Sterling A. Brown]], and Jamaican-born [[Claude McKay]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Some of their sonnets were personal responses to experience of displacement and racial prejudice. Cullen\u2019s \"At the Wailing Wall in Jerusalem\" (1927), for example, suggests a parallel between the history of his race and that of the Jewish [[diaspora]].\u003cref\u003e''The Art of the Sonnet'', pp. 273-76]\u003c\u002fref\u003e And McKay's sonnets of 1921 respond defiantly to the deadly [[Red Summer]] riots two years before.\u003cref\u003e''The Art of the Sonnet'', pp. 250-52]\u003c\u002fref\u003e There were also several African American women poets who won prizes for volumes that included sonnets, including [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e But there were other writers - like [[Langston Hughes]] and [[Amiri Baraka]], for example - who, despite publishing some themselves, questioned the appropriateness of sonnets for Black poets. In the opinion of Hughes, the emergence of truly individual writing based on folk genres and experience was hindered by the imposition of genteel \"white\" verse forms irrelevant to them.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p. 56]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Shortly after the publication of Wyeth's, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:Solt-moonshot 2.jpg|thumb|upright=0.6|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e+Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Claude McKay]], [[Countee Cullen]], [[Langston Hughes]], and [[Sterling A. Brown]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Several African American women poets won prizes for volumes that included sonnets, such as [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e Though Langston Hughes and [[Amiri Baraka]] were to question the appropriateness of the sonnet for Black poetry, both had published sonnets themselves.\u003cref name=\"ugapress.org\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Acdw0ZY1dMAC&printsec=frontcover&source=gbs_vpt_reviews#v=onepage&q&f=false ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Shortly afterwards, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Myawoc_PbF4C&pg=PA95&dq=petrarchan+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiR6LeY7M_3AhVQUcAKHTbMA8AQ6AF6BAgJEAI#v=onepage&q=petrarchan%20%22fungi%20from%20yuggoth%22&f=false p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=syJgDwAAQBAJ&pg=PT253&dq=petrarchan+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiR6LeY7M_3AhVQUcAKHTbMA8AQ6AF6BAgIEAI#v=onepage&q=rhyme&f=false p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=S3oH_VdH3BcC&pg=PA36&dq=rhyme+%22fungi+from+yuggoth%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwimx8mdg9D3AhURZMAKHacMCh4Q6AF6BAgIEAI#v=onepage&q=rhyme%20%22fungi%20from%20yuggoth%22&f=false p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:Solt-moonshot 2.jpg|thumb|upright=0.45|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-But at this time too began to appear sequences of [[quatorzain]]s with only a tenuous relationship to the sonnet form. [[Ted Berrigan]]'s ''The Sonnets'' (1964) discard metre and rhyme but retain the dynamics of a 14-line structure with a change of direction at the volta. Berrigan claimed to have been inspired by \"Shakespeare\u2019s sonnets because they were quick, musical, witty and short\".\u003cref\u003eBerrigan's talk at the Poetry Project Workshop, [https:\u002f\u002fwww.2009-2019.poetryproject.org\u002fwp-content\u002fuploads\u002fv2-ted-berrigan.pdf 27 February 1979]\u003c\u002fref\u003e Others have described Berrigan's work as a [[Postmodern literature|postmodern]] collage using \"repetition, rearrangement, and the use of 'found' phrases and text\", that functions as a \"radical deconstruction of the sonnet\".\u003cref\u003eTimothy Henry, \"Time And Time Again\": The Strategy of Simultaneity in Ted Berrigan's ''The Sonnets''\", [http:\u002f\u002fjacketmagazine.com\u002f40\u002fhenry-berrigan.shtml ''Jacket'' 40, 2010]\u003c\u002fref\u003e From 1969 [[Robert Lowell]] too began publishing a less radical deconstruction of the form in his series of five collections of [[blank verse]] sonnets, including his [[Pulitzer Prize]] volume ''The Dolphin'' (1973). These he described as having \"the eloquence at best of iambic pentameter, and often the structure and climaxes of sonnets\".\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoets\u002frobert-lowell \"Robert Lowell 1917\u20131977\"], Poetry Foundation\u003c\u002fref\u003e\u003cbr\u003e+But at this time too began to appear sequences of [[quatorzain]]s with only a tenuous relationship to the sonnet form. [[Ted Berrigan]]'s ''The Sonnets'' (1964) discard metre and rhyme but retain the dynamics of a 14-line structure with a change of direction at the volta. Berrigan claimed to have been inspired by \"Shakespeare\u2019s sonnets because they were quick, musical, witty and short\".\u003cref\u003eBerrigan's talk at the Poetry Project Workshop, [https:\u002f\u002fwww.2009-2019.poetryproject.org\u002fwp-content\u002fuploads\u002fv2-ted-berrigan.pdf 27 February 1979]\u003c\u002fref\u003e Others have described Berrigan's work as a [[Postmodern literature|postmodern]] collage using \"repetition, rearrangement, and the use of 'found' phrases and text\", that functions as a \"radical deconstruction of the sonnet\".\u003cref\u003eTimothy Henry, \"Time And Time Again\": The Strategy of Simultaneity in Ted Berrigan's ''The Sonnets''\", [http:\u002f\u002fjacketmagazine.com\u002f40\u002fhenry-berrigan.shtml ''Jacket'' 40, 2010]\u003c\u002fref\u003e From 1969 [[Robert Lowell]] too began publishing a less radical deconstruction of the form in his series of five collections of [[blank verse]] sonnets, including his [[Pulitzer Prize]] volume ''The Dolphin'' (1973). These he described as having \u201cthe eloquence at best of iambic pentameter, and often the structure and climaxes of sonnets\".\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoets\u002frobert-lowell \"Robert Lowell 1917\u20131977\"], Poetry Foundation\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The contemporary reaction against the strict form is described in the introduction to [[William Baer (writer)|William Baer]]'s anthology ''Sonnets: 150 Contemporary Sonnets'' (2005).  But for all that a number of writers were declaring then that the sonnet was dead, others \u2013 including [[Richard Wilbur]], [[Howard Nemerov]] and [[Anthony Hecht]] \u2013 continued to write sonnets and eventually became associated with the magazines ''[[The Formalist]]'' and then ''[[Measure (journal)|Measure]]''. These journals, champions of the [[New Formalism]] between the years 1994 and 2017, sponsored the annual [[Howard Nemerov Sonnet Award]].\u003cbr\u003e \u003cbr\u003e ====Canada====\u003cbr\u003e-In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e+In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii-xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators of a form using a single word per line to capture its honed perception.\u003cref\u003eSee [http:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 Ricochet: ''Word Sonnets \u002f Sonnets d'un mot''] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20131029201325\u002fhttp:\u002f\u002fwww.ruor.uottawa.ca\u002fen\u002fhandle\u002f10393\u002f20354 |date=29 October 2013 }}, by Seymour Mayne, French translation: [[:fr:Sabine Huynh|Sabine Huynh]], University of Ottawa Press, 2011.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -128,41 +124,19 @@\u003cbr\u003e [[Paulus Melissus]] was the first to introduce the sonnet into [[German poetry]].\u003cref\u003e{{Allgemeine Deutsche Biographie|21|293|297|Melissus, Paul Schede|Erich Schmidt}}\u003cbr\u003e \u003c\u002fref\u003e But the man who did most to raise the sonnet to German consciousness was [[Martin Opitz]], who in two works, ''Buch von der deutschen Poeterey'' (1624) and ''Acht B\u00fccher Deutscher Poematum'' (1625), established the sonnet as a separate genre and its rules of composition. It was to be written in iambic alexandrines, with alternating masculine and feminine enclosed rhymes in the octave and a more flexible sestet with three rhymes. Reinforcing them were translated examples from Petrarch, Ronsard and [[Daniel Heinsius]].\u003cref\u003eMichael Haldane, [https:\u002f\u002fwww.michaelhaldane.com\u002fOpitz.htm \"Martin Opitz, Father of German Poetry: Translation and the Sonnet\"], 2005\u003c\u002fref\u003e Thereafter in the 18th century, [[Johann Wolfgang von Goethe]] wrote several love sonnets, using a rhyme scheme derived from Italian poetry. After his death, Goethe's followers created the freer 'German sonnet', which is rhymed ABBA BCCB CDD CDD.\u003cbr\u003e \u003cbr\u003e-The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.com\u002fbooks?id=yh90bNsI5wkC p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.com\u002fbooks?id=Gb_1DwAAQBAJ ''Rilke, The Life of the Work''], OUP 2020, pp.455\u2013509\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914\u201318,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e+The sonnet tradition was then continued by [[August Wilhelm von Schlegel]], [[Paul von Heyse]] and others, reaching fruition in [[Rainer Maria Rilke]]'s ''[[Sonnets to Orpheus]]'', which has been described as \"one of the great modern poems, not to mention a monumental addition to the literature of the sonnet sequence\".\u003cref\u003eDavid Young's introduction to his translation of ''Sonnets to Orpheus'', Wesleyan University, 1987, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=yh90bNsI5wkC&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p.xv]\u003c\u002fref\u003e A cycle of 55 sonnets, it was written in two parts in 1922 while Rilke was in the midst of completing his [[Duino Elegies]]. The full title in German is ''Die Sonette an Orpheus: Geschrieben als ein Grab-Mal f\u00fcr Wera Ouckama Knoop'' (translated as ''Sonnets to Orpheus: Written as a Monument for Wera Ouckama Knoop''), commemorating the recent death of a young dancer from leukaemia. The ''{{lang|de|Grab-Mal}}'' (literally \"grave-marker\") of the title brings to mind the series of ''Tombeaux'' written by [[St\u00e9phane Mallarm\u00e9]], translated (among others) by Rilke in 1919, also coinciding with the sonnets of Michelangelo which Rilke had been translating in 1921. Rilke's own sonnets are fluidly structured as a transposition of the dead girl's dancing and encompass themes of life and death and art's relation to them. As well as having varied rhyme schemes, line lengths also vary and are irregularly metred, even within the same sonnet at times.\u003cref\u003eCharlie Louth, \"Die Sonnette an Orpheus\", in [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Gb_1DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false ''Rilke, The Life of the Work''], OUP 2020, pp.455-509\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fDublin_Review\u002fm1YVAQAAIAAJ?hl=en&gbpv=1&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418&printsec=frontcover p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Dutch ===\u003cbr\u003e-In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268\u20139\u003c\u002fref\u003e Another of his\u003cbr\u003e-sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"| date = 4 October 2022}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-aggrandisement of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-==Jewish languages==\u003cbr\u003e-For three millennia there has been a literature in the [[Jewish languages|various languages developed by the scattered communities of Jewish origin]]. So far as the sonnet is concerned, two languages were involved, mostly written in the European areas where that form was taken up and taken elsewhere in the world by emigrants.\u003cbr\u003e-\u003cbr\u003e-===Hebrew===\u003cbr\u003e-The Hebrew name for a sonnet is ''shir zahav'', deriving from a numerological play on words. Literally 'golden song', the consonants of ''zahav'' also stand for numbers adding up to fourteen, so that the term can also mean 'song of fourteen lines'.\u003cref\u003e''Gardens and Ghettos: The Art of Jewish Life in Italy'' (University of California, 2023), [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=QU3hEAAAQBAJ&pg=PT567&dq=%22shir+zahav%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwjnpcqIwvCIAxUvVUEAHQRoOb0Q6AF6BAgNEAI#v=onepage&q=%22shir%20zahav%22&f=false \"A millennium of Hebrew poetry in Italy\"]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The first sonnets in [[Medieval Hebrew poetry]] were probably composed in Rome by [[Immanuel the Roman]] around the year 1300, less than a century after the advent of the Italian sonnet.\u003cref name=\"DB\"\u003e{{cite journal |last1=Bregman |first1=Dvora |title=The Emergence of the Hebrew Sonnet |journal=Prooftexts |date=September 1991 |volume=11 |issue=3 |pages=239 |jstor=20689314 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314 |access-date=9 May 2022}}\u003c\u002fref\u003e\u003cref name=\"IL\"\u003e{{cite web |last1=Levy |first1=Isabelle |title=Immanuel of Rome and Dante |url=https:\u002f\u002fdigitaldante.columbia.edu\u002fhistory\u002fimmanuel-of-rome-and-dante-levy |website=Digital Dante |publisher=Columbia University Libraries |access-date=9 May 2022}}\u003c\u002fref\u003e 38 sonnets are included in his [[maqama]] collection ''Mahberot Immanuel'' that combine elements of both the quantitative metre traditional to Hebrew and Arabic verse and Italian syllabic metre. Predominantly dealing with love, they were rhymed ABBA ABBA CDE CDE.\u003cref name=\"IL\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-Immanuel's work provided a ready model for the second wave of Italo-Hebrew sonnet writers. The first printed edition of ''Mahberot Immanuel'' appeared in [[Brescia]] in 1492, followed by a second edition published in Constantinople in 1535. The new crop therefore coincided with the adoption of the sonnet in other European literatures at the start of the 16th century and persisted into the Baroque period of the following century, with more than eighty poets taking up the form. Though there was now a shift of focus to religious themes, love poetry was not excluded, particularly in the sonnets of David Okineira of [[Salonika]].\u003cref\u003eDvora Bregman, [https:\u002f\u002fwww.academia.edu\u002f19054917\u002fThe_Golden_Way_The_Hebrew_Sonnet_during_The_Renaissance_and_Baroque_Periods ''The Golden Way The Hebrew Sonnet during The Renaissance and Baroque Periods''], Arizona Center for Medieval and Renaissance Studies), Tempe, Arizona, 2006\u003c\u002fref\u003e The Baroque practice of incorporating sonnets along with other verse into plays, as had Shakespeare in England and Lope da Vega in Spain, was also to be found in [[Moses ben Mordecai Zacuto]]'s ''Yesod Olam'' (Foundation of the World, 1642) and in ''Asirei ha-Tiqva'' (Prisoners of Hope, 1673), an allegorical play by [[Joseph de la Vega]]. A further revival of the Hebrew sonnet followed in the 18th century, associated with Samson Cohen Modon (1679\u20131727), [[Moshe Chaim Luzzatto]] and his cousin, Ephraim Luzzatto (1729\u20131792), who are regarded as founders of modern Hebrew literature.\u003cref\u003eDvora Bregman, \"The Emergence of the Hebrew Sonnet\", [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314?read-now=1&seq=1  Prooftexts, Vol. 11, No. 3 (September 1991), p. 232]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-That the form persisted into the 20th century was celebrated by [[Shaul Tchernichovsky]] in his ''Ma\u1e25beret ha-Sonetot'' (Berlin 1923), in which appeared a sonnet of his own celebrating its continuity since the time of Immanuel of Rome: \"Thou art dear to me, how dear to me, ''Sonetot, O shir zahav''\".\u003cref\u003e[https:\u002f\u002fwww.academia.edu\u002f19054917 Bregman 2006, p.1]\u003c\u002fref\u003e The same author was responsible for introducing the [[crown of sonnets]] into Hebrew poetry. \u003cbr\u003e-\u003cbr\u003e-===Yiddish===\u003cbr\u003e-\u003cbr\u003e-[[Yiddish]], the name given to a continuum of Judaeo-German dialects spoken particularly across Eastern Europe, has had a literature since the Middle Ages. The sonnet, however, arriving late in the surrounding Slavic areas, was at first viewed as an alien genre among Jewish writers in Yiddish. Its adoption came only slowly with greater access to secular educational and with emigration. \u003cbr\u003e-\u003cbr\u003e-The first poets to use the form are credited as Dovid Kenigsberg (1891-1942) and [[Fradl Shtok]]. The former published ''Soneten'' ([[Lviv|Lemberg]] 1913) and later his hundred sonnets (''Hundert Soneten'', Vienna, 1921).\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f993\u002fKenigsberg-Dovid The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Shtok emigrated to the US while young and began publishing poetry soon after her arrival in New York in 1910.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f309\u002fShtok-Fradl-1888-1952 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e In reality, earlier sonnets dating from the 1890s were written in the US by Morris Vintshevski (1856-1932); and in [[Vilnius]] those written by [[Leib Naidus]], starting from 1910, demonstrated the westward-spreading influence of Symbolist-inspired modernism.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&pg=PA55&dq=%22Yiddish+Sonnets%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiQz6KO_tGIAxXKbEEAHcZJDS4Q6AF6BAgOEAI#v=onepage&q=%22Yiddish%20Sonnets%22&f=false pp. 55-9]\u003c\u002fref\u003e Those poets in Europe who authored entire collections of sonnets include Gershon-Peysekh Vayland (1869\u20131942), published in [[Warsaw]] in 1938 and 1939;\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4683\u002fVayland-Gershon-Peysekh-1869-1942 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Yankev Gotlib (1911\u20131945), published in [[Kaunas]] in 1938;\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f6183\u002fGotlib-Yankev-October-1911-May-27-1945 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and the Polish [[Abraham Nahum Stencl ]], whose ''Londoner Sonetn'' were published after his arrival in London in 1937.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f260\u002fShtentsl-Avrom-Nokhum-Abraham-Nahum-Stencl The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e \u003cbr\u003e-\u003cbr\u003e-Later examples of those writing substantial numbers of sonnets in the US number the scholar [[N. B. Minkoff]], who included a [[sonnet cycle]] in ''Lieder'' (1924), his first publication after immigrating,\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f2858\u002fMinkov-Nokhum-Borekh-November-18-1893-March-14-1958 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and Aron Glantz-Leyeles (1899\u20131968), who published a whole collection of poems in mediaeval forms in 1926. This included \"Autumn\", a densely rhymed [[crown of sonnets|garland of fifteen sonnets]].\u003cref\u003e''American Yiddish Poetry'', Stanford University, 2007, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=KkmmAAAAIAAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false pp. 46-7]\u003c\u002fref\u003e In 1932 Yoysef-Leyzer Kalushiner (1893\u20131968) published a whole book of sonnets in New York.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f1369\u002fKalushiner-Yoysef-Leyzer-June-29-1893-1968 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e He was followed by the little known M. Freed, who had already published a sonnet collection, ''The Narcissi'' (\"\u05e0\u05d0\u05e8\u05e6\u05d9\u05e1\u05df\", Czernowitz, 1937), in [[Bukovina]] before making his way to the US, where he published ''An evening by the Prut'' (\u05de. \u05e4\u05e8\u05d9\u05d3\u05d5\u05d5\u05d9\u05d9\u05e0\u05d9\u05e0\u05d2\u05e2\u05e8, New York, 1942).\u003cref\u003eA. V. Zornytskyi, [http:\u002f\u002feprints.zu.edu.ua\u002f16246\u002f1\u002fTHE%20YIDDISH%20SONNETS.pdf \"The Yiddish sonnets of M. Freed\"]\u003
