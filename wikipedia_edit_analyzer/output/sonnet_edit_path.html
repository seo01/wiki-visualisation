cs |edition=Fourth |location=Princeton, NJ |publisher=Princeton University Press |isbn=978-0-691-13334-8 |oclc=908736323}} (p. 1320)\u003c\u002fref\u003e 1776 sonnet \"Addressed to my Friends at Yale College, on my Leaving them to join the Army\".\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.sonnets.org\u002fhumphreys.htm#001| title = Sonnets.org}}\u003c\u002fref\u003e The sonnet form was used widely thereafter, including by [[William Lloyd Garrison]] and [[William Cullen Bryant]].\u003cref name=\"ugapress.org\"\u003e{{Cite web|url=https:\u002f\u002fwww.ugapress.org\u002fbook\u002f9780820357645\u002fforms-of-contention\u002f|title = Forms of Contention: Influence and the African American Sonnet Tradition}}\u003c\u002fref\u003e Later, [[Henry Wadsworth Longfellow]] and others followed suit.\u003cref\u003eLewis Sterner, [http:\u002f\u002fwww.sonnets.org\u002fsterner.htm ''The Sonnet in American Literature'' (1930)]\u003c\u002fref\u003e His were characterised by a \"purple richness of diction\" and by their use of material images to illustrate niceties of thought and emotion.\u003cref\u003e''The book of the sonnet'', ed. by Leigh Hunt and S. Adams (1866), p.102\u003c\u002fref\u003e He also translated several sonnets, including seven by [[Michelangelo]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.online-literature.com\u002fforums\u002fshowthread.php?3965-Sonnets-of-Michelangelo| title = Online Literature}}\u003c\u002fref\u003e Later on, among [[Emma Lazarus]]' many sonnets, perhaps the best-known is \"[[The New Colossus]]\" of 1883,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002flazarus.htm|title=Emma Lazarus}}\u003c\u002fref\u003e which celebrates the [[Statue of Liberty]] and its role in welcoming immigrants to the New World.\u003cbr\u003e+The earliest American sonnet is [[David Humphreys (soldier)|David Humphreys]]'s\u003cref\u003e{{cite encyclopedia |editor1-last=Greene |editor1-first=Roland |editor2-last=Cushman |editor2-first=Stephen |editor3-last=Cavanagh |editor3-first=Clare |editor4-last=Ramazani |editor4-first=Jahan |editor5-last=Rouzer |editor5-first=Paul |editor1-link=Roland Greene |display-editors=2 |author1-last=Brogan |author1-first=T.V.F. |author2-last=Zillman |author2-first=L.J. |author3-last=Scott |author3-first=C.|author4-last=Lewin |author4-first=J. |title=Sonnet |pages=1318\u20131321 |date=2012 |encyclopedia=The Princeton Encyclopedia of Poetry and Poetics |edition=Fourth |location=Princeton, NJ |publisher=Princeton University Press |isbn=978-0-691-13334-8 |oclc=908736323}} (p. 1320)\u003c\u002fref\u003e 1776 sonnet \"Addressed to my Friends at Yale College, on my Leaving them to join the Army\".\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.sonnets.org\u002fhumphreys.htm#001| title = Sonnets.org}}\u003c\u002fref\u003e The sonnet form was used widely thereafter, including by [[William Lloyd Garrison]] and [[William Cullen Bryant]].\u003cref name=\"ugapress.org\"\u003e{{Cite web|url=https:\u002f\u002fwww.ugapress.org\u002fbook\u002f9780820357645\u002fforms-of-contention\u002f|title = Forms of Contention: Influence and the African American Sonnet Tradition}}\u003c\u002fref\u003e Later, [[Henry Wadsworth Longfellow]] and others followed suit.\u003cref\u003eLewis Sterner, [http:\u002f\u002fwww.sonnets.org\u002fsterner.htm ''The Sonnet in American Literature'' (1930)]\u003c\u002fref\u003e His were characterised by a \"purple richness of diction\" and by their use of material images to illustrate niceties of thought and emotion.\u003cref\u003e''The book of the sonnet'', ed. by Leigh Hunt and S. Adams (1866), p.102\u003c\u002fref\u003e He also translated several sonnets, including seven by [[Michelangelo]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.online-literature.com\u002fforums\u002fshowthread.php?3965-Sonnets-of-Michelangelo| title = Online Literature}}\u003c\u002fref\u003e Later on, among [[Emma Lazarus]]' many sonnets, perhaps the best-known is \"[[The New Colossus]]\" of 1883,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002flazarus.htm|title=Emma Lazarus|website=www.sonnets.org}}\u003c\u002fref\u003e which celebrates the [[Statue of Liberty]] and its role in welcoming immigrants to the New World.\u003cbr\u003e \u003cbr\u003e In the 19th century, sonnets written by American poets began to be anthologised as such. They were included in a separate section in Leigh Hunt and S. Adams' ''The Book of the Sonnet'' (London and Boston, 1867), which included an essay by Adams on \"American Sonnets and Sonneteers\" and a section devoted only to sonnets by American women.\u003cref\u003e''The Book of the Sonnet'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=uc1.$b250912&view=1up&seq=11&skin=2021 vol.1] and [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=coo.31924064948346&view=1up&seq=16&skin=2021 vol.2], Hathi Trust\u003c\u002fref\u003e Later came [[William Sharp (writer)|William Sharp]]'s anthology of ''American Sonnets'' (1889)\u003cref\u003e{{cite web| url = https:\u002f\u002farchive.org\u002fdetails\u002famericansonnets00shar\u002fpage\u002fn9\u002fmode\u002f2up| title = Internet Archive| year = 1889}}\u003c\u002fref\u003e and Charles H. Crandall's ''Representative sonnets by American poets, with an essay on the sonnet, its nature and history'' ([[Houghton Mifflin & Co.]], 1890). The essay also surveyed the whole history of the sonnet, including English examples and European examples in translation, in order to contextualise the American achievement.\u003cref\u003e''Representative sonnets by American poets'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=hvd.32044013711908&view=1up&seq=17&skin=2021 Hathi Trust]\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 94\u003cbr\u003e+++ Revision 95\u003cbr\u003e@@ -110,7 +110,7 @@\u003cbr\u003e \u003cbr\u003e Shortly after the publication of Wyeth's, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Solt-moonshot 2.jpg|thumb|upright=0.45|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e+[[File:Solt-moonshot 2.jpg|thumb|upright=0.6|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e But at this time too began to appear sequences of [[quatorzain]]s with only a tenuous relationship to the sonnet form. [[Ted Berrigan]]'s ''The Sonnets'' (1964) discard metre and rhyme but retain the dynamics of a 14-line structure with a change of direction at the volta. Berrigan claimed to have been inspired by \"Shakespeare\u2019s sonnets because they were quick, musical, witty and short\".\u003cref\u003eBerrigan's talk at the Poetry Project Workshop, [https:\u002f\u002fwww.2009-2019.poetryproject.org\u002fwp-content\u002fuploads\u002fv2-ted-berrigan.pdf 27 February 1979]\u003c\u002fref\u003e Others have described Berrigan's work as a [[Postmodern literature|postmodern]] collage using \"repetition, rearrangement, and the use of 'found' phrases and text\", that functions as a \"radical deconstruction of the sonnet\".\u003cref\u003eTimothy Henry, \"Time And Time Again\": The Strategy of Simultaneity in Ted Berrigan's ''The Sonnets''\", [http:\u002f\u002fjacketmagazine.com\u002f40\u002fhenry-berrigan.shtml ''Jacket'' 40, 2010]\u003c\u002fref\u003e From 1969 [[Robert Lowell]] too began publishing a less radical deconstruction of the form in his series of five collections of [[blank verse]] sonnets, including his [[Pulitzer Prize]] volume ''The Dolphin'' (1973). These he described as having \u201cthe eloquence at best of iambic pentameter, and often the structure and climaxes of sonnets\".\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoets\u002frobert-lowell \"Robert Lowell 1917\u20131977\"], Poetry Foundation\u003c\u002fref\u003e\u003cbr\u003e@@ -175,10 +175,6 @@\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e [[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-==See also==\u003cbr\u003e-;Associated forms\u003cbr\u003e-* [[Quatorzain]]\u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e {{Reflist|30em}}","--- Revision 95\u003cbr\u003e+++ Revision 96\u003cbr\u003e@@ -17,7 +17,7 @@\u003cbr\u003e In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n. 80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of [[Petrarch]]'s ''Il Canzoniere'']]\u003cbr\u003e-[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]], where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e+[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]], where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003| publisher = Routledge}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e \u003cbr\u003e The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) that proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e \u003cbr\u003e@@ -31,7 +31,7 @@\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e \u003cbr\u003e ===Catalan===\u003cbr\u003e-One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436\u20131486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480\u20131630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e+One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436\u20131486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480\u20131630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010| publisher = Cambridge Scholars}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e@@ -82,7 +82,7 @@\u003cbr\u003e \u003cbr\u003e The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225\u2013251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e{{Cite web|url=http:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word|title=The River Duddon : a series of sonnets : Vaudracour and Julia: and other poems. To which is annexed, a topographical description of the country of the lakes, in the north of England|first=William|last=Wordsworth|date=17 April 1820|publisher=London : Printed for Longman, Hurst, Rees, Orme, and Brown|via=Internet Archive}}\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm|title=Sonnet Series and Itinerary Poems, 1820-1845, by William Wordsworth, ed. Geoffrey Jackson|website=www.wordsworthcentre.co.uk}}\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm|title=The Project Gutenberg eBook of The Poetical Works Of William Wordsworth (7 of 8), by William Wordsworth.|website=www.gutenberg.org}}\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229\u201335\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation}}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e+Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm|title=Sonnets from the Portuguese, by Elizabeth Barrett Browning|website=www.gutenberg.org}}\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e@@ -96,7 +96,7 @@\u003cbr\u003e \u003cbr\u003e The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html|title=The Life and Work of Dylan Thomas}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation}}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e+In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In North America===\u003cbr\u003e ====USA====\u003cbr\u003e@@ -132,7 +132,7 @@\u003cbr\u003e \u003cbr\u003e ===In Dutch ===\u003cbr\u003e In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268\u20139\u003c\u002fref\u003e Another of his\u003cbr\u003e-sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e+sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"| date = 4 October 2022}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-aggrandisement of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -151,7 +151,7 @@\u003cbr\u003e In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191\u20135]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e-In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cbr\u003e+In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica| date = 2 April 2024}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cbr\u003e \u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===","--- Revision 96\u003cbr\u003e+++ Revision 97\u003cbr\u003e@@ -171,7 +171,7 @@\u003cbr\u003e After Immanuel, the next wave of Italo-Hebrew sonnetry arrived in the 16th century, authored by Yosef Tzarfati (Giuseppe Gallo) and Moshe ben Yoav, each poet composing around five sonnets.\u003cref name=\"DB\"\u002f\u003e{{rp|231}} In total, over eighty Hebrew-language sonnets from the 16th century are extant, composed in locations as varied as [[Amsterdam]], [[Oran]], and [[Turkey]].\u003cref name=\"DB\"\u002f\u003e{{rp|231\u2013232}}\u003cbr\u003e \u003cbr\u003e ==Indian languages==\u003cbr\u003e-In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e\u003cbr\u003e+In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri language|Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e [[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e","--- Revision 97\u003cbr\u003e+++ Revision 98\u003cbr\u003e@@ -35,7 +35,7 @@\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e-The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016.\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7\u20138.]\u003c\u002fref\u003e\u003cbr\u003e+The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016.\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Girona University, 2017, [https:\u002f\u002fdugi-doc.udg.edu\u002fbitstream\u002fhandle\u002f10256\u002f14701\u002fLozanoAnguloAnna_Treball.pdf?sequence=1 pp. 35ff.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e ","--- Revision 98\u003cbr\u003e+++ Revision 99\u003cbr\u003e@@ -72,7 +72,7 @@\u003cbr\u003e \u003cbr\u003e [[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of [[Shakespeare]]'s ''Sonnets'']]\u003cbr\u003e [[Shakespeare's sonnets|Shakespeare's sequence of 154 sonnets]] departs from the norm in addressing more than one person in its course, male as well as female. In addition, other sonnets by him were incorporated into some of his plays. Another exception at this time was the form used in [[Spenserian sonnet|Edmund Spenser's ''Amoretti'']], which has the interlaced rhyme scheme ABAB BCBC CDCD EE. And soon after, in the following century, [[John Donne]] adapted the emerging Baroque style to the new subject matter of his series of ''[[Holy Sonnets]]''.\u003cbr\u003e-\u003cbr\u003e+easy lemon queasy\u003cbr\u003e [[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'', Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373.]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', ed. Alex Preminger and T. V. F. Brogan, Princeton University Press, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th\u201319th centuries===="],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"oPMTwQkNRL8Xj4O\u002fjG4RwU47gL\u002fXOw9Bpw4PQd63DUH3uw5BPEcEQbWSB0E="},"y":{"dtype":"f4","bdata":"oqAIQWn6SEBoUlRAH4oFQdP6UkCAa\u002fG\u002fcqAHwIIy5b+WDt+\u002fVO\u002f6vwMDAsA="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -119,6 +119,8 @@\u003cbr\u003e In Canada during the last decades of the 19th century, the [[Confederation Poets]] and especially [[Archibald Lampman]] were known for their sonnets, which were mainly on pastoral themes.\u003cref\u003eMalcolm Ross, Introduction, Poets of the Confederation (Toronto: McClelland and Stewart, 1960), vii\u2013xii\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Canadian poet [[Seymour Mayne]] has published a few collections of word sonnets, and is one of the chief innovators o
