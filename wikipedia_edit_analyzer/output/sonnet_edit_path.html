c\u002fref\u003e Later collections of sonnets include ''Sonetn fun toye-voye'' (Sonnets of chaos, New York, 1957) by Yirmye Hesheles, (1910\u20132010)\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4839\u002fHesheles-Yirmye-February-27-1910-October-16-2010 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and [[Mani Leib]]'s ''Sonetn'' (1961), considered the crowning achievement of his work and \"one of the last great works of Yiddish poetry\".\u003cref\u003eJordan Finkin, \"To organize beauty: the sonnets of Mani Leyb\", [https:\u002f\u002fgo.gale.com\u002fps\u002fi.do?id=GALE%7CA428175302&sid=googleScholar&v=2.1&it=r&linkaccess=abs&issn=02719274&p=LitRC&sw=w&userGroupName=anon%7E6c63b88&aty=open-web-entry  ''Studies in American Jewish Literature'' 34.1], Spring 2015\u003c\u002fref\u003e To these post-war collections may be added ''Meksike, finf un draysik sonetn'' (Mexico, 35 sonnets, 1949), which was published in [[Mexico City]] after Austridan Oystriak (1911-92) had fled there from Europe in 1940.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f7039\u002fUstri-Dan-Yeshayahu-Oystriak-Austridan-December-23-1911-1992 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Yiddish sonnets published in Israel, where the preferred language was Hebrew, were comparatively rare. Samuel Jacob Taubes (1898-1975) had already published religious sonnets in Europe before emigrating to Israel after a wandering literary career.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4130\u002fToybish-Yankev-Shmuel-Jacob-Samuel-Taubes-August-13-1898-February-2-1975 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Shlomo Roitman (1913-85) began writing in Russia and published sonnet collections after his arrival in Israel.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f594\u002fRoytman-Shloyme-February-1-1913-January-15-1985 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e\u003cbr\u003e+In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268-9\u003c\u002fref\u003e Another of his\u003cbr\u003e+sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237-8, 304-5\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-agrandisment of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their  own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Slavic languages==\u003cbr\u003e ===Czech===\u003cbr\u003e-[[File:Wien Museum Online Sammlung W 4140 1-2 (cropped).jpg|thumb|upright=0.8|Karel Hynek M\u00e1cha]]\u003cbr\u003e+[[File:Macha karel.jpg|thumb|upright=0.8|Karel Hynek M\u00e1cha]]\u003cbr\u003e The sonnet was introduced into Czech literature at the beginning of the 19th century. The first great Czech sonneteer was [[J\u00e1n Koll\u00e1r]], who wrote a cycle of sonnets named ''Sl\u00e1vy Dcera'' (''The daughter of Sl\u00e1va''&nbsp;\u002f&nbsp;''The daughter of fame''\u003cref\u003eHere the poet used a pun on the word ''sl\u00e1va'' (fame) and the general name for Slavic nations, suggesting that the Slavs are predestined to heroic deeds and great fame among the nations.\u003c\u002fref\u003e). While Koll\u00e1r was Slovak, he was a supporter of Pan-Slavism and wrote in Czech, as he disagreed that Slovak should be a separate language. Koll\u00e1r's magnum opus was planned as a Slavic epic poem as great as Dante's ''[[Divine Comedy]]''. It consists of ''The Prelude'' written in quantitative [[hexameter]]s, and sonnets. The number of poems increased in subsequent editions and came up to 645.\u003cref\u003e{{cite web| url = http:\u002f\u002fzlatyfond.sme.sk\u002fdielo\u002f142\u002fKollar_Slavy-dcera\u002f6| title = Full text at Slovak digital library}}\u003c\u002fref\u003e The greatest Czech romantic poet, [[Karel Hynek M\u00e1cha]] also wrote many sonnets. In the second half of the 19th century [[Jaroslav Vrchlick\u00fd]] published ''Sonety samot\u00e1\u0159e'' (''Sonnets of a Solitudinarian''). Another poet, who wrote many sonnets was [[Josef Svatopluk Machar]]. He published ''\u010cty\u0159i knihy sonet\u016f'' (''The Four Books of Sonnets''). In the 20th century [[V\u00edt\u011bzslav Nezval]] wrote the cycle ''100 sonet\u016f zachr\u00e1nkyni v\u011b\u010dn\u00e9ho studenta Roberta Davida'' (''One Hundred Sonnets for the Woman who Rescued Perpetual Student Robert David''). After the Second World War the sonnet was the favourite form of [[Old\u0159ich Vyhl\u00eddal]]. Czech poets use different metres for sonnets, Koll\u00e1r and M\u00e1cha used decasyllables, Vrchlick\u00fd iambic pentameter, [[Anton\u00edn Sova]] free verse, and [[Ji\u0159\u00ed Orten]] the [[Czech alexandrine]]. Ond\u0159ej Hanus, himself the author of distinguished sonnets, wrote a monograph about Czech sonnets in the first half of the twentieth century.\u003cref\u003e{{Cite journal | url=https:\u002f\u002fwww.academia.edu\u002f1804495 | title=\u010cesk\u00fd sonet v prvn\u00ed polovin\u011b 20. Stolet\u00ed (Czech Sonnet in the First Half of the Twentieth Century)| last1=Hanus| first1=Ond\u0159ej}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Polish===\u003cbr\u003e@@ -172,55 +146,54 @@\u003cbr\u003e the Tsar sentenced him to [[exile]] in the [[Crimean Peninsula]]. Mickiewicz's sonnet sequence focuses heavily on the culture and [[Islam]]ic religion of the [[Crimean Tatars]]. The sequence was translated into English by [[Edna Worthley Underwood]].\u003cref\u003eEdna W. Underwood (translator), [https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f27069\u002f27069-h\u002f27069-h.htm \"Sonnets from the Crimea] by Adam Mickiewicz\", Paul Elder and Company, San Francisco (1917)\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Russian===\u003cbr\u003e-In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191\u20135]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e+In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=pngV3Ff2EBcC&pg=PA192&dq=%22Onegin+sonnet%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiXpN3O4JTzAhUJgFwKHapXDEwQ6AF6BAgKEAI#v=onepage&q=%22Onegin%20sonnet%22&f=false pp.191-5]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=EPuAI-tHo48C&pg=PA144&dq=Lermontov+%22Onegin+stanza%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwibmMjM55TzAhXinFwKHTBIBKkQ6AF6BAgGEAI#v=onepage&q=Lermontov%20%22Onegin%20stanza%22&f=false p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e-In Slovenia the sonnet became a national verse form, using [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cref\u003eBoris A. Novac, [https:\u002f\u002fOJSAdmin,+1-en-PKn-2005-3-1.pdf \"Kosovel, a great poet but a poor prosodist\" p. 142]\u003c\u002fref\u003e\u003cbr\u003e-The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica| date = 2 April 2024}}\u003c\u002fref\u003e wrote several sonnet sequences from 1831 onwards and is particularly known for his [[crown of sonnets]], ''Sonetni venec'' (''[[A Wreath of Sonnets]]'').\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e Many later poets followed him in using the sonnet form. After the [[Second World War]], Slovenian poets wrote both traditional rhymed sonnets and [[postmodern literature|postmodern]] ones, unrhymed and in free verse. Among such writers are [[Milan Jesih]]\u003cref\u003eDavid Bandel, [https:\u002f\u002flitteraeslovenicae.si\u002fwp-content\u002fuploads\u002fspremna-beseda-jesih.pdf \"The Mystery of the Subject\"]\u003c\u002fref\u003e  and [[Ale\u0161 Debeljak]].\u003cbr\u003e+In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cbr\u003e \u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===\u003cbr\u003e * See [[Irish poetry]]\u003cbr\u003e-Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books), p. 40.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e{{cite news|url=https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 |title=Shakespeare's work has been translated into Irish \u2013 and it sounds amazing|first=Fiona |last=Audley|newspaper=[[The Irish Post]]|date=14 March 2018}}\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme and rhythms while rendering into Irish.\u003cref\u003e Sion\u00f3id, Muiris, [https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f \"Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love\"], shakespeare.org.\u003c\u002fref\u003e\u003cbr\u003e+Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish - and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme  and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e-According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e+According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eJan Morris (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]]. Page 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press. Pages ''ix-x''\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 'Canu'r carchar': Prison Sonnets of T. E. Nicholas] [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Semitic languages==\u003cbr\u003e+===Hebrew===\u003cbr\u003e+The first sonnets in [[Medieval Hebrew poetry]] were probably composed in Rome by [[Immanuel the Roman]] around the year 1300 and less than a century after the advent of the Italian sonnet.\u003cref name=\"DB\"\u003e{{cite journal |last1=Bregman |first1=Dvora |title=The Emergence of the Hebrew Sonnet |journal=Prooftexts |date=September 1991 |volume=11 |issue=3 |pages=239 |jstor=20689314 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314 |access-date=9 May 2022}}\u003c\u002fref\u003e\u003cref name=\"IL\"\u003e{{cite web |last1=Levy |first1=Isabelle |title=Immanuel of Rome and Dante |url=https:\u002f\u002fdigitaldante.columbia.edu\u002fhistory\u002fimmanuel-of-rome-and-dante-levy |website=Digital Dante |publisher=Columbia University Libraries |access-date=9 May 2022}}\u003c\u002fref\u003e 38 sonnets are included in his [[maqama]] collection ''Mahberot Immanuel'' that combine elements of both the quantitative metre traditional to Hebrew and Arabic verse and Italian syllabic metre.\u003cref name=\"IL\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+After Immanuel, the next wave of Italo-Hebrew sonnetry arrived in the 16th century, authored by Yosef Tzarfati (Giuseppe Gallo) and Moshe ben Yoav, each poet composing around five sonnets.\u003cref name=\"DB\"\u002f\u003e{{rp|231}} In total, over eighty Hebrew-language sonnets from the 16th century are extant, composed in locations as varied as [[Amsterdam]], [[Oran]], and [[Turkey]].\u003cref name=\"DB\"\u002f\u003e{{rp|231\u2013232}}\u003cbr\u003e \u003cbr\u003e ==Indian languages==\u003cbr\u003e-In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri language|Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e\u003cbr\u003e+In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e-[[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e+[[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm - e - Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==See also==\u003cbr\u003e-===Sonnet forms===\u003cbr\u003e-* [[Caudate sonnet]]\u003cbr\u003e-* [[Crown of sonnets]]\u003cbr\u003e-* [[Curtal sonnet]]\u003cbr\u003e-* [[Petrarchan sonnet]]\u003cbr\u003e+;Associated forms\u003cbr\u003e+* [[Quatorzain]]\u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e {{Reflist|30em}}\u003cbr\u003e \u003cbr\u003e ==Further reading==\u003cbr\u003e * I. Bell, et al. ''A Companion to Shakespeare's Sonnets''. [[Blackwell Publishing]], 2006. {{ISBN|1-4051-2155-6}}.\u003cbr\u003e-* Burt, Stephen (now Stephanie) and Mikics, David. [https:\u002f\u002fbooks.google.co.uk\u002fbooks?i hn Rutherford, ''The Spanish Golden Age Sonnet''. University of Wales Press, 2016. {{ISBN|9781783168989}}, {{ISBN|1783168986}}.\u003cbr\u003e-* William Sharp, [https:\u002f\u002fbooks.google.com\u002fbooks?id=KLQvAQAAMAAJ ''Sonnets of this Century''], London 1887.\u003cbr\u003e * M. R. G. Spiller. ''The Development of the Sonnet: An Introduction''. Routledge, 1992. {{ISBN|0-415-08741-4}}.\u003cbr\u003e * M. R. G. Spiller. ''The Sonnet Sequence: A Study of Its Strategies''. Twayne Pub., 1997. {{ISBN|0-8057-0970-3}}.\u003cbr\u003e ","--- Revision 50\u003cbr\u003e+++ Revision 51\u003cbr\u003e@@ -154,7 +154,7 @@\u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===\u003cbr\u003e * See [[Irish poetry]]\u003cbr\u003e-Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e+Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when [[Dublin]]-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his [[British civil service]] post at the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]] of 1916. There he became the first Irish language poet to write sonnets, which is how the form was introduced into [[Modern literature in Irish]].\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish - and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme  and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 51\u003cbr\u003e+++ Revision 52\u003cbr\u003e@@ -47,9 +47,9 @@\u003cbr\u003e \u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e-The first sonnets in Portuguese literature are ascribed to Dom Pedro in the early 15th century. A son of [[John I of Portugal|King John I]], he was also responsible for translations of sonnets by Petrarch. But the form did not come into its own until the following century in the work of  [[Lu\u00eds de Cam\u00f5es]], who generally follows the styles of [[Italian poetry]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in them the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The introduction of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e+The first sonnets in [[Portuguese literature]] are ascribed to [[Peter, Duke of Coimbra|Dom Pedro]] in the early [[15th-century]]. A son of [[John I of Portugal|King John I]], he was also responsible for translations of sonnets by Petrarch. But the form did not come into its own until the following century in the work of  [[Lu\u00eds de Cam\u00f5es]], who generally follows the styles of [[Italian poetry]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in them the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of [[Thomas de Noronha]] were once appreciated, and the love sonnets of [[Barbosa Bacellar]] (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The introduction of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked [[Francisca J\u00falia da Silva Munster ]](1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}","--- Revision 52\u003cbr\u003e+++ Revision 53\u003cbr\u003e@@ -154,7 +154,7 @@\u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===\u003cbr\u003e * See [[Irish poetry]]\u003cbr\u003e-Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when [[Dublin]]-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his [[British civil service]] post at the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]] of 1916. There he became the first Irish language poet to write sonnets, which is how the form was introduced into [[Modern literature in Irish]].\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e+Although sonnets had long been written in English by poets of Irish heritage such as [[Sir Aubrey de Vere, 2nd Baronet|Sir Aubrey de Vere]], [[Oscar Wilde]], [[William Butler Yeats]], [[Tom Kettle]], and [[Patrick Kavanagh]], the sonnet form failed to enter [[Irish poetry]] in the [[Irish language]]. This changed, however, during the [[Gaelic revival]] when Dublin-born [[Liam G\u00f3gan]] (1891\u20131979) was dismissed from his post in the [[National Museum of Ireland]] and imprisoned at [[Frongoch internment camp]] following the [[Easter Rising]]. There he became the first poet to write sonnets in the Irish language.\u003cref\u003e''Leabhar na hAthghabh\u00e1la, Poems of Repossession'', ed. by [[Louis de Paor]] (Bloodaxe Books). Page 40.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 2009, poet [[Muiris Sion\u00f3id]] published a complete translation of [[William Shakespeare]]'s [[Shakespeare's sonnets|154 sonnets]] into Irish under the title ''Rotha M\u00f3r an Ghr\u00e1'' (\"The Great Wheel of Love\").\u003cref name=\"irishpost.com\"\u003e[https:\u002f\u002fwww.irishpost.com\u002flife-style\u002fshakespeares-work-translated-irish-sounds-amazing-151497 \"Shakespeare's work has been translated into Irish - and it sounds amazing\"], ''[[The Irish Post]]'' 14 March 2018.\u003c\u002fref\u003e In an article about his translations, Sion\u00f3id wrote that Irish poetic forms are completely different from those of other languages and that both the sonnet form and the [[iambic pentameter]] line had long been considered \"entirely unsuitable\" for composing poetry in Irish. In his translations, Soin\u00f3id chose to closely reproduce Shakespeare's rhyme scheme  and rhythms while rendering into Irish.\u003cref\u003e[https:\u002f\u002fwww.shakespeare.org.uk\u002fexplore-shakespeare\u002fblogs\u002faistri\u00fa-na-soin\u00e9ad-go-gaeilge-saothar-gr\u00e1-translating-sonnets-irish-labour-love\u002f Aistri\u00fa na Soin\u00e9ad go Gaeilge: Saothar Gr\u00e1! Translating the Sonnets to Irish: A Labour of Love] by Muiris Sion\u00f3id.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -47,9 +47,10 @@\u003cbr\u003e \u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e-The first sonnets in [[Portuguese literature]] are ascribed to [[Peter, Duke of Coimbra|Dom Pedro]] in the early [[15th-century]]. A son of [[John I of Portugal|King John I]], he was also responsible for translations of sonnets by Petrarch. But the form did not come into its own until the following century in the work of  [[Lu\u00eds de Cam\u00f5es]], who generally follows the styles of [[Italian poetry]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in them the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of [[Thomas de Noronha]] were once appreciated, and the love sonnets of [[Barbosa Bacellar]] (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The introduction of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked [[Francisca J\u00falia da Silva Munster ]](1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e+[[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fHistory_of_Spanish_and_Portuguese_Litera\u002fd25DhbGrH2AC?hl=en&gbpv=1&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12&printsec=frontcover vol.2 p.13]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e\u003cbr\u003e+However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -35,7 +35,7 @@\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e-The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=Ic1RDwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=jhCWVKkkbH0C&printsec=frontcover#v=onepage&q&f=false pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e+The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in [[The Book of the Courtier]] (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-consciousness, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e@@ -48,9 +48,9 @@\u003cbr\u003e ===Portuguese===\u003cbr\u003e {{Main|Portuguese poetry}}\u003cbr\u003e [[Peter, Duke of Coimbra|Dom Pedro]], a son of [[John I of Portugal|King John I]], has been credited with translations of sonnets by Petrarch into Portuguese,\u003cref\u003eFriedrich Bouterwek, ''History of Spanish and Portuguese Literature'' (London 1823), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fHistory_of_Spanish_and_Portuguese_Litera\u002fd25DhbGrH2AC?hl=en&gbpv=1&dq=sonnet+Portuguese++-Browning&pg=PA12-IA12&printsec=frontcover vol.2 p.13]\u003c\u002fref\u003e but the form did not come into its own until the start of the 16th century. It was then that [[S\u00e1 de Miranda]] introduced the sonnet and other Italian forms, after returning from a five-year stay in Italy.\u003cref\u003e[https:\u002f\u002fwww.britannica.com\u002fart\u002fPortuguese-literature \"Portuguese Literature\"], Britannica online]\u003c\u002fref\u003e\u003cbr\u003e-However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=d25DhbGrH2AC&newbks=1&newbks_redir=0&dq=sonnet+Portuguese+-Browning&source=gbs_navlinks_s  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AyzGBQAAQBAJ&pg=PT831&lpg=PT831&dq=parnassian+triad&source=bl&ots=DJcUjd7OtJ&sig=ACfU3U3d7r_JqTc782JV9as-VzOwfA_m4w&hl=en&sa=X&ved=2ahUKEwjNsrXh3u31AhWFnVwKHejTC-0Q6AF6BAgXEAM#v=onepage&q=parnassian%20triad&f=false p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e+However, the greatest sonneteer of this period was the slightly younger [[Lu\u00eds de Cam\u00f5es]],\u003cref\u003e{{cite book |last1=Mois\u00e9s |first1=Massaud |title=A literatura portuguesa |date=1997 |publisher=Editora Cultrix |isbn=978-85-316-0231-3 |pages=54\u201355 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=xcQYSXj0xN0C&q=%22el+rei+seleuco%22&pg=PA54 |language=pt-BR}}\u003c\u002fref\u003e\u003cref name=\"Bergel\"\u003e{{cite web |last1=Bergel |first1=Antonio J. Al\u00edas |title=Cam\u00f5es laureado: Legitimaci\u00f3n y uso po\u00e9tico de Cam\u00f5es durante el biling\u00fcismo ib\u00e9rico en el \"per\u00edodo filipino\" |url=https:\u002f\u002fwebs.ucm.es\u002finfo\u002fespeculo\u002fnumero42\u002fcamoensl.html |publisher=Esp\u00e9culo \u2014 Revista de estudios literarios |access-date=24 February 2021}}\u003c\u002fref\u003e though in his work the influence of the Spanish pioneers of the form has also been discerned.\u003cref\u003e{{cite web |title=Lu\u00eds de Cam\u00f5es e Ausias March |url=http:\u002f\u002f74.125.155.132\u002fscholar?q=cache:52R2HKqj7aMJ:scholar.google.com\u002f+camoes+castelhano&hl=pt-BR&lr=&as_sdt=2000&as_vis=1 |page=178 |publisher=Pen\u00ednsula \u2014 Revista de Estudos Ib\u00e9ricos (2003)}}\u003c\u002fref\u003e Among later writers, the comic sonnets of Thomas de Noronha were once appreciated, and the love sonnets of Barbosa Bacellar (c.1610-1663), also known for his learned glosses on the sonnets of Cam\u00f5es.\u003cref\u003eFriedrich Bouterwek, [https:\u002f\u002fbooks.google.com\u002fbooks?id=d25DhbGrH2AC&q=sonnet+Portuguese+-Browning  ''History of Spanish and Portuguese Literature''], Volume 2, London 1823, pp.11-13, 290-93\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The introduction later of a purified sonnet style to [[Brazilian literature]] was due to [[Cl\u00e1udio Manuel da Costa]], who also composed Petrarchan sonnets in Italian during his stay in Europe.\u003cref\u003eBouterwek 1823, pp.357-9\u003c\u002fref\u003e However, it was in the wake of French [[Parnassianism]] that there developed a similar movement in Brazil which included the notable sonneteers [[Alberto de Oliveira]], [[Raimundo Correia]] and, especially, [[Olavo Bilac]].\u003cref\u003e''Anthologie de la Po\u00e9sie Ib\u00e9ro-Am\u00e9ricaine'', Editions Nagel, 1956, \"Introduction\", pp.35-6\u003c\u002fref\u003e Others writing sonnets in that style included the now overlooked Francisca J\u00falia da Silva Munster (1871-1920)\u003cref\u003eLatin American Women Writers: An Encyclopedia, Routledge, 2014, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AyzGBQAAQBAJ&dq=parnassian+triad&pg=PT831 p.204]\u003c\u002fref\u003e and the Symbolist [[Afro-Brazilian]] poet [[Jo\u00e3o da Cruz e Sousa]].\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e@@ -75,20 +75,20 @@\u003cbr\u003e [[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'' Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29-73]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', Ed. Alex Preminger and T.V.F. Brogan, Princeton UP, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th-19th centuries====\u003cbr\u003e-The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=AC27DwAAQBAJ&dq=poem+%22Thomas+Warwick%22&source=gbs_navlinks_s p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fThe_Cambridge_History_of_English_Literat\u002fUtmE5JzCOFAC?hl=en&gbpv=1&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231&printsec=frontcover p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e+The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fThe_Cambridge_History_of_English_Literat\u002fUtmE5JzCOFAC?hl=en&gbpv=1&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231&printsec=frontcover p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e \u003cbr\u003e [[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e[https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421 Poetry Explorer]\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fPoems_on_Various_Subjects\u002fn61aAAAAcAAJ?hl=en&gbpv=1&dq=Coleridge+%22Poems+on+Various+Subjects%22&printsec=frontcover p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fSappho_and_Phaon_In_a_series_of_legitima\u002f7K5YAAAAcAAJ?hl=en&gbpv=1&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10&printsec=frontcover p.10]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225-251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word\u002fpage\u002fn3\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e[http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm Wordsworth Centre]\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm ''The Poetical Works of William Wordsworth'', Vol. VII]\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229-35\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=PZYkimc1bZUC&printsec=frontcover#v=onepage&q&f=false   p.116]\u003c\u002fref\u003e\u003cbr\u003e+The example which later impressed Wordsworth the most was that of Milton's sonnets, which he described in 1803 as having \"an energetic and varied flow of sound, crowding into narrow room more of the combined effect of rhyme and blank verse, than can be done by any other kind of verse I know of\".\u003cref\u003eJay Curlin, \"Chaos in the Convent's Narrow Room: Milton and the Sonnet\", [https:\u002f\u002fscholarlycommons.obu.edu\u002fcgi\u002fviewcontent.cgi?article=1077&context=articles Scholarly Commons, 1993]\u003c\u002fref\u003e Thus aware that its compression was applicable to a great variety of themes, Wordsworth eventually wrote some 523 sonnets which were to exert a powerful stylistic influence throughout the first half of the 19th century.\u003cref\u003eGeorge Sanderlin, \"The Influence of Milton and Wordsworth on the Early Victorians\", ELH 5.3 (1938), [https:\u002f\u002fwww.jstor.org\u002fstable\u002fpdf\u002f2871590.pdf pp.225-251]\u003c\u002fref\u003e Part of his appeal to others was the way in which he used the sonnet as a focus for new subject matter, frequently in sequences. From his series on the River Duddon\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002friverduddonserie00word\u002fpage\u002fn3\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e sprang reflections on any number of regional natural features; his travel tour effusions, though not always confined to sonnet form,\u003cref\u003e[http:\u002f\u002fwww.wordsworthcentre.co.uk\u002fCornell\u002fpages\u002fcup_ssip.htm Wordsworth Centre]\u003c\u002fref\u003e found many imitators. What eventually became three series of ''Ecclesiastical Sonnets''\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f47143\u002f47143-h\u002f47143-h.htm ''The Poetical Works of William Wordsworth'', Vol. VII]\u003c\u002fref\u003e started a vogue for sonnets on religious and devotional themes.\u003cref\u003eSanderlin 1938, pp.229-35\u003c\u002fref\u003e Milton's predilection for political themes, continuing through Wordsworth's \"Sonnets dedicated to liberty and order\", now became an example for contemporaries too. Barely had the process begun, however, before a sceptical alarmist in ''[[The New Monthly Magazine]]'' for 1821 was diagnosing \"sonnettomania\" as a new sickness akin to \"the bite of a rabid animal\".\u003cref\u003eJennifer Ann Wagner, ''A Moment's Monument: Revisionary Poetics and the Nineteenth-century English Sonnet'', Fairleigh Dickinson Univ Press, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=PZYkimc1bZUC   p.116]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?hl=en&lr=&id=WduHxc6iYp4C&oi=fnd&pg=PA1&dq=nineteenth+century+sonnets&ots=vXw2IpOycT&sig=wX2IuCbQ3vwjPel_My4Klmb2elA#v=onepage&q=nineteenth%20century%20sonnets&f=false p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976?seq=6#metadata_info_tab_contents p.356]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=MwFdAAAAcAAJ&printsec=frontcover&dq=Meredith+%22Modern+Love%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiLqtzf9J_2AhVhQEEAHbq5A18Q6AF6BAgJEAI#v=onepage&q=Meredith%20%22Modern%20Love%22&f=false pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e-\u003cbr\u003e-Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855-1891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy\u002fpage\u002fn5\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e[https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=J7QwAQAAMAAJ&printsec=frontcover#v=onepage&q&f=false Google Books]\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=WduHxc6iYp4C&printsec=frontcover#v=onepage&q&f=false Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e+That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e+\u003cbr\u003e+Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855-1891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy\u002fpage\u002fn5\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=J7QwAQAAMAAJ Google Books]\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e \u003cbr\u003e ====20th century====\u003cbr\u003e As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example . He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e@@ -105,9 +105,9 @@\u003cbr\u003e \u003cbr\u003e Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Claude McKay]], [[Countee Cullen]], [[Langston Hughes]], and [[Sterling A. Brown]].\u003
