 the Sonnet'', [[The Belknap Press]], 2010. {{ISBN|978-0-674-04814-0}}.\u003cbr\u003e+* Burt, Stephen (now Stephanie) and Mikics, David. [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=WduHxc6iYp4C&pg=PA250&source=gbs_toc_r&cad=1#v=onepage&q&f=false ''The Art of the Sonnet'', [[The Belknap Press]], 2010. {{ISBN|978-0-674-04814-0}}.\u003cbr\u003e * T. W. H. Crosland. ''The English Sonnet''. Hesperides Press, 2006. {{ISBN|1-4067-9691-3}}.\u003cbr\u003e * Paula R. Feldman and Daniel Robinson, ''A Century of Sonnets: The Romantic Era Revival, 1750-1850''. Oxford University Press, 1999. {{ISBN|0-19-511561-9}}.\u003cbr\u003e * J. Fuller. ''The Oxford Book of Sonnets''. [[Oxford University Press]], 2002. {{ISBN|0-19-280389-1}}.","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -181,7 +181,7 @@\u003cbr\u003e \u003cbr\u003e ==Further reading==\u003cbr\u003e * I. Bell, et al. ''A Companion to Shakespeare's Sonnets''. [[Blackwell Publishing]], 2006. {{ISBN|1-4051-2155-6}}.\u003cbr\u003e-* Burt, Stephen (now Stephanie) and Mikics, David. [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=WduHxc6iYp4C&pg=PA250&source=gbs_toc_r&cad=1#v=onepage&q&f=false ''The Art of the Sonnet'', [[The Belknap Press]], 2010. {{ISBN|978-0-674-04814-0}}.\u003cbr\u003e+* Burt, Stephen (now Stephanie) and Mikics, David. [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=WduHxc6iYp4C&pg=PA250&source=gbs_toc_r&cad=1#v=onepage&q&f=false ''The Art of the Sonnet''], [[The Belknap Press]], 2010. {{ISBN|978-0-674-04814-0}}.\u003cbr\u003e * T. W. H. Crosland. ''The English Sonnet''. Hesperides Press, 2006. {{ISBN|1-4067-9691-3}}.\u003cbr\u003e * Paula R. Feldman and Daniel Robinson, ''A Century of Sonnets: The Romantic Era Revival, 1750-1850''. Oxford University Press, 1999. {{ISBN|0-19-511561-9}}.\u003cbr\u003e * J. Fuller. ''The Oxford Book of Sonnets''. [[Oxford University Press]], 2002. {{ISBN|0-19-280389-1}}.","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -163,12 +163,6 @@\u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-==Semitic languages==\u003cbr\u003e-===Hebrew===\u003cbr\u003e-The first sonnets in [[Medieval Hebrew poetry]] were probably composed in Rome by [[Immanuel the Roman]] around the year 1300 and less than a century after the advent of the Italian sonnet.\u003cref name=\"DB\"\u003e{{cite journal |last1=Bregman |first1=Dvora |title=The Emergence of the Hebrew Sonnet |journal=Prooftexts |date=September 1991 |volume=11 |issue=3 |pages=239 |jstor=20689314 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314 |access-date=9 May 2022}}\u003c\u002fref\u003e\u003cref name=\"IL\"\u003e{{cite web |last1=Levy |first1=Isabelle |title=Immanuel of Rome and Dante |url=https:\u002f\u002fdigitaldante.columbia.edu\u002fhistory\u002fimmanuel-of-rome-and-dante-levy |website=Digital Dante |publisher=Columbia University Libraries |access-date=9 May 2022}}\u003c\u002fref\u003e 38 sonnets are included in his [[maqama]] collection ''Mahberot Immanuel'' that combine elements of both the quantitative metre traditional to Hebrew and Arabic verse and Italian syllabic metre.\u003cref name=\"IL\"\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-After Immanuel, the next wave of Italo-Hebrew sonnetry arrived in the 16th century, authored by Yosef Tzarfati (Giuseppe Gallo) and Moshe ben Yoav, each poet composing around five sonnets.\u003cref name=\"DB\"\u002f\u003e{{rp|231}} In total, over eighty Hebrew-language sonnets from the 16th century are extant, composed in locations as varied as [[Amsterdam]], [[Oran]], and [[Turkey]].\u003cref name=\"DB\"\u002f\u003e{{rp|231\u2013232}}\u003cbr\u003e \u003cbr\u003e ==Indian languages==\u003cbr\u003e In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri language|Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -134,6 +134,28 @@\u003cbr\u003e sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"| date = 4 October 2022}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237\u20138, 304\u20135\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-aggrandisement of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Jewish languages==\u003cbr\u003e+For three millennia there has been a literature in the [[Jewish languages|various languages developed by the scattered communities of Jewish origin]]. So far as the sonnet is concerned, two languages were involved, mostly written in the European areas where that form was taken up and taken elsewhere in the world by emigrants.\u003cbr\u003e+\u003cbr\u003e+===Hebrew===\u003cbr\u003e+The Hebrew name for a sonnet is ''shir zahav'', deriving from a numerological play on words. Literally 'golden song', the consonants of ''zahav'' also stand for numbers adding up to fourteen, so that the term can also mean 'song of fourteen lines'.\u003cref\u003e''Gardens and Ghettos: The Art of Jewish Life in Italy'' (University of California, 2023), [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=QU3hEAAAQBAJ&pg=PT567&dq=%22shir+zahav%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwjnpcqIwvCIAxUvVUEAHQRoOb0Q6AF6BAgNEAI#v=onepage&q=%22shir%20zahav%22&f=false \"A millennium of Hebrew poetry in Italy\"]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The first sonnets in [[Medieval Hebrew poetry]] were probably composed in Rome by [[Immanuel the Roman]] around the year 1300, less than a century after the advent of the Italian sonnet.\u003cref name=\"DB\"\u003e{{cite journal |last1=Bregman |first1=Dvora |title=The Emergence of the Hebrew Sonnet |journal=Prooftexts |date=September 1991 |volume=11 |issue=3 |pages=239 |jstor=20689314 |url=https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314 |access-date=9 May 2022}}\u003c\u002fref\u003e\u003cref name=\"IL\"\u003e{{cite web |last1=Levy |first1=Isabelle |title=Immanuel of Rome and Dante |url=https:\u002f\u002fdigitaldante.columbia.edu\u002fhistory\u002fimmanuel-of-rome-and-dante-levy |website=Digital Dante |publisher=Columbia University Libraries |access-date=9 May 2022}}\u003c\u002fref\u003e 38 sonnets are included in his [[maqama]] collection ''Mahberot Immanuel'' that combine elements of both the quantitative metre traditional to Hebrew and Arabic verse and Italian syllabic metre. Predominantly dealing with love, they were rhymed ABBA ABBA CDE CDE.\u003cref name=\"IL\"\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+Immanuel's work provided a ready model for the second wave of Italo-Hebrew sonnet writers. The first printed edition of ''Mahberot Immanuel'' appeared in [[Brescia]] in 1492, followed by a second edition published in Constantinople in 1535. The new crop therefore coincided with the adoption of the sonnet in other European literatures at the start of the 16th century and persisted into the Baroque period of the following century, with more than eighty poets taking up the form. Though there was now a shift of focus to religious themes, love poetry was not excluded, particularly in the sonnets of David Okineira of [[Salonika]].\u003cref\u003eDvora Bregman, [https:\u002f\u002fwww.academia.edu\u002f19054917\u002fThe_Golden_Way_The_Hebrew_Sonnet_during_The_Renaissance_and_Baroque_Periods ''The Golden Way The Hebrew Sonnet during The Renaissance and Baroque Periods''], Arizona Center for Medieval and Renaissance Studies), Tempe, Arizona, 2006\u003c\u002fref\u003e The Baroque practice of incorporating sonnets along with other verse into plays, as had Shakespeare in England and Lope da Vega in Spain, was also to be found in [[Moses ben Mordecai Zacuto]]'s ''Yesod Olam'' (Foundation of the World, 1642) and in ''Asirei ha-Tiqva'' (Prisoners of Hope, 1673), an allegorical play by [[Joseph de la Vega]]. A further revival of the Hebrew sonnet followed in the 18th century, associated with Samson Cohen Modon (1679\u20131727), [[Moshe Chaim Luzzatto]] and his cousin, Ephraim Luzzatto (1729\u20131792), who are regarded as founders of modern Hebrew literature.\u003cref\u003eDvora Bregman, \"The Emergence of the Hebrew Sonnet\", [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20689314?read-now=1&seq=1  Prooftexts, Vol. 11, No. 3 (September 1991), p. 232]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+That the form persisted into the 20th century was celebrated by [[Shaul Tchernichovsky]] in his ''Ma\u1e25beret ha-Sonetot'' (Berlin 1923), in which appeared a sonnet of his own celebrating its continuity since the time of Immanuel of Rome: \"Thou art dear to me, how dear to me, ''Sonetot, O shir zahav''\".\u003cref\u003e[https:\u002f\u002fwww.academia.edu\u002f19054917 Bregman 2006, p.1]\u003c\u002fref\u003e The same author was responsible for introducing the [[crown of sonnets]] into Hebrew poetry. \u003cbr\u003e+\u003cbr\u003e+===Yiddish===\u003cbr\u003e+\u003cbr\u003e+[[Yiddish]], the name given to a continuum of Judaeo-German dialects spoken particularly across Eastern Europe, has had a literature since the Middle Ages. The sonnet, however, arriving late in the surrounding Slavic areas, was at first viewed as an alien genre among Jewish writers in Yiddish. Its adoption came only slowly with greater access to secular educational and with emigration. \u003cbr\u003e+\u003cbr\u003e+The first poets to use the form are credited as Dovid Kenigsberg (1891-1942) and [[Fradl Shtok]]. The former published ''Soneten'' ([[Lviv|Lemberg]] 1913) and later his hundred sonnets (''Hundert Soneten'', Vienna, 1921).\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f993\u002fKenigsberg-Dovid The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Shtok emigrated to the US while young and began publishing poetry soon after her arrival in New York in 1910.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f309\u002fShtok-Fradl-1888-1952 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e In reality, earlier sonnets dating from the 1890s were written in the US by Morris Vintshevski (1856-1932); and in [[Vilnius]] those written by [[Leib Naidus]], starting from 1910, demonstrated the westward-spreading influence of Symbolist-inspired modernism.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&pg=PA55&dq=%22Yiddish+Sonnets%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiQz6KO_tGIAxXKbEEAHcZJDS4Q6AF6BAgOEAI#v=onepage&q=%22Yiddish%20Sonnets%22&f=false pp. 55-9]\u003c\u002fref\u003e Those poets in Europe who authored entire collections of sonnets include Gershon-Peysekh Vayland (1869\u20131942), published in [[Warsaw]] in 1938 and 1939;\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4683\u002fVayland-Gershon-Peysekh-1869-1942 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Yankev Gotlib (1911\u20131945), published in [[Kaunas]] in 1938;\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f6183\u002fGotlib-Yankev-October-1911-May-27-1945 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and the Polish [[Abraham Nahum Stencl ]], whose ''Londoner Sonetn'' were published after his arrival in London in 1937.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f260\u002fShtentsl-Avrom-Nokhum-Abraham-Nahum-Stencl The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+Later examples of those writing substantial numbers of sonnets in the US number the scholar [[N. B. Minkoff]], who included a [[sonnet cycle]] in ''Lieder'' (1924), his first publication after immigrating,\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f2858\u002fMinkov-Nokhum-Borekh-November-18-1893-March-14-1958 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and Aron Glantz-Leyeles (1899\u20131968), who published a whole collection of poems in mediaeval forms in 1926. This included \"Autumn\", a densely rhymed [[crown of sonnets|garland of fifteen sonnets]].\u003cref\u003e''American Yiddish Poetry'', Stanford University, 2007, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=KkmmAAAAIAAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false pp. 46-7]\u003c\u002fref\u003e In 1932 Yoysef-Leyzer Kalushiner (1893\u20131968) published a whole book of sonnets in New York.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f1369\u002fKalushiner-Yoysef-Leyzer-June-29-1893-1968 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e He was followed by the little known M. Freed, who had already published a sonnet collection, ''The Narcissi'' (\"\u05e0\u05d0\u05e8\u05e6\u05d9\u05e1\u05df\", Czernowitz, 1937), in [[Bukovina]] before making his way to the US, where he published ''An evening by the Prut'' (\u05de. \u05e4\u05e8\u05d9\u05d3\u05d5\u05d5\u05d9\u05d9\u05e0\u05d9\u05e0\u05d2\u05e2\u05e8, New York, 1942).\u003cref\u003eA. V. Zornytskyi, [http:\u002f\u002feprints.zu.edu.ua\u002f16246\u002f1\u002fTHE%20YIDDISH%20SONNETS.pdf \"The Yiddish sonnets of M. Freed\"]\u003c\u002fref\u003e Later collections of sonnets include ''Sonetn fun toye-voye'' (Sonnets of chaos, New York, 1957) by Yirmye Hesheles, (1910\u20132010)\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4839\u002fHesheles-Yirmye-February-27-1910-October-16-2010 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e and [[Mani Leib]]'s ''Sonetn'' (1961), considered the crowning achievement of his work and \"one of the last great works of Yiddish poetry\".\u003cref\u003eJordan Finkin, \"To organize beauty: the sonnets of Mani Leyb\", [https:\u002f\u002fgo.gale.com\u002fps\u002fi.do?id=GALE%7CA428175302&sid=googleScholar&v=2.1&it=r&linkaccess=abs&issn=02719274&p=LitRC&sw=w&userGroupName=anon%7E6c63b88&aty=open-web-entry  ''Studies in American Jewish Literature'' 34.1], Spring 2015\u003c\u002fref\u003e To these post-war collections may be added ''Meksike, finf un draysik sonetn'' (Mexico, 35 sonnets, 1949), which was published in [[Mexico City]] after Austridan Oystriak (1911-92) had fled there from Europe in 1940.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f7039\u002fUstri-Dan-Yeshayahu-Oystriak-Austridan-December-23-1911-1992 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Yiddish sonnets published in Israel, where the preferred language was Hebrew, were comparatively rare. Samuel Jacob Taubes (1898-1975) had already published religious sonnets in Europe before emigrating to Israel after a wandering literary career.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f4130\u002fToybish-Yankev-Shmuel-Jacob-Samuel-Taubes-August-13-1898-February-2-1975 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e Shlomo Roitman (1913-85) began writing in Russia and published sonnet collections after his arrival in Israel.\u003cref\u003e[https:\u002f\u002fcongressforjewishculture.org\u002fpeople\u002f594\u002fRoytman-Shloyme-February-1-1913-January-15-1985 The Congress for Jewish Culture Lexicon]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Slavic languages==\u003cbr\u003e ===Czech===","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -112,7 +112,7 @@\u003cbr\u003e [[File:Solt-moonshot 2.jpg|thumb|upright=0.6|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-But at this time too began to appear sequences of [[quatorzain]]s with only a tenuous relationship to the sonnet form. [[Ted Berrigan]]'s ''The Sonnets'' (1964) discard metre and rhyme but retain the dynamics of a 14-line structure with a change of direction at the volta. Berrigan claimed to have been inspired by \"Shakespeare\u2019s sonnets because they were quick, musical, witty and short\".\u003cref\u003eBerrigan's talk at the Poetry Project Workshop, [https:\u002f\u002fwww.2009-2019.poetryproject.org\u002fwp-content\u002fuploads\u002fv2-ted-berrigan.pdf 27 February 1979]\u003c\u002fref\u003e Others have described Berrigan's work as a [[Postmodern literature|postmodern]] collage using \"repetition, rearrangement, and the use of 'found' phrases and text\", that functions as a \"radical deconstruction of the sonnet\".\u003cref\u003eTimothy Henry, \"Time And Time Again\": The Strategy of Simultaneity in Ted Berrigan's ''The Sonnets''\", [http:\u002f\u002fjacketmagazine.com\u002f40\u002fhenry-berrigan.shtml ''Jacket'' 40, 2010]\u003c\u002fref\u003e From 1969 [[Robert Lowell]] too began publishing a less radical deconstruction of the form in his series of five collections of [[blank verse]] sonnets, including his [[Pulitzer Prize]] volume ''The Dolphin'' (1973). These he described as having \u201cthe eloquence at best of iambic pentameter, and often the structure and climaxes of sonnets\".\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoets\u002frobert-lowell \"Robert Lowell 1917\u20131977\"], Poetry Foundation\u003c\u002fref\u003e\u003cbr\u003e+But at this time too began to appear sequences of [[quatorzain]]s with only a tenuous relationship to the sonnet form. [[Ted Berrigan]]'s ''The Sonnets'' (1964) discard metre and rhyme but retain the dynamics of a 14-line structure with a change of direction at the volta. Berrigan claimed to have been inspired by \"Shakespeare\u2019s sonnets because they were quick, musical, witty and short\".\u003cref\u003eBerrigan's talk at the Poetry Project Workshop, [https:\u002f\u002fwww.2009-2019.poetryproject.org\u002fwp-content\u002fuploads\u002fv2-ted-berrigan.pdf 27 February 1979]\u003c\u002fref\u003e Others have described Berrigan's work as a [[Postmodern literature|postmodern]] collage using \"repetition, rearrangement, and the use of 'found' phrases and text\", that functions as a \"radical deconstruction of the sonnet\".\u003cref\u003eTimothy Henry, \"Time And Time Again\": The Strategy of Simultaneity in Ted Berrigan's ''The Sonnets''\", [http:\u002f\u002fjacketmagazine.com\u002f40\u002fhenry-berrigan.shtml ''Jacket'' 40, 2010]\u003c\u002fref\u003e From 1969 [[Robert Lowell]] too began publishing a less radical deconstruction of the form in his series of five collections of [[blank verse]] sonnets, including his [[Pulitzer Prize]] volume ''The Dolphin'' (1973). These he described as having \"the eloquence at best of iambic pentameter, and often the structure and climaxes of sonnets\".\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoets\u002frobert-lowell \"Robert Lowell 1917\u20131977\"], Poetry Foundation\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The contemporary reaction against the strict form is described in the introduction to [[William Baer (writer)|William Baer]]'s anthology ''Sonnets: 150 Contemporary Sonnets'' (2005).  But for all that a number of writers were declaring then that the sonnet was dead, others \u2013 including [[Richard Wilbur]], [[Howard Nemerov]] and [[Anthony Hecht]] \u2013 continued to write sonnets and eventually became associated with the magazines ''[[The Formalist]]'' and then ''[[Measure (journal)|Measure]]''. These journals, champions of the [[New Formalism]] between the years 1994 and 2017, sponsored the annual [[Howard Nemerov Sonnet Award]].\u003cbr\u003e ","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -75,6 +75,7 @@\u003cbr\u003e [[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'', Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373.]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', ed. Alex Preminger and T. V. F. Brogan, Princeton University Press, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th\u201319th centuries====\u003cbr\u003e+*See also [[Romantic sonnets]]\u003cbr\u003e The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e \u003cbr\u003e [[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421|title=Poetry Explorer- Classic Contemporary Poetry, ELEGIAC SONNET TO A MOPSTICK, by WILLIAM BECKFORD|website=www.poetryexplorer.net}}\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -192,6 +192,12 @@\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e [[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==See also==\u003cbr\u003e+===Sonnet forms===\u003cbr\u003e+* [[Caudate sonnet]]\u003cbr\u003e+* [[Curtal sonnet]]\u003cbr\u003e+* [[Petrarchan sonnet]]\u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e {{Reflist|30em}}","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -52,7 +52,7 @@\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e-In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e+In French [[Metre (poetry)#French|prosody]], sonnets were at first composed in decasyllable (the traditional verse of noble genres), then mainly in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]] and gradually (though never completely) replaced the ten-syllable verse in the noble genres. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the human race. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 29\u003cbr\u003e+++ Revision 30\u003cbr\u003e@@ -52,7 +52,7 @@\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e-In French [[Metre (poetry)#French|prosody]], sonnets were at first composed in decasyllable (the traditional verse of noble genres), then mainly in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]] and gradually (though never completely) replaced the ten-syllable verse in the noble genres. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e+In French [[Metre (poetry)#French|prosody]], sonnets were at first composed in decasyllable (the traditional verse of noble genres), then mainly in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]] and gradually (though never completely) replaced the ten-syllable verse in the noble genres. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for imitating classical (Greek and Latin) literature, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the human race. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -59,6 +59,11 @@\u003cbr\u003e By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e During the latter half of the 19th century, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The sonnet continued to be used throughout the 20th century. [[Louis Aragon]]'s defence of the sonnet is particularly noteworthy, in his resounding article \"Du sonnet\", published in ''Les Lettres fran\u00e7aises'' in 1954, and in his preface to [[Eug\u00e8ne Guillevic]]'s collection ''31 sonnets'', published the same year. He had already expressed his fascination with the sonnet form in 1944 in the introduction to [[Jean Cassou]]'s ''Trente-trois sonnets compos\u00e9s au secret'', published by \u00c9ditions de Minuit. \u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+In addition to these authors, there are major poets such as [[Philippe Jaccottet]], whose 1953 collection ''L'Effraie et autres po\u00e9sies'' includes several sonnets, as well as [[Yves Bonnefoy]] and, still alive, [[Jacques Roubaud]] (who has devoted himself to the practice and historical study of this form), [[Bertrand Degott]], the Belgian poet [[William Cliff]] and [[Laurent Fourcaut]], who make extensive use of the sonnet in the 21st century.\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e ","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -60,10 +60,9 @@\u003cbr\u003e \u003cbr\u003e During the latter half of the 19th century, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The sonnet continued to be used throughout the 20th century. [[Louis Aragon]]'s defence of the sonnet is particularly noteworthy, in his resounding article \"Du sonnet\", published in ''Les Lettres fran\u00e7aises' d-detrez\u002f9782710331100]\u003c\u002fref\u003e and [[Laurent Fourcaut]], who make extensive use of the sonnet in the 21st century.\u003cbr\u003e+The sonnet continued to be used throughout the 20th century. Before the 2nd World War, among others, [[Guillaume Apollinaire]] wrote several sonnets, as did [[Paul Val\u00e9ry]], who devoted a great deal of theoretical thought to the subject. Post war, [[Louis Aragon]]'s defence of the sonnet is particularly noteworthy, in his resounding article \"Du sonnet\", published in ''Les Lettres fran\u00e7aises'' in 1954, and in his preface to [[Eug\u00e8ne Guillevic]]'s collection ''31 sonnets'', published the same year. He had already expressed his fascination with the sonnet form in 1944 in the introduction to [[Jean Cassou]]'s ''Trente-trois sonnets compos\u00e9s au secret'', published by \u00c9ditions de Minuit\u003cref\u003e[https:\u002f\u002fngn.journals.yorku.ca\u002findex.php\u002fngn\u002farticle\u002fview\u002f39780\u002f36024]\u003c\u002fref\u003e. \u003cbr\u003e+\u003cbr\u003e+In addition to these authors, there are major poets such as [[Philippe Jaccottet]], whose 1953 collection ''L'Effraie et autres po\u00e9sies'' includes several sonnets, as well as [[Yves Bonnefoy]] and, still alive, [[Jacques Roubaud]] (who has devoted himself to the practice and historical study of this form \u003cref\u003e[https:\u002f\u002fmaisondelapoesieparis.com\u002fprogramme\u002fnuit-du-sonnet-jacques-roubaud-ses-invites\u002f]\u003c\u002fref\u003e), [[Bertrand Degott]], the Belgian poet [[William Cliff]]\u003cref\u003eTo name but one, his collection ''Autobiographie'' is a long garland of sonnets.[https:\u002f\u002fwww.editionslatableronde.fr\u002fautobiographie-suivi-de-conrad-detrez\u002f9782710331100]\u003c\u002fref\u003e, [[Pierre Garrigues]] and [[Laurent Fourcaut]], who make extensive use of the sonnet in the 21st century.\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e ","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -52,17 +52,13 @@\u003cbr\u003e \u003cbr\u003e ===French===\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e-In French [[Metre (poetry)#French|prosody]], sonnets were at first composed in decasyllable (the traditional verse of noble genres), then mainly in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]] and gradually (though never completely) replaced the ten-syllable verse in the noble genres. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for imitating classical (Greek and Latin) literature, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e+In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the human race. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e During the latter half of the 19th century, there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp. 21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s \"Sur une dame blonde\" limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p. 273.]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788\u20131862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p. 27.]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The sonnet continued to be used throughout the 20th century. Before the 2nd World War, among others, [[Guillaume Apollinaire]] wrote several sonnets, as did [[Paul Val\u00e9ry]], who devoted a great deal of theoretical thought to the subject. Post war, [[Louis Aragon]]'s defence of the sonnet is particularly noteworthy, in his resounding article \"Du sonnet\", published in ''Les Lettres fran\u00e7aises'' in 1954, and in his preface to [[Eug\u00e8ne Guillevic]]'s collection ''31 sonnets'', published the same year. He had already expressed his fascination with the sonnet form in 1944 in the introduction to [[Jean Cassou]]'s ''Trente-trois sonnets compos\u00e9s au secret'', published by \u00c9ditions de Minuit\u003cref\u003e[https:\u002f\u002fngn.journals.yorku.ca\u002findex.php\u002fngn\u002farticle\u002fview\u002f39780\u002f36024]\u003c\u002fref\u003e. \u003cbr\u003e-\u003cbr\u003e-In addition to these authors, there are major poets such as [[Philippe Jaccottet]], whose 1953 collection ''L'Effraie et autres po\u00e9sies'' includes several sonnets, as well as [[Yves Bonnefoy]] and, still alive, [[Jacques Roubaud]] (who has devoted himself to the practice and historical study of this form \u003cref\u003e[https:\u002f\u002fmaisondelapoesieparis.com\u002fprogramme\u002fnuit-du-sonnet-jacques-roubaud-ses-invites\u002f]\u003c\u002fref\u003e), [[Bertrand Degott]], the Belgian poet [[William Cliff]]\u003cref\u003eTo name but one, his collection ''Autobiographie'' is a long garland of sonnets.[https:\u002f\u002fwww.editionslatableronde.fr\u002fautobiographie-suivi-de-conrad-detrez\u002f9782710331100]\u003c\u002fref\u003e, [[Pierre Garrigues]] and [[Laurent Fourcaut]], who make extensive use of the sonnet in the 21st century.\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e ","--- Revision 36\u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -62,7 +62,7 @@\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e \u003cbr\u003e-===English===\u003cbr\u003e+===\u003cu\u003eEnglish\u003c\u002fu\u003e===\u003cbr\u003e ====Tudor and Stuart period====\u003cbr\u003e \u003cbr\u003e [[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some 25 of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge, 1964, pp. 166\u2013208.\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\".]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter \"Finding his Feet: Wyatt and the Founding of English Pentameter\"], ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005).\u003c\u002fref\u003e But, in addition, Wyatt's sonnets are generally closer in construction to those of Petrarch.","--- Revision 37\u003cbr\u003e+++ Revision 38\u003cbr\u003e@@ -85,7 +85,7 @@\u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.bartleby.com\u002flit-hub\u002fmatthew-arnold\u002fausterity-of-poetry\u002f|title=Austerity of Poetry|date=16 June 2022|website=Collection at Bartleby.com}}\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm|title=Sonnets from the Portuguese, by Elizabeth Barrett Browning|website=www.gutenberg.org}}\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets became chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm|title=Sonnets from the Portuguese, by Elizabeth Barrett Browning|website=www.gutenberg.org}}\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31\u201382]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e ","--- Revision 38\u003cbr\u003e+++ Revision 39\u003cbr\u003e@@ -85,7 +85,7 @@\u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100|title=William Wordsworth|website=www.sonnets.org}}\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010|title=John Keats|website=www.sonnets.org}}\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u00 002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\".]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter \"Finding his Feet: Wyatt and the Founding of English Pentameter\"], ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005).\u003c\u002fref\u003e But, in addition, Wyatt's sonnets are generally closer in construction to those of Petrarch.","--- Revision 40\u003cbr\u003e+++ Revision 41\u003cbr\u003e@@ -196,6 +196,7 @@\u003cbr\u003e ==See also==\u003cbr\u003e ===Sonnet forms===\u003cbr\u003e * [[Caudate sonnet]]\u003cbr\u003e+* [[Crown of sonnets]]\u003cbr\u003e * [[Curtal sonnet]]\u003cbr\u003e * [[Petrarchan sonnet]]\u003cbr\u003e ","--- Revision 41\u003cbr\u003e+++ Revision 42\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+The term '''sonnet''' refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e It derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 42\u003cbr\u003e+++ Revision 43\u003cbr\u003e@@ -185,7 +185,7 @@\u003cbr\u003e \u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e-According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e+According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]], [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]],\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e and [[T. H. Parry-Williams]]\u003cbr\u003e \u003cbr\u003e ==Indian languages==\u003cbr\u003e In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri language|Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e","--- Revision 43\u003cbr\u003e+++ Revision 44\u003cbr\u003e@@ -185,7 +185,7 @@\u003cbr\u003e \u003cbr\u003e ===In Welsh===\u003cbr\u003e * See [[Welsh poetry]]\u003cbr\u003e-According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]], [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]],\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e and [[T. H. Parry-Williams]]\u003cbr\u003e+According to [[Jan Morris]], \"When Welsh poets speak of [[Free Verse]], they mean forms like the sonnet or the ode, which obey the same rules as [[English language|English]] [[Metre (poetry)|poesy]]. [[Cerdd dafod|Strict Metre]]s verse still honours the [[Cynghanedd|complex rules]] laid down for correct poetic composition 600 years ago.\"\u003cref\u003eMorris, Jan (1984), ''The Matter of Wales: Epic Views of a Small Country'', [[Oxford University Press]], p. 152.\u003c\u002fref\u003e Nevertheless, several of the greatest recent [[Welsh language]] poets have also written sonnets, including [[Welsh nationalism|Welsh nationalist]] and [[Traditionalist Catholic]] poet [[Saunders Lewis]]\u003cref\u003eTranslated by Joseph P. Clancy (1993), ''Saunders Lewis: Selected Poems'', [[University of Wales]] Press, pp. ix-x.\u003c\u002fref\u003e and [[Far-left]] poet [[Thomas Evan Nicholas]].\u003cref\u003e[https:\u002f\u002fwww.library.wales\u002fdiscover\u002fdigital-gallery\u002fmanuscripts\u002fmodern-period\u002ft-e-nicholas#?c=&m=&s=&cv=&xywh=-63%2C-1635%2C2973%2C5728 ''Canu'r carchar'': ''The Prison Sonnets of T. E. Nicholas''], [[National Library of Wales]].\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Indian languages==\u003cbr\u003e In the Indian subcontinent, sonnets have been written in the [[Assamese (language)|Assamese]], [[Bengali (language)|Bengali]], [[Dogri language|Dogri]], English, [[Gujarati (language)|Gujarati]], [[Hindi]], [[Kannada]], [[Kashmiri language|Kashmiri]], [[Malayalam]], Manipuri, [[Marathi (language)|Marathi]], [[Nepali (language)|Nepali]], [[Oriya (language)|Oriya]], [[Sindhi (language)|Sindhi]] and [[Urdu]] languages.\u003cref\u003e''The Encyclopaedia of Indian Literature (Volume Five)'', 1992, pp. 4140\u20134146 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8126012218\u003c\u002fref\u003e","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -75,7 +75,7 @@\u003cbr\u003e [[John Milton]]'s sonnets constitute a special case and demonstrate another stylistic transition. Two youthful examples in English and five in Italian are Petrarchan in spirit. But the seventeen sonnets of his maturity address personal and political themes. It has been observed of their intimate tone, and the way the sense overrides the volta within the poem in some cases, that Milton is here adapting the sonnet form to that of the [[Odes (Horace)|Horatian ode]].\u003cref\u003eJohn H. Finley, Jr., \"Milton and Horace: A Study of Milton's Sonnets\", ''Harvard Studies in Classical Philology'', Vol. 48 (1937), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f310690?refreqid=excelsior%3A55b1e11b22c4e368c0ac5f49332ef7c3&seq=1#metadata_info_tab_contentsnow=1&refreqid=excelsior%3A18772fefad4336e1c8f88b1f635de51a&seq=1#page_scan_tab_contents pp. 29\u201373.]\u003c\u002fref\u003e He also seems to have been the first to introduce an Italian variation of the form, the [[caudate sonnet]], into English in his prolongation of \"On the New Forcers of Conscience Under the Long Parliament\".\u003cref\u003e\"Caudate sonnet\", ''The New Princeton Encyclopedia of Poetry and Poetics'', ed. Alex Preminger and T. V. F. Brogan, Princeton University Press, 1993.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ====18th\u201319th centuries====\u003cbr\u003e-*See also [[Romantic sonnets]]\u003cbr\u003e+{{See also|Romantic sonnets}}\u003cbr\u003e The fashion for the sonnet went out with the [[English Restoration|Restoration]], and hardly any were written between 1670 and the second half of the 18th century. Amongst the first to revive the form was [[Thomas Warton]], who took Milton for his model. Around him at Oxford were grouped those associated with him in this revival, including [[John Codrington Bampfylde]], [[Thomas Russell (poet)|Thomas Russell]], [[Thomas Warwick]] and [[Henry Headley]], some of whom published small collections of sonnets alone.\u003cref\u003eBethan Roberts, ''Charlotte Smith and the Sonnet'', OUP 2019, [https:\u002f\u002fbooks.google.com\u002fbooks?id=AC27DwAAQBAJ&q=poem+%22Thomas+Warwick%22 p.19]\u003c\u002fref\u003e  Many women, too, now took up the sonnet form, in particular [[Charlotte Smith (writer)|Charlotte Smith]], whose lachrymose ''Elegiac Sonnets'' (1784 onwards) are credited with helping create the 'school of sensibility' characteristic of the time.\u003cref\u003e''Cambridge History of English Literature'' (2005), [https:\u002f\u002fbooks.google.com\u002fbooks?id=UtmE5JzCOFAC&dq=sensibility+%22Elegaic+sonnets%22&pg=PA231 p.231]\u003c\u002fref\u003e [[William Lisle Bowles]] was also a close follower, but the success of both stirred up resistance in the poetic politics of the time.\u003cbr\u003e \u003cbr\u003e [[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421|title=Poetry Explorer- Classic Contemporary Poetry, ELEGIAC SONNET TO A MOPSTICK, by WILLIAM BECKFORD|website=www.poetryexplorer.net}}\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical subjects'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=7K5YAAAAcAAJ&dq=poetasters+%22Sappho+and+Phaon%22&pg=PA10 p.10]\u003c\u002fref\u003e","--- Revision 45\u003cbr\u003e+++ Revision 46\u003cbr\u003e@@ -80,7 +80,9 @@\u003cbr\u003e \u003cbr\u003e [[William Beckford (novelist)|William Beckford]] parodied Smith's melancholy manner and archaic diction in an \"Elegiac sonnet to a mopstick\".\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryexplorer.net\u002fpoem.php?id=10037421|title=Poetry Explorer- Classic Contemporary Poetry, ELEGIAC SONNET TO A MOPSTICK, by WILLIAM BECKFORD|website=www.poetryexplorer.net}}\u003c\u002fref\u003e In the preface to his 1796 collection ''Poems on Various Subjects'', [[Samuel Taylor Coleridge]] commented of his series of \"Effusions\" that \"I was fearful that the title \"Sonnet\" might have reminded my reader of the Poems of the Rev. W. L. Bowles \u2013 a comparison with whom would have sunk me below that mediocrity, on the surface of which I am at present enabled to float\".\u003cref\u003eS. T. Coleridge, ''Poems'', London 1796, [https:\u002f\u002fbooks.google.com\u002fbooks?id=n61aAAAAcAAJ&q=Coleridge+%22Poems+on+Various+Subjects%22 p.x]\u003c\u002fref\u003e There were formal objections too. Where most of the early revivalists had used Milton's sonnets as the model for theirs, Smith and Bowles had preferred the Shakespearean form.  This led to [[Mary Robinson (poet)|Mary Robinson]]'s fighting preface to her sequence ''Sappho and Phaon'', in which she asserted the legitimacy of the Petrarchan form as used by Milton over \"the non-descript ephemera from the heated brains of self-important poetasters\" that pass as sonnets in the literary reviews of her day.\u003cref\u003eMary Robinson, ''Sappho and Phaon: in a series of legitimate sonnets, with thoughts on poetical s
