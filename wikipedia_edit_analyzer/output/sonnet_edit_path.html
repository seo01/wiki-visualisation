rera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340?seq=6#metadata_info_tab_contents \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311-325]\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 62\u003cbr\u003e+++ Revision 63\u003cbr\u003e@@ -17,7 +17,7 @@\u003cbr\u003e In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two \"tercets\" each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n.80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Petrarch_canzoniere.jpg|thumb|upright=0.9|The first five sonnets of Petrarch's ''Il Canzoniere'']]\u003cbr\u003e-[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]] where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]]. \u003cbr\u003e+[[Guittone d'Arezzo]] rediscovered the sonnet form and brought it to [[Tuscany]] where he adapted it to [[Tuscan dialect]] when he founded the Siculo-Tuscan, or Guittonian school of poetry (1235\u20131294). He wrote almost 250 sonnets.\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=spKxJeHJgTAC&pg=PA1053| title = ''Medieval Italy: an encyclopedia, Volume 2,'' Christopher Kleinhenz| isbn = 9780415939317| last1 = Kleinhenz| first1 = Christopher| year = 2003}}\u003c\u002fref\u003e Among the host of other Italian poets that followed, the sonnets of [[Dante Alighieri]] and [[Guido Cavalcanti]] stand out, but later the most famous and widely influential was [[Petrarch]].\u003cbr\u003e \u003cbr\u003e The structure of a typical Italian sonnet as it developed included two parts that together formed a compact form of \"argument\". First, the [[octave (poetry)|octave]] forms the \"proposition\", which describes a \"problem\" or \"question\", followed by a [[sestet]] (two [[tercet]]s) which proposes a \"resolution\". Typically, the ninth line initiates what is called the \"turn\", or \"[[volta (literature)|volta]]\", which signals the move from proposition to resolution. Even in sonnets that do not strictly follow the problem\u002fresolution structure, the ninth line still often marks a \"turn\" by signaling a change in the tone, mood, or stance of the poem.\u003cbr\u003e \u003cbr\u003e@@ -39,7 +39,7 @@\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e-Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340?seq=6#metadata_info_tab_contents \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311-325]\u003c\u002fref\u003e\u003cbr\u003e+Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e[https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante Text at Wikisource]\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (Oct., 1898) (p.518)\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp.311-325]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585-1646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm Spanish text online]\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e[http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm Online text]\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p.207]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -84,7 +84,7 @@\u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976?seq=6#metadata_info_tab_contents p.356]\u003c\u002fref\u003e\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e ","--- Revision 63\u003cbr\u003e+++ Revision 64\u003cbr\u003e@@ -137,7 +137,7 @@\u003cbr\u003e \u003cbr\u003e ==Slavic languages==\u003cbr\u003e ===Czech===\u003cbr\u003e-[[File:Macha karel.jpg|thumb|upright=0.8|Karel Hynek M\u00e1cha]]\u003cbr\u003e+[[File:Wien Museum Online Sammlung W 4140 1-2 (cropped).jpg|thumb|upright=0.8|Karel Hynek M\u00e1cha]]\u003cbr\u003e The sonnet was introduced into Czech literature at the beginning of the 19th century. The first great Czech sonneteer was [[J\u00e1n Koll\u00e1r]], who wrote a cycle of sonnets named ''Sl\u00e1vy Dcera'' (''The daughter of Sl\u00e1va''&nbsp;\u002f&nbsp;''The daughter of fame''\u003cref\u003eHere the poet used a pun on the word ''sl\u00e1va'' (fame) and the general name for Slavic nations, suggesting that the Slavs are predestined to heroic deeds and great fame among the nations.\u003c\u002fref\u003e). While Koll\u00e1r was Slovak, he was a supporter of Pan-Slavism and wrote in Czech, as he disagreed that Slovak should be a separate language. Koll\u00e1r's magnum opus was planned as a Slavic epic poem as great as Dante's ''[[Divine Comedy]]''. It consists of ''The Prelude'' written in quantitative [[hexameter]]s, and sonnets. The number of poems increased in subsequent editions and came up to 645.\u003cref\u003e{{cite web| url = http:\u002f\u002fzlatyfond.sme.sk\u002fdielo\u002f142\u002fKollar_Slavy-dcera\u002f6| title = Full text at Slovak digital library}}\u003c\u002fref\u003e The greatest Czech romantic poet, [[Karel Hynek M\u00e1cha]] also wrote many sonnets. In the second half of the 19th century [[Jaroslav Vrchlick\u00fd]] published ''Sonety samot\u00e1\u0159e'' (''Sonnets of a Solitudinarian''). Another poet, who wrote many sonnets was [[Josef Svatopluk Machar]]. He published ''\u010cty\u0159i knihy sonet\u016f'' (''The Four Books of Sonnets''). In the 20th century [[V\u00edt\u011bzslav Nezval]] wrote the cycle ''100 sonet\u016f zachr\u00e1nkyni v\u011b\u010dn\u00e9ho studenta Roberta Davida'' (''One Hundred Sonnets for the Woman who Rescued Perpetual Student Robert David''). After the Second World War the sonnet was the favourite form of [[Old\u0159ich Vyhl\u00eddal]]. Czech poets use different metres for sonnets, Koll\u00e1r and M\u00e1cha used decasyllables, Vrchlick\u00fd iambic pentameter, [[Anton\u00edn Sova]] free verse, and [[Ji\u0159\u00ed Orten]] the [[Czech alexandrine]]. Ond\u0159ej Hanus, himself the author of distinguished sonnets, wrote a monograph about Czech sonnets in the first half of the twentieth century.\u003cref\u003e{{Cite journal | url=https:\u002f\u002fwww.academia.edu\u002f1804495 | title=\u010cesk\u00fd sonet v prvn\u00ed polovin\u011b 20. Stolet\u00ed (Czech Sonnet in the First Half of the Twentieth Century)| last1=Hanus| first1=Ond\u0159ej}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Polish===","--- Revision 64\u003cbr\u003e+++ Revision 65\u003cbr\u003e@@ -5,7 +5,7 @@\u003cbr\u003e {{Literature}}\u003cbr\u003e A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e \u003cbr\u003e-The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e+The term \"sonnet\" is derived from the Italian word ''sonetjo'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e \u003cbr\u003e According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e ","--- Revision 65\u003cbr\u003e+++ Revision 66\u003cbr\u003e@@ -5,7 +5,7 @@\u003cbr\u003e {{Literature}}\u003cbr\u003e A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e \u003cbr\u003e-The term \"sonnet\" is derived from the Italian word ''sonetjo'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e+The term \"sonnet\" is derived from the Italian word ''sonetto'' (lit. \"little song\", derived from the Latin word ''sonus'', meaning a sound). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e \u003cbr\u003e According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e ","--- Revision 66\u003cbr\u003e+++ Revision 67\u003cbr\u003e@@ -107,7 +107,7 @@\u003cbr\u003e \u003cbr\u003e One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Shortly afterwards, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e+Shortly afterwards the publication of Wyeth's, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Solt-moonshot 2.jpg|thumb|upright=0.45|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -107,7 +107,7 @@\u003cbr\u003e \u003cbr\u003e One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fre ngi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e+Shortly after the publication of Wyeth's, [[H. P. Lovecraft]] wrote his very different sonnet sequence, sections of which first appeared in genre magazines. It was not until 1943 that it saw complete publication as [[Fungi from Yuggoth]]. These 36 poems were written in a hybrid form based on the [[Petrarchan sonnet]] that invariably ends with a rhyming couplet reminiscent of the [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean sonnet]].\u003cref\u003e''An H.P. Lovecraft Encyclopedia'', Greenwood Publishing Group 2001, [https:\u002f\u002fbooks.google.com\u002fbooks?id=Myawoc_PbF4C&dq=petrarchan+%22fungi+from+yuggoth%22&pg=PA95 p.93]\u003c\u002fref\u003e Most of these poems are discontinuous, though unified by theme, being vignettes descriptive of the kinds of dreamed and otherworldly scenarios found in Lovecraft's fiction.\u003cref\u003eJim Moon, \"The internal continuity of Lovecraft\u2019s Fungi from Yuggoth\", in ''H.P. Lovecraft: Selected Works, Critical Perspectives and Interviews'',  McFarland, 2018, [https:\u002f\u002fbooks.google.com\u002fbooks?id=syJgDwAAQBAJ&q=rhyme&pg=PT253 p.245]\u003c\u002fref\u003e Their unmannered style was once compared to [[Edward Arlington Robinson]]'s,\u003cref\u003eS. T. Joshi's introduction to ''An Epicure in the Terrible: A Centennial Anthology of Essays in Honor of H.P. Lovecraft'', Fairleigh Dickinson Univ Press, 1991 , [https:\u002f\u002fbooks.google.com\u002fbooks?id=S3oH_VdH3BcC&dq=rhyme+%22fungi+from+yuggoth%22&pg=PA36 p.37]\u003c\u002fref\u003e but since then a case has been made for the work as minor poetry of contemporary importance in its own right.\u003cref\u003eGeoffrey Reiter, \"'Alone Before Eternity': A Review of H. P. Lovecraft\u2019s ''Fungi from Yuggoth''\", [https:\u002f\u002fchristandpopculture.com\u002falone-eternity-review-h-p-lovecrafts-fungi-yuggoth ''Christ and Pop Culture'', 27 June 2017]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Solt-moonshot 2.jpg|thumb|upright=0.45|[[Mary Ellen Solt]]'s [[concrete poetry|concrete]] \"Moonshot sonnet\" (1964)]]\u003cbr\u003e In the case of [[John Berryman]], he initially wrote a series of some hundred modernistic love sonnets during the 1940s. These, however, remained uncollected until 1967, when they appeared as ''Berryman\u2019s Sonnets'', fleshed out with a few additions to give them the form of a sequence. In her 2014 survey of the book for ''[[Poetry (magazine)|Poetry]]'', [[April Bernard]] suggests that he was there making of 'Berryman' a similar semi-fictional character to the 'Henry' in [[The Dream Songs]] (1964). She also identifies an ancient ancestry for the disordered syntax of the work through the English poets Thomas Wyatt and Gerard Manley Hopkins.\u003cref\u003eApril Bernard, \"Berryman's Sonnets\", [https:\u002f\u002fwww.poetryfoundation.org\u002fharriet-books\u002f2014\u002f06\u002fberrymans-sonnets Poetry Foundation]\u003c\u002fref\u003e","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -31,11 +31,11 @@\u003cbr\u003e The sole confirmed surviving sonnet in the [[Occitan language]] is by [[Paolo Lanfranchi da Pistoia]] and confidently dated to 1284.\u003cref name=bertoni119\u003eBertoni, 119.\u003c\u002fref\u003e This employs the rhyme scheme ABAB ABAB CDCDCD and has a political theme, as do some others of dubious authenticity or merit ascribed to \"William of Almarichi\" and [[Dante de Maiano]].\u003cbr\u003e \u003cbr\u003e ===Catalan===\u003cbr\u003e-One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436-1486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th  century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480-1630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e+One of the earliest sonnets in [[Catalan language|Catalan]] was written by Pere Torroella (1436-1486).\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.biografiasyvidas.com\u002fbiografia\u002ft\u002ftorroella.htm| title = Pere Torroella}}\u003c\u002fref\u003e In the 16th century, the most prolific and subtle Catalan writer of sonnets was Pere Seraf\u00ed,\u003cref\u003e{{cite book| url = https:\u002f\u002fbooks.google.com\u002fbooks?id=HlYaBwAAQBAJ&dq=pere+seraf%C3%AD+poet&pg=PA160| title = Barry Taylor, Alejandro Coroleu, Humanism and Christian Letters in Early Modern Iberia (1480-1630)| isbn = 9781443822442| last1 = Taylor| first1 = Barry| last2 = Coroleu| first2 = Alejandro| date = 11 May 2010}}\u003c\u002fref\u003e author of over 60 published between 1560 and 1565.\u003cbr\u003e \u003cbr\u003e ===Spanish===\u003cbr\u003e {{Main|Spanish poetry}}\u003cbr\u003e-The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'')  towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e+The poet [[\u00cd\u00f1igo L\u00f3pez de Mendoza, 1st Marquis of Santillana ]] is credited as among the foremost to attempt \"sonnets written in the Italian manner\" (''sonetos fechos al it\u00e1lico modo'') towards the middle of the 15th century. Since the [[Castilian Spanish|Castilian language]] and prosody were in a transitional state at the time, the experiment was unsuccessful.\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Ic1RDwAAQBAJ ''The Spanish Golden Age Sonnet''], ed. John Rutherford, University of Wales Press, 2016\u003c\u002fref\u003e It was therefore not until after 1526 that the form was reintroduced by [[Juan Bosc\u00e1n]]. According to his account, he met [[Andrea Navagero]], the [[Republic of Venice|Venetian]] Ambassador to the Spanish Court, in that year while the latter was accompanying King [[Charles V, Holy Roman Emperor|Carlos V]] on a visit to the [[Alhambra]]. In the course of their literary discussion, Navagero then suggested that the poet might attempt the sonnet and other Italian forms in his own language.\u003cref\u003eJuan Bosc\u00e1n, ''Ep\u00edstola a la duquesa de Soma'', Barcelona University, 1996, [https:\u002f\u002fbooks.google.com\u002fbooks?id=jhCWVKkkbH0C pp. 7-8]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Bosc\u00e1n not only took up the Venetian's advice but did so in association with the more talented [[Garcilaso de la Vega (poet)|Garcilaso de la Vega]], a friend to whom some of his sonnets are addressed and whose early death is mourned in another. The poems of both followed the Petrarchan model, employed the hitherto unfamiliar [[hendecasyllable]], and when writing of love were based on the [[Neoplatonism#Renaissance|neoplatonic]] ideal championed in ''[[The Book of the Courtier]]'' (''Il Cortegiano'') that Bosc\u00e1n had also translated. Their reputation was consolidated by the later 1580 edition of [[Fernando de Herrera]], who was himself accounted \"the first major Spanish sonneteer after Garcilaso\".\u003cref\u003eRutherford ed. 2016\u003c\u002fref\u003e During the Baroque period that followed, two notable writers of sonnets headed rival stylistic schools. The [[culteranismo]] of [[Luis de G\u00f3ngora]], later known as 'Gongorismo' after him, was distinguished by an artificial style and the use of elaborate vocabulary, complex syntactical order and involved metaphors. The verbal usage of his opponent, [[Francisco de Quevedo]], was equally self-conscious, deploying wordplay and metaphysical [[conceit]]s, after which the style was known as [[conceptismo]].\u003cbr\u003e \u003cbr\u003e@@ -58,16 +58,16 @@\u003cbr\u003e \u003cbr\u003e In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman Mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones.\" La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-By the late 17th century the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original - Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p.270]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp.21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s ''Sur une dame blonde'' limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p.273]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788 - 1862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p.27]\u003c\u002fref\u003e\u003cbr\u003e+By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original - Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p.270]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour. From that time on there were many deviations from the traditional sonnet form. [[Charles Baudelaire]] was responsible for significant variations in rhyme-scheme and line-length in the poems included in ''[[Les Fleurs du mal]]''.\u003cref\u003eKillick, Rachel. \"''Sorcellerie \u00c9vocatoire'' and the Sonnet in ''Les Fleurs Du Mal''\", ''Dalhousie French Studies'', vol. 2, Dalhousie University, 1980, [http:\u002f\u002fwww.jstor.org\u002fstable\u002f40836219 pp.21\u201339]\u003c\u002fref\u003e Among the variations made by others, [[Th\u00e9odore de Banville]]'s ''Sur une dame blonde'' limited itself to a four-syllable line,\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f272\u002fmode\u002f2up p.273]\u003c\u002fref\u003e while in ''\u00c0 une jeune morte'' Jules de Ress\u00e9guier (1788 - 1862) composed a sonnet monosyllabically lined.\u003cref\u003e''A book of French prosody'',  [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f26\u002fmode\u002f2up p.27]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Germanic languages==\u003cbr\u003e \u003cbr\u003e ===English===\u003cbr\u003e ====Tudor and Stuart period====\u003cbr\u003e \u003cbr\u003e-[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some twenty five of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge 1964, pp. 166-208\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\u201d]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, \"Finding his Feet: Wyatt and the Founding of English Pentameter\", [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005)]\u003c\u002fref\u003e But in addition Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e-\u003cbr\u003e-Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp.174-79\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p.12\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a sceptical eye. [[Sir John Davies]] mocked these in a series of nine 'gulling sonnets'\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \u201cMy mistress\u2019 eyes are nothing like the sun\u201d.\u003cbr\u003e+[[Sir Thomas Wyatt]] and [[Henry Howard, Earl of Surrey]], have been described as \"the first English Petrarchans\" from their pioneering the sonnet form in English. In addition, some twenty-five of Wyatt's poems are dependent on Petrarch, either as translations or imitations, while, of Surrey's five, three of them are translations and two imitations.\u003cref\u003ePatricia Thomson, ''Sir Thomas Wyatt and his Background'', Routledge 1964, pp. 166-208\u003c\u002fref\u003e In one instance, both poets translated the same poem, ''Rime'' 140.\u003cref\u003eBruce A. McMenomy, [https:\u002f\u002fwww.dorthonion.com\u002fdrmcm\u002fenglish_lit\u002fsupplementary\u002fpetrarch.html \"Petrarch, Rime 140: Two translations by Thomas Wyatt and Henry Howard, Earl of Surrey\u201d]\u003c\u002fref\u003e From these examples, as elsewhere in their prosodic practice, a difference between their style can be observed. Wyatt's verse metre, though in general decasyllabic, is irregular and proceeds by way of significantly stressed phrasal units.\u003cref\u003ePeter Groves, \"Finding his Feet: Wyatt and the Founding of English Pentameter\", [https:\u002f\u002fwww.academia.edu\u002f11950890\u002fFinding_his_Feet_Wyatt_and_the_Founding_of_English_Pentameter ''Versification: An Electronic Journal of Literary Prosody'' 4 (2005)]\u003c\u002fref\u003e But in addition Wyatt's sonnets are generally closer in construction to those of Petrarch.\u003cbr\u003e+\u003cbr\u003e+Prosodically, Surrey is more adept at composing in [[iambic pentameter]] and his sonnets are written in what has come to be known anachronistically as [[Shakespeare's sonnets#Form and structure of the sonnets|Shakespearean measure]].\u003cref\u003eThomson 1964, pp.174-79\u003c\u002fref\u003e This version of the sonnet form, characterised by three alternately rhymed quatrains terminating in a final couplet (ABAB CDCD, EFEF, GG), became the favourite during [[Elizabethan literature|Elizabethan times]], when it was widely used. It was particularly so in whole series of [[Sonnet sequence#List of English sonnet sequences|amatory sequences]], beginning with Sir [[Philip Sidney]]'s ''[[Astrophel and Stella]]'' (1591) and continuing over a period of two decades. About four thousand sonnets were composed during this time.\u003cref\u003e''The Art of the Sonnet'', 2010, p.12\u003c\u002fref\u003e However, with such a volume, much there that was conventional and repetitious came to be viewed with a skeptical eye. [[Sir John Davies]] mocked these in a series of nine 'gulling sonnets'\u003cref\u003e[https:\u002f\u002fwww.pseudopodium.org\u002frepress\u002fparody\u002fdavies-gulling-sonnets.html Gulling Sonnets] by Mr Davyes\u003c\u002fref\u003e and [[William Shakespeare]] was also to dismiss some of them in his [[Sonnet 130]], \u201cMy mistress\u2019 eyes are nothing like the sun\u201d.\u003cbr\u003e \u003cbr\u003e [[File:Sonnets1609titlepage.jpg|thumb|upright=0.9|The title page of the first edition of Shakespeare's ''Sonnets'']]\u003cbr\u003e [[Shakespeare's sonnets|Shakespeare's sequence of 154 sonnets]] departs from the norm in addressing more than one person in its course, male as well as female. In addition, other sonnets by him were incorporated into some of his plays. Another exception at this time was the form used in [[Spenserian sonnet|Edmund Spenser's ''Amoretti'']], which has the interlaced rhyme scheme ABAB BCBC CDCD EE. And soon after, in the following century, [[John Donne]] adapted the emerging Baroque style to the new subject matter of his series of ''[[Holy Sonnets]]''.\u003cbr\u003e@@ -84,18 +84,18 @@\u003cbr\u003e Another arm of the propaganda on behalf of the sonnet in [[English Romantic sonnets|Romantic times]] was the reflexive strategy of recommending it in sonnet form as a demonstration of its possibility of variation. In Wordsworth's \"Nuns fret not at their narrow room\" (1807),\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fwordsworth.htm#100 Sonnets about sonnets, Wordsworth]\u003c\u002fref\u003e the volta comes after the seventh line, dividing the poem into two equal parts. Keats makes use of frequent enjambment in \"If by dull rhymes our English must be chained\" (1816)\u003cref\u003e[http:\u002f\u002fwww.sonnets.org\u002fkeats.htm#010 Sonnets about sonnets, Keats]\u003c\u002fref\u003e and divides its sense units into four tercets and a couplet. What Keats is recommending there is the more intricate rhyming system A B C |A B D |C A B |C D E| D E that he demonstrates in its course as a means of giving the form greater breathing room. Wordsworth later accomplishes this in \"Scorn not the Sonnet\" (1827),\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f45547\u002fscorn-not-the-sonnet Poetry Foundation]\u003c\u002fref\u003e which is without midway division, and where enjambment is so managed that the sense overrides from line to line in an ode-like movement. With the similar aim of freeing the form from its fetters, [[Matthew Arnold]] turns his \"Austerity of poetry\" (1867)\u003cref\u003e[https:\u002f\u002fwww.bartleby.com\u002f254\u002f105.html Bartleby]\u003c\u002fref\u003e into a narrative carried forward over an enjambed eighth line to a conclusion that is limited to the final three lines.\u003cbr\u003e \u003cbr\u003e [[File: Rossetti_on_sonnet,_1880.jpg|thumb|upright=1.05|D. G. Rossetti's illuminated description of the sonnet, 1880]]\u003cbr\u003e-By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which they are working.\u003cbr\u003e+By the time the second half of the 19th century was reached, sonnets become chiefly interesting for their publication in long sequences. It was during this period that attempts to renew the form were continually being made. [[Elizabeth Barrett Browning]]'s autobiographical ''[[Sonnets from the Portuguese]]'' (1845\u201350),\u003cref\u003e[https:\u002f\u002fwww.gutenberg.org\u002ffiles\u002f2002\u002f2002-h\u002f2002-h.htm Gutenburg]\u003c\u002fref\u003e for example, is described as the first depiction of a successful courtship since Elizabethan times.\u003cref\u003e''The art of the sonnet'', Harvard University Press, 2010, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C&dq=nineteenth+century+sonnets&pg=PA1 p.18]\u003c\u002fref\u003e It comprises 44 sonnets of dramatised first-person narrative, the enjambed lines in which frequently avoid resting at the volta.  Through this means the work is distinguished by \"the flexibility and control with which the verse bends to the argument and to the rhythms of thought and speech\".\u003cref\u003eDorothy Mermin, \"The Female Poet and the Embarrassed Reader: Elizabeth Barrett Browning's Sonnets From the Portuguese\", ELH 48.2 (Johns Hopkins University, 1981), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f2872976 p.356]\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+That sequence was followed in 1862 by [[George Meredith]]'s [[Modern Love (poetry collection)|''Modern Love'']],\u003cref\u003eGoogle Books, [https:\u002f\u002fbooks.google.com\u002fbooks?id=MwFdAAAAcAAJ&q=Meredith+%22Modern+Love%22 pp.31-82]\u003c\u002fref\u003e based in part on the breakdown of his first marriage. It employs a 16-line form, described as (and working like) a sonnet, linking together the work's fifty narrative episodes. Essentially the stanza is made up of four quatrains of [[enclosed rhyme]], rhythmically driven forward over these divisions so as to allow a greater syntactical complexity \"more readily associated with the realist novel than with lyric poetry\".\u003cref\u003eStephen Regan, \"The Victorian Sonnet, from George Meredith to Gerard Manley Hopkins\", ''The Yearbook of English Studies'' 36.2 (2006), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f20479240?read-now=1&refreqid=excelsior%3A9e88d78a21e98fd8aacfa2cde4abcca1&seq=7#page_scan_tab_contents p.23]\u003c\u002fref\u003e As other work by both the writers above demonstrates, they were capable of more straightforward fictions. In adapting the sonnet to the narrative mode, the main interest for them is in overcoming the technical challenge that they set themselves and proving the new possibilities of the form in which, they are working.\u003cbr\u003e \u003cbr\u003e Where the first quatrain in ''Sonnets from the Portuguese'' began with a reminiscence of lines from a pastoral of [[Theocritus]], Edward Cracroft Lefroy (1855-1891) responded by reaching beyond the narrative mode towards the dramatic in the thirty adaptations from the Greek of his ''Echoes from Theocritus'' (1885, reprint 1922).\u003cref\u003e[https:\u002f\u002farchive.org\u002fdetails\u002fEchoesFromTheocritvsEdwardCracroftLefroy\u002fpage\u002fn5\u002fmode\u002f2up Internet Archive]\u003c\u002fref\u003e Beyond this, though the idea of arranging such material in a sequence was original to Lefroy, [[Thomas Warwick]] had anticipated the approach a century before in his sonnet \"From [[Bacchylides]]\", equally based on a fragment of an ancient Greek author. On the other hand, [[Eugene Lee-Hamilton]]'s exploration of the sonnet's dramatic possibilities was through creating historical monologues in his hundred ''Imaginary Sonnets'' (1888),\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=J7QwAQAAMAAJ Google Books]\u003c\u002fref\u003e based on episodes chosen from the seven centuries between 1120 \u2013 1820. Neither sequence was anywhere the equal of those of Barrett Browning or Meredith,\u003cref\u003e''The Art of the Sonnet'', Harvard University 2016, [https:\u002f\u002fbooks.google.com\u002fbooks?id=WduHxc6iYp4C Introduction, p.20]\u003c\u002fref\u003e but they illustrate a contemporary urge to make new a form that was fast running out of steam.\u003cbr\u003e \u003cbr\u003e ====20th century====\u003cbr\u003e-As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example . He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e+As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e[https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html The Life and Work of Dylan Thomas]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england Poetry Foundation]\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e[https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets The Adrian Brinkerhoff Poetry Foundation]\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e+In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england Poetry Foundation]\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e[https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets The Adrian Brinkerhoff Poetry Foundation]\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of \"Clearances\" in ''[[The Haw Lantern]]'' (1987).\u003cref\u003e[https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances Poetry Foundation]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In North America===\u003cbr\u003e ====USA====\u003cbr\u003e@@ -130,10 +130,9 @@\u003cbr\u003e Responses to turbulent times form a distinct category among German sonnets. They include [[Friedrich R\u00fcckert]]'s 72 \"Sonnets in Armour\" (''Geharnischte Sonneten'', 1814), stirring up [[War of the Sixth Coalition|resistance to Napoleonic domination]]; and sonnets by [[Emanuel Geibel]] written during the [[German revolutions of 1848\u20131849]] and the [[First Schleswig War]].\u003cref\u003e\u201dCritical History of the Sonnet\", ''Dublin Review'' 79 (1876), [https:\u002f\u002fbooks.google.com\u002fbooks?id=m1YVAQAAIAAJ&dq=Ruckert+%22Geharnischte+Sonette%22&pg=PA418 p. 418]\u003c\u002fref\u003e In the wake of the [[First World War]], [[Anton Schnack]], described by one anthologist as \"the only German language poet whose work can be compared with that of [[Wilfred Owen]]\", published the sonnet sequence, ''Tier rang gewaltig mit Tier'' (\"Beast Strove Mightily with Beast\", 1920). The 60 poems there have the typical German sonnet form, but are written in the long-lined free rhythms developed by [[Ernst Stadler]].\u003cref name=\"Patrick Bridgwater 1985 page 97\"\u003ePatrick Bridgwater (1985), ''The German Poets of the First World War'', page 97.\u003c\u002fref\u003e Patrick Bridgwater, writing in 1985, called the work \"without question the best single collection produced by a German [[war poet]] in 1914-18,\" but adds that it \"is to this day virtually unknown even in Germany.\"\u003cref\u003eBridgwater (1985), ''The German Poets of the First World War'', p. 96.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===In Dutch ===\u003cbr\u003e-In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268-9\u003c\u002fref\u003e Another of his\u003cbr\u003e-sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237-8, 304-5\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-agrandisment of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their  own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e+In the Netherlands [[Pieter Corneliszoon Hooft]] introduced sonnets in the Baroque style, of which ''Mijn lief, mijn lief, mijn lief: soo sprack mijn lief mij toe'' presents a notable example of sound and word play.\u003cref\u003eHarold B. Segel, ''The Baroque Poem'', New York, 1974, pp.268-9\u003c\u002fref\u003e Another of his sonnets, dedicated to [[Hugo Grotius]], was later translated by [[Edmund Gosse]].\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.bartleby.com\u002f342\u002f222.html| title = Pieter Corneliszoon Hooft (1581\u20131647), \"To Hugo Grotius\"}}\u003c\u002fref\u003e In later centuries the sonnet form was dropped and then returned to by successive waves of innovators in an attempt to breathe new life into Dutch poetry when, in their eyes, it had lost its way. For the generation of the 1880s it was [[Jacques Perk]]'s sonnet sequence ''Mathilde'' which served as a rallying cry. And for a while in the early years of the new century, [[Martinus Nijhoff]] wrote notable sonnets before turning to more modernistic models.\u003cref\u003eReinder P. Meijer, ''Literature of the Low Countries'', Martinus Nijhoff, 1978; pp.237-8, 304-5\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Following the [[Second World War]], avant-garde poets declared war on all formalism, reacting particularly against the extreme subjectivity and self-agrandisment of representatives of the 1880s style like [[Willem Kloos]], who had once begun a sonnet \"In my deepest being I'm a god\". In reaction, [[Lucebert]] satirised such writing in the \"sonnet\" with which his first collection opened: \u003cpoem\u003e::I\u002f me\u002f I\u002f me\u002f\u002f me\u002f I\u002f me\u002f  I\u002f\u002f I\u002f I\u002f my\u002f\u002f my\u002f my\u002f I\u003cref\u003eMarc Kregting, [https:\u002f\u002fwww.tijdschriftskut.nl\u002fcategory\u002ftekstsoort\u002fessay \"Mijn oorlog of de jouwe: over 'sonnet' van Lucebert\"], ''Skut'', July 2019\u003c\u002fref\u003e\u003c\u002fpoem\u003e But by the end of the 20th century, formalist poets such as [[Gerrit Komrij]] and [[Jan Kal]] were writing sonnets again as part of their own reaction to the experimentalism of earlier decades.\u003cref\u003e''Turning Tides'' (ed. Peter van de Kamp), Story Line Press, 1994, p.389\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Slavic languages==\u003cbr\u003e ===Czech===\u003cbr\u003e@@ -150,14 +149,14 @@\u003cbr\u003e In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191-5]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e-In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfor
