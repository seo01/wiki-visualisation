        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="95ec1e32-4c3e-456b-b209-e9595990533b" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("95ec1e32-4c3e-456b-b209-e9595990533b")) {                    Plotly.newPlot(                        "95ec1e32-4c3e-456b-b209-e9595990533b",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -55,7 +55,7 @@\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e+In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[Human|human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e ","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -55,7 +55,7 @@\u003cbr\u003e {{Main|French poetry}}\u003cbr\u003e In French [[Metre (poetry)#French|prosody]], sonnets are traditionally composed in the [[French alexandrine]], which consists of lines of twelve syllables with a central [[caesura]]. Imitations of Petrarch were first introduced by [[Cl\u00e9ment Marot]], and [[Mellin de Saint-Gelais]] also took up the form near the start of the 16th century.\u003cref\u003eBrandin, Louis Maurice, 1874\u2013; Hartog, Willie Gustave: ''A book of French prosody'', London 1904, [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f112\u002fmode\u002f2up pp. 113\u201315.]\u003c\u002fref\u003e They were later followed by [[Pierre de Ronsard]], [[Joachim du Bellay]] and [[Jean Antoine de Ba\u00eff]], around whom formed a group of radical young noble poets of the court, generally known today as [[La Pl\u00e9iade]]. They employed, amongst other forms of poetry, the Petrarchan [[sonnet cycle]], developed around an amorous encounter or an idealized woman. The character of the group's literary program was given in Du Bellay's manifesto, the \"Defense and Illustration of the French Language\" (1549), which maintained that French (like the Tuscan of Petrarch and Dante) was a worthy language for literary expression, and which promulgated a program of linguistic and literary production and purification.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.wdl.org\u002fen\u002fitem\u002f4357\u002f| title = World Digital Library}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the [[Human|human race]]. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e+In the aftermath of the [[Wars of Religion]], French Catholic jurist and poet [[Jean de La Cepp\u00e8de]] published the ''Theorems'', a sequence of 515 sonnets with non-traditional rhyme schemes, about the Passion and Resurrection of [[Jesus Christ]]. Drawing upon the [[Gospels]], [[Greek Mythology|Greek]] and [[Roman mythology]], and the [[Fathers of the Church]], La Cepp\u00e8de's poetry was praised by [[Saint Francis de Sales]] for transforming \"the Pagan Muses into Christian ones\". La Cepp\u00e8de's sonnets often attack the [[Calvinist]] doctrine of a judgmental and unforgiving God by focusing on Christ's passionate love for the human race. Afterwards the work was long forgotten, until the 20th century witnessed a revival of interest in the poet, and his sonnets are now regarded as classic works of French poetry.\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.larousse.fr\u002fencyclopedie\u002fpersonnage\u002fJean_de_La_Cepp%C3%A8de\u002f179635| title = Larousse online}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e By the late 17th century, the sonnet had fallen out of fashion but was revived by the [[Romanticism#France|Romantics]] in the 19th century. [[Charles Augustin Sainte-Beuve]] then published his imitation of [[William Wordsworth]]'s \"Scorn not the sonnet\" where, in addition to the poets enumerated in the English original \u2013 Shakespeare, Petrarch, Tasso, Camoens, Dante, Spenser, Milton \u2013 Sainte-Beuve announces his own intention to revive the form and adds the names of Du Bellay and Ronsard in the final tercet.\u003cref\u003e''A book of French prosody'', [https:\u002f\u002farchive.org\u002fdetails\u002fbookoffrenchpros00branuoft\u002fpage\u002f270\u002fmode\u002f2up p. 270.]\u003c\u002fref\u003e The form was little used, however, until the [[Parnassianism|Parnassians]] brought it back into favour, and following them the [[Symbolism (arts)#Movement|Symbolist poets]]. Overseas in Canada, the teenaged [[\u00c9mile Nelligan]] is particularly noted among the French language poets who wrote sonnets in that style.\u003cref\u003e{{Cite web|url=http:\u002f\u002frpo.library.utoronto.ca\u002fpoets\u002fnelligan-emile|title=Nelligan, Emile {{!}} Representative Poetry Online|website=rpo.library.utoronto.ca|access-date=2016-05-06}}\u003c\u002fref\u003e \u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -3,9 +3,9 @@\u003cbr\u003e {{Use British English|date=May 2012}}\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e-A '''sonnet''' is a [[poetic form]] that originated in the poetry composed at the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention, and the [[Sicilian School]] of poets who surrounded him then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e-\u003cbr\u003e-The term \"sonnet\" is derived from the Italian word ''sonetto'' ({{lit|little song}}, derived from the Latin word ''sonus'', {{lit|sound}}). By the 13th century it signified a poem of fourteen lines that followed a strict [[rhyme scheme]] and structure.\u003cbr\u003e+A '''sonnet''' is a [[fixed verse]] [[poetic form]] traditionally consisting of fourteen lines adhering to a [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention in the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e+\u003cbr\u003e+The term \"sonnet\" is derived from the Italian word ''sonetto'' ({{lit|little song}}, derived from the Latin word ''sonus'', {{lit|sound}}). By the 13th century it took the form of fourteen lines that followed a strict rhyme scheme and structure.\u003cbr\u003e \u003cbr\u003e According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e ","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -3,16 +3,15 @@\u003cbr\u003e {{Use British English|date=May 2012}}\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e-A '''sonnet''' is a [[fixed verse]] [[poetic form]] traditionally consisting of fourteen lines adhering to a [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e The 13th-century poet and [[notary]] [[Giacomo da Lentini]] is credited with the sonnet's invention in the Court of the [[Holy Roman Emperor]] [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. The earliest sonnets, however, no longer survive in the original [[Sicilian language]], but only after being translated into [[Tuscan dialect]].\u003cbr\u003e-\u003cbr\u003e-The term \"sonnet\" is derived from the Italian word ''sonetto'' ({{lit|little song}}, derived from the Latin word ''sonus'', {{lit|sound}}). By the 13th century it took the form of fourteen lines that followed a strict rhyme scheme and structure.\u003cbr\u003e-\u003cbr\u003e-According to Christopher Blum, during the [[Renaissance]], the sonnet became the \"choice mode of expressing romantic love\".\u003cref\u003eChristopher O. Blum, [https:\u002f\u002fwww.crisismagazine.com\u002f2012\u002fa-poet-of-the-passion-of-christ \"A Poet of the Passion of Christ\"], [[Crisis Magazine]], 2 April 2012.\u003c\u002fref\u003e During that period, too, the form was taken up in many other European language areas and eventually any subject was considered acceptable for writers of sonnets. Impatience with the set form resulted in many variations over the centuries, including abandonment of the [[quatorzain]] limit and even of rhyme altogether in modern times.\u003cbr\u003e+\u003cbr\u003e+The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Over the following centuries, the sonnet was taken up in many other European language areas, initially to express [[romantic love]], although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit - and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Italian===\u003cbr\u003e {{Main|Petrarchan sonnet}}\u003cbr\u003e-The sonnet is believed to have been created by [[Giacomo da Lentini]], leader of the [[Sicilian School]] under [[Frederick II, Holy Roman Emperor|Emperor Frederick II]]. [[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to its survival far beyond its region of origin. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e+[[Giacomo da Lentini]], is credited with the sonnet's invention at the Court of [[Frederick II, Holy Roman Emperor|Frederick II]], in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. Those earliest sonnets no longer survive now in the original [[Sicilian language]], however, but only after being translated into [[Tuscan dialect]]. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cbr\u003e+\u003cbr\u003e+[[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to the sonnet's survival far beyond its region of origin. \u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as an \"invention\" by [[Giacomo da Lentini]] or any other member of the Sicilian School. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n. 80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -7,14 +7,15 @@\u003cbr\u003e The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Over the following centuries, the sonnet was taken up in many other European language areas, initially to express [[romantic love]], although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit - and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e+===Sicilian===\u003cbr\u003e+[[Giacomo da Lentini]], is credited with the sonnet's invention at the Court of [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. Those earliest sonnets no longer survive in the original [[Sicilian language]], however, but only after being translated into [[Tuscan dialect]]. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cbr\u003e+\u003cbr\u003e+[[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to the sonnet's survival far beyond its region of origin. \u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as the \"invention\" of the Sicilian School of poets. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f1041257 t refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Over the following centuries, the sonnet was taken up in many other European language areas, initially to express [[romantic love]], although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit - and even of rhyme altogether in modern times.\u003cbr\u003e+The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th century [[Sicily]], the sonnet was in time taken up in many European language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit - and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 9\u003cbr\u003e+++ Revision 10\u003cbr\u003e@@ -93,7 +93,7 @@\u003cbr\u003e ====20th century====\u003cbr\u003e As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.undermilkwood.net\u002fpoet\u00a7ry_altarwise.html|title=The Life and Work of Dylan Thomas}}\u003c\u002fref\u003e\u003cbr\u003e+The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003eJulian Scutts, ''A Defence of Wandering and Poetry'' (2019), [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=5t2rDwAAQBAJ&pg=PA154&dq=%22altarwise+by+owl+light%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiZxdC15J6HAxXDVEEAHVv0CQ0Q6AF6BAgGEAI#v=onepage&q=%22altarwise%20by%20owl%20light%22&f=false \"A critical survey of the linguistic features of Altarwise by Owl-light], pp. 155ff\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 10\u003cbr\u003e+++ Revision 11\u003cbr\u003e@@ -150,7 +150,8 @@\u003cbr\u003e In the 18th century, after the westernizing reforms of [[Peter the Great]], Russian poets (among others [[Alexander Sumarokov]] and [[Mikhail Kheraskov]]) began to experiment with sonnets, but the form was soon overtaken in popularity by the more flexible [[Onegin stanza]]. This was used by [[Alexander Pushkin]] for his [[novel in verse]] ''[[Eugene Onegin]]'' and has also been described as the 'Onegin sonnet', since it consists of fourteen lines. It is, however, aberrant in rhyme scheme and the number of stresses per line and is better described as having only a family resemblance to the sonnet.\u003cref\u003eA. D. P. Briggs, ''Alexander Pushkin: A Critical Study'', Rowman & Littlefield, 1983, [https:\u002f\u002fbooks.google.com\u002fbooks?id=pngV3Ff2EBcC&dq=%22Onegin+sonnet%22&pg=PA192 pp.191\u20135]\u003c\u002fref\u003e The form was adapted by other poets later, including by [[Mikhail Lermontov]] in his narrative of \"The Tambov Treasurer's Wife\".\u003cref\u003eMichael Wachtel, ''The Development of Russian Verse: Meter and Its Meanings'', CUP 1998, [https:\u002f\u002fbooks.google.com\u002fbooks?id=EPuAI-tHo48C&dq=Lermontov+%22Onegin+stanza%22&pg=PA144 p.144]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Slovenian===\u003cbr\u003e-In Slovenia the sonnet became a national verse form. The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica| date = 2 April 2024}}\u003c\u002fref\u003e wrote many sonnets. His best known work worldwide is ''Sonetni venec'' (''[[A Wreath of Sonnets]]''),\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e which is an example of [[crown of sonnets]]. Another work of his is the sequence ''Sonetje nesre\u010de'' (''[[Sonnets of Misfortune]]''). In writing sonnets Pre\u0161eren was followed by many later poets. After the [[Second World War]] sonnets remained very popular. Slovenian poets write both traditional rhymed sonnets and modern ones, unrhymed, in free verse. Among them are [[Milan Jesih]] and [[Ale\u0161 Debeljak]]. The metre for sonnets in Slovenian poetry is [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cbr\u003e+In Slovenia the sonnet became a national verse form, using [[iambic pentameter]] with [[feminine rhyme]]s, based both on the Italian endecasillabo and German iambic pentameter.\u003cref\u003eBoris A. Novac, [https:\u002f\u002fOJSAdmin,+1-en-PKn-2005-3-1.pdf \"Kosovel, a great poet but a poor prosodist\" p. 142]\u003c\u002fref\u003e\u003cbr\u003e+The greatest Slovenian poet, [[France Pre\u0161eren]],\u003cref\u003e{{cite web| url = https:\u002f\u002fwww.britannica.com\u002fbiography\u002fFrance-Preseren| title = Biography at Encyclop\u00e6dia Britannica| date = 2 April 2024}}\u003c\u002fref\u003e wrote several sonnet sequences from 1831 onwards and is particularly known for his [[crown of sonnets]], ''Sonetni venec'' (''[[A Wreath of Sonnets]]'').\u003cref\u003e{{cite web| url = http:\u002f\u002fwww.preseren.net\u002fang\u002f3_poezije\u002f76_sonetni_venec-01.asp| title = English Translation on-line}}\u003c\u002fref\u003e Many later poets followed him in using the sonnet form. After the [[Second World War]], Slovenian poets wrote both traditional rhymed sonnets and [[postmodern literature|postmodern]] ones, unrhymed and in free verse. Among such writers are [[Milan Jesih]]\u003cref\u003eDavid Bandel, [https:\u002f\u002flitteraeslovenicae.si\u002fwp-content\u002fuploads\u002fspremna-beseda-jesih.pdf \"The Mystery of the Subject\"]\u003c\u002fref\u003e  and [[Ale\u0161 Debeljak]].\u003cbr\u003e \u003cbr\u003e ==Celtic languages==\u003cbr\u003e ===In Irish===","--- Revision 11\u003cbr\u003e+++ Revision 12\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th century [[Sicily]], the sonnet was in time taken up in many European language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit - and even of rhyme altogether in modern times.\u003cbr\u003e+The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 12\u003cbr\u003e+++ Revision 13\u003cbr\u003e@@ -8,9 +8,9 @@\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===\u003cbr\u003e-[[Giacomo da Lentini]], is credited with the sonnet's invention at the Court of [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. Those earliest sonnets no longer survive in the original [[Sicilian language]], however, but only after being translated into [[Tuscan dialect]]. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cbr\u003e-\u003cbr\u003e-[[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to the sonnet's survival far beyond its region of origin. \u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e+[[Giacomo da Lentini]]  is credited with the sonnet's invention at the Court of [[Frederick II, Holy Roman Emperor|Frederick II]] in the Sicilian city of [[Palermo]]. The [[Sicilian School]] of poets who surrounded Lentini then spread the form to the mainland. Those earliest sonnets no longer survive in the original [[Sicilian language]], however, but only after being translated into [[Tuscan dialect]]. The form consisted of a pair of [[quatrain]]s followed by a pair of [[tercet]]s with the symmetrical rhyme scheme ABABABAB CDCDCD, where the sense is carried forward in a new direction after the [[Volta (literature)|midway break]].\u003cbr\u003e+\u003cbr\u003e+[[Peter Dronke]] has commented that there was something intrinsic to its flexible form that contributed to the sonnet's survival far beyond its region of origin.\u003cref\u003ePeter Dronke, ''The Medieval Lyric'', Hutchinson University Library, 1968, pp. 151\u20134.\u003c\u002fref\u003e [[William Baer (writer)|William Baer]] suggests that the first eight lines of the earliest Sicilian sonnets are identical to the eight-line Sicilian folksong stanza known as the ''Strambotto''. To this, da Lentini (or whoever else invented the form) added two tercets to the ''Strambotto'' in order to create the new 14-line sonnet form.\u003cref\u003eWilliam Baer (2005), ''Sonnets: 150 Contemporary Sonnets'', University of Evansville Press, pp. 153\u2013154.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In contrast, Hassanally Ladha\u003cref\u003e{{cite web| url = https:\u002f\u002flanguages.uconn.edu\u002fperson\u002fhassanaly-ladha\u002f| title = Hassanaly Ladha's profile at University of Connecticut| date = 22 January 2016}}\u003c\u002fref\u003e has argued that the Sicilian sonnet's structure and content drew upon [[Arabic poetry]] and cannot be explained as the \"invention\" of the Sicilian School of poets. Ladha notes that \"in its Sicilian beginnings, the sonnet evinces literary and epistemological contact with the ''[[qasida]]''\",\u003cref\u003e[https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523 Ladha, Hassanaly, \"From Bayt to Stanza: Arabic Khay\u0101l and the Advent of Italian Vernacular Poetry\": ''Exemplaria'': Vol 32, No 1 (tandfonline.com)], p. 17. Retrieved 7 July 2021.\u003c\u002fref\u003e and emphasizes that the sonnet did not emerge simultaneously with its supposedly defining 14-line structure. \"Tellingly, attempts to close off the sonnet from its Arabic predecessors depend upon a definition of the new lyric to which Giacomo's poetry does not conform: surviving in thirteenth-century recensions, his poems appear not in fourteen, but rather six lines, including four rows, each with two [[hemistich]]es and two 'tercets' each in a line extending over two rows.\"\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 15.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e In Ladha's view, the sonnet emerges as the continuation of a broader tradition of love poetry throughout the Mediterranean world and relates to such other forms as the Sicilian ''strambotto'', the [[Proven\u00e7al language|Proven\u00e7al]] ''[[canso (song)|canso]]'', the [[Andalusi Arabic]] ''[[muwashshah]]'' and ''[[zajal]]'', as well as the ''qasida''.\u003cref\u003e{{cite journal| url = https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f10412573.2020.1743523| title = Ladha, p. 26, n. 80.| journal = Exemplaria| date = 2 January 2020| volume = 32| issue = 1| pages = 1\u201331| doi = 10.1080\u002f10412573.2020.1743523| s2cid = 221178512| last1 = Ladha| first1 = Hassanaly}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 13\u003cbr\u003e+++ Revision 14\u003cbr\u003e@@ -40,7 +40,7 @@\u003cbr\u003e \u003cbr\u003e Another key figure at this period was [[Lope de Vega]], who was responsible for writing some 3,000 sonnets, a large proportion of them incorporated into his dramas. One of the best known and most imitated was ''Un soneto me manda hacer Violante''\u003cref\u003e{{Cite web|url=https:\u002f\u002fes.wikisource.org\u002fwiki\u002fUn_soneto_me_manda_hacer_Violante|title=Un soneto me manda hacer Violante - Wikisource|website=es.wikisource.org}}\u003c\u002fref\u003e (Violante orders me to write a sonnet), which occupies a pivotal position in literary history. At its first appearance in his 1617 comedy ''La ni\u00f1a de Plata'' (Act 3), the character there pretends to be a novice whose text is a running commentary on the poem's creation. Although the poet himself is portrayed as composing it as a light-hearted impromptu in the biographical film [[Lope (film)|''Lope'']] (2010), there had in fact been precedents. In Spanish, some fifty years before, [[Diego Hurtado de Mendoza (poet and diplomat)|Diego Hurtado de Mendoza]] had written the pretended impromptu, ''Ped\u00eds, Reina, un soneto''; and even earlier in Italian there had been the similarly themed ''Qualunque vuol saper fare un sonetto'' (Whoever to make a sonnet aspires) by the Florentine poet Pieraccio Tedaldi (b. ca. 1285\u20131290; d. ca. 1350).\u003cref\u003eJorge Leon Gusta, [https:\u002f\u002fwww.lasnuevemusas.com\u002fhistoria-de-un-soneto: \"Historia de un poema\"], 17 August 2021\u003c\u002fref\u003e Later imitations in other languages include one in Italian by [[Giambattista Marino]] and another in French by [[Fran\u00e7ois-S\u00e9raphin R\u00e9gnier-Desmarais]], as well as an adaptation of the idea applied to the [[Rondeau (forme fixe)|rondeau]] by [[Vincent Voiture]].\u003cref\u003e[https:\u002f\u002fwww.jstor.org\u002fstable\u002f20499340 \"Sonnets on the Sonnet\"], ''The Irish Monthly'', Vol. 26, No. 304 (October 1898) (p. 518).\u003c\u002fref\u003e The poem's fascination for U.S. writers is evidenced by no less than five translations in the second half of the 20th century alone.\u003cref\u003eDavid Garrison, \"English Translations of Lope de Vega's ''Soneto de repente''\", ''Revista Canadiense de Estudios Hisp\u00e1nicos'' 19. 2 (Invierno 1995), [https:\u002f\u002fwww.jstor.org\u002fstable\u002f27763199?read-now=1&refreqid=excelsior%3Ad3b5657f5255c60abe197657415e64b8&seq=2#page_scan_tab_contents pp. 311\u2013325.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm|title=LOS PARQUES ABANDONADOSE|website=www.los-poetas.com}}\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm|title=Los \u00e9xtasis de la monta\u00f1a|website=www.los-poetas.com}}\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[Cesar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e+The sonnet form crossed the Atlantic quite early in the Spanish colonial enterprise when Francisco de Terrazas, the son of a 16th-century conquistador, was among its Mexican pioneers. Later came two sonnet writers in holy orders, Bishop Miguel de Guevara (1585\u20131646) and, especially, Sister [[Juana In\u00e9s de la Cruz]]. But though sonnets continued to be written in both the old world and the new, innovation was mainly limited to the Americas, where the sonnet was used to express a different and post-colonial reality. In the 19th century, for example, there were two poets who wrote memorable sonnets dedicated to Mexican landscapes, [[Joaqu\u00edn Acadio Pagaza y Ord\u00f3\u00f1ez]] in the torrid zone to the south and [[Manuel Jos\u00e9 Oth\u00f3n]] in the desolate north.\u003cref\u003e''An Anthology of Mexican Poetry'' (compiled by Octavio Paz), Indiana University, 1958\u003c\u002fref\u003e In South America, too, the sonnet was used to invoke landscape, particularly in the major collections of the Uruguayan [[Julio Herrera y Reissig]], such as ''Los Parques Abandonados'' (Deserted Parks, 1902\u201308)\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss1.htm|title=LOS PARQUES ABANDONADOSE|website=www.los-poetas.com}}\u003c\u002fref\u003e and ''Los \u00e9xtasis de la monta\u00f1a'' (Mountain Ecstasies, 1904\u201307),\u003cref\u003e{{Cite web|url=http:\u002f\u002fwww.los-poetas.com\u002fc\u002freiss2.htm|title=Los \u00e9xtasis de la monta\u00f1a|website=www.los-poetas.com}}\u003c\u002fref\u003e whose recognisably authentic pastoral scenes went on to serve as example for [[C\u00e9sar Vallejo]] in his evocations of Andean Peru.\u003cref\u003eGwen Kirkpatrick, ''The Dissonant Legacy of Modernismo'', University of California, 1989, [https:\u002f\u002fpublishing.cdlib.org\u002fucpressebooks\u002fview?docId=ft8g5008qb&chunk.id=d0e6745&toc.depth=1&toc.id=d0e6745&brand=ucpress p. 207.]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Soon afterwards, the sonnet form was deconstructed as part of the modernist questioning of the past. Thus, in the [[Argentine]] poet [[Alfonsina Storni]]'s ''Mascarilla y tr\u00e9bol'' (Mask and Clover, 1938), a section of unrhymed poems using many of the traditional versification structures of the form are presented under the title \"antisonnets\".\u003cref\u003e{{cite journal |last1=Kuhnheim |first1=Jill |title=The Politics of Form: Three Twentieth-Century Spanish American Poets and the Sonnet |journal=Hispanic Review |date=Autumn 2008 |page=391 |url=https:\u002f\u002fkuscholarworks.ku.edu\u002fbitstream\u002fhandle\u002f1808\u002f7507\u002fkuhnheim_thepoliticsofform.pdf |access-date=22 July 2019}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 14\u003cbr\u003e+++ Revision 15\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}. 'a little sound or a song'. It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 15\u003cbr\u003e+++ Revision 16\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Use dmy dates|date=April 2017}}\u003cbr\u003e {{Literature}}\u003cbr\u003e \u003cbr\u003e-The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}. 'a little sound or a song'. It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e+The term '''sonnet''' derives from the Italian word ''sonetto'' ({{lit|little song}}, from the Latin word ''sonus'', {{lit|sound}}). It refers to a [[fixed verse]] [[poetic form]], traditionally consisting of fourteen lines adhering to a set [[Rhyme scheme|rhyming scheme]].\u003cref\u003e{{Cite web |title=Sonnet {{!}} Definition, Examples, & Facts {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fart\u002fsonnet |access-date=2024-06-27 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e Originating in 13th-century [[Sicily]], the sonnet was in time taken up in many European-language areas, mainly to express [[romantic love]] at first, although eventually any subject was considered acceptable. Many formal variations were also introduced, including abandonment of the [[quatorzain]] limit \u2013 and even of rhyme altogether in modern times.\u003cbr\u003e \u003cbr\u003e ==Romance languages==\u003cbr\u003e ===Sicilian===","--- Revision 16\u003cbr\u003e+++ Revision 17\u003cbr\u003e@@ -93,7 +93,7 @@\u003cbr\u003e ====20th century====\u003cbr\u003e As part of his attempted renewal of poetic prosody, [[Gerard Manley Hopkins]] had applied his experimental [[sprung rhythm]] to the composition of the sonnet, amplifying the number of unstressed syllables within a five- (or occasionally six-) stressed line \u2013 as in the rhetorical \"[[The Windhover]]\", for example. He also introduced variations in the proportions of the sonnet, from the 10{{frac|1|2}} lines of the [[curtal sonnet]] \"[[Pied Beauty]]\" to the amplified 24-line [[caudate sonnet]] \"That Nature is a Heraclitean Fire\". Though they were written in the later Victorian era, the poems remained virtually unknown until they were published in 1918.\u003cref\u003eNorman White, \"Hopkins, Gerard Manley (1844\u20131889)\", ''Oxford Dictionary of National Biography'', Oxford University Press.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003eJulian Scutts, ''A Defence of Wandering and Poetry'' (2019), [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=5t2rDwAAQBAJ&pg=PA154&dq=%22altarwise+by+owl+light%22&hl=en&newbks=1&newbks_redir=0&sa=X&ved=2ahUKEwiZxdC15J6HAxXDVEEAHVv0CQ0Q6AF6BAgGEAI#v=onepage&q=%22altarwise%20by%20owl%20light%22&f=false \"A critical survey of the linguistic features of Altarwise by Owl-light], pp. 155ff\u003c\u002fref\u003e \u003cbr\u003e+The undergraduate [[W. H. Auden]] is sometimes credited with dispensing with rhyme altogether in \"The Secret Agent\",\u003cref\u003eRobert E. Bjork, W. H. Auden's \"The Secret Agent\", ''ANQ: A Quarterly Journal of Short Articles, Notes and Reviews'', [https:\u002f\u002fwww.tandfonline.com\u002fdoi\u002ffull\u002f10.1080\u002f0895769X.2020.1833702 8 November, 2020]\u003c\u002fref\u003e but went on to write many conventional sonnets, including two long sequences during the time of international crisis: [[Journey to a War|\"In Time of War\"]] (1939) and [[The Double Man (book)|\"The Quest\"]] (1940). Sequences by some others have been more experimental and looser in form, of which a radical example was \"Altarwise by owl-light\" (1935), ten irregular and barely rhyming quatorzains by [[Dylan Thomas]] in his most opaque manner.\u003cref\u003eJulian Scutts, ''A Defence of Wandering and Poetry'' (2019), [https:\u002f\u002fbooks.google.com\u002fbooks?id=5t2rDwAAQBAJ&dq=%22altarwise+by+owl+light%22&pg=PA154 \"A critical survey of the linguistic features of Altarwise by Owl-light], pp. 155ff\u003c\u002fref\u003e \u003cbr\u003e \u003cbr\u003e In 1978 two later innovatory sequences were published at a period when it was considered that \"the sonnet seems to want to lie fallow, exhausted\", in the words of one commentator.\u003cref\u003e[[D. M. Black]], quoted in ''Agenda'' 26.2, Summer 1998, p.49\u003c\u002fref\u003e [[Peter Dale (poet)|Peter Dale]]'s book-length ''One Another'' contains a dialogue of some sixty sonnets in which the variety of rhyming methods are as diverse as the emotions expressed between the speakers there.\u003cref\u003e[https:\u002f\u002fwaywiser-press.com\u002fproduct\u002fone-another The Waywiser Press], revised edition 2002\u003c\u002fref\u003e At the same time, [[Geoffrey Hill]]'s \"An Apology for the Revival of Christian Architecture in England\" appeared in ''Tenebrae'' (1978), where the challenging thirteen poems of the sequence employ half-rhyme and generally ignore the volta.\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f48462\u002fan-apology-for-the-revival-of-christian-architecture-in-england|title=Poetry Foundation|date=26 April 2024 }}\u003c\u002fref\u003e [[Seamus Heaney]] also wrote two sequences during this period: the personal \"Glanmore Sonnets\" in [[Field Work (poetry collection)|''Field Work'']] (1975);\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.brinkerhoffpoetry.org\u002fpoems\u002fglanmore-sonnets|title=Seamus Heaney - \"Glanmore Sonnets\"|website=www.brinkerhoffpoetry.org}}\u003c\u002fref\u003e and the more freely constructed elegiac sonnets of  \"Clearances\" in  ''[[The Haw Lantern]]'' (1987).\u003cref\u003e{{Cite web|url=https:\u002f\u002fwww.poetryfoundation.org\u002fpoems\u002f57042\u002fclearances|title=Clearances by Seamus Heaney|first=Poetry|last=Foundation|date=17 April 2024|website=Poetry Foundation}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -194,7 +194,7 @@\u003cbr\u003e * S. Regan. ''The Sonnet''. Oxford University Press, 2006.  {{ISBN|0-19-289307-6}}.\u003cbr\u003e * H. Robbins. ''Forms of Contention: Influence and the African American Sonnet Tradition''. University of Georgia Press, 2020. {{ISBN|9780820357645}}.\u003cbr\u003e * John Rutherford, ''The Spanish Golden Age Sonnet''. University of Wales Press, 2016. {{ISBN|9781783168989}}, {{ISBN|1783168986}}.\u003cbr\u003e-* William Sharp, [https:\u002f\u002fwww.google.co.uk\u002fbooks\u002fedition\u002fSonnets_of_this_Century\u002fKLQvAQAAMAAJ?hl=en&gbpv=1 ''Sonnets of this Century''], London 1887.\u003cbr\u003e+* William Sharp, [https:\u002f\u002fbooks.google.com\u002fbooks?id=KLQvAQAAMAAJ ''Sonnets of this Century''], London 1887.\u003cbr\u003e * M. R. G. Spiller. ''The Development of the Sonnet: An Introduction''. Routledge, 1992. {{ISBN|0-415-08741-4}}.\u003cbr\u003e * M. R. G. Spiller. ''The Sonnet Sequence: A Study of Its Strategies''. Twayne Pub., 1997. {{ISBN|0-8057-0970-3}}.\u003cbr\u003e ","--- Revision 17\u003cbr\u003e+++ Revision 18\u003cbr\u003e@@ -175,6 +175,11 @@\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e [[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+== Creole Languages ==\u003cbr\u003e+\u003cbr\u003e+=== Sranan Tongo ===\u003cbr\u003e+The literature of [[Sranan Tongo]] (English-lexified Creole language of Surinam) includes a number of sonnets by one of the most celebrated poets writing in the language, [[Henri Frans de Ziel|Trefossa]] (the pen name of Henri Frans de Ziel, 1916-1975). Many can be found in the anthology ''[https:\u002f\u002fwww.dbnl.org\u002ftekst\u002fziel001alap01_01\u002findex.php Ala poewema foe Trefossa]'' (\"All Poems of Trefossa\"), for example the poems on pages 4, 5, 74, 77, 81, 86, 88-92.  \u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e {{Reflist|30em}}","--- Revision 18\u003cbr\u003e+++ Revision 19\u003cbr\u003e@@ -175,11 +175,6 @@\u003cbr\u003e \u003cbr\u003e ===In Urdu===\u003cbr\u003e [[Urdu]] poets, also influenced by English and other European poets, took to introducing the sonnet into [[Urdu poetry]] rather late.\u003cref\u003e''Encyclopedic Dictionary of Urdu literature'', 2007, p. 565 https:\u002f\u002fbooks.google.com\u002fbooks?isbn=8182201918\u003c\u002fref\u003e Azmatullah Khan (1887\u20131923) is believed to have introduced this format to [[Urdu literature]] in the very early part of the 20th century. The other renowned Urdu poets who wrote sonnets were Akhtar Junagarhi, [[Akhtar Sheerani]], [[Noon Meem Rashid]], [[Mehr Lal Soni Zia Fatehabadi]], [[Salaam Machhalishahari]] and [[Wazir Agha]].\u003cref\u003e{{cite book|first=Zarina|last=Sani|year=1979|title=Budha Darakhat|publisher=Bazm \u2013 e \u2013 Seemab|location= New Delhi|page=99|quote=Akhtar Junagarhi kaa sonnet ghaaliban 1914 kaa hai- Rashid kaa 1930 kaa aur Akhtar Sheerani ne andaazan 1933 se 1942 tak sonnet likhe- isii dauraan 1934 se 1936 tak Zia Fatehabadi ne bhi keii sonnet likhe (Akhtar Junagarhi's sonnet is from the year 1914. Rashid's sonnet is of 1930 and Akhtar Sheerani wrote sonnets between 1932 and 1942. During the period of 1932 to 1936, Zia Fatehabadi also wrote many sonnets)|ol=24596004M}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Creole Languages ==\u003cbr\u003e-\u003cbr\u003e-=== Sranan Tongo ===\u003cbr\u003e-The literature of [[Sranan Tongo]] (English-lexified Creole language of Surinam) includes a number of sonnets by one of the most celebrated poets writing in the language, [[Henri Frans de Ziel|Trefossa]] (the pen name of Henri Frans de Ziel, 1916-1975). Many can be found in the anthology ''[https:\u002f\u002fwww.dbnl.org\u002ftekst\u002fziel001alap01_01\u002findex.php Ala poewema foe Trefossa]'' (\"All Poems of Trefossa\"), for example the poems on pages 4, 5, 74, 77, 81, 86, 88-92.  \u003cbr\u003e \u003cbr\u003e ==References==\u003cbr\u003e {{Reflist|30em}}","--- Revision 19\u003cbr\u003e+++ Revision 20\u003cbr\u003e@@ -103,7 +103,7 @@\u003cbr\u003e \u003cbr\u003e In the 19th century, sonnets written by American poets began to be anthologised as such. They were included in a separate section in Leigh Hunt and S. Adams' ''The Book of the Sonnet'' (London and Boston, 1867), which included an essay by Adams on \"American Sonnets and Sonneteers\" and a section devoted only to sonnets by American women.\u003cref\u003e''The Book of the Sonnet'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=uc1.$b250912&view=1up&seq=11&skin=2021 vol.1] and [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=coo.31924064948346&view=1up&seq=16&skin=2021 vol.2], Hathi Trust\u003c\u002fref\u003e Later came [[William Sharp (writer)|William Sharp]]'s anthology of ''American Sonnets'' (1889)\u003cref\u003e{{cite web| url = https:\u002f\u002farchive.org\u002fdetails\u002famericansonnets00shar\u002fpage\u002fn9\u002fmode\u002f2up| title = Internet Archive| year = 1889}}\u003c\u002fref\u003e and Charles H. Crandall's ''Representative sonnets by American poets, with an essay on the sonnet, its nature and history'' ([[Houghton Mifflin & Co.]], 1890). The essay also surveyed the whole history of the sonnet, including English examples and European examples in translation, in order to contextualise the American achievement.\u003cref\u003e''Representative sonnets by American poets'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=hvd.32044013711908&view=1up&seq=17&skin=2021 Hathi Trust]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Claude McKay]], [[Countee Cullen]], [[Langston Hughes]], and [[Sterling A. Brown]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Several African American women poets won prizes for volumes that included sonnets, such as [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e Though Langston Hughes and [[Amiri Baraka]] were to question the appropriateness of the sonnet for Black poetry, both had published sonnets themselves.\u003cref name=\"ugapress.org\"\u002f\u003e\u003cbr\u003e+Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Claude McKay]], [[Countee Cullen]], and [[Sterling A. Brown]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Several African American women poets won prizes for volumes that included sonnets, such as [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e But there were other writers - like [[Langston Hughes]] and [[Amiri Baraka]], for example - who, despite publishing some themselves, questioned the appropriateness of sonnets for Black poets. In the opinion of Hughes, the emergence of truly individual writing based on folk genres and experience was hindered by the imposition of genteel \"white\" verse forms irrelevant to them.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p. 56]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 20\u003cbr\u003e+++ Revision 21\u003cbr\u003e@@ -103,7 +103,7 @@\u003cbr\u003e \u003cbr\u003e In the 19th century, sonnets written by American poets began to be anthologised as such. They were included in a separate section in Leigh Hunt and S. Adams' ''The Book of the Sonnet'' (London and Boston, 1867), which included an essay by Adams on \"American Sonnets and Sonneteers\" and a section devoted only to sonnets by American women.\u003cref\u003e''The Book of the Sonnet'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=uc1.$b250912&view=1up&seq=11&skin=2021 vol.1] and [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=coo.31924064948346&view=1up&seq=16&skin=2021 vol.2], Hathi Trust\u003c\u002fref\u003e Later came [[William Sharp (writer)|William Sharp]]'s anthology of ''American Sonnets'' (1889)\u003cref\u003e{{cite web| url = https:\u002f\u002farchive.org\u002fdetails\u002famericansonnets00shar\u002fpage\u002fn9\u002fmode\u002f2up| title = Internet Archive| year = 1889}}\u003c\u002fref\u003e and Charles H. Crandall's ''Representative sonnets by American poets, with an essay on the sonnet, its nature and history'' ([[Houghton Mifflin & Co.]], 1890). The essay also surveyed the whole history of the sonnet, including English examples and European examples in translation, in order to contextualise the American achievement.\u003cref\u003e''Representative sonnets by American poets'', [https:\u002f\u002fbabel.hathitrust.org\u002fcgi\u002fpt?id=hvd.32044013711908&view=1up&seq=17&skin=2021 Hathi Trust]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Claude McKay]], [[Countee Cullen]], and [[Sterling A. Brown]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Several African American women poets won prizes for volumes that included sonnets, such as [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e But there were other writers - like [[Langston Hughes]] and [[Amiri Baraka]], for example - who, despite publishing some themselves, questioned the appropriateness of sonnets for Black poets. In the opinion of Hughes, the emergence of truly individual writing based on folk genres and experience was hindered by the imposition of genteel \"white\" verse forms irrelevant to them.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p. 56]\u003c\u002fref\u003e\u003cbr\u003e+Recent scholarship has recovered many [[African American]] sonnets that were not anthologised in standard American poetry volumes. Important nineteenth and early twentieth century writers have included [[Paul Laurence Dunbar]], [[Countee Cullen]], [[Sterling A. Brown]], and Jamaican-born [[Claude McKay]].\u003cref\u003e{{cite web| url = https:\u002f\u002fblog.bestamericanpoetry.com\u002fthe_best_american_poetry\u002f2019\u002f01\u002fsonnets-and-seeds-by-hollis-robbins.html| title = Best American Poetry}}\u003c\u002fref\u003e Some of their sonnets were personal responses to experience of displacement and racial prejudice. Cullen\u2019s \"At the Wailing Wall in Jerusalem\" (1927), for example, suggests a parallel between the history of his race and that of the Jewish [[diaspora]].\u003cref\u003e''The Art of the Sonnet'', pp. 273-76]\u003c\u002fref\u003e And McKay's sonnets of 1921 respond defiantly to the deadly [[Red Summer]] riots two years before.\u003cref\u003e''The Art of the Sonnet'', pp. 250-52]\u003c\u002fref\u003e There were also several African American women poets who won prizes for volumes that included sonnets, including [[Margaret Walker]] (Yale Poetry Series) [[Gwendolyn Brooks]] (Pulitzer Prize), [[Rita Dove]] (Pulitzer Prize), and [[Natasha Trethewey]] (Pulitzer Prize).\u003cref name=\"ugapress.org\"\u002f\u003e\u003cref\u003e{{Cite book|url=https:\u002f\u002fmississippi.universitypressscholarship.com\u002fview\u002f10.14325\u002fmississippi\u002f9781496817839.001.0001\u002fupso-9781496817839\u002f|title = African American Sonnet: A Literary Tradition|year = 2018|doi = 10.14325\u002fmississippi\u002f9781496817839.001.0001|last1 = M\u00fcller|first1 = Timo|isbn = 9781496817839|s2cid = 216967131}}\u003c\u002fref\u003e But there were other writers - like [[Langston Hughes]] and [[Amiri Baraka]], for example - who, despite publishing some themselves, questioned the appropriateness of sonnets for Black poets. In the opinion of Hughes, the emergence of truly individual writing based on folk genres and experience was hindered by the imposition of genteel \"white\" verse forms irrelevant to them.\u003cref\u003eJordan D. Finkin, ''Exile as Home: The Cosmopolitan Poetics of Leyb Naydus'', Hebrew Union College Press, 2017, [https:\u002f\u002fbooks.google.co.uk\u002fbooks?id=3gV-DwAAQBAJ&newbks=1&newbks_redir=0&printsec=frontcover#v=onepage&q&f=false p. 56]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One aspect of the American sonnet during the 20th century was the publication of sequences which had to wait decades for critical recognition. One instance is ''This Man's Army: A War in Fifty-Odd Sonnets'' (1928) by [[John Allan Wyeth (poet)|John Allan Wyeth]].\u003cref\u003e[https:\u002f\u002fbooks.google.com\u002fbooks?id=Acdw0ZY1dMAC ''This Man's Army: A War in Fifty-odd Sonnets''], University of South Carolina 2008\u003c\u002fref\u003e A series of irregular sonnets that recorded impressions of his military service with the [[American Expeditionary Force]] during the [[First World War]], it was scarcely noticed when it first appeared. Yet on its republication in 2008, [[Dana Gioia]] asserted in his introduction that Wyeth is the only American poet of the Great War who can stand comparison to British [[war poet]]s,\u003cref\u003eDana Gioia, [https:\u002f\u002fdanagioia.com\u002fessays\u002freviews-and-authors-notes\u002fthe-obscurity-of-john-allan-wyeth \"The Obscurity of John Allan Wyeth\"] (2008)\u003c\u002fref\u003e a claim later corroborated by [[Jon Stallworthy]] in his review of the work.\u003cref\u003e[[Dana Gioia]], ''John Allan Wyeth: Soldier Poet'', [[St Austin Review]], March\u002fApril 2020, p.5.\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 21\u003cbr\u003e+++ Revision 22\u003cbr\u003e@@ -181,7 +181,7 @@\u003cbr\u003e \u003cbr\u003e ==Further reading==\u003cbr\u003e * I. Bell, et al. ''A Companion to Shakespeare's Sonnets''. [[Blackwell Publishing]], 2006. {{ISBN|1-4051-2155-6}}.\u003cbr\u003e-* Burt, Stephen (now Stephanie) and Mikics, David. ''The Art of
