        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>                <div id="db4ec94c-5471-473d-a1ab-02bc155ab859" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("db4ec94c-5471-473d-a1ab-02bc155ab859")) {                    Plotly.newPlot(                        "db4ec94c-5471-473d-a1ab-02bc155ab859",                        [{"hoverinfo":"text","hovertemplate":"\u003cb\u003eDiff to this Revision:\u003c\u002fb\u003e\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Initial Revision","--- Revision 0\u003cbr\u003e+++ Revision 1\u003cbr\u003e@@ -11,7 +11,7 @@\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the hitherto laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e \u003cbr\u003e-Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e They include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e+Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e ","--- Revision 1\u003cbr\u003e+++ Revision 2\u003cbr\u003e@@ -438,6 +438,7 @@\u003cbr\u003e Special relativity predicts otherwise. Fig.&nbsp;5-3 illustrates two common variants of this scenario. Both variants can be analyzed using simple time dilation arguments.\u003cref name=Morin2007\u002f\u003e In Fig.&nbsp;5-3a, the receiver observes light from the source as being blueshifted by a factor of {{tmath|1= \\gamma }}. In Fig.&nbsp;5-3b, the light is redshifted by the same factor.\u003cbr\u003e \u003cbr\u003e === Measurement versus visual appearance ===\u003cbr\u003e+{{main|Terrel rotation}}\u003cbr\u003e [[File:Animated Terrell Rotation - Cube.gif|thumb|330px|Figure 5\u20134. Comparison of the measured length contraction of a cube versus its visual appearance.]]\u003cbr\u003e Time dilation and length contraction are not optical illusions, but genuine effects. Measurements of these effects are not an artifact of [[Doppler shift]], nor are they the result of neglecting to take into account the time it takes light to travel from an event to an observer.\u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -438,7 +438,7 @@\u003cbr\u003e Special relativity predicts otherwise. Fig.&nbsp;5-3 illustrates two common variants of this scenario. Both variants can be analyzed using simple time dilation arguments.\u003cref name=Morin2007\u002f\u003e In Fig.&nbsp;5-3a, the receiver observes light from the source as being blueshifted by a factor of {{tmath|1= \\gamma }}. In Fig.&nbsp;5-3b, the light is redshifted by the same factor.\u003cbr\u003e \u003cbr\u003e === Measurement versus visual appearance ===\u003cbr\u003e-{{main|Terrel rotation}}\u003cbr\u003e+{{main|Terrell rotation}}\u003cbr\u003e [[File:Animated Terrell Rotation - Cube.gif|thumb|330px|Figure 5\u20134. Comparison of the measured length contraction of a cube versus its visual appearance.]]\u003cbr\u003e Time dilation and length contraction are not optical illusions, but genuine effects. Measurements of these effects are not an artifact of [[Doppler shift]], nor are they the result of neglecting to take into account the time it takes light to travel from an event to an observer.\u003cbr\u003e ","--- Revision 3\u003cbr\u003e+++ Revision 4\u003cbr\u003e@@ -231,7 +231,7 @@\u003cbr\u003e {{See also|Twin paradox}}\u003cbr\u003e The reciprocity of time dilation between two observers in separate inertial frames leads to the so-called [[twin paradox]], articulated in its present form by Langevin in 1911.\u003cref name=\"Langevin_1911\"\u003e{{cite journal |last1=Langevin |first1=Paul |title=L'\u00c9volution de l'espace et du temps |journal=Scientia |date=1911 |volume=10 |pages=31\u201354 |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fTranslation:The_Evolution_of_Space_and_Time |access-date=20 June 2023}}\u003c\u002fref\u003e Langevin imagined an adventurer wishing to explore the future of the Earth. This traveler boards a projectile capable of traveling at 99.995% of the speed of light. After making a round-trip journey to and from a nearby star lasting only two years of his own life, he returns to an Earth that is two hundred years older.\u003cbr\u003e \u003cbr\u003e-This result appears puzzling because both the traveler and an Earthbound observer would see the other as moving, and so, because of the reciprocity of time dilation, one might initially expect that each should have found the other to have aged less. In reality, there is no paradox at all, because in order for the two observers to compare their proper times, the symmetry of the situation must be broken: At least one of the two observers must change their state of motion to match that of the other.\u003cref name='Debs_Redhead'\u003e{{cite journal |author1=Debs, Talal A. |author2=Redhead, Michael L.G. |title=The twin \"paradox\" and the conventionality of simultaneity |journal=American Journal of Physics |volume=64 |issue=4 |year=1996 |pages=384\u2013392 |doi=10.1119\u002f1.18252 |bibcode=1996AmJPh..64..384D}}\u003c\u002fref\u003e\u003cbr\u003e+This result appears puzzling because both the traveler and an Earthbound observer would see the other as moving, and so, because of the reciprocity of time dilation, one might initially expect that each should have found the other to have aged less. In reality, there is no paradox at all, because in order for the two observers to perform side-by-side comparisons of their elapsed proper times, the symmetry of the situation must be broken: At least one of the two observers must change their state of motion to match that of the other.\u003cref name='Debs_Redhead'\u003e{{cite journal |author1=Debs, Talal A. |author2=Redhead, Michael L.G. |title=The twin \"paradox\" and the conventionality of simultaneity |journal=American Journal of Physics |volume=64 |issue=4 |year=1996 |pages=384\u2013392 |doi=10.1119\u002f1.18252 |bibcode=1996AmJPh..64..384D}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[File:Twin paradox Doppler analysis.svg|thumb|Figure 4-4. Doppler analysis of twin paradox]]\u003cbr\u003e Knowing the general resolution of the paradox, however, does not immediately yield the ability to calculate correct quantitative results. Many solutions to this puzzle have been provided in the literature and have been reviewed in the [[Twin paradox]] article. We will examine in the following one such solution to the paradox.","--- Revision 4\u003cbr\u003e+++ Revision 5\u003cbr\u003e@@ -2,7 +2,7 @@\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e {{Special relativity sidebar}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | coco xixi = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').","--- Revision 5\u003cbr\u003e+++ Revision 6\u003cbr\u003e@@ -2,7 +2,7 @@\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e {{Special relativity sidebar}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | coco xixi = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -15,7 +15,7 @@\u003cbr\u003e \u003cbr\u003e A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e \u003cbr\u003e-Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; \"special\" really means \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p.451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e+Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; \"special\" really means \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The theory is \"special\" in that it only applies in the [[special case]] where the spacetime is \"flat\", that is, where the [[curvature of spacetime]] (a consequence of the [[energy\u2013momentum tensor]] and representing [[gravity]]) is negligible.\u003cref\u003eSean Carroll, Lecture Notes on General Relativity, ch. 1, \"Special relativity and flat spacetime\", http:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fMarch01\u002fCarroll3\u002fCarroll1.html\u003c\u002fref\u003e\u003cref group=\"note\"\u003eWald, General Relativity, p.&nbsp;60: \"...&nbsp;the special theory of relativity asserts that spacetime is the manifold \u003cmath\u003e\\mathbb{R}^4\u003c\u002fmath\u003e with a flat metric of Lorentz signature defined on it. Conversely, the entire content of special relativity ... is contained in this statement&nbsp;...\"\u003c\u002fref\u003e To correctly accommodate gravity, Einstein formulated general relativity in 1915. Special relativity, contrary to some historical descriptions, does accommodate [[acceleration (special relativity)|accelerations]] as well as [[Rindler coordinates|accelerating frames of reference]].\u003cref\u003e{{cite book |title=Explorations in Mathematical Physics: The Concepts Behind an Elegant Language |edition=illustrated |first1=Don |last1=Koks |publisher=Springer Science & Business Media |year=2006 |isbn=978-0-387-32793-8 |page=234 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC&pg=PA234 Extract of page 234]\u003c\u002fref\u003e\u003cref\u003e{{cite book |title=Relativity Made Relatively Easy |edition=illustrated |first1=Andrew M. |last1=Steane |publisher=OUP Oxford |year=2012 |isbn=978-0-19-966286-9 |page=226 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC&pg=PA226 Extract of page 226]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -81,7 +81,7 @@\u003cbr\u003e === Alternative approaches to special relativity ===\u003cbr\u003e {{main|Derivations of the Lorentz transformations}}\u003cbr\u003e \u003cbr\u003e-Einstein consistently based the derivation of Lorentz invariance (the essential core of special relativity) on just the two basic principles of relativity and light-speed invariance. He wrote:\u003cbr\u003e+Einstein consistently based the derivation of Lorentz invariance (the essential core of special relativity) on just the two basic principles of relativity and invariance of the speed of light. He wrote:\u003cbr\u003e {{blockquote|The insight fundamental for the special theory of relativity is this: The assumptions relativity and light speed invariance are compatible if relations of a new type (\"Lorentz transformation\") are postulated for the conversion of coordinates and times of events&nbsp;... The universal principle of the special theory of relativity is contained in the postulate: The laws of physics are invariant with respect to Lorentz transformations (for the transition from one inertial system to any other arbitrarily chosen inertial system). This is a restricting principle for natural laws&nbsp;...\u003cref name=\"autogenerated1\" group=p\u002f\u003e}}\u003cbr\u003e \u003cbr\u003e Thus many modern treatments of special relativity base it on the single postulate of universal Lorentz covariance, or, equivalently, on the single postulate of [[Minkowski spacetime]].\u003cref group=p\u003eDas, A. (1993) ''The Special Theory of Relativity, A Mathematical Exposition'', Springer, {{isbn|0-387-94042-1}}.\u003c\u002fref\u003e\u003cref group=p\u003eSchutz, J. (1997) Independent Axioms for Minkowski Spacetime, Addison Wesley Longman Limited, {{isbn|0-582-31760-6}}.\u003c\u002fref\u003e\u003cbr\u003e@@ -154,7 +154,7 @@\u003cbr\u003e === Invariant interval ===\u003cbr\u003e In Galilean relativity, an object's length ({{tmath|1= \\Delta r }}){{refn|group=note|In a spacetime setting, the ''length'' of a moving rigid object is the spatial distance between the ends of the object measured at the same time. In the rest frame of the object the simultaneity is not required.}} and the temporal separation between two events ({{tmath|1= \\Delta t }}) are independent invariants, the values of which do not change when observed from different frames of reference.{{refn|group=note|The results of the Michelson\u2013Morley experiment led [[George Francis FitzGerald]] and [[Hendrik Lorentz]] independently to propose the phenomenon of [[length contraction]]. Lorentz believed that length contraction represented a ''physical contraction'' of the atoms making up an object. He envisioned no fundamental change in the nature of space and time.\u003cref name=\"Miller1998\"\u003e{{cite book |last1=Miller |first1=Arthur I. |title=Albert Einstein's Special Theory of Relativity: Emergence (1905) and Early Interpretation (1905\u20131911) |date=1998 |publisher=Springer-Verlag |location=Mew York |isbn=978-0-387-94870-6}}\u003c\u002fref\u003e{{rp|62\u201368}}\u003cbr\u003e \u003cbr\u002f\u003e{{pad|4}}\u003cbr\u003e-Lorentz expected that length contraction would result in compressive strains in an object that should result in measurable effects. Such effects would include optical effects in transparent media, such as optical rotation\u003cref name=\"LorentzPolarization\" group=p\u003e{{cite journal |last1=Lorentz |first1=H.A. |title=The rotation of the plane of polarization in moving media |journal=Huygens Institute - Royal Netherlands Academy of Arts and Sciences (KNAW) |date=1902 |volume=4 |pages=669\u2013678 |url=http:\u002f\u002fwww.dwc.knaw.nl\u002fDL\u002fpublications\u002fPU00014324.pdf |access-date=15 November 2018| bibcode=1901KNAB....4..669L }}\u003c\u002fref\u003e and induction of double refraction,\u003cref name=\"LorentzElectromagnetic\" group=\"p\"\u003e{{cite journal |last1=Lorentz |first1=H. A. |title=Electromagnetic phenomena in a system moving with any velocity smaller than that of light |journal=Huygens Institute - Royal Netherlands Academy of Arts and Sciences (KNAW) |date=1904 |volume=6 |pages=809\u2013831 |url=http:\u002f\u002fwww.dwc.knaw.nl\u002fDL\u002fpublications\u002fPU00014148.pdf |access-date=15 November 2018|bibcode=1903KNAB....6..809L }}\u003c\u002fref\u003e and the induction of torques on charged condensers moving at an angle with respect to the aether.\u003cref name=LorentzElectromagnetic group=p\u002f\u003e Lorentz was perplexed by experiments such as the [[Trouton\u2013Noble experiment]] and the [[experiments of Rayleigh and Brace]] which failed to validate his theoretical expectations.\u003cref name=\"Miller1998\"\u002f\u003e}}{{refn|group=note|For mathematical consistency, Lorentz proposed a new time variable, the \"local time\", called that because it depended on the position of a moving body, following the relation {{nowrap|1={{prime|''t''}} = ''t'' \u2212 ''vx''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cref name=\"Lorentz1895\" group=p\u003e{{cite book |last1=Lorentz |first1=Hendrik |title=Attempt at a Theory of Electrical and Optical Phenomena in Moving Bodies (Versuch einer Theorie der electrischen und optischen Erscheinungen in bewegten K\u00f6rpern) |date=1895 |chapter=Investigation of oscillations excited by oscillating ions |chapter-url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fTranslation:Attempt_of_a_Theory_of_Electrical_and_Optical_Phenomena_in_Moving_Bodies\u002fSection_III |at=(subsection \u00a7 31) |publisher=E. J. Brill |location=Leiden |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fTranslation:Attempt_of_a_Theory_of_Electrical_and_Optical_Phenomena_in_Moving_Bodies}}\u003c\u002fref\u003e Lorentz considered local time not to be \"real\"; rather, it represented an ad hoc change of variable.\u003cref name=\"Bernstein2006\"\u003e{{cite book |last1=Bernstein |first1=Jeremy |title=Secrets of the Old One: Einstein, 1905 |date=2006 |publisher=Copernicus Books (imprint of Springer Science + Business Media) |isbn=978-0387-26005-1}}\u003c\u002fref\u003e{{rp|51,80}}\u003cbr\u003e+Lorentz expected that length contraction would result in compressive strains in an object that should result in measurable effects. Such effects would include optical effects in transparent media, such as optical rotation\u003cref name=\"LorentzPolarization\" group=p\u003e{{cite journal |last1=Lorentz |first1=H.A. |title=The rotation of the plane of polarization in moving media |journal=Huygens Institute \u2013 Royal Netherlands Academy of Arts and Sciences (KNAW) |date=1902 |volume=4 |pages=669\u2013678 |url=http:\u002f\u002fwww.dwc.knaw.nl\u002fDL\u002fpublications\u002fPU00014324.pdf |access-date=15 November 2018| bibcode=1901KNAB....4..669L }}\u003c\u002fref\u003e and induction of double refraction,\u003cref name=\"LorentzElectromagnetic\" group=\"p\"\u003e{{cite journal |last1=Lorentz |first1=H. A. |title=Electromagnetic phenomena in a system moving with any velocity smaller than that of light |journal=Huygens Institute \u2013 Royal Netherlands Academy of Arts and Sciences (KNAW) |date=1904 |volume=6 |pages=809\u2013831 |url=http:\u002f\u002fwww.dwc.knaw.nl\u002fDL\u002fpublications\u002fPU00014148.pdf |access-date=15 November 2018|bibcode=1903KNAB....6..809L }}\u003c\u002fref\u003e and the induction of torques on charged condensers moving at an angle with respect to the aether.\u003cref name=LorentzElectromagnetic group=p\u002f\u003e Lorentz was perplexed by experiments such as the [[Trouton\u2013Noble experiment]] and the [[experiments of Rayleigh and Brace]], which failed to validate his theoretical expectations.\u003cref name=\"Miller1998\"\u002f\u003e}}{{refn|group=note|For mathematical consistency, Lorentz proposed a new time variable, the \"local time\", called that because it depended on the position of a moving body, following the relation {{nowrap|1={{prime|''t''}} = ''t'' \u2212 ''vx''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cref name=\"Lorentz1895\" group=p\u003e{{cite book |last1=Lorentz |first1=Hendrik |title=Attempt at a Theory of Electrical and Optical Phenomena in Moving Bodies (Versuch einer Theorie der electrischen und optischen Erscheinungen in bewegten K\u00f6rpern) |date=1895 |chapter=Investigation of oscillations excited by oscillating ions |chapter-url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fTranslation:Attempt_of_a_Theory_of_Electrical_and_Optical_Phenomena_in_Moving_Bodies\u002fSection_III |at=(subsection \u00a7 31) |publisher=E. J. Brill |location=Leiden |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fTranslation:Attempt_of_a_Theory_of_Electrical_and_Optical_Phenomena_in_Moving_Bodies}}\u003c\u002fref\u003e Lorentz considered local time not to be \"real\"; rather, it represented an ad hoc change of variable.\u003cref name=\"Bernstein2006\"\u003e{{cite book |last1=Bernstein |first1=Jeremy |title=Secrets of the Old One: Einstein, 1905 |date=2006 |publisher=Copernicus Books (imprint of Springer Science + Business Media) |isbn=978-0387-26005-1}}\u003c\u002fref\u003e{{rp|51,80}}\u003cbr\u003e \u003cbr\u002f\u003e{{pad|4}}\u003cbr\u003e Impressed by Lorentz's \"most ingenious idea\", Poincar\u00e9 saw more in local time than a mere mathematical trick. It represented the actual time that would be shown on a moving observer's clocks. On the other hand, Poincar\u00e9 did not consider this measured time to be the \"true time\" that would be exhibited by clocks at rest in the aether. Poincar\u00e9 made no attempt to redefine the concepts of space and time. To Poincar\u00e9, Lorentz transformation described the ''apparent'' states of the field for a moving observer. ''True states'' remained those defined with respect to the ether.\u003cref name=\"Darrigol2005\"\u003e{{cite journal |last1=Darrigol |first1=Olivier |title=The Genesis of the Theory of Relativity |journal=S\u00e9minaire Poincar\u00e9 |date=2005 |volume=1 |pages=1\u201322 |url=http:\u002f\u002fwww.bourbaphy.fr\u002fdarrigol2.pdf |access-date=15 November 2018 |bibcode=2006eins.book....1D }}\u003c\u002fref\u003e}}\u003cbr\u003e \u003cbr\u003e@@ -214,11 +214,11 @@\u003cbr\u003e ==== Langevin's light-clock ====\u003cbr\u003e {{anchor|Langevin's Light-Clock}}\u003cbr\u003e [[File:Langevin Light Clock.gif|thumb|320px|Figure 4\u20133. Thought experiment using a light-clock to explain time dilation]]\u003cbr\u003e-[[Paul Langevin]], an early proponent of the theory of relativity, did much to popularize the theory in the face of resistance by many physicists to Einstein's revolutionary concepts. Among his numerous contributions to the foundations of special relativity were independent work on the mass-energy relationship, a thorough examination of the twin paradox, and investigations into rotating coordinate systems. His name is frequently attached to a hypothetical construct called a \"light-clock\" (originally developed by Lewis and Tolman in 1909\u003cref name=\"Lewis_Tolman_1909\"\u003e{{cite journal |last1=Lewis |first1=Gilbert Newton |last2=Tolman |first2=Richard Chase |title=The Principle of Relativity, and Non-Newtonian Mechanics |journal=Proceedings of the American Academy of Arts and Sciences |date=1909 |volume=44 |issue=25 |pages=709\u2013726 |doi=10.2307\u002f20022495 |jstor=20022495 |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fThe_Principle_of_Relativity,_and_Non-Newtonian_Mechanics |access-date=22 August 2023}}\u003c\u002fref\u003e) which he used to perform a novel derivation of the Lorentz transformation.\u003cref name=\"Cuvaj_1971\"\u003e{{cite journal |last1=Cuvaj |first1=Camillo |title=Paul Langeyin and the Theory of Relativity |journal=Japanese Studies in the History of Science |date=1971 |volume=10 |pages=113\u2013142 |url=http:\u002f\u002fwww.isc.meiji.ac.jp\u002f~sano\u002fhssj\u002fpdf\u002fCuvaj_C-1972-Langevin_Relativity-JSHS-No_10-pp113-142.pdf |access-date=12 June 2023}}\u003c\u002fref\u003e\u003cbr\u003e+[[Paul Langevin]], an early proponent of the theory of relativity, did much to popularize the theory in the face of resistance by many physicists to Einstein's revolutionary concepts. Among his numerous contributions to the foundations of special relativity were independent work on the mass\u2013energy relationship, a thorough examination of the twin paradox, and investigations into rotating coordinate systems. His name is frequently attached to a hypothetical construct called a \"light-clock\" (originally developed by Lewis and Tolman in 1909\u003cref name=\"Lewis_Tolman_1909\"\u003e{{cite journal |last1=Lewis |first1=Gilbert Newton |last2=Tolman |first2=Richard Chase |title=The Principle of Relativity, and Non-Newtonian Mechanics |journal=Proceedings of the American Academy of Arts and Sciences |date=1909 |volume=44 |issue=25 |pages=709\u2013726 |doi=10.2307\u002f20022495 |jstor=20022495 |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fThe_Principle_of_Relativity,_and_Non-Newtonian_Mechanics |access-date=22 August 2023}}\u003c\u002fref\u003e), which he used to perform a novel derivation of the Lorentz transformation.\u003cref name=\"Cuvaj_1971\"\u003e{{cite journal |last1=Cuvaj |first1=Camillo |title=Paul Langeyin and the Theory of Relativity |journal=Japanese Studies in the History of Science |date=1971 |volume=10 |pages=113\u2013142 |url=http:\u002f\u002fwww.isc.meiji.ac.jp\u002f~sano\u002fhssj\u002fpdf\u002fCuvaj_C-1972-Langevin_Relativity-JSHS-No_10-pp113-142.pdf |access-date=12 June 2023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e A light-clock is imagined to be a box of perfectly reflecting walls wherein a light signal reflects back and forth from opposite faces. The concept of time dilation is frequently taught using a  light-clock that is traveling in uniform inertial motion perpendicular to a line connecting the two mirrors.\u003cref\u003e{{Cite book |last1=Cassidy |first1=David C. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=rpQo7f9F1xUC&pg=PA422 |title=Understanding Physics |last2=Holton |first2=Gerald James |last3=Rutherford |first3=Floyd James |publisher=[[Springer-Verlag]] |year=2002 |isbn=978-0-387-98756-9 |pages=422}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Cutner |first=Mark Leslie |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2QVmiMW0O0MC&pg=PA128 |title=Astronomy, A Physical Perspective |publisher=[[Cambridge University Press]] |year=2003 |isbn=978-0-521-82196-4 |page=128}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last1=Ellis |first1=George F. R. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Hos31wty5WIC&pg=PA28 |title=Flat and Curved Space-times |last2=Williams |first2=Ruth M. |publisher=[[Oxford University Press]] |year=2000 |isbn=978-0-19-850657-7 |edition=2n |pages=28\u201329}}\u003c\u002fref\u003e\u003cref name=\"Feynman_Lectures_1\"\u003e{{cite book |last1=Feynman |first1=Richard P. |last2=Leighton |first2=Robert B. |last3=Sands |first3=Matthew |title=The feynman lectures on physics; vol I: The new millennium edition |date=2011 |publisher=Basic Books |isbn=978-0-465-02414-8 |page=15-5 |url=https:\u002f\u002fwww.feynmanlectures.caltech.edu\u002fI_15.html |access-date=12 June 2023}}\u003c\u002fref\u003e (Langevin himself made use of a light-clock oriented parallel to its line of motion.\u003cref name=\"Cuvaj_1971\"\u002f\u003e)\u003cbr\u003e \u003cbr\u003e-Consider the scenario illustrated in {{nowrap|Fig. 4-3A.}} Observer A holds a light-clock of length \u003cmath\u003eL\u003c\u002fmath\u003e as well as an electronic timer with which she measures how long it takes a pulse to make a round trip up and down along the light-clock. Although observer A is traveling rapidly along a train, from her point of view the emission and receipt of the pulse occur at the same place, and she measures the interval using a single clock located at the precise position of these two events. For the interval between these two events, observer A finds {{tmath|1= t_\\text{A} = 2 L\u002fc }}. A time interval measured using a single clock which is motionless in a particular reference frame is called a ''[[proper time interval]]''.\u003cref name=\"Halliday_1988\"\u003e{{cite book |last1=Halliday |first1=David |last2=Resnick |first2=Robert |title=Fundamental Physics: Extended Third Edition |date=1988 |publisher=John Wiley & sons |location=New York |isbn=0-471-81995-6 |pages=958\u2013959}}\u003c\u002fref\u003e\u003cbr\u003e+Consider the scenario illustrated in {{nowrap|Fig. 4-3A.}} Observer A holds a light-clock of length \u003cmath\u003eL\u003c\u002fmath\u003e as well as an electronic timer with which she measures how long it takes a pulse to make a round trip up and down along the light-clock. Although observer A is traveling rapidly along a train, from her point of view the emission and receipt of the pulse occur at the same place, and she measures the interval using a single clock located at the precise position of these two events. For the interval between these two events, observer A finds {{tmath|1= t_\\text{A} = 2 L\u002fc }}. A time interval measured using a single clock that is motionless in a particular reference frame is called a ''[[proper time interval]]''.\u003cref name=\"Halliday_1988\"\u003e{{cite book |last1=Halliday |first1=David |last2=Resnick |first2=Robert |title=Fundamental Physics: Extended Third Edition |date=1988 |publisher=John Wiley & sons |location=New York |isbn=0-471-81995-6 |pages=958\u2013959}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Fig. 4-3B illustrates these same two events from the standpoint of observer B, who is parked by the tracks as the train goes by at a speed of {{tmath|1= v }}. Instead of making straight up-and-down motions, observer B sees the pulses moving along a zig-zag line. However, because of the postulate of the constancy of the speed of light, the speed of the pulses along these diagonal lines is the same \u003cmath\u003ec\u003c\u002fmath\u003e that observer A saw for her up-and-down pulses. B measures the speed of the vertical component of these pulses as \u003cmath display=inline\u003e\\pm \\sqrt{c^2 - v^2},\u003c\u002fmath\u003e so that the total round-trip time of the pulses is \u003cmath display=inline\u003et_\\text{B} = 2L \\big\u002f \\sqrt{ c^2 - v^2 } = {}\u003c\u002fmath\u003e{{tmath|1= \\textstyle t_\\text{A} \\big\u002f \\sqrt {1 - v^2 \u002f c^2} }}. Note that for observer B, the emission and receipt of the light pulse occurred at different places, and he measured the interval using two stationary and synchronized clocks located at two different positions in his reference frame. The interval that B measured was therefore ''not'' a proper time interval because he did not measure it with a single resting clock.\u003cref name=\"Halliday_1988\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -324,7 +324,7 @@\u003cbr\u003e {{NumBlk||\u003cmath display=\"block\"\u003eu_1'=\\frac{u_1 -v}{1-u_1 v \u002f c^2 } \\ , \\qquad u_2'=\\frac{u_2}{\\gamma \\left( 1-u_1 v \u002f c^2 \\right) } \\ , \\qquad u_3'=\\frac{u_3}{\\gamma \\left( 1- u_1 v \u002f c^2 \\right) } \\ . \u003c\u002fmath\u003e|{{EquationRef|13}}}}\u003cbr\u003e {{NumBlk||\u003cmath display=\"block\"\u003eu_1=\\frac{u_1' +v}{1+ u_1' v \u002f c^2 } \\ , \\qquad u_2=\\frac{u_2'}{ \\gamma \\left( 1+ u_1' v \u002f c^2 \\right) } \\ , \\qquad u_3=\\frac{u_3'}{\\gamma \\left( 1+ u_1' v \u002f c^2 \\right)} \\ . \u003c\u002fmath\u003e|{{EquationRef|14}}}}\u003cbr\u003e \u003cbr\u003e-{{EquationNote|10|Equation&nbsp;10}} and {{EquationNote|14|Equation&nbsp;14}} can be interpreted as giving the ''resultant'' \u003cmath\u003e \\mathbf{u} \u003c\u002fmath\u003e of the two velocities \u003cmath\u003e \\mathbf{v} \u003c\u002fmath\u003e and {{tmath|1= \\mathbf{u'} }}, and they replace the formula \u003cmath\u003e \\mathbf{u = u' + v} \u003c\u002fmath\u003e which is valid in Galilean relativity. Interpreted in such a fashion, they are commonly referred to as the ''relativistic velocity addition (or composition) formulas'', valid for the three axes of ''S'' and {{prime|''S''}} being aligned with each other (although not necessarily in standard configuration).\u003cref name=\"Rindler0\"\u002f\u003e{{rp|47\u201349}}\u003cbr\u003e+{{EquationNote|10|Equation&nbsp;10}} and {{EquationNote|14|Equation&nbsp;14}} can be interpreted as giving the ''resultant'' \u003cmath\u003e \\mathbf{u} \u003c\u002fmath\u003e of the two velocities \u003cmath\u003e \\mathbf{v} \u003c\u002fmath\u003e and {{tmath|1= \\mathbf{u'} }}, and they replace the formula {{tmath|1= \\mathbf{u = u' + v} }}. which is valid in Galilean relativity. Interpreted in such a fashion, they are commonly referred to as the ''relativistic velocity addition (or composition) formulas'', valid for the three axes of ''S'' and {{prime|''S''}} being aligned with each other (although not necessarily in standard configuration).\u003cref name=\"Rindler0\"\u002f\u003e{{rp|47\u201349}}\u003cbr\u003e \u003cbr\u003e We note the following points:\u003cbr\u003e * If an object (e.g., a [[photon]]) were moving at the speed of light in one frame {{nowrap|1=(i.e., ''u'' = \u00b1''c''}} {{nowrap|1=or {{prime|''u''}} = \u00b1''c'')}}, then it would also be moving at the speed of light in any other frame, moving at {{nowrap|{{abs|''v''}} \u003c ''c''}}.\u003cbr\u003e@@ -332,7 +332,7 @@\u003cbr\u003e * If both {{abs|''u''}} and {{abs|''v''}} (and then also {{abs|{{prime|''u''}}}} and {{abs|{{prime|''v''}}}}) are small with respect to the speed of light (that is, e.g., {{nowrap|{{abs|{{sfrac|''u''|''c''}}}} \u226a {{math|1}})}}, then the intuitive Galilean transformations are recovered from the transformation equations for special relativity\u003cbr\u003e * Attaching a frame to a photon (''riding a light beam'' like Einstein considers) requires special treatment of the transformations.\u003cbr\u003e \u003cbr\u003e-There is nothing special about the ''x'' direction in the standard configuration. The above [[Formalism (mathematics)|formalism]] applies to any direction; and three orthogonal directions allow dealing with all directions in space by decomposing the velocity vectors to their components in these directions. See [[Velocity-addition formula]] for details.\u003cbr\u003e+There is nothing special about the ''x'' direction in the standard configuration. The above [[Formalism (mathematics)|formalism]] applies to any direction; and three orthogonal directions allow dealing with all directions in space by decomposing the velocity vectors to their components in these directions. See ''[[Velocity-addition formula]]'' for details.\u003cbr\u003e \u003cbr\u003e === Thomas rotation ===\u003cbr\u003e {{See also|Thomas rotation}}\u003cbr\u003e@@ -357,9 +357,9 @@\u003cbr\u003e === Causality and prohibition of motion faster than light ===\u003cbr\u003e {{See also|Causality (physics)|Tachyonic antitelephone}}\u003cbr\u003e [[File:Simple light cone diagram.svg|thumb|Figure 4\u20136. [[Light cone]]]]\u003cbr\u003e-In Fig.&nbsp;4-6, the time interval between the events A (the \"cause\") and B (the \"effect\") is 'time-like'; that is, there is a frame of reference in which events A and B occur at the ''same location in space'', separated only by occurring at different times. If A precedes B in that frame, then A precedes B in all frames accessible by a Lorentz transformation. It is possible for matter (or information) to travel (below light speed) from the location of A, starting at the time of A, to the location of B, arriving at the time of B, so there can be a causal relationship (with A the cause and B the effect).\u003cbr\u003e-\u003cbr\u003e-The interval AC in the diagram is 'space-like'; that is, there is a frame of reference in which events A and C occur simultaneously, separated only in space. There are also frames in which A precedes C (as shown) and frames in which C precedes A. But no frames are accessible by a Lorentz transformation, in which events A and C occur at the same location. If it were possible for a cause-and-effect relationship to exist between events A and C, paradoxes of causality would result.\u003cbr\u003e+In Fig.&nbsp;4-6, the time interval between the events A (the \"cause\") and B (the \"effect\") is 'timelike'; that is, there is a frame of reference in which events A and B occur at the ''same location in space'', separated only by occurring at different times. If A precedes B in that frame, then A precedes B in all frames accessible by a Lorentz transformation. It is possible for matter (or information) to travel (below light speed) from the location of A, starting at the time of A, to the location of B, arriving at the time of B, so there can be a causal relationship (with A the cause and B the effect).\u003cbr\u003e+\u003cbr\u003e+The interval AC in the diagram is 'spacelike'; that is, there is a frame of reference in which events A and C occur simultaneously, separated only in space. There are also frames in which A precedes C (as shown) and frames in which C precedes A. But no frames are accessible by a Lorentz transformation, in which events A and C occur at the same location. If it were possible for a cause-and-effect relationship to exist between events A and C, paradoxes of causality would result.\u003cbr\u003e \u003cbr\u003e For example, if signals could be sent faster than light, then signals could be sent into the sender's past (observer B in the diagrams).\u003cref\u003e{{cite book | first = Richard C.|last = Tolman|title =The Theory of the Relativity of Motion |location=Berkeley|publisher = University of California Press|date = 1917|page = 54|url = https:\u002f\u002fbooks.google.com\u002fbooks?id=8yodAAAAMAAJ&q=54}}\u003c\u002fref\u003e\u003cref group=p\u003e{{cite journal|author1=G. A. Benford |author2=D. L. Book |author3=W. A. Newcomb |name-list-style=amp |doi=10.1103\u002fPhysRevD.2.263|title=The Tachyonic Antitelephone|date=1970|journal=Physical Review D|volume=2|issue=2|pages=263\u2013265|bibcode = 1970PhRvD...2..263B |s2cid=121124132 }}\u003c\u002fref\u003e A variety of causal paradoxes could then be constructed.\u003cbr\u003e \u003cbr\u003e@@ -451,10 +451,10 @@\u003cbr\u003e [[File:M87 jet (1).jpg|thumb|Figure 5\u20136. Galaxy [[Messier 87|M87]] sends out a black-hole-powered jet of electrons and other sub-atomic particles traveling at nearly the speed of light.]]\u003cbr\u003e Both Fig.&nbsp;5-4 and Fig.&nbsp;5-5 illustrate objects moving transversely to the line of sight. In Fig.&nbsp;5-4, a cube is viewed from a distance of four times the length of its sides. At high speeds, the sides of the cube that are perpendicular to the direction of motion appear hyperbolic in shape. The cube is actually not rotated. Rather, light from the rear of the cube takes longer to reach one's eyes compared with light from the front, during which time the cube has moved to the right. At high speeds, the sphere in Fig.&nbsp;5-5 takes on the appearance of a flattened disk tilted up to 45\u00b0 from the line of sight. If the objects' motions are not strictly transverse but instead include a longitudinal component, exaggerated distortions in perspective may be seen.\u003cref name=\"Muller_2014\"\u003e{{cite journal |last1=M\u00fcller |first1=Thomas |last2=Boblest |first2=Sebastian |title=Visual appearance of wireframe objects in special relativity |journal=European Journal of Physics |date=2014 |volume=35 |issue=6 |page=065025 |doi=10.1088\u002f0143-0807\u002f35\u002f6\u002f065025|arxiv=1410.4583 |bibcode=2014EJPh...35f5025M |s2cid=118498333 }}\u003c\u002fref\u003e This illusion has come to be known as ''[[Terrell rotation]]'' or the ''Terrell\u2013Penrose effect''.\u003cref group=note\u003eEven though it has been many decades since Terrell and Penrose published their observations, popular writings continue to conflate measurement versus appearance. For example, Michio Kaku wrote in ''Einstein's Cosmos'' (W. W. Norton & Company, 2004. p. 65): \"...&nbsp;imagine that the speed of light is only 20 miles per hour. If a car were to go down the street, it might look compressed in the direction of motion, being squeezed like an accordion down to perhaps 1 inch in length.\"\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another example where visual appearance is at odds with measurement comes from the observation of apparent [[superluminal motion]] in various [[radio galaxies]], [[BL Lac objects]], [[quasars]], and other astronomical objects that eject [[astrophysical jet|relativistic-speed jets]] of matter at narrow angles with respect to the viewer. An apparent optical illusion results giving the appearance of faster than light travel.\u003cref\u003e{{cite book|last1=Zensus|first1=J. Anton|last2=Pearson|first2=Timothy J.|title=Superluminal Radio Sources|date=1987|publisher=Cambridge University Press|location=Cambridge, New York|isbn=9780521345606|page=3|edition=1st}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Chase|first1=Scott I.|title=Apparent Superluminal Velocity of Galaxies|url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSpeedOfLight\u002fSuperluminal\u002fsuperluminal.html|website=The Original Usenet Physics FAQ|publisher=Department of Mathematics, University of California, Riverside|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Richmond|first1=Michael|title=\"Superluminal\" motions in astronomical sources|url=http:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe - WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e+Another example where visual appearance is at odds with measurement comes from the observation of apparent [[superluminal motion]] in various [[radio galaxies]], [[BL Lac objects]], [[quasars]], and other astronomical objects that eject [[astrophysical jet|relativistic-speed jets]] of matter at narrow angles with respect to the viewer. An apparent optical illusion results giving the appearance of faster than light travel.\u003cref\u003e{{cite book|last1=Zensus|first1=J. Anton|last2=Pearson|first2=Timothy J.|title=Superluminal Radio Sources|date=1987|publisher=Cambridge University Press|location=Cambridge, New York|isbn=9780521345606|page=3|edition=1st}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Chase|first1=Scott I.|title=Apparent Superluminal Velocity of Galaxies|url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSpeedOfLight\u002fSuperluminal\u002fsuperluminal.html|website=The Original Usenet Physics FAQ|publisher=Department of Mathematics, University of California, Riverside|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Richmond|first1=Michael|title=\"Superluminal\" motions in astronomical sources|url=http:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe \u2013 WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Dynamics ==\u003cbr\u003e-Section [[#Consequences derived from the Lorentz transformation|''Consequences derived from the Lorentz transformation'']] dealt strictly with [[kinematics]], the study of the motion of points, bodies, and systems of bodies without considering the forces that caused the motion. This section discusses masses, forces, energy and so forth, and as such requires consideration of physical effects beyond those encompassed by the Lorentz transformation itself.\u003cbr\u003e+Section ''{{slink|#Consequences derived from the Lorentz transformation}}'' dealt strictly with [[kinematics]], the study of the motion of points, bodies, and systems of bodies without considering the forces that caused the motion. This section discusses masses, forces, energy and so forth, and as such requires consideration of physical effects beyond those encompassed by the Lorentz transformation itself.\u003cbr\u003e \u003cbr\u003e === Equivalence of mass and energy ===\u003cbr\u003e {{Main|Mass\u2013energy equivalence}}\u003cbr\u003e@@ -463,9 +463,9 @@\u003cbr\u003e \u003cbr\u003e The energy content of an object at rest with mass ''m'' equals ''mc''\u003csup\u003e2\u003c\u002fsup\u003e. Conservation of energy implies that, in any reaction, a decrease of the sum of the masses of particles must be accompanied by an increase in kinetic energies of the particles after the reaction. Similarly, the mass of an object can be increased by taking in kinetic energies.\u003cbr\u003e \u003cbr\u003e-In addition to the papers referenced above\u2014which give derivations of the Lorentz transformation and describe the foundations of special relativity\u2014Einstein also wrote at least four papers giving [[heuristic]] arguments for the equivalence (and transmutability) of mass and energy, for {{nowrap|1=''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cbr\u003e-\u003cbr\u003e-Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component which is the energy, and three space components which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e+In addition to the papers referenced above \u2013 which give derivations of the Lorentz transformation and describe the foundations of special relativity\u2014Einstein also wrote at least four papers giving [[heuristic]] arguments for the equivalence (and transmutability) of mass and energy, for {{nowrap|1=''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cbr\u003e+\u003cbr\u003e+Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component, which is the energy, and three space components, which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e \u003cbr\u003e The energy and momentum are properties of matter and radiation, and it is impossible to deduce that they form a four-vector just from the two basic postulates of special relativity by themselves, because these do not talk about matter or radiation, they only talk about space and time. The derivation therefore requires some additional physical reasoning. In his 1905 paper, Einstein used the additional principles that Newtonian mechanics should hold for slow velocities, so that there is one energy scalar and one three-vector momentum at slow velocities, and that the conservation law for energy and momentum is exactly true in relativity. Furthermore, he assumed that the energy of light is transformed by the same Doppler-shift factor as its frequency, which he had previously shown to be true based on Maxwell's equations.\u003cref name=electro group=p\u002f\u003e The first of Einstein's papers on this subject was \"Does the Inertia of a Body Depend upon its Energy Content?\" in 1905.\u003cref name=inertia group=p\u003e[http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fE_mc2\u002fwww\u002f Does the inertia of a body depend upon its energy content?] A. Einstein, ''Annalen der Physik''. '''18''':639, 1905 (English translation by W. Perrett and G.B. Jeffery)\u003c\u002fref\u003e Although Einstein's argument in this paper is nearly universally accepted by physicists as correct, even self-evident, many authors over the years have suggested that it is wrong.\u003cref name=Jammer\u003e{{cite book |title=Concepts of Mass in Classical and Modern Physics |author=[[Max Jammer]] |pages=177\u2013178 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=lYvz0_8aGsMC&pg=PA177 |isbn=978-0-486-29998-3 |publisher=Courier Dover Publications |date=1997 }}\u003c\u002fref\u003e Other authors suggest that the argument was merely inconclusive because it relied on some implicit assumptions.\u003cref name= Stachel\u003e{{cite book |title=Einstein from ''B'' to ''Z'' |page= 221 |author=John J. Stachel |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=OAsQ_hFjhrAC&pg=PA215 |isbn=978-0-8176-4143-6 |publisher=Springer |date=2002}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -484,8 +484,8 @@\u003cbr\u003e  | image2            = Einstein's derivation of E=mc2.svg\u003cbr\u003e  | caption2          = Figure 6-1. Einstein's 1905 derivation of ''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e\u003cbr\u003e }}\u003cbr\u003e-Fig. 6-1 (top). Consider a system of plane waves of light having frequency \u003cmath\u003ef\u003c\u002fmath\u003e traveling in direction \u003cmath\u003e\\phi\u003c\u002fmath\u003e relative to the x-axis of reference frame ''S''. The frequency (and hence energy) of the waves as measured in frame {{prime|''S''}} that is moving along the x-axis at velocity \u003cmath\u003ev\u003c\u002fmath\u003e is given by the relativistic Doppler shift formula which Einstein had developed in his 1905 paper on special relativity:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cbr\u003e-: \u003cmath\u003e \\frac{f'}{f} = \\frac{1 - (v\u002fc) \\cos{\\phi}}{\\sqrt{1 - v^2\u002fc^2}}    \u003c\u002fmath\u003e\u003cbr\u003e+Fig. 6-1 (top). Consider a system of plane waves of light having frequency \u003cmath\u003ef\u003c\u002fmath\u003e traveling in direction \u003cmath\u003e\\phi\u003c\u002fmath\u003e relative to the x-axis of reference frame ''S''. The frequency (and hence energy) of the waves as measured in frame {{prime|''S''}} that is moving along the x-axis at velocity \u003cmath\u003ev\u003c\u002fmath\u003e is given by the relativistic Doppler shift formula that Einstein had developed in his 1905 paper on special relativity:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cbr\u003e+: \u003cmath\u003e \\frac{f'}{f} = \\frac{1 - (v\u002fc) \\cos{\\phi}}{\\sqrt{1 - v^2\u002fc^2}} \u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e Fig. 6-1 (bottom). Consider an arbitrary body that is stationary in reference frame ''S''. Let this body emit a pair of equal-energy light-pulses in opposite directions at angle \u003cmath\u003e\\phi\u003c\u002fmath\u003e with respect to the x-axis. Each pulse has energy {{tmath|1= L\u002f2 }}. Because of conservation of momentum, the body remains stationary in ''S'' after emission of the two pulses. Let \u003cmath\u003eE_0\u003c\u002fmath\u003e be the energy of the body before emission of the two pulses and \u003cmath\u003eE_1\u003c\u002fmath\u003e after their emission.\u003cbr\u003e \u003cbr\u003e@@ -508,13 +508,13 @@\u003cbr\u003e \u003cbr\u003e Rindler has observed that Einstein's heuristic argument suggested merely that energy ''contributes'' to mass. In 1905, Einstein's cautious expression of the mass\u2013energy relationship allowed for the possibility that \"dormant\" mass might exist that would remain behind after all the energy of a body was removed. By 1907, however, Einstein was ready to assert that ''all'' inertial mass represented a reserve of energy. \"To equate ''all'' mass with energy required an act of aesthetic faith, very characteristic of Einstein.\"\u003cref name=\"Rindler0\"\u002f\u003e{{rp|81\u201384}} Einstein's bold hypothesis has been amply confirmed in the years subsequent to his original proposal.\u003cbr\u003e \u003cbr\u003e-For a variety of reasons, Einstein's original derivation is currently seldom taught. Besides the vigorous debate that continues until this day as to the formal correctness of his original derivation, the recognition of special relativity as being what Einstein called a \"principle theory\" has led to a shift away from reliance on electromagnetic phenomena to purely dynamic methods of proof.\u003cref name=\"Fernflores_2018\"\u003e{{cite book |last1=Fernflores |first1=Francisco |title=Einstein's Mass-Energy Equation, Volume I: Early History and Philosophical Foundations |date=2018 |publisher=Momentum Pres |location=New York |isbn=978-1-60650-857-2}}\u003c\u002fref\u003e\u003cbr\u003e+For a variety of reasons, Einstein's original derivation is currently seldom taught. Besides the vigorous debate that continues until this day as to the formal correctness of his original derivation, the recognition of special relativity as being what Einstein called a \"principle theory\" has led to a shift away from reliance on electromagnetic phenomena to purely dynamic methods of proof.\u003cref name=\"Fernflores_2018\"\u003e{{cite book |last1=Fernflores |first1=Francisco |title=Einstein's Mass\u2013Energy Equation, Volume I: Early History and Philosophical Foundations |date=2018 |publisher=Momentum Pres |location=New York |isbn=978-1-60650-857-2}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === How far can you travel from the Earth? ===\u003cbr\u003e {{See also|Space travel under constant acceleration}}\u003cbr\u003e-Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e-\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e-where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e+Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~&nbsp;100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems that exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e+\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}} ,\u003c\u002fmath\u003e\u003cbr\u003e+where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at {{nowrap|1=''v'' = 0.712 ''c''}} and {{nowrap|0.946 ''c''}} after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do \u2013 since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at {{nowrap|1.1 ''g''}} will take {{val|148,000}} years and cover about {{val|140,000}} light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Elastic collisions ===\u003cbr\u003e Examination of the collision products generated by particle accelerators around the world provides scientists evidence of the structure of the subatomic world and the natural laws governing it. Analysis of the collision products, the sum of whose masses may vastly exceed the masses of the incident particles, requires special relativity.\u003cref name=\"Idema_2022\"\u003e{{cite web |last1=Idema |first1=Timon |title=Mechanics and Relativity. Chapter 14: Relativistic Collisions |url=https:\u002f\u002fphys.libretexts.org\u002fBookshelves\u002fUniversity_Physics\u002fBook%3A_Mechanics_and_Relativity_(Idema)\u002f14%3A_Relativistic_Collisions |website=LibreTexts Physics |date=17 April 2019 |publisher=California State University Affordable Learning Solutions Program |access-date=2 January 2023}}\u003c\u002fref\u003e\u003cbr\u003e@@ -653,10 +653,10 @@\u003cbr\u003e   A_1' &= \\gamma \\left( A_1 - (v\u002fc) A_0 \\right)\\\\\u003cbr\u003e   A_2' &= A_2 \\\\ \u003cbr\u003e   A_3' &= A_3\u003cbr\u003e-\\end{align}\u003c\u002fmath\u003e\u003cbr\u003e+\\end{align} ,\u003c\u002fmath\u003e\u003cbr\u003e which comes from simply replacing ''ct'' with ''A''\u003csub\u003e0\u003c\u002fsub\u003e and ''x'' with ''A''\u003csub\u003e1\u003c\u002fsub\u003e in the earlier presentation of the [[#Lorentz transformations|'''Lorentz transformation.''']]\u003cbr\u003e \u003cbr\u003e-As usual, when we write ''x'', ''t'', etc. we generally mean ''&Delta;x'', ''&Delta;t'' etc.\u003cbr\u003e+As usual, when we write ''x'', ''t'', etc. we generally mean \u0394''x'', \u0394''t'' etc.\u003cbr\u003e \u003cbr\u003e The last three components of a {{nowrap|1=4\u2013vector}} must be a standard vector in three-dimensional space. Therefore, a {{nowrap|1=4\u2013vector}} must transform like {{tmath|1=(c \\Delta t, \\Delta x, \\Delta y, \\Delta z)}} under Lorentz transformations as well as rotations.\u003cref name=\"Schutz1985\"\u003e{{cite book| last1=Schutz |first1= Bernard F. |title=A first course in general relativity|date=1985|publisher=Camb
