E_mc2\u002fwww\u002f Does the inertia of a body depend upon its energy content?] A. Einstein, ''Annalen der Physik''. '''18''':639, 1905 (English translation by W. Perrett and G.B. Jeffery)\u003c\u002fref\u003e Although Einstein's argument in this paper is nearly universally accepted by physicists as correct, even self-evident, many authors over the years have suggested that it is wrong.\u003cref name=Jammer\u003e{{cite book |title=Concepts of Mass in Classical and Modern Physics |author=[[Max Jammer]] |pages=177\u2013178 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=lYvz0_8aGsMC&pg=PA177 |isbn=978-0-486-29998-3 |publisher=Courier Dover Publications |date=1997 }}\u003c\u002fref\u003e Other authors suggest that the argument was merely inconclusive because it relied on some implicit assumptions.\u003cref name= Stachel\u003e{{cite book |title=Einstein from ''B'' to ''Z'' |page= 221 |author=John J. Stachel |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=OAsQ_hFjhrAC&pg=PA215 |isbn=978-0-8176-4143-6 |publisher=Springer |date=2002}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Einstein acknowledged the controversy over his derivation in his 1907 survey paper on special relativity. There he notes that it is problematic to rely on Maxwell's equations for the heuristic mass\u2013energy argument. The argument in his 1905 paper can be carried out with the emission of any massless particles, but the Maxwell equations are implicitly used to make it obvious that the emission of light in particular can be achieved only by doing work. To emit electromagnetic waves, all you have to do is shake a charged particle, and this is clearly doing work, so that the emission is of energy.\u003cref name=survey group=p\u003e[https:\u002f\u002farchive.today\u002f20240524161707\u002fhttps:\u002f\u002fwww.webcitation.org\u002f5knwYbqwK?url=http:\u002f\u002fwww.geocities.com\u002fphysics_world\u002fabstracts\u002fEinstein_1907A_abstract.htm ''On the Inertia of Energy Required by the Relativity Principle''], A. Einstein, Annalen der Physik 23 (1907): 371\u2013384\u003c\u002fref\u003e\u003cref group=note\u003eIn a letter to Carl Seelig in 1955, Einstein wrote \"I had already previously found that Maxwell's theory did not account for the micro-structure of radiation and could therefore have no general validity.\", Einstein letter to Carl Seelig, 1955.\u003c\u002fref\u003e","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -659,7 +659,7 @@\u003cbr\u003e \u003cbr\u003e As usual, when we write ''x'', ''t'', etc. we generally mean ''&Delta;x'', ''&Delta;t'' etc.\u003cbr\u003e \u003cbr\u003e-The last three components of a {{nowrap|1=4\u2013vector}} must be a standard vector in three-dimensional space. Therefore, a {{nowrap|1=4\u2013vector}} must transform like {{tmath|1=(c \\Delta t, \\Delta x, \\Delta y, \\Delta z)}} under Lorentz transformations as well as rotations.\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+The last three components of a {{nowrap|1=4\u2013vector}} must be a standard vector in three-dimensional space. Therefore, a {{nowrap|1=4\u2013vector}} must transform like {{tmath|1=(c \\Delta t, \\Delta x, \\Delta y, \\Delta z)}} under Lorentz transformations as well as rotations.\u003cref name=\"Schutz1985\"\u003e{{cite book| last1=Schutz |first1= Bernard F. |title=A first course in general relativity|date=1985|publisher=Cambridge University Press|location=Cambridge, UK|isbn=0521277035|page=26}}\u003c\u002fref\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== Properties of 4-vectors ====\u003cbr\u003e * '''Closure under linear combination:''' If ''A'' and ''B'' are {{nowrap|1=4-vectors}}, then {{tmath|1=C = aA + aB}} is also a {{nowrap|1=4-vector}}.","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -560,17 +560,17 @@\u003cbr\u003e  | direction         = horizontal\u003cbr\u003e  | width1            = 135\u003cbr\u003e  | image1            = Trig functions (sine and cosine).svg\u003cbr\u003e- | caption1          = Figure 4-1a.  A ray through the [[unit circle]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e + ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cos ''a'', sin ''a'')}}, where ''a'' is twice the area between the ray, the circle, and the ''x''-axis.\u003cbr\u003e+ | caption1          = Figure 7-1a.  A ray through the [[unit circle]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e + ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cos ''a'', sin ''a'')}}, where ''a'' is twice the area between the ray, the circle, and the ''x''-axis.\u003cbr\u003e  | width2            = 190\u003cbr\u003e  | image2            = Hyperbolic functions-2.svg\u003cbr\u003e- | caption2          = Figure 4-1b. A ray through the [[unit hyperbola]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cosh ''a'', sinh ''a'')}}, where ''a'' is twice the area between the ray, the hyperbola, and the ''x''-axis.\u003cbr\u003e+ | caption2          = Figure 7-1b. A ray through the [[unit hyperbola]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cosh ''a'', sinh ''a'')}}, where ''a'' is twice the area between the ray, the hyperbola, and the ''x''-axis.\u003cbr\u003e }}\u003cbr\u003e-[[File:Sinh+cosh+tanh.svg|thumb|180px|Figure 4\u20132. Plot of the three basic [[Hyperbolic function]]s: hyperbolic sine ([[:File:Hyperbolic Sine.svg|sinh]]), hyperbolic cosine ([[:File:Hyperbolic Cosine.svg|cosh]]) and hyperbolic tangent ([[:File:Hyperbolic Tangent.svg|tanh]]). Sinh is red, cosh is blue and tanh is green.]]\u003cbr\u003e+[[File:Sinh+cosh+tanh.svg|thumb|180px|Figure 7\u20132. Plot of the three basic [[Hyperbolic function]]s: hyperbolic sine ([[:File:Hyperbolic Sine.svg|sinh]]), hyperbolic cosine ([[:File:Hyperbolic Cosine.svg|cosh]]) and hyperbolic tangent ([[:File:Hyperbolic Tangent.svg|tanh]]). Sinh is red, cosh is blue and tanh is green.]]\u003cbr\u003e Lorentz transformations relate coordinates of events in one reference frame to those of another frame. Relativistic composition of velocities is used to add two velocities together. The formulas to perform the latter computations are nonlinear, making them more complex than the corresponding Galilean formulas.\u003cbr\u003e \u003cbr\u003e This nonlinearity is an artifact of our choice of parameters.\u003cref name=\"Taylor\" \u002f\u003e{{rp|47\u201359}} We have previously noted that in an {{nowrap|1=x\u2013ct}} spacetime diagram, the points at some constant spacetime interval from the origin form an invariant hyperbola. We have also noted that the coordinate systems of two spacetime reference frames in standard configuration are hyperbolically rotated with respect to each other.\u003cbr\u003e \u003cbr\u003e-The natural functions for expressing these relationships are the [[Hyperbolic functions|hyperbolic analogs of the trigonometric functions]]. Fig.&nbsp;4-1a shows a [[unit circle]] with sin(''a'') and cos(''a''), the only difference between this diagram and the familiar unit circle of elementary trigonometry being that ''a'' is interpreted, not as the angle between the ray and the {{nowrap|1=''x''-axis}}, but as twice the area of the sector swept out by the ray from the {{nowrap|1=''x''-axis}}. Numerically, the angle and {{nowrap|1=2 \u00d7 area}} measures for the unit circle are identical. Fig.&nbsp;4-1b shows a [[unit hyperbola]] with sinh(''a'') and cosh(''a''), where ''a'' is likewise interpreted as twice the tinted area.\u003cref\u003e{{cite book|last1=Thomas|first1=George B.|last2=Weir|first2=Maurice D.|last3=Hass|first3=Joel|last4=Giordano|first4=Frank R.|title=Thomas' Calculus: Early Transcendentals|date=2008|publisher=Pearson Education, Inc.|location=Boston|isbn=978-0-321-49575-4|page=533|edition=Eleventh}}\u003c\u002fref\u003e Fig.&nbsp;4-2 presents plots of the sinh, cosh, and tanh functions.\u003cbr\u003e+The natural functions for expressing these relationships are the [[Hyperbolic functions|hyperbolic analogs of the trigonometric functions]]. Fig.&nbsp;7-1a shows a [[unit circle]] with sin(''a'') and cos(''a''), the only difference between this diagram and the familiar unit circle of elementary trigonometry being that ''a'' is interpreted, not as the angle between the ray and the {{nowrap|1=''x''-axis}}, but as twice the area of the sector swept out by the ray from the {{nowrap|1=''x''-axis}}. Numerically, the angle and {{nowrap|1=2 \u00d7 area}} measures for the unit circle are identical. Fig.&nbsp;7-1b shows a [[unit hyperbola]] with sinh(''a'') and cosh(''a''), where ''a'' is likewise interpreted as twice the tinted area.\u003cref\u003e{{cite book|last1=Thomas|first1=George B.|last2=Weir|first2=Maurice D.|last3=Hass|first3=Joel|last4=Giordano|first4=Frank R.|title=Thomas' Calculus: Early Transcendentals|date=2008|publisher=Pearson Education, Inc.|location=Boston|isbn=978-0-321-49575-4|page=533|edition=Eleventh}}\u003c\u002fref\u003e Fig.&nbsp;7-2 presents plots of the sinh, cosh, and tanh functions.\u003cbr\u003e \u003cbr\u003e For the unit circle, the slope of the ray is given by\u003cbr\u003e : \u003cmath\u003e\\text{slope} = \\tan a  = \\frac{\\sin a }{\\cos a }.\u003c\u002fmath\u003e\u003cbr\u003e@@ -678,10 +678,10 @@\u003cbr\u003e  | direction         = horizontal\u003cbr\u003e  | width1            = 150\u003cbr\u003e  | image1            = Momentarily Comoving Reference Frame.gif\u003cbr\u003e- | caption1          = Figure 4-3a. The momentarily comoving reference frames of an accelerating particle as observed from a stationary frame.\u003cbr\u003e+ | caption1          = Figure 7-3a. The momentarily comoving reference frames of an accelerating particle as observed from a stationary frame.\u003cbr\u003e  | width2            = 150\u003cbr\u003e  | image2            = Lorentz transform of world line.gif\u003cbr\u003e- | caption2          = Figure 4-3b. The momentarily comoving reference frames along the trajectory of an accelerating observer (center).\u003cbr\u003e+ | caption2          = Figure 7-3b. The momentarily comoving reference frames along the trajectory of an accelerating observer (center).\u003cbr\u003e }}\u003cbr\u003e : The {{nowrap|1=4-velocity}} is tangent to the world line of a particle, and has a length equal to one unit of time in the frame of the particle.\u003cbr\u003e : An accelerated particle does not have an inertial frame in which it is always at rest. However, an inertial frame can always be found which is momentarily comoving with the particle. This frame, the ''momentarily comoving reference frame'' (MCRF), enables application of special relativity to the analysis of accelerated particles.\u003cbr\u003e@@ -718,8 +718,8 @@\u003cbr\u003e \u003cbr\u003e The Dewan\u2013Beran\u2013Bell spaceship paradox ([[Bell's spaceship paradox]]) is a good example of a problem where intuitive reasoning unassisted by the geometric insight of the spacetime approach can lead to issues.\u003cbr\u003e \u003cbr\u003e-[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 4-4. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e-In Fig.&nbsp;4-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string which is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e+[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 7-4. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e+In Fig.&nbsp;7-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string which is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e \u003cbr\u003e When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e # To observers in the rest frame, the spaceships start a distance ''L'' apart and remain the same distance apart during acceleration. During acceleration, ''L'' is a length contracted distance of the distance {{nowrap|1=''L{{'}} = &gamma;L''}} in the frame of the accelerating spaceships. After a sufficiently long time, ''&gamma;'' will increase to a sufficiently large factor that the string must break.\u003cbr\u003e@@ -727,27 +727,27 @@\u003cbr\u003e \u003cbr\u003e The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e \u003cbr\u003e-[[File:Bell spaceship paradox.svg|thumb|Figure 4\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e-A spacetime diagram (Fig.&nbsp;4-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity \u003cmath\u003eAB\u003c\u002fmath\u003e.\u003cbr\u003e-\u003cbr\u003e-The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;4-5, the acceleration is finished, the ships will remain at a constant offset in some frame \u003cmath\u003eS'.\u003c\u002fmath\u003e If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in \u003cmath\u003eS,\u003c\u002fmath\u003e the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Bell spaceship paradox.svg|thumb|Figure 7\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e+A spacetime diagram (Fig.&nbsp;7-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity \u003cmath\u003eAB\u003c\u002fmath\u003e.\u003cbr\u003e+\u003cbr\u003e+The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;7-5, the acceleration is finished, the ships will remain at a constant offset in some frame \u003cmath\u003eS'.\u003c\u002fmath\u003e If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in \u003cmath\u003eS,\u003c\u002fmath\u003e the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e : \u003cmath\u003e\\begin{align}\u003cbr\u003e x'_{A}& = \\gamma\\left(x_{A}-vt\\right)\\\\\u003cbr\u003e x'_{B}& = \\gamma\\left(x_{A}+L-vt\\right)\\\\\u003cbr\u003e L'& = x'_{B}-x'_{A} =\\gamma L\u003cbr\u003e \\end{align}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e. As shown in Fig.&nbsp;4-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e+The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e. As shown in Fig.&nbsp;7-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e \u003cbr\u003e {{anchor|Accelerated observer with horizon}}\u003cbr\u003e \u003cbr\u003e ==== Accelerated observer with horizon ====\u003cbr\u003e {{Main|Event horizon#Apparent horizon of an accelerated particle|Rindler coordinates}}\u003cbr\u003e \u003cbr\u003e-Certain special relativity problem setups can lead to insight about phenomena normally associated with general relativity, such as [[event horizons]]. In the text accompanying [[#Spacelike and Timelike Invariant Hyperbolas|'''Fig.&nbsp;2-7''']], the magenta hyperbolae represented actual paths that are tracked by a constantly accelerating traveler in spacetime. During periods of positive acceleration, the traveler's velocity just ''approaches'' the speed of light, while, measured in our frame, the traveler's acceleration constantly decreases.\u003cbr\u003e-\u003cbr\u003e-[[File:Accelerated relativistic observer with horizon.png|thumb|Figure 4\u20136. Accelerated relativistic observer with horizon. Another well-drawn illustration of the same topic may be viewed [[:File:ConstantAcceleration02.jpg|'''here''']]. ]]\u003cbr\u003e-Fig.&nbsp;4-6 details various features of the traveler's motions with more specificity. At any given moment, her space axis is formed by a line passing through the origin and her current position on the hyperbola, while her time axis is the tangent to the hyperbola at her position. The velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e approaches a limit of one as \u003cmath\u003ect\u003c\u002fmath\u003e increases. Likewise, \u003cmath\u003e\\gamma\u003c\u002fmath\u003e approaches infinity.\u003cbr\u003e+Certain special relativity problem setups can lead to insight about phenomena normally associated with general relativity, such as [[event horizons]]. In the text accompanying [[Spacetime#Invariant hyperbola|Section \"Invariant hyperbola\" of the article Spacetime]], the magenta hyperbolae represented actual paths that are tracked by a constantly accelerating traveler in spacetime. During periods of positive acceleration, the traveler's velocity just ''approaches'' the speed of light, while, measured in our frame, the traveler's acceleration constantly decreases.\u003cbr\u003e+\u003cbr\u003e+[[File:Accelerated relativistic observer with horizon.png|thumb|Figure 7\u20136. Accelerated relativistic observer with horizon. Another well-drawn illustration of the same topic may be viewed [[:File:ConstantAcceleration02.jpg|'''here''']]. ]]\u003cbr\u003e+Fig.&nbsp;7-6 details various features of the traveler's motions with more specificity. At any given moment, her space axis is formed by a line passing through the origin and her current position on the hyperbola, while her time axis is the tangent to the hyperbola at her position. The velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e approaches a limit of one as \u003cmath\u003ect\u003c\u002fmath\u003e increases. Likewise, \u003cmath\u003e\\gamma\u003c\u002fmath\u003e approaches infinity.\u003cbr\u003e \u003cbr\u003e The shape of the invariant hyperbola corresponds to a path of constant proper acceleration. This is demonstrable as follows:\u003cbr\u003e # We remember that \u003cmath\u003e\\beta = ct\u002fx.\u003c\u002fmath\u003e\u003cbr\u003e@@ -756,7 +756,7 @@\u003cbr\u003e # From the relativistic force law, \u003cmath\u003eF = dp\u002fdt = \u003c\u002fmath\u003e\u003cmath\u003edpc\u002fd(ct) = d(\\beta \\gamma m c^2)\u002fd(ct).\u003c\u002fmath\u003e\u003cbr\u003e # Substituting \u003cmath\u003e\\beta(ct)\u003c\u002fmath\u003e from step 2 and the expression for \u003cmath\u003e\\gamma\u003c\u002fmath\u003e from step 3 yields \u003cmath\u003eF = mc^2 \u002f s ,\u003c\u002fmath\u003e which is a constant expression.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e-Fig.&nbsp;4-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;c per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e+Fig.&nbsp;7-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;c per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e After 100 hours according to Terence's clock, Stella enters a dark region. She has traveled outside Terence's timelike future. On the other hand, Terence can continue to '''receive''' Stella's messages to him indefinitely. He just has to wait long enough. Spacetime has been divided into distinct regions separated by an ''apparent'' event horizon. So long as Stella continues to accelerate, she can never know what takes place behind this horizon.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e ","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -467,13 +467,6 @@\u003cbr\u003e \u003cbr\u003e Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component which is the energy, and three space components which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e \u003cbr\u003e-=== How far can you travel from the Earth? ===\u003cbr\u003e-{{See also|Space travel under constant acceleration}}\u003cbr\u003e-Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e-\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e-where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e The energy and momentum are properties of matter and radiation, and it is impossible to deduce that they form a four-vector just from the two basic postulates of special relativity by themselves, because these do not talk about matter or radiation, they only talk about space and time. The derivation therefore requires some additional physical reasoning. In his 1905 paper, Einstein used the additional principles that Newtonian mechanics should hold for slow velocities, so that there is one energy scalar and one three-vector momentum at slow velocities, and that the conservation law for energy and momentum is exactly true in relativity. Furthermore, he assumed that the energy of light is transformed by the same Doppler-shift factor as its frequency, which he had previously shown to be true based on Maxwell's equations.\u003cref name=electro group=p\u002f\u003e The first of Einstein's papers on this subject was \"Does the Inertia of a Body Depend upon its Energy Content?\" in 1905.\u003cref name=inertia group=p\u003e[http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fE_mc2\u002fwww\u002f Does the inertia of a body depend upon its energy content?] A. Einstein, ''Annalen der Physik''. '''18''':639, 1905 (English translation by W. Perrett and G.B. Jeffery)\u003c\u002fref\u003e Although Einstein's argument in this paper is nearly universally accepted by physicists as correct, even self-evident, many authors over the years have suggested that it is wrong.\u003cref name=Jammer\u003e{{cite book |title=Concepts of Mass in Classical and Modern Physics |author=[[Max Jammer]] |pages=177\u2013178 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=lYvz0_8aGsMC&pg=PA177 |isbn=978-0-486-29998-3 |publisher=Courier Dover Publications |date=1997 }}\u003c\u002fref\u003e Other authors suggest that the argument was merely inconclusive because it relied on some implicit assumptions.\u003cref name= Stachel\u003e{{cite book |title=Einstein from ''B'' to ''Z'' |page= 221 |author=John J. Stachel |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=OAsQ_hFjhrAC&pg=PA215 |isbn=978-0-8176-4143-6 |publisher=Springer |date=2002}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Einstein acknowledged the controversy over his derivation in his 1907 survey paper on special relativity. There he notes that it is problematic to rely on Maxwell's equations for the heuristic mass\u2013energy argument. The argument in his 1905 paper can be carried out with the emission of any massless particles, but the Maxwell equations are implicitly used to make it obvious that the emission of light in particular can be achieved only by doing work. To emit electromagnetic waves, all you have to do is shake a charged particle, and this is clearly doing work, so that the emission is of energy.\u003cref name=survey group=p\u003e[https:\u002f\u002farchive.today\u002f20240524161707\u002fhttps:\u002f\u002fwww.webcitation.org\u002f5knwYbqwK?url=http:\u002f\u002fwww.geocities.com\u002fphysics_world\u002fabstracts\u002fEinstein_1907A_abstract.htm ''On the Inertia of Energy Required by the Relativity Principle''], A. Einstein, Annalen der Physik 23 (1907): 371\u2013384\u003c\u002fref\u003e\u003cref group=note\u003eIn a letter to Carl Seelig in 1955, Einstein wrote \"I had already previously found that Maxwell's theory did not account for the micro-structure of radiation and could therefore have no general validity.\", Einstein letter to Carl Seelig, 1955.\u003c\u002fref\u003e\u003cbr\u003e@@ -516,6 +509,12 @@\u003cbr\u003e Rindler has observed that Einstein's heuristic argument suggested merely that energy ''contributes'' to mass. In 1905, Einstein's cautious expression of the mass\u2013energy relationship allowed for the possibility that \"dormant\" mass might exist that would remain behind after all the energy of a body was removed. By 1907, however, Einstein was ready to assert that ''all'' inertial mass represented a reserve of energy. \"To equate ''all'' mass with energy required an act of aesthetic faith, very characteristic of Einstein.\"\u003cref name=\"Rindler0\"\u002f\u003e{{rp|81\u201384}} Einstein's bold hypothesis has been amply confirmed in the years subsequent to his original proposal.\u003cbr\u003e \u003cbr\u003e For a variety of reasons, Einstein's original derivation is currently seldom taught. Besides the vigorous debate that continues until this day as to the formal correctness of his original derivation, the recognition of special relativity as being what Einstein called a \"principle theory\" has led to a shift away from reliance on electromagnetic phenomena to purely dynamic methods of proof.\u003cref name=\"Fernflores_2018\"\u003e{{cite book |last1=Fernflores |first1=Francisco |title=Einstein's Mass-Energy Equation, Volume I: Early History and Philosophical Foundations |date=2018 |publisher=Momentum Pres |location=New York |isbn=978-1-60650-857-2}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== How far can you travel from the Earth? ===\u003cbr\u003e+{{See also|Space travel under constant acceleration}}\u003cbr\u003e+Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e+\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e+where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===  Elastic collisions  ===\u003cbr\u003e Examination of the collision products generated by particle accelerators around the world provides scientists evidence of the structure of the subatomic world and the natural laws governing it. Analysis of the collision products, the sum of whose masses may vastly exceed the masses of the incident particles, requires special relativity.\u003cref name=\"Idema_2022\"\u003e{{cite web |last1=Idema |first1=Timon |title=Mechanics and Relativity. Chapter 14: Relativistic Collisions |url=https:\u002f\u002fphys.libretexts.org\u002fBookshelves\u002fUniversity_Physics\u002fBook%3A_Mechanics_and_Relativity_(Idema)\u002f14%3A_Relativistic_Collisions |website=LibreTexts Physics |date=17 April 2019 |publisher=California State University Affordable Learning Solutions Program |access-date=2 January 2023}}\u003c\u002fref\u003e","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -5,7 +5,7 @@\u003cbr\u003e In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 treatment, the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons, Inc. | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]).\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer.\u003cbr\u003e-The first postulate was first formulated by [[Galileo Galilei]] (see [[Galilean invariance]]). \u003cbr\u003e+The first postulate was first formulated by [[Galileo Galilei]] (see [[Galilean invariance]]).\u003cbr\u003e \u003cbr\u003e == Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e@@ -207,10 +207,10 @@\u003cbr\u003e \u003cbr\u003e This shows that the time (\u0394{{prime|''t''}}) between the two ticks as seen in the frame in which the clock is moving ({{prime|''S''}}), is ''longer'' than the time (\u0394''t'') between these ticks as measured in the rest frame of the clock (''S''). Time dilation explains a number of physical phenomena; for example, the lifetime of high speed [[muon]]s created by the collision of cosmic rays with particles in the Earth's outer atmosphere and moving towards the surface is greater than the lifetime of slowly moving muons, created and decaying in a laboratory.\u003cref\u003e{{cite book|author1=Daniel Kleppner|author2=David Kolenkow|name-list-style=amp|title=An Introduction to Mechanics|date=1973|pages=[https:\u002f\u002farchive.org\u002fdetails\u002fintroductiontome00dani\u002fpage\u002f468 468\u201370]|publisher=McGraw-Hill |isbn=978-0-07-035048-9|url=https:\u002f\u002farchive.org\u002fdetails\u002fintroductiontome00dani\u002fpage\u002f468}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:Observer_in_special_relativity.svg|thumb|Figure 4-2. Hypothetical infinite array of synchronized clocks associated with an observer's reference frame]]\u003cbr\u003e+[[File:Observer_in_special_relativity.svg|thumb|Figure 4\u20132. Hypothetical infinite array of synchronized clocks associated with an observer's reference frame]]\u003cbr\u003e Whenever one hears a statement to the effect that \"moving clocks run slow\", one should envision an inertial reference frame thickly populated with identical, synchronized clocks. As a moving clock travels through this array, its reading at any particular point is compared with a stationary clock at the same point.\u003cref name=\"French_1968\"\u002f\u003e{{rp|149\u2013152}}\u003cbr\u003e \u003cbr\u003e-The measurements that we would get if we actually ''looked'' at a moving clock would, in general, not at all be the same thing, because the time that would see would be delayed by the finite speed of light, i.e the times that we see would be distorted by the [[Doppler effect]]. Measurements of relativistic effects must always be understood as having been made after finite speed-of-light effects have been factored out.\u003cref name=\"French_1968\"\u003e{{cite book |last1=French |first1=A. P. |title=Special Relativity |date=1968 |publisher=W. W. Norton & Company |location=New York |isbn=0-393-09793-5}}\u003c\u002fref\u003e{{rp|149\u2013152}}\u003cbr\u003e+The measurements that we would get if we actually ''looked'' at a moving clock would, in general, not at all be the same thing, because the time that would see would be delayed by the finite speed of light, i.e. the times that we see would be distorted by the [[Doppler effect]]. Measurements of relativistic effects must always be understood as having been made after finite speed-of-light effects have been factored out.\u003cref name=\"French_1968\"\u003e{{cite book |last1=French |first1=A. P. |title=Special Relativity |date=1968 |publisher=W. W. Norton & Company |location=New York |isbn=0-393-09793-5}}\u003c\u002fref\u003e{{rp|149\u2013152}}\u003cbr\u003e \u003cbr\u003e ==== Langevin's light-clock ====\u003cbr\u003e {{anchor|Langevin's Light-Clock}}\u003cbr\u003e@@ -448,7 +448,7 @@\u003cbr\u003e For many years, the distinction between the two had not been generally appreciated, and it had generally been thought that a length contracted object passing by an observer would in fact actually be ''seen'' as length contracted. In 1959, James Terrell and [[Roger Penrose]] independently pointed out that differential time lag effects in signals reaching the observer from the different parts of a moving object result in a fast moving object's visual appearance being quite different from its measured shape. For example, a receding object would ''appear'' contracted, an approaching object would ''appear'' elongated, and a passing object would have a skew appearance that has been likened to a rotation.\u003cref name=\"Terrell\" group=p\u003e{{cite journal|last1=Terrell|first1=James|title=Invisibility of the Lorentz Contraction|journal=[[Physical Review]]|date=15 November 1959|volume=116|issue=4|pages=1041\u20131045|doi=10.1103\u002fPhysRev.116.1041|bibcode=1959PhRv..116.1041T}}\u003c\u002fref\u003e\u003cref name=\"Penrose\" group=p\u003e{{cite journal|last1=Penrose|first1=Roger|title=The Apparent Shape of a Relativistically Moving Sphere|journal=[[Proceedings of the Cambridge Philosophical Society|Mathematical Proceedings of the Cambridge Philosophical Society]]|date=24 October 2008|volume=55|issue=1|pages=137\u2013139|doi=10.1017\u002fS0305004100033776|bibcode=1959PCPS...55..137P|s2cid=123023118 }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Cook|first1=Helen|title=Relativistic Distortion|url=http:\u002f\u002fwww.math.ubc.ca\u002f~cass\u002fcourses\u002fm309-01a\u002fcook\u002f|publisher=Mathematics Department, University of British Columbia|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Signell|first1=Peter|title=Appearances at Relativistic Speeds|url=https:\u002f\u002fstuff.mit.edu\u002fafs\u002fathena\u002fcourse\u002f8\u002f8.20\u002fwww\u002fm44.pdf|website=Project PHYSNET|publisher=Michigan State University, East Lansing, MI|access-date=12 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170413153459\u002fhttps:\u002f\u002fstuff.mit.edu\u002fafs\u002fathena\u002fcourse\u002f8\u002f8.20\u002fwww\u002fm44.pdf|archive-date=13 April 2017|url-status=dead}}\u003c\u002fref\u003e A sphere in motion retains the circular outline for all speeds, for any distance, and for all view angles, although\u003cbr\u003e the surface of the sphere and the images on it will appear distorted.\u003cref\u003e{{cite web|last1=Kraus|first1=Ute|title=The Ball is Round|url=http:\u002f\u002fwww.spacetimetravel.org\u002ffussball\u002ffussball.html|website=Space Time Travel: Relativity visualized|publisher=Institut f\u00fcr Physik Universit\u00e4t Hildesheim|access-date=16 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170512165032\u002fhttp:\u002f\u002fwww.spacetimetravel.org\u002ffussball\u002ffussball.html|archive-date=12 May 2017|url-status=dead}}\u003c\u002fref\u003e\u003cref name=\"Boas_1961\"\u003e{{cite journal |last1=Boas |first1=Mary L. |title=Apparent Shape of Large Objects at Relativistic Speeds |journal=American Journal of Physics |date=1961 |volume=29 |issue=5 |page=283 |doi=10.1119\u002f1.1937751|bibcode=1961AmJPh..29..283B }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-[[File:M87 jet (1).jpg|thumb|Figure 5-6. Galaxy [[Messier 87|M87]] sends out a black-hole-powered jet of electrons and other sub-atomic particles traveling at nearly the speed of light.]]\u003cbr\u003e+[[File:M87 jet (1).jpg|thumb|Figure 5\u20136. Galaxy [[Messier 87|M87]] sends out a black-hole-powered jet of electrons and other sub-atomic particles traveling at nearly the speed of light.]]\u003cbr\u003e Both Fig.&nbsp;5-4 and Fig.&nbsp;5-5 illustrate objects moving transversely to the line of sight. In Fig.&nbsp;5-4, a cube is viewed from a distance of four times the length of its sides. At high speeds, the sides of the cube that are perpendicular to the direction of motion appear hyperbolic in shape. The cube is actually not rotated. Rather, light from the rear of the cube takes longer to reach one's eyes compared with light from the front, during which time the cube has moved to the right. At high speeds, the sphere in Fig.&nbsp;5-5 takes on the appearance of a flattened disk tilted up to 45\u00b0 from the line of sight. If the objects' motions are not strictly transverse but instead include a longitudinal component, exaggerated distortions in perspective may be seen.\u003cref name=\"Muller_2014\"\u003e{{cite journal |last1=M\u00fcller |first1=Thomas |last2=Boblest |first2=Sebastian |title=Visual appearance of wireframe objects in special relativity |journal=European Journal of Physics |date=2014 |volume=35 |issue=6 |page=065025 |doi=10.1088\u002f0143-0807\u002f35\u002f6\u002f065025|arxiv=1410.4583 |bibcode=2014EJPh...35f5025M |s2cid=118498333 }}\u003c\u002fref\u003e This illusion has come to be known as ''[[Terrell rotation]]'' or the ''Terrell\u2013Penrose effect''.\u003cref group=note\u003eEven though it has been many decades since Terrell and Penrose published their observations, popular writings continue to conflate measurement versus appearance. For example, Michio Kaku wrote in ''Einstein's Cosmos'' (W. W. Norton & Company, 2004. p. 65): \"...&nbsp;imagine that the speed of light is only 20 miles per hour. If a car were to go down the street, it might look compressed in the direction of motion, being squeezed like an accordion down to perhaps 1 inch in length.\"\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Another example where visual appearance is at odds with measurement comes from the observation of apparent [[superluminal motion]] in various [[radio galaxies]], [[BL Lac objects]], [[quasars]], and other astronomical objects that eject [[astrophysical jet|relativistic-speed jets]] of matter at narrow angles with respect to the viewer. An apparent optical illusion results giving the appearance of faster than light travel.\u003cref\u003e{{cite book|last1=Zensus|first1=J. Anton|last2=Pearson|first2=Timothy J.|title=Superluminal Radio Sources|date=1987|publisher=Cambridge University Press|location=Cambridge, New York|isbn=9780521345606|page=3|edition=1st}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Chase|first1=Scott I.|title=Apparent Superluminal Velocity of Galaxies|url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSpeedOfLight\u002fSuperluminal\u002fsuperluminal.html|website=The Original Usenet Physics FAQ|publisher=Department of Mathematics, University of California, Riverside|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Richmond|first1=Michael|title=\"Superluminal\" motions in astronomical sources|url=http:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe - WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e@@ -524,11 +524,11 @@\u003cbr\u003e Elastic scattering of charged elementary particles deviates from ideality due to the production of [[Bremsstrahlung]] radiation.\u003cref name=\"Nakel_1994\"\u003e{{cite journal |last1=Nakel |first1=Werner |title=The elementary process of bremsstrahlung |journal=Physics Reports |date=1994 |volume=243 |issue=6 |pages=317\u2013353 |doi=10.1016\u002f0370-1573(94)00068-9|bibcode=1994PhR...243..317N }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Halbert |first1=M.L. |editor1-last=Austin |editor1-first=S.M. |editor2-last=Crawley |editor2-first=G.M. |title=The Two-Body Force in Nuclei |date=1972 |publisher=Springer |location=Boston, MA. |chapter=Review of Experiments on Nucleon-Nucleon Bremsstrahlung}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Newtonian analysis ====\u003cbr\u003e-[[File:Elastic collision of moving particle with equal mass stationary particle.svg|thumb|Figure 6-2. Newtonian analysis of the elastic collision of a moving particle with an equal mass stationary particle]]\u003cbr\u003e+[[File:Elastic collision of moving particle with equal mass stationary particle.svg|thumb|Figure 6\u20132. Newtonian analysis of the elastic collision of a moving particle with an equal mass stationary particle]]\u003cbr\u003e Fig. 6-2 provides a demonstration of the result, familiar to billiard players, that if a stationary ball is struck elastically by another one of the same mass (assuming no sidespin, or \"English\"), then after collision, the diverging paths of the two balls  will subtend a right angle. (a) In the stationary frame, an incident sphere traveling at 2'''v''' strikes a stationary sphere. (b) In the center of momentum frame, the two spheres approach each other symmetrically at \u00b1'''v'''. After elastic collision, the two spheres rebound from each other with equal and opposite velocities \u00b1'''u'''. Energy conservation requires that {{abs|'''u'''}} = {{abs|'''v'''}}. (c) Reverting to the stationary frame, the rebound velocities are {{nowrap|'''v''' \u00b1 '''u'''}}. The dot product {{nowrap|1=('''v''' + '''u''') \u22c5 ('''v''' \u2212 '''u''') = '''v'''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 '''u'''\u003csup\u003e2\u003c\u002fsup\u003e = 0}}, indicating that the vectors are orthogonal.\u003cref name=\"Rindler0\"\u002f\u003e{{rp|26\u201327}}\u003cbr\u003e \u003cbr\u003e ==== Relativistic analysis ====\u003cbr\u003e-[[File:Relativistic elastic collision of equal mass particles.svg|thumb|Figure 6-3. Relativistic elastic collision between a moving particle incident upon an equal mass stationary particle]]\u003cbr\u003e+[[File:Relativistic elastic collision of equal mass particles.svg|thumb|Figure 6\u20133. Relativistic elastic collision between a moving particle incident upon an equal mass stationary particle]]\u003cbr\u003e Consider the elastic collision scenario in Fig.&nbsp;6-3 between a moving particle colliding with an equal mass stationary particle. Unlike the Newtonian case, the angle between the two particles after collision is less than 90\u00b0, is dependent on the angle of scattering, and becomes smaller and smaller as the velocity of the incident particle approaches the speed of light:\u003cbr\u003e \u003cbr\u003e The relativistic momentum and total relativistic energy of a particle are given by\u003cbr\u003e@@ -717,7 +717,7 @@\u003cbr\u003e \u003cbr\u003e The Dewan\u2013Beran\u2013Bell spaceship paradox ([[Bell's spaceship paradox]]) is a good example of a problem where intuitive reasoning unassisted by the geometric insight of the spacetime approach can lead to issues.\u003cbr\u003e \u003cbr\u003e-[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 7-4. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e+[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 7\u20134. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e In Fig.&nbsp;7-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string which is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e \u003cbr\u003e When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e@@ -765,7 +765,7 @@\u003cbr\u003e \u003cbr\u003e The Lorentz transformation of the [[electric field]] of a moving charge into a non-moving observer's reference frame results in the appearance of a mathematical term commonly called the [[magnetic field]]. Conversely, the ''magnetic'' field generated by a moving charge disappears and becomes a purely ''electrostatic'' field in a comoving frame of reference. [[Maxwell's equations]] are thus simply an empirical fit to special relativistic effects in a classical model of the Universe. As electric and magnetic fields are reference frame dependent and thus intertwined, one speaks of ''electromagnetic'' fields. Special relativity provides the transformation rules for how an electromagnetic field in one inertial frame appears in another inertial frame.\u003cbr\u003e \u003cbr\u003e-[[Maxwell's equations]] in the 3D form are already consistent with the physical content of special relativity, although they are easier to manipulate in a [[manifestly covariant]] form, that is, in the language of [[tensor]] calculus.\u003cref name=Post_1962\u003e{{cite book|title=Formal Structure of Electromagnetics: General Covariance and Electromagnetics|date=1962|publisher=Dover Publications Inc.|isbn=978-0-486-65427-0|author=E. J. Post}}\u003c\u002fref\u003e\u003cbr\u003e+[[Maxwell's equations]] in the 3D form are already consistent with the physical content of special relativity, although they are easier to manipulate in a [[manifestly covariant]] form, that is, in the language of [[tensor]] calculus.\u003cref name=Post_1962\u00
