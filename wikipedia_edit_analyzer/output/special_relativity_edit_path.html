3cref name=\"electro\" group=\"p\"\u002f\u003e\u003cbr\u003e : \u003cmath\u003e \\frac{f'}{f} = \\frac{1 - (v\u002fc) \\cos{\\phi}}{\\sqrt{1 - v^2\u002fc^2}}    \u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-Fig. 6-1 (bottom). Consider an arbitrary body that is stationary in reference frame ''S''. Let this body emit a pair of equal-energy light-pulses in opposite directions at angle \u003cmath\u003e\\phi\u003c\u002fmath\u003e with respect to the x-axis. Each pulse has energy \u003cmath\u003eL\u002f2\u003c\u002fmath\u003e. Because of conservation of momentum, the body remains stationary in ''S'' after emission of the two pulses. Let \u003cmath\u003eE_0\u003c\u002fmath\u003e be the energy of the body before emission of the two pulses and \u003cmath\u003eE_1\u003c\u002fmath\u003e after their emission.\u003cbr\u003e+Fig. 6-1 (bottom). Consider an arbitrary body that is stationary in reference frame ''S''. Let this body emit a pair of equal-energy light-pulses in opposite directions at angle \u003cmath\u003e\\phi\u003c\u002fmath\u003e with respect to the x-axis. Each pulse has energy {{tmath|1= L\u002f2 }}. Because of conservation of momentum, the body remains stationary in ''S'' after emission of the two pulses. Let \u003cmath\u003eE_0\u003c\u002fmath\u003e be the energy of the body before emission of the two pulses and \u003cmath\u003eE_1\u003c\u002fmath\u003e after their emission.\u003cbr\u003e \u003cbr\u003e Next, consider the same system observed from frame {{prime|''S''}} that is moving along the x-axis at speed \u003cmath\u003ev\u003c\u002fmath\u003e relative to frame ''S''. In this frame, light from the forwards and reverse pulses will be relativistically Doppler-shifted. Let \u003cmath\u003eH_0\u003c\u002fmath\u003e be the energy of the body measured in reference frame {{prime|''S''}} before emission of the two pulses and \u003cmath\u003eH_1\u003c\u002fmath\u003e after their emission. We obtain the following relationships:\u003cref name=inertia group=p\u002f\u003e\u003cbr\u003e : \u003cmath\u003e\\begin{align}\u003cbr\u003e@@ -516,7 +515,7 @@\u003cbr\u003e \u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===  Elastic collisions  ===\u003cbr\u003e+=== Elastic collisions ===\u003cbr\u003e Examination of the collision products generated by particle accelerators around the world provides scientists evidence of the structure of the subatomic world and the natural laws governing it. Analysis of the collision products, the sum of whose masses may vastly exceed the masses of the incident particles, requires special relativity.\u003cref name=\"Idema_2022\"\u003e{{cite web |last1=Idema |first1=Timon |title=Mechanics and Relativity. Chapter 14: Relativistic Collisions |url=https:\u002f\u002fphys.libretexts.org\u002fBookshelves\u002fUniversity_Physics\u002fBook%3A_Mechanics_and_Relativity_(Idema)\u002f14%3A_Relativistic_Collisions |website=LibreTexts Physics |date=17 April 2019 |publisher=California State University Affordable Learning Solutions Program |access-date=2 January 2023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In Newtonian mechanics, analysis of collisions involves use of the [[conservation of mass|conservation laws for mass]], [[conservation of momentum|momentum]] and [[conservation of energy|energy]]. In relativistic mechanics, mass is not independently conserved, because it has been subsumed into the total relativistic energy. We illustrate the differences that arise between the Newtonian and relativistic treatments of particle collisions by examining the simple case of two perfectly elastic colliding particles of equal mass. (''Inelastic'' collisions are discussed in [[Spacetime#Conservation laws]]. Radioactive decay may be considered a sort of time-reversed inelastic collision.\u003cref name=\"Idema_2022\"\u002f\u003e)\u003cbr\u003e@@ -540,7 +539,7 @@\u003cbr\u003e Likewise, the sum of the total relativistic energies of the incoming particle and the stationary particle (which initially has total energy mc\u003csup\u003e2\u003c\u002fsup\u003e) equals the sum of the total energies of the emergent particles:\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\gamma_1 m c^2 + m c^2 = \\gamma_2 m c^2 + \\gamma_3 m c^2 \u003c\u002fmath\u003e  |{{EquationRef|6-6}} }}\u003cbr\u003e \u003cbr\u003e-Breaking down ({{EquationNote|6-5}}) into its components, replacing \u003cmath\u003ev\u003c\u002fmath\u003e with the dimensionless \u003cmath\u003e\\beta\u003c\u002fmath\u003e, and factoring out common terms from ({{EquationNote|6-5}}) and ({{EquationNote|6-6}}) yields the following:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e+Breaking down ({{EquationNote|6-5}}) into its components, replacing \u003cmath\u003ev\u003c\u002fmath\u003e with the dimensionless {{tmath|1= \\beta }}, and factoring out common terms from ({{EquationNote|6-5}}) and ({{EquationNote|6-6}}) yields the following:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_1 \\gamma_1 = \\beta_2 \\gamma_2 \\cos{\\theta} +  \\beta_3 \\gamma_3 \\cos{\\phi} \u003c\u002fmath\u003e  |{{EquationRef|6-7}} }}\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_2 \\gamma_2 \\sin{\\theta} = \\beta_3 \\gamma_3 \\sin{\\phi} \u003c\u002fmath\u003e  |{{EquationRef|6-8}} }}\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\gamma_1 + 1 = \\gamma_2 + \\gamma_3 \u003c\u002fmath\u003e  |{{EquationRef|6-9}} }}\u003cbr\u003e@@ -549,7 +548,7 @@\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_2 = \\frac{\\beta_1 \\sin{\\phi}}{ \\{ \\beta_1^2 \\sin^2{\\phi} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-10}} }}\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_3 = \\frac{\\beta_1 \\sin{\\theta}}{ \\{ \\beta_1^2 \\sin^2{\\theta} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-11}} }}\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\cos{(\\phi + \\theta)} = \\frac{ (\\gamma_1 - 1) \\sin{\\theta} \\cos{\\theta} }{ \\{ (\\gamma_1 + 1)^2 \\sin^2 \\theta + 4 \\cos^2 \\theta  \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-12}} }}\u003cbr\u003e-For the symmetrical case in which \u003cmath\u003e \\phi = \\theta\u003c\u002fmath\u003e and \u003cmath\u003e \\beta_2 = \\beta_3,\u003c\u002fmath\u003e ({{EquationNote|6-12}}) takes on the simpler form:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e+For the symmetrical case in which \u003cmath\u003e \\phi = \\theta\u003c\u002fmath\u003e and {{tmath|1= \\beta_2 = \\beta_3 }}, ({{EquationNote|6-12}}) takes on the simpler form:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e {{NumBlk||\u003cmath\u003e\\quad\\quad \\cos{\\theta} = \\frac{\\beta_1}{ \\{ 2\u002f\\gamma_1 + 3 \\beta_1^2 - 2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-13}} }}\u003cbr\u003e \u003cbr\u003e == Beyond the basics ==\u003cbr\u003e@@ -567,7 +566,7 @@\u003cbr\u003e [[File:Sinh+cosh+tanh.svg|thumb|180px|Figure 7\u20132. Plot of the three basic [[Hyperbolic function]]s: hyperbolic sine ([[:File:Hyperbolic Sine.svg|sinh]]), hyperbolic cosine ([[:File:Hyperbolic Cosine.svg|cosh]]) and hyperbolic tangent ([[:File:Hyperbolic Tangent.svg|tanh]]). Sinh is red, cosh is blue and tanh is green.]]\u003cbr\u003e Lorentz transformations relate coordinates of events in one reference frame to those of another frame. Relativistic composition of velocities is used to add two velocities together. The formulas to perform the latter computations are nonlinear, making them more complex than the corresponding Galilean formulas.\u003cbr\u003e \u003cbr\u003e-This nonlinearity is an artifact of our choice of parameters.\u003cref name=\"Taylor_1992\" \u002f\u003e{{rp|47\u201359}} We have previously noted that in an {{nowrap|1=x\u2013ct}} spacetime diagram, the points at some constant spacetime interval from the origin form an invariant hyperbola. We have also noted that the coordinate systems of two spacetime reference frames in standard configuration are hyperbolically rotated with respect to each other.\u003cbr\u003e+This nonlinearity is an artifact of our choice of parameters.\u003cref name=\"Taylor_1992\" \u002f\u003e{{rp|47\u201359}} We have previously noted that in an {{nowrap|1=''x''\u2013''ct''}} spacetime diagram, the points at some constant spacetime interval from the origin form an invariant hyperbola. We have also noted that the coordinate systems of two spacetime reference frames in standard configuration are hyperbolically rotated with respect to each other.\u003cbr\u003e \u003cbr\u003e The natural functions for expressing these relationships are the [[Hyperbolic functions|hyperbolic analogs of the trigonometric functions]]. Fig.&nbsp;7-1a shows a [[unit circle]] with sin(''a'') and cos(''a''), the only difference between this diagram and the familiar unit circle of elementary trigonometry being that ''a'' is interpreted, not as the angle between the ray and the {{nowrap|1=''x''-axis}}, but as twice the area of the sector swept out by the ray from the {{nowrap|1=''x''-axis}}. Numerically, the angle and {{nowrap|1=2 \u00d7 area}} measures for the unit circle are identical. Fig.&nbsp;7-1b shows a [[unit hyperbola]] with sinh(''a'') and cosh(''a''), where ''a'' is likewise interpreted as twice the tinted area.\u003cref\u003e{{cite book|last1=Thomas|first1=George B.|last2=Weir|first2=Maurice D.|last3=Hass|first3=Joel|last4=Giordano|first4=Frank R.|title=Thomas' Calculus: Early Transcendentals|date=2008|publisher=Pearson Education, Inc.|location=Boston|isbn=978-0-321-49575-4|page=533|edition=Eleventh}}\u003c\u002fref\u003e Fig.&nbsp;7-2 presents plots of the sinh, cosh, and tanh functions.\u003cbr\u003e \u003cbr\u003e@@ -594,7 +593,7 @@\u003cbr\u003e \u003cbr\u003e The rapidity defined above is very useful in special relativity because many expressions take on a considerably simpler form when expressed in terms of it. For example, rapidity is simply additive in the collinear velocity-addition formula;\u003cref name=\"Taylor_1992\" \u002f\u003e{{rp|47\u201359}}\u003cbr\u003e : \u003cmath\u003e\\beta = \\frac{\\beta_1 + \\beta_2}{1 + \\beta_1 \\beta_2} = \u003c\u002fmath\u003e \u003cmath\u003e\\frac{\\tanh \\phi_1 + \\tanh \\phi_2}{1 + \\tanh \\phi_1 \\tanh \\phi_2} =\u003c\u002fmath\u003e \u003cmath\u003e\\tanh(\\phi_1 + \\phi_2),\u003c\u002fmath\u003e\u003cbr\u003e-or in other words, \u003cmath\u003e\\phi = \\phi_1 + \\phi_2.\u003c\u002fmath\u003e\u003cbr\u003e+or in other words, {{tmath|1= \\phi = \\phi_1 + \\phi_2 }}.\u003cbr\u003e \u003cbr\u003e The Lorentz transformations take a simple form when expressed in terms of rapidity. The ''&gamma;'' factor can be written as\u003cbr\u003e : \u003cmath\u003e\\gamma = \\frac{1}{\\sqrt{1 - \\beta^2}} = \\frac{1}{\\sqrt{1 - \\tanh^2 \\phi}}\u003c\u002fmath\u003e \u003cmath\u003e= \\cosh \\phi,\u003c\u002fmath\u003e\u003cbr\u003e@@ -665,13 +664,13 @@\u003cbr\u003e * '''Inner-product invariance:''' If ''A'' and ''B'' are {{nowrap|1=4-vectors}}, then their inner product (scalar product) is invariant, i.e. their inner product is independent of the frame in which it is calculated. Note how the calculation of inner product differs from the calculation of the inner product of a {{nowrap|1=3-vector}}. In the following, \u003cmath\u003e\\vec{A}\u003c\u002fmath\u003e and \u003cmath\u003e\\vec{B}\u003c\u002fmath\u003e are {{nowrap|1=3-vectors}}:\u003cbr\u003e *: \u003cmath\u003eA \\cdot B \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - A_1 B_1 - A_2 B_2 - A_3 B_3 \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - \\vec{A} \\cdot \\vec{B}\u003c\u002fmath\u003e\u003cbr\u003e : In addition to being invariant under Lorentz transformation, the above inner product is also invariant under rotation in {{nowrap|1=3-space}}.\u003cbr\u003e-: Two vectors are said to be ''orthogonal'' if \u003cmath\u003eA \\cdot B = 0.\u003c\u002fmath\u003e Unlike the case with {{nowrap|1=3-vectors,}} orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles with each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal with ''itself''.\u003cbr\u003e-* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which \u003cmath\u003eA \\cdot A = 0 ,\u003c\u002fmath\u003e while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector \u003cmath\u003eE^2 - p^2 c^2 .\u003c\u002fmath\u003e\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+: Two vectors are said to be ''orthogonal'' if {{tmath|1= A \\cdot B = 0 }}. Unlike the case with {{nowrap|1=3-vectors}}, orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles with each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal with ''itself''.\u003cbr\u003e+* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which {{tmath|1= A \\cdot A = 0 }}, while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector {{tmath|1= E^2 - p^2 c^2 }}.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== Examples of 4-vectors ====\u003cbr\u003e-* '''Displacement 4-vector:''' Otherwise known as the ''spacetime separation'', this is {{nowrap|1=(''&Delta;t, &Delta;x, &Delta;y, &Delta;z''),}} or for infinitesimal separations, {{nowrap|1=(''dt, dx, dy, dz'')}}.\u003cbr\u003e+* '''Displacement 4-vector:''' Otherwise known as the ''spacetime separation'', this is {{nowrap|1=(''&Delta;t, &Delta;x, &Delta;y, &Delta;z''),}} or for infinitesimal separations, {{nowrap|1=(''dt'', ''dx'', ''dy'', ''dz'')}}.\u003cbr\u003e *: \u003cmath\u003edS \\equiv (dt, dx, dy, dz)\u003c\u002fmath\u003e\u003cbr\u003e-* '''Velocity 4-vector:''' This results when the displacement {{nowrap|1=4-vector}} is divided by \u003cmath\u003ed \\tau\u003c\u002fmath\u003e, where \u003cmath\u003ed \\tau\u003c\u002fmath\u003e is the proper time between the two events that yield ''dt, dx, dy'', and ''dz''.\u003cbr\u003e+* '''Velocity 4-vector:''' This results when the displacement {{nowrap|1=4-vector}} is divided by \u003cmath\u003ed \\tau\u003c\u002fmath\u003e, where \u003cmath\u003ed \\tau\u003c\u002fmath\u003e is the proper time between the two events that yield ''dt'', ''dx'', ''dy'', and ''dz''.\u003cbr\u003e *: \u003cmath\u003eV \\equiv \\frac{dS}{d \\tau} = \\frac{(dt, dx, dy, dz)}{dt\u002f\\gamma} = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left(1, \\frac{dx}{dt}, \\frac{dy}{dt}, \\frac{dz}{dt} \\right) = \u003c\u002fmath\u003e \u003cmath\u003e(\\gamma, \\gamma \\vec{v} ) \u003c\u002fmath\u003e\u003cbr\u003e {{multiple image\u003cbr\u003e  | direction         = horizontal\u003cbr\u003e@@ -687,7 +686,7 @@\u003cbr\u003e : Since photons move on null lines, \u003cmath\u003ed \\tau = 0\u003c\u002fmath\u003e for a photon, and a {{nowrap|1=4-velocity}} cannot be defined. There is no frame in which a photon is at rest, and no MCRF can be established along a photon's path.\u003cbr\u003e * '''Energy\u2013momentum 4-vector:'''\u003cbr\u003e *: \u003cmath\u003eP \\equiv (E\u002fc, \\vec{p}) = (E\u002fc, p_x, p_y, p_z)\u003c\u002fmath\u003e\u003cbr\u003e-: As indicated before, there are varying treatments for the energy-momentum {{nowrap|1=4-vector}} so that one may also see it expressed as \u003cmath\u003e(E, \\vec{p})\u003c\u002fmath\u003e or \u003cmath\u003e(E, \\vec{p}c) .\u003c\u002fmath\u003e The first component is the total energy (including mass) of the particle (or system of particles) in a given frame, while the remaining components are its spatial momentum. The energy-momentum {{nowrap|1=4-vector}} is a conserved quantity.\u003cbr\u003e+: As indicated before, there are varying treatments for the energy-momentum {{nowrap|1=4-vector}} so that one may also see it expressed as \u003cmath\u003e(E, \\vec{p})\u003c\u002fmath\u003e or {{tmath|1= (E, \\vec{p}c) }}. The first component is the total energy (including mass) of the particle (or system of particles) in a given frame, while the remaining components are its spatial momentum. The energy-momentum {{nowrap|1=4-vector}} is a conserved quantity.\u003cbr\u003e * '''Acceleration 4-vector:''' This results from taking the derivative of the velocity {{nowrap|1=4-vector}} with respect to \u003cmath\u003e\\tau .\u003c\u002fmath\u003e\u003cbr\u003e *: \u003cmath\u003eA \\equiv \\frac{dV}{d \\tau} = \u003c\u002fmath\u003e \u003cmath\u003e\\frac{d}{d \\tau} (\\gamma, \\gamma \\vec{v}) = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left( \\frac{d \\gamma}{dt}, \\frac{d(\\gamma \\vec{v})}{dt} \\right)\u003c\u002fmath\u003e\u003cbr\u003e * '''Force 4-vector:''' This is the derivative of the momentum {{nowrap|1=4-vector}} with respect to \u003cmath\u003e\\tau .\u003c\u002fmath\u003e\u003cbr\u003e@@ -727,16 +726,16 @@\u003cbr\u003e The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e \u003cbr\u003e [[File:Bell spaceship paradox.svg|thumb|Figure 7\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e-A spacetime diagram (Fig.&nbsp;7-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity \u003cmath\u003eAB\u003c\u002fmath\u003e.\u003cbr\u003e-\u003cbr\u003e-The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;7-5, the acceleration is finished, the ships will remain at a constant offset in some frame \u003cmath\u003eS'.\u003c\u002fmath\u003e If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in \u003cmath\u003eS,\u003c\u002fmath\u003e the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e+A spacetime diagram (Fig.&nbsp;7-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity {{tmath|1= AB }}.\u003cbr\u003e+\u003cbr\u003e+The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;7-5, the acceleration is finished, the ships will remain at a constant offset in some frame {{tmath|1= S' }}. If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in {{tmath|1= S }}, the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e : \u003cmath\u003e\\begin{align}\u003cbr\u003e x'_{A}& = \\gamma\\left(x_{A}-vt\\right)\\\\\u003cbr\u003e x'_{B}& = \\gamma\\left(x_{A}+L-vt\\right)\\\\\u003cbr\u003e L'& = x'_{B}-x'_{A} =\\gamma L\u003cbr\u003e \\end{align}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e. As shown in Fig.&nbsp;7-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e+The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame {{tmath|1= S }}. As shown in Fig.&nbsp;7-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e \u003cbr\u003e {{anchor|Accelerated observer with horizon}}\u003cbr\u003e \u003cbr\u003e@@ -749,13 +748,13 @@\u003cbr\u003e Fig.&nbsp;7-6 details various features of the traveler's motions with more specificity. At any given moment, her space axis is formed by a line passing through the origin and her current position on the hyperbola, while her time axis is the tangent to the hyperbola at her position. The velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e approaches a limit of one as \u003cmath\u003ect\u003c\u002fmath\u003e increases. Likewise, \u003cmath\u003e\\gamma\u003c\u002fmath\u003e approaches infinity.\u003cbr\u003e \u003cbr\u003e The shape of the invariant hyperbola corresponds to a path of constant proper acceleration. This is demonstrable as follows:\u003cbr\u003e-# We remember that \u003cmath\u003e\\beta = ct\u002fx.\u003c\u002fmath\u003e\u003cbr\u003e-# Since \u003cmath\u003ec^2 t^2 - x^2 = s^2,\u003c\u002fmath\u003e we conclude that \u003cmath\u003e\\beta (ct) = ct\u002f \\sqrt{c^2 t^2 - s^2}.\u003c\u002fmath\u003e\u003cbr\u003e+# We remember that {{tmath|1= \\beta = ct\u002fx }}.\u003cbr\u003e+# Since {{tmath|1= c^2 t^2 - x^2 = s^2 }}, we conclude that {{tmath|1= \\beta (ct) = ct\u002f \\sqrt{c^2 t^2 - s^2} }}.\u003cbr\u003e # \u003cmath\u003e\\gamma = 1\u002f\\sqrt{1 - \\beta ^2} = \u003c\u002fmath\u003e \u003cmath\u003e\\sqrt{c^2 t^2 - s^2}\u002fs\u003c\u002fmath\u003e\u003cbr\u003e-# From the relativistic force law, \u003cmath\u003eF = dp\u002fdt = \u003c\u002fmath\u003e\u003cmath\u003edpc\u002fd(ct) = d(\\beta \\gamma m c^2)\u002fd(ct).\u003c\u002fmath\u003e\u003cbr\u003e-# Substituting \u003cmath\u003e\\beta(ct)\u003c\u002fmath\u003e from step 2 and the expression for \u003cmath\u003e\\gamma\u003c\u002fmath\u003e from step 3 yields \u003cmath\u003eF = mc^2 \u002f s ,\u003c\u002fmath\u003e which is a constant expression.\u003cref name=\"Bais\"\u003e{{cite book|last1=Bais|first1=Sander|title=Very Special Relativity: An Illustrated Guide|url=https:\u002f\u002farchive.org\u002fdetails\u002fveryspecialrelat0000bais|url-access=registration|date=2007|publisher=Harvard University Press|location=Cambridge, Massachusetts|isbn=978-0-674-02611-7}}\u003c\u002fref\u003e{{rp|110\u2013113}}\u003cbr\u003e-\u003cbr\u003e-Fig.&nbsp;7-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;c per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e+# From the relativistic force law, \u003cmath\u003eF = dp\u002fdt = \u003c\u002fmath\u003e{{tmath|1= dpc\u002fd(ct) = d(\\beta \\gamma m c^2)\u002fd(ct) }}.\u003cbr\u003e+# Substituting \u003cmath\u003e\\beta(ct)\u003c\u002fmath\u003e from step 2 and the expression for \u003cmath\u003e\\gamma\u003c\u002fmath\u003e from step 3 yields {{tmath|1= F = mc^2 \u002f s }}, which is a constant expression.\u003cref name=\"Bais\"\u003e{{cite book|last1=Bais|first1=Sander|title=Very Special Relativity: An Illustrated Guide|url=https:\u002f\u002farchive.org\u002fdetails\u002fveryspecialrelat0000bais|url-access=registration|date=2007|publisher=Harvard University Press|location=Cambridge, Massachusetts|isbn=978-0-674-02611-7}}\u003c\u002fref\u003e{{rp|110\u2013113}}\u003cbr\u003e+\u003cbr\u003e+Fig.&nbsp;7-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;''c'' per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e After 100 hours according to Terence's clock, Stella enters a dark region. She has traveled outside Terence's timelike future. On the other hand, Terence can continue to '''receive''' Stella's messages to him indefinitely. He just has to wait long enough. Spacetime has been divided into distinct regions separated by an ''apparent'' event horizon. So long as Stella continues to accelerate, she can never know what takes place behind this horizon.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e@@ -796,7 +795,7 @@\u003cbr\u003e \u003cbr\u003e Special relativity is mathematically self-consistent, and it is an organic part of all modern physical theories, most notably [[quantum field theory]], [[string theory]], and general relativity (in the limiting case of negligible gravitational fields).\u003cbr\u003e \u003cbr\u003e-Newtonian mechanics mathematically follows from special relativity at small velocities (compared to the speed of light) \u2013 thus Newtonian mechanics can be considered as a special relativity of slow moving bodies. See [[classical mechanics]] for a more detailed discussion.\u003cbr\u003e+Newtonian mechanics mathematically follows from special relativity at small velocities (compared to the speed of light) \u2013 thus Newtonian mechanics can be considered as a special relativity of slow moving bodies. See ''[[Classical mechanics]]'' for a more detailed discussion.\u003cbr\u003e \u003cbr\u003e Several experiments predating Einstein's 1905 paper are now interpreted as evidence for relativity. Of these it is known Einstein was aware of the Fizeau experiment before 1905,\u003cref\u003e{{cite journal|author=John D. Norton|date=2004|first1=John D.|journal=Archive for History of Exact Sciences|title= Einstein's Investigations of Galilean Covariant Electrodynamics prior to 1905|pages= 45\u2013105|volume=59|issue=1|url=http:\u002f\u002fphilsci-archive.pitt.edu\u002farchive\u002f00001743\u002f|doi=10.1007\u002fs00407-004-0085-6|bibcode=2004AHES...59...45N|s2cid=17459755}}\u003c\u002fref\u003e and historians have concluded that Einstein was at least aware of the Michelson\u2013Morley experiment as early as 1899 despite claims he made in his later years that it played no role in his development of the theory.\u003cref name=\"mM1905\"\u003e{{cite journal|author= Jeroen van Dongen|title=On the role of the Michelson\u2013Morley experiment: Einstein in Chicago|date= 2009|journal=Archive for History of Exact Sciences |volume=63 |issue=6|pages=655\u2013663 |arxiv=0908.1545|bibcode=2009arXiv0908.1545V|doi=10.1007\u002fs00407-009-0050-5|s2cid=119220040}}\u003c\u002fref\u003e\u003cbr\u003e * The [[Fizeau experiment]] (1851, repeated by Michelson and Morley in 1886) measured the speed of light in moving media, with results that are consistent with relativistic addition of colinear velocities.\u003cbr\u003e@@ -858,7 +857,7 @@\u003cbr\u003e [[File:Concentric Spheres.svg|thumb|Figure 10\u20133. Concentric spheres, illustrating in 3-space the null geodesics of a 4-dimensional cone in spacetime.]]\u003cbr\u003e As illustrated in Fig.&nbsp;10-3, the null geodesics can be visualized as a set of continuous concentric spheres with radii&nbsp;=&nbsp;''c&nbsp;dt''.\u003cbr\u003e \u003cbr\u003e-This null dual-cone represents the \"line of sight\" of a point in space. That is, when we look at the [[star]]s and say \"The light from that star which I am receiving is X years old\", we are looking down this line of sight: a null geodesic. We are looking at an event a distance \u003cmath display=\"inline\"\u003ed = \\sqrt{x_1^2 + x_2^2 + x_3^2} \u003c\u002fmath\u003e away and a time ''d\u002fc'' in the past. For this reason the null dual cone is also known as the \"light cone\". (The point in the lower left of the Fig.&nbsp;10-2 represents the star, the origin represents the observer, and the line represents the null geodesic \"line of sight\".)\u003cbr\u003e+This null dual-cone represents the \"line of sight\" of a point in space. That is, when we look at the [[star]]s and say \"The light from that star which I am receiving is X years old\", we are looking down this line of sight: a null geodesic. We are looking at an event a distance \u003cmath display=\"inline\"\u003ed = \\sqrt{x_1^2 + x_2^2 + x_3^2} \u003c\u002fmath\u003e away and a time ''d''\u002f''c'' in the past. For this reason the null dual cone is also known as the \"light cone\". (The point in the lower left of the Fig.&nbsp;10-2 represents the star, the origin represents the observer, and the line represents the null geodesic \"line of sight\".)\u003cbr\u003e \u003cbr\u003e The cone in the \u2212''t'' region is the information that the point is \"receiving\", while the cone in the +''t'' section is the information that the point is \"sending\".\u003cbr\u003e \u003cbr\u003e@@ -871,7 +870,6 @@\u003cbr\u003e Above, the Lorentz transformation for the time coordinate and three space coordinates illustrates that they are intertwined. This is true more generally: certain pairs of \"timelike\" and \"spacelike\" quantities naturally combine on equal footing under the same Lorentz transformation.\u003cbr\u003e \u003cbr\u003e The Lorentz transformation in standard configuration above, that is, for a boost in the ''x''-direction, can be recast into matrix form as follows:\u003cbr\u003e-\u003cbr\u003e \u003cmath display=\"block\"\u003e\\begin{pmatrix}\u003cbr\u003e ct'\\\\ x'\\\\ y'\\\\ z'\u003cbr\u003e \\end{pmatrix} = \\begin{pmatrix}\u003cbr\u003e@@ -900,7 +898,7 @@\u003cbr\u003e More generally, all contravariant components of a [[four-vector]] \u003cmath\u003eT^\\nu\u003c\u002fmath\u003e transform from one frame to another frame by a [[Lorentz transformation]]:\u003cbr\u003e \u003cmath display=\"block\"\u003eT^{\\mu'} = \\Lambda^{\\mu'}{}_{\\nu} T^\\nu\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-Examples of other 4-vectors include the [[four-velocity]] \u003cmath\u003eU^\\mu,\u003c\u002fmath\u003e defined as the derivative of the position 4-vector with respect to [[proper time]]:\u003cbr\u003e+Examples of other 4-vectors include the [[four-velocity]] {{tmath|1= U^\\mu }}, defined as the derivative of the position 4-vector with respect to [[proper time]]:\u003cbr\u003e \u003cmath display=\"block\"\u003eU^\\mu = \\frac{dX^\\mu}{d\\tau} = \\gamma(v)( c , v_x , v_y, v_z ) = \\gamma(v) (c, \\mathbf{v} ). \u003c\u002fmath\u003e\u003cbr\u003e where the Lorentz factor is:\u003cbr\u003e \u003cmath display=\"block\"\u003e\\gamma(v)= \\frac{1}{\\sqrt{1 - v^2\u002fc^2 }} \\qquad v^2 = v_x^2 + v_y^2 + v_z^2.\u003c\u002fmath\u003e\u003cbr\u003e@@ -939,13 +937,13 @@\u003cbr\u003e \u003cbr\u003e More generally, the ''co''variant components of a 4-vector transform according to the ''inverse'' Lorentz transformation:\u003cbr\u003e \u003cmath display=\"block\"\u003e T_{\\mu'} = \\Lambda_{\\mu'}{}^{\\nu} T_\\nu,\u003c\u002fmath\u003e\u003cbr\u003e-where \u003cmath\u003e\\Lambda_{\\mu'}{}^{\\nu}\u003c\u002fmath\u003e is the reciprocal matrix of \u003cmath\u003e\\Lambda^{\\mu'}{}_{\\nu}\u003c\u002fmath\u003e.\u003cbr\u003e+where \u003cmath\u003e\\Lambda_{\\mu'}{}^{\\nu}\u003c\u002fmath\u003e is the reciprocal matrix of {{tmath|1= \\Lambda^{\\mu'}{}_{\\nu} }}.\u003cbr\u003e \u003cbr\u003e The postulates of special relativity constrain the exact form the Lorentz transformation matrices take.\u003cbr\u003e \u003cbr\u003e More generally, most physical quantities are best described as (components of) [[tensor]]s. So to transform from one frame to another, we use the well-known [[Tensor|tensor transformation law]]\u003cref\u003e{{cite book |title = Spacetime and Geometry: An Introduction to General Relativity |author=Sean M. Carroll |publisher=Addison Wesley |date=2004 |isbn=978-0-8053-8732-2 |page=22 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1SKFQgAACAAJ}}\u003c\u002fref\u003e\u003cbr\u003e \u003cmath display=\"block\"\u003eT^{\\alpha' \\beta' \\cdots \\zeta'}_{\\theta' \\iota' \\cdots \\kappa'} = \\Lambda^{\\alpha'}{}_{\\mu} \\Lambda^{\\beta'}{}_{\\nu} \\cdots \\Lambda^{\\zeta'}{}_{\\rho} \\Lambda_{\\theta'}{}^{\\sigma} \\Lambda_{\\iota'}{}^{\\upsilon} \\cdots \\Lambda_{\\kappa'}{}^{\\phi} T^{\\mu \\nu \\cdots \\rho}_{\\sigma \\upsilon \\cdots \\phi}\u003c\u002fmath\u003e\u003cbr\u003e-where \u003cmath\u003e\\Lambda_{\\chi'}{}^{\\psi}\u003c\u002fmath\u003e is the reciprocal matrix of \u003cmath\u003e\\Lambda^{\\chi'}{}_{\\psi}\u003c\u002fmath\u003e. All tensors transform by this rule.\u003cbr\u003e+where \u003cmath\u003e\\Lambda_{\\chi'}{}^{\\psi}\u003c\u002fmath\u003e is the reciprocal matrix of {{tmath|1= \\Lambda^{\\chi'}{}_{\\psi} }}. All tensors transform by this rule.\u003cbr\u003e \u003cbr\u003e An example of a four-dimensional second order [[antisymmetric tensor]] is the [[relativistic angular momentum]], which has six components: three are the classical [[angular momentum]], and the other three are related to the boost of the center of mass of the system. The derivative of the relativistic angular momentum with respect to proper time is the relativistic torque, also second order [[antisymmetric tensor]].\u003cbr\u003e \u003cbr\u003e@@ -960,7 +958,7 @@\u003cbr\u003e 0 & 0 & 1 & 0\\\\\u003cbr\u003e 0 & 0 & 0 & 1\u003cbr\u003e \\end{pmatrix}\u003c\u002fmath\u003e\u003cbr\u003e-which is equal to its reciprocal, \u003cmath\u003e\\eta^{\\alpha\\beta}\u003c\u002fmath\u003e, in those frames. Throughout we use the signs as above, different authors use different conventions \u2013 see [[Minkowski metric]] alternative signs.\u003cbr\u003e+which is equal to its reciprocal, {{tmath|1= \\eta^{\\alpha\\beta} }}, in those frames. Throughout we use the signs as above, different authors use different conventions \u2013 see [[Minkowski metric]] alternative signs.\u003cbr\u003e \u003cbr\u003e The [[Poincar\u00e9 group]] is the most general group of transformations which preserves the Minkowski metric:\u003cbr\u003e \u003cmath display=\"block\"\u003e\\eta_{\\alpha\\beta} = \\eta_{\\mu'\\nu'} \\Lambda^{\\mu'}{}_\\alpha \\Lambda^{\\nu'}{}_\\beta\u003c\u002fmath\u003e\u003cbr\u003e@@ -1079,7 +1077,7 @@\u003cbr\u003e * Post, E.J., 1997 (1962) ''Formal Structure of Electromagnetics: General Covariance and Electromagnetics''. Dover Publications.\u003cbr\u003e * [[Wolfgang Rindler]] (1991). ''Introduction to Special Relativity'' (2nd ed.), Oxford University Press. {{isbn|978-0-19-853952-0}}; {{isbn|0-19-853952-5}}\u003cbr\u003e * Harvey R. Brown (2005). Physical relativity: space\u2013time structure from a dynamical perspective, Oxford University Press, {{isbn|0-19-927583-1}}; {{isbn|978-0-19-927583-0}}\u003cbr\u003e-* {{Cite book| last =Qadir | first =Asghar | author-link =Asghar Qadir | title =Relativity: An Introduction to the Special Theory | publisher =[[World Scientific|World Scientific Publications]] | date = 1989| location =Singapore | page =128 | url = https:\u002f\u002fbooks.google.com\u002fbooks?id=X5YofYrqFoAC| isbn =978-9971-5-0612-4 | bibcode =1989rist.book.....Q }}\u003cbr\u003e+* {{cite book| last =Qadir | first =Asghar | author-link =Asghar Qadir | title =Relativity: An Introduction to the Special Theory | publisher =[[World Scientific|World Scientific Publications]] | date = 1989| location =Singapore | page =128 | url = https:\u002f\u002fbooks.google.com\u002fbooks?id=X5YofYrqFoAC| isbn =978-9971-5-0612-4 | bibcode =1989rist.book.....Q }}\u003cbr\u003e * {{cite book | last=French |first= A. P. | title=Special Relativity (M.I.T. Introductory Physics)|edition= 1st | publisher=W. W. Norton & Company | year=1968 | isbn=978-0393097931}}\u003cbr\u003e * Silberstein, Ludwik (1914). ''The Theory of Relativity''.\u003cbr\u003e * {{cite book |title=Space, Time and Spacetime |author=Lawrence Sklar |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=cPLXqV3QwuMC&pg=PA206 |isbn=978-0-520-03174-6 |publisher=University of California Press |date=1977 }}\u003cbr\u003e@@ -1089,9 +1087,9 @@\u003cbr\u003e * Tipler, Paul, and Llewellyn, Ralph (2002). ''Modern Physics'' (4th ed.). W. H. Freeman & Co. {{isbn|0-7167-4345-0}}.\u003cbr\u003e \u003cbr\u003e === Journal articles ===\u003cbr\u003e-* {{Cite journal | author1 = Alvager, T. | author2 = Farley, F. J. M. | date = 1964 | author3 = Kjellman, J. | author4 = Wallin, L. | title = Test of the Second Postulate of Special Relativity in the GeV region | journal = Physics Letters | volume = 12 | issue = 3| pages = 260\u2013262 | doi = 10.1016\u002f0031-9163(64)91095-9 | bibcode = 1964PhL....12..260A |display-authors=etal}}\u003cbr\u003e-* {{Cite journal | doi = 10.1086\u002f430652 | last1 = Darrigol | first1 = }\u003c\u002fmath\u003e\u003cbr\u003e : In addition to being invariant under Lorentz transformation, the above inner product is also invariant under rotation in {{nowrap|1=3-space}}.\u003cbr\u003e : Two vectors are said to be ''orthogonal'' if \u003cmath\u003eA \\cdot B = 0.\u003c\u002fmath\u003e Unlike the case with {{nowrap|1=3-vectors,}} orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles with each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal with ''itself''.","Predicted Edit 1 (from step 90)","Predicted Edit 2 (from step 90)","Predicted Edit 3 (from step 90)","Predicted Edit 4 (from step 90)","Predicted Edit 5 (from step 90)","Predicted Edit 6 (from step 90)","Predicted Edit 7 (from step 90)","Predicted Edit 8 (from step 90)","Predicted Edit 9 (from step 90)","Predicted Edit 10 (from step 90)"],"line":{"dash":"dash","width":2.5},"marker":{"size":9,"symbol":"cross"},"mode":"lines+markers","name":"Predicted Edit Path (Tail)","x":{"dtype":"f4","bdata":"uSoiv0qyKL\u002f9bAK\u002f2lUVvy\u002fuC79AmQS\u002fPKQwvy22K79lq02\u002fl3sev3vHOL8="},"y":{"dtype":"f4","bdata":"szSQQHxalUCu751AzRqdQHjTpUBOOapAJC2vQDgNsUCc+LZAhQ62QPZ5s0A="},"type":"scattergl"},{"hoverinfo":"skip","marker":{"color":"black","size":12,"symbol":"star"},"mode":"markers","name":"Start","x":[20.422380447387695],"y":[-14.149356842041016],"type":"scattergl"},{"hoverinfo":"skip","marker":{"color":"red","size":14,"symbol":"diamond"},"mode":"markers","name":"Prediction Start \u002f Fork Point","x":[-0.6334643959999084],"y":[4.506433010101318],"type":"scattergl"},{"hoverinfo":"skip","marker":{"size":12,"symbol":"circle"},"mode":"markers","name":"End of Actual","x":[20.72681427001953],"y":[-13.844097137451172],"type":"scattergl"},{"hoverinfo":"skip","marker":{"size":12,"symbol":"cross"},"mode":"ma
