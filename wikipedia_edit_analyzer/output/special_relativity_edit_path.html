e === 4\u2011vectors ===\u003cbr\u003e@@ -642,52 +647,52 @@\u003cbr\u003e   A_1' &= \\gamma \\left( A_1 - (v\u002fc) A_0 \\right)\\\\\u003cbr\u003e   A_2' &= A_2 \\\\ \u003cbr\u003e   A_3' &= A_3\u003cbr\u003e-\\end{align} ,\u003c\u002fmath\u003e\u003cbr\u003e+\\end{align}\u003c\u002fmath\u003e\u003cbr\u003e which comes from simply replacing ''ct'' with ''A''\u003csub\u003e0\u003c\u002fsub\u003e and ''x'' with ''A''\u003csub\u003e1\u003c\u002fsub\u003e in the earlier presentation of the [[#Lorentz transformations|'''Lorentz transformation.''']]\u003cbr\u003e \u003cbr\u003e-As usual, when we write ''x'', ''t'', etc. we generally mean \u0394''x'', \u0394''t'' etc.\u003cbr\u003e-\u003cbr\u003e-The last three components of a {{nowrap|1=4\u2013vector}} must be a standard vector in three-dimensional space. Therefore, a {{nowrap|1=4\u2013vector}} must transform like {{tmath|1=(c \\Delta t, \\Delta x, \\Delta y, \\Delta z)}} under Lorentz transformations as well as rotations.\u003cref name=\"Schutz1985\"\u003e{{cite book| last1=Schutz |first1= Bernard F. |title=A first course in general relativity|date=1985|publisher=Cambridge University Press|location=Cambridge, UK|isbn=0521277035|page=26}}\u003c\u002fref\u003e{{rp|36\u201359}}\u003cbr\u003e+As usual, when we write ''x'', ''t'', etc. we generally mean ''&Delta;x'', ''&Delta;t'' etc.\u003cbr\u003e+\u003cbr\u003e+The last three components of a {{nowrap|1=4\u2013vector}} must be a standard vector in three-dimensional space. Therefore, a {{nowrap|1=4\u2013vector}} must transform like {{tmath|1=(c \\Delta t, \\Delta x, \\Delta y, \\Delta z)}} under Lorentz transformations as well as rotations.\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== Properties of 4-vectors ====\u003cbr\u003e * '''Closure under linear combination:''' If ''A'' and ''B'' are {{nowrap|1=4-vectors}}, then {{tmath|1=C = aA + aB}} is also a {{nowrap|1=4-vector}}.\u003cbr\u003e * '''Inner-product invariance:''' If ''A'' and ''B'' are {{nowrap|1=4-vectors}}, then their inner product (scalar product) is invariant, i.e. their inner product is independent of the frame in which it is calculated. Note how the calculation of inner product differs from the calculation of the inner product of a {{nowrap|1=3-vector}}. In the following, \u003cmath\u003e\\vec{A}\u003c\u002fmath\u003e and \u003cmath\u003e\\vec{B}\u003c\u002fmath\u003e are {{nowrap|1=3-vectors}}:\u003cbr\u003e *: \u003cmath\u003eA \\cdot B \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - A_1 B_1 - A_2 B_2 - A_3 B_3 \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - \\vec{A} \\cdot \\vec{B}\u003c\u002fmath\u003e\u003cbr\u003e : In addition to being invariant under Lorentz transformation, the above inner product is also invariant under rotation in {{nowrap|1=3-space}}.\u003cbr\u003e-: Two vectors are said to be ''orthogonal'' if {{tmath|1= A \\cdot B = 0 }}. Unlike the case with {{nowrap|1=3-vectors}}, orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles to each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line, which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal to ''itself''.\u003cbr\u003e-* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which {{tmath|1= A \\cdot A = 0 }}, while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector {{tmath|1= E^2 - p^2 c^2 }}.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+: Two vectors are said to be ''orthogonal'' if \u003cmath\u003eA \\cdot B = 0.\u003c\u002fmath\u003e Unlike the case with {{nowrap|1=3-vectors,}} orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles with each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal with ''itself''.\u003cbr\u003e+* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which \u003cmath\u003eA \\cdot A = 0 ,\u003c\u002fmath\u003e while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector \u003cmath\u003eE^2 - p^2 c^2 .\u003c\u002fmath\u003e\u003cref name=\"Morin\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== Examples of 4-vectors ====\u003cbr\u003e-* '''Displacement 4-vector:''' Otherwise known as the ''spacetime separation'', this is {{nowrap|1=(''&Delta;t, &Delta;x, &Delta;y, &Delta;z''),}} or for infinitesimal separations, {{nowrap|1=(''dt'', ''dx'', ''dy'', ''dz'')}}.\u003cbr\u003e+* '''Displacement 4-vector:''' Otherwise known as the ''spacetime separation'', this is {{nowrap|1=(''&Delta;t, &Delta;x, &Delta;y, &Delta;z''),}} or for infinitesimal separations, {{nowrap|1=(''dt, dx, dy, dz'')}}.\u003cbr\u003e *: \u003cmath\u003edS \\equiv (dt, dx, dy, dz)\u003c\u002fmath\u003e\u003cbr\u003e-* '''Velocity 4-vector:''' This results when the displacement {{nowrap|1=4-vector}} is divided by \u003cmath\u003ed \\tau\u003c\u002fmath\u003e, where \u003cmath\u003ed \\tau\u003c\u002fmath\u003e is the proper time between the two events that yield ''dt'', ''dx'', ''dy'', and ''dz''.\u003cbr\u003e+* '''Velocity 4-vector:''' This results when the displacement {{nowrap|1=4-vector}} is divided by \u003cmath\u003ed \\tau\u003c\u002fmath\u003e, where \u003cmath\u003ed \\tau\u003c\u002fmath\u003e is the proper time between the two events that yield ''dt, dx, dy'', and ''dz''.\u003cbr\u003e *: \u003cmath\u003eV \\equiv \\frac{dS}{d \\tau} = \\frac{(dt, dx, dy, dz)}{dt\u002f\\gamma} = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left(1, \\frac{dx}{dt}, \\frac{dy}{dt}, \\frac{dz}{dt} \\right) = \u003c\u002fmath\u003e \u003cmath\u003e(\\gamma, \\gamma \\vec{v} ) \u003c\u002fmath\u003e\u003cbr\u003e {{multiple image\u003cbr\u003e  | direction         = horizontal\u003cbr\u003e  | width1            = 150\u003cbr\u003e  | image1            = Momentarily Comoving Reference Frame.gif\u003cbr\u003e- | caption1          = Figure 7-3a. The momentarily comoving reference frames of an accelerating particle as observed from a stationary frame.\u003cbr\u003e+ | caption1          = Figure 4-3a. The momentarily comoving reference frames of an accelerating particle as observed from a stationary frame.\u003cbr\u003e  | width2            = 150\u003cbr\u003e  | image2            = Lorentz transform of world line.gif\u003cbr\u003e- | caption2          = Figure 7-3b. The momentarily comoving reference frames along the trajectory of an accelerating observer (center).\u003cbr\u003e+ | caption2          = Figure 4-3b. The momentarily comoving reference frames along the trajectory of an accelerating observer (center).\u003cbr\u003e }}\u003cbr\u003e : The {{nowrap|1=4-velocity}} is tangent to the world line of a particle, and has a length equal to one unit of time in the frame of the particle.\u003cbr\u003e-: An accelerated particle does not have an inertial frame in which it is always at rest. However, an inertial frame can always be found that is momentarily comoving with the particle. This frame, the ''momentarily comoving reference frame'' (MCRF), enables application of special relativity to the analysis of accelerated particles.\u003cbr\u003e+: An accelerated particle does not have an inertial frame in which it is always at rest. However, an inertial frame can always be found which is momentarily comoving with the particle. This frame, the ''momentarily comoving reference frame'' (MCRF), enables application of special relativity to the analysis of accelerated particles.\u003cbr\u003e : Since photons move on null lines, \u003cmath\u003ed \\tau = 0\u003c\u002fmath\u003e for a photon, and a {{nowrap|1=4-velocity}} cannot be defined. There is no frame in which a photon is at rest, and no MCRF can be established along a photon's path.\u003cbr\u003e * '''Energy\u2013momentum 4-vector:'''\u003cbr\u003e *: \u003cmath\u003eP \\equiv (E\u002fc, \\vec{p}) = (E\u002fc, p_x, p_y, p_z)\u003c\u002fmath\u003e\u003cbr\u003e-: As indicated before, there are varying treatments for the energy\u2013momentum {{nowrap|1=4-vector}} so that one may also see it expressed as \u003cmath\u003e(E, \\vec{p})\u003c\u002fmath\u003e or {{tmath|1= (E, \\vec{p}c) }}. The first component is the total energy (including mass) of the particle (or system of particles) in a given frame, while the remaining components are its spatial momentum. The energy\u2013momentum {{nowrap|1=4-vector}} is a conserved quantity.\u003cbr\u003e-* '''Acceleration 4-vector:''' This results from taking the derivative of the velocity {{nowrap|1=4-vector}} with respect to {{tmath|1= \\tau }}.\u003cbr\u003e+: As indicated before, there are varying treatments for the energy-momentum {{nowrap|1=4-vector}} so that one may also see it expressed as \u003cmath\u003e(E, \\vec{p})\u003c\u002fmath\u003e or \u003cmath\u003e(E, \\vec{p}c) .\u003c\u002fmath\u003e The first component is the total energy (including mass) of the particle (or system of particles) in a given frame, while the remaining components are its spatial momentum. The energy-momentum {{nowrap|1=4-vector}} is a conserved quantity.\u003cbr\u003e+* '''Acceleration 4-vector:''' This results from taking the derivative of the velocity {{nowrap|1=4-vector}} with respect to \u003cmath\u003e\\tau .\u003c\u002fmath\u003e\u003cbr\u003e *: \u003cmath\u003eA \\equiv \\frac{dV}{d \\tau} = \u003c\u002fmath\u003e \u003cmath\u003e\\frac{d}{d \\tau} (\\gamma, \\gamma \\vec{v}) = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left( \\frac{d \\gamma}{dt}, \\frac{d(\\gamma \\vec{v})}{dt} \\right)\u003c\u002fmath\u003e\u003cbr\u003e * '''Force 4-vector:''' This is the derivative of the momentum {{nowrap|1=4-vector}} with respect to \u003cmath\u003e\\tau .\u003c\u002fmath\u003e\u003cbr\u003e *: \u003cmath\u003eF \\equiv \\frac{dP}{d \\tau} = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left(\\frac{dE}{dt}, \\frac{d \\vec{p}}{dt} \\right) = \u003c\u002fmath\u003e \u003cmath\u003e \\gamma \\left( \\frac{dE}{dt},\\vec{f} \\right) \u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-As expected, the final components of the above {{nowrap|1=4-vectors}} are all standard {{nowrap|1=3-vectors}} corresponding to spatial {{nowrap|1=3-momentum}}, {{nowrap|1=3-force}} etc.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+As expected, the final components of the above {{nowrap|1=4-vectors}} are all standard {{nowrap|1=3-vectors}} corresponding to spatial {{nowrap|1=3-momentum}}, {{nowrap|1=3-force}} etc.\u003cref name=\"Morin\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== 4-vectors and physical law ====\u003cbr\u003e The first postulate of special relativity declares the equivalency of all inertial frames. A physical law holding in one frame must apply in all frames, since otherwise it would be possible to differentiate between frames. Newtonian momenta fail to behave properly under Lorentzian transformation, and Einstein preferred to change the definition of momentum to one involving {{nowrap|1=4-vectors}} rather than give up on conservation of momentum.\u003cbr\u003e \u003cbr\u003e-Physical laws must be based on constructs that are frame independent. This means that physical laws may take the form of equations connecting scalars, which are always frame independent. However, equations involving {{nowrap|1=4-vectors}} require the use of tensors with appropriate rank, which themselves can be thought of as being built up from {{nowrap|1=4-vectors}}.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|186}}\u003cbr\u003e+Physical laws must be based on constructs that are frame independent. This means that physical laws may take the form of equations connecting scalars, which are always frame independent. However, equations involving {{nowrap|1=4-vectors}} require the use of tensors with appropriate rank, which themselves can be thought of as being built up from {{nowrap|1=4-vectors}}.\u003cref name=\"Morin\" \u002f\u003e{{rp|186}}\u003cbr\u003e {{anchor|Acceleration}}\u003cbr\u003e \u003cbr\u003e === Acceleration ===\u003cbr\u003e@@ -706,47 +711,53 @@\u003cbr\u003e \u003cbr\u003e The Dewan\u2013Beran\u2013Bell spaceship paradox ([[Bell's spaceship paradox]]) is a good example of a problem where intuitive reasoning unassisted by the geometric insight of the spacetime approach can lead to issues.\u003cbr\u003e \u003cbr\u003e-[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 7\u20134. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e-In Fig.&nbsp;7-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string that is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e-\u003cbr\u003e-When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+[[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 4-4. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e+In Fig.&nbsp;4-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string which is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e+\u003cbr\u003e+When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e # To observers in the rest frame, the spaceships start a distance ''L'' apart and remain the same distance apart during acceleration. During acceleration, ''L'' is a length contracted distance of the distance {{nowrap|1=''L{{'}} = &gamma;L''}} in the frame of the accelerating spaceships. After a sufficiently long time, ''&gamma;'' will increase to a sufficiently large factor that the string must break.\u003cbr\u003e-# Let ''A'' and ''B'' be the rear and front spaceships. In the frame of the spaceships, each spaceship sees the other spaceship doing the same thing that it is doing. ''A'' says that ''B'' has the same acceleration that he has, and ''B'' sees that ''A'' matches her every move. So the spaceships stay the same distance apart, and the string does not break.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e-\u003cbr\u003e-The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e-\u003cbr\u003e-[[File:Bell spaceship paradox.svg|thumb|Figure 7\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e-A spacetime diagram (Fig.&nbsp;7-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity {{tmath|1= AB }}.\u003cbr\u003e-\u003cbr\u003e-The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;7-5, the acceleration is finished, the ships will remain at a constant offset in some frame {{tmath|1= S' }}. If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in {{tmath|1= S }}, the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e+# Let ''A'' and ''B'' be the rear and front spaceships. In the frame of the spaceships, each spaceship sees the other spaceship doing the same thing that it is doing. ''A'' says that ''B'' has the same acceleration that he has, and ''B'' sees that ''A'' matches her every move. So the spaceships stay the same distance apart, and the string does not break.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+\u003cbr\u003e+The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+\u003cbr\u003e+[[File:Bell spaceship paradox.svg|thumb|Figure 4\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e+A spacetime diagram (Fig.&nbsp;4-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity \u003cmath\u003eAB\u003c\u002fmath\u003e.\u003cbr\u003e+\u003cbr\u003e+The length increase can be calculated with the help of the Lorentz transformation. If, as illustrated in Fig.&nbsp;4-5, the acceleration is finished, the ships will remain at a constant offset in some frame \u003cmath\u003eS'.\u003c\u002fmath\u003e If \u003cmath\u003ex_{A}\u003c\u002fmath\u003e and \u003cmath\u003ex_{B}=x_{A}+L\u003c\u002fmath\u003e are the ships' positions in \u003cmath\u003eS,\u003c\u002fmath\u003e the positions in frame \u003cmath\u003eS'\u003c\u002fmath\u003e are:\u003cref name=\"Franklin\"\u003e{{cite journal |author=Franklin, Jerrold |title=Lorentz contraction, Bell's spaceships, and rigid body motion in special relativity |journal=European Journal of Physics |volume=31 |year=2010 |pages=291\u2013298 |doi=10.1088\u002f0143-0807\u002f31\u002f2\u002f006 |bibcode = 2010EJPh...31..291F |issue=2 |arxiv = 0906.1919|s2cid=18059490 }}\u003c\u002fref\u003e\u003cbr\u003e : \u003cmath\u003e\\begin{align}\u003cbr\u003e x'_{A}& = \\gamma\\left(x_{A}-vt\\right)\\\\\u003cbr\u003e x'_{B}& = \\gamma\\left(x_{A}+L-vt\\right)\\\\\u003cbr\u003e L'& = x'_{B}-x'_{A} =\\gamma L\u003cbr\u003e \\end{align}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame {{tmath|1= S }}. As shown in Fig.&nbsp;7-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e+The \"paradox\", as it were, comes from the way that Bell constructed his example. In the usual discussion of Lorentz contraction, the rest length is fixed and the moving length shortens as measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e. As shown in Fig.&nbsp;4-5, Bell's example asserts the moving lengths \u003cmath\u003eAB\u003c\u002fmath\u003e and \u003cmath\u003eA'B'\u003c\u002fmath\u003e measured in frame \u003cmath\u003eS\u003c\u002fmath\u003e to be fixed, thereby forcing the rest frame length \u003cmath\u003eA'B''\u003c\u002fmath\u003e in frame \u003cmath\u003eS'\u003c\u002fmath\u003e to increase.\u003cbr\u003e \u003cbr\u003e {{anchor|Accelerated observer with horizon}}\u003cbr\u003e \u003cbr\u003e ==== Accelerated observer with horizon ====\u003cbr\u003e {{Main|Event horizon#Apparent horizon of an accelerated particle|Rindler coordinates}}\u003cbr\u003e \u003cbr\u003e-Certain special relativity problem setups can lead to insight about phenomena normally associated with general relativity, such as [[event horizons]]. In the text accompanying [[Spacetime#Invariant hyperbola|Section \"Invariant hyperbola\" of the article Spacetime]], the magenta hyperbolae represented actual paths that are tracked by a constantly accelerating traveler in spacetime. During periods of positive acceleration, the traveler's velocity just ''approaches'' the speed of light, while, measured in our frame, the traveler's acceleration constantly decreases.\u003cbr\u003e-\u003cbr\u003e-[[File:Accelerated relativistic observer with horizon.png|thumb|Figure 7\u20136. Accelerated relativistic observer with horizon. Another well-drawn illustration of the same topic may be viewed [[:File:ConstantAcceleration02.jpg|'''here''']]. ]]\u003cbr\u003e-Fig.&nbsp;7-6 details various features of the traveler's motions with more specificity. At any given moment, her space axis is formed by a line passing through the origin and her current position on the hyperbola, while her time axis is the tangent to the hyperbola at her position. The velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e approaches a limit of one as \u003cmath\u003ect\u003c\u002fmath\u003e increases. Likewise, \u003cmath\u003e\\gamma\u003c\u002fmath\u003e approaches infinity.\u003cbr\u003e+Certain special relativity problem setups can lead to insight about phenomena normally associated with general relativity, such as [[event horizons]]. In the text accompanying [[#Spacelike and Timelike Invariant Hyperbolas|'''Fig.&nbsp;2-7''']], the magenta hyperbolae represented actual paths that are tracked by a constantly accelerating traveler in spacetime. During periods of positive acceleration, the traveler's velocity just ''approaches'' the speed of light, while, measured in our frame, the traveler's acceleration constantly decreases.\u003cbr\u003e+\u003cbr\u003e+[[File:Accelerated relativistic observer with horizon.png|thumb|Figure 4\u20136. Accelerated relativistic observer with horizon. Another well-drawn illustration of the same topic may be viewed [[:File:ConstantAcceleration02.jpg|'''here''']]. ]]\u003cbr\u003e+Fig.&nbsp;4-6 details various features of the traveler's motions with more specificity. At any given moment, her space axis is formed by a line passing through the origin and her current position on the hyperbola, while her time axis is the tangent to the hyperbola at her position. The velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e approaches a limit of one as \u003cmath\u003ect\u003c\u002fmath\u003e increases. Likewise, \u003cmath\u003e\\gamma\u003c\u002fmath\u003e approaches infinity.\u003cbr\u003e \u003cbr\u003e The shape of the invariant hyperbola corresponds to a path of constant proper acceleration. This is demonstrable as follows:\u003cbr\u003e-# We remember that {{tmath|1= \\beta = ct\u002fx }}.\u003cbr\u003e-# Since {{tmath|1= c^2 t^2 - x^2 = s^2 }}, we conclude that {{tmath|1= \\beta (ct) = ct\u002f \\sqrt{c^2 t^2 - s^2} }}.\u003cbr\u003e+# We remember that \u003cmath\u003e\\beta = ct\u002fx.\u003c\u002fmath\u003e\u003cbr\u003e+# Since \u003cmath\u003ec^2 t^2 - x^2 = s^2,\u003c\u002fmath\u003e we conclude that \u003cmath\u003e\\beta (ct) = ct\u002f \\sqrt{c^2 t^2 - s^2}.\u003c\u002fmath\u003e\u003cbr\u003e # \u003cmath\u003e\\gamma = 1\u002f\\sqrt{1 - \\beta ^2} = \u003c\u002fmath\u003e \u003cmath\u003e\\sqrt{c^2 t^2 - s^2}\u002fs\u003c\u002fmath\u003e\u003cbr\u003e-# From the relativistic force law, \u003cmath\u003eF = dp\u002fdt = \u003c\u002fmath\u003e{{tmath|1= dpc\u002fd(ct) = d(\\beta \\gamma m c^2)\u002fd(ct) }}.\u003cbr\u003e-# Substituting \u003cmath\u003e\\beta(ct)\u003c\u002fmath\u003e from step 2 and the expression for \u003cmath\u003e\\gamma\u003c\u002fmath\u003e from step 3 yields {{tmath|1= F = mc^2 \u002f s }}, which is a constant expression.\u003cref name=\"Bais\"\u003e{{cite book|last1=Bais|first1=Sander|title=Very Special Relativity: An Illustrated Guide|url=https:\u002f\u002farchive.org\u002fdetails\u002fveryspecialrelat0000bais|url-access=registration|date=2007|publisher=Harvard University Press|location=Cambridge, Massachusetts|isbn=978-0-674-02611-7}}\u003c\u002fref\u003e{{rp|110\u2013113}}\u003cbr\u003e-\u003cbr\u003e-Fig.&nbsp;7-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;''c'' per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e+# From the relativistic force law, \u003cmath\u003eF = dp\u002fdt = \u003c\u002fmath\u003e\u003cmath\u003edpc\u002fd(ct) = d(\\beta \\gamma m c^2)\u002fd(ct).\u003c\u002fmath\u003e\u003cbr\u003e+# Substituting \u003cmath\u003e\\beta(ct)\u003c\u002fmath\u003e from step 2 and the expression for \u003cmath\u003e\\gamma\u003c\u002fmath\u003e from step 3 yields \u003cmath\u003eF = mc^2 \u002f s ,\u003c\u002fmath\u003e which is a constant expression.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e+\u003cbr\u003e+Fig.&nbsp;4-6 illustrates a specific calculated scenario. Terence (A) and Stella (B) initially stand together 100 light&nbsp;hours from the origin. Stella lifts off at time 0, her spacecraft accelerating at 0.01&nbsp;c per hour. Every twenty hours, Terence radios updates to Stella about the situation at home (solid green lines). Stella receives these regular transmissions, but the increasing distance (offset in part by time dilation) causes her to receive Terence's communications later and later as measured on her clock, and she ''never'' receives any communications from Terence after 100 hours on his clock (dashed green lines).\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e After 100 hours according to Terence's clock, Stella enters a dark region. She has traveled outside Terence's timelike future. On the other hand, Terence can continue to '''receive''' Stella's messages to him indefinitely. He just has to wait long enough. Spacetime has been divided into distinct regions separated by an ''apparent'' event horizon. So long as Stella continues to accelerate, she can never know what takes place behind this horizon.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e+\u003cbr\u003e+=== How far can you travel from the Earth? ===\u003cbr\u003e+{{See also|Space travel under constant acceleration}}\u003cbr\u003e+Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e+\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e+where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Relativity and unifying electromagnetism ==\u003cbr\u003e {{Main|Classical electromagnetism and special relativity|Covariant formulation of classical electromagnetism}}\u003cbr\u003e@@ -754,7 +765,7 @@\u003cbr\u003e \u003cbr\u003e The Lorentz transformation of the [[electric field]] of a moving charge into a non-moving observer's reference frame results in the appearance of a mathematical term commonly called the [[magnetic field]]. Conversely, the ''magnetic'' field generated by a moving charge disappears and becomes a purely ''electrostatic'' field in a comoving frame of reference. [[Maxwell's equations]] are thus simply an empirical fit to special relativistic effects in a classical model of the Universe. As electric and magnetic fields are reference frame dependent and thus intertwined, one speaks of ''electromagnetic'' fields. Special relativity provides the transformation rules for how an electromagnetic field in one inertial frame appears in another inertial frame.\u003cbr\u003e \u003cbr\u003e-[[Maxwell's equations]] in the 3D form are already consistent with the physical content of special relativity, although they are easier to manipulate in a [[manifestly covariant]] form, that is, in the language of [[tensor]] calculus.\u003cref name=Post_1962\u002f\u003e\u003cbr\u003e+[[Maxwell's equations]] in the 3D form are already consistent with the physical content of special relativity, although they are easier to manipulate in a [[manifestly covariant]] form, that is, in the language of [[tensor]] calculus.\u003cref name=Post_1962\u003e{{cite book|title=Formal Structure of Electromagnetics: General Covariance and Electromagnetics|date=1962|publisher=Dover Publications Inc.|isbn=978-0-486-65427-0|author=E. J. Post}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Theories of relativity and quantum mechanics ==\u003cbr\u003e ''Special'' relativity can be combined with [[quantum mechanics]] to form [[relativistic quantum mechanics]] and [[quantum electrodynamics]]. How [[general relativity|''general'' relativity]] and quantum mechanics can be unified is [[List of unsolved problems in physics|one of the unsolved problems in physics]]; [[quantum gravity]] and a \"[[theory of everything]]\", which require a unification including general relativity too, are active and ongoing areas in theoretical research.\u003cbr\u003e@@ -781,11 +792,11 @@\u003cbr\u003e \u003c\u002fref\u003e In a strong gravitational field, one must use [[general relativity]]. General relativity becomes special relativity at the limit of a weak field. At very small scales, such as at the [[Planck length]] and below, quantum effects must be taken into consideration resulting in [[quantum gravity]]. But at macroscopic scales and in the absence of strong gravitational fields, special relativity is experimentally tested to extremely high degree of accuracy (10\u003csup\u003e\u221220\u003c\u002fsup\u003e)\u003cref\u003eThe number of works is vast, see as example:\u003cbr \u002f\u003e\u003cbr\u003e {{cite journal|author1=Sidney Coleman |author2=Sheldon L. Glashow |title=Cosmic Ray and Neutrino Tests of Special Relativity|journal= Physics Letters B |volume=405 |date=1997|pages= 249\u2013252|arxiv=hep-ph\u002f9703240|doi=10.1016\u002fS0370-2693(97)00638-2|issue=3\u20134|bibcode = 1997PhLB..405..249C |s2cid=17286330 }}\u003cbr \u002f\u003e\u003cbr\u003e An overview can be found on [http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html this page]\u003c\u002fref\u003e\u003cbr\u003e-and thus accepted by the physics community. Experimental results that appear to contradict it are not reproducible and are thus widely believed to be due to experimental errors.\u003cref name=\"Roberts_2007\"\u003e{{cite web |last1=Roberts |first1=Tom |last2=Schleif |first2=Siegmar |title=Experiments that Apparently are NOT Consistent with SR\u002fGR |url=https:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fexperiments.html#Experiments_not_consistent_with_SR |website=What is the experimental basis of Special Relativity? |publisher=University of California at Riverside |access-date=10 July 2024}}\u003c\u002fref\u003e\u003cbr\u003e+and thus accepted by the physics community. Experimental results which appear to contradict it are not reproducible and are thus widely believed to be due to experimental errors.\u003cbr\u003e \u003cbr\u003e Special relativity is mathematically self-consistent, and it is an organic part of all modern physical theories, most notably [[quantum field theory]], [[string theory]], and general relativity (in the limiting case of negligible gravitational fields).\u003cbr\u003e \u003cbr\u003e-Newtonian mechanics mathematically follows from special relativity at small velocities (compared to the speed of light) \u2013 thus Newtonian mechanics can be considered as a special relativity of slow moving bodies. See ''[[Classical mechanics]]'' for a more detailed discussion.\u003cbr\u003e+Newtonian mechanics mathematically follows from special relativity at small velocities (compared to the speed of light) \u2013 thus Newtonian mechanics can be considered as a special relativity of slow moving bodies. See [[classical mechanics]] for a more detailed discussion.\u003cbr\u003e \u003cbr\u003e Several experiments predating Einstein's 1905 paper are now interpreted as evidence for relativity. Of these it is known Einstein was aware of the Fizeau experiment before 1905,\u003cref\u003e{{cite journal|author=John D. Norton|date=2004|first1=John D.|journal=Archive for History of Exact Sciences|title= Einstein's Investigations of Galilean Covariant Electrodynamics prior to 1905|pages= 45\u2013105|volume=59|issue=1|url=http:\u002f\u002fphilsci-archive.pitt.edu\u002farchive\u002f00001743\u002f|doi=10.1007\u002fs00407-004-0085-6|bibcode=2004AHES...59...45N|s2cid=17459755}}\u003c\u002fref\u003e and historians have concluded that Einstein was at least aware of the Michelson\u2013Morley experiment as early as 1899 despite claims he made in his later years that it played no role in his development of the theory.\u003cref name=\"mM1905\"\u003e{{cite journal|author= Jeroen van Dongen|title=On the role of the Michelson\u2013Morley experiment: Einstein in Chicago|date= 2009|journal=Archive for History of Exact Sciences |volume=63 |issue=6|pages=655\u2013663 |arxiv=0908.1545|bibcode=2009arXiv0908.1545V|doi=10.1007\u002fs00407-009-0050-5|s2cid=119220040}}\u003c\u002fref\u003e\u003cbr\u003e * The [[Fizeau experiment]] (1851, repeated by Michelson and Morley in 1886) measured the speed of light in moving media, with results that are consistent with relativistic addition of colinear velocities.\u003cbr\u003e@@ -847,7 +858,7 @@\u003cbr\u003e [[File:Concentric Spheres.svg|thumb|Figure 10\u20133. Concentric spheres, illustrating in 3-space the null geodesics of a 4-dimensional cone in spacetime.]]\u003cbr\u003e As illustrated in Fig.&nbsp;10-3, the null geodesics can be visualized as a set of continuous concentric spheres with radii&nbsp;=&nbsp;''c&nbsp;dt''.\u003cbr\u003e \u003cbr\u003e-This null dual-cone represents the \"line of sight\" of a point in space. That is, when we look at the [[star]]s and say \"The light from that star that I am receiving is ''X'' years old\", we are looking down this line of sight: a null geodesic. We are looking at an event a distance \u003cmath display=\"inline\"\u003ed = \\sqrt{x_1^2 + x_2^2 + x_3^2} \u003c\u002fmath\u003e away and a time ''d''\u002f''c'' in the past. For this reason the null dual cone is also known as the \"light cone\". (The point in the lower left of the Fig.&nbsp;10-2 represents the star, the origin represents the observer, and the line represents the null geodesic \"line of sight\".)\u003cbr\u003e+This null dual-cone represents the \"line of sight\" of a point in space. That is, when we look at the [[star]]s and say \"The light from that star which I am receiving is X years old\", we are looking down this line of sight: a null geodesic. We are looking at an event a distance \u003cmath display=\"inline\"\u003ed = \\sqrt{x_1^2 + x_2^2 + x_3^2} \u003c\u002fmath\u003e away and a time ''d\u002fc'' in the past. For this reason the null dual cone is also known as the \"light cone\". (The point in the lower left of the Fig.&nbsp;10-2 represents the star, the origin represents the observer, and the line represents the null geodesic \"line of sight\".)\u003cbr\u003e \u003cbr\u003e The cone in the \u2212''t'' region is the information that the point is \"receiving\", while the cone in the +''t'' section is the information that the point is \"sending\".\u003cbr\u003e \u003cbr\u003e@@ -860,6 +871,7 @@\u003cbr\u003e Above, the Lorentz transformation for the time coordinate and three space coordinates illustrates that they are intertwined. This is true more generally: certain pairs of \"timelike\" and \"spacelike\" quantities naturally combine on equal footing under the same Lorentz transformation.\u003cbr\u003e \u003cbr\u003e The Lorentz transformation in standard configuration above, that is, for a boost in the ''x''-direction, can be recast into matrix form as follows:\u003cbr\u003e+\u003cbr\u003e \u003cmath display=\"block\"\u003e\\begin{pmatrix}\u003cbr\u003e ct'\\\\ x'\\\\ y'\\\\ z'\u003cbr\u003e \\end{pmatrix} = \\begin{pmatrix}\u003cbr\u003e@@ -888,7 +900,7 @@\u003cbr\u003e More generally, all contravariant components of a [[four-vector]] \u003cmath\u003eT^\\nu\u003c\u002fmath\u003e transform from one frame to another frame by a [[Lorentz transformation]]:\u003cbr\u003e \u003cmath display=\"block\"\u003eT^{\\mu'} = \\Lambda^{\\mu'}{}_{\\nu} T^\\nu\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-Examples of other 4-vectors include the [[four-velocity]] {{tmath|1= U^\\mu }}, defined as the derivative of the position 4-vector with respect to [[proper time]]:\u003cbr\u003e+Examples of other 4-vectors include the [[four-velocity]] \u003cmath\u003eU^\\mu,\u003c\u002fmath\u003e defined as the derivative of the position 4-vector with respect to [[proper time]]:\u003cbr\u003e \u003cmath display=\"block\"\u003eU^\\mu = \\frac{dX^\\mu}{d\\tau} = \\gamma(v)( c , v_x , v_y, v_z ) = \\gamma(v) (c, \\mathbf{v} ). \u003c\u002fmath\u003e\u003cbr\u003e where the Lorentz factor is:\u003cbr\u003e \u003cmath display=\"block\"\u003e\\gamma(v)= \\frac{1}{\\sqrt{1 - v^2\u002fc^2 }} \\qquad v^2 = v_x^2 + v_y^2 + v_z^2.\u003c\u002fmath\u003e\u003cbr\u003e@@ -920,20 +932,20 @@\u003cbr\u003e +\\beta\\gamma & \\gamma & 0 & 0\\\\\u003cbr\u003e 0 & 0 & 1 & 0\\\\\u003cbr\u003e 0 & 0 & 0 & 1\u003cbr\u003e-\\end{pmatrix} ,\u003c\u002fmath\u003e\u003cbr\u003e+\\end{pmatrix}.\u003c\u002fmath\u003e\u003cbr\u003e which is the transpose of:\u003cbr\u003e \u003cmath display=\"block\"\u003e(\\partial_{\\mu'} \\phi) = \\Lambda_{\\mu'}{}^{\\nu} (\\partial_\\nu \\phi)\\qquad \\partial_{\\mu} \\equiv \\frac{\\partial}{\\partial x^{\\mu}}.\u003c\u002fmath\u003e\u003cbr\u003e-only in Cartesian coordinates. It is the [[covariant derivative]] that transforms in manifest covariance, in Cartesian coordinates this happens to reduce to the partial derivatives, but not in other coordinates.\u003cbr\u003e+only in Cartesian coordinates. It's the [[covariant derivative]] which transforms in manifest covariance, in Cartesian coordinates this happens to reduce to the partial derivatives, but not in other coordinates.\u003cbr\u003e \u003cbr\u003e More generally, the ''co''variant components of a 4-vector transform according to the ''inverse'' Lorentz transformation:\u003cbr\u003e \u003cmath display=\"block\"\u003e T_{\\mu'} = \\Lambda_{\\mu'}{}^{\\nu} T_\\nu,\u003c\u002fmath\u003e\u003cbr\u003e-where \u003cmath\u003e\\Lambda_{\\mu'}{}^{\\nu}\u003c\u002fmath\u003e is the reciprocal matrix of {{tmath|1= \\Lambda^{\\mu'}{}_{\\nu} }}.\u003cbr\u003e+where \u003cmath\u003e\\Lambda_{\\mu'}{}^{\\nu}\u003c\u002fmath\u003e is the reciprocal matrix of \u003cmath\u003e\\Lambda^{\\mu'}{}_{\\nu}\u003c\u002fmath\u003e.\u003cbr\u003e \u003cbr\u003e The postulates of special relativity constrain the exact form the Lorentz transformation matrices take.\u003cbr\u003e \u003cbr\u003e More generally, most physical quantities are best described as (components of) [[tensor]]s. So to transform from one frame to another, we use the well-known [[Tensor|tensor transformation law]]\u003cref\u003e{{cite book |title = Spacetime and Geometry: An Introduction to General Relativity |author=Sean M. Carroll |publisher=Addison Wesley |date=2004 |isbn=978-0-8053-8732-2 |page=22 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=1SKFQgAACAAJ}}\u003c\u002fref\u003e\u003cbr\u003e \u003cmath display=\"block\"\u003eT^{\\alpha' \\beta' \\cdots \\zeta'}_{\\theta' \\iota' \\cdots \\kappa'} = \\Lambda^{\\alpha'}{}_{\\mu} \\Lambda^{\\beta'}{}_{\\nu} \\cdots \\Lambda^{\\zeta'}{}_{\\rho} \\Lambda_{\\theta'}{}^{\\sigma} \\Lambda_{\\iota'}{}^{\\upsilon} \\cdots \\Lambda_{\\kappa'}{}^{\\phi} T^{\\mu \\nu \\cdots \\rho}_{\\sigma \\upsilon \\cdots \\phi}\u003c\u002fmath\u003e\u003cbr\u003e-where \u003cmath\u003e\\Lambda_{\\chi'}{}^{\\psi}\u003c\u002fmath\u003e is the reciprocal matrix of {{tmath|1= \\Lambda^{\\chi'}{}_{\\psi} }}. All tensors transform by this rule.\u003cbr\u003e+where \u003cmath\u003e\\Lambda_{\\chi'}{}^{\\psi}\u003c\u002fmath\u003e is the reciprocal matrix of \u003cmath\u003e\\Lambda^{\\chi'}{}_{\\psi}\u003c\u002fmath\u003e. All tensors transform by this rule.\u003cbr\u003e \u003cbr\u003e An example of a four-dimensional second order [[antisymmetric tensor]] is the [[relativistic angular momentum]], which has six components: three are the classical [[angular momentum]], and the other three are related to the boost of the center of mass of the system. The derivative of the relativistic angular momentum with respect to proper time is the relativistic torque, also second order [[antisymmetric tensor]].\u003cbr\u003e \u003cbr\u003e@@ -941,16 +953,16 @@\u003cbr\u003e \u003cbr\u003e ==== Metric ====\u003cbr\u003e \u003cbr\u003e-The [[metric tensor]] allows one to define the [[inner product]] of two vectors, which in turn allows one to assign a magnitude to the vector. Given the four-dimensional nature of spacetime the [[Minkowski metric]] ''\u03b7'' has components (valid with suitably chosen coordinates), which can be arranged in a {{nowrap|4 \u00d7 4}} matrix:\u003cbr\u003e+The [[metric tensor]] allows one to define the [[inner product]] of two vectors, which in turn allows one to assign a magnitude to the vector. Given the four-dimensional nature of spacetime the [[Minkowski metric]] ''\u03b7'' has components (valid with suitably chosen coordinates) which can be arranged in a {{nowrap|4 \u00d7 4}} matrix:\u003cbr\u003e \u003cmath display=\"block\"\u003e\\eta_{\\alpha\\beta} = \\begin{pmatrix}\u003cbr\u003e -1 & 0 & 0 & 0\\\\\u003cbr\u003e 0 & 1 & 0 & 0\\\\\u003cbr\u003e 0 & 0 & 1 & 0\\\\\u003cbr\u003e 0 & 0 & 0 & 1\u003cbr\u003e-\\end{pmatrix} ,\u003c\u002fmath\u003e\u003cbr\u003e-which is equal ts components.\u003cbr\u003e \u003cbr\u003e If a particle is not traveling at ''c'', one can transform the 3D force from the particle's co-moving reference frame into the observer's reference frame. This yields a 4-vector called the [[four-force]]. It is the rate of change of the above energy momentum [[four-vector]] with respect to proper time. The covariant version of the four-force is:\u003cbr\u003e \u003cmath display=\"block\"\u003eF_\\nu = \\frac{d P_{\\nu}}{d \\tau} = m A_\\nu \u003c\u002fmath\u003e\u003cbr\u003e@@ -1003,7 +1015,7 @@\u003cbr\u003e In a continuous medium, the 3D ''density of force'' combines with the ''density of power'' to form a covariant 4-vector. The spatial part is the result of dividing the force on a small cell (in 3-space) by the volume of that cell. The time component is \u22121\u002f''c'' times the power transferred to that cell divided by the volume of the cell. This will be used below in the section on electromagnetism.\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e-{{Portal|Science}}\u003cbr\u003e+\u003cbr\u003e ; People :\u003cbr\u003e * [[Max Planck]]\u003cbr\u003e * [[Hermann Minkowski]]\u003cbr\u003e@@ -1067,7 +1079,7 @@\u003cbr\u003e * Post, E.J., 1997 (1962) ''Formal Structure of Electromagnetics: General Covariance and Electromagnetics''. Dover Publications.\u003cbr\u003e * [[Wolfgang Rindler]] (1991). ''Introduction to Special Relativity'' (2nd ed.), Oxford University Press. {{isbn|978-0-19-853952-0}}; {{isbn|0-19-853952-5}}\u003cbr\u003e * Harvey R. Brown (2005). Physical relativity: space\u2013time structure from a dynamical perspective, Oxford University Press, {{isbn|0-19-927583-1}}; {{isbn|978-0-19-927583-0}}\u003cbr\u003e-* {{cite book| last =Qadir | first =Asghar | author-link =Asghar Qadir | title =Relativity: An Introduction to the Special Theory | publisher =[[World Scientific|World Scientific Publications]] | date = 1989| location =Singapore | page =128 | url = https:\u002f\u002fbooks.google.com\u002fbooks?id=X5YofYrqFoAC| isbn =978-9971-5-0612-4 | bibcode =1989rist.book.....Q }}\u003cbr\u003e+* {{Cite book| last =Qadir | first =Asghar | author-link =Asghar Qadir | title =Relativity: An Introduction to the Special Theory | publisher =[[World Scientific|World Scientific Publications]] | date = 1989| location =Singapore | page =128 | url = https:\u002f\u002fbooks.google.com\u002fbooks?id=X5YofYrqFoAC| isbn =978-9971-5-0612-4 | bibcode =1989rist.book.....Q }}\u003cbr\u003e * {{cite book | last=French |first= A. P. | title=Special Relativity (M.I.T. Introductory Physics)|edition= 1st | publisher=W. W. Norton & Company | year=1968 | isbn=978-0393097931}}\u003cbr\u003e * Silberstein, Ludwik (1914). ''The Theory of Relativity''.\u003cbr\u003e * {{cite book |title=Space, Time and Spacetime |author=Lawrence Sklar |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=cPLXqV3QwuMC&pg=PA206 |isbn=978-0-520-03174-6 |publisher=University of California Press |date=1977 }}\u003cbr\u003e@@ -1077,9 +1089,9 @@\u003cbr\u003e * Tipler, Paul, and Llewellyn, Ralph (2002). ''Modern Physics'' (4th ed.). W. H. Freeman & Co. {{isbn|0-7167-4345-0}}.\u003cbr\u003e \u003cbr\u003e === Journal articles ===\u003cbr\u003e-* {{cite journal | author1 = Alvager, T. | author2 = Farley, F. J. M. | date = 1964 | author3 = Kjellman, J. | author4 = Wallin, L. | title = Test of the Second Postulate of Special Relativity in the GeV region | journal = Physics Letters | volume = 12 | issue = 3| pages = 260\u2013262 | doi = 10.1016\u002f0031-9163(64)91095-9 | bibcode = 1964PhL....12..260A |display-authors=etal}}\u003cbr\u003e-* {{cite journal | doi = 10.1086\u002f430652 | last1 = Darrigol | first1 = Olivier | date = 2004 | title = The Mystery of the Poincar\u00e9\u2013Einstein Connection | journal = Isis | volume = 95 | issue = 4| pages = 614\u201326 | pmid = 16011297 | s2cid = 26997100 }}\u003cbr\u003e-* {{cite journal | doi = 10.1103\u002fPhysRevA.56.4405 | last1 = Wolf | first1 = Peter | last2 = Petit | first2 = Gerard | date = 1997 | title = Satellite test of Special Relativity using the Global Positioning System | journal = Physical Review A | volume = 56 | issue = 6| pages = 4405\u201309 |bibcode = 1997PhRvA..56.4405W }}\u003cbr\u003e+* {{Cite journal | author1 = Alvager, T. | author2 = Farley, F. J. M. | date = 1964 | author3 = Kjellman, J. | author4 = Wallin, L. | title = Test of the Second Postulate of Special Relativity in the GeV region | journal = Physics Letters | volume = 12 | issue = 3| pages = 260\u2013262 | doi = 10.1016\u002f0031-9163(64)91095-9 | bibcode = 1964PhL....12..260A |display-authors=etal}}\u003cbr\u003e+* {{Cite journal | doi = 10.1086\u002f430652 | last1 = Darrigol | first1 = Olivier | date = 2004 | title = The Mystery of the Poincar\u00e9\u2013Einstein Connection | journal = Isis | volume = 95 | issue = 4| pages = 614\u201326 | pmid = 16011297 | s2cid = 26997100 }}\u003cbr\u003e+* {{Cite journal | doi = 10.1103\u002fPhysRevA.56.4405 | last1 = Wolf | first1 = Peter | last2 = Petit | first2 = Gerard | date = 1997 | title = Satellite test of Special Relativity using the Global Positioning System | journal = Physical Review A | volume = 56 | issue = 6| pages = 4405\u201309 |bibcode = 1997PhRvA..56.4405W }}\u003cbr\u003e * [http:\u002f\u002fscholarpedia.org\u002farticle\u002fSpecial_relativity Special Relativity] [[Scholarpedia]]\u003cbr\u003e * {{cite journal | last1 = Rindler | first1 = Wolfgang | author-link = Wolfgang Rindler | year = 2011| title = Special relativity: Kinematics | journal = [[Scholarpedia]] | volume = 6 | issue = 2| page = 8520 | doi = 10.4249\u002fscholarpedia.8520 | bibcode = 2011SchpJ...6.8520R | doi-access = free }}\u003cbr\u003e ","--- Revision 50\u003cbr\u003e+++ Revision 51\u003cbr\u003e@@ -581,7 +581,7 @@\u003cbr\u003e y \\\\\u003cbr\u003e \\end{pmatrix}.\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-In a spacetime diagram, the velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e is the analog of slope. The ''rapidity'', ''&phi;'', is defined by\u003cref name=\"Morin\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e+In a spacetime diagram, the velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e is the analog of slope. The ''rapidity'', ''&phi;'', is defined by\u003cref name=\"Morin2007\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e : \u003cmath\u003e\\beta \\equiv \\tanh \\phi \\equiv \\frac{v}{c},\u003c\u002fmath\u003e\u003cbr\u003e where\u003cbr\u003e : \u003cmath\u003e\\tanh \\phi = \\frac{\\sinh \\phi}{\\cosh \\phi} = \\frac{e^\\phi-e^{-\\phi}}{e^\\phi+e^{-\\phi}}.\u003c\u002fmath\u003e\u003cbr\u003e@@ -627,7 +627,7 @@\u003cbr\u003e     x'\u003cbr\u003e   \\end{pmatrix}.\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-In other words, Lorentz boosts represent [[hyperbolic rotation]]s in Minkowski spacetime.\u003cref name=\"Morin\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e+In other words, Lorentz boosts represent [[hyperbolic rotation]]s in Minkowski spacetime.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e \u003cbr\u003e The advantages of using hyperbolic functions are such that some textbooks such as the classic ones by Taylor and Wheeler introduce their use at a very early stage.\u003cref name=\"Taylor\" \u002f\u003e\u003cref name=\"Taylor_1992\"\u003e{{cite book|url=https:\u002f\u002farchive.org\u002fdetails\u002fspacetime_physics\u002f|title=Spacetime Physics|last1=Taylor|first1=Edwin F.|last2=Wheeler|first2=John Archibald|date=1992|publisher=W. H. Freeman|isbn=0-7167-2327-1|edition=2nd}}\u003c\u002fref\u003e\u003cref group=note\u003eRapidity arises naturally as a coordinates on the pure [[Representation theory of the Lorentz group#Conventions and Lie algebra bases|boost generators]] inside the [[Lie algebra]] algebra of the Lorentz group. Likewise, rotation angles arise naturally as coordinates (modulo {{nowrap|2{{pi}}}}) on the pure [[Representation theory of the Lorentz group#Conventions and Lie algebra bases|rotation generators]] in the Lie algebra. (Together they coordinatize the whole Lie algebra.) A notable difference is that the resulting rotations are periodic in the rotation angle, while the resulting boosts are not periodic in rapidity (but rather one-to-one). The similarity between boosts and rotations is formal resemblance.\u003c\u002fref\u003e\u003cbr\u003e {{anchor|4\u2011vectors}}\u003cbr\u003e@@ -660,7 +660,7 @@\u003cbr\u003e *: \u003cmath\u003eA \\cdot B \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - A_1 B_1 - A_2 B_2 - A_3 B_3 \\equiv \u003c\u002fmath\u003e \u003cmath\u003eA_0 B_0 - \\vec{A} \\cdot \\vec{B}\u003c\u002fmath\u003e\u003cbr\u003e : In addition to being invariant under Lorentz transformation, the above inner product is also invariant under rotation in {{nowrap|1=3-space}}.\u003cbr\u003e : Two vectors are said to be ''orthogonal'' if \u003cmath\u003eA \\cdot B = 0.\u003c\u002fmath\u003e Unlike the case with {{nowrap|1=3-vectors,}} orthogonal {{nowrap|1=4-vectors}} are not necessarily at right angles with each other. The rule is that two {{nowrap|1=4-vectors}} are orthogonal if they are offset by equal and opposite angles from the 45\u00b0 line which is the world line of a light ray. This implies that a lightlike {{nowrap|1=4-vector}} is orthogonal with ''itself''.\u003cbr\u003e-* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which \u003cmath\u003eA \\cdot A = 0 ,\u003c\u002fmath\u003e while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector \u003cmath\u003eE^2 - p^2 c^2 .\u003c\u002fmath\u003e\u003cref name=\"Morin\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+* '''Invariance of the magnitude of a vector:''' The magnitude of a vector is the inner product of a {{nowrap|1=4-vector}} with itself, and is a frame-independent property. As with intervals, the magnitude may be positive, negative or zero, so that the vectors are referred to as timelike, spacelike or null (lightlike). Note that a null vector is not the same as a zero vector. A null vector is one for which \u003cmath\u003eA \\cdot A = 0 ,\u003c\u002fmath\u003e while a zero vector is one whose components are all zero. Special cases illustrating the invariance of the norm include the invariant interval \u003cmath\u003ec^2 t^2 - x^2\u003c\u002fmath\u003e and the invariant length of the relativistic momentum vector \u003cmath\u003eE^2 - p^2 c^2 .\u003c\u002fmath\u003e\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== Examples of 4-vectors ====\u003cbr\u003e * '''Displacement 4-vector:''' Otherwise known as the ''spacetime separation'', this is {{nowrap|1=(''&Delta;t, &Delta;x, &Delta;y, &Delta;z''),}} or for infinitesimal separations, {{nowrap|1=(''dt, dx, dy, dz'')}}.\u003cbr\u003e@@ -687,12 +687,12 @@\u003cbr\u003e * '''Force 4-vector:''' This is the derivative of the momentum {{nowrap|1=4-vector}} with respect to \u003cmath\u003e\\tau .\u003c\u002fmath\u003e\u003cbr\u003e *: \u003cmath\u003eF \\equiv \\frac{dP}{d \\tau} = \u003c\u002fmath\u003e \u003cmath\u003e\\gamma \\left(\\frac{dE}{dt}, \\frac{d \\vec{p}}{dt} \\right) = \u003c\u002fmath\u003e \u003cmath\u003e \\gamma \\left( \\frac{dE}{dt},\\vec{f} \\right) \u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-As expected, the final components of the above {{nowrap|1=4-vectors}} are all standard {{nowrap|1=3-vectors}} corresponding to spatial {{nowrap|1=3-momentum}}, {{nowrap|1=3-force}} etc.\u003cref name=\"Morin\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e+As expected, the final components of the above {{nowrap|1=4-vectors}} are all standard {{nowrap|1=3-vectors}} corresponding to spatial {{nowrap|1=3-momentum}}, {{nowrap|1=3-force}} etc.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|178\u2013181}}\u003cref name=\"Schutz1985\" \u002f\u003e{{rp|36\u201359}}\u003cbr\u003e \u003cbr\u003e ==== 4-vectors and physical law ====\u003cbr\u003e The first postulate of special relativity declares the equivalency of all inertial frames. A physical law holding in one frame must apply in all frames, since otherwise it would be possible to differentiate between frames. Newtonian momenta fail to behave properly under Lorentzian transformation, and Einstein preferred to change the definition of momentum to one involving {{nowrap|1=4-vectors}} rather than give up on conservation of momentum.\u003cbr\u003e \u003cbr\u003e-Physical laws must be based on constructs that are frame independent. This means that physical laws may take the form of equations connecting scalars, which are always frame independent. However, equations involving {{nowrap|1=4-vectors}} require the use of tensors with appropriate rank, which themselves can be thought of as being built up from {{nowrap|1=4-vectors}}.\u003cref name=\"Morin\" \u002f\u003e{{rp|186}}\u003cbr\u003e+Physical laws must be based on constructs that are frame independent. This means that physical laws may take the form of equations connecting scalars, which are always frame independent. However, equations involving {{nowrap|1=4-vectors}} require the use of tensors with appropriate rank, which themselves can be thought of as being built up from {{nowrap|1=4-vectors}}.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|186}}\u003cbr\u003e {{anchor|Acceleration}}\u003cbr\u003e \u003cbr\u003e === Acceleration ===\u003cbr\u003e@@ -714,11 +714,11 @@\u003cbr\u003e [[File:Bell's spaceship paradox - two spaceships - initial setup.png|thumb|Figure 4-4. Dewan\u2013Beran\u2013Bell spaceship paradox]]\u003cbr\u003e In Fig.&nbsp;4-4, two identical spaceships float in space and are at rest relative to each other. They are connected by a string which is capable of only a limited amount of stretching before breaking. At a given instant in our frame, the observer frame, both spaceships accelerate in the same direction along the line between them with the same constant proper acceleration.\u003cref group=note\u003eIn relativity theory, proper acceleration is the physical acceleration (i.e., measurable acceleration as by an accelerometer) experienced by an object. It is thus acceleration relative to a free-fall, or inertial, observer who is momentarily at rest relative to the object being measured.\u003c\u002fref\u003e Will the string break?\u003cbr\u003e \u003cbr\u003e-When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+When the paradox was new and relatively unknown, even professional physicists had difficulty working out the solution. Two lines of reasoning lead to opposite conclusions. Both arguments, which are presented below, are flawed even though one of them yields the correct answer.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e # To observers in the rest frame, the spaceships start a distance ''L'' apart and remain the same distance apart during acceleration. During acceleration, ''L'' is a length contracted distance of the distance {{nowrap|1=''L{{'}} = &gamma;L''}} in the frame of the accelerating spaceships. After a sufficiently long time, ''&gamma;'' will increase to a sufficiently large factor that the string must break.\u003cbr\u003e-# Let ''A'' and ''B'' be the rear and front spaceships. In the frame of the spaceships, each spaceship sees the other spaceship doing the same thing that it is doing. ''A'' says that ''B'' has the same acceleration that he has, and ''B'' sees that ''A'' matches her every move. So the spaceships stay the same distance apart, and the string does not break.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e-\u003cbr\u003e-The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+# Let ''A'' and ''B'' be the rear and front spaceships. In the frame of the spaceships, each spaceship sees the other spaceship doing the same thing that it is doing. ''A'' says that ''B'' has the same acceleration that he has, and ''B'' sees that ''A'' matches her every move. So the spaceships stay the same distance apart, and the string does not break.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e+\u003cbr\u003e+The problem with the first argument is that there is no \"frame of the spaceships.\" There cannot be, because the two spaceships measure a growing distance between the two. Because there is no common frame of the spaceships, the length of the string is ill-defined. Nevertheless, the conclusion is correct, and the argument is mostly right. The second argument, however, completely ignores the relativity of simultaneity.\u003cref name=\"Morin2007\" \u002f\u003e{{rp|106,120\u2013122}}\u003cbr\u003e \u003cbr\u003e [[File:Bell spaceship paradox.svg|thumb|Figure 4\u20135. The curved lines represent the world lines of two observers A and B who accelerate in the same direction with the same constant magnitude acceleration. At A' and B', the observers stop accelerating. The dashed lines are lines of simultaneity for either observer before acceleration begins and after acceleration stops.]]\u003cbr\u003e A spacetime diagram (Fig.&nbsp;4-5) makes the correct solution to this paradox almost immediately evident. Two observers in Minkowski spacetime accelerate with constant magnitude \u003cmath\u003ek\u003c\u002fmath\u003e acceleration for proper time \u003cmath\u003e\\sigma\u003c\u002fmath\u003e (acceleration and elapsed time measured by the observers themselves, not some inertial observer). They are comoving and inertial before and after this phase. In Minkowski geometry, the length along the line of simultaneity \u003cmath\u003eA'B''\u003c\u002fmath\u003e turns out to be greater than the length along the line of simultaneity \u003cmath\u003eAB\u003c\u002fmath\u003e.","--- Revision 51\u003cbr\u003e+++ Revision 52\u003cbr\u003e@@ -753,12 +753,6 @@\u003cbr\u003e \u003cbr\u003e After 100 hours according to Terence's clock, Stella enters a dark region. She has traveled outside Terence's timelike future. On the other hand, Terence can continue to '''receive''' Stella's messages to him indefinitely. He just has to wait long enough. Spacetime has been divided into distinct regions separated by an ''apparent'' event horizon. So long as Stella continues to accelerate, she can never know what takes place behind this horizon.\u003cref name=\"Bais\" \u002f\u003e{{rp|110\u2013113}}\u003cbr\u003e \u003cbr\u003e-=== How far can you travel from the Earth? ===\u003cbr\u003e-{{See also|Space travel under constant acceleration}}\u003cbr\u003e-Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e-\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e-where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e == Relativity and unifying electromagnetism ==\u003cbr\u003e {{Main|Classical electromagnetism and special relativity|Covariant formulation of classical electromagnetism}}\u003cbr\u003e Theoretical investigation in [[classical electromagnetism]] led to the discovery of wave propagation. Equations generalizing the electromagnetic effects found that finite propagation speed of the '''E''' and '''B''' fields required certain behaviors on charged particles. The general study of moving charges forms the [[Li\u00e9nard\u2013Wiechert potential]], which is a step towards special relativity.","--- Revision 52\u003cbr\u003e+++ Revision 53\u003cbr\u003e@@ -467,6 +467,13 @@\u003cbr\u003e \u003cbr\u003e Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component which is the energy, and three space components which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e \u003cbr\u003e+=== How far can you travel from the Earth? ===\u003cbr\u003e+{{See also|Space travel under constant acceleration}}\u003cbr\u003e+Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems which exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e+\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}}\u003c\u002fmath\u003e\u003cbr\u003e+where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at ''v'' = 0.712''c'' and 0.946''c'' after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do - since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at 1.1''g'' will take 148,000 Earth years and cover about 140,000 light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e The energy and momentum are properties of matter and radiation, and it is impossible to deduce that they form a four-vector just from the two basic postulates of special relativity by themselves, because these do not talk about matter or radiation, they only talk about space and time. The derivation therefore requires some additional physical reasoning. In his 1905 paper, Einstein used the additional principles that Newtonian mechanics should hold for slow velocities, so that there is one energy scalar and one three-vector momentum at slow velocities, and that the conservation law for energy and momentum is exactly true in relativity. Furthermore, he assumed that the energy of light is transformed by the same Doppler-shift factor as its frequency, which he had previously shown to be true based on Maxwell's equations.\u003cref name=electro group=p\u002f\u003e The first of Einstein's papers on this subject was \"Does the Inertia of a Body Depend upon its Energy Content?\" in 1905.\u003cref name=inertia group=p\u003e[http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002f
