= Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e-Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e+Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity has been proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e \u003cbr\u003e Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e ","--- Revision 40\u003cbr\u003e+++ Revision 41\u003cbr\u003e@@ -15,7 +15,7 @@\u003cbr\u003e \u003cbr\u003e A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e \u003cbr\u003e-Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; \"special\" really means \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e+Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; the word \"special\" is used here in the sense of a \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The theory is \"special\" in that it only applies in the [[special case]] where the spacetime is \"flat\", that is, where the [[curvature of spacetime]] (a consequence of the [[energy\u2013momentum tensor]] and representing [[gravity]]) is negligible.\u003cref\u003eSean Carroll, Lecture Notes on General Relativity, ch. 1, \"Special relativity and flat spacetime\", http:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fMarch01\u002fCarroll3\u002fCarroll1.html\u003c\u002fref\u003e\u003cref group=\"note\"\u003eWald, General Relativity, p.&nbsp;60: \"...&nbsp;the special theory of relativity asserts that spacetime is the manifold \u003cmath\u003e\\mathbb{R}^4\u003c\u002fmath\u003e with a flat metric of Lorentz signature defined on it. Conversely, the entire content of special relativity ... is contained in this statement&nbsp;...\"\u003c\u002fref\u003e To correctly accommodate gravity, Einstein formulated general relativity in 1915. Special relativity, contrary to some historical descriptions, does accommodate [[acceleration (special relativity)|accelerations]] as well as [[Rindler coordinates|accelerating frames of reference]].\u003cref\u003e{{cite book |title=Explorations in Mathematical Physics: The Concepts Behind an Elegant Language |edition=illustrated |first1=Don |last1=Koks |publisher=Springer Science & Business Media |year=2006 |isbn=978-0-387-32793-8 |page=234 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC&pg=PA234 Extract of page 234]\u003c\u002fref\u003e\u003cref\u003e{{cite book |title=Relativity Made Relatively Easy |edition=illustrated |first1=Andrew M. |last1=Steane |publisher=OUP Oxford |year=2012 |isbn=978-0-19-966286-9 |page=226 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC&pg=PA226 Extract of page 226]\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 41\u003cbr\u003e+++ Revision 42\u003cbr\u003e@@ -453,12 +453,6 @@\u003cbr\u003e === Equivalence of mass and energy ===\u003cbr\u003e {{Main|Mass\u2013energy equivalence}}\u003cbr\u003e \u003cbr\u003e-As an object's speed approaches the speed of light from an observer's point of view, its [[relativistic mass]] increases thereby making it more and more difficult to accelerate it from within the observer's frame of reference.\u003cbr\u003e-\u003cbr\u003e-The energy content of an object at rest with mass ''m'' equals ''mc''\u003csup\u003e2\u003c\u002fsup\u003e. Conservation of energy implies that, in any reaction, a decrease of the sum of the masses of particles must be accompanied by an increase in kinetic energies of the particles after the reaction. Similarly, the mass of an object can be increased by taking in kinetic energies.\u003cbr\u003e-\u003cbr\u003e-In addition to the papers referenced above \u2013 which give derivations of the Lorentz transformation and describe the foundations of special relativity\u2014Einstein also wrote at least four papers giving [[heuristic]] arguments for the equivalence (and transmutability) of mass and energy, for {{nowrap|1=''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cbr\u003e-\u003cbr\u003e Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component, which is the energy, and three space components, which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e \u003cbr\u003e The energy and momentum are properties of matter and radiation, and it is impossible to deduce that they form a four-vector just from the two basic postulates of special relativity by themselves, because these do not talk about matter or radiation, they only talk about space and time. The derivation therefore requires some additional physical reasoning. In his 1905 paper, Einstein used the additional principles that Newtonian mechanics should hold for slow velocities, so that there is one energy scalar and one three-vector momentum at slow velocities, and that the conservation law for energy and momentum is exactly true in relativity. Furthermore, he assumed that the energy of light is transformed by the same Doppler-shift factor as its frequency, which he had previously shown to be true based on Maxwell's equations.\u003cref name=electro group=p\u002f\u003e The first of Einstein's papers on this subject was \"Does the Inertia of a Body Depend upon its Energy Content?\" in 1905.\u003cref name=inertia group=p\u003e[http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fE_mc2\u002fwww\u002f Does the inertia of a body depend upon its energy content?] A. Einstein, ''Annalen der Physik''. '''18''':639, 1905 (English translation by W. Perrett and G.B. Jeffery)\u003c\u002fref\u003e Although Einstein's argument in this paper is nearly universally accepted by physicists as correct, even self-evident, many authors over the years have suggested that it is wrong.\u003cref name=Jammer\u003e{{cite book |title=Concepts of Mass in Classical and Modern Physics |author=[[Max Jammer]] |pages=177\u2013178 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=lYvz0_8aGsMC&pg=PA177 |isbn=978-0-486-29998-3 |publisher=Courier Dover Publications |date=1997 }}\u003c\u002fref\u003e Other authors suggest that the argument was merely inconclusive because it relied on some implicit assumptions.\u003cref name= Stachel\u003e{{cite book |title=Einstein from ''B'' to ''Z'' |page= 221 |author=John J. Stachel |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=OAsQ_hFjhrAC&pg=PA215 |isbn=978-0-8176-4143-6 |publisher=Springer |date=2002}}\u003c\u002fref\u003e","--- Revision 42\u003cbr\u003e+++ Revision 43\u003cbr\u003e@@ -2,7 +2,8 @@\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e {{Special relativity sidebar}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|\u003cbr\u003e+\"On the Electrodynamics of Moving Bodies\"]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').","--- Revision 43\u003cbr\u003e+++ Revision 44\u003cbr\u003e@@ -209,7 +209,7 @@\u003cbr\u003e ==== Langevin's light-clock ====\u003cbr\u003e {{anchor|Langevin's Light-Clock}}\u003cbr\u003e [[File:Langevin Light Clock.gif|thumb|320px|Figure 4\u20133. Thought experiment using a light-clock to explain time dilation]]\u003cbr\u003e-[[Paul Langevin]], an early proponent of the theory of relativity, did much to popularize the theory in the face of resistance by many physicists to Einstein's revolutionary concepts. Among his numerous contributions to the foundations of special relativity were independent work on the mass\u2013energy relationship, a thorough examination of the twin paradox, and investigations into rotating coordinate systems. His name is frequently attached to a hypothetical construct called a \"light-clock\" (originally developed by Lewis and Tolman in 1909\u003cref name=\"Lewis_Tolman_1909\"\u003e{{cite journal |last1=Lewis |first1=Gilbert Newton |last2=Tolman |first2=Richard Chase |title=The Principle of Relativity, and Non-Newtonian Mechanics |journal=Proceedings of the American Academy of Arts and Sciences |date=1909 |volume=44 |issue=25 |pages=709\u2013726 |doi=10.2307\u002f20022495 |jstor=20022495 |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fThe_Principle_of_Relativity,_and_Non-Newtonian_Mechanics |access-date=22 August 2023}}\u003c\u002fref\u003e), which he used to perform a novel derivation of the Lorentz transformation.\u003cref name=\"Cuvaj_1971\"\u003e{{cite journal |last1=Cuvaj |first1=Camillo |title=Paul Langeyin and the Theory of Relativity |journal=Japanese Studies in the History of Science |date=1971 |volume=10 |pages=113\u2013142 |url=http:\u002f\u002fwww.isc.meiji.ac.jp\u002f~sano\u002fhssj\u002fpdf\u002fCuvaj_C-1972-Langevin_Relativity-JSHS-No_10-pp113-142.pdf |access-date=12 June 2023}}\u003c\u002fref\u003e\u003cbr\u003e+[[Paul Langevin]], an early proponent of the theory of relativity, did much to popularize the theory in the face of resistance by many physicists to Einstein's revolutionary concepts. Among his numerous contributions to the foundations of special relativity were independent work on the mass\u2013energy relationship, a thorough examination of the twin paradox, and investigations into rotating coordinate systems. His name is frequently attached to a hypothetical construct called a \"light-clock\" (originally developed by Lewis and Tolman in 1909\u003cref name=\"Lewis_Tolman_1909\"\u003e{{cite journal |last1=Lewis |first1=Gilbert Newton |authorlink1=Gilbert N. Lewis|last2=Tolman |first2=Richard Chase| authorlink2=Richard Chase Tolman| title=The Principle of Relativity, and Non-Newtonian Mechanics |journal=Proceedings of the American Academy of Arts and Sciences |date=1909 |volume=44 |issue=25 |pages=709\u2013726 |doi=10.2307\u002f20022495 |jstor=20022495 |url=https:\u002f\u002fen.wikisource.org\u002fwiki\u002fThe_Principle_of_Relativity,_and_Non-Newtonian_Mechanics |access-date=22 August 2023}}\u003c\u002fref\u003e), which he used to perform a novel derivation of the Lorentz transformation.\u003cref name=\"Cuvaj_1971\"\u003e{{cite journal |last1=Cuvaj |first1=Camillo |title=Paul Langeyin and the Theory of Relativity |journal=Japanese Studies in the History of Science |date=1971 |volume=10 |pages=113\u2013142 |url=http:\u002f\u002fwww.isc.meiji.ac.jp\u002f~sano\u002fhssj\u002fpdf\u002fCuvaj_C-1972-Langevin_Relativity-JSHS-No_10-pp113-142.pdf |access-date=12 June 2023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e A light-clock is imagined to be a box of perfectly reflecting walls wherein a light signal reflects back and forth from opposite faces. The concept of time dilation is frequently taught using a  light-clock that is traveling in uniform inertial motion perpendicular to a line connecting the two mirrors.\u003cref\u003e{{Cite book |last1=Cassidy |first1=David C. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=rpQo7f9F1xUC&pg=PA422 |title=Understanding Physics |last2=Holton |first2=Gerald James |last3=Rutherford |first3=Floyd James |publisher=[[Springer-Verlag]] |year=2002 |isbn=978-0-387-98756-9 |pages=422}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last=Cutner |first=Mark Leslie |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=2QVmiMW0O0MC&pg=PA128 |title=Astronomy, A Physical Perspective |publisher=[[Cambridge University Press]] |year=2003 |isbn=978-0-521-82196-4 |page=128}}\u003c\u002fref\u003e\u003cref\u003e{{Cite book |last1=Ellis |first1=George F. R. |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=Hos31wty5WIC&pg=PA28 |title=Flat and Curved Space-times |last2=Williams |first2=Ruth M. |publisher=[[Oxford University Press]] |year=2000 |isbn=978-0-19-850657-7 |edition=2n |pages=28\u201329}}\u003c\u002fref\u003e\u003cref name=\"Feynman_Lectures_1\"\u003e{{cite book |last1=Feynman |first1=Richard P. |last2=Leighton |first2=Robert B. |last3=Sands |first3=Matthew |title=The feynman lectures on physics; vol I: The new millennium edition |date=2011 |publisher=Basic Books |isbn=978-0-465-02414-8 |page=15-5 |url=https:\u002f\u002fwww.feynmanlectures.caltech.edu\u002fI_15.html |access-date=12 June 2023}}\u003c\u002fref\u003e (Langevin himself made use of a light-clock oriented parallel to its line of motion.\u003cref name=\"Cuvaj_1971\"\u002f\u003e)\u003cbr\u003e ","--- Revision 44\u003cbr\u003e+++ Revision 45\u003cbr\u003e@@ -1003,7 +1003,7 @@\u003cbr\u003e In a continuous medium, the 3D ''density of force'' combines with the ''density of power'' to form a covariant 4-vector. The spatial part is the result of dividing the force on a small cell (in 3-space) by the volume of that cell. The time component is \u22121\u002f''c'' times the power transferred to that cell divided by the volume of the cell. This will be used below in the section on electromagnetism.\u003cbr\u003e \u003cbr\u003e == See also ==\u003cbr\u003e-\u003cbr\u003e+{{Portal|Science}}\u003cbr\u003e ; People :\u003cbr\u003e * [[Max Planck]]\u003cbr\u003e * [[Hermann Minkowski]]","--- Revision 45\u003cbr\u003e+++ Revision 46\u003cbr\u003e@@ -10,19 +10,19 @@\u003cbr\u003e \u003cbr\u003e == Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e-Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity has been proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e-\u003cbr\u003e-Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e-\u003cbr\u003e-Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; the word \"special\" is used here in the sense of a \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e+Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions, especially those close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Special relativity has proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model remains accurate at low velocities relative to the speed of light, for example, everyday motion on Earth.\u003cbr\u003e+\u003cbr\u003e+Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other as was previously thought. Instead, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e+\u003cbr\u003e+Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; the word \"special\" is used here in the sense of a \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity built on earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The theory is \"special\" in that it only applies in the [[special case]] where the spacetime is \"flat\", that is, where the [[curvature of spacetime]] (a consequence of the [[energy\u2013momentum tensor]] and representing [[gravity]]) is negligible.\u003cref\u003eSean Carroll, Lecture Notes on General Relativity, ch. 1, \"Special relativity and flat spacetime\", http:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fMarch01\u002fCarroll3\u002fCarroll1.html\u003c\u002fref\u003e\u003cref group=\"note\"\u003eWald, General Relativity, p.&nbsp;60: \"...&nbsp;the special theory of relativity asserts that spacetime is the manifold \u003cmath\u003e\\mathbb{R}^4\u003c\u002fmath\u003e with a flat metric of Lorentz signature defined on it. Conversely, the entire content of special relativity ... is contained in this statement&nbsp;...\"\u003c\u002fref\u003e To correctly accommodate gravity, Einstein formulated general relativity in 1915. Special relativity, contrary to some historical descriptions, does accommodate [[acceleration (special relativity)|accelerations]] as well as [[Rindler coordinates|accelerating frames of reference]].\u003cref\u003e{{cite book |title=Explorations in Mathematical Physics: The Concepts Behind an Elegant Language |edition=illustrated |first1=Don |last1=Koks |publisher=Springer Science & Business Media |year=2006 |isbn=978-0-387-32793-8 |page=234 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC&pg=PA234 Extract of page 234]\u003c\u002fref\u003e\u003cref\u003e{{cite book |title=Relativity Made Relatively Easy |edition=illustrated |first1=Andrew M. |last1=Steane |publisher=OUP Oxford |year=2012 |isbn=978-0-19-966286-9 |page=226 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC&pg=PA226 Extract of page 226]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Just as [[Galilean invariance|Galilean relativity]] is now accepted to be an approximation of special relativity that is valid for low speeds, special relativity is considered an approximation of general relativity that is valid for weak [[gravitational field]]s, that is, at a sufficiently small scale (e.g., when [[tidal force]]s are negligible) and in conditions of [[free fall]]. But general relativity incorporates [[non-Euclidean geometry]] to represent gravitational effects as the geometric curvature of spacetime. Special relativity is restricted to the flat spacetime known as [[Minkowski space]]. As long as the universe can be modeled as a [[pseudo-Riemannian manifold]], a Lorentz-invariant frame that abides by special relativity can be defined for a sufficiently small neighborhood of each point in this [[curved spacetime]].\u003cbr\u003e-\u003cbr\u003e-[[Galileo Galilei]] had already postulated that there is no absolute and well-defined state of rest (no [[Preferred frame|privileged reference frames]]), a principle now called [[Galilean invariance|Galileo's principle of relativity]]. Einstein extended this principle so that it accounted for the constant speed of light,\u003cref name=\"Taylor_1992\"\u002f\u003e a phenomenon that had been observed in the Michelson\u2013Morley experiment. He also postulated that it holds for all the [[laws of physics]], including both the laws of mechanics and of [[electrodynamics]].\u003cref name=\"Rindler0\"\u003e{{cite book |title=Essential Relativity: Special, General, and Cosmological |first1= Wolfgang |edition=illustrated |last1=Rindler |page= \u00a71,11 p. 7 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=0J_dwCmQThgC&pg=PT148 |isbn=978-3-540-07970-5 |publisher=Springer Science & Business Media|date=1977 }}\u003c\u002fref\u003e\u003cbr\u003e+Just as [[Galilean invariance|Galilean relativity]] is accepted as an approximation of special relativity that is valid for low speeds, special relativity is considered an approximation of general relativity that is valid for weak [[gravitational field]]s, that is, at a sufficiently small scale (e.g., when [[tidal force]]s are negligible) and in conditions of [[free fall]]. But general relativity incorporates [[non-Euclidean geometry]] to represent gravitational effects as the geometric curvature of spacetime. Special relativity is restricted to the flat spacetime known as [[Minkowski space]]. As long as the universe can be modeled as a [[pseudo-Riemannian manifold]], a Lorentz-invariant frame that abides by special relativity can be defined for a sufficiently small neighborhood of each point in this [[curved spacetime]].\u003cbr\u003e+\u003cbr\u003e+[[Galileo Galilei]] had already postulated that there is no absolute and well-defined state of rest (no [[Preferred frame|privileged reference frames]]), a principle called [[Galilean invariance|Galileo's principle of relativity]]. Einstein extended this principle so that it accounted for the constant speed of light,\u003cref name=\"Taylor_1992\"\u002f\u003e a phenomenon that had been observed in the Michelson\u2013Morley experiment. He also postulated that it holds for all the [[laws of physics]], including both the laws of mechanics and of [[electrodynamics]].\u003cref name=\"Rindler0\"\u003e{{cite book |title=Essential Relativity: Special, General, and Cosmological |first1= Wolfgang |edition=illustrated |last1=Rindler |page= \u00a71,11 p. 7 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=0J_dwCmQThgC&pg=PT148 |isbn=978-3-540-07970-5 |publisher=Springer Science & Business Media|date=1977 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Traditional \"two postulates\" approach to special relativity \u003cspan class=\"anchor\" id=\"Postulates\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Quote box","--- Revision 46\u003cbr\u003e+++ Revision 47\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e \u003cbr\u003e == Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e-Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions, especially those close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Special relativity has proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model remains accurate at low velocities relative to the speed of light, for example, everyday motion on Earth.\u003cbr\u003e+Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions, especially velocities close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Special relativity has proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model remains accurate at low velocities relative to the speed of light, for example, everyday motion on Earth.\u003cbr\u003e \u003cbr\u003e Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e ","--- Revision 47\u003cbr\u003e+++ Revision 48\u003cbr\u003e@@ -2,7 +2,7 @@\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e {{Special relativity sidebar}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a fake scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 pape or the principle of light speed invariance.","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -1,28 +1,27 @@\u003cbr\u003e {{short description|Theory of interwoven space and time by Albert Einstein}}\u003cbr\u003e-[[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e+[[File:Einstein patentoffice.jpg|thumb|260px|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e {{Special relativity sidebar}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|\u003cbr\u003e-\"On the Electrodynamics of Moving Bodies\"]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e-# The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e-# The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e-The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 treatment, the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons, Inc. | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e+# The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]).\u003cbr\u003e+# The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer.\u003cbr\u003e+The first postulate was first formulated by [[Galileo Galilei]] (see [[Galilean invariance]]). \u003cbr\u003e \u003cbr\u003e == Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e-Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the classical laws of mechanics to handle situations involving all motions, especially velocities close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Special relativity has proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model remains accurate at low velocities relative to the speed of light, for example, everyday motion on Earth.\u003cbr\u003e-\u003cbr\u003e-Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e-\u003cbr\u003e-A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other as was previously thought. Instead, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e-\u003cbr\u003e-Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; the word \"special\" is used here in the sense of a \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p. 451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p.&nbsp;111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity built on earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e+Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"[[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]]\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], which adjust distances and times for moving objects. Special relativity corrects the hitherto laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{Cite book|last=Goldstein|first=Herbert|title=Classical Mechanics|title-link=Classical Mechanics (Goldstein book)|publisher=Addison-Wesley Publishing Company|year=1980|isbn=0-201-02918-9|edition=2nd|chapter=Chapter 7: Special Relativity in Classical Mechanics|author-link=Herbert Goldstein}}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos|first=Cornelius|title=The Variational Principles of Mechanics|publisher=Dover Publications|year=1970|isbn=978-0-486-65067-8|edition=4th|chapter=Chapter IX: Relativistic Mechanics|author-link=Cornelius Lanczos}}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e+\u003cbr\u003e+Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e They include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula \u003cmath\u003eE = mc^2\u003c\u002fmath\u003e, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in a vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e+\u003cbr\u003e+A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e+\u003cbr\u003e+Until several years later when Einstein developed [[general relativity]], which introduced a curved spacetime to incorporate gravity, the phrase \"special relativity\" was not used. A translation sometimes used is \"restricted relativity\"; \"special\" really means \"special case\".\u003cref group=\"p\"\u003e\"Science and Common Sense\", P. W. Bridgman, ''The Scientific Monthly'', Vol. 79, No. 1 (Jul. 1954), pp. 32\u201339.\u003c\u002fref\u003e\u003cref group=\"p\"\u003eThe Electromagnetic Mass and Momentum of a Spinning Electron, G. Breit, Proceedings of the National Academy of Sciences, Vol. 12, p.451, 1926\u003c\u002fref\u003e\u003cref group=\"p\"\u003eKinematics of an electron with an axis. Phil. Mag. 3:1-22. L. H. Thomas.]\u003c\u002fref\u003e\u003cref group=\"note\"\u003eEinstein himself, in The Foundations of the General Theory of Relativity, Ann. Phys. 49 (1916), writes \"The word 'special' is meant to intimate that the principle is restricted to the case&nbsp;...\". See p. 111 of The Principle of Relativity, A. Einstein, H. A. Lorentz, H. Weyl, H. Minkowski, Dover reprint of 1923 translation by Methuen and Company.]\u003c\u002fref\u003e Some of the work of Albert Einstein in special relativity is built on the earlier work by [[Hendrik Lorentz]] and [[Henri Poincar\u00e9]]. The theory became essentially complete in 1907, with [[Hermann Minkowski]]'s papers on spacetime.\u003cref name=\"Lanczos-1970\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e The theory is \"special\" in that it only applies in the [[special case]] where the spacetime is \"flat\", that is, where the [[curvature of spacetime]] (a consequence of the [[energy\u2013momentum tensor]] and representing [[gravity]]) is negligible.\u003cref\u003eSean Carroll, Lecture Notes on General Relativity, ch. 1, \"Special relativity and flat spacetime\", http:\u002f\u002fned.ipac.caltech.edu\u002flevel5\u002fMarch01\u002fCarroll3\u002fCarroll1.html\u003c\u002fref\u003e\u003cref group=\"note\"\u003eWald, General Relativity, p.&nbsp;60: \"...&nbsp;the special theory of relativity asserts that spacetime is the manifold \u003cmath\u003e\\mathbb{R}^4\u003c\u002fmath\u003e with a flat metric of Lorentz signature defined on it. Conversely, the entire content of special relativity ... is contained in this statement&nbsp;...\"\u003c\u002fref\u003e To correctly accommodate gravity, Einstein formulated general relativity in 1915. Special relativity, contrary to some historical descriptions, does accommodate [[acceleration (special relativity)|accelerations]] as well as [[Rindler coordinates|accelerating frames of reference]].\u003cref\u003e{{cite book |title=Explorations in Mathematical Physics: The Concepts Behind an Elegant Language |edition=illustrated |first1=Don |last1=Koks |publisher=Springer Science & Business Media |year=2006 |isbn=978-0-387-32793-8 |page=234 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=ObMb7l9-9loC&pg=PA234 Extract of page 234]\u003c\u002fref\u003e\u003cref\u003e{{cite book |title=Relativity Made Relatively Easy |edition=illustrated |first1=Andrew M. |last1=Steane |publisher=OUP Oxford |year=2012 |isbn=978-0-19-966286-9 |page=226 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC}} [https:\u002f\u002fbooks.google.com\u002fbooks?id=75rCErZkh7EC&pg=PA226 Extract of page 226]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Just as [[Galilean invariance|Galilean relativity]] is accepted as an approximation of special relativity that is valid for low speeds, special relativity is considered an approximation of general relativity that is valid for weak [[gravitational field]]s, that is, at a sufficiently small scale (e.g., when [[tidal force]]s are negligible) and in conditions of [[free fall]]. But general relativity incorporates [[non-Euclidean geometry]] to represent gravitational effects as the geometric curvature of spacetime. Special relativity is restricted to the flat spacetime known as [[Minkowski space]]. As long as the universe can be modeled as a [[pseudo-Riemannian manifold]], a Lorentz-invariant frame that abides by special relativity can be defined for a sufficiently small neighborhood of each point in this [[curved spacetime]].\u003cbr\u003e-\u003cbr\u003e-[[Galileo Galilei]] had already postulated that there is no absolute and well-defined state of rest (no [[Preferred frame|privileged reference frames]]), a principle called [[Galilean invariance|Galileo's principle of relativity]]. Einstein extended this principle so that it accounted for the constant speed of light,\u003cref name=\"Taylor_1992\"\u002f\u003e a phenomenon that had been observed in the Michelson\u2013Morley experiment. He also postulated that it holds for all the [[laws of physics]], including both the laws of mechanics and of [[electrodynamics]].\u003cref name=\"Rindler0\"\u003e{{cite book |title=Essential Relativity: Special, General, and Cosmological |first1= Wolfgang |edition=illustrated |last1=Rindler |page= \u00a71,11 p. 7 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=0J_dwCmQThgC&pg=PT148 |isbn=978-3-540-07970-5 |publisher=Springer Science & Business Media|date=1977 }}\u003c\u002fref\u003e\u003cbr\u003e+Just as [[Galilean invariance|Galilean relativity]] is now accepted to be an approximation of special relativity that is valid for low speeds, special relativity is considered an approximation of general relativity that is valid for weak [[gravitational field]]s, that is, at a sufficiently small scale (e.g., when [[tidal force]]s are negligible) and in conditions of [[free fall]]. But general relativity incorporates [[non-Euclidean geometry]] to represent gravitational effects as the geometric curvature of spacetime. Special relativity is restricted to the flat spacetime known as [[Minkowski space]]. As long as the universe can be modeled as a [[pseudo-Riemannian manifold]], a Lorentz-invariant frame that abides by special relativity can be defined for a sufficiently small neighborhood of each point in this [[curved spacetime]].\u003cbr\u003e+\u003cbr\u003e+[[Galileo Galilei]] had already postulated that there is no absolute and well-defined state of rest (no [[Preferred frame|privileged reference frames]]), a principle now called [[Galilean invariance|Galileo's principle of relativity]]. Einstein extended this principle so that it accounted for the constant speed of light,\u003cref\u003e{{cite book|title=Spacetime Physics: Introduction to Special Relativity|date=1992|publisher=W. H. Freeman|isbn=978-0-7167-2327-1|author1=Edwin F. Taylor|author2=John Archibald Wheeler|name-list-style=amp|url=https:\u002f\u002farchive.org\u002fdetails\u002fspacetimephysics00edwi_0}}\u003c\u002fref\u003e a phenomenon that had been observed in the Michelson\u2013Morley experiment. He also postulated that it holds for all the [[laws of physics]], including both the laws of mechanics and of [[electrodynamics]].\u003cref name=\"Rindler0\"\u003e{{cite book |title=Essential Relativity: Special, General, and Cosmological |first1= Wolfgang |edition=illustrated |last1=Rindler |page= \u00a71,11 p. 7 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=0J_dwCmQThgC&pg=PT148 |isbn=978-3-540-07970-5 |publisher=Springer Science & Business Media|date=1977 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Traditional \"two postulates\" approach to special relativity \u003cspan class=\"anchor\" id=\"Postulates\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Quote box\u003cbr\u003e@@ -74,7 +73,7 @@\u003cbr\u003e The [[principle of relativity]], which states that physical laws have the same form in each [[inertial reference frame]], dates back to [[Galileo Galilei|Galileo]], and was incorporated into Newtonian physics. But in the late 19th century the existence of [[electromagnetic radiation|electromagnetic waves]] led some physicists to suggest that the universe was filled with a substance they called \"[[Luminiferous aether|aether]]\", which, they postulated, would act as the medium through which these waves, or vibrations, propagated (in many respects similar to the way sound propagates through air). The aether was thought to be an [[preferred frame|absolute reference frame]] against which all speeds could be measured, and could be considered fixed and motionless relative to Earth or some other fixed reference point. The aether was supposed to be sufficiently elastic to support electromagnetic waves, while those waves could interact with matter, yet offering no resistance to bodies passing through it (its one property was that it allowed electromagnetic waves to propagate). The results of various experiments, including the Michelson\u2013Morley experiment in 1887 (subsequently verified with more accurate and innovative experiments), led to the theory of special relativity, by showing that the aether did not exist.\u003cref\u003eStaley, Richard (2009), \"Albert Michelson, the Velocity of Light, and the Ether Drift\", ''Einstein's generation. The origins of the relativity revolution'', Chicago: University of Chicago Press, {{isbn|0-226-77057-5}}\u003c\u002fref\u003e Einstein's solution was to discard the notion of an aether and the absolute state of rest. In relativity, any reference frame moving with uniform motion will observe the same laws of physics. In particular, the speed of light in vacuum is always measured to be ''c'', even when measured by multiple systems that are moving at different (but constant) velocities.\u003cbr\u003e \u003cbr\u003e === Relativity without the second postulate ===\u003cbr\u003e-From the principle of relativity alone without assuming the constancy of the speed of light (i.e., using the
