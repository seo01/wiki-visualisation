lum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe \u2013 WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Dynamics ==\u003cbr\u003e Section ''{{slink|#Consequences derived from the Lorentz transformation}}'' dealt strictly with [[kinematics]], the study of the motion of points, bodies, and systems of bodies without considering the forces that caused the motion. This section discusses masses, forces, energy and so forth, and as such requires consideration of physical effects beyond those encompassed by the Lorentz transformation itself.","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -74,6 +74,11 @@\u003cbr\u003e \u003cbr\u003e === Relativity without the second postulate ===\u003cbr\u003e From the principle of relativity alone without assuming the constancy of the speed of light (i.e., using the isotropy of space and the symmetry implied by the principle of special relativity) [[Derivations of the Lorentz transformations#From group postulates|it can be shown]] that the spacetime transformations between inertial frames are either Euclidean, Galilean, or Lorentzian. In the Lorentzian case, one can then obtain relativistic interval conservation and a certain finite limiting speed. Experiments suggest that this speed is the speed of light in vacuum.\u003cref name=Friedman group=p\u003e{{cite book|author=Yaakov Friedman|title=Physical Applications of Homogeneous Balls|series=Progress in Mathematical Physics|volume=40|date=2004|pages=1\u201321|isbn=978-0-8176-3339-4}}\u003c\u002fref\u003e\u003cref name=Morin2007\u003eDavid Morin (2007) ''Introduction to Classical Mechanics'', Cambridge University Press, Cambridge, chapter 11, Appendix I, {{isbn|1-139-46837-5}}.\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Einsteins Epiphany ===\u003cbr\u003e+Galileo Galilei (b 15 February 1564 \u2013 d 8 January 1642), Most of Einstein's 1905 miricle year came about from an epiphany he had around 1903 when he used Galileo's 1632 \"Principle of Relativity\" = \"All steady motion is relative, and cannot be detected without reference to an outside point\", Einstein used this to solve his gedanken experiment, a puzzle he had asked for 10 years from the age of 14, he said that while holding a mirror at arms distance, if at the speed of light, would i catch up to the light leaving my face to the mirror and it being stuck in transit, causing my mirror image to disappear, but i would not have to look outside my reference frame to know i am moving, and that would violate Galileo's principle, my mirror image would be normal and the same as in any other reference frame, ,confirming that the laws of physics have to hold true in each and every reference frame and that the speed of light is the same for all observers moving at different speeds, so each of the observers DISTANCE and TIME would have to be different values, they would not agree upon the rate of flow of time, moving clocks run slow. Light has a constant speed independent of it's source.\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e \u003cbr\u003e == Lorentz invariance as the essential core of special relativity \u003cspan class=\"anchor\" id=\"Lorentz transformation\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Main|Lorentz transformation}}","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -76,9 +76,7 @@\u003cbr\u003e From the principle of relativity alone without assuming the constancy of the speed of light (i.e., using the isotropy of space and the symmetry implied by the principle of special relativity) [[Derivations of the Lorentz transformations#From group postulates|it can be shown]] that the spacetime transformations between inertial frames are either Euclidean, Galilean, or Lorentzian. In the Lorentzian case, one can then obtain relativistic interval conservation and a certain finite limiting speed. Experiments suggest that this speed is the speed of light in vacuum.\u003cref name=Friedman group=p\u003e{{cite book|author=Yaakov Friedman|title=Physical Applications of Homogeneous Balls|series=Progress in Mathematical Physics|volume=40|date=2004|pages=1\u201321|isbn=978-0-8176-3339-4}}\u003c\u002fref\u003e\u003cref name=Morin2007\u003eDavid Morin (2007) ''Introduction to Classical Mechanics'', Cambridge University Press, Cambridge, chapter 11, Appendix I, {{isbn|1-139-46837-5}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Einsteins Epiphany ===\u003cbr\u003e-Galileo Galilei (b 15 February 1564 \u2013 d 8 January 1642), Most of Einstein's 1905 miricle year came about from an epiphany he had around 1903 when he used Galileo's 1632 \"Principle of Relativity\" = \"All steady motion is relative, and cannot be detected without reference to an outside point\", Einstein used this to solve his gedanken experiment, a puzzle he had asked for 10 n slow. Light has a constant speed independent of it's source.\u003cbr\u003e \u003cbr\u003e == Lorentz invariance as the essential core of special relativity \u003cspan class=\"anchor\" id=\"Lorentz transformation\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Main|Lorentz transformation}}","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -76,7 +76,7 @@\u003cbr\u003e From the principle of relativity alone without assuming the constancy of the speed of light (i.e., using the isotropy of space and the symmetry implied by the principle of special relativity) [[Derivations of the Lorentz transformations#From group postulates|it can be shown]] that the spacetime transformations between inertial frames are either Euclidean, Galilean, or Lorentzian. In the Lorentzian case, one can then obtain relativistic interval conservation and a certain finite limiting speed. Experiments suggest that this speed is the speed of light in vacuum.\u003cref name=Friedman group=p\u003e{{cite book|author=Yaakov Friedman|title=Physical Applications of Homogeneous Balls|series=Progress in Mathematical Physics|volume=40|date=2004|pages=1\u201321|isbn=978-0-8176-3339-4}}\u003c\u002fref\u003e\u003cref name=Morin2007\u003eDavid Morin (2007) ''Introduction to Classical Mechanics'', Cambridge University Press, Cambridge, chapter 11, Appendix I, {{isbn|1-139-46837-5}}.\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Einsteins Epiphany ===\u003cbr\u003e-Galileo Galilei (b 15 February 1564 \u2013 d 8 January 1642), Most of Einstein's 1905 miricle year came about from an epiphany he had around 1903 when he used Galileo's 1632 \"Principle of Relativity\" = \"All steady motion is relative, and cannot be detected without reference to an outside point\", Einstein used this to solve his gedanken experiment, a puzzle he had asked for 10 years from the age of 14. He said that while holding a mirror at arms distance, if at the speed of light, would i catch up to the light leaving my face to d=\"Lorentz transformation\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Main|Lorentz transformation}}","--- Revision 29\u003cbr\u003e+++ Revision 30\u003cbr\u003e@@ -74,9 +74,6 @@\u003cbr\u003e \u003cbr\u003e === Relativity without the second postulate ===\u003cbr\u003e From the principle of relativity alone without assuming the constancy of the speed of light (i.e., using the isotropy of space and the symmetry implied by the principle of special relativity) [[Derivations of the Lorentz transformations#From group postulates|it can be shown]] that the spacetime transformations between inertial frames are either Euclidean, Galilean, or Lorentzian. In the Lorentzian case, one can then obtain relativistic interval conservation and a certain finite limiting speed. Experiments suggest that this speed is the speed of light in vacuum.\u003cref name=Friedman group=p\u003e{{cite book|author=Yaakov Friedman|title=Physical Applications of Homogeneous Balls|series=Progress in Mathematical Physics|volume=40|date=2004|pages=1\u201321|isbn=978-0-8176-3339-4}}\u003c\u002fref\u003e\u003cref name=Morin2007\u003eDavid Morin (2007) ''Introduction to Classical Mechanics'', Cambridge University Press, Cambridge, chapter 11, Appendix I, {{isbn|1-139-46837-5}}.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Einsteins Epiphany ===\u003cbr\u003e-Galileo Galilei (b 15 February 1564 \u2013 d 8 January 1642), Most of Einstein's 1905 miricle year came about from an epiphany he had around 1903 when he used Galileo's 1632 \"Principle of Relativity\" = \"All steady motion is relative, and cannot be detected without reference to an outside point\", Einstein used this to solve his gedanken experiment, a puzzle he had asked for 10 years from the age of 14. He said that while holding a mirror at arms distance, if at the speed of light, would i catch up to the light leaving my face to the mirror and it being stuck in transit, causing my mirror image to disappear, but i would not have to look outside my reference frame to know i am moving, and that would violate Galileo's principle. My mirror image would be normal and the same as in any other reference frame, confirming that the laws of physics have to hold true in each and every reference frame and that the speed of light is the same for all observers moving at different speeds. So each of the observers DISTANCE and TIME would have to be different values, they would not agree upon the rate of flow of time, moving clocks run slow. Light has a constant speed independent of it's source.\u003cbr\u003e \u003cbr\u003e == Lorentz invariance as the essential core of special relativity \u003cspan class=\"anchor\" id=\"Lorentz transformation\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e {{Main|Lorentz transformation}}","--- Revision 30\u003cbr\u003e+++ Revision 31\u003cbr\u003e@@ -5,6 +5,19 @@\u003cbr\u003e In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+One of the most renowned outcomes of Special Relativity is the [[Mass\u2013energy equivalence|mass-energy]] equivalence principle, encapsulated in the equation [[E=mc\u00b2]]. This formula indicates that mass and energy are [[interchangeable]], laying the groundwork for nuclear energy and particle physics.\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+Special Relativity has undergone extensive experimental validation. [[Time dilation]], a phenomenon where moving clocks tick slower than stationary ones, has been confirmed through observations of [[Muon decay|muon decay rates]] and precise measurements involving high-speed particles. Additionally, the invariance of the speed of light has been corroborated by various experiments, including the [[Michelson\u2013Morley experiment|Michelson-Morley experiment]] and its modern adaptations.\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+The theory also introduces the concept of spacetime, merging three spatial dimensions with time into a [[Four-dimensional space|four-dimensional]] continuum. This framework provides a more comprehensive understanding of how different observers perceive space and time, especially when approaching the [[Speed of light|speed of light.]]\u003cbr\u003e+\u003cbr\u003e+\u003cbr\u003e+While Special Relativity addresses the physics of objects in uniform motion, it does not encompass gravitational effects. Einstein extended these principles in his General Theory of Relativity, which offers a geometric interpretation of gravitation and applies to accelerated frames of reference.\u003cbr\u003e+\u003cbr\u003e The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').\u003cbr\u003e \u003cbr\u003e == Origins and significance ==","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -5,19 +5,6 @@\u003cbr\u003e In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e # The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e # The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-One of the most renowned outcomes of Special Relativity is the [[Mass\u2013energy equivalence|mass-energy]] equivalence principle, encapsulated in the equation [[E=mc\u00b2]]. This formula indicates that mass and energy are [[interchangeable]], laying the groundwork for nuclear energy and particle physics.\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-Special Relativity has undergone extensive experimental validation. [[Time dilation]], a phenomenon where moving clocks tick slower than stationary ones, has been confirmed through observations of [[Muon decay|muon decay rates]] and precise measurements involving high-speed particles. Additionally, the invariance of the speed of light has been corroborated by various experiments, including the [[Michelson\u2013Morley experiment|Michelson-Morley experiment]] and its modern adaptations.\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-The theory also introduces the concept of spacetime, merging three spatial dimensions with time into a [[Four-dimensional space|four-dimensional]] continuum. This framework provides a more comprehensive understanding of how different observers perceive space and time, especially when approaching the [[Speed of light|speed of light.]]\u003cbr\u003e-\u003cbr\u003e-\u003cbr\u003e-While Special Relativity addresses the physics of objects in uniform motion, it does not encompass gravitational effects. Einstein extended these principles in his General Theory of Relativity, which offers a geometric interpretation of gravitation and applies to accelerated frames of reference.\u003cbr\u003e-\u003cbr\u003e The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').\u003cbr\u003e \u003cbr\u003e == Origins and significance ==","--- Revision 32\u003cbr\u003e+++ Revision 33\u003cbr\u003e@@ -1,17 +1,17 @@\u003cbr\u003e {{short description|Theory of interwoven space and time by Albert Einstein}}\u003cbr\u003e-[[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e-{{Special relativity sidebar}}\u003cbr\u003e-\u003cbr\u003e-In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e-# The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e-# The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e-The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').\u003cbr\u003e-\u003cbr\u003e-== Origins and significance ==\u003cbr\u003e+[[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]Special Relativity, introduced by Albert Einstein in 1905, fundamentally transformed our understanding of space, time, and energy. This theory is built upon two central postulates:\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1905-01 |title=Zur Elektrodynamik bewegter K\u00f6rper |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19053221004 |journal=Annalen der Physik |volume=322 |issue=10 |pages=891\u2013921 |doi=10.1002\u002fandp.19053221004 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+Special Relativity has undergone extensive experimental validation. Time dilation, a phenomenon where moving clocks tick slower than stationary ones, has been confirmed through observations of muon decay rates and precise measurements involving high-speed particles. Additionally, the invariance of the speed of light has been corroborated by various experiments, including the Michelson-Morley experiment and its modern adaptations.\u003cref\u003e{{Cite journal |last=Will |first=Clifford M. |date=1992-01-15 |title=Clock synchronization and isotropy of the one-way speed of light |url=https:\u002f\u002fdoi.org\u002f10.1103\u002fphysrevd.45.403 |journal=Physical Review D |volume=45 |issue=2 |pages=403\u2013411 |doi=10.1103\u002fphysrevd.45.403 |issn=0556-2821}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+The theory also introduces the concept of spacetime, merging three spatial dimensions with time into a four-dimensional continuum. This framework provides a more comprehensive understanding of how different observers perceive space and time, especially when approaching the speed of light.\u003cref\u003e{{Cite journal |date=1908-10-03 |title=SOCIETY OF GERMAN SCIENTISTS AND MEDICAL MEN |url=https:\u002f\u002fdoi.org\u002f10.1136\u002fbmj.2.2492.1018 |journal=BMJ |volume=2 |issue=2492 |pages=1018\u20131020 |doi=10.1136\u002fbmj.2.2492.1018 |issn=0959-8138}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+While Special Relativity addresses the physics of objects in uniform motion, it does not encompass gravitational effects. Einstein extended these principles in his General Theory of Relativity, which offers a geometric interpretation of gravitation and applies to accelerated frames of reference.\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1916-01 |title=Die Grundlage der allgemeinen Relativit\u00e4tstheorie |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19163540702 |journal=Annalen der Physik |volume=354 |issue=7 |pages=769\u2013822 |doi=10.1002\u002fandp.19163540702 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the hitherto laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e \u003cbr\u003e-Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e+Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\"\u003e{{Cite book |last=Griffiths |first=David J. |author-link=David J. Griffiths |title=Introduction to Electrodynamics |title-link=Introduction to Electrodynamics |publisher=Pearson |year=2013 |isbn=978-0-321-85656-2 |edition=4th |at=Chapter 12 |chapter=Electrodynamics and Relativity}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book |last=Jackson |first=John D. |author-link=John David Jackson (physicist) |title=Classical Electrodynamics |title-link=Classical Electrodynamics (book) |publisher=John Wiley & Sons |year=1999 |isbn=0-471-30932-X |edition=3rd |at=Chapter 11 |chapter=Special Theory of Relativity}}\u003c\u002fref\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e ","--- Revision 33\u003cbr\u003e+++ Revision 34\u003cbr\u003e@@ -1,5 +1,6 @@\u003cbr\u003e {{short description|Theory of interwoven space and time by Albert Einstein}}\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]Special Relativity, introduced by Albert Einstein in 1905, fundamentally transformed our understanding of space, time, and energy. This theory is built upon two central postulates:\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1905-01 |title=Zur Elektrodynamik bewegter K\u00f6rper |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19053221004 |journal=Annalen der Physik |volume=322 |issue=10 |pages=891\u2013921 |doi=10.1002\u002fandp.19053221004 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e+One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 34\u003cbr\u003e+++ Revision 35\u003cbr\u003e@@ -1,6 +1,8 @@\u003cbr\u003e {{short description|Theory of interwoven space and time by Albert Einstein}}\u003cbr\u003e [[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]Special Relativity, introduced by Albert Einstein in 1905, fundamentally transformed our understanding of space, time, and energy. This theory is built upon two central postulates:\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1905-01 |title=Zur Elektrodynamik bewegter K\u00f6rper |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19053221004 |journal=Annalen der Physik |volume=322 |issue=10 |pages=891\u2013921 |doi=10.1002\u002fandp.19053221004 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e-One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+# Theory of relativity: the laws of physics are identical in all inertial frame of reference.\u003cbr\u003e+# Constancy of speed of light: The speed of light in a vacuum is constant, irrespective of the observer's motion or the light source.\u003cbr\u003e \u003cbr\u003e One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 35\u003cbr\u003e+++ Revision 36\u003cbr\u003e@@ -13,6 +13,8 @@\u003cbr\u003e While Special Relativity addresses the physics of objects in uniform motion, it does not encompass gravitational effects. Einstein extended these principles in his General Theory of Relativity, which offers a geometric interpretation of gravitation and applies to accelerated frames of reference.\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1916-01 |title=Die Grundlage der allgemeinen Relativit\u00e4tstheorie |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19163540702 |journal=Annalen der Physik |volume=354 |issue=7 |pages=769\u2013822 |doi=10.1002\u002fandp.19163540702 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the hitherto laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e+\u003cbr\u003e+== Traditional \"History\"  of special relativity  \u003cspan class=\"anchor\" id=\"History\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e \u003cbr\u003e Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\"\u003e{{Cite book |last=Griffiths |first=David J. |author-link=David J. Griffiths |title=Introduction to Electrodynamics |title-link=Introduction to Electrodynamics |publisher=Pearson |year=2013 |isbn=978-0-321-85656-2 |edition=4th |at=Chapter 12 |chapter=Electrodynamics and Relativity}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book |last=Jackson |first=John D. |author-link=John David Jackson (physicist) |title=Classical Electrodynamics |title-link=Classical Electrodynamics (book) |publisher=John Wiley & Sons |year=1999 |isbn=0-471-30932-X |edition=3rd |at=Chapter 11 |chapter=Special Theory of Relativity}}\u003c\u002fref\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e ","--- Revision 36\u003cbr\u003e+++ Revision 37\u003cbr\u003e@@ -1,22 +1,17 @@\u003cbr\u003e {{short description|Theory of interwoven space and time by Albert Einstein}}\u003cbr\u003e-[[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]Special Relativity, introduced by Albert Einstein in 1905, fundamentally transformed our understanding of space, time, and energy. This theory is built upon two central postulates:\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1905-01 |title=Zur Elektrodynamik bewegter K\u00f6rper |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19053221004 |journal=Annalen der Physik |volume=322 |issue=10 |pages=891\u2013921 |doi=10.1002\u002fandp.19053221004 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-# Theory of relativity: the laws of physics are identical in all inertial frame of reference.\u003cbr\u003e-# Constancy of speed of light: The speed of light in a vacuum is constant, irrespective of the observer's motion or the light source.\u003cbr\u003e-\u003cbr\u003e-One of the most renowned outcomes of Special Relativity is the mass-energy equivalence principle, encapsulated in the equation E=mc\u00b2. This formula indicates that mass and energy are interchangeable, laying the groundwork for nuclear energy and particle physics.\u003cref\u003e{{Cite journal |last=Nordstrom |first=Thomas |date=2021-03-27 |title=Does the Inertia of a Body Really Depend Upon its Energy-Content? |url=https:\u002f\u002fdoi.org\u002f10.21275\u002fsr21301171354 |journal=International Journal of Science and Research (IJSR) |volume=10 |issue=3 |pages=100\u2013101 |doi=10.21275\u002fsr21301171354 |issn=2319-7064}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-Special Relativity has undergone extensive experimental validation. Time dilation, a phenomenon where moving clocks tick slower than stationary ones, has been confirmed through observations of muon decay rates and precise measurements involving high-speed particles. Additionally, the invariance of the speed of light has been corroborated by various experiments, including the Michelson-Morley experiment and its modern adaptations.\u003cref\u003e{{Cite journal |last=Will |first=Clifford M. |date=1992-01-15 |title=Clock synchronization and isotropy of the one-way speed of light |url=https:\u002f\u002fdoi.org\u002f10.1103\u002fphysrevd.45.403 |journal=Physical Review D |volume=45 |issue=2 |pages=403\u2013411 |doi=10.1103\u002fphysrevd.45.403 |issn=0556-2821}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-The theory also introduces the concept of spacetime, merging three spatial dimensions with time into a four-dimensional continuum. This framework provides a more comprehensive understanding of how different observers perceive space and time, especially when approaching the speed of light.\u003cref\u003e{{Cite journal |date=1908-10-03 |title=SOCIETY OF GERMAN SCIENTISTS AND MEDICAL MEN |url=https:\u002f\u002fdoi.org\u002f10.1136\u002fbmj.2.2492.1018 |journal=BMJ |volume=2 |issue=2492 |pages=1018\u20131020 |doi=10.1136\u002fbmj.2.2492.1018 |issn=0959-8138}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-While Special Relativity addresses the physics of objects in uniform motion, it does not encompass gravitational effects. Einstein extended these principles in his General Theory of Relativity, which offers a geometric interpretation of gravitation and applies to accelerated frames of reference.\u003cref\u003e{{Cite journal |last=Einstein |first=A. |date=1916-01 |title=Die Grundlage der allgemeinen Relativit\u00e4tstheorie |url=https:\u002f\u002fdoi.org\u002f10.1002\u002fandp.19163540702 |journal=Annalen der Physik |volume=354 |issue=7 |pages=769\u2013822 |doi=10.1002\u002fandp.19163540702 |issn=0003-3804}}\u003c\u002fref\u003e\u003cbr\u003e+[[File:Einstein patentoffice.jpg|thumb|[[Albert Einstein]] around 1905, the year his \"[[Annus Mirabilis papers|''Annus Mirabilis'' papers]]\" were published. These included ''Zur Elektrodynamik bewegter K\u00f6rper''\u003c!-- (\"On the Electrodynamics of Moving Bodies\")--\u003e, the paper founding special relativity.]]\u003cbr\u003e+{{Special relativity sidebar}}\u003cbr\u003e+\u003cbr\u003e+In [[physics]], the '''special theory of relativity''', or '''special relativity''' for short, is a scientific theory of the relationship between [[Spacetime|space and time]]. In [[Albert Einstein]]'s 1905 paper, [[Annus Mirabilis papers#Special relativity|On the Electrodynamics of Moving Bodies]], the theory is presented as being based on just [[Postulates of special relativity|two postulates]]:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cref name=\"Griffiths-2013\"\u003e{{Cite book | last = Griffiths | first = David J. | title = Introduction to Electrodynamics | title-link = Introduction to Electrodynamics | publisher = Pearson | year = 2013 | isbn = 978-0-321-85656-2 | edition = 4th | at = Chapter 12 | chapter = Electrodynamics and Relativity | author-link = David J. Griffiths}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book | last = Jackson | first = John D. | title = Classical Electrodynamics | title-link = Classical Electrodynamics (book) | publisher = John Wiley & Sons | year = 1999 | isbn = 0-471-30932-X | edition = 3rd | at = Chapter 11 |chapter = Special Theory of Relativity | author-link = John David Jackson (physicist)}}\u003c\u002fref\u003e\u003cbr\u003e+# The [[laws of physics]] are [[Invariant (physics)|invariant]] (identical) in all [[Inertial frame of reference|inertial frames of reference]] (that is, [[Frame of reference|frames of reference]] with no [[acceleration]]). This is known as the [[principle of relativity]].\u003cbr\u003e+# The [[speed of light]] in [[vacuum]] is the same for all observers, regardless of the motion of light source or observer. This is known as the principle of light constancy, or the principle of light speed invariance.\u003cbr\u003e+The first postulate was first formulated by [[Galileo Galilei]] (see ''[[Galilean invariance]]'').\u003cbr\u003e+\u003cbr\u003e+== Origins and significance ==\u003cbr\u003e {{Main|History of special relativity}}\u003cbr\u003e Special relativity was described by Albert Einstein in a paper published on 26 September 1905 titled \"On the Electrodynamics of Moving Bodies\".\u003cref name=\"electro\" group=\"p\"\u003e[[Albert Einstein]] (1905) \"[https:\u002f\u002fweb.archive.org\u002fweb\u002f20050220050316\u002fhttp:\u002f\u002fwww.pro-physik.de\u002fPhy\u002fpdfs\u002fger_890_921.pdf ''Zur Elektrodynamik bewegter K\u00f6rper'']\", ''Annalen der Physik'' 17: 891; English translation [http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fspecrel\u002fwww\u002f On the Electrodynamics of Moving Bodies] by [[George Barker Jeffery]] and Wilfrid Perrett (1923); Another English translation [[s:On the Electrodynamics of Moving Bodies|On the Electrodynamics of Moving Bodies]] by [[Megh Nad Saha]] (1920).\u003c\u002fref\u003e [[Maxwell's equations]] of [[electromagnetism]] appeared to be incompatible with [[Newtonian mechanics]], and the [[Michelson\u2013Morley experiment]] failed to detect the Earth's motion against the hypothesized [[luminiferous aether]]. These led to the development of the [[Lorentz transformations]], by [[Hendrik Lorentz]], which adjust distances and times for moving objects. Special relativity corrects the hitherto laws of mechanics to handle situations involving all motions and especially those at a speed close to that of light (known as ''{{vanchor|relativistic velocities|relativistic velocity}}''). Today, special relativity is proven to be the most accurate model of motion at any speed when gravitational and quantum effects are negligible.\u003cref\u003e{{cite book |last=Goldstein |first=Herbert |title=Classical Mechanics |title-link=Classical Mechanics (Goldstein book) |publisher=Addison-Wesley Publishing Company |year=1980 |isbn=0-201-02918-9 |edition=2nd |chapter=Chapter 7: Special Relativity in Classical Mechanics |author-link=Herbert Goldstein }}\u003c\u002fref\u003e\u003cref name=\"Lanczos-1970\"\u003e{{Cite book|last=Lanczos |first=Cornelius |title=The Variational Principles of Mechanics |publisher=Dover Publications |year=1970 |isbn=978-0-486-65067-8 |edition=4th |chapter=Chapter IX: Relativistic Mechanics |author-link=Cornelius Lanczos }}\u003c\u002fref\u003e Even so, the Newtonian model is still valid as a simple and accurate approximation at low velocities (relative to the speed of light), for example, everyday motions on Earth.\u003cbr\u003e \u003cbr\u003e-== Traditional \"History\"  of special relativity  \u003cspan class=\"anchor\" id=\"History\"\u003e\u003c\u002fspan\u003e ==\u003cbr\u003e-\u003cbr\u003e-Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\"\u003e{{Cite book |last=Griffiths |first=David J. |author-link=David J. Griffiths |title=Introduction to Electrodynamics |title-link=Introduction to Electrodynamics |publisher=Pearson |year=2013 |isbn=978-0-321-85656-2 |edition=4th |at=Chapter 12 |chapter=Electrodynamics and Relativity}}\u003c\u002fref\u003e\u003cref name=\"Jackson-1999\"\u003e{{Cite book |last=Jackson |first=John D. |author-link=John David Jackson (physicist) |title=Classical Electrodynamics |title-link=Classical Electrodynamics (book) |publisher=John Wiley & Sons |year=1999 |isbn=0-471-30932-X |edition=3rd |at=Chapter 11 |chapter=Special Theory of Relativity}}\u003c\u002fref\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e+Special relativity has a wide range of consequences that have been experimentally verified.\u003cref\u003e{{cite web |url=http:\u002f\u002fwww.edu-observatory.org\u002fphysics-faq\u002fRelativity\u002fSR\u002fexperiments.html |title=What is the experimental basis of Special Relativity? |access-date=2008-09-17 |author1=Tom Roberts |author2=Siegmar Schleif |name-list-style=amp |date=October 2007 |work=Usenet Physics FAQ}}\u003c\u002fref\u003e These include the [[relativity of simultaneity]], [[length contraction]], [[time dilation]], the relativistic velocity addition formula, the relativistic [[Doppler effect]], [[Mass in special relativity|relativistic mass]], [[Speed of light#Upper limit on speeds|a universal speed limit]], [[mass\u2013energy equivalence]], the speed of causality and the [[Thomas precession]].\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e It has, for example, replaced the conventional notion of an absolute universal time with the notion of a time that is dependent on reference frame and [[Space|spatial]] position. Rather than an invariant time interval between two events, there is an invariant [[spacetime interval]]. Combined with other laws of physics, the two postulates of special relativity predict the equivalence of [[mass]] and [[energy]], as expressed in the [[mass\u2013energy equivalence]] formula {{tmath|1= E = mc^2 }}, where \u003cmath\u003ec\u003c\u002fmath\u003e is the [[speed of light]] in vacuum.\u003cref name=\"relativity\"\u003e{{cite book |author=Albert Einstein |title=Relativity: The Special and the General Theory |page= 48 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=idb7wJiB6SsC&pg=PA50 |isbn=978-0-415-25384-0 |publisher=Routledge |date=2001 |edition=Reprint of 1920 translation by Robert W. Lawson}}\u003c\u002fref\u003e\u003cref name=\"Feynman\"\u003e[https:\u002f\u002ffeynmanlectures.caltech.edu\u002fI_15.html#Ch15-S9 The Feynman Lectures on Physics Vol. I Ch. 15-9: Equivalence of mass and energy]\u003c\u002fref\u003e It also explains how the phenomena of electricity and magnetism are related.\u003cref name=\"Griffiths-2013\" \u002f\u003e\u003cref name=\"Jackson-1999\" \u002f\u003e\u003cbr\u003e \u003cbr\u003e A defining feature of special relativity is the replacement of the [[Galilean transformation]]s of Newtonian mechanics with the [[Lorentz transformation]]s. Time and space cannot be defined separately from each other (as was previously thought to be the case). Rather, space and time are interwoven into [[Spacetime|a single continuum known as \"spacetime\"]]. Events that occur at the same time for one observer can occur at different times for another.\u003cbr\u003e ","--- Revision 37\u003cbr\u003e+++ Revision 38\u003cbr\u003e@@ -439,7 +439,7 @@\u003cbr\u003e Scientists make a fundamental distinction between ''measurement'' or ''observation'' on the one hand, versus ''visual appearance'', or what one ''sees''. The measured shape of an object is a hypothetical snapshot of all of the object's points as they exist at a single moment in time. But the visual appearance of an object is affected by the varying lengths of time that light takes to travel from different points on the object to one's eye.\u003cbr\u003e \u003cbr\u003e [[File:Terrell Rotation Sphere.gif|thumb|330px|Figure 5\u20135. Comparison of the measured length contraction of a globe versus its visual appearance, as viewed from a distance of three diameters of the globe from the eye to the red cross.]]\u003cbr\u003e-For many years, the distinction between the two had not been generally appreciated, and it had generally been thought that a length contracted object passing by an observer would in fact actually be ''seen'' as length contracted. In 1959, James Terrell and [[Roger Penrose]] independently pointed out that differential time lag effects in signals reaching the observer from the different parts of a moving object result in a fast moving object's visual appearance being quite different from its measured shape. For example, a receding object would ''appear'' contracted, an approaching object would ''appear'' elongated, and a passing object would have a skew appearance that has been likened to a rotation.\u003cref name=\"Terrell\" group=p\u003e{{cite journal |last1=Terrell |first1=James |title=Invisibility of the Lorentz Contraction |journal=[[Physical Review]] |date=15 November 1959 |volume=116 |issue=4 |pages=1041\u20131045 |doi=10.1103\u002fPhysRev.116.1041 |bibcode=1959PhRv..116.1041T }}\u003c\u002fref\u003e\u003cref name=\"Penrose\" group=p\u003e{{cite journal |last1=Penrose |first1=Roger |title=The Apparent Shape of a Relativistically Moving Sphere |journal=[[Proceedings of the Cambridge Philosophical Society |Mathematical Proceedings of the Cambridge Philosophical Society]] |date=24 October 2008 |vol
