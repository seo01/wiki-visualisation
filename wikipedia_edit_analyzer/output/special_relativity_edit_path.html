\u002fhttp:\u002f\u002fwww.spacetimetravel.org\u002ffussball\u002ffussball.html |archive-date=12 May 2017 |url-status=dead }}\u003c\u002fref\u003e\u003cref name=\"Boas_1961\"\u003e{{cite journal |last1=Boas |first1=Mary L. |title=Apparent Shape of Large Objects at Relativistic Speeds |journal=American Journal of Physics |date=1961 |volume=29 |issue=5 |page=283 |doi=10.1119\u002f1.1937751|bibcode=1961AmJPh..29..283B }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-[[File:M87 jet (1).jpg|thumb|Figure 5\u20136. Galaxy [[Messier 87|M87]] sends out a black-hole-powered jet of electrons and other sub-atomic particles traveling at nearly the speed of light.]]\u003cbr\u003e+For many years, the distinction between the two had not been generally appreciated, and it had generally been thought that a length contracted object passing by an observer would in fact actually be ''seen'' as length contracted. In 1959, James Terrell and [[Roger Penrose]] independently pointed out that differential time lag effects in signals reaching the observer from the different parts of a moving object result in a fast moving object's visual appearance being quite different from its measured shape. For example, a receding object would ''appear'' contracted, an approaching object would ''appear'' elongated, and a passing object would have a skew appearance that has been likened to a rotation.\u003cref name=\"Terrell\" group=p\u003e{{cite journal|last1=Terrell|first1=James|title=Invisibility of the Lorentz Contraction|journal=[[Physical Review]]|date=15 November 1959|volume=116|issue=4|pages=1041\u20131045|doi=10.1103\u002fPhysRev.116.1041|bibcode=1959PhRv..116.1041T}}\u003c\u002fref\u003e\u003cref name=\"Penrose\" group=p\u003e{{cite journal|last1=Penrose|first1=Roger|title=The Apparent Shape of a Relativistically Moving Sphere|journal=[[Proceedings of the Cambridge Philosophical Society|Mathematical Proceedings of the Cambridge Philosophical Society]]|date=24 October 2008|volume=55|issue=1|pages=137\u2013139|doi=10.1017\u002fS0305004100033776|bibcode=1959PCPS...55..137P|s2cid=123023118 }}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Cook|first1=Helen|title=Relativistic Distortion|url=http:\u002f\u002fwww.math.ubc.ca\u002f~cass\u002fcourses\u002fm309-01a\u002fcook\u002f|publisher=Mathematics Department, University of British Columbia|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Signell|first1=Peter|title=Appearances at Relativistic Speeds|url=https:\u002f\u002fstuff.mit.edu\u002fafs\u002fathena\u002fcourse\u002f8\u002f8.20\u002fwww\u002fm44.pdf|website=Project PHYSNET|publisher=Michigan State University, East Lansing, MI|access-date=12 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170413153459\u002fhttps:\u002f\u002fstuff.mit.edu\u002fafs\u002fathena\u002fcourse\u002f8\u002f8.20\u002fwww\u002fm44.pdf|archive-date=13 April 2017|url-status=dead}}\u003c\u002fref\u003e A sphere in motion retains the circular outline for all speeds, for any distance, and for all view angles, although\u003cbr\u003e+the surface of the sphere and the images on it will appear distorted.\u003cref\u003e{{cite web|last1=Kraus|first1=Ute|title=The Ball is Round|url=http:\u002f\u002fwww.spacetimetravel.org\u002ffussball\u002ffussball.html|website=Space Time Travel: Relativity visualized|publisher=Institut f\u00fcr Physik Universit\u00e4t Hildesheim|access-date=16 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170512165032\u002fhttp:\u002f\u002fwww.spacetimetravel.org\u002ffussball\u002ffussball.html|archive-date=12 May 2017|url-status=dead}}\u003c\u002fref\u003e\u003cref name=\"Boas_1961\"\u003e{{cite journal |last1=Boas |first1=Mary L. |title=Apparent Shape of Large Objects at Relativistic Speeds |journal=American Journal of Physics |date=1961 |volume=29 |issue=5 |page=283 |doi=10.1119\u002f1.1937751|bibcode=1961AmJPh..29..283B }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+[[File:M87 jet (1).jpg|thumb|Figure 5-6. Galaxy [[Messier 87|M87]] sends out a black-hole-powered jet of electrons and other sub-atomic particles traveling at nearly the speed of light.]]\u003cbr\u003e Both Fig.&nbsp;5-4 and Fig.&nbsp;5-5 illustrate objects moving transversely to the line of sight. In Fig.&nbsp;5-4, a cube is viewed from a distance of four times the length of its sides. At high speeds, the sides of the cube that are perpendicular to the direction of motion appear hyperbolic in shape. The cube is actually not rotated. Rather, light from the rear of the cube takes longer to reach one's eyes compared with light from the front, during which time the cube has moved to the right. At high speeds, the sphere in Fig.&nbsp;5-5 takes on the appearance of a flattened disk tilted up to 45\u00b0 from the line of sight. If the objects' motions are not strictly transverse but instead include a longitudinal component, exaggerated distortions in perspective may be seen.\u003cref name=\"Muller_2014\"\u003e{{cite journal |last1=M\u00fcller |first1=Thomas |last2=Boblest |first2=Sebastian |title=Visual appearance of wireframe objects in special relativity |journal=European Journal of Physics |date=2014 |volume=35 |issue=6 |page=065025 |doi=10.1088\u002f0143-0807\u002f35\u002f6\u002f065025|arxiv=1410.4583 |bibcode=2014EJPh...35f5025M |s2cid=118498333 }}\u003c\u002fref\u003e This illusion has come to be known as ''[[Terrell rotation]]'' or the ''Terrell\u2013Penrose effect''.\u003cref group=note\u003eEven though it has been many decades since Terrell and Penrose published their observations, popular writings continue to conflate measurement versus appearance. For example, Michio Kaku wrote in ''Einstein's Cosmos'' (W. W. Norton & Company, 2004. p. 65): \"...&nbsp;imagine that the speed of light is only 20 miles per hour. If a car were to go down the street, it might look compressed in the direction of motion, being squeezed like an accordion down to perhaps 1 inch in length.\"\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another example where visual appearance is at odds with measurement comes from the observation of apparent [[superluminal motion]] in various [[radio galaxies]], [[BL Lac objects]], [[quasars]], and other astronomical objects that eject [[astrophysical jet|relativistic-speed jets]] of matter at narrow angles with respect to the viewer. An apparent optical illusion results giving the appearance of faster than light travel.\u003cref\u003e{{cite book|last1=Zensus|first1=J. Anton|last2=Pearson|first2=Timothy J.|title=Superluminal Radio Sources|date=1987|publisher=Cambridge University Press|location=Cambridge, New York|isbn=9780521345606|page=3|edition=1st}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Chase|first1=Scott I.|title=Apparent Superluminal Velocity of Galaxies|url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSpeedOfLight\u002fSuperluminal\u002fsuperluminal.html|website=The Original Usenet Physics FAQ|publisher=Department of Mathematics, University of California, Riverside|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Richmond|first1=Michael|title=\"Superluminal\" motions in astronomical sources|url=http:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe \u2013 WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e+Another example where visual appearance is at odds with measurement comes from the observation of apparent [[superluminal motion]] in various [[radio galaxies]], [[BL Lac objects]], [[quasars]], and other astronomical objects that eject [[astrophysical jet|relativistic-speed jets]] of matter at narrow angles with respect to the viewer. An apparent optical illusion results giving the appearance of faster than light travel.\u003cref\u003e{{cite book|last1=Zensus|first1=J. Anton|last2=Pearson|first2=Timothy J.|title=Superluminal Radio Sources|date=1987|publisher=Cambridge University Press|location=Cambridge, New York|isbn=9780521345606|page=3|edition=1st}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Chase|first1=Scott I.|title=Apparent Superluminal Velocity of Galaxies|url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSpeedOfLight\u002fSuperluminal\u002fsuperluminal.html|website=The Original Usenet Physics FAQ|publisher=Department of Mathematics, University of California, Riverside|access-date=12 April 2017}}\u003c\u002fref\u003e\u003cref\u003e{{cite web|last1=Richmond|first1=Michael|title=\"Superluminal\" motions in astronomical sources|url=http:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|website=Physics 200 Lecture Notes|publisher=School of Physics and Astronomy, Rochester Institute of Technology|access-date=20 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170216155045\u002fhttp:\u002f\u002fspiff.rit.edu\u002fclasses\u002fphys200\u002flectures\u002fsuperlum\u002fsuperlum.html|archive-date=16 February 2017|url-status=dead}}\u003c\u002fref\u003e In Fig.&nbsp;5-6, galaxy [[Messier 87|M87]] streams out a high-speed jet of subatomic particles almost directly towards us, but Penrose\u2013Terrell rotation causes the jet to appear to be moving laterally in the same manner that the appearance of the cube in Fig.&nbsp;5-4 has been stretched out.\u003cref\u003e{{cite web|last1=Keel|first1=Bill|title=Jets, Superluminal Motion, and Gamma-Ray Bursts|url=http:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|website=Galaxies and the Universe - WWW Course Notes|publisher=Department of Physics and Astronomy, University of Alabama|access-date=29 April 2017|archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20170301030027\u002fhttp:\u002f\u002fpages.astronomy.ua.edu\u002fkeel\u002fgalaxies\u002fjets.html|archive-date=1 March 2017|url-status=dead}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Dynamics ==\u003cbr\u003e-Section ''{{slink|#Consequences derived from the Lorentz transformation}}'' dealt strictly with [[kinematics]], the study of the motion of points, bodies, and systems of bodies without considering the forces that caused the motion. This section discusses masses, forces, energy and so forth, and as such requires consideration of physical effects beyond those encompassed by the Lorentz transformation itself.\u003cbr\u003e+Section [[#Consequences derived from the Lorentz transformation|''Consequences derived from the Lorentz transformation'']] dealt strictly with [[kinematics]], the study of the motion of points, bodies, and systems of bodies without considering the forces that caused the motion. This section discusses masses, forces, energy and so forth, and as such requires consideration of physical effects beyond those encompassed by the Lorentz transformation itself.\u003cbr\u003e \u003cbr\u003e === Equivalence of mass and energy ===\u003cbr\u003e {{Main|Mass\u2013energy equivalence}}\u003cbr\u003e \u003cbr\u003e-Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component, which is the energy, and three space components, which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e+As an object's speed approaches the speed of light from an observer's point of view, its [[relativistic mass]] increases thereby making it more and more difficult to accelerate it from within the observer's frame of reference.\u003cbr\u003e+\u003cbr\u003e+The energy content of an object at rest with mass ''m'' equals ''mc''\u003csup\u003e2\u003c\u002fsup\u003e. Conservation of energy implies that, in any reaction, a decrease of the sum of the masses of particles must be accompanied by an increase in kinetic energies of the particles after the reaction. Similarly, the mass of an object can be increased by taking in kinetic energies.\u003cbr\u003e+\u003cbr\u003e+In addition to the papers referenced above\u2014which give derivations of the Lorentz transformation and describe the foundations of special relativity\u2014Einstein also wrote at least four papers giving [[heuristic]] arguments for the equivalence (and transmutability) of mass and energy, for {{nowrap|1=''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e}}.\u003cbr\u003e+\u003cbr\u003e+Mass\u2013energy equivalence is a consequence of special relativity. The energy and momentum, which are separate in Newtonian mechanics, form a [[four-vector]] in relativity, and this relates the time component (the energy) to the space components (the momentum) in a non-trivial way. For an object at rest, the energy\u2013momentum four-vector is {{nowrap|(''E''\u002f''c'', 0, 0, 0)}}: it has a time component which is the energy, and three space components which are zero. By changing frames with a Lorentz transformation in the x direction with a small value of the velocity v, the energy momentum four-vector becomes {{nowrap|(''E''\u002f''c'', ''Ev''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e, 0, 0)}}. The momentum is equal to the energy multiplied by the velocity divided by ''c''\u003csup\u003e2\u003c\u002fsup\u003e. As such, the Newtonian mass of an object, which is the ratio of the momentum to the velocity for slow velocities, is equal to ''E''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\u003cbr\u003e \u003cbr\u003e The energy and momentum are properties of matter and radiation, and it is impossible to deduce that they form a four-vector just from the two basic postulates of special relativity by themselves, because these do not talk about matter or radiation, they only talk about space and time. The derivation therefore requires some additional physical reasoning. In his 1905 paper, Einstein used the additional principles that Newtonian mechanics should hold for slow velocities, so that there is one energy scalar and one three-vector momentum at slow velocities, and that the conservation law for energy and momentum is exactly true in relativity. Furthermore, he assumed that the energy of light is transformed by the same Doppler-shift factor as its frequency, which he had previously shown to be true based on Maxwell's equations.\u003cref name=electro group=p\u002f\u003e The first of Einstein's papers on this subject was \"Does the Inertia of a Body Depend upon its Energy Content?\" in 1905.\u003cref name=inertia group=p\u003e[http:\u002f\u002fwww.fourmilab.ch\u002fetexts\u002feinstein\u002fE_mc2\u002fwww\u002f Does the inertia of a body depend upon its energy content?] A. Einstein, ''Annalen der Physik''. '''18''':639, 1905 (English translation by W. Perrett and G.B. Jeffery)\u003c\u002fref\u003e Although Einstein's argument in this paper is nearly universally accepted by physicists as correct, even self-evident, many authors over the years have suggested that it is wrong.\u003cref name=Jammer\u003e{{cite book |title=Concepts of Mass in Classical and Modern Physics |author=[[Max Jammer]] |pages=177\u2013178 |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=lYvz0_8aGsMC&pg=PA177 |isbn=978-0-486-29998-3 |publisher=Courier Dover Publications |date=1997 }}\u003c\u002fref\u003e Other authors suggest that the argument was merely inconclusive because it relied on some implicit assumptions.\u003cref name= Stachel\u003e{{cite book |title=Einstein from ''B'' to ''Z'' |page= 221 |author=John J. Stachel |url=https:\u002f\u002fbooks.google.com\u002fbooks?id=OAsQ_hFjhrAC&pg=PA215 |isbn=978-0-8176-4143-6 |publisher=Springer |date=2002}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -473,10 +484,10 @@\u003cbr\u003e  | image2            = Einstein's derivation of E=mc2.svg\u003cbr\u003e  | caption2          = Figure 6-1. Einstein's 1905 derivation of ''E'' = ''mc''\u003csup\u003e2\u003c\u002fsup\u003e\u003cbr\u003e }}\u003cbr\u003e-Fig. 6-1 (top). Consider a system of plane waves of light having frequency \u003cmath\u003ef\u003c\u002fmath\u003e traveling in direction \u003cmath\u003e\\phi\u003c\u002fmath\u003e relative to the x-axis of reference frame ''S''. The frequency (and hence energy) of the waves as measured in frame {{prime|''S''}} that is moving along the x-axis at velocity \u003cmath\u003ev\u003c\u002fmath\u003e is given by the relativistic Doppler shift formula that Einstein had developed in his 1905 paper on special relativity:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cbr\u003e-: \u003cmath\u003e \\frac{f'}{f} = \\frac{1 - (v\u002fc) \\cos{\\phi}}{\\sqrt{1 - v^2\u002fc^2}} \u003c\u002fmath\u003e\u003cbr\u003e-\u003cbr\u003e-Fig. 6-1 (bottom). Consider an arbitrary body that is stationary in reference frame ''S''. Let this body emit a pair of equal-energy light-pulses in opposite directions at angle \u003cmath\u003e\\phi\u003c\u002fmath\u003e with respect to the x-axis. Each pulse has energy {{tmath|1= L\u002f2 }}. Because of conservation of momentum, the body remains stationary in ''S'' after emission of the two pulses. Let \u003cmath\u003eE_0\u003c\u002fmath\u003e be the energy of the body before emission of the two pulses and \u003cmath\u003eE_1\u003c\u002fmath\u003e after their emission.\u003cbr\u003e+Fig. 6-1 (top). Consider a system of plane waves of light having frequency \u003cmath\u003ef\u003c\u002fmath\u003e traveling in direction \u003cmath\u003e\\phi\u003c\u002fmath\u003e relative to the x-axis of reference frame ''S''. The frequency (and hence energy) of the waves as measured in frame {{prime|''S''}} that is moving along the x-axis at velocity \u003cmath\u003ev\u003c\u002fmath\u003e is given by the relativistic Doppler shift formula which Einstein had developed in his 1905 paper on special relativity:\u003cref name=\"electro\" group=\"p\"\u002f\u003e\u003cbr\u003e+: \u003cmath\u003e \\frac{f'}{f} = \\frac{1 - (v\u002fc) \\cos{\\phi}}{\\sqrt{1 - v^2\u002fc^2}}    \u003c\u002fmath\u003e\u003cbr\u003e+\u003cbr\u003e+Fig. 6-1 (bottom). Consider an arbitrary body that is stationary in reference frame ''S''. Let this body emit a pair of equal-energy light-pulses in opposite directions at angle \u003cmath\u003e\\phi\u003c\u002fmath\u003e with respect to the x-axis. Each pulse has energy \u003cmath\u003eL\u002f2\u003c\u002fmath\u003e. Because of conservation of momentum, the body remains stationary in ''S'' after emission of the two pulses. Let \u003cmath\u003eE_0\u003c\u002fmath\u003e be the energy of the body before emission of the two pulses and \u003cmath\u003eE_1\u003c\u002fmath\u003e after their emission.\u003cbr\u003e \u003cbr\u003e Next, consider the same system observed from frame {{prime|''S''}} that is moving along the x-axis at speed \u003cmath\u003ev\u003c\u002fmath\u003e relative to frame ''S''. In this frame, light from the forwards and reverse pulses will be relativistically Doppler-shifted. Let \u003cmath\u003eH_0\u003c\u002fmath\u003e be the energy of the body measured in reference frame {{prime|''S''}} before emission of the two pulses and \u003cmath\u003eH_1\u003c\u002fmath\u003e after their emission. We obtain the following relationships:\u003cref name=inertia group=p\u002f\u003e\u003cbr\u003e : \u003cmath\u003e\\begin{align}\u003cbr\u003e@@ -485,27 +496,21 @@\u003cbr\u003e \\end{align}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e From the above equations, we obtain the following:\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad (H_0 - E_0) - (H_1 - E_1)  = L \\left( \\frac{1}{\\sqrt{1 - v^2\u002fc^2}}  - 1 \\right) \u003c\u002fmath\u003e  |6-1}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad (H_0 - E_0) - (H_1 - E_1)  = L \\left( \\frac{1}{\\sqrt{1 - v^2\u002fc^2}}  - 1 \\right) \u003c\u002fmath\u003e  |{{EquationRef|6-1}} }}\u003cbr\u003e \u003cbr\u003e The two differences of form \u003cmath\u003e H - E \u003c\u002fmath\u003e seen in the above equation have a straightforward physical interpretation. Since \u003cmath\u003eH\u003c\u002fmath\u003e and \u003cmath\u003eE\u003c\u002fmath\u003e are the energies of the arbitrary body in the moving and stationary frames, \u003cmath\u003e H_0 - E_0 \u003c\u002fmath\u003e and \u003cmath\u003eH_1 - E_1\u003c\u002fmath\u003e represents the kinetic energies of the bodies before and after the emission of light (except for an additive constant that fixes the zero point of energy and is conventionally set to zero). Hence,\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad K_0 - K_1  = L \\left( \\frac{1}{\\sqrt{1 - v^2\u002fc^2}}  - 1 \\right) \u003c\u002fmath\u003e  |6-2}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad K_0 - K_1  = L \\left( \\frac{1}{\\sqrt{1 - v^2\u002fc^2}}  - 1 \\right) \u003c\u002fmath\u003e  |{{EquationRef|6-2}} }}\u003cbr\u003e \u003cbr\u003e Taking a Taylor series expansion and neglecting higher order terms, he obtained\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad K_0 - K_1 = \\frac{1}{2} \\frac{ L}{c^2} v^2 \u003c\u002fmath\u003e  |6-3}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad K_0 - K_1 = \\frac{1}{2} \\frac{ L}{c^2} v^2 \u003c\u002fmath\u003e  |{{EquationRef|6-3}} }}\u003cbr\u003e \u003cbr\u003e Comparing the above expression with the classical expression for kinetic energy, ''K.E.''&nbsp;=&nbsp;{{sfrac|1|2}}''mv''\u003csup\u003e2\u003c\u002fsup\u003e, Einstein then noted: \"If a body gives off the energy ''L'' in the form of radiation, its mass diminishes by ''L''\u002f''c''\u003csup\u003e2\u003c\u002fsup\u003e.\"\u003cbr\u003e \u003cbr\u003e Rindler has observed that Einstein's heuristic argument suggested merely that energy ''contributes'' to mass. In 1905, Einstein's cautious expression of the mass\u2013energy relationship allowed for the possibility that \"dormant\" mass might exist that would remain behind after all the energy of a body was removed. By 1907, however, Einstein was ready to assert that ''all'' inertial mass represented a reserve of energy. \"To equate ''all'' mass with energy required an act of aesthetic faith, very characteristic of Einstein.\"\u003cref name=\"Rindler0\"\u002f\u003e{{rp|81\u201384}} Einstein's bold hypothesis has been amply confirmed in the years subsequent to his original proposal.\u003cbr\u003e \u003cbr\u003e-For a variety of reasons, Einstein's original derivation is currently seldom taught. Besides the vigorous debate that continues until this day as to the formal correctness of his original derivation, the recognition of special relativity as being what Einstein called a \"principle theory\" has led to a shift away from reliance on electromagnetic phenomena to purely dynamic methods of proof.\u003cref name=\"Fernflores_2018\"\u003e{{cite book |last1=Fernflores |first1=Francisco |title=Einstein's Mass\u2013Energy Equation, Volume I: Early History and Philosophical Foundations |date=2018 |publisher=Momentum Pres |location=New York |isbn=978-1-60650-857-2}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== How far can you travel from the Earth? ===\u003cbr\u003e-{{See also|Space travel under constant acceleration}}\u003cbr\u003e-Since nothing can travel faster than light, one might conclude that a human can never travel farther from Earth than ~&nbsp;100 light years. You would easily think that a traveler would never be able to reach more than the few solar systems that exist within the limit of 100 light years from Earth.  However, because of time dilation, a hypothetical spaceship can travel thousands of light years during a passenger's lifetime. If a spaceship could be built that accelerates at a constant [[Gravity of Earth|1''g'']], it will, after one year, be travelling at almost the speed of light as seen from Earth. This is described by:\u003cbr\u003e-\u003cmath display=\"block\"\u003ev(t) = \\frac{at}{\\sqrt{1+ a^2t^2\u002fc^2}} ,\u003c\u002fmath\u003e\u003cbr\u003e-where ''v''(''t'') is the velocity at a time ''t'', ''a'' is the acceleration of the spaceship and ''t'' is the coordinate time as measured by people on Earth.\u003cref group=p\u003e{{cite web|url = http:\u002f\u002fwww.normalesup.org\u002f~baglio\u002fphysique\u002facceleration.pdf|title = Acceleration in special relativity: What is the meaning of \"uniformly accelerated movement\" ?|date = 26 May 2007|access-date = 22 January 2016|publisher = Physics Department, ENS Cachan|last = Baglio|first = Julien}}\u003c\u002fref\u003e Therefore, after one year of accelerating at 9.81&nbsp;m\u002fs\u003csup\u003e2\u003c\u002fsup\u003e, the spaceship will be travelling at {{nowrap|1=''v'' = 0.712 ''c''}} and {{nowrap|0.946 ''c''}} after three years, relative to Earth.  After three years of this acceleration, with the spaceship achieving a velocity of 94.6% of the speed of light relative to Earth, time dilation will result in each second experienced on the spaceship corresponding to 3.1 seconds back on Earth.  During their journey, people on Earth will experience more time than they do \u2013 since their clocks (all physical phenomena) would really be ticking 3.1 times faster than those of the spaceship. A 5-year round trip for the traveller will take 6.5 Earth years and cover a distance of over 6 light-years. A 20-year round trip for them (5 years accelerating, 5 decelerating, twice each) will land them back on Earth having travelled for 335 Earth years and a distance of 331 light years.\u003cref name=gibbskoks\u003e{{cite web|author1=Philip Gibbs |author2=Don Koks |name-list-style=amp |title=The Relativistic Rocket |url=http:\u002f\u002fmath.ucr.edu\u002fhome\u002fbaez\u002fphysics\u002fRelativity\u002fSR\u002fRocket\u002frocket.html |access-date=30 August 2012}}\u003c\u002fref\u003e A full 40-year trip at 1''g'' will appear on Earth to last 58,000 years and cover a distance of 55,000 light years. A 40-year trip at {{nowrap|1.1 ''g''}} will take {{val|148,000}} years and cover about {{val|140,000}} light years. A one-way 28 year (14 years accelerating, 14 decelerating as measured with the astronaut's clock) trip at 1''g'' acceleration could reach 2,000,000 light-years to the Andromeda Galaxy.\u003cref name=gibbskoks \u002f\u003e This same time dilation is why a muon travelling close to ''c'' is observed to travel much farther than ''c'' times its [[half-life]] (when at rest).\u003cref\u003e[http:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm The special theory of relativity shows that time and space are affected by motion] {{Webarchive|url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20121021183616\u002fhttp:\u002f\u002flibrary.thinkquest.org\u002fC0116043\u002fspecialtheorytext.htm |date=2012-10-21 }}. Library.thinkquest.org. Retrieved on 2013-04-24.\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Elastic collisions ===\u003cbr\u003e+For a variety of reasons, Einstein's original derivation is currently seldom taught. Besides the vigorous debate that continues until this day as to the formal correctness of his original derivation, the recognition of special relativity as being what Einstein called a \"principle theory\" has led to a shift away from reliance on electromagnetic phenomena to purely dynamic methods of proof.\u003cref name=\"Fernflores_2018\"\u003e{{cite book |last1=Fernflores |first1=Francisco |title=Einstein's Mass-Energy Equation, Volume I: Early History and Philosophical Foundations |date=2018 |publisher=Momentum Pres |location=New York |isbn=978-1-60650-857-2}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===  Elastic collisions  ===\u003cbr\u003e Examination of the collision products generated by particle accelerators around the world provides scientists evidence of the structure of the subatomic world and the natural laws governing it. Analysis of the collision products, the sum of whose masses may vastly exceed the masses of the incident particles, requires special relativity.\u003cref name=\"Idema_2022\"\u003e{{cite web |last1=Idema |first1=Timon |title=Mechanics and Relativity. Chapter 14: Relativistic Collisions |url=https:\u002f\u002fphys.libretexts.org\u002fBookshelves\u002fUniversity_Physics\u002fBook%3A_Mechanics_and_Relativity_(Idema)\u002f14%3A_Relativistic_Collisions |website=LibreTexts Physics |date=17 April 2019 |publisher=California State University Affordable Learning Solutions Program |access-date=2 January 2023}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In Newtonian mechanics, analysis of collisions involves use of the [[conservation of mass|conservation laws for mass]], [[conservation of momentum|momentum]] and [[conservation of energy|energy]]. In relativistic mechanics, mass is not independently conserved, because it has been subsumed into the total relativistic energy. We illustrate the differences that arise between the Newtonian and relativistic treatments of particle collisions by examining the simple case of two perfectly elastic colliding particles of equal mass. (''Inelastic'' collisions are discussed in [[Spacetime#Conservation laws]]. Radioactive decay may be considered a sort of time-reversed inelastic collision.\u003cref name=\"Idema_2022\"\u002f\u003e)\u003cbr\u003e@@ -513,33 +518,33 @@\u003cbr\u003e Elastic scattering of charged elementary particles deviates from ideality due to the production of [[Bremsstrahlung]] radiation.\u003cref name=\"Nakel_1994\"\u003e{{cite journal |last1=Nakel |first1=Werner |title=The elementary process of bremsstrahlung |journal=Physics Reports |date=1994 |volume=243 |issue=6 |pages=317\u2013353 |doi=10.1016\u002f0370-1573(94)00068-9|bibcode=1994PhR...243..317N }}\u003c\u002fref\u003e\u003cref\u003e{{cite book |last1=Halbert |first1=M.L. |editor1-last=Austin |editor1-first=S.M. |editor2-last=Crawley |editor2-first=G.M. |title=The Two-Body Force in Nuclei |date=1972 |publisher=Springer |location=Boston, MA. |chapter=Review of Experiments on Nucleon-Nucleon Bremsstrahlung}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==== Newtonian analysis ====\u003cbr\u003e-[[File:Elastic collision of moving particle with equal mass stationary particle.svg|thumb|Figure 6\u20132. Newtonian analysis of the elastic collision of a moving particle with an equal mass stationary particle]]\u003cbr\u003e+[[File:Elastic collision of moving particle with equal mass stationary particle.svg|thumb|Figure 6-2. Newtonian analysis of the elastic collision of a moving particle with an equal mass stationary particle]]\u003cbr\u003e Fig. 6-2 provides a demonstration of the result, familiar to billiard players, that if a stationary ball is struck elastically by another one of the same mass (assuming no sidespin, or \"English\"), then after collision, the diverging paths of the two balls  will subtend a right angle. (a) In the stationary frame, an incident sphere traveling at 2'''v''' strikes a stationary sphere. (b) In the center of momentum frame, the two spheres approach each other symmetrically at \u00b1'''v'''. After elastic collision, the two spheres rebound from each other with equal and opposite velocities \u00b1'''u'''. Energy conservation requires that {{abs|'''u'''}} = {{abs|'''v'''}}. (c) Reverting to the stationary frame, the rebound velocities are {{nowrap|'''v''' \u00b1 '''u'''}}. The dot product {{nowrap|1=('''v''' + '''u''') \u22c5 ('''v''' \u2212 '''u''') = '''v'''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 '''u'''\u003csup\u003e2\u003c\u002fsup\u003e = 0}}, indicating that the vectors are orthogonal.\u003cref name=\"Rindler0\"\u002f\u003e{{rp|26\u201327}}\u003cbr\u003e \u003cbr\u003e ==== Relativistic analysis ====\u003cbr\u003e-[[File:Relativistic elastic collision of equal mass particles.svg|thumb|Figure 6\u20133. Relativistic elastic collision between a moving particle incident upon an equal mass stationary particle]]\u003cbr\u003e+[[File:Relativistic elastic collision of equal mass particles.svg|thumb|Figure 6-3. Relativistic elastic collision between a moving particle incident upon an equal mass stationary particle]]\u003cbr\u003e Consider the elastic collision scenario in Fig.&nbsp;6-3 between a moving particle colliding with an equal mass stationary particle. Unlike the Newtonian case, the angle between the two particles after collision is less than 90\u00b0, is dependent on the angle of scattering, and becomes smaller and smaller as the velocity of the incident particle approaches the speed of light:\u003cbr\u003e \u003cbr\u003e The relativistic momentum and total relativistic energy of a particle are given by\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\vec{p} = \\gamma m \\vec{v} \\quad \\text{and} \\quad E = \\gamma m c^2 \u003c\u002fmath\u003e  |6-4}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\vec{p} = \\gamma m \\vec{v} \\quad \\text{and} \\quad E = \\gamma m c^2 \u003c\u002fmath\u003e  |{{EquationRef|6-4}} }}\u003cbr\u003e \u003cbr\u003e Conservation of momentum dictates that the sum of the momenta of the incoming particle and the stationary particle (which initially has momentum = 0) equals the sum of the momenta of the emergent particles:\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\gamma_1 m \\vec{v_1} + 0 = \\gamma_2 m \\vec{v_2}  +  \\gamma_3 m \\vec{v_3} \u003c\u002fmath\u003e  |6-5}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\gamma_1 m \\vec{v_1} + 0 = \\gamma_2 m \\vec{v_2}  +  \\gamma_3 m \\vec{v_3} \u003c\u002fmath\u003e  |{{EquationRef|6-5}} }}\u003cbr\u003e \u003cbr\u003e Likewise, the sum of the total relativistic energies of the incoming particle and the stationary particle (which initially has total energy mc\u003csup\u003e2\u003c\u002fsup\u003e) equals the sum of the total energies of the emergent particles:\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\gamma_1 m c^2 + m c^2 = \\gamma_2 m c^2 + \\gamma_3 m c^2 \u003c\u002fmath\u003e  |6-6}}\u003cbr\u003e-\u003cbr\u003e-Breaking down ({{EquationNote|6-5}}) into its components, replacing \u003cmath\u003ev\u003c\u002fmath\u003e with the dimensionless {{tmath|1= \\beta }}, and factoring out common terms from ({{EquationNote|6-5}}) and ({{EquationNote|6-6}}) yields the following:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\beta_1 \\gamma_1 = \\beta_2 \\gamma_2 \\cos{\\theta} +  \\beta_3 \\gamma_3 \\cos{\\phi} \u003c\u002fmath\u003e  |6-7}}\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\beta_2 \\gamma_2 \\sin{\\theta} = \\beta_3 \\gamma_3 \\sin{\\phi} \u003c\u002fmath\u003e  |6-8}}\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\gamma_1 + 1 = \\gamma_2 + \\gamma_3 \u003c\u002fmath\u003e  |6-9}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\gamma_1 m c^2 + m c^2 = \\gamma_2 m c^2 + \\gamma_3 m c^2 \u003c\u002fmath\u003e  |{{EquationRef|6-6}} }}\u003cbr\u003e+\u003cbr\u003e+Breaking down ({{EquationNote|6-5}}) into its components, replacing \u003cmath\u003ev\u003c\u002fmath\u003e with the dimensionless \u003cmath\u003e\\beta\u003c\u002fmath\u003e, and factoring out common terms from ({{EquationNote|6-5}}) and ({{EquationNote|6-6}}) yields the following:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_1 \\gamma_1 = \\beta_2 \\gamma_2 \\cos{\\theta} +  \\beta_3 \\gamma_3 \\cos{\\phi} \u003c\u002fmath\u003e  |{{EquationRef|6-7}} }}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_2 \\gamma_2 \\sin{\\theta} = \\beta_3 \\gamma_3 \\sin{\\phi} \u003c\u002fmath\u003e  |{{EquationRef|6-8}} }}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\gamma_1 + 1 = \\gamma_2 + \\gamma_3 \u003c\u002fmath\u003e  |{{EquationRef|6-9}} }}\u003cbr\u003e \u003cbr\u003e From these we obtain the following relationships:\u003cref name=\"Champion_1932\" group=\"p\"\u003e{{cite journal |last1=Champion |first1=Frank Clive |title=On some close collisions of fast \u03b2-particles with electrons, photographed by the expansion method. |journal=Proceedings of the Royal Society of London. Series A, Containing Papers of a Mathematical and Physical Character |year=1932 |volume=136 |issue=830 |pages=630\u2013637 |publisher=The Royal Society Publishing |doi=10.1098\u002frspa.1932.0108 |bibcode=1932RSPSA.136..630C |s2cid=123018629 |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\beta_2 = \\frac{\\beta_1 \\sin{\\phi}}{ \\{ \\beta_1^2 \\sin^2{\\phi} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |6-10}}\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\beta_3 = \\frac{\\beta_1 \\sin{\\theta}}{ \\{ \\beta_1^2 \\sin^2{\\theta} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |6-11}}\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\cos{(\\phi + \\theta)} = \\frac{ (\\gamma_1 - 1) \\sin{\\theta} \\cos{\\theta} }{ \\{ (\\gamma_1 + 1)^2 \\sin^2 \\theta + 4 \\cos^2 \\theta  \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |6-12}}\u003cbr\u003e-For the symmetrical case in which \u003cmath\u003e \\phi = \\theta\u003c\u002fmath\u003e and {{tmath|1= \\beta_2 = \\beta_3 }}, ({{EquationNote|6-12}}) takes on the simpler form:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e-{{NumBlk2||\u003cmath\u003e\\quad\\quad \\cos{\\theta} = \\frac{\\beta_1}{ \\{ 2\u002f\\gamma_1 + 3 \\beta_1^2 - 2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |6-13}}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_2 = \\frac{\\beta_1 \\sin{\\phi}}{ \\{ \\beta_1^2 \\sin^2{\\phi} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-10}} }}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\beta_3 = \\frac{\\beta_1 \\sin{\\theta}}{ \\{ \\beta_1^2 \\sin^2{\\theta} +  \\sin^2(\\phi + \\theta )\u002f\\gamma_1^2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-11}} }}\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\cos{(\\phi + \\theta)} = \\frac{ (\\gamma_1 - 1) \\sin{\\theta} \\cos{\\theta} }{ \\{ (\\gamma_1 + 1)^2 \\sin^2 \\theta + 4 \\cos^2 \\theta  \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-12}} }}\u003cbr\u003e+For the symmetrical case in which \u003cmath\u003e \\phi = \\theta\u003c\u002fmath\u003e and \u003cmath\u003e \\beta_2 = \\beta_3,\u003c\u002fmath\u003e ({{EquationNote|6-12}}) takes on the simpler form:\u003cref name=\"Champion_1932\" group=\"p\"\u002f\u003e\u003cbr\u003e+{{NumBlk||\u003cmath\u003e\\quad\\quad \\cos{\\theta} = \\frac{\\beta_1}{ \\{ 2\u002f\\gamma_1 + 3 \\beta_1^2 - 2 \\}^{1\u002f2} }    \u003c\u002fmath\u003e  |{{EquationRef|6-13}} }}\u003cbr\u003e \u003cbr\u003e == Beyond the basics ==\u003cbr\u003e === Rapidity ===\u003cbr\u003e@@ -548,17 +553,17 @@\u003cbr\u003e  | direction         = horizontal\u003cbr\u003e  | width1            = 135\u003cbr\u003e  | image1            = Trig functions (sine and cosine).svg\u003cbr\u003e- | caption1          = Figure 7-1a.  A ray through the [[unit circle]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e + ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cos ''a'', sin ''a'')}}, where ''a'' is twice the area between the ray, the circle, and the ''x''-axis.\u003cbr\u003e+ | caption1          = Figure 4-1a.  A ray through the [[unit circle]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e + ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cos ''a'', sin ''a'')}}, where ''a'' is twice the area between the ray, the circle, and the ''x''-axis.\u003cbr\u003e  | width2            = 190\u003cbr\u003e  | image2            = Hyperbolic functions-2.svg\u003cbr\u003e- | caption2          = Figure 7-1b. A ray through the [[unit hyperbola]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cosh ''a'', sinh ''a'')}}, where ''a'' is twice the area between the ray, the hyperbola, and the ''x''-axis.\u003cbr\u003e+ | caption2          = Figure 4-1b. A ray through the [[unit hyperbola]] {{nowrap|1=''x''\u003csup\u003e2\u003c\u002fsup\u003e \u2212 ''y''\u003csup\u003e2\u003c\u002fsup\u003e = 1}} in the point {{nowrap|1=(cosh ''a'', sinh ''a'')}}, where ''a'' is twice the area between the ray, the hyperbola, and the ''x''-axis.\u003cbr\u003e }}\u003cbr\u003e-[[File:Sinh+cosh+tanh.svg|thumb|180px|Figure 7\u20132. Plot of the three basic [[Hyperbolic function]]s: hyperbolic sine ([[:File:Hyperbolic Sine.svg|sinh]]), hyperbolic cosine ([[:File:Hyperbolic Cosine.svg|cosh]]) and hyperbolic tangent ([[:File:Hyperbolic Tangent.svg|tanh]]). Sinh is red, cosh is blue and tanh is green.]]\u003cbr\u003e+[[File:Sinh+cosh+tanh.svg|thumb|180px|Figure 4\u20132. Plot of the three basic [[Hyperbolic function]]s: hyperbolic sine ([[:File:Hyperbolic Sine.svg|sinh]]), hyperbolic cosine ([[:File:Hyperbolic Cosine.svg|cosh]]) and hyperbolic tangent ([[:File:Hyperbolic Tangent.svg|tanh]]). Sinh is red, cosh is blue and tanh is green.]]\u003cbr\u003e Lorentz transformations relate coordinates of events in one reference frame to those of another frame. Relativistic composition of velocities is used to add two velocities together. The formulas to perform the latter computations are nonlinear, making them more complex than the corresponding Galilean formulas.\u003cbr\u003e \u003cbr\u003e-This nonlinearity is an artifact of our choice of parameters.\u003cref name=\"Taylor_1992\" \u002f\u003e{{rp|47\u201359}} We have previously noted that in an {{nowrap|1=''x''\u2013''ct''}} spacetime diagram, the points at some constant spacetime interval from the origin form an invariant hyperbola. We have also noted that the coordinate systems of two spacetime reference frames in standard configuration are hyperbolically rotated with respect to each other.\u003cbr\u003e-\u003cbr\u003e-The natural functions for expressing these relationships are the [[Hyperbolic functions|hyperbolic analogs of the trigonometric functions]]. Fig.&nbsp;7-1a shows a [[unit circle]] with sin(''a'') and cos(''a''), the only difference between this diagram and the familiar unit circle of elementary trigonometry being that ''a'' is interpreted, not as the angle between the ray and the {{nowrap|1=''x''-axis}}, but as twice the area of the sector swept out by the ray from the {{nowrap|1=''x''-axis}}. Numerically, the angle and {{nowrap|1=2 \u00d7 area}} measures for the unit circle are identical. Fig.&nbsp;7-1b shows a [[unit hyperbola]] with sinh(''a'') and cosh(''a''), where ''a'' is likewise interpreted as twice the tinted area.\u003cref\u003e{{cite book|last1=Thomas|first1=George B.|last2=Weir|first2=Maurice D.|last3=Hass|first3=Joel|last4=Giordano|first4=Frank R.|title=Thomas' Calculus: Early Transcendentals|date=2008|publisher=Pearson Education, Inc.|location=Boston|isbn=978-0-321-49575-4|page=533|edition=Eleventh}}\u003c\u002fref\u003e Fig.&nbsp;7-2 presents plots of the sinh, cosh, and tanh functions.\u003cbr\u003e+This nonlinearity is an artifact of our choice of parameters.\u003cref name=\"Taylor\" \u002f\u003e{{rp|47\u201359}} We have previously noted that in an {{nowrap|1=x\u2013ct}} spacetime diagram, the points at some constant spacetime interval from the origin form an invariant hyperbola. We have also noted that the coordinate systems of two spacetime reference frames in standard configuration are hyperbolically rotated with respect to each other.\u003cbr\u003e+\u003cbr\u003e+The natural functions for expressing these relationships are the [[Hyperbolic functions|hyperbolic analogs of the trigonometric functions]]. Fig.&nbsp;4-1a shows a [[unit circle]] with sin(''a'') and cos(''a''), the only difference between this diagram and the familiar unit circle of elementary trigonometry being that ''a'' is interpreted, not as the angle between the ray and the {{nowrap|1=''x''-axis}}, but as twice the area of the sector swept out by the ray from the {{nowrap|1=''x''-axis}}. Numerically, the angle and {{nowrap|1=2 \u00d7 area}} measures for the unit circle are identical. Fig.&nbsp;4-1b shows a [[unit hyperbola]] with sinh(''a'') and cosh(''a''), where ''a'' is likewise interpreted as twice the tinted area.\u003cref\u003e{{cite book|last1=Thomas|first1=George B.|last2=Weir|first2=Maurice D.|last3=Hass|first3=Joel|last4=Giordano|first4=Frank R.|title=Thomas' Calculus: Early Transcendentals|date=2008|publisher=Pearson Education, Inc.|location=Boston|isbn=978-0-321-49575-4|page=533|edition=Eleventh}}\u003c\u002fref\u003e Fig.&nbsp;4-2 presents plots of the sinh, cosh, and tanh functions.\u003cbr\u003e \u003cbr\u003e For the unit circle, the slope of the ray is given by\u003cbr\u003e : \u003cmath\u003e\\text{slope} = \\tan a  = \\frac{\\sin a }{\\cos a }.\u003c\u002fmath\u003e\u003cbr\u003e@@ -576,14 +581,14 @@\u003cbr\u003e y \\\\\u003cbr\u003e \\end{pmatrix}.\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-In a spacetime diagram, the velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e is the analog of slope. The ''rapidity'', ''&phi;'', is defined by\u003cref name=\"Morin2007\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e+In a spacetime diagram, the velocity parameter \u003cmath\u003e\\beta\u003c\u002fmath\u003e is the analog of slope. The ''rapidity'', ''&phi;'', is defined by\u003cref name=\"Morin\" \u002f\u003e{{rp|96\u201399}}\u003cbr\u003e : \u003cmath\u003e\\beta \\equiv \\tanh \\phi \\equiv \\frac{v}{c},\u003c\u002fmath\u003e\u003cbr\u003e where\u003cbr\u003e : \u003cmath\u003e\\tanh \\phi = \\frac{\\sinh \\phi}{\\cosh \\phi} = \\frac{e^\\phi-e^{-\\phi}}{e^\\phi+e^{-\\phi}}.\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e-The rapidity defined above is very useful in special relativity because many expressions take on a considerably simpler form when expressed in terms of it. For example, rapidity is simply additive in the collinear velocity-addition formula;\u003cref name=\"Taylor_1992\" \u002f\u003e{{rp|47\u201359}}\u003cbr\u003e+The rapidity defined above is very useful in special relativity because many expressions take on a considerably simpler form when expressed in terms of it. For example,
