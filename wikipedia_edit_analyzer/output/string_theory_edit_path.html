ies determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. \u003cbr\u003e \u003cbr\u003e-String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details. That being said, string theory is a work-in-progress and our understanding of what string theory is continues to evolve.\u003cbr\u003e+String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e ","--- Revision 2\u003cbr\u003e+++ Revision 3\u003cbr\u003e@@ -4,15 +4,13 @@\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a theory that attempts to merge [[quantum mechanics]] with [[Einstein's general theory of relativity|Einstein\u2019s general theory of relativity]]. The theory puts forth the premise of the material universe being made of tiny one-dimensional \u201c[[String (physics)|strings]]\u201d, rather than the more conventional approach in which they are modeled as [[Poin . It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in eleven dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e ","--- Revision 6\u003cbr\u003e+++ Revision 7\u003cbr\u003e@@ -1,4 +1,4 @@\u003cbr\u003e-{{short description|Theoretical framework in physics}}\u003cbr\u003e+{{short description|Theory of subatomic structure}}\u003cbr\u003e {{About|physics|string algorithms|String (computer science)|instrumental strings|String (music)|other uses|String (disambiguation)}}\u003cbr\u003e {{pp|small=yes}}\u003cbr\u003e {{seeintro|Introduction to M-theory}}","--- Revision 7\u003cbr\u003e+++ Revision 8\u003cbr\u003e@@ -20,7 +20,7 @@\u003cbr\u003e \u003cbr\u003e In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e \u003cbr\u003e-String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions and many others. The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can vibrate in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. In this way, all of the different elementary particles may be viewed as [[vibrating strings]]. In string theory, one of the vibrational states of the string gives rise to the [[graviton]], a quantum mechanical particle that carries gravitational force. Thus string theory is a theory of quantum gravity.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e+String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions and many others. The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can [[vibration|vibrate]] in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle consistent with non-string models of elementary particles, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. String theory's application as a form of quantum gravity proposes a vibrational state responsible for the [[graviton]], a yet unproven quantum particle that is theorized to carry gravitational force. Thus string theory is a theory of quantum gravity.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the main developments of the past several decades in string theory was the discovery of certain 'dualities', mathematical transformations that identify one physical theory with another. Physicists studying string theory have discovered a number of these dualities between different versions of string theory, and this has led to the conjecture that all consistent versions of string theory are subsumed in a single framework known as [[M-theory]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 9\u201312\u003c\u002fref\u003e\u003cbr\u003e ","--- cience)|instrumental strings|String (music)|other uses|String (disambiguation)}}\u003cbr\u003e {{pp|small=yes}}\u003cbr\u003e+{{Other uses}}\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e ","--- Revision 13\u003cbr\u003e+++ Revision 14\u003cbr\u003e@@ -4,6 +4,7 @@\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e+{{No footnotes|section|date=April 2024}}\u003cbr\u003e In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.","--- Revision 14\u003cbr\u003e+++ Revision 15\u003cbr\u003e@@ -4,7 +4,6 @@\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-{{No footnotes|section|date=April 2024}}\u003cbr\u003e In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.","--- Revision 15\u003cbr\u003e+++ Revision 16\u003cbr\u003e@@ -510,6 +510,7 @@\u003cbr\u003e '''Websites'''\u003cbr\u003e * [http:\u002f\u002fwww.math.columbia.edu\u002f~woit\u002fblog\u002f Not Even Wrong]\u2014A blog critical of string theory\u003cbr\u003e * [https:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e+* [https:\u002f\u002fwww.quantumfieldtheory.info\u002fString_Topics_Summaries.pdf Pedagogic Aids to String Theory]\u2014Introductory level overview of string theory plus aids to help understanding some of the more difficult concepts. For those who have studied quantum field theory from the author of Student Friendly Quantum Field Theory. \u003cbr\u003e \u003cbr\u003e '''Video'''\u003cbr\u003e * [https:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.","--- Revision 16\u003cbr\u003e+++ Revision 17\u003cbr\u003e@@ -88,7 +88,6 @@\u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e \u003cbr\u003e == M-theory ==\u003cbr\u003e-\u003cbr\u003e {{main|M-theory}}\u003cbr\u003e \u003cbr\u003e Prior to 1995, theorists believed that there were five consistent versions of superstring theory (type I, type IIA, type IIB, and two versions of heterotic string theory). This understanding changed in 1995 when [[Edward Witten]] suggested that the five theories were just special limiting cases of an eleven-dimensional theory called M-theory. Witten's conjecture was based on the work of a number of other physicists, including [[Ashoke Sen]], [[Chris Hull]], [[Paul Townsend]], and [[Michael Duff (physicist)|Michael Duff]]. His announcement led to a flurry of research activity now known as the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u003e[[#Duff1998|Duff]]\u003c\u002fref\u003e\u003cbr\u003e@@ -184,7 +183,7 @@\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence has also been used to study aspects of condensed matter physics. Over the decades, [[experimental physics|experimental]] condensed matter physicists have discovered a number of exotic states of matter, including [[superconductors]] and [[superfluids]]. These states are described using the formalism of quantum field theory, but some phenomena are difficult to explain using standard field theoretic techniques. Some condensed matter theorists including [[Subir Sachdev]] hope that the AdS\u002fCFT correspondence will make it possible to describe these systems in the language of string theory and learn more about their behavior.\u003cref name=\"Merali 2011\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on [[Planck's constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e+So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on the [[Planck constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e == Phenomenology ==\u003cbr\u003e {{main|String phenomenology}}\u003cbr\u003e@@ -418,8 +417,10 @@\u003cbr\u003e \u003cref name=\"Kovtun, Son, and Starinets 2001\"\u003e{{cite journal | last1 = Kovtun | first1 = P. K. | last2 = Son | first2 = Dam T. | last3 = Starinets | first3 = A. O. | title = Viscosity in strongly interacting quantum field theories from black hole physics | journal = Physical Review Letters | volume = 94 | issue = 11 | year = 2005 | bibcode = 2005PhRvL..94k1601K | page = 111601 | doi = 10.1103\u002fPhysRevLett.94.111601 | pmid = 15903845|arxiv = hep-th\u002f0405231 | s2cid = 119476733 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Lian1997\u003e{{cite journal |last1=Lian |first1=Bong |last2=Liu |first2=Kefeng |last3=Yau |first3=Shing-Tung |year=1997 |title=Mirror principle, I |journal=Asian Journal of Mathematics |volume=1 |issue=4 |pages=729\u2013763|bibcode=1997alg.geom.12011L |arxiv=alg-geom\u002f9712011 |doi=10.4310\u002fajm.1997.v1.n4.a5|s2cid=8035522 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref name=Lian1999\u003e{{cite journal |last1=Lian |first1=Bong |last2=Liu |first2=Kefeng |last3=Yau |first3=Shing-Tung |year=1999a |title=Mirror principle, II |journal=Asian Journal of Mathematics |volume=3 |pages=109\u2013146|bibcode=1999math......5006L |arxiv=math\u002f9905006 |doi=10.4310\u002fajm.1999.v3.n1.a6|s2cid=17837291 }}\u003cbr\u003e\u003cbr\u003e+\u003cbr\u003e+\u003cref name=Lian1999\u003e{{cite journal |last1=Lian |first1=Bong |last2=Liu |first2=Kefeng |last3=Yau |first3=Shing-Tung |year=1999a |title=Mirror principle, II |journal=Asian Journal of Mathematics |volume=3 |pages=109\u2013146|bibcode=1999math......5006L |arxiv=math\u002f9905006 |doi=10.4  involved.\u003cbr\u003e * [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni] \u2014 2003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e ","--- Revision 18\u003cbr\u003e+++ Revision 19\u003cbr\u003e@@ -98,7 +98,7 @@\u003cbr\u003e \u003cbr\u003e In the 1970s, many physicists became interested in [[supergravity]] theories, which combine general relativity with supersymmetry. Whereas general relativity makes sense in any number of dimensions, supergravity places an upper limit on the number of dimensions.\u003cref\u003e[[#Duff1998|Duff]], p. 64\u003c\u002fref\u003e In 1978, work by [[Werner Nahm]] showed that the maximum spacetime dimension in which one can formulate a consistent supersymmetric theory is eleven.\u003cref name=Nahm\u002f\u003e In the same year, [[Eugene Cremmer]], [[Bernard Julia]], and [[Jo\u00ebl Scherk]] of the [[\u00c9cole Normale Sup\u00e9rieure]] showed that supergravity not only permits up to eleven dimensions but is in fact most elegant in this maximal number of dimensions.\u003cref name=Cremmer\u002f\u003e\u003cref name=\"Duff 1998, p. 65\"\u003e[[#Duff1998|Duff]], p. 65\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Initially, many physicists hoped that by compactifying eleven-dimensional supergravity, it might be possible to construct realistic models of our four-dimensional world. The hope was that such models would provide a unified description of the four fundamental forces of nature: electromagnetism, the [[strong nuclear force|strong]] and [[weak nuclear force]]s, and gravity. Interest in eleven-dimensional supergravity soon waned as various flaws in this scheme were discovered. One of the problems was that the laws of physics appear to distinguish between clockwise and counterclockwise, a phenomenon known as [[chirality (physics)|chirality]]. Edward Witten and others observed this chirality property cannot be readily derived by compactifying from eleven dimensions.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e+Initially, many physicists hoped that by compactifying [[eleven-dimensional supergravity]], it might be possible to construct realistic models of our four-dimensional world. The hope was that such models would provide a unified description of the four fundamental forces of nature: electromagnetism, the [[strong nuclear force|strong]] and [[weak nuclear force]]s, and gravity. Interest in eleven-dimensional supergravity soon waned as various flaws in this scheme were discovered. One of the problems was that the laws of physics appear to distinguish between clockwise and counterclockwise, a phenomenon known as [[chirality (physics)|chirality]]. Edward Witten and others observed this chirality property cannot be readily derived by compactifying from eleven dimensions.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e In the [[first superstring revolution]] in 1984, many physicists turned to string theory as a unified theory of particle physics and quantum gravity. Unlike supergravity theory, string theory was able to accommodate the chirality of the standard model, and it provided a theory of gravity consistent with quantum effects.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e Another feature of string theory that many physicists were drawn to in the 1980s and 1990s was its high degree of uniqueness. In ordinary particle theories, one can consider any collection of elementary particles whose classical behavior is described by an arbitrary [[Lagrangian (field theory)|Lagrangian]]. In string theory, the possibilities are much more constrained: by the 1990s, physicists had argued that there were only five consistent supersymmetric versions of the theory.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e ","--- Revision 19\u003cbr\u003e+++ Revision 20\u003cbr\u003e@@ -201,7 +201,7 @@\u003cbr\u003e === Cosmology ===\u003cbr\u003e {{main|String cosmology}}\u003cbr\u003e \u003cbr\u003e-[[File:Ilc 9yr moll4096.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e+[[File:WMAP 2012.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e \u003cbr\u003e The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be the same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 20\u003cbr\u003e+++ Revision 21\u003cbr\u003e@@ -136,7 +136,7 @@\u003cbr\u003e \u003cbr\u003e === Derivation within string theory ===\u003cbr\u003e \u003cbr\u003e-In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Beckenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e+In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Bekenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e \u003cbr\u003e The black holes that Strominger and Vafa considered in their original work were quite different from real astrophysical black holes. One difference was that Strominger and Vafa considered only [[extremal black hole]]s in order to make the calculation tractable. These are defined as black holes with the lowest possible mass compatible with a given charge.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 192\u2013193\u003c\u002fref\u003e Strominger and Vafa also restricted attention to black holes in five-dimensional spacetime with unphysical supersymmetry.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 194\u2013195\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 21\u003cbr\u003e+++ Revision 22\u003cbr\u003e@@ -315,7 +315,7 @@\u003cbr\u003e \u003cbr\u003e === Compatibility with dark energy ===\u003cbr\u003e It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e-Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 | issn=0556-2821 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Background independence ===\u003cbr\u003e {{main|Background independence}}","--- Revision 22\u003cbr\u003e+++ Revision 23\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in eleven dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible [[Universe|universes]], which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e \u003cbr\u003e == Fundamentals ==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]","--- Revision 23\u003cbr\u003e+++ Revision 24\u003cbr\u003e@@ -526,10 +526,10 @@\u003cbr\u003e {{Portal bar|Physics|Mathematics|Astronomy|Stars|Outer space|Science}}\u003cbr\u003e {{Authority control}}\u003cbr\u003e \u003cbr\u003e-[[Category:String theory| ]]\u003cbr\u003e+\u003cbr\u003e [[Category:Mathematical physics]]\u003cbr\u003e [[Category:Concepts in physics]]\u003cbr\u003e [[Category:Dimension]]\u003cbr\u003e [[Category:Multi-dimensional geometry]]\u003cbr\u003e-[[Category:Physical cosmology]]\u003cbr\u003e [[Category:Physics beyond the Standard Model]]\u003cbr\u003e+[[Category:String theory| ]]","--- Revision 24\u003cbr\u003e+++ Revision 25\u003cbr\u003e@@ -527,9 +527,9 @@\u003cbr\u003e {{Authority control}}\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e-[[Category:Mathematical physics]]\u003cbr\u003e [[Category:Concepts in physics]]\u003cbr\u003e [[Category:Dimension]]\u003cbr\u003e+[[Category:Mathematical physics]]\u003cbr\u003e [[Category:Multi-dimensional geometry]]\u003cbr\u003e [[Category:Physics beyond the Standard Model]]\u003cbr\u003e [[Category:String theory| ]]","--- Revision 25\u003cbr\u003e+++ Revision 26\u003cbr\u003e@@ -10,7 +10,7 @@\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in eleven dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible [[Universe|universes]], which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[String theory landscape|landscape]] of possible [[universe]]s, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e \u003cbr\u003e == Fundamentals ==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]","--- Revision 26\u003cbr\u003e+++ Revision 27\u003cbr\u003e@@ -33,7 +33,7 @@\u003cbr\u003e === Strings ===\u003cbr\u003e {{main|String (physics)}}\u003cbr\u003e \u003cbr\u003e-[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e+[[Image:World lines and world sheet.svg|left|thumb|upright=1.2|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e \u003cbr\u003e The application of quantum mechanics to physical objects such as the [[electromagnetic field]], which are extended in space and time, is known as [[quantum field theory]]. In particle physics, quantum field theories form the basis for our understanding of elementary particles, which are modeled as excitations in the fundamental fields.\u003cref name=\"Zee 2010\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -66,7 +66,7 @@\u003cbr\u003e Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e \u003cbr\u003e === Dualities ===\u003cbr\u003e-[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|450px|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e+[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|thumb|upright=2|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e \u003cbr\u003e {{main|S-duality|T-duality}}\u003cbr\u003e A notable fact about string theory is that the different versions of the theory all turn out to be related in highly nontrivial ways. One of the relationships that can exist between different string theories is called [[S-duality]]. This is a relationship that says that a collection of strongly interacting particles in one theory can, in some cases, be viewed as a collection of weakly interacting particles in a completely different theory. Roughly speaking, a collection of particles is said to be strongly interacting if they combine and decay often and weakly interacting if they do so infrequently. Type I string theory turns out to be equivalent by S-duality to the {{math|''SO''(32)}} heterotic string theory. Similarly, type IIB string theory is related to itself in a nontrivial way by S-duality.\u003cref name=Becker\u003e[[#Becker|Becker, Becker and Schwarz]]\u003c\u002fref\u003e\u003cbr\u003e@@ -94,7 +94,7 @@\u003cbr\u003e \u003cbr\u003e === Unification of superstring theories ===\u003cbr\u003e \u003cbr\u003e-[[File:Limits of M-theory.svg|right|350px|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e+[[File:Limits of M-theory.svg|upright=1.6|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e \u003cbr\u003e In the 1970s, many physicists became interested in [[supergravity]] theories, which combine general relativity with supersymmetry. Whereas general relativity makes sense in any number of dimensions, supergravity places an upper limit on the number of dimensions.\u003cref\u003e[[#Duff1998|Duff]], p. 64\u003c\u002fref\u003e In 1978, work by [[Werner Nahm]] showed that the maximum spacetime dimension in which one can formulate a consistent supersymmetric theory is eleven.\u003cref name=Nahm\u002f\u003e In the same year, [[Eugene Cremmer]], [[Bernard Julia]], and [[Jo\u00ebl Scherk]] of the [[\u00c9cole Normale Sup\u00e9rieure]] showed that supergravity not only permits up to eleven dimensions but is in fact most elegant in this maximal number of dimensions.\u003cref name=Cremmer\u002f\u003e\u003cref name=\"Duff 1998, p. 65\"\u003e[[#Duff1998|Duff]], p. 65\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -155,7 +155,7 @@\u003cbr\u003e \u003cbr\u003e One can imagine a stack of hyperbolic disks where each disk represents the state of the universe at a given time. The resulting geometric object is three-dimensional anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e It looks like a solid [[cylinder (geometry)|cylinder]] in which any [[cross section (geometry)|cross section]] is a copy of the hyperbolic disk. Time runs along the vertical direction in this picture. The surface of this cylinder plays an important role in the AdS\u002fCFT correspondence. As with the hyperbolic plane, anti-de Sitter space is [[curvature|curved]] in such a way that any point in the interior is actually infinitely far from this boundary surface.\u003cref name=\"Maldacena 2005, p. 61\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|350px|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e+[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|thumb|upright=1.6|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e \u003cbr\u003e This construction describes a hypothetical universe with only two space dimensions and one time dimension, but it can be generalized to any number of dimensions. Indeed, hyperbolic space can have more than two dimensions and one can \"stack up\" copies of hyperbolic space to get higher-dimensional models of anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -201,7 +201,7 @@\u003cbr\u003e === Cosmology ===\u003cbr\u003e {{main|String cosmology}}\u003cbr\u003e \u003cbr\u003e-[[File:WMAP 2012.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e+[[File:WMAP 2012.png|thumb|upright=1.4|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e \u003cbr\u003e The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be the same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -233,7 +233,7 @@\u003cbr\u003e === Monstrous moonshine ===\u003cbr\u003e {{main|Monstrous moonshine}}\u003cbr\u003e \u003cbr\u003e-[[File:Labeled Triangle Reflections.svg|left|thumb|200px|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e+[[File:Labeled Triangle Reflections.svg|left|thumb|upright=1|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e \u003cbr\u003e [[Group theory]] is the branch of mathematics that studies the concept of [[symmetry]]. For example, one can consider a geometric shape such as an equilateral triangle. There are various operations that one can perform on this triangle without changing its shape. One can rotate it through 120\u00b0, 240\u00b0, or 360\u00b0, or one can reflect in any of the lines labeled {{math|''S''\u003csub\u003e0\u003c\u002fsub\u003e}}, {{math|''S''\u003csub\u003e1\u003c\u002fsub\u003e}}, or {{math|''S''\u003csub\u003e2\u003c\u002fsub\u003e}} in the picture. Each of these operations is called a ''symmetry'', and the collection of these symmetries satisfies certain technical properties making it into what mathematicians call a [[group (mathematics)|group]]. In this particular example, the group is known as the [[dihedral group]] of [[order (group theory)|order]] 6 because it has six elements. A general group may describe finitely many or infinitely many symmetries; if there are only finitely many symmetries, it is called a [[finite group]].\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -241,7 +241,7 @@\u003cbr\u003e \u003cbr\u003e This classification theorem identifies several infinite families of groups as well as 26 additional groups which do not fit into any family. The latter groups are called the \"sporadic\" groups, and each one owes its existence to a remarkable combination of circumstances. The largest sporadic group, the so-called [[monster group]], has over {{math|10\u003csup\u003e53\u003c\u002fsup\u003e}} elements, more than a thousand times the number of atoms in the Earth.\u003cref name=\"Klarreich 2015\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[Image:KleinInvariantJ.jpg|right|thumb|300px|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e+[[Image:KleinInvariantJ.jpg|thumb|upright=1.4|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e \u003cbr\u003e A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics that seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -264,11 +264,11 @@\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e-The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e \u003cbr\u003e-In 1969\u201370, [[Yoichiro Nambu]], [[Holger Bech Nielsen]], and [[Leonard Susskind]] recognized that the theory could be given a description in space and time in terms of strings. The scattering amplitudes were derived systematically from the action principle by [[Peter Goddard (physicist)|Peter Goddard]], [[Jeffrey Goldstone]], [[Claudio Rebbi]], and [[Charles Thorn]], giving a space-time picture to the vertex operators introduced by Veneziano and Fubini and a geometrical interpretation to the [[Virasoro algebra|Virasoro conditions]].\u003cbr\u003e+In 1969\u20131970, [[Yoichiro Nambu]], [[Holger Bech Nielsen]], and [[Leonard Susskind]] recognized that the theory could be given a description in space and time in terms of strings. The scattering amplitudes were derived systematically from the action principle by [[Peter Goddard (physicist)|Peter Goddard]], [[Jeffrey Goldstone]], [[Claudio Rebbi]], and [[Charles Thorn]], giving a space-time picture to the vertex operators introduced by Veneziano and Fubini and a geometrical interpretation to the [[Virasoro algebra|Virasoro conditions]].\u003cbr\u003e \u003cbr\u003e In 1971, [[Pierre Ramond]] added fermions to the model, which led him to formulate a two-dimensional supersymmetry to cancel the wrong-sign states. [[John Henry Schwarz|John Schwarz]] and [[Andr\u00e9 Neveu]] added another sector to the fermi theory a short time later. In the fermion theories, the critical dimension was 10. [[Stanley Mandelstam]] formulated a world sheet conformal theory for both the bose and fermi case, giving a two-dimensional field theoretic path-integral to generate the operator formalism. [[Michio Kaku]] and [[Keiji Kikkawa]] gave a different formulation of the bosonic string, as a [[string field theory]], with infinitely many particle types and with fields taking values not on points, but on loops and curves.\u003cbr\u003e \u003cbr\u003e@@ -493,10 +493,10 @@\u003cbr\u003e * {{Cite book| first = Brian | last = Greene | year = 2004 | title = The Fabric of the Cosmos: Space, Time, and the Texture of Reality | publisher = Alfred A. Knopf | location = New York | isbn = 978-0-375-41288-2 | title-link = The Fabric of the Cosmos: Space, Time, and the Texture of Reality | bibcode = 2004fcst.book.....G }}\u003cbr\u003e * {{Cite book| first = Roger | last = Penrose | year = 2005 | title = The Road to Reality: A Complete Guide to the Laws of the Universe | publisher = Knopf | isbn = 978-0-679-45443-4 | title-link = The Road to Reality: A Complete Guide to the Laws of the Universe }}\u003cbr\u003e * {{Cite book| first = Lee | last = Smolin | year = 2006 | title = The Trouble with Physics: The Rise of String Theory, the Fall of a Science, and What Comes Next | publisher = Houghton Mifflin Co. | location = New York | isbn = 978-0-618-55105-7 | title-link = The Trouble with Physics: The Rise of String Theory, the Fall of a Science, and What Comes Next }}\u003cbr\u003e-* {{Cite book| first = Peter | last = Woit | year = 2006 | title = Not Even Wrong: The Failure of String Theory And the Search for Unity in Physical Law | publisher = New York: Basic Books | location = London: Jonathan Cape & | isbn = 978-0-465-09275-8 \u003c!-- both are correct --\u003e}}\u003cbr\u003e+* {{Cite book |first=Peter |last=Woit |year=2006 |title=Not Even Wrong: The Failure of String Theory And the Search for Unity in Physical Law |publisher=New York: Basic Books |location=London, England: Jonathan Cape & |isbn=978-0-465-09275-8 \u003c!-- both are correct --\u003e}}\u003cbr\u003e \u003cbr\u003e === Textbooks ===\u003cbr\u003e-* {{cite book |last1=Becker |first1=K. |last2=Becker |first2=M. |last3=Schwarz |first3=J.H. |title=String Theory and M-Theory: A Modern Introduction |publisher=Cambridge University Press |date=2006 |isbn=978-0521860697 }}\u003cbr\u003e+* {{cite book |last1=Becker |first1=K. |last2=Becker |first2=M. |last3=Schwarz |first3=J. H. |title=String Theory and M-Theory: A Modern Introduction |publisher=Cambridge University Press |date=2006 |isbn=978-0521860697}}\u003cbr\u003e * {{cite book |last1=Blumenhagen |first1=R. |last2=L\u00fcst |first2=D. |last3=Theisen |first3=S. |title=Basic Concepts of String Theory |publisher=Springer |date=2012 |isbn=978-3642294969 }}\u003cbr\u003e * {{cite book |last1=Green |first1=Michael |last2=Schwarz |first2=John |last3=Witten |first3=Edward |title=Superstring theory. Vol. 1: Introduction |publisher=Cambridge University Press |date=2012 |isbn=978-1107029118 }}\u003cbr\u003e * {{cite book |last1=Green |first1=Michael |last2=Schwarz |first2=John |last3=Witten |first3=Edward |title=Superstring theory. Vol. 2: Loop amplitudes, anomalies and phenomenology |publisher=Cambridge University Press |date=2012 |isbn=978-1107029132 }}\u003cbr\u003e@@ -518,8 +518,8 @@\u003cbr\u003e * [https:\u002f\u002fwww.quantumfieldtheory.info\u002fString_Topics_Summaries.pdf Pedagogic Aids to String Theory]\u2014Introductory level overview of string theory plus aids to help understanding some of the more difficult concepts. For those who have studied quantum field theory from the author of Student Friendly Quantum Field Theory. \u003cbr\u003e \u003cbr\u003e ; Video :\u003cbr\u003e-* [https:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e-* [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni] \u2014 2003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e+* [https:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni]\u20142002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e+* [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni]\u20142003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}\u003cbr\u003e {{Industrial and applied mathematics}}","--- Revision 27\u003cbr\u003e+++ Revision 28\u003cbr\u003e@@ -66,7 +66,7 @@\u003cbr\u003e Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e \u003cbr\u003e === Dualities ===\u003cbr\u003e-[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|thumb|upright=2|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e+[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|upright=2|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e \u003cbr\u003e {{main|S-duality|T-duality}}\u003cbr\u003e A notable fact about string theory is that the different versions of the theory all turn out to be related in highly nontrivial ways. One of the relationships that can exist between different string theories is called [[S-duality]]. This is a relationship that says that a collection of strongly interacting particles in one theory can, in some cases, be viewed as a collection of weakly interacting particles in a completely different theory. Roughly speaking, a collection of particles is said to be strongly interacting if they combine and decay often and weakly interacting if they do so infrequently. Type I string theory turns out to be equivalent by S-duality to the {{math|''SO''(32)}} heterotic string theory. Similarly, type IIB string theory is related to itself in a nontrivial way by S-duality.\u003cref name=Becker\u003e[[#Becker|Becker, Becker and Schwarz]]\u003c\u002fref\u003e\u003cbr\u003e@@ -155,7 +155,7 @@\u003cbr\u003e \u003cbr\u003e One can imagine a stack of hyperbolic disks where each disk represents the state of the universe at a given time. The resulting geometric object is three-dimensional anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e It looks like a solid [[cylinder (geometry)|cylinder]] in which any [[cross section (geometry)|cross section]] is a copy of the hyperbolic disk. Time runs along the vertical direction in this picture. The surface of this cylinder plays an important role in the AdS\u002fCFT correspondence. As with the hyperbolic plane, anti-de Sitter space is [[curvature|curved]] in such a way that any point in the interior is actually infinitely far from this boundary surface.\u003cref name=\"Maldacena 2005, p. 61\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|thumb|upright=1.6|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e+[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|upright=1.6|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e \u003cbr\u003e This construction describes a hypothetical universe with only two space dimensions and one time dimension, but it can be generalized to any number of dimensions. Indeed, hyperbolic space can have more than two dimensions and one can \"stack up\" copies of hyperbolic space to get higher-dimensional models of anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e\u003cbr\u003e ","--- Revision 28\u003cbr\u003e+++ Revision 29\u003cbr\u003e@@ -1,7 +1,7 @@\u003cbr\u003e-{{short description|Theory of subatomic structure}}\u003cbr\u003e-{{pp|small=yes}}\u003cbr\u003e+{{Short description|Theory of subatomic structure}}\u003cbr\u003e {{Other uses}}\u003cbr\u003e-{{seeintro|Introduction to M-theory}}\u003cbr\u003e+{{Seeintro|Introduction to M-theory}}\u003cbr\u003e+{{Pp|small=yes}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e@@ -345,12 +345,9 @@\u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Notes ==\u003cbr\u003e-\u003cbr\u003e-{{notelist}}\u003cbr\u003e-{{reflist|group=note}}\u003cbr\u003e+{{Notelist}}\u003cbr\u003e \u003cbr\u003e == References ==\u003cbr\u003e-\u003cbr\u003e {{reflist|30em|refs=\u003cbr\u003e \u003cref name=\"Aspinwall et al. 2009\"\u003e{{cite book |editor1-first=Paul |editor1-last=Aspinwall |editor2-first=Tom |editor2-last=Bridgeland |editor3-first=Alastair |editor3-last=Craw |editor4-first=Michael }","--- Revision 31\u003cbr\u003e+++ Revision 32\u003cbr\u003e@@ -159,7 +159,7 @@\u003cbr\u003e \u003cbr\u003e This construction describes a hypothetical universe with only two space dimensions and one time dimension, but it can be generalized to any number of dimensions. Indeed, hyperbolic space can have more than two dimensions and one can \"stack up\" copies of hyperbolic space to get higher-dimensional models of anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in nongravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e+An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in non-gravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Applications to quantum gravity ===\u003cbr\u003e ","--- Revision 32\u003cbr\u003e+++ Revision 33\u003cbr\u003e@@ -145,7 +145,7 @@\u003cbr\u003e == AdS\u002fCFT correspondence ==\u003cbr\u003e {{main|AdS\u002fCFT correspondence}}\u003cbr\u003e \u003cbr\u003e-One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result which implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |access-date=25 July 2013}}}}\u003cbr\u003e+One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result that implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor hi |editor-last2=Dyson |editor-first2=Freeman J.}}\u003c\u002fref\u003e{{rp|ix}}\u003cref\u003e{{Cite book |last=Zeidler |first=Eberhard |url=http:\u002f\u002flink.springer.com\u002f10.1007\u002f978-3-540-34764-4 |title=Quantum Field Theory I: Basics in Mathematics and Physics |date=2006 |publisher=Springer Berlin Heidelberg |isbn=978-3-540-34762-0 |location=Berlin, Heidelberg |language=en |doi=10.1007\u002f978-3-540-34764-4}}\u003c\u002fref\u003e{{rp|2}}\u003cbr\u003e \u003cbr\u003e The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can [[vibration|vibrate]] in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle consistent with non-string models of elementary particles, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. String theory's application as a form of quantum gravity proposes a vibrational state responsible for the [[graviton]], a yet unproven quantum particle that is theorized to carry gravitational force.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 41\u003cbr\u003e+++ Revision 42\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{Pp|small=yes}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e+In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string acts like a particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a
