ike sheets or membranes propagating through the eleven-dimensional spacetime. Shortly after this discovery, [[Michael Duff (physicist)|Michael Duff]], Paul Howe, Takeo Inami, and Kellogg Stelle considered a particular compactification of eleven-dimensional supergravity with one of the dimensions curled up into a circle.\u003cref name=Duff1987\u002f\u003e In this setting, one can imagine the membrane wrapping around the circular dimension. If the radius of the circle is sufficiently small, then this membrane looks just like a string in ten-dimensional spacetime. Duff and his collaborators showed that this construction reproduces exactly the strings appearing in type IIA superstring theory.\u003cref\u003e[[#Duff1998|Duff]], p. 66\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher-dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e+Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Initially, some physicists suggested that the new theory was a fundamental theory of membranes, but Witten was skeptical of the role of membranes in the theory. In a paper from 1996, Ho\u0159ava and Witten wrote \"As it has been proposed that the eleven-dimensional theory is a supermembrane theory but there are some reasons to doubt that interpretation, we will non-committally call it the M-theory, leaving to the future the relation of M to membranes.\"\u003cref name=Horava\u002f\u003e In the absence of an understanding of the true meaning and structure of M-theory, Witten has suggested that the ''M'' should stand for \"magic\", \"mystery\", or \"membrane\" according to taste, and the true meaning of the title should be decided when a more fundamental formulation of the theory is known.\u003cref name=Duff1996\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Matrix theory ===\u003cbr\u003e+===Matrix theory===\u003cbr\u003e+\u003cbr\u003e {{main|Matrix theory (physics)}}\u003cbr\u003e \u003cbr\u003e In mathematics, a [[matrix (mathematics)|matrix]] is a rectangular array of numbers or other data. In physics, a [[matrix theory (physics)|matrix model]] is a particular kind of physical theory whose mathematical formulation involves the notion of a matrix in an important way. A matrix model describes the behavior of a set of matrices within the framework of quantum mechanics.\u003cref name=Banks\u002f\u003e\u003cbr\u003e@@ -121,22 +121,23 @@\u003cbr\u003e \u003cbr\u003e The development of the matrix model formulation of M-theory has led physicists to consider various connections between string theory and a branch of mathematics called [[noncommutative geometry]]. This subject is a generalization of ordinary geometry in which mathematicians define new geometric notions using tools from [[noncommutative algebra]].\u003cref name=Connes\u002f\u003e In a paper from 1998, [[Alain Connes]], [[Michael R. Douglas]], and [[Albert Schwarz]] showed that some aspects of matrix models and M-theory are described by a [[noncommutative quantum field theory]], a special kind of physical theory in which spacetime is described mathematically using noncommutative geometry.\u003cref name=CDS\u002f\u003e This established a link between matrix models and M-theory on the one hand, and noncommutative geometry on the other hand. It quickly led to the discovery of other important links between noncommutative geometry and various physical theories.\u003cref name=Nekrasov\u002f\u003e\u003cref name=SW\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== Black holes ==\u003cbr\u003e+==Black holes==\u003cbr\u003e \u003cbr\u003e In general relativity, a black hole is defined as a region of spacetime in which the gravitational field is so strong that no particle or radiation can escape. In the currently accepted models of stellar evolution, black holes are thought to arise when massive stars undergo [[gravitational collapse]], and many [[galaxies]] are thought to contain [[supermassive black hole]]s at their centers. Black holes are also important for theoretical reasons, as they present profound challenges for theorists attempting to understand the quantum aspects of gravity. String theory has proved to be an important tool for investigating the theoretical properties of black holes because it provides a framework in which theorists can study their [[black hole thermodynamics|thermodynamics]].\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Bekenstein\u2013Hawking formula ===\u003cbr\u003e+===Bekenstein\u2013Hawking formula===\u003cbr\u003e \u003cbr\u003e In the branch of physics called [[statistical mechanics]], [[entropy]] is a measure of the randomness or disorder of a physical system. This concept was studied in the 1870s by the Austrian physicist [[Ludwig Boltzmann]], who showed that the [[thermodynamics|thermodynamic]] properties of a [[gas]] could be derived from the combined properties of its many constituent [[molecule]]s. Boltzmann argued that by averaging the behaviors of all the different molecules in a gas, one can understand macroscopic properties such as volume, temperature, and pressure. In addition, this perspective led him to give a precise definition of entropy as the [[natural logarithm]] of the number of different states of the molecules (also called ''microstates'') that give rise to the same macroscopic features.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 187\u2013188\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation are lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e-: \u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e-\u003cbr\u003e-where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is the [[Boltzmann constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e+In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation is lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e+\u003cbr\u003e+:\u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e+\u003cbr\u003e+where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is [[Boltzmann's constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Like any physical system, a black hole has an entropy defined in terms of the number of different microstates that lead to the same macroscopic features. The Bekenstein\u2013Hawking entropy formula gives the expected value of the entropy of a black hole, but by the 1990s, physicists still lacked a derivation of this formula by counting microstates in a theory of quantum gravity. Finding such a derivation of this formula was considered an important test of the viability of any theory of quantum gravity such as string theory.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 189\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Derivation within string theory ===\u003cbr\u003e+===Derivation within string theory===\u003cbr\u003e \u003cbr\u003e In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Beckenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -144,12 +145,13 @@\u003cbr\u003e \u003cbr\u003e Although it was originally developed in this very particular and physically unrealistic context in string theory, the entropy calculation of Strominger and Vafa has led to a qualitative understanding of how black hole entropy can be accounted for in any theory of quantum gravity. Indeed, in 1998, Strominger argued that the original result could be generalized to an arbitrary consistent theory of quantum gravity without relying on strings or supersymmetry.\u003cref name=Strominger1998\u002f\u003e In collaboration with several other authors in 2010, he showed that some results on black hole entropy could be extended to non-extremal astrophysical black holes.\u003cref name=Guica\u002f\u003e\u003cref name=CMS\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== AdS\u002fCFT correspondence ==\u003cbr\u003e+==AdS\u002fCFT correspondence==\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fCFT correspondence}}\u003cbr\u003e \u003cbr\u003e-One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result which implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |access-date=25 July 2013}}}}\u003cbr\u003e-\u003cbr\u003e-=== Overview of the correspondence ===\u003cbr\u003e+One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result which implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |accessdate=25 July 2013}}}}\u003cbr\u003e+\u003cbr\u003e+===Overview of the correspondence===\u003cbr\u003e \u003cbr\u003e [[Image:Uniform tiling 433-t0 (formatted).svg|thumb|left|alt=A disk tiled by triangles and quadrilaterals which become smaller and smaller near the boundary circle.|A [[tessellation]] of the [[hyperbolic plane]] [[tritetragonal tiling|by triangles and squares]]]]\u003cbr\u003e \u003cbr\u003e@@ -163,7 +165,7 @@\u003cbr\u003e \u003cbr\u003e An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in nongravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Applications to quantum gravity ===\u003cbr\u003e+===Applications to quantum gravity===\u003cbr\u003e \u003cbr\u003e The discovery of the AdS\u002fCFT correspondence was a major advance in physicists' understanding of string theory and quantum gravity. One reason for this is that the correspondence provides a formulation of string theory in terms of quantum field theory, which is well understood by comparison. Another reason is that it provides a general framework in which physicists can study and attempt to resolve the paradoxes of black holes.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -171,51 +173,56 @@\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence resolves the black hole information paradox, at least to some extent, because it shows how a black hole can evolve in a manner consistent with quantum mechanics in some contexts. Indeed, one can consider black holes in the context of the AdS\u002fCFT correspondence, and any such black hole corresponds to a configuration of particles on the boundary of anti-de Sitter space.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 554\u003c\u002fref\u003e These particles obey the usual rules of quantum mechanics and in particular evolve in a unitary fashion, so the black hole must also evolve in a unitary fashion, respecting the principles of quantum mechanics.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], p. 63\u003c\u002fref\u003e In 2005, Hawking announced that the paradox had been settled in favor of information conservation by the AdS\u002fCFT correspondence, and he suggested a concrete mechanism by which black holes might preserve information.\u003cref name=Hawking2005\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Applications to nuclear physics ===\u003cbr\u003e+===Applications to nuclear physics===\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fQCD correspondence}}\u003cbr\u003e \u003cbr\u003e [[File:Meissner effect p1390048.jpg|thumb|left|alt=A magnet levitating over a superconducting material.|A [[magnet]] [[Meissner effect|levitating]] above a [[high-temperature superconductor]]. Today some physicists are working to understand high-temperature superconductivity using the AdS\u002fCFT correspondence.\u003cref name=\"Merali 2011\"\u002f\u003e]]\u003cbr\u003e \u003cbr\u003e In addition to its applications to theoretical problems in quantum gravity, the AdS\u002fCFT correspondence has been applied to a variety of problems in quantum field theory. One physical system that has been studied using the AdS\u002fCFT correspondence is the [[quark\u2013gluon plasma]], an exotic [[state of matter]] produced in [[particle accelerator]]s. This state of matter arises for brief instants when heavy [[ions]] such as [[gold]] or [[lead]] nuclei are collided at high energies. Such collisions cause the [[quarks]] that make up atomic nuclei to [[deconfinement|deconfine]] at temperatures of approximately two [[1,000,000,000,000|trillion]] [[kelvin]], conditions similar to those present at around {{math|10\u003csup\u003e\u221211\u003c\u002fsup\u003e}} seconds after the [[Big Bang]].\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 559\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark-gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark-gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark-gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark-gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== Applications to condensed matter physics ===\u003cbr\u003e+The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark\u2013gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark\u2013gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark\u2013gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+===Applications to condensed matter physics===\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fCMT correspondence}}\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence has also been used to study aspects of condensed matter physics. Over the decades, [[experimental physics|experimental]] condensed matter physicists have discovered a number of exotic states of matter, including [[superconductors]] and [[superfluids]]. These states are described using the formalism of quantum field theory, but some phenomena are difficult to explain using standard field theoretic techniques. Some condensed matter theorists including [[Subir Sachdev]] hope that the AdS\u002fCFT correspondence will make it possible to describe these systems in the language of string theory and learn more about their behavior.\u003cref name=\"Merali 2011\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on [[Planck's constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== Phenomenology ==\u003cbr\u003e+==Phenomenology==\u003cbr\u003e+\u003cbr\u003e {{main|String phenomenology}}\u003cbr\u003e \u003cbr\u003e-In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real-world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e+In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e \u003cbr\u003e Partly because of theoretical and mathematical difficulties and partly because of the extremely high energies needed to test these theories experimentally, there is so far no experimental evidence that would unambiguously point to any of these models being a correct fundamental description of nature. This has led some in the community to criticize these approaches to unification and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Particle physics ===\u003cbr\u003e+===Particle physics===\u003cbr\u003e \u003cbr\u003e The currently accepted theory describing elementary particles and their interactions is known as the [[standard model of particle physics]]. This theory provides a unified description of three of the fundamental forces of nature: electromagnetism and the strong and weak nuclear forces. Despite its remarkable success in explaining a wide range of physical phenomena, the standard model cannot be a complete description of reality. This is because the standard model fails to incorporate the force of gravity and because of problems such as the [[hierarchy problem]] and the inability to explain the structure of fermion masses or dark matter.\u003cbr\u003e \u003cbr\u003e String theory has been used to construct a variety of models of particle physics going beyond the standard model. Typically, such models are based on the idea of compactification. Starting with the ten- or eleven-dimensional spacetime of string or M-theory, physicists postulate a shape for the extra dimensions. By choosing this shape appropriately, they can construct models roughly similar to the standard model of particle physics, together with additional undiscovered particles.\u003cref name=Candelas1985\u002f\u003e One popular way of deriving realistic physics from string theory is to start with the heterotic theory in ten dimensions and assume that the six extra dimensions of spacetime are shaped like a six-dimensional Calabi\u2013Yau manifold. Such compactifications offer many ways of extracting realistic physics from string theory. Other similar methods can be used to construct realistic or semi-realistic models of our four-dimensional world based on M-theory.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 147\u2013150\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Cosmology ===\u003cbr\u003e+===Cosmology===\u003cbr\u003e+\u003cbr\u003e {{main|String cosmology}}\u003cbr\u003e \u003cbr\u003e [[File:Ilc 9yr moll4096.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e \u003cbr\u003e-The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be the same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e+The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Currently, the leading candidate for a theory going beyond the Big Bang is the theory of cosmic inflation. Developed by [[Alan Guth]] and others in the 1980s, inflation postulates a period of extremely rapid accelerated expansion of the universe prior to the expansion described by the standard Big Bang theory. The theory of cosmic inflation preserves the successes of the Big Bang while providing a natural explanation for some of the mysterious features of the universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 531\u003c\u002fref\u003e The theory has also received striking support from observations of the cosmic microwave background, the radiation that has filled the sky since around 380,000 years after the Big Bang.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 538\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Connections to mathematics ==\u003cbr\u003e+In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory, and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Connections to mathematics==\u003cbr\u003e \u003cbr\u003e In addition to influencing research in [[theoretical physics]], string theory has stimulated a number of major developments in [[pure mathematics]]. Like many developing ideas in theoretical physics, string theory does not at present have a [[mathematical rigor|mathematically rigorous]] formulation in which all of its concepts can be defined precisely. As a result, physicists who study string theory are often guided by physical intuition to conjecture relationships between the seemingly different mathematical structures that are used to formalize different parts of the theory. These conjectures are later proved by mathematicians, and in this way, string theory serves as a source of new ideas in pure mathematics.\u003cref name=Deligne\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Mirror symmetry ===\u003cbr\u003e+===Mirror symmetry===\u003cbr\u003e+\u003cbr\u003e {{main|Mirror symmetry (string theory)}}\u003cbr\u003e \u003cbr\u003e [[File:Clebsch Cubic.png|thumb|right|alt=A complex mathematical surface in three dimensions.|The [[Clebsch cubic]] is an example of a kind of geometric object called an [[algebraic variety]]. A classical result of [[enumerative geometry]] states that there are exactly 27 straight lines that lie entirely on this surface.]]\u003cbr\u003e@@ -228,33 +235,35 @@\u003cbr\u003e \u003cbr\u003e Generalizing this problem, one can ask how many lines can be drawn on a quintic Calabi\u2013Yau manifold, such as the one illustrated above, which is defined by a polynomial of degree five. This problem was solved by the nineteenth-century German mathematician [[Hermann Schubert]], who found that there are exactly 2,875 such lines. In 1986, geometer Sheldon Katz proved that the number of curves, such as circles, that are defined by polynomials of degree two and lie entirely in the quintic is 609,250.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 166\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parkes showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e+By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parks showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Originally, these results of Candelas were justified on physical grounds. However, mathematicians generally prefer rigorous proofs that do not require an appeal to physical intuition. Inspired by physicists' work on mirror symmetry, mathematicians have therefore constructed their own arguments proving the enumerative predictions of mirror symmetry.{{efn|Two independent mathematical proofs of mirror symmetry were given by Givental\u003cref name=Givental1996\u002f\u003e\u003cref name=Givental1998\u002f\u003e and Lian et al.\u003cref name=Lian1997\u002f\u003e\u003cref name=Lian1999\u002f\u003e\u003cref name=Lian2000\u002f\u003e}} Today mirror symmetry is an active area of research in mathematics, and mathematicians are working to develop a more complete mathematical understanding of mirror symmetry based on physicists' intuition.\u003cref\u003e[[#Hori|Hori]], p. xix\u003c\u002fref\u003e Major approaches to mirror symmetry include the [[homological mirror symmetry]] program of [[Maxim Kontsevich]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and the [[SYZ conjecture]] of Andrew Strominger, Shing-Tung Yau, and [[Eric Zaslow]].\u003cref name=SYZ\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Monstrous moonshine ===\u003cbr\u003e+===Monstrous moonshine===\u003cbr\u003e+\u003cbr\u003e {{main|Monstrous moonshine}}\u003cbr\u003e \u003cbr\u003e [[File:Labeled Triangle Reflections.svg|left|thumb|200px|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e \u003cbr\u003e [[Group theory]] is the branch of mathematics that studies the concept of [[symmetry]]. For example, one can consider a geometric shape such as an equilateral triangle. There are various operations that one can perform on this triangle without changing its shape. One can rotate it through 120\u00b0, 240\u00b0, or 360\u00b0, or one can reflect in any of the lines labeled {{math|''S''\u003csub\u003e0\u003c\u002fsub\u003e}}, {{math|''S''\u003csub\u003e1\u003c\u002fsub\u003e}}, or {{math|''S''\u003csub\u003e2\u003c\u002fsub\u003e}} in the picture. Each of these operations is called a ''symmetry'', and the collection of these symmetries satisfies certain technical properties making it into what mathematicians call a [[group (mathematics)|group]]. In this particular example, the group is known as the [[dihedral group]] of [[order (group theory)|order]] 6 because it has six elements. A general group may describe finitely many or infinitely many symmetries; if there are only finitely many symmetries, it is called a [[finite group]].\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups that may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem that provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e+Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups which may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem which provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e This classification theorem identifies several infinite families of groups as well as 26 additional groups which do not fit into any family. The latter groups are called the \"sporadic\" groups, and each one owes its existence to a remarkable combination of circumstances. The largest sporadic group, the so-called [[monster group]], has over {{math|10\u003csup\u003e53\u003c\u002fsup\u003e}} elements, more than a thousand times the number of atoms in the Earth.\u003cref name=\"Klarreich 2015\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e [[Image:KleinInvariantJ.jpg|right|thumb|300px|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e \u003cbr\u003e-A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics that seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e+A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics which seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1992, [[Richard Borcherds]] constructed a bridge between the theory of modular functions and finite groups and, in the process, explained the observations of McKay and Thompson.\u003cref\u003e[[#Gannon|Gannon]], p. 8\u003c\u002fref\u003e\u003cref name=Borcherds\u002f\u003e Borcherds' work used ideas from string theory in an essential way, extending earlier results of [[Igor Frenkel]], [[James Lepowsky]], and [[Arne Meurman]], who had realized the monster group as the symmetries of a particular{{which|date=February 2016}} version of string theory.\u003cref name=FLM\u002f\u003e In 1998, Borcherds was awarded the [[Fields medal]] for his work.\u003cref\u003e[[#Gannon|Gannon]], p. 11\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Since the 1990s, the connection between string theory and moonshine has led to further results in mathematics and physics.\u003cref name=\"Klarreich 2015\"\u002f\u003e In 2010, physicists [[Tohru Eguchi]], [[Hirosi Ooguri]], and Yuji Tachikawa discovered connections between a different sporadic group, the [[Mathieu group M24|Mathieu group {{math|''M''\u003csub\u003e24\u003c\u002fsub\u003e}}]], and a certain version{{which|date=November 2016}} of string theory.\u003cref name=EOT\u002f\u003e [[Miranda Cheng]], John Duncan, and [[Jeffrey A. Harvey]] proposed a generalization of this moonshine phenomenon called [[umbral moonshine]],\u003cref name=CDH\u002f\u003e and their conjecture was proved mathematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== History ==\u003cbr\u003e+Since the 1990s, the connection between string theory and moonshine has led to further results in mathematics and physics.\u003cref name=\"Klarreich 2015\"\u002f\u003e In 2010, physicists Tohru Eguchi, [[Hirosi Ooguri]], and Yuji Tachikawa discovered connections between a different sporadic group, the [[Mathieu group M24|Mathieu group {{math|''M''\u003csub\u003e24\u003c\u002fsub\u003e}}]], and a certain version{{which|date=November 2016}} of string theory.\u003cref name=EOT\u002f\u003e [[Miranda Cheng]], John Duncan, and [[Jeffrey A. Harvey]] proposed a generalization of this moonshine phenomenon called [[umbral moonshine]],\u003cref name=CDH\u002f\u003e and their conjecture was proved mathematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==History==\u003cbr\u003e+\u003cbr\u003e {{Main|History of string theory}}\u003cbr\u003e \u003cbr\u003e-=== Early results ===\u003cbr\u003e+===Early results===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e \u003cbr\u003e@@ -266,7 +275,7 @@\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e-The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits, and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e \u003cbr\u003e@@ -274,11 +283,11 @@\u003cbr\u003e \u003cbr\u003e In 1971, [[Pierre Ramond]] added fermions to the model, which led him to formulate a two-dimensional supersymmetry to cancel the wrong-sign states. [[John Henry Schwarz|John Schwarz]] and [[Andr\u00e9 Neveu]] added another sector to the fermi theory a short time later. In the fermion theories, the critical dimension was 10. [[Stanley Mandelstam]] formulated a world sheet conformal theory for both the bose and fermi case, giving a two-dimensional field theoretic path-integral to generate the operator formalism. [[Michio Kaku]] and [[Keiji Kikkawa]] gave a different formulation of the bosonic string, as a [[string field theory]], with infinitely many particle types and with fields taking values not on points, but on loops and curves.\u003cbr\u003e \u003cbr\u003e-In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Jo\u00ebl Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e-\u003cbr\u003e-String theory eventually made it out of the dustbin, but for the following decade, all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e-\u003cbr\u003e-=== First superstring revolution ===\u003cbr\u003e+In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Joel Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e+\u003cbr\u003e+String theory eventually made it out of the dustbin, but for the following decade all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Joel Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon, and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e+\u003cbr\u003e+===First superstring revolution===\u003cbr\u003e \u003cbr\u003e [[File:Edward Witten.jpg|right|thumb|upright|[[Edward Witten]]]]\u003cbr\u003e \u003cbr\u003e@@ -290,7 +299,7 @@\u003cbr\u003e \u003cbr\u003e In the 1990s, [[Joseph Polchinski]] discovered that the theory requires higher-dimensional objects, called [[D-brane]]s and identified these with the black-hole solutions of supergravity. These were understood to be the new objects suggested by the perturbative divergences, and they opened up a new field with rich mathematical structure. It quickly became clear that D-branes and other p-branes, not just strings, formed the matter content of the string theories, and the physical interpretation of the strings and branes was revealed\u2014they are a type of black hole. [[Leonard Susskind]] had incorporated the [[holographic principle]] of [[Gerardus 't Hooft]] into string theory, identifying the long highly excited string states with ordinary thermal black hole states. As suggested by 't Hooft, the fluctuations of the black hole horizon, the world-sheet or world-volume theory, describes not only the degrees of freedom of the black hole, but all nearby objects too.\u003cbr\u003e \u003cbr\u003e-=== Second superstring revolution ===\u003cbr\u003e+===Second superstring revolution===\u003cbr\u003e \u003cbr\u003e In 1995, at the annual conference of string theorists at the University of Southern California (USC), [[Edward Witten]] gave a speech on string theory that in essence united the five string theories that existed at the time, and giving birth to a new 11-dimensional theory called [[M-theory]]. M-theory was also foreshadowed in the work of [[Paul Townsend]] at approximately the same time. The flurry of activity that began at this time is sometimes called the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -298,11 +307,11 @@\u003cbr\u003e \u003cbr\u003e During this period, [[Tom Banks (physicist)|Tom Banks]], [[Willy Fischler]], [[Stephen Shenker]] and [[Leonard Susskind]] formulated matrix theory, a full holographic description of M-theory using IIA D0 branes.\u003cref name=Banks\u002f\u003e This was the first definition of string theory that was fully non-perturbative and a concrete mathematical realization of the [[holographic principle]]. It is an example of a gauge-gravity duality and is now understood to be a special case of the [[AdS\u002fCFT correspondence]]. [[Andrew Strominger]] and [[Cumrun Vafa]] calculated the entropy of certain configurations of D-branes and found agreement with the semi-classical answer for extreme charged black holes.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e [[Petr Ho\u0159ava (theorist)|Petr Ho\u0159ava]] and Witten found the eleven-dimensional formulation of the heterotic string theories, showing that orbifolds solve the chirality problem. Witten noted that the effective description of the physics of D-branes at low energies is by a supersymmetric gauge theory, and found geometrical interpretations of mathematical structures in gauge theory that he and [[Nathan Seiberg]] had earlier discovered in terms of the location of the branes.\u003cbr\u003e \u003cbr\u003e-In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten,\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e-\u003cbr\u003e-== Criticism ==\u003cbr\u003e-\u003cbr\u003e-=== Number of solutions ===\u003cbr\u003e+In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e+\u003cbr\u003e+==Criticism==\u003cbr\u003e+\u003cbr\u003e+===Number of solutions===\u003cbr\u003e {{main|String theory landscape}}\u003cbr\u003e \u003cbr\u003e To construct models of particle physics based on string theory, physicists typically begin by specifying a shape for the extra dimensions of spacetime. Each of these different shapes corresponds to a different possible universe, or \"vacuum state\", with a different collection of particles and forces. String theory as it is currently understood has an enormous number of vacuum states, typically estimated to be around {{math|10\u003csup\u003e500\u003c\u002fsup\u003e}}, and these might be sufficiently diverse to accommodate almost any phenomenon that might be observed at low energies.\u003cref\u003e[[#Woit|Woit]], pp. 240\u2013242\u003c\u002fref\u003e\u003cbr\u003e@@ -315,26 +324,27 @@\u003cbr\u003e \u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Compatibility with dark energy ===\u003cbr\u003e-It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e-Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Background independence ===\u003cbr\u003e+===Compatibility with dark energy===\u003cbr\u003e+No vacuum in the string theory landscape is known to support a metastable, positive [[cosmological constant]], except possibly one unconfirmed model described by Kachru ''[[et al]].'' in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |accessdate=2 April 2020 |date=9 August 2018}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Background independence===\u003cbr\u003e+\u003cbr\u003e {{main|Background independence}}\u003cbr\u003e \u003cbr\u003e One of the fundamental properties of Einstein's general theory of relativity is that it is [[background independence|background independent]], meaning that the formulation of the theory does not in any way privilege a particular spacetime geometry.\u003cref\u003e[[#Smolin|Smolin]], p. 81\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-One of the main criticisms of string theory from early on is that it is not manifestly background-independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e+One of the main criticisms of string theory from early on is that it is not manifestly background independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Others have disagreed with Smolin's characterization of string theory. In a review of Smolin's book, string theorist Joseph Polchinski writes\u003cbr\u003e \u003cbr\u003e-{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them... In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e-\u003cbr\u003e-Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\" \u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Sociology of science ===\u003cbr\u003e-\u003cbr\u003e-Since the superstring revolutions of the 1980s and 1990s, string theory has been one of the dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e+{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory it has always been clear that the physics is background-independent even if the language being used is not, and the search for more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e+\u003cbr\u003e+Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field \u003cbr\u003e+to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|accessdate=December 31, 2015 |url-status=dead |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archivedate=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}} \u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Sociology of science===\u003cbr\u003e+\u003cbr\u003e+Since the superstring revolutions of the 1980s and 1990s, string theory has become the dominant paradigm of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e {{quote|The most important [reason] is that there are no other good ideas around. That's what gets most people into it. When people started to get interested in string theory they didn't know anything about it. In fact, the first reaction of most people is that the theory is extremely ugly and unpleasant, at least that was the case a few years ago when the understanding of string theory was much less developed. It was difficult for people to learn about it and to be turned on. So I think the real reason why people have got attracted by it is because there is no other game in town. All other approaches of constructing grand unified theories, which were more conservative to begin with, and only gradually became more and more radical, have failed, and this game hasn't failed yet.\u003cref\u003e[[#Woit|Woit]], pp. 224\u2013225\u003c\u002fref\u003e}}\u003cbr\u003e \u003cbr\u003e@@ -346,12 +356,12 @@\u003cbr\u003e \u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-== Notes ==\u003cbr\u003e+==Notes ==\u003cbr\u003e \u003cbr\u003e {{notelist}}\u003cbr\u003e {{reflist|group=note}}\u003cbr\u003e \u003cbr\u003e-== References ==\u003cbr\u003e+==References==\u003cbr\u003e \u003cbr\u003e {{reflist|30em|refs=\u003cbr\u003e \u003cref name=\"Aspinwall et al. 2009\"\u003e{{cite book |editor1-first=Paul |editor1-last=Aspinwall |editor2-first=Tom |editor2-last=Bridgeland |editor3-first=Alastair |editor3-last=Craw |editor4-first=Michael |editor4-last=Douglas |editor5-first=Mark |editor5-last=Gross |editor6-first=Anton |editor6-last=Kapustin |editor7-first=Gregory |editor7-last=Moore |editor8-first=Graeme |editor8-last=Segal |editor9-first=Bal\u00e1zs |editor9-last=Szendr\u00f6i |editor10-first=P.M.H. |editor10-last=Wilson |title=Dirichlet Branes and Mirror Symmetry |year=2  |journal=Topological Field Theory, Primitive Forms and Related Topics |pages=141\u2013175 |doi=10.1007\u002f978-1-4612-0705-4_5|isbn=978-1-4612-6874-1 |arxiv=alg-geom\u002f9701016v2 |s2cid=2884104 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=Givental1998\u003e{{cite book |last1=Givental |first1=Alexander |year=1998 |chapter=A mirror theorem for toric complete intersections |title=Topological Field Theory, Primitive Forms and Related Topics |pages=141\u2013175 |doi=10.1007\u002f978-1-4612-0705-4_5|isbn=978-1-4612-6874-1 |arxiv=alg-geom\u002f9701016v2 |s2cid=2884104 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Gubser\u003e{{cite journal | last1=Gubser| first1=Steven| last2=Klebanov| first2=Igor| last3=Polyakov| first3=Alexander | title=Gauge theory correlators from non-critical string theory | journal=Physics Letters B | volume=428 | issue=1\u20132| year=1998 | pages=105\u2013114 | arxiv=hep-th\u002f9802109|bibcode = 1998PhLB..428..105G |doi = 10.1016\u002fS0370-2693(98)00377-3 | s2cid=15693064}}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 93\u003cbr\u003e+++ Revision 94\u003cbr\u003e@@ -1,20 +1,22 @@\u003cbr\u003e-{{pp|small=yes}}\u003cbr\u003e {{short description|Theoretical framework in physics}}\u003cbr\u003e {{About|physics|string algorithms|String (computer science)||String (disambiguation)}}\u003cbr\u003e+{{pp|small=yes}}\u003cbr\u003e+{{bots|deny=Citation bot}}\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordi
