rmat= |work= |accessdate=}}\u003c\u002fref\u003e\u003cref name=\"url[1611.03668] The loop gravity string\"\u003e{{cite web |url=https:\u002f\u002farxiv.org\u002fabs\u002f1611.03668 |title=[1611.03668] The loop gravity string |format= |work= |accessdate=}}\u003c\u002fref\u003e\u003cref name=\"url[1711.05693] Connecting Loop Quantum Gravity and String Theory via Quantum Geometry\"\u003e{{cite web |url=https:\u002f\u002farxiv.org\u002fabs\u002f1711.05693 |title=[1711.05693] Connecting Loop Quantum Gravity and String Theory via Quantum Geometry |format= |work= |accessdate=}}\u003c\u002fref\u003e is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries [[gravity|gravitational force]]. Thus string theory is a theory of [[quantum gravity]].\u003cbr\u003e+In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries [[gravity|gravitational force]]. Thus string theory is a theory of [[quantum gravity]].\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e ","--- Revision 53\u003cbr\u003e+++ Revision 54\u003cbr\u003e@@ -24,7 +24,7 @@\u003cbr\u003e \u003cbr\u003e One of the main developments of the past several decades in string theory was the discovery of certain 'dualities', mathematical transformations that identify one physical theory with another. Physicists studying string theory have discovered a number of these dualities between different versions of string theory, and this has led to the conjecture that all consistent versions of string theory are subsumed in a single framework known as [[M-theory]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 9\u201312\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result which relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e+Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result that relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e Since string theory incorporates all of the fundamental interactions, including gravity, many physicists hope that it will eventually be developed to the point where it fully describes our universe, making it a [[theory of everything]]. One of the goals of current research in string theory is to find a solution of the theory that reproduces the observed spectrum of elementary particles, with a small [[cosmological constant]], containing [[dark matter]] and a plausible mechanism for [[cosmic inflation]]. While there has been progress toward these goals, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of details.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 3, 15\u201316\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -43,7 +43,7 @@\u003cbr\u003e \u003cbr\u003e In theories of particle physics based on string theory, the characteristic length scale of strings is assumed to be on the order of the [[Planck length]], or {{math|10\u003csup\u003e\u221235\u003c\u002fsup\u003e}} meters, the scale at which the effects of quantum gravity are believed to become significant.\u003cref name=\"Becker, Becker 2007, p. 6\"\u002f\u003e On much larger length scales, such as the scales visible in physics laboratories, such objects would be indistinguishable from zero-dimensional point particles, and the vibrational state of the string would determine the type of particle. One of the vibrational states of a string corresponds to the graviton, a quantum mechanical particle that carries the gravitational force.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles which transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e+The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles that transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e There are several versions of superstring theory: [[type I string|type I]], [[type IIA string|type IIA]], [[type IIB string|type IIB]], and two flavors of [[heterotic string]] theory ({{math|[[special orthogonal group|''SO''(32)]]}} and {{math|[[E8 (mathematics)|''E''\u003csub\u003e8\u003c\u002fsub\u003e\u00d7''E''\u003csub\u003e8\u003c\u002fsub\u003e]]}}). The different theories allow different types of strings, and the particles that arise at low energies exhibit different [[symmetry (physics)|symmetries]]. For example, the type I theory includes both open strings (which are segments with endpoints) and closed strings (which form closed loops), while types IIA, IIB and heterotic include only closed strings.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 324\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -63,7 +63,7 @@\u003cbr\u003e \u003cbr\u003e Compactification can be used to construct models in which spacetime is effectively four-dimensional. However, not every way of compactifying the extra dimensions produces a model with the right properties to describe nature. In a viable model of particle physics, the compact extra dimensions must be shaped like a [[Calabi\u2013Yau manifold]].\u003cref name=\"Yau and Nadis 2010, Ch. 6\"\u002f\u003e A Calabi\u2013Yau manifold is a special [[topological space|space]] which is typically taken to be six-dimensional in applications to string theory. It is named after mathematicians [[Eugenio Calabi]] and [[Shing-Tung Yau]].\u003cref\u003e[[#Yau|Yau and Nadis]], p. ix\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e+Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e \u003cbr\u003e ===Dualities===\u003cbr\u003e \u003cbr\u003e@@ -74,7 +74,7 @@\u003cbr\u003e \u003cbr\u003e Another relationship between different string theories is [[T-duality]]. Here one considers strings propagating around a circular extra dimension. T-duality states that a string propagating around a circle of radius {{math|''R''}} is equivalent to a string propagating around a circle of radius {{math|1\u002f''R''}} in the sense that all observable quantities in one description are identified with quantities in the dual description. For example, a string has [[momentum]] as it propagates around a circle, and it can also wind around the circle one or more times. The number of times the string winds around a circle is called the [[winding number]]. If a string has momentum {{math|''p''}} and winding number {{math|''n''}} in one description, it will have momentum {{math|''n''}} and winding number {{math|''p''}} in the dual description. For example, type IIA string theory is equivalent to type IIB string theory via T-duality, and the two versions of heterotic string theory are also related by T-duality.\u003cref name=Becker\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is example of a duality which relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e+In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is an example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is an example of a duality that relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Branes ===\u003cbr\u003e {{main|Brane}}\u003cbr\u003e@@ -108,7 +108,7 @@\u003cbr\u003e \u003cbr\u003e At around the same time, as many physicists were studying the properties of strings, a small group of physicists were examining the possible applications of higher dimensional objects. In 1987, Eric Bergshoeff, Ergin Sezgin, and Paul Townsend showed that eleven-dimensional supergravity includes two-dimensional branes.\u003cref name=Bergshoeff\u002f\u003e Intuitively, these objects look like sheets or membranes propagating through the eleven-dimensional spacetime. Shortly after this discovery, [[Michael Duff (physicist)|Michael Duff]], Paul Howe, Takeo Inami, and Kellogg Stelle considered a particular compactification of eleven-dimensional supergravity with one of the dimensions curled up into a circle.\u003cref name=Duff1987\u002f\u003e In this setting, one can imagine the membrane wrapping around the circular dimension. If the radius of the circle is sufficiently small, then this membrane looks just like a string in ten-dimensional spacetime. Duff and his collaborators showed that this construction reproduces exactly the strings appearing in type IIA superstring theory.\u003cref\u003e[[#Duff1998|Duff]], p. 66\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e+Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher-dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Initially, some physicists suggested that the new theory was a fundamental theory of membranes, but Witten was skeptical of the role of membranes in the theory. In a paper from 1996, Ho\u0159ava and Witten wrote \"As it has been proposed that the eleven-dimensional theory is a supermembrane theory but there are some reasons to doubt that interpretation, we will non-committally call it the M-theory, leaving to the future the relation of M to membranes.\"\u003cref name=Horava\u002f\u003e In the absence of an understanding of the true meaning and structure of M-theory, Witten has suggested that the ''M'' should stand for \"magic\", \"mystery\", or \"membrane\" according to taste, and the true meaning of the title should be decided when a more fundamental formulation of the theory is known.\u003cref name=Duff1996\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -130,7 +130,7 @@\u003cbr\u003e \u003cbr\u003e In the branch of physics called [[statistical mechanics]], [[entropy]] is a measure of the randomness or disorder of a physical system. This concept was studied in the 1870s by the Austrian physicist [[Ludwig Boltzmann]], who showed that the [[thermodynamics|thermodynamic]] properties of a [[gas]] could be derived from the combined properties of its many constituent [[molecule]]s. Boltzmann argued that by averaging the behaviors of all the different molecules in a gas, one can understand macroscopic properties such as volume, temperature, and pressure. In addition, this perspective led him to give a precise definition of entropy as the [[natural logarithm]] of the number of different states of the molecules (also called ''microstates'') that give rise to the same macroscopic features.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 187\u2013188\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation is lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e+In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation are lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e \u003cbr\u003e :\u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e@@ -182,7 +182,7 @@\u003cbr\u003e \u003cbr\u003e In addition to its applications to theoretical problems in quantum gravity, the AdS\u002fCFT correspondence has been applied to a variety of problems in quantum field theory. One physical system that has been studied using the AdS\u002fCFT correspondence is the [[quark\u2013gluon plasma]], an exotic [[state of matter]] produced in [[particle accelerator]]s. This state of matter arises for brief instants when heavy [[ions]] such as [[gold]] or [[lead]] nuclei are collided at high energies. Such collisions cause the [[quarks]] that make up atomic nuclei to [[deconfinement|deconfine]] at temperatures of approximately two [[1,000,000,000,000|trillion]] [[kelvin]], conditions similar to those present at around {{math|10\u003csup\u003e\u221211\u003c\u002fsup\u003e}} seconds after the [[Big Bang]].\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 559\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark\u2013gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark\u2013gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark\u2013gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e+The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark-gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark-gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark-gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark-gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e \u003cbr\u003e ===Applications to condensed matter physics===\u003cbr\u003e \u003cbr\u003e@@ -196,7 +196,7 @@\u003cbr\u003e \u003cbr\u003e {{main|String phenomenology}}\u003cbr\u003e \u003cbr\u003e-In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e+In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real-world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e \u003cbr\u003e Partly because of theoretical and mathematical difficulties and partly because of the extremely high energies needed to test these theories experimentally, there is so far no experimental evidence that would unambiguously point to any of these models being a correct fundamental description of nature. This has led some in the community to criticize these approaches to unification and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -212,11 +212,11 @@\u003cbr\u003e \u003cbr\u003e [[File:Ilc 9yr moll4096.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e \u003cbr\u003e-The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e+The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be the same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Currently, the leading candidate for a theory going beyond the Big Bang is the theory of cosmic inflation. Developed by [[Alan Guth]] and others in the 1980s, inflation postulates a period of extremely rapid accelerated expansion of the universe prior to the expansion described by the standard Big Bang theory. The theory of cosmic inflation preserves the successes of the Big Bang while providing a natural explanation for some of the mysterious features of the universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 531\u003c\u002fref\u003e The theory has also received striking support from observations of the cosmic microwave background, the radiation that has filled the sky since around 380,000 years after the Big Bang.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 538\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory, and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e+In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ==Connections to mathematics==\u003cbr\u003e \u003cbr\u003e@@ -248,13 +248,13 @@\u003cbr\u003e \u003cbr\u003e [[Group theory]] is the branch of mathematics that studies the concept of [[symmetry]]. For example, one can consider a geometric shape such as an equilateral triangle. There are various operations that one can perform on this triangle without changing its shape. One can rotate it through 120\u00b0, 240\u00b0, or 360\u00b0, or one can reflect in any of the lines labeled {{math|''S''\u003csub\u003e0\u003c\u002fsub\u003e}}, {{math|''S''\u003csub\u003e1\u003c\u002fsub\u003e}}, or {{math|''S''\u003csub\u003e2\u003c\u002fsub\u003e}} in the picture. Each of these operations is called a ''symmetry'', and the collection of these symmetries satisfies certain technical properties making it into what mathematicians call a [[group (mathematics)|group]]. In this particular example, the group is known as the [[dihedral group]] of [[order (group theory)|order]] 6 because it has six elements. A general group may describe finitely many or infinitely many symmetries; if there are only finitely many symmetries, it is called a [[finite group]].\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups which may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem which provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e+Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups that may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem that provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e This classification theorem identifies several infinite families of groups as well as 26 additional groups which do not fit into any family. The latter groups are called the \"sporadic\" groups, and each one owes its existence to a remarkable combination of circumstances. The largest sporadic group, the so-called [[monster group]], has over {{math|10\u003csup\u003e53\u003c\u002fsup\u003e}} elements, more than a thousand times the number of atoms in the Earth.\u003cref name=\"Klarreich 2015\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e [[Image:KleinInvariantJ.jpg|right|thumb|300px|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e \u003cbr\u003e-A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics which seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e+A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics that seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1992, [[Richard Borcherds]] constructed a bridge between the theory of modular functions and finite groups and, in the process, explained the observations of McKay and Thompson.\u003cref\u003e[[#Gannon|Gannon]], p. 8\u003c\u002fref\u003e\u003cref name=Borcherds\u002f\u003e Borcherds' work used ideas from string theory in an essential way, extending earlier results of [[Igor Frenkel]], [[James Lepowsky]], and [[Arne Meurman]], who had realized the monster group as the symmetries of a particular{{which|date=February 2016}} version of string theory.\u003cref name=FLM\u002f\u003e In 1998, Borcherds was awarded the [[Fields medal]] for his work.\u003cref\u003e[[#Gannon|Gannon]], p. 11\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -276,7 +276,7 @@\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e-The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits, and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e \u003cbr\u003e@@ -286,7 +286,7 @@\u003cbr\u003e \u003cbr\u003e In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Jo\u00ebl Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e \u003cbr\u003e-String theory eventually made it out of the dustbin, but for the following decade all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon, and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e+String theory eventually made it out of the dustbin, but for the following decade, all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e \u003cbr\u003e ===First superstring revolution===\u003cbr\u003e \u003cbr\u003e@@ -308,7 +308,7 @@\u003cbr\u003e \u003cbr\u003e During this period, [[Tom Banks (physicist)|Tom Banks]], [[Willy Fischler]], [[Stephen Shenker]] and [[Leonard Susskind]] formulated matrix theory, a full holographic description of M-theory using IIA D0 branes.\u003cref name=Banks\u002f\u003e This was the first definition of string theory that was fully non-perturbative and a concrete mathematical realization of the [[holographic principle]]. It is an example of a gauge-gravity duality and is now understood to be a special case of the [[AdS\u002fCFT correspondence]]. [[Andrew Strominger]] and [[Cumrun Vafa]] calculated the entropy of certain configurations of D-branes and found agreement with the semi-classical answer for extreme charged black holes.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e [[Petr Ho\u0159ava (theorist)|Petr Ho\u0159ava]] and Witten found the eleven-dimensional formulation of the heterotic string theories, showing that orbifolds solve the chirality problem. Witten noted that the effective description of the physics of D-branes at low energies is by a supersymmetric gauge theory, and found geometrical interpretations of mathematical structures in gauge theory that he and [[Nathan Seiberg]] had earlier discovered in terms of the location of the branes.\u003cbr\u003e \u003cbr\u003e-In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e+In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e \u003cbr\u003e ==Criticism==\u003cbr\u003e \u003cbr\u003e@@ -334,11 +334,11 @@\u003cbr\u003e \u003cbr\u003e One of the fundamental properties of Einstein's general theory of relativity is that it is [[background independence|background independent]], meaning that the formulation of the theory does not in any way privilege a particular spacetime geometry.\u003cref\u003e[[#Smolin|Smolin]], p. 81\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-One of the main criticisms of string theory from early on is that it is not manifestly background independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e+One of the main criticisms of string theory from early on is that it is not manifestly background-independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Others have disagreed with Smolin's characterization of string theory. In a review of Smolin's book, string theorist Joseph Polchinski writes\u003cbr\u003e \u003cbr\u003e-{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory it has always been clear that the physics is background-independent even if the language being used is not, and the search for more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e+{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e \u003cbr\u003e Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field \u003cbr\u003e to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e","--- Revision 54\u003cbr\u003e+++ Revision 55\u003cbr\u003e@@ -423,7 +423,7 @@\u003cbr\u003e \u003cbr\u003e \u003cref name=\"Klarreich 2015\"\u003e{{cite web |last=Klarreich |first=Erica |title=Mathematicians chase moonshine's shadow |url=https:\u002f\u002fwww.quantamagazine.org\u002f20150312-mathematicians-chase-moonshines-shadow\u002f |website=Quanta Magazine |date=12 March 2015 |access-date=31 May 2015 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210810\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fmathematicians-chase-moonshine-string-theory-connections-20150312 |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003cref name=\"Klebanov and Maldacena 2009\"\u003e{{cite journal|last1=Klebanov |first1=Igor |last2=Maldacena |first2=Juan |title=Solving Quantum Field Theories via Curved Spacetimes |journal=[[Physics Today]] |date=2009 |url=http:\u002f\u002fwww.sns.ias.edu\u002f~malda\u002fPublished.pdf |access-date=29 December 2016 |pages=28\u201333 [28]|doi=10.1063\u002f1.3074260 |volume=62 |issue=1 |bibcode=2009PhT....62a..28K |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130702011201\u002fhttp:\u002f\u002fwww.sns.ias.edu\u002f~malda\u002fPublished.pdf |archive-date=July 2, 2013 }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=\"Klebanov and Maldacena 2009\"\u003e{{cite journal|last1=Klebanov |first1=Igor |last2=Maldacena |first2=Juan |title=Solving Quantum Field Theories via Curved Spacetimes |journal=[[Physics Today]] |date=2009 |url=http:\u002f\u002fwww.sns.ias.edu\u002f~malda\u002fPublished.pdf |access-date=29 December 2016 |pages=28\u201333 [28]|doi=10.1063\u002f1.3074260 |volume=62 |issue=1 |bibcode=2009PhT....62a..28K |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20130702011201\u002fhttp:\u002f\u002fwww.sns.ias.edu\u002f~malda\u002fPublished.pdf |archive-date=July 2, 2013 |doi-access=free }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=\"Kontsevich 1995\"\u003e{{cite book |last1=Kontsevich |first1=Maxim |title=Homological Algebra of Mirror Symmetry |year=1995 |journal=Proceedings of the International Congress of Mathematicians |pages=120\u2013139|bibcode=1994alg.geom.11018K |arxiv=alg-geom\u002f9411018 |doi=10.1007\u002f978-3-0348-9078-6_11 |isbn=978-3-0348-9897-3 |s2cid=16733945 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 55\u003cbr\u003e+++ Revision 56\u003cbr\u003e@@ -326,7 +326,7 @@\u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Compatibility with dark energy===\u003cbr\u003e-No vacuum in the string theory landscape is known to support a metastable, positive [[cosmological constant]], except possibly one unconfirmed model described by Kachru ''[[et al]].'' in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+No vacuum in the string theory landscape is known to support a metastable, positive [[cosmological constant]], except possibly one unconfirmed model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Background independence===\u003cbr\u003e ","--- Revision 56\u003cbr\u003e+++ Revision 57\u003cbr\u003e@@ -524,7 +524,7 @@\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}\u003cbr\u003e {{Industrial and applied mathematics}}\u003cbr\u003e-\u003cbr\u003e+{{Portal bar|Mathematics|Astronomy|Stars|Outer space|Science}}\u003cbr\u003e {{Authority control}}\u003cbr\u003e \u003cbr\u003e [[Category:String theory| ]]","--- Revision 57\u003cbr\u003e+++ Revision 58\u003cbr\u003e@@ -524,7 +524,7 @@\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}\u003cbr\u003e {{Industrial and applied mathematics}}\u003cbr\u003e-{{Portal bar|Mathematics|Astronomy|Stars|Outer space|Science}}\u003cbr\u003e+{{Portal bar|Physics|Mathematics|Astronomy|Stars|Outer space|Science}}\u003cbr\u003e {{Authority control}}\u003cbr\u003e \u003cbr\u003e [[Category:String theory| ]]","--- Revision 58\u003cbr\u003e+++ Revision 59\u003cbr\u003e@@ -9,7 +9,7 @@\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e \u003cbr\u003e-String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[AdS\u002fCFT correspondence]], which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e+String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e ","--- Revision 59\u003cbr\u003e+++ Revision 60\u003cbr\u003e@@ -55,7 +55,7 @@\u003cbr\u003e \u003cbr\u003e In spite of the fact that the Universe is well described by 4D spacetime, there are several reasons why physicists consider theories in other dimensions. In some cases, by modeling spacetime in a different number of dimensions, a theory becomes more mathematically tractable, and one can perform calculations and gain general insights more easily.{{efn|For example, in the context of the [[AdS\u002fCFT correspondence]], theorists often formulate and study theories of gravity in unphysical numbers of spacetime dimensions.}} There are also situations where theories in two or three spacetime dimensions are useful for describing phenomena in condensed matter physics.\u003cref name=\"Zee 2010\"\u002f\u003e Finally, there exist scenarios in which there could actually be more than 4D of spacetime which have nonetheless managed to escape detection.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 9\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-One notable feature of string theories is that these theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e+String theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Image:Calabi yau.jpg|left|thumb|alt=Visualization of a complex mathematical surface with many convolutions and self intersections.|A cross section of a quintic [[Calabi\u2013Yau manifold]] ]]\u003cbr\u003e ","--- Revision 60\u003cbr\u003e+++ Revision 61\u003cbr\u003e@@ -258,7 +258,7 @@\u003cbr\u003e \u003cbr\u003e In 1992, [[Richard Borcherds]] constructed a bridge between the theory of modular functions and finite groups and, in the process, explained the observations of McKay and Thompson.\u003cref\u003e[[#Gannon|Gannon]], p. 8\u003c\u002fref\u003e\u003cref name=Borcherds\u002f\u003e Borcherds' work used ideas from string theory in an essential way, extending earlier results of [ ing theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e {{quote|The most important [reason] is that there are no other good ideas around. That's what gets most people into it. When people started to get interested in string theory they didn't know anything about it. In fact, the first reaction of most people is that the theory is extremely ugly and unpleasant, at least that was the case a few years ago when the understanding of string theory was much less developed. It was difficult for people to learn about it and to be turned on. So I think the real reason why people have got attracted by it is because there is no other game in town. All other approaches of constructing grand unified theories, which were more conservative to begin with, and only gradually became more and more radical, have failed, and this game hasn't failed yet.\u003cref\u003e[[#Woit|Woit]], pp. 224\u2013225\u003c\u002fref\u003e}}\u003cbr\u003e ","--- Revision 63\u003cbr\u003e+++ Revision 64\u003cbr\u003e@@ -5,7 +5,7 @@\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the st
