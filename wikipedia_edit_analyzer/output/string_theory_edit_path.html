ematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+== History ==\u003cbr\u003e {{Main|History of string theory}}\u003cbr\u003e \u003cbr\u003e-===Early results===\u003cbr\u003e+=== Early results ===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e \u003cbr\u003e@@ -275,7 +266,7 @@\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e-The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits, and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e \u003cbr\u003e@@ -283,11 +274,11 @@\u003cbr\u003e \u003cbr\u003e In 1971, [[Pierre Ramond]] added fermions to the model, which led him to formulate a two-dimensional supersymmetry to cancel the wrong-sign states. [[John Henry Schwarz|John Schwarz]] and [[Andr\u00e9 Neveu]] added another sector to the fermi theory a short time later. In the fermion theories, the critical dimension was 10. [[Stanley Mandelstam]] formulated a world sheet conformal theory for both the bose and fermi case, giving a two-dimensional field theoretic path-integral to generate the operator formalism. [[Michio Kaku]] and [[Keiji Kikkawa]] gave a different formulation of the bosonic string, as a [[string field theory]], with infinitely many particle types and with fields taking values not on points, but on loops and curves.\u003cbr\u003e \u003cbr\u003e-In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Joel Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e-\u003cbr\u003e-String theory eventually made it out of the dustbin, but for the following decade all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Joel Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon, and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e-\u003cbr\u003e-===First superstring revolution===\u003cbr\u003e+In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Jo\u00ebl Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e+\u003cbr\u003e+String theory eventually made it out of the dustbin, but for the following decade, all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e+\u003cbr\u003e+=== First superstring revolution ===\u003cbr\u003e \u003cbr\u003e [[File:Edward Witten.jpg|right|thumb|upright|[[Edward Witten]]]]\u003cbr\u003e \u003cbr\u003e@@ -299,7 +290,7 @@\u003cbr\u003e \u003cbr\u003e In the 1990s, [[Joseph Polchinski]] discovered that the theory requires higher-dimensional objects, called [[D-brane]]s and identified these with the black-hole solutions of supergravity. These were understood to be the new objects suggested by the perturbative divergences, and they opened up a new field with rich mathematical structure. It quickly became clear that D-branes and other p-branes, not just strings, formed the matter content of the string theories, and the physical interpretation of the strings and branes was revealed\u2014they are a type of black hole. [[Leonard Susskind]] had incorporated the [[holographic principle]] of [[Gerardus 't Hooft]] into string theory, identifying the long highly excited string states with ordinary thermal black hole states. As suggested by 't Hooft, the fluctuations of the black hole horizon, the world-sheet or world-volume theory, describes not only the degrees of freedom of the black hole, but all nearby objects too.\u003cbr\u003e \u003cbr\u003e-===Second superstring revolution===\u003cbr\u003e+=== Second superstring revolution ===\u003cbr\u003e \u003cbr\u003e In 1995, at the annual conference of string theorists at the University of Southern California (USC), [[Edward Witten]] gave a speech on string theory that in essence united the five string theories that existed at the time, and giving birth to a new 11-dimensional theory called [[M-theory]]. M-theory was also foreshadowed in the work of [[Paul Townsend]] at approximately the same time. The flurry of activity that began at this time is sometimes called the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -307,11 +298,11 @@\u003cbr\u003e \u003cbr\u003e During this period, [[Tom Banks (physicist)|Tom Banks]], [[Willy Fischler]], [[Stephen Shenker]] and [[Leonard Susskind]] formulated matrix theory, a full holographic description of M-theory using IIA D0 branes.\u003cref name=Banks\u002f\u003e This was the first definition of string theory that was fully non-perturbative and a concrete mathematical realization of the [[holographic principle]]. It is an example of a gauge-gravity duality and is now understood to be a special case of the [[AdS\u002fCFT correspondence]]. [[Andrew Strominger]] and [[Cumrun Vafa]] calculated the entropy of certain configurations of D-branes and found agreement with the semi-classical answer for extreme charged black holes.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e [[Petr Ho\u0159ava (theorist)|Petr Ho\u0159ava]] and Witten found the eleven-dimensional formulation of the heterotic string theories, showing that orbifolds solve the chirality problem. Witten noted that the effective description of the physics of D-branes at low energies is by a supersymmetric gauge theory, and found geometrical interpretations of mathematical structures in gauge theory that he and [[Nathan Seiberg]] had earlier discovered in terms of the location of the branes.\u003cbr\u003e \u003cbr\u003e-In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e-\u003cbr\u003e-==Criticism==\u003cbr\u003e-\u003cbr\u003e-===Number of solutions===\u003cbr\u003e+In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten,\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e+\u003cbr\u003e+== Criticism ==\u003cbr\u003e+\u003cbr\u003e+=== Number of solutions ===\u003cbr\u003e {{main|String theory landscape}}\u003cbr\u003e \u003cbr\u003e To construct models of particle physics based on string theory, physicists typically begin by specifying a shape for the extra dimensions of spacetime. Each of these different shapes corresponds to a different possible universe, or \"vacuum state\", with a different collection of particles and forces. String theory as it is currently understood has an enormous number of vacuum states, typically estimated to be around {{math|10\u003csup\u003e500\u003c\u002fsup\u003e}}, and these might be sufficiently diverse to accommodate almost any phenomenon that might be observed at low energies.\u003cref\u003e[[#Woit|Woit]], pp. 240\u2013242\u003c\u002fref\u003e\u003cbr\u003e@@ -324,27 +315,26 @@\u003cbr\u003e \u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Compatibility with dark energy===\u003cbr\u003e-No vacuum in the string theory landscape is known to support a metastable, positive [[cosmological constant]], except possibly one unconfirmed model described by Kachru ''[[et al]].'' in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |accessdate=2 April 2020 |date=9 August 2018}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-===Background independence===\u003cbr\u003e-\u003cbr\u003e+=== Compatibility with dark energy ===\u003cbr\u003e+It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e+Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Background independence ===\u003cbr\u003e {{main|Background independence}}\u003cbr\u003e \u003cbr\u003e One of the fundamental properties of Einstein's general theory of relativity is that it is [[background independence|background independent]], meaning that the formulation of the theory does not in any way privilege a particular spacetime geometry.\u003cref\u003e[[#Smolin|Smolin]], p. 81\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-One of the main criticisms of string theory from early on is that it is not manifestly background independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e+One of the main criticisms of string theory from early on is that it is not manifestly background-independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Others have disagreed with Smolin's characterization of string theory. In a review of Smolin's book, string theorist Joseph Polchinski writes\u003cbr\u003e \u003cbr\u003e-{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory it has always been clear that the physics is background-independent even if the language being used is not, and the search for more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e-\u003cbr\u003e-Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field \u003cbr\u003e-to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|accessdate=December 31, 2015 |url-status=dead |archiveurl=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archivedate=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}} \u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-===Sociology of science===\u003cbr\u003e-\u003cbr\u003e-Since the superstring revolutions of the 1980s and 1990s, string theory has become the dominant paradigm of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e+{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them... In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e+\u003cbr\u003e+Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\" \u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+=== Sociology of science ===\u003cbr\u003e+\u003cbr\u003e+Since the superstring revolutions of the 1980s and 1990s, string theory has been one of the dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e {{quote|The most important [reason] is that there are no other good ideas around. That's what gets most people into it. When people started to get interested in string theory they didn't know anything about it. In fact, the first reaction of most people is that the theory is extremely ugly and unpleasant, at least that was the case a few years ago when the understanding of string theory was much less developed. It was difficult for people to learn about it and to be turned on. So I think the real reason why people have got attracted by it is because there is no other game in town. All other approaches of constructing grand unified theories, which were more conservative to begin with, and only gradually became more and more radical, have failed, and this game hasn't failed yet.\u003cref\u003e[[#Woit|Woit]], pp. 224\u2013225\u003c\u002fref\u003e}}\u003cbr\u003e \u003cbr\u003e@@ -356,26 +346,26 @@\u003cbr\u003e \u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Notes ==\u003cbr\u003e+== Notes ==\u003cbr\u003e \u003cbr\u003e {{notelist}}\u003cbr\u003e {{reflist|group=note}}\u003cbr\u003e \u003cbr\u003e-==References==\u003cbr\u003e+== References ==\u003cbr\u003e \u003cbr\u003e {{reflist|30em|refs=\u003cbr\u003e \u003cref name=\"Aspinwall et al. 2009\"\u003e{{cite book |editor1-first=Paul |editor1-last=Aspinwall |editor2-first=Tom |editor2-last=Bridgeland |editor3-first=Alastair |editor3-last=Craw |editor4-first=Michael |editor4-last=Douglas |editor5-first=Mark |editor5-last=Gross |editor6-first=Anton |editor6-last=Kapustin |editor7-first=Gregory |editor7-last=Moore |editor8-first=Graeme |editor8-last=Seg 3e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e ","--- Revision 96\u003cbr\u003e+++ Revision 97\u003cbr\u003e@@ -4,7 +4,7 @@\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]] and related objects (e.g., branes). String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantu dvances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details. That being said, string theory is a work-in-progress and our understanding of what string theory is continues to evolve.\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e ","--- Revision 98\u003cbr\u003e+++ Revision 99\u003cbr\u003e@@ -1,16 +1,18 @@\u003cbr\u003e {{short description|Theoretical framework in physics}}\u003cbr\u003e-{{About|physics|string algorithms|String (computer science)||String (disambiguation)}}\u003cbr\u003e+{{About|physics|string algorithms|String (computer science)|instrumental strings|String (music)|For other uses|String (disambiguation)}}\u003cbr\u003e {{pp|small=yes}}\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]], and related objects (e.g., branes). String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e+In [[physics]], '''string theory''' is a theory of quantum mechanics that attempts to merge quantum mechanics with [[Einstein's general theory of relativity|Einstein\u2019s general theory of relativity]]. The theory puts forth the premise of the material universe being made of tiny one-dimensional \u201c[[String (physics)|strings]]\u201d, rather than the more conventional approach in which they are modeled as [[Point particle|zero-dimensional point particles]]. String theory envisions that a string undergoing a particular mode of vibration corresponds to a particle with definite properties such as [[mass]] and [[Charge (physics)|charge]].\u003cref\u003e{{Cite web |title=String theory - Dimensions & Vibrations, M-theory, Supersymmetry {{!}} Britannica |url=https:\u002f\u002fwww.britannica.com\u002fscience\u002fstring-theory\u002fDimensions-and-vibrations |access-date=2024-01-04 |website=www.britannica.com |language=en}}\u003c\u002fref\u003e \u003cbr\u003e+\u003cbr\u003e+On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. \u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details. That being said, string theory is a work-in-progress and our understanding of what string theory is continues to evolve.\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.{{Citation needed|date=January 2024|reason=This is no evidence on this paragraph that suggest these statements are true, and no links that support such evidence.}}\u003cbr\u003e \u003cbr\u003e == Fundamentals ==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]"],"line":{"width":2.5},"marker":{"size":8,"symbol":"circle"},"mode":"lines+markers","name":"Actual Edit Path (Tail)","x":{"dtype":"f4","bdata":"ZG6VwElJmcCqmaw\u002f+qnBP\u002f3sqT95W5vAHumJQLcEjUBZ24pAcKGLQPjNhEA="},"y":{"dtype":"f4","bdata":"QTpuv+LtTr8zBSNBFZQlQZgDI0EDH3m\u002f8+2FQJ2DjEDekotANW6KQJAMoUA="},"type":"scattergl"},{"hoverinfo":"text","hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -365,7 +365,7 @@\u003cbr\u003e \u003cref name=Borcherds\u003e{{cite journal |last1=Borcherds |first1=Richard |title=Monstrous moonshine and Lie superalgebras |year=1992 |journal=Inventiones Mathematicae |volume=109 |issue=1 |pages=405\u2013444 |bibcode=1992InMat.109..405B |doi=10.1007\u002fBF01232032 |url=http:\u002f\u002fmath.berkeley.edu\u002f%7Ereb\u002fpapers\u002fmonster\u002fmonster.pdf |citeseerx=10.1.1.165.2714 |s2cid=16145482 |access-date=2017-10-25 |archive-date=2020-11-15 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210726\u002fhttps:\u002f\u002fmath.berkeley.edu\u002f~reb\u002fpapers\u002fmonster\u002fmonster.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Candelas1985\u003e{{cite journal |last1=Candelas |first1=Philip |last2=Horowitz |first2=Gary |last3=Strominger |first3= Andrew |last4=Witten |first4=Edward |date=1985 |title=Vacuum
