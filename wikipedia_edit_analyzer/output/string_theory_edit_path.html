|A [[tessellation]] of the [[hyperbolic plane]] [[tritetragonal tiling|by triangles and squares]]]]\u003cbr\u003e \u003cbr\u003e@@ -166,7 +163,7 @@\u003cbr\u003e \u003cbr\u003e An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in nongravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Applications to quantum gravity===\u003cbr\u003e+=== Applications to quantum gravity ===\u003cbr\u003e \u003cbr\u003e The discovery of the AdS\u002fCFT correspondence was a major advance in physicists' understanding of string theory and quantum gravity. One reason for this is that the correspondence provides a formulation of string theory in terms of quantum field theory, which is well understood by comparison. Another reason is that it provides a general framework in which physicists can study and attempt to resolve the paradoxes of black holes.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -174,8 +171,7 @@\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence resolves the black hole information paradox, at least to some extent, because it shows how a black hole can evolve in a manner consistent with quantum mechanics in some contexts. Indeed, one can consider black holes in the context of the AdS\u002fCFT correspondence, and any such black hole corresponds to a configuration of particles on the boundary of anti-de Sitter space.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 554\u003c\u002fref\u003e These particles obey the usual rules of quantum mechanics and in particular evolve in a unitary fashion, so the black hole must also evolve in a unitary fashion, respecting the principles of quantum mechanics.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], p. 63\u003c\u002fref\u003e In 2005, Hawking announced that the paradox had been settled in favor of information conservation by the AdS\u002fCFT correspondence, and he suggested a concrete mechanism by which black holes might preserve information.\u003cref name=Hawking2005\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Applications to nuclear physics===\u003cbr\u003e-\u003cbr\u003e+=== Applications to nuclear physics ===\u003cbr\u003e {{main|AdS\u002fQCD correspondence}}\u003cbr\u003e \u003cbr\u003e [[File:Meissner effect p1390048.jpg|thumb|left|alt=A magnet levitating over a superconducting material.|A [[magnet]] [[Meissner effect|levitating]] above a [[high-temperature superconductor]]. Today some physicists are working to understand high-temperature superconductivity using the AdS\u002fCFT correspondence.\u003cref name=\"Merali 2011\"\u002f\u003e]]\u003cbr\u003e@@ -184,30 +180,27 @@\u003cbr\u003e \u003cbr\u003e The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark-gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark-gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark-gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark-gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Applications to condensed matter physics===\u003cbr\u003e-\u003cbr\u003e+=== Applications to condensed matter physics ===\u003cbr\u003e {{main|AdS\u002fCMT correspondence}}\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence has also been used to study aspects of condensed matter physics. Over the decades, [[experimental physics|experimental]] condensed matter physicists have discovered a number of exotic states of matter, including [[superconductors]] and [[superfluids]]. These states are described using the formalism of quantum field theory, but some phenomena are difficult to explain using standard field theoretic techniques. Some condensed matter theorists including [[Subir Sachdev]] hope that the AdS\u002fCFT correspondence will make it possible to describe these systems in the language of string theory and learn more about their behavior.\u003cref name=\"Merali 2011\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on [[Planck's constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==Phenomenology==\u003cbr\u003e-\u003cbr\u003e+== Phenomenology ==\u003cbr\u003e {{main|String phenomenology}}\u003cbr\u003e \u003cbr\u003e In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real-world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e \u003cbr\u003e Partly because of theoretical and mathematical difficulties and partly because of the extremely high energies needed to test these theories experimentally, there is so far no experimental evidence that would unambiguously point to any of these models being a correct fundamental description of nature. This has led some in the community to criticize these approaches to unification and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Particle physics===\u003cbr\u003e+=== Particle physics ===\u003cbr\u003e \u003cbr\u003e The currently accepted theory describing elementary particles and their interactions is known as the [[standard model of particle physics]]. This theory provides a unified description of three of the fundamental forces of nature: electromagnetism and the strong and weak nuclear forces. Despite its remarkable success in explaining a wide range of physical phenomena, the standard model cannot be a complete description of reality. This is because the standard model fails to incorporate the force of gravity and because of problems such as the [[hierarchy problem]] and the inability to explain the structure of fermion masses or dark matter.\u003cbr\u003e \u003cbr\u003e String theory has been used to construct a variety of models of particle physics going beyond the standard model. Typically, such models are based on the idea of compactification. Starting with the ten- or eleven-dimensional spacetime of string or M-theory, physicists postulate a shape for the extra dimensions. By choosing this shape appropriately, they can construct models roughly similar to the standard model of particle physics, together with additional undiscovered particles.\u003cref name=Candelas1985\u002f\u003e One popular way of deriving realistic physics from string theory is to start with the heterotic theory in ten dimensions and assume that the six extra dimensions of spacetime are shaped like a six-dimensional Calabi\u2013Yau manifold. Such compactifications offer many ways of extracting realistic physics from string theory. Other similar methods can be used to construct realistic or semi-realistic models of our four-dimensional world based on M-theory.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 147\u2013150\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Cosmology===\u003cbr\u003e-\u003cbr\u003e+=== Cosmology ===\u003cbr\u003e {{main|String cosmology}}\u003cbr\u003e \u003cbr\u003e [[File:Ilc 9yr moll4096.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e@@ -218,12 +211,11 @@\u003cbr\u003e \u003cbr\u003e In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Connections to mathematics==\u003cbr\u003e+== Connections to mathematics ==\u003cbr\u003e \u003cbr\u003e In addition to influencing research in [[theoretical physics]], string theory has stimulated a number of major developments in [[pure mathematics]]. Like many developing ideas in theoretical physics, string theory does not at present have a [[mathematical rigor|mathematically rigorous]] formulation in which all of its concepts can be defined precisely. As a result, physicists who study string theory are often guided by physical intuition to conjecture relationships between the seemingly different mathematical structures that are used to formalize different parts of the theory. These conjectures are later proved by mathematicians, and in this way, string theory serves as a source of new ideas in pure mathematics.\u003cref name=Deligne\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Mirror symmetry===\u003cbr\u003e-\u003cbr\u003e+=== Mirror symmetry ===\u003cbr\u003e {{main|Mirror symmetry (string theory)}}\u003cbr\u003e \u003cbr\u003e [[File:Clebsch Cubic.png|thumb|right|alt=A complex mathematical surface in three dimensions.|The [[Clebsch cubic]] is an example of a kind of geometric object called an [[algebraic variety]]. A classical result of [[enumerative geometry]] states that there are exactly 27 straight lines that lie entirely on this surface.]]\u003cbr\u003e@@ -240,8 +232,7 @@\u003cbr\u003e \u003cbr\u003e Originally, these results of Candelas were justified on physical grounds. However, mathematicians generally prefer rigorous proofs that do not require an appeal to physical intuition. Inspired by physicists' work on mirror symmetry, mathematicians have therefore constructed their own arguments proving the enumerative predictions of mirror symmetry.{{efn|Two independent mathematical proofs of mirror symmetry were given by Givental\u003cref name=Givental1996\u002f\u003e\u003cref name=Givental1998\u002f\u003e and Lian et al.\u003cref name=Lian1997\u002f\u003e\u003cref name=Lian1999\u002f\u003e\u003cref name=Lian2000\u002f\u003e}} Today mirror symmetry is an active area of research in mathematics, and mathematicians are working to develop a more complete mathematical understanding of mirror symmetry based on physicists' intuition.\u003cref\u003e[[#Hori|Hori]], p. xix\u003c\u002fref\u003e Major approaches to mirror symmetry include the [[homological mirror symmetry]] program of [[Maxim Kontsevich]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and the [[SYZ conjecture]] of Andrew Strominger, Shing-Tung Yau, and [[Eric Zaslow]].\u003cref name=SYZ\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Monstrous moonshine===\u003cbr\u003e-\u003cbr\u003e+=== Monstrous moonshine ===\u003cbr\u003e {{main|Monstrous moonshine}}\u003cbr\u003e \u003cbr\u003e [[File:Labeled Triangle Reflections.svg|left|thumb|200px|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e@@ -260,11 +251,10 @@\u003cbr\u003e \u003cbr\u003e Since the 1990s, the connection between string theory and moonshine has led to further results in mathematics and physics.\u003cref name=\"Klarreich 2015\"\u002f\u003e In 2010, physicists [[Tohru Eguchi]], [[Hirosi Ooguri]], and Yuji Tachikawa discovered connections between a different sporadic group, the [[Mathieu group M24|Mathieu group {{math|''M''\u003csub\u003e24\u003c\u002fsub\u003e}}]], and a certain version{{which|date=November 2016}} of string theory.\u003cref name=EOT\u002f\u003e [[Miranda Cheng]], John Duncan, and [[Jeffrey A. Harvey]] proposed a generalization of this moonshine phenomenon called [[umbral moonshine]],\u003cref name=CDH\u002f\u003e and their conjecture was proved mathematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==History==\u003cbr\u003e-\u003cbr\u003e+== History ==\u003cbr\u003e {{Main|History of string theory}}\u003cbr\u003e \u003cbr\u003e-===Early results===\u003cbr\u003e+=== Early results ===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e \u003cbr\u003e@@ -288,7 +278,7 @@\u003cbr\u003e \u003cbr\u003e String theory eventually made it out of the dustbin, but for the following decade, all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e \u003cbr\u003e-===First superstring revolution===\u003cbr\u003e+=== First superstring revolution ===\u003cbr\u003e \u003cbr\u003e [[File:Edward Witten.jpg|right|thumb|upright|[[Edward Witten]]]]\u003cbr\u003e \u003cbr\u003e@@ -300,7 +290,7 @@\u003cbr\u003e \u003cbr\u003e In the 1990s, [[Joseph Polchinski]] discovered that the theory requires higher-dimensional objects, called [[D-brane]]s and identified these with the black-hole solutions of supergravity. These were understood to be the new objects suggested by the perturbative divergences, and they opened up a new field with rich mathematical structure. It quickly became clear that D-branes and other p-branes, not just strings, formed the matter content of the string theories, and the physical interpretation of the strings and branes was revealed\u2014they are a type of black hole. [[Leonard Susskind]] had incorporated the [[holographic principle]] of [[Gerardus 't Hooft]] into string theory, identifying the long highly excited string states with ordinary thermal black hole states. As suggested by 't Hooft, the fluctuations of the black hole horizon, the world-sheet or world-volume theory, describes not only the degrees of freedom of the black hole, but all nearby objects too.\u003cbr\u003e \u003cbr\u003e-===Second superstring revolution===\u003cbr\u003e+=== Second superstring revolution ===\u003cbr\u003e \u003cbr\u003e In 1995, at the annual conference of string theorists at the University of Southern California (USC), [[Edward Witten]] gave a speech on string theory that in essence united the five string theories that existed at the time, and giving birth to a new 11-dimensional theory called [[M-theory]]. M-theory was also foreshadowed in the work of [[Paul Townsend]] at approximately the same time. The flurry of activity that began at this time is sometimes called the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -310,9 +300,9 @@\u003cbr\u003e \u003cbr\u003e In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten,\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e \u003cbr\u003e-==Criticism==\u003cbr\u003e-\u003cbr\u003e-===Number of solutions===\u003cbr\u003e+== Criticism ==\u003cbr\u003e+\u003cbr\u003e+=== Number of solutions ===\u003cbr\u003e {{main|String theory landscape}}\u003cbr\u003e \u003cbr\u003e To construct models of particle physics based on string theory, physicists typically begin by specifying a shape for the extra dimensions of spacetime. Each of these different shapes corresponds to a different possible universe, or \"vacuum state\", with a different collection of particles and forces. String theory as it is currently understood has an enormous number of vacuum states, typically estimated to be around {{math|10\u003csup\u003e500\u003c\u002fsup\u003e}}, and these might be sufficiently diverse to accommodate almost any phenomenon that might be observed at low energies.\u003cref\u003e[[#Woit|Woit]], pp. 240\u2013242\u003c\u002fref\u003e\u003cbr\u003e@@ -325,12 +315,11 @@\u003cbr\u003e \u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Compatibility with dark energy===\u003cbr\u003e+=== Compatibility with dark energy ===\u003cbr\u003e It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Background independence===\u003cbr\u003e-\u003cbr\u003e+=== Background independence ===\u003cbr\u003e {{main|Background independence}}\u003cbr\u003e \u003cbr\u003e One of the fundamental properties of Einstein's general theory of relativity is that it is [[background independence|background independent]], meaning that the formulation of the theory does not in any way privilege a particular spacetime geometry.\u003cref\u003e[[#Smolin|Smolin]], p. 81\u003c\u002fref\u003e\u003cbr\u003e@@ -343,7 +332,7 @@\u003cbr\u003e \u003cbr\u003e Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\" \u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Sociology of science===\u003cbr\u003e+=== Sociology of science ===\u003cbr\u003e \u003cbr\u003e Since the superstring revolutions of the 1980s and 1990s, string theory has been one of dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e@@ -357,12 +346,12 @@\u003cbr\u003e \u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Notes==\u003cbr\u003e+== Notes ==\u003cbr\u003e \u003cbr\u003e {{notelist}}\u003cbr\u003e {{reflist|group=note}}\u003cbr\u003e \u003cbr\u003e-==References==\u003cbr\u003e+== References ==\u003cbr\u003e \u003cbr\u003e {{reflist|30em|refs=\u003cbr\u003e \u003cref name=\"Aspinwall et al. 2009\"\u003e{{cite book |editor1-first=Paul |editor1-last=Aspinwall |editor2-first=Tom |editor2-last=Bridgeland |editor3-first=Alastair |editor3-last=Craw |editor4-first=Michael |editor4-last=Douglas |editor5-first=Mark |editor5-last=Gross |editor6-first=Anton |editor6-last=Kapustin |editor7-first=Gregory |editor7-last=Moore |editor8-first=Graeme |editor8-last=Segal |editor9-first=Bal\u00e1zs |editor9-last=Szendr\u00f6i |editor10-first=P.M.H. |editor10-last=Wilson |title=Dirichlet Branes and Mirror Symmetry |year=2009 |publisher=American Mathematical Society | series = [[Clay Mathematics Monographs]] | volume = 4 | isbn=978-0-8218-3848-8|page=13}}\u003c\u002fref\u003e\u003cbr\u003e@@ -493,16 +482,16 @@\u003cbr\u003e * {{cite book |ref=Zwiebach|last1=Zwiebach |first1=Barton |title=A First Course in String Theory |date=2009 |publisher=Cambridge University Press |isbn=978-0-521-88032-9}}\u003cbr\u003e {{refend}}\u003cbr\u003e \u003cbr\u003e-==Further reading==\u003cbr\u003e-\u003cbr\u003e-===Popular science===\u003cbr\u003e+== Further reading ==\u003cbr\u003e+\u003cbr\u003e+=== Popular science ===\u003cbr\u003e * {{Cite book| first = Brian | last = Greene | year = 2003 | title = The Elegant Universe: Superstrings, Hidden Dimensions, and the Quest for the Ultimate Theory | publisher = W.W. Norton & Company | location = New York | isbn = 978-0-393-05858-1 | title-link = The Elegant Universe: Superstrings, Hidden Dimensions, and the Quest for the Ultimate Theory }}\u003cbr\u003e * {{Cite book| first = Brian | last = Greene | year = 2004 | title = The Fabric of the Cosmos: Space, Time, and the Texture of Reality | publisher = Alfred A. Knopf | location = New York | isbn = 978-0-375-41288-2 | title-link = The Fabric of the Cosmos: Space, Time, and the Texture of Reality | bibcode = 2004fcst.book.....G }}\u003cbr\u003e * {{Cite book| first = Roger | last = Penrose | year = 2005 | title = The Road to Reality: A Complete Guide to the Laws of the Universe | publisher = Knopf | isbn = 978-0-679-45443-4 | title-link = The Road to Reality: A Complete Guide to the Laws of the Universe }}\u003cbr\u003e * {{Cite book| first = Lee | last = Smolin | year = 2006 | title = The Trouble with Physics: The Rise of String Theory, the Fall of a Science, and What Comes Next | publisher = Houghton Mifflin Co. | location = New York | isbn = 978-0-618-55105-7 | title-link = The Trouble with Physics: The Rise of String Theory, the Fall of a Science, and What Comes Next }}\u003cbr\u003e * {{Cite book| first = Peter | last = Woit | year = 2006 | title = Not Even Wrong: The Failure of String Theory And the Search for Unity in Physical Law | publisher = New York: Basic Books | location = London: Jonathan Cape & | isbn = 978-0-465-09275-8 \u003c!-- both are correct --\u003e}}\u003cbr\u003e \u003cbr\u003e-===Textbooks===\u003cbr\u003e+=== Textbooks ===\u003cbr\u003e * {{cite book |last1=Becker |first1=K. |last2=Becker |first2=M. |last3=Schwarz |first3=J.H. |title=String Theory and M-Theory: A Modern Introduction |publisher=Cambridge University Press |date=2006 |isbn=978-0521860697 }}\u003cbr\u003e * {{cite book |last1=Blumenhagen |first1=R. |last2=L\u00fcst |first2=D. |last3=Theisen |first3=S. |title=Basic Concepts of String Theory |publisher=Springer |date=2012 |isbn=978-3642294969 }}\u003cbr\u003e * {{cite book |last1=Green |first1=Michael |last2=Schwarz |first2=John |last3=Witten |first3=Edward |title=Superstring theory. Vol. 1: Introduction |publisher=Cambridge University Press |date=2012 |isbn=978-1107029118 }}\u003cbr\u003e@@ -515,7 +504,7 @@\u003cbr\u003e * {{cite book |last1=West|first1=P. |title=Introduction to Strings and Branes |publisher=Cambridge University Press |date=2012 |isbn=978-0521817479 }}\u003cbr\u003e * {{cite book |last1=Zwiebach |first1=Barton |title=A First Course in String Theory |date=2009 |publisher=Cambridge University Press |isbn=978-0-521-88032-9}}\u003cbr\u003e \u003cbr\u003e-==External links==\u003cbr\u003e+== External links ==\u003cbr\u003e {{Wiktionary}}\u003cbr\u003e {{Commons category}}\u003cbr\u003e {{Wikiquote}}","--- Revision 84\u003cbr\u003e+++ Revision 85\u003cbr\u003e@@ -510,7 +510,6 @@\u003cbr\u003e {{Wikiquote}}\u003cbr\u003e '''Websites'''\u003cbr\u003e * [http:\u002f\u002fwww.math.columbia.edu\u002f~woit\u002fblog\u002f Not Even Wrong]\u2014A blog critical of string theory\u003cbr\u003e-* [http:\u002f\u002fsuperstringtheory.com\u002f The Official String Theory Web Site]\u003cbr\u003e * [https:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e \u003cbr\u003e '''Video'''","--- Revision 85\u003cbr\u003e+++ Revision 86\u003cbr\u003e@@ -19,7 +19,7 @@\u003cbr\u003e === Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise{{Clarify|reason=What difficulties?|date=June 2023}} when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e+In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e \u003cbr\u003e String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions and many others. The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can vibrate in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. In this way, all of the different elementary particles may be viewed as [[vibrating strings]]. In string theory, one of the vibrational states of the string gives rise to the [[graviton]], a quantum mechanical particle that carries gravitational force. Thus string theory is a theory of quantum gravity.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 86\u003cbr\u003e+++ Revision 87\u003cbr\u003e@@ -334,7 +334,7 @@\u003cbr\u003e \u003cbr\u003e === Sociology of science ===\u003cbr\u003e \u003cbr\u003e-Since the superstring revolutions of the 1980s and 1990s, string theory has been one of dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e+Since the superstring revolutions of the 1980s and 1990s, string theory has been one of the dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e {{quote|The most important [reason] is that there are no other good ideas around. That's what gets most people into it. When people started to get interested in string theory they didn't know anything about it. In fact, the first reaction of most people is that the theory is extremely ugly and unpleasant, at least that was the case a few years ago when the understanding of string theory was much less developed. It was difficult for people to learn about it and to be turned on. So I think the real reason why people have got attracted by it is because there is no other game in town. All other approaches of constructing grand unified theories, which were more conservative to begin with, and only gradually became more and more radical, have failed, and this game hasn't failed yet.\u003cref\u003e[[#Woit|Woit]], pp. 224\u2013225\u003c\u002fref\u003e}}\u003cbr\u003e ","--- Revision 87\u003cbr\u003e+++ Revision 88\u003cbr\u003e@@ -228,7 +228,7 @@\u003cbr\u003e \u003cbr\u003e Generalizing this problem, one can ask how many lines can be drawn on a quintic Calabi\u2013Yau manifold, such as the one illustrated above, which is defined by a polynomial of degree five. This problem was solved by the nineteenth-century German mathematician [[Hermann Schubert]], who found that there are exactly 2,875 such lines. In 1986, geometer Sheldon Katz proved that the number of curves, such as circles, that are defined by polynomials of degree two and lie entirely in the quintic is 609,250.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 166\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parks showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e+By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parkes showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Originally, these results of Candelas were justified on physical grounds. However, mathematicians generally prefer rigorous proofs that do not require an appeal to physical intuition. Inspired by physicists' work on mirror symmetry, mathematicians have therefore constructed their own arguments proving the enumerative predictions of mirror symmetry.{{efn|Two independent mathematical proofs of mirror symmetry were given by Givental\u003cref name=Givental1996\u002f\u003e\u003cref name=Givental1998\u002f\u003e and Lian et al.\u003cref name=Lian1997\u002f\u003e\u003cref name=Lian1999\u002f\u003e\u003cref name=Lian2000\u002f\u003e}} Today mirror symmetry is an active area of research in mathematics, and mathematicians are working to develop a more complete mathematical understanding of mirror symmetry based on physicists' intuition.\u003cref\u003e[[#Hori|Hori]], p. xix\u003c\u002fref\u003e Major approaches to mirror symmetry include the [[homological mirror symmetry]] program of [[Maxim Kontsevich]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and the [[SYZ conjecture]] of Andrew Strominger, Shing-Tung Yau, and [[Eric Zaslow]].\u003cref name=SYZ\u002f\u003e\u003cbr\u003e ","--- Revision 88\u003cbr\u003e+++ Revision 89\u003cbr\u003e@@ -365,7 +365,7 @@\u003cbr\u003e \u003cref name=Borcherds\u003e{{cite journal |last1=Borcherds |first1=Richard |title=Monstrous moonshine and Lie superalgebras |year=1992 |journal=Inventiones Mathematicae |volume=109 |issue=1 |pages=405\u2013444 |bibcode=1992InMat.109..405B |doi=10.1007\u002fBF01232032 |url=http:\u002f\u002fmath.berkeley.edu\u002f%7Ereb\u002fpapers\u002fmonster\u002fmonster.pdf |citeseerx=10.1.1.165.2714 |s2cid=16145482 |access-date=2017-10-25 |archive-date=2020-11-15 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210726\u002fhttps:\u002f\u002fmath.berkeley.edu\u002f~reb\u002fpapers\u002fmonster\u002fmonster.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Candelas1985\u003e{{cite journal |last1=Candelas |first1=Philip |last2=Horowitz |first2=Gary |last3=Strominger |first3= Andrew |last4=Witten |first4=Edward |date=1985 |title=Vacuum configurations for superstrings |journal=Nuclear Physics B |volume=258 |pages=46\u201374|bibcode = 1985NuPhB.258...46C |doi=10.1016\u002f0550-3213(85)90602-9 }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cref name=Candelas1991\u003e{{cite journal |last1=Candelas |first1=Philip |last2=de la Ossa |first2=Xenia |last3=Green |first3=Paul |last4=Parks |first4=Linda |year=1991 |title=A pair of Calabi\u2013Yau manifolds as an exactly soluble superconformal field theory |journal=Nuclear Physics B |volume=359 |issue=1 |pages=21\u201374 |doi=10.1016\u002f0550-3213(91)90292-6 |bibcode = 1991NuPhB.359...21C }}\u 003e{{cite journal |last1=Kontsevich |first1=Maxim |title=Homological Algebra of Mirror Symmetry |year=1995 |journal=Proceedings of the International Congress of Mathematicians |pages=120\u2013139|bibcode=1994alg.geom.11018K |arxiv=alg-geom\u002f9411018 |doi=10.1007\u002f978-3-0348-9078-6_11 |isbn=978-3-0348-9897-3 |s2cid=16733945 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=\"Kovtun, Son, and Starinets 2001\"\u003e{{cite journal | last1 = Kovtun | first1 = P. K. | last2 = Son | first2 = Dam T. | last3 = Starinets | first3 = A. O. | title = Viscosity in strongly interacting quantum field theories from black hole physics | journal = Physical Review Letters | volume = 94 | issue = 11 | year = 2005 | bibcode = 2005PhRvL..94k1601K | page = 111601 | doi = 10.1103\u002fPhysRevLett.94.111601 | pmid = 15903845|arxiv = hep-th\u002f0405231 | s2cid = 119476733 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 90\u003cbr\u003e+++ Revision 91\u003cbr\u003e@@ -1,22 +1,20 @@\u003cbr\u003e+{{pp|small=yes}}\u003cbr\u003e {{short description|Theoretical framework in physics}}\u003cbr\u003e {{About|physics|string algorithms|String (computer science)||String (disambiguation)}}\u003cbr\u003e-{{pp|small=yes}}\u003cbr\u003e-{{bots|deny=Citation bot}}\u003cbr\u003e {{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e-\u003cbr\u003e-String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e-\u003cbr\u003e-String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e+In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries [[gravity|gravitational force]]. Thus string theory is a theory of [[quantum gravity]].\u003cbr\u003e+\u003cbr\u003e+String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details. \u003cbr\u003e+\u003cbr\u003e+String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[AdS\u002fCFT correspondence]], which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e \u003cbr\u003e-== Fundamentals ==\u003cbr\u003e+== Fundamentals==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]\u003cbr\u003e \u003cbr\u003e-=== Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e@@ -25,16 +23,16 @@\u003cbr\u003e \u003cbr\u003e One of the main developments of the past several decades in string theory was the discovery of certain 'dualities', mathematical transformations that identify one physical theory with another. Physicists studying string theory have discovered a number of these dualities between different versions of string theory, and this has led to the conjecture that all consistent versions of string theory are subsumed in a single framework known as [[M-theory]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 9\u201312\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result that relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e+Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result which relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e Since string theory incorporates all of the fundamental interactions, including gravity, many physicists hope that it will eventually be developed to the point where it fully describes our universe, making it a [[theory of everything]]. One of the goals of current research in string theory is to find a solution of the theory that reproduces the observed spectrum of elementary particles, with a small [[cosmological constant]], containing [[dark matter]] and a plausible mechanism for [[cosmic inflation]]. While there has been progress toward these goals, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of details.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 3, 15\u201316\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. The scattering of strings is most straightforwardly defined using the techniques of [[perturbation theory (quantum mechanics)|perturbation theory]], but it is not known in general how to define string theory [[Non-perturbative|nonperturbatively]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 8\u003c\u002fref\u003e It is also not clear whether there is any principle by which string theory selects its [[vacuum state]], the physical state that determines the properties of our universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 13\u201314\u003c\u002fref\u003e These problems have led some in the community to criticize these approaches to the unification of physics and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u003e[[#Woit|Woit]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Strings ===\u003cbr\u003e+===Strings===\u003cbr\u003e {{main|String (physics)}}\u003cbr\u003e \u003cbr\u003e-[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e+[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory.]]\u003cbr\u003e \u003cbr\u003e The application of quantum mechanics to physical objects such as the [[electromagnetic field]], which are extended in space and time, is known as [[quantum field theory]]. In particle physics, quantum field theories form the basis for our understanding of elementary particles, which are modeled as excitations in the fundamental fields.\u003cref name=\"Zee 2010\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -44,11 +42,11 @@\u003cbr\u003e \u003cbr\u003e In theories of particle physics based on string theory, the characteristic length scale of strings is assumed to be on the order of the [[Planck length]], or {{math|10\u003csup\u003e\u221235\u003c\u002fsup\u003e}} meters, the scale at which the effects of quantum gravity are believed to become significant.\u003cref name=\"Becker, Becker 2007, p. 6\"\u002f\u003e On much larger length scales, such as the scales visible in physics laboratories, such objects would be indistinguishable from zero-dimensional point particles, and the vibrational state of the string would determine the type of particle. One of the vibrational states of a string corresponds to the graviton, a quantum mechanical particle that carries the gravitational force.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles that transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-There are several versions of superstring theory: [[type I string|type I]], [[type IIA string|type IIA]], [[type IIB string|type IIB]], and two flavors of [[heterotic string]] theory ({{math|[[special orthogonal group|''SO''(32)]]}} and {{math|[[E8 (mathematics)|''E''\u003csub\u003e8\u003c\u002fsub\u003e\u00d7''E''\u003csub\u003e8\u003c\u002fsub\u003e]]}}). The different theories allow different types of strings, and the particles that arise at low energies exhibit different [[symmetry (physics)|symmetries]]. For example, the type I theory includes both open strings (which are segments with endpoints) and closed strings (which form closed loops), while types IIA, IIB and heterotic include only closed strings.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 324\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Extra dimensions \u003cspan class=\"anchor\" id=\"Number of dimensions\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles which transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+There are several versions of superstring theory: [[type I string|type I]], [[type IIA string|type IIA]], [[type IIB string|type IIB]], and two flavors of [[heterotic string]] theory ([[special orthogonal group|{{math|''SO''(32)}}]] and [[E8 (mathematics)|{{math|''E''\u003csub\u003e8\u003c\u002fsub\u003e\u00d7''E''\u003csub\u003e8\u003c\u002fsub\u003e}}]]). The different theories allow different types of strings, and the particles that arise at low energies exhibit different [[symmetry (physics)|symmetries]]. For example, the type I theory includes both open strings (which are segments with endpoints) and closed strings (which form closed loops), while types IIA, IIB and heterotic include only closed strings.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 324\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==={{anchor|Number of dimensions}}Extra dimensions===\u003cbr\u003e \u003cbr\u003e [[File:Compactification example.svg|right|thumb|alt=A tubular surface and corresponding one-dimensional curve.|An example of [[compactification (physics)|compactification]]: At large distances, a two dimensional surface with one circular dimension looks one-dimensional.]]\u003cbr\u003e \u003cbr\u003e@@ -56,7 +54,7 @@\u003cbr\u003e \u003cbr\u003e In spite of the fact that the Universe is well described by 4D spacetime, there are several reasons why physicists consider theories in other dimensions. In some cases, by modeling spacetime in a different number of dimensions, a theory becomes more mathematically tractable, and one can perform calculations and gain general insights more easily.{{efn|For example, in the context of the [[AdS\u002fCFT correspondence]], theorists often formulate and study theories of gravity in unphysical numbers of spacetime dimensions.}} There are also situations where theories in two or three spacetime dimensions are useful for describing phenomena in condensed matter physics.\u003cref name=\"Zee 2010\"\u002f\u003e Finally, there exist scenarios in which there could actually be more than 4D of spacetime which have nonetheless managed to escape detection.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 9\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-String theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e+One notable feature of string theories is that these theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Image:Calabi yau.jpg|left|thumb|alt=Visualization of a complex mathematical surface with many convolutions and self intersections.|A cross section of a quintic [[Calabi\u2013Yau manifold]] ]]\u003cbr\u003e \u003cbr\u003e@@ -64,9 +62,10 @@\u003cbr\u003e \u003cbr\u003e Compactification can be used to construct models in which spacetime is effectively four-dimensional. However, not every way of compactifying the extra dimensions produces a model with the right properties to describe nature. In a viable model of particle physics, the compact extra dimensions must be shaped like a [[Calabi\u2013Yau manifold]].\u003cref name=\"Yau and Nadis 2010, Ch. 6\"\u002f\u003e A Calabi\u2013Yau manifold is a special [[topological space|space]] which is typically taken to be six-dimensional in applications to string theory. It is named after mathematicians [[Eugenio Calabi]] and [[Shing-Tung Yau]].\u003cref\u003e[[#Yau|Yau and Nadis]], p. ix\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== Dualities ===\u003cbr\u003e+Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+===Dualities===\u003cbr\u003e+\u003cbr\u003e [[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|450px|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e \u003cbr\u003e {{main|S-duality|T-duality}}\u003cbr\u003e@@ -74,11 +73,11 @@\u003cbr\u003e \u003cbr\u003e Another relationship between different string theories is [[T-duality]]. Here one considers strings propagating around a circular extra dimension. T-duality states that a string propagating around a circle of radius {{math|''R''}} is equivalent to a string propagating around a circle of radius {{math|1\u002f''R''}} in the sense that all observable quantities in one description are identified with quantities in the dual description. For example, a string has [[momentum]] as it propagates around a circle, and it can also wind around the circle one or more times. The number of times the string winds around a circle is called the [[winding number]]. If a string has momentum {{math|''p''}} and winding number {{math|''n''}} in one description, it will have momentum {{math|''n''}} and winding number {{math|''p''}} in the dual description. For example, type IIA string theory is equivalent to type IIB string theory via T-duality, and the two versions of heterotic string theory are also related by T-duality.\u003cref name=Becker\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is an example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is an example of a duality that relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e+In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is example of a duality which relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Branes ===\u003cbr\u003e {{main|Brane}}\u003cbr\u003e-[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s]]\u003cbr\u003e+[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s.]]\u003cbr\u003e \u003cbr\u003e In string theory and other related theories, a [[brane]] is a physical object that generalizes the notion of a point particle to higher dimensions. For instance, a point particle can be viewed as a brane of dimension zero, while a string can be viewed as a brane of dimension one. It is also possible to consider higher-dimensional branes. In dimension ''p'', these are called ''p''-branes. The word brane comes from the word \"membrane\" which refers to a two-dimensional brane.\u003cref name=\"Moore 2005, p. 214\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -88,17 +87,17 @@\u003cbr\u003e \u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== M-theory ==\u003cbr\u003e+==M-theory==\u003cbr\u003e \u003cbr\u003e {{main|M-theory}}\u003cbr\u003e \u003cbr\u003e Prior to 1995, theorists believed that there were five consistent versions of superstring theory (type I, type IIA, type IIB, and two versions of heterotic string theory). This understanding changed in 1995 when [[Edward Witten]] suggested that the five theories were just special limiting cases of an eleven-dimensional theory called M-theory. Witten's conjecture was based on the work of a number of other physicists, including [[Ashoke Sen]], [[Chris Hull]], [[Paul Townsend]], and [[Michael Duff (physicist)|Michael Duff]]. His announcement led to a flurry of research activity now known as the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u003e[[#Duff1998|Duff]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Unification of superstring theories ===\u003cbr\u003e+===Unification of superstring theories===\u003cbr\u003e \u003cbr\u003e [[File:Limits of M-theory.svg|right|350px|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e \u003cbr\u003e-In the 1970s, many physicists became interested in [[supergravity]] theories, which combine general relativity with supersymmetry. Whereas general relativity makes sense in any number of dimensions, supergravity places an upper limit on the number of dimensions.\u003cref\u003e[[#Duff1998|Duff]], p. 64\u003c\u002fref\u003e In 1978, work by [[Werner Nahm]] showed that the maximum spacetime dimension in which one can formulate a consistent supersymmetric theory is eleven.\u003cref name=Nahm\u002f\u003e In the same year, [[Eugene Cremmer]], [[Bernard Julia]], and [[Jo\u00ebl Scherk]] of the [[\u00c9cole Normale Sup\u00e9rieure]] showed that supergravity not only permits up to eleven dimensions but is in fact most elegant in this maximal number of dimensions.\u003cref name=Cremmer\u002f\u003e\u003cref name=\"Duff 1998, p. 65\"\u003e[[#Duff1998|Duff]], p. 65\u003c\u002fref\u003e\u003cbr\u003e+In the 1970s, many physicists became interested in [[supergravity]] theories, which combine general relativity with supersymmetry. Whereas general relativity makes sense in any number of dimensions, supergravity places an upper limit on the number of dimensions.\u003cref\u003e[[#Duff1998|Duff]], p. 64\u003c\u002fref\u003e In 1978, work by [[Werner Nahm]] showed that the maximum spacetime dimension in which one can formulate a consistent supersymmetric theory is eleven.\u003cref name=Nahm\u002f\u003e In the same year, [[Eugene Cremmer]], [[Bernard Julia]], and [[Joel Scherk]] of the [[\u00c9cole Normale Sup\u00e9rieure]] showed that supergravity not only permits up to eleven dimensions but is in fact most elegant in this maximal number of dimensions.\u003cref name=Cremmer\u002f\u003e\u003cref name=\"Duff 1998, p. 65\"\u003e[[#Duff1998|Duff]], p. 65\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Initially, many physicists hoped that by compactifying eleven-dimensional supergravity, it might be possible to construct realistic models of our four-dimensional world. The hope was that such models would provide a unified description of the four fundamental forces of nature: electromagnetism, the [[strong nuclear force|strong]] and [[weak nuclear force]]s, and gravity. Interest in eleven-dimensional supergravity soon waned as various flaws in this scheme were discovered. One of the problems was that the laws of physics appear to distinguish between clockwise and counterclockwise, a phenomenon known as [[chirality (physics)|chirality]]. Edward Witten and others observed this chirality property cannot be readily derived by compactifying from eleven dimensions.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -108,11 +107,12 @@\u003cbr\u003e \u003cbr\u003e At around the same time, as many physicists were studying the properties of strings, a small group of physicists were examining the possible applications of higher dimensional objects. In 1987, Eric Bergshoeff, Ergin Sezgin, and Paul Townsend showed that eleven-dimensional supergravity includes two-dimensional branes.\u003cref name=Bergshoeff\u002f\u003e Intuitively, these objects look l
