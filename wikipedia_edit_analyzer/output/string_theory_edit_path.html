u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Currently, the leading candidate for a theory going beyond the Big Bang is the theory of cosmic inflation. Developed by [[Alan Guth]] and others in the 1980s, inflation postulates a period of extremely rapid accelerated expansion of the universe prior to the expansion described by the standard Big Bang theory. The theory of cosmic inflation preserves the successes of the Big Bang while providing a natural explanation for some of the mysterious features of the universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 531\u003c\u002fref\u003e The theory has also received striking support from observations of the cosmic microwave background, the radiation that has filled the sky since around 380,000 years after the Big Bang.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 538\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-== Connections to mathematics ==\u003cbr\u003e+In the theory of inflation, the rapid initial expansion of the universe is caused by a hypothetical particle called the [[inflaton]]. The exact properties of this particle are not fixed by the theory but should ultimately be derived from a more fundamental theory such as string theory.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 533\u003c\u002fref\u003e Indeed, there have been a number of attempts to identify an inflaton within the spectrum of particles described by string theory, and to study inflation using string theory. While these approaches might eventually find support in observational data such as measurements of the cosmic microwave background, the application of string theory to cosmology is still in its early stages.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 539\u2013543\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+==Connections to mathematics==\u003cbr\u003e \u003cbr\u003e In addition to influencing research in [[theoretical physics]], string theory has stimulated a number of major developments in [[pure mathematics]]. Like many developing ideas in theoretical physics, string theory does not at present have a [[mathematical rigor|mathematically rigorous]] formulation in which all of its concepts can be defined precisely. As a result, physicists who study string theory are often guided by physical intuition to conjecture relationships between the seemingly different mathematical structures that are used to formalize different parts of the theory. These conjectures are later proved by mathematicians, and in this way, string theory serves as a source of new ideas in pure mathematics.\u003cref name=Deligne\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Mirror symmetry ===\u003cbr\u003e+===Mirror symmetry===\u003cbr\u003e+\u003cbr\u003e {{main|Mirror symmetry (string theory)}}\u003cbr\u003e \u003cbr\u003e [[File:Clebsch Cubic.png|thumb|right|alt=A complex mathematical surface in three dimensions.|The [[Clebsch cubic]] is an example of a kind of geometric object called an [[algebraic variety]]. A classical result of [[enumerative geometry]] states that there are exactly 27 straight lines that lie entirely on this surface.]]\u003cbr\u003e@@ -228,33 +236,35 @@\u003cbr\u003e \u003cbr\u003e Generalizing this problem, one can ask how many lines can be drawn on a quintic Calabi\u2013Yau manifold, such as the one illustrated above, which is defined by a polynomial of degree five. This problem was solved by the nineteenth-century German mathematician [[Hermann Schubert]], who found that there are exactly 2,875 such lines. In 1986, geometer Sheldon Katz proved that the number of curves, such as circles, that are defined by polynomials of degree two and lie entirely in the quintic is 609,250.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 166\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parkes showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e+By the year 1991, most of the classical problems of enumerative geometry had been solved and interest in enumerative geometry had begun to diminish.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u003e[[#Yau|Yau and Nadis]], p. 169\u003c\u002fref\u003e The field was reinvigorated in May 1991 when physicists [[Philip Candelas]], [[Xenia de la Ossa]], Paul Green, and Linda Parks showed that mirror symmetry could be used to translate difficult mathematical questions about one Calabi\u2013Yau manifold into easier questions about its mirror.\u003cref name=Candelas1991\u002f\u003e In particular, they used mirror symmetry to show that a six-dimensional Calabi\u2013Yau manifold can contain exactly 317,206,375 curves of degree three.\u003cref name=\"Yau and Nadis 2010, p. 169\"\u002f\u003e In addition to counting degree-three curves, Candelas and his collaborators obtained a number of more general results for counting rational curves which went far beyond the results obtained by mathematicians.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 171\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Originally, these results of Candelas were justified on physical grounds. However, mathematicians generally prefer rigorous proofs that do not require an appeal to physical intuition. Inspired by physicists' work on mirror symmetry, mathematicians have therefore constructed their own arguments proving the enumerative predictions of mirror symmetry.{{efn|Two independent mathematical proofs of mirror symmetry were given by Givental\u003cref name=Givental1996\u002f\u003e\u003cref name=Givental1998\u002f\u003e and Lian et al.\u003cref name=Lian1997\u002f\u003e\u003cref name=Lian1999\u002f\u003e\u003cref name=Lian2000\u002f\u003e}} Today mirror symmetry is an active area of research in mathematics, and mathematicians are working to develop a more complete mathematical understanding of mirror symmetry based on physicists' intuition.\u003cref\u003e[[#Hori|Hori]], p. xix\u003c\u002fref\u003e Major approaches to mirror symmetry include the [[homological mirror symmetry]] program of [[Maxim Kontsevich]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and the [[SYZ conjecture]] of Andrew Strominger, Shing-Tung Yau, and [[Eric Zaslow]].\u003cref name=SYZ\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Monstrous moonshine ===\u003cbr\u003e+===Monstrous moonshine===\u003cbr\u003e+\u003cbr\u003e {{main|Monstrous moonshine}}\u003cbr\u003e \u003cbr\u003e-[[File:Labeled Triangle Reflections.svg|left|thumb|upright=1|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e+[[File:Labeled Triangle Reflections.svg|left|thumb|200px|alt=An equilateral triangle with a line joining each vertex to the midpoint of the opposite side|An equilateral triangle can be rotated through 120\u00b0, 240\u00b0, or 360\u00b0, or reflected in any of the three lines pictured without changing its shape.]]\u003cbr\u003e \u003cbr\u003e [[Group theory]] is the branch of mathematics that studies the concept of [[symmetry]]. For example, one can consider a geometric shape such as an equilateral triangle. There are various operations that one can perform on this triangle without changing its shape. One can rotate it through 120\u00b0, 240\u00b0, or 360\u00b0, or one can reflect in any of the lines labeled {{math|''S''\u003csub\u003e0\u003c\u002fsub\u003e}}, {{math|''S''\u003csub\u003e1\u003c\u002fsub\u003e}}, or {{math|''S''\u003csub\u003e2\u003c\u002fsub\u003e}} in the picture. Each of these operations is called a ''symmetry'', and the collection of these symmetries satisfies certain technical properties making it into what mathematicians call a [[group (mathematics)|group]]. In this particular example, the group is known as the [[dihedral group]] of [[order (group theory)|order]] 6 because it has six elements. A general group may describe finitely many or infinitely many symmetries; if there are only finitely many symmetries, it is called a [[finite group]].\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e-Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups that may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem that provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e+Mathematicians often strive for a [[classification theorems|classification]] (or list) of all mathematical objects of a given type. It is generally believed that finite groups are too diverse to admit a useful classification. A more modest but still challenging problem is to classify all finite ''simple'' groups. These are finite groups which may be used as building blocks for constructing arbitrary finite groups in the same way that [[prime number]]s can be used to construct arbitrary [[Integer|whole number]]s by taking products.{{efn|More precisely, a nontrivial group is called ''[[simple group|simple]]'' if its only [[normal subgroup]]s are the [[trivial group]] and the group itself. The [[Jordan\u2013H\u00f6lder theorem]] exhibits finite simple groups as the building blocks for all finite groups.}} One of the major achievements of contemporary group theory is the [[classification of finite simple groups]], a mathematical theorem which provides a list of all possible finite simple groups.\u003cref name=Dummit\u002f\u003e\u003cbr\u003e \u003cbr\u003e This classification theorem identifies several infinite families of groups as well as 26 additional groups which do not fit into any family. The latter groups are called the \"sporadic\" groups, and each one owes its existence to a remarkable combination of circumstances. The largest sporadic group, the so-called [[monster group]], has over {{math|10\u003csup\u003e53\u003c\u002fsup\u003e}} elements, more than a thousand times the number of atoms in the Earth.\u003cref name=\"Klarreich 2015\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[Image:KleinInvariantJ.jpg|thumb|upright=1.4|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e-\u003cbr\u003e-A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics that seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e+[[Image:KleinInvariantJ.jpg|right|thumb|300px|A graph of the [[j-invariant|{{math|''j''}}-function]] in the complex plane]]\u003cbr\u003e+\u003cbr\u003e+A seemingly unrelated construction is the [[j-invariant|{{math|''j''}}-function]] of [[number theory]]. This object belongs to a special class of functions called [[modular function]]s, whose graphs form a certain kind of repeating pattern.\u003cref\u003e[[#Gannon|Gannon]], p. 2\u003c\u002fref\u003e Although this function appears in a branch of mathematics which seems very different from the theory of finite groups, the two subjects turn out to be intimately related. In the late 1970s, mathematicians [[John McKay (mathematician)|John McKay]] and [[John G. Thompson|John Thompson]] noticed that certain numbers arising in the analysis of the monster group (namely, the dimensions of its [[irreducible representation]]s) are related to numbers that appear in a formula for the {{math|''j''}}-function (namely, the coefficients of its [[Fourier series]]).\u003cref\u003e[[#Gannon|Gannon]], p. 4\u003c\u002fref\u003e This relationship was further developed by [[John Horton Conway]] and [[Simon P. Norton|Simon Norton]]\u003cref name=Conway\u002f\u003e who called it [[monstrous moonshine]] because it seemed so far fetched.\u003cref\u003e[[#Gannon|Gannon]], p. 5\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In 1992, [[Richard Borcherds]] constructed a bridge between the theory of modular functions and finite groups and, in the process, explained the observations of McKay and Thompson.\u003cref\u003e[[#Gannon|Gannon]], p. 8\u003c\u002fref\u003e\u003cref name=Borcherds\u002f\u003e Borcherds' work used ideas from string theory in an essential way, extending earlier results of [[Igor Frenkel]], [[James Lepowsky]], and [[Arne Meurman]], who had realized the monster group as the symmetries of a particular{{which|date=February 2016}} version of string theory.\u003cref name=FLM\u002f\u003e In 1998, Borcherds was awarded the [[Fields medal]] for his work.\u003cref\u003e[[#Gannon|Gannon]], p. 11\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Since the 1990s, the connection between string theory and moonshine has led to further results in mathematics and physics.\u003cref name=\"Klarreich 2015\"\u002f\u003e In 2010, physicists [[Tohru Eguchi]], [[Hirosi Ooguri]], and Yuji Tachikawa discovered connections between a different sporadic group, the [[Mathieu group M24|Mathieu group {{math|''M''\u003csub\u003e24\u003c\u002fsub\u003e}}]], and a certain version{{which|date=November 2016}} of string theory.\u003cref name=EOT\u002f\u003e [[Miranda Cheng]], John Duncan, and [[Jeffrey A. Harvey]] proposed a generalization of this moonshine phenomenon called [[umbral moonshine]],\u003cref name=CDH\u002f\u003e and their conjecture was proved mathematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== History ==\u003cbr\u003e+Since the 1990s, the connection between string theory and moonshine has led to further results in mathematics and physics.\u003cref name=\"Klarreich 2015\"\u002f\u003e In 2010, physicists Tohru Eguchi, [[Hirosi Ooguri]], and Yuji Tachikawa discovered connections between a different sporadic group, the [[Mathieu group M24|Mathieu group {{math|''M''\u003csub\u003e24\u003c\u002fsub\u003e}}]], and a certain version{{which|date=November 2016}} of string theory.\u003cref name=EOT\u002f\u003e [[Miranda Cheng]], John Duncan, and [[Jeffrey A. Harvey]] proposed a generalization of this moonshine phenomenon called [[umbral moonshine]],\u003cref name=CDH\u002f\u003e and their conjecture was proved mathematically by Duncan, Michael Griffin, and [[Ken Ono]].\u003cref name=DGO\u002f\u003e Witten has also speculated that the version of string theory appearing in monstrous moonshine might be related to a certain simplified model of gravity in three spacetime dimensions.\u003cref name=Witten2007\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==History==\u003cbr\u003e+\u003cbr\u003e {{Main|History of string theory}}\u003cbr\u003e \u003cbr\u003e-=== Early results ===\u003cbr\u003e+===Early results===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e \u003cbr\u003e@@ -266,19 +276,19 @@\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e-The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits, and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e \u003cbr\u003e-In 1969\u20131970, [[Yoichiro Nambu]], [[Holger Bech Nielsen]], and [[Leonard Susskind]] recognized that the theory could be given a description in space and time in terms of strings. The scattering amplitudes were derived systematically from the action principle by [[Peter Goddard (physicist)|Peter Goddard]], [[Jeffrey Goldstone]], [[Claudio Rebbi]], and [[Charles Thorn]], giving a space-time picture to the vertex operators introduced by Veneziano and Fubini and a geometrical interpretation to the [[Virasoro algebra|Virasoro conditions]].\u003cbr\u003e+In 1969\u201370, [[Yoichiro Nambu]], [[Holger Bech Nielsen]], and [[Leonard Susskind]] recognized that the theory could be given a description in space and time in terms of strings. The scattering amplitudes were derived systematically from the action principle by [[Peter Goddard (physicist)|Peter Goddard]], [[Jeffrey Goldstone]], [[Claudio Rebbi]], and [[Charles Thorn]], giving a space-time picture to the vertex operators introduced by Veneziano and Fubini and a geometrical interpretation to the [[Virasoro algebra|Virasoro conditions]].\u003cbr\u003e \u003cbr\u003e In 1971, [[Pierre Ramond]] added fermions to the model, which led him to formulate a two-dimensional supersymmetry to cancel the wrong-sign states. [[John Henry Schwarz|John Schwarz]] and [[Andr\u00e9 Neveu]] added another sector to the fermi theory a short time later. In the fermion theories, the critical dimension was 10. [[Stanley Mandelstam]] formulated a world sheet conformal theory for both the bose and fermi case, giving a two-dimensional field theoretic path-integral to generate the operator formalism. [[Michio Kaku]] and [[Keiji Kikkawa]] gave a different formulation of the bosonic string, as a [[string field theory]], with infinitely many particle types and with fields taking values not on points, but on loops and curves.\u003cbr\u003e \u003cbr\u003e In 1974, [[Tamiaki Yoneya]] discovered that all the known string theories included a massless spin-two particle that obeyed the correct [[Ward identities]] to be a graviton. John Schwarz and [[Jo\u00ebl Scherk]] came to the same conclusion and made the bold leap to suggest that string theory was a theory of gravity, not a theory of hadrons. They reintroduced [[Kaluza\u2013Klein theory]] as a way of making sense of the extra dimensions. At the same time, [[quantum chromodynamics]] was recognized as the correct theory of hadrons, shifting the attention of physicists and apparently leaving the bootstrap program in the [[dustbin of history]].\u003cbr\u003e \u003cbr\u003e-String theory eventually made it out of the dustbin, but for the following decade, all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e-\u003cbr\u003e-=== First superstring revolution ===\u003cbr\u003e+String theory eventually made it out of the dustbin, but for the following decade all work on the theory was completely ignored. Still, the theory continued to develop at a steady pace thanks to the work of a handful of devotees. [[Ferdinando Gliozzi]], Jo\u00ebl Scherk, and [[David Olive]] realized in 1977 that the original Ramond and Neveu Schwarz-strings were separately inconsistent and needed to be combined. The resulting theory did not have a tachyon, and was proven to have space-time supersymmetry by John Schwarz and [[Michael Green (physicist)|Michael Green]] in 1984. The same year, [[Alexander Markovich Polyakov|Alexander Polyakov]] gave the theory a modern path integral formulation, and went on to develop conformal field theory extensively. In 1979, [[Daniel Friedan]] showed that the equations of motions of string theory, which are generalizations of the [[Einstein equations]] of [[general relativity]], emerge from the [[renormalization group]] equations for the two-dimensional field theory. Schwarz and Green discovered T-duality, and constructed two superstring theories\u2014IIA and IIB related by T-duality, and type I theories with open strings. The consistency conditions had been so strong, that the entire theory was nearly uniquely determined, with only a few discrete choices.\u003cbr\u003e+\u003cbr\u003e+===First superstring revolution===\u003cbr\u003e \u003cbr\u003e [[File:Edward Witten.jpg|right|thumb|upright|[[Edward Witten]]]]\u003cbr\u003e \u003cbr\u003e@@ -290,7 +300,7 @@\u003cbr\u003e \u003cbr\u003e In the 1990s, [[Joseph Polchinski]] discovered that the theory requires higher-dimensional objects, called [[D-brane]]s and identified these with the black-hole solutions of supergravity. These were understood to be the new objects suggested by the perturbative divergences, and they opened up a new field with rich mathematical structure. It quickly became clear that D-branes and other p-branes, not just strings, formed the matter content of the string theories, and the physical interpretation of the strings and branes was revealed\u2014they are a type of black hole. [[Leonard Susskind]] had incorporated the [[holographic principle]] of [[Gerardus 't Hooft]] into string theory, identifying the long highly excited string states with ordinary thermal black hole states. As suggested by 't Hooft, the fluctuations of the black hole horizon, the world-sheet or world-volume theory, describes not only the degrees of freedom of the black hole, but all nearby objects too.\u003cbr\u003e \u003cbr\u003e-=== Second superstring revolution ===\u003cbr\u003e+===Second superstring revolution===\u003cbr\u003e \u003cbr\u003e In 1995, at the annual conference of string theorists at the University of Southern California (USC), [[Edward Witten]] gave a speech on string theory that in essence united the five string theories that existed at the time, and giving birth to a new 11-dimensional theory called [[M-theory]]. M-theory was also foreshadowed in the work of [[Paul Townsend]] at approximately the same time. The flurry of activity that began at this time is sometimes called the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -298,11 +308,11 @@\u003cbr\u003e \u003cbr\u003e During this period, [[Tom Banks (physicist)|Tom Banks]], [[Willy Fischler]], [[Stephen Shenker]] and [[Leonard Susskind]] formulated matrix theory, a full holographic description of M-theory using IIA D0 branes.\u003cref name=Banks\u002f\u003e This was the first definition of string theory that was fully non-perturbative and a concrete mathematical realization of the [[holographic principle]]. It is an example of a gauge-gravity duality and is now understood to be a special case of the [[AdS\u002fCFT correspondence]]. [[Andrew Strominger]] and [[Cumrun Vafa]] calculated the entropy of certain configurations of D-branes and found agreement with the semi-classical answer for extreme charged black holes.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e [[Petr Ho\u0159ava (theorist)|Petr Ho\u0159ava]] and Witten found the eleven-dimensional formulation of the heterotic string theories, showing that orbifolds solve the chirality problem. Witten noted that the effective description of the physics of D-branes at low energies is by a supersymmetric gauge theory, and found geometrical interpretations of mathematical structures in gauge theory that he and [[Nathan Seiberg]] had earlier discovered in terms of the location of the branes.\u003cbr\u003e \u003cbr\u003e-In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten,\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e-\u003cbr\u003e-== Criticism ==\u003cbr\u003e-\u003cbr\u003e-=== Number of solutions ===\u003cbr\u003e+In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e+\u003cbr\u003e+==Criticism==\u003cbr\u003e+\u003cbr\u003e+===Number of solutions===\u003cbr\u003e {{main|String theory landscape}}\u003cbr\u003e \u003cbr\u003e To construct models of particle physics based on string theory, physicists typically begin by specifying a shape for the extra dimensions of spacetime. Each of these different shapes corresponds to a different possible universe, or \"vacuum state\", with a different collection of particles and forces. String theory as it is currently understood has an enormous number of vacuum states, typically estimated to be around {{math|10\u003csup\u003e500\u003c\u002fsup\u003e}}, and these might be sufficiently diverse to accommodate almost any phenomenon that might be observed at low energies.\u003cref\u003e[[#Woit|Woit]], pp. 240\u2013242\u003c\u002fref\u003e\u003cbr\u003e@@ -315,26 +325,27 @@\u003cbr\u003e \u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Compatibility with dark energy ===\u003cbr\u003e-It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e-Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 | issn=0556-2821 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Background independence ===\u003cbr\u003e+===Compatibility with dark energy===\u003cbr\u003e+No vacuum in the string theory landscape is known to support a metastable, positive [[cosmological constant]], except possibly one unconfirmed model described by Kachru ''[[et al]].'' in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Background independence===\u003cbr\u003e+\u003cbr\u003e {{main|Background independence}}\u003cbr\u003e \u003cbr\u003e One of the fundamental properties of Einstein's general theory of relativity is that it is [[background independence|background independent]], meaning that the formulation of the theory does not in any way privilege a particular spacetime geometry.\u003cref\u003e[[#Smolin|Smolin]], p. 81\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-One of the main criticisms of string theory from early on is that it is not manifestly background-independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e+One of the main criticisms of string theory from early on is that it is not manifestly background independent. In string theory, one must typically specify a fixed reference geometry for spacetime, and all other possible geometries are described as perturbations of this fixed one. In his book ''[[The Trouble With Physics]]'', physicist [[Lee Smolin]] of the [[Perimeter Institute for Theoretical Physics]] claims that this is the principal weakness of string theory as a theory of quantum gravity, saying that string theory has failed to incorporate this important insight from general relativity.\u003cref\u003e[[#Smolin|Smolin]], p. 184\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Others have disagreed with Smolin's characterization of string theory. In a review of Smolin's book, string theorist Joseph Polchinski writes\u003cbr\u003e \u003cbr\u003e-{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them... In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e-\u003cbr\u003e-Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\" \u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Sociology of science ===\u003cbr\u003e-\u003cbr\u003e-Since the superstring revolutions of the 1980s and 1990s, string theory has been one of the dominant paradigms of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e+{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory it has always been clear that the physics is background-independent even if the language being used is not, and the search for more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e+\u003cbr\u003e+Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field \u003cbr\u003e+to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Sociology of science===\u003cbr\u003e+\u003cbr\u003e+Since the superstring revolutions of the 1980s and 1990s, string theory has become the dominant paradigm of high energy theoretical physics.\u003cref\u003e[[#Penrose|Penrose]], p. 1017\u003c\u002fref\u003e Some string theorists have expressed the view that there does not exist an equally successful alternative theory addressing the deep questions of fundamental physics. In an interview from 1987, [[Nobel laureate]] [[David Gross]] made the following controversial comments about the reasons for the popularity of string theory:\u003cbr\u003e \u003cbr\u003e {{quote|The most important [reason] is that there are no other good ideas around. That's what gets most people into it. When people started to get interested in string theory they didn't know anything about it. In fact, the first reaction of most people is that the theory is extremely ugly and unpleasant, at least that was the case a few years ago when the understanding of string theory was much less developed. It was difficult for people to learn about it and to be turned on. So I think the real reason why people have got attracted by it is because there is no other game in town. All other approaches of constructing grand unified theories, which were more conservative to begin with, and only gradually became more and more radical, have failed, and this game hasn't failed yet.\u003cref\u003e[[#Woit|Woit]], pp. 224\u2013225\u003c\u002fref\u003e}}\u003cbr\u003e \u003cbr\u003e@@ -346,23 +357,26 @@\u003cbr\u003e \u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-== Notes ==\u003cbr\u003e-{{Notelist}}\u003cbr\u003e-\u003cbr\u003e-== Reference
