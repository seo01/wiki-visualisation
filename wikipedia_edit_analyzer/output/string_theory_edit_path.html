], who showed that the [[thermodynamics|thermodynamic]] properties of a [[gas]] could be derived from the combined properties of its many constituent [[molecule]]s. Boltzmann argued that by averaging the behaviors of all the different molecules in a gas, one can understand macroscopic properties such as volume, temperature, and pressure. In addition, this perspective led him to give a precise definition of entropy as the [[natural logarithm]] of the number of different states of the molecules (also called ''microstates'') that give rise to the same macroscopic features.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 187\u2013188\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation are lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e+In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation may escape its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e : \u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e \u003cbr\u003e where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is the [[Boltzmann constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e","--- Revision 45\u003cbr\u003e+++ Revision 46\u003cbr\u003e@@ -507,7 +507,6 @@\u003cbr\u003e * {{cite book |last1=Zwiebach |first1=Barton |title=A First Course in String Theory |date=2009 |publisher=Cambridge University Press |isbn=978-0-521-88032-9}}\u003cbr\u003e \u003cbr\u003e == External links ==\u003cbr\u003e-*[https:\u002f\u002fwww.quantumfieldtheory.info\u002fString_Topics_Summaries.pdf Pedagogic Aids to String Theory]\u2014Introductory level overview of string theory plus aids to help understanding some of the more difficult concepts. For those who have studied quantum field theory, from the author of ''Student Friendly Quantum Field Theory''. \u003cbr\u003e * [https:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni]\u20142002 feature documentary by ''[[Horizon (British TV series)|BBC Horizon]]'', episode \"[[Parallel Universes (film)|Parallel Universes]]\", focuses on history and emergence of M-theory, and scientists involved.\u003cbr\u003e * [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni]\u20142003 [[Emmy Award]]\u2013winning, three-hour miniseries by ''[[Nova (American TV program)|Nova]]'' with [[Brian Greene]], adapted from his ''[[The Elegant Universe]]'' (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e {{Wiktionary}}","--- Revision 46\u003cbr\u003 Parallel Universes (film)|Parallel Universes]]\", focuses on history and emergence of M-theory, and scientists involved.\u003cbr\u003e+* [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html Nova's ''The Elegant Universe''], 2003 [[Emmy Award]]\u2013winning, three-hour miniseries by ''[[Nova (American TV program)|Nova]]'' with [[Brian Greene]], adapted from his ''[[The Elegant Universe]]'' (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}\u003cbr\u003e {{Industrial and applied mathematics}}","--- Revision 49\u003cbr\u003e+++ Revision 50\u003cbr\u003e@@ -1,41 +1,39 @@\u003cbr\u003e-{{Short description|Theory of subatomic structure}}\u003cbr\u003e-{{Other uses}}\u003cbr\u003e-{{Seeintro|Introduction to M-theory}}\u003cbr\u003e-{{Pp|small=yes}}\u003cbr\u003e+{{short description|Theoretical framework in physics}}\u003cbr\u003e+{{About|physics|string algorithms|String (computer science)||String (disambiguation)}}\u003cbr\u003e+{{pp|small=yes}}\u003cbr\u003e+{{bots|deny=Citation bot}}\u003cbr\u003e+{{seeintro|Introduction to M-theory}}\u003cbr\u003e {{String theory}}\u003cbr\u003e \u003cbr\u003e-In [[physics]], '''string theory''' is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string acts like a particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries the [[gravity|gravitational force]]. Thus, string theory is a theory of [[quantum gravity]].\u003cbr\u003e+In [[physics]], '''string theory'''\u003cref name=\"url[2005.09335] String Theory, Loop Quantum Gravity and Eternalism\"\u003e{{cite web |url=https:\u002f\u002farxiv.org\u002fabs\u002f2005.09335 |title=[2005.09335] String Theory, Loop Quantum Gravity and Eternalism |format= |work= |accessdate=}}\u003c\u002fref\u003e is a [[Mathematical theory|theoretical framework]] in which the [[Point particle|point-like particles]] of [[particle physics]] are replaced by [[Dimension (mathematics and physics)|one-dimensional]] objects called [[String (physics)|strings]]. String theory describes how these strings propagate through space and interact with each other. On distance scales larger than the string scale, a string looks just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the [[vibration]]al state of the string. In string theory, one of the many vibrational states of the string corresponds to the [[graviton]], a [[quantum mechanics|quantum mechanical]] particle that carries [[gravity|gravitational force]]. Thus string theory is a theory of [[quantum gravity]].\u003cbr\u003e \u003cbr\u003e String theory is a broad and varied subject that attempts to address a number of deep questions of [[fundamental physics]]. String theory has contributed a number of advances to [[mathematical physics]], which have been applied to a variety of problems in [[black hole]] physics, early universe [[Physical cosmology|cosmology]], [[nuclear physics]], and [[condensed matter physics]], and it has stimulated a number of major developments in [[pure mathematics]]. Because string theory potentially provides a unified description of gravity and particle physics, it is a candidate for a [[theory of everything]], a self-contained [[mathematical model]] that describes all [[Fundamental interaction|fundamental force]]s and forms of [[matter]]. Despite much work on these problems, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of its details.\u003cbr\u003e \u003cbr\u003e-String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in eleven dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e-\u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[String theory landscape|landscape]] of possible [[universe]]s, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e-\u003cbr\u003e-== Fundamentals ==\u003cbr\u003e+String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[AdS\u002fCFT correspondence]], which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e+\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e+\u003cbr\u003e+== Fundamentals==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]\u003cbr\u003e \u003cbr\u003e-=== Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions.  \u003cbr\u003e-\u003cbr\u003e-The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can [[vibration|vibrate]] in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle consistent with non-string models of elementary particles, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. String theory's application as a form of quantum gravity proposes a vibrational state responsible for the [[graviton]], a yet unproven quantum particle that is theorized to carry gravitational force.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e+In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e+\u003cbr\u003e+String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions and many others. The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can vibrate in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. In this way, all of the different elementary particles may be viewed as [[vibrating strings]]. In string theory, one of the vibrational states of the string gives rise to the [[graviton]], a quantum mechanical particle that carries gravitational force. Thus string theory is a theory of quantum gravity.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the main developments of the past several decades in string theory was the discovery of certain 'dualities', mathematical transformations that identify one physical theory with another. Physicists studying string theory have discovered a number of these dualities between different versions of string theory, and this has led to the conjecture that all consistent versions of string theory are subsumed in a single framework known as [[M-theory]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 9\u201312\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result that relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e+Studies of string theory have also yielded a number of results on the nature of black holes and the gravitational interaction. There are certain paradoxes that arise when one attempts to understand the quantum aspects of black holes, and work on string theory has attempted to clarify these issues. In late 1997 this line of work culminated in the discovery of the [[anti-de Sitter\u002fconformal field theory correspondence]] or AdS\u002fCFT.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 14\u201315\u003c\u002fref\u003e This is a theoretical result which relates string theory to other physical theories which are better understood theoretically. The AdS\u002fCFT correspondence has implications for the study of black holes and quantum gravity, and it has been applied to other subjects, including [[nuclear physics|nuclear]]\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e and [[condensed matter physics]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e \u003cbr\u003e Since string theory incorporates all of the fundamental interactions, including gravity, many physicists hope that it will eventually be developed to the point where it fully describes our universe, making it a [[theory of everything]]. One of the goals of current research in string theory is to find a solution of the theory that reproduces the observed spectrum of elementary particles, with a small [[cosmological constant]], containing [[dark matter]] and a plausible mechanism for [[cosmic inflation]]. While there has been progress toward these goals, it is not known to what extent string theory describes the real world or how much freedom the theory allows in the choice of details.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 3, 15\u201316\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. The scattering of strings is most straightforwardly defined using the techniques of [[perturbation theory (quantum mechanics)|perturbation theory]], but it is not known in general how to define string theory [[Non-perturbative|nonperturbatively]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 8\u003c\u002fref\u003e It is also not clear whether there is any principle by which string theory selects its [[vacuum state]], the physical state that determines the properties of our universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 13\u201314\u003c\u002fref\u003e These problems have led some in the community to criticize these approaches to the unification of physics and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u003e[[#Woit|Woit]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Strings ===\u003cbr\u003e+===Strings===\u003cbr\u003e {{main|String (physics)}}\u003cbr\u003e \u003cbr\u003e-[[Image:World lines and world sheet.svg|left|thumb|upright=1.2|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e+[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory.]]\u003cbr\u003e \u003cbr\u003e The application of quantum mechanics to physical objects such as the [[electromagnetic field]], which are extended in space and time, is known as [[quantum field theory]]. In particle physics, quantum field theories form the basis for our understanding of elementary particles, which are modeled as excitations in the fundamental fields.\u003cref name=\"Zee 2010\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -45,11 +43,11 @@\u003cbr\u003e \u003cbr\u003e In theories of particle physics based on string theory, the characteristic length scale of strings is assumed to be on the order of the [[Planck length]], or {{math|10\u003csup\u003e\u221235\u003c\u002fsup\u003e}} meters, the scale at which the effects of quantum gravity are believed to become significant.\u003cref name=\"Becker, Becker 2007, p. 6\"\u002f\u003e On much larger length scales, such as the scales visible in physics laboratories, such objects would be indistinguishable from zero-dimensional point particles, and the vibrational state of the string would determine the type of particle. One of the vibrational states of a string corresponds to the graviton, a quantum mechanical particle that carries the gravitational force.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles that transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e+The original version of string theory was [[bosonic string theory]], but this version described only [[bosons]], a class of particles which transmit forces between the matter particles, or [[fermions]]. Bosonic string theory was eventually superseded by theories called [[superstring theory|superstring theories]]. These theories describe both bosons and fermions, and they incorporate a theoretical idea called [[supersymmetry]]. In theories with supersymmetry, each boson has a counterpart which is a fermion, and vice versa.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 4\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e There are several versions of superstring theory: [[type I string|type I]], [[type IIA string|type IIA]], [[type IIB string|type IIB]], and two flavors of [[heterotic string]] theory ({{math|[[special orthogonal group|''SO''(32)]]}} and {{math|[[E8 (mathematics)|''E''\u003csub\u003e8\u003c\u002fsub\u003e\u00d7''E''\u003csub\u003e8\u003c\u002fsub\u003e]]}}). The different theories allow different types of strings, and the particles that arise at low energies exhibit different [[symmetry (physics)|symmetries]]. For example, the type I theory includes both open strings (which are segments with endpoints) and closed strings (which form closed loops), while types IIA, IIB and heterotic include only closed strings.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 324\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Extra dimensions \u003cspan class=\"anchor\" id=\"Number of dimensions\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e+==={{anchor|Number of dimensions}}Extra dimensions===\u003cbr\u003e \u003cbr\u003e [[File:Compactification example.svg|right|thumb|alt=A tubular surface and corresponding one-dimensional curve.|An example of [[compactification (physics)|compactification]]: At large distances, a two dimensional surface with one circular dimension looks one-dimensional.]]\u003cbr\u003e \u003cbr\u003e@@ -57,7 +55,7 @@\u003cbr\u003e \u003cbr\u003e In spite of the fact that the Universe is well described by 4D spacetime, there are several reasons why physicists consider theories in other dimensions. In some cases, by modeling spacetime in a different number of dimensions, a theory becomes more mathematically tractable, and one can perform calculations and gain general insights more easily.{{efn|For example, in the context of the [[AdS\u002fCFT correspondence]], theorists often formulate and study theories of gravity in unphysical numbers of spacetime dimensions.}} There are also situations where theories in two or three spacetime dimensions are useful for describing phenomena in condensed matter physics.\u003cref name=\"Zee 2010\"\u002f\u003e Finally, there exist scenarios in which there could actually be more than 4D of spacetime which have nonetheless managed to escape detection.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 9\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-String theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e+One notable feature of string theories is that these theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Image:Calabi yau.jpg|left|thumb|alt=Visualization of a complex mathematical surface with many convolutions and self intersections.|A cross section of a quintic [[Calabi\u2013Yau manifold]] ]]\u003cbr\u003e \u003cbr\u003e@@ -65,21 +63,22 @@\u003cbr\u003e \u003cbr\u003e Compactification can be used to construct models in which spacetime is effectively four-dimensional. However, not every way of compactifying the extra dimensions produces a model with the right properties to describe nature. In a viable model of particle physics, the compact extra dimensions must be shaped like a [[Calabi\u2013Yau manifold]].\u003cref name=\"Yau and Nadis 2010, Ch. 6\"\u002f\u003e A Calabi\u2013Yau manifold is a special [[topological space|space]] which is typically taken to be six-dimensional in applications to string theory. It is named after mathematicians [[Eugenio Calabi]] and [[Shing-Tung Yau]].\u003cref\u003e[[#Yau|Yau and Nadis]], p. ix\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== Dualities ===\u003cbr\u003e-[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|upright=2|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e+Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+===Dualities===\u003cbr\u003e+\u003cbr\u003e+[[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|450px|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e \u003cbr\u003e {{main|S-duality|T-duality}}\u003cbr\u003e A notable fact about string theory is that the different versions of the theory all turn out to be related in highly nontrivial ways. One of the relationships that can exist between different string theories is called [[S-duality]]. This is a relationship that says that a collection of strongly interacting particles in one theory can, in some cases, be viewed as a collection of weakly interacting particles in a completely different theory. Roughly speaking, a collection of particles is said to be strongly interacting if they combine and decay often and weakly interacting if they do so infrequently. Type I string theory turns out to be equivalent by S-duality to the {{math|''SO''(32)}} heterotic string theory. Similarly, type IIB string theory is related to itself in a nontrivial way by S-duality.\u003cref name=Becker\u003e[[#Becker|Becker, Becker and Schwarz]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Another relationship between different string theories is [[T-duality]]. Here one considers strings propagating around a circular extra dimension. T-duality states that a string propagating around a circle of radius {{math|''R''}} is equivalent to a string propagating around a circle of radius {{math|1\u002f''R''}} in the sense that all observable quantities in one description are identified with quantities in the dual description. For example, a string has [[momentum]] as it propagates around a circle, and it can also wind around the circle one or more times. The number of times the string winds around a circle is called the [[winding number]]. If a string has momentum {{math|''p''}} and winding number {{math|''n''}} in one description, it will have momentum {{math|''n''}} and winding number {{math|''p''}} in the dual description. For example, type IIA string theory is equivalent to type IIB string theory via T-duality, and the two versions of heterotic string theory are also related by T-duality.\u003cref name=Becker\u002f\u003e\u003cbr\u003e \u003cbr\u003e-In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is an example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is an example of a duality that relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e+In general, the term ''duality'' refers to a situation where two seemingly different [[physical system]]s turn out to be equivalent in a nontrivial way. Two theories related by a duality need not be string theories. For example, [[Montonen\u2013Olive duality]] is example of an S-duality relationship between quantum field theories. The AdS\u002fCFT correspondence is example of a duality which relates string theory to a quantum field theory. If two theories are related by a duality, it means that one theory can be transformed in some way so that it ends up looking just like the other theory. The two theories are then said to be ''dual'' to one another under the transformation. Put differently, the two theories are mathematically different descriptions of the same phenomena.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 376\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e === Branes ===\u003cbr\u003e {{main|Brane}}\u003cbr\u003e-[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s]]\u003cbr\u003e+[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s.]]\u003cbr\u003e \u003cbr\u003e In string theory and other related theories, a [[brane]] is a physical object that generalizes the notion of a point particle to higher dimensions. For instance, a point particle can be viewed as a brane of dimension zero, while a string can be viewed as a brane of dimension one. It is also possible to consider higher-dimensional branes. In dimension ''p'', these are called ''p''-branes. The word brane comes from the word \"membrane\" which refers to a two-dimensional brane.\u003cref name=\"Moore 2005, p. 214\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -89,18 +88,19 @@\u003cbr\u003e \u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== M-theory ==\u003cbr\u003e+==M-theory==\u003cbr\u003e+\u003cbr\u003e {{main|M-theory}}\u003cbr\u003e \u003cbr\u003e Prior to 1995, theorists believed that there were five consistent versions of superstring theory (type I, type IIA, type IIB, and two versions of heterotic string theory). This understanding changed in 1995 when [[Edward Witten]] suggested that the five theories were just special limiting cases of an eleven-dimensional theory called M-theory. Witten's conjecture was based on the work of a number of other physicists, including [[Ashoke Sen]], [[Chris Hull]], [[Paul Townsend]], and [[Michael Duff (physicist)|Michael Duff]]. His announcement led to a flurry of research activity now known as the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u003e[[#Duff1998|Duff]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Unification of superstring theories ===\u003cbr\u003e-\u003cbr\u003e-[[File:Limits of M-theory.svg|upright=1.6|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e+===Unification of superstring theories===\u003cbr\u003e+\u003cbr\u003e+[[File:Limits of M-theory.svg|right|350px|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e \u003cbr\u003e In the 1970s, many physicists became interested in [[supergravity]] theories, which combine general relativity with supersymmetry. Whereas general relativity makes sense in any number of dimensions, supergravity places an upper limit on the number of dimensions.\u003cref\u003e[[#Duff1998|Duff]], p. 64\u003c\u002fref\u003e In 1978, work by [[Werner Nahm]] showed that the maximum spacetime dimension in which one can formulate a consistent supersymmetric theory is eleven.\u003cref name=Nahm\u002f\u003e In the same year, [[Eugene Cremmer]], [[Bernard Julia]], and [[Jo\u00ebl Scherk]] of the [[\u00c9cole Normale Sup\u00e9rieure]] showed that supergravity not only permits up to eleven dimensions but is in fact most elegant in this maximal number of dimensions.\u003cref name=Cremmer\u002f\u003e\u003cref name=\"Duff 1998, p. 65\"\u003e[[#Duff1998|Duff]], p. 65\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Initially, many physicists hoped that by compactifying [[eleven-dimensional supergravity]], it might be possible to construct realistic models of our four-dimensional world. The hope was that such models would provide a unified description of the four fundamental forces of nature: electromagnetism, the [[strong nuclear force|strong]] and [[weak nuclear force]]s, and gravity. Interest in eleven-dimensional supergravity soon waned as various flaws in this scheme were discovered. One of the problems was that the laws of physics appear to distinguish between clockwise and counterclockwise, a phenomenon known as [[chirality (physics)|chirality]]. Edward Witten and others observed this chirality property cannot be readily derived by compactifying from eleven dimensions.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e+Initially, many physicists hoped that by compactifying eleven-dimensional supergravity, it might be possible to construct realistic models of our four-dimensional world. The hope was that such models would provide a unified description of the four fundamental forces of nature: electromagnetism, the [[strong nuclear force|strong]] and [[weak nuclear force]]s, and gravity. Interest in eleven-dimensional supergravity soon waned as various flaws in this scheme were discovered. One of the problems was that the laws of physics appear to distinguish between clockwise and counterclockwise, a phenomenon known as [[chirality (physics)|chirality]]. Edward Witten and others observed this chirality property cannot be readily derived by compactifying from eleven dimensions.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e In the [[first superstring revolution]] in 1984, many physicists turned to string theory as a unified theory of particle physics and quantum gravity. Unlike supergravity theory, string theory was able to accommodate the chirality of the standard model, and it provided a theory of gravity consistent with quantum effects.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e Another feature of string theory that many physicists were drawn to in the 1980s and 1990s was its high degree of uniqueness. In ordinary particle theories, one can consider any collection of elementary particles whose classical behavior is described by an arbitrary [[Lagrangian (field theory)|Lagrangian]]. In string theory, the possibilities are much more constrained: by the 1990s, physicists had argued that there were only five consistent supersymmetric versions of the theory.\u003cref name=\"Duff 1998, p. 65\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -108,11 +108,12 @@\u003cbr\u003e \u003cbr\u003e At around the same time, as many physicists were studying the properties of strings, a small group of physicists were examining the possible applications of higher dimensional objects. In 1987, Eric Bergshoeff, Ergin Sezgin, and Paul Townsend showed that eleven-dimensional supergravity includes two-dimensional branes.\u003cref name=Bergshoeff\u002f\u003e Intuitively, these objects look like sheets or membranes propagating through the eleven-dimensional spacetime. Shortly after this discovery, [[Michael Duff (physicist)|Michael Duff]], Paul Howe, Takeo Inami, and Kellogg Stelle considered a particular compactification of eleven-dimensional supergravity with one of the dimensions curled up into a circle.\u003cref name=Duff1987\u002f\u003e In this setting, one can imagine the membrane wrapping around the circular dimension. If the radius of the circle is sufficiently small, then this membrane looks just like a string in ten-dimensional spacetime. Duff and his collaborators showed that this construction reproduces exactly the strings appearing in type IIA superstring theory.\u003cref\u003e[[#Duff1998|Duff]], p. 66\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher-dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e+Speaking at a string theory conference in 1995, Edward Witten made the surprising suggestion that all five superstring theories were in fact just different limiting cases of a single theory in eleven spacetime dimensions. Witten's announcement drew together all of the previous results on S- and T-duality and the appearance of higher dimensional branes in string theory.\u003cref name=Witten1995\u002f\u003e In the months following Witten's announcement, hundreds of new papers appeared on the Internet confirming different parts of his proposal.\u003cref\u003e[[#Duff1998|Duff]], pp. 67\u201368\u003c\u002fref\u003e Today this flurry of work is known as the second superstring revolution.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 296\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Initially, some physicists suggested that the new theory was a fundamental theory of membranes, but Witten was skeptical of the role of membranes in the theory. In a paper from 1996, Ho\u0159ava and Witten wrote \"As it has been proposed that the eleven-dimensional theory is a supermembrane theory but there are some reasons to doubt that interpretation, we will non-committally call it the M-theory, leaving to the future the relation of M to membranes.\"\u003cref name=Horava\u002f\u003e In the absence of an understanding of the true meaning and structure of M-theory, Witten has suggested that the ''M'' should stand for \"magic\", \"mystery\", or \"membrane\" according to taste, and the true meaning of the title should be decided when a more fundamental formulation of the theory is known.\u003cref name=Duff1996\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Matrix theory ===\u003cbr\u003e+===Matrix theory===\u003cbr\u003e+\u003cbr\u003e {{main|Matrix theory (physics)}}\u003cbr\u003e \u003cbr\u003e In mathematics, a [[matrix (mathematics)|matrix]] is a rectangular array of numbers or other data. In physics, a [[matrix theory (physics)|matrix model]] is a particular kind of physical theory whose mathematical formulation involves the notion of a matrix in an important way. A matrix model describes the behavior of a set of matrices within the framework of quantum mechanics.\u003cref name=Banks\u002f\u003e\u003cbr\u003e@@ -121,35 +122,37 @@\u003cbr\u003e \u003cbr\u003e The development of the matrix model formulation of M-theory has led physicists to consider various connections between string theory and a branch of mathematics called [[noncommutative geometry]]. This subject is a generalization of ordinary geometry in which mathematicians define new geometric notions using tools from [[noncommutative algebra]].\u003cref name=Connes\u002f\u003e In a paper from 1998, [[Alain Connes]], [[Michael R. Douglas]], and [[Albert Schwarz]] showed that some aspects of matrix models and M-theory are described by a [[noncommutative quantum field theory]], a special kind of physical theory in which spacetime is described mathematically using noncommutative geometry.\u003cref name=CDS\u002f\u003e This established a link between matrix models and M-theory on the one hand, and noncommutative geometry on the other hand. It quickly led to the discovery of other important links between noncommutative geometry and various physical theories.\u003cref name=Nekrasov\u002f\u003e\u003cref name=SW\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== Black holes ==\u003cbr\u003e+==Black holes==\u003cbr\u003e \u003cbr\u003e In general relativity, a black hole is defined as a region of spacetime in which the gravitational field is so strong that no particle or radiation can escape. In the currently accepted models of stellar evolution, black holes are thought to arise when massive stars undergo [[gravitational collapse]], and many [[galaxies]] are thought to contain [[supermassive black hole]]s at their centers. Black holes are also important for theoretical reasons, as they present profound challenges for theorists attempting to understand the quantum aspects of gravity. String theory has proved to be an important tool for investigating the theoretical properties of black holes because it provides a framework in which theorists can study their [[black hole thermodynamics|thermodynamics]].\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Bekenstein\u2013Hawking formula ===\u003cbr\u003e+===Bekenstein\u2013Hawking formula===\u003cbr\u003e \u003cbr\u003e In the branch of physics called [[statistical mechanics]], [[entropy]] is a measure of the randomness or disorder of a physical system. This concept was studied in the 1870s by the Austrian physicist [[Ludwig Boltzmann]], who showed that the [[thermodynamics|thermodynamic]] properties of a [[gas]] could be derived from the combined properties of its many constituent [[molecule]]s. Boltzmann argued that by averaging the behaviors of all the different molecules in a gas, one can understand macroscopic properties such as volume, temperature, and pressure. In addition, this perspective led him to give a precise definition of entropy as the [[natural logarithm]] of the number of different states of the molecules (also called ''microstates'') that give rise to the same macroscopic features.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 187\u2013188\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation may escape its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e-: \u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e-\u003cbr\u003e-where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is the [[Boltzmann constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e+In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation is lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e+\u003cbr\u003e+:\u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e+\u003cbr\u003e+where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is [[Boltzmann's constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Like any physical system, a black hole has an entropy defined in terms of the number of different microstates that lead to the same macroscopic features. The Bekenstein\u2013Hawking entropy formula gives the expected value of the entropy of a black hole, but by the 1990s, physicists still lacked a derivation of this formula by counting microstates in a theory of quantum gravity. Finding such a derivation of this formula was considered an important test of the viability of any theory of quantum gravity such as string theory.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 189\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Derivation within string theory ===\u003cbr\u003e-\u003cbr\u003e-In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Bekenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e+===Derivation within string theory===\u003cbr\u003e+\u003cbr\u003e+In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Beckenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e \u003cbr\u003e The black holes that Strominger and Vafa considered in their original work were quite different from real astrophysical black holes. One difference was that Strominger and Vafa considered only [[extremal black hole]]s in order to make the calculation tractable. These are defined as black holes with the lowest possible mass compatible with a given charge.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 192\u2013193\u003c\u002fref\u003e Strominger and Vafa also restricted attention to black holes in five-dimensional spacetime with unphysical supersymmetry.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 194\u2013195\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Although it was originally developed in this very particular and physically unrealistic context in string theory, the entropy calculation of Strominger and Vafa has led to a qualitative understanding of how black hole entropy can be accounted for in any theory of quantum gravity. Indeed, in 1998, Strominger argued that the original result could be generalized to an arbitrary consistent theory of quantum gravity without relying on strings or supersymmetry.\u003cref name=Strominger1998\u002f\u003e In collaboration with several other authors in 2010, he showed that some results on black hole entropy could be extended to non-extremal astrophysical black holes.\u003cref name=Guica\u002f\u003e\u003cref name=CMS\u002f\u003e\u003cbr\u003e \u003cbr\u003e-== AdS\u002fCFT correspondence ==\u003cbr\u003e+==AdS\u002fCFT correspondence==\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fCFT correspondence}}\u003cbr\u003e \u003cbr\u003e-One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result that implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |access-date=25 July 2013}}}}\u003cbr\u003e-\u003cbr\u003e-=== Overview of the correspondence ===\u003cbr\u003e+One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result which implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |access-date=25 July 2013}}}}\u003cbr\u003e+\u003cbr\u003e+===Overview of the correspondence===\u003cbr\u003e \u003cbr\u003e [[Image:Uniform tiling 433-t0 (formatted).svg|thumb|left|alt=A disk tiled by triangles and quadrilaterals which become smaller and smaller near the boundary circle.|A [[tessellation]] of the [[hyperbolic plane]] [[tritetragonal tiling|by triangles and squares]]]]\u003cbr\u003e \u003cbr\u003e@@ -157,13 +160,13 @@\u003cbr\u003e \u003cbr\u003e One can imagine a stack of hyperbolic disks where each disk represents the state of the universe at a given time. The resulting geometric object is three-dimensional anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e It looks like a solid [[cylinder (geometry)|cylinder]] in which any [[cross section (geometry)|cross section]] is a copy of the hyperbolic disk. Time runs along the vertical direction in this picture. The surface of this cylinder plays an important role in the AdS\u002fCFT correspondence. As with the hyperbolic plane, anti-de Sitter space is [[curvature|curved]] in such a way that any point in the interior is actually infinitely far from this boundary surface.\u003cref name=\"Maldacena 2005, p. 61\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|upright=1.6|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e+[[File:AdS3.svg|thumb|right|alt=A cylinder formed by stacking copies of the disk illustrated in the previous figure.|350px|Three-dimensional [[anti-de Sitter space]] is like a stack of [[Poincar\u00e9 disk model|hyperbolic disks]], each one representing the state of the universe at a given time. The resulting [[spacetime]] looks like a solid [[cylinder (geometry)|cylinder]].]]\u003cbr\u003e \u003cbr\u003e This construction describes a hypothetical universe with only two space dimensions and one time dimension, but it can be generalized to any number of dimensions. Indeed, hyperbolic space can have more than two dimensions and one can \"stack up\" copies of hyperbolic space to get higher-dimensional models of anti-de Sitter space.\u003cref name=\"Maldacena 2005, p. 60\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in non-gravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e-\u003cbr\u003e-=== Applications to quantum gravity ===\u003cbr\u003e+An important feature of anti-de Sitter space is its boundary (which looks like a cylinder in the case of three-dimensional anti-de Sitter space). One property of this boundary is that, within a small region on the surface around any given point, it looks just like [[Minkowski space]], the model of spacetime used in nongravitational physics.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 552\u003c\u002fref\u003e One can therefore consider an auxiliary theory in which \"spacetime\" is given by the boundary of anti-de Sitter space. This observation is the starting point for AdS\u002fCFT correspondence, which states that the boundary of anti-de Sitter space can be regarded as the \"spacetime\" for a quantum field theory. The claim is that this quantum field theory is equivalent to a gravitational theory, such as string theory, in the bulk anti-de Sitter space in the sense that there is a \"dictionary\" for translating entities and calculations in one theory into their counterparts in the other theory. For example, a single particle in the gravitational theory might correspond to some collection of particles in the boundary theory. In addition, the predictions in the two theories are quantitatively identical so that if two particles have a 40 percent chance of colliding in the gravitational theory, then the corresponding collections in the boundary theory would also have a 40 percent chance of colliding.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], pp. 61\u201362\u003c\u002fref\u003e\u003cbr\u003e+\u003cbr\u003e+===Applications to quantum gravity===\u003cbr\u003e \u003cbr\u003e The discovery of the AdS\u002fCFT correspondence was a major advance in physicists' understanding of string theory and quantum gravity. One reason for this is that the correspondence provides a formulation of string theory in terms of quantum field theory, which is well understood by comparison. Another reason is that it provides a general framework in which physicists can study and attempt to resolve the paradoxes of black holes.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -171,51 +174,56 @@\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence resolves the black hole information paradox, at least to some extent, because it shows how a black hole can evolve in a manner consistent with quantum mechanics in some contexts. Indeed, one can consider black holes in the context of the AdS\u002fCFT correspondence, and any such black hole corresponds to a configuration of particles on the boundary of anti-de Sitter space.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 554\u003c\u002fref\u003e These particles obey the usual rules of quantum mechanics and in particular evolve in a unitary fashion, so the black hole must also evolve in a unitary fashion, respecting the principles of quantum mechanics.\u003cref\u003e[[#Maldacena2005|Maldacena 2005]], p. 63\u003c\u002fref\u003e In 2005, Hawking announced that the paradox had been settled in favor of information conservation by the AdS\u002fCFT correspondence, and he suggested a concrete mechanism by which black holes might preserve information.\u003cref name=Hawking2005\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Applications to nuclear physics ===\u003cbr\u003e+===Applications to nuclear physics===\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fQCD correspondence}}\u003cbr\u003e \u003cbr\u003e [[File:Meissner effect p1390048.jpg|thumb|left|alt=A magnet levitating over a superconducting material.|A [[magnet]] [[Meissner effect|levitating]] above a [[high-temperature superconductor]]. Today some physicists are working to understand high-temperature superconductivity using the AdS\u002fCFT correspondence.\u003cref name=\"Merali 2011\"\u002f\u003e]]\u003cbr\u003e \u003cbr\u003e In addition to its applications to theoretical problems in quantum gravity, the AdS\u002fCFT correspondence has been applied to a variety of problems in quantum field theory. One physical system that has been studied using the AdS\u002fCFT correspondence is the [[quark\u2013gluon plasma]], an exotic [[state of matter]] produced in [[particle accelerator]]s. This state of matter arises for brief instants when heavy [[ions]] such as [[gold]] or [[lead]] nuclei are collided at high energies. Such collisions cause the [[quarks]] that make up atomic nuclei to [[deconfinement|deconfine]] at temperatures of approximately two [[1,000,000,000,000|trillion]] [[kelvin]], conditions similar to those present at around {{math|10\u003csup\u003e\u221211\u003c\u002fsup\u003e}} seconds after the [[Big Bang]].\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 559\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark-gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark-gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark-gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark-gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-=== Applications to condensed matter physics ===\u003cbr\u003e+The physics of the quark\u2013gluon plasma is governed by a theory called [[quantum chromodynamics]], but this theory is mathematically intractable in problems involving the quark\u2013gluon plasma.{{efn|More precisely, one cannot apply the methods of perturbative quantum field theory.}} In an article appearing in 2005, [[\u0110\u00e0m Thanh S\u01a1n]] and his collaborators showed that the AdS\u002fCFT correspondence could be used to understand some aspects of the quark\u2013gluon plasma by describing it in the language of string theory.\u003cref name=\"Kovtun, Son, and Starinets 2001\"\u002f\u003e By applying the AdS\u002fCFT correspondence, S\u01a1n and his collaborators were able to describe the quark gluon plasma in terms of black holes in five-dimensional spacetime. The calculation showed that the ratio of two quantities associated with the quark\u2013gluon plasma, the [[shear viscosity]] and volume density of entropy, should be approximately equal to a certain universal [[constant (mathematics)|constant]]. In 2008, the predicted value of this ratio for the quark\u2013gluon plasma was confirmed at the [[Relativistic Heavy Ion Collider]] at [[Brookhaven National Laboratory]].\u003cref name=\"Merali 2011\"\u002f\u003e\u003cref name=Luzum\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+===Applications to condensed matter physics===\u003cbr\u003e+\u003cbr\u003e {{main|AdS\u002fCMT correspondence}}\u003cbr\u003e \u003cbr\u003e The AdS\u002fCFT correspondence has also been used to study aspects of condensed matter physics. Over the decades, [[experimental physics|experimental]] condensed matter physicists have discovered a number of exotic states of matter, including [[superconductors]] and [[superfluids]]. These states are described using the formalism of quantum field theory, but some phenomena are difficult to explain using standard field theoretic techniques. Some condensed matter theorists including [[Subir Sachdev]] hope that the AdS\u002fCFT correspondence will make it possible to describe these systems in the language of string theory and learn more about their behavior.\u003cref name=\"Merali 2011\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on the [[Planck constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e-\u003cbr\u003e-== Phenomenology ==\u003cbr\u003e+So far some success has been achieved in using string theory methods to describe the transition of a superfluid to an [[insulator (electricity)|insulator]]. A superfluid is a system of [[electrically neutral]] [[atoms]] that flows without any [[friction]]. Such systems are often produced in the laboratory using [[liquid helium]], but recently experimentalists have developed new ways of producing artificial superfluids by pouring trillions of cold atoms into a lattice of criss-crossing [[lasers]]. These atoms initially behave as a superfluid, but as experimentalists increase the intensity of the lasers, they become less mobile and then suddenly transition to an insulating state. During the transition, the atoms behave in an unusual way. For example, the atoms slow to a halt at a rate that depends on the [[temperature]] and on [[Planck's constant]], the fundamental parameter of quantum mechanics, which does not enter into the description of the other [[phase (matter)|phases]]. This behavior has recently been understood by considering a dual description where properties of the fluid are described in terms of a higher dimensional black hole.\u003cref name=Sachdev\u002f\u003e\u003cbr\u003e+\u003cbr\u003e+==Phenomenology==\u003cbr\u003e+\u003cbr\u003e {{main|String phenomenology}}\u003cbr\u003e \u003cbr\u003e-In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real-world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e+In addition to being an idea of considerable theoretical interest, string theory provides a framework for constructing models of real world physics that combine general relativity and particle physics. [[Phenomenology (particle physics)|Phenomenology]] is the branch of theoretical physics in which physicists construct realistic models of nature from more abstract theoretical ideas. [[String phenomenology]] is the part of string theory that attempts to construct realistic or semi-realistic models based on string theory.\u003cbr\u003e \u003cbr\u003e Partly because of theoretical and mathematical difficulties and partly because of the extremely high energies needed to test these theories experimentally, there is so far no experimental evidence that would unambiguously point to any of these models being a correct fundamental description of nature. This has led some in the community to criticize these approaches to unification and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-=== Particle physics ===\u003cbr\u003e+===Particle physics===\u003cbr\u003e \u003cbr\u003e The currently accepted theory describing elementary particles and their interactions is known as the [[standard model of particle physics]]. This theory provides a unified description of three of the fundamental forces of nature: electromagnetism and the strong and weak nuclear forces. Despite its remarkable success in explaining a wide range of physical phenomena, the standard model cannot be a complete description of reality. This is because the standard model fails to incorporate the force of gravity and because of problems such as the [[hierarchy problem]] and the inability to explain the structure of fermion masses or dark matter.\u003cbr\u003e \u003cbr\u003e String theory has been used to construct a variety of models of particle physics going beyond the standard model. Typically, such models are based on the idea of compactification. Starting with the ten- or eleven-dimensional spacetime of string or M-theory, physicists postulate a shape for the extra dimensions. By choosing this shape appropriately, they can construct models roughly similar to the standard model of particle physics, together with additional undiscovered particles.\u003cref name=Candelas1985\u002f\u003e One popular way of deriving realistic physics from string theory is to start with the heterotic theory in ten dimensions and assume that the six extra dimensions of spacetime are shaped like a six-dimensional Calabi\u2013Yau manifold. Such compactifications offer many ways of extracting realistic physics from string theory. Other similar methods can be used to construct realistic or semi-realistic models of our four-dimensional world based on M-theory.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 147\u2013150\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-=== Cosmology ===\u003cbr\u003e+===Cosmology===\u003cbr\u003e+\u003cbr\u003e {{main|String cosmology}}\u003cbr\u003e \u003cbr\u003e-[[File:WMAP 2012.png|thumb|upright=1.4|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e-\u003cbr\u003e-The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be the same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\u003c\u002fref\u003e\u003cbr\u003e+[[File:Ilc 9yr moll4096.png|thumb|right|300px|A map of the [[cosmic microwave background]] produced by the [[Wilkinson Microwave Anisotropy Probe]]]]\u003cbr\u003e+\u003cbr\u003e+The Big Bang theory is the prevailing [[physical cosmology|cosmological]] model for the universe from the earliest known periods through its subsequent large-scale evolution. Despite its success in explaining many observed features of the universe including galactic [[redshift]]s, the relative abundance of light elements such as [[hydrogen]] and [[helium]], and the existence of a [[cosmic microwave background]], there are several questions that remain unanswered. For example, the standard Big Bang model does not explain why the universe appears to be same in all directions, why it appears flat on very large distance scales, or why certain hypothesized particles such as [[magnetic monopoles]] are not observed in experiments.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 530\u2013531\
