003cbr\u003e String theory was originally developed during the late 1960s and early 1970s as a never completely successful theory of [[hadron]]s, the [[subatomic particle]]s like the [[proton]] and [[neutron]] that feel the [[strong interaction]]. In the 1960s, [[Geoffrey Chew]] and [[Steven Frautschi]] discovered that the [[meson]]s make families called [[Regge trajectories]] with masses related to spins in a way that was later understood by [[Yoichiro Nambu]], [[Holger Bech Nielsen]] and [[Leonard Susskind]] to be the relationship expected from rotating strings. Chew advocated making a theory for the interactions of these trajectories that did not presume that they were composed of any fundamental particles, but would construct their interactions from [[bootstrap model|self-consistency conditions]] on the [[S-matrix]]. The [[S-matrix theory|S-matrix approach]] was started by [[Werner Heisenberg]] in the 1940s as a way of constructing a theory that did not rely on the local notions of space and time, which Heisenberg believed break down at the nuclear scale. While the scale was off by many orders of magnitude, the approach he advocated was ideally suited for a theory of quantum gravity.\u003cbr\u003e \u003cbr\u003e-Working with experimental data, R. Dolen, D. Horn and C. Schmid developed some sum rules for hadron exchange. When a particle and [[antiparticle]] scatter, virtual particles can be exchanged in two qualitatively different ways. In the s-channel, the two particles annihilate to make temporary intermediate states that fall apart into the final state particles. In the t-channel, the particles exchange intermediate states by emission and absorption. In field theory, the two contributions add together, one giving a continuous background contribution, the other giving peaks at certain energies. In the data, it was clear that the peaks were stealing from the background\u2014the authors interpreted this as saying that the t-channel contribution was dual to the s-channel one, meaning both described the whole amplitude and included the other.\u003cbr\u003e+Working with experimental data, R. Dolen, D. Horn and C. Schmid developed some sum rules for [[hadron]] exchange. When a particle and [[antiparticle]] scatter, virtual particles can be exchanged in two qualitatively different ways. In the s-channel, the two particles annihilate to make temporary intermediate states that fall apart into the final state particles. In the t-channel, the particles exchange intermediate states by emission and absorption. In field theory, the two contributions add together, one giving a continuous background contribution, the other giving peaks at certain energies. In the data, it was clear that the peaks were stealing from the background\u2014the authors interpreted this as saying that the t-channel contribution was dual to the s-channel one, meaning both described the whole amplitude and included the other.\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e ","--- Revision 67\u003cbr\u003e+++ Revision 68\u003cbr\u003e@@ -272,7 +272,7 @@\u003cbr\u003e \u003cbr\u003e String theory was originally developed during the late 1960s and early 1970s as a never completely successful theory of [[hadron]]s, the [[subatomic particle]]s like the [[proton]] and [[neutron]] that feel the [[strong interaction]]. In the 1960s, [[Geoffrey Chew]] and [[Steven Frautschi]] discovered that the [[meson]]s make families called [[Regge trajectories]] with masses related to spins in a way that was later understood by [[Yoichiro Nambu]], [[Holger Bech Nielsen]] and [[Leonard Susskind]] to be the relationship expected from rotating strings. Chew advocated making a theory for the interactions of these trajectories that did not presume that they were composed of any fundamental particles, but would construct their interactions from [[bootstrap model|self-consistency conditions]] on the [[S-matrix]]. The [[S-matrix theory|S-matrix approach]] was started by [[Werner Heisenberg]] in the 1940s as a way of constructing a theory that did not rely on the local notions of space and time, which Heisenberg believed break down at the nuclear scale. While the scale was off by many orders of magnitude, the approach he advocated was ideally suited for a theory of quantum gravity.\u003cbr\u003e \u003cbr\u003e-Working with experimental data, R. Dolen, D. Horn and C. Schmid developed some sum rules for [[hadron]] exchange. When a particle and [[antiparticle]] scatter, virtual particles can be exchanged in two qualitatively different ways. In the s-channel, the two particles annihilate to make temporary intermediate states that fall apart into the final state particles. In the t-channel, the particles exchange intermediate states by emission and absorption. In field theory, the two contributions add together, one giving a continuous background contribution, the other giving peaks at certain energies. In the data, it was clear that the peaks were stealing from the background\u2014the authors interpreted this as saying that the t-channel contribution was dual to the s-channel one, meaning both described the whole amplitude and included the other.\u003cbr\u003e+Working with experimental data, R. Dolen, D. Horn and C. Schmid developed some sum rules for hadron exchange. When a particle and [[antiparticle]] scatter, virtual particles can be exchanged in two qualitatively different ways. In the s-channel, the two particles annihilate to make temporary intermediate states that fall apart into the final state particles. In the t-channel, the particles exchange intermediate states by emission and absorption. In field theory, the two contributions add together, one giving a continuous background contribution, the other giving peaks at certain energies. In the data, it was clear that the peaks were stealing from the background\u2014the authors interpreted this as saying that the t-channel contribution was dual to the s-channel one, meaning both described the whole amplitude and included the other.\u003cbr\u003e \u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e ","--- Revision 68\u003cbr\u003e+++ Revision 69\u003cbr\u003e@@ -267,6 +267,7 @@\u003cbr\u003e ===Early results===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e+[[File:Brian Greene, February 28, 2014 (cropped).jpg|thumb|[[Brian Greene]]]]\u003cbr\u003e \u003cbr\u003e [[File:LeonardSusskindStanford2009 cropped.jpg|left|thumb|upright|[[Leonard Susskind]]]]\u003cbr\u003e \u003cbr\u003e@@ -277,6 +278,8 @@\u003cbr\u003e [[File:GabrieleVeneziano.jpg|right|thumb|upright|[[Gabriele Veneziano]]]]\u003cbr\u003e \u003cbr\u003e The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e+\u003cbr\u003e+One of the most important scientists was Brian Greene, he is specialized profoundly in string theory and got recognised into scientific community.\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e ","--- Revision 69\u003cbr\u003e+++ Revision 70\u003cbr\u003e@@ -267,7 +267,7 @@\u003cbr\u003e ===Early results===\u003cbr\u003e \u003cbr\u003e Some of the structures reintroduced by string theory arose for the first time much earlier as part of the program of classical unification started by [[Albert Einstein]]. The first person to add a [[Five-dimensional space|fifth dimension]] to a theory of gravity was [[Gunnar Nordstr\u00f6m]] in 1914, who noted that gravity in five dimensions describes both gravity and electromagnetism in four. Nordstr\u00f6m attempted to unify electromagnetism with [[Nordstr\u00f6m's theory of gravitation|his theory of gravitation]], which was however superseded by Einstein's general relativity in 1919. Thereafter, German mathematician [[Theodor Kaluza]] combined the fifth dimension with [[general relativity]], and only Kaluza is usually credited with the idea. In 1926, the Swedish physicist [[Oskar Klein]] gave [[Kaluza\u2013Klein theory|a physical interpretation]] of the unobservable extra dimension\u2014it is wrapped into a small circle. Einstein introduced a [[Antisymmetric tensor|non-symmetric]] [[metric tensor]], while much later Brans and Dicke added a scalar component to gravity. These ideas would be revived within string theory, where they are demanded by consistency conditions.\u003cbr\u003e-[[File:Brian Greene, February 28, 2014 (cropped).jpg|thumb|[[Brian Greene]]]]\u003cbr\u003e+[[File:Brian Greene, February 28, 2014 (cropped).jpg|thumb|[[Brian Greene]]|244x244px]]\u003cbr\u003e \u003cbr\u003e [[File:LeonardSusskindStanford2009 cropped.jpg|left|thumb|upright|[[Leonard Susskind]]]]\u003cbr\u003e \u003cbr\u003e@@ -279,7 +279,7 @@\u003cbr\u003e \u003cbr\u003e The result was widely advertised by [[Murray Gell-Mann]], leading [[Gabriele Veneziano]] to construct a [[Veneziano scattering amplitude|scattering amplitude]] that had the property of Dolen\u2013Horn\u2013Schmid duality, later renamed world-sheet duality. The amplitude needed poles where the particles appear, on straight-line trajectories, and there is a special mathematical function whose poles are evenly spaced on half the real line\u2014the [[gamma function]]\u2014 which was widely used in Regge theory. By manipulating combinations of gamma functions, Veneziano was able to find a consistent scattering amplitude with poles on straight lines, with mostly positive residues, which obeyed duality and had the appropriate Regge scaling at high energy. The amplitude could fit near-beam scattering data as well as other Regge type fits and had a suggestive integral representation that could be used for generalization.\u003cbr\u003e \u003cbr\u003e-One of the most important scientists was Brian Greene, he is specialized profoundly in string theory and got recognised into scientific community.\u003cbr\u003e+One of the most important scientists was Brian Greene, he is specialized profoundly in string theory and got recognised into scientific community.\u003cref\u003e{{Cite web |title=String Theorist Brian Greene Wants to Help You Understand the Cold, Cruel Universe |url=https:\u002f\u002ftime.com\u002f5787436\u002fbrian-greene-string-theory-universe\u002f}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Over the next years, hundreds of physicists worked to complete the [[Bootstrap model|bootstrap program]] for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found  for this model, with many surprises. Veneziano himself discovered that for the scattering amplitude to describe the scattering of a particle that appears in the theory, an obvious self-consistency condition, the lightest particle must be a [[tachyon]]. [[Miguel \u00c1ngel Virasoro (physicist)|Miguel Virasoro]] and Joel Shapiro found a different amplitude now understood to be that of closed strings, while [[Ziro Koba]] and [[Holger Bech Nielsen|Holger Nielsen]] generalized Veneziano's integral representation to multiparticle scattering. Veneziano and [[Sergio Fubini]] introduced an operator formalism for computing the scattering amplitudes that was a forerunner of [[world-sheet conformal theory]], while Virasoro understood how to remove the poles with wrong-sign residues using a constraint on the states. [[Claud Lovelace]] calculated a loop amplitude, and noted that there is an inconsistency unless the dimension of the theory is 26. [[Charles Thorn]], [[Peter Goddard (physicist)|Peter Goddard]] and [[Richard Brower]] went on to prove that there are no wrong-sign propagating states in dimensions less than or equal to 26.\u003cbr\u003e ","--- Revision 71\u003cbr\u003e+++ Revision 72\u003cbr\u003e@@ -11,7 +11,7 @@\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification. \u003cref\u003e{{Cite web |title=String Theorist Brian Greene Wants to Help You Understand the Cold, Cruel Universe |url=https:\u002f\u002ftime.com\u002f5787436\u002fbrian-greene-string-theory-universe\u002f}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e == Fundamentals==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]","--- Revision 72\u003cbr\u003e+++ Revision 73\u003cbr\u003e@@ -11,7 +11,7 @@\u003cbr\u003e \u003cbr\u003e String theory was first studied in the late 1960s as a theory of the [[strong nuclear force]], before being abandoned in favor of [[quantum chromodynamics]]. Subsequently, it was realized that the very properties that made string theory unsuitable as a theory of nuclear physics made it a promising candidate for a quantum theory of gravity. The earliest version of string theory, [[bosonic string theory]], incorporated only the class of [[particle]]s known as [[boson]]s. It later developed into [[superstring theory]], which posits a connection called [[supersymmetry]] between bosons and the class of particles called [[fermion]]s. Five consistent versions of superstring theory were developed before it was conjectured in the mid-1990s that they were all different limiting cases of a single theory in 11 dimensions known as [[M-theory]]. In late 1997, theorists discovered an important relationship called the [[anti-de Sitter\u002fconformal field theory correspondence]] (AdS\u002fCFT correspondence), which relates string theory to another type of physical theory called a [[quantum field theory]].\u003cbr\u003e \u003cbr\u003e-One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification. \u003cref\u003e{{Cite web |title=String Theorist Brian Greene Wants to Help You Understand the Cold, Cruel Universe |url=https:\u002f\u002ftime.com\u002f5787436\u002fbrian-greene-string-theory-universe\u002f}}\u003c\u002fref\u003e\u003cbr\u003e+One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e \u003cbr\u003e == Fundamentals==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]","--- Revision 73\u003cbr\u003e+++ Revision 74\u003cbr\u003e@@ -15,7 +15,7 @@\u003cbr\u003e \u003cbr\u003e == Fundamentals==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]\u003cbr\u003e-\u003cbr\u003e+=== Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e@@ -87,6 +87,7 @@\u003cbr\u003e In string theory, [[D-brane]]s are an important class of branes that arise when one considers open strings. As an open string propagates through spacetime, its endpoints are required to lie on a D-brane. The letter \"D\" in D-brane refers to a certain mathematical condition on the system known as the [[Dirichlet boundary condition]]. The study of D-branes in string theory has led to important results such as the AdS\u002fCFT correspondence, which has shed light on many problems in quantum field theory.\u003cref name=\"Moore 2005, p. 214\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e+\u003cbr\u003e \u003cbr\u003e ==M-theory==\u003cbr\u003e ","--- Revision 74\u003cbr\u003e+++ Revision 75\u003cbr\u003e@@ -534,7 +534,6 @@\u003cbr\u003e [[Category:Concepts in physics]]\u003cbr\u003e [[Category:Dimension]]\u003cbr\u003e [[Category:Multi-dimensional geometry]]\u003cbr\u003e-[[Category:Particle physics]]\u003cbr\u003e [[Category:Physical cosmology]]\u003cbr\u003e [[Category:Physics beyond the Standard Model]]\u003cbr\u003e [[Category:Theoretical physics]]","--- Revision 75\u003cbr\u003e+++ Revision 76\u003cbr\u003e@@ -482,7 +482,7 @@\u003cbr\u003e ===Bibliography===\u003cbr\u003e \u003cbr\u003e {{refbegin|30em}}\u003cbr\u003e-* {{cite book|ref=Becker |last1=Becker |first1=Katrin |last2=Becker |first2=Melanie |last3=Schwarz |first3=John |title=String theory and M-theory: A modern introduction |date=2007 |publisher=Cambridge University Press |isbn=978-0-521-86069-7}}\u003cbr\u003e+* {{cite book|ref=Becker |last1=Becker |first1=Katrin |last2=Becker |first2=Melanie |author-link2=Melanie Becker|last3=Schwarz |first3=John |title=String theory and M-theory: A modern introduction |date=2007 |publisher=Cambridge University Press |isbn=978-0-521-86069-7}}\u003cbr\u003e * {{cite journal |ref=Duff1998|last1=Duff |first1=Michael |date=1998 |title=The theory formerly known as strings |journal=Scientific American |volume=278 |issue=2 |pages=64\u20139 |doi=10.1038\u002fscientificamerican0298-64|bibcode = 1998SciAm.278b..64D }}\u003cbr\u003e * {{cite book |ref=Gannon|last1=Gannon |first1=Terry |title=Moonshine Beyond the Monster: The Bridge Connecting Algebra, Modular Forms, and Physics |publisher=Cambridge University Press}}\u003cbr\u003e * {{c tructure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e@@ -88,7 +88,6 @@\u003cbr\u003e \u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e \u003cbr\u003e-\u003cbr\u003e ==M-theory==\u003cbr\u003e \u003cbr\u003e {{main|M-theory}}\u003cbr\u003e@@ -327,7 +326,7 @@\u003cbr\u003e String theorist Leonard Susskind has argued that string theory provides a natural anthropic explanation of the small value of the cosmological constant.\u003cref name=Susskind2005\u002f\u003e According to Susskind, the different vacuum states of string theory might be realized as different universes within a larger [[multiverse]]. The fact that the observed universe has a small cosmological constant is just a tautological consequence of the fact that a small value is required for life to exist.\u003cref\u003e[[#Woit|Woit]], pp. 242\u2013243\u003c\u002fref\u003e Many prominent theorists and critics have disagreed with Susskind's conclusions.\u003cref\u003e[[#Woit|Woit]], p. 240\u003c\u002fref\u003e According to Woit, \"in this case [anthropic reasoning] is nothing more than an excuse for failure. Speculative scientific ideas fail not just when they make incorrect predictions, but also when they turn out to be vacuous and incapable of predicting anything.\"\u003cref\u003e[[#Woit|Woit]], p. 249\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Compatibility with dark energy===\u003cbr\u003e-It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]]. \u003cbr\u003e+It remains unknown whether string theory is compatible with a metastable, positive [[cosmological constant]].\u003cbr\u003e Some putative examples of such solutions do exist, such as the model described by Kachru ''et al''. in 2003.\u003cref\u003e{{cite journal |last1=Kachru |first1=Shamit |last2=Kallosh |first2=Renata |last3=Linde |first3=Andrei |last4=Trivedi |first4=Sandip P. |title=de Sitter Vacua in String Theory |journal=[[Phys. Rev. D]] |date=2003 |volume=68 |issue=4 |page=046005 |doi=10.1103\u002fPhysRevD.68.046005 |arxiv=hep-th\u002f0301240 |bibcode=2003PhRvD..68d6005K |s2cid=119482182 }}\u003c\u002fref\u003e In 2018, a group of four physicists advanced a controversial conjecture which would imply that [[Swampland (physics)|no such universe exists]]. This is contrary to some popular models of [[dark energy]] such as [[Lambda-CDM model|\u039b-CDM]], which requires a positive vacuum energy. However, string theory is likely compatible with certain types of [[quintessence (physics)|quintessence]], where dark energy is caused by a new field with exotic properties.\u003cref\u003e{{cite web |last1=Wolchover |first1=Natalie |title=Dark Energy May Be Incompatible With String Theory |url=https:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |website=[[Quanta Magazine]] |publisher=Simons Foundation |access-date=2 April 2020 |date=9 August 2018 |archive-date=15 November 2020 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210807\u002fhttps:\u002f\u002fwww.quantamagazine.org\u002fdark-energy-may-be-incompatible-with-string-theory-20180809\u002f |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Background independence===\u003cbr\u003e@@ -342,7 +341,7 @@\u003cbr\u003e \u003cbr\u003e {{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e \u003cbr\u003e-Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field \u003cbr\u003e+Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field\u003cbr\u003e to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Sociology of science===\u003cbr\u003e@@ -359,7 +358,7 @@\u003cbr\u003e \u003cbr\u003e Smolin goes on to offer a number of prescriptions for how scientists might encourage a greater diversity of approaches to quantum gravity research.\u003cref\u003e[[#Smolin|Smolin]], Ch. 20\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==Notes ==\u003cbr\u003e+==Notes==\u003cbr\u003e \u003cbr\u003e {{notelist}}\u003cbr\u003e {{reflist|group=note}}\u003cbr\u003e@@ -522,13 +521,13 @@\u003cbr\u003e {{Commons category}}\u003cbr\u003e {{Wikiquote}}\u003cbr\u003e '''Websites'''\u003cbr\u003e-*[http:\u002f\u002fwww.math.columbia.edu\u002f~woit\u002fblog\u002f Not Even Wrong]\u2014A blog critical of string theory\u003cbr\u003e-*[http:\u002f\u002fsuperstringtheory.com\u002f The Official String Theory Web Site]\u003cbr\u003e-*[http:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e+* [http:\u002f\u002fwww.math.columbia.edu\u002f~woit\u002fblog\u002f Not Even Wrong]\u2014A blog critical of string theory\u003cbr\u003e+* [http:\u002f\u002fsuperstringtheory.com\u002f The Official String Theory Web Site]\u003cbr\u003e+* [http:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e \u003cbr\u003e '''Video'''\u003cbr\u003e-*[http:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e-*[https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni] \u2014 2003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e+* [http:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e+* [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni] \u2014 2003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}\u003cbr\u003e {{Industrial and applied mathematics}}","--- Revision 79\u003cbr\u003e+++ Revision 80\u003cbr\u003e@@ -33,7 +33,7 @@\u003cbr\u003e ===Strings===\u003cbr\u003e {{main|String (physics)}}\u003cbr\u003e \u003cbr\u003e-[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory.]]\u003cbr\u003e+[[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e \u003cbr\u003e The application of quantum mechanics to physical objects such as the [[electromagnetic field]], which are extended in space and time, is known as [[quantum field theory]]. In particle physics, quantum field theories form the basis for our understanding of elementary particles, which are modeled as excitations in the fundamental fields.\u003cref name=\"Zee 2010\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -78,7 +78,7 @@\u003cbr\u003e \u003cbr\u003e === Branes ===\u003cbr\u003e {{main|Brane}}\u003cbr\u003e-[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s.]]\u003cbr\u003e+[[File:D3-brane et D2-brane.PNG|thumb|right|alt=A pair of surfaces joined by wavy line segments.|Open strings attached to a pair of [[D-brane]]s]]\u003cbr\u003e \u003cbr\u003e In string theory and other related theories, a [[brane]] is a physical object that generalizes the notion of a point particle to higher dimensions. For instance, a point particle can be viewed as a brane of dimension zero, while a string can be viewed as a brane of dimension one. It is also possible to consider higher-dimensional branes. In dimension ''p'', these are called ''p''-branes. The word brane comes from the word \"membrane\" which refers to a two-dimensional brane.\u003cref name=\"Moore 2005, p. 214\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -308,7 +308,7 @@\u003cbr\u003e \u003cbr\u003e During this period, [[Tom Banks (physicist)|Tom Banks]], [[Willy Fischler]], [[Stephen Shenker]] and [[Leonard Susskind]] formulated matrix theory, a full holographic description of M-theory using IIA D0 branes.\u003cref name=Banks\u002f\u003e This was the first definition of string theory that was fully non-perturbative and a concrete mathematical realization of the [[holographic principle]]. It is an example of a gauge-gravity duality and is now understood to be a special case of the [[AdS\u002fCFT correspondence]]. [[Andrew Strominger]] and [[Cumrun Vafa]] calculated the entropy of certain configurations of D-branes and found agreement with the semi-classical answer for extreme charged black holes.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e [[Petr Ho\u0159ava (theorist)|Petr Ho\u0159ava]] and Witten found the eleven-dimensional formulation of the heterotic string theories, showing that orbifolds solve the chirality problem. Witten noted that the effective description of the physics of D-branes at low energies is by a supersymmetric gauge theory, and found geometrical interpretations of mathematical structures in gauge theory that he and [[Nathan Seiberg]] had earlier discovered in terms of the location of the branes.\u003cbr\u003e \u003cbr\u003e-In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by [[Edward Witten]],\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e+In 1997, [[Juan Maldacena]] noted that the low energy excitations of a theory near a black hole consist of objects close to the horizon, which for extreme charged black holes looks like an [[anti-de Sitter space]].\u003cref name=Maldacena1998\u002f\u003e He noted that in this limit the gauge theory describes the string excitations near the branes. So he hypothesized that string theory on a near-horizon extreme-charged black-hole geometry, an anti-de Sitter space times a sphere with flux, is equally well described by the low-energy limiting [[gauge theory]], the [[N = 4 supersymmetric Yang\u2013Mills theory]]. This hypothesis, which is called the [[AdS\u002fCFT correspondence]], was further developed by [[Steven Gubser]], [[Igor Klebanov]] and [[Alexander Markovich Polyakov|Alexander Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten,\u003cref name=Witten1998\u002f\u003e and it is now well-accepted. It is a concrete realization of the [[holographic principle]], which has far-reaching implications for [[black hole]]s, [[Principle of locality|locality]] and [[information]] in physics, as well as the nature of the gravitational interaction.\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e Through this relationship, string theory has been shown to be related to gauge theories like [[quantum chromodynamics]] and this has led to a more quantitative understanding of the behavior of [[hadron]]s, bringing string theory back to its roots.{{Citation needed|reason=see talk on source 84|date=June 2018}}\u003cbr\u003e \u003cbr\u003e ==Criticism==\u003cbr\u003e \u003cbr\u003e@@ -339,10 +339,9 @@\u003cbr\u003e \u003cbr\u003e Others have disagreed with Smolin's characterization of string theory. In a review of Smolin's book, string theorist Joseph Polchinski writes\u003cbr\u003e \u003cbr\u003e-{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them\u2026 In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e-\u003cbr\u003e-Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field\u003cbr\u003e-to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\"\u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e+{{quote|[Smolin] is mistaking an aspect of the mathematical language being used for one of the physics being described. New physical theories are often discovered using a mathematical language that is not the most suitable for them... In string theory, it has always been clear that the physics is background-independent even if the language being used is not, and the search for a more suitable language continues. Indeed, as Smolin belatedly notes, [AdS\u002fCFT] provides a solution to this problem, one that is unexpected and powerful.\u003cref name=\"Polchinski 2007\"\u002f\u003e}}\u003cbr\u003e+\u003cbr\u003e+Polchinski notes that an important open problem in quantum gravity is to develop holographic descriptions of gravity which do not require the gravitational field to be asymptotically anti-de Sitter.\u003cref name=\"Polchinski 2007\" \u002f\u003e Smolin has responded by saying that the AdS\u002fCFT correspondence, as it is currently understood, may not be strong enough to resolve all concerns about background independence.\u003cref\u003e{{cite web|url=http:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |title=Response to review of The Trouble with Physics by Joe Polchinski|access-date=December 31, 2015 |url-status=dead |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20151105234427\u002fhttp:\u002f\u002fwww.kitp.ucsb.edu\u002fjoep\u002flinks\u002fon-some-criticisms-of-string-theory\u002flee-smolins-response |archive-date=November 5, 2015 |author=Smolin, Lee |date=April 2007|publisher=kitp.ucsb.edu}}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e ===Sociology of science===\u003cbr\u003e \u003cbr\u003e@@ -523,10 +522,10 @@\u003cbr\u003e '''Websites'''\u003cbr\u003e * [http:\u002f\u002fwww.math.columbia.edu\u002f~woit\u002fblog\u002f Not Even Wrong]\u2014A blog critical of string theory\u003cbr\u003e * [http:\u002f\u002fsuperstringtheory.com\u002f The Official String Theory Web Site]\u003cbr\u003e-* [http:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e+* [https:\u002f\u002fwhystringtheory.com\u002f Why String Theory]\u2014An introduction to string theory.\u003cbr\u003e \u003cbr\u003e '''Video'''\u003cbr\u003e-* [http:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e+* [https:\u002f\u002fwww.bbc.co.uk\u002fscience\u002fhorizon\u002f2001\u002fparalleluni.shtml bbc-horizon: parallel-uni] \u2014 2002 feature documentary by [[Horizon (British TV series)|BBC Horizon]], episode [[Parallel Universes (film)|Parallel Universes]] focus on history and emergence of M-theory, and scientists involved.\u003cbr\u003e * [https:\u002f\u002fwww.pbs.org\u002fwgbh\u002fnova\u002fphysics\u002felegant-universe.html pbs.org-nova: elegant-uni] \u2014 2003 [[Emmy Award]]-winning, three-hour miniseries by [[Nova (American TV program)|Nova]] with [[Brian Greene]], adapted from his [[The Elegant Universe]] (original [[PBS]] broadcast dates: October 28, 8\u201310 p.m. and November 4, 8\u20139 p.m., 2003).\u003cbr\u003e \u003cbr\u003e {{String theory topics |state=collapsed}}","--- Revision 80\u003cbr\u003e+++ Revision 81\u003cbr\u003e@@ -18,7 +18,7 @@\u003cbr\u003e === Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e+In spite of these successes, there are still many problems that remain to be solved. One of the deepest problems in modern physics is the problem of [[quantum gravity]].\u003cref name=\"Becker, Becker 2007, p. 1\"\u002f\u003e The general theory of relativity is formulated within the framework of [[classical physics]], whereas the other [[fundamental interaction|fundamental forces]] are described within the framework of quantum mechanics. A quantum theory of gravity is needed in order to reconcile general relativity with the principles of quantum mechanics, but difficulties arise{{Clarify|reason=What difficulties?|date=June 2023}} when one attempts to apply the usual prescriptions of quantum theory to the force of gravity.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 6\u003c\u002fref\u003e In addition to the problem of developing a consistent theory of quantum gravity, there are many other fundamental problems in the physics of [[atomic nucleus|atomic nuclei]], [[black hole]]s, and the early universe.{{efn|For example, physicists are still working to understand the phenomenon of [[quark confinement]], the paradoxes of [[black holes]], and the origin of [[dark energy]].}}\u003cbr\u003e \u003cbr\u003e String theory is a [[mathematical theory|theoretical framework]] that attempts to address these questions and many others. The starting point for string theory is the idea that the [[point particle|point-like particles]] of [[particle physics]] can also be modeled as one-dimensional objects called [[string (physics)|strings]]. String theory describes how strings propagate through space and interact with each other. In a given version of string theory, there is only one kind of string, which may look like a small loop or segment of ordinary string, and it can vibrate in different ways. On distance scales larger than the string scale, a string will look just like an ordinary particle, with its [[mass]], [[charge (physics)|charge]], and other properties determined by the vibrational state of the string. In this way, all of the different elementary particles may be viewed as [[vibrating strings]]. In string theory, one of the vibrational states of the string gives rise to the [[graviton]], a quantum mechanical particle that carries gravitational force. Thus string theory is a theory of quantum gravity.\u003cref name=\"Becker, Becker 2007, pp. 2\"\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 2\u20133\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -55,7 +55,7 @@\u003cbr\u003e \u003cbr\u003e In spite of the fact that the Universe is well described by 4D spacetime, there are several reasons why physicists consider theories in other dimensions. In some cases, by modeling spacetime in a different number of dimensions, a theory becomes more mathematically tractable, and one can perform calculations and gain general insights more easily.{{efn|For example, in the context of the [[AdS\u002fCFT correspondence]], theorists often formulate and study theories of gravity in unphysical numbers of spacetime dimensions.}} There are also situations where theories in two or three spacetime dimensions are useful for describing phenomena in condensed matter physics.\u003cref name=\"Zee 2010\"\u002f\u003e Finally, there exist scenarios in which there could actually be more than 4D of spacetime which have nonetheless managed to escape detection.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 9\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-String theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e+String theories require [[extra dimensions]] of spacetime for their mathematical consistency.{{Clarify|reason=What are some examples of these mathematics?|date=June 2023}} In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Image:Calabi yau.jpg|left|thumb|alt=Visualization of a complex mathematical surface with many convolutions and self intersections.|A cross section of a quintic [[Calabi\u2013Yau manifold]] ]]\u003cbr\u003e ","--- Revision 81\u003cbr\u003e+++ Revision 82\u003cbr\u003e@@ -55,7 +55,7 @@\u003cbr\u003e \u003cbr\u003e In spite of the fact that the Universe is well described by 4D spacetime, there are several reasons why physicists consider theories in other dimensions. In some cases, by modeling spacetime in a different number of dimensions, a theory becomes more mathematically tractable, and one can perform calculations and gain general insights more easily.{{efn|For example, in the context of the [[AdS\u002fCFT correspondence]], theorists often formulate and study theories of gravity in unphysical numbers of spacetime dimensions.}} There are also situations where theories in two or three spacetime dimensions are useful for describing phenomena in condensed matter physics.\u003cref name=\"Zee 2010\"\u002f\u003e Finally, there exist scenarios in which there could actually be more than 4D of spacetime which have nonetheless managed to escape detection.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 9\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-String theories require [[extra dimensions]] of spacetime for their mathematical consistency.{{Clarify|reason=What are some examples of these mathematics?|date=June 2023}} In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e+String theories require [[extra dimensions]] of spacetime for their mathematical consistency. In bosonic string theory, spacetime is 26-dimensional, while in superstring theory it is 10-dimensional, and in [[M-theory]] it is 11-dimensional. In order to describe real physical phenomena using string theory, one must therefore imagine scenarios in which these extra dimensions would not be observed in experiments.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 8\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e [[Image:Calabi yau.jpg|left|thumb|alt=Visualization of a complex mathematical surface with many convolutions and self intersections.|A cross section of a quintic [[Calabi\u2013Yau manifold]] ]]\u003cbr\u003e ","--- Revision 82\u003cbr\u003e+++ Revision 83\u003cbr\u003e@@ -393,7 +393,7 @@\u003cbr\u003e \u003cbr\u003e \u003cref name=DGO\u003e{{Cite journal|last1=Duncan |first1=John |last2=Griffin |first2=Michael |last3=Ono |first3=Ken |date=2015 |title=Proof of the Umbral Moonshine Conjecture |journal=Research in the Mathematical Sciences |volume=2 |page=26 |arxiv=1503.01472 |bibcode=2015arXiv150301472D |doi=10.1186\u002fs40687-015-0044-7 |s2cid=43589605 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003cref name=Duff1987\u003e{{cite journal |last1=Duff |first1=Michael |last2=Howe |first2=Paul |last3=Inami |first3=Takeo |last4=Stelle |first4=Kellogg |date=1987 |title=Superstrings in {{math|''D''{{=}}10}} from supermembranes in {{math|''D''{{=}}11}} |journal=Nuclear Physics B |volume=191 |issue=1 |pages=70\u201374 |doi=10.1016\u002f0370-2693(87)91323-2 |bibcode=1987PhLB..191...70D |url=http:\u002f\u002fcds.cern.ch\u002frecord\u002f175621\u002ffiles\u002f198704121.pdf |access-date=2019-08-25 |archive-date=2020-11-15 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210732\u002fhttp:\u002f\u002fcds.cern.ch\u002frecord\u002f175621\u002ffiles\u002f198704121.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=Duff1987\u003e{{cite journal |last1=Duff |first1=Michael |last2=Howe |first2=Paul |last3=Inami |first3=Takeo |last4=Stelle |first4=Kellogg |date=1987 |title=Superstrings in {{math|''D''{{=}}10}} from supermembranes in {{math|''D''{{=}}11}} |journal=Nuclear Physics B |volume=191 |issue=1 |pages=70\u201374 |doi=10.1016\u002f0370-2693(87)91323-2 |bibcode=1987PhLB..191...70D |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f175621\u002ffiles\u002f198704121.pdf |access-date=2019-08-25 |archive-date=2020-11-15 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20201115210732\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f175621\u002ffiles\u002f198704121.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cref name=Duff1996\u003e{{cite journal |last1=Duff |first1=Michael |date=1996 |title=M-theory (the theory formerly known as strings) |journal=International Journal of Modern Physics A |volume=11 |issue=32 |pages=6523\u201341 (Sec. 1)|bibcode=1996IJMPA..11.5623D |doi=10.1142\u002fS0217751X96002583 |arxiv = hep-th\u002f9608117 |s2cid=17432791 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Dummit\u003e{{cite book |last1=Dummit |first1=David |last2=Foote |first2=Richard |title=Abstract Algebra |date=2004 |publisher=Wiley |isbn=978-0-471-43334-7|pages=102\u2013103}}\u003c\u002fref\u003e\u003cbr\u003e@@ -446,7 +446,7 @@\u003cbr\u003e \u003cbr\u003e \u003cref name=MSW\u003e{{cite journal |last1=Maldacena |first1=Juan |last2=Strominger |first2=Andrew |last3=Witten |first3=Edward |date=1997 |title=Black hole entropy in M-theory |journal=Journal of High Energy Physics |volume=1997 |issue=12 |doi=10.1088\u002f1126-6708\u002f1997\u002f12\u002f002|arxiv = hep-th\u002f9711053 |bibcode = 1997JHEP...12..002M |pages=002|s2cid=14980680 }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-\u003cref name=Nahm\u003e{{cite journal |last1=Nahm |first1=Walter |date=1978 |title=Supersymmetries and their representations |journal=Nuclear Physics B |volume=135 |issue=1 |pages=149\u2013166 |bibcode=1978NuPhB.135..149N |doi=10.1016\u002f0550-3213(78)90218-3 |url=http:\u002f\u002fcds.cern.ch\u002frecord\u002f132743\u002ffiles\u002f197709213.pdf |access-date=2019-08-25 |archive-date=2018-07-26 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180726120154\u002fhttp:\u002f\u002fcds.cern.ch\u002frecord\u002f132743\u002ffiles\u002f197709213.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e+\u003cref name=Nahm\u003e{{cite journal |last1=Nahm |first1=Walter |date=1978 |title=Supersymmetries and their representations |journal=Nuclear Physics B |volume=135 |issue=1 |pages=149\u2013166 |bibcode=1978NuPhB.135..149N |doi=10.1016\u002f0550-3213(78)90218-3 |url=https:\u002f\u002fcds.cern.ch\u002frecord\u002f132743\u002ffiles\u002f197709213.pdf |access-date=2019-08-25 |archive-date=2018-07-26 |archive-url=https:\u002f\u002fweb.archive.org\u002fweb\u002f20180726120154\u002fhttps:\u002f\u002fcds.cern.ch\u002frecord\u002f132743\u002ffiles\u002f197709213.pdf |url-status=live }}\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e \u003cref name=Nekrasov\u003e{{cite journal |last1=Nekrasov |first1=Nikita |last2=Schwarz |first2=Albert |date=1998 |title=Instantons on noncommutative {{math|'''R'''\u003csup\u003e4\u003c\u002fsup\u003e}} and (2,0) superconformal six dimensional theory |journal=Communications in Mathematical Physics |volume=198 |issue=3 |pages=689\u2013703 |doi=10.1007\u002fs002200050490|bibcode=1998CMaPh.198..689N |arxiv = hep-th\u002f9802068 |s2cid=14125789 }}\u003c\u002fref\u003e\u003cbr\u003e ","--- Revision 83\u003cbr\u003e+++ Revision 84\u003cbr\u003e@@ -13,8 +13,9 @@\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. Another issue is that the theory is thought to describe an enormous [[string landscape|landscape]] of possible universes, which has complicated efforts to develop theories of particle physics based on string theory. These issues have led some in the community to criticize these approaches to physics, and to question the value of continued research on string theory unification.\u003cbr\u003e \u003cbr\u003e-==Fundamentals==\u003cbr\u003e+== Fundamentals ==\u003cbr\u003e [[Image:Open and closed strings.svg|right|thumb|alt=A wavy open segment and closed loop of string.|The fundamental objects of string theory are open and closed [[string (physics)|strings]].]]\u003cbr\u003e+\u003cbr\u003e === Overview ===\u003cbr\u003e In the 20th century, two theoretical frameworks emerged for formulating the laws of physics. The first is [[Albert Einstein]]'s [[general theory of relativity]], a theory that explains the force of [[gravity]] and the structure of [[spacetime]] at the macro-level. The other is [[quantum mechanics]], a completely different formulation, which uses known [[probability]] principles to describe physical phenomena at the micro-level. By the late 1970s, these two frameworks had proven to be sufficient to explain most of the observed features of the [[universe]], from [[elementary particle]]s to [[atom]]s to the evolution of stars and the universe as a whole.\u003cref name=\"Becker, Becker 2007, p. 1\"\u003e[[#Becker|Becker, Becker and Schwarz]], p. 1\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e@@ -30,7 +31,7 @@\u003cbr\u003e \u003cbr\u003e One of the challenges of string theory is that the full theory does not have a satisfactory definition in all circumstances. The scattering of strings is most straightforwardly defined using the techniques of [[perturbation theory (quantum mechanics)|perturbation theory]], but it is not known in general how to define string theory [[Non-perturbative|nonperturbatively]].\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], p. 8\u003c\u002fref\u003e It is also not clear whether there is any principle by which string theory selects its [[vacuum state]], the physical state that determines the properties of our universe.\u003cref\u003e[[#Becker|Becker, Becker and Schwarz]], pp. 13\u201314\u003c\u002fref\u003e These problems have led some in the community to criticize these approaches to the unification of physics and question the value of continued research on these problems.\u003cref name=\"Woit 2006\"\u003e[[#Woit|Woit]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Strings===\u003cbr\u003e+=== Strings ===\u003cbr\u003e {{main|String (physics)}}\u003cbr\u003e \u003cbr\u003e [[Image:World lines and world sheet.svg|left|thumb|250px|Interaction in the quantum world: [[worldline]]s of point-like [[particles]] or a [[worldsheet]] swept up by closed [[string (physics)|strings]] in string theory]]\u003cbr\u003e@@ -47,7 +48,7 @@\u003cbr\u003e \u003cbr\u003e There are several versions of superstring theory: [[type I string|type I]], [[type IIA string|type IIA]], [[type IIB string|type IIB]], and two flavors of [[heterotic string]] theory ({{math|[[special orthogonal group|''SO''(32)]]}} and {{math|[[E8 (mathematics)|''E''\u003csub\u003e8\u003c\u002fsub\u003e\u00d7''E''\u003csub\u003e8\u003c\u002fsub\u003e]]}}). The different theories allow different types of strings, and the particles that arise at low energies exhibit different [[symmetry (physics)|symmetries]]. For example, the type I theory includes both open strings (which are segments with endpoints) and closed strings (which form closed loops), while types IIA, IIB and heterotic include only closed strings.\u003cref\u003e[[#Zwiebach|Zwiebach]], p. 324\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-==={{anchor|Number of dimensions}}Extra dimensions===\u003cbr\u003e+=== Extra dimensions \u003cspan class=\"anchor\" id=\"Number of dimensions\"\u003e\u003c\u002fspan\u003e ===\u003cbr\u003e \u003cbr\u003e [[File:Compactification example.svg|right|thumb|alt=A tubular surface and corresponding one-dimensional curve.|An example of [[compactification (physics)|compactification]]: At large distances, a two dimensional surface with one circular dimension looks one-dimensional.]]\u003cbr\u003e \u003cbr\u003e@@ -65,8 +66,7 @@\u003cbr\u003e \u003cbr\u003e Another approach to reducing the number of dimensions is the so-called [[brane cosmology|brane-world]] scenario. In this approach, physicists assume that the observable universe is a four-dimensional subspace of a higher dimensional space. In such models, the force-carrying bosons of particle physics arise from open strings with endpoints attached to the four-dimensional subspace, while gravity arises from closed strings propagating through the larger ambient space. This idea plays an important role in attempts to develop models of real-world physics based on string theory, and it provides a natural explanation for the weakness of gravity compared to the other fundamental forces.\u003cref name=Randall\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Dualities===\u003cbr\u003e-\u003cbr\u003e+=== Dualities ===\u003cbr\u003e [[File:Dualities in String Theory.svg|right|thumb|alt=A diagram indicating the relationships between M-theory and the five superstring theories.|450px|A diagram of string theory dualities. Blue edges indicate [[S-duality]]. Red edges indicate [[T-duality]].]]\u003cbr\u003e \u003cbr\u003e {{main|S-duality|T-duality}}\u003cbr\u003e@@ -88,13 +88,13 @@\u003cbr\u003e \u003cbr\u003e Branes are frequently studied from a purely mathematical point of view, and they are described as objects of certain [[category (mathematics)|categories]], such as the [[derived category]] of [[coherent sheaf|coherent sheaves]] on a [[complex algebraic variety]], or the [[Fukaya category]] of a [[symplectic manifold]].\u003cref name=\"Aspinwall et al. 2009\"\u002f\u003e The connection between the physical notion of a brane and the mathematical notion of a category has led to important mathematical insights in the fields of [[algebraic geometry|algebraic]] and [[symplectic geometry]]\u003cref name=\"Kontsevich 1995\"\u002f\u003e and [[representation theory]].\u003cref name=Kapustin\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==M-theory==\u003cbr\u003e+== M-theory ==\u003cbr\u003e \u003cbr\u003e {{main|M-theory}}\u003cbr\u003e \u003cbr\u003e Prior to 1995, theorists believed that there were five consistent versions of superstring theory (type I, type IIA, type IIB, and two versions of heterotic string theory). This understanding changed in 1995 when [[Edward Witten]] suggested that the five theories were just special limiting cases of an eleven-dimensional theory called M-theory. Witten's conjecture was based on the work of a number of other physicists, including [[Ashoke Sen]], [[Chris Hull]], [[Paul Townsend]], and [[Michael Duff (physicist)|Michael Duff]]. His announcement led to a flurry of research activity now known as the [[second superstring revolution]].\u003cref name=\"Duff 1998\"\u003e[[#Duff1998|Duff]]\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Unification of superstring theories===\u003cbr\u003e+=== Unification of superstring theories ===\u003cbr\u003e \u003cbr\u003e [[File:Limits of M-theory.svg|right|350px|thumb|alt=A star-shaped diagram with the various limits of M-theory labeled at its six vertices.|A schematic illustration of the relationship between [[M-theory]], the five [[superstring theory|superstring theories]], and eleven-dimensional [[supergravity]]. The shaded region represents a family of different physical scenarios that are possible in M-theory. In certain limiting cases corresponding to the cusps, it is natural to describe the physics using one of the six theories labeled there.]]\u003cbr\u003e \u003cbr\u003e@@ -112,8 +112,7 @@\u003cbr\u003e \u003cbr\u003e Initially, some physicists suggested that the new theory was a fundamental theory of membranes, but Witten was skeptical of the role of membranes in the theory. In a paper from 1996, Ho\u0159ava and Witten wrote \"As it has been proposed that the eleven-dimensional theory is a supermembrane theory but there are some reasons to doubt that interpretation, we will non-committally call it the M-theory, leaving to the future the relation of M to membranes.\"\u003cref name=Horava\u002f\u003e In the absence of an understanding of the true meaning and structure of M-theory, Witten has suggested that the ''M'' should stand for \"magic\", \"mystery\", or \"membrane\" according to taste, and the true meaning of the title should be decided when a more fundamental formulation of the theory is known.\u003cref name=Duff1996\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Matrix theory===\u003cbr\u003e-\u003cbr\u003e+=== Matrix theory ===\u003cbr\u003e {{main|Matrix theory (physics)}}\u003cbr\u003e \u003cbr\u003e In mathematics, a [[matrix (mathematics)|matrix]] is a rectangular array of numbers or other data. In physics, a [[matrix theory (physics)|matrix model]] is a particular kind of physical theory whose mathematical formulation involves the notion of a matrix in an important way. A matrix model describes the behavior of a set of matrices within the framework of quantum mechanics.\u003cref name=Banks\u002f\u003e\u003cbr\u003e@@ -122,23 +121,22 @@\u003cbr\u003e \u003cbr\u003e The development of the matrix model formulation of M-theory has led physicists to consider various connections between string theory and a branch of mathematics called [[noncommutative geometry]]. This subject is a generalization of ordinary geometry in which mathematicians define new geometric notions using tools from [[noncommutative algebra]].\u003cref name=Connes\u002f\u003e In a paper from 1998, [[Alain Connes]], [[Michael R. Douglas]], and [[Albert Schwarz]] showed that some aspects of matrix models and M-theory are described by a [[noncommutative quantum field theory]], a special kind of physical theory in which spacetime is described mathematically using noncommutative geometry.\u003cref name=CDS\u002f\u003e This established a link between matrix models and M-theory on the one hand, and noncommutative geometry on the other hand. It quickly led to the discovery of other important links between noncommutative geometry and various physical theories.\u003cref name=Nekrasov\u002f\u003e\u003cref name=SW\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==Black holes==\u003cbr\u003e+== Black holes ==\u003cbr\u003e \u003cbr\u003e In general relativity, a black hole is defined as a region of spacetime in which the gravitational field is so strong that no particle or radiation can escape. In the currently accepted models of stellar evolution, black holes are thought to arise when massive stars undergo [[gravitational collapse]], and many [[galaxies]] are thought to contain [[supermassive black hole]]s at their centers. Black holes are also important for theoretical reasons, as they present profound challenges for theorists attempting to understand the quantum aspects of gravity. String theory has proved to be an important tool for investigating the theoretical properties of black holes because it provides a framework in which theorists can study their [[black hole thermodynamics|thermodynamics]].\u003cref name=\"de Haro et al. 2013, p.2\"\u002f\u003e\u003cbr\u003e \u003cbr\u003e-===Bekenstein\u2013Hawking formula===\u003cbr\u003e+=== Bekenstein\u2013Hawking formula ===\u003cbr\u003e \u003cbr\u003e In the branch of physics called [[statistical mechanics]], [[entropy]] is a measure of the randomness or disorder of a physical system. This concept was studied in the 1870s by the Austrian physicist [[Ludwig Boltzmann]], who showed that the [[thermodynamics|thermodynamic]] properties of a [[gas]] could be derived from the combined properties of its many constituent [[molecule]]s. Boltzmann argued that by averaging the behaviors of all the different molecules in a gas, one can understand macroscopic properties such as volume, temperature, and pressure. In addition, this perspective led him to give a precise definition of entropy as the [[natural logarithm]] of the number of different states of the molecules (also called ''microstates'') that give rise to the same macroscopic features.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 187\u2013188\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e In the twentieth century, physicists began to apply the same concepts to black holes. In most systems such as gases, the entropy scales with the volume. In the 1970s, the physicist [[Jacob Bekenstein]] suggested that the entropy of a black hole is instead proportional to the ''surface area'' of its [[event horizon]], the boundary beyond which matter and radiation are lost to its gravitational attraction.\u003cref name=Bekenstein\u002f\u003e When combined with ideas of the physicist [[Stephen Hawking]],\u003cref name=Hawking1975\u002f\u003e Bekenstein's work yielded a precise formula for the entropy of a black hole. The [[Bekenstein\u2013Hawking formula]] expresses the entropy {{math|''S''}} as\u003cbr\u003e-\u003cbr\u003e-:\u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e-\u003cbr\u003e-where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is [[Boltzmann's constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e+: \u003cmath\u003eS= \\frac{c^3kA}{4\\hbar G}\u003c\u002fmath\u003e\u003cbr\u003e+\u003cbr\u003e+where {{math|''c''}} is the [[speed of light]], {{math|''k''}} is the [[Boltzmann constant]], {{math|''\u0127''}} is the [[reduced Planck constant]], {{math|''G''}} is [[Newton's constant]], and {{math|''A''}} is the surface area of the event horizon.\u003cref\u003e[[#Wald|Wald]], p. 417\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e Like any physical system, a black hole has an entropy defined in terms of the number of different microstates that lead to the same macroscopic features. The Bekenstein\u2013Hawking entropy formula gives the expected value of the entropy of a black hole, but by the 1990s, physicists still lacked a derivation of this formula by counting microstates in a theory of quantum gravity. Finding such a derivation of this formula was considered an important test of the viability of any theory of quantum gravity such as string theory.\u003cref\u003e[[#Yau|Yau and Nadis]], p. 189\u003c\u002fref\u003e\u003cbr\u003e \u003cbr\u003e-===Derivation within string theory===\u003cbr\u003e+=== Derivation within string theory ===\u003cbr\u003e \u003cbr\u003e In a paper from 1996, [[Andrew Strominger]] and [[Cumrun Vafa]] showed how to derive the Beckenstein\u2013Hawking formula for certain black holes in string theory.\u003cref name=\"Strominger and Vafa 1996\"\u002f\u003e Their calculation was based on the observation that D-branes\u2014which look like fluctuating membranes when they are weakly interacting\u2014become dense, massive objects with event horizons when the interactions are strong. In other words, a system of strongly interacting D-branes in string theory is indistinguishable from a black hole. Strominger and Vafa analyzed such D-brane systems and calculated the number of different ways of placing D-branes in spacetime so that their combined mass and charge is equal to a given mass and charge for the resulting black hole. Their calculation reproduced the Bekenstein\u2013Hawking formula exactly, including the factor of {{math|1\u002f4}}.\u003cref\u003e[[#Yau|Yau and Nadis]], pp. 190\u2013192\u003c\u002fref\u003e Subsequent work by Strominger, Vafa, and others refined the original calculations and gave the precise values of the \"quantum corrections\" needed to describe very small black holes.\u003cref name=MSW\u002f\u003e\u003cref name=OST\u002f\u003e\u003cbr\u003e \u003cbr\u003e@@ -146,13 +144,12 @@\u003cbr\u003e \u003cbr\u003e Although it was originally developed in this very particular and physically unrealistic context in string theory, the entropy calculation of Strominger and Vafa has led to a qualitative understanding of how black hole entropy can be accounted for in any theory of quantum gravity. Indeed, in 1998, Strominger argued that the original result could be generalized to an arbitrary consistent theory of quantum gravity without relying on strings or supersymmetry.\u003cref name=Strominger1998\u002f\u003e In collaboration with several other authors in 2010, he showed that some results on black hole entropy could be extended to non-extremal astrophysical black holes.\u003cref name=Guica\u002f\u003e\u003cref name=CMS\u002f\u003e\u003cbr\u003e \u003cbr\u003e-==AdS\u002fCFT correspondence==\u003cbr\u003e-\u003cbr\u003e+== AdS\u002fCFT correspondence ==\u003cbr\u003e {{main|AdS\u002fCFT correspondence}}\u003cbr\u003e \u003cbr\u003e One approach to formulating string theory and studying its properties is provided by the anti-de Sitter\u002fconformal field theory (AdS\u002fCFT) correspondence. This is a theoretical result which implies that string theory is in some cases equivalent to a quantum field theory. In addition to providing insights into the mathematical structure of string theory, the AdS\u002fCFT correspondence has shed light on many aspects of quantum field theory in regimes where traditional calculational techniques are ineffective.\u003cref name=\"Klebanov and Maldacena 2009\"\u002f\u003e The AdS\u002fCFT correspondence was first proposed by [[Juan Maldacena]] in late 1997.\u003cref name=Maldacena1998\u002f\u003e Important aspects of the correspondence were elaborated in articles by [[Steven Gubser]], [[Igor Klebanov]], and [[Alexander Markovich Polyakov]],\u003cref name=Gubser\u002f\u003e and by Edward Witten.\u003cref name=Witten1998\u002f\u003e By 2010, Maldacena's article had over 7000 citations, becoming the most highly cited article in the field of [[high energy physics]].{{efn|{{cite web |url=http:\u002f\u002fwww.slac.stanford.edu\u002fspires\u002ftopcites\u002f2010\u002feprints\u002fto_hep-th_annual.shtml |title=Top Cited Articles during 2010 in hep-th |author=\u003c!--Staff writer(s); no by-line.--\u003e |access-date=25 July 2013}}}}\u003cbr\u003e \u003cbr\u003e-===Overview of the correspondence===\u003cbr\u003e+=== Overview of the correspondence ===\u003cbr\u003e \u003cbr\u003e [[Image:Uniform tiling 433-t0 (formatted).svg|thumb|left|alt=A disk tiled by triangles and quadrilaterals which become smaller and smaller near the boundary circle.
